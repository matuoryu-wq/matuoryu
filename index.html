<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>相続計算ツール</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --navy:#1a2744;
  --navy-dark:#0f1a33;
  --navy-light:#2d4170;
  --accent:#3a6bc4;
  --accent-light:#e8eef8;
  --accent-border:#b0c4e8;
  --success:#2d6a4f;
  --success-light:#eaf4f0;
  --warning:#7a5c00;
  --warning-light:#fdf8e8;
  --border:#d0d6e2;
  --bg:#f0f2f7;
  --card:#ffffff;
  --text:#1a1f2e;
  --text-muted:#5a6479;
  --radius:10px;
  --shadow:0 1px 4px rgba(26,39,68,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,var(--navy-dark),var(--navy-light));color:#fff;padding:20px;text-align:center}
.header h1{font-size:22px;font-weight:700;letter-spacing:.05em}
.header p{font-size:12px;opacity:.75;margin-top:4px}
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:10}
.tab-btn{flex:1;padding:14px 8px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-light)}
.container{max-width:760px;margin:0 auto;padding:16px 12px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--navy);border-left:4px solid var(--accent);padding-left:10px}
.form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;align-items:center}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px}
label{font-size:13px;font-weight:600;color:var(--text-muted)}
input[type=number],select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text);background:#fff;transition:border .2s}
input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,107,196,.15)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.inline-check{display:flex;align-items:center;gap:8px;padding:4px 0}
.result-section{background:linear-gradient(135deg,var(--navy-dark),var(--navy));color:#fff;border-radius:var(--radius);padding:18px;margin-top:4px}
.result-section h3{font-size:15px;font-weight:700;margin-bottom:14px;opacity:.9}
.result-table{width:100%;border-collapse:collapse;margin-bottom:10px}
.result-table th{background:rgba(255,255,255,.12);padding:8px 10px;font-size:12px;font-weight:600;text-align:left;border-bottom:1px solid rgba(255,255,255,.2)}
.result-table td{padding:9px 10px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.08)}
.result-table tr:last-child td{border-bottom:none}
.result-table .highlight{font-weight:700;color:#ffd700}
.result-table .no-right{color:#aab;font-style:italic}
.formula{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.summary-box{background:rgba(255,255,255,.1);border-radius:8px;padding:12px;border:1px solid rgba(255,255,255,.15)}
.summary-box .label{font-size:11px;opacity:.7;margin-bottom:3px}
.summary-box .value{font-size:18px;font-weight:700;color:#ffd700}
.summary-box .sub{font-size:11px;opacity:.65;margin-top:2px}
.no-tax-msg{background:var(--success-light);border:1px solid #95c4a4;border-radius:8px;padding:14px;color:var(--success);font-weight:600;text-align:center;margin-top:8px}
.warning-note{background:var(--warning-light);border:1px solid #e8d080;border-radius:8px;padding:12px 14px;color:var(--warning);font-size:12px;margin-top:10px;line-height:1.7}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#d1fae5;color:#065f46}
.badge-gray{background:#f1f5f9;color:#475569}
.section-sub{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.sub-input-block{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:8px}
.sub-input-block .sub-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px}
@media(max-width:540px){.form-group{min-width:100%}.summary-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ─── 共通ユーティリティ ─────────────────────────────
const fmt = (n) => Math.round(n).toLocaleString('ja-JP');
const fmtMan = (n) => {
  const v = Math.round(n);
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(2).replace(/\.?0+$/, '') + '億円';
  return v.toLocaleString('ja-JP') + '万円';
};
const frac = (n, d) => d === 0 ? '0' : (n === d ? '全部' : `${n}/${d}`);
const pct = (n, d) => d === 0 ? '0%' : (n / d * 100).toFixed(2).replace(/\.?0+$/, '') + '%';

// ─── 法定相続分テーブル ─────────────────────────────
// returns [{name, share:[num,den]}, ...]
function calcLegalShares(heirs, type) {
  // type: 1=配偶者のみ, 2=配偶者+子, 3=配偶者+親, 4=配偶者+兄弟,
  //       5=子のみ, 6=親のみ, 7=兄弟のみ
  const n = heirs; // count of secondary heirs
  switch (type) {
    case 1: return [{ name: '配偶者', role: 'spouse', share: [1, 1] }];
    case 2: {
      const res = [{ name: '配偶者', role: 'spouse', share: [1, 2] }];
      for (let i = 1; i <= n; i++)
        res.push({ name: `子${n > 1 ? i : ''}`, role: 'child', share: [1, 2 * n] });
      return res;
    }
    case 3: {
      const res = [{ name: '配偶者', role: 'spouse', share: [2, 3] }];
      for (let i = 1; i <= n; i++)
        res.push({ name: `親${n > 1 ? i : ''}`, role: 'parent', share: [1, 3 * n] });
      return res;
    }
    case 4: {
      const res = [{ name: '配偶者', role: 'spouse', share: [3, 4] }];
      for (let i = 1; i <= n; i++)
        res.push({ name: `兄弟姉妹${n > 1 ? i : ''}`, role: 'sibling', share: [1, 4 * n] });
      return res;
    }
    case 5: {
      const res = [];
      for (let i = 1; i <= n; i++)
        res.push({ name: `子${n > 1 ? i : ''}`, role: 'child', share: [1, n] });
      return res;
    }
    case 6: {
      const res = [];
      for (let i = 1; i <= n; i++)
        res.push({ name: `親${n > 1 ? i : ''}`, role: 'parent', share: [1, n] });
      return res;
    }
    case 7: {
      const res = [];
      for (let i = 1; i <= n; i++)
        res.push({ name: `兄弟姉妹${n > 1 ? i : ''}`, role: 'sibling', share: [1, n] });
      return res;
    }
    default: return [];
  }
}

// 遺留分割合（遺産全体に対する）
// 直系尊属のみ → 1/3、それ以外 → 1/2
function iryubunRate(type) {
  return type === 6 ? [1, 3] : [1, 2];
}

// ─── TAB1コンポーネント ─────────────────────────────
function Tab1() {
  const [estate, setEstate] = useState('');
  const [heirType, setHeirType] = useState(2);
  const [heirCount, setHeirCount] = useState(2);

  const heirTypeLabel = {
    1: '配偶者のみ',
    2: '配偶者＋子',
    3: '配偶者＋親',
    4: '配偶者＋兄弟姉妹',
    5: '子のみ',
    6: '親のみ',
    7: '兄弟姉妹のみ',
  };

  const needsCount = heirType !== 1;
  const maxCount = [3, 6].includes(heirType) ? 2 : 5;
  const countLabel = {
    2: '子の人数', 3: '親の人数', 4: '兄弟姉妹の人数',
    5: '子の人数', 6: '親の人数', 7: '兄弟姉妹の人数',
  }[heirType] || '';

  const estateYen = (parseFloat(estate) || 0) * 10000; // 万円 → 円

  const heirs = useMemo(() => calcLegalShares(heirType === 1 ? 0 : Number(heirCount), heirType), [heirType, heirCount]);
  const [irNum, irDen] = iryubunRate(heirType);

  // 遺留分あり対象 role
  const iryubunRoles = new Set(['spouse', 'child', 'parent']);

  const results = useMemo(() => {
    return heirs.map(h => {
      const [sn, sd] = h.share;
      const amount = estateYen * sn / sd;
      const hasIryubun = iryubunRoles.has(h.role);
      const iryubunAmount = hasIryubun ? estateYen * irNum / irDen * sn / sd : null;
      return { ...h, amount, hasIryubun, iryubunAmount };
    });
  }, [heirs, estateYen, irNum, irDen]);

  return (
    <div>
      <div className="card">
        <div className="card-title">入力</div>
        <div className="form-row">
          <div className="form-group">
            <label>遺産総額（万円）</label>
            <input type="number" min="0" value={estate} onChange={e => setEstate(e.target.value)} placeholder="例: 5000" />
          </div>
          <div className="form-group">
            <label>相続人構成</label>
            <select value={heirType} onChange={e => { setHeirType(Number(e.target.value)); setHeirCount(2); }}>
              {Object.entries(heirTypeLabel).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          {needsCount && (
            <div className="form-group" style={{ minWidth: 120, maxWidth: 160 }}>
              <label>{countLabel}</label>
              <select value={heirCount} onChange={e => setHeirCount(Number(e.target.value))}>
                {Array.from({ length: maxCount }, (_, i) => i + 1).map(n => (
                  <option key={n} value={n}>{n}人</option>
                ))}
              </select>
            </div>
          )}
        </div>
        <div className="section-sub">
          ※ 民法900条の法定相続分・民法1042条の遺留分を自動計算します
        </div>
      </div>

      {estateYen > 0 && results.length > 0 && (
        <div className="result-section">
          <h3>計算結果 — {heirTypeLabel[heirType]}（遺産 {fmt(Math.round(estateYen / 10000))} 万円）</h3>

          {/* 法定相続分 */}
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, opacity: .85 }}>■ 法定相続分（民法第900条）</div>
            <table className="result-table">
              <thead>
                <tr>
                  <th>相続人</th>
                  <th>割合</th>
                  <th>相続額</th>
                  <th>計算式</th>
                </tr>
              </thead>
              <tbody>
                {results.map((r, i) => (
                  <tr key={i}>
                    <td>{r.name}</td>
                    <td className="highlight">{frac(r.share[0], r.share[1])}</td>
                    <td>{fmt(Math.round(r.amount / 10000))} 万円</td>
                    <td className="formula">{fmt(Math.round(estateYen / 10000))}万 × {r.share[0]}/{r.share[1]} = {fmt(Math.round(r.amount / 10000))}万円</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 遺留分 */}
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, opacity: .85 }}>
              ■ 遺留分（民法第1042条）— 遺産の{irNum}/{irDen}
              {heirType === 6 && <span style={{ fontSize: 11, marginLeft: 8, opacity: .7 }}>（直系尊属のみのため遺産の1/3）</span>}
              {heirType !== 6 && <span style={{ fontSize: 11, marginLeft: 8, opacity: .7 }}>（遺産の1/2）</span>}
            </div>
            <table className="result-table">
              <thead>
                <tr>
                  <th>相続人</th>
                  <th>遺留分割合</th>
                  <th>遺留分額</th>
                  <th>計算式</th>
                </tr>
              </thead>
              <tbody>
                {results.map((r, i) => (
                  <tr key={i}>
                    <td>{r.name}</td>
                    {r.hasIryubun ? (
                      <>
                        <td className="highlight">{frac(r.share[0] * irNum, r.share[1] * irDen)}</td>
                        <td>{fmt(Math.round(r.iryubunAmount / 10000))} 万円</td>
                        <td className="formula">{fmt(Math.round(estateYen / 10000))}万 × {irNum}/{irDen} × {r.share[0]}/{r.share[1]}</td>
                      </>
                    ) : (
                      <>
                        <td className="no-right" colSpan={3}>遺留分なし（兄弟姉妹には遺留分は認められません）</td>
                      </>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {!estate && (
        <div className="warning-note">
          遺産総額を入力すると計算結果が表示されます。
        </div>
      )}
    </div>
  );
}

// ─── 相続税速算表 ─────────────────────────────────
const TAX_TABLE = [
  { limit: 1000,   rate: 0.10, deduct: 0 },
  { limit: 3000,   rate: 0.15, deduct: 50 },
  { limit: 5000,   rate: 0.20, deduct: 200 },
  { limit: 10000,  rate: 0.30, deduct: 700 },
  { limit: 20000,  rate: 0.40, deduct: 1700 },
  { limit: 30000,  rate: 0.45, deduct: 2700 },
  { limit: 60000,  rate: 0.50, deduct: 4200 },
  { limit: Infinity, rate: 0.55, deduct: 7200 },
];

function calcInheritanceTax(amountMan) {
  const t = TAX_TABLE.find(t => amountMan <= t.limit);
  if (!t) return 0;
  return Math.max(0, amountMan * t.rate - t.deduct);
}

// ─── TAB2コンポーネント ─────────────────────────────
function Tab2() {
  const [estate, setEstate] = useState('');
  const [debt, setDebt] = useState('');
  const [insurance, setInsurance] = useState('');
  const [retirement, setRetirement] = useState('');
  const [heirType, setHeirType] = useState(2);
  const [heirCount, setHeirCount] = useState(2);

  // 配偶者有無・実際の相続割合
  const hasSpouse = [1, 2, 3, 4].includes(heirType);
  const [spouseActualPct, setSpouseActualPct] = useState('50');

  // 各相続人の実際の相続割合（配偶者以外）
  // 簡単のため、残りを法定相続分で均等按分
  // 子/親/兄弟の実際の相続割合は法定相続分に基づいて按分

  // 未成年控除
  const [minorEnabled, setMinorEnabled] = useState(false);
  const [minorAge, setMinorAge] = useState('');
  const [minorCount, setMinorCount] = useState(1);

  // 障害者控除
  const [disabledEnabled, setDisabledEnabled] = useState(false);
  const [disabledType, setDisabledType] = useState('general'); // 'general' | 'special'
  const [disabledAge, setDisabledAge] = useState('');
  const [disabledCount, setDisabledCount] = useState(1);

  const heirTypeLabel = {
    1: '配偶者のみ', 2: '配偶者＋子', 3: '配偶者＋親',
    4: '配偶者＋兄弟姉妹', 5: '子のみ', 6: '親のみ', 7: '兄弟姉妹のみ',
  };

  const needsCount = heirType !== 1;
  const maxCount = [3, 6].includes(heirType) ? 2 : 5;
  const countLabel = {
    2: '子の人数', 3: '親の人数', 4: '兄弟姉妹の人数',
    5: '子の人数', 6: '親の人数', 7: '兄弟姉妹の人数',
  }[heirType] || '';

  const heirs = useMemo(() => calcLegalShares(heirType === 1 ? 0 : Number(heirCount), heirType), [heirType, heirCount]);
  const legalHeirCount = heirs.length; // 法定相続人の数

  // 実際の相続割合を決定
  // 配偶者の実際の相続割合: spouseActualPct%
  // 残りを他の相続人で均等按分
  const actualShares = useMemo(() => {
    const spousePct = parseFloat(spouseActualPct) || 0;
    const nonSpouseCount = heirs.filter(h => h.role !== 'spouse').length;
    const nonSpousePctEach = nonSpouseCount > 0 ? (100 - spousePct) / nonSpouseCount : 0;
    return heirs.map(h => ({
      ...h,
      actualPct: h.role === 'spouse' ? spousePct : nonSpousePctEach,
    }));
  }, [heirs, spouseActualPct, hasSpouse]);

  const calc = useMemo(() => {
    const estateYen = (parseFloat(estate) || 0) * 10000;
    const debtYen = (parseFloat(debt) || 0) * 10000;
    const insuranceYen = (parseFloat(insurance) || 0) * 10000;
    const retirementYen = (parseFloat(retirement) || 0) * 10000;
    const n = legalHeirCount;

    if (estateYen <= 0) return null;

    // Step1: 課税価格
    const insuranceExempt = 500 * 10000 * n;
    const retirementExempt = 500 * 10000 * n;
    const insuranceTaxable = Math.max(0, insuranceYen - insuranceExempt);
    const retirementTaxable = Math.max(0, retirementYen - retirementExempt);
    const taxableBase = estateYen - debtYen + insuranceTaxable + retirementTaxable;

    // Step2: 基礎控除
    const basicDeductionYen = (3000 + 600 * n) * 10000;
    const taxableEstate = taxableBase - basicDeductionYen;

    if (taxableEstate <= 0) {
      return {
        noTax: true,
        taxableBase,
        basicDeductionYen,
        taxableEstate,
        n,
        insuranceTaxable,
        retirementTaxable,
      };
    }

    // Step3: 法定相続分で按分して合計税額計算
    const taxableEstateMan = taxableEstate / 10000;
    let totalTaxYen = 0;
    const legalAmounts = heirs.map(h => {
      const [sn, sd] = h.share;
      const amountMan = taxableEstateMan * sn / sd;
      const taxMan = calcInheritanceTax(amountMan);
      totalTaxYen += taxMan * 10000;
      return { ...h, legalAmountMan: amountMan, taxMan };
    });

    // Step4: 実際の相続割合で按分
    // Step5: 各種控除
    const minorAgeNum = parseInt(minorAge) || 0;
    const disabledAgeNum = parseInt(disabledAge) || 0;
    const minorDeductPerPerson = minorEnabled && minorAgeNum >= 0 && minorAgeNum < 18
      ? Math.max(0, 18 - minorAgeNum) * 10 * 10000
      : 0;
    const disabledDeductPerPerson = disabledEnabled && disabledAgeNum >= 0 && disabledAgeNum < 85
      ? Math.max(0, 85 - disabledAgeNum) * (disabledType === 'special' ? 20 : 10) * 10000
      : 0;

    const spouseLegalShare = heirs.find(h => h.role === 'spouse');
    const spouseLegalSharePct = spouseLegalShare
      ? spouseLegalShare.share[0] / spouseLegalShare.share[1]
      : 0;
    // 配偶者の法定相続分相当額
    const spouseLegalSharedAmount = taxableBase * spouseLegalSharePct;
    // 配偶者軽減: max(1.6億, 法定相続分相当額)
    const spouseExemptLimit = Math.max(160000000, spouseLegalSharedAmount);

    const heirResults = actualShares.map((h, idx) => {
      const rawTax = totalTaxYen * (h.actualPct / 100);
      let finalTax = rawTax;
      let notes = [];

      // 2割加算（配偶者・子・親以外）
      const is2wari = h.role === 'sibling';
      if (is2wari) {
        finalTax = finalTax * 1.2;
        notes.push('2割加算適用');
      }

      // 配偶者の税額軽減
      let spouseRelief = 0;
      if (h.role === 'spouse') {
        const spouseActualAmount = taxableBase * (h.actualPct / 100);
        const nonTaxableAmount = Math.min(spouseActualAmount, spouseExemptLimit);
        // 非課税割合
        const reliefRatio = spouseActualAmount > 0 ? Math.min(1, nonTaxableAmount / spouseActualAmount) : 0;
        spouseRelief = finalTax * reliefRatio;
        finalTax = Math.max(0, finalTax - spouseRelief);
        notes.push(`配偶者の税額軽減 -${fmt(Math.round(spouseRelief / 10000))}万円`);
      }

      // 未成年者控除
      let minorRelief = 0;
      if (minorEnabled && h.role === 'child' && minorCount > 0) {
        const perPerson = minorDeductPerPerson;
        minorRelief = perPerson * Math.min(1, minorCount / heirs.filter(x => x.role === 'child').length);
        finalTax = Math.max(0, finalTax - minorRelief);
        if (minorRelief > 0) notes.push(`未成年者控除 -${fmt(Math.round(minorRelief / 10000))}万円`);
      }

      // 障害者控除
      let disabledRelief = 0;
      if (disabledEnabled && disabledCount > 0) {
        const perPerson = disabledDeductPerPerson;
        disabledRelief = perPerson * Math.min(1, disabledCount / heirs.length);
        finalTax = Math.max(0, finalTax - disabledRelief);
        if (disabledRelief > 0) notes.push(`障害者控除 -${fmt(Math.round(disabledRelief / 10000))}万円`);
      }

      return {
        ...h,
        rawTax,
        finalTax,
        notes,
        is2wari,
        spouseRelief,
        minorRelief,
        disabledRelief,
      };
    });

    return {
      noTax: false,
      estateYen,
      debtYen,
      insuranceYen,
      retirementYen,
      insuranceTaxable,
      retirementTaxable,
      taxableBase,
      basicDeductionYen,
      taxableEstate,
      taxableEstateMan,
      totalTaxYen,
      legalAmounts,
      heirResults,
      n,
    };
  }, [estate, debt, insurance, retirement, heirs, legalHeirCount, actualShares,
      minorEnabled, minorAge, minorCount, disabledEnabled, disabledType, disabledAge, disabledCount]);

  return (
    <div>
      {/* 入力カード1 */}
      <div className="card">
        <div className="card-title">財産・債務の入力</div>
        <div className="form-row">
          <div className="form-group">
            <label>遺産総額（万円）</label>
            <input type="number" min="0" value={estate} onChange={e => setEstate(e.target.value)} placeholder="例: 10000" />
          </div>
          <div className="form-group">
            <label>債務・葬式費用（万円）</label>
            <input type="number" min="0" value={debt} onChange={e => setDebt(e.target.value)} placeholder="例: 500" />
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label>生命保険金（万円）</label>
            <input type="number" min="0" value={insurance} onChange={e => setInsurance(e.target.value)} placeholder="例: 2000" />
          </div>
          <div className="form-group">
            <label>死亡退職金（万円）</label>
            <input type="number" min="0" value={retirement} onChange={e => setRetirement(e.target.value)} placeholder="例: 1000" />
          </div>
        </div>
      </div>

      {/* 入力カード2: 相続人構成 */}
      <div className="card">
        <div className="card-title">相続人構成</div>
        <div className="form-row">
          <div className="form-group">
            <label>相続人構成</label>
            <select value={heirType} onChange={e => { setHeirType(Number(e.target.value)); setHeirCount(2); setSpouseActualPct('50'); }}>
              {Object.entries(heirTypeLabel).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          {needsCount && (
            <div className="form-group" style={{ minWidth: 130, maxWidth: 160 }}>
              <label>{countLabel}</label>
              <select value={heirCount} onChange={e => setHeirCount(Number(e.target.value))}>
                {Array.from({ length: maxCount }, (_, i) => i + 1).map(n => (
                  <option key={n} value={n}>{n}人</option>
                ))}
              </select>
            </div>
          )}
        </div>
        {hasSpouse && (
          <div className="sub-input-block">
            <div className="sub-label">配偶者の実際の相続割合（%）</div>
            <div className="form-row">
              <div className="form-group" style={{ maxWidth: 180 }}>
                <input type="number" min="0" max="100" value={spouseActualPct}
                  onChange={e => setSpouseActualPct(e.target.value)} placeholder="例: 50" />
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', alignSelf: 'center' }}>
                残り {Math.max(0, 100 - (parseFloat(spouseActualPct) || 0)).toFixed(1)}% を他の相続人で均等按分
              </div>
            </div>
          </div>
        )}
      </div>

      {/* 入力カード3: 各種控除 */}
      <div className="card">
        <div className="card-title">税額控除の設定</div>

        {/* 未成年者控除 */}
        <div className="inline-check" style={{ marginBottom: 6 }}>
          <input type="checkbox" id="minor" checked={minorEnabled} onChange={e => setMinorEnabled(e.target.checked)} />
          <label htmlFor="minor" style={{ fontSize: 14, color: 'var(--text)', fontWeight: 600, cursor: 'pointer' }}>
            未成年の相続人がいる
          </label>
        </div>
        {minorEnabled && (
          <div className="sub-input-block" style={{ marginBottom: 12 }}>
            <div className="sub-label">未成年者控除 ＝（18歳 - 相続時の年齢）× 10万円</div>
            <div className="form-row">
              <div className="form-group" style={{ maxWidth: 150 }}>
                <label>年齢（歳）</label>
                <input type="number" min="0" max="17" value={minorAge}
                  onChange={e => setMinorAge(e.target.value)} placeholder="例: 10" />
              </div>
              <div className="form-group" style={{ maxWidth: 130 }}>
                <label>人数</label>
                <select value={minorCount} onChange={e => setMinorCount(Number(e.target.value))}>
                  {[1,2,3,4,5].map(n => <option key={n} value={n}>{n}人</option>)}
                </select>
              </div>
              {minorAge && parseInt(minorAge) < 18 && (
                <div style={{ fontSize: 12, color: 'var(--text-muted)', alignSelf: 'flex-end', paddingBottom: 8 }}>
                  控除額: {fmt((18 - parseInt(minorAge)) * 10)}万円/人
                </div>
              )}
            </div>
          </div>
        )}

        {/* 障害者控除 */}
        <div className="inline-check" style={{ marginBottom: 6 }}>
          <input type="checkbox" id="disabled" checked={disabledEnabled} onChange={e => setDisabledEnabled(e.target.checked)} />
          <label htmlFor="disabled" style={{ fontSize: 14, color: 'var(--text)', fontWeight: 600, cursor: 'pointer' }}>
            障害者の相続人がいる
          </label>
        </div>
        {disabledEnabled && (
          <div className="sub-input-block">
            <div className="sub-label">障害者控除 ＝（85歳 - 相続時の年齢）× 10万円（特別障害者は×20万円）</div>
            <div className="form-row">
              <div className="form-group" style={{ maxWidth: 180 }}>
                <label>障害種別</label>
                <select value={disabledType} onChange={e => setDisabledType(e.target.value)}>
                  <option value="general">一般障害者（× 10万円）</option>
                  <option value="special">特別障害者（× 20万円）</option>
                </select>
              </div>
              <div className="form-group" style={{ maxWidth: 130 }}>
                <label>年齢（歳）</label>
                <input type="number" min="0" max="84" value={disabledAge}
                  onChange={e => setDisabledAge(e.target.value)} placeholder="例: 60" />
              </div>
              <div className="form-group" style={{ maxWidth: 100 }}>
                <label>人数</label>
                <select value={disabledCount} onChange={e => setDisabledCount(Number(e.target.value))}>
                  {[1,2,3,4,5].map(n => <option key={n} value={n}>{n}人</option>)}
                </select>
              </div>
              {disabledAge && parseInt(disabledAge) < 85 && (
                <div style={{ fontSize: 12, color: 'var(--text-muted)', alignSelf: 'flex-end', paddingBottom: 8 }}>
                  控除額: {fmt((85 - parseInt(disabledAge)) * (disabledType === 'special' ? 20 : 10))}万円/人
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      {/* 結果 */}
      {calc && (
        calc.noTax ? (
          <div>
            <div className="card">
              <div className="card-title">計算過程</div>
              <table className="result-table" style={{ color: 'var(--text)' }}>
                <tbody>
                  <tr>
                    <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>法定相続人数</td>
                    <td style={{ fontWeight: 700 }}>{calc.n}人</td>
                    <td style={{ fontSize: 11, color: 'var(--text-muted)' }}>基礎控除計算に使用</td>
                  </tr>
                  {calc.insuranceTaxable > 0 && (
                    <tr>
                      <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>生命保険 課税分</td>
                      <td>{fmt(Math.round(calc.insuranceTaxable / 10000))}万円</td>
                      <td style={{ fontSize: 11, color: 'var(--text-muted)' }}>{fmt(Math.round((parseFloat(insurance) || 0)))}万 − 500万×{calc.n}人</td>
                    </tr>
                  )}
                  {calc.retirementTaxable > 0 && (
                    <tr>
                      <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>死亡退職金 課税分</td>
                      <td>{fmt(Math.round(calc.retirementTaxable / 10000))}万円</td>
                      <td style={{ fontSize: 11, color: 'var(--text-muted)' }}>{fmt(Math.round((parseFloat(retirement) || 0)))}万 − 500万×{calc.n}人</td>
                    </tr>
                  )}
                  <tr>
                    <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>課税価格</td>
                    <td style={{ fontWeight: 700 }}>{fmt(Math.round(calc.taxableBase / 10000))}万円</td>
                    <td style={{ fontSize: 11, color: 'var(--text-muted)' }}>遺産 − 債務 + 課税保険 + 課税退職金</td>
                  </tr>
                  <tr>
                    <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>基礎控除</td>
                    <td style={{ fontWeight: 700 }}>{fmt(Math.round(calc.basicDeductionYen / 10000))}万円</td>
                    <td style={{ fontSize: 11, color: 'var(--text-muted)' }}>3,000万 + 600万 × {calc.n}人</td>
                  </tr>
                  <tr>
                    <td style={{ color: 'var(--text-muted)', fontSize: 12 }}>課税遺産総額</td>
                    <td style={{ fontWeight: 700, color: 'var(--success)' }}>{fmt(Math.round(calc.taxableEstate / 10000))}万円</td>
                    <td style={{ fontSize: 11, color: 'var(--text-muted)' }}>課税価格 − 基礎控除</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div className="no-tax-msg">
              相続税はかかりません（課税遺産総額が基礎控除以下）
            </div>
          </div>
        ) : (
          <div className="result-section">
            <h3>相続税計算結果</h3>

            {/* Step1-3サマリー */}
            <div className="summary-grid">
              <div className="summary-box">
                <div className="label">法定相続人数</div>
                <div className="value" style={{ fontSize: 24 }}>{calc.n}人</div>
                <div className="sub">基礎控除計算に使用</div>
              </div>
              <div className="summary-box">
                <div className="label">基礎控除額</div>
                <div className="value">{fmt(Math.round(calc.basicDeductionYen / 10000))}万円</div>
                <div className="sub">3,000万 + 600万×{calc.n}人</div>
              </div>
              <div className="summary-box">
                <div className="label">課税遺産総額</div>
                <div className="value">{fmt(Math.round(calc.taxableEstate / 10000))}万円</div>
                <div className="sub">課税価格 − 基礎控除</div>
              </div>
              <div className="summary-box">
                <div className="label">相続税の総額</div>
                <div className="value">{fmt(Math.round(calc.totalTaxYen / 10000))}万円</div>
                <div className="sub">法定相続分按分→速算表合計</div>
              </div>
            </div>

            {/* 計算過程 */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, opacity: .85 }}>■ Step1〜3: 課税価格・基礎控除・税額計算</div>
              <table className="result-table">
                <tbody>
                  <tr>
                    <td>遺産総額</td>
                    <td className="highlight">{fmt(Math.round(calc.estateYen / 10000))} 万円</td>
                    <td className="formula">入力値</td>
                  </tr>
                  {calc.debtYen > 0 && (
                    <tr>
                      <td>− 債務・葬式費用</td>
                      <td>▲{fmt(Math.round(calc.debtYen / 10000))} 万円</td>
                      <td className="formula">入力値</td>
                    </tr>
                  )}
                  {calc.insuranceTaxable > 0 && (
                    <tr>
                      <td>+ 生命保険金（課税分）</td>
                      <td>{fmt(Math.round(calc.insuranceTaxable / 10000))} 万円</td>
                      <td className="formula">{fmt(Math.round(calc.insuranceYen/10000))}万 − 500万×{calc.n}人 = {fmt(Math.round(calc.insuranceTaxable/10000))}万</td>
                    </tr>
                  )}
                  {calc.retirementTaxable > 0 && (
                    <tr>
                      <td>+ 死亡退職金（課税分）</td>
                      <td>{fmt(Math.round(calc.retirementTaxable / 10000))} 万円</td>
                      <td className="formula">{fmt(Math.round(calc.retirementYen/10000))}万 − 500万×{calc.n}人 = {fmt(Math.round(calc.retirementTaxable/10000))}万</td>
                    </tr>
                  )}
                  <tr>
                    <td style={{ fontWeight: 700 }}>課税価格</td>
                    <td className="highlight">{fmt(Math.round(calc.taxableBase / 10000))} 万円</td>
                    <td className="formula">遺産 − 債務 + 課税生命保険 + 課税退職金</td>
                  </tr>
                  <tr>
                    <td>− 基礎控除</td>
                    <td>▲{fmt(Math.round(calc.basicDeductionYen / 10000))} 万円</td>
                    <td className="formula">3,000万 + 600万 × {calc.n}人</td>
                  </tr>
                  <tr>
                    <td style={{ fontWeight: 700 }}>課税遺産総額</td>
                    <td className="highlight">{fmt(Math.round(calc.taxableEstate / 10000))} 万円</td>
                    <td className="formula">課税価格 − 基礎控除</td>
                  </tr>
                </tbody>
              </table>
            </div>

            {/* 法定相続分按分・速算表 */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, opacity: .85 }}>■ Step3: 法定相続分按分 → 速算表</div>
              <table className="result-table">
                <thead>
                  <tr>
                    <th>相続人</th>
                    <th>法定相続分</th>
                    <th>取得金額</th>
                    <th>税率</th>
                    <th>算出税額</th>
                  </tr>
                </thead>
                <tbody>
                  {calc.legalAmounts.map((h, i) => {
                    const t = TAX_TABLE.find(t => h.legalAmountMan <= t.limit);
                    return (
                      <tr key={i}>
                        <td>{h.name}</td>
                        <td>{frac(h.share[0], h.share[1])}</td>
                        <td>{fmt(Math.round(h.legalAmountMan))} 万円</td>
                        <td>{t ? (t.rate * 100).toFixed(0) + '%' : '-'}</td>
                        <td className="highlight">{fmt(Math.round(h.taxMan))} 万円</td>
                      </tr>
                    );
                  })}
                  <tr>
                    <td colSpan={4} style={{ fontWeight: 700 }}>相続税の総額</td>
                    <td className="highlight" style={{ fontSize: 15 }}>{fmt(Math.round(calc.totalTaxYen / 10000))} 万円</td>
                  </tr>
                </tbody>
              </table>
            </div>

            {/* 最終納付税額 */}
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, opacity: .85 }}>■ Step4〜5: 実際の相続割合で按分・各種控除後の納付税額</div>
              <table className="result-table">
                <thead>
                  <tr>
                    <th>相続人</th>
                    <th>実際の割合</th>
                    <th>按分税額</th>
                    <th>控除等</th>
                    <th>納付税額</th>
                  </tr>
                </thead>
                <tbody>
                  {calc.heirResults.map((h, i) => (
                    <tr key={i}>
                      <td>
                        {h.name}
                        {h.is2wari && <span className="badge badge-blue" style={{ marginLeft: 4 }}>2割加算</span>}
                        {h.role === 'spouse' && <span className="badge badge-green" style={{ marginLeft: 4 }}>配偶者軽減</span>}
                      </td>
                      <td>{h.actualPct.toFixed(1)}%</td>
                      <td>{fmt(Math.round(calc.totalTaxYen * h.actualPct / 100 / 10000))} 万円</td>
                      <td className="formula" style={{ fontSize: 11 }}>
                        {h.notes.length > 0 ? h.notes.join(' / ') : '−'}
                      </td>
                      <td className="highlight" style={{ fontSize: 15 }}>
                        {fmt(Math.round(h.finalTax / 10000))} 万円
                      </td>
                    </tr>
                  ))}
                  <tr>
                    <td colSpan={4} style={{ fontWeight: 700 }}>合計納付税額</td>
                    <td className="highlight" style={{ fontSize: 15 }}>
                      {fmt(Math.round(calc.heirResults.reduce((s, h) => s + h.finalTax, 0) / 10000))} 万円
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div className="warning-note" style={{ marginTop: 16, background: 'rgba(255,255,255,.08)', border: '1px solid rgba(255,255,255,.15)', color: 'rgba(255,255,255,.75)' }}>
              本計算は概算です。配偶者の税額軽減の詳細要件・相次相続控除・贈与税額控除等は反映されていません。<br />
              正確な申告は税理士にご相談ください。
            </div>
          </div>
        )
      )}
      {!estate && (
        <div className="warning-note">
          遺産総額を入力すると計算結果が表示されます。
        </div>
      )}
    </div>
  );
}

// ─── メインアプリ ──────────────────────────────────
function App() {
  const [tab, setTab] = useState(0);

  return (
    <div>
      <div className="header">
        <h1>相続計算ツール</h1>
        <p>法定相続分・遺留分 / 相続税の概算計算（民法・国税庁No.4155準拠）</p>
      </div>
      <div className="tabs">
        <button className={`tab-btn${tab === 0 ? ' active' : ''}`} onClick={() => setTab(0)}>
          ① 法定相続分・遺留分
        </button>
        <button className={`tab-btn${tab === 1 ? ' active' : ''}`} onClick={() => setTab(1)}>
          ② 相続税計算
        </button>
      </div>
      <div className="container">
        <div className={`panel${tab === 0 ? ' active' : ''}`}><Tab1 /></div>
        <div className={`panel${tab === 1 ? ' active' : ''}`}><Tab2 /></div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
