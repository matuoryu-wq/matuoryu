    en_q:'Purchased 10 shares of Company A at ¥4,000 each (¥2,000 fee, cash) and later another 10 shares at ¥4,500 each (¥2,000 fee, cash). Sold 12 of the shares held at ¥4,600 each for cash (average cost method). At year-end, the remaining 8 shares have a market value of ¥4,300. Record ①the purchases, ②the sale, and ③the year-end remeasurement.',
    e:[{d:[['売買目的有価証券',42000]], c:[['現金',42000]]}, {d:[['売買目的有価証券',47000]], c:[['現金',47000]]}, {d:[['現金',55200]], c:[['売買目的有価証券',53400],['有価証券売却益',1800]]}, {d:[['有価証券評価損',1200]], c:[['売買目的有価証券',1200]]}],
    exp:'取得・売却・決算評価をひと続きで扱う総合問題です。取得原価：①10株×4,000＋2,000＝42,000円、②10株×4,500＋2,000＝47,000円。平均単価＝(42,000＋47,000)÷20株＝＠4,450円。売却：12株×4,600＝55,200円（売却額）－12株×4,450＝53,400円（売却原価）＝有価証券売却益1,800円。期末：残り8株の帳簿価額8×4,450＝35,600円に対し、時価8×4,300＝34,400円→評価損1,200円。取得のたびに平均単価が変わっていく点に注意してください。'
  },
  { id:713, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'満期保有目的で社債（額面500,000円）を、１口100円につき＠95円で取得した（残存５年、定額法による償却原価法を適用）。２年経過後、保有目的をやめてこの社債を１口100円につき＠98円で売却した。①取得時②１年目・２年目の決算整理（償却）③売却時の仕訳を示しなさい。',
    en_q:'Acquired held-to-maturity bonds (face ¥500,000) at ¥95 per ¥100 face (5 years remaining, straight-line amortized cost method). After 2 years, sold the bonds at ¥98 per ¥100 face. Record ①the acquisition, ②both years\' amortization entries, and ③the sale.',
    e:[{d:[['満期保有目的債券',475000]], c:[['現金',475000]]}, {d:[['満期保有目的債券',5000]], c:[['有価証券利息',5000]]}, {d:[['満期保有目的債券',5000]], c:[['有価証券利息',5000]]}, {d:[['現金',490000]], c:[['満期保有目的債券',485000],['有価証券売却益',5000]]}],
    exp:'満期保有目的債券の償却→途中売却という一連の流れです。取得原価：500,000×95％＝475,000円。償却額／年：(額面500,000－取得原価475,000)÷5年＝5,000円。２年分の償却を経た帳簿価額：475,000＋5,000×2＝485,000円。売却額：500,000×98％＝490,000円。売却益：490,000－485,000＝5,000円。満期保有目的で取得した債券でも、途中で売却すれば「満期保有」の前提が崩れるため、その時点の帳簿価額と売却額の差額を売却損益として処理します。'
  },
  { id:714, level:3, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'国庫補助金600,000円を現金で受け取り、機械装置2,000,000円を現金で取得し、直接減額方式で圧縮記帳を行った（耐用年数５年・定額法・残存価額ゼロ）。２年後、この機械を1,000,000円で売却し現金を受け取った。①補助金受取②機械取得＋圧縮記帳③２年分の減価償却④売却時の仕訳を示しなさい。',
    en_q:'Received a government subsidy of ¥600,000 in cash and acquired machinery for ¥2,000,000 cash, applying direct-reduction compression accounting (5-year life, straight-line, zero residual). After 2 years, sold the machine for ¥1,000,000 cash. Record ①the subsidy receipt, ②the acquisition and compression entry, ③two years of depreciation, and ④the sale.',
    e:[{d:[['現金',600000]], c:[['国庫補助金受贈益',600000]]}, {d:[['機械装置',2000000]], c:[['現金',2000000]]}, {d:[['固定資産圧縮損',600000]], c:[['機械装置',600000]]}, {d:[['減価償却費',560000]], c:[['減価償却累計額',560000]]}, {d:[['現金',1000000],['減価償却累計額',560000]], c:[['機械装置',1400000],['固定資産売却益',160000]]}],
    exp:'圧縮記帳した資産をその後売却するところまで一気通貫で扱う応用問題です。圧縮後帳簿価額：2,000,000－600,000＝1,400,000円。年間減価償却費：1,400,000÷5年＝280,000円→２年分は560,000円。売却時点の帳簿価額：1,400,000－560,000＝840,000円。固定資産売却益：売却額1,000,000－帳簿価額840,000＝160,000円。圧縮記帳によって将来の減価償却費が小さくなる分、売却時の帳簿価額も低くなり、売却益が生じやすくなる（＝将来にわたって課税を繰り延べる効果）という一連のつながりを確認する問題です。'
  },
  { id:715, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'本社ビル建設のため、建設仮勘定で合計900,000円を現金で支払った。完成引渡し時、追加で付随費用100,000円を現金で支払った。引渡し後、既存の別の建物について改良工事500,000円（資本的支出）と、現状維持の修繕200,000円（収益的支出）を現金で行った。一連の仕訳を示しなさい。',
    en_q:'Paid a total of ¥900,000 in cash toward construction of a head office building, recorded in a construction-in-progress account. Upon completion and handover, paid an additional ¥100,000 cash in incidental costs. Afterward, performed ¥500,000 of capital improvements (capitalizable) and ¥200,000 of ordinary repairs (expensed) in cash on a separate existing building. Record the sequence of entries.',
    e:[{d:[['建設仮勘定',900000]], c:[['現金',900000]]}, {d:[['建物',1000000]], c:[['建設仮勘定',900000],['現金',100000]]}, {d:[['建物',500000],['修繕費',200000]], c:[['現金',700000]]}],
    exp:'新築（建設仮勘定）と既存建物の支出区分（資本的支出・収益的支出）を組み合わせた問題です。①②建設仮勘定900,000円と付随費用100,000円を合わせた1,000,000円が新しい「建物」の取得原価になります。③別の既存建物に対する支出は、価値・耐用年数を高める改良工事（資本的支出）500,000円は「建物」（資産）に追加計上し、現状維持のための修繕（収益的支出）200,000円は「修繕費」（費用）として処理します。「新築時の会計処理」と「既存資産への追加支出の区分」という異なる論点を１問で確認できます。'
  },
  { id:716, level:3, cat:'無形固定資産', chap:'無形資産・リース・引当金',
    q:'前期に吸収合併により計上したのれん600,000円（償却期間20年、経過2年）を保有する事業について、収益性の低下により減損の兆候が見られ、回収可能価額が380,000円と算定された。①２年分ののれん償却②減損損失の仕訳を示しなさい。',
    en_q:'Goodwill of ¥600,000 was recorded 2 years ago upon a merger (20-year amortization period). Due to declining profitability, impairment indicators are present, and the recoverable amount is assessed at ¥380,000. Record ①two years of goodwill amortization and ②the impairment loss.',
    e:[{d:[['のれん償却',60000]], c:[['のれん',60000]]}, {d:[['減損損失',160000]], c:[['のれん',160000]]}],
    exp:'のれんの償却と減損を組み合わせた問題です。①のれん償却：600,000÷20年＝30,000円／年×２年分＝60,000円。②２年分償却後の帳簿価額：600,000－60,000＝540,000円。回収可能価額380,000円が帳簿価額を下回っているため、減損損失：540,000－380,000＝160,000円を計上します。のれんは通常の償却（毎期規則的に価値を減らす）と、収益性悪化時の減損（一時に大きく評価減する）の両方の対象になる点を押さえましょう。'
  },
  { id:717, level:3, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'ファイナンス・リース取引（利子抜き法、見積現金購入価額500,000円、リース期間５年）を開始した。２年経過後、リース資産の収益性が低下し減損の兆候が見られたため、回収可能価額250,000円まで減損損失を計上する。①リース開始時②２年分の減価償却（定額法・直接法）③減損損失の仕訳を示しなさい。',
    en_q:'Started a finance lease (net method, estimated cash purchase price ¥500,000, 5-year term). After 2 years, the leased asset shows impairment indicators due to declining profitability; recognize an impairment loss down to a recoverable amount of ¥250,000. Record ①the lease inception, ②two years of straight-line depreciation (direct method), and ③the impairment loss.',
    e:[{d:[['リース資産',500000]], c:[['リース債務',500000]]}, {d:[['減価償却費',200000]], c:[['リース資産',200000]]}, {d:[['減損損失',50000]], c:[['リース資産',50000]]}],
    exp:'リース資産にも固定資産と同様に減損会計が適用されることを確認する問題です。①利子抜き法なので、リース資産・債務は見積現金購入価額500,000円で計上。②年間減価償却費：500,000÷5年＝100,000円（直接法なのでリース資産を直接減額）×２年分＝200,000円。２年後の帳簿価額：500,000－200,000＝300,000円。③回収可能価額250,000円を下回る分、減損損失：300,000－250,000＝50,000円を計上します。'
  },
  { id:718, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'発行していた新株予約権300,000円のうち、60％分の権利が行使され、権利行使価格400,000円が現金で払い込まれた（資本金計上額は会社法規定の最低額とする）。残り40％分は権利行使期限までに行使されず失効した。①権利行使時②失効時の仕訳を示しなさい。',
    en_q:'Of ¥300,000 in outstanding stock acquisition rights, 60% were exercised with a ¥400,000 cash exercise price paid in (capital is recorded at the statutory minimum). The remaining 40% expired unexercised. Record ①the exercise and ②the expiration.',
    e:[{d:[['現金',400000],['新株予約権',180000]], c:[['資本金',290000],['資本準備金',290000]]}, {d:[['新株予約権',120000]], c:[['新株予約権戻入益',120000]]}],
    exp:'新株予約権の「行使」と「失効」という対照的な結末を扱う問題です。①権利行使分の新株予約権：300,000×60％＝180,000円。払込金額400,000円と合わせた580,000円（400,000＋180,000）が株式発行の対価となり、会社法規定の最低額なので1/2ずつ資本金290,000円・資本準備金290,000円に計上します。②失効分の新株予約権：300,000×40％＝120,000円は、権利行使されずに消滅したため「新株予約権戻入益」（収益）に振り替えます。同じ新株予約権でも、行使されれば純資産の元手に、失効すれば利益になるという違いがポイントです。'
  },
  { id:719, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'自己株式500,000円（帳簿価額）を現金で取得した。その後、このうち300,000円分（帳簿価額）を350,000円で処分し現金を受け取った。残り200,000円分は消却した。①取得時②処分時③消却時の仕訳を示しなさい。',
    en_q:'Acquired treasury stock for ¥500,000 cash (book value). Later, disposed of ¥300,000 (book value) of it for ¥350,000 cash. The remaining ¥200,000 was retired (cancelled). Record ①the acquisition, ②the disposal, and ③the retirement.',
    e:[{d:[['自己株式',500000]], c:[['現金',500000]]}, {d:[['現金',350000]], c:[['自己株式',300000],['その他資本剰余金',50000]]}, {d:[['その他資本剰余金',200000]], c:[['自己株式',200000]]}],
    exp:'自己株式の取得・処分・消却という一連の流れをたどる問題です。①取得：自己株式（純資産のマイナス）として計上。②処分：帳簿価額300,000円を350,000円で処分できたので、差額50,000円（自己株式処分差益）は「その他資本剰余金」に計上します。③消却：残り200,000円は市場に戻さず消滅させるため、「その他資本剰余金」を減額して処理します（消却時に損益は生じません）。自己株式の売買差額はP/Lの損益ではなく、常に純資産（その他資本剰余金）で調整される点が重要です。'
  },
  { id:720, level:3, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'外貨建てのその他有価証券（Ｕ社株式、1,000ドル、取得時レート＠130円）を現金で取得した。決算時、時価は1,100ドル・決算時レート＠135円であった。実効税率30％として、税効果を考慮した評価差額の仕訳を示しなさい。',
    en_q:'Acquired foreign-currency-denominated available-for-sale securities (Company U stock, $1,000, at ¥130/USD) in cash. At year-end, fair value is $1,100 and the closing rate is ¥135/USD. Using a 30% effective tax rate, record the tax-effected remeasurement entry.',
    e:[{d:[['その他有価証券',130000]], c:[['現金',130000]]}, {d:[['その他有価証券',18500]], c:[['繰延税金負債',5550],['その他有価証券評価差額金',12950]]}],
    exp:'外貨建有価証券は「外貨のまま時価評価してから、決算時レートで円換算する」のが原則です。取得原価：1,000ドル×130円＝130,000円。決算時評価額：1,100ドル×135円＝148,500円。評価差額：148,500－130,000＝18,500円（円高・円安の影響と時価上昇の影響がまとめて反映されます）。税効果：18,500×30％＝5,550円を繰延税金負債に、残り12,950円を純資産（その他有価証券評価差額金）に計上します。外貨換算と税効果会計を同時に扱う、２級の中でも複合度の高い論点です。'
  },
  { id:721, level:3, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'外国企業に商品2,000ドルを掛けで販売した（取引時レート＠140円）。その後、この売掛金全額について１ドル＝138円で為替予約を行った（振当処理）。さらにその後、決済され現金を受け取った。①販売時②為替予約時③決済時の仕訳を示しなさい。',
    en_q:'Sold goods for $2,000 on credit to a foreign company (transaction rate ¥140/USD). Later, entered a forward contract locking in ¥138/USD for the entire receivable. The receivable was then settled in cash. Record ①the sale, ②the forward contract designation, and ③the settlement.',
    e:[{d:[['売掛金',280000]], c:[['売上',280000]]}, {d:[['為替差損益',4000]], c:[['売掛金',4000]]}, {d:[['現金',276000]], c:[['売掛金',276000]]}],
    exp:'取引発生「後」に為替予約を行うケースです（発生前の予約とは処理が異なる点に注意）。①販売時は直物レートで換算：2,000ドル×140円＝280,000円。②為替予約時：売掛金を予約レート（先物相場）に換算替えします。2,000ドル×(140－138)＝4,000円分、売掛金が減少するため「為替差損益」（費用側）を計上。③決済時：予約レートで確定した238,000...ではなく276,000円（2,000×138）がそのまま入金され、為替差損益は生じません（予約時にすでに確定済みのため）。「取引発生前の予約」は換算替えなし・差損益なし、「取引発生後の予約」は予約時に換算替えして差損益が生じる、という違いを対比して理解しましょう。'
  },
  { id:722, level:3, cat:'税効果', chap:'税効果',
    q:'決算にあたり、次の３つの一時差異について税効果会計を適用する（実効税率30％）。①貸倒引当金の損金算入限度超過額30,000円②固定資産の会計上・税務上の減価償却費の差額20,000円（会計の方が税務より大きい）③その他有価証券の評価益50,000円。それぞれの繰延税金資産・負債の仕訳を示しなさい。',
    en_q:'At year-end, apply tax-effect accounting to three temporary differences (30% effective rate): ①excess allowance for doubtful accounts ¥30,000 over the tax limit ②a ¥20,000 difference where accounting depreciation exceeds tax depreciation ③a ¥50,000 unrealized gain on other securities. Record the deferred tax entries for each.',
    e:[{d:[['繰延税金資産',9000]], c:[['法人税等調整額',9000]]}, {d:[['繰延税金資産',6000]], c:[['法人税等調整額',6000]]}, {d:[['その他有価証券',50000]], c:[['繰延税金負債',15000],['その他有価証券評価差額金',35000]]}],
    exp:'３種類の一時差異を１問でまとめて処理する、税効果会計の総まとめ問題です。①貸倒引当金の超過額（将来減算一時差異）：30,000×30％＝9,000円の繰延税金資産。②減価償却の差異（会計＞税務なので、将来その分だけ税務上損金にできる＝将来減算一時差異）：20,000×30％＝6,000円の繰延税金資産。③その他有価証券の評価益（将来売却時に課税される＝将来加算一時差異）：50,000×30％＝15,000円を繰延税金負債に、残り35,000円を純資産（その他有価証券評価差額金）に計上。①②は損益項目（法人税等調整額）として、③は純資産に直入される点の違いに注意してください。'
  },
  { id:723, level:3, cat:'税効果', chap:'税効果',
    q:'積立金方式による圧縮記帳（国庫補助金受贈益500,000円はすでに計上済み、実効税率30％）を行う場合、税効果を考慮すると圧縮積立金の設定額はどうなるか。①税効果を考慮した圧縮積立金の設定仕訳②対応する繰延税金負債の仕訳を示しなさい。',
    en_q:'Under reserve-method compression accounting (a ¥500,000 subsidy gain already recorded, 30% effective tax rate), how does considering the tax effect change the amount set aside as a compression reserve? Record ①the tax-effected compression reserve entry and ②the corresponding deferred tax liability entry.',
    e:[{d:[['繰越利益剰余金',350000]], c:[['圧縮積立金',350000]]}, {d:[['法人税等調整額',150000]], c:[['繰延税金負債',150000]]}],
    exp:'圧縮記帳と税効果会計を組み合わせた、２級でも特に応用度の高い論点です。税効果を考慮しない場合、圧縮積立金は補助金受贈益と同額（500,000円）を積み立てますが、税効果を考慮する場合は、将来支払う税金相当額（繰延税金負債）を差し引いた税引後の金額だけを積み立てます。繰延税金負債：500,000×30％＝150,000円。圧縮積立金：500,000×(1－30％)＝350,000円。「補助金の益金算入によって将来増える税金」をあらかじめ負債として認識し、その分だけ積立額を圧縮する、という考え方です。'
  },
  { id:724, level:3, cat:'標準原価計算', chap:'工業簿記',
    q:'標準原価計算を採用する当社。標準：直接材料費＠500円×２kg＝1,000円/個。当月完成品400個。実際：実際単価＠520円×実際消費量820kg。①標準消費量②価格差異③数量差異の仕訳を示しなさい（不利差異は仕掛品から差異勘定へ振り替える）。',
    en_q:'A company uses standard costing. Standard: direct material @¥500 × 2kg = ¥1,000/unit. Completed 400 units this month. Actual: @¥520 × 820kg actually consumed. Find ①the standard quantity allowed and record ②the price variance and ③the quantity variance (unfavorable variances are transferred out of WIP to variance accounts).',
    e:[{d:[['価格差異',16400]], c:[['仕掛品',16400]]}, {d:[['数量差異',10000]], c:[['仕掛品',10000]]}],
    exp:'直接材料費差異を「価格差異」と「数量差異」に分解する応用問題です。①標準消費量：２kg×400個＝800kg。②価格差異：(標準単価500－実際単価520)×実際消費量820＝△16,400円（不利差異、実際の方が高かった）。③数量差異：標準単価500×(標準消費量800－実際消費量820)＝△10,000円（不利差異、実際の方が多く使った）。合計の直接材料費差異26,400円（＝16,400＋10,000）を、原因別に分解して管理に役立てるのが標準原価計算の目的です。'
  },
  { id:725, level:3, cat:'部門別原価計算', chap:'工業簿記',
    q:'補助部門費（動力部門80,000円、修繕部門50,000円）を直接配賦法で製造部門（切削部門・組立部門）に配賦する。配賦基準：動力部門は運転時間割合（切削60％・組立40％）、修繕部門は修繕回数割合（切削50％・組立50％）。①配賦の仕訳を示しなさい。②切削部門の予定配賦額は180,000円、切削部門の実際発生額（個別費62,000円＋上記で配賦を受けた額）を求め、原価差異の仕訳を示しなさい。',
    en_q:'Allocate support department costs (Power Dept ¥80,000, Repair Dept ¥50,000) to production departments (Cutting, Assembly) using the direct method. Allocation bases: Power by machine-hours (Cutting 60%, Assembly 40%); Repair by repair count (Cutting 50%, Assembly 50%). ①Record the allocation entry. ②The Cutting department\'s predetermined applied overhead is ¥180,000; find its actual cost (¥62,000 departmental cost + the amount allocated above) and record the variance entry.',
    e:[{d:[['切削部門費',73000],['組立部門費',57000]], c:[['動力部門費',80000],['修繕部門費',50000]]}, {d:[['切削部門費',45000]], c:[['製造間接費配賦差異',45000]]}],
    exp:'部門別配賦（直接配賦法）と原価差異分析を組み合わせた問題です。①直接配賦法は補助部門間のサービスのやり取りを無視し、製造部門へだけ配賦します。切削部門の受入額：動力80,000×60％＝48,000円＋修繕50,000×50％＝25,000円＝73,000円。組立部門の受入額：動力80,000×40％＝32,000円＋修繕50,000×50％＝25,000円＝57,000円。②切削部門の実際発生額：個別費62,000円＋配賦を受けた73,000円＝135,000円。予定配賦額180,000円との差額45,000円は、実際の方が少なかった「有利差異」として製造間接費配賦差異（貸方）に振り替えます。'
  },
  // ===== 総合問題（精算表・財務諸表 追加バリエーション） =====
  { id:704, level:3, cat:'帳簿・精算表', chap:'決算整理',
    q:'雑貨店（A社）の決算整理前残高試算表：現金300,000円　売掛金200,000円　貸倒引当金1,000円　繰越商品50,000円　備品400,000円　備品減価償却累計額80,000円　買掛金123,000円　資本金500,000円　繰越利益剰余金150,000円　売上900,000円　仕入600,000円　給料180,000円　保険料24,000円。\n整理事項：①期末商品棚卸高60,000円②売掛金残高の2％を貸倒引当金として設定（差額補充法）③備品について定額法（耐用年数8年・残存価額ゼロ）で減価償却④保険料のうち8,000円は次期分の前払い。\n① 売上原価② 当期純利益③ 貸借対照表の資産合計④ 貸借対照表の繰越利益剰余金を求めなさい。',
    en_q:'Pre-adjustment trial balance: Cash ¥300,000; A/R ¥200,000; Allowance for doubtful accounts ¥1,000; Inventory ¥50,000; Equipment ¥400,000; Accumulated depreciation ¥80,000; A/P ¥123,000; Capital ¥500,000; Retained earnings ¥150,000; Sales ¥900,000; Purchases ¥600,000; Salaries ¥180,000; Insurance ¥24,000.\nAdjustments: ①closing inventory ¥60,000 ②2% allowance on A/R (incremental) ③straight-line depreciation, 8-year life, zero residual ④¥8,000 of insurance is a prepayment for next period.\nFind: ①COGS ②net income ③total assets ④ending retained earnings.',
    ans_html: `<div class="tbl-sec">精算表（8欄）　単位：円</div><table><thead><tr><th rowspan="2">勘定科目</th><th colspan="2">残高試算表</th><th colspan="2">修正記入</th><th colspan="2">損益計算書</th><th colspan="2">貸借対照表</th></tr><tr><th>借</th><th>貸</th><th>借</th><th>貸</th><th>借</th><th>貸</th><th>借</th><th>貸</th></tr></thead><tbody><tr><td>現金</td><td>300,000</td><td></td><td></td><td></td><td></td><td></td><td>300,000</td><td></td></tr><tr><td>売掛金</td><td>200,000</td><td></td><td></td><td></td><td></td><td></td><td>200,000</td><td></td></tr><tr><td>貸倒引当金</td><td></td><td>1,000</td><td></td><td class="hl">3,000</td><td></td><td></td><td></td><td class="hl">4,000</td></tr><tr><td>繰越商品</td><td>50,000</td><td></td><td class="hl">60,000</td><td class="hl">50,000</td><td></td><td></td><td class="hl">60,000</td><td></td></tr><tr><td>備品</td><td>400,000</td><td></td><td></td><td></td><td></td><td></td><td>400,000</td><td></td></tr><tr><td>減価償却累計額</td><td></td><td>80,000</td><td></td><td class="hl">50,000</td><td></td><td></td><td></td><td class="hl">130,000</td></tr><tr><td>買掛金</td><td></td><td>123,000</td><td></td><td></td><td></td><td></td><td></td><td>123,000</td></tr><tr><td>資本金</td><td></td><td>500,000</td><td></td><td></td><td></td><td></td><td></td><td>500,000</td></tr><tr><td>繰越利益剰余金</td><td></td><td>150,000</td><td></td><td></td><td></td><td></td><td></td><td>150,000</td></tr><tr><td>売上</td><td></td><td>900,000</td><td></td><td></td><td></td><td class="hl">900,000</td><td></td><td></td></tr><tr><td>仕入</td><td>600,000</td><td></td><td class="hl">50,000</td><td class="hl">60,000</td><td class="hl">590,000</td><td></td><td></td><td></td></tr><tr><td>給料</td><td>180,000</td><td></td><td></td><td></td><td>180,000</td><td></td><td></td><td></td></tr><tr><td>保険料</td><td>24,000</td><td></td><td></td><td class="hl">8,000</td><td class="hl">16,000</td><td></td><td></td><td></td></tr><tr><td>貸倒引当金繰入</td><td></td><td></td><td class="hl">3,000</td><td></td><td class="hl">3,000</td><td></td><td></td><td><     exp:'複数の決算整理事項を一度に処理する総合問題です。決算整理仕訳を一つずつ丁寧に行い、それぞれの勘定科目への影響をP/L欄・B/S欄に振り分けます。①商品評価（仕入の調整）②貸倒引当金の差額補充（200,000×2％－1,000＝3,000円繰入）③減価償却（400,000÷8年＝50,000円）④保険料の前払い（費用から資産へ8,000円分を振り替え）の４つの整理事項がすべて連動して、最終的な当期純利益・資産合計に影響します。',
    steps:[
      {label:'①売上原価', ans:590000, unit:'円', choices:[590000,600000,580000,610000]},

      {label:'④貸借対照表の繰越利益剰余金', ans:211000, unit:'円', choices:[211000,214000,208000,203500]}
    ]

  { id:705, level:3, cat:'帳簿・精算表', chap:'決算整理',
    q:'雑貨店（A社）の決算整理前残高試算表（一部）：現金330,000円　売掛金150,000円　貸倒引当金500円　繰越商品40,000円　備品300,000円　備品減価償却累計額60,000円　買掛金100,500円　資本金400,000円　繰越利益剰余金125,000円　売上850,000円　仕入500,000円　給料120,000円　支払家賃96,000円。\n整理事項：①期末商品棚卸高45,000円②売掛金残高の2％を貸倒引当金として設定（差額補充法）③備品について定額法（耐用年数10年・残存価額ゼロ）で減価償却④支払家賃のうち16,000円は次期分の前払い⑤給料の未払い8,000円を計上する。\n損益計算書と貸借対照表を作成し、①当期純利益②貸借対照表の資産合計③貸借対照表の負債合計を求めなさい。',
    en_q:'Pre-adjustment trial balance (partial): Cash ¥330,000; A/R ¥150,000; Allowance ¥500; Inventory ¥40,000; Equipment ¥300,000; Accumulated depreciation ¥60,000; A/P ¥100,500; Capital ¥400,000; Retained earnings ¥125,000; Sales ¥850,000; Purchases ¥500,000; Salaries ¥120,000; Rent ¥96,000.\nAdjustments: ①closing inventory ¥45,000 ②2% allowance on A/R (incremental) ③straight-line depreciation, 10-year life, zero residual ④¥16,000 of rent is a prepayment for next period ⑤accrue unpaid salaries of ¥8,000.\nPrepare the income statement and balance sheet; find ①net income ②total assets ③total liabilities.',
    ans_html: `<div class="tbl-sec">損益計算書　単位：円</div><table><tbody><tr><td>Ⅰ　売上高</td><td></td><td class="hl">850,000</td></tr><tr><td>Ⅱ　売上原価</td><td></td><td></td></tr><tr><td>　期首商品棚卸高</td><td>40,000</td><td></td></tr><tr><td>　当期商品仕入高</td><td>500,000</td><td></td></tr><tr><td>　合計</td><td>540,000</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>△45,000</td><td></td></tr><tr><td>　売上原価　計</td><td></td><td>495,000</td></tr><tr class="total-row"><td class="hl">売上総利益</td><td></td><td class="hl">355,000</td></tr><tr><td>Ⅲ　販売費及び一般管理費</td><td></td><td></td></tr><tr><td>　給料</td><td>128,000</td><td></td></tr><tr><td>　貸倒引当金繰入</td><td>2,500</td><td></td></tr><tr><td>　減価償却費</td><td>30,000</td><td></td></tr><tr><td>　支払家賃</td><td>80,000</td><td></td></tr><tr><td>　費用合計</td><td></td><td>240,500</td></tr><tr class="total-row"><td class="hl">当期純利益</td><td></td><td class="hl">114,500</td></tr></tbody></table><div class="tbl-sec">貸借対照表　単位：円</div><table><thead><tr><th colspan="2">資産の部</th><th colspan="2">負債・純資産の部</th></tr></thead><tbody><tr><td>現金</td><td>330,000</td><td>買掛金</td><td>100,500</td></tr><tr><td>売掛金</td><td>150,000</td><td class="hl">未払費用</td><td class="hl">8,000</td></tr><tr><td>貸倒引当金</td><td>△3,000</td><td class="hl">負債合計</td><td class="hl">108,500</td></tr><tr><td>繰越商品</td><td>45,000</td><td>資本金</td><td>400,000</td></tr><tr><td class="hl">前払費用</td><td class="hl">16,000</td><td class="hl">繰越利益剰余金</td><td class="hl">239,500</td></tr><tr><td>備品</td><td>300,000</td><td>純資産合計</td><td>639,500</td></tr><tr><td>減価償却累計額</td><td>△90,000</td><td></td><td></td></tr><tr class="total-row"><td class="hl">資産合計</td><td class="hl">748,000</td><td>負債・純資産合計</td><td class="hl">748,000</td></tr></tbody></table><div class="formula-box">給料：120,000＋未払8,000＝128,000。貸倒引当金繰入：150,000×2％－500＝2,500。減価償却費：300,000÷10年＝30,000。支払家賃：96,000－前払16,000＝80,000。繰越利益剰余金：125,000＋当期純利益114,500＝239,500。</div>`,
    exp:'この問題は「見越し」（未払費用）と「繰延べ」（前払費用）を同時に扱う総合問題です。支払家賃は「まだ来ていない次期分」を前払費用として資産に振り替え（繰延べ）、給料は「まだ払っていない当期分」を未払費用として負債に計上（見越し）します。見越し・繰延べどちらも「当期の費用を正しい金額にする」ための調整である点は共通ですが、資産に計上するか負債に計上するかが逆になります。',
    steps:[
      {label:'①当期純利益', ans:114500, unit:'円', choices:[114500,106500,122500,98500]},
      {label:'②貸借対照表の資産合計', ans:748000, unit:'円', choices:[748000,764000,732000,756000]},
      {label:'③貸借対照表の負債合計', ans:108500, unit:'円', choices:[108500,100500,116500,92500]}
    ]
  },

const IKOU_CATS = new Set(['工業簿記基礎','材料費','労務費','経費','個別原価計算','部門別原価計算','製造間接費','総合原価計算','標準原価計算','直接原価計算','工業簿記総まとめ']);
const SECS = {
  s3:  q => (q.level||3)===3,
  s2c: q => q.level===2 && !IKOU_CATS.has(q.cat),
  s2i: q => q.level===2 && IKOU_CATS.has(q.cat),
};

function getSectionQuestions(sec){
  if(!sec) return ALL;
  if(sec.startsWith('chap:')){
    const chap = sec.slice(5);
    return ALL.filter(q => q.chap === chap);
  }
  return SECS[sec] ? ALL.filter(SECS[sec]) : ALL;
}

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base.filter(q=>!checkOnly||checked[q.id]);
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}



function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  let html=styleParens(txt);
  const enq = q.en_q || JRNL_EN_Q[q.id];
  if(enq) html+=`<div class="q-en-trans">${enq}</div>`;
  return html;
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}</div>
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){
  const q=expQuestions[expQIdx];
  btn.style.display='none';
  const ro=document.getElementById('exp-ro-ans');
  ro.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa=q.exp?`<div class="exp-res-exp">${styleParens(q.exp.replace(/\n/g,'<br>'))}</div>`:'';
  const area=document.createElement('div');
  area.className='exp-fill-exp-area';
  area.innerHTML=expJa+checkBtn;
  ro.insertAdjacentElement('afterend',area);
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa = isLastEntry && q.exp ? `<div class="exp-res-exp">${styleParens(q.exp.replace(/\n/g,'<br>'))}</div>` : '';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${expJa}${checkBtn}${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${expJa}${checkBtn}${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  const res=document.getElementById('exp-res');
  if(res){ res.style.display='none'; res.innerHTML=''; }
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

// ===== スクロールモードここまで =====

function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  document.querySelectorAll('.grp-btn').forEach(btn=>{
    const bsec = btn.dataset.sec||btn.id.replace('sec-','');
    btn.classList.toggle('active', bsec === sec);
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}




function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? 'チェックのみ解除' : 'チェックのみ';
  buildDeck();
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='チェックのみ'; }
  setSection('chap:第1章：商品売買');
}



function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('chap:第1章：商品売買');
</script>
