    exp:'固定資産を年度の途中で取得した場合、1年分丸ごと減価償却するのではなく、実際に使っていた月数分だけを月割りで計算します。年間の減価償却費60,000円（300,000÷5年）のうち、7月から3月までの9ヶ月分だけを、60,000×9/12＝45,000円として今期の費用に計上します。'
  },
  // ===== 債権債務の補充 =====
  { id:654, level:2, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'受取手形の割引：額面500,000円（残存60日）、割引率年3.65%。割引の仕訳をしなさい。',
    e:[{d:[['現金',497000],['手形売却損',3000]], c:[['受取手形',500000]]}],
    exp:'手形割引の割引料は「額面×年利率×銀行が立て替える日数÷365日」で計算します。500,000×3.65％×60÷365＝3,000円が、60日分早く現金化してもらうために銀行へ払うコストです。額面から割引料を引いた497,000円が実際に手元に入る金額で、差額3,000円は手形売却損（費用）として処理します。'
  },
  { id:655, level:2, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'手形の書き換え：支払手形200,000円を決済できず、利息2,000円を払い期日を延長（書き換え）。支払人側の仕訳をしなさい。',
    e:[{d:[['支払手形',200000],['支払利息',2000]], c:[['支払手形',200000],['現金',2000]]}],
    exp:'期日までに手形を決済できないとき、相手の同意を得て新しい期日の手形に書き換えてもらうことがあります。これは「古い約束を取り消して、新しい約束をし直す」ことと同じなので、古い支払手形をいったん消し、新しい支払手形を同額で計上し直します。支払いを延ばしてもらう対価として発生する利息は、支払利息（費用）として別途計上します。'
  },

  // ===== 1級：連結会計（応用） =====
  { id:726, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式80％を取得し支配を獲得した。取得に際し、外部の会計士・弁護士への報酬（取得関連費用）30,000円を現金で支払った。この取得関連費用の仕訳を示しなさい。',
    en_q:'Company P acquired 80% of Company S, gaining control. In connection with the acquisition, paid ¥30,000 cash in professional fees (acquisition-related costs) to outside accountants/lawyers. Record the entry for these acquisition-related costs.',
    e:[{d:[['支払手数料',30000]], c:[['現金',30000]]}],
    exp:'「取得関連費用」とは、M&A（会社を買うこと）のときに払う、弁護士や会計士への相談料・仲介手数料のことです。一見「S社株式を買うためのお金」に見えますが、会計のルールでは「S社株式の値段（取得原価）には含めず、払った期の費用として処理する」と決められています。理由は、この費用は「株式そのものの価値」ではなく「取引を成立させるための事務コスト」だからです。仕訳は普通の経費の支払いと同じで、「支払手数料（費用）／現金（資産の減少）」となります。'
  },
  { id:727, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の土地は帳簿価額500,000円であるが、支配獲得時の時価は650,000円であった。子会社の資産を時価評価する連結修正仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Subsidiary S\'s land has a book value of ¥500,000 but a fair value of ¥650,000 at the date control was obtained. Record the consolidation entry revaluing the subsidiary\'s asset to fair value (ignore tax effects).',
    e:[{d:[['土地',150000]], c:[['評価差額',150000]]}],
    exp:'連結会計では、子会社を「まるごと仲間に迎え入れる」ときに、子会社の資産・負債を「今の本当の価値（時価）」に評価し直すというルールがあります。これを「子会社の資産・負債の時価評価」と言います。土地の場合、帳簿には昔買ったときの値段（500,000円）が残っていますが、今売ったら650,000円になるなら、差額150,000円を「評価差額」という純資産の勘定に計上します。「評価差額」は、後で資本連結（親会社の投資とS社の純資産を相殺する処理）のときに、S社の純資産の一部として扱われます。'
  },
  { id:728, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の土地は帳簿価額500,000円であるが、支配獲得時の時価は650,000円であった（実効税率30％）。税効果を考慮して子会社の資産を時価評価する連結修正仕訳を示しなさい。',
    en_q:'Same fact pattern as above (land: book ¥500,000, fair value ¥650,000), but now apply a 30% effective tax rate. Record the fair-value revaluation entry including the tax effect.',
    e:[{d:[['土地',150000]], c:[['繰延税金負債',45000],['評価差額',105000]]}],
    exp:'前問に税金の影響を追加したバージョンです。土地の評価差額150,000円は、将来この土地を売却したときに税金がかかる原因になるので、その将来の税金分だけ「繰延税金負債」（将来支払う税金）として先取りで計上します。繰延税金負債：150,000×30％＝45,000円。残りの105,000円（＝150,000－45,000、税引後の正味の評価差額）だけが本当の意味での「評価差額」（純資産）になります。「評価が上がった分、丸ごと得するわけではなく、税金分は差し引いて考える」というのがポイントです。'
  },
  { id:729, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社（支配獲得時の純資産：資本金500,000円・利益剰余金200,000円・評価差額100,000円）の株式80％を700,000円で取得し支配を獲得した。資本連結（投資と資本の相殺消去）の仕訳を示しなさい。',
    en_q:'Company P acquired 80% of Company S (net assets at acquisition: capital ¥500,000, retained earnings ¥200,000, revaluation surplus ¥100,000) for ¥700,000, gaining control. Record the capital consolidation entry (elimination of the investment against equity).',
    e:[{d:[['資本金',500000],['利益剰余金',200000],['評価差額',100000],['のれん',60000]], c:[['S社株式',700000],['非支配株主持分',160000]]}],
    exp:'資本連結は連結会計の一番の基本作業です。①まずS社の純資産をぜんぶ足します：資本金500,000＋利益剰余金200,000＋評価差額100,000＝800,000円（これが「時価ベースのS社の正味の価値」）。②Ｐ社の取り分（80％）＝640,000円、残り20％は「非支配株主持分」（P社以外の株主の取り分）として160,000円を純資産に計上します。③Ｐ社が払った700,000円と、Ｐ社の取り分640,000円との差額60,000円は「のれん」（S社を高く買った理由＝ブランド力や将来性への対価）として資産計上します。仕訳はS社の純資産の科目を全部借方で消し、Ｐ社の投資（S社株式）と非支配株主持分を貸方に計上する形になります。'
  },
  { id:730, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式を2段階で取得した。Ｘ1年度末：Ｓ社株式20％を180,000円で取得。Ｘ2年度末：追加でＳ社株式40％を400,000円で取得し、合計60％保有として支配を獲得した。支配獲得時点でのＳ社株式20％（既存保有分）の時価は200,000円であった。既存投資を時価に評価替えする仕訳を示しなさい（段階取得）。',
    en_q:'Company P acquired Company S\'s shares in two stages: 20% for ¥180,000 at the end of Year 1, and an additional 40% for ¥400,000 at the end of Year 2 (gaining control with 60% total). At the date control was obtained, the fair value of the previously held 20% was ¥200,000. Record the entry revaluing the existing investment to fair value (step acquisition).',
    e:[{d:[['S社株式',20000]], c:[['段階取得に係る差益',20000]]}],
    exp:'「段階取得」とは、一気に支配株主になるのではなく、少しずつ株を買い増して最終的に子会社化するケースです。この場合、「支配を獲得した瞬間」に、それまで持っていた分（20％）も含めて全部を「今の時価」で評価し直すというルールがあります。以前180,000円で買った20％分が、今では200,000円の価値になっていたので、差額20,000円を「段階取得に係る差益」（連結上の収益）として計上します。「途中まで小口の株主だった人が、急に経営権を握る株主になった瞬間に、それまでの持ち分もまとめて今の値段で買い直したとみなす」というイメージです。'
  },
  { id:731, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式60％を保有し、既に支配している（非支配株主持分40％）。追加でＳ社株式20％を250,000円で取得した（合計80％保有）。追加取得時のＳ社純資産は1,000,000円であった。追加取得の連結修正仕訳を示しなさい。',
    en_q:'Company P already controls Company S with a 60% holding (non-controlling interest 40%). P acquired an additional 20% for ¥250,000 (80% total). S\'s net assets at the time of additional acquisition were ¥1,000,000. Record the consolidation entry for the additional acquisition.',
    e:[{d:[['非支配株主持分',200000],['資本剰余金',50000]], c:[['S社株式',250000]]}],
    exp:'すでに子会社にしている会社の株を「追加で」買い増すケースです。もう支配は獲得済みなので、のれんは新たに計算しません。非支配株主（他の株主）から株を買い取るイメージなので、非支配株主持分のうち買い取った分（Ｓ社純資産1,000,000×20％＝200,000円）を減らします。実際に払った金額250,000円との差額50,000円は、損益ではなく「資本剰余金」（純資産の内訳の一つ）の減少として処理します。「グループ内の株主構成が変わっただけ」なので、儲けや損としては扱わないのがポイントです。'
  },
  { id:732, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式80％（取得原価800,000円）を保有している。このうち20％を300,000円で売却した（売却後60％保有・支配は継続）。売却時のＳ社純資産は1,200,000円。個別財務諸表上、売却価額300,000円と売却原価200,000円（＝800,000×20/80）の差額100,000円を「子会社株式売却益」として計上済みである。連結修正仕訳を示しなさい。',
    en_q:'Company P holds 80% of Company S (cost ¥800,000). It sold 20% for ¥300,000 (retaining 60%, control continues). S\'s net assets at the time of sale were ¥1,200,000. On P\'s individual financial statements, a ¥100,000 gain (sale price ¥300,000 less cost basis ¥200,000, i.e. 800,000×20/80) was already recorded as "gain on sale of subsidiary shares." Record the consolidation adjusting entry.',
    e:[{d:[['子会社株式売却益',100000],['資本剰余金',140000]], c:[['非支配株主持分',240000]]}],
    exp:'子会社株式を一部だけ売っても、まだ支配が続いている（60％保有で子会社のまま）場合、連結上は「損益」として扱いません。理由は「グループの外に売ったわけではなく、単に株主の内訳（親会社の取り分と非支配株主の取り分）が変わっただけ」だからです。①個別財務諸表で計上した「子会社株式売却益」100,000円は、連結上は取り消します。②非支配株主の取り分は、売った20％分だけ増えます：Ｓ社純資産1,200,000×20％＝240,000円。③この240,000円と、取り消した売却益100,000円との差額140,000円は「資本剰余金」の減少として調整します。「連結では、支配が続く限り、子会社株式の一部売却は儲けではなく、株主間のお金の付け替えとして処理する」と覚えましょう。'
  },
  { id:733, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社（子会社）に対して500,000円を貸し付けている。連結財務諸表を作成するにあたり、この債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P has lent ¥500,000 to subsidiary S. When preparing consolidated financial statements, record the entry eliminating this intercompany receivable/payable.',
    e:[{d:[['借入金',500000]], c:[['貸付金',500000]]}],
    exp:'連結財務諸表は「グループ全体を1つの会社」として見た財務諸表です。Ｐ社が貸してＳ社が借りたお金は、グループの外から見れば「自分の左のポケットから右のポケットにお金を移しただけ」で、実質的な貸し借りはありません。そこでＰ社の「貸付金」（資産）とＳ社の「借入金」（負債）を、金額をぶつけ合って両方ともゼロにします。この作業を「連結上の相殺消去」と呼びます。'
  },
  { id:734, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'上記の貸付金に対応する利息について、Ｐ社は受取利息20,000円、Ｓ社は支払利息20,000円をそれぞれ計上している。連結財務諸表を作成するにあたり、この収益・費用を相殺消去する仕訳を示しなさい。',
    en_q:'For the loan above, P recorded interest income of ¥20,000 and S recorded interest expense of ¥20,000. When preparing consolidated financial statements, record the entry eliminating this intercompany revenue/expense.',
    e:[{d:[['受取利息',20000]], c:[['支払利息',20000]]}],
    exp:'前問の貸付金・借入金とセットで発生する利息も同じ考え方です。Ｐ社が受け取った利息（収益）とＳ社が支払った利息（費用）は、グループ全体で見れば「グループ内でお金が動いただけ」で、外部から見た本当の収益・費用ではありません。そこで「受取利息」と「支払利息」を相殺してゼロにします。貸付金・借入金の元本だけでなく、そこから生まれる利息も必ずセットで消去する、と覚えておきましょう。'
  },
  { id:735, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社へ現金100,000円を送金したが、決算日時点でＳ社側では未処理（未達）であった。①Ｓ社側で未達取引を整理する仕訳（借入金として処理）②その後、債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P remitted ¥100,000 cash to subsidiary S, but as of the balance sheet date, S had not yet recorded the receipt (in transit). Record ①the entry on S\'s books to recognize the in-transit item (as a loan payable) and ②the subsequent elimination of the intercompany receivable/payable.',
    e:[{d:[['現金',100000]], c:[['借入金',100000]]}, {d:[['借入金',100000]], c:[['貸付金',100000]]}],
    exp:'「未達取引」とは、親会社は送金の記録をつけたのに、子会社側の帳簿にまだその入金が反映されていない状態のことです（銀行の処理が決算日をまたいでしまった、などが原因）。このままでは相殺消去（貸付金と借入金をぶつけ合う作業）がうまくできないので、①まずＳ社側の帳簿を「本来あるべき状態」に修正します（現金を受け取った記録を追加）。②その上で、Ｐ社の「貸付金」とＳ社の「借入金」を相殺消去します。「相殺消去の前に、まず両社の帳簿の金額を一致させる」というのがこの処理のポイントです。'
  },
  { id:736, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社、Ｐ社持分80％）は原価80,000円の商品をＰ社に100,000円で販売した。期末にＰ社の在庫にこの商品が全量残っている。①未実現利益の消去②非支配株主持分への按分の仕訳を示しなさい（アップストリーム取引）。',
    en_q:'Subsidiary S (80% owned by P) sold goods costing ¥80,000 to P for ¥100,000. All of these goods remain in P\'s ending inventory. Record ①the elimination of unrealized profit and ②the allocation to non-controlling interests (upstream transaction).',
    e:[{d:[['売上原価',20000]], c:[['棚卸資産',20000]]}, {d:[['非支配株主持分',4000]], c:[['非支配株主に帰属する当期純利益',4000]]}],
    exp:'「アップストリーム」とは、子会社（Ｓ社）から親会社（Ｐ社）へ商品が流れる取引のことです（逆に親会社→子会社は「ダウンストリーム」）。①Ｓ社が乗せた利益20,000円（＝100,000－80,000）は、Ｐ社の在庫にまだ残っている＝グループ外にまだ売れていないので、「未実現利益」として消去します（売上原価を増やして在庫の評価を下げる）。②アップストリームの場合、この利益はもともと「Ｓ社の利益」なので、非支配株主（Ｓ社の他の株主）にも一部負担してもらう必要があります。非支配株主の負担分：20,000×20％＝4,000円。この4,000円分だけ、非支配株主の取り分（非支配株主持分）を減らします。ダウンストリーム（親→子）の場合はこの按分は行わない点が違いです。'
  },
  { id:737, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の当期純利益は500,000円であった（Ｐ社持分80％、非支配株主持分20％）。非支配株主に帰属する当期純利益を非支配株主持分に振り替える仕訳を示しなさい。',
    en_q:'Subsidiary S\'s net income for the period was ¥500,000 (P holds 80%, non-controlling interest 20%). Record the entry allocating the non-controlling interests\' share of net income to non-controlling interests.',
    e:[{d:[['非支配株主に帰属する当期純利益',100000]], c:[['非支配株主持分',100000]]}],
    exp:'子会社が稼いだ利益は、親会社の取り分だけでなく、非支配株主（他の株主）の取り分もあります。Ｓ社の当期純利益500,000円のうち、非支配株主の持分割合20％にあたる100,000円は、連結損益計算書上「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）を増やします。「子会社の儲けのうち、親会社の分は親会社の利益剰余金へ、他の株主の分は非支配株主持分へ」と、取り分に応じて分けるイメージです。'
  },
  { id:738, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社、Ｐ社持分80％）が保有するその他有価証券に評価益50,000円が生じた（税効果は考慮しない）。連結上、この評価差額のうち非支配株主に帰属する部分を非支配株主持分に振り替える仕訳を示しなさい。',
    en_q:'Subsidiary S (80% owned by P) recognized a ¥50,000 unrealized gain on available-for-sale securities (ignore tax effects). Record the entry allocating the non-controlling interests\' share of this valuation gain to non-controlling interests.',
    e:[{d:[['その他有価証券評価差額金',10000]], c:[['非支配株主持分',10000]]}],
    exp:'子会社が保有する有価証券の評価差額（純資産直入項目）も、当期純利益と同じように、親会社と非支配株主で取り分を分ける必要があります。評価益50,000円のうち非支配株主の持分20％にあたる10,000円は、非支配株主持分（純資産）へ振り替えます。「損益計算書を通らない純資産の変動（評価差額など）も、当期純利益と同じ考え方で持分割合に応じて按分する」というのがポイントです。'
  },
  { id:739, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'前期末に資本連結仕訳（資本金400,000円・利益剰余金100,000円・のれん50,000円／Ｓ社株式450,000円・非支配株主持分100,000円）を行った。前期中、のれん償却5,000円・非支配株主に帰属する前期純利益15,000円が発生した。当期首の開始仕訳（前期末までの純資産の動きを反映したもの）を示しなさい。',
    en_q:'At the end of last period, a capital consolidation entry was recorded (capital ¥400,000, retained earnings ¥100,000, goodwill ¥50,000 / S shares ¥450,000, non-controlling interests ¥100,000). During last period, goodwill amortization of ¥5,000 and non-controlling interests\' share of last period\'s net income of ¥15,000 occurred. Record this period\'s opening entry, reflecting the cumulative effect through the end of last period.',
    e:[{d:[['資本金',400000],['利益剰余金当期首残高',120000],['のれん',45000]], c:[['S社株式',450000],['非支配株主持分',115000]]}],
    exp:'連結の仕訳は、個別財務諸表（Ｐ社・Ｓ社それぞれの帳簿）には一切記録されません。そのため、連結精算表を作るたびに「過去に行った連結修正を最初からもう一度全部やり直す」必要があります。これを「開始仕訳」と呼びます。前期末の資本連結仕訳をベースに、①のれん償却5,000円（費用なので利益剰余金を減らす）②非支配株主に帰属する前期純利益15,000円（非支配株主持分を増やす）の2つの累積効果を反映させます。過去分の損益の動きは、当期の損益計算書には出せないので、代わりに「利益剰余金当期首残高」という純資産の勘定にまとめて計上します：100,000＋5,000（のれん償却の累積）＋15,000（非支配株主帰属利益の累積）＝120,000円。のれんは償却済みの5,000円を差し引いて45,000円、非支配株主持分は15,000円増えて115,000円になります。'
  },

  // ===== 1級：企業結合・事業分離 =====
  { id:740, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、Ｓ社株主にＰ社株式100株（1株当たり時価8,000円）を交付した。合併により引き継いだＳ社の資産・負債の時価は、諸資産2,000,000円・諸負債1,300,000円であった。合併の仕訳を示しなさい（増加する資本金は全額資本金とする）。',
    en_q:'Company P absorbed Company S in a merger, issuing 100 P shares (fair value ¥8,000 each) to S\'s shareholders. The fair values of S\'s assets and liabilities taken over were: assets ¥2,000,000, liabilities ¥1,300,000. Record the merger entry (the full increase is credited to Capital).',
    e:[{d:[['諸資産',2000000],['のれん',100000]], c:[['諸負債',1300000],['資本金',800000]]}],
    exp:'合併の会計処理（パーチェス法）は、Ｓ社を「時価で丸ごと買った」と考えて処理します。対価（取得原価）＝交付した株式の時価：100株×8,000円＝800,000円。引き継いだ純資産（時価）：諸資産2,000,000－諸負債1,300,000＝700,000円。対価800,000円の方が引き継いだ純資産700,000円より高いので、差額100,000円は「のれん」（ブランド力や将来の収益力に対して余分に払った分）として資産計上します。'
  },
  { id:741, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、Ｓ社株主にＰ社株式50株（1株当たり時価6,000円）を交付した。合併により引き継いだＳ社の資産・負債の時価は、諸資産1,500,000円・諸負債1,000,000円であった。合併の仕訳を示しなさい。',
    en_q:'Company P absorbed Company S, issuing 50 P shares (fair value ¥6,000 each). Fair values taken over: assets ¥1,500,000, liabilities ¥1,000,000. Record the merger entry.',
    e:[{d:[['諸資産',1500000]], c:[['諸負債',1000000],['資本金',300000],['負ののれん発生益',200000]]}],
    exp:'対価（取得原価）：50株×6,000円＝300,000円。引き継いだ純資産（時価）：1,500,000－1,000,000＝500,000円。今回は対価300,000円より引き継いだ純資産500,000円の方が大きい、つまり「お買い得に買えた」状態です。この差額200,000円は「負ののれん発生益」として、その期の収益に一括計上します（のれんとは逆で、資産にはせず、すぐに利益にする点に注意）。'
  },
  { id:742, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社の発行済株式全部（100％）を取得し、完全親子会社関係を創設する株式交換を行った。対価としてＰ社株式を交付し、Ｓ社の時価純資産は900,000円であった。Ｐ社（完全親会社）の個別財務諸表上、Ｓ社株式の取得原価を計上する仕訳を示しなさい（資本金を全額計上する）。',
    en_q:'Company P acquired 100% of Company S\'s shares via a share exchange, creating a wholly-owned parent-subsidiary relationship, issuing P shares as consideration. S\'s fair value net assets were ¥900,000. On P\'s (the wholly-owning parent\'s) individual financial statements, record the entry recognizing the cost of the S shares (crediting the full amount to Capital).',
    e:[{d:[['S社株式',900000]], c:[['資本金',900000]]}],
    exp:'株式交換は、合併のように会社そのものが1つになるわけではなく、「Ｓ社の株を全部Ｐ社の株と交換して、Ｓ社をＰ社の100％子会社にする」手続きです。合併と違い、Ｓ社の資産・負債を直接Ｐ社の帳簿に受け入れるのではなく、Ｐ社の個別財務諸表上は「Ｓ社株式」という投資（資産）を計上するだけにとどまります。Ｓ社の資産・負債は、後で連結財務諸表を作るときに合算されます。'
  },
  { id:743, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社とＳ社は株式移転により、共同で新設完全親会社Ｈ社を設立した。Ｈ社の個別財務諸表上、Ｐ社株式（時価1,200,000円）とＳ社株式（時価800,000円）を取得原価として計上し、資本金を全額計上する仕訳を示しなさい。',
    en_q:'Companies P and S jointly established a new wholly-owning parent company H via a share transfer. On H\'s individual financial statements, record the entry recognizing the cost of the P shares (fair value ¥1,200,000) and S shares (fair value ¥800,000) received, crediting the full amount to Capital.',
    e:[{d:[['P社株式',1200000],['S社株式',800000]], c:[['資本金',2000000]]}],
    exp:'株式移転は、既存の会社（Ｐ社・Ｓ社）ではなく、まったく新しい会社（Ｈ社）を作って、その新会社の下にＰ社とＳ社を完全子会社としてぶら下げる手続きです。株式交換が「既存の会社同士」で行うのに対し、株式移転は「新会社を作る」点が違います。新設されたＨ社の個別財務諸表には、Ｐ社株式とＳ社株式という2つの投資（資産）が計上され、対応する金額が資本金になります。'
  },
  { id:744, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業部門（時価：資産1,500,000円・負債800,000円）を吸収分割によりＳ社へ移転し、対価としてＳ社株式700,000円を受け取った。Ｐ社（分割会社）の仕訳を示しなさい。',
    en_q:'Company P transferred one of its business segments (fair value: assets ¥1,500,000, liabilities ¥800,000) to Company S via a company split, receiving S shares worth ¥700,000 as consideration. Record the entry on P\'s (the splitting company\'s) books.',
    e:[{d:[['諸負債',800000],['S社株式',700000]], c:[['諸資産',1500000]]}],
    exp:'会社分割は「事業（資産と負債のセット）を丸ごと他社へ渡す」手続きです。渡す側（分割会社＝Ｐ社）は、移転する資産・負債を帳簿から取り除き、代わりに受け取った対価（Ｓ社株式）を計上します。移転する純資産（時価）：1,500,000－800,000＝700,000円。今回は対価700,000円とちょうど同額なので、差益・差損は生じません。'
  },
  { id:745, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｓ社は、Ｐ社の一事業部門（時価：資産1,500,000円・負債800,000円）を吸収分割により承継し、対価としてＳ社株式700,000円をＰ社に交付した。Ｓ社（承継会社）の仕訳を示しなさい（増加する資本金は全額資本金とする）。',
    en_q:'Company S received a business segment from Company P (fair value: assets ¥1,500,000, liabilities ¥800,000) via a company split, issuing S shares worth ¥700,000 to P as consideration. Record the entry on S\'s (the receiving company\'s) books (the full increase is credited to Capital).',
    e:[{d:[['諸資産',1500000]], c:[['諸負債',800000],['資本金',700000]]}],
    exp:'前問の「渡す側」に対して、こちらは「受け取る側」（承継会社＝Ｓ社）の仕訳です。受け入れた資産・負債をそのまま計上し、対価として交付した自社株式の分だけ資本金を増やします。合併の仕訳とよく似ていますが、合併は「会社そのもの」を丸ごと受け入れるのに対し、会社分割は「特定の事業だけ」を切り出して受け入れる点が違います。'
  },
  { id:746, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業（帳簿価額：資産2,000,000円・負債1,200,000円）を、Ｓ社へ事業譲渡し、対価として現金900,000円を受け取った。事業譲渡益（または損）を含めた仕訳を示しなさい。',
    en_q:'Company P sold one of its businesses (book value: assets ¥2,000,000, liabilities ¥1,200,000) to Company S for ¥900,000 cash. Record the entry, including the gain (or loss) on the business sale.',
    e:[{d:[['諸負債',1200000],['現金',900000]], c:[['諸資産',2000000],['事業譲渡益',100000]]}],
    exp:'事業譲渡は、株式のやり取りではなく「現金など」を対価とする点が会社分割と違います（会社分割は原則株式が対価、事業譲渡は現金などの財産が対価）。譲渡する事業の帳簿価額（純資産）：2,000,000－1,200,000＝800,000円。受け取った現金900,000円との差額100,000円は「事業譲渡益」（収益）として計上します。'
  },
  { id:747, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｓ社はＰ社から一事業（時価：資産2,200,000円・負債1,200,000円）を事業譲受し、対価として現金900,000円を支払った。負ののれんを含めた仕訳を示しなさい。',
    en_q:'Company S acquired a business from Company P (fair value: assets ¥2,200,000, liabilities ¥1,200,000), paying ¥900,000 cash as consideration. Record the entry, including any negative goodwill.',
    e:[{d:[['諸資産',2200000]], c:[['諸負債',1200000],['現金',900000],['負ののれん発生益',100000]]}],
    exp:'事業を譲り受ける側（Ｓ社）の仕訳です。受け入れる純資産（時価）：2,200,000－1,200,000＝1,000,000円。支払った対価は900,000円で、受け入れた純資産の方が100,000円多いので「お買い得」＝負ののれん発生益（収益）を計上します。事業譲渡・会社分割・合併のどれでも、「対価＜受け入れた純資産」なら負ののれん発生益、「対価＞受け入れた純資産」ならのれん、という判定方法は共通です。'
  },
  { id:748, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は完全子会社であるＳ社（帳簿価額：諸資産1,000,000円・諸負債600,000円）を吸収合併した。共通支配下の取引に該当するため、Ｓ社の資産・負債は帳簿価額で引き継ぐ。合併の仕訳を示しなさい（増加する資本金はゼロとし、差額はその他資本剰余金とする）。',
    en_q:'Company P absorbed its wholly-owned subsidiary S (book values: assets ¥1,000,000, liabilities ¥600,000) in a merger. As this is a transaction under common control, S\'s assets and liabilities are carried over at book value. Record the merger entry (no increase to Capital; the difference is credited to Other Capital Surplus).',
    e:[{d:[['諸資産',1000000]], c:[['諸負債',600000],['その他資本剰余金',400000]]}],
    exp:'すでに100％子会社になっている会社を合併する場合は「グループ内部の組織再編」に過ぎず、グループ外の視点では何も変わっていません（これを「共通支配下の取引」と言います）。そのため、通常の合併のように時価評価をしたり、のれんを計算したりはせず、Ｓ社の資産・負債を帳簿価額のまま、そっくりそのままＰ社に移すだけです。差額（1,000,000－600,000＝400,000円）は「のれん」ではなく「その他資本剰余金」として処理します。「グループ内の引っ越しなので、儲け・損は発生しない」というイメージです。'
  },
  { id:749, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併するにあたり、新株の交付事務費用（印刷費・証券会社手数料等）80,000円を現金で支払った。株式交付費として計上する仕訳を示しなさい。',
    en_q:'In connection with absorbing Company S, Company P paid ¥80,000 cash for share-issuance administrative costs (printing, brokerage fees, etc.). Record the entry recognizing this as share issuance costs.',
    e:[{d:[['株式交付費',80000]], c:[['現金',80000]]}],
    exp:'合併や増資で新しく株式を発行するときにかかる事務費用（印刷代・証券会社への手数料など）は「株式交付費」という勘定で処理します。似た名前の「取得関連費用」（弁護士・会計士への相談料）は必ずその場で費用にしますが、株式交付費は一定の要件のもとで資産計上して数年かけて償却することも認められています。「M&Aの相談料」と「株式発行の事務費用」は名前は似ていますが別物、と覚えておきましょう。'
  },
  { id:800, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併するにあたり、デューデリジェンス費用（弁護士・公認会計士への報酬）50,000円を現金で支払った。取得関連費用の会計処理として、発生時に費用処理する仕訳を示しなさい。',
    en_q:'In connection with absorbing Company S, Company P paid ¥50,000 cash for due diligence fees (legal and accounting advisory fees). Record the entry expensing these acquisition-related costs as incurred.',
    e:[{d:[['支払手数料',50000]], c:[['現金',50000]]}],
    exp:'企業結合にかかる取得関連費用（デューデリジェンス費用、アドバイザリー報酬など）は、取得原価（のれんの計算に含める金額）には含めず、発生した期の費用として処理します。「のれんは買収対象そのものの価値に対して払った超過額であり、手続きにかかった事務コストとは性質が違う」という考え方です。前問（株式交付費）とは異なる勘定科目（支払手数料）を使う点に注意しましょう。'
  },
  { id:801, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、対価として現金600,000円に加え、Ｓ社の将来の業績目標達成を条件とする条件付取得対価（アーンアウト、公正価値50,000円）を計上した。引き継いだＳ社の資産・負債の時価は、諸資産900,000円・諸負債300,000円であった。合併時の仕訳を示しなさい。',
    en_q:"Company P absorbed Company S, paying ¥600,000 cash plus recognizing a contingent consideration (earnout, fair value ¥50,000) payable if S meets future performance targets. Fair values taken over: assets ¥900,000, liabilities ¥300,000. Record the merger entry.",
    e:[{d:[['諸資産',900000],['のれん',50000]], c:[['諸負債',300000],['現金',600000],['条件付取得対価',50000]]}],
    exp:'条件付取得対価（アーンアウト条項）とは、「将来、業績目標を達成したら追加で対価を払う」という約束です。この将来の支払義務も、企業結合時点の公正価値（見積額）で負債として認識し、取得原価（のれんの計算のもと）に含めます。対価総額：現金600,000円＋条件付取得対価50,000円＝650,000円。引き継いだ純資産600,000円との差額50,000円がのれんです。'
  },
  { id:802, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'上記の条件付取得対価（当初の公正価値50,000円）について、測定期間内（企業結合日から1年以内）に新たな情報が判明し、公正価値の見積りを70,000円に修正した。差額20,000円をのれんの調整として処理する仕訳を示しなさい。',
    en_q:'For the contingent consideration above (initial fair value ¥50,000), new information came to light within the measurement period (within one year of the acquisition date), revising the fair value estimate to ¥70,000. Record the entry treating the ¥20,000 difference as an adjustment to goodwill.',
    e:[{d:[['のれん',20000]], c:[['条件付取得対価',20000]]}],
    exp:'企業結合日時点で入手可能だった情報に基づく見積りの修正が「測定期間」（原則1年以内）中に生じた場合、その修正はのれんの金額を直接調整します（過去に遡って、企業結合時点の見積りが違っていたと考えるイメージ）。測定期間を過ぎてからの見積り変更は、のれんを調整せず、その期の損益として処理する点が対照的です（次問参照）。'
  },
  { id:803, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'上記の条件付取得対価（帳簿価額70,000円）について、測定期間経過後に業績目標の達成状況が確定し、実際の支払額が90,000円となった。差額20,000円を損益として処理する仕訳を示しなさい。',
    en_q:'For the contingent consideration above (book value ¥70,000), after the measurement period ended, the actual performance outcome was determined and the amount payable became ¥90,000. Record the entry recognizing the ¥20,000 difference in profit or loss.',
    e:[{d:[['条件付取得対価',70000],['取得対価精算損',20000]], c:[['未払金',90000]]}],
    exp:'測定期間を過ぎてから条件付取得対価の金額が確定・変動した場合は、企業結合時点の見積りをさかのぼって修正するのではなく、確定した期の「損益」として処理します。負債（条件付取得対価）70,000円を取り崩し、実際に支払うことになった90,000円との差額20,000円を費用（取得対価精算損）として計上します。'
  },
  { id:804, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業部門（帳簿価額：資産1,200,000円・負債500,000円）を新設分割により、新たに設立するＴ社へ移転した。Ｔ社の資本金は全額この移転による純資産額とする。Ｔ社（新設会社）側の仕訳を示しなさい。',
    en_q:'Company P transferred one of its business segments (book value: assets ¥1,200,000, liabilities ¥500,000) to newly-established Company T via a newly-formed company split. T\'s Capital equals the full net assets transferred. Record the entry on T\'s (the newly-formed company\'s) books.',
    e:[{d:[['諸資産',1200000]], c:[['諸負債',500000],['資本金',700000]]}],
    exp:'新設分割は、既存の会社（吸収分割の場合のＳ社）ではなく、新しく設立する会社に事業を移転する会社分割の方法です。受け入れ側（新設されたＴ社）の処理は、吸収分割の承継会社の場合と基本的に同じで、引き継いだ資産・負債をそのまま計上し、対応する分を資本金として計上します。「既存の会社に事業を渡すか、新しい会社を作って渡すか」が吸収分割と新設分割の違いで、会計処理の基本パターンは共通です。'
  },
  { id:805, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'上記のＰ社（分割会社）は、新設分割によりＴ社株式700,000円を受け取った。Ｐ社側の仕訳を示しなさい。',
    en_q:"For Company P (the splitting company) above, record the entry recognizing the ¥700,000 of T shares received as consideration for the newly-formed company split.",
    e:[{d:[['諸負債',500000],['T社株式',700000]], c:[['諸資産',1200000]]}],
    exp:'事業を渡す側（分割会社＝Ｐ社）は、移転した資産・負債を帳簿から取り除き、対価として受け取った新設会社の株式（Ｔ社株式）を投資として計上します。吸収分割の分割会社の処理と同じ考え方です。'
  },
  { id:806, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は他社と共同で、新会社（共同支配企業）Ｊ社を設立するにあたり、現金300,000円を出資した。Ｐ社の持分比率は40％で、重要な影響力を有するに留まる（支配は獲得しない）。持分法を適用する場合のＰ社の仕訳を示しなさい。',
    en_q:'Company P contributed ¥300,000 cash to jointly establish new company J (a jointly-controlled entity) with another company. P\'s ownership is 40%, giving it significant influence but not control. Record the entry under the equity method.',
    e:[{d:[['関係会社株式',300000]], c:[['現金',300000]]}],
    exp:'複数の会社が共同で支配する企業（共同支配企業、ジョイントベンチャー）は、単独では支配していないため、通常の子会社のように連結せず、「持分法」（投資の額を、相手の業績に応じて増減させる方法）を適用します。出資時点では、単純に出資額を「関係会社株式」として計上するだけで、通常の子会社株式取得や合併のような、のれんの計算は行いません（持分法ではのれん相当額は投資額に含まれたまま個別に区分しません）。'
  },
  { id:807, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は、あらかじめ保有していたＳ社株式（帳簿価額200,000円）に加え、Ｓ社を吸収合併した。合併により交付した新株の時価は600,000円、引き継いだＳ社の資産（時価1,800,000円）・負債（時価1,050,000円）であった。①抱合せ株式の評価替え（帳簿価額200,000円→時価250,000円）②合併の仕訳（新株の時価600,000円＋評価後の抱合せ株式250,000円＝取得原価850,000円）をそれぞれ示しなさい。',
    en_q:"Company P absorbed Company S, having already held S shares (book value ¥200,000) before the merger. The fair value of newly-issued shares was ¥600,000; S's assets (fair value ¥1,800,000) and liabilities (fair value ¥1,050,000) were taken over. Record ①the revaluation of the pre-existing (\"tote-awase\") shares from book value ¥200,000 to fair value ¥250,000, and ②the merger entry (acquisition cost = new shares ¥600,000 + revalued pre-existing shares ¥250,000 = ¥850,000).",
    e:[{d:[['S社株式',50000]], c:[['抱合せ株式評価益',50000]]}, {d:[['諸資産',1800000],['のれん',100000]], c:[['諸負債',1050000],['資本金',600000],['S社株式',250000]]}],
    exp:'「抱合せ株式」とは、合併する前からすでに保有していた、合併される側（Ｓ社）の株式のことです。合併にあたっては、①まずこの抱合せ株式を合併時点の時価（250,000円）に評価替えし、帳簿価額との差額（50,000円）を「抱合せ株式評価益」として損益に計上します。②その上で、合併の取得原価は「新たに交付した株式の時価（600,000円）」＋「評価替え後の抱合せ株式（250,000円）」＝850,000円となります。これと引き継いだＳ社の時価純資産750,000円（1,800,000－1,050,000）との差額100,000円がのれんです。「もともと持っていた株式も、対価の一部として合併の取得原価に含める」という点が抱合せ株式の処理のポイントです。'
  },
  { id:808, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併した。合併対価は現金1,000,000円。引き継いだＳ社の資産・負債の時価は、諸資産600,000円・諸負債200,000円に加え、新たに識別された顧客関連資産（無形資産）150,000円が認められた。合併の仕訳を示しなさい。',
    en_q:"Company P absorbed Company S for ¥1,000,000 cash. Fair values taken over were: assets ¥600,000, liabilities ¥200,000, plus a newly identified customer-related intangible asset of ¥150,000. Record the merger entry.",
    e:[{d:[['諸資産',600000],['顧客関連資産',150000],['のれん',450000]], c:[['諸負債',200000],['現金',1000000]]}],
    exp:'企業結合では、対象会社の資産・負債を時価評価して引き継ぎますが、その際、対象会社の個別財務諸表には計上されていなかった無形資産（顧客関連資産・商標権・技術関連資産など）が新たに識別されることがあります（PPA：Purchase Price Allocation、取得原価の配分）。今回は「顧客関連資産」150,000円が新たに認識されました。のれんは、対価1,000,000円から、識別可能純資産（諸資産600,000＋顧客関連資産150,000－諸負債200,000＝550,000円）を差し引いた450,000円です。識別可能な無形資産をきちんと分離して計上するほど、のれん（正体不明の超過収益力）の金額は小さくなる、という関係を理解しておきましょう。'
  },
  { id:809, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はすでにＳ社株式60％を保有していたが、残り40％の少数株主から株式交換によりＳ社を完全子会社化した。交付したＰ社株式の時価は400,000円であった。会社法の規定により、増加する払込資本のうち半額を資本金、残り半額を資本準備金とする場合のＰ社個別財務諸表上の仕訳を示しなさい。',
    en_q:'Company P already held 60% of Company S, and acquired the remaining 40% from minority shareholders via a share exchange to make S a wholly-owned subsidiary. The fair value of P shares issued was ¥400,000. Under the Companies Act, half of the increase in paid-in capital is credited to Capital and half to Capital Surplus. Record the entry on P\'s individual financial statements.',
    e:[{d:[['S社株式',400000]], c:[['資本金',200000],['資本準備金',200000]]}],
    exp:'すでに子会社化している会社の残りの株式（非支配株主の持分）を株式交換で取得するケースです。個別財務諸表上は、通常の株式交換と同じく「Ｓ社株式」という投資を追加取得したものとして計上します。会社法上、新株発行の対価は全額を資本金にする必要はなく、その一部（最大半額）を「資本準備金」とすることができます。今回は半分ずつとする指示なので、400,000円を200,000円ずつ資本金と資本準備金に計上します。'
  },

  // ===== 1級：金融商品会計（デリバティブ・ヘッジ会計） =====
  { id:750, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は国債先物の取引を行うため、証券会社に先物取引差入証拠金50,000円を現金で差し入れた。この取引の仕訳を示しなさい。',
    en_q:'Company X deposited ¥50,000 cash with a securities firm as a margin deposit (先物取引差入証拠金) to trade government bond futures. Record this entry.',
    e:[{d:[['先物取引差入証拠金',50000]], c:[['現金',50000]]}],
    exp:'先物取引は「将来の一定時点で、あらかじめ決めた価格で売買する」契約です。実際に売買するまでの間、証券会社に担保として証拠金を預けます。証拠金はまだ損益が確定したわけではなく、後で返ってくる「預け金」的な性質なので、資産の勘定科目（先物取引差入証拠金）として計上します。'
  },
  { id:751, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は保有する国債先物について、決算日に時価評価を行ったところ、契約時と比べて50,000円値上がりしていることが判明した。決算時の評価替えの仕訳を示しなさい。',
    en_q:'At fiscal year-end, Company X marked its government bond futures position to market and found the value had risen ¥50,000 since the contract date. Record the year-end revaluation entry.',
    e:[{d:[['先物取引差金',50000]], c:[['先物損益',50000]]}],
    exp:'デリバティブ（先物・オプション・スワップなど）は原則として「時価評価」が強制され、評価差額はその期の損益として即座に計上します（これは他の有価証券と大きく違う点です）。値上がり分は「先物取引差金」という資産（未収の含み益）を計上し、相手科目として「先物損益」という収益（デリバティブ評価損益）を計上します。'
  },
  { id:752, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社はコール・オプションを30,000円で購入し、代金を現金で支払った。オプション取得時の仕訳を示しなさい。',
    en_q:'Company X purchased a call option for ¥30,000 cash. Record the entry at the time of acquiring the option.',
    e:[{d:[['オプション資産',30000]], c:[['現金',30000]]}],
    exp:'オプション（権利）を買うために支払った金額（オプション料）は、「その権利を将来行使できる」という価値を持つ資産なので、「オプション資産」として計上します。まだ権利を行使していない段階では、損益は一切発生しません。'
  },
  { id:753, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社が保有するオプション（取得原価30,000円）について、決算日の時価は45,000円であった。決算時の評価替えの仕訳を示しなさい。',
    en_q:"Company X's option (cost ¥30,000) had a fair value of ¥45,000 at fiscal year-end. Record the year-end revaluation entry.",
    e:[{d:[['オプション資産',15000]], c:[['オプション差損益',15000]]}],
    exp:'オプションも先物と同様、決算日には時価評価が必要です。時価（45,000円）と帳簿価額（30,000円）との差額15,000円だけ「オプション資産」を増額し、相手科目として評価損益（オプション差損益）を計上します。値下がりしていれば逆に評価損を計上します。'
  },
  { id:754, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は将来の外貨建取引に備えて為替予約（ヘッジ手段）を締結し、繰延ヘッジ会計を適用している。決算日において、この為替予約の時価評価益が30,000円生じた。税効果を考慮しない場合の仕訳を示しなさい。',
    en_q:"Company X entered into a forward foreign exchange contract as a hedge for a future foreign-currency transaction and applies deferred hedge accounting. At fiscal year-end, the forward contract's fair value gain was ¥30,000. Record the entry, ignoring tax effects.",
    e:[{d:[['為替予約',30000]], c:[['繰延ヘッジ損益',30000]]}],
    exp:'「繰延ヘッジ会計」とは、ヘッジ手段（為替予約など）の評価損益を、対象となる取引（ヘッジ対象）が実際に発生するまで損益計算書に出さず、純資産の部（その他包括利益）に一旦保留しておく方法です。評価益が出ても「収益」にはせず、「繰延ヘッジ損益」という純資産の科目に振り替えます。ヘッジ対象の取引が実際に発生した時点で、初めて損益として実現させます。'
  },
  { id:755, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は上記と同様の為替予約について繰延ヘッジ会計を適用しており、決算日の時価評価益は30,000円であった。実効税率30％として税効果会計を適用した場合の仕訳を示しなさい。',
    en_q:'For the same forward contract under deferred hedge accounting, the fair value gain at fiscal year-end was ¥30,000. Record the entry applying tax-effect accounting at an effective tax rate of 30%.',
    e:[{d:[['為替予約',30000]], c:[['繰延税金負債',9000],['繰延ヘッジ損益',21000]]}],
    exp:'繰延ヘッジ損益は純資産に計上される項目ですが、この評価益は将来課税対象になる（税金を増やす）含み益なので、税効果会計を適用して「繰延税金負債」（将来支払う税金）を認識します。評価益30,000円のうち、税金相当額9,000円（30,000×30％）を繰延税金負債として差し引き、残り21,000円を税引後の金額として繰延ヘッジ損益（純資産）に計上します。'
  },
  { id:756, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社はその他有価証券（帳簿価額200,000円）について、時価下落リスクをヘッジするためデリバティブ取引を行い、時価ヘッジ会計を適用している。決算日において、その他有価証券の時価が40,000円下落し、ヘッジ手段であるデリバティブの評価益が40,000円生じた。①その他有価証券の評価替えと②デリバティブの評価替えの仕訳をそれぞれ示しなさい。',
    en_q:"Company X applies fair value hedge accounting to hedge the price-decline risk of available-for-sale securities (book value ¥200,000) using a derivative. At fiscal year-end, the securities' fair value fell by ¥40,000 while the hedging derivative recorded a ¥40,000 valuation gain. Record (1) the securities revaluation and (2) the derivative revaluation.",
    e:[{d:[['投資有価証券評価損',40000]], c:[['その他有価証券',40000]]}, {d:[['デリバティブ資産',40000]], c:[['有価証券評価益',40000]]}],
    exp:'「時価ヘッジ会計」は繰延ヘッジと違い、ヘッジ対象（その他有価証券）の評価損益も、ヘッジ手段（デリバティブ）の評価損益も、両方ともその期の損益として計上する方法です。その他有価証券の評価差額は通常「純資産直入」ですが、時価ヘッジを適用すると例外的に損益計算書を通します。値下がり損40,000円と、デリバティブの値上がり益40,000円が同時に計上されるため、両者が相殺され、ヘッジの効果（リスクを打ち消す）が損益計算書上でも見える化されます。'
  },
  { id:757, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は満期保有目的で他社社債（額面2,000,000円、額面より安く取得）を保有している。当期のクーポン利息の受取額は20,000円であり、実効利子率法によって計算された金利調整差額（取得差額）の償却額は8,500円であった。利息法による当期の有価証券利息計上の仕訳を示しなさい。',
    en_q:"Company X holds another company's bonds (face value ¥2,000,000, acquired below face value) as held-to-maturity securities. This period's coupon interest received was ¥20,000, and the amortization of the acquisition discount computed under the effective interest method was ¥8,500. Record this period's bond interest entry using the effective interest method.",
    e:[{d:[['現金',20000],['満期保有目的債券',8500]], c:[['有価証券利息',28500]]}],
    exp:'満期保有目的の債券を額面より安く取得した場合、その差額（金利調整差額）は「実質的な利息」の一部とみなされ、満期までの期間にわたって毎期コツコツ償却（帳簿価額に加算）していきます（＝利息法）。クーポン利息20,000円に加えて、償却額8,500円も「有価証券利息」という収益に含めます。償却した分は現金では受け取っていないため、相手科目は現金ではなく「満期保有目的債券」（帳簿価額を増やす）になります。'
  },
  { id:758, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は取引先Ｙ社に対する貸付金1,000,000円について、Ｙ社の財政状態が著しく悪化したため、貸倒懸念先として個別に将来キャッシュ・フローを見積り、貸倒引当金150,000円を計上することとした。決算時の仕訳を示しなさい。',
    en_q:"Company X holds a ¥1,000,000 loan receivable from Company Y. Because Y's financial condition has significantly deteriorated, X classifies it as a doubtful claim, estimates future cash flows individually, and recognizes an allowance for doubtful accounts of ¥150,000. Record the year-end entry.",
    e:[{d:[['貸倒引当金繰入',150000]], c:[['貸倒引当金',150000]]}],
    exp:'金融商品会計基準では、金銭債権を「一般債権」「貸倒懸念債権」「破産更生債権等」の3区分に分けて評価します。貸倒懸念先（経営破綻はしていないが返済に重大な問題がある先）については、個別に将来キャッシュ・フローを見積り、その現在価値と債権額との差額を貸倒引当金として計上します（キャッシュ・フロー見積法）。費用側は「貸倒引当金繰入」、資産のマイナスとして「貸倒引当金」を計上します。'
  },
  { id:759, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は転換社債型新株予約権付社債（額面1,000,000円）を発行し、払込金額1,000,000円を現金で受け取った。区分法により、社債の対価部分950,000円・新株予約権の対価部分50,000円に区分して処理する。発行時の仕訳を示しなさい。',
    en_q:'Company X issued convertible bonds with warrants (face value ¥1,000,000) and received ¥1,000,000 in cash. Under the split method, ¥950,000 is allocated to the bond (liability) component and ¥50,000 to the warrant (equity) component. Record the issuance entry.',
    e:[{d:[['現金',1000000]], c:[['社債',950000],['新株予約権',50000]]}],
    exp:'転換社債型新株予約権付社債は「社債（負債）」と「新株予約権（将来株式に転換できる権利＝純資産）」がセットになった複合金融商品です。「区分法」では、払込金額を合理的な基準で社債部分と新株予約権部分に分けて、それぞれ別の勘定科目（負債と純資産）で計上します（両方をまとめて「社債」で計上する「一括法」という方法もあります）。'
  },
  { id:760, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は上記の転換社債型新株予約権付社債（社債部分の帳簿価額950,000円・新株予約権50,000円）について、社債権者からの請求により全額が株式に転換された。増加する資本金は全額とする場合の仕訳を示しなさい。',
    en_q:'The bondholder exercised the conversion right on the entire convertible bond above (bond component book value ¥950,000, warrants ¥50,000). Record the conversion entry, assuming the full amount is credited to Common Stock.',

  { id:814, level:3, cat:'金融商品', chap:'1級：金融商品',

    q:'Ｘ社は為替予約についてヘッジ会計を適用していたが、ヘッジ対象であった外貨建取引が中止になったため、ヘッジ会計の要件を満たさなくなった。繰延べていた繰延ヘッジ損益（貸方残高）40,000円を、ただちに当期の損益（為替差損益）に振り替える仕訳を示しなさい。',
    en_q:'Company X applied hedge accounting to a forward contract, but the hedged foreign-currency transaction was cancelled, so the hedge accounting requirements are no longer met. Record the entry immediately reclassifying the deferred hedge gain (¥40,000 credit balance) into current-period profit or loss (foreign exchange gain/loss).',

    en_q:'Company X issued convertible bonds with warrants (face value ¥1,000,000) and received ¥1,000,000 cash. Under the single-instrument method, the bond and warrant are not separated and the entire amount is recorded as a bond. Record the issuance entry.',

    exp:'転換社債型新株予約権付社債の会計処理には、社債部分と新株予約権部分を分けて計上する「区分法」（すでに学んだ方法）のほかに、区分せず全額を社債として一括計上する「一括法」があります。一括法では、払込金額の全額をそのまま「社債」（負債）として計上するだけで、新株予約権（純資産）は計上しません。どちらの方法を採用するかは会社の任意ですが、区分法の方が「負債性の部分」と「資本性の部分」を明確に分けられるため、実務ではより多く使われています。'
