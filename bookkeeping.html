    en_q:"In Company X's head-office/factory accounting, at year-end the head office's \"Factory\" account had an ¥800,000 debit balance, matching the factory's \"Head Office\" account ¥800,000 credit balance. When preparing combined financial statements, record the entry eliminating this internal transaction.",
    e:[{d:[['本社',800000]], c:[['工場',800000]]}],
    exp:'本社工場会計では、本社の「工場」勘定と工場の「本社」勘定は、通常、常に同額（貸借逆）になっているはずです（内部取引のたびにセットで記帳しているため）。まるで家計簿の「貸した」「借りた」がぴったり一致するのを確認するようなイメージで、合算した財務諸表（本社と工場を1つにまとめたもの）を作成する際は、この内部取引専用の勘定（照合勘定）を相殺消去し、外部から見える金額だけを残します。連結会計における債権債務の相殺消去と同じ考え方が、本社工場会計にも当てはまります。'
  },
  { id:878, level:2, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は事業部制を採用しており、<mark class="q-asset">Ａ事業部はＢ事業部へ部品を全部原価（製造原価）400,000円で振り替えた</mark>。振替価格に利益を加算しない場合の①Ａ事業部側②Ｂ事業部側の仕訳を示しなさい。',
    en_q:'Company X uses a divisional structure. Division A transferred parts to Division B at full cost (manufacturing cost) of ¥400,000, with no profit markup on the transfer price. Record the entries on (1) Division A\'s books and (2) Division B\'s books.',
    e:[{d:[['B事業部',400000]], c:[['製品',400000]]}, {d:[['材料',400000]], c:[['A事業部',400000]]}],
    exp:'全部原価基準による振替は、振り渡す事業部（Ａ事業部）が製造原価のまま、利益を一切乗せずに振り替える方法です。まるで社内の別部署に材料を「原価そのまま」で融通するイメージで、Ａ事業部にとっては利益がゼロなので、業績評価の観点からは不満が残る場合がありますが、グループ全体で見れば最もシンプルで、内部利益の消去も不要という利点があります。「A事業部」「B事業部」という勘定は、本社工場会計の「本社」「工場」勘定と同じ、事業部間の内部取引を管理するための照合勘定です。'
  },
  { id:879, level:3, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社のＡ事業部は、<mark class="q-revenue">外部市場での販売価格（市価）500,000円</mark>（<mark class="q-expense">原価400,000円</mark>）でＢ事業部へ製品を振り替えた。Ａ事業部側の仕訳を示しなさい。',
    en_q:"Company X's Division A transferred products to Division B at the external market price of ¥500,000 (cost ¥400,000). Record the entry on Division A's books.",
    e:[{d:[['B事業部',500000]], c:[['製品振替収益',500000]]}, {d:[['売上原価',400000]], c:[['製品',400000]]}],
    exp:'市価基準による振替は、外部の市場価格をそのまま使って事業部間の取引を行う方法です。まるで社内の別部署にも「外部のお客さんと同じ値段」で売るようなイメージで、Ａ事業部からみれば、外部に売ったのと同じように「収益」（製品振替収益）を認識でき、原価との差額100,000円が事業部の利益として業績評価に反映されます。ただし、Ｂ事業部にとっては外部から買うのと同じコストがかかるため、グループ全体で見ると「内部利益」が生じている点に注意が必要です（決算時の消去は別問参照）。'
  },
  { id:880, level:2, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＢ事業部は、<mark class="q-asset">Ａ事業部から振替価格500,000円で製品を受け入れた</mark>。Ｂ事業部側の仕訳を示しなさい。',
    en_q:"Division B above received products from Division A at the transfer price of ¥500,000. Record the entry on Division B's books.",
    e:[{d:[['材料',500000]], c:[['A事業部',500000]]}],
    exp:'受け入れる側（Ｂ事業部）は、外部から購入する場合と同じように、振替価格（500,000円）をそのまま材料の取得原価として計上します。Ｂ事業部にとっては、この振替価格が外部購入価格と同じかどうかに関わらず、実際に負担した金額として処理する点がポイントです。振替価格の決め方（全部原価・市価・交渉価格）が違っても、受け入れ側の処理そのものは変わりません。'
  },
  { id:881, level:3, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記の取引について、決算時点でＢ事業部がＡ事業部から受け入れた製品（振替価格500,000円、原価400,000円相当）のうち、300,000円分（原価240,000円相当）がまだ外部に販売されずＢ事業部の在庫として残っていた。<mark class="q-expense">この未実現の内部利益を消去する</mark>仕訳を示しなさい。',
    en_q:"At year-end, of the products Division B received from Division A (transfer price ¥500,000, cost ¥400,000), ¥300,000 (at transfer price; cost ¥240,000) remained unsold in Division B's inventory. Record the entry eliminating the unrealized internal profit.",
    e:[{d:[['内部利益控除',60000]], c:[['繰延内部利益',60000]]}],
    exp:'市価基準や原価に利益を上乗せする方式で事業部間の振替を行うと、受け入れた事業部の在庫にまだ売れ残りがある場合、そこに含まれる内部利益（グループ全体では実現していない利益）を、連結財務諸表や合算財務諸表を作成する際に消去する必要があります。本社工場会計で学んだ「内部利益控除」「繰延内部利益」と全く同じ処理です。300,000円×20％（利益率）＝60,000円が未実現の内部利益です。'
  },
  { id:882, level:3, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社のＡ事業部とＢ事業部は、事業部間の交渉により<mark class="q-revenue">振替価格を450,000円</mark>（<mark class="q-expense">Ａ事業部の原価400,000円</mark>、市価500,000円の中間）に合意した。Ａ事業部側の仕訳を示しなさい。',
    en_q:"Divisions A and B of Company X negotiated a transfer price of ¥450,000 (between Division A's cost of ¥400,000 and the market price of ¥500,000). Record the entry on Division A's books.",
    e:[{d:[['B事業部',450000]], c:[['製品振替収益',450000]]}, {d:[['売上原価',400000]], c:[['製品',400000]]}],
    exp:'交渉価格基準は、全部原価（400,000円）と市価（500,000円）の間で、事業部同士が話し合って振替価格を決める方法です。まるで社内の2つのチームが「お互い納得できる値段」を話し合って決めるようなイメージで、今回は中間の450,000円で合意しました。Ａ事業部の利益は50,000円（450,000－400,000）となり、全部原価基準（利益ゼロ）と市価基準（利益100,000円）の中間的な結果になります。「両事業部が納得できる価格を交渉で決める」という、実務でもよく使われる柔軟な方法です。'
  },
  { id:883, level:2, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社の決算時、<mark class="q-other">Ａ事業部元帳の「Ｂ事業部」勘定残高は450,000円（借方）、Ｂ事業部元帳の「Ａ事業部」勘定残高は450,000円（貸方）であった</mark>。合算財務諸表を作成するにあたり、この内部取引を相殺消去する仕訳を示しなさい。',
    en_q:"At year-end, Division A's \"Division B\" account had a ¥450,000 debit balance, matching Division B's \"Division A\" account ¥450,000 credit balance. When preparing combined financial statements, record the entry eliminating this internal transaction.",
    e:[{d:[['A事業部',450000]], c:[['B事業部',450000]]}],
    exp:'事業部制でも、本社工場会計と同様に、事業部間の内部取引を管理するための照合勘定（「Ａ事業部」「Ｂ事業部」）を使います。決算時に合算財務諸表を作る際は、グループ内部でのお金の動きに過ぎない部分（内部取引残高）を相殺消去し、外部との取引だけが財務諸表に反映されるようにします。事業部制であっても本社工場会計であっても、「内部取引は最終的に相殺してゼロにする」という考え方は共通です。'
  },

  // ===== PDF教材準拠（新版）差し替え開始 =====
  // --- 第1章：商品売買 ---
  { id:1001, cat:'商品売買', chap:'第1章：商品売買',
    q:'洗剤や日用品を小売店に卸しているX社は、洗剤メーカーのY社から、洗剤や柔軟剤などの<mark class="q-expense">商品100円分を購入</mark>して受け取った。<mark class="q-liability">代金は月末にまとめて支払う約束</mark>（<strong>掛け</strong>）になっている。仕訳を行いなさい。',
    e:[{d:[['仕入',100]],c:[['買掛金',100]]}],
    exp:'「掛け」とは、商品を受け取る時点では代金を払わず、後日まとめて支払う約束で取引することです。商品を受け取った瞬間に「仕入」という費用（＝会社の財産を使って得た対価）がすでに発生しているので、代金をまだ払っていなくても仕入は計上します。一方、「あとで払わなければならない」という義務は「買掛金」という負債（＝将来、他人に支払う義務）として記録します。費用（仕入）が増え、負債（買掛金）も増える、という組み合わせです。'
  },
  { id:1002, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、ドラッグストアチェーンのZ社に、洗剤などの<mark class="q-revenue">商品150円分を納品</mark>した。<mark class="q-asset">代金は翌月末に振り込んでもらう約束（掛け）になっている</mark>。仕訳を行いなさい。',
    e:[{d:[['売掛金',150]],c:[['売上',150]]}],
    exp:'商品を渡す時点では代金を受け取らず、後日まとめて受け取る約束で取引するのが「掛け」です。商品を渡した瞬間に「売上」という収益（＝会社の財産が増える原因になる出来事）が発生したと考えます。まだ代金を受け取っていない分は「売掛金」という資産（＝将来、お金を受け取れる権利）として記録します。収益（売上）が増え、資産（売掛金）も増える、という組み合わせです。'
  },
  { id:1003, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社から掛けで<mark class="q-expense">購入した商品</mark>のうち、注文とは違う種類の柔軟剤10円分が届いていたため、その分を送り返し、<mark class="q-liability">支払う代金</mark>から差し引いてもらうことにした。仕訳を行いなさい。',
    e:[{d:[['買掛金',10]],c:[['仕入',10]]}],
    exp:'商品を仕入先に返品すると、もともと計上していた仕入（費用）と買掛金（負債）を、その分だけ取り消す必要があります。「返品＝仕入れがなかったことにする」とイメージすると分かりやすく、仕入れたときとちょうど逆向きの仕訳（借方・貸方を入れ替えた仕訳）になります。買掛金（負債）が減り、仕入（費用）も減る、という組み合わせです。'
  },
  { id:1004, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に掛けで<mark class="q-revenue">納品した商品</mark>のうち、箱がつぶれた不良品が混じっていたため、Z社の申し出を受けて15円分の代金を引き下げ、Z社が<mark class="q-asset">支払う代金</mark>から差し引くことにした。商品はZ社がそのまま使用する。仕訳を行いなさい。',
    e:[{d:[['売上',15]],c:[['売掛金',15]]}],
    exp:'商品を返品してもらうわけではなく、品質の悪さを理由に代金を値引きするケースです。この場合、商品自体は動かないので在庫の仕訳はせず、単純に売上（収益）を値引き分だけ減らし、まだ受け取っていない代金の権利である売掛金（資産）も同額減らします。「売上を少し安くした分、将来受け取れるお金も少なくなる」という関係です。'
  },
  { id:1005, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社に洗剤100円分を注文し、契約の際に、代金の一部として<mark class="q-asset">20円を現金で先に渡した（内金）</mark>。商品はまだ届いていない。仕訳を行いなさい。',
    e:[{d:[['前払金',20]],c:[['現金',20]]}],
    exp:'「内金」とは、注文や契約を確実にするために、代金の一部を前もって渡すお金のことです。まだ商品を受け取っていない段階なので、この20円はまだ「仕入」という費用にはなりません。「将来、商品を受け取れる権利」として「前払金」という資産（＝将来、何かを受け取れる権利）で処理します。現金（資産）が前払金（資産）という形に姿を変えただけ、と考えると分かりやすいです。'
  },
  { id:1006, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社から洗剤など100円分の注文を受け、契約の際に、代金の一部として<mark class="q-asset">20円を現金で</mark><mark class="q-liability">先に受け取った（内金）</mark>。商品はまだ渡していない。仕訳を行いなさい。',
    e:[{d:[['現金',20]],c:[['前受金',20]]}],
    exp:'こちらは内金を受け取る側の処理です。まだ商品を渡していないので、受け取った20円はまだ「売上」という収益にはなりません。「将来、商品を渡さなければならない義務」として「前受金」という負債（＝将来、何かをしなければならない義務）で処理します。現金（資産）は増えますが、同時に「商品を渡す義務」という負債も増える、という組み合わせです。'
  },
  { id:1007, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社に対する<mark class="q-liability">月末払いの商品代金100円</mark>を<mark class="q-asset">現金で支払った</mark>。仕訳を行いなさい。',
    e:[{d:[['買掛金',100]],c:[['現金',100]]}],
    exp:'仕入れた時点ですでに「買掛金」という負債（＝後で払う義務）を計上済みです。今回はその約束を現金で果たしただけなので、新たに費用は発生しません。買掛金（負債）が消え、現金（資産）が減る、という単純な取引です。'
  },
  { id:1008, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に納品済みで<mark class="q-asset">まだ受け取っていなかった代金</mark>150円を、Z社から<mark class="q-asset">現金</mark>で受け取った。仕訳を行いなさい。',
    e:[{d:[['現金',150]],c:[['売掛金',150]]}],
    exp:'売り上げた時点ですでに「売掛金」という資産（＝後で受け取れる権利）を計上済みです。今回はその権利が実際の現金に変わっただけなので、新たに収益は発生しません。売掛金（資産）が減り、現金（資産）が増える、資産の中身が入れ替わるだけの取引です。'
  },
  { id:1009, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社から商品100円分を<mark class="q-liability">掛け</mark>で<mark class="q-expense">購入</mark>した。Y社の倉庫からX社の倉庫まで商品を運んでもらった運送会社への運賃5円は、X社が<mark class="q-asset">現金で支払った</mark>（<strong>引取運賃</strong>）。仕訳を行いなさい。',
    e:[{d:[['仕入',105]],c:[['買掛金',100],['現金',5]]}],
    exp:'「引取運賃」とは、購入した商品を、相手先から自社の倉庫まで運んでもらうための運賃のことです。商品を仕入れて使えるようになるまでにかかった費用は、すべて仕入（商品の取得コスト）に含めるのが原則なので、商品代金100円に運賃5円を足した105円を「仕入」として計上します。代金のうち100円は買掛金（負債）、運賃5円は現金払いなので現金（資産）の減少として処理します。'
  },
  { id:1010, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に商品100円分を<mark class="q-asset">掛け</mark>で<mark class="q-revenue">納品した</mark>。<mark class="q-expense">配送業者への発送費5円は</mark>、X社が<mark class="q-asset">現金で支払った</mark>（X社の負担）。仕訳を行いなさい。',
    e:[{d:[['売掛金',100],['発送費',5]],c:[['売上',100],['現金',5]]}],
    exp:'商品を売る側が負担する発送費は、商品そのものの売上とは別の性質の費用として「発送費」で処理します。売上代金100円は売掛金（資産）として計上し、自社が負担した発送費5円は現金（資産）の減少とあわせて費用（発送費）として計上します。売上の金額と発送費の金額を混ぜずに、別々に記録するのがポイントです。'
  },
  { id:1011, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に商品100円分を<mark class="q-asset">掛け</mark>で納品した。配送業者への発送費5円は、いったんX社が<mark class="q-asset">現金で支払った</mark>が、契約により、この発送費はZ社が負担することになっている（<strong>先方負担</strong>）。この発送費は、商品の代金とあわせてZ社に請求する。仕訳を行いなさい。',
    e:[{d:[['売掛金',105]],c:[['売上',100],['現金',5]]}],
    exp:'「先方負担」とは、相手の会社が費用を負担することです。発送費は一時的にX社が現金で立て替えましたが、最終的にはZ社に請求するため、X社にとっては費用にはなりません。売上代金100円と立て替えた発送費5円を合わせた105円を、まとめて売掛金（資産）として計上します。「自分の費用ではなく、相手への請求額の一部」として扱う点が、前の問題（自社負担）との大きな違いです。'
  },
  { id:1012, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社が本来負担すべき配送料5円を、<mark class="q-asset">Z社に立て替えて</mark>配送業者に<mark class="q-asset">現金で支払った</mark>。この配送料は、商品の代金とは別に、後でZ社に請求する。仕訳を行いなさい。',
    e:[{d:[['立替金',5]],c:[['現金',5]]}],
    exp:'前の問題と似ていますが、こちらは商品の代金とは別立てで、あとから改めてZ社に請求するケースです。この5円はX社の費用ではなく、「Z社の代わりに一時的に立て替えたお金」なので、「立替金」という資産（＝あとで返してもらえる権利）として記録します。現金（資産）が立替金（資産）という形に姿を変えた取引です。'
  },
  { id:1013, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社に対する<mark class="q-liability">未払いの商品代金100円</mark>について、<mark class="q-revenue">支払期日より早く支払ったため、Y社から3円の割引</mark>を受け、残りの97円を<mark class="q-asset">現金で支払った</mark>。仕訳を行いなさい。',
    e:[{d:[['買掛金',100]],c:[['現金',97],['仕入割引',3]]}],
    exp:'期日より早く支払ったお礼として代金を割引してもらうことがあります。これは商品そのものの値引きではなく、「早く払ったことへのご褒美」という金融的な性質のものなので、仕入の金額そのものを減らすのではなく「仕入割引」という収益（＝早期支払いによって得をした分）として区別して計上します。買掛金100円（負債）が消え、現金97円（資産）が減り、差額3円は仕入割引（収益）になります。'
  },
  { id:1014, cat:'商品売買', chap:'第1章：商品売買',
    q:'商品の売買を<strong>売上原価対立法</strong>で記帳しているX社は、Y社から<mark class="q-asset">商品100円分を購入</mark>し、代金は<mark class="q-asset">現金で支払った</mark>。仕訳を行いなさい。',
    e:[{d:[['商品',100]],c:[['現金',100]]}],
    exp:'「売上原価対立法」とは、商品と売上原価の2つの科目を使う記帳方法です。これまでの問題で使っていた「仕入」という費用科目は使わず、代わりに「商品」という資産科目で仕入れを記録します。つまり、商品を買った時点では費用にはならず、いったん資産（在庫）として計上しておくのがこの方法の特徴です。'
  },
  { id:1015, cat:'商品売買', chap:'第1章：商品売買',
    q:'商品の売買を<strong>売上原価対立法</strong>で記帳しているX社は、<mark class="q-expense">原価60円</mark>の<mark class="q-asset">商品</mark>を、Z社に<mark class="q-revenue">100円で売り</mark>、代金を<mark class="q-asset">現金で受け取った</mark>。仕訳を行いなさい。',
    e:[{d:[['現金',100],['売上原価',60]],c:[['売上',100],['商品',60]]}],
    exp:'売上原価対立法では、商品を売ったその瞬間に、売上（収益）の計上と同時に、売れた分の原価を「商品」という資産から取り除く処理もあわせて行います。売った値段100円を売上（収益）として計上し、同時に、売れた商品の仕入れ値60円分を資産（商品）から減らします。「売るたびに、在庫がその場でリアルタイムに減っていく」というイメージの記帳方法です。'
  },
  { id:1016, cat:'商品売買', chap:'第1章：商品売買',
    q:'雑貨を小売店に卸しているX社は、今期に開業したばかりで、前の期から持ち越した在庫はない。決算日の3月31日に倉庫の商品を実際に数えたところ（<strong>実地棚卸</strong>）、<mark class="q-asset">まだ売れていない商品</mark>が、<mark class="q-expense">仕入れたときの金額で30円分</mark>あった。同社は<strong>三分法</strong>で商品売買を記帳している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['繰越商品',30]],c:[['仕入',30]]}],
    exp:'「三分法」とは、商品売買を、仕入・繰越商品・売上の3つの科目に分けて記帳する方法です。「実地棚卸」とは、倉庫や店頭にある商品を実際に数えて、在庫の数量と金額を確認することです。期中は買った商品を全部「仕入」という費用に計上していますが、決算日にまだ売れ残っている分（30円）は、今期の費用にすべきではないので、仕入から取り除き、「繰越商品」という資産（＝来期に持ち越す在庫）に振り替えます。'
  },
  { id:1017, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、開業2年目の決算を迎えた。<mark class="q-asset">この期の初めには、前の期の決算で確認した売れ残りの商品30円分</mark><mark class="q-expense">が倉庫に残っていた</mark>。この期の決算日に倉庫の商品を実際に数えたところ（<strong>実地棚卸</strong>）、<mark class="q-asset">まだ売れていない商品</mark>が、<mark class="q-expense">仕入れたときの金額で40円分</mark>あった。同社は<strong>三分法</strong>で商品売買を記帳している。この期の決算に必要な仕訳を行いなさい。',
    e:[{d:[['仕入',30],['繰越商品',40]],c:[['繰越商品',30],['仕入',40]]}],
    exp:'2期目以降は、期首と期末の両方の在庫を調整する必要があります。①期首の在庫（前期末の繰越商品30円）は、今期の間に売れた可能性が高いので、いったん今期の仕入（費用）に足し戻します。②今期末に残っている在庫（40円）は、今期の費用から取り除き、新しく繰越商品（資産）として計上し直します。この「期首分を仕入に足す、期末分を仕入から引く」という2つの処理を合わせて行うことで、今期に実際に売れた分だけが正しく仕入（売上原価）として残ります。'
  },
  { id:1018, cat:'商品売買', chap:'第1章：商品売買',
    q:'文房具を一般のお客さんに売っているX社は、<mark class="q-liability">自社で発行する商品券50円分</mark>を売り出し、購入したお客さんから<mark class="q-asset">現金で50円を受け取った</mark>。仕訳を行いなさい。',
    e:[{d:[['現金',50]],c:[['商品券',50]]}],
    exp:'自社で発行する商品券を売ると、お客さんから現金を受け取りますが、この時点ではまだ商品を渡したわけではないので、売上（収益）にはなりません。「将来、商品券と引き換えに商品を渡さなければならない義務」として「商品券」という負債で処理します。現金（資産）が増える代わりに、将来の引き渡し義務（負債）も増える、という組み合わせです。'
  },
  { id:1019, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、お客さんに<mark class="q-revenue">商品30円分を引き渡し</mark>、代金として、商店街の<mark class="q-asset">別の店が発行した商品券</mark>30円分を受け取った。仕訳を行いなさい。',
    e:[{d:[['他店商品券',30]],c:[['売上',30]]}],
    exp:'自社が発行した商品券（前問）とは違い、他店が発行した商品券を代金として受け取った場合は「他店商品券」という別の資産科目で処理します。これは発行元の他店に持ち込めば換金してもらえる「他店に対する請求権」という意味の資産です。商品を渡したので売上（収益）はしっかり計上し、代金の受け取り方が現金ではなく商品券だった、という違いだけです。'
  },
  { id:1020, cat:'商品売買', chap:'第1章：商品売買',
    q:'Tシャツなどの衣料品を小売店に卸しているX社は、決算にあたり、倉庫の商品を実際に数えたところ（<mark class="q-asset">実地棚卸</mark>）、<mark class="q-expense">帳簿の上では10枚あるはずのTシャツが、実際には8枚</mark>しかなかった。このTシャツは1枚10円で仕入れたもので、枚数が減った原因はわからなかった。減った分について、決算に必要な仕訳を行いなさい。',
    e:[{d:[['棚卸減耗損',20]],c:[['繰越商品',20]]}],
    exp:'帳簿上は10枚あるはずなのに、実際に数えたら8枚しかなかった――この「数のズレ」から生じる損失を「棚卸減耗損」と呼びます。(10枚－8枚)×10円＝20円分、本来あるべき在庫が消えてしまったことになるので、資産である繰越商品を20円減らし、その分を費用（棚卸減耗損）として計上します。原因不明の目減りを、実際の数量に合わせて帳簿を修正する処理です。'
  },
  { id:1021, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、決算にあたり、<mark class="q-asset">期末に倉庫に残っていた</mark>Tシャツ8枚を確認した。このTシャツは1枚10円で仕入れたものだが、流行が過ぎて値崩れしたため、<mark class="q-expense">決算の時点で売れると見込まれる金額は1枚8円に下がっていた</mark>。決算に必要な仕訳を行いなさい。',
    e:[{d:[['商品評価損',16]],c:[['繰越商品',16]]}],
    exp:'「正味売却価額」とは、決算の時点で、その商品が売れると見込まれる金額のことです。「取得原価」とは、その商品を買ったときに支払った金額のことです。商品の数は合っていても、市場での値段（正味売却価額8円）が、仕入れたときの値段（取得原価10円）より下がってしまうことがあります。このまま仕入れた値段のまま資産計上していると、実態より高く見積もりすぎることになるため、下がった分（10円－8円＝2円×8枚＝16円）を商品評価損として費用計上し、繰越商品の金額を実態に合わせて引き下げます。'
  },
  { id:1022, cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、前の期の決算で、Tシャツの値崩れにより、<mark class="q-asset">期末の在庫</mark>の金額を<mark class="q-expense">16円分だけ引き下げ</mark>ていた。同社は<strong>洗替法</strong>を採用している。この期の初めに必要な仕訳を行いなさい。',
    e:[{d:[['繰越商品',16]],c:[['商品評価損',16]]}],
    exp:'「洗替法」とは、前の期の決算で評価替えした金額を、次の期の初めにいったん元の金額に戻す方法です（これに対して「切放法」は、戻さずにそのまま次の期に引き継ぐ方法です）。前期末に評価損として繰越商品を減らしていた16円を、新しい期が始まったタイミングでいったん元に戻す（逆仕訳をする）ことで、新しい期は「まっさらな状態」から改めて評価をやり直せるようにします。'
  },
  { id:1023, cat:'商品売買', chap:'第1章：商品売買',
    q:'本を一般のお客さんに売っているX社は、書籍100円分を、お客さんが<mark class="q-revenue">クレジットカードで支払う条件で販売した</mark>。カード会社（<strong>信販会社</strong>）へは、<mark class="q-expense">販売代金の2％を手数料</mark>として支払う契約になっており、この手数料は、商品を販売した時点で計上する。代金は、後日カード会社から受け取る。仕訳を行いなさい。',
    e:[{d:[['クレジット売掛金',98],['支払手数料',2]],c:[['売上',100]]}],
    exp:'「信販会社」とは、お客さんがカードで払った代金を、お客さんに代わって店に支払い、後でお客さんから回収する会社のことです。クレジットカード払いでは、実際にお金をくれるのはお客さんではなくカード会社です。カード会社に払う手数料（100円×2％＝2円）は販売した時点で確定する費用（支払手数料）として計上し、手数料を差し引いた残り98円を「クレジット売掛金」という資産（＝カード会社から受け取れる権利）として計上します。売上そのものは値引きせず、全額100円を計上する点がポイントです。'
  },
  // --- 収益認識・現金預金 ---
  { id:1024, cat:'収益認識', chap:'収益認識・現金預金',
    q:'飲料水を酒店やスーパーに卸しているX社は、得意先との間で、次のような約束をしている。「1年間に一定の量以上を買ってくれた得意先には、代金の一部をあとから返す」（<strong>割戻し</strong>）。今期は、この約束の対象になりそうな得意先が、何社かある。決算にあたり、X社は、<mark class="q-revenue">今期の売上</mark>のうち、この約束によって、<mark class="q-liability">あとから返すことになると見込まれる金額を5円と見積もった</mark>。この見積額について、決算に必要な仕訳を行いなさい。',
    e:[{d:[['売上',5]],c:[['返金負債',5]]}],
    exp:'「割戻し」とは、一定の量以上を買ってくれた得意先に、代金の一部を、あとから返すことです（「リベート」とも呼ばれます）。収益認識の考え方では、あとで返す可能性が高い金額は「本当に確定した売上」とは言えないため、その分だけ売上（収益）を減らし、「将来、お金を返す義務」として「返金負債」という負債で処理します。「売ったつもりの金額のうち、見込みで返す分は、最初から売上に入れない」というのがポイントです。'
  },
  { id:1025, cat:'収益認識', chap:'収益認識・現金預金',
    q:'会計ソフトを開発して企業に販売しているX社は、ある企業と、次のような1つの契約を結んだ。1つ目は、会計ソフトを引き渡すこと。2つ目は、そのあと1年間、使い方などのサポートサービスを提供することである。この2つをあわせて1つの契約としている。契約を結んだ日に、X社は、<mark class="q-asset">代金の一部として40円を現金で先に受け取った</mark>。この時点では、<mark class="q-liability">会計ソフトはまだ引き渡しておらず、サポートサービスもまだ始めていない</mark>。契約を結んだ日の仕訳を行いなさい。',
    e:[{d:[['現金',40]],c:[['契約負債',40]]}],
    exp:'代金を先に受け取っても、商品やサービスをまだ何も提供していない段階では、売上（収益）には計上できません。ソフトの引き渡しとサポートサービスという「これから果たすべき2つの義務」が残っているため、受け取った40円は「将来、約束を果たさなければならない義務」として「契約負債」という負債で処理します。現金（資産）が増える一方、同額の義務（負債）も増える、という組み合わせです。'
  },
  { id:1026, cat:'収益認識', chap:'収益認識・現金預金',
    q:'ホームページの制作を請け負っているX社は、ある飲食店から、お店のホームページの制作を受注した。制作には、デザインの作業が必要である。X社は、このデザインを外部のデザイナーに依頼した。そして、デザイナーへの報酬として、<mark class="q-asset">25円を現金で支払った</mark>。ホームページは、この時点では<mark class="q-asset">まだ完成しておらず、飲食店に引き渡していない</mark>。報酬を支払った日の仕訳を行いなさい。',
    e:[{d:[['仕掛品',25]],c:[['現金',25]]}],
    exp:'「受注」とは、注文を受けることです。まだ仕事が完成しておらず、お客さんに引き渡していない段階でかかった費用は、その場で費用にはせず、「まだ完成していない仕事にかかった費用」として、いったん「仕掛品」という資産で処理します。完成して引き渡したときに、初めてこの仕掛品を費用（原価）に振り替えます。現金（資産）が仕掛品（資産）という形に姿を変えた取引です。'
  },
  { id:1027, cat:'収益認識', chap:'収益認識・現金預金',
    q:'その後、X社は、上記の<mark class="q-revenue">ホームページを完成させて、飲食店に引き渡した</mark>。制作代金は50円で、X社は飲食店に請求書を送った。<mark class="q-asset">代金は後日、飲食店から支払ってもらう約束である</mark>。引き渡した日の仕訳を行いなさい。',
    e:[{d:[['売掛金',50]],c:[['役務収益',50]]}],
    exp:'商品の販売とは違い、サービス（役務）を提供して得る収益は「役務収益」という科目で処理します。ホームページが完成し、飲食店に引き渡した瞬間に、サービス提供という約束を果たしたことになるので、代金50円を役務収益（収益）として計上します。まだ代金を受け取っていないので、「あとで受け取れる権利」として売掛金（資産）を計上します。'
  },
  { id:1028, cat:'収益認識', chap:'収益認識・現金預金',
    q:'上記のホームページについて、飲食店への<mark class="q-asset">引渡しと代金の請求が終わり、この制作の仕事は完了</mark>した。X社は、この仕事のために、これまでに25円を支払っている（デザイナーへの報酬）。この25円は、仕事が完成するまでは、<mark class="q-expense">まだ完成していない仕事にかかった費用として、別に記録してきた</mark>。仕事が完了した日に、この25円について、必要な仕訳を行いなさい。',
    e:[{d:[['役務原価',25]],c:[['仕掛品',25]]}],
    exp:'仕事が完了し、収益（役務収益）を計上したタイミングで、それに対応する原価も費用として計上する必要があります（収益と費用を対応させる「費用収益対応の原則」）。これまで仕掛品（資産）として積み立てていた25円を、「役務原価」という費用に振り替えます。「仕事が完成して初めて、積み立てていたコストが正式な費用に変わる」というイメージです。'
  },
  { id:1029, cat:'現金預金', chap:'収益認識・現金預金',
    q:'建築資材を工務店に卸しているX社は、決算の日に、金庫の中を確認した。すると、得意先の工務店から、<mark class="q-asset">代金の回収として受け取っていた、他社が振り出した小切手10円と、郵便為替証書5円</mark>が、そのまま保管されていた。この2つは、まだ帳簿には現金として記録されていなかった。決算にあたり、これらについて必要な仕訳を行いなさい。',
    e:[{d:[['現金',15]],c:[['売掛金',15]]}],
    exp:'簿記でいう「現金」には、紙幣・硬貨だけでなく、他社が振り出した小切手や郵便為替証書のように「銀行や郵便局に持っていけばすぐに現金化できる証書」（通貨代用証券）も含まれます。これらを受け取った時点ですでに代金回収は完了しているので、帳簿上の「現金」として記録し直し、まだ記録が済んでいなかった分だけ売掛金（資産）を減らして現金（資産）を増やします。'
  },
  { id:1030, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、期の途中で、金庫の中の現金を実際に数えてみた。すると、<mark class="q-asset">帳簿に記録されている現金の残高より5円少なかった</mark>。担当者が調べたが、<mark class="q-other">原因はまだわかっていない</mark>。この時点で、必要な仕訳を行いなさい。',
    e:[{d:[['現金過不足',5]],c:[['現金',5]]}],
    exp:'帳簿の金額と実際の金庫の中身が合わないとき、原因がすぐに分からなくても、まずは実際に数えた金額に帳簿を合わせる必要があります。原因が判明するまでの一時的な置き場所として「現金過不足」という科目を使い、実際の金庫の中身（現金が5円少ない状態）に帳簿を合わせます。原因が後で分かれば正しい科目に振り替え、最後まで分からなければ決算時に「雑損」や「雑益」として精算します。'
  },
  { id:1031, cat:'現金預金', chap:'収益認識・現金預金',
    q:'<mark class="q-other">上記の5円の差額</mark>について、X社は、その後も、金庫の出し入れの記録や領収書などを見直して、原因を調べ続けた。しかし、<mark class="q-expense">決算日になっても、原因はわからなかった</mark>。この5円の差額は、決算日の時点で、そのまま残っている。決算日に、必要な仕訳を行いなさい。',
    e:[{d:[['雑損',5]],c:[['現金過不足',5]]}],
    exp:'現金過不足という一時的な置き場所に入れていた5円について、決算日になってもどうしても原因が分からなかった場合は、これ以上原因を探すのをあきらめ、「雑損」という費用（＝原因不明の損失）として処理し、帳簿を締めます。現金過不足（一時的な仮の科目）を、最終的な正式な費用科目（雑損）に置き換える仕訳です。'
  },
  { id:1032, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、別の期の決算の日に、金庫の中の現金を実際に数えた。すると、<mark class="q-asset">帳簿に記録されている現金の残高より3円多かった</mark>。調べても、<mark class="q-revenue">原因はわからなかった</mark>。決算にあたり、必要な仕訳を行いなさい。',
    e:[{d:[['現金',3]],c:[['雑益',3]]}],
    exp:'今度は逆に、実際の現金の方が帳簿より多かったケースです。決算日まで原因が分からなかったので、増えた3円は「雑益」という収益（＝原因不明の利益）として処理します。現金が多い場合も少ない場合も、「まず実際の金額に帳簿を合わせ、原因不明の分は最終的に雑損・雑益で精算する」という考え方は共通です。'
  },
  { id:1033, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、金庫に置いておく現金が多くなってきた。盗難や紛失の心配があるうえ、日々の支払いも、小切手や銀行の引き落としで行うことが増えている。そこで、金庫の<mark class="q-asset">現金</mark>のうち100円を、取引銀行の<mark class="q-asset">当座預金口座に預け入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',100]],c:[['現金',100]]}],
    exp:'「当座預金」とは、小切手を振り出したり、口座からの引き落としで支払ったりするために、銀行に預けておく預金のことです（利息はつきません）。金庫の現金を銀行口座に移しただけなので、損益には一切影響せず、現金（資産）が当座預金（資産）という形に姿を変えるだけの取引です。'
  },
  { id:1034, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、取引銀行と<mark class="q-liability">当座借越契約</mark>を結んでいる。この契約では、当座預金の残高を超えて小切手を振り出しても、限度額の50円までは、銀行が支払ってくれる。ある日、X社は、仕入先のY社に、<mark class="q-liability">未払いの商品代金30円を支払う</mark>ため、<mark class="q-asset">小切手を振り出し</mark>た。この日、当座預金口座の残高は20円であった。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',30]],c:[['当座預金',20],['当座借越',10]]}],
    exp:'当座借越契約があると、口座残高が足りなくても、銀行が契約の限度額まで一時的に立て替えて支払ってくれます。今回は残高20円のところ30円の小切手を振り出したので、まず残高の20円分は当座預金（資産）の減少として処理し、残りの不足分10円は、銀行からの一時的な借り入れとして「当座借越」という負債で処理します。買掛金（負債）が消える一方、当座預金（資産）が減り、不足分は当座借越（負債）になる、という組み合わせです。'
  },
  { id:1035, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、営業所を新しく開設した。営業所で使うために、<mark class="q-asset">パソコンと机</mark>を合計40円で購入した。パソコンと机は、すでに営業所に届いているが、<mark class="q-liability">代金は月末にまとめて支払う約束</mark>である。この日の仕訳を行いなさい。',
    e:[{d:[['備品',40]],c:[['未払金',40]]}],
    exp:'パソコンや机のような、長く使う目的で買ったモノは「備品」という資産で処理します。商品の仕入れとは違い、営業に使う道具を買ったときの未払いの代金は、「買掛金」ではなく「未払金」という負債で処理します（買掛金は「商品」を仕入れたときに限って使う科目です）。備品（資産）が増え、未払金（負債）も増える、という組み合わせです。'
  },
  { id:1036, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、少額の支払いのための現金の管理方法として、<strong>定額資金前渡制度</strong>を採用している。この制度では、少額の支払いを担当する係（用度係）に、あらかじめ決めた額の資金を渡しておき、使った分だけあとから補給する。今週の始めに、X社は、<mark class="q-asset">用度係に渡す資金</mark>として、<mark class="q-asset">小切手20円を振り出し</mark>て、前渡しした。この日の仕訳を行いなさい。',
    e:[{d:[['小口現金',20]],c:[['当座預金',20]]}],
    exp:'会社の本体の現金とは別に、文房具代や交通費など日々の細かい支払い専用に、あらかじめ一定額を用度係に渡しておく仕組みが「定額資金前渡制度」です。この専用のお財布を「小口現金」という資産科目で管理します。当座預金（資産）が小口現金（資産）という形に姿を変えた取引です。'
  },
  { id:1037, cat:'現金預金', chap:'収益認識・現金預金',
    q:'<mark class="q-asset">用度係は、今週の始めに渡された資金の中から、少額の支払い</mark>を行ってきた。今週の終わりに、用度係は、使った内容をX社の経理担当者に報告した。支払いの内訳は、<mark class="q-expense">文房具の購入</mark>が8円、<mark class="q-expense">出張の電車代</mark>が5円、<mark class="q-expense">郵便代</mark>が3円であった。X社は、この報告を受けて、必要な仕訳を行いなさい。',
    e:[{d:[['消耗品費',8],['旅費交通費',5],['通信費',3]],c:[['小口現金',16]]}],
    exp:'用度係が日々の細かい支払いを立て替えていても、会社の本帳簿にはまだ何も記録されていません。用度係から「何にいくら使ったか」の報告を受けた、まさにその瞬間に初めて費用として記録します。文房具代は消耗品費、出張の電車代は旅費交通費、郵便代は通信費と、内容ごとに正しい科目へ振り分け、同時に小口現金（資産）をその分減らします。'
  },
  { id:1038, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、上記の報告を受けたあと、すぐに、用度係が使った16円と同じ金額の<mark class="q-asset">小切手を振り出し</mark>て、<mark class="q-asset">用度係に渡し、資金を補給</mark>した。これで、用度係の手元の資金は、あらかじめ決めた額に戻った。この日の仕訳を行いなさい。',
    e:[{d:[['小口現金',16]],c:[['当座預金',16]]}],
    exp:'用度係のお財布（小口現金）の中身が減った分を、会社の当座預金口座から補充します。費用はすでに前の問題で報告を受けたときに記録済みなので、ここでは新たな費用は発生せず、単に「会社の口座のお金が、用度係のお財布に移った」という資産同士の入れ替えだけが記録されます。'
  },
  { id:1039, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、金庫に置いておく現金が多くなってきた。日常の出し入れに使うため、いつでも引き出せる預金に預けておきたいと考えている。そこで、金庫の<mark class="q-asset">現金</mark>のうち50円を、取引銀行の<mark class="q-asset">普通預金口座に預け入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['普通預金',50]],c:[['現金',50]]}],
    exp:'「普通預金」とは、いつでも自由に預け入れや引き出しができる預金のことです。当座預金とは違って小切手は使えませんが、ATMなどで日常的に出し入れしやすいのが特徴です。現金（資産）が普通預金（資産）という形に姿を変えただけの取引で、損益には影響しません。'
  },
  { id:1040, cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社の<mark class="q-asset">普通預金口座</mark>には、当分使う予定のない資金がたまっていた。普通預金には、ほとんど利息がつかない。そこで、その資金のうち100円を、少しでも高い利息を得るために、期間1年・年利率2％の<mark class="q-asset">定期預金に預け替えた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['定期預金',100]],c:[['普通預金',100]]}],
    exp:'「定期預金」とは、あらかじめ決めた期間、原則として引き出さないことを約束して預ける預金のことです。普通預金より利率が高いのが特徴です。当分使う予定のない資金を、より有利な条件の預金に移し替えただけなので、普通預金（資産）が定期預金（資産）という形に姿を変える取引になります。'
  },
  // --- 第4章：債権債務（手形・電子記録債権） ---
  { id:1041, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'工作機械の部品を製造して機械メーカーに納めているX社は、得意先のY社から、部品の<mark class="q-asset">代金60円をまだ受け取っていない</mark>。Y社は、この代金の支払いのために、約束手形を振り出して、X社に渡した。X社は、この<mark class="q-asset">約束手形を受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['受取手形',60]],c:[['売掛金',60]]}],
    exp:'「約束手形」とは、振出人が、決められた日に代金を支払うことを約束した証券のことです（この証券を作って渡すことを「振り出す」といいます）。もともと「売掛金」という資産（＝あとで回収する権利）だったものが、「受取手形」というより確実な資産（＝期日に必ず支払われる証券上の権利）に姿を変えます。まだお金を受け取ったわけではありませんが、権利の種類が変わっただけなので、収益にはなりません。'
  },
  { id:1042, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、材料を仕入先のZ社から掛けで購入している。<mark class="q-liability">代金60円はまだ支払っていない</mark>。今月は、他の支払いが重なったため、Z社に頼んで、現金ではなく、約束手形で支払うことにした。X社は、<mark class="q-liability">約束手形を振り出して</mark>、Z社に渡した。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',60]],c:[['支払手形',60]]}],
    exp:'受け取る側とは逆に、支払う側が約束手形を振り出すと、「買掛金」という負債（＝あとで払う義務）が、「支払手形」というより重い負債（＝期日に必ず支払わなければならない証券上の義務）に変わります。手形は口約束の買掛金より法的な強制力が強いため、「本気度の高い借用書」とイメージすると分かりやすいです。'
  },
  { id:1043, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'決算にあたり、X社は、得意先に対する未回収の代金と、受取手形の期末の残高を合計して、100円あることを確認した。得意先の中には、経営が苦しくなる会社が出る可能性がある。そこで、この100円のうち、<mark class="q-asset">回収できなくなる分</mark>を、<mark class="q-expense">100円の4％と見積もる</mark>ことにした。この見積りは<strong>差額補充法</strong>によって行う。見積りをする前の、この見積りに関する残高はゼロである。決算に必要な仕訳を行いなさい。',
    e:[{d:[['貸倒引当金繰入',4]],c:[['貸倒引当金',4]]}],
    exp:'「差額補充法」とは、見積もった金額と、すでにある残高との差額だけを、追加で計上する方法です。売掛金や受取手形などの債権は、将来回収できなくなる（貸し倒れる）リスクがあります。そこで決算のたびに、回収不能になりそうな金額をあらかじめ見積もって、「貸倒引当金」という資産のマイナス項目（＝将来の損失に備える引当金）として計上し、同時に「貸倒引当金繰入」という費用も計上します。今回はまだ残高がゼロなので、見積額の4円がそのまま繰入額になります。'
  },
  { id:1044, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、得意先のY社から、<mark class="q-asset">代金50円をまだ受け取っていない</mark>。Y社は、最近、手形ではなく、電子的な方法で代金を支払う仕組みを使い始めた。そこで、この代金について、X社は、<mark class="q-asset">電子債権記録機関に、代金を請求する権利を、電子的に記録してもらった</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['電子記録債権',50]],c:[['売掛金',50]]}],
    exp:'「電子債権記録機関」とは、代金を請求する権利（債権）を、電子的に記録して管理する機関のことです（手形の代わりに使われます）。紙の手形の代わりにデータで権利を管理する仕組みで、売掛金（資産）が、より安全に管理できる電子記録債権（資産）という形に姿を変えます。紛失・盗難のリスクがなく、印紙税もかからないのがメリットです。'
  },
  { id:1045, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、急に資金が必要になった。しかし、上記の電子的に記録された50円の代金請求の権利の支払期日は、まだ先である。そこで、この権利を、支払期日の前に、<mark class="q-asset">取引銀行に譲渡</mark>した。銀行から支払われた<mark class="q-expense">譲渡の代金は48円で</mark>、<mark class="q-asset">当座預金口座に振り込まれた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',48],['電子記録債権売却損',2]],c:[['電子記録債権',50]]}],
    exp:'満期を待たずに、電子記録債権を銀行に買い取ってもらって先に現金化することを「譲渡（割引）」といいます。銀行は満期までのリスクや利息相当分を差し引くため、50円分の権利でも実際に受け取れるのは48円になります。この差額2円は「早く現金化するために払ったコスト」として「電子記録債権売却損」という費用で処理します。'
  },
  { id:1046, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、以前に得意先から受け取っていた約束手形60円を持っている。支払期日はまだ先だが、資金が必要になったため、この<mark class="q-asset">手形を取引銀行に持ち込んで、現金に換えてもらった（割引）</mark>。銀行は、<mark class="q-expense">期日までの利息にあたる割引料を差し引き</mark>、残りの57円を、<mark class="q-asset">当座預金口座に入金した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',57],['手形売却損',3]],c:[['受取手形',60]]}],
    exp:'「割引」とは、手形を、支払期日の前に銀行に買い取ってもらって、現金にすることです（銀行は、期日までの利息にあたる割引料を差し引きます）。額面60円の手形でも、早く現金化する代わりに銀行へ利息相当分を払うため、実際に受け取れるのは57円になります。この差額3円は「手形売却損」という費用で処理します。'
  },
  { id:1047, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記のように、X社は、<mark class="q-asset">約束手形60円を、取引銀行で割り引いていた</mark>。ところが、<mark class="q-asset">支払期日になっても、この手形の代金は、支払われなかった</mark>。銀行から、その通知がX社に届いた。この日の仕訳を行いなさい。',
    e:[{d:[['不渡手形',60]],c:[['受取手形',60]]}],
    exp:'「不渡り」とは、手形の代金が、支払期日に支払われないことです。期日に払われなかった手形は、普通の「受取手形（順調な権利）」から「不渡手形（問題を抱えた権利）」という特別な科目に振り替えて管理します。まだ全く回収できないと決まったわけではないので、資産として扱い続け、今後の回収状況を見守ります。'
  },
  { id:1048, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'その後、X社は、上記の<mark class="q-asset">不渡りとなった手形60円</mark>について、手形を振り出した会社と交渉を続けた。その結果、この会社は、手形の代金60円を、<mark class="q-revenue">手形の支払期日を過ぎた分の利息2円</mark>とあわせて、支払ってくれることになった。X社は、この合計62円を、<mark class="q-asset">現金で回収した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',62]],c:[['不渡手形',60],['受取利息',2]]}],
    exp:'不渡りになっても、その後の交渉で無事に回収できることがあります。もともとの手形代金60円は不渡手形（資産）を取り崩して現金に換え、支払いが遅れた分のお詫びとして上乗せされた利息2円は、新たに「受取利息」という収益として計上します。トラブルはあったものの、最終的に利息付きで回収できた、というハッピーエンドの仕訳です。'
  },
  { id:1049, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、工場で使っていた<mark class="q-asset">備品のうち、不要になったものをY社に売却</mark>した。この備品の帳簿上の金額は、40円である。売却の代金も40円で、Y社が振り出した<mark class="q-asset">約束手形で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['営業外受取手形',40]],c:[['備品',40]]}],
    exp:'商品の売買ではなく、備品のような固定資産を売った代金として手形を受け取る場合は、日常の商売で使う「受取手形」とは区別して「営業外受取手形」という科目を使います。「営業外」というのは「本業の商売（商品売買）以外の取引で生じた」という目印です。帳簿価額と同額の40円で売れたので、売却損益は発生しません。'
  },
  { id:1050, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、事務所で使う<mark class="q-asset">備品を、新しく購入</mark>することにした。購入先に、代金40円の支払いを、約束手形で行いたいと申し出て、承諾された。そこで、備品を購入し、代金の支払いのために、<mark class="q-liability">約束手形を振り出して</mark>、購入先に渡した。この日の仕訳を行いなさい。',
    e:[{d:[['備品',40]],c:[['営業外支払手形',40]]}],
    exp:'備品のような固定資産の代金を手形で支払う場合も、商品仕入れで使う「支払手形」とは区別して「営業外支払手形」という科目を使います。「本業の商売以外の取引で生じた約束」という目印をつけることで、後から帳簿を見返したときに取引の性質が一目で分かるようにしています。'
  },
  { id:1051, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、仕入先のZ社に、<mark class="q-liability">材料の代金40円をまだ支払っていない</mark>。ちょうど、得意先のY社から受け取った約束手形40円を、手元に持っている。そこで、この約束手形を、Z社への支払いに使うことにした。X社は、この<mark class="q-asset">約束手形を、裏書きして</mark>、Z社に渡した。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['受取手形',40]]}],
    exp:'「裏書き」とは、手形の裏面に署名して、他の人に渡すことです。保有していた受取手形（お金を受け取る権利）を、そのまま仕入代金の支払いに使うことができます。現金を使わずに、手形という紙一枚で代金決済が完了する、手形ならではの便利な使い方です。買掛金（負債）が消え、受取手形（資産）も消える、という組み合わせです。'
  },
  { id:1052, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、以前にZ社に、<mark class="q-liability">約束手形50円を振り出している</mark>。ところが、資金繰りが苦しくなったため、Z社に、この手形の支払期日を延ばしてほしいと頼み、承諾された。X社は、延ばした期間の<mark class="q-expense">利息2円</mark>を加えた、<mark class="q-liability">新しい約束手形を振り出して</mark>、古い手形と交換した。この日の仕訳を行いなさい。',
    e:[{d:[['支払手形',50],['支払利息',2]],c:[['支払手形',52]]}],
    exp:'期日までに支払えないとき、相手の同意を得て新しい期日の手形に書き換えてもらうことがあります。これは「古い約束をいったん取り消して、新しい約束をし直す」ことと同じなので、古い支払手形（50円）をいったん消し、新しい支払手形（52円）を計上し直します。支払いを延ばしてもらう対価として発生する利息2円は、「支払利息」という費用として別途計上します。'
  },
  { id:1053, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、仕入先のZ社に、<mark class="q-liability">材料の代金50円をまだ支払っていない</mark>。Z社は、手形の代わりに、電子的な仕組みで支払いを受けたいと希望した。そこで、X社は、この代金の支払いを、電子債権記録機関を通じて行うことにし、<mark class="q-liability">支払いの約束が電子的に記録されるよう、請求</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',50]],c:[['電子記録債務',50]]}],
    exp:'買掛金という口約束の負債を、電子債権記録機関にデータとして記録される、より明確な支払義務に置き換える手続きです。買掛金（負債）が消え、電子記録債務（負債）が同額増えます。紙の手形と違って印紙税がかからず、紛失・盗難のリスクもない点がメリットです。'
  },
  { id:1054, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記の<mark class="q-liability">電子的に記録された50円の支払いの約束</mark>について、支払期日が来た。X社の当座預金口座には、この日に必要な資金が入っていた。そして、<mark class="q-asset">当座預金口座から、50円が引き落とされ</mark>、Z社に支払われた。この日の仕訳を行いなさい。',
    e:[{d:[['電子記録債務',50]],c:[['当座預金',50]]}],
    exp:'電子記録債務の支払期日が来ると、銀行のシステムが自動的に処理を行い、口座からお金が引き落とされます。「必ず払います」という約束（電子記録債務）が実際の支払いに変わることで負債が消え、同時に当座預金（資産）が同額減少します。'
  },
  { id:1055, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、Y社と、次のような契約を結んだ。部品Aと部品Bを、あわせて売る。代金の請求は、部品Aと部品Bの両方を引き渡した後に、まとめて行う。X社は、<mark class="q-revenue">まず部品Aを引き渡した</mark>。部品Aの分の代金は、30円である。<mark class="q-asset">部品Bを引き渡すまでは、代金を請求できない</mark>。部品Aを引き渡した日の仕訳を行いなさい。',
    e:[{d:[['契約資産',30]],c:[['売上',30]]}],
    exp:'部品Aを引き渡した時点で、その分の商品を渡すという約束（履行義務）はすでに果たしているので、売上（収益）は計上できます。しかし、契約上、部品Bも引き渡すまでは正式に代金を請求できないため、「あとで確実にお金を受け取れるが、まだ請求書を出せる状態ではない権利」として、通常の「売掛金」ではなく「契約資産」という資産で処理します。'
  },
  { id:1056, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'その後、X社は、<mark class="q-revenue">部品Bも引き渡した</mark>。そこで、部品Aと部品Bの<mark class="q-asset">代金の合計60円をY社に請求した</mark>。このうち<mark class="q-asset">30円は、部品Aを引き渡した日に、すでに処理してある</mark>。部品Bを引き渡した日の仕訳を行いなさい。',
    e:[{d:[['売掛金',60]],c:[['契約資産',30],['売上',30]]}],
    exp:'部品Bも引き渡したことで、ようやく正式に代金60円を請求できるようになりました。すでに「契約資産」として計上していた部品A分の30円は、正式な請求権である「売掛金」に振り替え、新たに引き渡した部品B分の30円は、新しく売上（収益）として計上します。合計で売掛金が60円計上される結果になります。'
  },
  { id:1057, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、得意先のY社から、<mark class="q-asset">代金40円をまだ受け取っていない</mark>。Y社は、この代金を、次の方法で支払うことにした。Y社に代金を払う義務があるW社を支払人とし、X社を受取人とする、為替手形40円を作った。<mark class="q-asset">W社は、この手形の支払いを承諾した</mark>。手形は、Y社からX社に渡された。X社の仕訳を行いなさい。',
    e:[{d:[['受取手形',40]],c:[['売掛金',40]]}],
    exp:'「為替手形」とは、振出人が、第三者（支払人）に対して、受取人に代金を支払うよう依頼する証券です（「引受け」とは、支払いを頼まれた人が、その手形の代金を支払うことを承諾することです）。受取人であるX社から見れば、これから代金を払ってくれるのがY社からW社に変わっただけで、「お金を受け取れる権利」という意味では約束手形と同じく「受取手形」として処理します。'
  },
  { id:1058, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'食品を小売店に卸しているW社は、仕入先のY社に、<mark class="q-liability">代金40円をまだ支払っていない</mark>。Y社は、X社を受取人とし、W社を支払人とする、為替手形40円を作った。W社は、<mark class="q-liability">この手形の引受けを求められ、これを引き受けた</mark>。W社の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['支払手形',40]]}],
    exp:'今度は支払人（W社）側の視点です。もともとY社に対して持っていた買掛金（支払う義務）を、「これから、X社に直接払います」という支払手形に置き換えます。支払う相手がY社からX社に変わるだけで、W社が払うべき金額そのものは変わりません。'
  },
  { id:1059, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'家具を製造して販売しているX社は、取引先のY社から、「今月は、材料の仕入れが重なって、資金が足りない。お金を貸してほしい」と頼まれた。X社は、Y社と長い付き合いがあるので、頼みに応じることにした。そこで、<mark class="q-asset">現金60円を貸し付け</mark>、借用証書を受け取った。この日の仕訳を行いなさい。',
    e:[{d:[['貸付金',60]],c:[['現金',60]]}],
    exp:'「借用証書」とは、お金を借りた事実と、返済の約束を書いた書類のことです。他社にお金を貸すと、現金（資産）が「将来返してもらえる権利」である「貸付金」という資産に姿を変えます。貸した時点ではまだ利息は発生していないので、元本の60円だけを貸付金として計上します。'
  },
  { id:1060, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記の貸付けについて、約束の返済の日が来た。Y社は、資金の都合がついたため、約束どおりに返済してきた。X社は、<mark class="q-asset">貸していた60円</mark>と、<mark class="q-revenue">利息2円</mark>を、あわせて<mark class="q-asset">現金で回収した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',62]],c:[['貸付金',60],['受取利息',2]]}],
    exp:'貸していたお金が返済されるとき、元本の60円は、もともと自分のお金が一巡して戻ってきただけなので儲けにはなりません（貸付金という資産が現金という資産に戻るだけ）。上乗せされた利息2円だけが、お金を貸したことによる正真正銘の儲け（受取利息という収益）です。'
  },
  { id:1061, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、家具を作る機械を、新しいものに入れ替えることにした。そのための資金が足りないので、取引銀行に相談したところ、60円を貸してもらえることになった。X社は、<mark class="q-asset">現金60円を借り入れ</mark>、<mark class="q-liability">借用証書を銀行に差し入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',60]],c:[['借入金',60]]}],
    exp:'銀行からお金を借りると、手元の現金（資産）は増えますが、それは「いずれ必ず返さなければならないお金」なので、同時に「借入金」という負債も同額増えます。利息は借りている期間に応じて後から発生するものなので、この時点ではまだ計上しません。'
  },
  { id:1062, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記の借入れについて、返済の日が来た。X社は、新しい機械を使って、順調に売上を伸ばしていたため、約束どおりに返済することができた。<mark class="q-liability">借りていた60円</mark>と、<mark class="q-expense">利息3円</mark>を、あわせて<mark class="q-asset">現金で銀行に返済した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['借入金',60],['支払利息',3]],c:[['現金',63]]}],
    exp:'借りていたお金を返すとき、元本の60円は「もともと他人から借りていたものを、約束通り返しただけ」なので、費用にはなりません（借入金という負債が消えるだけ）。上乗せして払う利息3円だけが、お金を借りていた対価としての本当のコスト（支払利息という費用）です。'
  },
  { id:1063, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社の取締役の山田一郎は、個人的な事情で、急に、まとまったお金が必要になった。山田一郎は、会社に、「短い間、お金を貸してほしい」と頼んだ。X社は、会社の経営に問題がない範囲で、この頼みに応じることにした。そして、山田一郎に、<mark class="q-asset">現金30円を貸し付けた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['役員貸付金',30]],c:[['現金',30]]}],
    exp:'取引先ではなく、自社の役員にお金を貸す場合は、通常の「貸付金」とは区別して「役員貸付金」という資産科目を使います。会社の経営とは直接関係のない個人的な貸し借りを、取引先への貸付金と分けて管理するための科目です。'
  },
  { id:1064, cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、大きな注文が入り、材料を急いで仕入れる必要が出た。しかし、代金の支払い時期の都合で、一時的に資金が足りなくなった。そこで、取締役の山田一郎に頼んで、会社にお金を貸してもらうことにした。X社は、山田一郎から、<mark class="q-asset">現金30円を</mark><mark class="q-liability">借り入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',30]],c:[['役員借入金',30]]}],
    exp:'今度は逆に、自社の役員からお金を借りる場合です。通常の「借入金」とは区別して「役員借入金」という負債科目を使います。銀行などの外部からの借入とは性質が異なる、身内からの資金調達であることを帳簿上で明確にしておく科目です。'
  },
  // --- 第5章：有価証券 ---
  { id:1065, cat:'有価証券', chap:'第5章：有価証券',
    q:'食品の輸入販売を行っているX社は、余裕資金を運用するため、Y社の株式を購入することにした。<mark class="q-asset">値上がりしたら、すぐに売って利益を得るつもり</mark>である。株式は100円で、証券会社を通じて購入した。X社は、株式の代金100円と、<mark class="q-expense">証券会社に支払う手数料10円</mark>をあわせて、<mark class="q-asset">小切手を振り出して支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['売買目的有価証券',100],['支払手数料',10]],c:[['当座預金',110]]}],
    exp:'「値上がりしたらすぐに売って利益を得るつもり」で持つ株式は「売買目的有価証券」という資産で処理します。株式の購入にかかった手数料は、株式の値段そのものではなく、取引を成立させるための事務コストなので「支払手数料」という費用として別に計上します（株式の金額には含めません）。'
  },
  { id:1066, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、Z社が発行した社債（額面100円）を購入した。この社債は、<mark class="q-asset">満期まで持ち続けて、満期に額面の金額を受け取るつもり</mark>で購入したものである。購入代金は、額面と同じ100円で、<mark class="q-asset">当座預金口座から支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',100]],c:[['当座預金',100]]}],
    exp:'「社債」とは、会社が、お金を借りるために発行する債券のことです。「額面」とは、証券に記載されている金額、「満期」とは、支払いを受ける約束の期日が来ることです。満期まで持ち続けて、額面どおりの金額を受け取るつもりで買った債券は「満期保有目的債券」という資産で処理します。短期売買目的の株式とは違い、値上がり益を狙う目的ではない点が特徴です。'
  },
  { id:1067, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">W社の議決権の過半数を持っており</mark>、W社の経営を支配している。W社の経営をさらに安定させるため、X社は、W社の株式を追加で200円分購入した。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['子会社株式',200]],c:[['現金',200]]}],
    exp:'「議決権」とは、株主総会で、議案に賛成や反対の票を投じる権利のことです。議決権の過半数を持ち、相手の会社を支配している場合、その株式は「子会社株式」という資産で処理します。売買して利益を得る目的ではなく「相手の会社を支配し続けるため」に持っているので、売買目的有価証券とは性質がまったく異なります。'
  },
  { id:1068, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、V社の株式を150円で取得した。X社は、<mark class="q-asset">V社の議決権の一部を持ち、V社の経営方針の決定に重要な影響</mark>を与えることができる。ただし、経営を支配するほどの割合ではない。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['関連会社株式',150]],c:[['現金',150]]}],
    exp:'相手の会社を完全に支配するほどではないものの、経営方針の決定に重要な影響を与えられる立場にある株式は「関連会社株式」という資産で処理します。子会社株式ほど強い支配力はありませんが、売買目的の株式とは違い、長期的な関係維持を目的に持つ株式という点では共通しています。'
  },
  { id:1069, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、取引先のU社との関係を、これからも長く続けたいと考え、U社の株式を80円で取得した。<mark class="q-asset">この株式は、長期間持ち続ける予定で、すぐに売って利益を得る目的ではない</mark>。また、U社を、子会社や関連会社にするつもりもない。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['その他有価証券',80]],c:[['現金',80]]}],
    exp:'売買目的でも、満期保有目的でも、子会社・関連会社株式でもない有価証券は「その他有価証券」という資産で処理します。取引関係の維持など、中長期的な目的で保有する株式がこれにあたります。4つの保有目的（売買目的・満期保有目的・子会社／関連会社株式・その他有価証券）のうち、どれにも当てはまらない「その他」の受け皿と考えると整理しやすいです。'
  },
  { id:1070, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">短期売買の目的で、Y社の株式</mark>を持っていた。この株式の帳簿価額は100円である。株価が上がったので、X社は、この株式を<mark class="q-revenue">110円で売却した</mark>。代金は、<mark class="q-asset">当座預金口座に入金</mark>された。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',110]],c:[['売買目的有価証券',100],['有価証券売却益',10]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。株式を売却するときは、帳簿価額と実際の売却額を比較します。帳簿価額100円の株式を110円で売れたので、差額10円は「有価証券売却益」という収益になります。'
  },
  { id:1071, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">短期売買の目的で、Y社の株式</mark>を持っていた。この株式の帳簿価額は100円である。株価が下がったが、資金が必要になったため、X社は、この株式を<mark class="q-expense">90円で売却した</mark>。代金は、<mark class="q-asset">現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',90],['有価証券売却損',10]],c:[['売買目的有価証券',100]]}],
    exp:'今度は逆に、帳簿価額100円の株式を90円でしか売れなかったケースです。差額10円は「有価証券売却損」という費用になります。値上がりを待てずに資金のために手放さざるを得なかった、という状況を表す仕訳です。'
  },
  { id:1072, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">長期保有の目的で、U社の株式</mark>を持っていた。この株式の帳簿価額は80円である。X社は、この株式を<mark class="q-revenue">85円で売却</mark>し、<mark class="q-asset">代金を現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',85]],c:[['その他有価証券',80],['投資有価証券売却益',5]]}],
    exp:'その他有価証券のように長期保有目的の有価証券を売却したときも、帳簿価額より高く売れた分が利益になります。ただし科目名は売買目的有価証券のとき（有価証券売却益）とは異なり「投資有価証券売却益」を使います。考え方は同じでも、長期保有目的の資産には別の科目名が使われる点に注意しましょう。'
  },
  { id:1073, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">長期保有の目的で、U社の株式</mark>を持っていた。この株式の帳簿価額は80円である。X社は、この株式を<mark class="q-expense">75円で売却</mark>し、<mark class="q-asset">代金を現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',75],['投資有価証券売却損',5]],c:[['その他有価証券',80]]}],
    exp:'長期保有目的の株式を帳簿価額より安く売却してしまった場合は、その差額が「投資有価証券売却損」という費用になります。売買目的有価証券の売却損（有価証券売却損）とは科目名が異なりますが、「帳簿価額より安く売れた分だけ損をした」という考え方は同じです。'
  },
  { id:1074, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社が保有している株式のうち、ある会社が、株主に、<mark class="q-revenue">配当金を支払う</mark>ことを決めた。その会社から、X社に、配当金領収証3円が届いた。X社は、この<mark class="q-asset">配当金領収証を受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',3]],c:[['受取配当金',3]]}],
    exp:'「配当金領収証」とは、株式の配当金を、現金に換えることができる証書のことです。これは銀行や郵便局ですぐに換金できる「通貨代用証券」の一種なので、受け取った瞬間に現金（資産）の増加として扱います。株式を保有していることで得られる配当金は、保有目的に関係なく「受取配当金」という収益で処理します。'
  },
  { id:1075, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、余裕資金の運用のため、Z社の社債を持っている。この社債には、年に何回か、決められた日に利息が支払われる。今日は、その<mark class="q-asset">利息の支払日である</mark>。Z社から、利息2円が、X社の<mark class="q-asset">当座預金口座に入金</mark>された。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',2]],c:[['有価証券利息',2]]}],
    exp:'社債を保有していると、定期的に利息（クーポン）を受け取れます。これは株式の配当金（受取配当金）とは区別して「有価証券利息」という収益で処理します。社債という「お金を貸している証券」から生まれる利息という性質の違いが、科目名の違いに表れています。'
  },
  { id:1076, cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">短期売買の目的で持っているY社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-revenue">帳簿価額は100円で、決算日の時価は105円であった</mark>。X社は<strong>時価法</strong>を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['売買目的有価証券',5]],c:[['有価証券評価益',5]]}],
    exp:'「時価」とは、その時点の市場での価格のことです。「時価法」とは、決算日の時価で、帳簿の金額を評価しなおす方法です。売買目的有価証券は、決算のたびに時価で評価し直す必要があります。時価（105円）が帳簿価額（100円）を上回ったので、その含み益5円を「有価証券評価益」として、まだ売っていなくても収益に計上します。'
  },
  { id:1077, cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">短期売買の目的で持っているY社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-expense">帳簿価額は100円で、決算日の時価は95円であった</mark>。X社は<strong>時価法</strong>を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['有価証券評価損',5]],c:[['売買目的有価証券',5]]}],
    exp:'時価が帳簿価額を下回った場合も同じ考え方で、まだ売っていなくても含み損を「有価証券評価損」という費用に計上します。売買目的有価証券は「いつでも市場で売買できる」という性質から、値上がりも値下がりも、その期のうちに損益として素直に反映させるのが原則です。'
  },
  { id:1078, cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">長期保有の目的で持っているU社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-equity">帳簿価額は80円で、決算日の時価は88円であった</mark>。X社は、この株式の評価差額を、損益に入れず、全額を純資産に直接計上する方法（<strong>全部純資産直入法</strong>）を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['その他有価証券',8]],c:[['その他有価証券評価差額金',8]]}],
    exp:'「評価差額」とは、時価と帳簿価額との差額のことです。「全部純資産直入法」とは、評価差額の全額を、損益に入れず、純資産に直接計上する方法です。その他有価証券も決算時に時価評価しますが、売買目的有価証券とは違い、評価差額をすぐに利益・損失とはせず、いったん純資産の部に直接計上します。「まだ売るつもりはないので今期の利益には反映させないが、資産の値段は最新の時価に合わせる」という中間的な扱いです。'
  },
  { id:1079, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">満期まで持ち続けるつもり</mark>で、Z社の社債（額面100円）を95円で取得した。額面より安く買えた差額の5円は、この社債の利息の一部にあたると考えられる。この社債は、取得から満期まで5年である。X社は、<mark class="q-revenue">この差額5円を、5年間にわたり、毎年同じ金額ずつ、帳簿価額に加えていく（定額法による償却原価法）</mark>。決算にあたり、この期の1年分について、必要な仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',1]],c:[['有価証券利息',1]]}],
    exp:'「償却原価法」とは、額面と取得原価との差額を、満期までの期間にわたって、少しずつ帳簿価額に加えていく方法です。「定額法」とは、毎年同じ金額ずつ処理する方法です。額面と取得価額の差額（5円）を、残存期間5年で均等に分けて（5÷5年＝1円）、毎年少しずつ「有価証券利息」という収益として認識していきます。これを続けると、満期を迎えるころには帳簿価額がちょうど額面（100円）と一致します。'
  },
  { id:1080, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">満期まで持ち続けるつもり</mark>で、Z社の社債（額面100円、利率年2％）を93円で取得した。この社債からは、毎年、額面の2％にあたる2円の利息（クーポン利息）を受け取る。この期の2円は、すでに現金で受け取っている。額面より安く買えた差額は、金利の調整にあたると考えられる。X社は、この社債について<strong>利息法による償却原価法</strong>を採用している。<mark class="q-revenue">実効利子率にもとづいて計算した、この期の利息の総額は、5円であった</mark>。決算にあたり、必要な仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',3]],c:[['有価証券利息',3]]}],
    exp:'「クーポン利息」とは、社債に定められた利率で、定期的に支払われる利息のことです。「利息法」とは、帳簿価額に実効利子率をかけて、その期の利息の総額を計算し、受け取る利息との差額を、帳簿価額に加える方法です。「実効利子率」とは、実質的な利回りを表す利率のことです。実効利子率で計算した利息の総額5円から、すでに現金で受け取った2円を差し引いた3円が、まだ現金で受け取っていない分の利息として、満期保有目的債券の帳簿価額に上乗せされます。'
  },
  { id:1081, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、V社の議決権の20％を持っている。V社は、X社にとって、経営方針に重要な影響を与えることができる会社である。V社は、今期、<mark class="q-revenue">当期純利益50円を計上した</mark>。X社は<strong>持分法</strong>を採用している。決算にあたり、V社の利益のうち、X社の持分にあたる金額について、必要な仕訳を行いなさい。',
    e:[{d:[['関連会社株式',10]],c:[['持分法による投資利益',10]]}],
    exp:'「持分法」とは、投資先の会社の利益や配当を、持ち株比率に応じて、自社の投資額に反映させる方法です。関連会社の利益が増えると、その会社の価値が増えたと考え、自社が持つ関連会社株式（資産）の帳簿価額も、持ち株比率に応じて増やします（50円×20％＝10円）。増えた分は「持分法による投資利益」という収益として計上します。'
  },
  { id:1082, cat:'有価証券', chap:'第5章：有価証券',
    q:'V社は、株主に対して、配当金20円を支払うことを決めた。X社は、V社の議決権の20％を持っており、<strong>持分法</strong>を採用している。<mark class="q-asset">この配当金のうち、X社の持分にあたる金額について</mark>、必要な仕訳を行いなさい。<mark class="q-asset">配当金は、まだ受け取っていない</mark>。',
    e:[{d:[['未収配当金',4]],c:[['関連会社株式',4]]}],
    exp:'持分法を適用している場合、関連会社から配当を受け取る権利が生じると、関連会社株式（資産）をその分減らします。これは「すでに持分法で利益として取り込んでいた金額の一部が、投資額から配当という形で払い戻される」と考えるためです（配当を受け取っても、新たな収益としては計上しません）。まだ受け取っていない配当金20円×20％＝4円は「未収配当金」という資産で処理します。'
  },
  { id:1083, cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、T社が発行した社債（額面100円、利率年6％）を、<mark class="q-asset">満期まで持ち続けるつもり</mark>で購入した。この社債の利息は、3月末と9月末に、年2回支払われる。購入した日は11月末日で、直前の利息の支払日（9月末）から2か月がたっている。購入代金は、額面と同じ100円である。X社は、購入代金に、<mark class="q-revenue">直前の利息の支払日から購入日までの利息（端数利息）</mark>を加えて、<mark class="q-asset">当座預金口座から支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',100],['有価証券利息',1]],c:[['当座預金',101]]}],
    exp:'「端数利息」とは、直前の利息の支払日から、売買の日までに経過した期間の利息のことです（社債の買い手は、この分を売り手に支払います）。前の利払い日から2か月分の利息（100円×6％×2/12＝1円）を、売り手にあらかじめ支払う必要があります。これは自分がまだ受け取っていない利息を前払いするイメージなので、「有価証券利息」の借方（収益のマイナス）で処理し、次の利払い日に受け取る利息とあわせて調整されます。'
  },
  { id:1084, cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">長期保有の目的で持っているS社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-expense">取得原価は60円で、決算日の時価は52円に下がっていた</mark>。X社は、時価が取得原価を上回る差額は純資産に入れるが、下回る差額は当期の損失として処理する方法（<strong>部分純資産直入法</strong>）を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['投資有価証券評価損',8]],c:[['その他有価証券',8]]}],
    exp:'「取得原価」とは、買ったときに支払った金額のことです。「部分純資産直入法」とは、時価が取得原価を上回る差額は純資産に入れ、下回る差額は当期の損失として処理する方法です。全部純資産直入法（純資産のみで処理）とは違い、この方法では評価損だけは費用として損益計算書に計上します。取得原価60円より時価が8円下がったので、「投資有価証券評価損」という費用で処理します。'
  },
  { id:1085, cat:'有価証券', chap:'第5章：有価証券',
    q:'翌期の期首（期の初め）にあたり、X社は、前の期の決算で、<mark class="q-asset">長期保有の目的</mark>で持っているS社の株式（<mark class="q-expense">取得原価60円、前の期の決算日の時価52円</mark>）を、時価に評価しなおして処理した。X社は<strong>洗替法</strong>を採用している。上記の株式について、期首に、洗替法によって、必要な仕訳を行いなさい。',
    e:[{d:[['その他有価証券',8]],c:[['投資有価証券評価損',8]]}],
    exp:'「期首」とは、会計期間の最初の日のことです。「洗替法」とは、前の期の決算で評価替えした金額を、次の期の初めに、いったん元の金額に戻す方法です。前期末に評価減していた8円を、新しい期の始まりにいったん逆仕訳で元の取得原価（60円）に戻します。これにより、新しい期は毎回「取得原価」を基準にして、改めて時価と比較し直すことができます。'
  },
  // --- 第6章：有形固定資産 ---
  { id:1087, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'プラスチック製品を製造して販売しているX社は、事業が広がったため、これまで借りていた事務所が手狭になった。そこで、新しく事務所として使うための<mark class="q-asset">建物を、300円で購入</mark>した。代金は、<mark class="q-asset">小切手を振り出して</mark>支払った。この日の仕訳を行いなさい。',
    e:[{d:[['建物',300]],c:[['当座預金',300]]}],
    exp:'事務所として長く使う目的で買った建物は「建物」という資産（＝長期間にわたって会社の役に立つ財産）で処理します。小切手を振り出すと、実際にはまだ口座からお金が引き落とされていなくても、帳簿上は当座預金（資産）が減ったものとして処理します。'
  },
  { id:1088, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'決算にあたり、X社は、上記の建物について、この期の価値の減少分を計算することにした。この建物の<mark class="q-expense">取得原価は300円、残存価額はゼロ、耐用年数は10年である</mark>。X社は定額法を採用し、<mark class="q-asset">記帳は間接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',30]],c:[['減価償却累計額',30]]}],
    exp:'「取得原価」とは買ったときに支払った金額、「残存価額」とは使い終わったときに残ると見込まれる価値、「耐用年数」とはその資産を使える年数のことです。「定額法」は毎年同じ金額ずつ、価値の減少分として処理する方法、「間接法」は資産の金額を直接減らさず、別の科目に減少分を累計していく記帳方法です。(300円－0円)÷10年＝30円が1年分の価値の減少分（減価償却費）で、この金額を「減価償却累計額」という資産のマイナス項目に積み立てていきます。'
  },
  { id:1089, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'決算にあたり、X社は、工場で使っている備品について、この期の価値の減少分を計算することにした。この備品の<mark class="q-expense">取得原価は40円、残存価額はゼロ、耐用年数は4年である</mark>。定額法を採用し、<mark class="q-asset">記帳は直接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',10]],c:[['備品',10]]}],
    exp:'「直接法」とは、資産の金額から、直接、減少分を差し引いていく記帳方法です。間接法（前問）のように別の科目に積み立てるのではなく、備品という資産の金額そのものを直接減らします。(40円－0円)÷4年＝10円が1年分の減価償却費です。間接法と直接法は、費用として計上する金額（減価償却費）は同じでも、資産の帳簿上の見せ方が違う点がポイントです。'
  },
  { id:1090, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、×2年7月1日に、事務用の備品を120円で購入し、代金は現金で支払った。この備品の<mark class="q-expense">残存価額はゼロ、耐用年数は5年で</mark>、定額法を採用している。X社の決算日は3月31日で、この期は4月1日から始まっている。決算にあたり、この備品について、購入した日から決算日までの月数をもとに、月割で、この期の価値の減少分を計算する。<mark class="q-asset">記帳は間接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',18]],c:[['減価償却累計額',18]]}],
    exp:'期の途中で固定資産を購入した場合、1年分丸ごと減価償却するのではなく、実際に使っていた月数分だけを月割りで計算します。年間の減価償却費は120円÷5年＝24円ですが、7月1日の購入から3月31日の決算日までは9か月間なので、24円×9か月／12か月＝18円を今期の費用として計上します。'
  },
  { id:1091, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、×2年9月30日に、不要になった備品を、<mark class="q-revenue">60円で売却</mark>し、<mark class="q-asset">代金は現金で受け取った</mark>。この備品の取得原価は120円、この期の期首の時点での<mark class="q-asset">減価償却累計額は60円</mark>、<mark class="q-expense">耐用年数は5年で</mark>、定額法を採用している。記帳は間接法によっている。決算日は3月31日で、この期は4月1日から始まっている。売却の日までの、この期の価値の減少分を月割で計算したうえで、売却について必要な仕訳を行いなさい。',
    e:[{d:[['現金',60],['減価償却累計額',60],['減価償却費',12]],c:[['備品',120],['固定資産売却益',12]]}],
    exp:'「減価償却累計額」とは、これまでに積み上げてきた、価値の減少分の合計のことです。「期首」とは、会計期間の最初の日のことです。固定資産を売る年は、まず売却する直前までの減価償却費を月割りで計上します（120円÷5年×6か月／12か月＝12円）。期首の減価償却累計額60円と合わせた帳簿価額（120円－60円－12円＝48円）と、売却額60円を比べ、差額12円は「固定資産売却益」という収益になります。'
  },
  { id:1092, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、工場の敷地に、新しい倉庫を建てている。倉庫は、まだ完成していない。建設を請け負っている建設業者に、<mark class="q-asset">工事の途中の支払い（中間払い）</mark>として、<mark class="q-asset">100円を現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['建設仮勘定',100]],c:[['現金',100]]}],
    exp:'「中間払い」とは、工事の途中で、代金の一部を支払うことです。建物が完成する前に支払ったお金は、まだ「建物」という完成した資産にはなっていないので、完成するまでの間は「建設仮勘定」という一時的な置き場所（資産）にお金を保管しておきます。完成して引き渡しを受けた時点で、正式に「建物」という資産に振り替えます。'
  },
  { id:1093, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、新しい機械を導入するための設備投資を行うことにした。国は、こうした設備投資を支援するため、補助金を出している。X社は、この<mark class="q-asset">国庫補助金50円の交付</mark>を受け、<mark class="q-asset">現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',50]],c:[['国庫補助金受贈益',50]]}],
    exp:'「国庫補助金」とは、国から交付される、返済が不要なお金のことです。返す必要がないお金を受け取ったので、「国庫補助金受贈益」という収益として計上します。このままだと補助金を受け取った年に利益が大きく増え、税負担も重くなってしまうため、次の問題で見るような調整（圧縮記帳）が必要になります。'
  },
  { id:1094, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の国庫補助金50円を使って、X社は、工場の<mark class="q-asset">建物</mark>を取得した。補助金を受け取ったことで、利益が大きくなりすぎて見えるのを避けるため、<mark class="q-expense">補助金の金額だけ、建物の帳簿価額を、直接減らす</mark>ことにした（<strong>直接減額方式</strong>）。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産圧縮損',50]],c:[['建物',50]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。「直接減額方式」とは、補助金を使って取得した資産の帳簿価額を、補助金の金額だけ、直接減らす方法です。前問で計上した国庫補助金受贈益（収益50円）と、今回の固定資産圧縮損（費用50円）が相殺され、この年の利益が補助金の分だけ増えすぎるのを防ぎます。その代わり、建物の帳簿価額が小さくなる分、今後の減価償却費も少なくなり、将来にわたって少しずつ課税される仕組みです。'
  },
  { id:1095, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、国庫補助金50円を使って、<mark class="q-expense">建物を取得し、直接減額方式によって、建物の帳簿価額を50円減らした</mark>。税務上、この50円の減額は、<mark class="q-asset">費用（損金）として認められない。実効税率は30％である</mark>。X社は税効果会計を適用している。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産圧縮損',50],['繰延税金資産',15]],c:[['建物',50],['法人税等調整額',15]]}],
    exp:'「税務上」とは、税金の計算の上では、ということです。「損金」とは、税金の計算の上で、費用として認められる金額のことです。「実効税率」とは、税金の実質的な負担割合のことです。「税効果会計」とは、会計上の利益と、税金の計算上の利益とのズレを、調整する会計処理です。会計上は費用（固定資産圧縮損）として認めても、税務上はすぐに損金として認めてもらえないため、将来その分の税金が軽くなる効果（50円×30％＝15円）を、あらかじめ「繰延税金資産」として資産計上します。'
  },
  { id:1096, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、国からの補助金を使って建物を取得したとき、建物の金額を直接減らさず、<mark class="q-equity">利益の一部を会社の中に積み立てておく方法（積立金方式）</mark>を選んだ。これは、補助金を受け取ったことで、利益が増えすぎて見えるのを避けるためである。X社は、これまでに、この目的で10円を積み立ててきた。当期、<mark class="q-equity">この10円を取り崩すことにした</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['圧縮積立金',10]],c:[['繰越利益剰余金',10]]}],
    exp:'「積立金方式」とは、補助金を使って取得した資産の金額は減らさず、利益の一部を、その資産のために積み立てておく方法です。直接減額方式とは違い、建物の帳簿価額はそのまま維持しつつ、補助金相当額を「圧縮積立金」という純資産の項目に据え置き、減価償却の進み具合に合わせて少しずつ取り崩していきます。取り崩した分は「繰越利益剰余金」という自由に使える利益の貯金箱に戻ります。'
  },
  { id:1097, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、国から国庫補助金50円をもらい、それを使って機械を買った。補助金をもらった分だけ、利益が増えて見えすぎるのを避けるため、<mark class="q-equity">積立金方式を採用</mark>している。税務上、<mark class="q-liability">この50円は、機械を将来手放したときに課税</mark>される。<mark class="q-equity">実効税率は30％</mark>で、X社は税効果会計を適用している。この補助金について、必要な仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',50]],c:[['圧縮積立金',35],['繰延税金負債',15]]}],
    exp:'積立金方式に税効果を組み合わせるケースです。積み立てる金額は、補助金の額面（50円）そのままではなく、将来の税負担分（50円×30％＝15円）を「繰延税金負債」として差し引いた、税引後の金額（35円）だけを「圧縮積立金」として積み立てます。「補助金はいずれ税金がかかるので、その分を見込んで少なめに積み立てておく」という考え方です。'
  },
  { id:1098, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の補助金について、X社は、前の期に、税効果を考慮して、<mark class="q-asset">積立金35円を積み立てていた</mark>。今期、この補助金を使って取得した資産を、売却した。そのため、X社は、この<mark class="q-asset">積立金を、取り崩す</mark>ことにした。この日の仕訳を行いなさい。',
    e:[{d:[['圧縮積立金',35],['繰延税金負債',15]],c:[['繰越利益剰余金',35],['法人税等調整額',15]]}],
    exp:'補助金を使って取得した資産を売却すると、積立金方式で積み立てていた圧縮積立金と、対応する繰延税金負債は、その役目を終えるため取り崩します。圧縮積立金35円は繰越利益剰余金（自由に使える利益）に戻し、繰延税金負債15円は法人税等調整額を通じて精算します。これで、積立金方式で先送りにしていた課税が、資産を手放したタイミングで実際に確定することになります。'
  },
  { id:1099, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、不要になった<mark class="q-asset">備品を、帳簿から取り除く</mark>こと（<strong>除却</strong>）にした。この備品の<mark class="q-asset">帳簿価額は、20円である</mark>。ただ、この備品の部品の<mark class="q-asset">一部は、売れば5円になると見込まれる</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['貯蔵品',5],['固定資産除却損',15]],c:[['備品',20]]}],
    exp:'「除却」とは、使わなくなった資産を、帳簿から取り除くことです。まだ部品として売れる見込みのある分（5円）は「貯蔵品」という資産として残し、帳簿価額20円のうち残りの15円は「固定資産除却損」という費用で処理します。「まだ使わないけれど、全部価値がゼロになったわけではない」という状態を表す処理です。'
  },
  { id:1100, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、古くなった備品を使わなくなった。この備品は、もう修理もできず、売っても買い手がつかないと見込まれる。そこで、不要になった<mark class="q-asset">備品を、帳簿から取り除く</mark>こと（<strong>除却</strong>）にした。この備品の<mark class="q-expense">帳簿価額は20円である</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産除却損',20]],c:[['備品',20]]}],
    exp:'前問とは違い、売っても一切値段がつかない見込みの場合は、貯蔵品として残す分はなく、帳簿価額20円の全額を「固定資産除却損」という費用として処理します。まだ使わなくなっただけで処分（廃棄）まではしていない点が、次の問題の「廃棄」との違いです。'
  },
  { id:1101, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、使わなくなった古い備品を、置いておく場所がなくなったため、専門の業者に頼んで、廃棄処分することにした。この<mark class="q-asset">備品の帳簿価額は、15円である</mark>。<mark class="q-expense">廃棄のための費用3円は</mark>、その業者に、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産廃棄損',18]],c:[['備品',15],['現金',3]]}],
    exp:'「廃棄」は、除却とは違い、完全に捨ててしまう処理です。帳簿価額15円の価値がまるごと失われる損失に加え、処分を頼んだ業者に払った廃棄費用3円も合わせて、合計18円を「固定資産廃棄損」という費用として計上します。「捨てるためにお金までかかった」という、除却よりもさらに踏み込んだ処理です。'
  },
  { id:1102, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社の建物が、火災によって焼失した。この<mark class="q-asset">建物の帳簿価額は、100円である</mark>。この建物には、火災保険がかけられているが、<mark class="q-asset">受け取れる保険金の金額は、この時点では、まだ決まっていない</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['火災未決算',100]],c:[['建物',100]]}],
    exp:'「保険金」とは、火災などの損害があったときに、保険会社から受け取るお金のことです。保険に入っている場合、保険金の金額がまだ決まっていない段階で、いきなり損失を確定させるわけにはいきません。そこで、焼失した建物の帳簿価額100円を、いったん「火災未決算」という仮の資産科目（＝保険金の決定を待っている状態）に振り替えておきます。'
  },
  { id:1103, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の火災について、保険会社が、被害の調査を終えた。X社は、保険会社から、<mark class="q-expense">保険金80円を支払う</mark>という連絡を受けた。ただし、この保険金は、まだ受け取っていない。この日の仕訳を行いなさい。',
    e:[{d:[['未収入金',80],['火災損失',20]],c:[['火災未決算',100]]}],
    exp:'保険金の金額（80円）が確定したら、「火災未決算」という仮の科目を精算します。確定した保険金80円は「未収入金」という資産（＝もうすぐ受け取れるお金）として計上し、保険でカバーしきれなかった差額20円は、正真正銘の損失として「火災損失」という費用で処理します。'
  },
  { id:1104, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記とは別の火災で、X社の建物（帳簿価額100円）が焼失した。この火災が起きたとき、<mark class="q-asset">受け取れる保険金の金額はまだ決まっていなかった</mark>ため、この建物の帳簿価額は、火災が起きた日に、処理済みである。この火災について、X社は、保険会社から、<mark class="q-revenue">保険金120円を支払う</mark>という連絡を受けた。<mark class="q-asset">保険金は、まだ受け取っていない</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['未収入金',120]],c:[['火災未決算',100],['保険差益',20]]}],
    exp:'今度は、保険金（120円）の方が建物の帳簿価額（100円）より多く支払われるケースです。火災未決算100円を精算したうえで、確定した保険金120円との差額20円は、損失どころか得をした分なので、「保険差益」という収益として計上します。保険金が帳簿価額を上回るか下回るかで、損失（火災損失）になるか利益（保険差益）になるかが変わる点がポイントです。'
  },
  { id:1105, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、車で通勤する従業員が増えたため、会社の隣の土地を、従業員用の駐車場にすることにした。そのための<mark class="q-asset">土地を、500円で購入</mark>した。代金は、<mark class="q-asset">小切手を振り出して</mark>支払った。この日の仕訳を行いなさい。',
    e:[{d:[['土地',500]],c:[['当座預金',500]]}],
    exp:'駐車場として長く使う目的で買った土地は「土地」という資産で処理します。建物とは違い、土地は使っても価値が目減りしていくものではないと考えられているため、減価償却の対象にはなりません。'
  },
  { id:1106, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、営業担当者が、得意先を回るときに使う自動車が必要になった。そこで、営業のために使う<mark class="q-asset">自動車を、80円で購入した</mark>。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['車両運搬具',80]],c:[['現金',80]]}],
    exp:'営業で使う自動車のような乗り物は「車両運搬具」という資産で処理します。備品や建物と同じ有形固定資産の仲間ですが、科目名が違うので、問題文に「自動車」「トラック」などが出てきたら車両運搬具を使う、と覚えておきましょう。'
  },
  { id:1107, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、事務所で使う<mark class="q-asset">備品を、割賦契約で購入</mark>した。この契約では、代金を、何回かに分けて支払う。この備品を、現金で一度に買った場合の値段は、90円である。分けて支払う代金の合計は100円で、この中には、<mark class="q-asset">10円の利息</mark>が含まれている。<mark class="q-liability">代金は、これから支払っていく</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['備品',90],['前払利息',10]],c:[['未払金',100]]}],
    exp:'「割賦」とは、代金を、何回かに分けて支払うことです。分割払いにすると、一括で買うより合計額が高くなりますが、この差額（100円－90円＝10円）は備品そのものの値段ではなく、分割払いにしたことへの利息です。備品の本体価格（90円）は資産として計上し、利息分（10円）は「前払利息」という資産として先にまとめて計上しておき、毎回の支払いのたびに少しずつ費用（支払利息）に振り替えていきます。'
  },
  { id:1108, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の割賦購入について、1回目の支払いの期日が来た。X社は、約束どおりに、<mark class="q-asset">1回目の支払いを行った</mark>。この1回目の支払いに含まれる<mark class="q-expense">利息は、1円である</mark>。この日、この1円の利息について、必要な仕訳を行いなさい（支払い自体の仕訳は、ここでは行わない）。',
    e:[{d:[['支払利息',1]],c:[['前払利息',1]]}],
    exp:'あらかじめ「前払利息」としてまとめて計上していたうち、今回の支払い分に対応する1円だけを、実際の費用（支払利息）に振り替えます。分割払いのたびに、前払いしていた利息を少しずつ本当の費用として認識していく処理です。'
  },
  { id:1109, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'家電を一般のお客さんに売っているY社は、新しい店を出すことになった。<mark class="q-asset">店の内装工事の代金として</mark>、<mark class="q-asset">200円を現金で支払った</mark>。この店は、賃貸借契約で借りている建物にあり、契約では、店を閉めるときに、<mark class="q-liability">内装を撤去して、元の状態に戻す工事をする義務</mark>がある。この将来の工事にかかる費用を、現在の価値に直した金額は、24円と見積もられた。Y社は、内装工事の代金と、この24円をあわせて、店の内装の取得にかかった金額として扱う。この日の仕訳を行いなさい。',
    e:[{d:[['建物付属設備',224]],c:[['現金',200],['資産除去債務',24]]}],
    exp:'「賃貸借契約」とは、建物などを、お金を払って借りる契約です。「現在価値」とは、将来払う金額を、今の時点の価値に直した金額です。借りている建物を将来原状回復する義務がある場合、その将来の撤去費用もあらかじめ見積もって「資産除去債務」という負債として計上し、同時にその見積額を内装設備の取得原価にも上乗せします。「これから使う分だけでなく、使い終えた後の片付け費用も、資産を取得する本当のコストのうち」と考える処理です。'
  },
  // ===== PDF教材準拠（新版）差し替え終了 =====

  // ===== PDF教材準拠（新版パート2）差し替え開始 =====
  // --- 第6章：有形固定資産 ---
  { id:1110, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'決算にあたり、Y社は、上記の、<mark class="q-liability">店を閉めるときに元に戻す工事の費用24円</mark>を、あらためて見直した。時間が1年たったことで、この<mark class="q-expense">費用の現在の価値は、1円増えた</mark>。工事の費用そのものの見積りは、変わっていない。決算に必要な仕訳を行いなさい。',
    e:[{d:[['利息費用',1]],c:[['資産除去債務',1]]}],
    exp:'資産除去債務は「将来の工事費用を、現在の価値に直した金額」で計上しています。時間が経つほど、支払う日が近づいてくるため、現在価値はだんだん本来の金額に近づいていきます。この「時間の経過による価値の増加分」を「利息費用」という費用で処理し、資産除去債務（負債）もその分増やします。工事費用そのものの見積りは変わっていないのに、帳簿上の金額が毎年少しずつ増えていくのはこのためです。'
  },
  { id:1111, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'Y社は、賃貸借契約が終わったため、<mark class="q-liability">店を閉め、元の状態に戻す工事を行った</mark>。工事の実際の費用は25円で、<mark class="q-asset">現金で支払った</mark>。この工事の費用について、これまでに積み上げてきた金額も、25円である。この日の仕訳を行いなさい。',
    e:[{d:[['資産除去債務',25]],c:[['現金',25]]}],
    exp:'実際に原状回復工事を行い、見積もっていた金額どおり25円を現金で支払いました。これまで少しずつ積み上げてきた資産除去債務（負債）をちょうど取り崩して精算するだけなので、損益は発生しません。見積りと実際の金額がぴったり一致した、きれいな決着です。'
  },
  { id:1112, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'荷物の運送を営むZ社は、営業用のトラックを買い換えることにした。<mark class="q-asset">古いトラックの取得原価は80円で</mark>、<mark class="q-asset">これまでの減価償却累計額は60円である</mark>。記帳は間接法によっている。古いトラックは、新しいトラックの購入代金の一部に充てるため、販売店に下取りに出した。下取り価格は、15円と査定された。<mark class="q-asset">新しいトラックの値段は100円で</mark>、<mark class="q-expense">下取り価格との差額85円は</mark>、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['車両運搬具',100],['減価償却累計額',60],['固定資産売却損',5]],c:[['車両運搬具',80],['現金',85]]}],
    exp:'「下取り」とは、古い資産を、新しい資産の購入代金の一部に充てるために、相手に引き取ってもらうことです。古いトラックの帳簿価額（取得原価80円－減価償却累計額60円＝20円）と、下取り価格15円を比べると、20円の価値のものを15円でしか引き取ってもらえなかったので、差額5円は「固定資産売却益」ではなく「固定資産売却損」になります。新しいトラック100円の取得原価を計上しつつ、古いトラック（資産とその減価償却累計額）を帳簿から取り除き、下取り価格を差し引いた残り85円を現金で支払います。'
  },
  { id:1113, cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'印刷業を営むW社は、中古の印刷機を、200円で購入した。この印刷機は、法定耐用年数が10年で、すでに6年使われたものである。W社は、この印刷機の残存耐用年数を、次の簡便な方法で見積もることにした。<strong>残存耐用年数＝法定耐用年数－経過年数＋経過年数×20％（1年未満は切り捨て）</strong>。この印刷機の<mark class="q-asset">残存価額はゼロ</mark>で、定額法を採用し、<mark class="q-asset">記帳は間接法</mark>によっている。決算にあたり、<mark class="q-expense">この期の価値の減少分</mark>について、必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',40]],c:[['減価償却累計額',40]]}],
    exp:'「法定耐用年数」とは、税法で定められている、その資産の耐用年数のことです。「残存耐用年数」とは、これから使える見込みの年数のことで、中古の資産では簡便な方法で見積もります。残存耐用年数＝10年－6年＋6年×20％＝10－6＋1.2＝5.2年→1年未満切り捨てで5年。減価償却費＝200円÷5年＝40円です。新品の資産とは違い、中古資産では「すでに何年使われたか」を考慮して、残りの使用可能年数を見積もり直す点がポイントです。'
  },
  // --- 無形資産・リース・引当金 ---
  { id:1114, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'化粧品を開発して販売しているX社は、肌にやさしい新しい化粧水を、来年発売したいと考えている。そのため、研究部門で、成分の研究や試作を行った。研究は続いており、商品として発売できるかどうかは、まだわからない。この<mark class="q-expense">研究活動にかかった費用40円を</mark>、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['研究開発費',40]],c:[['現金',40]]}],
    exp:'新しい商品や技術を開発するための、研究や試作にかかった費用は「研究開発費」という費用で処理します。「商品として発売できるかどうかは、まだわからない」とあるように、将来の収益につながるかが不確かな支出は、資産にはせず、支払った時点で費用にするのが会計のルールです。'
  },
  { id:1115, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、自社の研究部門で、化粧水の新しい製造方法を発明した。この製造方法を、他社にまねされないように、<mark class="q-asset">特許の登録を行った</mark>。登録が認められ、登録にかかった費用60円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['特許権',60]],c:[['現金',60]]}],
    exp:'「特許」とは、発明を、一定の期間、独占して使うことができる権利（特許権）を、国から与えられることです。研究開発費（前問）とは違い、特許として正式に登録が認められた権利は、将来にわたって独占的に使える価値のある財産なので、「特許権」という無形固定資産（形のない資産）として計上します。'
  },
  { id:1116, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'決算にあたり、X社は、上記の特許権について、この期の償却を行う。この<mark class="q-expense">特許権の取得原価は60円で、10年間にわたって、毎年同じ金額ずつ償却する（定額法）</mark>。記帳は、<mark class="q-asset">特許権の金額を直接減らす方法（直接法）</mark>による。決算に必要な仕訳を行いなさい。',
    e:[{d:[['特許権償却',6]],c:[['特許権',6]]}],
    exp:'「償却」とは、無形資産の価値の減少分を、毎期の費用にしていくことです。特許権のような無形固定資産も、有形固定資産の減価償却と同じように、使える期間にわたって少しずつ費用化していきます。60円÷10年＝6円が1年分の償却額です。無形資産はふつう「直接法」（資産の金額から直接差し引く方法）で記帳するので、相手科目は「特許権」そのものになります。'
  },
  { id:1117, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、新しい化粧品ブランドを立ち上げることになり、そのブランドの名前とマークを、他社に使われないようにしたいと考えた。そこで、<mark class="q-asset">商標の登録を行った</mark>。登録にかかった<mark class="q-asset">費用30円を、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['商標権',30]],c:[['現金',30]]}],
    exp:'「商標」とは、商品の名前やマークを、独占して使うことができる権利（商標権）を、国から与えられることです。特許権が「発明」を守る権利なのに対し、商標権は「ブランド名やロゴ」を守る権利です。どちらも国への登録によって生まれる、無形固定資産の仲間です。'
  },
  { id:1118, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、店舗ごとの在庫や販売を、コンピュータで管理したいと考えた。市販のソフトウェアでは、自社に合わなかったため、自社の社員が、自社で使うソフトウェアを開発した。<mark class="q-asset">ソフトウェアが完成</mark>し、開発にかかった<mark class="q-asset">費用50円を、現金で支払った</mark>。このソフトウェアは、自社で使うためのもので、販売はしない。この日の仕訳を行いなさい。',
    e:[{d:[['ソフトウェア',50]],c:[['現金',50]]}],
    exp:'自社で使うために作ったり買ったりしたソフトウェアは「ソフトウェア」という無形固定資産で処理します。「販売するためではなく、自社で使うためのもの」という点がポイントで、これによって将来の業務コスト削減などの効果が見込めるため、研究開発費のような不確実な支出とは違い、資産として計上できます。'
  },
  { id:1119, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、自社で使う新しい販売管理ソフトウェアの制作を、外部のIT会社に依頼した。<mark class="q-asset">ソフトウェアは、まだ完成していない</mark>。制作費の一部として、<mark class="q-asset">20円を現金で先に支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['ソフトウェア仮勘定',20]],c:[['現金',20]]}],
    exp:'制作を頼んだソフトウェアが完成するまでの間に支払った代金は、いったん「ソフトウェア仮勘定」という一時的な資産に記録しておきます。建物でいえば「建設仮勘定」にあたる科目です。完成して引渡しを受けたときに、正式な「ソフトウェア」という資産に振り替えます。'
  },
  { id:1120, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'その後、X社が外部のIT会社に依頼していた、上記の販売管理<mark class="q-asset">ソフトウェアが完成</mark>した。動作の確認も終わり、X社は、この<mark class="q-asset">ソフトウェアの引渡しを受けた</mark>。これまでに支払った20円が、このソフトウェアの制作費の全額である。ソフトウェアが完成した日に、必要な仕訳を行いなさい。',
    e:[{d:[['ソフトウェア',20]],c:[['ソフトウェア仮勘定',20]]}],
    exp:'ソフトウェアが完成し、正式に引渡しを受けたので、それまで仮の置き場所だった「ソフトウェア仮勘定」を、正式な「ソフトウェア」という資産に振り替えます。建設仮勘定が完成した建物に振り替わるのと、まったく同じ考え方です。'
  },
  { id:1121, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'決算にあたり、X社は、上記の自社で開発した<mark class="q-asset">ソフトウェア（取得原価50円）</mark>について、この期の償却を行う。このソフトウェアは、<mark class="q-expense">5年間使う見込みで、毎年同じ金額ずつ償却する（定額法）</mark>。記帳は直接法による。決算に必要な仕訳を行いなさい。',
    e:[{d:[['ソフトウェア償却',10]],c:[['ソフトウェア',10]]}],
    exp:'ソフトウェアも特許権と同じように、使用見込み期間にわたって少しずつ償却していきます。50円÷5年＝10円が1年分の償却額（ソフトウェア償却という費用）です。記帳は直接法なので、相手科目はソフトウェアそのものになります。'
  },
  { id:1122, cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、同業のY社の事業を、<mark class="q-asset">現金120円で買い取った</mark>。受け入れた資産の時価は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。X社は、Y社が築いた<mark class="q-asset">ブランド力や顧客基盤に価値</mark>があると考え、受け入れた資産の時価の合計より高い代金を払った。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40],['のれん',20]],c:[['現金',120]]}],
    exp:'「時価」とは、その時点の市場での価格のことです。他の会社の事業を買ったときに、受け入れた資産の時価の合計（60円＋40円＝100円）より多く払った差額（120円－100円＝20円）は「のれん」という無形固定資産で処理します。これは、相手会社が築いてきたブランド力や顧客基盤など、目に見えない価値に対して追加で払った金額を表しています。'
  },
  { id:1123, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'水産物を加工して販売しているX社は、Y社と、加工工場で使う<mark class="q-asset">冷凍設備Aについて、ファイナンス・リース契約</mark>を結んだ。リース期間は5年で、<mark class="q-liability">リース料は毎年11円（総額55円）</mark>である。この冷凍設備Aを、現金で買った場合の見積価額は、50円である。X社は<strong>利子込み法</strong>によって処理する。契約を結んだ日の仕訳を行いなさい。',
    e:[{d:[['リース資産',55]],c:[['リース債務',55]]}],
    exp:'「ファイナンス・リース」とは、契約の途中で解約できず、借りた設備のほぼ全ての費用を、借り手が負担するリース契約のことです（実質的には、設備を購入したのと同じとみなされます）。「利子込み法」とは、リース料の総額を、そのまま、リース資産とリース債務として計上する方法です。借りているだけなのに「リース資産」という資産を計上するのは、実質的に分割払いで設備を買ったのと同じと考えるためです。'
  },
  { id:1124, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、Y社と、<mark class="q-asset">冷凍設備Bについても、ファイナンス・リース契約</mark>を結んだ。リース期間は5年で、<mark class="q-liability">リース料は毎年11円（総額55円）</mark>である。この冷凍設備Bを、現金で買った場合の見積価額は、50円である。リース料の総額と、この見積価額との差額5円は、利息にあたる。X社は、この利息相当額を区別して、<strong>利子抜き法</strong>によって処理する。契約を結んだ日の仕訳を行いなさい。',
    e:[{d:[['リース資産',50]],c:[['リース債務',50]]}],
    exp:'「利子抜き法」とは、リース料の総額から、利息相当額を差し引いた金額（見積現金購入価額）を、リース資産とリース債務として計上する方法です。前問の利子込み法（総額55円で計上）とは違い、利息相当額5円（55円－50円）を最初から除いた50円だけを資産・負債として計上します。利息部分は、支払いのたびに少しずつ費用として認識していきます（次の問題参照）。'
  },
  { id:1125, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'上記の冷凍設備Bのリース契約について、リース料の支払日が来た。契約では、<mark class="q-liability">リース料は、毎年同じ日に、11円ずつ支払う</mark>ことになっている。X社は、第1回のリース料11円を、<mark class="q-asset">現金で支払った</mark>。<mark class="q-expense">利息相当額5円は</mark>、リース期間の5年間にわたって、毎年同じ金額ずつ配分する（<strong>定額法</strong>）。この日の仕訳を行いなさい。',
    e:[{d:[['リース債務',10],['支払利息',1]],c:[['現金',11]]}],
    exp:'利子抜き法では、毎回のリース料支払いを「元本（リース債務）の返済」と「利息」の2つに分けます。利息相当額5円を5年間で均等に配分すると、5円÷5年＝1円が1年分の利息（支払利息）です。支払った11円のうち、1円は利息として費用計上し、残り10円はリース債務（負債）を返済したものとして処理します。'
  },
  { id:1126, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'決算にあたり、X社は、上記の冷凍設備B（リース資産50円）について、この期の価値の減少分を計算することにした。この期は、契約を結んだ日から1年間、この設備を使った。<mark class="q-expense">リース期間は5年、耐用年数も5年で、残存価額はゼロである</mark>。定額法を採用し、記帳は<mark class="q-asset">間接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',10]],c:[['リース資産減価償却累計額',10]]}],
    exp:'リース資産も、自社で所有する固定資産と同じように減価償却を行います。50円÷5年＝10円が1年分の減価償却費です。「間接法」なので、リース資産の金額は直接減らさず、「リース資産減価償却累計額」という別の科目に、これまでの減少分を積み上げていきます。'
  },
  { id:1127, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、事務所のコピー機を、<mark class="q-expense">オペレーティング・リース契約</mark>で借りている。この契約は、ファイナンス・リースに当てはまらない、通常の賃貸借に近いリース契約である。X社は、当月分のリース料10円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['支払リース料',10]],c:[['現金',10]]}],
    exp:'「オペレーティング・リース」とは、ファイナンス・リース以外のリース契約のことです（実質的には、設備を購入したのではなく、借りているだけと考えます）。ファイナンス・リースのように資産・負債を計上する必要はなく、毎月のリース料を、そのまま「支払リース料」という費用として処理するだけの、普通の賃貸借と同じシンプルな処理です。'
  },
  { id:1128, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、<mark class="q-asset">ファイナンス・リースによって、冷凍設備Cを使っている</mark>。この冷凍設備Cの帳簿価額は、30円である。ところが、水産物の市況が急激に悪化し、この設備を使った事業の収益性が、大きく下がった。そこで、この設備の回収可能価額を見積もったところ、18円であった。X社は、<mark class="q-expense">帳簿価額を、回収可能価額まで切り下げる</mark>。必要な仕訳を行いなさい。',
    e:[{d:[['減損損失',12]],c:[['リース資産',12]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。「回収可能価額」とは、その資産を使ったり売ったりして、将来回収できると見込まれる金額のことです。ファイナンス・リースのリース資産も、自社所有の固定資産と同じように減損会計の対象になります。帳簿価額30円が回収可能価額18円まで下がったと判断されたので、差額12円を「減損損失」という費用として計上し、リース資産の帳簿価額を実態に合わせて切り下げます。'
  },
  { id:1129, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'紙を製造して販売しているX社は、工場の主要な機械について、2年に1度、大がかりな修繕を行っている。次の修繕は、来期に予定されている。この<mark class="q-liability">修繕にかかる費用は、8円と見積もられている</mark>。<mark class="q-expense">今期の決算にあたり</mark>、X社は、この修繕に備えて、必要な仕訳を行いなさい。',
    e:[{d:[['修繕引当金繰入',8]],c:[['修繕引当金',8]]}],
    exp:'引当金とは「将来発生しそうな費用・損失を、実際に発生する前から見積もって、今期の費用として先取りしておく」仕組みです。来期に予定している機械の修繕は、今期の事業活動によって生じた摩耗などが原因と考えられるため、その費用を先取りして「修繕引当金繰入」という費用で計上し、「修繕引当金」という負債として備えておきます。'
  },
  { id:1130, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社の従業員に対する賞与は、年2回、6月と12月に支払われる。6月に支払う賞与は、1月から6月までの6か月間の働きに対するもので、<mark class="q-liability">支給見込み額は45円である</mark>。X社の決算日は2月末で、今期には、このうち1月と2月の2か月分が含まれる。決算にあたり、この賞与のうち、<mark class="q-expense">今期に対応する分について、必要な仕訳</mark>を行いなさい。',
    e:[{d:[['賞与引当金繰入',15]],c:[['賞与引当金',15]]}],
    exp:'賞与は実際に支払うのが来期であっても、その対象となる働きはすでに今期に発生している分があります。6か月分（45円）の賞与のうち、今期に含まれる2か月分（1月・2月）を月割りで計算すると、45円×2か月／6か月＝15円です。この金額を今期のうちに「賞与引当金繰入」という費用と「賞与引当金」という負債として先取りで計上します。'
  },
  { id:1131, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、役員に対しても、賞与を支払う予定である。この役員賞与は、株主総会で決議されて支払われるもので、<mark class="q-liability">支給見込み額は10円である</mark>。この10円は、今期の働きに対するものである。<mark class="q-expense">決算にあたり</mark>、必要な仕訳を行いなさい。',
    e:[{d:[['役員賞与引当金繰入',10]],c:[['役員賞与引当金',10]]}],
    exp:'役員に支払う賞与も、一般従業員の賞与と同じように「発生した期間の費用として先取りする」のが原則です。株主総会での正式な決議はまだでも、対象となる働きはすでに今期に発生しているため、見積額10円を今期のうちに「役員賞与引当金繰入」という費用と「役員賞与引当金」という負債として計上します。'
  },
  { id:1132, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、従業員が退職するときに、退職金を支払うことになっている。退職金は、従業員が働いた期間に応じて、少しずつ発生していく。<mark class="q-liability">今期に発生した分は、25円と見積もられた</mark>。<mark class="q-expense">決算にあたり</mark>、この25円について、必要な仕訳を行いなさい。',
    e:[{d:[['退職給付費用',25]],c:[['退職給付引当金',25]]}],
    exp:'退職給付引当金は、将来支払う退職金を、従業員が実際に働いた期間に応じて少しずつ費用として積み立てていく仕組みです。今期の労働に対応する見込み額（25円）を、今期のうちに「退職給付費用」という費用と「退職給付引当金」という負債として計上します。実際に退職金を支払うのはずっと先でも、少しずつ準備しておく、という考え方です。'
  },
  { id:1133, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'家電を一般のお客さんに売っているX社は、販売した商品に、購入から1年間の無償修理の保証を付けている。過去の実績から、保証の期間中に、販売した商品の一部が故障して、修理が必要になることが、わかっている。今期に販売した商品について、<mark class="q-liability">将来かかると見込まれる保証の費用は、6円</mark>と見積もられた。<mark class="q-expense">決算にあたり</mark>、必要な仕訳を行いなさい。',
    e:[{d:[['商品保証引当金繰入',6]],c:[['商品保証引当金',6]]}],
    exp:'商品保証引当金は、販売した商品に将来発生するかもしれない無償修理・交換の費用を、販売した期のうちに見積もって先取りしておく仕組みです。「今期売った商品の保証費用は、今期の売上に対応するコストである」という考え方にもとづき、見積額6円を「商品保証引当金繰入」という費用と「商品保証引当金」という負債として計上します。'
  },
  { id:1134, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、前の期に販売した商品について、お客さんから修理の依頼を受けて、修理を行った。<mark class="q-expense">修理にかかった実際の費用8円は</mark>、<mark class="q-asset">現金で支払った</mark>。前の期の決算で、この<mark class="q-liability">保証のために見積もって計上していた金額は、6円である</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['商品保証引当金',6],['商品保証費',2]],c:[['現金',8]]}],
    exp:'実際に保証修理の費用が発生したら、まず前期に積み立てておいた貯金箱（商品保証引当金6円）を取り崩して充て、それでも足りない超過分（8円－6円＝2円）は、新たに今期の費用（商品保証費）として追加計上します。見積もりが実際の費用より少なかった場合の、不足分の埋め合わせです。'
  },
  // --- 第10章：株式会社会計 ---
  { id:1135, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'パンを製造して販売する会社を新しく作ることになり、X社が設立された。設立にあたって、株式を発行し、<mark class="q-asset">払込金額200円が、当座預金口座に振り込まれた</mark>。X社は、<mark class="q-equity">払込金額の全額を、法定の資本として組み入れた</mark>。設立の日の仕訳を行いなさい。',
    e:[{d:[['当座預金',200]],c:[['資本金',200]]}],
    exp:'「払込金額」とは、株式を発行するときに、株主が会社に払い込むお金のことです。「法定の資本」とは、株主が払い込んだお金のうち、会社法で、会社の資本として扱われるもののことです。株式を発行して集めたお金は、銀行から借りるお金とは違い、返済する義務のない会社自身の元手になります。払込金額の全額を法定の資本とする場合は、そのまま「資本金」という純資産に計上します。'
  },
  { id:1136, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、設立に必要な、法律で決められた手続きを行った。会社の基本となるルール（定款）を作り、設立の登記を行った。これらにかかった、<mark class="q-asset">定款の作成費用や設立登記の税金</mark>など、合計15円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['創立費',15]],c:[['現金',15]]}],
    exp:'「定款」とは、会社の目的や組織などを定めた、会社の基本となるルールのことです。会社を設立するためにかかった費用（定款作成費・登記の税金など）は「創立費」という科目で処理します。創立費は、名前に「費」とつきますが費用科目ではなく、会社の設立準備のために支出したお金をいったん資産（繰延資産）として計上し、その後数年にわたって少しずつ償却していく科目です。会社そのものがまだ存在しない設立準備の段階でかかった費用なので、次の問題で出てくる「開業費」（会社ができた後の準備費用）とは区別します。'
  },
  { id:1137, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、設立が終わったあと、パン屋の営業を始めるための準備を進めた。お店を開く前に、開店を知らせるための広告を出し、事務所の準備も行った。<mark class="q-asset">営業を始めるまでの間に、これらにかかった広告費や事務所の準備の費用</mark>として、合計8円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['開業費',8]],c:[['現金',8]]}],
    exp:'「開業費」とは、会社を設立した後、実際に営業を始めるまでの準備期間にかかった費用（広告・事務所の準備など）のことです。創立費と同じく、開業費も名前に反して費用科目ではなく、支出した時点ではいったん資産（繰延資産）として計上し、その後少しずつ償却していく科目です。会社が生まれる前の費用（創立費）とは違い、会社が生まれた後、営業が始まるまでの準備費用である点が違いです。「法人ができる前か、後か」で創立費と開業費を使い分けるのがポイントです。'
  },
  { id:1138, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'衣料品の企画と販売をしているX社は、新しく株式を発行して、事業の資金を集めることにした。<mark class="q-liability">株式の申込みをした人から、申込みの際に払い込まれる300円を、申込証拠金として受け取り</mark>、通常の預金とは区別した<mark class="q-asset">専用の口座に預け入れた</mark>。株式は、まだ発行していない。この日の仕訳を行いなさい。',
    e:[{d:[['別段預金',300]],c:[['株式申込証拠金',300]]}],
    exp:'「申込証拠金」とは、株式の申込みをした人が、払込期日の前に、申込みの際に払い込むお金のことです。まだ正式に株式を発行していない段階なので、受け取ったお金は資本金にはせず、「株式申込証拠金」という一時的な負債（＝正式な株主になるまでの預かり金）で処理します。入金先も通常の預金とは区別した「別段預金」という専用口座（資産）を使います。'
  },
  { id:1139, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、<mark class="q-equity">増資にあたり、新株を発行した</mark>。払込金額200円が、<mark class="q-asset">当座預金口座に振り込まれた</mark>。X社は、払込金額のうち、<mark class="q-equity">会社法が認める最低額を、法定の資本として組み入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',200]],c:[['資本金',100],['資本準備金',100]]}],
    exp:'会社法では、払込金額の全額を資本金にするのが原則ですが、最低でも半額を資本金にすれば、残りは「資本準備金」という純資産にすることも認められています。「会社法が認める最低額」という指示は、払込金額の半分（200円×1／2＝100円）を資本金とし、残りの100円を資本準備金とすることを意味します。'
  },
  { id:1140, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、上記の増資のために、新しく株式を発行して、資金を集めた。<mark class="q-asset">新しい株式を発行するため</mark>には、証券会社に手続きを頼んだり、書類を印刷したりする必要がある。これらにかかった費用として、証券会社への手数料など、合計5円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['株式交付費',5]],c:[['現金',5]]}],
    exp:'新しく株式を発行するときにかかる事務費用（証券会社への手数料・印刷代など）は「株式交付費」という科目で処理します。株式交付費も、創立費や開業費と同じように、支出した時点ではすぐに費用にはせず、いったん資産（繰延資産）として計上し、その後少しずつ償却していく科目です。会社設立時の創立費や開業費とは違い、増資（会社ができた後の株式発行）にかかった費用である点がポイントです。'
  },
  { id:1141, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'雑貨を販売しているX社は、株主総会で、<mark class="q-equity">過去に稼いだ利益の蓄積を財源</mark>とする<mark class="q-liability">配当200円を決議した</mark>。X社の資本金は400円、資本準備金は60円、利益準備金は30円である。この決議で積み立てる準備金の金額を計算して、必要な仕訳を行いなさい。配当金は、まだ支払っていない。',
    e:[{d:[['繰越利益剰余金',210]],c:[['未払配当金',200],['利益準備金',10]]}],
    exp:'会社法では、配当をするときに、配当額の10分の1を、準備金として積み立てるルールがあります（ただし資本準備金と利益準備金の合計が、資本金の4分の1に達するまでの金額が上限です）。上限＝400円×1／4＝100円、現在の準備金合計＝60円＋30円＝90円なので、あと10円まで積み立てられます。配当額200円の10分の1は20円ですが、上限の10円までしか積み立てられないため、利益準備金は10円になります。繰越利益剰余金という貯金箱から、配当（未払配当金）と準備金の積立（利益準備金）の2つに振り分けます。'
  },
  { id:1142, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、別の期の株主総会で、これまで稼いだ利益の一部を、株主に<mark class="q-liability">配当として支払う</mark>ことにした。<mark class="q-equity">過去に稼いだ利益の蓄積を財源</mark>とする配当30円が、決議された。配当金は、決議の日から、しばらくたってから支払うことになっており、まだ支払っていない。この日の仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',30]],c:[['未払配当金',30]]}],
    exp:'配当が決議された時点で、株主に対して「支払わなければならない」という義務がすでに発生しています。決議の日にはまだ実際にお金を払っていないので、繰越利益剰余金（純資産）を減らし、「未払配当金」という負債（＝これから株主に払う義務）を計上します。'
  },
  { id:1143, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、将来、新しい店舗を出す計画を立てている。新店舗を建てるには、まとまった資金が必要になる。そこで、株主総会の決議により、<mark class="q-equity">過去に稼いだ利益の蓄積から20円を</mark>、<mark class="q-equity">新店舗の建設のための積立金</mark>として積み立てた。この日の仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',20]],c:[['任意積立金',20]]}],
    exp:'「任意積立金」のような積立金は、会社が自主的な判断で、将来の特定の目的（この場合は新店舗の建設）のために利益の一部を取り分けておく、いわば「目的別の貯金」です。法律で義務付けられた利益準備金とは違い、会社が自由な判断で金額や使いみちを決められます。繰越利益剰余金から任意積立金へ、純資産の中で科目が変わるだけの処理です。'
  },
  { id:1144, cat:'企業合併', chap:'第10章：株式会社会計',
    q:'食品を製造して販売しているX社は、同業のY社を<strong>吸収合併</strong>した。<mark class="q-revenue">合併の対価として</mark>、<mark class="q-asset">現金80円を支払った</mark>。Y社から受け入れた資産は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40]],c:[['現金',80],['負ののれん発生益',20]]}],
    exp:'「吸収合併」とは、ある会社が、他の会社を取り込んで、1つの会社になることです。受け入れた資産の時価の合計（60円＋40円＝100円）より、支払った対価（80円）の方が少なかった、つまり「お買い得に買えた」状態です。この差額20円は「負ののれん発生益」として、その期の収益に一括計上します（のれんとは逆で、資産にはせず、すぐに利益にする点に注意）。'
  },
  { id:1145, cat:'企業合併', chap:'第10章：株式会社会計',
    q:'X社は、同業のY社を<strong>吸収合併</strong>した。合併の対価として、X社の新株を発行して、Y社の株主に交付した。<mark class="q-asset">対価の総額は120円で</mark>、この全額を、法定の資本にも準備金にも組み入れず、<mark class="q-equity">その他の払込資本</mark>とする。Y社から受け入れた資産は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40],['のれん',20]],c:[['その他資本剰余金',120]]}],
    exp:'今度は対価120円の方が、受け入れた純資産100円（商品60円＋建物40円）より多いので、差額20円は「のれん」（相手会社のブランド力や将来性への対価）として資産計上します。合併の対価を新株発行でまかなう場合、会社法上は資本金にするのが原則ですが、全額を資本金にも準備金にも入れず「その他資本剰余金」という純資産にすることも認められています。'
  },
  { id:1146, cat:'企業合併', chap:'第10章：株式会社会計',
    q:'X社は、前に他の会社を合併したときに、<mark class="q-asset">のれん20円</mark>を計上している。のれんは、<mark class="q-expense">合併の日から10年間にわたって、毎年同じ金額ずつ償却する（定額法）</mark>。今期も、決算の時期になった。決算にあたり、この期の1年分について、必要な仕訳を行いなさい。',
    e:[{d:[['のれん償却',2]],c:[['のれん',2]]}],
    exp:'のれんは、他社を買収したときに「帳簿上の価値以上に払った、目に見えない価値」への対価です。この価値は永遠に続くわけではないと考えられるため、20年以内（この問題では10年）の期間にわたって少しずつ費用として償却していきます。20円÷10年＝2円が1年分の償却額です。'
  },
  { id:1147, cat:'自己株式', chap:'第10章：株式会社会計',
    q:'機械部品を製造しているX社は、自社の株価が、会社の実力に比べて安いと考えている。そこで、株主総会の決議にもとづき、市場に出回っている<mark class="q-equity">自社の株式</mark>を、株主から、40円分、買い戻すことにした。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['自己株式',40]],c:[['現金',40]]}],
    exp:'「自己株式」とは、会社が、自社で発行した株式を、株主から買い戻して、保有しているもののことです。自社の株式を買い戻すと、それは通常の資産の購入とは違い、株主に対する資本の一部払い戻しに近い意味を持ちます。そのため取得原価のまま、純資産の部から差し引くマイナス項目（自己株式）として計上します。'
  },
  { id:1148, cat:'自己株式', chap:'第10章：株式会社会計',
    q:'X社は、以前に買い戻した<mark class="q-equity">自社の株式（帳簿価額40円）</mark>を、資金が必要になったため、市場で売却することにした。自社の株価が上がっていたので、<mark class="q-equity">売却価額は45円になり</mark>、<mark class="q-asset">代金は現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',45]],c:[['自己株式',40],['自己株式処分差益',5]]}],
    exp:'買い戻していた自己株式を、取得したときより高く売却できました。この差額（5円）は商品売買のような利益ではなく、株主との資本取引から生じたものなので、損益計算書ではなく「自己株式処分差益」という純資産の項目に計上します。'
  },
  { id:1149, cat:'自己株式', chap:'第10章：株式会社会計',
    q:'X社は、以前に買い戻した<mark class="q-equity">自社の株式（帳簿価額40円）</mark>を、資金が必要になったため、市場で売却することにした。しかし、自社の株価が下がっていたので、<mark class="q-equity">売却価額は35円になり</mark>、<mark class="q-asset">代金は現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',35],['自己株式処分差損',5]],c:[['自己株式',40]]}],
    exp:'今回は逆に、自己株式を取得したときより安く売却してしまいました。この差額（5円）も、損益計算書の費用にはせず、「自己株式処分差損」という純資産の項目で処理します。自己株式の売買で生じた差額は、儲けや損ではなく、あくまで純資産内部の増減として扱われる点がポイントです。'
  },
  // --- 外貨建・伝票・給与 ---
  { id:1150, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'日本製の雑貨を輸出しているX社は、アメリカの取引先に、<mark class="q-asset">雑貨1ドル分を、掛けで売った</mark>。代金は、米ドルで支払ってもらう約束（<strong>外貨建て</strong>）である。売った日の為替相場は、1ドル＝100円で、X社は、この売掛金を100円として記録した。その後、<mark class="q-other">代金が支払われる日が来た。この日の為替相場は、1ドル＝105円であった</mark>。取引先から、代金1ドルが、円に換えられて、<mark class="q-asset">現金105円で支払われた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',105]],c:[['売掛金',100],['為替差損益',5]]}],
    exp:'「外貨建て」とは、代金を、円ではなく、外国の通貨（ここでは米ドル）で決めた取引のことです。「為替相場」とは、円と外国の通貨を交換するときの、交換の比率のことです。売った時点では1ドル＝100円で売掛金を記録していましたが、実際に代金を受け取る日には1ドル＝105円に円安が進んでいたため、予定より多くの円を受け取れました。この差額5円は「為替差損益」という収益（得をした分）として処理します。'
  },
  { id:1151, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'X社は、アメリカの仕入先から、<mark class="q-liability">原材料1ドル分を、掛けで購入した</mark>。購入した日の為替相場は、1ドル＝100円で、X社は、この買掛金を100円として記録した。代金の支払いは、3か月後である。3か月の間に円安が進むと、支払う円の金額が増えてしまう。そこで、X社は、銀行と、3か月後の為替相場をあらかじめ1ドル＝105円に決める契約（<strong>為替予約</strong>）を結んだ。X社は、この買掛金を、<mark class="q-other">予約した為替相場で円に換算した金額（105円）で、計上しなおす（振当処理）</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['為替差損益',5]],c:[['買掛金',5]]}],
    exp:'「為替予約」とは、将来の一定の日に、外貨を円に換えるときの為替相場を、あらかじめ決めておく契約のことです。「振当処理」とは、為替予約で決めた為替相場で、外貨建ての債権や債務を、円に換算した金額に、計上しなおす方法のことです。もともと100円で記録していた買掛金を、予約レートで計算した105円に修正するため、差額5円を買掛金（負債）に上乗せし、相手科目は「為替差損益」という費用（将来の支払いが増えてしまう分の損失）で処理します。予約した時点で、将来の支払額が確定するのがポイントです。'
  },
  { id:1152, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'X社は、別の取引で、アメリカの仕入先から仕入れた原材料の代金（外貨建て）を支払うために、銀行と為替予約を結んでいる。X社は、この為替予約を、買掛金とは切り離して、為替予約そのものを時価で評価する方法（<strong>独立処理</strong>）によって処理している。決算の日に、<mark class="q-liability">為替予約の時価を計算</mark>したところ、契約したときよりも不利になっており、その<mark class="q-other">差額は3円で</mark>あった。決算に必要な仕訳を行いなさい。',
    e:[{d:[['為替差損益',3]],c:[['為替予約',3]]}],
    exp:'「独立処理」とは、外貨建ての債務と、為替予約とを、切り離して、それぞれ別に評価する方法のことです。前の問題の「振当処理」（買掛金に為替予約の効果をまとめて反映させる方法）とは違い、独立処理では為替予約そのものを「為替予約」という独立した資産・負債として時価評価します。契約時より不利な方向に3円動いたので、「為替予約」という負債を3円計上し、相手科目は「為替差損益」という費用で処理します。'
  },
  { id:1156, cat:'租税・貯蔵品', chap:'税効果',
    q:'惣菜を製造して販売しているX社は、新しい取引先と、売買契約を結ぶことになり、契約書を作った。契約書には、収入印紙を貼って、税金を納める決まりになっている。そこで、郵便局で、<mark class="q-expense">収入印紙3円を</mark>、<mark class="q-asset">現金で購入</mark>し、すぐに契約書に貼って使った。この日の仕訳を行いなさい。',
    e:[{d:[['租税公課',3]],c:[['現金',3]]}],
    exp:'「収入印紙」とは、契約書や領収書などにかかる税金を、納めるために貼る、国が発行する印紙のことです。収入印紙や固定資産税のような税金関係の支出は「租税公課」という費用で処理します。買ってすぐに使った（契約書に貼った）ので、資産にはせず、そのまま費用として計上します。'
  },
  { id:1157, cat:'租税・貯蔵品', chap:'税効果',
    q:'X社は、工場の土地と建物について、市役所から、<mark class="q-expense">固定資産税の納付書を受け取った</mark>。固定資産税は、土地や建物などの固定資産を持っていることに対してかかる税金である。X社は、納付書の金額8円を、期限までに、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['租税公課',8]],c:[['現金',8]]}],
    exp:'固定資産税も、収入印紙と同じ「租税公課」という費用で処理します。商品や仕事に直接関係する税金ではなく、固定資産を保有していることに対してかかる税金なので、会社の事業活動にともなう一般的な費用として扱われます。'
  },
  { id:1158, cat:'給与・社保', chap:'税効果',
    q:'X社は、今月の従業員の給料の支払日を迎えた。従業員に対する給料の総額は、50円である。給料を支払うときは、会社が、従業員に代わって、給料から、<mark class="q-liability">所得税の源泉徴収分5円と</mark>、<mark class="q-liability">社会保険料の従業員負担分3円</mark>を差し引く。X社は、これらを<mark class="q-asset">差し引いた残りを、従業員に、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['給料',50]],c:[['現金',42],['所得税預り金',5],['社会保険料預り金',3]]}],
    exp:'「源泉徴収」とは、給料などを支払うときに、会社が、あらかじめ税金を差し引いて、従業員に代わって、国に納めることです。「社会保険料」とは、健康保険や厚生年金などの保険料で、従業員と会社が分担して負担します。給料の総支給額（50円）はまるごと会社の費用になりますが、従業員が実際に受け取る金額はそれより少なくなります。天引きした所得税と社会保険料は、会社がいったん預かって、後で国や保険機関に代わりに納める「預り金」という負債で処理します。'
  },
  { id:1159, cat:'給与・社保', chap:'税効果',
    q:'X社は、上記の給料を支払ったときに、従業員に代わって、給料から所得税5円を差し引いて、預かっていた。会社は、この預かった所得税を、従業員に代わって、国に納める義務がある。納める期限が来たため、X社は、<mark class="q-liability">預かっていた所得税5円を</mark>、税務署に、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['所得税預り金',5]],c:[['現金',5]]}],
    exp:'給料から天引きしていた所得税（預り金・負債）を、約束通り税務署に納付します。会社自身の費用ではなく、従業員の代わりに国へ届ける「預かっていたお金」を払っただけなので、負債（所得税預り金）が消えて現金が減るだけの処理になります。'
  },
  { id:1160, cat:'給与・社保', chap:'税効果',
    q:'X社は、上記の給料を支払ったときに、従業員から、社会保険料の従業員負担分3円を、預かっていた。社会保険料は、従業員が負担する分と、会社が負担する分が、同じ金額になる決まりである。そのため、会社が負担する社会保険料も、3円である。納付の期限が来たため、X社は、<mark class="q-liability">預かっていた3円と</mark>、<mark class="q-expense">会社負担の3円を</mark>、あわせて、年金事務所に、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['社会保険料預り金',3],['法定福利費',3]],c:[['現金',6]]}],
    exp:'社会保険料の納付には、従業員の給料から天引きしていた分（社会保険料預り金・負債）と、会社自身が負担する分（法定福利費・費用）の2種類が混ざっています。納付するときは、預かっていた分を返す（負債の消滅）と同時に、会社自身の負担分を新たに費用として計上する、という2つの処理を1つの取引にまとめて行います。'
  },
  { id:1161, cat:'消費税', chap:'税効果',
    q:'X社は、食材を100円で仕入れた。仕入れのときには、食材の代金のほかに、消費税8円も、あわせて支払う。X社は、消費税を、仕入や売上の金額とは区別して記帳する方法（<strong>税抜方式</strong>）を採用している。<mark class="q-expense">食材の代金100円と</mark>、<mark class="q-asset">消費税8円は</mark>、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
