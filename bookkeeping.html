    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①補助金受取</td><td>普通預金</td><td>2,000,000</td><td class="hl">国庫補助金受贈益</td><td>2,000,000</td></tr><tr><td>②機械購入</td><td>機械装置</td><td>4,000,000</td><td>現金</td><td>4,000,000</td></tr><tr><td>③圧縮積立金</td><td class="hl">繰越利益剰余金</td><td>2,000,000</td><td class="hl">圧縮積立金</td><td>2,000,000</td></tr></tbody></table><div class="formula-box">④減価償却費＝4,000,000÷4年＝1,000,000円（帳簿価額は変わらないので全額ベース）<br>積立金取崩額＝2,000,000÷4年＝500,000円（圧縮積立金→繰越利益剰余金）</div>`,
    exp:'積立金方式は「帳簿価額はそのまま、利益剰余金から圧縮積立金へ積み立てる」方法。固定資産の価額は変わらないので減価償却費は取得原価全額ベースで計算。毎期、補助金相当額÷耐用年数を圧縮積立金から繰越利益剰余金へ取り崩す（課税の繰り延べ効果を均等に享受）。',

      {label:'③借方（圧縮積立金の設定時借方）', hint:'剰余金の一部を積立金へ振り替えるとき借方は？', ans:'繰越利益剰余金', choices:['繰越利益剰余金','固定資産圧縮損','機械装置','利益準備金']},
      {label:'④1年目の減価償却費', hint:'積立金方式では帳簿価額は変わらない。4,000,000÷4年＝？', ans:1000000, unit:'円', choices:[1000000,800000,500000,750000]},
      {label:'④1年目の積立金取崩額', hint:'圧縮積立金2,000,000円を4年で均等取崩し。', ans:500000, unit:'円', choices:[500000,400000,1000000,250000]}
    ]

  { id:391, level:2, cat:'圧縮記帳',
    q:'直接控除方式で圧縮記帳済みの建物：取得原価10,000,000円・固定資産圧縮損3,000,000円（計上済み）・耐用年数20年・残存価額0円・定額法。\n①圧縮後の帳簿価額②毎年の減価償却費③減価償却の仕訳を行いなさい。',

  },

  { id:392, level:2, cat:'圧縮記帳',
    q:'（穴埋め）\n━━ 圧縮記帳の2方式とは ━━\n国から補助金をもらったとき、すぐに全額課税されると困るため、課税を将来に繰り延べる会計処理。\n「直接控除方式」と「積立金方式」の2つのやり方がある。\n━━━━━━━━━━\n\n例）国庫補助金2,000,000円・機械装置4,000,000円・耐用年数4年・定額法\n\n① 直接控除方式：圧縮後の機械帳簿価額\n   4,000,000 − 2,000,000 ＝ 【①】円\n\n② 直接控除方式の年間減価償却費\n   2,000,000 ÷ 4年 ＝ 【②】円（積立金方式の半額！）\n\n③ 積立金方式の年間減価償却費\n   4,000,000 ÷ 4年 ＝ 【③】円（取得原価全額ベース）\n\n④ 積立金方式の年間圧縮積立金取崩額\n   2,000,000 ÷ 4年 ＝ 【④】円（毎期課税調整）\n\n直接控除：帳簿価額を下げる→償却費減→少しずつ課税',
    q_en:'(Fill in) Comparison of two compression methods. The purpose is to defer tax on [①]. Direct reduction: book value is [②] → depreciation becomes [③]. Reserve method: book value is [④] → each period [⑤] is released.',
    a:'① 収益（国庫補助金受贈益）　② 減額（圧縮）　③ 小さく　④ 変わらない　⑤ 圧縮積立金\n\n【計算過程】\n直接控除方式：帳簿価額を補助金額だけ下げる → 減価償却の基礎が小さくなる → 毎期の償却費が減る → 少しずつ課税\n積立金方式：帳簿価額はそのまま → 圧縮積立金（純資産）を積立 → 毎期取崩して課税調整\n\n▶ ポイント：両方式とも「補助金受取時の一括課税を避けて、将来に分割課税する」効果は同じ。直接控除方式が簡単で実務主流',
    exp:'圧縮記帳は税務上の特例で、補助金収益をすぐに課税せず分割課税するイメージ。直接控除方式は帳簿価額を下げることで減価償却費（損金）を減らし、毎期少しずつ課税される。積立金方式は帳簿価額を変えず、積立金の取崩しで課税調整する。',
    steps:[
      {label:'①直接控除方式の圧縮後帳簿価額', hint:'機械4,000,000 − 補助金2,000,000 = ?', ans:2000000, unit:'円', choices:[2000000,4000000,1000000,3000000]},
      {label:'②直接控除方式の年間減価償却費', hint:'圧縮後帳簿価額2,000,000 ÷ 4年 = ?', ans:500000, unit:'円', choices:[500000,1000000,250000,750000]},
      {label:'③積立金方式の年間減価償却費', hint:'積立金方式：取得原価4,000,000 ÷ 4年 = ?（帳簿価額は変わらない）', ans:1000000, unit:'円', choices:[1000000,500000,2000000,750000]},
      {label:'④積立金方式の年間圧縮積立金取崩額', hint:'圧縮積立金2,000,000 ÷ 4年 = ?（毎期均等取崩し）', ans:500000, unit:'円', choices:[500000,1000000,250000,750000]}
    ]
  },

  { id:393, level:2, cat:'繰延資産',
    q:'会社設立後・営業開始前に広告宣伝費400,000円・従業員研修費100,000円を現金で支払い、開業費（繰延資産）として計上した。①計上時の仕訳と②決算時（5年定額法・当期12ヶ月）の年間償却仕訳を行いなさい。',

  { id:395, level:2, cat:'繰延資産',

  { id:396, level:2, cat:'繰延資産',
    q:'（穴埋め）\n━━ 繰延資産の種類と最長償却期間とは ━━\n繰延資産とは「支出したがすぐに費用にせず、数年かけて費用化する資産」のこと。\n株式交付費だけ3年、他は5年が基本（社債発行費のみ特殊ルール）。\n━━━━━━━━━━\n\n例①）創立費500,000円を定額法で最長償却期間にわたり償却\n   年間償却額 ＝ 500,000 ÷ 【①】年 ＝ 100,000円\n\n例②）株式交付費600,000円を定額法で最長償却期間にわたり償却\n   年間償却額 ＝ 600,000 ÷ 【②】年 ＝ 200,000円\n\n例③）開業費400,000円・2年経過後の未償却残高\n   400,000 − (400,000÷5年×2) ＝ 400,000 − 160,000 ＝ 【③】円\n\n例④）社債発行費300,000円・社債期間3年での年間償却額\n   300,000 ÷ 3年 ＝ 【④】円',
    q_en:'(Fill in) Deferred assets and their maximum amortization periods: ①Organization costs ②Pre-opening costs ③Share issuance costs ④Bond issuance costs ⑤Development costs.',
    a:'① 5　② 5　③ 3　④ 償還期限　⑤ 5\n\n【計算過程】\n創立費：5年以内（会社設立の費用）\n開業費：5年以内（営業開始前の準備費用）\n株式交付費：3年以内（他と違う！3年）\n社債発行費：社債の償還期限以内（社債の存続期間に合わせる特殊ルール）\n開発費：5年以内（研究開発費のうち繰延資産にできるもの）\n\n▶ ポイント：「株式交付費だけ3年、他は5年（社債発行費は例外）」が試験の頻出ポイント',
    exp:'繰延資産の償却期間：①創立費5年②開業費5年③株式交付費3年④社債発行費は社債の償還期限以内⑤開発費5年。株式交付費だけが3年で他は5年。社債発行費だけ「社債の期間に合わせる」という特殊ルール。試験で必ず問われる知識。',
    steps:[

  { id:399, level:2, cat:'固定資産',

    q_en:'An in-house order system was developed externally for ¥1,800,000 (paid by check; future cost savings confirmed). Record as intangible asset (software), 5yr straight-line. Show ①acquisition entry ②annual amortization amount ③amortization entry.',

    q:'増資のため株式200株を1株2,000円で発行し、払込金400,000円が普通預金に振り込まれた。会社法の規定により払込額の1/2を資本金・残りを資本準備金に計上する場合の仕訳を行いなさい。',

    e:[{d:[['普通預金',400000]],c:[['資本金',200000],['資本準備金',200000]]}]

  // ===== 特殊商品売買・収益認識（追加）=====
  { id:403, level:2, cat:'収益認識',
    q:'（委託販売・委託者の仕訳）A社（委託者）はB社（受託者）に商品（原価240,000円）を積送した。後日、B社から売上計算書（販売額400,000円・受託手数料20,000円・送金額380,000円）が届き現金が振り込まれた。A社の①積送時②計算書受取・入金時③売上原価振替の仕訳を行いなさい。',
    q_en:'(Consignment – consignor) A shipped goods (cost ¥240,000) to B. B reported: sales ¥400,000, commission ¥20,000, remitted ¥380,000. Show A\'s entries: ①shipment ②account sales receipt & cash ③cost transfer.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①積送時</td><td class="hl">積送品</td><td>240,000</td><td class="hl">仕入</td><td>240,000</td></tr><tr><td>②入金時</td><td>現金</td><td>380,000</td><td class="hl">売上</td><td>400,000</td></tr><tr><td></td><td class="hl">支払手数料</td><td>20,000</td><td></td><td></td></tr><tr><td>③原価振替</td><td class="hl">売上原価</td><td>240,000</td><td class="hl">積送品</td><td>240,000</td></tr></tbody></table>`,
    exp:'委託販売の委託者：①積送時に「仕入（商品）→積送品」へ振り替え（まだ売上ではない）。②売上計算書が届いた時点で収益認識。受託者への手数料は費用（支払手数料）として売上から差し引かない（総額表示）。③同時に積送品の原価を売上原価へ振り替え。',
    e:[{d:[['積送品',240000]],c:[['仕入',240000]]},{d:[['現金',380000],['支払手数料',20000]],c:[['売上',400000]]},{d:[['売上原価',240000]],c:[['積送品',240000]]}]
  },

  { id:404, level:2, cat:'収益認識',
    q:'（委託販売・受託者の仕訳）B社（受託者）はA社（委託者）から委託された商品を現金400,000円で全量販売した。手数料20,000円を差し引いた380,000円をA社に現金送金した。B社の①販売時②手数料計上③送金時の仕訳を行いなさい。',
    q_en:'(Consignment – agent) B sold all consigned goods for ¥400,000 cash, deducted ¥20,000 commission, and remitted ¥380,000 in cash to A. Show B\'s entries: ①sale ②commission recognition ③remittance.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①販売時</td><td>現金</td><td>400,000</td><td class="hl">受託販売</td><td>400,000</td></tr><tr><td>②手数料</td><td class="hl">受託販売</td><td>20,000</td><td class="hl">受取手数料</td><td>20,000</td></tr><tr><td>③送金時</td><td class="hl">受託販売</td><td>380,000</td><td>現金</td><td>380,000</td></tr></tbody></table><div class="formula-box">受託者の収益は手数料のみ（受取手数料）。販売代金は委託者への預り金（受託販売）。</div>`,
    exp:'受託者B社にとって委託商品はB社の資産ではなく、売上もB社の収益ではない。販売代金は「受託販売（委託者への預り負債）」で処理。手数料だけがB社の収益（受取手数料）。送金でこの負債（受託販売）が消える。委託者と受託者で収益認識がまったく異なる点が重要。',
    e:[{d:[['現金',400000]],c:[['受託販売',400000]]},{d:[['受託販売',20000]],c:[['受取手数料',20000]]},{d:[['受託販売',380000]],c:[['現金',380000]]}]
  },

  { id:405, level:2, cat:'収益認識',
    q:'（試用販売・手許商品区分法）A社は商品（原価150,000円）を得意先に試用のため発送した。後日、得意先から購入の意思表示があり代金250,000円を現金で受け取った。A社の①試送時②意思表示受取・代金受取時③売上原価計上の仕訳を行いなさい。',
    q_en:'(Sale on approval – separate account method) A shipped goods (cost ¥150,000) to a customer for trial. The customer later confirmed purchase; ¥250,000 was received in cash. Show A\'s entries: ①shipment ②purchase confirmation/cash ③COGS.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①試送時</td><td class="hl">試用品</td><td>150,000</td><td class="hl">仕入（商品）</td><td>150,000</td></tr><tr><td>②意思表示時</td><td>現金</td><td>250,000</td><td class="hl">売上</td><td>250,000</td></tr><tr><td>③原価計上</td><td class="hl">仕入（売上原価）</td><td>150,000</td><td class="hl">試用品</td><td>150,000</td></tr></tbody></table><div class="formula-box">売上認識時点：試用販売は「得意先が購入の意思表示をした時点」（出荷時ではない）</div>`,
    exp:'試用販売は「試しに使ってみて、気に入ったら買う」形式。手許商品区分法では①試送時に商品→試用品へ振り替え（まだ売上ではない）。②得意先が「買います」と意思表示した時点で売上を計上（履行義務の充足）。③と同時に試用品を売上原価へ。収益認識基準では「顧客が購入選択権を行使した時点」。',
    e:[{d:[['試用品',150000]],c:[['仕入',150000]]},{d:[['現金',250000]],c:[['売上',250000]]},{d:[['仕入',150000]],c:[['試用品',150000]]}]
  },

  { id:406, level:2, cat:'収益認識',
    q:'（割賦販売・収益認識基準）B社は商品（原価200,000円）を割賦で販売した（販売価額450,000円・毎月15,000円×30回払い）。収益認識基準では商品の引渡し時点に全額認識する。①販売（商品引渡）時②初回割賦金受取時の仕訳を行いなさい。',
    q_en:'(Installment sale – revenue recognition standard) B sold goods (cost ¥200,000) on installment: total ¥450,000, 30 payments of ¥15,000/month. Revenue recognized at delivery (full amount). Show ①delivery entry ②first installment receipt.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①販売時（引渡）</td><td class="hl">割賦売掛金</td><td>450,000</td><td class="hl">売上</td><td>450,000</td></tr><tr><td></td><td class="hl">売上原価</td><td>200,000</td><td class="hl">商品</td><td>200,000</td></tr><tr><td>②初回受取</td><td>現金</td><td>15,000</td><td class="hl">割賦売掛金</td><td>15,000</td></tr></tbody></table><div class="formula-box">収益認識基準：商品の「支配の移転」＝引渡時点で売上全額を認識</div>`,

    e:[{d:[['割賦売掛金',450000]],c:[['売上',450000]]},{d:[['売上原価',200000]],c:[['商品',200000]]},{d:[['現金',15000]],c:[['割賦売掛金',15000]]}]
  },

  // ===== リース会計（追加）=====
  { id:407, level:2, cat:'リース会計',

      {label:'②利子抜き法のリース債務計上額', hint:'利子抜き法は現金購入価額（現在価値）で計上', ans:1000000, unit:'円', choices:[1000000,1200000,240000,800000]},
      {label:'③利子抜き法の1年目元本返済額', hint:'年間リース料240,000 − 1年目利息40,000 = ?', ans:200000, unit:'円', choices:[200000,240000,40000,180000]},
      {label:'④利子抜き法の1年目支払利息', hint:'リース債務残高1,000,000 × 利率4% = ?', ans:40000, unit:'円', choices:[40000,200000,24000,10000]}

const IKOU_CATS = new Set(['工業簿記基礎','材料費','労務費','経費','個別原価計算','部門別原価計算','製造間接費','総合原価計算','標準原価計算','直接原価計算','工業簿記総まとめ']);
const SECS = {
  s3:  q => (q.level||3)===3,
  s2c: q => q.level===2 && !IKOU_CATS.has(q.cat),
  s2i: q => q.level===2 && IKOU_CATS.has(q.cat),
};

function getSectionQuestions(sec){ return sec ? ALL.filter(SECS[sec]) : ALL; }

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base.filter(q=>!checkOnly||checked[q.id]);
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}



function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  return styleParens(txt);
}
function fmtQen(q){
  let txt=q.q_en||'';
  txt=txt.replace(/^\([Ff]ill[^)]*\)[\s]*/,'');
  return addQBreaks(txt);
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  const qEnHtml=q.q_en?`<div class="exp-q-en">${fmtQen(q)}</div>`:'';
  const noteHtml=q.note?`<div class="note-box">💡 ${q.note.replace(/\n/g,'<br>')}</div>`:'';
  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}${qEnHtml}</div>
      ${noteHtml}
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}${qEnHtml}</div>
      ${noteHtml}
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  const qEnHtml=q.q_en?`<div class="exp-q-en">${fmtQen(q)}</div>`:'';
  const noteHtml=q.note?`<div class="note-box">💡 ${q.note.replace(/\n/g,'<br>')}</div>`:'';
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}${qEnHtml}</div>
    ${noteHtml}
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-hint">${step.hint}</div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){
  const q=expQuestions[expQIdx];
  btn.style.display='none';
  const ro=document.getElementById('exp-ro-ans');
  ro.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa=q.exp?`<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>`:'';
  const expEn=q.exp_en?`<div class="exp-res-exp-en">${q.exp_en.replace(/\n/g,'<br>')}</div>`:'';
  const area=document.createElement('div');
  area.className='exp-fill-exp-area';
  area.innerHTML=expJa+expEn+checkBtn;
  ro.insertAdjacentElement('afterend',area);
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa = isLastEntry && q.exp ? `<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>` : '';
  const expEn = isLastEntry && q.exp_en ? `<div class="exp-res-exp-en">${q.exp_en.replace(/\n/g,'<br>')}</div>` : '';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${expJa}${expEn}${checkBtn}${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${expJa}${expEn}${checkBtn}${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  const res=document.getElementById('exp-res');
  if(res){ res.style.display='none'; res.innerHTML=''; }
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

// ===== スクロールモードここまで =====

function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  ['sec-s3','sec-s2c','sec-s2i'].forEach(id=>{
    const btn=document.getElementById(id);
    if(btn) btn.classList.toggle('active',
      (sec==='s3'&&id==='sec-s3')||
      (sec==='s2c'&&id==='sec-s2c')||
      (sec==='s2i'&&id==='sec-s2i')
    );
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}




function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? 'チェックのみ解除' : 'チェックのみ';
  buildDeck();
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='チェックのみ'; }
  setSection('s3');
}



function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('s3');
</script>
