    q:'上記の借入れについて、返済の日が来た。X社は、新しい機械を使って、順調に売上を伸ばしていたため、約束どおりに返済することができた。<mark class="q-liability">借りていた60円</mark>と、<mark class="q-expense">利息3円</mark>を、あわせて<mark class="q-asset">現金で銀行に返済した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['借入金',60],['支払利息',3]],c:[['現金',63]]}],
    exp:'借りていたお金を返すとき、元本の60円は「もともと他人から借りていたものを、約束通り返しただけ」なので、費用にはなりません（借入金という負債が消えるだけ）。上乗せして払う利息3円だけが、お金を借りていた対価としての本当のコスト（支払利息という費用）です。'
  },
  { id:1063, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社の取締役の山田一郎は、個人的な事情で、急に、まとまったお金が必要になった。山田一郎は、会社に、「短い間、お金を貸してほしい」と頼んだ。X社は、会社の経営に問題がない範囲で、この頼みに応じることにした。そして、山田一郎に、<mark class="q-asset">現金30円を渡し</mark>、<mark class="q-asset">貸し付けた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['役員貸付金',30]],c:[['現金',30]]}],
    exp:'取引先ではなく、自社の役員にお金を貸す場合は、通常の「貸付金」とは区別して「役員貸付金」という資産科目を使います。会社の経営とは直接関係のない個人的な貸し借りを、取引先への貸付金と分けて管理するための科目です。'
  },
  { id:1064, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、大きな注文が入り、材料を急いで仕入れる必要が出た。しかし、代金の支払い時期の都合で、一時的に資金が足りなくなった。そこで、取締役の山田一郎に頼んで、会社にお金を貸してもらうことにした。X社は、山田一郎から、<mark class="q-asset">現金30円を</mark><mark class="q-liability">借り入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',30]],c:[['役員借入金',30]]}],
    exp:'今度は逆に、自社の役員からお金を借りる場合です。通常の「借入金」とは区別して「役員借入金」という負債科目を使います。銀行などの外部からの借入とは性質が異なる、身内からの資金調達であることを帳簿上で明確にしておく科目です。'
  },
  { id:1277, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、取引先のC社が銀行からお金を借りるにあたり、C社に頼まれて、<mark class="q-other">C社の借入金50円の保証人</mark>になった。C社が返せなくなったときは、X社が代わりに返すことになる。X社は、この保証について、<strong>対照勘定</strong>を使って<mark class="q-other">備忘記録</mark>を行う。この日の仕訳を行いなさい。',
    e:[{d:[['保証債務見返',50]],c:[['保証債務',50]]}],
    exp:'「保証人」とは、お金を借りた人が返せなくなったときに、代わりに返す約束をした人のことです。保証人になっただけでは、まだお金は動かず、代わりに払うと決まったわけでもありません。しかし、将来払う可能性がある義務を忘れないように、「保証債務」と「保証債務見返」という、対（つい）になる2つの勘定で記録しておきます（対照勘定による備忘記録）。2つは同じ金額で同時に出て、同時に消えます。'
  },
  { id:1278, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記の<mark class="q-other">C社の借入金50円</mark>について、X社は、C社から、<mark class="q-other">借入金を銀行にすべて返済した</mark>という通知を受けた。この日の仕訳を行いなさい。',
    e:[{d:[['保証債務',50]],c:[['保証債務見返',50]]}],
    exp:'C社が自分で借入金を返したので、X社が代わりに払う可能性はなくなりました。保証人になったときの備忘記録は役目を終えたので、そのときの仕訳を逆にして、「保証債務」と「保証債務見返」を同時に消します。お金は動いていないので、現金や預金は出てきません。'
  },
  { id:1279, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、取引先のD社の<mark class="q-other">借入金30円の保証人</mark>になっており、対照勘定による<mark class="q-other">備忘記録</mark>を行っていた。ところが、D社が借入金を返せなくなったため、X社が<mark class="q-asset">代わりに、当座預金口座から30円を支払った</mark>。X社は、支払った30円を、<mark class="q-asset">後でD社に請求する</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['保証債務',30],['未収入金',30]],c:[['保証債務見返',30],['当座預金',30]]}],
    exp:'代わりに支払ったことで、「代わりに払うかもしれない」という状態は終わりました。そこで、まず備忘記録の「保証債務」と「保証債務見返」を同時に消します。そのうえで、実際に支払った30円は、本来D社が払うべきお金なので、後でD社に請求できる権利（求償権）になります。これを「未収入金」という資産で記録し、当座預金を減らします（「立替金」や「貸付金」を使うこともあります）。'
  },
  { id:1280, calc:'30－20＝10円（引当金で足りない分）', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社の得意先のY社が倒産した。そのため、<strong>前期</strong>に売り上げた<mark class="q-asset">Y社に対する売掛金30円</mark>が<mark class="q-expense">回収できなくなった</mark>（貸倒れ）。X社には、<mark class="q-asset">前期末に設定した貸倒引当金の残高が20円</mark>ある。この日の仕訳を行いなさい。',
    e:[{d:[['貸倒引当金',20],['貸倒損失',10]],c:[['売掛金',30]]}],
    exp:'前期に売り上げた売掛金が貸し倒れたときは、前期末に備えておいた「貸倒引当金」をまず取り崩して使います。引当金は20円しかないので、足りない10円は「貸倒損失」という費用になります。売掛金30円は回収できないので全額消します。'
  },
  { id:1281, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社の得意先のZ社が倒産した。そのため、<strong>当期</strong>に売り上げた<mark class="q-asset">Z社に対する売掛金10円</mark>が<mark class="q-expense">回収できなくなった</mark>（貸倒れ）。X社には、貸倒引当金の残高が5円ある。この日の仕訳を行いなさい。',
    e:[{d:[['貸倒損失',10]],c:[['売掛金',10]]}],
    exp:'貸倒引当金は、前期末にあった売掛金に備えて積んだものです。当期に売り上げた売掛金はその対象に入っていないので、引当金は使わず、全額を「貸倒損失」という費用にします。引当金の残高があっても使わないのがポイントです。'
  },
  { id:1282, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、仕入先のZ社に、<mark class="q-liability">材料の代金40円をまだ支払っていない</mark>。X社は、得意先から受け取る予定の<mark class="q-asset">電子記録債権40円</mark>を持っている。そこで、この代金の支払いのために、<mark class="q-asset">電子記録債権40円をZ社に譲渡する記録</mark>を行った。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['電子記録債権',40]]}],
    exp:'電子記録債権は、手形の裏書きと同じように、他の人に譲り渡して支払いに使うことができます。持っていた電子記録債権（資産）を手放し、その分の買掛金（負債）が消えます。'
  },
  { id:1283, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社が持っている<mark class="q-asset">電子記録債権50円</mark>の支払期日が来た。得意先から、<mark class="q-asset">50円が当座預金口座に振り込まれた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',50]],c:[['電子記録債権',50]]}],
    exp:'期日が来て、電子記録債権がお金に変わりました。請求する権利（電子記録債権）を消し、入金された当座預金を増やします。権利がお金に変わっただけなので、収益は出ません。'
  },
  { id:1284, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、新しく事務所を借りることにした。契約にあたり、<mark class="q-asset">敷金20円</mark>と、<mark class="q-expense">1か月分の家賃10円</mark>を、現金で支払った。敷金は、退去するときに返してもらえる。この日の仕訳を行いなさい。',
    e:[{d:[['差入保証金',20],['支払家賃',10]],c:[['現金',30]]}],
    exp:'「敷金」とは、部屋を借りるときに貸主に預けておくお金で、退去するときに返してもらえます。返ってくるお金なので費用ではなく、「差入保証金」という資産にします。家賃は今月使った分なので「支払家賃」という費用です。'
  },
  // --- 第5章：有価証券 ---
  { id:1065, calc:'売買目的有価証券：100＋10＝110円（購入手数料は取得原価に含める）', cat:'有価証券', chap:'第5章：有価証券',
    q:'食品の輸入販売を行っているX社は、余裕資金を運用するため、Y社の株式を購入することにした。<mark class="q-asset">値上がりしたら、すぐに売って利益を得るつもり</mark>である。株式は100円で、証券会社を通じて購入した。X社は、株式の代金100円と、<mark class="q-asset">証券会社に支払う手数料10円</mark>をあわせて、<mark class="q-asset">小切手を振り出して支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['売買目的有価証券',110]],c:[['当座預金',110]]}],
    exp:'「値上がりしたらすぐに売って利益を得るつもり」で持つ株式は「売買目的有価証券」という資産で処理します。株式の購入にかかった手数料は、株式の値段そのものではなく、取引を成立させるための事務コストなので「支払手数料」という費用として別に計上します（株式の金額には含めません）。'
  },
  { id:1066, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、Z社が発行した社債（額面100円）を購入した。この社債は、<mark class="q-asset">満期まで持ち続けて、満期に額面の金額を受け取るつもり</mark>で購入したものである。購入代金は、額面と同じ100円で、<mark class="q-asset">当座預金口座から支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',100]],c:[['当座預金',100]]}],
    exp:'「社債」とは、会社が、お金を借りるために発行する債券のことです。「額面」とは、証券に記載されている金額、「満期」とは、支払いを受ける約束の期日が来ることです。満期まで持ち続けて、額面どおりの金額を受け取るつもりで買った債券は「満期保有目的債券」という資産で処理します。短期売買目的の株式とは違い、値上がり益を狙う目的ではない点が特徴です。'
  },
  { id:1067, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">W社の議決権の過半数を持っており</mark>、W社の経営を支配している（W社はX社の<strong>子会社</strong>）。W社の経営をさらに安定させるため、X社は、W社の株式を追加で200円分購入した。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['子会社株式',200]],c:[['現金',200]]}],
    exp:'「議決権」とは、株主総会で、議案に賛成や反対の票を投じる権利のことです。議決権の過半数を持ち、相手の会社を支配している場合、その株式は「子会社株式」という資産で処理します。売買して利益を得る目的ではなく「相手の会社を支配し続けるため」に持っているので、売買目的有価証券とは性質がまったく異なります。'
  },
  { id:1068, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、V社の株式を150円で取得した。X社は、<mark class="q-asset">V社の議決権の一部を持ち、V社の経営方針の決定に重要な影響</mark>を与えることができる。ただし、経営を支配するほどの割合ではない（V社はX社の<strong>関連会社</strong>）。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['関連会社株式',150]],c:[['現金',150]]}],
    exp:'相手の会社を完全に支配するほどではないものの、経営方針の決定に重要な影響を与えられる立場にある株式は「関連会社株式」という資産で処理します。子会社株式ほど強い支配力はありませんが、売買目的の株式とは違い、長期的な関係維持を目的に持つ株式という点では共通しています。'
  },
  { id:1069, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、取引先のU社との関係を、これからも長く続けたいと考え、U社の株式を80円で取得した。<mark class="q-asset">この株式は、長期間持ち続ける予定で、すぐに売って利益を得る目的ではない</mark>。また、U社を、子会社や関連会社にするつもりもない。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['その他有価証券',80]],c:[['現金',80]]}],
    exp:'売買目的でも、満期保有目的でも、子会社・関連会社株式でもない有価証券は「その他有価証券」という資産で処理します。取引関係の維持など、中長期的な目的で保有する株式がこれにあたります。4つの保有目的（売買目的・満期保有目的・子会社／関連会社株式・その他有価証券）のうち、どれにも当てはまらない「その他」の受け皿と考えると整理しやすいです。'
  },
  { id:1070, calc:'110－100＝10円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">短期売買の目的で、Y社の株式</mark>を持っていた。この株式の帳簿価額は100円である。株価が上がったので、X社は、この株式を<mark class="q-revenue">110円で売却した</mark>。代金は、<mark class="q-asset">当座預金口座に入金</mark>された。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',110]],c:[['売買目的有価証券',100],['有価証券売却益',10]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。株式を売却するときは、帳簿価額と実際の売却額を比較します。帳簿価額100円の株式を110円で売れたので、差額10円は「有価証券売却益」という収益になります。'
  },
  { id:1071, calc:'100－90＝10円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">短期売買の目的で、Y社の株式</mark>を持っていた。この株式の帳簿価額は100円である。株価が下がったが、資金が必要になったため、X社は、この株式を<mark class="q-expense">90円で売却した</mark>。代金は、<mark class="q-asset">現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',90],['有価証券売却損',10]],c:[['売買目的有価証券',100]]}],
    exp:'今度は逆に、帳簿価額100円の株式を90円でしか売れなかったケースです。差額10円は「有価証券売却損」という費用になります。値上がりを待てずに資金のために手放さざるを得なかった、という状況を表す仕訳です。'
  },
  { id:1072, calc:'85－80＝5円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">長期保有の目的で、U社の株式</mark>を持っていた。この株式の帳簿価額は80円である。X社は、この株式を<mark class="q-revenue">85円で売却</mark>し、<mark class="q-asset">代金を現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',85]],c:[['その他有価証券',80],['投資有価証券売却益',5]]}],
    exp:'その他有価証券のように長期保有目的の有価証券を売却したときも、帳簿価額より高く売れた分が利益になります。ただし科目名は売買目的有価証券のとき（有価証券売却益）とは異なり「投資有価証券売却益」を使います。考え方は同じでも、長期保有目的の資産には別の科目名が使われる点に注意しましょう。'
  },
  { id:1073, calc:'80－75＝5円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">長期保有の目的で、U社の株式</mark>を持っていた。この株式の帳簿価額は80円である。X社は、この株式を<mark class="q-expense">75円で売却</mark>し、<mark class="q-asset">代金を現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',75],['投資有価証券売却損',5]],c:[['その他有価証券',80]]}],
    exp:'長期保有目的の株式を帳簿価額より安く売却してしまった場合は、その差額が「投資有価証券売却損」という費用になります。売買目的有価証券の売却損（有価証券売却損）とは科目名が異なりますが、「帳簿価額より安く売れた分だけ損をした」という考え方は同じです。'
  },
  { id:1074, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社が保有している株式のうち、ある会社が、株主に、<mark class="q-revenue">配当金を支払う</mark>ことを決めた。その会社から、X社に、配当金領収証（<strong>通貨代用証券</strong>）3円が届いた。X社は、この<mark class="q-asset">配当金領収証を受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',3]],c:[['受取配当金',3]]}],
    exp:'「配当金領収証」とは、株式の配当金を、現金に換えることができる証書のことです。これは銀行や郵便局ですぐに換金できる「通貨代用証券」の一種なので、受け取った瞬間に現金（資産）の増加として扱います。株式を保有していることで得られる配当金は、保有目的に関係なく「受取配当金」という収益で処理します。'
  },
  { id:1075, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、余裕資金の運用のため、Z社の社債を持っている。この社債には、年に何回か、決められた日に利息が支払われる。今日は、その利息の支払日である。Z社から、<mark class="q-revenue">利息2円が</mark>、X社の<mark class="q-asset">当座預金口座に入金</mark>された。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',2]],c:[['有価証券利息',2]]}],
    exp:'社債を保有していると、定期的に利息（クーポン）を受け取れます。これは株式の配当金（受取配当金）とは区別して「有価証券利息」という収益で処理します。社債という「お金を貸している証券」から生まれる利息という性質の違いが、科目名の違いに表れています。'
  },
  { id:1076, calc:'105－100＝5円', cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">短期売買の目的で持っているY社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-revenue">帳簿価額は100円で、決算日の時価は105円であった</mark>。X社は<strong>時価法</strong>を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['売買目的有価証券',5]],c:[['有価証券評価益',5]]}],
    exp:'「時価」とは、その時点の市場での価格のことです。「時価法」とは、決算日の時価で、帳簿の金額を評価しなおす方法です。売買目的有価証券は、決算のたびに時価で評価し直す必要があります。時価（105円）が帳簿価額（100円）を上回ったので、その含み益5円を「有価証券評価益」として、まだ売っていなくても収益に計上します。'
  },
  { id:1077, calc:'100－95＝5円', cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">短期売買の目的で持っているY社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-expense">帳簿価額は100円で、決算日の時価は95円であった</mark>。X社は<strong>時価法</strong>を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['有価証券評価損',5]],c:[['売買目的有価証券',5]]}],
    exp:'時価が帳簿価額を下回った場合も同じ考え方で、まだ売っていなくても含み損を「有価証券評価損」という費用に計上します。売買目的有価証券は「いつでも市場で売買できる」という性質から、値上がりも値下がりも、その期のうちに損益として素直に反映させるのが原則です。'
  },
  { id:1078, calc:'88－80＝8円', cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">長期保有の目的で持っているU社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-eq-rx">帳簿価額は80円で、決算日の時価は88円であった</mark>。X社は、この株式の評価差額を、損益に入れず、全額を純資産に直接計上する方法（<strong>全部純資産直入法</strong>）を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['その他有価証券',8]],c:[['その他有価証券評価差額金',8]]}],
    exp:'「評価差額」とは、時価と帳簿価額との差額のことです。「全部純資産直入法」とは、評価差額の全額を、損益に入れず、純資産に直接計上する方法です。その他有価証券も決算時に時価評価しますが、売買目的有価証券とは違い、評価差額をすぐに利益・損失とはせず、いったん純資産の部に直接計上します。「まだ売るつもりはないので今期の利益には反映させないが、資産の値段は最新の時価に合わせる」という中間的な扱いです。'
  },
  { id:1079, calc:'', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">満期まで持ち続けるつもり</mark>で、Z社の社債（額面100円）を95円で取得した。額面より安く買えた差額の5円は、この社債の利息の一部にあたると考えられる。この社債は、取得から満期まで5年である。X社は、<mark class="q-revenue">この差額5円を、5年間にわたり、毎年同じ金額ずつ、帳簿価額に加えていく（定額法による償却原価法）</mark>。決算にあたり、この期の1年分について、必要な仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',1]],c:[['有価証券利息',1]]}],
    exp:'「償却原価法」とは、額面と取得原価との差額を、満期までの期間にわたって、少しずつ帳簿価額に加えていく方法です。「定額法」とは、毎年同じ金額ずつ処理する方法です。額面と取得価額の差額（5円）を、残存期間5年で均等に分けて（5÷5年＝1円）、毎年少しずつ「有価証券利息」という収益として認識していきます。これを続けると、満期を迎えるころには帳簿価額がちょうど額面（100円）と一致します。'
  },
  { id:1080, calc:'5－2＝3円（利息の総額－クーポン利息）', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">満期まで持ち続けるつもり</mark>で、Z社の社債（額面100円、利率年2％）を93円で取得した。この社債からは、毎年、額面の2％にあたる2円の利息（クーポン利息）を受け取る。この期の2円は、すでに現金で受け取っている。額面より安く買えた差額は、金利の調整にあたると考えられる。X社は、この社債について<strong>利息法による償却原価法</strong>を採用している。<mark class="q-revenue">実効利子率にもとづいて計算した、この期の利息の総額は、5円であった</mark>。決算にあたり、必要な仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',3]],c:[['有価証券利息',3]]}],
    exp:'「クーポン利息」とは、社債に定められた利率で、定期的に支払われる利息のことです。「利息法」とは、帳簿価額に実効利子率をかけて、その期の利息の総額を計算し、受け取る利息との差額を、帳簿価額に加える方法です。「実効利子率」とは、実質的な利回りを表す利率のことです。実効利子率で計算した利息の総額5円から、すでに現金で受け取った2円を差し引いた3円が、まだ現金で受け取っていない分の利息として、満期保有目的債券の帳簿価額に上乗せされます。'
  },
  { id:1081, calc:'50×20％＝10円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、V社の議決権の20％を持っている。V社は、X社にとって、経営方針に重要な影響を与えることができる会社（<strong>関連会社</strong>）である。V社は、今期、<mark class="q-revenue">当期純利益50円を計上した</mark>。X社は<strong>持分法</strong>を採用している。決算にあたり、V社の利益のうち、<mark class="q-asset">X社の持分にあたる金額だけ、保有するV社株式の帳簿価額を増やす</mark>。必要な仕訳を行いなさい。',
    e:[{d:[['関連会社株式',10]],c:[['持分法による投資利益',10]]}],
    exp:'「持分法」とは、投資先の会社の利益や配当を、持ち株比率に応じて、自社の投資額に反映させる方法です。関連会社の利益が増えると、その会社の価値が増えたと考え、自社が持つ関連会社株式（資産）の帳簿価額も、持ち株比率に応じて増やします（50円×20％＝10円）。増えた分は「持分法による投資利益」という収益として計上します。'
  },
  { id:1082, calc:'20×20％＝4円', cat:'有価証券', chap:'第5章：有価証券',
    q:'V社は、株主に対して、配当金20円を支払うことを決めた。X社は、<strong>関連会社</strong>であるV社の議決権の20％を持っており、<strong>持分法</strong>を採用している。<mark class="q-asset">この配当金のうち、X社の持分にあたる金額について</mark>、必要な仕訳を行いなさい。<mark class="q-asset">配当金は、まだ受け取っていない</mark>。',
    e:[{d:[['未収配当金',4]],c:[['関連会社株式',4]]}],
    exp:'持分法を適用している場合、関連会社から配当を受け取る権利が生じると、関連会社株式（資産）をその分減らします。これは「すでに持分法で利益として取り込んでいた金額の一部が、投資額から配当という形で払い戻される」と考えるためです（配当を受け取っても、新たな収益としては計上しません）。まだ受け取っていない配当金20円×20％＝4円は「未収配当金」という資産で処理します。'
  },
  { id:1083, calc:'端数利息：100×6％×2／12＝1円\n当座預金：100＋1＝101円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、T社が発行した社債（額面100円、利率年6％）を、<mark class="q-asset">満期まで持ち続けるつもり</mark>で購入した。この社債の利息は、3月末と9月末に、年2回支払われる。購入した日は11月末日で、直前の利息の支払日（9月末）から2か月がたっている。購入代金は、額面と同じ100円である。X社は、購入代金に、<mark class="q-revenue">直前の利息の支払日から購入日までの利息（端数利息）</mark>を加えて、<mark class="q-asset">当座預金口座から支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['満期保有目的債券',100],['有価証券利息',1]],c:[['当座預金',101]]}],
    exp:'「端数利息」とは、直前の利息の支払日から、売買の日までに経過した期間の利息のことです（社債の買い手は、この分を売り手に支払います）。前の利払い日から2か月分の利息（100円×6％×2/12＝1円）を、売り手にあらかじめ支払う必要があります。これは自分がまだ受け取っていない利息を前払いするイメージなので、「有価証券利息」の借方（収益のマイナス）で処理し、次の利払い日に受け取る利息とあわせて調整されます。'
  },
  { id:1084, calc:'60－52＝8円', cat:'有価証券', chap:'第5章：有価証券',
    q:'決算にあたり、X社は、<mark class="q-asset">長期保有の目的で持っているS社の株式</mark>について、決算日の時価を確認した。この株式の<mark class="q-expense">取得原価は60円で、決算日の時価は52円に下がっていた</mark>。X社は、時価が取得原価を上回る差額は純資産に入れるが、下回る差額は当期の損失として処理する方法（<strong>部分純資産直入法</strong>）を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['投資有価証券評価損',8]],c:[['その他有価証券',8]]}],
    exp:'「取得原価」とは、買ったときに支払った金額のことです。「部分純資産直入法」とは、時価が取得原価を上回る差額は純資産に入れ、下回る差額は当期の損失として処理する方法です。全部純資産直入法（純資産のみで処理）とは違い、この方法では評価損だけは費用として損益計算書に計上します。取得原価60円より時価が8円下がったので、「投資有価証券評価損」という費用で処理します。'
  },
  { id:1085, calc:'前期の評価損を戻す：60－52＝8円', cat:'有価証券', chap:'第5章：有価証券',
    q:'翌期の期首（期の初め）にあたり、X社は、前の期の決算で、<mark class="q-asset">長期保有の目的</mark>で持っているS社の株式（<mark class="q-expense">取得原価60円、前の期の決算日の時価52円</mark>）を、時価に評価しなおして処理した。X社は<strong>洗替法</strong>を採用している。上記の株式について、期首に、洗替法によって、必要な仕訳を行いなさい。',
    e:[{d:[['その他有価証券',8]],c:[['投資有価証券評価損',8]]}],
    exp:'「期首」とは、会計期間の最初の日のことです。「洗替法」とは、前の期の決算で評価替えした金額を、次の期の初めに、いったん元の金額に戻す方法です。前期末に評価減していた8円を、新しい期の始まりにいったん逆仕訳で元の取得原価（60円）に戻します。これにより、新しい期は毎回「取得原価」を基準にして、改めて時価と比較し直すことができます。'
  },
  { id:1293, calc:'前回の利払日の翌日から売却日までの2か月分：100×6％×2/12＝1円\n売却益：98－97＝1円', cat:'有価証券', chap:'第5章：有価証券',
    q:'X社は、<mark class="q-asset">売買目的で持っている社債（額面100円、帳簿価額97円）</mark>を、11月30日に98円で売却した。この社債の利率は年6％、利払日は3月末と9月末である。売却にあたり、<mark class="q-revenue">前回の利払日の翌日から売却日までの利息（端数利息）</mark>も、あわせて受け取り、<mark class="q-asset">合計額が当座預金口座に振り込まれた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',99]],c:[['売買目的有価証券',97],['有価証券売却益',1],['有価証券利息',1]]}],
    exp:'利息は利払日の持ち主がまとめて受け取ります。売った後の3月末には買った人が6か月分を受け取るので、X社が持っていた10月〜11月の2か月分は、売却のときに買い手から受け取ります。これは売った代金ではなく利息なので「有価証券利息」という収益です。社債は帳簿価額97円で消し、売値98円との差1円が売却益です。'
  },
  // --- 第6章：有形固定資産 ---
  { id:1087, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'プラスチック製品を製造して販売しているX社は、事業が広がったため、これまで借りていた事務所が手狭になった。そこで、新しく事務所として使うための<mark class="q-asset">建物を、300円で購入</mark>した。代金は、<mark class="q-asset">小切手を振り出して</mark>支払った。この日の仕訳を行いなさい。',
    e:[{d:[['建物',300]],c:[['当座預金',300]]}],
    exp:'事務所として長く使う目的で買った建物は「建物」という資産（＝長期間にわたって会社の役に立つ財産）で処理します。小切手を振り出すと、実際にはまだ口座からお金が引き落とされていなくても、帳簿上は当座預金（資産）が減ったものとして処理します。'
  },
  { id:1088, calc:'300÷10年＝30円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'決算にあたり、X社は、上記の建物について、この期の価値の減少分を計算することにした。この建物の<mark class="q-expense">取得原価は300円、残存価額はゼロ、耐用年数は10年である</mark>。X社は定額法を採用し、<mark class="q-as-li">記帳は間接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',30]],c:[['減価償却累計額',30]]}],
    exp:'「取得原価」とは買ったときに支払った金額、「残存価額」とは使い終わったときに残ると見込まれる価値、「耐用年数」とはその資産を使える年数のことです。「定額法」は毎年同じ金額ずつ、価値の減少分として処理する方法、「間接法」は資産の金額を直接減らさず、別の科目に減少分を累計していく記帳方法です。(300円－0円)÷10年＝30円が1年分の価値の減少分（減価償却費）で、この金額を「減価償却累計額」という資産のマイナス項目に積み立てていきます。'
  },
  { id:1089, calc:'40÷4年＝10円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'決算にあたり、X社は、工場で使っている備品について、この期の価値の減少分を計算することにした。この備品の<mark class="q-expense">取得原価は40円、残存価額はゼロ、耐用年数は4年である</mark>。定額法を採用し、<mark class="q-asset">記帳は直接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',10]],c:[['備品',10]]}],
    exp:'「直接法」とは、資産の金額から、直接、減少分を差し引いていく記帳方法です。間接法（前問）のように別の科目に積み立てるのではなく、備品という資産の金額そのものを直接減らします。(40円－0円)÷4年＝10円が1年分の減価償却費です。間接法と直接法は、費用として計上する金額（減価償却費）は同じでも、資産の帳簿上の見せ方が違う点がポイントです。'
  },
  { id:1090, calc:'年額：120÷5年＝24円\n今期分（7月〜3月の9か月）：24×9／12＝18円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、×2年7月1日に、事務用の備品を120円で購入し、代金は現金で支払った。この備品の<mark class="q-expense">残存価額はゼロ、耐用年数は5年で</mark>、定額法を採用している。X社の決算日は3月31日で、この期は4月1日から始まっている。決算にあたり、この備品について、購入した日から決算日までの月数をもとに、月割で、この期の価値の減少分を計算する。<mark class="q-as-li">記帳は間接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',18]],c:[['減価償却累計額',18]]}],
    exp:'期の途中で固定資産を購入した場合、1年分丸ごと減価償却するのではなく、実際に使っていた月数分だけを月割りで計算します。年間の減価償却費は120円÷5年＝24円ですが、7月1日の購入から3月31日の決算日までは9か月間なので、24円×9か月／12か月＝18円を今期の費用として計上します。'
  },
  { id:1091, calc:'今期の減価償却費：120÷5年×6／12＝12円\n売却時の帳簿価額：120－60－12＝48円\n固定資産売却益：60－48＝12円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、×2年9月30日に、不要になった備品を、<mark class="q-revenue">60円で売却</mark>し、<mark class="q-asset">代金は現金で受け取った</mark>。この<mark class="q-asset">備品の取得原価は120円</mark>、この期の期首の時点での<mark class="q-as-li">減価償却累計額は60円</mark>、<mark class="q-expense">耐用年数は5年で</mark>、定額法を採用している。記帳は間接法によっている。決算日は3月31日で、この期は4月1日から始まっている。売却の日までの、この期の価値の減少分を月割で計算したうえで、売却について必要な仕訳を行いなさい。',
    e:[{d:[['現金',60],['減価償却累計額',60],['減価償却費',12]],c:[['備品',120],['固定資産売却益',12]]}],
    exp:'「減価償却累計額」とは、これまでに積み上げてきた、価値の減少分の合計のことです。「期首」とは、会計期間の最初の日のことです。固定資産を売る年は、まず売却する直前までの減価償却費を月割りで計上します（120円÷5年×6か月／12か月＝12円）。期首の減価償却累計額60円と合わせた帳簿価額（120円－60円－12円＝48円）と、売却額60円を比べ、差額12円は「固定資産売却益」という収益になります。'
  },
  { id:1092, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、工場の敷地に、新しい倉庫を建てている。倉庫は、まだ完成していない。建設を請け負っている建設業者に、<mark class="q-asset">工事の途中の支払い（中間払い）</mark>として、<mark class="q-asset">100円を現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['建設仮勘定',100]],c:[['現金',100]]}],
    exp:'「中間払い」とは、工事の途中で、代金の一部を支払うことです。建物が完成する前に支払ったお金は、まだ「建物」という完成した資産にはなっていないので、完成するまでの間は「建設仮勘定」という一時的な置き場所（資産）にお金を保管しておきます。完成して引き渡しを受けた時点で、正式に「建物」という資産に振り替えます。'
  },
  { id:1093, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、新しい機械を導入するための設備投資を行うことにした。国は、こうした設備投資を支援するため、補助金を出している。X社は、この<mark class="q-revenue">国庫補助金50円の交付</mark>を受け、<mark class="q-asset">現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',50]],c:[['国庫補助金受贈益',50]]}],
    exp:'「国庫補助金」とは、国から交付される、返済が不要なお金のことです。返す必要がないお金を受け取ったので、「国庫補助金受贈益」という収益として計上します。このままだと補助金を受け取った年に利益が大きく増え、税負担も重くなってしまうため、次の問題で見るような調整（圧縮記帳）が必要になります。'
  },
  { id:1094, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の国庫補助金50円を使って、X社は、工場の<mark class="q-asset">建物</mark>を取得した。補助金を受け取ったことで、利益が大きくなりすぎて見えるのを避けるため、<mark class="q-expense">補助金の金額だけ、建物の帳簿価額を、直接減らす</mark>ことにした（<strong>直接減額方式</strong>）。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産圧縮損',50]],c:[['建物',50]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。「直接減額方式」とは、補助金を使って取得した資産の帳簿価額を、補助金の金額だけ、直接減らす方法です。前問で計上した国庫補助金受贈益（収益50円）と、今回の固定資産圧縮損（費用50円）が相殺され、この年の利益が補助金の分だけ増えすぎるのを防ぎます。その代わり、建物の帳簿価額が小さくなる分、今後の減価償却費も少なくなり、将来にわたって少しずつ課税される仕組みです。'
  },
  { id:1095, calc:'50×30％＝15円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、国庫補助金50円を使って、建物を取得し、直接減額方式によって、<mark class="q-asset">建物の帳簿価額を50円減らし</mark>、<mark class="q-expense">同額を圧縮損とした</mark>。税務上、この50円の減額は、<mark class="q-asset">費用（損金）として認められない。実効税率は30％である</mark>。X社は税効果会計を適用しており、<mark class="q-other">税効果の相手勘定は法人税等調整額とする</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産圧縮損',50],['繰延税金資産',15]],c:[['建物',50],['法人税等調整額',15]]}],
    exp:'「税務上」とは、税金の計算の上では、ということです。「損金」とは、税金の計算の上で、費用として認められる金額のことです。「実効税率」とは、税金の実質的な負担割合のことです。「税効果会計」とは、会計上の利益と、税金の計算上の利益とのズレを、調整する会計処理です。会計上は費用（固定資産圧縮損）として認めても、税務上はすぐに損金として認めてもらえないため、将来その分の税金が軽くなる効果（50円×30％＝15円）を、あらかじめ「繰延税金資産」として資産計上します。'
  },
  { id:1096, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、国からの補助金を使って建物を取得したとき、建物の金額を直接減らさず、<mark class="q-equity">利益の一部を会社の中に積み立てておく方法（積立金方式）</mark>を選んだ。これは、補助金を受け取ったことで、利益が増えすぎて見えるのを避けるためである。X社は、これまでに、この目的で10円を積み立ててきた。当期、<mark class="q-equity">この10円を取り崩すことにした</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['圧縮積立金',10]],c:[['繰越利益剰余金',10]]}],
    exp:'「積立金方式」とは、補助金を使って取得した資産の金額は減らさず、利益の一部を、その資産のために積み立てておく方法です。直接減額方式とは違い、建物の帳簿価額はそのまま維持しつつ、補助金相当額を「圧縮積立金」という純資産の項目に据え置き、減価償却の進み具合に合わせて少しずつ取り崩していきます。取り崩した分は「繰越利益剰余金」という自由に使える利益の貯金箱に戻ります。'
  },
  { id:1097, calc:'繰延税金負債：50×30％＝15円\n圧縮積立金：50－15＝35円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、国から国庫補助金50円をもらい、それを使って機械を買った。補助金をもらった分だけ、利益が増えて見えすぎるのを避けるため、<mark class="q-equity">積立金方式を採用</mark>している。税務上、<mark class="q-liability">この50円は、機械を将来手放したときに課税</mark>される。<mark class="q-equity">実効税率は30％</mark>で、X社は税効果会計を適用している。この補助金について、必要な仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',50]],c:[['圧縮積立金',35],['繰延税金負債',15]]}],
    exp:'積立金方式に税効果を組み合わせるケースです。積み立てる金額は、補助金の額面（50円）そのままではなく、将来の税負担分（50円×30％＝15円）を「繰延税金負債」として差し引いた、税引後の金額（35円）だけを「圧縮積立金」として積み立てます。「補助金はいずれ税金がかかるので、その分を見込んで少なめに積み立てておく」という考え方です。'
  },
  { id:1098, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の補助金について、X社は、前の期に、<mark class="q-liability">税効果を考慮して繰延税金負債15円を計上したうえで</mark>、<mark class="q-equity">積立金35円を積み立てていた</mark>（<strong>積立金方式</strong>）。今期、この補助金を使って取得した資産を、売却した。そのため、X社は、この積立金と繰延税金負債を、<mark class="q-equity">ともに取り崩す</mark>ことにした（<mark class="q-other">繰延税金負債の取崩しの相手勘定は法人税等調整額とする</mark>）。この日の仕訳を行いなさい。',
    e:[{d:[['圧縮積立金',35],['繰延税金負債',15]],c:[['繰越利益剰余金',35],['法人税等調整額',15]]}],
    exp:'補助金を使って取得した資産を売却すると、積立金方式で積み立てていた圧縮積立金と、対応する繰延税金負債は、その役目を終えるため取り崩します。圧縮積立金35円は繰越利益剰余金（自由に使える利益）に戻し、繰延税金負債15円は法人税等調整額を通じて精算します。これで、積立金方式で先送りにしていた課税が、資産を手放したタイミングで実際に確定することになります。'
  },
  { id:1099, calc:'20－5＝15円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、不要になった<mark class="q-asset">備品を、帳簿から取り除く</mark>こと（<strong>除却</strong>）にした。この備品の帳簿価額は、20円である。ただ、この備品の部品の<mark class="q-asset">一部は、売れば5円になると見込まれる</mark>。<mark class="q-expense">それ以外の部分は、除却による損失とする</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['貯蔵品',5],['固定資産除却損',15]],c:[['備品',20]]}],
    exp:'「除却」とは、使わなくなった資産を、帳簿から取り除くことです。まだ部品として売れる見込みのある分（5円）は「貯蔵品」という資産として残し、帳簿価額20円のうち残りの15円は「固定資産除却損」という費用で処理します。「まだ使わないけれど、全部価値がゼロになったわけではない」という状態を表す処理です。'
  },
  { id:1100, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、古くなった備品を使わなくなった。この備品は、もう修理もできず、売っても買い手がつかないと見込まれる。そこで、不要になった<mark class="q-asset">備品を、帳簿から取り除く</mark>こと（<strong>除却</strong>）にした。この備品の<mark class="q-expense">帳簿価額は20円である</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産除却損',20]],c:[['備品',20]]}],
    exp:'前問とは違い、売っても一切値段がつかない見込みの場合は、貯蔵品として残す分はなく、帳簿価額20円の全額を「固定資産除却損」という費用として処理します。まだ使わなくなっただけで処分（廃棄）まではしていない点が、次の問題の「廃棄」との違いです。'
  },
  { id:1101, calc:'15＋3＝18円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、使わなくなった古い備品を、置いておく場所がなくなったため、専門の業者に頼んで、廃棄処分することにした。この<mark class="q-asset">備品の帳簿価額は、15円である</mark>。<mark class="q-expense">廃棄のための費用3円は</mark>、その業者に、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['固定資産廃棄損',18]],c:[['備品',15],['現金',3]]}],
    exp:'「廃棄」は、除却とは違い、完全に捨ててしまう処理です。帳簿価額15円の価値がまるごと失われる損失に加え、処分を頼んだ業者に払った廃棄費用3円も合わせて、合計18円を「固定資産廃棄損」という費用として計上します。「捨てるためにお金までかかった」という、除却よりもさらに踏み込んだ処理です。'
  },
  { id:1102, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社の建物が、火災によって焼失した。この<mark class="q-asset">建物の帳簿価額は、100円である</mark>。この建物には、火災保険がかけられているが、<mark class="q-asset">受け取れる保険金の金額は、この時点では、まだ決まっていない</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['火災未決算',100]],c:[['建物',100]]}],
    exp:'「保険金」とは、火災などの損害があったときに、保険会社から受け取るお金のことです。保険に入っている場合、保険金の金額がまだ決まっていない段階で、いきなり損失を確定させるわけにはいきません。そこで、焼失した建物の帳簿価額100円を、いったん「火災未決算」という仮の資産科目（＝保険金の決定を待っている状態）に振り替えておきます。'
  },
  { id:1103, calc:'100－80＝20円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の火災について、保険会社が、被害の調査を終えた。X社は、保険会社から、<mark class="q-asset">保険金80円を支払う</mark>という連絡を受けた。ただし、この保険金は、まだ受け取っていない。<mark class="q-asset">火災未決算として処理していた金額</mark>を取り崩し、<mark class="q-expense">保険金で補われない分は火災損失とする</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['未収入金',80],['火災損失',20]],c:[['火災未決算',100]]}],
    exp:'保険金の金額（80円）が確定したら、「火災未決算」という仮の科目を精算します。確定した保険金80円は「未収入金」という資産（＝もうすぐ受け取れるお金）として計上し、保険でカバーしきれなかった差額20円は、正真正銘の損失として「火災損失」という費用で処理します。'
  },
  { id:1104, calc:'120－100＝20円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記とは別の火災で、X社の建物（帳簿価額100円）が焼失した。この火災が起きたとき、<mark class="q-asset">受け取れる保険金の金額はまだ決まっていなかった</mark>ため、この建物の帳簿価額は、火災が起きた日に、処理済みである。この火災について、X社は、保険会社から、<mark class="q-revenue">保険金120円を支払う</mark>という連絡を受けた。<mark class="q-asset">保険金は、まだ受け取っていない</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['未収入金',120]],c:[['火災未決算',100],['保険差益',20]]}],
    exp:'今度は、保険金（120円）の方が建物の帳簿価額（100円）より多く支払われるケースです。火災未決算100円を精算したうえで、確定した保険金120円との差額20円は、損失どころか得をした分なので、「保険差益」という収益として計上します。保険金が帳簿価額を上回るか下回るかで、損失（火災損失）になるか利益（保険差益）になるかが変わる点がポイントです。'
  },
  { id:1105, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、車で通勤する従業員が増えたため、会社の隣の土地を、従業員用の駐車場にすることにした。そのための<mark class="q-asset">土地を、500円で購入</mark>した。代金は、<mark class="q-asset">小切手を振り出して</mark>支払った。この日の仕訳を行いなさい。',
    e:[{d:[['土地',500]],c:[['当座預金',500]]}],
    exp:'駐車場として長く使う目的で買った土地は「土地」という資産で処理します。建物とは違い、土地は使っても価値が目減りしていくものではないと考えられているため、減価償却の対象にはなりません。'
  },
  { id:1106, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、営業担当者が、得意先を回るときに使う自動車が必要になった。そこで、営業のために使う<mark class="q-asset">自動車を、80円で購入した</mark>。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['車両運搬具',80]],c:[['現金',80]]}],
    exp:'営業で使う自動車のような乗り物は「車両運搬具」という資産で処理します。備品や建物と同じ有形固定資産の仲間ですが、科目名が違うので、問題文に「自動車」「トラック」などが出てきたら車両運搬具を使う、と覚えておきましょう。'
  },
  { id:1107, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、事務所で使う<mark class="q-asset">備品を、割賦契約で購入</mark>した。この契約では、代金を、何回かに分けて支払う。この備品を、現金で一度に買った場合の値段は、90円である。分けて支払う代金の合計は100円で、この中には、<mark class="q-asset">10円の利息</mark>が含まれている。<mark class="q-liability">代金は、これから支払っていく</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['備品',90],['前払利息',10]],c:[['未払金',100]]}],
    exp:'「割賦」とは、代金を、何回かに分けて支払うことです。分割払いにすると、一括で買うより合計額が高くなりますが、この差額（100円－90円＝10円）は備品そのものの値段ではなく、分割払いにしたことへの利息です。備品の本体価格（90円）は資産として計上し、利息分（10円）は「前払利息」という資産として先にまとめて計上しておき、毎回の支払いのたびに少しずつ費用（支払利息）に振り替えていきます。'
  },
  { id:1108, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'上記の割賦購入について、1回目の支払いの期日が来た。X社は、約束どおりに、<mark class="q-asset">1回目の支払いを行った</mark>。この1回目の支払いに含まれる<mark class="q-expense">利息は、1円である</mark>。この日、この1円の利息について、必要な仕訳を行いなさい（支払い自体の仕訳は、ここでは行わない）。',
    e:[{d:[['支払利息',1]],c:[['前払利息',1]]}],
    exp:'あらかじめ「前払利息」としてまとめて計上していたうち、今回の支払い分に対応する1円だけを、実際の費用（支払利息）に振り替えます。分割払いのたびに、前払いしていた利息を少しずつ本当の費用として認識していく処理です。'
  },
  { id:1109, calc:'200＋24＝224円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'家電を一般のお客さんに売っているY社は、新しい店を出すことになった。<mark class="q-asset">店の内装工事の代金として</mark>、<mark class="q-asset">200円を現金で支払った</mark>。この店は、賃貸借契約で借りている建物にあり、契約では、店を閉めるときに、<mark class="q-liability">内装を撤去して、元の状態に戻す工事をする義務</mark>がある。この将来の工事にかかる費用を、現在の価値（<strong>現在価値</strong>）に直した金額は、24円と見積もられた。Y社は、内装工事の代金と、この24円をあわせて、店の内装の取得にかかった金額として扱う。この日の仕訳を行いなさい。',
    e:[{d:[['建物付属設備',224]],c:[['現金',200],['資産除去債務',24]]}],
    exp:'「賃貸借契約」とは、建物などを、お金を払って借りる契約です。「現在価値」とは、将来払う金額を、今の時点の価値に直した金額です。借りている建物を将来原状回復する義務がある場合、その将来の撤去費用もあらかじめ見積もって「資産除去債務」という負債として計上し、同時にその見積額を内装設備の取得原価にも上乗せします。「これから使う分だけでなく、使い終えた後の片付け費用も、資産を取得する本当のコストのうち」と考える処理です。'
  },
  // ===== PDF教材準拠（新版）差し替え終了 =====

  // ===== PDF教材準拠（新版パート2）差し替え開始 =====
  // --- 第6章：有形固定資産 ---
  { id:1110, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'決算にあたり、Y社は、上記の、<mark class="q-liability">店を閉めるときに元に戻す工事の費用24円</mark>を、あらためて見直した。時間が1年たったことで、この<mark class="q-expense">費用の現在の価値は、1円増えた</mark>。工事の費用そのものの見積りは、変わっていない。決算に必要な仕訳を行いなさい。',
    e:[{d:[['利息費用',1]],c:[['資産除去債務',1]]}],
    exp:'資産除去債務は「将来の工事費用を、現在の価値に直した金額」で計上しています。時間が経つほど、支払う日が近づいてくるため、現在価値はだんだん本来の金額に近づいていきます。この「時間の経過による価値の増加分」を「利息費用」という費用で処理し、資産除去債務（負債）もその分増やします。工事費用そのものの見積りは変わっていないのに、帳簿上の金額が毎年少しずつ増えていくのはこのためです。'
  },
  { id:1111, calc:'', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'Y社は、賃貸借契約が終わったため、<mark class="q-liability">店を閉め、元の状態に戻す工事を行った</mark>。工事の実際の費用は25円で、<mark class="q-asset">現金で支払った</mark>。この工事の費用について、これまでに積み上げてきた金額も、25円である。この日の仕訳を行いなさい。',
    e:[{d:[['資産除去債務',25]],c:[['現金',25]]}],
    exp:'実際に原状回復工事を行い、見積もっていた金額どおり25円を現金で支払いました。これまで少しずつ積み上げてきた資産除去債務（負債）をちょうど取り崩して精算するだけなので、損益は発生しません。見積りと実際の金額がぴったり一致した、きれいな決着です。'
  },
  { id:1112, calc:'古いトラックの帳簿価額：80－60＝20円\n下取り価格との差額：20－15＝5円 → 安く手放したので<strong>固定資産売却損</strong>\n現金で払う額：100－15＝85円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'荷物の運送を営むZ社は、営業用のトラックを買い換えることにした。<mark class="q-asset">古いトラックの取得原価は80円で</mark>、<mark class="q-as-li">これまでの減価償却累計額は60円である</mark>。記帳は間接法によっている。古いトラックは、新しいトラックの購入代金の一部に充てるため、販売店に下取りに出した。<mark class="q-expense">下取り価格は、15円と査定された</mark>。<mark class="q-asset">新しいトラックの値段は100円で</mark>、下取り価格との差額85円は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['車両運搬具',100],['減価償却累計額',60],['固定資産売却損',5]],c:[['車両運搬具',80],['現金',85]]}],
    exp:'「下取り」とは、古い資産を、新しい資産の購入代金の一部に充てるために、相手に引き取ってもらうことです。古いトラックの帳簿価額（取得原価80円－減価償却累計額60円＝20円）と、下取り価格15円を比べると、20円の価値のものを15円でしか引き取ってもらえなかったので、差額5円は「固定資産売却益」ではなく「固定資産売却損」になります。新しいトラック100円の取得原価を計上しつつ、古いトラック（資産とその減価償却累計額）を帳簿から取り除き、下取り価格を差し引いた残り85円を現金で支払います。'
  },
  { id:1113, calc:'残存耐用年数：10－6＋6×20％＝5.2年 → 5年\n減価償却費：200÷5年＝40円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'印刷業を営むW社は、中古の印刷機を、200円で購入した。この印刷機は、法定耐用年数が10年で、すでに6年使われたものである。W社は、この印刷機の残存耐用年数を、次の簡便な方法で見積もることにした。<strong>残存耐用年数＝法定耐用年数－経過年数＋経過年数×20％（1年未満は切り捨て）</strong>。この印刷機の残存価額はゼロで、定額法を採用し、<mark class="q-as-li">記帳は間接法</mark>によっている。決算にあたり、<mark class="q-expense">この期の価値の減少分</mark>について、必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',40]],c:[['減価償却累計額',40]]}],
    exp:'「法定耐用年数」とは、税法で定められている、その資産の耐用年数のことです。「残存耐用年数」とは、これから使える見込みの年数のことで、中古の資産では簡便な方法で見積もります。残存耐用年数＝10年－6年＋6年×20％＝10－6＋1.2＝5.2年→1年未満切り捨てで5年。減価償却費＝200円÷5年＝40円です。新品の資産とは違い、中古資産では「すでに何年使われたか」を考慮して、残りの使用可能年数を見積もり直す点がポイントです。'
  },
  { id:1294, calc:'100－60＝40円', cat:'有形固定資産', chap:'第6章：有形固定資産',
    q:'X社は、事務所の建物の改修工事を行い、代金100円を当座預金口座から支払った。このうち、<mark class="q-asset">60円は建物の使える年数を延ばすための改良</mark>（資本的支出）、<mark class="q-expense">残りは壊れた部分を元に戻すための修繕</mark>（収益的支出）である。この日の仕訳を行いなさい。',
    e:[{d:[['建物',60],['修繕費',40]],c:[['当座預金',100]]}],
    exp:'建物の価値を高めたり、使える年数を延ばしたりする支出（資本的支出）は、建物の金額に足して、その後の減価償却で費用にしていきます。元の状態に戻すだけの支出（収益的支出）は、その期の「修繕費」という費用です。'
  },
  // --- 無形資産・リース・引当金 ---
  { id:1114, calc:'', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'化粧品を開発して販売しているX社は、肌にやさしい新しい化粧水を、来年発売したいと考えている。そのため、研究部門で、成分の研究や試作を行った。研究は続いており、商品として発売できるかどうかは、まだわからない。この<mark class="q-expense">研究活動にかかった費用40円を</mark>、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['研究開発費',40]],c:[['現金',40]]}],
    exp:'新しい商品や技術を開発するための、研究や試作にかかった費用は「研究開発費」という費用で処理します。「商品として発売できるかどうかは、まだわからない」とあるように、将来の収益につながるかが不確かな支出は、資産にはせず、支払った時点で費用にするのが会計のルールです。'
  },
  { id:1115, calc:'', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、自社の研究部門で、化粧水の新しい製造方法を発明した。この製造方法を、他社にまねされないように、<mark class="q-asset">特許の登録を行った</mark>。登録が認められ、登録にかかった費用60円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['特許権',60]],c:[['現金',60]]}],
    exp:'「特許」とは、発明を、一定の期間、独占して使うことができる権利（特許権）を、国から与えられることです。研究開発費（前問）とは違い、特許として正式に登録が認められた権利は、将来にわたって独占的に使える価値のある財産なので、「特許権」という無形固定資産（形のない資産）として計上します。'
  },
  { id:1116, calc:'60÷10年＝6円', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'決算にあたり、X社は、上記の特許権について、この期の償却を行う。この<mark class="q-asset">特許権の取得原価は60円で</mark>、<mark class="q-expense">10年間にわたって、毎年同じ金額ずつ償却する（定額法）</mark>。記帳は、<mark class="q-asset">特許権の金額を直接減らす方法（直接法）</mark>による。決算に必要な仕訳を行いなさい。',
    e:[{d:[['特許権償却',6]],c:[['特許権',6]]}],
    exp:'「償却」とは、無形資産の価値の減少分を、毎期の費用にしていくことです。特許権のような無形固定資産も、有形固定資産の減価償却と同じように、使える期間にわたって少しずつ費用化していきます。60円÷10年＝6円が1年分の償却額です。無形資産はふつう「直接法」（資産の金額から直接差し引く方法）で記帳するので、相手科目は「特許権」そのものになります。'
  },
  { id:1117, calc:'', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、新しい化粧品ブランドを立ち上げることになり、そのブランドの名前とマークを、他社に使われないようにしたいと考えた。そこで、<mark class="q-asset">商標の登録を行った</mark>。登録にかかった<mark class="q-asset">費用30円を、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['商標権',30]],c:[['現金',30]]}],
    exp:'「商標」とは、商品の名前やマークを、独占して使うことができる権利（商標権）を、国から与えられることです。特許権が「発明」を守る権利なのに対し、商標権は「ブランド名やロゴ」を守る権利です。どちらも国への登録によって生まれる、無形固定資産の仲間です。'
  },
  { id:1118, calc:'', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、店舗ごとの在庫や販売を、コンピュータで管理したいと考えた。市販のソフトウェアでは、自社に合わなかったため、自社の社員が、自社で使うソフトウェアを開発した。<mark class="q-asset">ソフトウェアが完成</mark>し、開発にかかった<mark class="q-asset">費用50円を、現金で支払った</mark>。このソフトウェアは、自社で使うためのもので、販売はしない。この日の仕訳を行いなさい。',
    e:[{d:[['ソフトウェア',50]],c:[['現金',50]]}],
    exp:'自社で使うために作ったり買ったりしたソフトウェアは「ソフトウェア」という無形固定資産で処理します。「販売するためではなく、自社で使うためのもの」という点がポイントで、これによって将来の業務コスト削減などの効果が見込めるため、研究開発費のような不確実な支出とは違い、資産として計上できます。'
  },
  { id:1119, calc:'', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、自社で使う新しい販売管理ソフトウェアの制作を、外部のIT会社に依頼した。<mark class="q-asset">ソフトウェアは、まだ完成していない</mark>。制作費の一部として、<mark class="q-asset">20円を現金で先に支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['ソフトウェア仮勘定',20]],c:[['現金',20]]}],
    exp:'制作を頼んだソフトウェアが完成するまでの間に支払った代金は、いったん「ソフトウェア仮勘定」という一時的な資産に記録しておきます。建物でいえば「建設仮勘定」にあたる科目です。完成して引渡しを受けたときに、正式な「ソフトウェア」という資産に振り替えます。'
  },
  { id:1120, calc:'', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'その後、X社が外部のIT会社に依頼していた、上記の販売管理<mark class="q-asset">ソフトウェアが完成</mark>した。動作の確認も終わり、X社は、この<mark class="q-asset">ソフトウェアの引渡しを受けた</mark>。これまでに支払った20円が、このソフトウェアの制作費の全額である。ソフトウェアが完成した日に、必要な仕訳を行いなさい。',
    e:[{d:[['ソフトウェア',20]],c:[['ソフトウェア仮勘定',20]]}],
    exp:'ソフトウェアが完成し、正式に引渡しを受けたので、それまで仮の置き場所だった「ソフトウェア仮勘定」を、正式な「ソフトウェア」という資産に振り替えます。建設仮勘定が完成した建物に振り替わるのと、まったく同じ考え方です。'
  },
  { id:1121, calc:'50÷5年＝10円', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'決算にあたり、X社は、上記の自社で開発した<mark class="q-asset">ソフトウェア（取得原価50円）</mark>について、この期の償却を行う。このソフトウェアは、<mark class="q-expense">5年間使う見込みで、毎年同じ金額ずつ償却する（定額法）</mark>。記帳は直接法による。決算に必要な仕訳を行いなさい。',
    e:[{d:[['ソフトウェア償却',10]],c:[['ソフトウェア',10]]}],
    exp:'ソフトウェアも特許権と同じように、使用見込み期間にわたって少しずつ償却していきます。50円÷5年＝10円が1年分の償却額（ソフトウェア償却という費用）です。記帳は直接法なので、相手科目はソフトウェアそのものになります。'
  },
  { id:1122, calc:'受け入れた資産：60＋40＝100円\nのれん：120－100＝20円', cat:'無形資産', chap:'無形資産・リース・引当金',
    q:'X社は、同業のY社の事業を、<mark class="q-asset">現金120円で買い取った</mark>。受け入れた資産の時価は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。X社は、Y社が築いた<mark class="q-asset">ブランド力や顧客基盤に価値</mark>があると考え、受け入れた資産の時価の合計より高い代金を払った。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40],['のれん',20]],c:[['現金',120]]}],
    exp:'「時価」とは、その時点の市場での価格のことです。他の会社の事業を買ったときに、受け入れた資産の時価の合計（60円＋40円＝100円）より多く払った差額（120円－100円＝20円）は「のれん」という無形固定資産で処理します。これは、相手会社が築いてきたブランド力や顧客基盤など、目に見えない価値に対して追加で払った金額を表しています。'
  },
  { id:1123, calc:'', cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'水産物を加工して販売しているX社は、Y社と、加工工場で使う<mark class="q-asset">冷凍設備Aについて、ファイナンス・リース契約</mark>を結んだ。リース期間は5年で、<mark class="q-liability">リース料は毎年11円（総額55円）</mark>である。この冷凍設備Aを、現金で買った場合の見積価額は、50円である。X社は<strong>利子込み法</strong>によって処理する。契約を結んだ日の仕訳を行いなさい。',
    e:[{d:[['リース資産',55]],c:[['リース債務',55]]}],
    exp:'「ファイナンス・リース」とは、契約の途中で解約できず、借りた設備のほぼ全ての費用を、借り手が負担するリース契約のことです（実質的には、設備を購入したのと同じとみなされます）。「利子込み法」とは、リース料の総額を、そのまま、リース資産とリース債務として計上する方法です。借りているだけなのに「リース資産」という資産を計上するのは、実質的に分割払いで設備を買ったのと同じと考えるためです。'
  },
  { id:1124, calc:'', cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、Y社と、<mark class="q-asset">冷凍設備Bについても、ファイナンス・リース契約</mark>を結んだ。リース期間は5年で、<mark class="q-liability">リース料は毎年11円（総額55円）</mark>である。この冷凍設備Bを、現金で買った場合の見積価額は、50円である。リース料の総額と、この見積価額との差額5円は、利息にあたる。X社は、この利息相当額を区別して、<strong>利子抜き法</strong>によって処理する。契約を結んだ日の仕訳を行いなさい。',
    e:[{d:[['リース資産',50]],c:[['リース債務',50]]}],
    exp:'「利子抜き法」とは、リース料の総額から、利息相当額を差し引いた金額（見積現金購入価額）を、リース資産とリース債務として計上する方法です。前問の利子込み法（総額55円で計上）とは違い、利息相当額5円（55円－50円）を最初から除いた50円だけを資産・負債として計上します。利息部分は、支払いのたびに少しずつ費用として認識していきます（次の問題参照）。'
  },
  { id:1125, calc:'支払利息：5÷5年＝1円\nリース債務の返済：11－1＝10円', cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'上記の冷凍設備Bのリース契約（<strong>利子抜き法</strong>）について、リース料の支払日が来た。契約では、<mark class="q-liability">リース料は、毎年同じ日に、11円ずつ支払う</mark>ことになっている。X社は、第1回のリース料11円を、<mark class="q-asset">現金で支払った</mark>。<mark class="q-expense">利息相当額5円は</mark>、リース期間の5年間にわたって、毎年同じ金額ずつ配分する（<strong>定額法</strong>）。この日の仕訳を行いなさい。',
    e:[{d:[['リース債務',10],['支払利息',1]],c:[['現金',11]]}],
    exp:'利子抜き法では、毎回のリース料支払いを「元本（リース債務）の返済」と「利息」の2つに分けます。利息相当額5円を5年間で均等に配分すると、5円÷5年＝1円が1年分の利息（支払利息）です。支払った11円のうち、1円は利息として費用計上し、残り10円はリース債務（負債）を返済したものとして処理します。'
  },
  { id:1126, calc:'50÷5年＝10円', cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'決算にあたり、X社は、上記の冷凍設備B（リース資産50円）について、この期の価値の減少分を計算することにした。この期は、契約を結んだ日から1年間、この設備を使った。<mark class="q-expense">リース期間は5年、耐用年数も5年で、残存価額はゼロである</mark>。定額法を採用し、記帳は<mark class="q-as-li">間接法</mark>によっている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['減価償却費',10]],c:[['リース資産減価償却累計額',10]]}],
    exp:'リース資産も、自社で所有する固定資産と同じように減価償却を行います。50円÷5年＝10円が1年分の減価償却費です。「間接法」なので、リース資産の金額は直接減らさず、「リース資産減価償却累計額」という別の科目に、これまでの減少分を積み上げていきます。'
  },
  { id:1127, calc:'', cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、事務所のコピー機を、<mark class="q-expense">オペレーティング・リース契約</mark>で借りている。この契約は、ファイナンス・リースに当てはまらない、通常の賃貸借に近いリース契約である。X社は、当月分のリース料10円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['支払リース料',10]],c:[['現金',10]]}],
    exp:'「オペレーティング・リース」とは、ファイナンス・リース以外のリース契約のことです（実質的には、設備を購入したのではなく、借りているだけと考えます）。ファイナンス・リースのように資産・負債を計上する必要はなく、毎月のリース料を、そのまま「支払リース料」という費用として処理するだけの、普通の賃貸借と同じシンプルな処理です。'
  },
  { id:1128, calc:'30－18＝12円', cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、<mark class="q-asset">ファイナンス・リースによって、冷凍設備Cを使っている</mark>。この冷凍設備Cの帳簿価額は、30円である。ところが、水産物の市況が急激に悪化し、この設備を使った事業の収益性が、大きく下がった。そこで、この設備の回収可能価額を見積もったところ、18円であった。X社は、<mark class="q-expense">帳簿価額を、回収可能価額まで切り下げる</mark>。必要な仕訳を行いなさい。',
    e:[{d:[['減損損失',12]],c:[['リース資産',12]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。「回収可能価額」とは、その資産を使ったり売ったりして、将来回収できると見込まれる金額のことです。ファイナンス・リースのリース資産も、自社所有の固定資産と同じように減損会計の対象になります。帳簿価額30円が回収可能価額18円まで下がったと判断されたので、差額12円を「減損損失」という費用として計上し、リース資産の帳簿価額を実態に合わせて切り下げます。'
  },
  { id:1129, calc:'', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'紙を製造して販売しているX社は、工場の主要な機械について、2年に1度、大がかりな修繕を行っている。次の修繕は、来期に予定されている。この<mark class="q-liability">修繕にかかる費用は、8円と見積もられている</mark>。<mark class="q-expense">今期の決算にあたり</mark>、X社は、この修繕に備えて、必要な仕訳を行いなさい。',
    e:[{d:[['修繕引当金繰入',8]],c:[['修繕引当金',8]]}],
    exp:'引当金とは「将来発生しそうな費用・損失を、実際に発生する前から見積もって、今期の費用として先取りしておく」仕組みです。来期に予定している機械の修繕は、今期の事業活動によって生じた摩耗などが原因と考えられるため、その費用を先取りして「修繕引当金繰入」という費用で計上し、「修繕引当金」という負債として備えておきます。'
  },
  { id:1130, calc:'45×2か月／6か月＝15円', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社の従業員に対する賞与は、年2回、6月と12月に支払われる。6月に支払う賞与は、1月から6月までの6か月間の働きに対するもので、<mark class="q-liability">支給見込み額は45円である</mark>。X社の決算日は2月末で、今期には、このうち1月と2月の2か月分が含まれる（<strong>月割</strong>で計算する）。決算にあたり、この賞与のうち、<mark class="q-expense">今期に対応する分について、必要な仕訳</mark>を行いなさい。',
    e:[{d:[['賞与引当金繰入',15]],c:[['賞与引当金',15]]}],
    exp:'賞与は実際に支払うのが来期であっても、その対象となる働きはすでに今期に発生している分があります。6か月分（45円）の賞与のうち、今期に含まれる2か月分（1月・2月）を月割りで計算すると、45円×2か月／6か月＝15円です。この金額を今期のうちに「賞与引当金繰入」という費用と「賞与引当金」という負債として先取りで計上します。'
  },
  { id:1131, calc:'', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、役員に対しても、賞与を支払う予定である。この役員賞与は、株主総会で決議されて支払われるもので、<mark class="q-liability">支給見込み額は10円である</mark>。この10円は、今期の働きに対するものである。<mark class="q-expense">決算にあたり</mark>、必要な仕訳を行いなさい。',
    e:[{d:[['役員賞与引当金繰入',10]],c:[['役員賞与引当金',10]]}],
    exp:'役員に支払う賞与も、一般従業員の賞与と同じように「発生した期間の費用として先取りする」のが原則です。株主総会での正式な決議はまだでも、対象となる働きはすでに今期に発生しているため、見積額10円を今期のうちに「役員賞与引当金繰入」という費用と「役員賞与引当金」という負債として計上します。'
  },
  { id:1132, calc:'', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、従業員が退職するときに、退職金を支払うことになっている。退職金は、従業員が働いた期間に応じて、少しずつ発生していく。<mark class="q-liability">今期に発生した分は、25円と見積もられた</mark>。<mark class="q-expense">決算にあたり</mark>、この25円について、必要な仕訳を行いなさい。',
    e:[{d:[['退職給付費用',25]],c:[['退職給付引当金',25]]}],
    exp:'退職給付引当金は、将来支払う退職金を、従業員が実際に働いた期間に応じて少しずつ費用として積み立てていく仕組みです。今期の労働に対応する見込み額（25円）を、今期のうちに「退職給付費用」という費用と「退職給付引当金」という負債として計上します。実際に退職金を支払うのはずっと先でも、少しずつ準備しておく、という考え方です。'
  },
  { id:1133, calc:'', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'家電を一般のお客さんに売っているX社は、販売した商品に、購入から1年間の無償修理の保証を付けている。過去の実績から、保証の期間中に、販売した商品の一部が故障して、修理が必要になることが、わかっている。今期に販売した商品について、<mark class="q-liability">将来かかると見込まれる保証の費用は、6円</mark>と見積もられた。<mark class="q-expense">決算にあたり</mark>、必要な仕訳を行いなさい。',
    e:[{d:[['商品保証引当金繰入',6]],c:[['商品保証引当金',6]]}],
    exp:'商品保証引当金は、販売した商品に将来発生するかもしれない無償修理・交換の費用を、販売した期のうちに見積もって先取りしておく仕組みです。「今期売った商品の保証費用は、今期の売上に対応するコストである」という考え方にもとづき、見積額6円を「商品保証引当金繰入」という費用と「商品保証引当金」という負債として計上します。'
  },
  { id:1134, calc:'8－6＝2円', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、前の期に販売した商品について、お客さんから修理の依頼を受けて、修理を行った。修理にかかった実際の費用8円は、<mark class="q-asset">現金で支払った</mark>。前の期の決算で、この<mark class="q-liability">保証のために見積もって計上していた金額は、6円である</mark>。<mark class="q-expense">見積額を超えた分は、当期の費用とする</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['商品保証引当金',6],['商品保証費',2]],c:[['現金',8]]}],
    exp:'実際に保証修理の費用が発生したら、まず前期に積み立てておいた貯金箱（商品保証引当金6円）を取り崩して充て、それでも足りない超過分（8円－6円＝2円）は、新たに今期の費用（商品保証費）として追加計上します。見積もりが実際の費用より少なかった場合の、不足分の埋め合わせです。'
  },
  { id:1295, calc:'30－20＝10円', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、前期末に、建物の修繕に備えて<mark class="q-liability">修繕引当金20円</mark>を計上していた。当期に予定どおり修繕を行い、<mark class="q-expense">修繕費30円</mark>を<mark class="q-asset">当座預金口座から支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['修繕引当金',20],['修繕費',10]],c:[['当座預金',30]]}],
    exp:'修繕引当金は、前期に修繕費を前もって費用にしておいたものです。実際に修繕したら、引当金20円を取り崩して使います。引当金で足りない10円だけが、当期の「修繕費」になります。'
  },
  { id:1296, calc:'50－40＝10円', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、前期末に、<mark class="q-liability">賞与引当金40円</mark>を計上していた。当期に、従業員に<mark class="q-expense">賞与50円</mark>を<mark class="q-asset">当座預金口座から支給した</mark>。このうち40円は前期の勤務に対する分、10円は当期の勤務に対する分である。この日の仕訳を行いなさい。',
    e:[{d:[['賞与引当金',40],['賞与',10]],c:[['当座預金',50]]}],
    exp:'前期の勤務に対する40円は、前期末に引当金としてすでに費用にしています。支給したときは賞与引当金を取り崩して使い、当期の勤務に対する10円だけを「賞与」という当期の費用にします。'
  },
  { id:1297, calc:'', cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社の従業員が退職したため、<mark class="q-asset">退職金30円を当座預金口座から支払った</mark>。X社は、従業員の退職金に備えて、毎期、<mark class="q-liability">退職給付引当金</mark>を計上している。この日の仕訳を行いなさい。',
    e:[{d:[['退職給付引当金',30]],c:[['当座預金',30]]}],
    exp:'退職金は、従業員が働いた各期に少しずつ費用（退職給付費用）にして、退職給付引当金として積み立ててあります。支払ったときは、すでに費用になっているので、引当金を取り崩すだけです。新しい費用は出ません。'
  },
  // --- 第10章：株式会社会計 ---
  { id:1135, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'パンを製造して販売する会社を新しく作ることになり、X社が設立された。設立にあたって、株式を発行し、<mark class="q-asset">払込金額200円が、当座預金口座に振り込まれた</mark>。X社は、<mark class="q-equity">払込金額の全額を、法定の資本として組み入れた</mark>。設立の日の仕訳を行いなさい。',
    e:[{d:[['当座預金',200]],c:[['資本金',200]]}],
    exp:'「払込金額」とは、株式を発行するときに、株主が会社に払い込むお金のことです。「法定の資本」とは、株主が払い込んだお金のうち、会社法で、会社の資本として扱われるもののことです。株式を発行して集めたお金は、銀行から借りるお金とは違い、返済する義務のない会社自身の元手になります。払込金額の全額を法定の資本とする場合は、そのまま「資本金」という純資産に計上します。'
  },
  { id:1136, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、設立に必要な、法律で決められた手続きを行った。会社の基本となるルール（定款）を作り、設立の登記を行った。これらにかかった、<mark class="q-asset">定款の作成費用や設立登記の税金</mark>など、合計15円を、<mark class="q-asset">現金で支払った</mark>。この支出は<strong>繰延資産</strong>として処理する。この日の仕訳を行いなさい。',
    e:[{d:[['創立費',15]],c:[['現金',15]]}],
    exp:'「定款」とは、会社の目的や組織などを定めた、会社の基本となるルールのことです。会社を設立するためにかかった費用（定款作成費・登記の税金など）は「創立費」という科目で処理します。創立費は、名前に「費」とつきますが費用科目ではなく、会社の設立準備のために支出したお金をいったん資産（繰延資産）として計上し、その後数年にわたって少しずつ償却していく科目です。会社そのものがまだ存在しない設立準備の段階でかかった費用なので、次の問題で出てくる「開業費」（会社ができた後の準備費用）とは区別します。'
  },
  { id:1137, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、設立が終わったあと、パン屋の営業を始めるための準備を進めた。お店を開く前に、開店を知らせるための広告を出し、事務所の準備も行った。<mark class="q-asset">営業を始めるまでの間に、これらにかかった広告費や事務所の準備の費用</mark>として、合計8円を、<mark class="q-asset">現金で支払った</mark>。この支出は<strong>繰延資産</strong>として処理する。この日の仕訳を行いなさい。',
    e:[{d:[['開業費',8]],c:[['現金',8]]}],
    exp:'「開業費」とは、会社を設立した後、実際に営業を始めるまでの準備期間にかかった費用（広告・事務所の準備など）のことです。創立費と同じく、開業費も名前に反して費用科目ではなく、支出した時点ではいったん資産（繰延資産）として計上し、その後少しずつ償却していく科目です。会社が生まれる前の費用（創立費）とは違い、会社が生まれた後、営業が始まるまでの準備費用である点が違いです。「法人ができる前か、後か」で創立費と開業費を使い分けるのがポイントです。'
  },
  { id:1138, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'衣料品の企画と販売をしているX社は、新しく株式を発行して、事業の資金を集めることにした。<mark class="q-liability">株式の申込みをした人から、申込みの際に払い込まれる300円を、申込証拠金として受け取り</mark>、通常の預金とは区別した<mark class="q-asset">専用の口座に預け入れた</mark>。株式は、まだ発行していない。この日の仕訳を行いなさい。',
    e:[{d:[['別段預金',300]],c:[['株式申込証拠金',300]]}],
    exp:'「申込証拠金」とは、株式の申込みをした人が、払込期日の前に、申込みの際に払い込むお金のことです。まだ正式に株式を発行していない段階なので、受け取ったお金は資本金にはせず、「株式申込証拠金」という一時的な負債（＝正式な株主になるまでの預かり金）で処理します。入金先も通常の預金とは区別した「別段預金」という専用口座（資産）を使います。'
  },
  { id:1139, calc:'資本金：200×1／2＝100円\n資本準備金：200－100＝100円', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、<mark class="q-equity">増資にあたり、新株を発行した</mark>。払込金額200円が、<mark class="q-asset">当座預金口座に振り込まれた</mark>。X社は、払込金額のうち、<mark class="q-equity">会社法が認める最低額を、法定の資本として組み入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',200]],c:[['資本金',100],['資本準備金',100]]}],
    exp:'会社法では、払込金額の全額を資本金にするのが原則ですが、最低でも半額を資本金にすれば、残りは「資本準備金」という純資産にすることも認められています。「会社法が認める最低額」という指示は、払込金額の半分（200円×1／2＝100円）を資本金とし、残りの100円を資本準備金とすることを意味します。'
  },
  { id:1140, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、上記の増資のために、新しく株式を発行して、資金を集めた。<mark class="q-asset">新しい株式を発行するため</mark>には、証券会社に手続きを頼んだり、書類を印刷したりする必要がある。これらにかかった費用として、証券会社への手数料など、合計5円を、<mark class="q-asset">現金で支払った</mark>。この支出は<strong>繰延資産</strong>として処理する。この日の仕訳を行いなさい。',
    e:[{d:[['株式交付費',5]],c:[['現金',5]]}],
    exp:'新しく株式を発行するときにかかる事務費用（証券会社への手数料・印刷代など）は「株式交付費」という科目で処理します。株式交付費も、創立費や開業費と同じように、支出した時点ではすぐに費用にはせず、いったん資産（繰延資産）として計上し、その後少しずつ償却していく科目です。会社設立時の創立費や開業費とは違い、増資（会社ができた後の株式発行）にかかった費用である点がポイントです。'
  },
  { id:1141, calc:'積立の上限：400×1／4＝100円\n今の準備金：60＋30＝90円 → あと10円\n配当の1／10：200×1／10＝20円\n少ない方の10円を積み立てる\n繰越利益剰余金：200＋10＝210円', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'雑貨を販売しているX社は、株主総会で、<mark class="q-equity">過去に稼いだ利益の蓄積を財源</mark>とする<mark class="q-liability">配当200円を決議した</mark>。X社の資本金は400円、資本準備金は60円、利益準備金は30円である。この決議で<mark class="q-equity">積み立てる利益準備金の金額</mark>を計算して、必要な仕訳を行いなさい。配当金は、まだ支払っていない。',
    e:[{d:[['繰越利益剰余金',210]],c:[['未払配当金',200],['利益準備金',10]]}],
    exp:'会社法では、配当をするときに、配当額の10分の1を、準備金として積み立てるルールがあります（ただし資本準備金と利益準備金の合計が、資本金の4分の1に達するまでの金額が上限です）。上限＝400円×1／4＝100円、現在の準備金合計＝60円＋30円＝90円なので、あと10円まで積み立てられます。配当額200円の10分の1は20円ですが、上限の10円までしか積み立てられないため、利益準備金は10円になります。繰越利益剰余金という貯金箱から、配当（未払配当金）と準備金の積立（利益準備金）の2つに振り分けます。'
  },
  { id:1142, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、別の期の株主総会で、これまで稼いだ利益の一部を、株主に<mark class="q-liability">配当として支払う</mark>ことにした。<mark class="q-equity">過去に稼いだ利益の蓄積を財源</mark>とする配当30円が、決議された。配当金は、決議の日から、しばらくたってから支払うことになっており、まだ支払っていない。この日の仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',30]],c:[['未払配当金',30]]}],
    exp:'配当が決議された時点で、株主に対して「支払わなければならない」という義務がすでに発生しています。決議の日にはまだ実際にお金を払っていないので、繰越利益剰余金（純資産）を減らし、「未払配当金」という負債（＝これから株主に払う義務）を計上します。'
  },
  { id:1143, calc:'', cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、将来、新しい店舗を出す計画を立てている。新店舗を建てるには、まとまった資金が必要になる。そこで、株主総会の決議により、<mark class="q-equity">過去に稼いだ利益の蓄積から20円を</mark>、<mark class="q-equity">新店舗の建設のための積立金</mark>として積み立てた。この日の仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',20]],c:[['任意積立金',20]]}],
    exp:'「任意積立金」のような積立金は、会社が自主的な判断で、将来の特定の目的（この場合は新店舗の建設）のために利益の一部を取り分けておく、いわば「目的別の貯金」です。法律で義務付けられた利益準備金とは違い、会社が自由な判断で金額や使いみちを決められます。繰越利益剰余金から任意積立金へ、純資産の中で科目が変わるだけの処理です。'
  },
  { id:1144, calc:'受け入れた資産：60＋40＝100円\n負ののれん発生益：100－80＝20円', cat:'企業合併', chap:'第10章：株式会社会計',
    q:'食品を製造して販売しているX社は、同業のY社を<strong>吸収合併</strong>した。<mark class="q-revenue">合併の対価として</mark>、<mark class="q-asset">現金80円を支払った</mark>。Y社から受け入れた資産は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40]],c:[['現金',80],['負ののれん発生益',20]]}],
    exp:'「吸収合併」とは、ある会社が、他の会社を取り込んで、1つの会社になることです。受け入れた資産の時価の合計（60円＋40円＝100円）より、支払った対価（80円）の方が少なかった、つまり「お買い得に買えた」状態です。この差額20円は「負ののれん発生益」として、その期の収益に一括計上します（のれんとは逆で、資産にはせず、すぐに利益にする点に注意）。'
  },
  { id:1145, calc:'受け入れた資産：60＋40＝100円\nのれん：120－100＝20円', cat:'企業合併', chap:'第10章：株式会社会計',
    q:'X社は、同業のY社を<strong>吸収合併</strong>した。合併の対価として、X社の新株を発行して、Y社の株主に交付した。<mark class="q-equity">対価の総額は120円で</mark>、この全額を、法定の資本にも準備金にも組み入れず、<mark class="q-equity">その他の払込資本</mark>とする。Y社から受け入れた資産は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。<mark class="q-asset">対価が受け入れた資産を上回る分はのれんとする</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40],['のれん',20]],c:[['その他資本剰余金',120]]}],
    exp:'今度は対価120円の方が、受け入れた純資産100円（商品60円＋建物40円）より多いので、差額20円は「のれん」（相手会社のブランド力や将来性への対価）として資産計上します。合併の対価を新株発行でまかなう場合、会社法上は資本金にするのが原則ですが、全額を資本金にも準備金にも入れず「その他資本剰余金」という純資産にすることも認められています。'
  },
  { id:1146, calc:'20÷10年＝2円', cat:'企業合併', chap:'第10章：株式会社会計',
    q:'X社は、前に他の会社を合併したときに、<mark class="q-asset">のれん20円</mark>を計上している。のれんは、<mark class="q-expense">合併の日から10年間にわたって、毎年同じ金額ずつ償却する（定額法）</mark>。今期も、決算の時期になった。決算にあたり、この期の1年分について、必要な仕訳を行いなさい。',
    e:[{d:[['のれん償却',2]],c:[['のれん',2]]}],
    exp:'のれんは、他社を買収したときに「帳簿上の価値以上に払った、目に見えない価値」への対価です。この価値は永遠に続くわけではないと考えられるため、20年以内（この問題では10年）の期間にわたって少しずつ費用として償却していきます。20円÷10年＝2円が1年分の償却額です。'
  },
  { id:1147, calc:'', cat:'自己株式', chap:'第10章：株式会社会計',
    q:'機械部品を製造しているX社は、自社の株価が、会社の実力に比べて安いと考えている。そこで、株主総会の決議にもとづき、市場に出回っている<mark class="q-eq-as">自社の株式</mark>を、株主から、40円分、買い戻すことにした。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['自己株式',40]],c:[['現金',40]]}],
    exp:'「自己株式」とは、会社が、自社で発行した株式を、株主から買い戻して、保有しているもののことです。自社の株式を買い戻すと、それは通常の資産の購入とは違い、株主に対する資本の一部払い戻しに近い意味を持ちます。そのため取得原価のまま、純資産の部から差し引くマイナス項目（自己株式）として計上します。'
  },
  { id:1148, calc:'45－40＝5円', cat:'自己株式', chap:'第10章：株式会社会計',
    q:'X社は、以前に買い戻した<mark class="q-eq-as">自社の株式（帳簿価額40円）</mark>を、資金が必要になったため、市場で売却することにした。自社の株価が上がっていたので、<mark class="q-eq-rv">売却価額は45円になり</mark>、<mark class="q-asset">代金は現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',45]],c:[['自己株式',40],['自己株式処分差益',5]]}],
    exp:'買い戻していた自己株式を、取得したときより高く売却できました。この差額（5円）は商品売買のような利益ではなく、株主との資本取引から生じたものなので、損益計算書ではなく「自己株式処分差益」という純資産の項目に計上します。'
  },
  { id:1149, calc:'40－35＝5円', cat:'自己株式', chap:'第10章：株式会社会計',
    q:'X社は、以前に買い戻した<mark class="q-eq-as">自社の株式（帳簿価額40円）</mark>を、資金が必要になったため、市場で売却することにした。しかし、自社の株価が下がっていたので、<mark class="q-eq-ex">売却価額は35円になり</mark>、<mark class="q-asset">代金は現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',35],['自己株式処分差損',5]],c:[['自己株式',40]]}],
    exp:'今回は逆に、自己株式を取得したときより安く売却してしまいました。この差額（5円）も、損益計算書の費用にはせず、「自己株式処分差損」という純資産の項目で処理します。自己株式の売買で生じた差額は、儲けや損ではなく、あくまで純資産内部の増減として扱われる点がポイントです。'
  },
  { id:1298, calc:'', cat:'純資産', chap:'第10章：株式会社会計',
    q:'X社は、株主総会の決議により、<mark class="q-equity">資本準備金20円を減らし、その全額を資本金に組み入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['資本準備金',20]],c:[['資本金',20]]}],
    exp:'株主資本の中で、ある項目から別の項目へ金額を移すことを「株主資本の計数の変動」といいます。会社の財産は何も増減せず、純資産の合計も変わりません。資本準備金を減らし、同じ額だけ資本金を増やします。'
  },
  { id:1299, calc:'', cat:'純資産', chap:'第10章：株式会社会計',
    q:'X社は、これまでの損失が積み重なり、<mark class="q-equity">繰越利益剰余金が30円のマイナス（借方残高）</mark>になっている。そこで、株主総会の決議により、<mark class="q-equity">その他資本剰余金30円を取り崩して、このマイナスを埋めた</mark>（欠損のてん補）。この日の仕訳を行いなさい。',
    e:[{d:[['その他資本剰余金',30]],c:[['繰越利益剰余金',30]]}],
    exp:'繰越利益剰余金のマイナスは、借方に残高がある状態です。これを埋めるには、貸方に記入してゼロに戻します。その財源として、その他資本剰余金を減らします。純資産の中で移すだけなので、純資産の合計は変わりません。'
  },
  // --- 外貨建・伝票・給与 ---
  { id:1150, calc:'105－100＝5円（為替差益）', cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'日本製の雑貨を輸出しているX社は、アメリカの取引先に、<mark class="q-asset">雑貨1ドル分を、掛けで売った</mark>。代金は、米ドルで支払ってもらう約束（<strong>外貨建て</strong>）である。売った日の為替相場は、1ドル＝100円で、X社は、この売掛金を100円として記録した。その後、<mark class="q-other">代金が支払われる日が来た。この日の為替相場は、1ドル＝105円であった</mark>。取引先から、代金1ドルが、円に換えられて、<mark class="q-asset">現金105円で支払われた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',105]],c:[['売掛金',100],['為替差損益',5]]}],
    exp:'「外貨建て」とは、代金を、円ではなく、外国の通貨（ここでは米ドル）で決めた取引のことです。「為替相場」とは、円と外国の通貨を交換するときの、交換の比率のことです。売った時点では1ドル＝100円で売掛金を記録していましたが、実際に代金を受け取る日には1ドル＝105円に円安が進んでいたため、予定より多くの円を受け取れました。この差額5円は「為替差損益」という収益（得をした分）として処理します。'
  },
  { id:1151, calc:'105－100＝5円', cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'X社は、アメリカの仕入先から、<mark class="q-liability">原材料1ドル分を、掛けで購入した</mark>。購入した日の為替相場は、1ドル＝100円で、X社は、この買掛金を100円として記録した。代金の支払いは、3か月後である。3か月の間に円安が進むと、支払う円の金額が増えてしまう。そこで、X社は、銀行と、3か月後の為替相場をあらかじめ1ドル＝105円に決める契約（<strong>為替予約</strong>）を結んだ。X社は、この買掛金を、<mark class="q-other">予約した為替相場で円に換算した金額（105円）で、計上しなおす（振当処理）</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['為替差損益',5]],c:[['買掛金',5]]}],
    exp:'「為替予約」とは、将来の一定の日に、外貨を円に換えるときの為替相場を、あらかじめ決めておく契約のことです。「振当処理」とは、為替予約で決めた為替相場で、外貨建ての債権や債務を、円に換算した金額に、計上しなおす方法のことです。もともと100円で記録していた買掛金を、予約レートで計算した105円に修正するため、差額5円を買掛金（負債）に上乗せし、相手科目は「為替差損益」という費用（将来の支払いが増えてしまう分の損失）で処理します。予約した時点で、将来の支払額が確定するのがポイントです。'
  },
  { id:1152, calc:'', cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'X社は、別の取引で、アメリカの仕入先から仕入れた原材料の代金（外貨建て）を支払うために、銀行と為替予約を結んでいる。X社は、この為替予約を、買掛金とは切り離して、為替予約そのものを時価で評価する方法（<strong>独立処理</strong>）によって処理している。決算の日に、<mark class="q-asset">為替予約の時価を計算</mark>したところ、契約したときよりも不利になっており、その<mark class="q-other">差額は3円で</mark>あった。決算に必要な仕訳を行いなさい。',
    e:[{d:[['為替差損益',3]],c:[['為替予約',3]]}],
    exp:'「独立処理」とは、外貨建ての債務と、為替予約とを、切り離して、それぞれ別に評価する方法のことです。前の問題の「振当処理」（買掛金に為替予約の効果をまとめて反映させる方法）とは違い、独立処理では為替予約そのものを「為替予約」という独立した資産・負債として時価評価します。契約時より不利な方向に3円動いたので、「為替予約」という負債を3円計上し、相手科目は「為替差損益」という費用で処理します。'
  },
  { id:1156, calc:'', cat:'租税・貯蔵品', chap:'税効果',
    q:'惣菜を製造して販売しているX社は、新しい取引先と、売買契約を結ぶことになり、契約書を作った。契約書には、収入印紙を貼って、税金を納める決まりになっている。そこで、郵便局で、<mark class="q-expense">収入印紙3円を</mark>、<mark class="q-asset">現金で購入</mark>し、すぐに契約書に貼って使った。この日の仕訳を行いなさい。',
    e:[{d:[['租税公課',3]],c:[['現金',3]]}],
    exp:'「収入印紙」とは、契約書や領収書などにかかる税金を、納めるために貼る、国が発行する印紙のことです。収入印紙や固定資産税のような税金関係の支出は「租税公課」という費用で処理します。買ってすぐに使った（契約書に貼った）ので、資産にはせず、そのまま費用として計上します。'
  },
  { id:1157, calc:'', cat:'租税・貯蔵品', chap:'税効果',
    q:'X社は、工場の土地と建物について、市役所から、<mark class="q-expense">固定資産税の納付書を受け取った</mark>。固定資産税は、土地や建物などの固定資産を持っていることに対してかかる税金である。X社は、納付書の金額8円を、期限までに、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['租税公課',8]],c:[['現金',8]]}],
    exp:'固定資産税も、収入印紙と同じ「租税公課」という費用で処理します。商品や仕事に直接関係する税金ではなく、固定資産を保有していることに対してかかる税金なので、会社の事業活動にともなう一般的な費用として扱われます。'
  },
  { id:1158, calc:'50－5－3＝42円', cat:'給与・社保', chap:'税効果',
    q:'X社は、今月の従業員の給料の支払日を迎えた。<mark class="q-expense">従業員に対する給料の総額は、50円である</mark>。給料を支払うときは、会社が、従業員に代わって、給料から、<mark class="q-liability">所得税の源泉徴収分5円と</mark>、<mark class="q-liability">社会保険料の従業員負担分3円</mark>を差し引く。X社は、これらを<mark class="q-asset">差し引いた残りを、従業員に、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['給料',50]],c:[['現金',42],['所得税預り金',5],['社会保険料預り金',3]]}],
    exp:'「源泉徴収」とは、給料などを支払うときに、会社が、あらかじめ税金を差し引いて、従業員に代わって、国に納めることです。「社会保険料」とは、健康保険や厚生年金などの保険料で、従業員と会社が分担して負担します。給料の総支給額（50円）はまるごと会社の費用になりますが、従業員が実際に受け取る金額はそれより少なくなります。天引きした所得税と社会保険料は、会社がいったん預かって、後で国や保険機関に代わりに納める「預り金」という負債で処理します。'
  },
  { id:1159, calc:'', cat:'給与・社保', chap:'税効果',
    q:'X社は、上記の給料を支払ったときに、従業員に代わって、給料から所得税5円を差し引いて、預かっていた。会社は、この預かった所得税を、従業員に代わって、国に納める義務がある。納める期限が来たため、X社は、<mark class="q-liability">預かっていた所得税5円を</mark>、税務署に、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['所得税預り金',5]],c:[['現金',5]]}],
    exp:'給料から天引きしていた所得税（預り金・負債）を、約束通り税務署に納付します。会社自身の費用ではなく、従業員の代わりに国へ届ける「預かっていたお金」を払っただけなので、負債（所得税預り金）が消えて現金が減るだけの処理になります。'
  },
  { id:1160, calc:'3＋3＝6円', cat:'給与・社保', chap:'税効果',
    q:'X社は、上記の給料を支払ったときに、従業員から、社会保険料の従業員負担分3円を、預かっていた。社会保険料は、従業員が負担する分と、会社が負担する分が、同じ金額になる決まりである。そのため、会社が負担する社会保険料も、3円である。納付の期限が来たため、X社は、<mark class="q-liability">預かっていた3円と</mark>、<mark class="q-expense">会社負担の3円を</mark>、あわせて、年金事務所に、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['社会保険料預り金',3],['法定福利費',3]],c:[['現金',6]]}],
    exp:'社会保険料の納付には、従業員の給料から天引きしていた分（社会保険料預り金・負債）と、会社自身が負担する分（法定福利費・費用）の2種類が混ざっています。納付するときは、預かっていた分を返す（負債の消滅）と同時に、会社自身の負担分を新たに費用として計上する、という2つの処理を1つの取引にまとめて行います。'
  },
  { id:1161, calc:'100＋8＝108円', cat:'消費税', chap:'税効果',
    q:'X社は、食材を100円で仕入れた。仕入れのときには、食材の代金のほかに、消費税8円も、あわせて支払う。X社は、消費税を、仕入や売上の金額とは区別して記帳する方法（<strong>税抜方式</strong>）を採用している。<mark class="q-expense">食材の代金100円と</mark>、<mark class="q-asset">消費税8円は</mark>、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['仕入',100],['仮払消費税',8]],c:[['現金',108]]}],
    exp:'「消費税」とは、商品の販売やサービスの提供に対してかかる税金のことです（最終的には、商品を買う消費者が負担しますが、会社が、その代わりに国へ納めます）。「税抜方式」とは、消費税を、売上や仕入の金額とは区別して、記帳する方法です。本体価格100円は「仕入」という費用、支払った消費税8円は、いずれ国に納める分の立て替えとして「仮払消費税」という資産で処理します。'
  },
  { id:1162, calc:'100＋10＝110円', cat:'消費税', chap:'税効果',
    q:'X社は、惣菜を100円で、お客さんに<mark class="q-revenue">販売した</mark>。販売のときには、惣菜の代金のほかに、お客さんから、<mark class="q-liability">消費税10円も、あわせて受け取る</mark>。X社は税抜方式を採用している。惣菜の代金100円と、消費税10円は、<mark class="q-asset">現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',110]],c:[['売上',100],['仮受消費税',10]]}],
    exp:'売上側でも同じように、本体価格100円は「売上」という収益、お客さんから預かった消費税10円は、いずれ国に納める「仮受消費税」という負債で処理します。会社は、お客様と税務署の間で消費税を仲介しているだけの立場です。'
  },
  { id:1163, calc:'10－8＝2円', cat:'消費税', chap:'税効果',
    q:'決算にあたり、X社は、当期の消費税について、<mark class="q-liability">国に納める</mark>金額を計算した。売上のときに、<mark class="q-liability">お客さんから受け取った消費税</mark>は10円、仕入のときに、<mark class="q-asset">支払った消費税</mark>は8円であった。この差額が、国に納める消費税になる。X社は税抜方式を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['仮受消費税',10]],c:[['仮払消費税',8],['未払消費税',2]]}],
    exp:'決算では、預かった消費税（仮受消費税）から立て替えた消費税（仮払消費税）を差し引いた本当の納税額を、「未払消費税」という負債として確定させます。10円－8円＝2円が実際に国へ納める金額です。'
  },
  { id:1164, calc:'', cat:'法人税', chap:'税効果',
    q:'X社は、<mark class="q-asset">法人税・住民税・事業税について、中間申告</mark>を行った。これらの税金は、事業年度が終わったあとに、1年分の税額が確定して、納めるが、年度の途中でも、前もって、一部を納める決まりになっている。X社は、中間申告にもとづき、15円を、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['仮払法人税等',15]],c:[['現金',15]]}],
    exp:'「中間申告」とは、事業年度の途中で、税金の一部を、前もって納めるために行う、申告の手続きのことです。この時点ではまだ正式な税額が確定していないため、費用ではなく「仮払法人税等」という資産（前払いしている状態）として計上します。決算で正式な税額が確定した段階で、この前払い分を差し引く形で精算します。'
  },
  { id:1165, calc:'', cat:'法人税', chap:'税効果',
    q:'決算にあたり、X社は、今期の利益にかかる、<mark class="q-expense">法人税・住民税・事業税</mark>の額を計算した。その結果、これら3つの税金の、1年分の合計額は、35円と確定した。このうち<mark class="q-asset">15円は、今期の途中で行った、中間申告のときに、すでに納付</mark>している。<mark class="q-liability">残りの20円は、決算のあとに、納付する</mark>。決算に必要な仕訳を行いなさい。',
    e:[{d:[['法人税、住民税及び事業税',35]],c:[['仮払法人税等',15],['未払法人税等',20]]}],
    exp:'決算で法人税等の正式な金額（35円）が確定したら、それを今期の費用（法人税、住民税及び事業税）として計上します。すでに中間申告で前払いしていた分（仮払法人税等15円）はこの費用から差し引き、まだ払っていない残額（20円）は「未払法人税等」という負債として計上し、翌期に実際に納付します。'
  },
  { id:1166, calc:'', cat:'消費税', chap:'税効果',
    q:'食料品を売っているX社は、消費税を、仕入や売上の金額に含めて記帳する方法（<strong>税込方式</strong>）を採用している。X社は、店で売る食料品を、仕入先から、<mark class="q-expense">商品100円で仕入れた</mark>。仕入れのときには、消費税8円も、あわせて支払う必要がある。代金は、<mark class="q-asset">消費税とあわせた108円を、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['仕入',108]],c:[['現金',108]]}],
    exp:'「税込方式」とは、消費税を、売上や仕入の金額に含めて、記帳する方法です。税抜方式（仮払消費税・仮受消費税を使う）とは違い、税込方式では消費税を本体価格と分けずに、そのまま仕入や売上の金額に含めて処理します。108円全額をそのまま「仕入」として計上する、シンプルな処理です。'
  },
  { id:1167, calc:'10－8＝2円', cat:'消費税', chap:'税効果',
    q:'<mark class="q-expense">決算にあたり、X社は、当期の消費税について、国に納める金額を計算</mark>した。当期の売上に含まれる消費税は10円、当期の仕入に含まれる消費税は8円であった。この<mark class="q-liability">差額が、国に納める消費税</mark>になる。X社は税込方式を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['租税公課',2]],c:[['未払消費税',2]]}],
    exp:'税込方式では、売上や仕入にすでに消費税が含まれてしまっているため、決算で改めて納める消費税額（10円－8円＝2円）を計算し、「租税公課」という費用として計上するとともに、「未払消費税」という負債を計上します。税抜方式（仮受・仮払消費税を相殺するだけ）とは違い、税込方式では納税額そのものが新たな費用として認識される点が異なります。'
  },
  { id:1206, calc:'', cat:'伝票', chap:'外貨建・伝票・給与',
    q:'文房具を販売しているX社は、取引を、入金伝票・出金伝票・振替伝票の3種類の伝票に分けて記入している（<strong>3伝票制</strong>）。あるとき、X社は、お店に来たお客さんに、<mark class="q-revenue">文房具を100円で販売し</mark>、<mark class="q-asset">代金を、その場で、現金で受け取った</mark>。この取引を、入金伝票に記入する。この取引の仕訳を行いなさい。',
    e:[{d:[['現金',100]],c:[['売上',100]]}],
    exp:'「入金伝票」とは、現金が入ってくる取引を、記入する伝票のことです。入金伝票を使うと決めた時点で「借方が現金であること」は伝票の種類そのものから明らかなので、伝票には「何から現金を受け取ったのか（貸方の科目＝売上）」と金額だけを記入すれば十分です。仕訳に直すと「現金100／売上100」になります。'
  },
  { id:1207, calc:'', cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、文房具の在庫が少なくなったため、仕入先から、文房具を仕入れることにした。<mark class="q-expense">文房具80円分が、お店に届き</mark>、<mark class="q-asset">代金を、その場で、現金で支払った</mark>。この取引を、出金伝票に記入する。この取引の仕訳を行いなさい。',
    e:[{d:[['仕入',80]],c:[['現金',80]]}],
    exp:'「出金伝票」とは、現金が出ていく取引を、記入する伝票のことです。出金伝票の貸方は必ず「現金」と決まっているので、伝票には「何に現金を使ったか（借方の科目＝仕入）」と金額だけを記入すれば十分です。仕訳に直すと「仕入80／現金80」になります。'
  },
  { id:1208, calc:'', cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、新学期に向けて、<mark class="q-expense">仕入先から、文房具を100円で仕入れた</mark>。商品はお店に届いたが、<mark class="q-liability">代金は、月末にまとめて支払う約束（掛け）にした</mark>。この取引では、現金は動いていない。この取引を、振替伝票に記入する。この取引の仕訳を行いなさい。',
    e:[{d:[['仕入',100]],c:[['買掛金',100]]}],
    exp:'「振替伝票」とは、現金が動かない取引を、記入する伝票のことです。入金伝票・出金伝票は「現金の動きがある」ことが前提でしたが、振替伝票はそれ以外のすべての取引を扱うため、入金伝票や出金伝票と違って、借方・貸方の両方をきちんと記入する必要があります。「現金が入る→入金伝票、現金が出る→出金伝票、現金が動かない→振替伝票」という3つの使い分けを覚えておきましょう。'
  },
  { id:1209, calc:'', cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、お店に来たお客さんに、<mark class="q-revenue">文房具を100円で販売した</mark>。代金のうち、<mark class="q-asset">40円は、その場で、現金で受け取り</mark>、<mark class="q-asset">残りの60円は、後日受け取る約束（掛け）にした</mark>。X社は、この取引を、現金の取引と、現金以外の取引に分けて（分解して）、それぞれ、入金伝票と振替伝票に記入する。この取引全体の仕訳を行いなさい。',
    e:[{d:[['現金',40],['売掛金',60]],c:[['売上',100]]}],
    exp:'現金と掛けが混ざった取引は「現金部分→入金伝票」「掛け部分→振替伝票」の2枚に分けて記入します。なぜ分けるかというと、入金・出金伝票のルールは「相手科目が必ず現金」だからです。掛け部分には現金が絡まないので、別の振替伝票にしなければなりません。2枚の伝票を合算すると、元の取引「現金40・売掛金60／売上100」という1つの仕訳に戻ります。'
  },
  { id:1210, calc:'', cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、<mark class="q-expense">仕入先から、文房具を80円で仕入れた</mark>。代金のうち、<mark class="q-asset">30円は、その場で、現金で支払い</mark>、<mark class="q-liability">残りの50円は、後日支払う約束（掛け）にした</mark>。X社は、この取引を、現金の取引と、現金以外の取引に分けて（分解して）、それぞれ、出金伝票と振替伝票に記入する。この取引全体の仕訳を行いなさい。',
    e:[{d:[['仕入',80]],c:[['現金',30],['買掛金',50]]}],
    exp:'こちらも現金と掛けが混ざった取引を「現金部分→出金伝票」「掛け部分→振替伝票」の2枚に分けて記入するケースです。2枚の伝票を合算すると、元の取引「仕入80／現金30・買掛金50」という1つの仕訳に戻ります。1つの取引でも、支払い方法が混ざっていれば伝票を使い分ける、という3伝票制のルールを確認する問題です。'
  },
  // --- 税効果 ---
  { id:1153, calc:'10×30％＝3円', cat:'税効果', chap:'税効果',
    q:'文房具を小売店に卸しているX社は、決算にあたり、<mark class="q-other">得意先に対する未回収の代金について、貸倒れに備えて、費用を計上した</mark>。会計上は、10円を費用としたが、税務上は、このうち、<mark class="q-asset">費用（損金）として認められる限度額を超える部分が、10円ある</mark>（<strong>将来減算一時差異</strong>）。この10円は、将来、実際に貸倒れが確定したときに、税金の計算でも、費用として認められる。実効税率は30％で、X社は税効果会計を適用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['繰延税金資産',3]],c:[['法人税等調整額',3]]}],
    exp:'「税務上」とは、税金の計算の上では、ということです。「損金」とは、税金の計算の上で、費用として認められる金額のことです。「将来減算一時差異」とは、会計上と税務上のズレのうち、将来、税金の計算で、費用として認められて、税金の支払いを減らすもののことです。会計上は費用として認めた金額でも、税務上はすぐに損金として認めてもらえないことがあります。将来、実際に貸し倒れが発生すれば、税務上もようやく損金として認められ、税金が安くなります。この「将来の税金が安くなる権利」を、あらかじめ「繰延税金資産」という資産として先取りで計上します（10円×30％＝3円）。'
  },
  { id:1154, calc:'10×30％＝3円', cat:'税効果', chap:'税効果',
    q:'X社は、長期保有の目的で、Y社の株式を持っている。決算にあたり、この株式の時価が、取得原価より10円高くなっていた。<mark class="q-eq-rx">この評価差額10円は、すでに、損益に入れず、全額を純資産に直接計上する方法で、処理してある</mark>。税務上、<mark class="q-liability">この10円は、この株式を売却したときに課税される</mark>（<strong>将来加算一時差異</strong>）。実効税率は30％で、X社は税効果会計を適用している。この評価差額に対する税効果について、決算に必要な仕訳を行いなさい。',
    e:[{d:[['その他有価証券評価差額金',3]],c:[['繰延税金負債',3]]}],
    exp:'「取得原価」とは、買ったときに支払った金額のことです。「評価差額」とは、時価と取得原価との差額のことです。「将来加算一時差異」とは、会計上と税務上のズレのうち、将来、税金の計算で、利益に加えられて、税金の支払いを増やすもののことです。その他有価証券の評価差益は、純資産に直接計上されますが、将来この株式を売却すれば、その利益に対して実際に税金がかかります。そこで、将来発生するであろう税金（10円×30％＝3円）をあらかじめ「繰延税金負債」として見込んでおき、純資産に計上する評価差額金は、税金分を差し引いた残りの金額にします。'
  },
  { id:1155, calc:'繰延税金資産：（10＋20）×30％＝9円\n繰延税金負債：10×30％＝3円', cat:'税効果', chap:'税効果',
    q:'決算にあたり、X社は、会計上と税務上のズレを、次のとおり確認した。1つ目は、<mark class="q-other">貸倒れに備えた費用のうち</mark>、<mark class="q-asset">損金として認められる限度額を超える部分が、10円ある</mark>。2つ目は、<mark class="q-other">減価償却費のうち</mark>、<mark class="q-asset">税務上の限度額を超える部分が、20円ある</mark>。この2つは、将来、税金の計算で、費用として認められる（<strong>将来減算一時差異</strong>）。3つ目は、<mark class="q-eq-rx">その他有価証券の評価差益10円で、すでに、全額を純資産に直接計上してある</mark>。<mark class="q-liability">この10円は、将来、株式を売却したときに課税される</mark>（<strong>将来加算一時差異</strong>）。実効税率は30％で、X社は税効果会計を適用している。これらの税効果を、まとめて処理する、決算の仕訳を行いなさい。',
    e:[{d:[['繰延税金資産',9],['その他有価証券評価差額金',3]],c:[['法人税等調整額',9],['繰延税金負債',3]]}],
    exp:'3種類の一時差異を1問でまとめて処理する、税効果会計の総まとめ問題です。①貸倒れに備えた費用の超過額（将来減算一時差異）：10円×30％＝3円の繰延税金資産。②減価償却費の超過額（同じく将来減算一時差異）：20円×30％＝6円の繰延税金資産。①と②を合わせて繰延税金資産3円。①②は損益項目（法人税等調整額）として処理します。③その他有価証券の評価益（将来売却時に課税される＝将来加算一時差異）：10円×30％＝3円を繰延税金負債に計上し、純資産（その他有価証券評価差額金）を同額減らします。損益を通る項目（①②）と、純資産に直接計上する項目（③）を、しっかり区別して処理するのがポイントです。'
  },
  // --- 本支店・連結・個人事業主 ---
  { id:1168, calc:'', sides:['本店側','支店側'], cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'雑貨を卸しているX社は、本店のほかに、支店を持っている。支店は、仕入先に対する未払いの代金を、支払う必要があったが、支店の手元の現金が、足りなかった。そこで、<mark class="q-other">本店</mark>が、<mark class="q-asset">支店</mark>に、<mark class="q-asset">現金50円を送金</mark>した。本店と支店は、それぞれ、別々に帳簿をつけている。この送金について、本店と支店の、それぞれの仕訳を行いなさい。',
    e:[{d:[['支店',50]],c:[['現金',50]]},{d:[['現金',50]],c:[['本店',50]]}],
    exp:'「本店・支店」とは、本店は会社の中心となる営業所、支店は本店とは別の場所にある営業所のことです（会計では、本店と支店が、それぞれ別に帳簿をつけることがあります）。本店は、支店に送った現金を「支店」という内部取引専用の勘定（照合勘定）で管理し、支店は受け取った現金の相手科目として「本店」という勘定を使います。この「本店」勘定と「支店」勘定は、いわば会社内部でのお金の貸し借りを記録する鏡のような関係で、最終的に本店・支店をまとめた財務諸表を作るときには、お互いに相殺して消えます。'
  },
  { id:1169, calc:'', sides:['本店側'], cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'X社の<mark class="q-asset">支店</mark>は、決算日に、<mark class="q-expense">本店へ商品10円を発送</mark>した。支店は、そのことを、本店に連絡し、支店の帳簿には、すでに処理している。ところが、決算日の時点で、商品は、まだ本店に届いていない（<strong>未達</strong>）。そのため、本店の帳簿には、この商品の受入れが、記録されていない。本店が、決算日に行うべき仕訳を行いなさい。',
    e:[{d:[['支店より仕入',10]],c:[['支店',10]]}],
    exp:'「未達」とは、一方の帳簿では処理済みだが、もう一方には、まだ届いていない取引や商品のことです。支店はすでに発送した記録をつけていますが、本店にはまだ商品が届いておらず、記録が漏れている状態です。決算にあたっては、本店側でもこの未達分を認識し、「支店より仕入」という費用（本店から見た支店からの仕入）を計上し、相手科目として「支店」勘定を増やします。こうすることで、本店と支店の帳簿の金額が、最終的に一致するように調整されます。'
  },
  { id:1170, calc:'', sides:['九州支店側','本店側','関西支店側'], cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'X社は、本店のほかに、九州支店と関西支店を持っている。X社は、支店どうしの取引も、すべて本店を通したものとして、<mark class="q-other">記帳する仕組み（本店集中計算制度）</mark>を採用している。<mark class="q-other">九州支店</mark>が、<mark class="q-other">関西支店</mark>に、<mark class="q-asset">現金20円を送金</mark>した。この送金について、九州支店・本店・関西支店の、それぞれの帳簿の仕訳を行いなさい。',
    e:[{d:[['本店',20]],c:[['現金',20]]},{d:[['関西支店',20]],c:[['九州支店',20]]},{d:[['現金',20]],c:[['本店',20]]}],
    exp:'「本店集中計算制度」とは、支店どうしの取引を、直接のやりとりとはせず、すべて本店を通したものとして、記帳する制度のことです。実際には九州支店から関西支店へ直接送金していても、帳簿上は「まず九州支店から本店へ」「それから本店から関西支店へ」という2段階の取引があったかのように記録します。九州支店は「本店」勘定、本店は「関西支店」勘定と「九州支店」勘定、関西支店は「本店」勘定を使い、支店どうしが直接勘定を持ち合わない点がポイントです。すべての支店間取引の窓口を本店に一本化することで、本店が全社のお金の流れを把握しやすくなります。'
  },
  { id:1171, calc:'45×10／90＝5円', sides:['本店側'], cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'X社の本店は、原価80円の商品に、内部利益10円を加えた90円で、支店に商品を発送している。決算にあたり、支店の期末商品のうち、本店から発送された商品の金額は、発送価額（90円）で、45円分ある。この45円分の商品に含まれている<mark class="q-expense">内部利益を、控除し</mark>、<mark class="q-as-li">繰延内部利益として繰り延べる</mark>。本店の決算に必要な仕訳を行いなさい。',
    e:[{d:[['繰延内部利益控除',5]],c:[['繰延内部利益',5]]}],
    exp:'「内部利益」とは、本店が、支店に商品を発送するときに、原価に上乗せした利益のことです（会社全体で見ると、まだ実現していない利益なので、決算で控除します）。本店は商品を80円の原価に10円の利益を乗せた90円で支店に送っていますが、会社全体（本店＋支店）で見れば、まだ外部のお客さんに売れていない商品にすぎません。支店の期末在庫45円のうち、含まれている内部利益（45円×10／90＝5円）を、損益計算書上は「繰延内部利益控除」で取り除き、貸借対照表上は「繰延内部利益」という資産のマイナス項目として計上し、翌期に振り戻します。'
  },
  { id:1172, calc:'Ｙ社の純資産：50＋30＝80円\nのれん：100－80＝20円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'食品加工機械を製造しているX社は、部品を作っているY社の<mark class="q-asset">発行済株式の全てを、100円で取得</mark>して、Y社を子会社にした。取得した日（支配獲得日）の、Y社の純資産は、<mark class="q-equity">資本金50円</mark>と<mark class="q-equity">利益剰余金30円</mark>の、合計80円であった。連結の手続きでは、X社の投資と、Y社の純資産を<strong>相殺消去</strong>する。<mark class="q-asset">差額は、のれん</mark>として処理する。支配獲得日の連結仕訳を行いなさい。',
    e:[{d:[['資本金',50],['利益剰余金',30],['のれん',20]],c:[['子会社株式',100]]}],
    exp:'「連結」とは、親会社と子会社を、1つの会社のように、まとめて表す会計のことです。「子会社」とは、他の会社（親会社）に、過半数の議決権を持たれて、経営を支配されている会社のことです。「相殺消去」とは、グループ内の取引や貸し借りを、連結上、打ち消して、なかったことにすることです。親会社が投資した金額（子会社株式100円）と、子会社の純資産（資本金50円＋利益剰余金30円＝80円）を相殺すると、差額20円が残ります。「のれん」とは、買収した会社に、純資産より高い代金を払ったときの、その差額のことで、相手会社のブランド力など目に見えない価値への対価として資産計上します。'
  },
  { id:1173, calc:'Ｙ社の純資産：60＋40＝100円\n非支配株主持分：100×20％＝20円\nのれん：90－100×80％＝10円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、Y社の<mark class="q-asset">発行済株式の80％を、90円で取得</mark>して、Y社を子会社にした。支配獲得日の、Y社の純資産は、<mark class="q-equity">資本金60円</mark>と<mark class="q-equity">利益剰余金40円</mark>の、合計100円であった。X社の持分（80％）にあたる80円は、X社の投資と相殺消去する。<mark class="q-equity">残りの20％にあたる20円は、他の株主（非支配株主）の持分</mark>として、残す。<mark class="q-asset">差額は、のれん</mark>として処理する。支配獲得日の連結仕訳を行いなさい。',
    e:[{d:[['資本金',60],['利益剰余金',40],['のれん',10]],c:[['子会社株式',90],['非支配株主持分',20]]}],
    exp:'「非支配株主」とは、子会社の株主のうち、親会社以外の株主のことです。100％子会社（前問）とは違い、80％だけ支配している場合は、子会社の純資産（100円）のうち、親会社の持分（80円）は投資（子会社株式90円）と相殺し、残り20％（20円）は「非支配株主持分」という純資産の項目として連結財務諸表に残します。相殺の差額10円（親会社の投資80円と取り分80円の差）は、のれんとして資産計上します。'
  },
  { id:1174, calc:'55－50＝5円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'上記のY社は、<mark class="q-asset">土地（帳簿価額50円）</mark>を持っている。X社が支配を獲得した日に、<mark class="q-equity">この土地の時価を調べたところ、55円であった</mark>。連結の手続きでは、支配獲得日の時価で、子会社の資産を、評価しなおす。税効果は、考えないものとする。支配獲得日の連結仕訳のうち、この土地について必要な仕訳を行いなさい。',
    e:[{d:[['土地',5]],c:[['評価差額',5]]}],
    exp:'連結会計では、子会社を「まるごと仲間に迎え入れる」ときに、子会社の資産・負債を「今の本当の価値（時価）」に評価し直すというルールがあります。帳簿には昔買ったときの値段（50円）が残っていますが、支配獲得日の時価が55円なら、差額5円を「評価差額」という純資産の勘定に計上します。この評価差額は、後で親会社の投資と子会社の純資産を相殺する処理のときに、子会社の純資産の一部として扱われます。'
  },
  { id:1175, calc:'', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、連結の手続きで、上記のY社を子会社にしたときに、<mark class="q-asset">のれん10円を計上している</mark>。のれんは、<mark class="q-expense">支配獲得日から10年間にわたって、毎年同じ金額ずつ償却する</mark>。支配獲得日から、1年がたち、連結決算の時期になった。決算にあたり、この期の1年分について、必要な連結仕訳を行いなさい。',
    e:[{d:[['のれん償却',1]],c:[['のれん',1]]}],
    exp:'「償却」とは、のれんなどの価値の減少分を、毎期の費用にしていくことです。連結上計上したのれんも、個別財務諸表ののれんと同じように、一定期間にわたって少しずつ費用化していきます。10円÷10年＝1円が1年分の償却額です。'
  },
  { id:1176, calc:'30×20％＝6円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'Y社は、今期、<mark class="q-other">当期純利益30円を計上した</mark>。X社は、<strong>子会社</strong>であるY社の株式の80％を持ち、<mark class="q-equity">残りの20％は、非支配株主が持っている</mark>。連結上は、Y社の利益のうち、非支配株主の持分にあたる部分を、区別して表す。この連結仕訳を行いなさい。',
    e:[{d:[['非支配株主に帰属する当期純利益',6]],c:[['非支配株主持分',6]]}],
    exp:'子会社が稼いだ利益は、親会社の取り分だけでなく、非支配株主の取り分もあります。Y社の当期純利益30円のうち、非支配株主の持分割合20％にあたる6円（30円×20％）は、連結損益計算書上「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）を増やします。子会社の儲けのうち、親会社の分は親会社の利益剰余金へ、他の株主の分は非支配株主持分へ、取り分に応じて分けるイメージです。'
  },
  { id:1177, calc:'', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'Y社（X社の<strong>子会社</strong>）は、株主に、<mark class="q-equity">配当金10円を支払う</mark>ことを決めた。このうち、<mark class="q-revenue">X社（80％）に8円</mark>、<mark class="q-equity">非支配株主（20％）に2円が</mark>、支払われる。X社が受け取った配当金は、グループ内のやりとりなので、連結上、相殺消去する。この連結仕訳を行いなさい。',
    e:[{d:[['受取配当金',8],['非支配株主持分',2]],c:[['剰余金の配当',10]]}],
    exp:'子会社が親会社に払う配当金は、グループ全体で見れば「自分の左のポケットから右のポケットにお金を移しただけ」で、外部との本当の取引ではありません。親会社が受け取った配当金（受取配当金8円）は取り消し、非支配株主への配当分（2円）は非支配株主持分（純資産）の減少として処理します。もともと子会社側で計上されていた「剰余金の配当」（純資産の減少）10円を、相殺によって取り消します。'
  },
  { id:1178, calc:'', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'当期中に、X社は、<strong>子会社</strong>であるY社に、<mark class="q-expense">商品40円を販売</mark>した。X社は、<mark class="q-revenue">この40円を売上として</mark>、Y社は、この40円を仕入として、それぞれ記録している。この取引は、グループ内の取引なので、連結上は、なかったことにする。この内部取引の相殺消去の、連結仕訳を行いなさい。',
    e:[{d:[['売上',40]],c:[['仕入',40]]}],
    exp:'連結財務諸表は「グループ全体を1つの会社」として見た財務諸表です。親会社が子会社に商品を売っても、グループの外から見れば商品が社内で移動しただけで、本当の売上・仕入ではありません。そこで、親会社の「売上」と子会社の「仕入」を、金額をぶつけ合って両方ともゼロにします。'
  },
  { id:1179, calc:'', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'期末に、X社は、<strong>子会社</strong>であるY社に<mark class="q-asset">商品を販売した代金</mark>25円を、まだ受け取っていない。Y社から見ると、X社から<mark class="q-liability">仕入れた商品の代金</mark>25円を、まだ支払っていない。この2つは、どちらも、X社とY社のグループ内の貸し借りにあたる。グループ全体で見ると、外部との貸し借りではないため、連結上は<strong>相殺消去</strong>する。この連結仕訳を行いなさい。',
    e:[{d:[['買掛金',25]],c:[['売掛金',25]]}],
    exp:'親会社の売掛金（グループ内の子会社に対する債権）と、子会社の買掛金（グループ内の親会社に対する債務）は、グループ全体で見れば「自分が自分に貸しているだけ」で、実質的な貸し借りはありません。そこで、親会社の「売掛金」と子会社の「買掛金」を、金額をぶつけ合って両方ともゼロにします。'
  },
  { id:1180, calc:'', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'Y社（X社の<strong>子会社</strong>）の、<mark class="q-asset">期末の商品10円分</mark>は、X社から購入したものである。X社が、Y社に販売したときに上乗せしていた利益のうち、まだグループの外に売れていない分<mark class="q-expense">（未実現利益）が、2円ある</mark>。この未実現利益を、連結上、消去する。この連結仕訳を行いなさい。',
    e:[{d:[['売上原価',2]],c:[['商品',2]]}],
    exp:'「未実現利益」とは、グループ内の取引で生じた利益のうち、グループの外に売れていないために、まだ実現していない利益のことです。親会社が子会社に商品を売るときに乗せた利益は、グループ外のお客さんにまだ売れていない限り、グループ全体としては「本当の儲け」とは言えません。期末の子会社在庫10円に含まれる未実現利益2円分を、「売上原価」という費用を増やし、「商品」という資産を減らすことで取り除きます。'
  },
  { id:1181, calc:'30－25＝5円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、Y社の発行済株式の60％を持ち、Y社を支配している。X社は、さらに、Y社の株式の20％を、<mark class="q-asset">現金30円で追加取得</mark>して、持ち株比率を80％にした。<mark class="q-equity">追加取得した株式にあたる、Y社の純資産に対する持分は、25円である</mark>。子会社の支配を保ったまま、株式を追加取得したときは、支払った対価と、非支配株主の持分の減少額との差額を、<mark class="q-equity">資本剰余金として処理する</mark>。この連結仕訳を行いなさい。',
    e:[{d:[['非支配株主持分',25],['その他資本剰余金',5]],c:[['現金',30]]}],
    exp:'「追加取得」とは、すでに支配している子会社の株式を、さらに買い増すことです。すでに支配は獲得済みなので、のれんは新たに計算しません。非支配株主（他の株主）から株を買い取るイメージなので、非支配株主持分のうち買い取った分（25円）を減らします。実際に払った金額（30円）が、この非支配株主持分の減少額（25円）より多いので、その超過分5円は、損益ではなく「その他資本剰余金」という純資産の減少として処理します。「株主間の持分の移動に、余計に払った分は、純資産の中で調整する」というイメージです。'
  },
  { id:1182, calc:'40－32＝8円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、すでにY社の発行済株式の70％を持ち、Y社を支配している。X社は、さらに、Y社の株式の10％を、<strong>非支配株主</strong>から<mark class="q-asset">現金40円で追加取得</mark>して、持ち株比率を80％にした。<mark class="q-equity">追加取得した株式にあたる、Y社の純資産に対する持分は、32円である</mark>。<mark class="q-equity">差額は、資本剰余金</mark>として処理する。この連結仕訳を行いなさい。',
    e:[{d:[['非支配株主持分',32],['その他資本剰余金',8]],c:[['現金',40]]}],
    exp:'前問と同じパターンの追加取得です。非支配株主持分の減少額32円と、実際に支払った対価40円との差額8円を「その他資本剰余金」として処理します。「グループ内の株主構成が変わっただけ」なので、損益としては扱わないのがポイントです。'
  },
  { id:1183, calc:'28－25＝3円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、以前に、Y社の<mark class="q-asset">株式</mark>の20％を、25円で取得して、Y社を関連会社として持っていた。今回、さらに、Y社の株式の60％を、60円で取得して、Y社の支配を獲得した（Y社はX社の<strong>子会社</strong>となった）。このように、何回かに分けて株式を取得して、支配を得ることを、<strong>段階取得</strong>という。<mark class="q-revenue">支配獲得日の時価で、支配を獲得する前から持っていた20％の株式は、28円である</mark>。連結上、この20％の株式を、支配獲得日の時価に、評価しなおす。この連結仕訳を行いなさい。',
    e:[{d:[['子会社株式',3]],c:[['段階取得に係る差益',3]]}],
    exp:'「段階取得」とは、何回かに分けて、株式を取得して、子会社の支配を得ることです。一気に支配株主になるのではなく、少しずつ株を買い増して最終的に子会社化するケースでは、「支配を獲得した瞬間」に、それまで持っていた分（20％）も含めて全部を「今の時価」で評価し直すというルールがあります。以前25円で買った20％分が、今では28円の価値になっていたので、差額3円を「段階取得に係る差益」（連結上の収益）として計上します。'
  },
  { id:1184, calc:'', cat:'個人事業主', chap:'本支店・連結・個人事業主',
    q:'個人でパン屋（山田ベーカリー）を営む<strong>個人事業主</strong>の山田花子さんは、住宅街で、朝から焼きたてのパンを売っている。ある日、家族の誕生日のごちそうを買うために、お店のレジの<mark class="q-asset">現金から、10円を引き出して</mark>、自宅の生活費として使った。この10円は、<mark class="q-eq-as">お店の仕事とは関係のない、私用のための支出</mark>である。会社ではないので、お店のお金と、山田さん個人のお金は、別々に記帳する。この日の、山田ベーカリーの仕訳を行いなさい。',
    e:[{d:[['事業主貸',10]],c:[['現金',10]]}],
    exp:'「個人事業主」とは、会社を作らずに、個人が、自分の名前で事業を営む人のことです（事業のお金と、個人のお金は、別々に記帳します）。店主がお店のお金を私用に使うと、お店から見れば「店主への一時的な貸し」のような性質を持つため、「事業主貸」という資本のマイナス項目で処理します。株式会社の配当のような、純資産を減らす処理と似た働きをします。'
  },
  { id:1185, calc:'', cat:'個人事業主', chap:'本支店・連結・個人事業主',
    q:'山田ベーカリーは、小麦粉やバターなどの材料の仕入れ代金の支払いが、月末に重なった。お店のレジの現金が足りなくなり、このままでは、仕入先への支払いに間に合わない。そこで、店主の山田花子さんは、<mark class="q-equity">自分の財布から、5円を</mark>、<mark class="q-asset">お店の資金として、お店のレジに入れた</mark>。この日の、山田ベーカリーの仕訳を行いなさい。',
    e:[{d:[['現金',5]],c:[['事業主借',5]]}],
    exp:'店主が個人のお金をお店に入れると、お店から見れば「店主からの一時的な借り」のような性質を持つため、「事業主借」という資本のプラス項目で処理します。株式会社の増資に近いイメージですが、個人事業では株式を発行する代わりに「事業主借」という科目で記録します。'
  },
  { id:1186, calc:'', cat:'個人事業主', chap:'本支店・連結・個人事業主',
    q:'山田ベーカリーは、決算を迎えた。今期の途中で、店主の山田花子さんは、私用のために、<mark class="q-eq-as">お店の現金10円を、引き出している</mark>。また、<mark class="q-equity">自分のお金5円を、お店の資金として、お店に入れている</mark>。決算にあたり、これらの、店主とお店とのあいだのお金のやりとりを、<mark class="q-equity">店主が事業に出している元手の金額</mark>に、まとめて反映させる仕訳を行いなさい。',
    e:[{d:[['資本金',5],['事業主借',5]],c:[['事業主貸',10]]}],
    exp:'個人事業主の「事業主貸」「事業主借」は、期中はそれぞれ別々に記録しておきますが、決算のときには、最終的に「資本金」という1つの純資産の科目にまとめて反映させます。事業主貸10円（店主への貸し＝資本金を減らす方向）と事業主借5円（店主からの借り＝資本金を増やす方向）を相殺すると、差し引き5円だけ資本金を減らす必要があります。借方に資本金5円（減少）と事業主借5円（精算）、貸方に事業主貸10円（精算）を計上することで、両方の科目をゼロに戻しつつ、資本金を正味5円減らします。'
  },
  { id:1301, calc:'非支配株主持分：（50＋30）×20％＝16円\nのれん：70－（50＋30）×80％＝6円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社は、前期末に<mark class="q-asset">S社の株式の80％を70円で取得</mark>し、S社を子会社にした。取得した日のS社の純資産は、資本金50円、利益剰余金30円であった。当期の連結財務諸表を作成するにあたり、まず、<mark class="q-equity">前期に行った投資と資本の相殺消去を、当期にもう一度行う</mark>（<strong>開始仕訳</strong>）。純資産の項目は「当期首残高」を付けた科目を使う。開始仕訳を行いなさい。',
    e:[{d:[['資本金当期首残高',50],['利益剰余金当期首残高',30],['のれん',6]],c:[['子会社株式',70],['非支配株主持分当期首残高',16]]}],
    exp:'連結の修正仕訳は、親会社・子会社の帳簿には記録されません。そのため、毎年、両社の決算書を合わせるところからやり直すことになり、前期までに行った連結修正を、当期の最初にもう一度行います。これが開始仕訳です。前期の修正で動かした純資産の項目は、当期の期首の残高を直すことになるので、「当期首残高」を付けた科目を使います。'
  },
  { id:1302, calc:'', sides:['開始仕訳','実現の仕訳'], cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社は、子会社S社に商品を販売している。<mark class="q-asset">前期末のS社の在庫には、P社が上乗せした利益3円が含まれていた</mark>。この在庫は、当期中に、すべて外部に販売された。当期の連結財務諸表を作成するにあたり、<mark class="q-equity">前期の未実現利益の消去を引き継ぐ開始仕訳</mark>と、<mark class="q-expense">当期に外部に販売されて利益が実現した分の仕訳</mark>を行いなさい。',
    e:[{d:[['利益剰余金当期首残高',3]],c:[['商品',3]]},{d:[['商品',3]],c:[['売上原価',3]]}],
    exp:'前期末に在庫から消した3円の利益は、まだ親子の帳簿には残っているので、開始仕訳でもう一度消します。前期の利益を減らした修正なので、利益剰余金当期首残高を使います。その在庫は当期に外部に売れたので、利益はここで本当に実現しました。そこで在庫の減額を戻し、当期の売上原価を減らして、当期の利益にします。'
  },
  { id:1303, calc:'50×2％＝1円', sides:['債権債務の相殺','貸倒引当金の修正'], cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社は、子会社S社に対して、<mark class="q-asset">売掛金50円</mark>を持っている（S社には同じ額の買掛金がある）。P社は、この売掛金に対して、<mark class="q-asset">2％の貸倒引当金を設定している</mark>。連結財務諸表を作成するにあたり、<mark class="q-as-li">債権と債務を相殺消去し</mark>、あわせて<mark class="q-expense">貸倒引当金を修正する</mark>仕訳を行いなさい。',
    e:[{d:[['買掛金',50]],c:[['売掛金',50]]},{d:[['貸倒引当金',1]],c:[['貸倒引当金繰入',1]]}],
    exp:'グループ内の貸し借りは、1つの会社として見れば存在しないので、売掛金と買掛金を消し合います。消した売掛金に積んでいた貸倒引当金も、グループ内の債権には必要ないので取り消し、その分の貸倒引当金繰入（費用）も取り消します。'
  },
  { id:1304, calc:'50－40＝10円', cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社は、当期に、<mark class="q-asset">帳簿価額40円の土地</mark>を、子会社S社に50円で売却し、<mark class="q-revenue">固定資産売却益10円</mark>を計上した。S社は、期末にこの土地を持っている。連結財務諸表を作成するにあたり、必要な仕訳を行いなさい。',
    e:[{d:[['固定資産売却益',10]],c:[['土地',10]]}],
    exp:'1つの会社として見れば、土地は社内で持ち主が変わっただけで、外部には売れていません。P社が計上した売却益10円は未実現利益なので取り消し、S社の帳簿で50円になっている土地を、元の40円に戻します。'
  },
  { id:1305, calc:'非支配株主の負担：5×20％＝1円', sides:['未実現利益の消去','非支配株主の負担'], cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社は、S社の株式の80％を持っている。当期、<mark class="q-expense">子会社S社が親会社P社に商品を販売した</mark>（アップストリーム）。<mark class="q-asset">P社の期末の在庫には、S社が上乗せした利益5円が含まれている</mark>。連結財務諸表を作成するにあたり、<mark class="q-equity">未実現利益を消去し、そのうち非支配株主が負担する分を振り替える</mark>仕訳を行いなさい。',
    e:[{d:[['売上原価',5]],c:[['商品',5]]},{d:[['非支配株主持分',1]],c:[['非支配株主に帰属する当期純利益',1]]}],
    exp:'在庫に含まれる未実現利益5円は、親会社に売った場合と同じように消去します。ただし、今回利益を上乗せしたのは子会社S社なので、消去によってS社の利益が5円減ります。S社の利益の20％は非支配株主のものなので、減った分の20％（1円）も非支配株主に負担させ、非支配株主持分を減らします。'
  },
  // --- 決算整理 ---
  { id:1187, calc:'翌期分（4月〜11月の8か月）：12×8／12＝8円', cat:'経過勘定', chap:'決算整理',
    q:'名刺やチラシを印刷しているX社は、12月1日に、<mark class="q-expense">工場の火災保険の保険料として</mark>、向こう1年分（12月から翌年11月まで）の12円を、<mark class="q-asset">現金で支払った</mark>。支払ったときは、全額を、その期の費用として記録した。決算日は3月31日である。決算にあたり、<mark class="q-asset">まだ保険の期間が来ていない分</mark>を、月割で、次の期に繰り延べる。支払った日と、決算日の、それぞれの仕訳を行いなさい。',
    e:[{d:[['支払保険料',12]],c:[['現金',12]]},{d:[['前払費用',8]],c:[['支払保険料',8]]}],
    exp:'「月割」とは、1年分の金額を、月ごとに等分して計算することです。支払った12月1日の時点では、1年分12円を全額その期の費用（支払保険料）として記録します。しかし決算日（3月31日）の時点で、保険期間のうち、まだ到来していない翌期分（4月から11月までの8か月、12円×8／12＝8円）が残っています。この分は今期の費用にすべきではないため、「前払費用」という資産に振り替えて、来期に繰り延べます。'
  },
  { id:1188, calc:'', cat:'経過勘定', chap:'決算整理',
    q:'X社は、設備を購入するために、銀行から、お金を借りている。この借入金の利息は、半年ごとに、まとめて支払う約束になっている。決算日の時点で、前回の利息の支払いから、3か月がたっている。この<mark class="q-expense">3か月分の利息3円は、時間がたっているので、すでに発生している</mark>が、<mark class="q-liability">まだ支払っていない</mark>。決算にあたり、この3円について、必要な仕訳を行いなさい。',
    e:[{d:[['支払利息',3]],c:[['未払費用',3]]}],
    exp:'お金を借りている期間の利息は、実際に払う前でも「今期分は今期の費用」として記録します。これが発生主義の考え方です。まだ払っていない利息は「未払費用」という負債として計上し、翌期首に逆仕訳（再振替仕訳）で取り消し、実際の支払い時に費用計上が完結します。'
  },
  { id:1189, calc:'', cat:'経過勘定', chap:'決算整理',
    q:'X社は、取引先に、お金を貸している。この貸付金の利息は、返済のときに、まとめて受け取る約束になっている。決算日の時点で、貸付けから一定の期間がたっており、そのうち、この期に対応する<mark class="q-revenue">利息2円は、すでに発生している</mark>が、<mark class="q-asset">まだ受け取っていない</mark>。決算にあたり、この2円について、必要な仕訳を行いなさい。',
    e:[{d:[['未収収益',2]],c:[['受取利息',2]]}],
    exp:'利息は本来、実際に受け取るタイミングではなく、時間の経過とともに発生していくものです。まだ実際には受け取っていなくても、すでに今期の権利として発生しているため「未収収益」という資産に計上し、今期の収益として認識します。'
  },
  { id:1190, calc:'翌期分（4月〜11月の8か月）：12×8／12＝8円', cat:'経過勘定', chap:'決算整理',
    q:'X社は、使っていない事務所を、他社に貸している。12月1日に、借り手から、向こう1年分（12月から翌年11月まで）の<mark class="q-revenue">家賃12円を</mark>、<mark class="q-asset">現金で受け取った</mark>。受け取ったときは、全額を、その期の収益として記録した。決算日は3月31日である。決算にあたり、<mark class="q-liability">まだ貸していない期間の家賃</mark>を、月割で、次の期に繰り延べる。受け取った日と、決算日の、それぞれの仕訳を行いなさい。',
    e:[{d:[['現金',12]],c:[['受取家賃',12]]},{d:[['受取家賃',8]],c:[['前受収益',8]]}],
    exp:'受け取った12月1日の時点では、1年分12円を全額その期の収益（受取家賃）として記録します。しかし決算日の時点で、まだ貸していない翌期分（4月から11月までの8か月、12円×8／12＝8円）が含まれています。「お金は受け取ったが、その対価となるサービス（部屋を貸すこと）をまだ提供し終えていない」ため、今期の収益から取り除いて「前受収益」という負債に振り替え、翌期になってから改めて収益として認識し直します。'
  },
  { id:1191, calc:'', cat:'貸倒', chap:'決算整理',
    q:'X社は、前の期に、得意先が倒産して、その得意先に対する未回収の代金を、貸倒れとして処理した。ところが、当期になって、その得意先の財産が整理され、<mark class="q-revenue">前の期に貸倒れとして処理した代金のうち、8円が、回収できることになった</mark>。X社は、この8円を、<mark class="q-asset">現金で回収した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',8]],c:[['償却債権取立益',8]]}],
    exp:'「貸倒れ」とは、得意先の倒産などで、代金が、回収できなくなることです。前期にすでに「もう回収できない」と判断して損失処理していた債権が、思いがけず回収できた場合、あらためて「売掛金」として復活させるのではなく、「償却債権取立益」という特別な収益として処理します。「あきらめていたお金が、臨時収入として戻ってきた」というイメージです。'
  },
