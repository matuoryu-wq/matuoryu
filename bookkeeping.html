  // ===== 1級：退職給付会計 =====
  { id:769, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の年金資産の実際運用収益が期待運用収益を50,000円下回り、数理計算上の差異（不利差異）50,000円が発生した。連結財務諸表上、この差異を即時に「退職給付に係る調整累計額」として認識する仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X's actual return on plan assets fell short of the expected return by ¥50,000, generating an unfavorable actuarial difference of ¥50,000. On consolidation, record the entry immediately recognizing this difference in accumulated remeasurements of defined benefit plans, ignoring tax effects.",
    e:[{d:[['退職給付に係る調整累計額',50000]], c:[['退職給付引当金',50000]]}],
    exp:'個別財務諸表では、数理計算上の差異は発生時に全額を費用にはせず、「未認識数理計算上の差異」として翌期以降に少しずつ償却していきます。しかし連結財務諸表では、この未認識部分も含めて退職給付債務と年金資産の差額全額をそのままＢ／Ｓに計上するルールになっており、未認識だった差異はその期の包括利益（純資産の部「退職給付に係る調整累計額」）として即時に認識されます。これが「個別上は将来に繰延べ、連結上は即時認識」という、1級で頻出の重要な相違点です。'
  },
  { id:770, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は前期に発生した数理計算上の差異50,000円を、平均残存勤務期間10年にわたって定額法で費用処理している。当期の償却額（5,000円）を計上する仕訳を示しなさい（個別財務諸表上の処理）。',
    en_q:"Company X amortizes an actuarial difference of ¥50,000 that arose last period straight-line over an average remaining service period of 10 years. Record this period's amortization of ¥5,000 in the separate (unconsolidated) financial statements.",
    e:[{d:[['退職給付費用',5000]], c:[['退職給付引当金',5000]]}],
    exp:'個別財務諸表では、数理計算上の差異は発生時に全額を費用処理せず、平均残存勤務期間などの一定の年数にわたって規則的に償却していきます。50,000円÷10年＝5,000円を毎期の「退職給付費用」に追加していきます。段階的に費用化する点が、即時認識する連結上の処理と異なります。'
  },
  { id:771, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は退職金規程を改定し、退職給付水準を引き下げた。この結果、退職給付債務が400,000円減少した（過去勤務費用の発生、有利差異）。連結財務諸表上、この全額を即時に認識する仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X amended its retirement benefit plan, reducing benefit levels. This decreased the retirement benefit obligation by ¥400,000 (a favorable past service cost). On consolidation, record the entry immediately recognizing this full amount, ignoring tax effects.",
    e:[{d:[['退職給付引当金',400000]], c:[['退職給付に係る調整累計額',400000]]}],
    exp:'退職給付水準の「引き下げ」による過去勤務費用は、退職給付債務を減らす方向（会社にとって有利）に働きます。連結財務諸表上は、この有利差異も即時にＢ／Ｓへ反映するため、「退職給付引当金」（負債）を減額し、相手科目として純資産の部の「退職給付に係る調整累計額」を増額します。'
  },
  { id:772, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は確定給付企業年金制度に基づき、年金資産に掛金150,000円を現金で拠出した。仕訳を示しなさい。',
    en_q:'Under its defined benefit pension plan, Company X contributed ¥150,000 cash to plan assets. Record the entry.',
    e:[{d:[['退職給付引当金',150000]], c:[['現金',150000]]}],
    exp:'会社が年金基金に掛金を拠出すると、その分だけ会社の負担（退職給付債務と年金資産の差額＝退職給付引当金）が減少します。「将来払うはずだったお金を、先に年金基金へ払い込んだ」というイメージで、退職給付引当金（負債）を直接減額します。'
  },
  { id:773, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'当期の退職給付費用を計算する。勤務費用120,000円・利息費用40,000円・期待運用収益15,000円・数理計算上の差異の費用処理額8,000円（費用側）・過去勤務費用の費用処理額△3,000円（利益側）。退職給付費用を計上する仕訳を示しなさい。',
    en_q:'Compute this period\'s retirement benefit expense: service cost ¥120,000, interest cost ¥40,000, expected return on plan assets ¥15,000, amortization of actuarial differences ¥8,000 (expense-increasing), amortization of past service cost -¥3,000 (expense-reducing). Record the entry recognizing the retirement benefit expense.',
    e:[{d:[['退職給付費用',150000]], c:[['退職給付引当金',150000]]}],
    exp:'個別財務諸表上の退職給付費用は、①勤務費用（当期労働により新たに発生した給付義務）＋②利息費用（割引計算により時の経過で増える現在価値相当額）－③期待運用収益（年金資産の運用で得られるはずの収益）＋④数理計算上の差異の費用処理額（過去に繰延べた差異のうち当期償却分）＋⑤過去勤務費用の費用処理額、の合計で計算します。120,000＋40,000－15,000＋8,000－3,000＝150,000円。過去勤務費用の償却額がマイナス（△3,000円）になっているのは、退職給付水準の引き下げ（会社に有利な改定）による過去勤務費用を償却しているためです。'
  },
  { id:774, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'連結財務諸表において、当期に数理計算上の差異の費用処理額（組替調整額）12,000円を、退職給付費用として計上するとともに、その他の包括利益（退職給付に係る調整累計額）から同額を減額する。仕訳を示しなさい。',
    en_q:"On consolidation, record the entry recognizing ¥12,000 of amortized actuarial differences (a reclassification adjustment) as retirement benefit expense, while reducing accumulated remeasurements of defined benefit plans by the same amount.",
    e:[{d:[['退職給付費用',12000]], c:[['退職給付に係る調整累計額',12000]]}],
    exp:'連結財務諸表では、数理計算上の差異は発生した期に全額を「退職給付に係る調整累計額」（純資産）として即時認識済みです（別問参照）。翌期以降、この差異の一部を個別財務諸表と同じように償却して「退職給付費用」として当期純利益に計上する際は、二重計上を防ぐため、同額を「退職給付に係る調整累計額」から取り崩します（これを「組替調整額」と呼びます）。退職給付債務・年金資産の総額（＝退職給付引当金）自体は変動しません。'
  },
  { id:775, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の年金資産の実際運用収益が期待運用収益を100,000円下回り、数理計算上の差異（不利差異）100,000円が発生した。連結財務諸表上、実効税率30％として税効果を考慮したうえで、この差異を「退職給付に係る調整累計額」として計上する仕訳を示しなさい。',
    en_q:"Company X's actual return on plan assets fell short of the expected return by ¥100,000, generating an unfavorable actuarial difference of ¥100,000. On consolidation, applying tax-effect accounting at an effective tax rate of 30%, record the entry recognizing this difference in accumulated remeasurements of defined benefit plans.",
    e:[{d:[['退職給付に係る調整累計額',70000],['繰延税金資産',30000]], c:[['退職給付引当金',100000]]}],
    exp:'連結財務諸表で即時認識する退職給付に係る差異にも、税効果会計を適用します。将来の費用計上（損金算入）につながる不利差異なので、税金負担を軽減する効果（繰延税金資産）30,000円（100,000×30％）を認識し、残り70,000円を税引後の金額として純資産の部「退職給付に係る調整累計額」に計上します。退職給付引当金（負債）は税効果を挟まず全額100,000円増加させます。'
  },
  { id:776, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は前期に発生した過去勤務費用（退職給付水準の引き上げによるもの）240,000円を、平均残存勤務期間8年にわたって定額法で費用処理している。当期の償却額を計上する仕訳を示しなさい（個別財務諸表上の処理）。',
    en_q:"Company X amortizes past service cost of ¥240,000 (from a benefit-level increase) that arose last period straight-line over an average remaining service period of 8 years. Record this period's amortization in the separate financial statements.",
    e:[{d:[['退職給付費用',30000]], c:[['退職給付引当金',30000]]}],
    exp:'過去勤務費用（退職金規程の改定などにより生じる退職給付債務の変動額）も、数理計算上の差異と同様に、個別財務諸表では発生時に全額を費用処理せず、平均残存勤務期間等の一定の年数で規則的に償却します。240,000円÷8年＝30,000円を当期の「退職給付費用」に追加します。'
  },
  { id:819, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の年金資産の実際運用収益が期待運用収益を60,000円上回り、数理計算上の差異（有利差異）60,000円が発生した。連結財務諸表上、この差異を即時に「退職給付に係る調整累計額」として認識する仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X's actual return on plan assets exceeded the expected return by ¥60,000, generating a favorable actuarial difference of ¥60,000. On consolidation, record the entry immediately recognizing this difference in accumulated remeasurements of defined benefit plans, ignoring tax effects.",
    e:[{d:[['退職給付引当金',60000]], c:[['退職給付に係る調整累計額',60000]]}],
    exp:'運用が予想以上にうまくいった場合（実際運用収益＞期待運用収益）は、有利差異として、退職給付債務と年金資産の差額（＝会社の負担）を減らす方向に働きます。連結財務諸表上は即時に認識するため、「退職給付引当金」（負債）を減額し、相手科目として純資産の部「退職給付に係る調整累計額」を増額します。不利差異のケース（別問参照）とは、借方・貸方が逆になる点を確認しましょう。'
  },
  { id:820, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は退職金規程を改定し、退職給付水準を引き上げた。この結果、退職給付債務が350,000円増加した（過去勤務費用の発生、不利差異）。連結財務諸表上、この全額を即時に認識する仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X amended its retirement benefit plan, raising benefit levels. This increased the retirement benefit obligation by ¥350,000 (an unfavorable past service cost). On consolidation, record the entry immediately recognizing this full amount, ignoring tax effects.',
    e:[{d:[['退職給付に係る調整累計額',350000]], c:[['退職給付引当金',350000]]}],
    exp:'退職給付水準の「引き上げ」による過去勤務費用は、退職給付債務を増やす方向（会社にとって不利）に働きます。連結財務諸表上は即時にＢ／Ｓへ反映するため、「退職給付引当金」（負債）を増額し、相手科目として純資産の部の「退職給付に係る調整累計額」を減額します。水準を引き下げた場合（別問参照）とは正反対の方向に動きます。'
  },
  { id:821, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の期首退職給付債務は3,000,000円であった。当期の勤務費用150,000円・利息費用60,000円が発生した場合の、退職給付債務の増加を認識する仕訳を示しなさい（退職給付引当金の増加として処理する）。',
    en_q:"Company X's opening retirement benefit obligation was ¥3,000,000. This period, service cost of ¥150,000 and interest cost of ¥60,000 arose. Record the entry recognizing the increase in the retirement benefit obligation.",
    e:[{d:[['退職給付費用',210000]], c:[['退職給付引当金',210000]]}],
    exp:'退職給付債務は、期首残高に「勤務費用」（当期の労働により新たに発生した義務）と「利息費用」（割引計算により時の経過で増える現在価値相当額）を加えて増加していきます。150,000円＋60,000円＝210,000円が当期の増加分です。これは個別財務諸表上、「退職給付費用」（費用）と「退職給付引当金」（負債）の両方を増やす仕訳として処理されます。'
  },
  { id:822, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の年金資産について、期首残高2,000,000円に対し、期待運用収益40,000円が発生した。年金資産の増加（退職給付引当金の減少）を認識する仕訳を示しなさい。',
    en_q:"Company X's plan assets had an opening balance of ¥2,000,000, and expected return on plan assets of ¥40,000 arose. Record the entry recognizing the increase in plan assets (a decrease in the retirement benefit obligation).",
    e:[{d:[['退職給付引当金',40000]], c:[['退職給付費用',40000]]}],
    exp:'年金資産は、外部の年金基金で運用されている資産で、増えるほど会社の正味の負担（退職給付債務－年金資産＝退職給付引当金）が減ります。期待運用収益（予定利率などから見積もった運用による増加分）40,000円が生じた分だけ、退職給付引当金を減額し、退職給付費用も同額減額します（退職給付費用の計算式で期待運用収益がマイナス項目だったことを思い出しましょう）。'
  },
  { id:823, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は確定拠出年金制度を採用しており、当期の掛金80,000円を現金で外部の年金基金に拠出した。仕訳を示しなさい。',
    en_q:'Company X uses a defined contribution pension plan and contributed ¥80,000 cash to an external pension fund this period. Record the entry.',
    e:[{d:[['退職給付費用',80000]], c:[['現金',80000]]}],
    exp:'確定拠出年金制度（DC）は、会社が一定額の掛金を外部に拠出すれば、それ以降の運用リスクを会社が負わない制度です（確定給付制度ＤＢとは異なり、将来の給付額を会社が保証しません）。そのため、複雑な退職給付債務の計算は不要で、単純に「掛金を拠出した時点」で費用（退職給付費用）として処理して完了します。ＤＢ制度のように「退職給付引当金」という負債は計上しません。'
  },
  { id:824, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は確定給付企業年金制度（ＤＢ）の一部を確定拠出年金制度（ＤＣ）に移行した。移行により消滅した退職給付債務は600,000円、移換した年金資産は550,000円であった。この移行にともなう損益を計上する仕訳を示しなさい。',
    en_q:'Company X converted part of its defined benefit (DB) pension plan to a defined contribution (DC) plan. The obligation extinguished was ¥600,000, and the plan assets transferred were ¥550,000. Record the entry recognizing the gain from this conversion.',
    e:[{d:[['退職給付引当金',50000]], c:[['退職給付制度終了益',50000]]}],
    exp:'ＤＢ制度からＤＣ制度へ制度の一部を移行すると、その部分についてはもはや会社が将来の運用リスクを負わなくなるため、「退職給付制度の終了」として処理します。消滅する退職給付債務600,000円と、移換する年金資産550,000円の差額（＝会社の正味負担の減少額）50,000円を、退職給付引当金の取崩しと「退職給付制度終了益」（特別利益）として計上します。ＤＢの一部がＤＣに置き換わることで、会社の将来負担が軽くなったことを表しています。'
  },
  { id:825, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は、前期に発生した数理計算上の差異80,000円（平均残存勤務期間8年で償却中、当期はその2年目にあたる）に加え、当期新たに数理計算上の差異90,000円（平均残存勤務期間9年）が発生した。当期の償却額の合計（前期発生分の2年目償却＋当期発生分の1年目償却）を計上する仕訳を示しなさい。',
    en_q:"Company X is amortizing an actuarial difference of ¥80,000 that arose last period (over an 8-year average remaining service period; this is year 2 of that amortization), and this period a new actuarial difference of ¥90,000 arose (9-year average remaining service period). Record the entry recognizing the combined amortization (year 2 of the prior difference plus year 1 of the new one).",
    e:[{d:[['退職給付費用',20000]], c:[['退職給付引当金',20000]]}],
    exp:'実務では、数理計算上の差異は毎期のように発生するため、複数の年度に発生した差異が同時に償却されていきます。前期発生分（80,000円÷8年＝10,000円、2年目の償却）と、当期新たに発生した分（90,000円÷9年＝10,000円、1年目の償却）を合算して、当期の退職給付費用に加えます：10,000円＋10,000円＝20,000円。「発生年度の異なる複数の差異を、それぞれ独立して償却し、合算する」という実務上の処理方法を確認する問題です。'
  },
  { id:826, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'連結財務諸表において、当期に過去勤務費用の費用処理額（組替調整額）18,000円を、退職給付費用として計上するとともに、その他の包括利益（退職給付に係る調整累計額）から同額を減額する。仕訳を示しなさい。',
    en_q:"On consolidation, record the entry recognizing ¥18,000 of amortized past service cost (a reclassification adjustment) as retirement benefit expense, while reducing accumulated remeasurements of defined benefit plans by the same amount.",
    e:[{d:[['退職給付費用',18000]], c:[['退職給付に係る調整累計額',18000]]}],
    exp:'数理計算上の差異と同じように、過去勤務費用についても、連結財務諸表では発生時に即時認識した後、個別財務諸表と同じペースで償却した分を「組替調整額」として退職給付費用に計上し、同額を「退職給付に係る調整累計額」から取り崩します。二重計上を防ぐための処理で、退職給付債務・年金資産の総額（退職給付引当金）自体はこの仕訳では変動しません。'
  },
  { id:827, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は退職金規程を改定し、退職給付水準を引き上げた。この結果、退職給付債務が200,000円増加した（過去勤務費用の発生、不利差異）。連結財務諸表上、実効税率30％として税効果を考慮したうえで、この差異を認識する仕訳を示しなさい。',
    en_q:'Company X amended its retirement benefit plan, raising benefit levels. This increased the retirement benefit obligation by ¥200,000 (an unfavorable past service cost). On consolidation, applying tax-effect accounting at an effective tax rate of 30%, record the entry recognizing this difference.',
    e:[{d:[['退職給付に係る調整累計額',140000],['繰延税金資産',60000]], c:[['退職給付引当金',200000]]}],
    exp:'過去勤務費用の即時認識にも税効果会計を適用します。将来の費用計上（損金算入）につながる不利差異なので、税金負担を軽減する効果（繰延税金資産）60,000円（200,000×30％）を認識し、残り140,000円を税引後の金額として「退職給付に係る調整累計額」に計上します。退職給付引当金（負債）は税効果を挟まず全額200,000円増加させます。'
  },
  { id:828, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は早期退職優遇制度を実施し、対象者の退職により退職給付債務が270,000円減少した。対応する年金資産の減少額は230,000円であった。制度の一部終了にともなう損益を計上する仕訳を示しなさい。',
    en_q:"Company X implemented an early retirement incentive program. The resulting retirements reduced the retirement benefit obligation by ¥270,000, with a corresponding ¥230,000 decrease in plan assets. Record the entry recognizing the gain from this partial plan settlement.",
    e:[{d:[['退職給付引当金',40000]], c:[['退職給付制度終了益',40000]]}],
    exp:'早期退職優遇制度などにより、対象となる従業員が一斉に退職すると、それに対応する退職給付債務と年金資産がまとめて消滅します（「退職給付制度の一部終了」と呼びます）。消滅する退職給付債務270,000円の方が、対応する年金資産の減少額230,000円よりも大きいため、差額40,000円は会社の負担が軽くなったことを意味し、「退職給付制度終了益」として利益計上します。'
  },
  { id:829, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は業界団体が運営する複数事業主制度の企業年金に加入しており、自社の拠出に対応する年金資産・年金負債を合理的に区分計算することができない。当期の掛金拠出額120,000円を現金で支払った場合の仕訳を示しなさい（確定拠出制度に準じて処理する）。',
    en_q:"Company X participates in a multiemployer pension plan operated by an industry association, and cannot reasonably determine its share of plan assets and obligations. Record the entry for this period's cash contribution of ¥120,000, accounted for as if it were a defined contribution plan.",
    e:[{d:[['退職給付費用',120000]], c:[['現金',120000]]}],
    exp:'複数の企業が共同で加入する年金制度（複数事業主制度）で、自社が負担すべき年金資産・年金負債の金額を合理的に計算できない場合は、通常のＤＢ制度のように複雑な数理計算を行わず、確定拠出制度と同様に、拠出した掛金の額をそのまま「退職給付費用」として処理することが認められています。「計算できないものは、シンプルに掛金＝費用として扱う」という実務上の簡便的な取り扱いです。'
  },
  { id:830, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'従業員数が少ない中小企業であるＸ社は、退職給付会計に「簡便法」を採用している。期末自己都合要支給額（従業員が全員自己都合で退職した場合に支払うべき額）が期首より50,000円増加した。この増加額を退職給付費用として計上する仕訳を示しなさい。',
    en_q:'Company X, a small business with few employees, uses the simplified method for retirement benefit accounting. The year-end voluntary-resignation benefit obligation (the amount payable if all employees resigned voluntarily) increased by ¥50,000 from the beginning of the year. Record the entry recognizing this increase as retirement benefit expense.',
    e:[{d:[['退職給付費用',50000]], c:[['退職給付引当金',50000]]}],
    exp:'従業員数の少ない小規模な企業では、数理計算上の差異や利息費用・期待運用収益を細かく計算する原則法の代わりに、「簡便法」を採用することが認められています。簡便法では、期末時点で従業員全員が自己都合退職した場合に支払うべき金額（期末自己都合要支給額）を退職給付債務とみなし、その期中の増加額をそのまま退職給付費用として計上します。複雑な数理計算をせずに済む、実務的な近似計算です。'
  },

  // ===== 1級：減損会計（応用） =====
  { id:777, level:3, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は建物（帳簿価額800,000円）と機械装置（帳簿価額400,000円）を一体として使用しているため、これらをひとつの資産グループとして減損会計を適用している。資産グループ全体の回収可能価額は900,000円と算定され、減損損失の認識が必要と判定された。減損損失300,000円を帳簿価額の比率で建物・機械装置に配分する仕訳を示しなさい。',
    en_q:'Company X treats a building (book value ¥800,000) and machinery (book value ¥400,000) as a single asset group because they are used together. The group\'s recoverable amount was determined to be ¥900,000, requiring recognition of an impairment loss. Record the entry allocating the ¥300,000 impairment loss to the building and machinery in proportion to their book values.',
    e:[{d:[['減損損失',300000]], c:[['建物',200000],['機械装置',100000]]}],
    exp:'複数の資産が一体となってキャッシュ・フローを生み出している場合、個々の資産ごとではなく「資産グループ」全体で減損会計を適用します。グループ全体の帳簿価額1,200,000円（800,000＋400,000）－回収可能価額900,000円＝減損損失300,000円。この総額を、個々の資産の帳簿価額の比率で配分します。建物：300,000×(800,000／1,200,000)＝200,000円、機械装置：300,000×(400,000／1,200,000)＝100,000円。「グループ全体でいくら損したか」を先に計算し、それを構成資産に振り分ける、という2段階の処理がポイントです。'
  },
  { id:778, level:3, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が買収した事業（資産グループ帳簿価額900,000円［内訳：建物600,000円・備品300,000円］、のれん帳簿価額300,000円、合計1,200,000円）について、のれんを含む、より大きな単位で減損損失600,000円を認識した。減損損失は原則としてのれんに優先的に配分するというルールに従い、まずのれんの帳簿価額300,000円全額を減損し、残額300,000円を資産グループの各資産の帳簿価額比で配分する場合の仕訳を示しなさい。',
    en_q:'On testing a larger unit that includes goodwill (goodwill book value ¥300,000; asset group book value ¥900,000, consisting of a building at ¥600,000 and equipment at ¥300,000; total ¥1,200,000), an impairment loss of ¥600,000 was recognized. Per the rule that impairment losses are first allocated to goodwill, the entire ¥300,000 goodwill balance is written off first, and the remaining ¥300,000 is allocated to the asset group\'s assets by book value. Record the entry.',
    e:[{d:[['減損損失',600000]], c:[['のれん',300000],['建物',200000],['備品',100000]]}],
    exp:'「のれんを含む、より大きな単位」で減損テストを行った結果、減損損失が生じた場合、原則としてまず「のれん」の帳簿価額を優先的に減損します（のれんは単独では収益を生まない資産なので、最初に切り捨てる扱いです）。のれん300,000円を全額減損した後、なお残る損失300,000円を、資産グループを構成する各資産（建物・備品）の帳簿価額比率で配分します。建物：300,000×(600,000／900,000)＝200,000円、備品：300,000×(300,000／900,000)＝100,000円。'
  },
  { id:779, level:3, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社の本社建物（共用資産、帳簿価額500,000円）を含めて、より大きな単位で減損テストを行った。この単位には資産グループＡ（機械装置、帳簿価額800,000円）と資産グループＢ（備品、帳簿価額700,000円）も含まれ、合計帳簿価額は2,000,000円である。より大きな単位全体の回収可能価額が1,500,000円と算定され、減損損失500,000円を認識した。この損失を帳簿価額の比率で機械装置・備品・建物（共用資産）に配分する仕訳を示しなさい。',
    en_q:"Company X tested a larger unit that includes its headquarters building (a shared asset, book value ¥500,000), together with asset group A (machinery, ¥800,000) and asset group B (equipment, ¥700,000) — total book value ¥2,000,000. The unit's recoverable amount was ¥1,500,000, recognizing an impairment loss of ¥500,000. Record the entry allocating this loss to machinery, equipment, and the building (shared asset) by book value.",
    e:[{d:[['減損損失',500000]], c:[['機械装置',200000],['備品',175000],['建物',125000]]}],
    exp:'本社建物のように、複数の資産グループに共通して使われ、単独ではキャッシュ・フローを生み出さない資産を「共用資産」と呼びます。共用資産の減損は、共用資産を含む「より大きな単位」全体で判定し、生じた減損損失を各構成資産（資産グループＡ・Ｂ・共用資産）の帳簿価額の比率で配分します。機械装置：500,000×(800,000／2,000,000)＝200,000円、備品：500,000×(700,000／2,000,000)＝175,000円、建物：500,000×(500,000／2,000,000)＝125,000円。「個別の資産グループでは減損の兆候がなくても、共用資産を含めた全体で見ると回収できない」というケースを扱う、1級特有の論点です。'
  },
  { id:780, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が保有する使用を休止している土地（遊休資産、帳簿価額1,000,000円）について、正味売却価額が700,000円であることが判明した。遊休資産は使用価値を見積れないため、正味売却価額を回収可能価額として減損損失を計上する。仕訳を示しなさい。',
    en_q:'Company X owns idle land (book value ¥1,000,000) that is not in use, and determined its net realizable value to be ¥700,000. Since value in use cannot be estimated for idle assets, the recoverable amount is based solely on net realizable value. Record the impairment loss entry.',
    e:[{d:[['減損損失',300000]], c:[['土地',300000]]}],
    exp:'稼働を停止している「遊休資産」は、将来キャッシュ・フローを生み出さない（使用価値を見積れない）ため、回収可能価額は正味売却価額（今売ったらいくらか）だけで判定します。帳簿価額1,000,000円－正味売却価額700,000円＝減損損失300,000円。通常の固定資産のように「使用価値と正味売却価額のいずれか高い方」を比較する必要がなく、シンプルに売却価値だけで判定する点が特徴です。'
  },
  { id:781, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は前期末に機械装置（取得原価1,000,000円、減損損失前の帳簿価額600,000円）について減損損失200,000円を計上した（減損後帳簿価額400,000円、残存耐用年数4年、残存価額ゼロ、定額法）。当期の減価償却費を計上する仕訳を示しなさい。',
    en_q:'At the end of last period, Company X recognized a ¥200,000 impairment loss on machinery (acquisition cost ¥1,000,000; pre-impairment book value ¥600,000), leaving a post-impairment book value of ¥400,000, with 4 years of remaining useful life and zero residual value, depreciated straight-line. Record this period\'s depreciation entry.',
    e:[{d:[['減価償却費',100000]], c:[['減価償却累計額',100000]]}],
    exp:'減損損失を計上した後の資産は、減損後の帳簿価額（取得原価ではなく）を新たな基礎として、残存耐用年数にわたって減価償却を続けます（切放し法）。減損後帳簿価額400,000円÷残存耐用年数4年＝100,000円。減損は「その時点での評価減」であり、その後は通常どおり規則的に費用配分（減価償却）を続けていく、という考え方です。なお日本基準では、減損後に業績が回復しても減損損失の戻し入れは行いません（IFRSとの大きな違いの一つです）。'
  },

  // ===== 1級：リース会計（応用） =====
  { id:782, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は保有する機械装置（帳簿価額800,000円）をリース会社に1,000,000円で売却し、現金を受け取った。同時にこの機械装置をファイナンス・リースとしてリースバックする契約を締結した。セール・アンド・リースバック取引に該当するため、売却益は繰延べ処理する。売却時の仕訳を示しなさい。',
    en_q:'Company X sold machinery (book value ¥800,000) to a leasing company for ¥1,000,000 cash, and simultaneously leased it back under a finance lease. Because this qualifies as a sale-and-leaseback transaction, the sale gain is deferred. Record the entry at the time of sale.',
    e:[{d:[['現金',1000000]], c:[['機械装置',800000],['長期前受収益',200000]]}],
    exp:'セール・アンド・リースバックとは、自社が保有する資産をいったんリース会社に売却し、その資産を改めてリースで借り受ける（リースバックする）取引です。リースバックがファイナンス・リースに該当する場合、実質的には「その資産を担保にお金を借りた」のと変わらないとみなされ、売却益を通常の固定資産売却益のようにその場で計上せず、いったん「長期前受収益」（負債）として繰延べます。現金1,000,000円－機械装置の帳簿価額800,000円＝売却益相当額200,000円を長期前受収益として計上します。'
  },
  { id:783, level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'上記のリースバック契約について、リース資産・リース債務を売却価額1,000,000円で計上する仕訳を示しなさい（利子込み法）。',
    en_q:'For the leaseback above, record the entry recognizing the leased asset and lease liability at the ¥1,000,000 sale price (interest-included method).',
    e:[{d:[['リース資産',1000000]], c:[['リース債務',1000000]]}],
    exp:'リースバックの開始時は、通常のファイナンス・リースと同様に「リース資産／リース債務」を計上します。セール・アンド・リースバックでは、この金額は売却価額（＝リース物件の見積現金購入価額とみなす）を用いるのが一般的です。'
  },
  { id:784, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'上記のリース資産（計上額1,000,000円、リース期間5年、残存価額ゼロ、定額法）について、1年分の減価償却費を計上するとともに、繰延べた長期前受収益200,000円を同じ耐用年数にわたって取り崩し、減価償却費から控除する。1年分の仕訳を示しなさい。',
    en_q:'For the leased asset above (¥1,000,000, 5-year lease term, zero residual value, straight-line), record one year of depreciation, and also amortize the ¥200,000 deferred gain over the same term, offsetting it against depreciation expense.',
    e:[{d:[['減価償却費',200000]], c:[['リース資産減価償却累計額',200000]]}, {d:[['長期前受収益',40000]], c:[['減価償却費',40000]]}],
    exp:'繰延べた売却益（長期前受収益）は、リース資産の減価償却費の計上に対応させて、同じ期間・比率で取り崩し、減価償却費と相殺します。減価償却費：1,000,000÷5年＝200,000円。長期前受収益の取崩額：200,000÷5年＝40,000円。結果として、損益計算書に表示される正味の減価償却費は200,000－40,000＝160,000円となります。「売却益を一気に利益にせず、資産を使う期間にわたって少しずつ、費用を軽減する形で認識していく」というのがセール・アンド・リースバックの本質です。'
  },
  { id:785, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転ファイナンス・リース（リース資産計上額1,200,000円、リース物件の経済的耐用年数8年、リース期間5年）を契約した。所有権移転ファイナンス・リースの場合、自己所有の固定資産と同様に経済的耐用年数で減価償却する。1年分の減価償却費を計上する仕訳を示しなさい（定額法・残存価額ゼロ）。',
    en_q:'Company X entered an ownership-transfer finance lease (leased asset ¥1,200,000; economic useful life of the property 8 years; lease term 5 years). Under an ownership-transfer finance lease, depreciation follows the economic useful life, as for owned fixed assets. Record one year of straight-line depreciation with zero residual value.',
    e:[{d:[['減価償却費',150000]], c:[['リース資産減価償却累計額',150000]]}],
    exp:'リース取引には「所有権移転ファイナンス・リース」（リース期間終了後に所有権が借手に移る）と「所有権移転外ファイナンス・リース」（リース期間終了後に返却する）の2種類があります。所有権移転ファイナンス・リースは、実質的に資産を買ったのと同じなので、自己所有の固定資産と同様に「経済的耐用年数」（8年）で減価償却します。1,200,000円÷8年＝150,000円。これに対し、所有権移転外ファイナンス・リースは返却が前提のため「リース期間」（5年など、通常は経済的耐用年数より短い）を耐用年数として償却します。この違いを区別できるかが1級で問われるポイントです。'
  },
  { id:786, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'ファイナンス・リース取引（利子抜き法、リース債務当初計上額1,000,000円、リース期間5年、年間リース料240,000円、利率年4%）について、1年目の利息は40,000円（1,000,000×4%）であった。2年目の利息費用を利息法で計算し、2年目のリース料支払いの仕訳を示しなさい。',
    en_q:'For a finance lease (interest-excluded method, initial lease liability ¥1,000,000, 5-year term, annual lease payment ¥240,000, interest rate 4% per year), first-year interest was ¥40,000 (¥1,000,000 × 4%). Using the effective interest method, compute the second year\'s interest expense and record the second year\'s lease payment entry.',
    e:[{d:[['リース債務',208000],['支払利息',32000]], c:[['現金',240000]]}],
    exp:'利子抜き法では、リース料の支払いを「元本返済」と「利息」に分けますが、利息法では毎期の期首リース債務残高に利率を掛けて利息を計算します（元本が減るにつれ、利息も減っていきます）。1年目：利息40,000円（1,000,000×4%）、元本返済200,000円→期末残高800,000円。2年目：利息32,000円（800,000×4%）、元本返済208,000円（240,000－32,000）。単純に毎年同額の利息を計上する「定額法」とは異なり、実際の借入金の返済と同じ考え方で利息が逓減していく点が特徴です。'
  },
  { id:831, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は建物（帳簿価額600,000円）と備品（帳簿価額300,000円）から成る資産グループについて、回収可能価額750,000円と算定され、減損損失150,000円を認識した。この損失を帳簿価額の比率で建物・備品に配分する仕訳を示しなさい。',
    en_q:'For an asset group consisting of a building (book value ¥600,000) and equipment (book value ¥300,000), Company X determined a recoverable amount of ¥750,000, recognizing an impairment loss of ¥150,000. Record the entry allocating this loss to the building and equipment in proportion to book value.',
    e:[{d:[['減損損失',150000]], c:[['建物',100000],['備品',50000]]}],
    exp:'のれんを含まない資産グループの場合は、生じた減損損失をそのまま構成資産の帳簿価額の比率で配分します（のれんへの優先配分という手順がない、シンプルなケースです）。建物：150,000×(600,000／900,000)＝100,000円、備品：150,000×(300,000／900,000)＝50,000円。'
  },
  { id:832, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は前期に減損損失を計上した備品（減損後帳簿価額300,000円）を、当期に350,000円で現金売却した。売却時の仕訳を示しなさい。',
    en_q:'Company X sold equipment for ¥350,000 cash this period, on which an impairment loss had been recognized last period (post-impairment book value ¥300,000). Record the sale entry.',
    e:[{d:[['現金',350000]], c:[['備品',300000],['固定資産売却益',50000]]}],
    exp:'減損損失を計上した資産であっても、その後の売却処理は通常の固定資産売却と同じです。減損「後」の帳簿価額（300,000円、取得原価ではない点に注意）を基準に、売却額との差額を売却損益として計上します。日本基準では減損の戻し入れが禁止されているため、たとえ売却額が減損前の帳簿価額を上回っても、それは「売却益」として処理され、過去の減損損失が取り消されるわけではありません。'
  },
  { id:833, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が保有する機械装置（帳簿価額800,000円、資産除去債務の資産計上額を含む）について、回収可能価額が600,000円と算定され、減損損失を計上する。仕訳を示しなさい。',
    en_q:'Company X holds machinery (book value ¥800,000, including the asset-retirement-obligation capitalized amount) with a determined recoverable amount of ¥600,000. Record the impairment loss entry.',
    e:[{d:[['減損損失',200000]], c:[['機械装置',200000]]}],
    exp:'資産除去債務に対応する除去費用をあらかじめ資産計上している固定資産（帳簿価額に除去費用相当額が含まれている）も、通常の固定資産と同様に減損会計の対象になります。帳簿価額全体（除去費用の資産計上額を含む）と回収可能価額を比較し、差額を減損損失として計上します。「資産除去債務に対応する資産計上額も、他の取得原価部分とまとめて減損の判定対象になる」という点がポイントです。'
  },
  { id:834, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が保有する機械装置（帳簿価額1,000,000円）について、正味売却価額は600,000円、使用価値（将来キャッシュ・フローの割引現在価値）は650,000円と算定された。回収可能価額はいずれか高い方を採用し、減損損失を計上する仕訳を示しなさい。',
    en_q:"Company X's machinery (book value ¥1,000,000) had a net realizable value of ¥600,000 and a value in use (discounted present value of future cash flows) of ¥650,000. The recoverable amount is the higher of the two. Record the impairment loss entry.",
    e:[{d:[['減損損失',350000]], c:[['機械装置',350000]]}],
    exp:'回収可能価額は「正味売却価額」（今売ったらいくらか）と「使用価値」（今後使い続けることで得られる将来キャッシュ・フローの割引現在価値）のいずれか高い方を採用します。今回は使用価値650,000円の方が正味売却価額600,000円より高いため、回収可能価額は650,000円。帳簿価額1,000,000円－回収可能価額650,000円＝減損損失350,000円。「売った方が得か、使い続けた方が得か、高い方を選ぶ」というルールです。'
  },
  { id:835, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は前期に減損処理した遊休資産である土地（減損後帳簿価額700,000円）を、当期から事業用に転用することとした。転用時点の時価は900,000円であったが、日本基準では減損の戻し入れを行わないため帳簿価額は変更しない。転用時に「遊休資産」から「土地」（事業用）へ勘定科目を振り替える仕訳を示しなさい（金額は変動しない）。',
    en_q:'Company X is converting idle land (previously impaired, post-impairment book value ¥700,000) to operational use this period. The current fair value is ¥900,000, but since Japanese GAAP prohibits impairment reversal, the book value is not restored. Record the entry reclassifying the account from "idle assets" to "land" (operational use), with no change in amount.',
    e:[{d:[['土地',700000]], c:[['遊休資産',700000]]}],
    exp:'遊休資産を事業用に転用しても、日本基準では減損損失の戻し入れを行わないため、時価が回復していても帳簿価額はそのまま据え置かれます（700,000円のまま）。この仕訳は金額を変えずに勘定科目の表示区分だけを付け替えるものです。「一度計上した減損損失は、その後の状況好転があっても取り消さない」という日本基準の原則を、転用というイベントを通じて確認する問題です。'
  },
  { id:836, level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社はファイナンス・リース契約の開始にあたり、頭金（リース料の一部前払い）100,000円を現金で支払った。この頭金はリース資産の取得価額に含める処理をする場合の仕訳を示しなさい。',
    en_q:'At the inception of a finance lease, Company X paid a ¥100,000 cash down payment (a partial prepayment of lease payments). Record the entry treating this down payment as part of the leased asset\'s acquisition cost.',
    e:[{d:[['リース資産',100000]], c:[['現金',100000]]}],
    exp:'リース契約開始時に支払う頭金（リース料の一部前払い）は、通常の前払費用のように扱うのではなく、リース資産の取得価額の一部として資産計上します。「将来支払うはずだったリース料の一部を、先に前払いした」と考え、リース債務ではなく、リース資産そのものの取得原価に含めます。'
  },
  { id:837, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転ファイナンス・リース（リース資産計上額1,500,000円、経済的耐用年数6年、残存価額はリース資産計上額の10％）を契約した。1年分の減価償却費を計上する仕訳を示しなさい（定額法）。',
    en_q:'Company X entered an ownership-transfer finance lease (leased asset ¥1,500,000, economic useful life 6 years, residual value 10% of the leased asset amount). Record one year of straight-line depreciation.',
    e:[{d:[['減価償却費',225000]], c:[['リース資産減価償却累計額',225000]]}],
    exp:'所有権移転ファイナンス・リースは、契約終了後に所有権が借手に移るため、自己所有の固定資産と全く同じ方法で減価償却します。残存価額が設定されている場合は、取得価額から残存価額を差し引いた金額（要償却額）を耐用年数で割ります。残存価額：1,500,000×10％＝150,000円。要償却額：1,500,000－150,000＝1,350,000円。年間償却額：1,350,000÷6年＝225,000円。所有権移転外リース（原則残存価額ゼロ）とは異なり、残存価額の考慮が必要な点に注意しましょう。'
  },
  { id:838, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転外ファイナンス・リース（リース資産の取得原価1,000,000円、減価償却累計額800,000円）について、リース期間満了時に割安購入選択権を行使し、追加で50,000円を現金で支払って資産の所有権を取得した。リース資産を通常の固定資産である備品に振り替える仕訳を示しなさい。',
    en_q:'Company X exercised a bargain purchase option at the end of a non-ownership-transfer finance lease term (leased asset acquisition cost ¥1,000,000, accumulated depreciation ¥800,000), paying an additional ¥50,000 cash to acquire ownership. Record the entry reclassifying the leased asset into ordinary owned equipment.',
    e:[{d:[['備品',250000],['リース資産減価償却累計額',800000]], c:[['リース資産',1000000],['現金',50000]]}],
    exp:'所有権移転外ファイナンス・リースでも、契約に「割安購入選択権」（相場よりかなり安い価格でリース物件を買い取れる権利）が付いている場合、これを行使すると、その時点でリース資産としての性格が終わり、通常の自己所有の固定資産（備品）に切り替わります。リース資産の帳簿価額200,000円（取得原価1,000,000円－減価償却累計額800,000円）に、追加で支払った買取り代金50,000円を加えた250,000円が、新たな備品としての取得原価になります。'
  },
  { id:839, level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社はオペレーティング・リース契約（月額リース料50,000円のうち、10,000円は付随するメンテナンスサービス費用）を締結し、1ヶ月分を現金で支払った。リース料とメンテナンス費用を区分して処理する仕訳を示しなさい。',
    en_q:'Company X entered an operating lease (monthly payment ¥50,000, of which ¥10,000 is for bundled maintenance services) and paid one month\'s payment in cash. Record the entry separating the lease payment from the maintenance cost.',
    e:[{d:[['支払リース料',40000],['修繕費',10000]], c:[['現金',50000]]}],
    exp:'リース契約の中に、リース物件の借入とは別に、保守・メンテナンスサービスの提供が含まれている場合、契約書上の金額を「純粋なリース料」部分と「サービス費用」部分に区分して処理する必要があります。40,000円（リース料相当部分）は「支払リース料」、10,000円（メンテナンス部分）は「修繕費」として、それぞれ別の性質の費用として計上します。「リース料に何が含まれているか」を見極めることが実務上のポイントです。'
  },
  { id:840, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は保有する備品（帳簿価額500,000円）をリース会社に600,000円で売却し、現金を受け取った。同時にこの備品をオペレーティング・リースとしてリースバックする契約を締結した。オペレーティング・リースに該当する場合、売却損益は繰延べず、その場で認識する。売却時の仕訳を示しなさい。',
    en_q:'Company X sold equipment (book value ¥500,000) to a leasing company for ¥600,000 cash, and simultaneously leased it back under an operating lease. Because the leaseback is an operating lease, the sale gain is not deferred and is recognized immediately. Record the entry at the time of sale.',
    e:[{d:[['現金',600000]], c:[['備品',500000],['固定資産売却益',100000]]}],
    exp:'セール・アンド・リースバックでも、リースバック部分がファイナンス・リースではなく「オペレーティング・リース」（単なる賃貸借）に該当する場合は、ファイナンス・リースのケース（前の応用問題を参照）とは異なり、売却損益を繰延べる必要はなく、通常の固定資産売却と同じようにその場で損益を認識します。現金600,000円－帳簿価額500,000円＝売却益100,000円をそのまま計上します。「リースバックがファイナンスか、オペレーティングか」によって処理が正反対になる点が、この論点のハイライトです。'
  },

  // ===== 1級：会計方針の変更・誤謬の訂正 =====
  { id:787, level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は棚卸資産の評価方法を先入先出法から総平均法に変更した。この変更を過去の財務諸表に遡って適用した結果、過去の期首商品棚卸高が総平均法によればより低い金額であったことが判明し、利益剰余金期首残高を150,000円減額修正する必要が生じた（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its inventory valuation method from FIFO to the weighted-average method. Applying this change retrospectively revealed that opening inventory under the new method would have been ¥150,000 lower, requiring a ¥150,000 reduction to opening retained earnings, ignoring tax effects. Record the retrospective-application adjustment entry.',
    e:[{d:[['利益剰余金期首残高',150000]], c:[['繰越商品',150000]]}],
    exp:'「会計方針の変更」（棚卸資産の評価方法など）は、原則として新たな会計方針を過去の期間にも遡って適用したかのように会計処理します（遡及適用）。過去の損益はすでに確定しているため、当期の損益計算書を通さず、直接「利益剰余金期首残高」を修正します。変更後の方法（総平均法）で計算し直した結果、過去の商品棚卸高が150,000円少なかったことになるため、繰越商品（資産）を減額し、対応する分だけ利益剰余金期首残高を減額します。'
  },
  { id:788, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の決算において、経費80,000円の計上漏れ（未払費用の計上漏れ）があったことを当期に発見した。過去の誤謬の訂正として、修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had failed to accrue ¥80,000 of expenses (an omitted accrued liability) in last period\'s financial statements. Record the retrospective restatement entry correcting this prior-period error, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',80000]], c:[['未払費用',80000]]}],
    exp:'前期以前の財務諸表に誤り（誤謬）があったことが当期に判明した場合、その影響を当期の損益として計上するのではなく、「修正再表示」といって、あたかも誤りがなかったかのように過去の財務諸表を直接修正します。当期の損益計算書を通さず、直接「利益剰余金期首残高」を修正することで、過去の誤りを訂正します。未払費用（負債）の計上漏れだったため、利益剰余金期首残高を減額し、未払費用を追加計上します。'
  },
  { id:789, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に売上高を120,000円過大に計上していたことが当期に判明した（実際には売上が発生していなかった）。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had overstated sales revenue by ¥120,000 last period (the sale had not actually occurred). Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',120000]], c:[['売掛金',120000]]}],
    exp:'前期に本来計上すべきでなかった売上高（売掛金）が誤って計上されていたケースです。誤りを発見した当期の売上高を減額するのではなく、過去の誤りとして「利益剰余金期首残高」を直接減額し、過大計上されていた売掛金を取り消します。誤謬の訂正は、発生した年度ではなく発見した年度の当期純利益に影響を与えない、という点がポイントです。'
  },
  { id:790, level:3, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社が保有する機械装置（取得原価1,000,000円、これまで耐用年数10年・定額法で償却、期首時点の帳簿価額600,000円）について、今後の使用見込みを再検討した結果、残存耐用年数を当初の残り6年から3年に変更した。過去の年度は修正せず、変更後の残存耐用年数で当期の減価償却費を計上する仕訳を示しなさい（残存価額ゼロ・定額法）。',
    en_q:'Company X reassessed the useful life of its machinery (acquisition cost ¥1,000,000, previously depreciated straight-line over 10 years, opening book value ¥600,000) and revised the remaining useful life from 6 years to 3 years. Without restating prior periods, record this period\'s depreciation entry using the revised remaining life (zero residual value, straight-line).',
    e:[{d:[['減価償却費',200000]], c:[['減価償却累計額',200000]]}],
    exp:'「会計上の見積りの変更」（耐用年数の変更、引当金の見積り変更など）は、「会計方針の変更」とは異なり、過去に遡って財務諸表を修正しません（遡及処理をしません）。変更があった期以後の将来に向かって、新しい見積りに基づいて会計処理を行います（プロスペクティブ処理）。期首帳簿価額600,000円を、変更後の残存耐用年数3年で償却：600,000÷3年＝200,000円。「過去は正しかったが、これからの見積りを変えた」という整理なので、利益剰余金の修正は一切発生しない点が、会計方針の変更・誤謬の訂正との大きな違いです。'
  },
  { id:791, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に費用100,000円の計上漏れがあったことを当期に発見した。修正再表示にあたり、実効税率30％として税効果を考慮した仕訳を示しなさい。',
    en_q:'Company X discovered this period that it had failed to record ¥100,000 of expenses last period. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['利益剰余金期首残高',70000],['繰延税金資産',30000]], c:[['未払費用',100000]]}],
    exp:'修正再表示にも税効果会計を適用します。過去に計上漏れだった費用100,000円は、将来（税務上の扱いが確定した時点で）税金負担を軽減する効果を持つため、繰延税金資産30,000円（100,000×30％）を認識します。残り70,000円が税引後ベースでの利益剰余金期首残高の減額分です。誤謬の訂正であっても、通常の決算整理と同じように税効果会計のルールを適用する点を押さえておきましょう。'
  },
  { id:841, level:3, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は機械装置（取得原価1,000,000円、期首時点の帳簿価額600,000円、残存耐用年数5年）の減価償却方法を、定率法から定額法に変更した。この変更は「会計上の見積りの変更と区別することが困難な会計方針の変更」に該当するため、遡及適用せず、変更後の方法により当期の減価償却費を計上する仕訳を示しなさい（残存価額ゼロ・定額法）。',
    en_q:'Company X changed its depreciation method for machinery (acquisition cost ¥1,000,000, opening book value ¥600,000, 5 years remaining useful life) from the declining-balance method to straight-line. Because this qualifies as "a change in accounting policy that is difficult to distinguish from a change in accounting estimate," it is not applied retrospectively. Record this period\'s depreciation under the new method (zero residual value, straight-line).',
    e:[{d:[['減価償却費',120000]], c:[['減価償却累計額',120000]]}],
    exp:'減価償却方法の変更（定率法→定額法など）は、本来は「会計方針の変更」に見えますが、日本基準では「会計上の見積りの変更と区別することが困難な会計方針の変更」として特別に扱い、過去に遡って財務諸表を修正しません（遡及適用しません）。変更した期以後、新しい方法で将来に向かって計算するだけです。期首帳簿価額600,000円÷残存耐用年数5年＝120,000円。「会計方針の変更なのに、なぜか見積りの変更と同じ扱いになる」という、1級で頻出のひっかけポイントです。'
  },
  { id:842, level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は売買目的有価証券の評価方法を移動平均法から総平均法に変更した。過去の財務諸表に遡って適用した結果、過去の有価証券の帳簿価額が総平均法によればより高い金額であったことが判明し、利益剰余金期首残高を60,000円増額修正する必要が生じた（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its valuation method for trading securities from the moving-average method to the weighted-average method. Applying this retrospectively revealed that the securities\' book value under the new method would have been ¥60,000 higher, requiring a ¥60,000 increase to opening retained earnings, ignoring tax effects. Record the retrospective-application entry.',
    e:[{d:[['売買目的有価証券',60000]], c:[['利益剰余金期首残高',60000]]}],
    exp:'棚卸資産の評価方法と同様に、有価証券の評価方法（移動平均法・総平均法など）の変更も「会計方針の変更」に該当し、遡及適用が必要です。今回は変更後の方法（総平均法）によれば過去の有価証券の帳簿価額がより高かったことが判明したため、有価証券（資産）を増額し、対応する分だけ利益剰余金期首残高を増額します（前に学んだ棚卸資産のケースとは逆に、利益剰余金が増える方向の修正です）。'
  },
  { id:843, level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は棚卸資産の評価方法を総平均法から先入先出法に変更した。この変更を過去の財務諸表に遡って適用した結果、過去の期首商品棚卸高が先入先出法によればより高い金額であったことが判明し、利益剰余金期首残高を90,000円増額修正する必要が生じた（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its inventory valuation method from the weighted-average method to FIFO. Applying this retrospectively revealed that opening inventory under FIFO would have been ¥90,000 higher, requiring a ¥90,000 increase to opening retained earnings, ignoring tax effects. Record the retrospective-application entry.',
    e:[{d:[['繰越商品',90000]], c:[['利益剰余金期首残高',90000]]}],
    exp:'会計方針の変更による遡及適用は、必ずしも利益剰余金を減らす方向とは限りません。今回のように、変更後の方法（先入先出法）によれば過去の棚卸資産の評価額がより高かった場合は、逆に繰越商品（資産）を増額し、利益剰余金期首残高も増額修正します。「遡及適用は増える場合も減る場合もある」という点を、最初に学んだ問題（総平均法への変更で減額したケース）と対比して押さえておきましょう。'
  },
  { id:844, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の決算において、備品の減価償却費40,000円の計上を失念していたことを当期に発見した。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had forgotten to record ¥40,000 of depreciation on equipment last period. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',40000]], c:[['減価償却累計額',40000]]}],
    exp:'減価償却費の計上漏れも、過去の財務諸表の誤りです（誤謬）。当期の減価償却費として今さら計上するのではなく、過去の誤りとして「利益剰余金期首残高」を直接減額し、本来計上すべきだった減価償却累計額を追加します。「見つけた時点の費用にしない、過去に遡って直接純資産を修正する」という誤謬訂正の基本パターンをもう一度確認する問題です。'
  },
  { id:845, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に、本来は修繕費として費用処理すべきであった支出70,000円を、誤って建物の取得原価に含めて資産計上していたことを当期に発見した。修正再表示による仕訳を示しなさい（減価償却の影響は考慮しない、税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had mistakenly capitalized ¥70,000 of expenditure into the cost of a building last period, when it should have been expensed as repairs. Record the retrospective restatement entry (ignore the depreciation impact and tax effects).',
    e:[{d:[['利益剰余金期首残高',70000]], c:[['建物',70000]]}],
    exp:'本来は費用にすべき支出（収益的支出）を、誤って資産（建物などの資本的支出）に計上してしまうケースも誤謬に該当します。過大に計上されていた建物（資産）を減額し、対応する分だけ利益剰余金期首残高を減額して訂正します。「資産に計上しすぎていた」誤りも、収益・費用の計上誤りと同じように、利益剰余金期首残高を通じて修正する点は共通です。'
  },
  { id:846, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の貸倒引当金の設定にあたり、計算式の入力ミスにより、本来120,000円計上すべきところを80,000円しか計上していなかったことを当期に発見した。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that a calculation input error had caused it to record only ¥80,000 of allowance for doubtful accounts last period, when ¥120,000 was required. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',40000]], c:[['貸倒引当金',40000]]}],
    exp:'単純な計算ミスによって引当金が過少に計上されていた場合も誤謬に該当します（後で判明した新しい情報に基づく「見積りの変更」とは違い、当時すでに入手できていた情報の使い方を間違えた場合は誤謬です）。不足していた40,000円（120,000円－80,000円）を追加計上し、利益剰余金期首残高を減額します。'
  },
  { id:847, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の実地棚卸において、倉庫の一角にあった商品60,000円分を数え忘れており、期末商品棚卸高が過小に計上されていたことを当期に発見した。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that, during last period\'s physical inventory count, ¥60,000 of goods in a corner of the warehouse were overlooked, understating ending inventory. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['繰越商品',60000]], c:[['利益剰余金期首残高',60000]]}],
    exp:'実地棚卸の数え忘れのような、単純な事実誤認・集計ミスも誤謬に該当します。過小だった繰越商品（資産）を追加計上し、対応する分だけ利益剰余金期首残高を増額修正します。誤謬の内容によって利益剰余金が増えるか減るかは変わりますが、「発見した期の損益にせず、利益剰余金期首残高を直接修正する」という処理方法自体は常に共通です。'
  },
  { id:848, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の法人税等の計算において、税率の適用誤りにより、本来より30,000円少なく法人税等を計上していたことを当期に発見した。修正再表示による仕訳を示しなさい。',
    en_q:'Company X discovered this period that, due to an incorrect tax rate applied last period, income taxes were understated by ¥30,000. Record the retrospective restatement entry.',
    e:[{d:[['利益剰余金期首残高',30000]], c:[['未払法人税等',30000]]}],
    exp:'損益項目だけでなく、税金費用（法人税等）の計算誤りも誤謬の訂正の対象になります。過少に計上されていた未払法人税等（負債）を追加計上し、利益剰余金期首残高を減額します。「税金の計算を間違えていた」というのも、会計上は他の費用の計上漏れと同じ枠組みで訂正します。'
  },
  { id:849, level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は過去の貸倒実績率の見直しにより、当期末の貸倒引当金の設定率を売掛金残高の2％から3％に変更した。当期末売掛金残高2,000,000円に対する引当金の追加計上額（見積りの変更に伴う当期の影響分）を計上する仕訳を示しなさい（差額補充法、前期末引当金残高40,000円）。',
    en_q:"Company X revised its allowance rate for doubtful accounts from 2% to 3% of receivables, based on updated historical loss experience. Given a year-end receivables balance of ¥2,000,000 and a prior allowance balance of ¥40,000, record the entry recognizing the additional allowance required (using the incremental method).",
    e:[{d:[['貸倒引当金繰入',20000]], c:[['貸倒引当金',20000]]}],
    exp:'過去の貸倒実績（実際にどれくらい貸し倒れたか）が変化したことに基づいて引当金の設定率を見直すのは、新しい情報に基づく合理的な判断であり、「会計上の見積りの変更」に該当します。過去に遡って修正はせず、変更した当期以降の引当金の計算に、新しい設定率（3％）をそのまま反映させます。60,000円（2,000,000×3％）－40,000円（前期末残高）＝20,000円を当期に追加計上します。'
  },
  { id:850, level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社が計上している資産除去債務（帳簿価額500,000円）について、将来の除去費用の見積りが変更され、資産除去債務の金額を550,000円に修正する必要が生じた。見積りの変更による増加額を計上する仕訳を示しなさい（対応する資産の帳簿価額を増加させる）。',
    en_q:"Company X's recognized asset retirement obligation (book value ¥500,000) required revision to ¥550,000 due to a change in the estimated future removal cost. Record the entry recognizing the increase from this estimate change (increasing the corresponding asset's book value).",
    e:[{d:[['機械装置',50000]], c:[['資産除去債務',50000]]}],
    exp:'資産除去債務は「将来、その資産を撤去・処分するのにいくらかかるか」という見積りに基づいて計上します。物価上昇や技術動向の変化などにより、この見積り自体が変わることがあります。これも「会計上の見積りの変更」に該当し、過去に遡って修正せず、変更があった時点で差額（50,000円）を資産除去債務（負債）と対応する固定資産（資産）の両方に反映させます。増加した分の固定資産は、残存耐用年数にわたって今後の減価償却を通じて費用化されます。'
  },
  { id:851, level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は過去の保証実績データの見直しにより、製品保証引当金の設定率を売上高の1％から1.5％に変更した。当期売上高4,000,000円に対する引当金の追加計上額を計上する仕訳を示しなさい（差額補充法、前期末引当金残高40,000円）。',
    en_q:"Company X revised its product warranty provision rate from 1% to 1.5% of sales, based on updated warranty claim experience. Given sales of ¥4,000,000 and a prior provision balance of ¥40,000, record the entry recognizing the additional provision required.",
    e:[{d:[['商品保証引当金繰入',20000]], c:[['商品保証引当金',20000]]}],
    exp:'製品保証引当金の設定率の見直しも、貸倒引当金と同じ「会計上の見積りの変更」です。過去の実績データが更新されたことに基づく合理的な判断なので、遡及適用はせず、当期の引当金計算に新しい設定率（1.5％）をそのまま反映させます。60,000円（4,000,000×1.5％）－40,000円（前期末残高）＝20,000円を追加計上します。'
  },
  { id:852, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の退職給付費用の計算において、勤務費用の集計ミスにより、本来より50,000円少なく退職給付費用を計上していたことを当期に発見した。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X discovered this period that a clerical error in tallying service cost caused last period's retirement benefit expense to be understated by ¥50,000. Record the retrospective restatement entry, ignoring tax effects.",
    e:[{d:[['利益剰余金期首残高',50000]], c:[['退職給付引当金',50000]]}],
    exp:'退職給付会計のような複雑な見積りを伴う領域でも、「入手可能だった情報に基づく計算を単純に間違えた」場合は、見積りの変更ではなく誤謬に該当します。不足していた退職給付引当金50,000円を追加計上し、利益剰余金期首残高を減額して訂正します。「新しい情報で見積りが変わった」のか「当時の情報の使い方を間違えた」のかを区別することが、誤謬と見積りの変更を見分けるポイントです。'
  },
  { id:853, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に売上高（売掛金）を90,000円過大に計上していたことを当期に発見した。修正再表示にあたり、実効税率30％として税効果を考慮した仕訳を示しなさい。',
    en_q:'Company X discovered this period that it had overstated sales revenue (accounts receivable) by ¥90,000 last period. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['利益剰余金期首残高',63000],['繰延税金資産',27000]], c:[['売掛金',90000]]}],
    exp:'誤謬の訂正にも税効果会計を適用します。過大計上されていた売上高（売掛金）90,000円を取り消すと、将来的に税務上の調整を通じて税金負担が軽減される効果を持つため、繰延税金資産27,000円（90,000×30％）を認識します。残り63,000円が税引後ベースでの利益剰余金期首残高の減額分です。'
  },
  { id:854, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の実地棚卸において、商品50,000円分を数え忘れており、期末商品棚卸高が過小に計上されていたことを当期に発見した。修正再表示にあたり、実効税率30％として税効果を考慮した仕訳を示しなさい。',
    en_q:'Company X discovered this period that, during last period\'s physical inventory count, ¥50,000 of goods were overlooked, understating ending inventory. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['繰越商品',50000]], c:[['繰延税金負債',15000],['利益剰余金期首残高',35000]]}],
    exp:'資産の過小計上（棚卸資産の数え忘れなど）を修正すると、過去の利益がその分増えていたはずだったことになるため、将来的な税金負担が増える効果（将来加算一時差異）を持ち、繰延税金負債15,000円（50,000×30％）を認識します。残り35,000円が税引後ベースでの利益剰余金期首残高の増額分です。修正再表示のたびに、その内容が「将来減算」なのか「将来加算」なのかを見極めて、繰延税金資産・負債のどちらを計上するか判断する必要があります。'
  },

const IKOU_CATS = new Set(['工業簿記基礎','材料費','労務費','経費','個別原価計算','部門別原価計算','製造間接費','総合原価計算','標準原価計算','直接原価計算','工業簿記総まとめ']);
const SECS = {
  s3:  q => (q.level||3)===3,
  s2c: q => q.level===2 && !IKOU_CATS.has(q.cat),
  s2i: q => q.level===2 && IKOU_CATS.has(q.cat),
};

function getSectionQuestions(sec){
  if(!sec) return ALL;
  if(sec.startsWith('chap:')){
    const chap = sec.slice(5);
    return ALL.filter(q => q.chap === chap);
  }
  return SECS[sec] ? ALL.filter(SECS[sec]) : ALL;
}

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base.filter(q=>!checkOnly||checked[q.id]);
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}



function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  let html=styleParens(txt);
  const enq = q.en_q || JRNL_EN_Q[q.id];
  if(enq) html+=`<div class="q-en-trans">${enq}</div>`;
  return html;
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}</div>
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){
  const q=expQuestions[expQIdx];
  btn.style.display='none';
  const ro=document.getElementById('exp-ro-ans');
  ro.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa=q.exp?`<div class="exp-res-exp">${styleParens(q.exp.replace(/\n/g,'<br>'))}</div>`:'';
  const area=document.createElement('div');
  area.className='exp-fill-exp-area';
  area.innerHTML=expJa+checkBtn;
  ro.insertAdjacentElement('afterend',area);
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa = isLastEntry && q.exp ? `<div class="exp-res-exp">${styleParens(q.exp.replace(/\n/g,'<br>'))}</div>` : '';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${expJa}${checkBtn}${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${expJa}${checkBtn}${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  const res=document.getElementById('exp-res');
  if(res){ res.style.display='none'; res.innerHTML=''; }
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

// ===== スクロールモードここまで =====

function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  document.querySelectorAll('.grp-btn').forEach(btn=>{
    const bsec = btn.dataset.sec||btn.id.replace('sec-','');
    btn.classList.toggle('active', bsec === sec);
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}




function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? 'チェックのみ解除' : 'チェックのみ';
  buildDeck();
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='チェックのみ'; }
  setSection('chap:第1章：商品売買');
}



function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('chap:第1章：商品売買');
</script>
