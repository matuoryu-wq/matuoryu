// ===== StdCost-1 generator（材料費差異） =====
function genStdCost1(){
  const hyoujunTanka = compRandMult(10, 15, 40);
  const hyoujunPerUnit = compPick([2,3,4,5]);
  const seisanryou = compRandMult(100, 5, 20);
  const hyoujunShouhiryou = seisanryou*hyoujunPerUnit;
  const jissaiShouhiryou = hyoujunShouhiryou + compPick([-1,1])*compRandMult(10, 5, 30);
  const jissaiTanka = hyoujunTanka + compPick([-1,1])*compRandMult(1, 5, 25);
  if(jissaiShouhiryou<=0 || jissaiTanka<=0) return genStdCost1();
  const jissaiShouhigaku = jissaiShouhiryou*jissaiTanka;

  const hyoujunZairyouhi = hyoujunShouhiryou*hyoujunTanka;
  const kakakuSai = (hyoujunTanka-jissaiTanka)*jissaiShouhiryou;
  const suuryouSai = (hyoujunShouhiryou-jissaiShouhiryou)*hyoujunTanka;
  const souSai = hyoujunZairyouhi-jissaiShouhigaku;
  if(kakakuSai===0 || suuryouSai===0) return genStdCost1();

  return {
    title: '標準原価計算①：材料費差異（価格差異・数量差異）',
    scenario_html: `
      <div class="comp-table">
        <div class="comp-row" data-key="hyoujun-tanka"><span class="l">標準単価</span><span class="r">${yen(hyoujunTanka)}円／kg</span></div>
        <div class="comp-row" data-key="hyoujun-perunit"><span class="l">標準消費量</span><span class="r">製品1個につき${hyoujunPerUnit}kg</span></div>
        <div class="comp-row" data-key="seisanryou"><span class="l">当月実際生産量</span><span class="r">${yen(seisanryou)}個</span></div>
        <div class="comp-row" data-key="jissai-shouhiryou"><span class="l">当月実際材料消費量</span><span class="r">${yen(jissaiShouhiryou)}kg</span></div>
        <div class="comp-row" data-key="jissai-shouhigaku"><span class="l">当月実際材料消費額</span><span class="r">${yen(jissaiShouhigaku)}円</span></div>
      </div>
      <div class="comp-note">価格差異＝(標準単価－実際単価)×実際消費量、数量差異＝(標準消費量－実際消費量)×標準単価、で計算する。</div>`,
    steps: [
      { label:'標準消費量（標準消費量×実際生産量）はいくらか？', ans:hyoujunShouhiryou, unit:'kg', relKeys:['hyoujun-perunit','seisanryou'],
        choices:numChoices(hyoujunShouhiryou, [jissaiShouhiryou, seisanryou]),
        exp:`実際生産量${yen(seisanryou)}個に対し、製品1個あたり${hyoujunPerUnit}kg使う計画なので、${yen(seisanryou)}×${hyoujunPerUnit}＝<strong>${yen(hyoujunShouhiryou)}kg</strong>。` },
      { label:'実際単価はいくらか？', ans:jissaiTanka, unit:'円／kg', relKeys:['jissai-shouhiryou','jissai-shouhigaku'],
        choices:numChoices(jissaiTanka, [hyoujunTanka, Math.round(jissaiShouhigaku/hyoujunShouhiryou)]),
        exp:`実際消費額${yen(jissaiShouhigaku)}円÷実際消費量${yen(jissaiShouhiryou)}kg＝<strong>${yen(jissaiTanka)}円／kg</strong>。` },
      { label:'標準材料費（標準消費量×標準単価）はいくらか？', ans:hyoujunZairyouhi, unit:'円', relKeys:['hyoujun-tanka','hyoujun-perunit','seisanryou'],
        choices:numChoices(hyoujunZairyouhi, [jissaiShouhigaku, hyoujunShouhiryou*jissaiTanka]),
        exp:`標準消費量${yen(hyoujunShouhiryou)}kgに標準単価${yen(hyoujunTanka)}円をかけて、${yen(hyoujunShouhiryou)}×${yen(hyoujunTanka)}＝<strong>${yen(hyoujunZairyouhi)}円</strong>。` },
      { label:'価格差異はいくらか？', ans:fmtVar(kakakuSai), relKeys:['hyoujun-tanka','jissai-shouhiryou','jissai-shouhigaku'],
        choices:varChoices(kakakuSai, [suuryouSai, souSai, -kakakuSai]),
        exp:`実際の単価は、実際消費額${yen(jissaiShouhigaku)}円÷実際消費量${yen(jissaiShouhiryou)}kg＝${yen(jissaiTanka)}円／kg。標準単価${yen(hyoujunTanka)}円との差を実際消費量にかけます。(${yen(hyoujunTanka)}－${yen(jissaiTanka)})×${yen(jissaiShouhiryou)}＝<strong>${fmtVar(kakakuSai)}</strong>。` },
      { label:'数量差異はいくらか？', ans:fmtVar(suuryouSai), relKeys:['hyoujun-tanka','hyoujun-perunit','seisanryou','jissai-shouhiryou'],
        choices:varChoices(suuryouSai, [kakakuSai, souSai, -suuryouSai]),
        exp:`標準消費量${yen(hyoujunShouhiryou)}kgと実際消費量${yen(jissaiShouhiryou)}kgの差を標準単価${yen(hyoujunTanka)}円で評価します。(${yen(hyoujunShouhiryou)}－${yen(jissaiShouhiryou)})×${yen(hyoujunTanka)}＝<strong>${fmtVar(suuryouSai)}</strong>。` },
      { label:'材料費の総差異はいくらか？', ans:fmtVar(souSai), relKeys:['hyoujun-tanka','hyoujun-perunit','seisanryou','jissai-shouhigaku'],
        choices:varChoices(souSai, [kakakuSai, suuryouSai, -souSai]),
        exp:`総差異＝標準材料費${yen(hyoujunZairyouhi)}－実際材料費${yen(jissaiShouhigaku)}＝<strong>${fmtVar(souSai)}</strong>。価格差異と数量差異を足した金額と必ず一致します。` },
    ]
  };
}

// ===== StdCost-2 generator（労務費差異） =====
function genStdCost2(){
  const hyoujunChingin = compRandMult(10, 80, 200);
  const hyoujunJikanPerUnit = compPick([1,2,3,4]);
  const seisanryou = compRandMult(50, 5, 20);
  const hyoujunJikan = seisanryou*hyoujunJikanPerUnit;
  const jissaiJikan = hyoujunJikan + compPick([-1,1])*compRandMult(5, 4, 20);
  const jissaiChingin = hyoujunChingin + compPick([-1,1])*compRandMult(2, 4, 20);
  if(jissaiJikan<=0 || jissaiChingin<=0) return genStdCost2();
  const jissaiRoumuhi = jissaiJikan*jissaiChingin;

  const hyoujunRoumuhi = hyoujunJikan*hyoujunChingin;
  const chinritsuSai = (hyoujunChingin-jissaiChingin)*jissaiJikan;
  const jikanSai = (hyoujunJikan-jissaiJikan)*hyoujunChingin;
  const souSai = hyoujunRoumuhi-jissaiRoumuhi;
  if(chinritsuSai===0 || jikanSai===0) return genStdCost2();

  return {
    title: '標準原価計算②：労務費差異（賃率差異・時間差異）',
    scenario_html: `

// ===== StdCost-3 generator（製造間接費差異） =====
function genStdCost3(){
  const hendouhiRitsu = compRandMult(10, 20, 50);
  const kiteihiRitsu = compRandMult(10, 15, 40);
  const kijunSougyoudo = compRandMult(100, 10, 25);
  const kiteihiYosan = kiteihiRitsu*kijunSougyoudo;
  const hyoujunHaifuRitsu = hendouhiRitsu+kiteihiRitsu;

  const hyoujunJikan = kijunSougyoudo + compPick([-1,1])*compRandMult(10, 2, 15);
  const jissaiJikan = hyoujunJikan + compPick([-1,1])*compRandMult(10, 2, 15);
  if(hyoujunJikan<=0 || jissaiJikan<=0) return genStdCost3();
  const yosanKyoyougaku = hendouhiRitsu*jissaiJikan + kiteihiYosan;
  const jissaiHassei = yosanKyoyougaku + compPick([-1,1])*compRandMult(1000, 5, 40);
  if(jissaiHassei<=0) return genStdCost3();

  const hyoujunHaifugaku = hyoujunJikan*hyoujunHaifuRitsu;
  const yosanSai = yosanKyoyougaku - jissaiHassei;
  const nouritsuSai = hyoujunHaifuRitsu*(hyoujunJikan-jissaiJikan);
  const sougyoudoSai = kiteihiRitsu*(jissaiJikan-kijunSougyoudo);
  const souSai = hyoujunHaifugaku - jissaiHassei;
  if(yosanSai===0 || nouritsuSai===0 || sougyoudoSai===0) return genStdCost3();

  return {
    title: '標準原価計算③：製造間接費差異（予算差異・能率差異・操業度差異）',
    scenario_html: `
      <div class="comp-table">
        <div class="comp-row" data-key="hendouhi-ritsu"><span class="l">変動費率</span><span class="r">${yen(hendouhiRitsu)}円／時間</span></div>
        <div class="comp-row" data-key="kiteihi-yosan"><span class="l">固定費予算（月間）</span><span class="r">${yen(kiteihiYosan)}円</span></div>
        <div class="comp-row" data-key="kijun-sougyoudo"><span class="l">基準操業度（月間正常直接作業時間）</span><span class="r">${yen(kijunSougyoudo)}時間</span></div>
        <div class="comp-row" data-key="hyoujun-jikan"><span class="l">当月の標準直接作業時間（実際生産量に対して）</span><span class="r">${yen(hyoujunJikan)}時間</span></div>
        <div class="comp-row" data-key="jissai-jikan"><span class="l">当月実際直接作業時間</span><span class="r">${yen(jissaiJikan)}時間</span></div>
        <div class="comp-row" data-key="jissai-hassei"><span class="l">当月実際製造間接費発生額</span><span class="r">${yen(jissaiHassei)}円</span></div>
      </div>
      <div class="comp-note">公式法変動予算・三分法で分析する。固定費率＝固定費予算÷基準操業度。</div>`,
    steps: [
      { label:'固定費率（固定費予算÷基準操業度）はいくらか？', ans:kiteihiRitsu, unit:'円／時間', relKeys:['kiteihi-yosan','kijun-sougyoudo'],
        choices:numChoices(kiteihiRitsu, [hendouhiRitsu, hyoujunHaifuRitsu]),
        exp:`固定費予算${yen(kiteihiYosan)}円÷基準操業度${yen(kijunSougyoudo)}時間＝<strong>${yen(kiteihiRitsu)}円／時間</strong>。` },
      { label:'標準配賦率（変動費率＋固定費率）はいくらか？', ans:hyoujunHaifuRitsu, unit:'円／時間', relKeys:['hendouhi-ritsu','kiteihi-yosan','kijun-sougyoudo'],
        choices:numChoices(hyoujunHaifuRitsu, [hendouhiRitsu, kiteihiRitsu]),
        exp:`変動費率${yen(hendouhiRitsu)}円＋固定費率${yen(kiteihiRitsu)}円＝<strong>${yen(hyoujunHaifuRitsu)}円／時間</strong>。` },
      { label:'標準配賦額（標準直接作業時間×標準配賦率）はいくらか？', ans:hyoujunHaifugaku, unit:'円', relKeys:['hendouhi-ritsu','kiteihi-yosan','kijun-sougyoudo','hyoujun-jikan'],
        choices:numChoices(hyoujunHaifugaku, [jissaiHassei, jissaiJikan*hyoujunHaifuRitsu]),
        exp:`標準配賦額＝${yen(hyoujunJikan)}時間×${yen(hyoujunHaifuRitsu)}円＝<strong>${yen(hyoujunHaifugaku)}円</strong>。` },
      { label:'予算許容額（実際操業度における予算額）はいくらか？', ans:yosanKyoyougaku, unit:'円', relKeys:['hendouhi-ritsu','kiteihi-yosan','jissai-jikan'],
        choices:numChoices(yosanKyoyougaku, [jissaiHassei, hyoujunHaifugaku]),
        exp:`変動費率${yen(hendouhiRitsu)}×実際時間${yen(jissaiJikan)}＋固定費予算${yen(kiteihiYosan)}＝<strong>${yen(yosanKyoyougaku)}円</strong>。` },
      { label:'予算差異はいくらか？', ans:fmtVar(yosanSai), relKeys:['hendouhi-ritsu','kiteihi-yosan','jissai-jikan','jissai-hassei'],

      { label:'操業度差異はいくらか？', ans:fmtVar(sougyoudoSai), relKeys:['jissai-jikan','kijun-sougyoudo'],
        choices:varChoices(sougyoudoSai, [nouritsuSai, yosanSai, -sougyoudoSai]),
        exp:`実際時間${yen(jissaiJikan)}時間と基準操業度${yen(kijunSougyoudo)}時間の差を固定費率${yen(kiteihiRitsu)}円で評価します。${yen(kiteihiRitsu)}×(${yen(jissaiJikan)}－${yen(kijunSougyoudo)})＝<strong>${fmtVar(sougyoudoSai)}</strong>。` },
      { label:'製造間接費の総差異はいくらか？', ans:fmtVar(souSai), relKeys:['hyoujun-jikan','jissai-hassei'],
        choices:varChoices(souSai, [yosanSai, nouritsuSai, sougyoudoSai]),
        exp:`総差異＝標準配賦額${yen(hyoujunHaifugaku)}－実際発生額${yen(jissaiHassei)}＝<strong>${fmtVar(souSai)}</strong>。予算差異・能率差異・操業度差異を足した金額と一致します。` },
    ]
  };
}

// ===== CVP-1 generator =====
function genCVP1(){
  const hendouhi = compRandMult(100, 5, 25);
  const kouken = compRandMult(100, 3, 15);
  const hanbaikakaku = hendouhi+kouken;
  const koteihi = kouken * compRandMult(1000, 2, 10);
  const bepRyou = koteihi/kouken;
  const bepUriage = bepRyou*hanbaikakaku;
  const mokuhyouRieki = kouken * compRandMult(1000, 1, 5);
  const mokuhyouRyou = (koteihi+mokuhyouRieki)/kouken;
  const mokuhyouUriage = mokuhyouRyou*hanbaikakaku;
  const extraRyou = compRandMult(Math.max(5,Math.round(bepRyou*0.02)), 2, 24);
  const jissaiRyou = bepRyou+extraRyou;
  const jissaiUriage = jissaiRyou*hanbaikakaku;
  const anzenYoyuuRitsu = Math.round((jissaiUriage-bepUriage)/jissaiUriage*100);
  if(anzenYoyuuRitsu<=0) return genCVP1();

  return {
    title: 'CVP分析①：損益分岐点と目標利益・安全余裕率',
    scenario_html: `
      <div class="comp-table">

      </div>`,
    steps: [
      { label:'製品1個あたりの貢献利益はいくらか？', ans:kouken, unit:'円', relKeys:['hanbaikakaku','hendouhi'],
        choices:numChoices(kouken, [hanbaikakaku, hendouhi]),
        exp:`貢献利益＝販売価格${yen(hanbaikakaku)}－変動費${yen(hendouhi)}＝<strong>${yen(kouken)}円／個</strong>。` },
      { label:'貢献利益率は何%か？', ans:Math.round(kouken/hanbaikakaku*100), unit:'%', relKeys:['hanbaikakaku','hendouhi'],
        choices:numChoices(Math.round(kouken/hanbaikakaku*100), [Math.round(hendouhi/hanbaikakaku*100), 100-Math.round(kouken/hanbaikakaku*100)]),
        exp:`貢献利益${yen(kouken)}円が、販売価格${yen(hanbaikakaku)}円の何%にあたるかを計算します。${yen(kouken)}÷${yen(hanbaikakaku)}×100≒<strong>${Math.round(kouken/hanbaikakaku*100)}%</strong>。` },
      { label:'損益分岐点の売上高はいくらか？', ans:bepUriage, unit:'円', relKeys:['hanbaikakaku','hendouhi','koteihi'],
        choices:numChoices(bepUriage, [koteihi, bepUriage+hanbaikakaku*10]),
        exp:`貢献利益＝販売価格${yen(hanbaikakaku)}－変動費${yen(hendouhi)}＝${yen(kouken)}円／個。貢献利益率＝${yen(kouken)}÷${yen(hanbaikakaku)}。固定費${yen(koteihi)}円をこの比率で割ると、固定費をちょうど回収できる売上高が求められます。損益分岐点売上高＝<strong>${yen(bepUriage)}円</strong>。` },
      { label:'損益分岐点の販売量はいくらか？', ans:bepRyou, unit:'個', relKeys:['hanbaikakaku','hendouhi','koteihi'],
        choices:numChoices(bepRyou, [bepRyou+extraRyou, Math.round(koteihi/hanbaikakaku)]),

      { label:`目標営業利益${yen(mokuhyouRieki)}円を達成する売上高はいくらか？`, ans:mokuhyouUriage, unit:'円', relKeys:['hanbaikakaku','hendouhi','koteihi','mokuhyou-rieki'],

    ]
  };
}

// ===== CVP-2 generator =====
function genCVP2(){
  const hendouHanbaihi = compRandMult(10, 5, 30);
  const hendouSeizouhi = compRandMult(100, 5, 25);
  const taniKouken = compRandMult(100, 3, 15);
  const hanbaikakaku = hendouSeizouhi+hendouHanbaihi+taniKouken;
  const koteiTotal = taniKouken * compRandMult(100, 3, 15);
  const koteiSeizouHiritsu = compPick([0.6,0.65,0.7,0.75]);
  const koteiSeizou = Math.round(koteiTotal*koteiSeizouHiritsu);
  const koteiHankan = koteiTotal - koteiSeizou;
  const bepRyou = koteiTotal/taniKouken;
  const bepUriage = bepRyou*hanbaikakaku;
  const extraRyou = compRandMult(Math.max(10,Math.round(bepRyou*0.1)), 1, 4);
  const hanbairyou = bepRyou + extraRyou;
  const koukenTotal = taniKouken*hanbairyou;
  const eigyouRieki = koukenTotal - koteiTotal;
  if(eigyouRieki<=0 || koteiHankan<=0 || koteiSeizou<=0) return genCVP2();

  return {
    title: 'CVP分析②：直接原価計算によるP/Lと損益分岐点',
    scenario_html: `
      <div class="comp-table">

        <div class="comp-row" data-key="hanbairyou"><span class="l">当月の生産・販売量（期首期末在庫なし）</span><span class="r">${yen(hanbairyou)}個</span></div>
      </div>`,
    steps: [
      { label:'固定費合計（固定製造間接費＋固定販管費）はいくらか？', ans:koteiTotal, unit:'円', relKeys:['kotei-seizou','kotei-hankan'],
        choices:numChoices(koteiTotal, [koteiSeizou, koteiHankan]),
        exp:`固定製造間接費${yen(koteiSeizou)}円と固定販売費及び一般管理費${yen(koteiHankan)}円は、どちらも生産・販売量に関わらずかかる期間費用なので、まとめて合計します。${yen(koteiSeizou)}＋${yen(koteiHankan)}＝<strong>${yen(koteiTotal)}円</strong>。` },
      { label:'製品1個あたりの貢献利益はいくらか？', ans:taniKouken, unit:'円', relKeys:['hanbaikakaku','hendou-seizouhi','hendou-hanbaihi'],
        choices:numChoices(taniKouken, [hanbaikakaku-hendouSeizouhi, hanbaikakaku-hendouHanbaihi]),
        exp:`販売価格${yen(hanbaikakaku)}円から変動製造費${yen(hendouSeizouhi)}円と変動販売費${yen(hendouHanbaihi)}円を引きます。${yen(hanbaikakaku)}－${yen(hendouSeizouhi)}－${yen(hendouHanbaihi)}＝<strong>${yen(taniKouken)}円</strong>。` },
      { label:'当月の貢献利益（総額）はいくらか？', ans:koukenTotal, unit:'円', relKeys:['hanbairyou'],
        choices:numChoices(koukenTotal, [koukenTotal-taniKouken*10, eigyouRieki]),
        exp:`1個あたりの貢献利益${yen(taniKouken)}円に、当月の販売量${yen(hanbairyou)}個をかけます。${yen(taniKouken)}×${yen(hanbairyou)}＝<strong>${yen(koukenTotal)}円</strong>。` },
      { label:'当月の営業利益はいくらか？', ans:eigyouRieki, unit:'円', relKeys:['kotei-seizou','kotei-hankan'],
        choices:numChoices(eigyouRieki, [koukenTotal, koukenTotal-koteiSeizou]),
        exp:`貢献利益${yen(koukenTotal)}円から固定費（${yen(koteiSeizou)}＋${yen(koteiHankan)}＝${yen(koteiTotal)}円）を差し引きます。${yen(koukenTotal)}－${yen(koteiTotal)}＝<strong>${yen(eigyouRieki)}円</strong>。` },
      { label:'損益分岐点の販売量はいくらか？', ans:bepRyou, unit:'個', relKeys:['kotei-seizou','kotei-hankan'],
        choices:numChoices(bepRyou, [hanbairyou, bepRyou+extraRyou]),
        exp:`固定費${yen(koteiTotal)}円を単位貢献利益${yen(taniKouken)}円で割ります。${yen(koteiTotal)}÷${yen(taniKouken)}＝<strong>${yen(bepRyou)}個</strong>。` },
      { label:'損益分岐点の売上高はいくらか？', ans:bepUriage, unit:'円', relKeys:['hanbaikakaku'],
        choices:numChoices(bepUriage, [koteiTotal, bepUriage+hanbaikakaku*5]),
        exp:`損益分岐点の販売量${yen(bepRyou)}個に、販売価格${yen(hanbaikakaku)}円をかけます。${yen(bepRyou)}×${yen(hanbaikakaku)}＝<strong>${yen(bepUriage)}円</strong>。` },
    ]
  };
}

const COMP_GENERATORS = {
  fs: [genFS1, genFS2],
  branch: [genBranch1, genBranch2],
  equity: [genEquity1, genEquity2],
  stdcost: [genStdCost1, genStdCost2, genStdCost3],
  cvp: [genCVP1, genCVP2],
};
const COMP_CATS = [
  { key:'fs', label:'財務諸表作成（B/S・P/L）' },
  { key:'branch', label:'本支店会計（合併財務諸表）' },
  { key:'equity', label:'株主資本等変動計算書' },
  { key:'stdcost', label:'標準原価計算（差異分析）' },
  { key:'cvp', label:'CVP分析・直接原価計算' },
];

let compQuizDeck = [];
let compQuizIdx = 0;
let compQuizStepIdx = 0;
let compQuizCorrectFirstTry = 0;
let compQuizTotalSteps = 0;
let compQuizFirstAttemptUsed = false;
let compQuizLastCat = null;

function startCompQuiz(){
  document.getElementById('controls-main').style.display='none';
  document.getElementById('check-bar').style.display='none';
  document.getElementById('group-row').style.display='none';
  renderCompCatSelect();
  document.getElementById('exp-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderCompCatSelect(){
  const main=document.getElementById('exp-main');
  main.innerHTML = `
    <div class="exp-nav-row">
      <button class="exp-nav-btn" onclick="exitCompQuiz()">✕ 終了</button>
      <span class="exp-nav-info">総合問題：分野を選択</span>
      <span style="width:64px;"></span>
    </div>
    <div class="exp-q-card" style="text-align:center;">
      <div style="font-size:14px;font-weight:700;">仕訳一問一答だけでは対応しづらい「財務諸表作成」「差異分析」「CVP分析」などの計算問題です</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">数字は毎回ランダムに変わります。与えられたデータから金額を計算し、正しい選択肢を選んでください</div>
    </div>
    <div class="exp-step-choices wide">
      ${COMP_CATS.map(c=>{
        const n = COMP_GENERATORS[c.key].length;
        return `<button class="exp-step-choice-btn" onclick="launchCompCat('${c.key}')">${c.label}（${n}問）</button>`;
      }).join('')}
    </div>`;
}

function launchCompCat(key){
  compQuizLastCat = key;
  compQuizDeck = COMP_GENERATORS[key].map(fn => fn());
  compQuizIdx = 0;
  compQuizStepIdx = 0;
  compQuizCorrectFirstTry = 0;
  compQuizTotalSteps = compQuizDeck.reduce((s,d)=>s+d.steps.length,0);
  compQuizFirstAttemptUsed = false;
  renderCompProblem();
}

function exitCompQuiz(){
  document.getElementById('controls-main').style.display='';
  document.getElementById('check-bar').style.display='';
  updateGroupButtons();
  loadExpQ();
}

function compQuizNavBar(){
  const total=compQuizDeck.length, i=compQuizIdx;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="exitCompQuiz()">✕ 終了</button>
    <span class="exp-nav-info">問題 ${i+1} / ${total}</span>
    <span style="width:64px;"></span>
  </div>`;
}

function compFmtChoice(v){
  return typeof v === 'number' ? v.toLocaleString() : String(v);
}

function renderCompProblem(){
  if(compQuizIdx >= compQuizDeck.length){ renderCompQuizFinish(); return; }
  const item = compQuizDeck[compQuizIdx];
  const main=document.getElementById('exp-main');
  main.innerHTML = `
    ${compQuizNavBar()}
    <div class="exp-q-card">
      <div class="comp-title">${item.title}</div>
      <div id="comp-scenario">${item.scenario_html}</div>
    </div>
    <div id="comp-step-area"></div>
    <div class="exp-result" id="comp-res"></div>`;
  compQuizStepIdx = 0;
  compQuizFirstAttemptUsed = false;
  renderCompStep();
}

function compClearHighlight(){
  document.querySelectorAll('#comp-scenario [data-key]').forEach(el=>el.classList.remove('comp-hl'));
}

function compApplyHighlight(keys){
  compClearHighlight();
  (keys||[]).forEach(k=>{
    document.querySelectorAll(`#comp-scenario [data-key="${k}"]`).forEach(el=>el.classList.add('comp-hl'));
  });
}

function renderCompStep(){
  const item = compQuizDeck[compQuizIdx];
  const step = item.steps[compQuizStepIdx];
  const area = document.getElementById('comp-step-area');
  const res = document.getElementById('comp-res');
  if(res){ res.style.display = 'none'; res.innerHTML=''; }
  compApplyHighlight(step.relKeys);
  const dots = item.steps.map((_,i)=>{
    const cls = i<compQuizStepIdx ? 'done' : (i===compQuizStepIdx ? 'active' : '');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled = [...step.choices].sort(()=>Math.random()-0.5);
  window._compChoices = shuffled;
  const isLong = shuffled.some(v=>String(compFmtChoice(v)).length>10) || typeof step.ans !== 'number';
  compQuizFirstAttemptUsed = false;
  area.innerHTML = `
    <div class="exp-step-header">
      <span class="exp-step-label">設問 ${compQuizStepIdx+1}/${item.steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-choices${isLong?' wide':''}">
      ${shuffled.map((c,i)=>`<button class="exp-step-choice-btn" onclick="selectCompChoice(this,${i})">${compFmtChoice(c)}${(typeof c==='number' && step.unit)?('　'+step.unit):''}</button>`).join('')}
    </div>`;
}

function selectCompChoice(btn, idx){
  const item = compQuizDeck[compQuizIdx];
  const step = item.steps[compQuizStepIdx];
  const chosen = window._compChoices[idx];
  const ok = chosen === step.ans;
  if(ok){
    if(!compQuizFirstAttemptUsed) compQuizCorrectFirstTry++;
    document.querySelectorAll('#comp-step-area .exp-step-choice-btn').forEach(b=>{
      b.disabled = true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity = '0.4';
    });
    showCompStepExplanation();
  } else {
    compQuizFirstAttemptUsed = true;
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'), 500);
  }
}

function showCompStepExplanation(){
  const item = compQuizDeck[compQuizIdx];
  const step = item.steps[compQuizStepIdx];
  const isLastStepOfProblem = compQuizStepIdx >= item.steps.length - 1;
  const isLastProblem = compQuizIdx >= compQuizDeck.length - 1;
  const nextLabel = isLastStepOfProblem ? (isLastProblem ? '結果を見る →' : '次の問題へ →') : '次の設問へ →';
  const res = document.getElementById('comp-res');
  res.className = 'exp-result ok';
  res.style.display = 'block';
  res.innerHTML = `
    <div class="exp-res-hd">⭕ 正解</div>
    <button class="exp-nav-btn exp-nav-next" style="width:100%;margin:10px 0;" onclick="compQuizNextStep()">${nextLabel}</button>
    <div class="exp-res-exp">${step.exp}</div>`;
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function compQuizNextStep(){
  const item = compQuizDeck[compQuizIdx];
  compQuizStepIdx++;
  if(compQuizStepIdx >= item.steps.length){
    compQuizIdx++;
    renderCompProblem();
  } else {
    renderCompStep();
  }
}

function renderCompQuizFinish(){
  const pct = compQuizTotalSteps ? Math.round(compQuizCorrectFirstTry/compQuizTotalSteps*100) : 0;
  const main=document.getElementById('exp-main');
  main.innerHTML = `
    <div class="exp-fin">
      <div class="exp-fin-score">${compQuizCorrectFirstTry} / ${compQuizTotalSteps}</div>
      <div class="exp-fin-label">1回目で正解した設問の割合：${pct}%</div>
      <div class="exp-fin-btns">
        <button class="exp-fin-btn exp-fin-btn-retry" onclick="launchCompCat('${compQuizLastCat}')">もう一度（数字は変わります）</button>
        <button class="exp-fin-btn exp-fin-btn-back" onclick="exitCompQuiz()">仕訳問題に戻る</button>
      </div>
      <button class="exp-nav-btn" style="width:100%;margin-top:10px;" onclick="renderCompCatSelect()">↩ 別の分野を選ぶ</button>
    </div>`;
}
// ===== 総合問題ここまで =====


function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  document.querySelectorAll('.grp-btn').forEach(btn=>{
    const bsec = btn.dataset.sec||btn.id.replace('sec-','');
    btn.classList.toggle('active', bsec === sec);
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
  updateStats();
}

function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? '✅ 通常モードに戻る' : '✅ チェックした問題だけを解く';
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
  updateStats();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='✅ チェックした問題だけを解く'; }
  setSection('chap:第1章：商品売買');
}

function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('chap:第1章：商品売買');
</script>
