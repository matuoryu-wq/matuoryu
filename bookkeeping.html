<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記 仕訳練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.liability { background: #C2185B; }
    .dot.expense   { background: #388E3C; }
    .dot.revenue   { background: #0288D1; }
    .dot.equity    { background: #7B1FA2; }


    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }

    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #6A1B9A; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }

    .card-body { padding: 20px 18px; }

    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }

    .answer-area { display: none; }
    .answer-area.show { display: block; }

    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tag-amt { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }
    /* 資産：黄色 */
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    /* 負債：ピンク/紫 */
    .tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    /* 費用：緑 */
    .tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    /* 収益：水色 */
    .tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    /* 純資産：紫 */
    .tag.equity    { background: #EDE7F6; color: #4A148C; border: 1.5px solid #7B1FA2; }
    /* その他（評価勘定・損益等）*/
    .tag.other     { background: #F3E5F5; color: #4A148C; border: 1.5px solid #CE93D8; }

    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }

    .exp-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #F0F7FF;
      border-left: 3px solid #42A5F5;
      border-radius: 4px;
      font-size: 13px;
      color: #1A2B3C;
      line-height: 1.7;
    }
    .exp-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* 表形式の解答 */
    .ans-table-wrap {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .ans-table-wrap table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      min-width: 260px;
    }
    .ans-table-wrap th {
      background: #1E4D7B;
      color: white;
      padding: 5px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
    }
    .ans-table-wrap td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      line-height: 1.5;
    }
    .ans-table-wrap tr:nth-child(even) td { background: #F7F9FC; }
    .ans-table-wrap .total-row td { background: #E8F0FA; font-weight: 700; }
    .ans-table-wrap .hl { background: #FFF9C4 !important; font-weight: 700; }
    .ans-table-wrap .q-blank { background: #FFF3E0 !important; color: #E65100; font-weight: 700; text-align: center; border: 2px dashed #FB8C00 !important; }
    .tbl-sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .formula-box {
      margin: 8px 0;
      padding: 8px 12px;
      background: #E8F5E9;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1B5E20;
      text-align: center;
    }

    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    /* ===== Appendix modal ===== */
    .apx-btn { background:var(--primary); color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .apx-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; padding:0; }
    .apx-overlay.show { display:flex; }
    .apx-modal { background:#fff; width:100%; max-width:none; border-radius:0; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow:hidden; margin:0; }
    .apx-sticky-header { flex-shrink:0; padding:16px 18px 10px; background:#fff; border-bottom:1px solid var(--border); }
    .apx-modal-body { overflow-y:auto; flex:1; padding:10px 18px 20px; -webkit-overflow-scrolling:touch; }
    .apx-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
    .apx-title { font-size:17px; font-weight:800; color:var(--primary); }
    .apx-subtitle { font-size:11px; color:var(--muted); margin-top:2px; }
    .apx-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
    .apx-section { margin-bottom:22px; }
    .apx-section-hd { font-size:13px; font-weight:800; padding:7px 12px; border-radius:8px; margin-bottom:5px; display:flex; align-items:center; gap:8px; }
    .apx-section-hd.asset      { background:#FFF9C4; color:#5D4037; border:1.5px solid #F9C400; }
    .apx-section-hd.liability  { background:#FCE4EC; color:#880E4F; border:1.5px solid #C2185B; }
    .apx-section-hd.expense    { background:#E8F5E9; color:#1B5E20; border:1.5px solid #388E3C; }
    .apx-section-hd.revenue    { background:#E1F5FE; color:#01579B; border:1.5px solid #0288D1; }
    .apx-section-hd.equity     { background:#EDE7F6; color:#4A148C; border:1.5px solid #7B1FA2; }
    .apx-section-hd.other      { background:#F3E5F5; color:#4A148C; border:1.5px solid #CE93D8; }
    .apx-section-hd.industrial { background:#FFF3E0; color:#BF360C; border:1.5px solid #FF8F00; }
    .apx-section-sub { font-size:11px; color:var(--muted); margin-bottom:6px; padding-left:4px; }
    .apx-row { padding:8px 4px; border-bottom:1px solid var(--border); }
    .apx-row.hidden { display:none; }
    .apx-row-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px; }
    .apx-en { font-size:11px; color:var(--muted); }
    .apx-note { font-size:12px; color:#444; line-height:1.6; }
    .apx-note strong { color:#1A2B3C; }
    .apx-note mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    .apx-lv { display:inline-block; font-size:9px; font-weight:700; background:var(--primary); color:#fff; border-radius:4px; padding:1px 5px; }
    .apx-lv.ind { background:#FF8F00; }
    .apx-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
    .apx-tab { padding:5px 11px; border:1.5px solid var(--border); border-radius:20px; background:#fff; font-size:12px; cursor:pointer; color:var(--muted); font-weight:600; transition:background 0.15s,color 0.15s,border-color 0.15s; }
    .apx-tab:hover { background:#f5f5f5; }
    .apx-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .apx-hide-btns { display:flex; gap:8px; margin-bottom:0; }
    .apx-hide-btn { flex:1; padding:7px 10px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:12px; cursor:pointer; color:var(--text); font-weight:600; text-align:center; transition:background 0.15s; }
    .apx-hide-btn.active { background:#eee; border-color:#999; }
    #apx-content.names-hidden .tag { color:transparent !important; background:#e0e0e0 !important; border-color:#bbb !important; user-select:none; min-width:50px; display:inline-block; }
    #apx-content.names-hidden .gloss-term-text { color:transparent !important; background:#e0e0e0 !important; border-radius:3px; user-select:none; }
    #apx-content.en-hidden .apx-en, #apx-content.en-hidden .gloss-en { display:none; }
    /* ===== Glossary ===== */
    .gloss-section { margin-bottom:10px; }
    .gloss-hd { font-size:14px; font-weight:800; color:var(--primary); padding:8px 12px; background:var(--primary-light); border-radius:8px; margin:14px 0 6px; }
    .gloss-row { padding:9px 4px; border-bottom:1px solid var(--border); }
    .gloss-term { font-size:13px; font-weight:800; margin-bottom:3px; }
    .gloss-en { font-size:11px; color:var(--muted); }
    .gloss-def { font-size:12px; color:#444; line-height:1.6; }
    .gloss-def strong { color:#1A2B3C; }
    .gloss-def mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }

    /* ===== 実験モード ===== */
    .exp-panel { display:none; max-width:640px; margin:0 auto; padding:14px 14px; }
    .exp-prog-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; color:var(--muted); }
    .exp-q-card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px; border:1.5px solid var(--border); font-size:14px; line-height:1.7; font-weight:500; }
    .exp-swipe-wrap { position:relative; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .exp-hint { position:absolute; font-size:11px; font-weight:700; top:50%; transform:translateY(-50%); pointer-events:none; }
    .exp-swipe-card {
      width:160px; background:#fff; border-radius:14px; border:2.5px solid var(--border);
      padding:14px; text-align:center; font-size:15px; font-weight:800;
      box-shadow:0 4px 18px rgba(0,0,0,0.12); touch-action:none; user-select:none; cursor:grab;
      position:relative; z-index:2; will-change:transform;
    }
    .exp-swipe-card.tilt-l { border-color:#0288D1; background:#E3F2FD; }
    .exp-swipe-card.tilt-r { border-color:#388E3C; background:#E8F5E9; }
    .exp-swipe-card.anim { transition:transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s; }
    .exp-zones { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
    .exp-zone { border-radius:12px; padding:10px; min-height:62px; border:2px dashed; }
    .exp-zone-d { border-color:#90CAF9; background:#F0F8FF; }
    .exp-zone-c { border-color:#A5D6A7; background:#F0FBF0; }
    .exp-zone-label { font-size:11px; font-weight:800; margin-bottom:6px; }
    .exp-zone-d .exp-zone-label { color:#0277BD; }
    .exp-zone-c .exp-zone-label { color:#2E7D32; }
    .exp-placed { display:flex; flex-wrap:wrap; gap:4px; min-height:24px; }
    .exp-actions { display:flex; gap:8px; margin-bottom:4px; }
    .exp-act-btn { flex:1; padding:11px 8px; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; }
    .exp-act-btn:active { opacity:0.75; }
    .exp-act-d { background:#0288D1; color:#fff; }
    .exp-act-c { background:#388E3C; color:#fff; }
    .exp-result { background:#fff; border-radius:12px; padding:14px 16px; margin-top:12px; border:2px solid var(--border); display:none; }
    .exp-result.ok { border-color:#2E7D32; background:#F1FBF4; }
    .exp-result.ng { border-color:#C62828; background:#FFF5F5; }
    .exp-res-hd { font-size:20px; font-weight:800; margin-bottom:8px; }
    .exp-res-ans { margin-bottom:8px; }
    .exp-res-exp { font-size:12px; color:#555; line-height:1.6; padding:8px 10px; background:rgba(0,0,0,0.04); border-radius:8px; }
    .exp-next-btn { width:100%; padding:12px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:10px; }
    .exp-fin { text-align:center; padding:30px 16px; background:#fff; border-radius:14px; }
    .exp-fin-score { font-size:52px; font-weight:900; color:var(--primary); line-height:1; }
    .exp-fin-label { font-size:14px; color:var(--muted); margin:6px 0 16px; }
    .exp-fin-btns { display:flex; gap:10px; }
    .exp-fin-btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
    .exp-fin-btn-retry { background:var(--primary); color:#fff; }
    .exp-fin-btn-back { background:var(--bg); color:var(--text); border:1.5px solid var(--border); }
    .exp-btn { background:#FF8F00; color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .exp-btn.active { background:#E65100; }
    .exp-tab-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .exp-tab { padding:5px 12px; border:1.5px solid var(--border); border-radius:16px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; }
    .exp-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .exp-scroll-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
    .exp-scroll-tab { padding:4px 10px; border:1.5px solid var(--border); border-radius:12px; background:#fff; font-size:11px; font-weight:700; cursor:pointer; }
    .exp-scroll-tab.active { background:#FF8F00; color:#fff; border-color:#FF8F00; }
    .exp-readonly-ans { margin:10px 0; padding:10px; background:#f5f5f5; border-radius:8px; display:none; overflow-x:auto; }
    .exp-reveal-btn { width:100%; padding:10px; border:none; border-radius:8px; background:#546E7A; color:#fff; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:8px; }
  </style>
</head>
<body>

<div class="header">
  <h1>簿記 仕訳練習アプリ</h1>
  <p>問題を読んで仕訳を考え、答えと解説を確認しよう</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="dot asset"></div>資産</div>
  <div class="legend-item"><div class="dot liability"></div>負債</div>
  <div class="legend-item"><div class="dot expense"></div>費用</div>
  <div class="legend-item"><div class="dot revenue"></div>収益</div>
  <div class="legend-item"><div class="dot equity"></div>純資産</div>
</div>


<div class="controls">
  <button class="ctrl-btn" onclick="shuffle()">🔀 シャッフル</button>
  <button class="ctrl-btn" id="btn-hide-mem" onclick="toggleHideMem()">習得済みを除く</button>
  <button class="ctrl-btn" onclick="resetAll()">🔄 リセット</button>
  <button class="exp-btn" id="exp-toggle-btn" onclick="toggleExp()">🧪 実験</button>
</div>

    { term:'貸方', en:'Credit (Cr.)', def:'<strong>仕訳の右側</strong>を「貸方」といいます。<mark>負債の増加・収益の発生・資産の減少・純資産の増加</mark>を記録します。「右＝貸方」と覚えましょう。' },
    { term:'仕訳', en:'Journal Entry', def:'取引が起きたときに<strong>借方と貸方に分けて記録する基本作業</strong>です。すべての取引は必ず「借方合計＝貸方合計」になります（貸借平均の原則）。仕訳は会計作業の出発点です。' },
    { term:'複式簿記', en:'Double-entry Bookkeeping', def:'すべての取引を<strong>借方と貸方の両面から記録</strong>する仕組みです。「借方合計＝貸方合計」が常に成立するため、記録ミスを自動的に発見できます。日本の企業会計はすべてこの方式です。単式簿記（収支だけ記録）との違いに注意です。' },
    { term:'勘定科目', en:'Account Title', def:'取引の内容を表す<mark>分類名称</mark>です。現金・売掛金・借入金などがそれぞれ勘定科目です。試験では「正しい勘定科目名で書くこと」が求められます。' },
    { term:'勘定', en:'Account', def:'勘定科目ごとに増減を集計する記録欄です。T字型の図（Tフォーム）で左側が借方・右側が貸方となり、残高（差額）がその科目の現在の金額です。' },
    { term:'転記', en:'Posting', def:'仕訳帳に記録した内容を、<strong>勘定科目ごとの元帳（総勘定元帳）に書き写す作業</strong>です。仕訳帳→元帳の流れが簿記の基本的な記帳の流れです。' },
    { term:'会計期間', en:'Accounting Period', def:'財務諸表を作成する一定の区切りの期間です。<mark>一般に1年間（4月1日〜翌年3月31日など）</mark>で、期間の始まりを「期首」、終わりを「期末（決算日）」といいます。' },
    { term:'貸借平均の原則', en:'Principle of Debit-Credit Balance', def:'複式簿記において、<strong>すべての仕訳で借方の合計と貸方の合計が必ず一致する</strong>というルールです。試算表の借方合計と貸方合計が一致するのもこの原則があるためです。' },
  ]},
  { category:'② 帳簿の種類', items:[
    { term:'仕訳帳', en:'Journal', def:'取引発生順に<strong>時系列で仕訳を記録していく主要帳簿</strong>です。「日記帳」のイメージで、すべての取引はまずここに記録されます。ここから勘定ごとに総勘定元帳へ転記します。' },
    { term:'総勘定元帳', en:'General Ledger', def:'<strong>勘定科目ごとに取引を集計した主要帳簿</strong>です。「元帳」とも呼びます。現金の元帳には現金の増減がすべて記録され、残高を見れば現在の現金残高がわかります。' },
    { term:'補助元帳', en:'Subsidiary Ledger', def:'総勘定元帳の特定科目（売掛金・買掛金など）を<strong>取引先別に詳細管理する補助的な帳簿</strong>です。売掛金元帳（得意先元帳）・買掛金元帳（仕入先元帳）が代表的です。' },
    { term:'現金出納帳', en:'Cash Book', def:'現金の入出金を日付順に記録する補助記入帳です。<strong>現金科目の補助帳</strong>で、帳簿残高と実際の手元現金が一致するか確認するために使います。' },
    { term:'小口現金出納帳', en:'Petty Cash Book', def:'小口現金係が<strong>小口現金の受け取りと支払いを記録する帳簿</strong>です。使途別（交通費・消耗品費など）に集計し、一定期間後に報告・補充する際に使います。' },
    { term:'商品有高帳', en:'Inventory Record', def:'商品の入庫・出庫・残高を<strong>数量と単価で管理する補助帳簿</strong>です。先入先出法・移動平均法などの棚卸評価法を適用して単価を計算します。' },
    { term:'受取手形記入帳', en:'Notes Receivable Book', def:'受け取った手形を<strong>振出人・金額・期日ごとに管理する補助帳簿</strong>です。期日管理に重要で、決済・割引・裏書の管理もここで行います。' },
    { term:'支払手形記入帳', en:'Notes Payable Book', def:'振り出した手形を<strong>受取人・金額・期日ごとに管理する補助帳簿</strong>です。期日を過ぎると不渡りになるため、期日管理が非常に重要です。' },
    { term:'仕訳日計表', en:'Daily Summary Journal', def:'<strong>伝票方式で1日の取引を集計して仕訳帳に代わる集計表</strong>です。入金・出金・振替の3種の伝票をまとめ、月次で元帳に転記します。多数の取引がある会社で利用されます。' },
  ]},
  { category:'③ 財務諸表', items:[
    { term:'貸借対照表', en:'Balance Sheet (B/S)', def:'<mark>決算日時点</mark>での財産状態を示す表です。左（借方）に資産、右（貸方）に負債と純資産が並び、<strong>「資産＝負債＋純資産」</strong>が常に成立します。会社の財政状態を示す最重要書類です。' },
    { term:'損益計算書', en:'Income Statement (P/L)', def:'<mark>一定期間（会計期間）</mark>の経営成績を示す表です。収益から費用を差し引いて当期純利益を計算します。会社がいくら儲けたかを示す書類です。' },
    { term:'株主資本等変動計算書', en:'Statement of Changes in Equity', def:'純資産の各項目（資本金・剰余金など）が<strong>1年間でどのように変動したか</strong>を示す財務諸表です。配当・増資・利益の積み立てなどが記録されます。2級の重要書類です。' },
    { term:'売上総利益', en:'Gross Profit', def:'<strong>売上高から売上原価を差し引いた最初の段階の利益</strong>です。「粗利益（あらりえき）」とも呼ばれます。この数値が低いと、どれだけ売ってもコストで食われてしまいます。' },
    { term:'営業利益', en:'Operating Profit', def:'売上総利益から<strong>販売費・一般管理費を差し引いた本業の利益</strong>です。会社の本業での稼ぎ力を示す最も重要な利益指標です。' },
    { term:'経常利益', en:'Ordinary Profit', def:'営業利益に<strong>営業外収益を加え、営業外費用を差し引いた利益</strong>です。本業以外（利息収入・受取配当・支払利息など）も含めた通常の企業活動全体の利益です。' },
    { term:'税引前当期純利益', en:'Income Before Tax', def:'経常利益に<strong>特別損益（臨時的な損益）を加減した利益</strong>です。法人税等を引く前の最終的な利益で、ここから税金を引くと当期純利益になります。' },
    { term:'当期純利益', en:'Net Income', def:'税引前当期純利益から<strong>法人税等を差し引いた最終的な利益</strong>です。この金額が繰越利益剰余金に加算されます。マイナスの場合を「当期純損失」といいます。' },
  ]},
  { category:'④ 試算表・精算表', items:[
    { term:'試算表', en:'Trial Balance', def:'すべての勘定科目の残高を一覧にして、<strong>借方合計と貸方合計が一致するか確認する表</strong>です。合計が一致すれば転記ミスはないと判断できます（ただし相殺ミスなどは発見できない）。' },
    { term:'合計試算表', en:'Sum Trial Balance', def:'<strong>各勘定の借方合計・貸方合計を並べた試算表</strong>です。仕訳帳の借方合計・貸方合計の確認に使います。残高はわかりにくいです。' },
    { term:'残高試算表', en:'Balance Trial Balance', def:'<strong>各勘定の残高（借方超か貸方超かの差額）を並べた試算表</strong>です。残高がひと目でわかり、決算に使いやすいです。合計試算表より実務でよく使われます。' },
    { term:'合計残高試算表', en:'Sum-Balance Trial Balance', def:'合計試算表と残高試算表を合体させた表です。<strong>合計と残高の両方が一覧</strong>できるため、もっとも情報量が多いですが作成に手間がかかります。' },
    { term:'精算表', en:'Worksheet', def:'試算表に決算整理仕訳を加え、<strong>損益計算書・貸借対照表を作成するための作業用一覧表</strong>です。6桁精算表（試算表・整理・BS/PL）や8桁精算表が使われます。試験でも頻出です。' },
  ]},
  { category:'⑤ 商品売買・在庫', items:[
    { term:'三分法', en:'Three-Account Method', def:'商品売買を<strong>「仕入（費用）」「売上（収益）」「繰越商品（資産）」の3科目</strong>で記録する方法です。最もポピュラーな方法で3級の基本です。期末に「しくりくりし」の決算整理で売上原価を計算します。' },
    { term:'分記法', en:'Separate Method', def:'売上時に<strong>「商品（資産）の減少」と「商品売買益（収益）」を同時記録</strong>する方法です。つねに利益が見える反面、仕訳が複雑になります。' },
    { term:'売上原価対立法', en:'Cost of Sales Method', def:'売上時に売上とともに<strong>「売上原価（費用）」「商品（資産）の減少」</strong>も同時計上する方法です。売上原価をリアルタイムで把握できます。' },
    { term:'しくりくりし', en:'Inventory Adjustment (Period-end)', def:'三分法の期末在庫調整のことです。<strong>「仕入／繰越商品（期首）」で期首在庫を仕入に加算し、「繰越商品／仕入（期末）」で期末在庫を仕入から控除</strong>します。この2つの仕訳で売上原価が正確に計算されます。' },
    { term:'棚卸', en:'Inventory Count', def:'期末に倉庫にある商品を実際に数えて数量を確認する作業です。帳簿上の数量と実際の数量が一致するか確認し、差があれば棚卸減耗損として処理します。' },
    { term:'先入先出法', en:'FIFO (First-In, First-Out)', def:'先に仕入れた商品から先に売れたと<strong>仮定して在庫を評価する方法</strong>です。物価が上昇中は利益が多く計上されます。商品有高帳で管理します。' },
    { term:'移動平均法', en:'Moving Average Method', def:'仕入のたびに<strong>平均単価を再計算して在庫を評価する方法</strong>です。「（既存在庫金額＋今回仕入金額）÷（既存数量＋今回数量）」で平均単価を求めます。' },
    { term:'低価法', en:'Lower of Cost or Market', def:'在庫を<strong>「取得原価と正味売却価額のうち低い方」で評価</strong>するルールです。在庫の価値が下がった場合に商品評価損を計上し、過大な資産計上を防ぎます。' },
    { term:'棚卸減耗損', en:'Inventory Shrinkage Loss', def:'実際の在庫数量が帳簿数量より少ない場合の差額損失です。<strong>盗難・紛失・腐敗・破損</strong>などが原因で、正常分は売上原価に算入し、異常分は特別損失とします。' },
    { term:'売上原価', en:'Cost of Goods Sold', def:'販売した商品の<strong>仕入れにかかったコストの合計</strong>です。「期首繰越商品＋当期仕入高－期末繰越商品」で計算します。売上高から引くと売上総利益になります。' },
  ]},
  { category:'⑥ 手形・電子記録', items:[
    { term:'約束手形', en:'Promissory Note', def:'「○月○日に○円支払います」という<strong>支払いの約束を書いた証書</strong>です。振り出した側は支払手形（負債）、受け取った側は受取手形（資産）に記録します。' },
    { term:'為替手形', en:'Bill of Exchange', def:'振出人が第三者（引受人）に対して「受取人へ支払え」と命令する<strong>3者間の手形</strong>です。振出人・指図人・引受人の3者が登場します。約束手形より複雑な仕組みです。' },
    { term:'手形の裏書譲渡', en:'Endorsement Transfer', def:'受け取った手形を<strong>第三者への支払いに流用すること</strong>です。手形の裏面に署名して相手に渡します。裏書した側は手形の支払い保証義務（遡及債務）が残ります。' },
    { term:'手形の割引', en:'Discounting Notes', def:'受取手形を期日前に銀行等で<strong>現金化すること</strong>です。残存期間分の割引料（手形売却損）が差し引かれます。急いで現金が必要なときに使います。' },
    { term:'不渡り', en:'Dishonor', def:'手形の期日に銀行に呈示したが、<strong>振出人の口座残高不足等で決済されなかった</strong>状態です。不渡りを2回起こすと銀行取引停止（事実上の倒産）になります。受け取った側は受取手形→不渡手形に振り替えます。' },
    { term:'電子記録債権・債務', en:'Electronic Receivables/Payables', def:'でんさいネット（電子債権記録機関）に登録した<strong>デジタルの債権・債務</strong>です。手形と同じ機能を電子化したもので、紛失・盗難がなく分割譲渡も可能です。近年急速に普及しています。' },
    { term:'クレジット売掛金', en:'Credit Card Receivable', def:'クレジットカード払いで売り上げたとき、<strong>カード会社からまだ入金されていない代金</strong>を記録する科目です。通常の売掛金と区別して管理します。入金時に手数料（支払手数料）が引かれます。' },
  ]},
  { category:'⑦ 固定資産・減価償却', items:[
    { term:'有形固定資産', en:'Tangible Fixed Assets', def:'<strong>形のある長期使用の資産</strong>で、建物・機械・車両・土地などが該当します。土地以外は使用とともに価値が減少するため、毎期減価償却して費用化します。' },
    { term:'無形固定資産', en:'Intangible Fixed Assets', def:'<strong>形はないが法律上の権利・価値を持つ長期資産</strong>です。特許権・ソフトウェア・のれんなどが該当します。有形固定資産と同様に、耐用年数で均等償却します。' },
    { term:'取得原価', en:'Acquisition Cost', def:'固定資産を取得するためにかかった<strong>すべての費用（購入代金＋附随費用）</strong>です。附随費用には運送費・据付費・試運転費などが含まれます。これが減価償却の出発点となる金額です。' },
    { term:'帳簿価額', en:'Book Value', def:'固定資産の<strong>「取得原価－減価償却累計額」で計算される現在の帳簿上の価値</strong>です。「簿価」とも呼ばれます。売却・除却時の損益計算の基準になります。' },
    { term:'耐用年数', en:'Useful Life', def:'固定資産が使用に耐えられると見込まれる<strong>年数</strong>です。税法で固定資産の種類ごとに定められており（法定耐用年数）、これをもとに減価償却額を計算します。' },
    { term:'定額法', en:'Straight-line Method', def:'取得原価から残存価額を引いた額を耐用年数で割り、<strong>毎年同額を減価償却</strong>する方法です。シンプルで計算しやすく、建物・ソフトウェアなどに多く使われます。' },
    { term:'定率法', en:'Declining Balance Method', def:'毎年の期首帳簿価額（未償却残高）に<strong>一定率をかけて減価償却</strong>する方法です。初期に償却額が多く、年々減少します。機械・車両などに使われます。' },
    { term:'間接法', en:'Indirect Method (Depreciation)', def:'減価償却を「<strong>減価償却費（費用）／減価償却累計額（評価勘定）</strong>」と仕訳する方法です。固定資産の取得原価を帳簿に残しつつ、累計額を別に管理します。貸借対照表での表示はわかりやすいです。' },
    { term:'資本的支出', en:'Capital Expenditure', def:'固定資産の<strong>価値や耐用年数を増加させる改良・増設工事</strong>の支出です。固定資産の取得原価に加算して資産計上します。「収益的支出（修繕費）」との区別が重要な試験頻出テーマです。' },
    { term:'収益的支出', en:'Revenue Expenditure', def:'固定資産を<strong>現状に維持・回復するための修繕費用</strong>です。修繕費（費用）として計上します。現状を超えた改良は「資本的支出」になります。' },
    { term:'ファイナンス・リース', en:'Finance Lease', def:'実質的に<strong>資産を分割払いで購入するのと同様のリース契約</strong>です。「リース資産（資産）／リース債務（負債）」として帳簿計上し、毎期減価償却します。' },
    { term:'オペレーティング・リース', en:'Operating Lease', def:'通常の<strong>賃貸借と同様に扱うリース契約</strong>です。資産計上せず、支払うたびに「支払リース料（費用）」として計上します。車のカーリースなどが典型例です。' },
    { term:'圧縮記帳', en:'Compression Entry', def:'国庫補助金や保険差益で固定資産を取得した際、<strong>帳簿価額を圧縮（減額）して課税を将来に繰り延べる処理</strong>です。「固定資産圧縮損（費用）」を計上して取得価額を下げます。' },
  ]},
  { category:'⑧ 有価証券', items:[
    { term:'売買目的有価証券', en:'Trading Securities', def:'<strong>短期的な値上がり益を狙って保有</strong>する株式・債券です。<mark>期末に時価評価</mark>し、差額を「有価証券評価益・損（損益）」として計上します（洗替法）。' },
    { term:'満期保有目的債券', en:'Held-to-maturity Securities', def:'<strong>満期まで保有し続けることを目的とした債券</strong>です。時価評価は行わず「償却原価法」を適用します。取得価額と額面の差額を満期まで少しずつ調整します。' },
    { term:'その他有価証券', en:'Available-for-sale Securities', def:'売買目的でも満期保有目的でも子会社株式でもない<strong>長期保有目的の株式・債券</strong>です。期末に時価評価し、差額は損益でなく純資産「その他有価証券評価差額金」に計上します。' },
    { term:'洗替法', en:'Mark-to-Market (Reset Method)', def:'売買目的有価証券の期末評価差額を計上した後、<strong>翌期首に帳簿価額を元の取得原価に戻す（洗い替える）</strong>方法です。毎期ゼロからスタートするため差額管理がシンプルです。' },
    { term:'切放法', en:'Cost Retention Method', def:'期末評価差額を翌期に戻さず<strong>そのまま据え置く方法</strong>です。洗替法と対比して覚えましょう。切放法は売買目的有価証券では認められません。' },
    { term:'償却原価法', en:'Amortized Cost Method', def:'取得価額と額面価額の差額を<strong>満期まで毎期均等に調整していく方法</strong>です。満期保有目的債券に適用します。額面より低く買った場合（割引発行）は毎期帳簿価額が増加します。' },
  ]},
  { category:'⑨ 引当金・評価勘定', items:[
    { term:'引当金', en:'Allowance / Reserve', def:'<strong>将来の費用・損失をあらかじめ見積もって当期に計上</strong>した負債または資産の控除項目です。発生主義の考え方に基づきます。4要件：①将来の費用等、②当期以前原因、③発生可能性大、④合理的見積もり可能。' },
    { term:'評価勘定', en:'Valuation Account', def:'資産や負債の<strong>帳簿価額をマイナス調整するための対照勘定</strong>です。貸倒引当金（売掛金のマイナス）・減価償却累計額（固定資産のマイナス）が代表例です。間接控除法では資産から直接引かず評価勘定を使って表示します。' },
    { term:'差額補充法', en:'Allowance Adjustment Method', def:'引当金の残高と必要額の差額だけを<strong>追加計上（または取り崩し）する方法</strong>です。試算表の残高を確認して必要額との差を計上します。洗替法と対比して覚えましょう。' },
    { term:'洗替法（引当金）', en:'Full Reversal Method', def:'毎期まず既存の引当金残高を全額取り崩してゼロにし、<strong>そこから当期必要額を新たに計上する方法</strong>です。貸倒引当金でよく使われます。差額補充法より仕訳は多いです。' },
    { term:'退職給付引当金', en:'Retirement Benefit Obligation', def:'将来従業員に支払う退職金の<strong>見積もり額を毎期積み立てる負債</strong>です。退職給付費用（費用）と対になり、実際に退職金を払ったとき取り崩します。' },
  ]},
  { category:'⑩ 資本・株式', items:[
    { term:'純資産', en:'Net Assets / Equity', def:'<strong>資産から負債を差し引いた、会社が実質的に所有している財産</strong>です。「資本」「自己資本」とも呼ばれます。資本金・資本準備金・利益準備金・剰余金・自己株式などで構成されます。' },
    { term:'法定準備金', en:'Legal Reserve', def:'会社法で積み立てが義務付けられている準備金です。<strong>資本準備金（出資関連）</strong>と<strong>利益準備金（配当関連）</strong>の2種類があります。どちらも損失補填・資本組入れ以外には使えません。' },
    { term:'任意積立金', en:'Voluntary Reserve', def:'法律上の義務ではなく<strong>会社が自由に目的を決めて積み立てる剰余金の留保</strong>です。別途積立金・新築積立金などが該当します。株主総会の決議で設定・取り崩しができます。' },
    { term:'自己株式', en:'Treasury Stock', def:'自社が発行した株式を市場から<strong>買い戻した株式（金庫株）</strong>です。純資産のマイナスとして貸借対照表に計上します。再発行（処分）や消却が可能です。' },
    { term:'新株予約権', en:'Stock Warrants', def:'将来<strong>一定価格で株式を購入できる権利</strong>です。ストックオプション（役員・従業員向け）や転換社債型新株予約権付社債で使われます。発行時は純資産に計上します。' },
    { term:'株主資本', en:'Shareholders\' Equity', def:'純資産のうち<strong>資本金・資本剰余金・利益剰余金・自己株式で構成される部分</strong>です。新株予約権・その他有価証券評価差額金は株主資本には含まれません。' },
    { term:'配当', en:'Dividend', def:'会社の利益の一部を<strong>株主に分配するお金</strong>です。株主総会で決議され、決議後に未払配当金（負債）を計上し、支払時に消去します。同時に利益準備金の積み立ても行います。' },
    { term:'増資', en:'Capital Increase', def:'新しく株式を発行して<strong>出資金を集め、資本金を増やすこと</strong>です。払込金額のうち最大半分まで資本準備金にできます（残りは資本金）。' },
  ]},
  { category:'⑪ 決算整理', items:[
    { term:'発生主義', en:'Accrual Basis', def:'<strong>現金の受払いに関係なく、取引が発生した時点で収益・費用を認識する</strong>会計原則です。12月に仕事をして翌1月に入金でも、収益は12月に計上します。日本の企業会計の基本原則です。' },
    { term:'現金主義', en:'Cash Basis', def:'<strong>実際に現金を受け取ったとき収益、払ったとき費用を認識</strong>する方法です。個人の家計や小規模事業向けです。企業会計では原則として発生主義が使われます。' },
    { term:'費用収益対応の原則', en:'Matching Principle', def:'<strong>収益に対応する費用を同じ会計期間に計上する</strong>原則です。例えば商品の仕入コストは「その商品が売れた期」に売上原価として計上します（期ずれ防止）。' },
    { term:'前払費用', en:'Prepaid Expenses', def:'来期以降の費用を当期に先払いした場合、<strong>来期分を資産に振り替えた金額</strong>です。決算整理で計上し、来期に費用に戻します。保険料・地代の前払いが典型例です。' },
    { term:'前受収益', en:'Deferred Revenue', def:'来期以降の収益を当期に先もらいした場合、<strong>来期分を負債に振り替えた金額</strong>です。「まだサービスを提供していない義務」として計上します。' },
    { term:'未払費用', en:'Accrued Expenses', def:'当期に発生している費用だが、まだ支払っていない分を<strong>負債として計上</strong>します。給料・利息などの当期発生未払い分が対象です。' },
    { term:'未収収益', en:'Accrued Revenue', def:'当期に稼いでいる収益だが、まだ受け取っていない分を<strong>資産として計上</strong>します。家賃・利息などの当期発生未収分が対象です。' },
    { term:'継続性の原則', en:'Consistency Principle', def:'一度採用した会計方針（評価方法・償却方法など）を<strong>みだりに変更してはならない</strong>という原則です。変更すると過去との比較ができなくなり、恣意的な利益操作につながります。' },
    { term:'保守主義の原則', en:'Conservatism Principle', def:'<strong>利益は控えめに、損失は早めに認識する</strong>という原則です。在庫の低価法評価・引当金の積み立てなどがこの原則に基づいています。' },
    { term:'重要性の原則', en:'Materiality Principle', def:'<strong>金額の重要性が低い項目は簡便な処理でよい</strong>という原則です。例えば少額の固定資産を一括で費用計上したり、端数の前払費用を調整しないなどが許されます。' },
    { term:'繰延資産', en:'Deferred Assets', def:'すでに支出されたが<strong>将来にわたって費用化する特殊な資産</strong>です。創立費・開業費・株式交付費・社債発行費の4種が主なものです。5年以内（または3年以内）に均等償却します。' },
  ]},
  { category:'⑫ 税金', items:[
    { term:'消費税（税込処理）', en:'Tax Inclusive Method', def:'本体価格と消費税を<strong>まとめて一つの科目で記録する方法</strong>です。仕訳がシンプルですが、決算時に消費税分を調整する必要があります。' },
    { term:'消費税（税抜処理）', en:'Tax Exclusive Method', def:'<strong>本体価格と消費税を別々に記録する方法</strong>です。仕入時は仮払消費税（資産）、売上時は仮受消費税（負債）を計上し、差額を税務署に納めます。3級の標準的な処理方法です。' },
    { term:'税効果会計', en:'Tax Effect Accounting', def:'会計上の利益と税法上の課税所得の<mark>ズレを繰延税金資産・負債で調整する処理</mark>です。税金費用を当期純利益に正しく対応させるための会計技術です。2級の重要論点です。' },
    { term:'一時差異', en:'Temporary Difference', def:'税効果会計で、<strong>会計と税法の認識のズレが将来解消される差異</strong>です。繰延税金資産（将来節税）や繰延税金負債（将来納税増加）が計上されます。' },
    { term:'法人税の中間申告', en:'Interim Tax Filing', def:'法人税は年1回確定申告しますが、<strong>期中に前年実績の50%を先払いする「中間申告・中間納付」</strong>の制度があります。先払い分は「仮払法人税等（資産）」に計上し、確定申告で精算します。' },
  ]},
  { category:'⑬ 伝票会計', items:[
    { term:'入金伝票', en:'Receipt Voucher', def:'<strong>現金の受け取りを記録する伝票</strong>です。入金伝票では借方が必ず「現金」になります。' },
    { term:'出金伝票', en:'Payment Voucher', def:'<strong>現金の支払いを記録する伝票</strong>です。出金伝票では貸方が必ず「現金」になります。' },
    { term:'振替伝票', en:'Transfer Voucher', def:'<strong>現金以外の取引を記録する伝票</strong>です。掛け取引・手形取引・振替処理などに使います。' },
    { term:'仕訳日計表', en:'Daily Summary Journal', def:'3種の伝票を集計して<strong>1日分の仕訳をまとめた表</strong>です。ここから元帳への転記を行います。多拠点・多取引の会社で効率的に記帳できます。' },
  ]},
  { category:'⑭ 本支店会計', items:[
    { term:'本支店会計', en:'Head Office / Branch Accounting', def:'本社と支店が<strong>それぞれ独立した帳簿を持ち、別々に仕訳を記録する方法</strong>です。本社の帳簿には「支店（資産）」、支店の帳簿には「本店（純資産的科目）」が生じます。決算時に合算して合計財務諸表を作成します。' },
    { term:'内部取引の消去', en:'Elimination of Internal Transactions', def:'本支店合算決算で、<strong>本社の「支店」勘定と支店の「本店」勘定を相殺消去する処理</strong>です。内部取引を消去しないと、資産・利益が二重計上されます。' },
    { term:'未達取引', en:'In-transit Transactions', def:'本社が処理したが<strong>支店にまだ連絡・到達していない取引</strong>（または逆）です。合算決算前に支店側で未達分の仕訳を追加して残高を合わせます。' },
  ]},
  { category:'⑮ 工業簿記・原価計算', items:[
    { term:'原価計算', en:'Cost Accounting', def:'製品1つあたりの<strong>製造原価を計算する仕組み</strong>です。材料費・労務費・製造間接費の3要素に分けて集計します。原価を正確に把握することで適切な価格設定・利益管理ができます。' },
    { term:'原価の3要素', en:'Three Cost Elements', def:'製造原価を構成する<strong>①材料費（物にかかるコスト）・②労務費（人にかかるコスト）・③製造間接費（その他の製造コスト）</strong>の3種類です。これらが仕掛品に集まり製品へ移ります。' },
    { term:'直接費', en:'Direct Costs', def:'<strong>特定の製品に直接割り当てられる費用</strong>です。直接材料費（主要材料）・直接労務費（直接工の賃金）が代表例です。仕掛品に直接集計します。' },
    { term:'間接費', en:'Indirect Costs', def:'<strong>複数の製品に共通してかかるため直接割り当てられない費用</strong>です。補助材料・間接工賃金・工場の電力代・減価償却費などです。製造間接費として集計し、配賦で各製品に配分します。' },
    { term:'配賦', en:'Cost Allocation', def:'製造間接費を<strong>一定の基準（配賦基準）で各製品に割り振る計算</strong>です。「製造間接費÷配賦基準合計×各製品の基準値」で計算します。直接作業時間・機械時間・直接材料費などが配賦基準として使われます。' },
    { term:'予定配賦', en:'Predetermined Allocation', def:'実際の間接費集計を待たずに<strong>あらかじめ定めた予定配賦率で間接費を配賦する方法</strong>です。「予定配賦率＝予算間接費÷予算配賦基準」で求めます。期中に迅速に原価計算できます。' },
    { term:'配賦差異', en:'Allocation Variance', def:'予定配賦額と実際間接費の差額です。<strong>実際 > 予定 → 不利差異（借方）、実際 < 予定 → 有利差異（貸方）</strong>となります。期末に売上原価・仕掛品・製品に按分または一括処理します。' },
    { term:'個別原価計算', en:'Job Order Costing', def:'<strong>製品1件ごと（オーダーごと）に原価を集計する方法</strong>です。建設業・印刷業・造船業など受注生産に向いています。製造指図書（オーダー）ごとに原価を集計します。' },
    { term:'総合原価計算', en:'Process Costing', def:'<strong>大量生産の場合に、一定期間の製造コストを全生産量で割って単位原価を求める方法</strong>です。食品・化学・自動車部品などの規格品大量生産に向いています。月末仕掛品の完成品換算が重要です。' },
    { term:'標準原価計算', en:'Standard Costing', def:'<strong>あらかじめ設定した目標原価（標準原価）と実際原価を比較して差異を分析する方法</strong>です。コスト管理・業績評価・予算編成に役立ちます。差異分析（価格差異・数量差異・能率差異・操業度差異）が核心です。' },
    { term:'不利差異', en:'Unfavorable Variance', def:'標準原価計算で<strong>実際原価が標準原価を上回った差額</strong>です。「借方差異」とも呼ばれます。コストオーバーの状態でコスト削減が必要なことを示します。' },
    { term:'有利差異', en:'Favorable Variance', def:'標準原価計算で<strong>実際原価が標準原価を下回った差額</strong>です。「貸方差異」とも呼ばれます。コストセービングを意味しますが、品質低下の原因になることもあるため注意が必要です。' },
    { term:'CVP分析', en:'Cost-Volume-Profit Analysis', def:'<strong>売上高・費用・利益の関係を分析する手法</strong>です。固定費・変動費に分けて損益分岐点（売上ゼロ利益となる売上高）を求めます。「いくら売れば黒字になるか」がわかります。' },
    { term:'損益分岐点', en:'Break-even Point', def:'<strong>売上高と総費用が等しくなり、利益がゼロになる売上高</strong>です。「固定費÷（1－変動費率）」で計算します。これ以上売れば黒字、以下なら赤字です。' },
    { term:'貢献利益', en:'Contribution Margin', def:'<strong>売上高から変動費だけを引いた利益</strong>です。「変動費を回収して固定費・利益にあてられる金額」です。貢献利益÷売上高＝貢献利益率（限界利益率）とも呼ばれます。' },
    { term:'直接原価計算', en:'Variable Costing', def:'<strong>変動製造原価だけを製品原価に含め、固定製造原価は期間費用として即時計上</strong>する原価計算です。全部原価計算との違いは固定費の扱い方です。利益が在庫量に左右されにくく、意思決定に役立ちます。' },
    { term:'全部原価計算', en:'Absorption Costing', def:'<strong>固定費も変動費も含めたすべての製造原価を製品原価に含める</strong>方法です。財務会計（外部報告）では全部原価計算が義務づけられています。直接原価計算との営業利益の差は「固定費調整」で解消します。' },
    { term:'固定費調整', en:'Fixed Cost Adjustment', def:'直接原価計算の営業利益と全部原価計算の営業利益のズレを修正する計算です。<strong>「期末在庫×固定費率」－「期首在庫×固定費率」</strong>を直接原価計算の利益に加算すると全部原価計算の利益になります。' },
    { term:'製造原価報告書', en:'Cost of Production Report', def:'工業簿記の財務諸表の一つで、<strong>当期に発生した材料費・労務費・製造間接費の内訳と当期製品製造原価</strong>を示す報告書です。損益計算書の「売上原価」の内訳書に相当します。' },
    { term:'当期製品製造原価', en:'Cost of Goods Manufactured', def:'当期に<strong>完成した製品にかかった原価の合計</strong>です。「期首仕掛品＋当期総製造費用－期末仕掛品」で計算します。損益計算書の売上原価計算に使います。' },
    { term:'完成品換算量', en:'Equivalent Units', def:'総合原価計算で、<strong>仕掛品（製造中の品）を完成品に換算した数量</strong>です。例えば50%完成品100個は完成品換算量50個。加工費は進捗度で換算し、材料費は投入タイミングで扱いが変わります。' },
    { term:'月末仕掛品の評価', en:'Valuation of WIP (End)', def:'総合原価計算で期末に残っている仕掛品に原価を割り当てる作業です。<strong>平均法（全体の平均単価で配分）</strong>と<strong>先入先出法（先に投入分を先に完成とみなす）</strong>の2種類があります。' },
    { term:'等級別総合原価計算', en:'Grade-based Process Costing', def:'同じ工程で<strong>サイズや品質の異なる製品（等級品）</strong>を製造する場合の原価計算です。等価係数（品質・サイズに応じた重み付け）を使って各等級製品に原価を配分します。' },
    { term:'組別総合原価計算', en:'Batch Process Costing', def:'同じ工場で<strong>種類の異なる製品（組）を同時に製造</strong>する場合の原価計算です。直接費は各組に直接計上し、間接費は配賦基準で各組に配分します。' },
  ]},
  { category:'⑯ 特殊商品売買・収益認識', items:[
    { term:'収益認識基準', en:'Revenue Recognition Standard', def:'<mark>「履行義務を充足したとき（約束した財・サービスを顧客に移転したとき）に収益を計上する」</mark>という新しいルール（ASC606/IFRS15準拠）です。契約→履行義務の識別→取引価格の配分→収益計上の5ステップで処理します。' },
    { term:'履行義務', en:'Performance Obligation', def:'顧客との契約で<strong>財またはサービスを移転する約束</strong>です。収益認識では「履行義務が充足された時点」で収益を計上します。一時点での充足（商品引渡し）と一定期間での充足（サービス提供）があります。' },
    { term:'委託販売', en:'Consignment Sales', def:'商品を第三者（受託者）に預けて<strong>代わりに販売してもらう取引</strong>です。委託者は売上計上を「受託者が売った時点」まで遅らせます。売れ残りは委託者の資産として残ります。' },
    { term:'受託販売', en:'Sales on Consignment', def:'<strong>他者（委託者）から預かった商品を代わりに販売する</strong>取引です。受託者は売上を自社の収益にせず、販売代金を委託者に渡し、手数料だけを収益にします。' },
    { term:'試用販売', en:'Trial Sales (Sale on Approval)', def:'顧客に商品を試しに使ってもらい、<strong>買取意思表示があったときに売上を計上</strong>する販売方法です。試用期間中は「試送品（資産）」として記録し、承諾時に売上に振り替えます。' },
    { term:'割賦販売', en:'Installment Sales', def:'代金を<strong>分割払い（月々払い）で受け取る販売方法</strong>です。現行基準では引渡し時点で売上全額を計上します（回収基準は原則不可）。未回収分は「割賦売掛金（資産）」で管理します。' },

const APX_TYPE_INFO = {
  asset:      { name:'資産 (Assets)',              sub:'会社が持っているもの・もらえる権利' },
  liability:  { name:'負債 (Liabilities)',          sub:'将来払わなければならない義務・借金' },
  expense:    { name:'費用 (Expenses)',             sub:'お金を使ったとき・価値が減ったとき' },
  revenue:    { name:'収益 (Revenue)',              sub:'お金が増えたとき・稼いだとき' },
  equity:     { name:'純資産 (Equity)',             sub:'本当に自分のものの総額（資産－負債）' },
  other:      { name:'評価勘定・その他 (Other)',    sub:'固定資産・売掛金のマイナス調整など' },
  industrial: { name:'工業簿記 (Industrial)',       sub:'製造業の原価計算で使う勘定科目' },
};

function buildApxContent(){
  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  ACCT_DATA.forEach(([name, en, note, lv]) => {
    const type = T[name] || 'other';
    byType[type].push({ name, en, note, lv });
  });
  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(({ name, en, note, lv }) =>
      `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}">
        <div class="apx-row-top">
          <span class="tag ${type}">${name}</span>
          <span class="apx-en">(${en})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
        </div>
        <div class="apx-note">${note}</div>
      </div>`
    ).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  // 工業簿記
  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note]) => {
      const type = T[name] || 'other';
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="tag ${type}">${name}</span>
          <span class="apx-en">(${en})</span>
          <span class="apx-lv ind">工業</span>
        </div>
        <div class="apx-note">${note}</div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  // 用語解説集
  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-term-text">${term}</span> <span class="gloss-en">(${en})</span></div>
          <div class="gloss-def">${def}</div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  return commercialHtml + indHtml + glossHtml;
}

let apxCurrentTab = 'all';

function showApx(){
  const el = document.getElementById('apx-overlay');
  if(!document.getElementById('apx-content').innerHTML)
    document.getElementById('apx-content').innerHTML = buildApxContent();
  el.classList.add('show');
  apxCurrentTab = 'all';
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'all'));
  applyApxFilter('all');
}
function hideApx(){ document.getElementById('apx-overlay').classList.remove('show'); }

function setApxTab(type){
  apxCurrentTab = type;
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  applyApxFilter(type);
}

function toggleHideNames(){
  const btn = document.getElementById('apx-hide-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('names-hidden', nowActive);
  btn.textContent = nowActive ? '👁 科目名を表示' : '👁 科目名を隠す';
}

function toggleHideEnglish(){
  const btn = document.getElementById('apx-hide-en-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('en-hidden', nowActive);
  btn.textContent = nowActive ? '🔤 英語を表示' : '🔤 英語を隠す';
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category !== 'industrial';
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else if(tab === 'level3' || tab === 'level2') typeMatch = category !== 'industrial';
    else typeMatch = (type === tab && category !== 'industrial');

    if(!typeMatch){ sec.style.display = 'none'; return; }

    if(tab === 'level3' || tab === 'level2'){
      const targetLevel = tab === 'level3' ? '3' : '2';
      let anyVisible = false;
      sec.querySelectorAll('.apx-row').forEach(row => {
        const match = row.dataset.level === targetLevel;
        row.classList.toggle('hidden', !match);
        if(match) anyVisible = true;
      });
      sec.style.display = anyVisible ? '' : 'none';
    } else {
      sec.style.display = '';
      sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
    }
  });
}

  { id:56, cat:'貸倒',

  { id:68, cat:'伝票',
    q:'3伝票制を採用している会社で、商品2,000円を仕入れ、うち500円を現金で支払い、残り1,500円は掛けにした。何枚の伝票に分けて起票するか。それぞれの内容と合算した仕訳を示せ。',
    ans_html:`<div class="tbl-sec">起票する伝票（2枚）</div><table><thead><tr><th>伝票の種類</th><th>借方</th><th>貸方</th></tr></thead><tbody><tr><td class="hl">①出金伝票</td><td>仕入　500</td><td>（現金　500）省略</td></tr><tr><td class="hl">②振替伝票</td><td>仕入　1,500</td><td>買掛金　1,500</td></tr></tbody></table><div class="tbl-sec">2枚を合算した仕訳</div><table><tbody><tr><td>（借方）仕入　2,000</td><td>（貸方）現金　500</td></tr><tr><td></td><td>（貸方）買掛金　1,500</td></tr></tbody></table><div class="formula-box">現金払い部分 → 出金伝票　／　掛け部分 → 振替伝票　／　2枚を合算すると元の仕訳に戻る</div>`,
    exp:'現金と掛けが混ざった取引は「現金部分→出金伝票」「掛け部分→振替伝票」の2枚に分けて起票します。なぜ分けるかというと、入金・出金伝票のルールは「相手科目（貸方または借方）が必ず現金」だからです。掛け部分には現金が絡まないので、別の振替伝票にしなければなりません。2枚の伝票を合算すると元の仕訳（仕入2,000 ／ 現金500・買掛金1,500）にちゃんと戻ります。' },
  { id:69, cat:'伝票',
    q:'3伝票制で次の3枚の伝票が起票された。①入金伝票：売掛金200円 ②出金伝票：消耗品費300円 ③振替伝票：仕入500円／買掛金500円。それぞれ仕訳に直せ。また当日の現金の純増減額はいくらか。',
    ans_html:`<div class="tbl-sec">伝票 → 仕訳の変換</div><table><thead><tr><th>伝票</th><th>借方</th><th>貸方</th></tr></thead><tbody><tr><td class="hl">①入金伝票（売掛金200）</td><td>現金　200</td><td>売掛金　200</td></tr><tr><td class="hl">②出金伝票（消耗品費300）</td><td>消耗品費　300</td><td>現金　300</td></tr><tr><td class="hl">③振替伝票</td><td>仕入　500</td><td>買掛金　500</td></tr></tbody></table><div class="formula-box">現金の動き：①入金＋200　②出金△300　③振替伝票は現金に影響なし　→　当日の現金純増減＝200－300＝△100円（純減）</div>`,
    exp:'伝票を仕訳に戻す3つのルール：①入金伝票→「現金（借方）、伝票の科目（貸方）」②出金伝票→「伝票の科目（借方）、現金（貸方）」③振替伝票→「書いてある通りそのまま」。振替伝票は現金を使わない取引なので、現金残高には影響しません。入金・出金伝票だけが現金を動かします。複数の伝票を合算したものが帳簿への転記データになります。' },
  { id:70, cat:'経過勘定',

  { id:77, cat:'決算振替',

  { id:78, cat:'決算振替',

  { id:79, cat:'決算振替',

  { id:80, cat:'決算振替',

  { id:82, cat:'帳簿・精算表',

  { id:84, cat:'帳簿・精算表',

  { id:86, cat:'帳簿・精算表',

    ans_html: `<div class="tbl-sec">損益計算書（P/L）　単位：円</div><table><tbody><tr><td>売上高</td><td></td><td class="hl">800</td></tr><tr><td>　期首商品棚卸高</td><td>120</td><td></td></tr><tr><td>　当期商品仕入高</td><td>500</td><td></td></tr><tr><td>　合計</td><td>620</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>(130)</td><td></td></tr><tr><td>　売上原価</td><td></td><td>(490)</td></tr><tr class="total-row"><td class="hl">売上総利益（粗利益）</td><td></td><td class="hl">310</td></tr><tr><td>　給料</td><td></td><td>(280)</td></tr><tr class="total-row"><td class="hl">当期純利益</td><td></td><td class="hl">30</td></tr></tbody></table><div class="formula-box">売上総利益＝売上高－売上原価　　当期純利益＝売上総利益－販管費合計</div>`,

  { id:97, cat:'帳簿・精算表',
    q:'商品有高帳（先入先出法）：4/1残高@100×10個（計1,000円）、4/5仕入@130×20個（計2,600円）、4/10売上20個 のとき払出金額と期末残高を求めよ',
    ans_html: `<div class="tbl-sec">商品有高帳（先入先出法・FIFO）　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>受入<br>単価</th><th>受入<br>数量</th><th>受入<br>金額</th><th>払出<br>単価</th><th>払出<br>数量</th><th>払出<br>金額</th><th>残高<br>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>@100</td><td>10</td><td>1,000</td><td></td><td></td><td></td><td>1,000</td></tr><tr><td>4/5</td><td>仕入</td><td>@130</td><td>20</td><td>2,600</td><td></td><td></td><td></td><td>3,600</td></tr><tr><td>4/10</td><td>売上</td><td></td><td></td><td></td><td>@100</td><td>10</td><td>1,000</td><td></td></tr><tr><td></td><td>（続）</td><td></td><td></td><td></td><td>@130</td><td>10</td><td>1,300</td><td class="hl">1,300</td></tr><tr class="total-row"><td colspan="3">払出合計</td><td></td><td></td><td colspan="2">20個</td><td class="hl">2,300</td><td></td></tr></tbody></table><div class="formula-box">先入先出法：古い仕入（@100）から順に払い出す。期末残高は最新仕入単価（@130×10個）で構成される。</div>`,
    exp:'「古い商品から先に売れた」と考える計算方法です。先に仕入れた@100円の10個から売り、足りない分は後から仕入れた@130円から売るとします。20個売れたら（@100×10）＋（@130×10）＝2,300円が売上原価。残る10個は一番新しい@130円で評価されます。' },

  { id:98, cat:'帳簿・精算表',
    q:'商品有高帳（移動平均法）：4/1残高@100×10個（計1,000円）、4/5仕入@130×20個（計2,600円）、4/10売上20個 のとき払出金額と期末残高を求めよ',
    ans_html: `<div class="tbl-sec">商品有高帳（移動平均法）　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>受入<br>単価</th><th>受入<br>数量</th><th>受入<br>金額</th><th>払出<br>単価</th><th>払出<br>数量</th><th>払出<br>金額</th><th>残高<br>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>@100</td><td>10</td><td>1,000</td><td></td><td></td><td></td><td>1,000</td></tr><tr><td>4/5</td><td>仕入</td><td>@130</td><td>20</td><td>2,600</td><td></td><td></td><td></td><td class="hl">3,600</td></tr><tr><td></td><td>→平均単価</td><td class="hl" colspan="3">（1,000＋2,600）÷（10＋20）＝@120</td><td></td><td></td><td></td><td></td></tr><tr><td>4/10</td><td>売上</td><td></td><td></td><td></td><td class="hl">@120</td><td>20</td><td class="hl">2,400</td><td class="hl">1,200</td></tr></tbody></table><div class="formula-box">移動平均法：仕入れのたびに（残高金額＋受入金額）÷（残高数量＋受入数量）で平均単価を再計算する。</div>`,
    exp:'仕入れるたびに「1個あたりの平均値段」を計算し直す方法です。古い在庫と新しい仕入れを混ぜて割り算します。今回は（1,000円＋2,600円）÷30個＝@120円が新しい平均単価。20個売れたら@120×20＝2,400円が売上原価、残り10個は@120×10＝1,200円です。先入先出法（1,300円）と比べると期末在庫の評価が変わります。' },

  { id:99, cat:'帳簿・精算表',
    q:'帳簿の種類について、（　）に当てはまる言葉を答えよ。どの会社も必ず作る帳簿を【①　　　】といい、「仕訳帳」と「総勘定元帳」からなる。特定の内容を詳しく記録する帳簿を【②　　　】といい、現金出納帳・得意先元帳などがある。',
    ans_html: `<div class="tbl-sec">帳簿の分類</div><table><thead><tr><th>区分</th><th>帳簿名</th><th>役割</th></tr></thead><tbody><tr><td rowspan="2" class="hl">主要簿<br>（必須）</td><td>仕訳帳</td><td>すべての取引を日付順に仕訳記入</td></tr><tr><td>総勘定元帳</td><td>勘定科目ごとに分類・残高管理</td></tr><tr><td rowspan="5" class="hl">補助簿<br>（必要に応じ）</td><td>現金出納帳</td><td>現金の入出金があるとき</td></tr><tr><td>売掛金元帳（得意先元帳）</td><td>売掛金の増減があるとき（取引先別）</td></tr><tr><td>買掛金元帳（仕入先元帳）</td><td>買掛金の増減があるとき（仕入先別）</td></tr><tr><td>商品有高帳</td><td>商品の受入・払出があるとき</td></tr><tr><td>固定資産台帳</td><td>固定資産の取得・除却があるとき</td></tr></tbody></table><div class="tbl-sec">その他の主な補助簿</div><table><thead><tr><th>補助簿</th><th>記入タイミング</th></tr></thead><tbody><tr><td class="hl">当座預金出納帳</td><td>当座預金の入出金があるとき</td></tr><tr><td class="hl">売上帳・仕入帳</td><td>売上・仕入取引があるとき</td></tr><tr><td class="hl">受取手形記入帳</td><td>受取手形の取得・消滅があるとき</td></tr><tr><td class="hl">支払手形記入帳</td><td>支払手形の振出・消滅があるとき</td></tr></tbody></table>`,
    exp:'帳簿には2種類あります。①主要簿：全ての取引を日記みたいに書く「仕訳帳」と、科目ごとに集計する「総勘定元帳」です（どの会社も必ず作ります）。②補助簿：現金だけの帳簿や、お客さんごとの明細帳など、特定のことを詳しく記録する帳簿です（必要な分だけ作ります）。' },

  { id:100, cat:'帳簿・精算表',
    q:'試算表の種類について（　）に答えよ。①借方・貸方それぞれの合計を書くものを【ア　　　】という。②差し引き後の残高だけ書くものを【イ　　　】という。③両方を記入するものを【ウ　　　】という。現金（借方合計500・貸方合計200）の場合、残高はいくらか。',
    ans_html: `<div class="tbl-sec">試算表の種類と特徴</div><table><thead><tr><th>種類</th><th>借方に記入</th><th>貸方に記入</th><th>主な用途</th></tr></thead><tbody><tr><td class="hl">①合計試算表</td><td>借方合計</td><td>貸方合計</td><td>転記の正確性チェック</td></tr><tr><td class="hl">②残高試算表</td><td>借方残高</td><td>貸方残高</td><td>各勘定の純残高確認</td></tr><tr><td class="hl">③合計残高試算表</td><td>残高＋合計</td><td>合計＋残高</td><td>①②両方の機能を持つ</td></tr></tbody></table><div class="tbl-sec">合計残高試算表の記入例（現金：借方合計500・貸方合計200）</div><table><thead><tr><th colspan="2">借方</th><th>勘定科目</th><th colspan="2">貸方</th></tr><tr><th>残高</th><th>合計</th><th></th><th>合計</th><th>残高</th></tr></thead><tbody><tr><td class="hl">300</td><td>500</td><td>現金</td><td>200</td><td></td></tr></tbody></table><div class="formula-box">借方残高（300）＝借方合計500－貸方合計200　　試算表の借方合計＝貸方合計（貸借平均の原理）</div>`,
    exp:'試算表は「転記ミスがないか確認するための表」です。3種類あります。①合計試算表：左（借方）と右（貸方）それぞれの合計をそのまま書く。②残高試算表：差し引きした残高だけ書く。③合計残高試算表：①と②の両方を書く。どれも「借方合計＝貸方合計」になります。' },

  { id:101, cat:'帳簿・精算表',
    q:'帳簿の締め切りについて（　）に答えよ。①費用・収益勘定は決算時に【ア　　】勘定にまとめてゼロにする。②その差額（純利益）は【イ　　　　　　　】に振り替える。③資産・負債・純資産勘定は【ウ　　　】として翌期に引き継がれる。',
    ans_html: `<div class="tbl-sec">帳簿締め切りの手順</div><table><thead><tr><th>順序</th><th>対象勘定</th><th>締め切り方法</th></tr></thead><tbody><tr><td class="hl">①</td><td>費用勘定（仕入・給料等）</td><td>損益勘定の借方へ振替 → 費用勘定をゼロにする</td></tr><tr><td class="hl">②</td><td>収益勘定（売上・受取利息等）</td><td>損益勘定の貸方へ振替 → 収益勘定をゼロにする</td></tr><tr><td class="hl">③</td><td>損益勘定（集計勘定）</td><td>純利益→繰越利益剰余金へ振替 → 損益勘定をゼロにする</td></tr><tr><td class="hl">④</td><td>資産・負債・純資産勘定</td><td>残高を「次期繰越」として記入し帳簿を締め切る</td></tr></tbody></table><div class="tbl-sec">損益勘定のイメージ</div><table><thead><tr><th>損益（借方：費用）</th><th>損益（貸方：収益）</th></tr></thead><tbody><tr><td>仕入　490</td><td>売上　800</td></tr><tr><td>給料　280</td><td></td></tr><tr><td class="hl">当期純利益（→繰越利益剰余金）　30</td><td></td></tr><tr class="total-row"><td>合計　800</td><td>合計　800</td></tr></tbody></table>`,
    exp:'年末に帳簿をリセットする作業です。給料・売上などの費用・収益は「損益」という口座にまとめてゼロにし、差額（純利益）を純資産に移します。現金・建物などの資産・負債・純資産は消えずに「来年に繰り越し（次期繰越）」と書いて翌年のスタート残高になります。費用・収益はリセット、資産・負債は引き継ぎです。' },

  { id:102, cat:'帳簿・精算表',
    q:'精算表の修正記入：①期首商品100・期末商品150（売上原価算定）②未払給料30の計上 ③前払保険料20の繰延べ — の3件を精算表の修正記入欄に記入せよ',
    ans_html: `<div class="tbl-sec">精算表　修正記入欄の整理</div><table><thead><tr><th>整理内容</th><th>借方（修正）</th><th>貸方（修正）</th></tr></thead><tbody><tr><td>①しくり<br>（期首商品を仕入に加算）</td><td class="hl">仕入　100</td><td>繰越商品　100</td></tr><tr><td>①くりしわ<br>（期末商品を繰越商品に振替）</td><td class="hl">繰越商品　150</td><td>仕入　150</td></tr><tr><td>②未払給料の計上</td><td class="hl">給料　30</td><td>未払費用　30</td></tr><tr><td>③前払保険料の繰延べ</td><td class="hl">前払費用　20</td><td>支払保険料　20</td></tr><tr class="total-row"><td>修正合計</td><td>300</td><td>300</td></tr></tbody></table><div class="formula-box">修正記入欄の借方合計＝貸方合計（必ず均衡する）　　売上原価＝仕入残高＋100（期首）－150（期末）</div>`,
    exp:'精算表に3つの決算整理を書き込む作業です。①しくりくりし（在庫の確認）：期首商品を仕入に足して期末商品を引く。②まだ払っていない給料を費用に計上して「未払費用（負債）」も書く。③来年分の保険料を「前払費用（資産）」に移して今年の費用から除く。3つ書き終えると、修正欄の左合計と右合計が一致します。' },

  { id:103, cat:'帳簿・精算表',
    q:'伝票の種類について（　）に答えよ。3伝票制では①現金の入金→【ア】伝票、②現金の出金→【イ】伝票、③現金以外の取引→【ウ】伝票を使う。5伝票制ではさらに【エ】伝票と【オ】伝票が加わる。また代金の一部だけ現金で払った場合は何枚の伝票に分けて起票するか。',
    ans_html: `<div class="tbl-sec">伝票の種類</div><table><thead><tr><th>伝票</th><th>記入内容</th><th>3伝票制</th><th>5伝票制</th></tr></thead><tbody><tr><td class="hl">入金伝票</td><td>現金の入金取引</td><td>○</td><td>○</td></tr><tr><td class="hl">出金伝票</td><td>現金の出金取引</td><td>○</td><td>○</td></tr><tr><td class="hl">振替伝票</td><td>現金以外の取引（掛け等）</td><td>○</td><td>○</td></tr><tr><td class="hl">売上伝票</td><td>掛け売上取引</td><td>×</td><td>○</td></tr><tr><td class="hl">仕入伝票</td><td>掛け仕入取引</td><td>×</td><td>○</td></tr></tbody></table><div class="tbl-sec">一部現金取引の起票例（3伝票制）：備品250を現金50・当座預金200で購入</div><table><thead><tr><th>伝票種類</th><th>仕訳内容</th></tr></thead><tbody><tr><td class="hl">出金伝票</td><td>備品　50 ／ 現金　50</td></tr><tr><td class="hl">振替伝票</td><td>備品　200 ／ 当座預金　200</td></tr><tr class="total-row"><td>合算仕訳</td><td>備品　250 ／ 現金50・当座預金200</td></tr></tbody></table><div class="formula-box">伝票 → 仕訳集計表 → 総勘定元帳 の順に転記する</div>`,
    exp:'伝票は「仕訳を書く専用のメモ用紙」です。3伝票制では：現金が入ったとき→入金伝票、現金が出たとき→出金伝票、現金を使わない取引→振替伝票、の3種類に分けます。5伝票制はさらに掛け売上・掛け仕入専用の伝票が加わります。代金の一部だけ現金で払った場合は「現金の伝票」と「残りの伝票」の2枚に分けて起票します。' },

  // ===== 財務諸表読解 =====
  { id:104, cat:'財務諸表読解',
    q:'下記の「売掛金」総勘定元帳を読み、4月30日の次月繰越（月末残高）を求めよ。',
    q_html: `<div class="tbl-sec">売掛金　総勘定元帳（抜粋）　単位：円</div><table><thead><tr><th colspan="3">借　方</th><th colspan="3">貸　方</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>200,000</td><td>4/10</td><td>現金回収</td><td>150,000</td></tr><tr><td>4/5</td><td>売上（A商店）</td><td>100,000</td><td>4/18</td><td>返品（A商店）</td><td>20,000</td></tr><tr><td>4/20</td><td>売上（B商店）</td><td>80,000</td><td>4/30</td><td>次月繰越</td><td class="q-blank">？</td></tr><tr class="total-row"><td></td><td>合計</td><td>380,000</td><td></td><td>合計</td><td>380,000</td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">売掛金　総勘定元帳（抜粋）　単位：円</div><table><thead><tr><th colspan="3">借　方</th><th colspan="3">貸　方</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>200,000</td><td>4/10</td><td>現金回収</td><td>150,000</td></tr><tr><td>4/5</td><td>売上（A商店）</td><td>100,000</td><td>4/18</td><td>返品（A商店）</td><td>20,000</td></tr><tr><td>4/20</td><td>売上（B商店）</td><td>80,000</td><td>4/30</td><td class="hl">次月繰越</td><td class="hl">210,000</td></tr><tr class="total-row"><td></td><td>合計</td><td>380,000</td><td></td><td>合計</td><td>380,000</td></tr></tbody></table><div class="formula-box">次月繰越＝借方合計380,000－現金回収150,000－返品20,000＝210,000円</div>`,
    exp:'T字型の帳簿では、左（借方）の合計と右（貸方）の合計を必ず一致させます。差額を埋めるために「次月繰越」を書き込みます。残高の求め方：「左合計（380,000）から右の取引（回収150,000＋返品20,000）を引く＝210,000円」です。合計を揃えるための数字と実際の残高は別物なので区別しましょう。' },

  { id:105, cat:'財務諸表読解',
    q:'下記の損益計算書（P/L）の空欄（ア）売上総利益と（イ）当期純利益を求めよ。',
    q_html: `<div class="tbl-sec">損益計算書（自 令和X年4/1 至 令和X+1年3/31）　単位：円</div><table><tbody><tr><td>Ⅰ 売上高</td><td></td><td>1,200,000</td></tr><tr><td>Ⅱ 売上原価</td><td></td><td></td></tr><tr><td>　期首商品棚卸高</td><td>100,000</td><td></td></tr><tr><td>　当期商品仕入高</td><td>800,000</td><td></td></tr><tr><td>　合計</td><td>900,000</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>△120,000</td><td></td></tr><tr><td>　売上原価　計</td><td></td><td>△780,000</td></tr><tr class="total-row"><td>（ア）売上総利益</td><td></td><td class="q-blank">？</td></tr><tr><td>Ⅲ 販売費及び一般管理費</td><td></td><td></td></tr><tr><td>　給料</td><td>200,000</td><td></td></tr><tr><td>　支払家賃</td><td>120,000</td><td></td></tr><tr><td>　減価償却費</td><td>50,000</td><td></td></tr><tr><td>　貸倒引当金繰入</td><td>10,000</td><td></td></tr><tr><td>　費用合計</td><td></td><td>△380,000</td></tr><tr class="total-row"><td>（イ）当期純利益</td><td></td><td class="q-blank">？</td></tr></tbody></table>`,

  { id:106, cat:'財務諸表読解',

  { id:108, cat:'財務諸表読解',

  { id:109, cat:'財務諸表読解',
    q:'下記の残高試算表を読み、（ア）借入金の残高と（イ）試算表の貸方合計を求めよ。借方合計は1,500,000円である。',

    exp:'試算表最大の武器は「借方合計＝貸方合計（貸借平均の原理）」です。この法則を使えば、合計が既知なら未知の勘定残高を逆算できます。「貸方合計＝借方合計（1,500,000円）」なので、判明している金額を合計から引くと残りが求まります。試験では「空欄が1つ」の逆算問題がよく出ます。' },
