  '先入先出法': '商品を古いものから先に払い出す想定で在庫原価を計算する方法を【　　　　　　】という。\n例）商品仕入：@100円×10個（4/1）、@110円×10個（4/10）。4/15に12個払出し→先に入ったものから：100円×10個＋110円×2個＝1,220円。期末在庫8個は110円×8個＝880円（新しい単価）。\nポイント：【　　　】→古いものから先に払い出す想定。在庫は最新単価。インフレ時は期末在庫が高くなり利益も高くなりやすい（対：移動平均法）。',
  '移動平均法': '仕入のたびに在庫を平均単価で更新して払出原価を計算する方法を【　　　　　　】という。\n例）在庫@100円×10個＝1,000円の時に@110円×10個仕入→平均単価（1,000＋1,100）÷20個＝@105円。この105円で次の払出を計算。\nポイント：仕入のたびに平均単価を更新→「移動」平均。計算が手間だが単価が安定する。',
  '低価法': '棚卸資産を取得原価と期末時価を比較して低い方で評価する方法を【　　　　　　】という。\n例）商品の取得原価1,000円・期末正味売却価額800円→【　　　】適用→商品評価損200円（（1,000円－800円）×1個）。\nポイント：取得原価＞時価（正味売却価額）→時価まで切下げ（商品評価損を計上）。保守主義の原則から損失を早期認識。',
  '棚卸減耗損': '帳簿数量と実際数量の差（数量不足）に取得原価を乗じて計上する費用を【　　　　　　】という。\n例）帳簿在庫100個・実地棚卸95個→5個が不足。原価1,000円/個→【　　　】5,000円：（借）【　　　】5,000円 ／（貸）繰越商品5,000円。\nポイント：【　　　】＝「数量の差（紛失・盗難・自然損耗）」。商品評価損＝「単価の差（時価下落）」。この区別が重要。',
  '売上原価': '販売した商品・製品の仕入原価の合計を【　　　　　　】という。\n例）三分法：【　　　】＝期首繰越商品50万円＋当期仕入250万円－期末繰越商品30万円＝270万円。売上300万円－【　　　】270万円＝売上総利益30万円。\nポイント：「売れた商品の仕入原価の合計」。三分法では決算整理で確定。【　　　】対立法では販売のたびに確定。',
  '約束手形': '振出人が名宛人（受取人）に直接支払いを約束する2者間の手形を【　　　　　　】という。\n例）振出人A社が「3か月後に100万円支払います」と記載した手形をB社に渡す→A社：支払手形100万円（負債）、B社：受取手形100万円（資産）。満期日に当座預金から自動決済。\nポイント：【　　　】は「振出人が受取人に直接支払いを約束する」2者間の手形。為替手形（3者間）と区別する。',
  '為替手形': '振出人が第三者（名宛人）に支払いを命令する3者間の手形を【　　　　　　】という。\n例）A社（振出人）がB社（名宛人・引受人）に「C社への100万円をB社の当座預金から支払え」と命令する3者間の手形。A社：受取手形（またはすぐ裏書）、B社：支払手形（引受後）、C社：現金受取。\nポイント：【　　　】の登場人物→振出人・引受人（名宛人）・受取人の3者。引受時にB社が支払手形を計上。',
  '手形の裏書譲渡': '保有中の手形の裏面に署名して第三者に譲渡する手形決済手段を【　　　　　　】という。\n例）保有中の受取手形50万円を仕入代金の支払いとして仕入先に裏書譲渡：（借）仕入50万円 ／（貸）受取手形50万円。\nポイント：裏書譲渡＝手形の裏に署名して他者に渡すこと。受取手形が消滅→代わりに仕入（または買掛金等）を支払う。遡及請求リスクがあるが割引よりコスト低。',
  '手形の割引': '保有中の手形を満期前に金融機関に売却して資金化する手法を【　　　　　　】という。\n例）受取手形50万円を満期前に銀行で割引（売却）。割引料5,000円控除→49.5万円受取：（借）当座預金49.5万円・手形売却損5,000円 ／（貸）受取手形50万円。\nポイント：割引＝手形を満期前に銀行に売ること（資金化）。割引料が手形売却損（費用）。',
  '不渡り': '手形の満期日に振出人が支払を行えなかった状態（決済不能）を【　　　　　　】という。\n例）受取手形50万円の満期日に振出人の口座残高不足→決済されず【　　　】→受取人は振出人に手形金額＋拒絶費用を請求可能。\nポイント：同一業者が6か月以内に2回【　　　】を出すと銀行取引停止（実質倒産）。不渡手形（資産）として管理し回収不能確定なら貸倒損失へ。',
  '電子記録債権・債務': '電子記録機関への登録によって発生する電子的な金銭債権・債務を【　　　　　　】という。\n例）売掛金100万円を得意先と協議の上、電子記録に切替：（借）電子記録債権100万円 ／（貸）売掛金100万円。仕入側は：（借）買掛金100万円 ／（貸）電子記録債務100万円。\nポイント：電子記録債権（受取側）・電子記録債務（支払側）はセットで覚える。紙手形のデジタル版。',
  'クレジット売掛金': 'クレジットカード販売時にカード会社への請求権として計上する売上債権を【　　　　　　】という。\n例）商品1万円をクレジットカードで販売：（借）【　　　】1万円 ／（貸）売上1万円。後日カード会社から手数料3%引き9,700円入金：（借）普通預金9,700円・支払手数料300円 ／（貸）【　　　】1万円。\nポイント：相手方はカード会社（顧客ではない）。手数料は支払手数料（費用）。',
  '有形固定資産': '有形固定資産＝B/Sの固定資産欄に計上される「カタチのある」長期資産を【　　　　　　】という。\n例）建物・機械装置・車両運搬具・土地・備品など実体のある長期資産が【　　　】。毎期減価償却する（土地は例外）。\nポイント：有形→目に見える・触れる。無形（特許権・ソフトウェア等）と区別する。',
  '無形固定資産': '目に見えない知的財産権・ソフトウェア等を計上するB/S固定資産区分を【　　　　　　】という。\n例）特許権・実用新案権・商標権・ソフトウェア・のれんなど形がない長期資産。直接法で償却（累計額勘定なし）。\nポイント：無形→目に見えない・触れない。有形固定資産（建物・機械等）と区別。【　　　】を償却する際は直接法のみ（「減価償却累計額」勘定を使わない）。',
  '取得原価': '固定資産・棚卸資産等を取得した際の購入代金と付随費用を合わせた原始取得価額を【　　　　　　】という。\n例）機械の購入代金2,900万円＋設置費用100万円＝【　　　】3,000万円（付随費用も含む）。\nポイント：【　　　】＝購入代金＋付随費用（運送費・設置費・手数料等）。税込みか税抜きかは消費税処理方法による。',
  '帳簿価額': '固定資産等の取得原価から減価償却累計額等を差し引いた残高（会計上の価値）を【　　　　　　】という。\n例）建物：取得原価1,000万円・減価償却累計額300万円→【　　　】700万円（売却時の損益計算の基準）。\nポイント：【　　　】＝取得原価－減価償却累計額（有形固定資産の場合）。【　　　】と売却価格の差が売却損益。',
  '耐用年数': '固定資産が使用に耐えると見込まれる期間（減価償却の計算基礎）を【　　　　　　】という。\n例）パソコン（【　　　】4年・定額法）：取得原価20万円÷4年＝年5万円の減価償却費。税法上の【　　　】は省令で定められている（法定【　　　】）。\nポイント：法定【　　　】は資産の種類ごとに税法で規定。経済的【　　　】（実際使えると見込む期間）とは異なる場合がある。',
  '定額法': '取得原価を耐用年数で均等分割して毎期同額を費用計上する減価償却方法を【　　　　　　】という。\n例）取得原価100万円・耐用年数5年・残存価額ゼロ（現在の原則）：毎年20万円（100万円÷5年）の均等額を減価償却費として計上。5年後の帳簿価額はゼロ（または備忘価額1円）。\nポイント：【　　　】→毎年同額。定率法→初期に多く後半に少ない（逓減）。どちらを使うかは固定資産の種類・会社の方針による。',
  '定率法': '帳簿価額に一定率を乗じて毎期漸減する金額を費用計上する減価償却方法を【　　　　　　】という。\n例）取得原価100万円・償却率40%（2倍【　　　】等）：1年目40万円、2年目24万円（60万円×40%）、3年目14.4万円…と年々減少。\nポイント：【　　　】→初期に多く計上→初期の税負担を軽減できる。後期は少なくなる。建物附属設備・機械装置等に多く使われる（建物は定額法のみ）。',
  '間接法': '固定資産の帳簿価額を直接減らさず減価償却累計額勘定を使って間接的に控除する方法を【　　　　　　】という。\n例）備品（取得原価20万円）：（借）減価償却費5万円 ／（貸）備品減価償却累計額5万円。B/Sには「備品20万円・△減価償却累計額5万円＝帳簿価額15万円」と表示。\nポイント：【　　　】→取得原価をそのまま残し累計額勘定で控除表示→取得原価と蓄積した累計額が両方わかる。直接法→固定資産を直接減額→帳簿価額しかわからない。',
  '資本的支出': '固定資産の価値・耐用年数を高める改修・改良のための支出を【　　　　　　】という。\n例）工場の大規模改修（耐用年数延長・生産性向上）300万円：（借）建物300万円 ／（貸）現金300万円（固定資産に計上→将来にわたり減価償却）。\nポイント：【　　　】→固定資産として計上→将来の費用（減価償却で分割）。収益的支出→当期費用（修繕費等）として一括計上。「グレードアップ」が【　　　】、「現状回復」が収益的支出。',
  '収益的支出': '固定資産の現状維持・原状回復のための支出で当期費用に計上するものを【　　　　　　】という。\n例）雨漏りの応急修理30万円：（借）修繕費30万円 ／（貸）現金30万円（当期費用として一括計上）。\nポイント：【　　　】→当期費用（修繕費等）。資本的支出→固定資産計上（将来にわたり費用化）。「元に戻す」→【　　　】。「性能を上げる」→資本的支出。',
  'ファイナンス・リース': 'リース期間中の中途解約不能とフルペイアウトを満たすリース取引で「実質的に買ったも同然」として資産計上と減価償却が必要なものを【　　　　　　】という。\n例）5年間解約不可・支払総額300万円（利息相当30万円含む）のコピー機リース。仕訳①契約時：（借）リース資産270万円 ／（貸）リース債務270万円（元本相当）。仕訳②毎年の支払い（元本54万円＋利息6万円＝60万円）：（借）リース債務54万円＋支払利息6万円 ／（貸）現金60万円。仕訳③毎年の減価償却：（借）減価償却費54万円 ／（貸）リース資産54万円（270万円÷5年）。\nポイント：ファイナンスリース→「資産計上・債務計上・減価償却」の3点セット。オペレーティングリース→「支払リース料（費用）のみ」。解約不能＋フルペイアウトがファイナンスリースの2要件。',
  'オペレーティング・リース': 'ファイナンス・リースの要件（中途解約不能＋フルペイアウト）を満たさないリース取引で資産計上せず支払リース料のみを費用処理するものを【　　　　　　】という。\n例）1年更新で解約可能な複合機のリース月額3万円。1年36万円を費用計上するだけ。仕訳）月次：（借）支払リース料3万円 ／（貸）現金3万円。資産ゼロ・負債ゼロ・減価償却なし。\nポイント：ファイナンスリース→資産＋負債がB/Sに出てくる（オフバランスにならない）。オペレーティングリース→B/Sに計上されない（オフバランス）。',
  '圧縮記帳': '国庫補助金等を受けた際に固定資産の取得原価を補助金相当額だけ減額することで課税を将来の減価償却期間に分散させる税務上の処理を【　　　　　　】という。\n例）補助金3,000万円で5,000万円の設備取得。仕訳①補助金受取：（借）現金3,000万円 ／（貸）国庫補助金受贈益3,000万円。仕訳②固定資産取得：（借）機械5,000万円 ／（貸）現金5,000万円。仕訳③【　　　】：（借）固定資産圧縮損3,000万円 ／（貸）機械3,000万円（帳簿価額2,000万円に圧縮）→補助金収益と圧縮損が相殺されて当期課税ゼロ。以後2,000万円ベースで減価償却。\nポイント：【　　　】は「課税の繰延べ（免除ではない）」。減価償却が少なくなるため将来に課税所得が増える仕組み。',
  '減損会計': '固定資産の収益性が著しく低下し投資額を将来の収益で回収できない見込みになった場合に帳簿価額を回収可能価額まで切り下げる会計処理を【　　　　　　】という。\n例）工場（帳簿価額5億円）が不採算になり①正味売却価額3億円・②使用価値3.5億円と判定。回収可能価額＝max（3億円、3.5億円）＝3.5億円。仕訳）（借）減損損失1.5億円（5億円－3.5億円）／（貸）固定資産1.5億円（帳簿価額を3.5億円に切下げ）。以後3.5億円ベースで残存耐用年数にわたり減価償却。\nポイント：減損の判定手順①「減損の兆候（収益性の著しい低下等）」があるか→②「減損損失の認識（割引前CF＜帳簿価額）」か→③「回収可能価額まで切下げ（減損損失の測定）」。この3ステップが試験の核心。',
  '回収可能価額': '減損会計で固定資産の帳簿価額を切り下げる基準となる価額を【　　　　　　】という。\n例）工場について①正味売却価額（売ったら3億円）・②使用価値（将来CF現在価値3.5億円）→【　　　】＝max（3億円、3.5億円）＝3.5億円。\nポイント：【　　　】＝「正味売却価額」と「使用価値」のうち大きい方。帳簿価額をこの金額まで切り下げる（【　　　】が帳簿価額より低ければ減損損失計上）。',
  '売買目的有価証券': '短期的な売買差益を目的として保有する有価証券で期末に時価評価し評価差額を損益に計上するものを【　　　　　　】という。\n例）A株式を100万円で購入（売買目的）→期末時価120万円。仕訳①購入：（借）【　　　】100万円 ／（貸）現金100万円。仕訳②期末評価替え：（借）【　　　】20万円 ／（貸）有価証券評価益20万円（P/L計上）。翌期首の洗替仕訳：（借）有価証券評価益20万円 ／（貸）【　　　】20万円（取得原価に戻す）。\nポイント：【3区分比較】売買目的→時価評価・差額はP/L。満期保有目的→時価評価なし・償却原価法。その他有価証券→時価評価・差額はB/S純資産。この区分の暗記が最重要。',
  '満期保有目的債券': '満期まで保有する意図と能力を持って取得した社債などの債券で償却原価法で評価するものを【　　　　　　】という。\n例）額面100万円の社債を96万円で取得（4年満期保有予定）。差額4万円を4年で按分。仕訳）取得時：（借）【　　　】96万円 ／（貸）現金96万円。毎年度末（償却原価法）：（借）【　　　】1万円 ／（貸）有価証券利息1万円（4万円÷4年）。4年後：帳簿価額100万円で満期償還。\nポイント：満期保有目的は「時価がいくらでも評価替えしない」のが最大の特徴。取得価格と額面の差は「事実上の追加利息」→毎期受取利息に加算。試験では「償却原価法の計算」が必出。',
  'その他有価証券': '売買目的・満期保有目的以外の有価証券（投資目的等）で期末時価評価し評価差額を純資産に計上するものを【　　　　　　】という。\n例）取引先維持目的でC社株式30万円を購入（長期保有予定）→投資有価証券30万円（固定資産）。期末時価35万円：（借）投資有価証券5万円 ／（貸）繰延税金負債1.5万円・【　　　】評価差額金3.5万円（純資産直入）。\nポイント：【　　　】＝売買目的でも満期保有目的でもない有価証券。評価差額はP/Lを経由せず純資産へ直入（全部純資産直入法）。',
  '洗替法': '期末に評価替えした有価証券の評価差額を翌期首に元の取得原価へ戻す方法を【　　　　　　】という。\n例）取得原価1,000円の有価証券が期末時価1,200円。評価益200円を計上。仕訳①期末：（借）有価証券200円 ／（貸）有価証券評価益200円（P/L）。仕訳②翌期首（洗替え）：（借）有価証券評価益200円 ／（貸）有価証券200円（取得原価1,000円に戻す）。翌年末時価1,100円なら：評価益は100円（1,100－1,000）のみ認識。\nポイント：【　　　】→「毎期独立して時価と取得原価の差を計算」。切放法→「前期末時価をそのまま翌期の帳簿価額に引き継ぎ」。売買目的有価証券は【　　　】が原則。',
  '切放法': '期末評価後の時価をそのまま翌期以降の帳簿価額として引き継ぐ方法を【　　　　　　】という。\n例）取得原価1,000円→期末時価800円（評価損200円計上）→【　　　】なら800円が翌期の帳簿価額。仕訳①期末評価損：（借）有価証券評価損200円 ／（貸）有価証券200円（800円に切下げ）。翌期首：仕訳なし（800円が帳簿価額のまま）。翌年末時価750円なら：評価損は50円（750－800）のみ認識（前期の評価損200円は戻らない）。\nポイント：【　　　】→「低下したコストは戻らない」保守主義的方法。特に「その他有価証券」の評価損に適用される。洗替法（翌期首に戻し入れ）との違いを押さえる。',
  '償却原価法': '社債・債券を額面と異なる価額で取得した場合にその差額を利息として毎期均等に配分し帳簿価額を満期の額面に近づける方法を【　　　　　　】という。\n例）額面100万円の社債を96万円で取得・4年満期保有。差額4万円÷4年＝毎年1万円を受取利息に加算。仕訳①取得：（借）満期保有目的債券96万円 ／（貸）現金96万円。仕訳②毎年（利払い＋【　　　】）：（借）現金3万円（クーポン3%）＋満期保有目的債券1万円 ／（貸）受取利息4万円（名目3万円＋償却分1万円）。4年後：帳簿価額100万円で満期償還。\nポイント：割引取得→毎年帳簿価額が増加。プレミアム取得→毎年帳簿価額が減少。受取利息の金額が名目金額より多い（割引）または少ない（プレミアム）点が特徴。',
  '全部純資産直入法': 'その他有価証券の評価差額（評価益も評価損も）をすべて純資産に計上する方法を【　　　　　　】という。\n例）その他有価証券（取得原価100万円）が期末時価80万円（評価損20万円）。税率30%。仕訳（【　　　】）：（借）その他有価証券評価差額金14万円（純資産マイナス）＋繰延税金資産6万円（税効果） ／（貸）投資有価証券20万円（評価損）。P/Lには損益計上なし。B/Sの純資産が14万円減る。\nポイント：【　　　】→評価損益ともにP/Lをスルーして直接純資産へ。部分純資産直入法→評価益は純資産へ、評価損はP/Lへ（保守主義）。',
  '部分純資産直入法': 'その他有価証券の評価益は純資産に計上するが評価損は当期損失として処理する方法を【　　　　　　】という。\n例）その他有価証券（取得原価100万円）が期末時価80万円（評価損20万円）。税率30%。仕訳（【　　　】）：（借）投資有価証券評価損20万円（P/L費用）＋繰延税金資産6万円 ／（貸）投資有価証券20万円。法人税等調整額△6万円（節税効果）を計上。\nポイント：全部vs部分の違い→評価損をP/Lに出すか出さないか。部分法は「損は早めに認識（保守主義）」という考え方。どちらを使うかで当期利益が変わる点がポイント。',
  '引当金': '将来の特定の費用・損失に備えて当期に費用計上し負債として積み立てる勘定を【　　　　　　】という。\n例）賞与【　　　】：7月ボーナスの当期分を3月決算で先取り費用計上。製品保証【　　　】：アフターサービス費用の見込みを計上。貸倒【　　　】：回収不能の見込みを計上。退職給付【　　　】：将来の退職金の当期発生分を計上。【　　　】設定の4要件：①将来の特定費用・損失 ②発生が確実（高い確率） ③当期以前の事象による ④金額が合理的に見積もれる。\nポイント：4要件を全て満たさないと【　　　】設定不可。「偶発債務（確率が低い）」→注記にとどめる（【　　　】にはしない）。',
  '評価勘定': '固定資産等の帳簿価額を間接的に修正するためにB/Sで対象資産から控除表示される補助的な科目を【　　　　　　】という。\n例）売掛金1,000万円に対し貸倒引当金20万円→B/Sに「売掛金1,000万円・△貸倒引当金20万円＝980万円」と表示。貸倒引当金が「【　　　】」として売掛金から控除表示される。\nポイント：【　　　】は資産（または負債）の帳簿価額を調整するための補助的な科目。貸倒引当金・減価償却累計額が代表例。',
  '差額補充法': '引当金の期末残高が必要額に不足する場合に不足額のみを追加計上する方法を【　　　　　　】という。\n例）貸倒引当金の必要額20万円・現在残高8万円。【　　　】：不足額12万円だけ追加：（借）貸倒引当金繰入12万円 ／（貸）貸倒引当金12万円。洗替法なら：①（借）貸倒引当金8万円 ／（貸）貸倒引当金戻入8万円。②（借）貸倒引当金繰入20万円 ／（貸）貸倒引当金20万円。\nポイント：【　　　】→「足りない分だけ補充」→仕訳が少ない（実務向き）。洗替法→「全額取り崩してから再設定」→計算が明確。どちらを使うかを問題文で確認。',
  '洗替法（引当金）': '引当金の残高を翌期首に全額取り崩してから改めて必要額を計上し直す方法を【　　　　　　】という。\n例）前期末貸倒引当金10万円（洗替法）。翌期首洗替：（借）貸倒引当金10万円 ／（貸）貸倒引当金戻入10万円（全額取崩し→収益）。当期末に必要額15万円を再設定：（借）貸倒引当金繰入15万円 ／（貸）貸倒引当金15万円。P/L：貸倒引当金繰入15万円（費用）－貸倒引当金戻入10万円（収益）＝実質5万円の純費用増加。\nポイント：「洗替法」の問題では翌期首の「戻し入れ仕訳」を忘れないこと。差額補充法では戻し入れ仕訳は不要。試験では洗替法が多く出題される。',
  '退職給付引当金': '従業員の将来の退職給付支払義務のうち当期までに発生した分を見積もって積み立てる引当金を【　　　　　　】という。\n例）全従業員の退職給付債務（将来退職金の現在価値）10億円・年金資産（運用積立）7億円→【　　　】3億円（B/S負債）。当年度の退職給付費用500万円（①勤務費用300万円＋②利息コスト200万円）。仕訳①費用計上：（借）退職給付費用500万円 ／（貸）【　　　】500万円。仕訳②実際の退職金支払：（借）【　　　】XXX万円 ／（貸）現金XXX万円（引当金を取り崩す）。\nポイント：【　　　】＝退職給付債務－年金資産。年金資産（積立済み）は控除する。費用の2要素：①勤務費用（今年1年働いた分の積上げ）＋②利息費用（債務残高×割引率）。',
  '純資産': '資産合計から負債合計を差し引いた株主（出資者）に帰属する正味財産を【　　　　　　】という。\n例）B/S：資産5,000万円－負債3,000万円＝【　　　】2,000万円。内訳：資本金500万円＋資本準備金500万円＋利益準備金100万円＋繰越利益剰余金950万円＋その他有価証券評価差額金△50万円（評価損）＝【　　　】2,000万円。\nポイント：【　　　】の構成→①株主資本（資本金・資本剰余金・利益剰余金・自己株式）＋②評価・換算差額等（その他有価証券評価差額金等）＋③新株予約権。「株主に帰属するもの（株主資本）」と「評価差額等」は別区分で表示する。',
  '法定準備金': '会社法の規定に基づき積立が義務付けられた準備金（資本準備金＋利益準備金）を【　　　　　　】という。\n例）配当100万円→利益準備金積立最低10万円（100万円×1/10）義務。資本金1,000万円・合計目標250万円（1,000万円×1/4）まで積立義務。\nポイント：【　　　】＝資本準備金＋利益準備金。会社法で強制的に積立を義務付けた準備金。任意積立金（別途積立金等）とは区別。',
  '任意積立金': '株主総会の決議により任意に設定・取崩しができる利益剰余金の積立金を【　　　　　　】という。\n例）株主総会決議で将来の設備投資に備え「別途積立金50万円」を積立：（借）繰越利益剰余金50万円 ／（貸）別途積立金50万円。取崩し：（借）別途積立金50万円 ／（貸）繰越利益剰余金50万円。\nポイント：【　　　】は「株主総会で自由に積立・取崩しできる」。法定準備金（資本準備金・利益準備金）は強制積立で取崩し要件あり。',
  '自己株式': '発行済株式のうち会社が買い戻して保有している自社株で純資産のマイナス項目として計上される科目を【　　　　　　】という。\n例）自社株100万円分を買い戻し。仕訳①取得：（借）【　　　】100万円 ／（貸）現金100万円（純資産がマイナスになる）。仕訳②消却（株式を消す）：（借）その他資本剰余金100万円 ／（貸）【　　　】100万円（資本が正式に減少）。仕訳③再売却（120万円で売却）：（借）現金120万円 ／（貸）【　　　】100万円＋その他資本剰余金20万円（差益は資本剰余金）。\nポイント：【　　　】は「純資産のマイナス」→資産ではない。再売却時の差益は「利益ではなく資本剰余金」。消却時の差損は「その他資本剰余金から控除」。',
  '新株予約権': '一定の行使価格で会社の新株を取得できる権利で行使時に資本金が増加し失効時には利益として計上される純資産の項目を【　　　　　　】という。\n例）ストック・オプション：従業員に「1株1,000円で100株買える権利」を付与→【　　　】10万円を純資産計上。仕訳①付与時（費用計上）：（借）株式報酬費用10万円 ／（貸）【　　　】10万円。仕訳②行使時（株価2,000円）：（借）現金10万円（行使価格）＋【　　　】10万円 ／（貸）資本金10万円＋資本準備金10万円（払込金額の1/2ずつ）。仕訳③失効時（権利消滅）：（借）【　　　】10万円 ／（貸）【　　　】戻入益10万円（P/L収益）。\nポイント：【　　　】は純資産。行使→資本金・資本準備金増加。失効→収益（【　　　】戻入益）。',
  '株主資本': '純資産のうち株主に帰属する部分（資本金・資本剰余金・利益剰余金・自己株式）の合計を【　　　　　　】という。\n例）純資産＝【　　　】（資本金500万円＋資本剰余金200万円＋利益剰余金300万円－自己株式▲50万円）＋評価・換算差額等（その他有価証券評価差額金30万円）。\nポイント：純資産のうち「株主に帰属する部分」が【　　　】。評価差額等（その他有価証券評価差額金）は純資産に含まれるが【　　　】には含まれない。',
  '配当': '会社が獲得した利益の一部を株主に分配することで繰越利益剰余金を減少させ株主への利益還元を実現する行為を【　　　　　　】という。\n例）株主総会で1株50円・発行済み200万株の【　　　】決議→【　　　】総額1億円。同時に利益準備金として【　　　】額の10%（1,000万円）を強制積立（資本金×1/4に達するまで）。仕訳①決議時：（借）繰越利益剰余金1.1億円 ／（貸）未払【　　　】金1億円＋利益準備金1,000万円。仕訳②支払時：（借）未払【　　　】金1億円 ／（貸）現金1億円。\nポイント：【　　　】と同時に「利益準備金の積立（【　　　】額×1/10）」が義務。利益準備金＋資本準備金が「資本金×1/4」に達したら積立不要。中間【　　　】は取締役会決議で実施可能。',
  '増資': '新株の発行などにより会社の資本金を増加させる行為を【　　　　　　】という。\n例）【　　　】で新株1万株（1株1,000円・払込金額1,000万円）を発行し普通預金へ入金。仕訳①払込受取：（借）別段預金1,000万円（申込証拠金として専用口座）／（貸）株式申込証拠金1,000万円（負債）。仕訳②払込完了・資本組入：（借）株式申込証拠金1,000万円 ／（貸）資本金500万円（払込額の1/2以上）＋資本準備金500万円（残り）。同時：（借）普通預金1,000万円 ／（貸）別段預金1,000万円。\nポイント：払込額の1/2以上を資本金に組入れ、残りは資本準備金（会社法の規定）。別段預金→専用口座（払込確認まで普通口座に混在させない）。',
  '発生主義': '収益・費用を現金の授受でなく経済的事実の発生した時点で認識する会計原則を【　　　　　　】という。\n例）3月決算・3月にサービス提供済みだが代金未受領の2万円→未収収益2万円を計上（【　　　】で当期収益に認識）。3月に費用支払い義務が発生したが未払い→未払費用として当期費用に計上。\nポイント：【　　　】→実際のお金の動きに関係なく「経済的事実が発生した時点」で収益・費用を認識する。現金主義（お金が動いた時点）とは異なる。',
  '現金主義': '収益・費用を現金が入出金した時点で認識する会計方法（企業会計では原則不採用）を【　　　　　　】という。\n例）【　　　】なら「代金を受け取った時に収益」「支払った時に費用」。家計簿が典型例。\nポイント：発生主義（企業会計）と対比：発生主義は3月の売上→3月収益、【　　　】は代金回収した月→収益。企業会計は発生主義が原則（より正確な期間損益計算のため）。【　　　】は資金管理には優れるが期間損益が歪む。',
  '費用収益対応の原則': '関連する収益と費用を同一の会計期間に対応させて計上する会計原則を【　　　　　　】という。\n例）商品の売上（収益）を計上するときは対応する仕入原価（費用＝売上原価）を同じ期に計上する。期末の在庫は繰越商品（資産）として翌期に繰り越す。\nポイント：費用は関連する収益と同じ期に対応させて計上する原則。製品保証引当金（将来の修理費を販売時に計上）も【　　　】に基づく。',
  '前払費用': '当期に費用を支払ったが翌期以降に対応する未経過分を資産計上する経過勘定を【　　　　　　】という。\n例）10月1日に保険料12万円を1年分前払い（3月決算）→翌4〜9月分6万円が未経過：（借）【　　　】6万円 ／（貸）支払保険料6万円（期末繰延べ）。翌期4月1日に再振替：（借）支払保険料6万円 ／（貸）【　　　】6万円。\nポイント：【　　　】＝「お金は払ったがサービスはまだ受けていない」部分→資産。前受収益（収益側の裏）とセットで覚える。',
  '前受収益': '当期に収益を受け取ったが翌期以降に対応する未経過分を負債計上する経過勘定を【　　　　　　】という。\n例）10月1日に家賃1年分12万円を受取（3月決算）→翌4〜9月分6万円が未経過：（借）受取家賃6万円 ／（貸）【　　　】6万円（期末繰延べ）。翌期4月1日に再振替：（借）【　　　】6万円 ／（貸）受取家賃6万円。\nポイント：【　　　】＝「お金は受け取ったがサービスはまだ提供していない」部分→負債。前払費用（費用側）とセットで覚える。',
  '未払費用': '当期に発生した費用のうちまだ支払っていない部分を見越し計上する負債科目を【　　　　　　】という。\n例）3月決算・2〜3月分の給料20万円が未払→（借）給料20万円 ／（貸）【　　　】20万円（見越し計上）。4月に支払い：（借）【　　　】20万円 ／（貸）現金20万円（再び給料計上しない）。\nポイント：【　　　】＝「サービスは受けたがまだ払っていない」→負債。未収収益（収益側の裏）とセットで覚える。再振替不要（翌期支払時に【　　　】を消去するだけ）。',
  '未収収益': '当期に発生した収益のうちまだ受け取っていない部分を見越し計上する資産科目を【　　　　　　】という。\n例）3月決算・2〜3月分の家賃収入2万円が未入金→（借）【　　　】2万円 ／（貸）受取家賃2万円（見越し計上）。4月に受取：（借）現金2万円 ／（貸）【　　　】2万円（再び受取家賃計上しない）。\nポイント：【　　　】＝「サービスは提供したがまだ受け取っていない」→資産。未払費用（費用側の裏）とセットで覚える。',
  '継続性の原則': '一度採用した会計処理の方法・手続きを毎期継続して適用する会計原則を【　　　　　　】という。\n例）前期から定額法を使って減価償却していた建物を当期から突然定率法に変更→【　　　】に違反する可能性（正当な理由がなければ変更不可）。\nポイント：【　　　】→一度採用した会計処理方法を毎期継続して適用する。理由なく変更すると恣意的な利益操作が可能になるため禁止。',
  '保守主義の原則': '将来の損失・費用は早期に認識し・将来の収益は慎重に扱う会計原則を【　　　　　　】という。\n例）商品の時価が下落した時→低価法で評価損を認識（損失を早期に計上）。固定資産の減損→早期に損失認識。\nポイント：保守主義＝「利益は慎重に、損失は早めに」。不確実な利益を先取りせず、発生可能性のある損失は早期に認識する姿勢。過度な保守主義（故意に利益を少なく見せる）は禁止。',
  '重要性の原則': '金額的・質的に重要性が低い項目には、本来の厳密な処理でなく簡便な処理を認める会計原則を【　　　　　　】という。\n例）10万円未満の固定資産→消耗品費で即費用処理（原則は固定資産計上だが金額が少額のため）。切手の未使用分が数百円なら貯蔵品計上せず全額費用に（金額が重要でないため）。\nポイント：重要性が高いもの→原則通り厳格に処理。重要性が低いもの→簡便な処理が許容される。簡便処理は「恣意的な判断」ではなく「合理的な判断」。',
  '繰延資産': '支出済みだが将来の効果に対応させるために資産として繰り延べる項目を【　　　　　　】という。\n例）創立費50万円（5年均等償却）・開業費60万円（5年均等）・株式交付費200万円（3年均等）。毎年均等額を費用化。\nポイント：【　　　】は「すでに支出済みだが将来にわたり効果がある費用」を資産計上する項目。資産の要件を満たさないが、特別に資産として扱われる5種類（創立費・開業費・株式交付費・社債発行費・開発費）。',
  '消費税（税込処理）': '消費税を取引金額に含めて記帳し期末に納付額を費用として処理する方式を【　　　　　　】という。\n例）商品110万円（税込）を仕入：（借）仕入110万円 ／（貸）買掛金110万円（消費税10万円も仕入に含める）。期末に消費税納付額が確定したら→租税公課（費用）として計上。\nポイント：税込処理→消費税を仕入・売上に含めて記帳。期末に差額を確定→納付分は租税公課。税抜処理→仮払・仮受で区分記帳→期末に相殺して納付（未払消費税）。',
  '消費税（税抜処理）': '消費税を仮払・仮受で区分計上し期末に相殺して差額を納付する方式を【　　　　　　】という。\n例）商品110万円（税込）を仕入（税抜処理）：（借）仕入100万円・仮払消費税10万円 ／（貸）買掛金110万円。販売時（税込220万円）：（借）売掛金220万円 ／（貸）売上200万円・仮受消費税20万円。期末：（借）仮受消費税20万円 ／（貸）仮払消費税10万円・未払消費税10万円。\nポイント：税抜処理→消費税を別途計上→P/Lの金額が税抜きになる（実態を正確に反映）。',
  '税効果会計': '会計上の利益と課税所得の差異による税負担のズレを繰延税金資産・負債を用いて調整する会計処理を【　　　　　　】という。\n例）会計利益1,000万円・税務上の課税所得1,200万円（差異200万円：貸倒引当金超過が原因）、税率30%。実際納税額：1,200万円×30%＝360万円。繰延税金資産：200万円×30%＝60万円を計上。仕訳）（借）繰延税金資産60万円 ／（貸）法人税等調整額60万円（法人税等を60万円減らす）。P/L：法人税等360万円 ／ 法人税等調整額△60万円 → 実効税負担300万円（1,000万円×30%）。\nポイント：【　　　】の目的は「会計利益×税率＝P/L上の税金負担」にすること。繰延税金資産は「払いすぎた税金の将来返金」のイメージ。',
  '一時差異': '資産・負債の会計上の帳簿価額と税務上の金額の差で将来解消される差異を【　　　　　　】という。\n例①将来減算【　　　】）貸倒引当金20万円（会計費用→税務：今期認めない→将来認定）→繰延税金資産（将来節税）。例②将来加算【　　　】）その他有価証券評価益100万円（会計収益→税務：売却時に課税）→繰延税金負債（将来税負担増）。例③永久差異）交際費超過額50万円（永遠に損金不算入）→税効果会計の対象外。\nポイント：【　　　】＝「時期のズレ（将来に解消）」→税効果会計の対象。永久差異＝「永遠に解消されないズレ」→税効果会計の対象外。この区別が【　　　】理解の核心。',
  '法人税の中間申告': '事業年度途中に法人税の概算額を前払いする制度を【　　　　　　】という。\n例）12月決算法人：前期の法人税300万円の1/2（150万円）を中間申告・納付：（借）仮払法人税等150万円 ／（貸）現金150万円。12月末確定額280万円なら：（借）法人税等280万円 ／（貸）仮払法人税等150万円・未払法人税等130万円。\nポイント：中間申告は「前期実績の1/2」または「仮決算」のどちらかを選択可能。前払いした中間申告額→仮払法人税等（資産）。',
  '繰越欠損金': '当期に生じた税務上の欠損金を翌期以降10年間繰り越して将来の課税所得と相殺できる制度を【　　　　　　】という。\n例）今期の税務上の欠損1,000万円→【　　　】1,000万円として税務上繰り越す。税効果：繰延税金資産1,000万円×30%＝300万円を計上。仕訳）（借）繰延税金資産300万円 ／（貸）法人税等調整額300万円。翌期課税所得800万円：【　　　】800万円を使い→課税所得ゼロ→法人税ゼロ。繰延税金資産240万円を取崩し。\nポイント：【　　　】の繰延税金資産は「将来利益が出た時に使える節税カード」。ただし「回収可能性（将来利益が出るかどうか）」が不確かなら資産計上できない。この判断が試験で問われる。',
  '入金伝票': '現金が入金された取引を記録するために使用する伝票で、3伝票制において現金収入取引を他の取引（振替伝票）と分けて記録するものを【　　　　　　】という。\n例）商品100万円を現金で販売 → 【　　　】に「売上100万円」と記録。\nポイント：現金が入金される取引のみに使用。現金が出るなら出金伝票、現金が動かないなら振替伝票。',
  '出金伝票': '現金が出金された取引を記録するために使用する伝票で、3伝票制において現金支出取引を他の取引と分けて記録するものを【　　　　　　】という。\n例）消耗品5,000円を現金で購入 → 【　　　】に「消耗品費5,000円」と記録。\nポイント：現金の出金がある取引のみに使用。入金は入金伝票、現金以外は振替伝票。',
  '振替伝票': '現金取引以外の振替取引（掛取引・未払計上等）を記録するために使用する伝票を【　　　　　　】という。\n例）商品100万円を掛けで仕入れた → 【　　　】に「（借）仕入100万円 ／（貸）買掛金100万円」と記録。\nポイント：現金が動かない取引はすべて【　　　】。入金・出金伝票に含まれない全ての取引を記録する。',
  '本支店会計': '本店と支店がそれぞれ独立した帳簿を持ち本社・支店間の取引を内部勘定で処理する会計制度を【　　　　　　】という。\n例）本店が支店に商品100万円（原価80万円）を送付。本店仕訳：（借）支店100万円 ／（貸）仕入（商品）80万円＋内部利益20万円（内部利益を計上）。支店仕訳：（借）仕入100万円 ／（貸）本店100万円（本店から受け取ったとして処理）。合算時の消去：①本店勘定↔支店勘定を相殺消去。②内部利益20万円を消去（本店→支店の未実現利益）。\nポイント：【　　　】の合算処理で最重要なのは「内部利益の消去」。支店がまだ外部に売っていない商品に含まれる本店から付けた利益は合算時に消去する。',
  '内部取引の消去': '本支店合算財務諸表作成の際に内部の債権債務を相殺除去する手続きを【　　　　　　】という。\n例）本店の支店勘定100万円（本店B/Sの資産）と支店の本店勘定100万円（支店B/Sの負債）を相殺消去。合算仕訳：（借）本店勘定100万円 ／（貸）支店勘定100万円（双方消去）。消去しないと：合算B/Sに架空の「資産100万円・負債100万円」が残り財務諸表が膨らむ（実態と異なる）。\nポイント：本支店会計の合算で必ず行う消去は①本店勘定↔支店勘定の相殺②内部利益の消去（未達取引があれば追加記帳後に消去）。「内部の貸し借りを外から見えないようにする」作業。',
  '未達取引': '本店・支店間の取引で一方が記帳済みだが他方にまだ情報が届いていない取引を【　　　　　　】という。\n例）本店が支店へ商品50万円を発送・本店は記帳済み。支店には届いていない（未達）。合算前の処理（支店側）：（借）仕入50万円 ／（貸）本店50万円（支店が受取ったとして記帳）→これで本店・支店双方の帳簿が対応する。通常の内部取引消去を実施：本店勘定50万円↔支店勘定50万円を相殺。\nポイント：【　　　】の処理手順：①未達側で「受け取ったor支払ったとして」仕訳追加→②通常の内部取引消去を実施。「合算前に未達を解消してから相殺」が正しい手順。',
  '内部利益': '本支店間の商品売買などでグループ内部に含まれる未実現の利益を【　　　　　　】という。\n例）本店が原価80万円の商品を100万円で支店へ売却。支店はまだ外部に未販売（在庫中）。【　　　】：20万円（100万円－80万円）が支店の在庫に含まれている。合算時の消去仕訳：（借）本店売上100万円 ／（貸）支店仕入100万円（売上・仕入の相殺）。（借）【　　　】20万円 ／（貸）支店商品20万円（在庫の過大評価部分を消去）。消去後：支店の在庫は原価80万円（実態）に修正される。\nポイント：【　　　】は「グループ外部への販売が完了するまで利益として認められない」。支店が外部に販売した時点で初めて利益が実現する。',
  '原価計算': '製品の製造にかかった費用を材料費・労務費・経費の3要素に分類して集計・計算する手続きを【　　　　　　】という。\n例）製品A1個の【　　　】：直接材料費500円（鉄板：素材費）＋直接労務費300円（加工作業員賃金）＋製造間接費配賦額200円（工場電気代・工場長給与等の按分）＝製品原価1,000円。販売価格1,500円→粗利500円。\nポイント：製造原価の3要素：①材料費（モノのコスト）②労務費（ヒトのコスト）③経費（上記以外のコスト）。それぞれを「直接費（製品への直接賦課）」と「間接費（配賦が必要）」に分類する二次元の分類が【　　　】の基本骨格。',
  '原価の3要素': '製造原価を構成する「材料費・労務費・経費」の3つの分類を【　　　　　　】という。\n例）自動車1台の製造原価：材料費60万円（鋼板・タイヤ・バッテリー等）＋労務費30万円（工場作業員の賃金・賞与・法定福利費）＋経費20万円（機械減価償却費・工場電気代・外注加工費等）＝製造原価110万円。\nポイント：材料費は「モノを使う」コスト。労務費は「人が働く」コスト。経費は「それ以外のすべて（機械・光熱費・外注等）」のコスト。各費用を直接費・間接費に分けることで仕掛品への賦課と製造間接費への集約が決まる。',
  '直接費': '特定の製品に直接割り当てられる原価を【　　　　　　】という。\n例）製品Aに使った鉄板（直接材料費）・製品Aの製造ラインで働いた作業員の賃金（直接労務費）など。\nポイント：「どの製品に使ったか」が明確なため配賦計算が不要。間接費は配賦基準で各製品に案分が必要。',
  '間接費': '複数の製品に共通して発生し特定の製品に直接割り当てられない原価を【　　　　　　】という。\n例）工場全体の電気代・工場長の給与・機械の減価償却費など → 製品A・B・Cに何%ずつ使ったかわからないため、作業時間比率などで各製品に配賦。\nポイント：複数の製品に共通して発生し特定製品に直接割り当てられない。配賦基準（作業時間・機械時間等）で案分が必要。',
  '配賦': '間接費を一定基準で各製品・部門に割り当てる手続きを【　　　　　　】という。\n例）製造間接費100万円を直接作業時間（製品A：60時間・製品B：40時間）で【　　　】 → A：60万円・B：40万円を各製品原価に加算。\nポイント：作業時間比率・面積比・人数比など合理的な基準を選ぶ。',
  '予定配賦': '年度初めに設定した予定配賦率を使って製造間接費を製品に割り当てる方法を【　　　　　　】という。\n例）年度初めに「直接作業時間1時間当たり1,000円の製造間接費を配賦する」と設定（【　　　】率）→ 実際作業時間×1,000円で月次に製品原価を計算 → 期末に実際発生額との差（配賦差異）を調整。\nポイント：実際原価確定前に迅速に計算できるが配賦差異が生じる。',
  '配賦差異': '予定配賦額と製造間接費の実際発生額との差額を【　　　　　　】という。\n例）予定配賦額100万円・実際発生額110万円 → 【　　　】10万円（不利差異：追加計上が必要）→ 年度末に売上原価等へ振替。\nポイント：実際＞予定なら不利差異（追加計上）、実際＜予定なら有利差異（減額）。',
  '個別原価計算': '特定の製造指図書ごとに原価を集計する方法を【　　　　　　】という。\n例）建築・造船・特注機械→製品ごとに「製造指図書№001」のように番号をつけて原価を集計。№001の指図書：直接材料費200万円＋直接労務費100万円＋製造間接費配賦額80万円（作業時間基準）＝製品原価380万円。仕訳）製造指図書№001の完成：（借）製品380万円 ／（貸）仕掛品380万円（指図書別集計額を製品へ）。\nポイント：【　　　】→「一品一様」の受注生産向け。各指図書が独立した原価計算対象。対比：総合原価計算→「同一品種の大量連続生産」向け。どちらの方法を使うかは生産形態で決まる。',
  '総合原価計算': '同種製品を大量・連続生産する場合に一定期間の総製造費用を完成品数量で割って単位原価を求める方法を【　　　　　　】という。\n例）月産1万本の飲料水。月間製造費用：材料費500万円＋労務費300万円＋製造間接費200万円＝1,000万円。月末仕掛品（加工進捗50%）が1,000本。完成品換算量：完成品9,000本＋仕掛品500本（1,000本×50%）＝9,500本。単位原価1,000万円÷9,500本≒1,053円/本。\nポイント：【　　　】の核心は「月末仕掛品をどう評価するか」。材料費は投入時点で全量計上→進捗度関係なし。加工費は進捗度に応じて計算→完成品換算量を使う。この区別が必出。',
  '標準原価計算': 'あらかじめ設定した標準原価と実際原価を比較して差異分析を行う原価計算方法を【　　　　　　】という。\n例）製品1個の標準原価：材料費（標準単価1,000円×標準消費量0.5kg）500円＋賃金（標準賃率1,500円×標準時間0.2時間）300円＋製造間接費200円＝1,000円/個。実際原価が1,100円→差異100円。差異の分解：材料費差異（価格差異＋数量差異）、労務費差異（賃率差異＋作業時間差異）、製造間接費差異（予算差異＋能率差異＋操業度差異）に分解して原因を特定。仕訳）仕掛品は標準原価で計上：（借）仕掛品1,000円 ／（貸）材料500円・賃金300円・製造間接費200円。差異は別科目で管理。\nポイント：【　　　】は「目標管理ツール」。差異の借方（不利差異）・貸方（有利差異）の区別を確実に押さえること。',
  '不利差異': '製造コストが想定以上にかかったことを示す差異を【　　　　　　】という。\n例）材料を予定より高く仕入れた（価格上昇）・作業ミスで材料を無駄遣いした（使用量超過）→ 【　　　】（借方差異）。\nポイント：実際原価が標準原価・予算を超過した場合。有利差異（実際＜標準）と逆。',
  '有利差異': '実際原価が標準原価を下回り利益を増加させる方向の差異を【　　　　　　】という。\n例）材料を予定より安く仕入れられた・作業効率が上がって時間が短縮できた → 【　　　】（貸方差異）。\nポイント：実際原価が標準原価・予算を下回った場合。「良いことだがなぜ良かったのか」の原因分析も重要。不利差異（実際＞標準）と逆。',
  'CVP分析': '原価（Cost）を固定費・変動費に分けて売上高（Volume）・原価・利益（Profit）の関係を分析する意思決定手法を【　　　　　　】という。\n例）固定費200万円・変動費率60%。①損益分岐点売上高＝固定費÷（1－変動費率）＝200万円÷0.4＝500万円。②目標利益100万円のための売上高＝（200万円＋100万円）÷0.4＝750万円。③安全余裕率：実際売上600万円なら＝（600万円－500万円）÷600万円≒16.7%。\nポイント：【　　　】では「限界利益率＝1－変動費率」が核心。試験では①損益分岐点売上高②目標利益売上高③安全余裕率の3つの計算が頻出。',
  '損益分岐点': '売上高と総費用が一致して利益がゼロになる売上水準を【　　　　　　】という。\n例）固定費200万円・変動費率60%。【　　　】売上高＝200万円÷（1－0.6）＝500万円。【　　　】販売量（単価2,000円なら）＝500万円÷2,000円＝2,500個。確認：売上500万円・変動費300万円（60%）・固定費200万円→利益＝0円 ✓。\nポイント：【　　　】は「固定費÷限界利益率」で求める。固定費が増えると【　　　】が上昇（高い売上が必要になる）。変動費率が低いほど（限界利益率が高いほど）【　　　】が下がる。',
  '貢献利益': '売上高から変動費を差し引いた利益で固定費の回収と利益獲得に「貢献」する部分を【　　　　　　】という。\n例）製品A：単価2,000円・単位変動費1,200円→単位【　　　】800円。月間1,000個販売→【　　　】80万円。固定費60万円→営業利益20万円。追加受注の意思決定：変動費1,200円以上の価格なら受注すべき（固定費はすでに発生しているため）。単価1,500円の特別受注→単位【　　　】300円でプラスになるから受注OK。\nポイント：【　　　】（限界利益）は「固定費をまず回収し、その後が利益になる」という考え方。短期の意思決定（追加受注・製品廃止）は「変動費が回収できるか」で判断→固定費は埋没原価として無視する。',
  '直接原価計算': '変動製造原価のみを製品原価とし固定製造間接費を期間費用として一括処理する方法を【　　　　　　】という。\n例）【　　　】の損益計算書：売上高1,000万円－変動売上原価600万円（変動製造原価のみ）＝限界利益400万円－固定製造間接費200万円（一括期間費用）－固定販管費50万円＝営業利益150万円。\nポイント：【　　　】→固定費を期間費用に→在庫が増えても利益に影響しない→経営管理・意思決定に使う（内部向け）。全部原価計算→固定費を製品原価に→外部財務報告に使う（外部向け）。財務報告では【　　　】は使えない（制度会計では全部原価計算が必要）。',
  '全部原価計算': '固定製造間接費も含む全製造原価を製品原価として計算する方法を【　　　　　　】という。\n例）【　　　】での固定費300万円の処理：製品原価に含める→在庫100万円増加の中に固定費30万円が含まれる→P/Lに計上されない（在庫の中に留まる）→利益が30万円多く見える。直接原価計算なら→固定費300万円を全額当期費用に→利益は30万円少なくなる。\nポイント：「【　　　】の営業利益＞直接原価計算の営業利益」の場合は期末在庫増加（固定費が在庫に隠れている）。この差が「固定費調整」。試験では固定費調整の計算（直接原価→全部原価の利益換算）が頻出。',
  '固定費調整': '直接原価計算と全部原価計算の営業利益の差を期首・期末在庫の固定費増減分で調整する手続きを【　　　　　　】という。\n例）直接原価計算の営業利益800万円。期末在庫に含まれる固定費150万円（全部原価計算では費用化されていない）、期首在庫に含まれる固定費100万円（全部原価計算では当期費用化）。【　　　】：800万円＋150万円（期末在庫の固定費を加算）－100万円（期首在庫の固定費を控除）＝全部原価計算の営業利益850万円。\nポイント：【　　　】の方向→「直接→全部：期末在庫固定費を加算・期首在庫固定費を控除」。「期末に固定費が在庫に残っている＝利益がその分多い（全部）」が記憶のコツ。',
  '製造原価報告書': '当期に発生した材料費・労務費・経費の内訳と当期製品製造原価を報告する明細書を【　　　　　　】という。\n例）【　　　】：直接材料費2,000万円＋間接材料費200万円＝材料費2,200万円。労務費1,800万円。製造間接費1,000万円。＝当期製造費用5,000万円。＋期首仕掛品200万円－期末仕掛品300万円＝当期製品製造原価4,900万円。\nポイント：【　　　】→損益計算書→B/Sの流れを把握。「当期製品製造原価」がP/Lの「売上原価」の計算に入っていく。売上原価＝期首製品在庫＋当期製品製造原価－期末製品在庫。',
  '当期製品製造原価': '当期に製造が完了した製品に集計された製造原価の合計を【　　　　　　】という。\n例）期首仕掛品原価200万円＋当期製造費用5,000万円＝当期製造に関する費用合計5,200万円。そこから期末仕掛品原価300万円を引く＝【　　　】4,900万円（完成して製品在庫になった分）。P/Lの売上原価：期首製品在庫400万円＋【　　　】4,900万円－期末製品在庫500万円＝売上原価4,800万円。\nポイント：製造業の原価計算の「最終目標値」が【　　　】。仕掛品（未完成）と製品（完成品）の期首・期末の調整が計算のポイント。計算式＝期首仕掛品＋当期製造費用－期末仕掛品。',
  '完成品換算量': '仕掛品の加工進捗度を考慮して完成品何個分に相当するかを換算した数量を【　　　　　　】という。\n例）月末仕掛品100個・加工進捗度60%→加工費の【　　　】60個（100個×60%）。材料費は投入時点で全量投入（進捗度関係なし）→月末仕掛品100個のままで計算。加工費の配分：（完成品1,000個＋月末仕掛品換算量60個）で総加工費を按分。月末仕掛品への加工費＝総加工費×60÷1,060。\nポイント：材料費は「投入タイミング（工程の始点・終点・均等等）」で按分するため換算量は使わない場合が多い。加工費は「どれだけ加工したか（進捗度）」で按分するため換算量を使う。この区別が総合原価計算の核心。',
  '月末仕掛品の評価': '総合原価計算において期末未完成品に配分する原価を平均法・先入先出法などで計算する手続きを【　　　　　　】という。\n例）当月製造費用1,000万円、期首仕掛品原価100万円、完成品1,000個、月末仕掛品100個（進捗度50%→換算量50個）。平均法：総原価1,100万円÷（1,000個＋50個）＝1,048円/個（換算量1個当たり）。月末仕掛品原価＝1,048円×50個＝5.24万円。完成品原価＝1,100万円－5.24万円＝1,094.76万円。先入先出法：期首仕掛品は先に完成したとして計算→月末仕掛品の原価は当月費用のみから算定。\nポイント：平均法→「期首＋当月」で平均→計算がシンプル。先入先出法→「期首と当月を分けて計算」→当月の成果が純粋に見える。試験では平均法が多く出題される。',
  '等級別総合原価計算': '同一の製造工程から異なる等級・規格の製品が生産される場合に等価係数を用いて総合原価を各等級に配分する方法を【　　　　　　】という。\n例）同一工程で特大・大・小サイズのシャツを製造。等価係数：特大1.5・大1.0・小0.7に設定。各等級の完成品数：特大200枚・大500枚・小800枚。積数（等価係数×完成品数）：特大300・大500・小560＝合計1,360。総合原価13,600円÷1,360×各積数で各等級の原価を算定。特大原価：13,600円×300÷1,360＝3,000円→1枚15円。\nポイント：等価係数は「単位当たりのコスト比」。積数（等価係数×生産量）で総原価を按分する。組別（製品種類が異質）との違いを押さえる。',
  '組別総合原価計算': '異なる種類の製品（組）を同一工場で製造する場合に組ごとに直接費を集計し製造間接費を配賦して原価を計算する方法を【　　　　　　】という。\n例）同一工場でシャンプーとリンスを製造（組A：シャンプー・組B：リンス）。直接材料費：A組500万円・B組300万円。製造間接費200万円を直接材料費比率（5：3）で配賦：A組125万円・B組75万円。各組の製造原価：A組625万円・B組375万円。\nポイント：等級別→同じ製品を大中小に分ける（量的差異）。組別→全く異なる製品を作る（質的差異）。配賦基準には直接材料費・直接労務費・機械時間等が使われる。',
  '度外視法': '正常仕損・正常減損の原価を分離計算せず良品に自動的に負担させる簡便な方法を【　　　　　　】という。\n例）月間生産100個のうち5%（5個）は正常仕損が予測されている。【　　　】：仕損品5個の原価は分離せず→完成品95個でのみ総原価を割り算→完成品1個当たりの原価が自動的に割高になる（仕損コストが平均化）。\nポイント：【　　　】→「仕損品を無視して計算すると、良品の単位原価に仕損コストが自動的に含まれる」。非【　　　】→「仕損品の原価を分離して明示的に計算」。試験では【　　　】が多く出題。仕損発生点が「工程の途中」か「終点」かで按分方法が変わる点も重要。',
  '非度外視法': '正常仕損・正常減損の原価を計算上明示して把握する方法を【　　　　　　】という。\n例）仕損品5個の評価額（スクラップ価値）が1個200円→仕損品評価額1,000円。【　　　】：正味仕損費（仕損品原価）＝仕損品負担コスト－評価額1,000円を分離計算。残りを完成品・月末仕掛品に按分。仕訳）仕損品：（借）仕損品1,000円 ／（貸）仕掛品1,000円（スクラップ価値分を仕掛品から切り出す）。\nポイント：【　　　】は「仕損費の原因と金額が明確になる」→製造管理に役立つが計算が複雑。仕損品に評価額がある場合は【　　　】の考え方も必要。',
  '前工程費': '連続する製造工程の総合原価計算において前の工程で発生した原価を次の工程に引き継ぐ際の集計額を【　　　　　　】という。\n例）第1工程の製品原価：材料費200万円＋加工費100万円＝300万円（完成品1,000個）。第2工程へ1,000個転送。第2工程の原価計算：【　　　】300万円（材料費扱い：工程始点で全量投入）＋第2工程加工費120万円＝完成品原価420万円（1個当たり420円）。\nポイント：【　　　】は「次工程の材料費」として扱う。進捗度とは無関係に計算（工程始点で全量が引き継がれる）。月末仕掛品の【　　　】は換算量を使わず実数で計算する点が加工費と異なる。',
  '収益認識基準': '顧客との契約から生じる収益をいつ・いくら認識するかを5つのステップで定めた会計基準を【　　　　　　】という。\n例（機器＋保守サービスのセット販売）：①契約の識別：顧客との有効な契約を確認。②履行義務の識別：「機器の引渡し」と「1年間の保守サービス提供」の2つに分解。③取引価格：セット価格11万円（変動対価を考慮）。④取引価格の配分：機器8万円・保守3万円に配分（独立販売価格比）。⑤収益認識：機器引渡し時に8万円・保守は毎月2,500円を認識。\nポイント：従来の「商品引渡し＝売上」から「履行義務の充足＝収益」へ。一つの契約に複数の履行義務がある場合の分解と按分が最重要論点。',
  '履行義務': '収益認識基準において顧客との契約で企業が約束した財・サービスを移転する義務を【　　　　　　】という。\n例①一時点で充足される【　　　】）商品の引渡し→引渡し完了時に収益認識（一時点）。例②一定期間にわたって充足される【　　　】）建設工事・サポートサービス→進捗度に応じて収益を認識。例③複数の【　　　】を含む契約）スマホ＋通信サービス→「端末の引渡し」と「通信サービスの提供」を別々の【　　　】として識別→それぞれの充足時点で収益認識。\nポイント：「一時点」vs「一定期間」の区別と、「複数の【　　　】への分解」が収益認識基準の中核。',
  '委託販売': '他者（受託者）に商品販売を委託し受託者が実際に販売した時点で収益を認識する販売形態を【　　　　　　】という。\n例）A社（委託者）がB社（受託者）に商品を積送（取得原価80万円）。B社が100万円で外部顧客に販売・仕切精算書を送付。仕訳①積送時（A社）：（借）積送品80万円 ／（貸）商品80万円（棚卸資産区分を変更）。仕訳②仕切精算書受取時（A社）：（借）売掛金95万円（100万円－手数料5万円）／（貸）積送品売上100万円。同時：（借）積送品売上原価80万円 ／（貸）積送品80万円。\nポイント：【　　　】は「受託者が売ったとき（仕切精算書受取時）」に売上計上。積送時・B社に在庫中は積送品（資産）のまま。',
  '受託販売': '委託者から商品を預かって代わりに販売し販売手数料のみを収益として認識する販売形態を【　　　　　　】という。\n例）B社（受託者）がA社（委託者）の商品を100万円で販売。手数料は5万円。仕訳①販売時（B社）：（借）現金100万円 ／（貸）【　　　】100万円（全額を預り金的に処理。売上にしない）。仕訳②精算・送金時（B社）：（借）【　　　】100万円 ／（貸）手数料収益5万円＋現金95万円（A社へ送金）。\nポイント：受託者の収益は「手数料のみ」。販売代金100万円を自己の売上にしてはいけない。B社はA社から預かって売るだけ→消費税の扱いも「売上ではなく手数料」が正しい。',
  '試用販売': '顧客が一定期間試用し購入意思表示があった時点で収益を認識する販売形態を【　　　　　　】という。\n例）掃除機（原価5万円）を1週間試用させる。顧客が「買います（8万円）」と連絡。仕訳①試送時：（借）試送品5万円 ／（貸）商品5万円（在庫分類を変更・売上はまだ計上しない）。仕訳②買取連絡時：（借）売掛金8万円 ／（貸）売上8万円。（借）売上原価5万円 ／（貸）試送品5万円（試送品を売上原価に振替）。\nポイント：【　　　】のポイント→「購入意思表示があった時点で収益認識」。試用期間中は試送品（資産）のまま。期末時点で試用中の場合は試送品として在庫計上。',
  '割賦販売': '商品代金を分割払いで受け取ることを前提とした販売形態の収益認識を【　　　　　　】という。\n例）原価30万円の家具を総額50万円・10回分割払いで販売（引渡し完了）。仕訳①引渡し時（収益認識基準）：（借）割賦売掛金50万円 ／（貸）売上50万円（一括認識）。（借）売上原価30万円 ／（貸）商品30万円。仕訳②毎月回収（5万円×10回）：（借）現金5万円 ／（貸）割賦売掛金5万円。\nポイント：収益認識基準→「引渡し時に一括収益認識」が原則（分割回収の都度ではない）。未回収分は割賦売掛金（資産）として管理。例外：金利相当部分が重要な場合は利息部分を分離して計上。',
  '工事契約': '一定期間にわたる建設・製造請負で工事の進捗度に応じて段階的に収益を認識する契約形態を【　　　　　　】という。\n例）総請負価格1億円・工事原価見込み8,000万円・2年間の工事。1年目の実際原価3,200万円。進捗度＝3,200万円÷8,000万円＝40%。仕訳①1年目の収益認識：（借）工事未収入金4,000万円 ／（貸）工事収益4,000万円（1億円×40%）。（借）工事原価3,200万円 ／（貸）仕掛品3,200万円（工事原価も40%分認識）。2年目完成・引渡し：残りの60%（6,000万円）を収益認識。\nポイント：進捗度の測定方法→「原価比例法（発生原価÷見込総原価）」が最も一般的。収益認識基準では進捗度が合理的に見積もれる場合は進捗度基準、見積もれない場合は完成基準を使用。',
  '返品権付き販売': '顧客が商品を返品できる権利を持つ販売形態で返品見込み分を返金負債として計上するものを【　　　　　　】という。\n例）書店へ商品（取得原価70万円）を100万円で納品。返品見込み10%（10万円分・原価7万円分）。仕訳①納品時：（借）売掛金100万円 ／（貸）売上90万円（100万円×90%）＋返金負債10万円（返品時に返金が必要な義務）。（借）売上原価63万円（70万円×90%）＋返品資産7万円 ／（貸）商品70万円。仕訳②実際に10万円分返品：（借）返金負債10万円 ／（貸）現金10万円。（借）商品7万円 ／（貸）返品資産7万円。\nポイント：【　　　】では「売上と返金負債」「売上原価と返品資産」の2セットを記録する。',
  '収益認識の5ステップ': '①契約の識別→②履行義務の識別→③取引価格の算定→④履行義務への配分→⑤履行義務充足時の収益認識という体系的な手順を【　　　　　　】という。\n例）クラウドサービス年額12万円（機能追加オプション2万円含む）：①契約識別：有効な契約の確認。②履行義務の識別：「基本クラウドサービス」＋「機能追加オプション」の2つ。③取引価格：12万円（変動なし）。④配分：基本10万円・オプション2万円（独立販売価格比で按分）。⑤認識：基本サービス→月々8,333円（年間）・オプション→オプション提供開始時に2万円。\nポイント：試験では各ステップのどれが問われているか確認。特に②「履行義務の識別と分解」・④「取引価格の配分方法」・⑤「一時点 vs 一定期間」の3点が頻出。',
  '変動対価': '割引・返金・ボリュームリベートなどにより最終的な受取金額が変動する可能性がある取引価格の構成部分を【　　　　　　】という。\n例）年間購入1,000万円超なら3%のボリュームリベート（値引き）がある契約。当年の累計購入800万円の時点で年間1,000万円超が見込まれる（確率高い）。【　　　】の見積もり：1,200万円×3%＝36万円のリベートを見積もり。収益の減額：売上計上時に【　　　】分を控除→返金負債36万円（負債）として計上し売上を減額。\nポイント：【　　　】は「確実視される部分のみ収益に含める（制約あり）」。典型例：ボリュームディスカウント・返品・インセンティブ・マイルストーンボーナス。',
  '外貨建取引': '取引金額が外国通貨で表示された取引を【　　　　　　】という。\n例）米国企業に1万ドル（取引時レート：1ドル100円＝100万円）の商品を輸出。仕訳①輸出時：（借）売掛金100万円 ／（貸）売上100万円。仕訳②決算時（1ドル108円）：（借）売掛金8万円 ／（貸）為替差益8万円（貨幣性資産の換算替え）。仕訳③翌期に1ドル110円で入金：（借）現金110万円 ／（貸）売掛金108万円＋為替差益2万円。\nポイント：外貨建て「資産（売掛金・貸付金）」→円安（外貨高）で為替差益、円高で為替差損。外貨建て「負債（買掛金・借入金）」→円安で為替差損、円高で為替差益。',
  '直物為替レート': '外貨の即時受渡しに適用される当日の為替交換レートを【　　　　　　】という。\n例）本日の【　　　】（スポットレート）：1ドル＝108円。今日1万ドルを108万円に換金できる。3か月後の先物レート：1ドル＝110円（将来の受渡しを今日確定）。外貨建て取引の基本：取引発生日の直物レートで仕訳を行い、期末には決算時レート（CR）で換算替え。\nポイント：直物レート（スポット）＝今日の交換レート。先物レート＝将来の交換レートを今日確定。外貨建て取引では取引発生時・期末・決済時の3回レートが問題になる。',
  '取引発生時レート': '外貨建て取引が発生した日に適用する為替レートを【　　　　　　】という。\n例）4月1日（取引発生時）：1ドル100円→売掛金1万ドル＝100万円で計上。3月31日（決算時）：1ドル106円→売掛金106万円に換算替え→為替差益6万円。4月15日（入金時）：1ドル104円→現金104万円受取→残りの為替差損2万円（106万円→104万円）を認識。合計為替差益：6万円（期末）－2万円（決済時）＝4万円の純為替差益。\nポイント：取引時レートで計上→期末にCR（決算時レート）で換算替え→差額が為替差損益。決済時は「期末帳簿価額と決済額の差」が差損益。3段階で処理を追えるようにする。',
  '決算時レート（CR）': '外貨建ての資産・負債の期末評価に適用する決算日現在の為替レートを【　　　　　　】という。\n例）決算時レート（CR：Current Rate）：1ドル108円。期末の外貨建て売掛金1万ドル→108万円に換算替え（取引時100万円との差額8万円→為替差益）。外貨建て買掛金5千ドル→54万円（取引時50万円との差額4万円→為替差損）。仕訳）売掛金換算替え：（借）売掛金8万円 ／（貸）為替差益8万円。買掛金換算替え：（借）為替差損4万円 ／（貸）買掛金4万円。\nポイント：貨幣性項目（現金・売掛金・買掛金・借入金等）→決算時レートで換算替え。非貨幣性項目（棚卸資産・固定資産等）→取引時レートのまま（換算替えなし）。',
  '為替差損益': '外貨建て取引の換算レートの変動により生じる損益を【　　　　　　】という。\n例①輸出企業（外貨建て売掛金）：取引時1ドル100円→決算時90円（円高）→売掛金が100万円→90万円に減少→為替差損10万円。「円高は輸出企業に損失」の会計的反映。例②輸入企業（外貨建て買掛金）：取引時1ドル100円→決済時110円（円安）→買掛金110万円支払い→為替差損10万円。「円安は輸入企業に損失」の会計的反映。\nポイント：外貨資産＋円安＝差益、外貨資産＋円高＝差損、外貨負債＋円安＝差損、外貨負債＋円高＝差益、と表にして整理する。',
  '貨幣性項目・非貨幣性項目': '外貨換算における換算基準の分類を【　　　　　　】という。\n例）貨幣性項目（現金・売掛金・貸付金・借入金・買掛金等）→決算時レート（CR）で換算替え→為替差損益を認識。非貨幣性項目（棚卸資産・固定資産・繰延資産等）→取引時レートのまま→為替差損益を認識しない。例）外貨建て商品在庫（非貨幣性）→換算替えなし。外貨建て売掛金（貨幣性）→決算時レートで換算替え・差額は為替差損益。\nポイント：「いくらで換金できるか額が決まっている（金銭請求権）」→貨幣性→CR換算。「換金額が決まっていない（モノや権利）」→非貨幣性→取引時レート維持。',
  '社債の発行': '企業が資金調達のために投資家に社債を発行する方法を【　　　　　　】という。\n例）額面1億円（1口1,000円×10万口）・クーポン年1%・5年満期の社債を95円（95百万円）で発行（割引発行）。仕訳①発行時：（借）当座預金9,500万円 ／（貸）社債9,500万円（発行価額で計上）。仕訳②毎年利息：（借）社債利息100万円（1%×1億円）＋社債利息100万円（償却分：差額500万円÷5年）＝合計200万円社債利息 ／（貸）当座預金100万円（実際支払）＋社債100万円（帳簿価額増加）。仕訳③満期償還：（借）社債1億円 ／（貸）当座預金1億円。\nポイント：割引発行→実際の支払利息（名目）より社債利息の費用が多い（償却分が加算）→帳簿価額が毎年増加して満期に額面へ到達。',
  '額面金額': '社債や手形などに記載された満期時に支払われる元本の金額を【　　　　　　】という。\n例）社債（額面1億円・発行価格9,500万円・5年満期）。差額500万円＝事実上の追加利息（5年間で分割負担）。毎年100万円（500万円÷5年）を社債利息に加算。帳簿価額の推移：発行時9,500万円→1年後9,600万円→2年後9,700万円→…→5年後1億円（額面）。\nポイント：【　　　】は「最終的に返さなければならない金額」。発行時の帳簿価額（発行価格）と額面の差が「実質的な追加利息コスト」。満期時に帳簿価額が額面に一致するのが償却原価法の目標。',
  'クーポン': '社債の保有者に定期的に支払われる表面利率に基づく利息を【　　　　　　】という。\n例）額面100円・【　　　】（表面利率）1%・年1回利払いの社債→毎年1円を投資家に支払い。市場利率2%の場合：投資家は1%では不満→95円（割引価格）なら「5円の値上がり益＋年1円利息」で実質利回り2%に近づく。仕訳）【　　　】利息の支払：（借）社債利息100万円（額面1億円×1%）／（貸）当座預金100万円。\nポイント：【　　　】（表面利率）＞市場利率→プレミアム発行（額面超えで発行）。【　　　】＜市場利率→割引発行（額面未満で発行）。【　　　】と市場利率の比較が発行価格を決定する。',
  '割引発行': '社債を額面金額より低い価格で発行することを【　　　　　　】という。\n例）額面100円の社債を95円で発行（割引率5%）。投資家は5円の値上がり益（取得95円→満期100円）＋クーポン利息を受取れる→実質利回りが高くなる。発行体（企業）は5円分を5年間で分割負担（償却原価法）→毎年1円を社債利息費用に加算。仕訳）発行：（借）当座預金9,500万円（1億円×0.95）／（貸）社債9,500万円。毎年（償却原価法）：（借）社債利息100万円（差額1,000万円×1/10年） ／（貸）社債100万円（帳簿価額増加）。\nポイント：【　　　】→実際の現金支払額（クーポン）より費用計上額が多い→帳簿価額が毎年増加して額面へ収束。',
  '社債の償却原価法': '社債の発行差金を利息として毎期均等配分し帳簿価額を満期額面に近づける方法を【　　　　　　】という。\n例）額面1億円を9,500万円で発行（差額500万円）・10年満期。償却原価法（定額法）：年50万円（500万円÷10年）を毎期社債利息に加算し社債帳簿価額を増加。仕訳（毎年）：（借）社債利息50万円 ／（貸）社債50万円。これにより年1%のクーポン（100万円）と合わせて計150万円が年間の社債利息費用（実質利率≒1.5%）。10年後：社債帳簿価額9,500万円＋50万円×10年＝1億円（額面）で満期償還。\nポイント：社債利息の計上額＝クーポン（現金支払）＋償却原価法による加算額（または控除額）。試験では「毎期の社債利息計上額と社債帳簿価額の計算」が必出。',
  '端数利息': '社債の利払日と売買日のズレから生じる経過利息を【　　　　　　】という。\n例）年2回利払い（6月末・12月末）の社債（クーポン1%・額面100万円）を9月末に売買。【　　　】：前回利払日（6月末）から9月末までの3か月分＝100万円×1%×3/12＝2,500円。仕訳（買手）：（借）売買目的有価証券XX万円＋有価証券利息2,500円 ／（貸）現金（社債代金＋【　　　】）。12月末利払日に6か月分5,000円を受取：（借）現金5,000円 ／（貸）有価証券利息5,000円（【　　　】2,500円分は相殺されて3か月分が実質の収益）。\nポイント：【　　　】は「前回利払い以降の売主保有期間の利息を買主が代わりに受け取る分の前払い」。次の利払日に全額受取って精算する。',
  '取引の8要素': '簿記のすべての取引を表現する8つの要素を【　　　　　　】という。\n例）商品100万円を現金で仕入れ → 費用（仕入）の発生＋資産（現金）の減少。商品を120万円で現金販売 → 資産（現金）の増加＋収益（売上）の発生。\nポイント：資産の増加・減少、負債の増加・減少、資本の増加・減少、収益の発生、費用の発生の8要素。すべての仕訳はこれらの組み合わせで表現できる。',
  '決算振替仕訳': '収益・費用の残高を損益勘定へ振り替え当期純利益を繰越利益剰余金へ振り替える仕訳を【　　　　　　】という。\n例）売上500万円・仕入350万円・給料100万円等の全収益・費用を損益勘定へ振替 → 損益勘定残高（利益）50万円を繰越利益剰余金へ振替 → 収益・費用の全勘定がゼロリセット。\nポイント：名目勘定（収益・費用）の残高をゼロにして翌期に繰り越さない。実質勘定（資産・負債・純資産）は繰り越す。',
  '損益勘定': '決算においてすべての収益・費用を集約し当期純利益を算定するための一時的な勘定を【　　　　　　】という。\n例）収益500万円・費用450万円を【　　　】に集約 → 【　　　】残高50万円（純利益）を繰越利益剰余金へ振替 → 【　　　】の残高ゼロで閉鎖。翌期には【　　　】は存在しない。\nポイント：決算においてすべての収益・費用を集約する一時的な勘定。純利益確定後に閉鎖されて消滅する。',
  '帳簿の締め切り': '決算において各勘定の残高を次期に引き継ぐための作業を【　　　　　　】という。\n例）現金勘定残高50万円 → 「次期繰越50万円」で締め切り翌期首に「前期繰越50万円」として引き継ぐ。売上勘定残高500万円 → 損益勘定へ振替してゼロに（翌期にはゼロから始まる）。\nポイント：実質勘定（資産・負債・純資産）は残高を繰り越す。名目勘定（収益・費用）はゼロにリセットする。',
  '資本等式': '「資産－負債＝純資産（資本）」という貸借対照表の基本的な関係式を【　　　　　　】という。\n例）資産5,000万円－負債3,000万円＝純資産2,000万円。「会社の財産（5,000万円）から借金（3,000万円）を引いたら株主のもの（2,000万円）が残る」という意味。\nポイント：【　　　】＝資産－負債＝純資産。貸借対照表等式（資産＝負債＋純資産）と表裏一体。',
  '損益計算書等式': '「費用＋当期純利益＝収益」という損益計算書の基本的な関係式を【　　　　　　】という。\n例）費用450万円＋当期純利益50万円＝収益500万円。つまり「収益－費用＝利益（または損失）」。損益計算書全体が常にこの等式を満たしている。\nポイント：【　　　】＝費用＋当期純利益＝収益。収益と費用の差額が当期純利益になることを示す。',
  '継続企業の前提': '企業が将来にわたって事業を継続するという会計上の基本的な前提を【　　　　　　】という。\n例）通常の財務諸表は「この会社はこれからも続く」という前提で作られている（固定資産を長期で償却するなど）。倒産の危機にある場合はこの前提が崩れ財務諸表への注記が義務付けられる。\nポイント：ゴーイングコンサーン（Going Concern）ともいう。前提が成立しない懸念がある場合は財務諸表に追記情報として開示が必要。',
  '連結会計': '親会社と子会社をひとつの経済的実体とみなして財務諸表を合算・調整する会計処理を【　　　　　　】という。\n例）A社（親：持株80%）＋B社（子）のグループ。A社個別：売上100億円・資産500億円。B社個別：売上50億円・資産200億円。単純合算：売上150億円・資産700億円。しかし連結修正仕訳が必要：①A社→B社への売上20億円を相殺②B社株式（投資）とB社資本（純資産）を相殺消去③のれんと非支配株主持分を計上→連結後：売上130億円・資産650億円（実態）。\nポイント：連結財務諸表作成の3大論点：①投資と資本の相殺消去（初年度）②内部取引の相殺消去（毎年）③未実現利益の消去（毎年）。「グループ内の取引はなかったことにする」という視点が重要。',
  '連結財務諸表': '親会社と子会社グループ全体の財政状態・経営成績を示す財務諸表を【　　　　　　】という。\n例）【　　　】の作成手順：①個別財務諸表の合算（親＋子の各科目を足し合わせ）。②開始仕訳（前期末の連結修正を引き継ぐ）。③投資と資本の相殺消去→のれん・非支配株主持分の計上。④内部取引の相殺消去（グループ内の売上↔仕入・債権↔債務）。⑤未実現利益の消去（グループ内で未販売の在庫に含まれる内部利益を除去）。⑥のれんの償却（毎年）。\nポイント：【　　　】＝個別財務諸表の合算＋連結修正仕訳。グループ内の「内部取引」と「未実現利益」の消去が連結会計の核心作業。',
  '支配獲得日': '親会社が子会社に対する支配を獲得した日を【　　　　　　】という。\n例）3月31日（【　　　】）にA社がB社の60%株式（取得原価6,000万円）を取得。B社の純資産の帳簿価額8,000万円・時価8,500万円（500万円の評価差額が生じる）。連結修正仕訳①（子会社資産の時価評価）：（借）土地500万円 ／（貸）評価差額金500万円（子会社資産を時価に修正）。連結修正仕訳②（投資と資本の相殺消去）：（借）資本金等8,500万円（時価評価後）／（貸）子会社株式6,000万円＋非支配株主持分XX万円＋のれんXX万円。\nポイント：【　　　】は「連結開始日」。子会社の資産・負債は「帳簿価額」でなく「時価」で評価し直してから連結に組み込む。',
  '投資と資本の相殺消去': '連結手続きにおいて親会社の子会社株式と子会社の資本を相殺消去する処理を【　　　　　　】という。\n例）A社（親）がB社（子）の80%株式8,000万円を取得。B社の純資産時価1億円。連結修正仕訳：（借）B社資本金等1億円 ／（貸）子会社株式8,000万円（A社の投資）＋非支配株主持分2,000万円（1億円×20%）＋のれん0円（差額なし）。別例：取得額9,000万円の場合→のれん1,000万円（9,000万円－1億円×80%）が計上される。\nポイント：相殺消去の式：「親の投資額（子会社株式）＋非支配株主持分（子会社純資産×少数比率）＝子会社純資産時価」。超過分がのれん。',
  '非支配株主持分': '子会社の純資産のうち親会社以外の少数株主に帰属する部分を【　　　　　　】という。\n例）A社がB社の70%を保有（残30%は外部株主）。B社の純資産（時価評価後）500万円。連結B/Sへの計上：【　　　】＝500万円×30%＝150万円（純資産の部に計上）。B社の当期純利益100万円→連結P/L：親会社持分70万円・【　　　】30万円に按分。仕訳（連結修正・毎期）：（借）【　　　】当期変動額30万円 ／（貸）【　　　】30万円（B社利益30%分が【　　　】を増加させる）。\nポイント：【　　　】は「子会社の外部株主の取り分」。連結純資産に含まれるが親会社株主のものではない。',
  '内部取引の相殺消去': '連結グループ内の親子会社間取引を連結財務諸表上で相殺除去する手続きを【　　　　　　】という。\n例）A社（親）がB社（子）に商品1,000万円を販売・B社はまだ外部未販売（B社の在庫）。連結修正仕訳①（売上・仕入の相殺）：（借）売上1,000万円 ／（貸）売上原価1,000万円（A社の売上とB社の仕入を相殺）。連結修正仕訳②（債権・債務の相殺）：（借）買掛金1,000万円 ／（貸）売掛金1,000万円（B社の買掛金とA社の売掛金を相殺）。\nポイント：【　　　】でグループ連結売上は「外部への売上のみ」になる。相殺する科目：売上↔売上原価（P/L）、売掛金↔買掛金（B/S）。さらに未実現利益の消去も必要。',
  '未実現利益の消去': '連結グループ内の取引で発生した未実現の利益を連結財務諸表から除去する処理を【　　　　　　】という。\n例）A社（親）が原価800万円の商品をB社（子）に1,000万円で販売。B社はまだ外部に未販売→B社の在庫に200万円の未実現利益が含まれている。連結修正仕訳：（借）売上原価200万円 ／（貸）商品200万円（B社在庫の未実現利益分を減額→在庫を原価800万円に修正）。翌期B社が外部に1,200万円で販売→この時点で200万円の利益が実現→翌期の連結修正仕訳で利益消去を取消す。\nポイント：ダウンストリーム（親→子）→全額消去。アップストリーム（子→親）→非支配株主持分にも按分して消去。',
  '持分法': '投資先の純資産・損益の変動に応じて投資勘定を増減させる会計処理を【　　　　　　】という。\n例）A社がB社（関連会社：持分30%）の株式3,000万円を保有。B社当期純利益1,000万円。【　　　】仕訳：（借）投資有価証券300万円（A社持分30%）／（貸）【　　　】投資損益300万円（収益）。B社が配当200万円を実施→（借）現金60万円（200万円×30%）／（貸）投資有価証券60万円（配当で投資勘定を減らす）。【　　　】後の投資有価証券帳簿価額：3,000万円＋300万円－60万円＝3,240万円。\nポイント：【　　　】は「連結に準じた1行連結」。20〜50%保有→関連会社→【　　　】。50%超→子会社→完全連結。',
  'のれん（連結）': '連結において子会社の純資産公正価値を超えて支払った超過取得原価を【　　　　　　】という。\n例）A社がB社を1億円で買収。B社の純資産時価8,000万円。のれん＝1億円－8,000万円＝2,000万円（超過支払：B社のブランド・顧客基盤・技術力への対価）。10年均等償却なら年200万円。仕訳①相殺消去：（借）B社純資産8,000万円＋のれん2,000万円 ／（貸）子会社株式1億円。仕訳②毎年償却：（借）のれん償却200万円 ／（貸）のれん200万円（連結修正仕訳）。\nポイント：のれん＝「支払った代金－時価純資産」。連結財務諸表にだけ出てくる無形資産（個別財務諸表にはない）。20年以内で均等償却必須。IFRS（国際基準）では償却なし・減損テストのみ。',
  '段階取得': '子会社株式を複数回に分けて追加取得し最終的に支配を獲得する方法を【　　　　　　】という。\n例）第1回：B社株式30%を2,000万円で取得（持分法適用関連会社）。後日30%を追加取得→合計60%で子会社化（支配獲得日）。追加取得時のB社純資産時価：1億円。【　　　】の処理（支配獲得日）：①持分法による既保有30%分の帳簿価額：2,500万円（持分法適用後）。②支配獲得日の既保有30%分時価：1億円×30%＝3,000万円。差益：3,000万円－2,500万円＝500万円→【　　　】に係る差益（P/L計上）。\nポイント：【　　　】→支配獲得日に「既保有株式を時価評価しなおす」→差損益が発生する。この「みなし取得」処理が【　　　】の特殊点。',
  '銀行勘定調整表': '企業の当座預金帳簿残高と銀行残高証明書の残高の不一致を原因別に整理して調整する表を【　　　　　　】という。\n例）帳簿残高100万円≠銀行残高110万円（差額10万円）。調査の結果：①時間外預金15万円（帳簿処理済・銀行未処理→銀行残高に加算）②未取付小切手5万円（帳簿減算済・銀行未引落→銀行残高から控除）。\nポイント：調整の方向→「企業側の誤り・未記帳」は帳簿を修正。「銀行側の未処理（時間外預金・未取付小切手）」は銀行残高を調整。調整後の残高が一致したら正しい。不一致の原因を「時間外預金・未取付小切手・未渡小切手・連絡未達事項」の4つに分類して整理する。',
  '時間外預金': '営業時間外に預け入れたため翌営業日以降に銀行側で処理される入金を【　　　　　　】という。\n例）金曜夜にATMに50万円を入金。企業帳簿：当座預金50万円を増加（即時記帳）。銀行処理：翌月曜日に反映予定（まだ銀行残高に含まれていない）。銀行勘定調整表：銀行残高に50万円を加算→修正後銀行残高が50万円増。\nポイント：【　　　】は「企業は記帳済み・銀行は未処理」→銀行残高が少ない方向。調整時は銀行残高に加算。企業帳簿は修正不要（正しく記帳済み）。未取付小切手（銀行残高から差引）との違いを押さえる。',

const DETAIL = {};

function getSectionQuestions(sec){ return sec ? ALL.filter(SECS[sec]) : ALL; }

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base.filter(q=>!checkOnly||checked[q.id]);
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}



function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  return styleParens(txt);
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}</div>
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){
  const q=expQuestions[expQIdx];
  btn.style.display='none';
  const ro=document.getElementById('exp-ro-ans');
  ro.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa=q.exp?`<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>`:'';
  const area=document.createElement('div');
  area.className='exp-fill-exp-area';
  area.innerHTML=expJa+checkBtn;
  ro.insertAdjacentElement('afterend',area);
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa = isLastEntry && q.exp ? `<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>` : '';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${expJa}${checkBtn}${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${expJa}${checkBtn}${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  const res=document.getElementById('exp-res');
  if(res){ res.style.display='none'; res.innerHTML=''; }
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  ['sec-s3','sec-s2c','sec-s2i'].forEach(id=>{
    const btn=document.getElementById(id);
    if(btn) btn.classList.toggle('active',
      (sec==='s3'&&id==='sec-s3')||
      (sec==='s2c'&&id==='sec-s2c')||
      (sec==='s2i'&&id==='sec-s2i')
    );
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}




function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? 'チェックのみ解除' : 'チェックのみ';
  buildDeck();
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='チェックのみ'; }
  setSection('s3');
}



function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('s3');
