  {"no":82,"en":"Gain on Sale of Securities","name":"有価証券売却益","bucket":"有価証券","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>有価証券売却益</strong>とは、保有する有価証券を、帳簿価額より高い価格で売却したときに生じる利益のこと。","cls":"資金運用の成果として生じる収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":83,"en":"Gain on Valuation of Securities","name":"有価証券評価益","bucket":"有価証券","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>有価証券評価益</strong>とは、保有する有価証券を時価評価した結果、帳簿価額より時価が上昇した場合の、その上昇分の利益のこと。","cls":"資金運用の結果生じる収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":84,"en":"Dividends Receivable","name":"未収配当金","bucket":"有価証券","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>未収配当金</strong>とは、株式の配当を受け取る権利は確定しているが、まだ実際には入金されていない金額を記録する資産科目。","cls":"近いうちに回収される権利なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":85,"en":"Investment Securities","name":"投資有価証券","bucket":"有価証券","cat":"asset","ans":[["B/S","投資その他の資産"]],"disp":null,"def":"<strong>投資有価証券</strong>とは、満期保有目的債券やその他有価証券のうち、1年を超えて保有する分をまとめて表示するときに使う科目名。","cls":"短期的な売買目的ではなく長く保有する資産なので、<strong>B/S上は投資その他の資産</strong>に表示する。"},
  {"no":86,"en":"Affiliated Company Stocks","name":"関連会社株式","bucket":"有価証券","cat":"asset","ans":[["B/S","投資その他の資産"]],"disp":"関係会社株式","def":"<strong>関連会社株式</strong>とは、他社の意思決定に重要な影響を与える目的で、議決権の20%以上などを保有する株式のこと。","cls":"値上がり益を狙う投資ではなく、関連会社との関係を維持するために長く持ち続ける資産なので、<strong>B/S上は投資その他の資産</strong>に表示し、子会社株式とあわせて「関係会社株式」という名前で記載する。"},
  {"no":87,"en":"Equity in Earnings of Affiliates","name":"持分法による投資利益","bucket":"有価証券","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>持分法による投資利益</strong>とは、持分法を適用する関連会社の当期純利益のうち、自社の持株比率に応じた分を、自社の利益として取り込んだときに使う収益科目。","cls":"本業の売上そのものではなく、投資先の業績を反映した副次的な収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":88,"en":"Loss on Valuation of Investment Securities","name":"投資有価証券評価損","bucket":"有価証券","cat":"expense","ans":[["P/L","営業外費用または特別損失"]],"disp":null,"def":"<strong>投資有価証券評価損</strong>とは、その他有価証券などについて、時価が著しく下落し回復の見込みがないと判断したとき（減損処理）に計上する評価損のこと。","cls":"毎期ふつうに生じる評価替えとは異なり臨時性が高い損失なので、金額に応じて<strong>P/L上は営業外費用または特別損失</strong>に表示する。"},
  {"no":89,"en":"Loss on Sale of Investment Securities","name":"投資有価証券売却損","bucket":"有価証券","cat":"expense","ans":[["P/L","営業外費用"]],"disp":null,"def":"<strong>投資有価証券売却損</strong>とは、満期保有目的債券やその他有価証券を帳簿価額より低い金額で売却したときに生じる損失のこと。","cls":"資金運用の結果として毎期ふつうに生じうる損失なので、<strong>P/L上は営業外費用</strong>に表示する。"},
  {"no":90,"en":"Depreciation Expense","name":"減価償却費","bucket":"有形固定資産","cat":"expense","ans":[["P/L","販売費及び一般管理費"],["製造原価報告書","経費（工場の資産の分）"]],"disp":null,"def":"<strong>減価償却費</strong>とは、建物や機械などの固定資産の取得原価を、使用する期間にわたって少しずつ費用として配分したもの。","cls":"本社や営業所で使う資産の分はP/L上の<strong>販売費及び一般管理費になるが</strong>、工場の製造設備にかかる分は製品を作るためのコストなので、製造原価報告書の経費として扱われる。"},
  {"no":91,"en":"Building","name":"建物","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>建物</strong>とは、本社・店舗・工場など、会社が長期間にわたって営業のために使用する不動産（形のある資産）のこと。","cls":"1年を超えて使い続けるために保有しているので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":92,"en":"Fixed Asset Compression Loss","name":"固定資産圧縮損","bucket":"有形固定資産","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>固定資産圧縮損</strong>とは、国庫補助金などを受け取って固定資産を取得したとき、圧縮記帳という方法で、その資産の帳簿価額をあえて引き下げる処理をしたときに計上する費用科目。","cls":"補助金を受け取った臨時的な取引に伴うものなので、対になる国庫補助金受贈益と同じく、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":93,"en":"Deferred Tax Liabilities","name":"繰延税金負債","bucket":"有形固定資産","cat":"liability","ans":[["B/S","固定負債"]],"disp":null,"def":"<strong>繰延税金負債</strong>とは、税効果会計を適用したときに、将来の税金を増やす原因となる一時差異（例：その他有価証券の評価益など）に対して計上する負債科目。","cls":"2級の範囲では一律、<strong>固定負債に表示するというルールになっており</strong>、繰延税金資産がある場合はそれと相殺して、差額だけをB/Sに記載する。"},
  {"no":94,"en":"Supplies Inventory","name":"貯蔵品","bucket":"有形固定資産","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>貯蔵品</strong>とは、まだ使っていない郵便切手や収入印紙、あるいは固定資産を除却したときに残る部品などの、換金性・利用可能性のある少額資産をまとめて記録する科目。","cls":"近いうちに使用または売却されるものなので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":95,"en":"Construction in Progress","name":"建設仮勘定","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>建設仮勘定</strong>とは、建物などの固定資産が完成するまでの間に、工事の請負業者へ前払いした金額を、完成するまで一時的にプールしておく資産科目。","cls":"完成すれば正式に「建物」などに振り替わる、いわば建設中の固定資産なので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":96,"en":"Deferred Tax Assets","name":"繰延税金資産","bucket":"有形固定資産","cat":"asset","ans":[["B/S","投資その他の資産"]],"disp":null,"def":"<strong>繰延税金資産</strong>とは、税効果会計を適用したときに、将来の税金を減らす効果がある一時差異（例：貸倒引当金の繰入限度超過額など）に対して計上する資産科目。","cls":"2級の範囲では一律、<strong>投資その他の資産（固定資産）に表示するというルールになっており</strong>、繰延税金負債がある場合はそれと相殺して差額だけを記載する。"},
  {"no":97,"en":"Land","name":"土地","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>土地</strong>とは、本社・店舗・工場の敷地など、会社が長期間保有して使用する不動産のこと。","cls":"建物などと同じく形のある資産なので<strong>B/S上は有形固定資産</strong>に表示するが、使っても価値が減っていくわけではないため、ほかの固定資産と違って減価償却は行わない。"},
  {"no":98,"en":"Loss on Retirement of Assets","name":"固定資産除却損","bucket":"有形固定資産","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>固定資産除却損</strong>とは、まだ使えなくなっていない固定資産を、使用をやめて処分したときに生じる、帳簿価額相当の損失のこと。","cls":"固定資産を手放すことは毎期ふつうに起きる取引ではなく臨時的なので、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":99,"en":"Loss on Sale of Fixed Assets","name":"固定資産売却損","bucket":"有形固定資産","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>固定資産売却損</strong>とは、建物や備品などの固定資産を、帳簿価額より低い金額で売却したときに生じる損失のこと。","cls":"固定資産の売却は毎期ふつうに起きる取引ではなく臨時的なので、<strong>P/L上は特別損失</strong>に表示する（売却益が出た場合は特別利益になる）。"},
  {"no":100,"en":"Government Grant Revenue","name":"国庫補助金受贈益","bucket":"有形固定資産","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>国庫補助金受贈益</strong>とは、国や地方公共団体から固定資産の取得などのために補助金を受け取ったときに生じる収益のこと。","cls":"毎期ふつうに受け取るものではなく臨時的な収益なので、P/L上は<strong>特別利益に表示し</strong>、圧縮記帳を行う場合は対になる固定資産圧縮損（特別損失）とセットで処理する。"},
  {"no":101,"en":"Accum. Depr. (Building)","name":"建物減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（建物の下に△で控除）"]],"disp":"減価償却累計額","def":"<strong>建物減価償却累計額</strong>とは、建物についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物そのものの価値を直接減らすのではなく、取得原価はそのまま残したうえで、その下に△（マイナス）として差し引く形で<strong>B/S上の有形固定資産</strong>に表示する（間接法）。負債ではない点に注意。"},
  {"no":102,"en":"Fire Loss","name":"火災損失","bucket":"有形固定資産","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>火災損失</strong>とは、火災によって建物や商品などの資産が失われたときに生じる損失のこと。","cls":"自然災害・事故による損失は毎期ふつうに起きるものではなく臨時的なので、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":103,"en":"Deferred Tax Expense","name":"法人税等調整額","bucket":"有形固定資産","cat":"other","ans":[["P/L","法人税、住民税及び事業税の下で加減する"]],"disp":null,"def":"<strong>法人税等調整額</strong>とは、税効果会計を適用したときに、会計上の利益と税法上の所得のズレを調整するために計上する科目。","cls":"税金そのものの金額を調整するものなので、営業外や特別の区分には入れず、<strong>P/L上は法人税、住民税及び事業税のすぐ下で加減する形</strong>で表示する。"},
  {"no":104,"en":"Non-trade Receivable","name":"未収入金","bucket":"有形固定資産","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>未収入金</strong>とは、商品以外のもの（例えば不要になった備品など）を売却した代金のうち、まだ受け取っていない分を記録する資産科目。","cls":"本業の商品販売から生じる売掛金とは区別されるが、近いうちに回収する権利なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":105,"en":"Prepaid Interest","name":"前払利息","bucket":"有形固定資産","cat":"asset","ans":[["B/S","流動資産"]],"disp":"前払費用","def":"<strong>前払利息</strong>とは、まだ経過していない期間の利息を、先に支払ったときに計上する資産科目。","cls":"前払保険料と同じ考え方で、まだ発生していない将来の利息費用に対応する権利なので、<strong>B/S上は流動資産（表示科目：前払費用）</strong>に表示する。"},
  {"no":106,"en":"Equipment","name":"備品","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>備品</strong>とは、パソコンや机・椅子など、営業のために長期間使用する、比較的小型の形のある資産のこと。","cls":"建物や機械と同じく1年を超えて使い続けるために保有しているので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":107,"en":"Vehicles","name":"車両運搬具","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>車両運搬具</strong>とは、営業用の自動車やトラックなど、人や物を運ぶために使用する形のある資産のこと。","cls":"長期間使用する目的で保有しているので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":108,"en":"Structures","name":"構築物","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>構築物</strong>とは、舗装道路や塀、看板など、土地の上に定着して作られた、建物以外の工作物のこと。","cls":"長期間使用する形のある資産なので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":109,"en":"Tools, Furniture and Fixtures","name":"工具器具備品","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>工具器具備品</strong>とは、測定工具や事務機器など、比較的小さな道具・器具類をまとめて記録する資産科目。","cls":"備品と同じく長期間使用する形のある資産なので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":110,"en":"Accum. Depr. (Equipment)","name":"備品減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（備品の下に△で控除）"]],"disp":"減価償却累計額","def":"<strong>備品減価償却累計額</strong>とは、備品についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物減価償却累計額と同じく、取得原価はそのまま残し、その下に△（マイナス）で差し引く形で<strong>B/S上の有形固定資産</strong>に表示する（間接法）。車両運搬具・機械装置・構築物・工具器具備品についても、それぞれの資産の下に同じように控除する形で表示する。"},
  {"no":111,"en":"Retained Earnings","name":"繰越利益剰余金","bucket":"有形固定資産","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>繰越利益剰余金</strong>とは、これまで会社が稼いだ利益のうち、配当などで社外に出さずに積み上がってきた、会社に蓄積された利益の合計。","cls":"当期純利益が毎期ここに加算されていく、会社の「貯金」にあたる項目なので、<strong>B/S上は純資産の株主資本（利益剰余金）</strong>に表示する。"},
  {"no":112,"en":"Reserve for Tax-Deferred Reduction","name":"圧縮積立金","bucket":"有形固定資産","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>圧縮積立金</strong>とは、税法上の圧縮記帳を、固定資産の帳簿価額を直接減らす方法ではなく、剰余金の処分として積み立てる方法で行ったときに計上する科目。","cls":"利益の中からの積立てなので、<strong>B/S上は純資産の株主資本（利益剰余金）</strong>に表示する。"},
  {"no":113,"en":"Loss on Disposal of Assets","name":"固定資産廃棄損","bucket":"有形固定資産","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>固定資産廃棄損</strong>とは、固定資産を売却・譲渡せずに、そのまま廃棄処分したときに生じる、帳簿価額相当の損失のこと。","cls":"固定資産除却損と同じく、毎期ふつうに起きる取引ではなく臨時的なので、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":114,"en":"Gain on Sale of Fixed Assets","name":"固定資産売却益","bucket":"有形固定資産","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>固定資産売却益</strong>とは、建物や備品などの固定資産を、帳簿価額より高い金額で売却したときに生じる利益のこと。","cls":"固定資産の売却は毎期ふつうに起きる取引ではなく臨時的なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":115,"en":"Insurance Proceeds Gain","name":"保険差益","bucket":"有形固定資産","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>保険差益</strong>とは、火災などで資産を失ったときに受け取った保険金が、失った資産の帳簿価額を上回った場合の、その上回った分の利益のこと。","cls":"火災という臨時的な出来事から生じる利益なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":116,"en":"Suspense Account","name":"未決算","bucket":"有形固定資産","cat":"asset","ans":[["表示なし","火災損失・保険差益等に振り替える"]],"disp":null,"def":"<strong>未決算</strong>とは、火災などで資産が失われたものの、保険金でいくら補填されるかがまだ確定していない間、一時的に記録しておく仮の勘定。","cls":"<strong>保険金額が確定した時点で</strong>、火災損失や保険差益など正しい科目に振り替えるため、未決算という科目自体はB/S・P/Lに残らない。"},
  {"no":117,"en":"Building Fixtures","name":"建物付属設備","bucket":"有形固定資産","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>建物付属設備</strong>とは、建物に取り付けられた電気・給排水・空調設備など、建物本体とは区別して管理する設備のこと。","cls":"長期間使用する形のある資産なので、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":118,"en":"Accumulated Depreciation","name":"減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（控除項目）"]],"disp":null,"def":"<strong>減価償却累計額</strong>とは、複数の種類の固定資産についてこれまで計上してきた減価償却費をまとめて記録する評価勘定。","cls":"資産そのものの価値を直接減らすのではなく、取得原価を残したまま下に△（マイナス）で差し引く形で、<strong>B/S上は有形固定資産</strong>に表示する（間接法）。"},
  {"no":119,"en":"Accumulated Depreciation (Vehicles)","name":"車両運搬具減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（控除項目）"]],"disp":"減価償却累計額","def":"<strong>車両運搬具減価償却累計額</strong>とは、車両運搬具についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物減価償却累計額と同じく、取得原価を残したまま下に△（マイナス）で差し引く形で、<strong>B/S上は有形固定資産</strong>に表示する（間接法）。"},
  {"no":120,"en":"Accumulated Depreciation (Machinery)","name":"機械装置減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（控除項目）"]],"disp":"減価償却累計額","def":"<strong>機械装置減価償却累計額</strong>とは、機械装置についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物減価償却累計額と同じく、取得原価を残したまま下に△（マイナス）で差し引く形で、<strong>B/S上は有形固定資産</strong>に表示する（間接法）。"},
  {"no":121,"en":"Accumulated Depreciation (Structures)","name":"構築物減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（控除項目）"]],"disp":"減価償却累計額","def":"<strong>構築物減価償却累計額</strong>とは、構築物についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物減価償却累計額と同じく、取得原価を残したまま下に△（マイナス）で差し引く形で、<strong>B/S上は有形固定資産</strong>に表示する（間接法）。"},
  {"no":122,"en":"Accumulated Depreciation (Tools and Fixtures)","name":"工具器具備品減価償却累計額","bucket":"有形固定資産","cat":"other","ans":[["B/S","有形固定資産（控除項目）"]],"disp":"減価償却累計額","def":"<strong>工具器具備品減価償却累計額</strong>とは、工具器具備品についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物減価償却累計額と同じく、取得原価を残したまま下に△（マイナス）で差し引く形で、<strong>B/S上は有形固定資産</strong>に表示する（間接法）。"},
  {"no":123,"en":"Asset Retirement Obligation","name":"資産除去債務","bucket":"有形固定資産","cat":"liability","ans":[["B/S","固定負債"]],"disp":null,"def":"<strong>資産除去債務</strong>とは、固定資産を将来除去（撤去・原状回復）するときにかかると見積もられる費用を、現在価値に割り引いて負債として計上したもの。","cls":"多くの場合、資産を使い続ける長期間にわたって履行する義務なので、<strong>B/S上は固定負債</strong>に表示する。"},
  {"no":124,"en":"Government Subsidy Income","name":"国庫補助金収入","bucket":"有形固定資産","cat":"revenue","ans":[["P/L","特別利益"]],"disp":"国庫補助金受贈益","def":"<strong>国庫補助金収入</strong>とは、国や地方自治体から、特定の固定資産を取得するための補助金を受け取ったときに生じる収益のこと。","cls":"毎期ふつうに受け取るものではなく臨時的な収益なので、<strong>P/L上は特別利益</strong>に「国庫補助金受贈益」として表示する。"},
  {"no":125,"en":"Suspense Account for Fire Loss","name":"火災未決算","bucket":"有形固定資産","cat":"asset","ans":[["表示なし","火災損失・保険差益等に振り替える"]],"disp":null,"def":"<strong>火災未決算</strong>とは、未決算の中でも特に、火災で資産が失われた場合に使う勘定名。","cls":"保険金額が確定した時点で火災損失や保険差益など正しい科目に振り替えるため、<strong>火災未決算という科目自体はB/S・P/Lに残らない</strong>。"},
  {"no":126,"en":"Interest Cost (Asset Retirement Obligation)","name":"利息費用","bucket":"有形固定資産","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>利息費用</strong>とは、資産除去債務を時の経過にあわせて調整したときに生じる、時間の経過分の増加額を記録する費用のこと。","cls":"固定資産の使用に伴って毎期発生する費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":127,"en":"Bonus Reserve Expense","name":"賞与引当金繰入","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>賞与引当金繰入</strong>とは、まだ支給日が来ていない従業員ボーナスのうち、今期の労働にすでに対応している分を、費用として前もって見積り計上するときの勘定科目。","cls":"ボーナスは給料と同じ人件費の一種なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":128,"en":"Provision for Repairs","name":"修繕引当金","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>修繕引当金</strong>とは、来期に予定している建物や設備の定期修繕に備えて、その費用をあらかじめ見積り計上しておく負債科目。","cls":"通常は1年以内（翌期）に実際の修繕が行われることを想定しているため、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":129,"en":"Lease Obligations","name":"リース債務","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","流動負債（1年以内に支払う分）"],["B/S","固定負債（1年より先に支払う分）"]],"disp":null,"def":"<strong>リース債務</strong>とは、ファイナンス・リース取引で、リース資産を分割払いで購入したのと同じように扱うときに計上する、将来のリース料支払義務（負債）。","cls":"長期借入金と同じく、決算日の翌日から1年以内に支払う分は<strong>流動負債</strong>、1年より先の分は固定負債に分けて表示する（1年基準）。"},
  {"no":130,"en":"Software Amortization","name":"ソフトウェア償却","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>ソフトウェア償却</strong>とは、自社利用目的で購入・開発したソフトウェア（無形固定資産）の取得原価を、利用する期間にわたって少しずつ費用化したもの。","cls":"建物の減価償却と同じ考え方で、本業を営むために使う資産の費用化なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":131,"en":"Software","name":"ソフトウェア","bucket":"無形・リース・引当金","cat":"asset","ans":[["B/S","無形固定資産"]],"disp":null,"def":"<strong>ソフトウェア</strong>とは、自社利用目的で購入・開発したコンピュータプログラムのこと。","cls":"建物のように形はありませんが、長期間にわたって利用し続ける資産なので、<strong>B/S上は無形固定資産</strong>に表示する。"},
  {"no":132,"en":"Leased Assets","name":"リース資産","bucket":"無形・リース・引当金","cat":"asset","ans":[["B/S","有形固定資産"]],"disp":null,"def":"<strong>リース資産</strong>とは、ファイナンス・リース取引で借りている資産を、実質的に分割払いで購入したのと同じとみなして計上する資産科目。","cls":"形のある資産を長期間使い続ける点で自己所有の固定資産と変わらないため、<strong>B/S上は有形固定資産</strong>に表示する。"},
  {"no":133,"en":"Retirement Benefit Obligation","name":"退職給付引当金","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","固定負債"]],"disp":null,"def":"<strong>退職給付引当金</strong>とは、従業員が将来退職するときに支払う退職金・年金に備えて、現在までに発生している分をあらかじめ見積り計上しておく負債科目。","cls":"実際の支払いは通常ずっと先になるため、<strong>B/S上は固定負債</strong>に表示する。"},
  {"no":134,"en":"Provision for Product Warranties","name":"商品保証引当金","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>商品保証引当金</strong>とは、販売した商品に対する無料の保証修理（アフターサービス）に備えて、その費用をあらかじめ見積り計上しておく負債科目。","cls":"通常は1年以内に保証期間内の修理が発生することを想定しているため、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":135,"en":"Provision for Product Warranties Expense","name":"商品保証引当金繰入","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>商品保証引当金繰入</strong>とは、商品保証引当金を計上するときの、費用側の相手勘定。","cls":"売った商品の無料修理に備える費用は、商品を売るための活動に伴うコストなので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":136,"en":"Retirement Benefit Expense","name":"退職給付費用","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"],["製造原価報告書","労務費（工場の従業員の分）"]],"disp":null,"def":"<strong>退職給付費用</strong>とは、当期に発生した、従業員への将来の退職金・年金の見積額を費用として計上したもの。","cls":"本社・営業部門の従業員の分は人件費としてP/L上の<strong>販売費及び一般管理費になるが</strong>、工場の従業員の分は製品を作るためのコストなので、製造原価報告書の労務費として扱われる。"},
  {"no":137,"en":"Bonus Reserve","name":"賞与引当金","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>賞与引当金</strong>とは、賞与引当金繰入によって見積り計上した、次のボーナス支給額の負債側の科目。","cls":"通常は1年以内（次の支給日）に実際の支払いが行われることを想定しているため、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":138,"en":"Patent Rights","name":"特許権","bucket":"無形・リース・引当金","cat":"asset","ans":[["B/S","無形固定資産"]],"disp":null,"def":"<strong>特許権</strong>とは、自社が開発した発明などを独占的に利用できる、法律上の権利のこと。","cls":"形はありませんが、長期間にわたって事業に活用できる価値ある権利なので、<strong>B/S上は無形固定資産</strong>に表示する。"},
  {"no":139,"en":"Trademark Rights","name":"商標権","bucket":"無形・リース・引当金","cat":"asset","ans":[["B/S","無形固定資産"]],"disp":null,"def":"<strong>商標権</strong>とは、自社のブランド名やロゴマークなどを独占的に使用できる、法律上の権利のこと。","cls":"形はありませんが、長期間にわたって事業価値を支える権利なので、<strong>B/S上は無形固定資産</strong>に表示する。"},
  {"no":140,"en":"Software in Progress","name":"ソフトウェア仮勘定","bucket":"無形・リース・引当金","cat":"asset","ans":[["B/S","無形固定資産"]],"disp":null,"def":"<strong>ソフトウェア仮勘定</strong>とは、自社利用目的のソフトウェアがまだ完成していない開発途中の段階で、それまでにかかった支出を一時的にプールしておく資産科目。","cls":"建設仮勘定のソフトウェア版にあたり、完成すれば「ソフトウェア」に振り替わるので、<strong>B/S上は無形固定資産</strong>に表示する。"},
  {"no":141,"en":"Research and Development Expense","name":"研究開発費","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>研究開発費</strong>とは、新しい製品や技術を開発するために支出した費用のこと。","cls":"将来の成果が不確実なため資産にはせず、発生したときに全額を費用として処理し、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":142,"en":"Directors' Bonus Reserve","name":"役員賞与引当金","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>役員賞与引当金</strong>とは、まだ支給日が来ていない役員向けのボーナスのうち、今期の職務にすでに対応している分を、あらかじめ見積り計上しておく負債科目。","cls":"通常は1年以内に支給されることを想定しているため、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":143,"en":"Product Warranty Reserve","name":"製品保証引当金","bucket":"無形・リース・引当金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>製品保証引当金</strong>とは、製造業において、販売した製品に対する無料の保証修理に備えて、その費用をあらかじめ見積り計上しておく負債科目。","cls":"商品保証引当金と同じ考え方で、通常は1年以内に修理が発生することを想定しているため、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":144,"en":"Lease Payment Expense","name":"支払リース料","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>支払リース料</strong>とは、オペレーティング・リース取引で、資産・負債を計上せずに、リース料を支払うたびにそのまま費用として処理する科目。","cls":"通常の賃借料（レンタル料）と同じ性質の費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":145,"en":"Patent Amortization","name":"特許権償却","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>特許権償却</strong>とは、無形固定資産である特許権の取得原価を、利用できる期間にわたって少しずつ費用化したもの。","cls":"ソフトウェア償却と同じく、本業を営むために使う資産の費用化なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":146,"en":"Provision for Repairs Expense","name":"修繕引当金繰入","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>修繕引当金繰入</strong>とは、修繕引当金を計上するときの、費用側の相手勘定。","cls":"来期の修繕に備える費用は、固定資産を良好な状態で維持するための諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":147,"en":"Product Warranty Expense","name":"製品保証引当金繰入","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>製品保証引当金繰入</strong>とは、製品保証引当金を計上するときの、費用側の相手勘定。","cls":"商品保証引当金繰入と同じく、売った製品の無料修理に備える費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":148,"en":"Directors' Bonus Reserve Expense","name":"役員賞与引当金繰入","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>役員賞与引当金繰入</strong>とは、役員賞与引当金を計上するときの、費用側の相手勘定。","cls":"役員へのボーナスの見積額は人件費の一種なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":149,"en":"Warranty Repair Costs","name":"商品保証費","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>商品保証費</strong>とは、引当金を設定せず、実際に保証修理が発生したときにその場で費用として処理する場合の科目。","cls":"売った商品のアフターサービスにかかる費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":150,"en":"Impairment Loss","name":"減損損失","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>減損損失</strong>とは、固定資産の収益性が低下し、投資額を将来回収できる見込みが立たなくなったときに、帳簿価額を回収可能額まで切り下げる処理のこと。","cls":"毎期ふつうに生じるものではなく臨時的な損失なので、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":151,"en":"Loss on Cancellation of Lease","name":"リース解約損","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>リース解約損</strong>とは、ファイナンス・リース契約を期の途中で解約したときに生じる損失のこと。","cls":"毎期ふつうに生じるものではなく臨時的な損失なので、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":152,"en":"Accumulated Depreciation (Lease Assets)","name":"リース資産減価償却累計額","bucket":"無形・リース・引当金","cat":"other","ans":[["B/S","有形固定資産（控除項目）"]],"disp":"減価償却累計額","def":"<strong>リース資産減価償却累計額</strong>とは、リース資産についてこれまで計上してきた減価償却費の合計額を記録する評価勘定。","cls":"建物減価償却累計額と同じく、取得原価を残したまま下に△（マイナス）で差し引く形で、<strong>B/S上は有形固定資産</strong>に表示する（間接法）。"},
  {"no":153,"en":"Amortization of Trademark Right","name":"商標権償却","bucket":"無形・リース・引当金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>商標権償却</strong>とは、無形固定資産である商標権の取得原価を、使用する期間にわたって少しずつ費用として配分したもの。","cls":"本業を営むための継続的な費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":154,"en":"Capital Stock","name":"資本金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本）"]],"disp":null,"def":"<strong>資本金</strong>とは、株主が会社の設立や増資のときに出資したお金のうち、会社法の規定にもとづいて資本金とした部分。","cls":"株主が会社に払い込んだ、返済不要の元手の中心部分なので、<strong>B/S上は純資産の株主資本</strong>に表示する。"},
  {"no":155,"en":"Gain on Bargain Purchase","name":"負ののれん発生益","bucket":"株式会社会計","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>負ののれん発生益</strong>とは、他社を買収したときに支払った金額が、引き継いだ資産・負債の時価の正味の価値より少なかった（割安に買えた）場合に生じる差額の利益。","cls":"毎期ふつうに生じるものではなく、M&Aという臨時的な取引から生じる利益なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":156,"en":"Goodwill","name":"のれん","bucket":"株式会社会計","cat":"asset","ans":[["B/S","無形固定資産"]],"disp":null,"def":"<strong>のれん</strong>とは、他社を買収したときに支払った金額が、引き継いだ資産・負債の時価の正味の価値を上回った場合の、その超過額のこと。","cls":"その会社のブランド力や将来の収益力に対して追加で払った、形のない資産と考えるため、<strong>B/S上は無形固定資産</strong>に表示する。"},
  {"no":157,"en":"Legal Earned Reserve","name":"利益準備金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>利益準備金</strong>とは、会社が配当を行う際に、会社法の規定にしたがって、もうけの中から強制的に積み立てておかなければならない準備金のこと。","cls":"株主への配当の原資となる利益剰余金の一部なので、<strong>B/S上は純資産の株主資本（利益剰余金）</strong>に表示する。"},
  {"no":158,"en":"Special Reserve","name":"別途積立金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>別途積立金</strong>とは、会社が稼いだ利益のうち、特定の使いみちを法律で定めずに、会社が自分の判断で将来に備えて取っておいた任意積立金のこと。","cls":"配当せずに社内に留保した利益の一部なので、<strong>B/S上は純資産の株主資本（利益剰余金）</strong>に表示する。"},
  {"no":159,"en":"Goodwill Amortization","name":"のれん償却","bucket":"株式会社会計","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>のれん償却</strong>とは、他社買収時に計上した「のれん」という資産を、一定の期間（原則20年以内）にわたって少しずつ費用化したもの。","cls":"のれんは本業の収益力に対して払ったものなので、その償却費用も<strong>P/L上は本業の費用である販売費及び一般管理費</strong>に表示する。"},
  {"no":160,"en":"Dividends Payable","name":"未払配当金","bucket":"株式会社会計","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>未払配当金</strong>とは、株主総会で配当を行うことが決まったものの、まだ実際には株主に支払っていない金額を記録する負債科目。","cls":"決算後まもなく支払われる義務なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":161,"en":"Capital Reserve","name":"資本準備金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の資本剰余金）"]],"disp":null,"def":"<strong>資本準備金</strong>とは、株主が出資したお金のうち、会社法にしたがって資本金にはしなかった部分（出資額の2分の1まで）を積み立てた準備金のこと。","cls":"株主からの払込資本の一部なので、<strong>B/S上は純資産の株主資本（資本剰余金）</strong>に表示する。"},
  {"no":162,"en":"Separate Deposit","name":"別段預金","bucket":"株式会社会計","cat":"asset","ans":[["B/S","流動資産"]],"disp":"現金預金","def":"<strong>別段預金</strong>とは、増資の払込金や社債の発行代金などを、正式に資本金・社債として処理するまでの間、一時的にプールしておく特別な預金口座のこと。","cls":"性質としてはすぐに使える預金なので、B/S上は<strong>流動資産に表示し</strong>、「現金預金」としてまとめて記載する。"},
  {"no":163,"en":"Organization Costs","name":"創立費","bucket":"株式会社会計","cat":"asset","ans":[["B/S","繰延資産"]],"disp":null,"def":"<strong>創立費</strong>とは、会社を設立するためにかかった、定款の作成費用や設立登記の登録免許税などの支出を、繰延資産（資産）として計上したもの。","cls":"名前に「費」とつくが、会社の設立という将来に効果が及ぶ支出なので、費用にせず、いったん資産（<strong>繰延資産）として計上し</strong>、数年かけて償却していく。"},
  {"no":164,"en":"Organization & Pre-opening Costs","name":"開業費","bucket":"株式会社会計","cat":"asset","ans":[["B/S","繰延資産"]],"disp":null,"def":"<strong>開業費</strong>とは、会社設立後、実際に営業を開始するまでの間にかかった、広告費や事務所の準備費用などの支出を、繰延資産（資産）として計上したもの。","cls":"創立費と同じく、開業準備という将来に効果が及ぶ支出なので、資産（<strong>繰延資産）としていったん計上し</strong>、数年かけて償却していく。"},
  {"no":165,"en":"Stock Issuance Costs","name":"株式交付費","bucket":"株式会社会計","cat":"asset","ans":[["B/S","繰延資産"]],"disp":null,"def":"<strong>株式交付費</strong>とは、新しく株式を発行するためにかかった、印刷費や証券会社への手数料などの支出を、繰延資産（資産）として計上したもの。","cls":"資金調達という将来に効果が及ぶ支出とみなして、資産（<strong>繰延資産）としていったん計上し</strong>、数年かけて償却していく。"},
  {"no":166,"en":"Stock Subscription Deposits","name":"株式申込証拠金","bucket":"株式会社会計","cat":"liability","ans":[["B/S","純資産（株主資本、資本金の次に独立の項目として表示）"]],"disp":null,"def":"<strong>株式申込証拠金</strong>とは、新株を発行するときに、株式の引受人（申込者）から払い込まれたお金を、正式に資本金・資本準備金に振り替えるまでの間、一時的に記録しておく科目。","cls":"将来株主となる人からすでに払い込まれたお金なので、<strong>B/S上は純資産（株主資本）</strong>に表示する。"},
  {"no":167,"en":"Other Capital Surplus","name":"その他資本剰余金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の資本剰余金）"]],"disp":null,"def":"<strong>その他資本剰余金</strong>とは、株主からの払込資本のうち、資本準備金以外の資本剰余金をまとめて記録する科目。","cls":"株主が出したお金に由来する項目なので、<strong>B/S上は純資産の株主資本（資本剰余金）</strong>に表示する。"},
  {"no":168,"en":"Treasury Stock","name":"自己株式","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本、末尾にマイナス表示）"]],"disp":null,"def":"<strong>自己株式</strong>とは、会社が自社の発行した株式を買い戻して保有しているもののこと。","cls":"株主に払い戻したお金とみなされるため、資産ではなく、<strong>B/S上は純資産の株主資本の一番下にマイナス（控除項目）</strong>として表示する。"},
  {"no":169,"en":"Building Renewal Reserve","name":"新築積立金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>新築積立金</strong>とは、将来の建物の新築・増改築に備えて、会社が利益の中から任意に積み立てておく積立金のこと。","cls":"別途積立金と同じ任意積立金の一種なので、<strong>B/S上は純資産の株主資本（利益剰余金）</strong>に表示する。"},
  {"no":170,"en":"Gain on Disposal of Treasury Stock","name":"自己株式処分差益","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（その他資本剰余金に含める）"]],"disp":null,"def":"<strong>自己株式処分差益</strong>とは、保有していた自己株式を、取得したときの金額より高い価格で処分（売却）したときに生じる差額のこと。","cls":"損益計算書を通さず、<strong>B/S上は純資産のその他資本剰余金に含め</strong>て表示する。"},
  {"no":171,"en":"Loss on Disposal of Treasury Stock","name":"自己株式処分差損","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（その他資本剰余金から控除）"]],"disp":null,"def":"<strong>自己株式処分差損</strong>とは、保有していた自己株式を、取得したときの金額より低い価格で処分（売却）したときに生じる差額のこと。","cls":"自己株式処分差益と同じく損益計算書を通さず、<strong>B/S上は純資産のその他資本剰余金から控除する形</strong>で表示する。"},
  {"no":172,"en":"Bond Interest Expense","name":"社債利息","bucket":"株式会社会計","cat":"expense","ans":[["P/L","営業外費用"]],"disp":null,"def":"<strong>社債利息</strong>とは、社債を発行して借り入れたお金に対して支払う利息のこと。","cls":"支払利息と同じく資金調達に伴う費用なので、<strong>P/L上は営業外費用</strong>に表示する。"},
  {"no":173,"en":"Negative Goodwill (Bargain Purchase Gain)","name":"負のれん発生益","bucket":"株式会社会計","cat":"revenue","ans":[["P/L","特別利益"]],"disp":"負ののれん発生益","def":"<strong>負のれん発生益</strong>とは、他社を買収したときに、支払った対価よりも受け入れた純資産の時価の方が大きかった場合に生じる収益のこと。","cls":"企業結合という毎期ふつうには起きない取引から生じる収益なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":174,"en":"Reserve for Dividend Equalization","name":"配当平均積立金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>配当平均積立金</strong>とは、毎期の配当額を安定させる目的で、利益の中から積み立てておく任意積立金の一種。","cls":"繰越利益剰余金の中から目的を決めて積み立てたものなので、<strong>B/S上は純資産の株主資本</strong>（利益剰余金）に表示する。"},
  {"no":175,"en":"Gain on Forfeiture of Stock Acquisition Rights","name":"新株予約権戻入益","bucket":"株式会社会計","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>新株予約権戻入益</strong>とは、発行していた新株予約権が、権利行使期限までに行使されず失効したときに生じる収益のこと。","cls":"毎期ふつうに生じるものではなく臨時的な収益なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":176,"en":"Gain on Redemption of Bonds","name":"社債償還益","bucket":"株式会社会計","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>社債償還益</strong>とは、社債を帳簿価額より低い金額で買入償還（満期前に買い戻して消却）したときに生じる収益のこと。","cls":"毎期ふつうに生じるものではなく臨時的な収益なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":177,"en":"Loss on Redemption of Bonds","name":"社債償還損","bucket":"株式会社会計","cat":"expense","ans":[["P/L","特別損失"]],"disp":null,"def":"<strong>社債償還損</strong>とは、社債を帳簿価額より高い金額で買入償還（満期前に買い戻して消却）したときに生じる損失のこと。","cls":"毎期ふつうに生じるものではなく臨時的な損失なので、<strong>P/L上は特別損失</strong>に表示する。"},
  {"no":178,"en":"Voluntary Reserve","name":"任意積立金","bucket":"株式会社会計","cat":"equity","ans":[["B/S","純資産（株主資本の利益剰余金）"]],"disp":null,"def":"<strong>任意積立金</strong>とは、新築積立金や配当平均積立金など、会社が独自の目的のために利益の中から任意に積み立てる利益剰余金の総称。","cls":"繰越利益剰余金の中から目的を決めて積み立てたものなので、<strong>B/S上は純資産の株主資本</strong>（利益剰余金）に表示する。"},
  {"no":179,"en":"Foreign Exchange Gain/Loss","name":"為替差損益","bucket":"外貨建・伝票","cat":"other","ans":[["P/L","営業外収益（貸方残の場合）"],["P/L","営業外費用（借方残の場合）"]],"disp":"為替差益 ／ 為替差損","def":"<strong>為替差損益</strong>とは、外貨建ての取引や資産・負債を円換算したときに、為替レートの変動によって生じる差額のこと。","cls":"本業の商品販売ではなく、たまたま円高・円安になったことによる損益なので、<strong>P/L上は営業外収益（為替差益）または営業外費用（為替差損）に、原則として差益と差損を相殺した純額</strong>で表示する。"},
  {"no":180,"en":"Deposits Received","name":"預り金","bucket":"外貨建・伝票","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>預り金</strong>とは、従業員の給料から天引きした源泉所得税や社会保険料など、会社がいったん預かって、あとで本人に代わって納付・支払いする義務のあるお金のこと。","cls":"近いうちに外部へ納付・支払いする義務なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":181,"en":"Bonus","name":"賞与","bucket":"外貨建・伝票","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>賞与</strong>とは、実際に支給された従業員へのボーナスのこと。","cls":"給料と同じ人件費の一種なので、本社・営業部門の従業員の分はP/L上の<strong>販売費及び一般管理費に表示し</strong>、工場の従業員の分は製造原価報告書の労務費になる。"},
  {"no":182,"en":"Social Insurance Premiums Withheld","name":"社会保険預り金","bucket":"外貨建・伝票","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>社会保険預り金</strong>とは、給料から天引きした従業員負担分の社会保険料を、会社がまだ年金事務所等へ納付していない間、一時的に預かっている負債科目。","cls":"近いうちに国へ納付する義務なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":183,"en":"Foreign Exchange Gain","name":"為替差益","bucket":"外貨建・伝票","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>為替差益</strong>とは、外貨建ての取引や資産・負債を円換算する際、為替相場（レート）の変動によって生じた利益のこと。","cls":"本業の商品販売そのものではなく、為替相場の変動という毎期ふつうに生じうる要因から生じる収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":184,"en":"Foreign Exchange Loss","name":"為替差損","bucket":"外貨建・伝票","cat":"expense","ans":[["P/L","営業外費用"]],"disp":null,"def":"<strong>為替差損</strong>とは、外貨建ての取引や資産・負債を円換算する際、為替相場（レート）の変動によって生じた損失のこと。","cls":"本業の商品販売そのものではなく、為替相場の変動という毎期ふつうに生じうる要因から生じる損失なので、<strong>P/L上は営業外費用</strong>に表示する。"},
  {"no":185,"en":"Forward Exchange Contract","name":"為替予約","bucket":"外貨建・伝票","cat":"asset","ans":[["B/S","流動資産または流動負債"]],"disp":null,"def":"<strong>為替予約</strong>とは、将来の外貨の受け払いについて、あらかじめ為替レートを固定しておく契約を結んだときに使う勘定。","cls":"決算日の為替予約の時価評価額がプラスかマイナスかに応じて、<strong>B/S上は流動資産または流動負債</strong>に表示する。"},
  {"no":186,"en":"Corporate Tax (Full Name)","name":"法人税、住民税及び事業税","bucket":"税金関連","cat":"expense","ans":[["P/L","税引前当期純利益の下で差し引く"]],"disp":null,"def":"<strong>法人税、住民税及び事業税</strong>とは、会社の1年間のもうけ（所得）に対してかかる税金の合計額。","cls":"収益や費用ではなく「稼いだ利益の分け前を国・地方に渡す」性質のものなので、営業外や特別の区分には入れず、税引前当期純利益を計算したあとに、そこから直接差し引く形で<strong>P/Lの一番下近く</strong>に表示する。"},
  {"no":187,"en":"Corporate Tax Payable","name":"未払法人税等","bucket":"税金関連","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>未払法人税等</strong>とは、決算で確定した法人税等の金額のうち、すでに中間納付した分を差し引いた、まだ納めていない残額を記録する負債科目。","cls":"決算日の翌日から2か月以内など、ごく近いうちに納付するため、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":188,"en":"Consumption Tax Payable","name":"未払消費税","bucket":"税金関連","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>未払消費税</strong>とは、税抜方式のもとで、お客さんから預かった消費税（仮受消費税）から、自社が支払った消費税（仮払消費税）を差し引いた、まだ税務署に納めていない残額を記録する負債科目。","cls":"決算後すぐに納付する義務なので、B/S上は<strong>流動負債に表示し</strong>、税抜方式ではP/Lには消費税額そのものは出てこない。"},
  {"no":189,"en":"Salaries","name":"給料","bucket":"税金関連","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>給料</strong>とは、本社・店舗など、商品を売ったり管理業務を行ったりする従業員に支払う労働の対価のこと。","cls":"本業を営むために欠かせない人件費なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。なお、工場で製品づくりに従事する人の給料は、製造原価報告書の労務費として扱われる点に注意。"},
  {"no":190,"en":"Prepaid Corporate Tax","name":"仮払法人税等","bucket":"税金関連","cat":"asset","ans":[["表示なし","法人税等を計上するときに差し引く"]],"disp":null,"def":"<strong>仮払法人税等</strong>とは、決算を待たずに、期の中間時点で法人税等の一部をあらかじめ納付した（中間納付した）ときに計上する一時的な資産科目。","cls":"<strong>決算で法人税等を計上する際にこの中間納付額を差し引き</strong>、残りを未払法人税等とするため、仮払法人税等という科目自体はB/S・P/Lに残らない。"},
  {"no":191,"en":"Consumption Tax Collected","name":"仮受消費税","bucket":"税金関連","cat":"liability","ans":[["表示なし","仮払消費税と相殺する"]],"disp":"差額は「未払消費税」（流動負債）","def":"<strong>仮受消費税</strong>とは、税抜方式のもとで、商品を売ったときにお客さんから預かった消費税額を、一時的に記録しておく科目。","cls":"<strong>決算で</strong>、自社が支払った消費税（仮払消費税）と相殺し、差額だけを「未払消費税」として納付するため、仮受消費税という科目自体はB/S・P/Lに残らない。"},
  {"no":192,"en":"Prepaid Consumption Tax","name":"仮払消費税","bucket":"税金関連","cat":"asset","ans":[["表示なし","仮受消費税と相殺する"]],"disp":null,"def":"<strong>仮払消費税</strong>とは、税抜方式のもとで、仕入れや経費の支払い時に、代金とあわせて支払った消費税額を一時的に記録しておく科目。","cls":"<strong>決算で</strong>、お客さんから預かった消費税（仮受消費税）と相殺し、差額だけを未払消費税（または未収還付消費税）として表示するため、仮払消費税という科目自体はB/S・P/Lに残らない。"},
  {"no":193,"en":"Social Insurance Withheld","name":"社会保険料預り金","bucket":"税金関連","cat":"liability","ans":[["B/S","流動負債"]],"disp":"預り金","def":"<strong>社会保険料預り金</strong>とは、従業員の給料から天引きした社会保険料（健康保険・厚生年金など）のうち、会社が年金事務所などへまだ納付していない分を記録する負債科目。","cls":"預り金の一種として、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":194,"en":"Income Tax Withheld","name":"所得税預り金","bucket":"税金関連","cat":"liability","ans":[["B/S","流動負債"]],"disp":"預り金","def":"<strong>所得税預り金</strong>とは、従業員の給料から天引きした源泉所得税のうち、会社が税務署へまだ納付していない分を記録する負債科目。","cls":"預り金の一種として、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":195,"en":"Taxes and Dues","name":"租税公課","bucket":"税金関連","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>租税公課</strong>とは、収入印紙代や固定資産税など、法人税等以外の税金や公的な負担金をまとめて記録する費用科目。","cls":"本業を営むうえで生じる諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":196,"en":"Welfare Expense","name":"法定福利費","bucket":"税金関連","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>法定福利費</strong>とは、健康保険料や厚生年金保険料など、法律で負担が義務づけられている、会社負担分の社会保険料のこと。","cls":"給料と同じ人件費の一種なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":197,"en":"Corporate Tax Expense","name":"法人税等","bucket":"税金関連","cat":"expense","ans":[["P/L","税引前当期純利益の下で差し引く"]],"disp":"法人税、住民税及び事業税","def":"<strong>法人税等</strong>とは、法人税・住民税・事業税をまとめて指す略称で、「法人税、住民税及び事業税」として計上する。","cls":"稼いだ利益の分け前を国・地方に渡す性質のものなので、<strong>税引前当期純利益を計算したあとに直接差し引く</strong>形でP/Lの一番下近くに表示する。"},
  {"no":198,"en":"Rent Revenue","name":"受取家賃","bucket":"決算整理","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>受取家賃</strong>とは、自社が所有する不動産を他人に貸して得た賃貸料収入のこと。","cls":"不動産業を本業としていない会社にとって、部屋や土地を貸すことは本業の商品販売・サービス提供ではなく、毎期ふつうに生じる副次的な収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":199,"en":"Prepaid Insurance","name":"前払保険料","bucket":"決算整理","cat":"asset","ans":[["B/S","流動資産（1年以内の分）"],["B/S","投資その他の資産（1年より先の分）"]],"disp":"前払費用 ／ 長期前払費用","def":"<strong>前払保険料</strong>とは、まだ経過していない契約期間の分の保険料を、先に支払ったときに計上する資産科目。まだサービス（保険の補償）を受けていない期間に対応する「サービスを受ける権利」なので資産になる。","cls":"決算日の翌日から1年以内に費用化される分は<strong>流動資産（前払費用）</strong>、1年を超えて先の分は投資その他の資産（長期前払費用）に分ける（1年基準）。"},
  {"no":200,"en":"Long-term Loans Payable","name":"長期借入金","bucket":"決算整理","cat":"liability","ans":[["B/S","固定負債（返済が1年より先の分）"],["B/S","流動負債（1年以内に返済する分）"]],"disp":"流動負債に移す分は「1年内返済予定の長期借入金」など","def":"<strong>長期借入金</strong>とは、返済期限が1年を超える借入金のこと。","cls":"借りているお金なので負債だが、決算日の翌日から1年以内に返済期限が来る分は「1年内返済予定の長期借入金」という名前に変えて<strong>流動負債に振り替え</strong>、まだ1年より先に返済する分だけを固定負債の長期借入金として残する（1年基準）。"},
  {"no":201,"en":"Accrued Interest Receivable","name":"未収利息","bucket":"決算整理","cat":"asset","ans":[["B/S","流動資産"]],"disp":"未収収益","def":"<strong>未収利息</strong>とは、すでに時間の経過で発生している利息のうち、まだ実際には受け取っていない分を記録する資産科目。","cls":"「もう権利として発生している、近いうちに受け取れるお金」なので、<strong>B/S上は流動資産（表示科目：未収収益）</strong>に表示する。"},
  {"no":202,"en":"Accrued Rent","name":"未払家賃","bucket":"決算整理","cat":"liability","ans":[["B/S","流動負債"]],"disp":"未払費用","def":"<strong>未払家賃</strong>とは、すでに経過した期間の家賃のうち、まだ支払っていない分を記録する負債科目。","cls":"「もうサービス（場所の利用）は受けた、近いうちに払わなければならない義務」なので、<strong>B/S上は流動負債（表示科目：未払費用）</strong>に表示する。"},
  {"no":203,"en":"Net Income","name":"当期純利益","bucket":"決算整理","cat":"other","ans":[["P/L","最後の行"],["B/S","純資産（繰越利益剰余金に含めて表示）"]],"disp":null,"def":"<strong>当期純利益</strong>とは、収益から費用・税金まですべてを差し引いた、1年間の会社の最終的なもうけのこと。","cls":"P/Lでは一番下に「結論」として表示され、この金額がそのままB/Sの<strong>純資産（繰越利益剰余金）に積み上がっていくため</strong>、P/LとB/Sをつなぐ重要な数字。"},
  {"no":204,"en":"Unearned Rent","name":"前受家賃","bucket":"決算整理","cat":"liability","ans":[["B/S","流動負債"]],"disp":"前受収益","def":"<strong>前受家賃</strong>とは、まだ提供していない期間（翌期以降）の家賃を、先に受け取ったときに計上する負債科目。","cls":"「お金は先に受け取ったが、まだ部屋を貸すサービスを提供していない」義務を表すので、<strong>B/S上は流動負債（表示科目：前受収益）</strong>に表示する。"},
  {"no":205,"en":"Prepaid Expenses","name":"前払費用","bucket":"決算整理","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>前払費用</strong>とは、前払家賃や前払保険料など、将来のサービスをまだ受けていない期間に対応する前払分をまとめて表示するときに使う科目名。","cls":"決算日の翌日から1年以内にサービスを受ける（費用化される）分なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":206,"en":"Accrued Interest Payable","name":"未払利息","bucket":"決算整理","cat":"liability","ans":[["B/S","流動負債"]],"disp":"未払費用","def":"<strong>未払利息</strong>とは、すでに時間の経過で発生している利息のうち、まだ支払っていない分を記録する負債科目。","cls":"未払家賃と同じ考え方で「すでに発生しているが、まだ払っていない義務」なので、<strong>B/S上は流動負債（表示科目：未払費用）</strong>に表示する。"},
  {"no":207,"en":"Accrued Expenses","name":"未払費用","bucket":"決算整理","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>未払費用</strong>とは、未払利息や未払家賃など、すでに発生しているサービスの対価のうち、まだ支払っていない分をまとめて表示するときに使う科目名。","cls":"近いうちに支払う義務が確定しているので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":208,"en":"Deferred Revenue","name":"前受収益","bucket":"決算整理","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>前受収益</strong>とは、前受家賃など、まだサービスを提供していない期間に対応する前受分をまとめて表示するときに使う科目名。","cls":"決算日の翌日から1年以内にサービスを提供する義務なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":209,"en":"Insurance Expense","name":"支払保険料","bucket":"決算整理","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>支払保険料</strong>とは、火災保険や自動車保険など、会社が加入している各種保険の保険料のこと。","cls":"本業の営業活動に伴うリスクに備える費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":210,"en":"Communication Expense","name":"通信費","bucket":"決算整理","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>通信費</strong>とは、電話代や郵便切手代、インターネット回線料など、情報をやり取りするためにかかった費用のこと。","cls":"本業を営むための諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":211,"en":"Recovery of Written-off Claims","name":"償却債権取立益","bucket":"決算整理","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>償却債権取立益</strong>とは、過去の決算で貸倒れとして処理し、帳簿から消していた債権が、あとになって思いがけず回収できたときに生じる収益のこと。","cls":"回収できた期の、本業以外のいわば臨時収入的な性格の収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":212,"en":"Reversal of Allowance for Doubtful Accounts","name":"貸倒引当金戻入","bucket":"決算整理","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>貸倒引当金戻入</strong>とは、前期に見積もった貸倒引当金が、実際には多すぎたと判明したときに、その超過分を取り崩して計上する収益のこと。","cls":"前期の見積りの修正から生じる収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":213,"en":"Accrued Revenue","name":"未収収益","bucket":"決算整理","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>未収収益</strong>とは、未収利息や未収家賃など、すでに提供したサービスの対価のうち、まだ受け取っていない分をまとめて表示するときに使う科目名。","cls":"すでに発生している受け取る権利なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":214,"en":"Income Summary","name":"損益","bucket":"決算整理","cat":"other","ans":[["表示区分なし","決算振替仕訳専用の集計勘定"]],"disp":null,"def":"<strong>損益</strong>とは、決算のときに、すべての収益・費用の各勘定残高を一度集めて、当期純利益（または純損失）を計算するために使う集計専用の勘定。","cls":"決算整理の過程だけで使われ、計算が終わると繰越利益剰余金に振り替えられて残らないので、<strong>表示区分なし（内部科目）</strong>としてB/S・P/Lには登場しない。"},
  {"no":215,"en":"Long-term Prepaid Expenses","name":"長期前払費用","bucket":"決算整理","cat":"asset","ans":[["B/S","投資その他の資産"]],"disp":null,"def":"<strong>長期前払費用</strong>とは、前払費用のうち、1年を超えて先の期間に対応する分を記録する資産科目。","cls":"決算日の翌日から1年を超えて先にサービスを受ける分なので、<strong>B/S上は投資その他の資産</strong>に表示する（1年基準）。"},
  {"no":216,"en":"Insurance Premiums","name":"保険料","bucket":"決算整理","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>保険料</strong>とは、火災保険や自動車保険など、会社が加入している各種保険の保険料のこと。","cls":"本業の営業活動に伴うリスクに備える費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":217,"en":"Utilities Expense","name":"水道光熱費","bucket":"決算整理","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>水道光熱費</strong>とは、本社や店舗で使用する電気・ガス・水道の料金のこと。","cls":"本業を営むための諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":218,"en":"Sales Commission Expense","name":"販売手数料","bucket":"決算整理","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>販売手数料</strong>とは、商品の販売を仲介してくれた相手に支払う手数料のこと。","cls":"商品を売るために必要な諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":219,"en":"Miscellaneous Losses (Non-operating)","name":"雑損失","bucket":"決算整理","cat":"expense","ans":[["P/L","営業外費用"]],"disp":null,"def":"<strong>雑損失</strong>とは、現金過不足の原因不明の不足分など、金額が小さく独立した科目を立てるほどではない雑多な損失をまとめて記録する科目。","cls":"本業以外で生じる軽微な損失なので、<strong>P/L上は営業外費用</strong>に表示する。"},
  {"no":220,"en":"Subsidiary Stocks","name":"子会社株式","bucket":"本支店・連結等","cat":"asset","ans":[["B/S","投資その他の資産"]],"disp":"関係会社株式","def":"<strong>子会社株式</strong>とは、他社の意思決定を支配する目的で、発行済株式の過半数などを長期間保有する株式のこと。","cls":"値上がり益を狙う投資ではなく、企業グループ経営のために長く持ち続ける資産なので、B/S上は<strong>投資その他の資産に表示し</strong>、関連会社株式とあわせて「関係会社株式」という名前で記載する。"},
  {"no":221,"en":"Net Income Attributable to Non-controlling Interests","name":"非支配株主に帰属する当期純利益","bucket":"本支店・連結等","cat":"other","ans":[["P/L","当期純利益の下で差し引く"]],"disp":null,"def":"<strong>非支配株主に帰属する当期純利益</strong>とは、連結財務諸表を作るときに、子会社が稼いだ利益のうち、親会社以外の株主（非支配株主）の取り分にあたる部分のこと。","cls":"<strong>連結損益計算書では</strong>、まず会社全体の純利益を計算したあと、この非支配株主の取り分を差し引いて「親会社株主に帰属する当期純利益」を求める形で表示する。"},
  {"no":222,"en":"Non-controlling Interests (NCI)","name":"非支配株主持分","bucket":"本支店・連結等","cat":"equity","ans":[["B/S","純資産（株主資本とは別の区分）"]],"disp":null,"def":"<strong>非支配株主持分</strong>とは、連結財務諸表を作るときに、子会社の純資産（資本）のうち、親会社以外の株主（非支配株主）の取り分にあたる部分のこと。","cls":"親会社が出したお金ではないため、株主資本とは別の区分として、<strong>B/S上は純資産の中に独立し</strong>て表示する。"},
  {"no":223,"en":"Branch (on Head Office's books)","name":"支店","bucket":"本支店・連結等","cat":"asset","ans":[["表示区分なし","内部科目（本支店会計の相手勘定）"]],"disp":null,"def":"<strong>支店</strong>とは、本支店会計で、本店の帳簿の中に設けられる、支店に対する一種の投資のような勘定。","cls":"支店の帳簿の「本店」勘定と金額が一致する相手勘定で、本支店合併後の外部公表用B/S・P/Lでは相殺して消えるため、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":224,"en":"Head Office (on Branch's books)","name":"本店","bucket":"本支店・連結等","cat":"other","ans":[["表示区分なし","内部科目（本支店会計の相手勘定）"]],"disp":null,"def":"<strong>本店</strong>とは、本支店会計で、支店の帳簿の中に設けられる、本店に対する一種の出資のような勘定。","cls":"本店の帳簿の「支店」勘定と金額が一致する相手勘定で、本支店合併後の外部公表用B/S・P/Lでは相殺して消えるため、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":225,"en":"Retained Earnings (Total)","name":"利益剰余金","bucket":"本支店・連結等","cat":"equity","ans":[["B/S","純資産（株主資本）"]],"disp":null,"def":"<strong>利益剰余金</strong>とは、利益準備金・任意積立金・繰越利益剰余金など、会社が稼いだ利益を元手とする純資産をまとめて表す区分名。","cls":"株主からの出資ではなく会社が稼いで積み上げた元手なので、<strong>B/S上は純資産の株主資本</strong>に表示する。"},
  {"no":226,"en":"Sales to Branch","name":"支店へ売上","bucket":"本支店・連結等","cat":"revenue","ans":[["表示区分なし","内部科目（本支店会計の内部取引）"]],"disp":null,"def":"<strong>支店へ売上</strong>とは、本店の帳簿で、支店へ商品を送付したときに計上する、本店側の内部的な売上科目。","cls":"支店の帳簿の「本店より仕入」と金額が一致する内部取引なので、本支店合併後の外部公表用P/Lでは相殺され、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":227,"en":"Purchases from Head Office","name":"本店より仕入","bucket":"本支店・連結等","cat":"expense","ans":[["表示区分なし","内部科目（本支店会計の内部取引）"]],"disp":null,"def":"<strong>本店より仕入</strong>とは、支店の帳簿で、本店から商品を受け取ったときに計上する、支店側の内部的な仕入科目。","cls":"本店の帳簿の「支店へ売上」と金額が一致する内部取引なので、本支店合併後の外部公表用P/Lでは相殺され、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":228,"en":"Purchases from Branch","name":"支店より仕入","bucket":"本支店・連結等","cat":"expense","ans":[["表示区分なし","内部科目（本支店会計の内部取引）"]],"disp":null,"def":"<strong>支店より仕入</strong>とは、本店の帳簿で、支店から商品を受け取ったときに計上する、本店側の内部的な仕入科目。","cls":"支店の帳簿の「本店へ売上」と金額が一致する内部取引なので、本支店合併後の外部公表用P/Lでは相殺され、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":229,"en":"Revaluation Difference (Subsidiary)","name":"評価差額","bucket":"本支店・連結等","cat":"equity","ans":[["表示区分なし","連結修正で相殺消去される"]],"disp":null,"def":"<strong>評価差額</strong>とは、連結会計で、子会社の資産・負債を時価評価したときに生じる帳簿価額との差額を記録する勘定。","cls":"資本連結の過程で子会社の純資産とあわせて親会社の投資と相殺消去されるため、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":230,"en":"Gain on Step Acquisition","name":"段階取得に係る差益","bucket":"本支店・連結等","cat":"revenue","ans":[["P/L","特別利益"]],"disp":null,"def":"<strong>段階取得に係る差益</strong>とは、子会社株式を複数回に分けて取得し支配を獲得した際、それまで保有していた株式を支配獲得時の時価に評価替えしたときに生じる利益のこと。","cls":"毎期ふつうに生じるものではなく、企業結合という臨時的な取引から生じる利益なので、<strong>P/L上は特別利益</strong>に表示する。"},
  {"no":231,"en":"Dividends from Surplus","name":"剰余金の配当","bucket":"本支店・連結等","cat":"equity","ans":[["B/S","純資産の控除（株主資本等変動計算書で減少）"]],"disp":null,"def":"<strong>剰余金の配当</strong>とは、株主総会の決議にもとづいて、繰越利益剰余金などを株主に配当するときに使う勘定。","cls":"株主資本を社外へ分配する取引なので、<strong>B/S上は純資産</strong>の対応する項目を減少させ、株主資本等変動計算書に表示する。"},
  {"no":232,"en":"Owner's Capital Contribution (Personal)","name":"事業主借","bucket":"本支店・連結等","cat":"equity","ans":[["B/S","純資産（元入金の増加項目）"]],"disp":"元入金に含めて表示","def":"<strong>事業主借</strong>とは、個人事業主の帳簿で、事業主が事業用のお金以外（個人の財布など）から事業に入金した場合や、事業用の収益以外の収入が生じた場合に使う勘定。","cls":"個人事業では法人のような資本金・利益剰余金の区分がなく、決算で元入金に振り替えるため、<strong>B/S上は純資産</strong>の元入金に含めて表示する。"},
  {"no":233,"en":"Owner's Drawing (Personal)","name":"事業主貸","bucket":"本支店・連結等","cat":"equity","ans":[["B/S","純資産（元入金の減少項目）"]],"disp":"元入金から控除して表示","def":"<strong>事業主貸</strong>とは、個人事業主の帳簿で、事業主が事業用のお金を生活費など個人のために使った場合に使う勘定。","cls":"個人事業では法人のような資本金・利益剰余金の区分がなく、決算で元入金から差し引くため、<strong>B/S上は純資産</strong>の元入金から控除して表示する。"},
  {"no":234,"en":"Owner's Capital (Proprietorship)","name":"元入金","bucket":"本支店・連結等","cat":"equity","ans":[["B/S","純資産"]],"disp":null,"def":"<strong>元入金</strong>とは、個人事業主における、会社でいう資本金と利益剰余金をあわせたような、事業の元手を表す純資産科目。","cls":"事業主からの出資と事業で稼いだ利益がまとめて積み上がったものなので、<strong>B/S上は純資産</strong>に表示する。"},
  {"no":235,"en":"Deferred Unrealized Intercompany Profit","name":"繰延内部利益","bucket":"本支店・連結等","cat":"other","ans":[["B/S","流動資産（控除項目）"]],"disp":null,"def":"<strong>繰延内部利益</strong>とは、本店が支店へ商品を発送する際に原価へ利益を上乗せしている場合に、期末時点で支店に残っている商品に含まれる未実現の内部利益を表す勘定。","cls":"会社全体では外部へまだ売れていない未実現の利益なので、本支店合併後のB/S上は期末商品棚卸高（<strong>流動資産の控除項目</strong>）として取り除く。"},
  {"no":236,"en":"Deduction of Deferred Intercompany Profit","name":"繰延内部利益控除","bucket":"本支店・連結等","cat":"expense","ans":[["P/L","売上原価の調整項目"]],"disp":null,"def":"<strong>繰延内部利益控除</strong>とは、本支店合併損益計算書を作るときに、繰延内部利益の分だけ売上原価の計算を調整するために使う勘定。","cls":"会社全体でみると実現していない利益を売上原価の計算から取り除く調整なので、<strong>P/L上は売上原価</strong>の内訳の調整項目として表示する。"},
  {"no":237,"en":"Monthly Profit and Loss","name":"月次損益","bucket":"本支店・連結等","cat":"other","ans":[["表示区分なし","内部科目（月次決算の集計勘定）"]],"disp":null,"def":"<strong>月次損益</strong>とは、月次決算を行う会社で、毎月の収益・費用を一度集計するために使う勘定。","cls":"年度末の損益勘定と同じ役割を月単位で果たす内部管理用の集計勘定なので、<strong>表示区分なし（内部科目）</strong>としてB/S・P/Lには登場しない。"},
  {"no":238,"en":"Materials","name":"材料","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":"原材料（問題の指示による）","def":"<strong>材料</strong>とは、製品を作るために仕入れた、まだ加工前の原料のこと。工業簿記特有の資産科目で、使う（消費する）と仕掛品や製造間接費に振り替わる。","cls":"製造業の通常の営業サイクルの中にある資産なので、金額の大小にかかわらず<strong>B/S上は流動資産</strong>に表示する（正常営業循環基準）。"},
  {"no":239,"en":"Work in Process","name":"仕掛品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>仕掛品</strong>とは、工場でまだ製造の途中にある、完成していない製品にかかった原価を集計する資産科目。","cls":"材料費・労務費・製造間接費が積み重なっていく製造業特有の勘定で、通常の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":240,"en":"Manufacturing Overhead Allocation Variance","name":"製造間接費配賦差異","bucket":"工業簿記","cat":"other","ans":[["表示なし","売上原価に振り替える"]],"disp":"P/Lでは「原価差異」（売上原価の内訳）","def":"<strong>製造間接費配賦差異</strong>とは、工場でかかった製造間接費を、あらかじめ決めた予定配賦率で各製品に配り終えたあと、実際にかかった金額との間に生じるズレのこと。","cls":"決算時には原則としてこの差異を売上原価に加減して締め切るため、<strong>B/S・P/Lに独立した科目としては残らず、P/L上は「原価差異」として売上原価の内訳</strong>に吸収される。"},
  {"no":241,"en":"Raw Materials (Main)","name":"素材","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":"原材料","def":"<strong>素材</strong>とは、製品の主要な部分を構成する、加工前の主原料のこと。材料の内訳の一つ。","cls":"製造業の通常の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に「原材料」として表示する。"},
  {"no":242,"en":"Purchased Parts","name":"買入部品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":"原材料","def":"<strong>買入部品</strong>とは、外部のメーカーから購入し、そのまま製品に組み込んで使う部品のこと。","cls":"製造業の通常の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に「原材料」として表示する。"},
  {"no":243,"en":"Auxiliary Materials","name":"補助材料","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":"原材料","def":"<strong>補助材料</strong>とは、製品の主要な部分にはならないが、製造の過程で補助的に使われる材料（塗料や接着剤など）のこと。","cls":"製造業の通常の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に「原材料」として表示する。"},
  {"no":244,"en":"Factory Supplies","name":"工場消耗品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":"貯蔵品","def":"<strong>工場消耗品</strong>とは、工場で使う油や軍手など、製品に直接組み込まれない消耗品のこと。","cls":"決算時点で未使用の分は資産性があるので、<strong>B/S上は流動資産</strong>に「貯蔵品」として表示する。"},
  {"no":245,"en":"Consumable Tools and Fixtures","name":"消耗工具器具備品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":"貯蔵品","def":"<strong>消耗工具器具備品</strong>とは、耐用年数が短い、または金額が小さいために固定資産としないドライバーなどの工具・器具のこと。","cls":"決算時点で未使用の分は資産性があるので、<strong>B/S上は流動資産</strong>に「貯蔵品」として表示する。"},
  {"no":246,"en":"Semi-finished Goods","name":"半製品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>半製品</strong>とは、ある工程までの加工は完了しており、そのままの状態でも販売できるが、まだ最終製品にはなっていない中間段階のもの。","cls":"製造業の通常の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":247,"en":"Finished Goods","name":"製品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>製品</strong>とは、工場ですべての製造工程を終え、販売できる状態になった完成品のこと。","cls":"販売目的で持つ、製造業の通常の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":248,"en":"By-products","name":"副産物","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>副産物</strong>とは、主産物を製造する過程で、それにともなって必然的に生じる価値のある生産物のこと。","cls":"売却価値のある資産として評価するので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":249,"en":"Scrap","name":"作業くず","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>作業くず</strong>とは、製造の過程で生じる材料の切れ端などのうち、売却や自家消費によって価値があるもの。","cls":"売却価値のある資産として評価するので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":250,"en":"Spoiled Units","name":"仕損品","bucket":"工業簿記","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>仕損品</strong>とは、製造の過程で失敗してしまった不良品のうち、補修すれば使えるもの、またはスクラップとして売却できる価値が残っているもの。","cls":"処分価値のある資産として評価するので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":251,"en":"Factory Wages","name":"賃金","bucket":"工業簿記","cat":"expense","ans":[["P/L","売上原価（製造原価の内訳）"]],"disp":null,"def":"<strong>賃金</strong>とは、工場で製品づくりに直接従事する作業員に支払う労働の対価のこと。","cls":"製品の製造原価に集計され、製品が販売されたときに<strong>P/L上は売上原価</strong>の一部として表示される。"},
  {"no":252,"en":"Miscellaneous Wages","name":"雑給","bucket":"工業簿記","cat":"expense","ans":[["P/L","売上原価（製造原価の内訳）"]],"disp":null,"def":"<strong>雑給</strong>とは、工場でパート・アルバイトなど臨時の作業員に支払う賃金のこと。","cls":"製品の製造原価に集計され、製品が販売されたときに<strong>P/L上は売上原価</strong>の一部として表示される。"},
  {"no":253,"en":"Employee Bonuses and Allowances","name":"従業員賞与手当","bucket":"工業簿記","cat":"expense","ans":[["P/L","売上原価（製造原価の内訳）"]],"disp":null,"def":"<strong>従業員賞与手当</strong>とは、工場の従業員に対する賞与（ボーナス）や各種手当のこと。","cls":"製品の製造原価に集計され、製品が販売されたときに<strong>P/L上は売上原価</strong>の一部として表示される。"},
  {"no":254,"en":"Outsourced Processing Costs","name":"外注加工費","bucket":"工業簿記","cat":"expense","ans":[["P/L","売上原価（製造原価の内訳）"]],"disp":null,"def":"<strong>外注加工費</strong>とは、自社の材料を外部の業者に渡して加工してもらったときに支払う費用のこと。","cls":"製品の製造原価に集計され、製品が販売されたときに<strong>P/L上は売上原価</strong>の一部として表示される。"},
  {"no":255,"en":"Manufacturing Overhead","name":"製造間接費","bucket":"工業簿記","cat":"expense","ans":[["表示区分なし","内部科目（仕掛品を通じて製品原価に配賦）"]],"disp":null,"def":"<strong>製造間接費</strong>とは、どの製品のためにかかったか直接わからない、複数の製品に共通してかかる原価（工場の減価償却費や電力料など）を一度集計する勘定。","cls":"配賦計算を経て仕掛品・製品（最終的に売上原価）に振り替わり、それ自体はB/S・P/Lに残らないので、<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":256,"en":"Electricity Expense (Factory)","name":"電力料","bucket":"工業簿記","cat":"expense","ans":[["表示区分なし","内部科目（製造間接費を通じて製品原価に算入）"]],"disp":null,"def":"<strong>電力料</strong>とは、工場で製品を作るために使った電気代のこと。","cls":"製造間接費として集計されたうえで製品の原価に配賦されるため、単独の科目としては<strong>表示区分なし（内部科目）</strong>として扱う。"},
  {"no":257,"en":"Accrued Factory Wages","name":"未払賃金","bucket":"工業簿記","cat":"liability","ans":[["B/S","流動負債"]],"disp":"未払費用","def":"<strong>未払賃金</strong>とは、工場の従業員について、すでに働いてもらった分の賃金のうち、まだ支払っていない分を記録する負債科目。","cls":"近いうちに支払う義務が確定しているので、<strong>B/S上は流動負債</strong>に「未払費用」として表示する。"},

  {"no":296,"en":"Bond Issuance Costs","name":"社債発行費","bucket":"1級","cat":"asset","ans":[["B/S","繰延資産"]],"disp":null,"def":"<strong>社債発行費</strong>とは、社債を発行するためにかかった、印刷費や証券会社への手数料などの支出を、繰延資産（資産）として計上したもの。","cls":"株式交付費と同じ考え方で、資金調達のための支出を資産（<strong>繰延資産）としていったん計上し</strong>、数年かけて償却していく。"},

const EXP_DEEP = {"1056":[["何が起きた？","部品AとBをセットで売る契約。Aを渡した日には、まだBを渡していないので<b>代金を請求できず</b>、Aの分30円は「契約資産」（請求前の権利）で記録していた。今日Bも渡したので、A＋Bの<b>60円全部を請求できる</b>ようになった。"],["仕訳の組み立て","①今日渡したBの分を売上にする → 貸方：売上30<br>②Aの分の「契約資産30」は、請求できる権利に変わったので消す → 貸方：契約資産30<br>③A＋Bの60円を請求できる権利 → 借方：売掛金60"],["ここに注意","<b>契約資産と売掛金の違い</b>は「今すぐ請求できるかどうか」。条件付きの権利が契約資産、無条件になったら売掛金。Aの売上はAを渡した日に計上済みなので、今日の売上はBの30円だけ。"]],"1078":[["何が起きた？","長期保有の株式（その他有価証券）が、帳簿価額80円 → 時価88円に<b>8円値上がり</b>した。"],["仕訳の組み立て","①株式を時価に合わせて8円増やす → 借方：その他有価証券8<br>②値上がり益は、売るまで確定していないので<b>損益にせず純資産に直接入れる</b> → 貸方：その他有価証券評価差額金8"],["計算","88－80＝<b>8円</b>（値上がり）"],["ここに注意","売買目的有価証券なら差額は「有価証券評価益（P/L）」だが、その他有価証券は<b>P/Lを通さない</b>（全部純資産直入法）。また翌期首には逆仕訳（洗替え）で帳簿価額を80円に戻す。税効果がある問題なら、8円のうち税金分を繰延税金負債に分ける。"]],"1080":[["何が起きた？","額面100円の社債を93円で買った。満期には100円戻ってくるので、<b>差の7円は「満期にまとめてもらう利息」</b>と考える。この7円を、持っている期間に少しずつ利息として配分する（償却原価法）。"],["仕訳の組み立て","今期の利息の総額は5円。そのうち2円はクーポンとして現金で受け取り済み（仕訳済み）。<br>残り3円は「まだ現金はもらっていないが、今期分の利息」→ 社債の帳簿価額を3円増やす：借方：満期保有目的債券3／貸方：有価証券利息3"],["計算","利息の総額5円－クーポン2円＝<b>3円</b>（帳簿価額は93→96円に近づく）"],["ここに注意","利息法では、毎期の利息総額＝帳簿価額×実効利子率で計算し、そこからクーポンを引いた分を償却額にする。定額法なら7円÷年数で毎期同じ額。<b>どちらも相手は有価証券利息</b>。"]],"1081":[["何が起きた？","関連会社V社（持分20％）が利益50円を出した。持分法では、配当をもらわなくても、<b>V社の利益のうち自社の取り分</b>を自社の利益として取り込む。"],["仕訳の組み立て","①V社の利益の20％＝10円を取り込む → 貸方：持分法による投資利益10<br>②その分、V社株式の価値が増えたとして帳簿価額を増やす → 借方：関連会社株式10"],["計算","50×20％＝<b>10円</b>"],["ここに注意","V社が<b>配当</b>をしたときは逆で、受け取った配当の分だけ株式の帳簿価額を減らす（利益はすでに取り込み済みなので、二重にしないため）。"]],"1083":[["何が起きた？","11月末に社債を購入。利息は3月末と9月末に、<b>その時の持ち主が半年分をまとめて</b>受け取る。X社は3月末に10〜3月の6か月分を受け取るが、10〜11月の2か月分は売り手が持っていた期間なので、その分（端数利息）を<b>購入時に売り手へ払っておく</b>。"],["仕訳の組み立て","①社債そのもの → 借方：満期保有目的債券100<br>②端数利息1円 → 借方：有価証券利息1（3月末に受け取る6か月分の利息から差し引かれる「マイナスの利息」）<br>③支払った合計 → 貸方：当座預金101"],["計算","端数利息：100×6％×2／12＝<b>1円</b><br>支払額：100＋1＝<b>101円</b>"],["ここに注意","端数利息は社債の取得原価に<b>含めない</b>。3月末には6か月分3円を受け取って「有価証券利息3」を貸方に計上するので、差し引き2円（X社が実際に持っていた4か月分）が今期の利息になる。"]],"1091":[["何が起きた？","期の途中（9月30日）に備品を売った。売る前に、<b>期首（4/1）から売却日（9/30）までの6か月分の減価償却</b>を計上してから、残った帳簿価額と売値を比べる。"],["仕訳の組み立て","①備品を帳簿から外す → 貸方：備品120（取得原価）、借方：減価償却累計額60（期首までの分）<br>②今期6か月分の償却 → 借方：減価償却費12<br>③受け取った代金 → 借方：現金60<br>④差額 → 貸方：固定資産売却益12"],["計算","今期の減価償却費：120÷5年×6／12＝<b>12円</b><br>売却時の帳簿価額：120－60－12＝<b>48円</b><br>売却益：60－48＝<b>12円</b>"],["ここに注意","月割の分を忘れると、帳簿価額60円と比べて売却損益0円と間違える。<b>「期中売却 → まず今期分の償却」</b>をセットで覚える。"]],"1095":[["何が起きた？","補助金50円で建物を買い、帳簿価額を50円減らした（直接減額方式の圧縮記帳）。会計上は「固定資産圧縮損50」を費用にしたが、<b>税務上は今は費用にならない</b>。その分、建物の減価償却費が将来少なくなる＝将来の税金計算で取り戻せる。"],["仕訳の組み立て","①圧縮記帳 → 借方：固定資産圧縮損50／貸方：建物50<br>②税効果：将来の税金が15円減る → 借方：繰延税金資産15／貸方：法人税等調整額15"],["計算","50×30％＝<b>15円</b>"],["ここに注意","会計では費用、税務では費用にならない＝今は税金を多めに払っている → <b>将来減算一時差異</b> → 繰延税金資産。相手は（P/Lを通った差額なので）法人税等調整額。"]],"1096":[["何が起きた？","積立金方式で、補助金の分の利益を「圧縮積立金」として積み立てていた。今期、そのうち10円を<b>取り崩して元の繰越利益剰余金に戻す</b>。"],["仕訳の組み立て","積立金を減らす → 借方：圧縮積立金10<br>元の場所に戻す → 貸方：繰越利益剰余金10"],["ここに注意","純資産の中での<b>付け替えだけ</b>なので、P/L（利益）にも税金にも影響しない。取り崩しは、ふつう取得した資産の減価償却に合わせて少しずつ行う。"]],"1097":[["何が起きた？","補助金50円を受け取ったが、積立金方式なので建物の金額は減らさず、利益の一部を積み立てる。ただし税務上、この50円は将来資産を手放したときに課税される＝<b>将来払う税金15円</b>がある。"],["仕訳の組み立て","①繰越利益剰余金から50円を動かす → 借方：繰越利益剰余金50<br>②そのうち将来払う税金分 → 貸方：繰延税金負債15<br>③残りを積み立てる → 貸方：圧縮積立金35"],["計算","繰延税金負債：50×30％＝<b>15円</b><br>圧縮積立金：50－15＝<b>35円</b>"],["ここに注意","税効果を考えるときは、積立額は<b>税金を引いた後の額（35円）</b>。直接減額方式（#1095）では繰延税金<b>資産</b>、積立金方式では繰延税金<b>負債</b>になる点が逆。"]],"1098":[["何が起きた？","前期に「圧縮積立金35円」と「繰延税金負債15円」を計上していた。今期、その資産を売却したので、<b>先送りしていた税金と積立金の両方を元に戻す</b>。"],["仕訳の組み立て","①積立金を取り崩す → 借方：圧縮積立金35／貸方：繰越利益剰余金35<br>②繰延税金負債を取り崩す → 借方：繰延税金負債15／貸方：法人税等調整額15"],["ここに注意","積立金の取崩しは<b>純資産の中の移動</b>（P/Lに出ない）、繰延税金負債の取崩しは<b>法人税等調整額（P/L）</b>が相手。2つの仕訳を混同しないこと。"]],"1107":[["何が起きた？","備品を分割払いで買った。一括なら90円だが、分割だと合計100円。<b>差の10円は「分割にしたことによる利息」</b>。備品の値段は90円のまま。"],["仕訳の組み立て","①備品は現金で買った場合の値段 → 借方：備品90<br>②利息10円はまだ期間が経過していない＝先払いの扱い → 借方：前払利息10<br>③これから払う合計 → 貸方：未払金100（商品ではないので買掛金ではない）"],["ここに注意","利息を含めて「備品100」とするのは誤り。支払いのたびに、経過した分の利息を前払利息から支払利息へ振り替える。"]],"1109":[["何が起きた？","借りている建物に内装工事をした（200円）。閉店時には内装を撤去して元に戻す義務があり、その費用の<b>今の価値は24円</b>。この義務を負うことも内装を手に入れるためのコストと考える。"],["仕訳の組み立て","①払った工事代 → 貸方：現金200<br>②将来の撤去義務 → 貸方：資産除去債務24<br>③内装の取得原価＝両方の合計 → 借方：建物付属設備224"],["計算","200＋24＝<b>224円</b>"],["ここに注意","撤去費用は「将来の費用」ではなく、<b>取得時に資産と負債を両建て</b>する。資産の224円は減価償却で毎期費用になり、負債の24円は時の経過で増えていく（#1110）。"]],"1110":[["何が起きた？","資産除去債務は「将来の支払額を今の価値に割り引いた額」。1年たって支払いの時期が近づいたので、<b>今の価値が1円増えた</b>（割引の巻き戻し）。"],["仕訳の組み立て","債務が1円増える → 貸方：資産除去債務1<br>増えた分は時の経過による利息のような費用 → 借方：利息費用1"],["ここに注意","見積額そのものが変わったわけではない。<b>時の経過による増加＝利息費用</b>、見積りの変更なら資産と債務の両方を修正する、と区別する。"]],"1125":[["何が起きた？","ファイナンス・リース（利子抜き法）でリース料11円を払った。利子抜き法では、リース資産・リース債務を<b>利息を除いた額</b>で計上しているので、払うたびに「元本の返済」と「利息」に分ける。"],["仕訳の組み立て","①利息相当額（定額法で毎年1円）→ 借方：支払利息1<br>②残りは借金（リース債務）の返済 → 借方：リース債務10<br>③払った総額 → 貸方：現金11"],["計算","支払利息：5÷5年＝<b>1円</b><br>リース債務の返済：11－1＝<b>10円</b>"],["ここに注意","利子込み法なら、リース債務を利息込みで計上しているので、支払時は「リース債務11／現金11」で利息は出てこない（決算で減価償却するだけ）。"]],"1128":[["何が起きた？","リース資産の設備の収益性が大きく下がった。この設備から<b>将来回収できるお金（回収可能価額）は18円</b>しかないので、帳簿価額30円を18円まで切り下げる（減損）。"],["仕訳の組み立て","資産を直接12円減らす → 貸方：リース資産12<br>下げた分は損失 → 借方：減損損失12（特別損失）"],["計算","30－18＝<b>12円</b>"],["ここに注意","減損は累計額を使わず<b>資産を直接減らす</b>のが基本。リース資産でも、自分で買った固定資産と同じように減損の対象になる。"]],"1134":[["何が起きた？","前期に売った商品を保証で修理し、8円かかった。前期の決算で、この保証に備えて<b>商品保証引当金6円</b>を計上していた。"],["仕訳の組み立て","①まず備えていた引当金を使う → 借方：商品保証引当金6<br>②足りない分は今期の費用 → 借方：商品保証費2<br>③実際に払った額 → 貸方：現金8"],["計算","8－6＝<b>2円</b>"],["ここに注意","当期に売った商品の修理なら引当金は使わず、全額「商品保証費」。<b>前期以前に売った商品の修理だから引当金を使う</b>。"]],"1141":[["何が起きた？","繰越利益剰余金を財源に、配当200円を決議した。配当するときは、会社法により<b>利益準備金を積み立てる</b>必要がある。"],["仕訳の組み立て","①株主に払う配当（まだ払っていない）→ 貸方：未払配当金200<br>②積み立てる準備金 → 貸方：利益準備金10<br>③合計を繰越利益剰余金から減らす → 借方：繰越利益剰余金210"],["計算","積立の上限：資本金400×1／4＝100円、今の準備金は60＋30＝90円 → <b>あと10円</b><br>配当の1／10：200×1／10＝20円<br>少ない方の<b>10円</b>を積み立てる"],["ここに注意","「配当の1/10」と「資本金の1/4に届くまでの残り」の<b>少ない方</b>。資本準備金も含めた準備金の合計で判定する。"]],"1145":[["何が起きた？","X社がY社を吸収合併。Y社の資産（商品60・建物40）を受け入れ、代わりに<b>X社の新株（120円分）をY社の株主に渡した</b>。"],["仕訳の組み立て","①受け入れた資産 → 借方：商品60・建物40<br>②渡した株式の分は純資産が増える（今回は全額その他資本剰余金）→ 貸方：その他資本剰余金120<br>③差額 → 借方：のれん20"],["計算","受け入れた資産：60＋40＝100円<br>のれん：120－100＝<b>20円</b>"],["ここに注意","渡した対価が受け入れた純資産より<b>多ければのれん（資産）</b>、少なければ負ののれん発生益（特別利益）。どこに組み入れるか（資本金・資本準備金・その他資本剰余金）は問題文の指示に従う。"]],"1148":[["何が起きた？","以前に買い戻した自社の株式（自己株式、帳簿価額40円）を45円で売った（処分）。"],["仕訳の組み立て","①受け取った代金 → 借方：現金45<br>②自己株式を減らす → 貸方：自己株式40<br>③差額 → 貸方：自己株式処分差益5（その他資本剰余金）"],["計算","45－40＝<b>5円</b>"],["ここに注意","自社株の売買は株主との資本取引なので、差額は<b>P/Lの利益にしない</b>。安く処分したときの差損は、その他資本剰余金から差し引く。"]],"1152":[["何が起きた？","買掛金の支払いのための為替予約を、<b>独立処理</b>（予約を買掛金と切り離して、予約そのものを時価評価）で処理している。決算日に予約の時価が3円不利になっていた。"],["仕訳の組み立て","①不利になった分は損失 → 借方：為替差損益3<br>②予約は「将来損をする約束」になったので負債側 → 貸方：為替予約3"],["ここに注意","有利なら逆（借方：為替予約／貸方：為替差損益）。<b>振当処理</b>なら予約レートで買掛金を換算し直すので、為替予約という科目は出てこない。"]],"1155":[["何が起きた？","会計と税務のズレが3つある。①貸倒引当金の限度超過10円、②減価償却の限度超過20円 → どちらも<b>今は税金を多く払い、将来取り戻せる</b>（将来減算一時差異）。③その他有価証券の評価差益10円 → <b>売ったときに税金がかかる</b>（将来加算一時差異）。"],["仕訳の組み立て","①②：借方：繰延税金資産9／貸方：法人税等調整額9（P/Lを通った差額なので相手は法人税等調整額）<br>③：借方：その他有価証券評価差額金3／貸方：繰延税金負債3（純資産に直接入れた差額なので、相手も純資産の評価差額金）"],["計算","繰延税金資産：（10＋20）×30％＝<b>9円</b><br>繰延税金負債：10×30％＝<b>3円</b>"],["ここに注意","<b>相手科目の選び方</b>が最大のポイント。差額がP/Lを通った→法人税等調整額、純資産に直接入った→その他有価証券評価差額金。"]],"1171":[["何が起きた？","本店は、原価80円の商品に利益10円を上乗せした90円で支店に送っている。支店の期末在庫のうち45円（送った価格）は本店から来たもの。この中には<b>まだ外部に売れていない社内の利益</b>が含まれている。"],["仕訳の組み立て","①在庫に含まれる社内の利益を取り除く（P/L側）→ 借方：繰延内部利益控除5<br>②取り除いた利益を次期へ繰り延べる（在庫から差し引く項目）→ 貸方：繰延内部利益5"],["計算","45×10／90＝<b>5円</b>（送り値90円のうち利益は10円の割合）"],["ここに注意","割合は「利益÷<b>送り値</b>」（10／90）。原価に対する割合（10／80）を使わないこと。翌期首には逆仕訳で戻す（繰延内部利益戻入）。"]],"1177":[["何が起きた？","子会社Y社が配当10円を払った。X社（80％）が8円、非支配株主（20％）が2円を受け取った。<b>X社の8円はグループ内のお金の移動</b>にすぎない。"],["仕訳の組み立て","①Y社の配当をなかったことにする → 貸方：剰余金の配当10<br>②X社が計上した受取配当金8円を消す → 借方：受取配当金8<br>③非支配株主に払った2円は、その人たちの持分が減ったとする → 借方：非支配株主持分2"],["ここに注意","連結では親会社への配当は相殺、<b>非支配株主への配当は非支配株主持分の減少</b>。配当全額を受取配当金と相殺しないこと。"]],"1183":[["何が起きた？","Y社株式を、まず20％（25円）、今回60％を買って支配を獲得した（段階取得）。連結では、支配を獲得した日に、<b>前から持っていた20％の株式を時価（28円）に評価し直す</b>。"],["仕訳の組み立て","①20％分の株式を時価に合わせて3円増やす → 借方：子会社株式3<br>②増えた分は利益 → 貸方：段階取得に係る差益3（特別利益）"],["計算","28－25＝<b>3円</b>"],["ここに注意","評価し直した後の投資額（28＋60＝88円）と、子会社の純資産の持分を相殺して、のれんを計算する。<b>個別の帳簿では評価し直さない</b>（連結仕訳だけ）。"]],"1186":[["何が起きた？","個人事業で、期中に店主が<b>店のお金10円を私用で使い</b>（事業主貸）、<b>自分のお金5円を店に入れた</b>（事業主借）。決算でこれらを元手（資本金）にまとめる。"],["仕訳の組み立て","①事業主貸10円を消す → 貸方：事業主貸10<br>②事業主借5円を消す → 借方：事業主借5<br>③差し引き5円の持ち出し → 元手が減る：借方：資本金5"],["計算","持ち出し10－入れた5＝<b>5円</b>の元手減少"],["ここに注意","事業主貸は「元手の引出し」（資本金の減少）、事業主借は「元手の追加」（資本金の増加）。決算でまとめて資本金（元入金）に振り替える。"]],"1187":[["何が起きた？","12月1日に1年分（12〜11月）の保険料12円を払い、全額費用にしていた。3月31日の決算では、<b>まだ期間が来ていない4月〜11月の8か月分</b>は今期の費用ではない。"],["仕訳の組み立て","支払日：借方：支払保険料12／貸方：現金12<br>決算日：来期分8円を費用から外す → 貸方：支払保険料8、その分を資産にする → 借方：前払費用8"],["計算","12×8／12＝<b>8円</b>（今期の費用は12〜3月の4か月分＝4円が残る）"],["ここに注意","月数の数え間違いに注意（4月〜11月＝8か月）。翌期首には逆仕訳（再振替）で支払保険料に戻す（#1200）。"]],"1190":[["何が起きた？","12月1日に1年分（12〜11月）の家賃12円を受け取り、全額収益にしていた。3月31日の決算では、<b>まだ貸していない4月〜11月の8か月分</b>は今期の収益ではない。"],["仕訳の組み立て","受取日：借方：現金12／貸方：受取家賃12<br>決算日：来期分8円を収益から外す → 借方：受取家賃8、その分を負債にする（あとで貸す義務）→ 貸方：前受収益8"],["計算","12×8／12＝<b>8円</b>"],["ここに注意","前払費用（資産）と鏡の関係。<b>先にもらった＝前受収益（負債）</b>。翌期首に再振替で受取家賃に戻す（#1202）。"]],"1192":[["何が起きた？","前期に設定した貸倒引当金が、得意先の状況改善で<b>3円多すぎた</b>ことがわかった。"],["仕訳の組み立て","引当金を3円減らす → 借方：貸倒引当金3<br>多すぎた分は収益として戻す → 貸方：貸倒引当金戻入3"],["ここに注意","差額補充法で、設定すべき額が残高より少ないときに出てくる仕訳。戻入は（2級では）<b>収益</b>として扱う。"]],"1198":[["何が起きた？","決算で収益・費用を損益勘定に集めたら、貸方残高152円（当期純利益）が残った。株式会社では、これを<b>繰越利益剰余金</b>に加える。"],["仕訳の組み立て","損益勘定の貸方残高を消す → 借方：損益152<br>繰越利益剰余金を増やす → 貸方：繰越利益剰余金152"],["ここに注意","当期純損失（損益が借方残高）のときは逆で、借方：繰越利益剰余金／貸方：損益。個人事業では相手が資本金（#1199）。"]],"1199":[["何が起きた？","個人事業で、損益勘定の貸方残高152円（当期純利益）を振り替える。個人事業には繰越利益剰余金がないので、<b>店主の元手（資本金）</b>に直接加える。"],["仕訳の組み立て","借方：損益152／貸方：資本金152"],["ここに注意","株式会社（#1198）との違いは<b>振替先だけ</b>。株式会社＝繰越利益剰余金、個人事業＝資本金（元入金）。"]],"1200":[["何が起きた？","前期末に、翌期分の保険料8円を前払費用にしていた。当期の期首に、これを<b>元の費用（支払保険料）に戻す</b>（再振替仕訳）。"],["仕訳の組み立て","前期末の仕訳（借方：前払費用8／貸方：支払保険料8）の<b>ちょうど逆</b> → 借方：支払保険料8／貸方：前払費用8"],["ここに注意","8円は当期の期間（4〜11月）の保険料なので、<b>当期の費用</b>として戻す。再振替は「前期末の決算整理仕訳を逆にする」と覚える。"]],"1202":[["何が起きた？","前期末に、翌期分の家賃8円を前受収益にしていた。当期の期首に、これを<b>元の収益（受取家賃）に戻す</b>。"],["仕訳の組み立て","前期末の仕訳（借方：受取家賃8／貸方：前受収益8）の逆 → 借方：前受収益8／貸方：受取家賃8"],["ここに注意","当期に貸す期間の家賃なので、<b>当期の収益</b>として戻す。"]],"1203":[["何が起きた？","前期末に、まだ受け取っていない利息2円を未収収益にしていた（見越し）。当期の期首に<b>逆仕訳</b>で元に戻す。"],["仕訳の組み立て","前期末の仕訳（借方：未収収益2／貸方：受取利息2）の逆 → 借方：受取利息2／貸方：未収収益2"],["ここに注意","期首に受取利息が借方（マイナス）になるのは、後で実際に利息を受け取ったときに全額を受取利息に計上するため。<b>前期分2円が二重に収益にならないよう</b>に打ち消している。"]]};
Object.assign(EXP_DEEP, {"1308": [["計算の筋道", "6月10日：リベート見込み600,000×5％＝30,000。売上は570,000<br>6月15日：返品40,000のうちリベート分40,000×5％＝2,000は返金負債を減らし、残り38,000が売上の減少<br>3月31日：30,000－2,000＝28,000"], ["落とし穴", "返品のとき、売上を40,000全額減らさない。原価420,000は三分法なので使わない。送料は当社負担なので発送費。"]], "1310": [["計算の筋道", "8月1日：800,000－12,000＝788,000<br>9月30日：銀行に払った800,000＋4,000＝804,000がY社に請求する不渡手形<br>12月10日：804,000－500,000＝304,000"], ["落とし穴", "貸倒引当金は使わない。当期の販売から生じた債権は、前期末に引当金を設定した対象に入っていない。売掛金300,000円はこの取引に関係しない。"]], "1311": [["計算の筋道", "11月30日：保証の記録1,500,000を消し、実際に払った1,500,000＋30,000＝1,530,000をC社への請求権にする<br>2月20日：1,530,000－900,000＝630,000"], ["落とし穴", "保証債務を消すのは保証した1,500,000だけ。請求権は延滞利息を含めた1,530,000。"]], "1312": [["計算の筋道", "取得価額：2,000,000×97.60/100＝1,952,000<br>端数利息：2,000,000×3％×2/12＝10,000（4月〜5月）<br>半年分の利息：2,000,000×3％×6/12＝30,000<br>償却額：48,000×10/40＝12,000（取得から満期まで40か月、当期10か月）"], ["落とし穴", "満期保有目的債券は時価評価しないので、時価1,970,000円は使わない。端数利息は取得原価に含めない。"]], "1313": [["計算の筋道", "取得原価：1,200×1,000＋12,000＝1,212,000<br>評価差額：1,350,000－1,212,000＝138,000。税金分138,000×30％＝41,400、残り96,600<br>売却益：1,310,000－1,212,000＝98,000"], ["落とし穴", "購入手数料は取得原価に含める。評価差額は損益を通さないので、税金分も評価差額金から引く。振り戻しているので、売却益は取得原価と比べる。"]], "1314": [["計算の筋道", "1年分：3,600,000÷6＝600,000。前期末までの累計額：600,000×3年＝1,800,000<br>当期分：600,000×6/12＝300,000<br>売却時の帳簿価額：3,600,000－1,800,000－300,000＝1,500,000。下取り1,350,000なので売却損150,000<br>未払い：4,800,000－1,350,000＝3,450,000<br>新車両：4,800,000÷6×6/12＝400,000"], ["落とし穴", "前期末の累計額は書かれていないので、取得日から数える。売る前に当期6か月分の償却を忘れない。車両の後払いは未払金。"]], "1315": [["計算の筋道", "圧縮後の取得原価：2,700,000－900,000＝1,800,000<br>減価償却費：1,800,000÷6×6/12＝150,000"], ["落とし穴", "減価償却は圧縮後の1,800,000をもとに計算する。"]], "1316": [["計算の筋道", "利息の総額：540,000×5－2,400,000＝300,000。1年分：300,000÷5＝60,000<br>債務の返済：540,000－60,000＝480,000<br>減価償却費：2,400,000÷5＝480,000"], ["落とし穴", "利子抜き法なので資産と債務は2,400,000。耐用年数は経済的耐用年数の6年ではなく、リース期間の5年。"]], "1317": [["計算の筋道", "修繕の分：1,500,000－900,000＝600,000。引当金480,000を使い、不足120,000は修繕費<br>期末の引当金残高は0なので、繰入額は520,000"], ["落とし穴", "耐用年数を延ばす900,000は建物に足す（資本的支出）。建物の取得原価12,000,000円は使わない。"]], "1318": [["計算の筋道", "(1) 1,860,000－1,240,000＝620,000<br>(2) 課税所得：4,200,000＋120,000＝4,320,000。×30％＝1,296,000。1,296,000－600,000＝696,000<br>(3) 120,000×30％＝36,000"], ["落とし穴", "法人税等は、損金にならない分を足した課税所得にかかる。中間納付の消費税はすでに仮払消費税に入っているので、別に引かない。"]], "1319": [["計算の筋道", "利益準備金：配当の1/10＝240,000と、資本金の1/4－（資本準備金＋利益準備金）＝5,000,000－4,800,000＝200,000の小さい方＝200,000<br>財源：2,400,000＋200,000＋300,000＝2,900,000<br>処分：帳簿価額800×1,200＝960,000、売値750×1,200＝900,000、差損60,000"], ["落とし穴", "準備金の上限には資本準備金も含める。自己株式の取得手数料は取得原価に含めず費用。"]], "1320": [["計算の筋道", "3月1日：20,000×138＝2,760,000<br>3月31日：20,000×（142－138）＝80,000。払う円が増えるので損<br>4月30日：帳簿2,840,000、支払い20,000×140＝2,800,000。差40,000は益<br>5月10日：30,000×139＝4,170,000"], ["落とし穴", "4月30日は、輸入時ではなく決算で換算し直した2,840,000と比べる。取引と同時に予約したので、売上も売掛金も予約レートで記録する。"]], "1321": [["計算の筋道", "本店から仕入れた期末商品：352,000＋未達132,000＝484,000<br>内部利益：484,000×10/110＝44,000"], ["落とし穴", "帳簿上の棚卸高には未着の商品が入っていないので足す。割合は10/110。540,000円のうち外部から仕入れた分は関係しない。"]], "1325": [["計算の筋道", "(1) 250×1,600＝400,000、250×400＝100,000<br>(2) 実際262×2,000＝524,000。524,000－500,000＝24,000（不利）<br>(3) 1,100×1,800＝1,980,000、1,100×200＝220,000<br>(4) 実際：2,150,000－380,000＋420,000＝2,190,000。予定2,200,000の方が多いので10,000の有利差異"], ["落とし穴", "賃金は実際の方が少ないので有利差異。差異は貸方に出る。間接工の賃金300,000円は直接工の差異に関係しない。"]], "1326": [["計算の筋道", "(1) 1,200×（620＋380）＝1,200,000<br>(4) 実際：1,170,000＋48,000＝1,218,000。1,218,000－1,200,000＝18,000（不利）"], ["落とし穴", "仕損費を製造間接費に入れると、その分も実際発生額になる。1,170,000と比べない。"]], "1328": [["計算の筋道", "工場の帳簿にない勘定（買掛金・当座預金・所得税預り金）は、工場側では「本社」に置き換わる<br>(2) 支払額：850,000－60,000＝790,000。賃金は総額850,000"], ["落とし穴", "工場側の賃金は手取りではなく総額。源泉徴収の預り金は本社の帳簿に出る。(3)で工場側の相手を売上原価にしない。"]], "1365": [["計算の筋道", "(1) 実際：640,000＋410,000＋520,000＝1,570,000<br>(2) 標準：1,500円×1,000個＝1,500,000<br>(3) 差異：材料640,000－600,000＝40,000、労務410,000－400,000＝10,000、間接費520,000－500,000＝20,000（いずれも不利）"], ["落とし穴", "パーシャル・プランは、仕掛品勘定に実際額で入れ、標準額で出すので、差異は仕掛品勘定で出る。シングル・プランなら、材料・賃金・製造間接費の各勘定で差異が出る。"]], "1366": [["計算の筋道", "(3) 動力：120,000×3/4＝90,000、×1/4＝30,000。修繕：80,000×1/2＝40,000ずつ。切削90,000＋40,000＝130,000、組立30,000＋40,000＝70,000<br>(4) 切削の実際：400,000＋130,000＝530,000。予定520,000より10,000多い＝不利<br>(5) 組立の実際：300,000＋70,000＝370,000。予定380,000より10,000少ない＝有利"], ["落とし穴", "差異は補助部門費を配った後の実際額で比べる。有利差異は、部門費の勘定の借方に残高が残るので、部門費を借方、差異を貸方にする。"]], "1367": [["計算の筋道", "(1) 直接経費は、特定の製品の原価としてそのまま仕掛品へ<br>(2)(3) どの製品の分か分からない工場の費用は、製造間接費へ<br>(4) 本社の費用は製造原価ではなく、販売費及び一般管理費"], ["落とし穴", "同じ減価償却費でも、工場の建物は製造間接費、本社の建物は期間の費用。正常な棚卸減耗は製造原価（間接経費）、異常なものは原価に入れない。"]], "1368": [["計算の筋道", "(3) 借方残高＝不利差異。原価が少なく計算されていた分を売上原価に足す<br>(4) 貸方残高＝有利差異。原価が多く計算されていた分を売上原価から引く"], ["落とし穴", "借方残高の差異は売上原価を増やし、貸方残高の差異は売上原価を減らす。残高と反対側に記入して、差異の勘定を空にする。"]]});

// 目印の直後に書き込みを入れた問題文を返す（括弧のスタイルに巻き込まれないよう、目印を置いてから最後に差し替える）
function fmtQAnnot(q){
  const list = Q_ANNOT[q.id];
  if(!list) return fmtQ(q);
  let txt = q.q_html || q.q || '';
  list.forEach(([anc], i) => { txt = txt.replace(anc, anc + '\u0001' + i + '\u0001'); });
  let html = fmtQ({...q, q: txt, q_html: undefined});
  list.forEach(([, note], i) => { html = html.replace('\u0001' + i + '\u0001', `<span class="q-annot">（${note}）</span>`); });
  return html;
}
function showQAnnot(q){
  if(!Q_ANNOT[q.id]) return;
  const body = document.querySelector('#exp-main .exp-q-card .q-body');
  if(body) body.innerHTML = fmtQAnnot(q);
}

function kogyoAnalog(n){
  if(KOGYO_ANALOG[n]) return KOGYO_ANALOG[n];
  if(/仕掛品$/.test(n)) return ['商品','工程・組ごとに分けた「作りかけの商品」。完成したら次の工程や製品へ移す'];
  if(/^製品（/.test(n)) return ['商品','等級・種類ごとに分けた完成品の在庫。売れたら売上原価へ'];
  if(/事業部$/.test(n)) return ['支店','事業部ごとに分けた社内の相手勘定。本支店会計の支店・本店と同じく、事業部どうしのやりとりを記録する'];
  if(/部門費$/.test(n)) return ['水道光熱費・消耗品費など','製造間接費を部門ごとに分けて集める入れ物。集めた後、製品に配る'];
  if(/差異$/.test(n)) return ['現金過不足','予定（標準）と実際のズレを一時的にためておく科目。現金過不足を決算で雑損・雑益に振り替えるように、決算で売上原価に振り替える'];
  return null;
}
// ===== 他の同じ種類の科目と残高の位置（借方・貸方）が逆になる科目、どちらにもなる科目の注記 =====
function acctSideNote(n){
  const asset='資産の仲間だが、他の資産と逆で<strong>貸方</strong>に残高がたまる', eq='純資産の仲間だが、他の純資産と逆で<strong>借方</strong>に残高がたまる';
  if(/減価償却累計額$|^減価償却引当金$|^減損損失累計額$/.test(n)) return asset+'（対応する固定資産から差し引く）';
  if(n==='貸倒引当金') return asset+'（売掛金・受取手形・貸付金などから差し引く）';
  if(n==='投資損失引当金') return asset+'（子会社株式・関連会社株式などから差し引く）';
  if(n==='繰延内部利益') return asset+'（支店などに残っている在庫から差し引く）';
  if(/^(商品評価引当金|商品低価引当金)$/.test(n)) return asset+'（商品から差し引く）';

る仕損。製品の原価に含めず、営業外費用や特別損失にする。","仕損費":"仕損にかかったコスト（補修費や、作り直した分の原価から処分価額を引いた額）。","営業外費用":"本業以外の活動から生じた費用や損失。異常仕損費はここに入れる。","本社工場会計":"本社と工場が別々に帳簿をつける方法。本社は「工場」、工場は「本社」という勘定でお互いのやりとりを記録する。","製造部門":"製品の加工を直接行う部門（切削部門・組立部門など）。","補助部門":"製造部門を支える部門（動力部門・修繕部門・工場事務部門など）。製品の加工は直接行わない。","第1次集計":"部門別計算の最初の段階。製造間接費を、製造部門と補助部門の各部門費に集計すること。","第2次集計":"補助部門費を製造部門に配賦すること。","直接配賦法":"補助部門どうしのやりとりを無視して、補助部門費を製造部門にだけ配賦する方法。","相互配賦法":"補助部門どうしのやりとりも考えて補助部門費を配賦する方法。","部門費配賦差異":"部門費の実際発生額と予定配賦額との差。製造間接費配賦差異を部門ごとに出したもの。","標準原価":"製品1個を作るのに本来かかるべき原価として、あらかじめ決めておく原価。","標準原価計算":"標準原価で製品原価を計算し、実際原価とのズレ（差異）を原因別に分析して、ムダを見つける方法。","実際原価":"実際にかかった原価。","シングルプラン":"仕掛品の借方（当月投入）も標準原価で記入する方法。差異は材料・賃金・製造間接費の各勘定で出てくる。","パーシャルプラン":"仕掛品の借方（当月投入）は実際原価、完成品と月末仕掛品は標準原価で記入する方法。差異は仕掛品の勘定で出てくる。","価格差異":"材料の実際の単価と標準単価の差から生じる差異。（標準単価−実際単価）×実際消費量。","数量差異":"材料の実際の消費量と標準消費量の差から生じる差異。（標準消費量−実際消費量）×標準単価。","時間差異":"作業時間の実際と標準の差から生じる差異（作業時間差異）。（標準作業時間−実際作業時間）×標準賃率。","操業度":"工場をどれだけ動かしたかの度合い。作業時間や機械の運転時間で測る。","基準操業度":"予算を立てるときに想定した、通常の稼働の水準。","予算許容額":"実際の操業度のもとで、本来かかってよいとされる製造間接費の予算額。","予算差異":"製造間接費の実際発生額と予算許容額との差。値上がりや使いすぎなど、金額の面の問題。","能率差異":"作業の効率が悪く、作業時間が標準より多くかかったために生じる製造間接費の差異。","操業度差異":"実際の操業度が基準操業度より少なく、固定費を製品に配りきれなかったために生じる差異。","有利差異":"実際原価が標準原価（予定）より少ないこと。貸方に出る。","不利差異":"実際原価が標準原価（予定）より多いこと。借方に出る。","直接原価計算":"変動費だけを製品の原価とし、固定費はその期の費用とする計算方法。社内の利益管理に使う。","全部原価計算":"変動費も固定費も、すべての製造原価を製品の原価とする計算方法。外部に報告する決算書はこの方法による。","変動費":"生産量に応じて増減する費用（材料費など）。","固定費":"生産量にかかわらず一定額かかる費用（工場の減価償却費・保険料など）。","固定費調整":"直接原価計算の利益を全部原価計算の利益に直すため、期首・期末の在庫に含まれる固定費を調整すること。","総合原価計算":"同じ製品を大量に作る場合に、一定期間（1か月）の原価をまとめて計算し、完成品と月末仕掛品に分ける方法。","単純総合原価計算":"1種類の製品を1つの工程で大量に作る場合の総合原価計算。","平均法":"月初仕掛品原価と当月製造費用を合計し、平均単価で完成品と月末仕掛品に分ける方法。","先入先出法":"月初仕掛品が先に完成したとみなし、月末仕掛品は当月製造費用だけから計算する方法。","完成品換算量":"月末仕掛品などの数量を、加工の進み具合（進捗度）に応じて完成品の数量に直したもの。数量×進捗度。","進捗度":"加工がどこまで進んでいるかの割合。","度外視法":"正常仕損費（正常減損費）を別に計算せず、仕損の数量をないものとして計算することで、良品の原価に自動的に含める方法。","減損":"蒸発・ガス化などで原料が工程の途中で消えること。形が残る仕損とは違うが、処理の考え方は同じ。","正常減損":"通常の製造で避けられない程度の減損。","処分価額":"仕損品や作業くずなどを売ったときに見込まれる金額。","工程別総合原価計算":"製   { no:4, q:'1年を超えて長期的に使用または保有する資産を何という？', ans:'固定資産', reason:'固定資産とは、1年を超えて長期間、事業のために使用または保有する資産のことです。さらに「有形固定資産」「無形固定資産」「投資その他の資産」の3つに分かれます。' },
  { no:5, q:'建物・土地・機械装置・備品など、長期間使用する形のある資産が分類される区分を何という？', ans:'有形固定資産', reason:'有形固定資産とは、建物・土地・機械装置・備品など、形があって長期間使用する資産の区分です。土地以外は、使用にともなって減価償却を行います。' },
  { no:6, q:'のれん・特許権・商標権・ソフトウェアなど、長期間事業に役立つ、形のない資産が分類される区分を何という？', ans:'無形固定資産', reason:'無形固定資産とは、のれん・特許権・商標権・ソフトウェアなど、形はないが長期間にわたって事業に役立つ資産の区分です。' },
  { no:7, q:'子会社株式・その他有価証券・長期貸付金・繰延税金資産など、短期売買ではなく長期的な投資や関係維持のために保有する資産が分類される区分を何という？', ans:'投資その他の資産', reason:'投資その他の資産とは、子会社株式・その他有価証券・長期貸付金・繰延税金資産など、短期的な売買や使用ではなく、長期的な投資や関係維持のために保有する資産の区分です。' },
  { no:8, q:'創立費・開業費・株式交付費・社債発行費のように、すでに支払った費用の効果が将来にも及ぶため、資産としていったん計上し、数年かけて償却していく特殊な資産の区分を何という？', ans:'繰延資産', reason:'繰延資産とは、すでに現金を支払ったものの、その効果が将来の期間にも及ぶため、いったん資産として計上し、数年かけて償却していく特殊な資産の区分です。' },
  { no:9, q:'資本金・資本剰余金・利益剰余金・自己株式など、株主が出資した元手や会社が稼いで蓄積した利益をまとめた、純資産の中の区分を何という？', ans:'株主資本', reason:'株主資本とは、純資産のうち、株主が出資したお金（資本金・資本剰余金）と、会社がこれまでに稼いで蓄積した利益（利益剰余金）、および自己株式をまとめた区分です。' },
  { no:10, q:'その他有価証券評価差額金のように、決算時の時価評価で生じたが、まだ売却などで損益として確定していない評価差額が分類される、純資産の中の区分を何という？', ans:'評価・換算差額等', reason:'評価・換算差額等とは、その他有価証券評価差額金など、決算時の時価評価によって生じたものの、まだ売却などで確定していない評価差額を計上する、純資産の中の区分です。' },
  { no:11, q:'商品の販売やサービスの提供など、会社の本業そのものから得られる収益を何という？', ans:'売上高', reason:'売上高とは、商品の販売やサービスの提供など、会社の本業そのものから得られる収益のことです。P/Lの一番上に表示される、会社の存在意義を表す数字です。' },
  { no:12, q:'売上高から差し引く、売れた商品の仕入原価や、提供したサービスの原価を何という？', ans:'売上原価', reason:'売上原価とは、売れた商品の仕入原価や、提供したサービスの原価のことです。売上高からこれを差し引くと、売上総利益（粗利）が計算できます。' },
  { no:13, q:'売上高から売上原価を差し引いた、商品そのものの儲け（粗利）を何という？', ans:'売上総利益', reason:'売上総利益とは、売上高から売上原価を差し引いた、商品そのものの儲け（粗利）のことです。ここからさらに販売費及び一般管理費を差し引いて、営業利益を計算します。' },
  { no:14, q:'給料・広告宣伝費・減価償却費・貸倒引当金繰入など、商品を販売するための費用と、会社全体を管理するための費用をまとめた区分を何という？', ans:'販売費及び一般管理費', reason:'販売費及び一般管理費とは、商品を販売するための費用（広告宣伝費・発送費など）と、会社全体を管理するための費用（給料・家賃・減価償却費など）をまとめた区分です。「販管費」と略されることもあります。' },
  { no:15, q:'売上総利益から販売費及び一般管理費を差し引いた、本業そのものの儲けを何という？', ans:'営業利益', reason:'営業利益とは、売上総利益から販売費及び一般管理費を差し引いた利益で、「本業でどれだけ稼げているか」を示す、最も重要な利益指標の1つです。' },
  { no:16, q:'受取利息・受取配当金・有価証券売却益など、本業以外から毎期ふつうに生じる収益を何という？', ans:'営業外収益', reason:'営業外収益とは、受取利息・受取配当金・有価証券売却益など、商品販売という本業以外から、毎期ふつうに生じる収益のことです。主に資金運用（財務活動）の成果です。' },
  { no:17, q:'支払利息・手形売却損・有価証券評価損など、本業以外から毎期ふつうに生じる費用を何という？', ans:'営業外費用', reason:'営業外費用とは、支払利息・手形売却損・有価証券評価損など、商品販売という本業以外から、毎期ふつうに生じる費用のことです。主に資金調達（財務活動）に伴うコストです。' },
  { no:18, q:'営業利益に、営業外収益を加え、営業外費用を差し引いた利益を何という？', ans:'経常利益', reason:'経常利益とは、営業利益に営業外収益を足し、営業外費用を引いた利益です。本業の儲けに、財務活動の結果まで加味した「会社の通常の活動全体の儲け」を表します。' },
  { no:19, q:'固定資産売却益・負ののれん発生益・国庫補助金受贈益など、毎期ふつうには生じない臨時的な利益を何という？', ans:'特別利益', reason:'特別利益とは、固定資産売却益や負ののれん発生益など、毎期ふつうに生じるものではない、臨時的・偶発的な利益のことです。' },
  { no:20, q:'固定資産売却損・火災損失・減損損失など、毎期ふつうには生じない臨時的な損失を何という？', ans:'特別損失', reason:'特別損失とは、固定資産売却損や火災損失、減損損失など、毎期ふつうに生じるものではない、臨時的・偶発的な損失のことです。' },
  { no:21, q:'経常利益に、特別利益を加え、特別損失を差し引いた、法人税等を差し引く前の利益を何という？', ans:'税引前当期純利益', reason:'税引前当期純利益とは、経常利益に特別利益・特別損失まで加味した、法人税等を差し引く前の、最終的な儲けのことです。ここから法人税、住民税及び事業税を差し引くと当期純利益になります。' },
  { no:22, q:'税引前当期純利益から、法人税、住民税及び事業税を差し引いた、1年間の最終的な儲けを何という？', ans:'当期純利益', reason:'当期純利益とは、税引前当期純利益から法人税等を差し引いた、1年間の会社の最終的な儲けのことです。この金額が、B/Sの純資産（繰越利益剰余金）に積み上がっていきます。' },
  { no:23, q:'製造業において、1期間の製品製造にかかった材料費・労務費・製造間接費の内訳と、当期製品製造原価の計算過程をまとめて示す書類を何という？', ans:'製造原価報告書', reason:'製造原価報告書とは、製造業において、1期間の製品の製造にかかった原価（材料費・労務費・製造間接費）の内訳と、当期製品製造原価の計算過程をまとめて示す書類です。P/Lの売上原価の計算に使われます。' },
  { no:24, q:'貸倒引当金や減価償却累計額のように、対応する資産の帳簿価額を直接書き換えず、資産の下に△（マイナス）として別掲し、差し引きで正味の価値を示す項目を何という？', ans:'評価勘定（控除項目）', reason:'評価勘定（控除項目）とは、貸倒引当金や減価償却累計額のように、対応する資産の帳簿価額を直接書き換えるのではなく、資産の下に△（マイナス）として別掲し、差し引きで正味の価値を示すための項目です。' },
];


function toggleSecTabs(){
  const wrap = document.getElementById('sec-tabs-wrap');
  const label = document.getElementById('sec-tabs-toggle-label');
  const collapsed = wrap.classList.toggle('collapsed');
  label.textContent = collapsed ? '分野を表示' : '分野を隠す';
  // 分野と一緒に「表示方法」も隠す
  document.getElementById('view-mode-row').style.display = (collapsed || bigFilter==='riron') ? 'none' : 'flex';
}

function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

  { id:730, calc:'段階取得に係る差益：200,000－180,000＝20,000円', level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式を2段階で取得した。Ｘ1年度末：Ｓ社株式20％を180,000円で取得。Ｘ2年度末：追加でＳ社株式40％を400,000円で取得し、合計60％保有として支配を獲得した。支配獲得時点でのＳ社株式20％（既存保有分）の<mark class="q-asset">時価は200,000円であった</mark>。<mark class="q-revenue">既存投資を時価に評価替えする</mark>仕訳を示しなさい（段階取得）。',
    en_q:'Company P acquired Company S\'s shares in two stages: 20% for ¥180,000 at the end of Year 1, and an additional 40% for ¥400,000 at the end of Year 2 (gaining control with 60% total). At the date control was obtained, the fair value of the previously held 20% was ¥200,000. Record the entry revaluing the existing investment to fair value (step acquisition).',
    e:[{d:[['S社株式',20000]], c:[['段階取得に係る差益',20000]]}],
    exp:'「段階取得」とは、一気に支配株主になるのではなく、少しずつ株を買い増して最終的に子会社化するケースです。まるで少額投資からコツコツ持ち株を増やしていって、ある日ついに筆頭株主になるようなイメージです。この場合、「支配を獲得した瞬間」に、それまで持っていた分（20％）も含めて全部を「今の時価」で評価し直すというルールがあります。以前180,000円で買った20％分が、今では200,000円の価値になっていたので、差額20,000円を「段階取得に係る差益」（連結上の収益）として計上します。'
  },
  { id:731, calc:'非支配株主持分の減少：1,000,000×20％＝200,000円\n資本剰余金の減少：250,000－200,000＝50,000円', level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式60％を保有し、既に支配している（非支配株主持分40％）。追加で<mark class="q-asset">Ｓ社株式20％を250,000円で取得した</mark>（合計80％保有）。<mark class="q-equity">追加取得時のＳ社純資産は1,000,000円であった</mark>。追加取得の連結修正仕訳を示しなさい（<mark class="q-equity">取得した持分だけ非支配株主持分を減らし</mark>、<mark class="q-equity">差額は資本剰余金とする</mark>）。',
    en_q:'Company P already controls Company S with a 60% holding (non-controlling interest 40%). P acquired an additional 20% for ¥250,000 (80% total). S\'s net assets at the time of additional acquisition were ¥1,000,000. Record the consolidation entry for the additional acquisition.',
    e:[{d:[['非支配株主持分',200000],['資本剰余金',50000]], c:[['S社株式',250000]]}],
    exp:'すでに子会社にしている会社の株を「追加で」買い増すケースです。もう支配は獲得済みなので、のれんは新たに計算しません。まるでグループ会社の株を仲間内で融通し合うようなイメージで、非支配株主（他の株主）から株を買い取ることになるので、非支配株主持分のうち買い取った分（Ｓ社純資産1,000,000×20％＝200,000円）を減らします。実際に払った金額250,000円との差額50,000円は、損益ではなく「資本剰余金」（純資産の内訳の一つ）の減少として処理します。「グループ内の株主構成が変わっただけ」なので、儲けや損としては扱わないのがポイントです。'
  },
  { id:732, calc:'非支配株主持分の増加：1,200,000×20％＝240,000円\n売却した株式の帳簿価額：800,000×20／80＝200,000円\n資本剰余金の増加：300,000－240,000＝60,000円（個別の売却益100,000円は取り消す）', level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式80％（取得原価800,000円）を保有している。このうち20％を300,000円で売却した（売却後60％保有・支配は継続）。<mark class="q-equity">売却時のＳ社純資産は1,200,000円</mark>。個別財務諸表上、売却価額300,000円と<mark class="q-asset">売却原価200,000円（＝800,000×20/80）</mark>の差額100,000円を<mark class="q-revenue">「子会社株式売却益」として計上済みである</mark>。連結修正仕訳を示しなさい（<mark class="q-equity">売却した持分は非支配株主持分に振り替え</mark>、<mark class="q-equity">売却益は資本剰余金に修正する</mark>）。',
    en_q:'Company P holds 80% of Company S (cost ¥800,000). It sold 20% for ¥300,000 (retaining 60%, control continues). S\'s net assets at the time of sale were ¥1,200,000. On P\'s individual financial statements, a ¥100,000 gain (sale price ¥300,000 less cost basis ¥200,000, i.e. 800,000×20/80) was already recorded as "gain on sale of subsidiary shares." Record the consolidation adjusting entry.',
    e:[{d:[['S社株式',200000],['子会社株式売却益',100000]], c:[['非支配株主持分',240000],['資本剰余金',60000]]}],
    exp:'子会社株式を一部だけ売っても、まだ支配が続いている（60％保有で子会社のまま）場合、連結上は「損益」として扱いません。理由は「グループの外に売ったわけではなく、単に株主の内訳（親会社の取り分と非支配株主の取り分）が変わっただけ」だからです。まるで家族経営の会社の株を親戚内でやり取りしただけのようなイメージです。①個別財務諸表で計上した「子会社株式売却益」100,000円は、連結上は取り消します。②非支配株主の取り分は、売った20％分だけ増えます：Ｓ社純資産1,200,000×20％＝240,000円。③この240,000円と、取り消した売却益100,000円との差額140,000円は「資本剰余金」の減少として調整します。'
  },
  { id:733, calc:'', level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社（子会社）に対して<mark class="q-asset">500,000円を貸し付けている</mark>（<mark class="q-liability">Ｓ社側ではＰ社からの借入金500,000円となっている</mark>）。連結財務諸表を作成するにあたり、この債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P has lent ¥500,000 to subsidiary S. When preparing consolidated financial statements, record the entry eliminating this intercompany receivable/payable.',
    e:[{d:[['借入金',500000]], c:[['貸付金',500000]]}],
    exp:'連結財務諸表は「グループ全体を1つの会社」として見た財務諸表です。Ｐ社が貸してＳ社が借りたお金は、グループの外から見れば「自分の左のポケットから右のポケットにお金を移しただけ」で、実質的な貸し借りはありません。そこでＰ社の「貸付金」（資産）とＳ社の「借入金」（負債）を、金額をぶつけ合って両方ともゼロにします。この作業を「連結上の相殺消去」と呼びます。'
  },
  { id:734, calc:'', level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'上記の貸付金に対応する利息について、Ｐ社は<mark class="q-revenue">受取利息20,000円</mark>、Ｓ社は<mark class="q-expense">支払利息20,000円</mark>をそれぞれ計上している。連結財務諸表を作成するにあたり、この収益・費用を相殺消去する仕訳を示しなさい。',
    en_q:'For the loan above, P recorded interest income of ¥20,000 and S recorded interest expense of ¥20,000. When preparing consolidated financial statements, record the entry eliminating this intercompany revenue/expense.',
    e:[{d:[['受取利息',20000]], c:[['支払利息',20000]]}],
