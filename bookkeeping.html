    { term:'不利差異', en:'Unfavorable Variance', def:'標準原価計算で<strong>実際原価 ＞ 標準原価の差額</strong>です。「借方差異」ともいいます。予定より余計にコストがかかった状態で、原因を調査してコスト削減につなげます。', def_en:'In standard costing, occurs when <strong>actual cost exceeds standard cost</strong>. Also called "debit variance." Indicates a cost overrun — management should investigate the cause and take corrective action.' },
    { term:'有利差異', en:'Favorable Variance', def:'標準原価計算で<strong>実際原価 ＜ 標準原価の差額</strong>です。「貸方差異」ともいいます。予定より少ないコストで済んだ状態ですが、品質低下や無理な節約が原因のこともあるため注意が必要です。', def_en:'In standard costing, occurs when <strong>actual cost is less than standard cost</strong>. Also called "credit variance." Indicates cost savings, but may reflect reduced quality or unsustainable shortcuts — don\'t automatically assume it\'s positive.' },
    { term:'CVP分析', en:'Cost-Volume-Profit Analysis', def:'<strong>売上高・費用（固定費＋変動費）・利益の関係を分析する手法</strong>です。損益分岐点（利益がゼロになる売上高）を計算し、「いくら売れば黒字になるか」「あといくら売れば目標利益を達成できるか」を把握します。', def_en:'Analyzes the <strong>relationships between sales volume, costs (fixed + variable), and profit</strong>. Calculates the break-even point (where profit = zero) and answers questions like "How much do we need to sell to break even?" or "How much more to hit our target profit?"' },
    { term:'損益分岐点', en:'Break-even Point', def:'<strong>売上高 ＝ 総費用（固定費＋変動費）となり利益がゼロになる売上高</strong>です。計算式：固定費 ÷（1 − 変動費率）。これを超えた売上は利益、下回ると損失になります。', def_en:'The sales level at which <strong>total revenue equals total costs (profit = zero)</strong>. Formula: Fixed Costs ÷ (1 − Variable Cost Ratio). Sales above this point generate profit; below it, a loss.' },
    { term:'貢献利益', en:'Contribution Margin', def:'<strong>売上高から変動費だけを引いた利益</strong>です。「変動費を回収した後、固定費の回収と利益の獲得にあてられる金額」です。貢献利益 ÷ 売上高 ＝ 貢献利益率（限界利益率）。', def_en:'<strong>Sales Revenue minus Variable Costs</strong>. Represents "the amount available to cover fixed costs and generate profit after variable costs are recovered." Contribution Margin Ratio = Contribution Margin ÷ Sales.' },
    { term:'直接原価計算', en:'Variable Costing', def:'<strong>変動製造原価だけを製品原価に含め、固定製造原価は発生した期の費用として即時計上</strong>する方法です。利益が在庫量に左右されにくく、意思決定（追加受注など）に役立ちます。財務報告では使えません。', def_en:'<strong>Includes only variable manufacturing costs in product cost</strong>; fixed manufacturing overhead is expensed immediately in the period incurred. Profit is less affected by inventory changes, making it useful for internal decision-making. Not permitted for external financial reporting.' },
    { term:'全部原価計算', en:'Absorption Costing', def:'<strong>固定費・変動費を問わず、すべての製造原価を製品原価に含める</strong>方法です。財務会計（外部報告）では全部原価計算が義務づけられています。直接原価計算と営業利益が異なる理由は在庫に固定費が含まれるかどうかの違いです。', def_en:'<strong>Includes ALL manufacturing costs — both variable and fixed — in product cost</strong>. Required for external financial reporting. Operating profit differs from variable costing because fixed overhead is embedded in inventory under this method.' },
    { term:'固定費調整', en:'Fixed Cost Adjustment', def:'直接原価計算の営業利益を全部原価計算の営業利益に合わせる計算です。<strong>直接原価計算利益 ＋（期末在庫×固定費率）－（期首在庫×固定費率）＝ 全部原価計算利益</strong>となります。', def_en:'Reconciles variable costing profit to absorption costing profit: <strong>Variable Costing Profit + (Ending Inventory × Fixed Cost Rate) − (Beginning Inventory × Fixed Cost Rate) = Absorption Costing Profit</strong>.' },
    { term:'製造原価報告書', en:'Cost of Production Report', def:'当期の<strong>材料費・労務費・製造間接費の内訳と当期製品製造原価を示す報告書</strong>です。損益計算書の「売上原価」に使う「当期製品製造原価」の計算過程を示す内訳書です。', def_en:'A report showing the <strong>breakdown of manufacturing costs (materials, labor, overhead) and the total cost of goods manufactured for the period</strong>. It is the supporting schedule for the "Cost of Goods Sold" line on the income statement.' },
    { term:'当期製品製造原価', en:'Cost of Goods Manufactured', def:'当期に<strong>完成した製品にかかった原価の合計</strong>です。計算式：期首仕掛品原価 ＋ 当期総製造費用 − 期末仕掛品原価。損益計算書の売上原価の計算に使います。', def_en:'The <strong>total manufacturing cost of products completed during the period</strong>. Formula: Beginning WIP + Total Manufacturing Costs − Ending WIP. Used to calculate Cost of Goods Sold on the income statement.' },
    { term:'完成品換算量', en:'Equivalent Units', def:'総合原価計算で<strong>仕掛品（半製品）を完成品に換算した仮想の数量</strong>です。例：進捗度50%の仕掛品100個は完成品換算量50個。加工費は進捗度で換算し、材料費は投入タイミングで扱いが異なります。', def_en:'In process costing, the <strong>hypothetical number of "complete" units that WIP is equivalent to</strong>. Example: 100 units at 50% completion = 50 equivalent units. Conversion costs use the percentage-complete rate; direct materials depend on when they are added to the process.' },
    { term:'月末仕掛品の評価', en:'Valuation of WIP (End)', def:'総合原価計算で期末に残る仕掛品に原価を割り当てる計算です。<strong>平均法</strong>（全体の平均単価で均等配分）と<strong>先入先出法</strong>（先に着手した分が先に完成とみなす）の2方法があります。', def_en:'Assigns costs to ending WIP inventory in process costing. Two methods: <strong>Weighted-Average</strong> (distributes all costs evenly at a single average cost per equivalent unit) and <strong>FIFO</strong> (treats the earliest work-in-process as the first to be completed).' },
    { term:'等級別総合原価計算', en:'Grade-based Process Costing', def:'同じ工程で<strong>サイズ・品質が異なる等級品（Sサイズ・Mサイズ等）</strong>を生産するときの原価計算です。等価係数（品質・サイズに応じた重み）を掛けた積数で各等級に原価を配分します。', def_en:'Used when a single process produces <strong>products of different grades (e.g., S, M, L sizes)</strong>. Total costs are distributed among grades using "equivalence coefficients" that reflect the relative weight or quality of each grade.' },
    { term:'組別総合原価計算', en:'Batch Process Costing', def:'同じ工場で<strong>種類の異なる複数の製品（組）を同時生産</strong>するときの原価計算です。直接費は各組へ直接計上し、間接費は配賦基準で各組に割り振ります。', def_en:'Used when a single factory simultaneously produces <strong>multiple distinct product types (batches)</strong>. Direct costs are charged directly to each batch; overhead is allocated to each batch using a predetermined allocation base.' },
    { term:'度外視法', en:'Ignore Method (Normal Spoilage)', def:'総合原価計算で、製造工程で避けられない失敗品（<strong>正常仕損</strong>）を計算上「無視（度外視）」して処理する方法です。仕損品のコストを個別計算せず、<strong>完成品や月末仕掛品の原価に自動的に上乗せ（吸収）</strong>させます。「正常な失敗はコストの一部」という考え方で、計算がシンプルです。覚え方：「度外視＝存在しなかったことにして計算する」。', def_en:'In process costing, treats normal spoilage as invisible by spreading its cost across good output (completed units and ending WIP) without separately computing it. The idea: "normal failure is just part of the production cost." Simpler to apply than the explicit method.' },
    { term:'非度外視法', en:'Explicit Method (Normal Spoilage)', def:'総合原価計算で、正常仕損の原価を<strong>明示的に計算して完成品・月末仕掛品に正確に配分する方法</strong>です。仕損が発生した工程の進捗度（仕損点）によって、「完成品だけが負担」するか「仕掛品も一緒に負担」するかが決まります。度外視法より計算は複雑ですが、コストの所在がより明確になります。', def_en:'Explicitly calculates the cost of normal spoilage and allocates it to completed units and/or ending WIP. Whether ending WIP shares in the spoilage cost depends on the "spoilage point" (where in the process spoilage occurs). More complex than the ignore method but provides more precise cost assignment.' },
    { term:'前工程費', en:'Prior Process Cost', def:'複数の工程を順番に経て製品を作る「<strong>工程別総合原価計算</strong>」で使う概念です。前の工程で製造した半製品を次の工程の「材料」として受け入れるとき、<strong>前工程でかかった全コストをまとめて「前工程費」として次工程の仕掛品原価に加えます</strong>。前工程費は「工程開始時点で100%投入済み」として扱うため、進捗度に関係なく全量を対象に計算します。', def_en:'In multi-stage (process-by-process) costing, the cumulative manufacturing cost transferred from the prior process becomes "Prior Process Cost" in the current process. When semi-finished goods from Process 1 enter Process 2 as its input material, all Process 1 costs are lumped into this category. Prior process cost is treated as 100% complete at the start of the new process, regardless of the overall completion percentage.' },
  ]},
  { category:'⑯ 特殊商品売買・収益認識', items:[
    { term:'収益認識基準', en:'Revenue Recognition Standard', def:'<mark>「履行義務を充足したとき（約束した財・サービスを顧客に移転したとき）に収益を計上する」</mark>という新しいルール（ASC606/IFRS15準拠）です。契約→履行義務の識別→取引価格の配分→収益計上の5ステップで処理します。', def_en:'A standard requiring revenue to be recognized when a performance obligation is satisfied (i.e., when the promised good or service is transferred to the customer). Follows a 5-step model: (1) identify the contract, (2) identify performance obligations, (3) determine the transaction price, (4) allocate the price, (5) recognize revenue.' },
    { term:'履行義務', en:'Performance Obligation', def:'顧客との契約で<strong>財またはサービスを移転する約束</strong>です。収益認識では「履行義務が充足された時点」で収益を計上します。一時点での充足（商品引渡し）と一定期間での充足（サービス提供）があります。', def_en:'A promise in a contract to transfer a distinct good or service to a customer. Revenue is recognized when (or as) each obligation is satisfied — either at a single point in time (e.g., product delivery) or over a period of time (e.g., ongoing service provision).' },
    { term:'委託販売', en:'Consignment Sales', def:'商品を第三者（受託者）に預けて<strong>代わりに販売してもらう取引</strong>です。委託者は売上計上を「受託者が実際に売った時点」まで遅らせます。売れ残りは委託者（預けた側）の資産として残ります。', def_en:'An arrangement where the owner (consignor) entrusts goods to a third party (consignee) to sell on their behalf. The consignor recognizes revenue only when the consignee sells the goods; unsold items remain as the consignor\'s inventory.' },
    { term:'受託販売', en:'Sales on Consignment', def:'<strong>他者（委託者）から預かった商品を代わりに販売する</strong>取引です。受託者は販売代金を自社の収益にせず委託者に渡し、<strong>受取手数料だけを収益</strong>として計上します。', def_en:'The act of selling goods on behalf of another party (the consignor). The consignee does not record the sales proceeds as its own revenue — it remits them to the consignor and recognizes only the commission fee as income.' },
    { term:'試用販売', en:'Trial Sales (Sale on Approval)', def:'顧客に商品を試しに使ってもらい、<strong>「買う」という意思表示があったときに売上を計上</strong>する方法です。試用期間中は「試送品（資産）」として記録し、承諾時に売上・売掛金に振り替えます。', def_en:'A sales method where goods are given to a customer on a trial basis; revenue is recognized only when the customer formally agrees to purchase. During the trial period, goods are recorded as "trial shipment inventory" and reclassified to sales upon acceptance.' },
    { term:'割賦販売', en:'Installment Sales', def:'代金を<strong>分割払い（月々払い）で受け取る販売方法</strong>です。現行基準では商品引渡し時点で売上全額を計上します（回収ごとの計上は原則不可）。未回収の分割代金は「割賦売掛金（資産）」で管理します。', def_en:'A sales arrangement where the buyer pays in periodic installments. Under current accounting standards, the full revenue is recognized at the time of delivery (not as each payment is collected). Outstanding installments are tracked as "installment accounts receivable."' },
    { term:'工事契約', en:'Construction Contract', def:'建設・大型設備などの長期工事を会計処理する方法です。<strong>工事進行基準</strong>（進捗率に応じて毎期収益を計上）が原則で、進捗を合理的に見積もれない場合のみ<strong>工事完成基準</strong>（完成時に一括計上）を使います。', def_en:'Accounting for long-term construction or large-scale engineering projects. The percentage-of-completion method (revenue recognized proportionally as work progresses) is the standard approach; the completed-contract method (all revenue at completion) is used only when progress cannot be reliably estimated.' },
    { term:'返品権付き販売', en:'Sales with Right of Return', def:'顧客に返品を認めている場合、<strong>返品が見込まれる金額を「返金負債（負債）」として計上</strong>し、その原価相当額を「返品資産（資産）」として計上します。返品が見込まれない分だけを売上収益として認識します。', def_en:'When customers have the right to return goods, the estimated return amount is deferred as a "refund liability" and the corresponding cost is recognized as a "return asset." Only the portion expected to be kept by customers is recorded as revenue.' },
    { term:'収益認識の5ステップ', en:'5-Step Revenue Recognition Model', def:'新収益認識基準（2021年4月施行）の処理手順です。<strong>①契約の識別</strong>（顧客との有効な契約を確認）→<strong>②履行義務の識別</strong>（契約の中で何を約束したか、個別の財・サービスを特定）→<strong>③取引価格の算定</strong>（値引き・リベート・返品・変動対価を考慮した最終的な受取額を見積もる）→<strong>④取引価格の各履行義務への配分</strong>（複数の義務がある場合、独立販売価格の比率で割り振る）→<strong>⑤収益の認識</strong>（各履行義務が充足されたとき、すなわち顧客が財・サービスの支配を得たときに計上）。この5つの順番はそのまま出題されます。', def_en:'The five-step process required by the new revenue recognition standard (effective April 2021): ①Identify the contract → ②Identify performance obligations (what distinct goods/services are promised) → ③Determine the transaction price (net of discounts, rebates, variable consideration) → ④Allocate the price to each obligation based on standalone selling prices → ⑤Recognize revenue as each obligation is satisfied (when the customer obtains control). The order of these steps may be directly tested.' },
    { term:'変動対価', en:'Variable Consideration', def:'契約の最終的な受取金額が<strong>不確かな要素によって変動する対価</strong>のことです。具体例：「目標販売量を達成したら追加ボーナス」「成果に応じたリベート（割戻し）」「返品が来たら代金を減額」など。収益認識では、将来の結果を見越して<strong>最も可能性が高い金額（最頻値法）または期待値</strong>を見積もり、不確実性が解消されるまで収益に含めない部分は「返金負債」などで除外します。', def_en:'Consideration whose amount depends on uncertain future outcomes: performance bonuses, volume rebates, expected returns, discounts, etc. Under revenue recognition standards, estimate the amount using the most likely value (mode method) or expected value (probability-weighted average), and exclude any portion that is highly probable of reversal by recording it as a "refund liability" or similar constraint.' },
  ]},
  { category:'⑰ 外貨換算・為替', items:[
    { term:'外貨建取引', en:'Foreign Currency Transaction', def:'ドル・ユーロなど<strong>外国通貨で行う取引</strong>です。日本の帳簿は円建てで記録するため、取引発生時の為替レートで円換算します。決算時には金銭債権・債務など一部の項目を時価（決算時レート）で評価し直す必要があります。', def_en:'A transaction denominated in a foreign currency (e.g., USD or EUR). Since Japanese books are kept in yen, the foreign amount is converted to yen using the exchange rate at the transaction date. Certain items (monetary assets/liabilities) must be remeasured at the closing rate at year-end.' },
    { term:'直物為替レート', en:'Spot Rate', def:'<strong>その時点でただちに外貨を交換するレート</strong>です。取引発生時・決算時の換算に使います。種類として「TTM（仲値）」「TTS（銀行が外貨を売るレート）」「TTB（銀行が外貨を買うレート）」があります。', def_en:'The exchange rate for immediate currency conversion. Used to record transactions on the transaction date and to remeasure items at year-end. Common variants: TTM (mid-rate), TTS (selling rate, when the bank sells foreign currency to you), TTB (buying rate, when the bank buys foreign currency from you).' },
    { term:'取引発生時レート', en:'Historical Rate', def:'外貨建て取引が発生した時点の為替レートです。<strong>外貨建て資産・負債を帳簿に最初に記録するときのレート</strong>で、非貨幣性項目（棚卸資産・固定資産等）はこのレートを期末以降も使い続けます。', def_en:'The exchange rate at the date a foreign currency transaction occurs. Used to initially record the yen amount in the books. For non-monetary items (inventory, fixed assets, etc.), this historical rate is retained at year-end with no remeasurement.' },
    { term:'決算時レート（CR）', en:'Closing Rate', def:'決算日時点の為替レートです。<strong>外貨建ての金銭債権（売掛金・貸付金等）・金銭債務（買掛金等）・有価証券は決算時レートで評価し直し</strong>、帳簿残高との差額を「為替差損益」として計上します。', def_en:'The exchange rate at the balance sheet (closing) date. Monetary assets and liabilities denominated in foreign currencies (e.g., receivables, payables, loans) are remeasured at this rate, and the difference from the recorded amount is recognized as a foreign exchange gain or loss.' },
    { term:'為替差損益', en:'Foreign Exchange Gain/Loss', def:'外貨建て取引の<strong>発生時レートと決済時（または決算時）レートの差</strong>から生じる損益です。<mark>円高（外貨安）の場合：外貨建て債権は為替差損、外貨建て債務は為替差益になります。</mark>', def_en:'Gains or losses resulting from the difference between the exchange rate when a foreign currency transaction is recorded and the rate when it is settled (or remeasured at year-end). When the yen strengthens: foreign-currency receivables produce a loss; foreign-currency payables produce a gain.' },
    { term:'貨幣性項目・非貨幣性項目', en:'Monetary / Non-monetary Items', def:'外貨換算の区分です。<strong>貨幣性項目（現金・売掛金・買掛金・借入金等）は決算時レートで換算し直し</strong>ます。<strong>非貨幣性項目（棚卸資産・固定資産・前払費用等）は取得時レートを維持</strong>し、換算替えしません。', def_en:'A classification used in foreign currency translation. Monetary items (cash, receivables, payables, loans, etc.) are remeasured at the closing rate each year-end. Non-monetary items (inventory, fixed assets, prepaid expenses, etc.) keep the historical rate and are never remeasured.' },
  ]},
  { category:'⑱ 社債・資金調達', items:[
    { term:'社債の発行', en:'Bond Issuance', def:'会社が資金調達のために<strong>不特定多数の投資家に発行する有価証券（借用証書）</strong>です。定期的に利息（クーポン）を支払い、満期に元本を一括返済します。銀行借入と違い、広く一般投資家から資金を調達できます。帳簿では「社債（負債）」として計上します。', def_en:'Securities issued by a company to raise funds from investors. The issuer pays periodic interest (coupons) and repays the face value at maturity. Unlike bank loans, bonds allow a company to raise money from the general public. Recorded as "Bonds Payable" (a liability) on the balance sheet.' },
    { term:'額面金額', en:'Face Value (Par Value)', def:'社債の<strong>満期に投資家に返済する金額</strong>です。クーポン（利息）はこの額面金額×クーポン利率で計算します。発行時の払込金額（発行価格）と異なることがあり、その差額が「社債割引発行差金」になります。', def_en:'The amount printed on the bond certificate that the issuer must repay at maturity. Coupon interest is calculated as face value × coupon rate. The issue price may differ from the face value; any discount (face value minus issue price) is amortized as additional interest expense over the bond\'s life.' },
    { term:'クーポン', en:'Coupon (Interest)', def:'社債の<strong>定期的な利息支払い</strong>のことです。額面金額×クーポン利率で計算し、半年ごとなど定期的に社債権者へ支払います。支払い時は「社債利息（費用）」として計上します。', def_en:'The periodic interest payment made to bondholders. Calculated as face value × coupon rate, typically paid semi-annually. Recorded as "Bond Interest Expense" when paid. The coupon rate is fixed at issuance and does not change over the bond\'s life.' },
    { term:'割引発行', en:'Discount Issuance', def:'社債を<strong>額面より低い価格で発行</strong>することです。例：額面100円の社債を95円で発行。クーポン利率が市場金利より低い場合などに採用し、投資家に追加の利回りを提供します。差額5円は満期まで毎期「社債利息」として費用計上（償却）します。', def_en:'Issuing bonds at a price below their face value to offer investors a higher effective yield than the coupon rate alone provides. Example: a bond with ¥100 face value issued at ¥95. The ¥5 discount is amortized as additional bond interest expense over the life of the bond.' },
    { term:'社債の償却原価法', en:'Amortized Cost (Bonds Payable)', def:'割引発行した社債の<strong>帳簿価額（簿価）を毎期少しずつ額面に近づけていく方法</strong>です。毎期、未償却差額の一部を「社債利息（費用）」に追加計上し、同額だけ社債（負債）の帳簿価額を増加させます。満期時には帳簿価額＝額面金額になります。', def_en:'A method of gradually increasing the carrying amount of a discounted bond toward its face value over the bond\'s life. Each period, a portion of the discount is recognized as additional bond interest expense, and the bond\'s book value increases by the same amount, reaching face value at maturity.' },
    { term:'端数利息', en:'Accrued Interest', def:'社債・国債等を<strong>利払日と利払日の間に売買した場合に計算する経過利息</strong>です。「前回利払日から売買日までの日数分」の利息で、買い手が売り手に支払います。買い手の帳簿では「有価証券利息（収益）」で処理します。', def_en:'Interest accrued on a bond between the last interest payment date and the date of purchase. The buyer compensates the seller for the portion of the coupon period already elapsed. The buyer records this amount as "Securities Interest Income" (which offsets the next full coupon received).' },
  ]},
  { category:'⑲ 簿記の補足', items:[
    { term:'取引の8要素', en:'8 Elements of Transactions', def:'仕訳の借方・貸方にはそれぞれ4種類、合計8種の要素があります。<strong>借方：①資産↑ ②負債↓ ③純資産↓ ④費用↑ ／ 貸方：⑤資産↓ ⑥負債↑ ⑦純資産↑ ⑧収益↑</strong>。すべての仕訳はこの8要素の組み合わせで成り立ちます。', def_en:'Every journal entry is built from 8 elements (4 per side). Debit side: ①asset increase ②liability decrease ③equity decrease ④expense increase. Credit side: ⑤asset decrease ⑥liability increase ⑦equity increase ⑧revenue increase. Every transaction in double-entry bookkeeping is a combination of these elements.' },
    { term:'決算振替仕訳', en:'Closing Entries', def:'期末に<strong>すべての収益・費用勘定を「損益」勘定へ振り替え、当期純利益を「繰越利益剰余金」へ振り替える仕訳</strong>です。これにより収益・費用勘定はゼロにリセットされ、次期の帳簿が新たにスタートします。', def_en:'Journal entries made at the end of each accounting period to close all revenue and expense accounts into the "Income Summary" account, and then transfer the resulting net income (or loss) to "Retained Earnings." After this process, income statement accounts are reset to zero for the next period.' },
    { term:'損益勘定', en:'Income Summary', def:'決算振替仕訳の際にのみ使う<strong>一時的な中間集計用の勘定科目</strong>です。全収益を借方に集めて消去し、全費用を貸方に集めて消去します。残った差額が当期純利益（または純損失）で、最終的に繰越利益剰余金に振り替えてゼロになります。', def_en:'A temporary account used only during the closing process to aggregate all revenues and expenses. Revenues are transferred in (debited to zero them out) and expenses are transferred in (credited to zero them out); the balance equals net income, which is then closed to Retained Earnings.' },
    { term:'帳簿の締め切り', en:'Closing the Books', def:'期末に<strong>収益・費用勘定をゼロにリセット</strong>し、資産・負債・純資産の残高を翌期に繰り越す作業です。日本では主に<strong>英米式</strong>（損益勘定を経由して繰越利益剰余金に振り替える方法）が使われます。', def_en:'The year-end process of zeroing out all revenue and expense accounts and carrying forward balances of asset, liability, and equity accounts to the next period. In Japan, the Anglo-American method (routing through the Income Summary before closing to Retained Earnings) is the standard approach.' },
    { term:'資本等式', en:'Capital Equation', def:'<strong>「純資産（資本）＝資産－負債」</strong>という等式です。貸借対照表等式「資産＝負債＋純資産」を変形したもので、株主の持ち分（正味財産）を表します。', def_en:'The equation "Equity (Net Assets) = Assets − Liabilities." This is a rearrangement of the balance sheet equation "Assets = Liabilities + Equity" and represents the owners\' net stake in the business.' },
    { term:'損益計算書等式', en:'P/L Equation', def:'<strong>「費用＋当期純利益＝収益」</strong>または「収益－費用＝当期純利益」という等式です。損益計算書の構造の基本で、収益と費用の差が利益を表すことを示しています。', def_en:'The equation "Expenses + Net Income = Revenue," or equivalently "Revenue − Expenses = Net Income." This is the structural foundation of the income statement, showing that profit is the excess of revenue over expenses.' },
    { term:'継続企業の前提', en:'Going Concern', def:'会計では<strong>企業が将来にわたって事業を継続すると仮定</strong>して財務諸表を作成します。この前提が崩れる場合（清算・倒産・事業撤退等）は、資産を時価で評価し直すなど特別な会計処理が必要になります。', def_en:'The fundamental accounting assumption that a business will continue to operate for the foreseeable future. Financial statements are prepared on this basis. If the assumption no longer holds (liquidation, bankruptcy, etc.), assets must be remeasured at current values and different accounting rules apply.' },
  ]},
  { category:'⑳ 連結会計', items:[
    { term:'連結会計', en:'Consolidated Accounting', def:'<strong>親会社と子会社を一つの企業グループとみなして作る財務諸表</strong>の会計手法です。親会社単体の財務諸表とは別に、グループ全体の財務状態・経営成績を表す「連結財務諸表」を作成します。2級では連結会計の基本的な仕組みが問われます。', def_en:'The accounting method for preparing financial statements that treat a <strong>parent company and its subsidiaries as a single economic entity</strong>. In addition to standalone (parent-only) statements, a consolidated set of statements is prepared to show the group\'s overall financial position and results. Level 2 covers the basic mechanics of consolidation.' },
    { term:'連結財務諸表', en:'Consolidated Financial Statements', def:'親会社を頂点とする<strong>企業グループ全体の財務状態・経営成績を一体として示す財務諸表</strong>です。連結貸借対照表・連結損益計算書・連結株主資本等変動計算書・連結キャッシュ・フロー計算書などから構成されます。単体財務諸表と違い、グループ内取引は消去されます。', def_en:'Financial statements that present the <strong>financial position and results of an entire corporate group</strong> (parent + subsidiaries) as if it were a single entity. Comprises a consolidated balance sheet, income statement, statement of changes in equity, and cash flow statement. Intragroup transactions are eliminated.' },
    { term:'支配獲得日', en:'Acquisition Date', def:'親会社が子会社の<strong>支配を獲得した日（議決権の過半数を取得した日等）</strong>のことです。この日の子会社の資産・負債を時価評価し直し、投資額との差額（のれん）を計算します。連結の起点となる重要な日付です。', def_en:'The date on which the parent company acquires <strong>control of the subsidiary</strong> (typically the date >50% of voting rights are obtained). On this date, the subsidiary\'s assets and liabilities are remeasured at fair value, and any excess of the purchase price over fair-value net assets is recognized as goodwill.' },
    { term:'投資と資本の相殺消去', en:'Elimination of Investment vs. Equity', def:'連結修正の基本仕訳で、<strong>親会社の「子会社株式（投資）」と子会社の「資本（純資産）」を相殺消去</strong>します。この消去を行わないと、同じ財産が親会社の投資にも子会社の純資産にも二重計上されてしまいます。差額が「のれん」または「負のれん発生益」になります。', def_en:'The core consolidation entry that <strong>offsets and eliminates the parent\'s "Investment in Subsidiary" against the subsidiary\'s equity (net assets)</strong>. Without this, the same net assets would be double-counted. Any excess of investment cost over fair-value net assets becomes goodwill (or, if below, a bargain purchase gain).' },
    { term:'非支配株主持分', en:'Non-controlling Interests (NCI)', def:'子会社の純資産のうち、<strong>親会社が保有していない外部株主（少数株主）の持ち分</strong>です。例えば親会社が子会社の70%を保有していれば、残り30%が非支配株主持分として連結貸借対照表の純資産の部に表示されます。旧称「少数株主持分」。', def_en:'The portion of a subsidiary\'s net assets attributable to <strong>shareholders outside the corporate group (minority shareholders)</strong>. Example: if the parent owns 70%, the remaining 30% is NCI, shown in the equity section of the consolidated balance sheet. Previously called "minority interest."' },
    { term:'内部取引の相殺消去', en:'Elimination of Intercompany Transactions', def:'グループ内の企業間取引（親会社から子会社への売上・貸付金・受取手形など）を<strong>連結上は取り消す処理</strong>です。グループを一つの企業とみると、内部の売買はただの在庫の移動にすぎないため、収益・費用・債権・債務が重複して計上されないよう消去します。', def_en:'The consolidation adjustment that <strong>eliminates transactions between group companies</strong> (e.g., parent selling to subsidiary, intercompany loans, intercompany receivables/payables). From the group\'s perspective, internal transfers are not real sales — eliminating them prevents double-counting of revenues, expenses, assets, and liabilities.' },
    { term:'未実現利益の消去', en:'Elimination of Unrealized Profits', def:'グループ内企業が互いに商品・固定資産を売買したとき、<strong>まだ外部に販売されていない利益（未実現利益）を消去</strong>する処理です。例えば親会社が子会社に原価100円の商品を150円で売り、子会社がまだ販売していなければ50円の未実現利益を消去します。', def_en:'The elimination of profits on goods or assets sold within the group that have <strong>not yet been sold to external parties (unrealized profit)</strong>. Example: parent sells goods costing ¥100 to subsidiary for ¥150; if the subsidiary has not yet resold them, the ¥50 internal profit is eliminated from consolidated inventory and retained earnings.' },
    { term:'持分法', en:'Equity Method', def:'子会社（支配）ではなく<strong>関連会社（重要な影響を持つ会社）に対して適用する会計処理</strong>です。投資先の純利益のうち自社持ち分を「持分法による投資利益（収益）」として計上し、「関係会社株式（資産）」も増やします。純損失の場合は「持分法による投資損失（費用）」を計上します。', def_en:'The accounting method applied to <strong>investments in associates (companies over which the investor has significant influence but not control)</strong>. The investor recognizes its proportionate share of the associate\'s net income as "Income from Equity Method Investments," increasing the carrying value of the investment. Losses are recognized as an expense and reduce the investment.' },
    { term:'のれん（連結）', en:'Consolidated Goodwill', def:'連結時に<strong>子会社取得額が子会社純資産の時価より多い差額</strong>をのれんとして連結貸借対照表に計上します。日本基準では20年以内に均等償却（のれん償却費）します。IFRSでは償却せず「減損テスト」を毎年行います。', def_en:'The excess of the <strong>acquisition cost over the fair value of the subsidiary\'s net assets at the acquisition date</strong>, recognized on the consolidated balance sheet. Under Japanese GAAP, amortized evenly within 20 years (Goodwill Amortization). Under IFRS, not amortized but subject to annual impairment testing.' },
    { term:'段階取得', en:'Step Acquisition', def:'子会社株式を<strong>複数回に分けて取得して支配を獲得するケース</strong>です。支配獲得日に、それまで保有していた株式（関連会社株式など）を支配獲得時の時価で評価し直し、差額を「段階取得に係る差益（利益）」として計上します。', def_en:'Acquiring a subsidiary\'s shares in <strong>multiple transactions over time until control is obtained</strong>. On the acquisition date, previously held interests (e.g., equity-method investments) are remeasured at fair value, and any resulting gain is recognized as "Step Acquisition Gain" in profit or loss.' },
  ]},
  { category:'㉑ 銀行勘定調整表', items:[
    { term:'銀行勘定調整表', en:'Bank Reconciliation Statement', def:'<strong>当座預金の帳簿残高と銀行から受け取った残高証明書（銀行側の残高）の差異を調整・説明する表</strong>です。両者の残高が一致しないのは、時間外預金・未取付小切手・未渡小切手・連絡未達事項などのタイムラグが原因です。2級の頻出問題です。', def_en:'A schedule that <strong>reconciles the company\'s book balance of the checking account with the balance shown on the bank statement</strong>. Differences arise from timing lags: deposits in transit, outstanding checks, undelivered checks, and items not yet notified. A frequently tested topic on the Level 2 exam.' },
    { term:'時間外預金', en:'Deposits in Transit', def:'会社が帳簿に記録したが、<strong>銀行の営業時間外に入金したため銀行側の残高にまだ反映されていない預金</strong>です。会社残高＞銀行残高の原因になります。銀行側の残高に「＋時間外預金」の調整をします。', def_en:'Deposits recorded by the company but <strong>not yet reflected in the bank\'s records</strong> because they were made after banking hours (or at period-end). The company\'s book balance exceeds the bank balance. Adjustment: add to the bank statement balance.' },
    { term:'未取付小切手', en:'Outstanding Checks', def:'会社が小切手を振り出して相手に渡したが、<strong>相手がまだ銀行に持ち込んでいない（取り付けていない）ため銀行側から引き落とされていない小切手</strong>です。会社残高＜銀行残高の原因。銀行側の残高から「－未取付小切手」を調整します。', def_en:'Checks issued by the company and given to payees but <strong>not yet presented to the bank for payment</strong>. The bank balance is higher than the company\'s book balance by this amount. Adjustment: subtract from the bank statement balance.' },
    { term:'未渡小切手', en:'Undelivered Checks', def:'会社が小切手を振り出して帳簿から引き落としたが、<strong>まだ相手に渡していない小切手</strong>です。本来まだ支払いが完了していないので、会社側の帳簿残高を修正（当座預金残高を増やし、未払金などを計上）します。', def_en:'Checks written and deducted from the company\'s books but <strong>not yet delivered to the payee</strong>. Since payment has not actually been made, a correction is needed on the company\'s side: restore the checking account balance and record the obligation as Accounts Payable (or a similar liability).' },
    { term:'連絡未達事項', en:'Items Not Yet Notified', def:'銀行が処理（引き落とし・入金）を行ったが、<strong>会社にまだ通知が届いておらず帳簿に記録されていない項目</strong>です。例えば銀行が自動的に引き落とした手数料・利息など。会社側の帳簿を修正（記帳）する必要があります。', def_en:'Transactions processed by the bank but <strong>not yet recorded in the company\'s books</strong> because notification has not been received. Examples: bank service charges, interest automatically deducted, or incoming wire transfers. The company must update its books once it learns of these items.' },
    { term:'当座預金残高証明書', en:'Bank Statement', def:'銀行が発行する<strong>当座預金の取引履歴と残高を記録した証明書</strong>です。銀行勘定調整表を作成する際に会社の帳簿残高と照合します。両者の差異の原因を一つひとつ確認して、修正後の「真の残高」を求めます。', def_en:'A document issued by the bank listing all transactions and the <strong>official bank-side balance of the checking account</strong>. Used in bank reconciliation to compare against the company\'s book balance. Each difference is identified and corrected to arrive at the "true balance."' },
    { term:'両者区分調整法', en:'Reconciliation from Both Sides', def:'銀行勘定調整表の作成方法で、<strong>「銀行残高」と「帳簿残高」の両方を修正して一致させる方式</strong>です。銀行残高には時間外預金を加え未取付小切手を引き、帳簿残高には連絡未達の入金を加え未達の引き落としを引くことで、両者が「修正後残高」で一致します。最もよく使われる方法です。', def_en:'The most common bank reconciliation format: <strong>adjust both the bank balance and the book balance</strong> until they agree on a "adjusted true balance." Add deposits in transit to bank balance; subtract outstanding checks from bank balance. Add unreported credits to book balance; subtract unreported debits from book balance.' },
  ]},
];

const APX_TYPE_INFO = {
  asset:      { name:'資産 (Assets)',              sub:'会社が持っているもの・もらえる権利' },
  liability:  { name:'負債 (Liabilities)',          sub:'将来払わなければならない義務・借金' },
  expense:    { name:'費用 (Expenses)',             sub:'お金を使ったとき・価値が減ったとき' },
  revenue:    { name:'収益 (Revenue)',              sub:'お金が増えたとき・稼いだとき' },
  equity:     { name:'純資産 (Equity)',             sub:'本当に自分のものの総額（資産－負債）' },
  other:      { name:'評価勘定・その他 (Other)',    sub:'固定資産・売掛金のマイナス調整など' },
  industrial: { name:'工業簿記 (Industrial)',       sub:'製造業の原価計算で使う勘定科目' },
};

function buildApxContent(){
  const freq = {};
  ALL.forEach(q => {
    if(!q.e) return;
    const seen = new Set();
    q.e.forEach(entry => {
      [...(entry.d||[]), ...(entry.c||[])].forEach(([name]) => seen.add(name));
    });
    seen.forEach(name => { freq[name] = (freq[name]||0) + 1; });
  });

  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  // Also build chapter-order map
  const byChap = {};
  ACCT_Q_CHAP_ORDER.forEach(c => byChap[c] = []);
  byChap['その他（PDF未収録）'] = [];

  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name] || 'other';
    const cardNote = ACCT_Q_JP[name] || note;
    const cardNoteEn = ACCT_Q_EN[name] || note_en;
    const item = { name, en, note: cardNote, lv, note_en: cardNoteEn, type };
    byType[type].push(item);
    const chap = ACCT_Q_CHAP[name];
    if(chap && byChap[chap]) byChap[chap].push(item);
    else byChap['その他（PDF未収録）'].push(item);
  });
  order.forEach(type => byType[type].sort((a, b) => (freq[b.name]||0) - (freq[a.name]||0)));

  function makeRow({ name, en, note, lv, note_en, type }){
    const t = type || T[name] || 'other';
    return `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}" data-type="${t}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${tagType(name)}">(${name})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
          <span class="apx-tts-btns">
            <button class="apx-tts-btn" onclick="apxSpeakRow(this,'ja')" title="日本語で読む">🔊 JP</button>
            <button class="apx-tts-btn en" onclick="apxSpeakRow(this,'en')" title="英語で読む">🔊 EN</button>
            <button class="apx-tts-btn both" onclick="apxSpeakRow(this,'both')" title="日→英">🔊 両</button>
          </span>
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`;
  }

  // Chapter-based HTML (used for "all" tab)
  const chapHtml = [...ACCT_Q_CHAP_ORDER, 'その他（PDF未収録）'].map(chap => {
    const items = byChap[chap] || [];
    if(!items.length) return '';
    const isInd = chap.startsWith('工業簿記');
    const category = isInd ? 'industrial' : 'chap';
    const rows = items.map(makeRow).join('');
    return `<div class="apx-section" data-type="chap" data-chap="${chap}" data-category="${category}">
      <div class="apx-section-hd other"><span class="dot other"></span>${chap}</div>
      ${rows}
    </div>`;
  }).join('');

  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(makeRow).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note, , note_en]) => {
      const type = T[name] || 'other';
      const cardNote = IND_Q_JP[name] || note;
      const cardNoteEn = IND_Q_EN[name] || note_en;
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${tagType(name)}">(${name})</span>
          <span class="apx-lv ind">工業</span>
          <span class="apx-tts-btns">
            <button class="apx-tts-btn" onclick="apxSpeakRow(this,'ja')" title="日本語で読む">🔊 JP</button>
            <button class="apx-tts-btn en" onclick="apxSpeakRow(this,'en')" title="英語で読む">🔊 EN</button>
            <button class="apx-tts-btn both" onclick="apxSpeakRow(this,'both')" title="日→英">🔊 両</button>
          </span>
        </div>
        <div class="apx-note">${cardNoteEn?`<div class="gloss-def-en">${cardNoteEn}</div>`:''}<div class="apx-note-ja">${cardNote}</div></div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def, def_en }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-en">${en}</span> <span class="gloss-term-text">(${term})</span>
            <span class="apx-tts-btns">
              <button class="apx-tts-btn" onclick="apxSpeakRow(this,'ja')" title="日本語で読む">🔊 JP</button>
              <button class="apx-tts-btn en" onclick="apxSpeakRow(this,'en')" title="英語で読む">🔊 EN</button>
              <button class="apx-tts-btn both" onclick="apxSpeakRow(this,'both')" title="日→英">🔊 両</button>
            </span>
          </div>
          <div class="gloss-def">${def_en?`<div class="gloss-def-en">${def_en}</div>`:''}<div class="gloss-def-ja">${def}</div></div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  const dispHtml = '<div class="disp-section" data-type="display">' +
    DISPLAY_DATA.map(({ no, name, ans, disp, reason }) => {
      const ansLines = ans.map(([stmt, cat]) => {
        const cls = stmt === 'P/L' ? 'pl' : stmt === 'B/S' ? 'bs' : stmt === '製造原価報告書' ? 'cost' : 'none';
        return `<div class="disp-ans-line"><span class="disp-stmt ${cls}">${stmt}</span><span class="disp-cat">${cat}</span></div>`;
      }).join('');
      return `<div class="disp-row" data-name="${name}">
        <div class="disp-no">No.${no}</div>
        <div class="disp-q">${name}</div>
        <div class="disp-ans-wrap">
          ${ansLines}
          ${disp ? `<div class="disp-dispname">表示科目：${disp}</div>` : ''}
          <div class="disp-reason">${reason}</div>
        </div>
      </div>`;
    }).join('') +
  '</div>';

  return chapHtml + commercialHtml + indHtml + glossHtml + dispHtml;
}

function apxStripHtml(h){
  return h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}

/* 各行の4パーツを返すヘルパー */
function _apxParts(row, name, en){
  const jaEl = row && row.querySelector('.apx-note-ja, .gloss-def-ja');
  const enEl = row && row.querySelector('.gloss-def-en, .apx-note .gloss-def-en');
  return {
    jaNote: jaEl ? apxStripHtml(jaEl.innerHTML) : '',
    enNote: enEl ? apxStripHtml(enEl.innerHTML) : '',
    jaYomi: APX_YOMI[name] || name,
    enName: en,
  };
}

/* ② 説明（問題）→ 用語（答え）の順 */
function _apxBuildText(row, name, en, lang){
  const {jaNote, enNote, jaYomi, enName} = _apxParts(row, name, en);
  if(lang === 'ja') return jaNote ? jaNote + '。' + jaYomi : jaYomi;
  return enNote ? enNote + '. ' + enName : enName;
}

/* ③ both → JP問題→EN問題→JP答え→EN答え の4発話 */
function apxSpeakRow(btn, lang){
  if(!('speechSynthesis' in window)) return;
  const row = btn.closest('.apx-row, .gloss-row');
  const name = (row && row.dataset.name) || '';
  const en   = (row && row.dataset.en)   || '';
  window.speechSynthesis.cancel();
  apxPlayAllActive = false;
  if(lang === 'both'){
    const {jaNote, enNote, jaYomi, enName} = _apxParts(row, name, en);
    const jr = apxTTSRate * 1.5, er = 1.0;
    const s4 = () => _apxUtter(enName,  'en', null,  er);
    const s3 = () => _apxUtter(jaYomi,  'ja', s4,    jr);
    const s2 = enNote ? () => _apxUtter(enNote, 'en', s3, er) : s3;
    const s1 = jaNote ? () => _apxUtter(jaNote, 'ja', s2, jr) : s2;
    s1();
  } else {
    _apxUtter(_apxBuildText(row, name, en, lang), lang);
  }
}

let apxVoiceJa = null;
let apxVoiceEn = null;

function apxSetVoice(lang, name){
  const v = speechSynthesis.getVoices().find(x => x.name === name) || null;
  if(lang === 'ja') apxVoiceJa = v; else apxVoiceEn = v;
}

function apxInitVoices(){
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return;

  const jaEl = document.getElementById('apx-voice-ja');
  const enEl = document.getElementById('apx-voice-en');
  if(!jaEl || !enEl) return;

  const jaVoices = voices.filter(v => v.lang.startsWith('ja'));
  const enVoices = voices.filter(v => v.lang.startsWith('en'));

  function populate(el, list, prefLang){
    el.innerHTML = '';
    if(!list.length){ el.innerHTML='<option value="">（なし）</option>'; return; }
    list.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      const quality = v.name.includes('Enhanced') || v.name.includes('Premium')
                      ? ' ★' : v.localService ? '' : ' (net)';
      opt.textContent = v.name + quality;
      el.appendChild(opt);
    });
    // prefer Enhanced/Premium, then local
    const best = list.find(v => v.name.includes('Enhanced') || v.name.includes('Premium'))
              || list.find(v => v.localService)
              || list[0];
    el.value = best.name;
    if(prefLang === 'ja') apxVoiceJa = best; else apxVoiceEn = best;
  }

  populate(jaEl, jaVoices, 'ja');
  populate(enEl, enVoices, 'en');
}

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = apxInitVoices;
  apxInitVoices(); // fires immediately in some browsers
}

function _apxUtter(text, lang, onend, rate){
  const utt = new SpeechSynthesisUtterance(text);
  const voice = lang === 'ja' ? apxVoiceJa : apxVoiceEn;
  if(voice){
    utt.voice = voice;
    utt.lang  = voice.lang;
  } else {
    utt.lang  = lang === 'ja' ? 'ja-JP' : 'en-US';
  }
  utt.rate  = rate != null ? rate : apxTTSRate;
  if(onend) utt.onend = onend;
  window.speechSynthesis.speak(utt);
}

/* ② 全て一気に再生（both対応）*/
function apxPlayAll(lang){
  if(apxPlayAllActive){ apxStopAll(); return; }
  // タブ切替はsec.style.displayで行うため、offsetParentで表示中の行だけ絞る
  const rows = [...document.querySelectorAll(
    '#apx-content .apx-row:not(.hidden), #apx-content .gloss-row:not(.hidden)'
  )].filter(r => r.offsetParent !== null);
  if(lang === 'both'){
    apxPlayAllQueue = [];
    rows.forEach(row => {
      const name = row.dataset.name || '';
      const en   = row.dataset.en   || '';
      const {jaNote, enNote, jaYomi, enName} = _apxParts(row, name, en);
      const jr = apxTTSRate * 1.5, er = 1.0;
      if(jaNote)  apxPlayAllQueue.push({text: jaNote, lang: 'ja', rate: jr});
      if(enNote)  apxPlayAllQueue.push({text: enNote, lang: 'en', rate: er});
      if(jaYomi)  apxPlayAllQueue.push({text: jaYomi, lang: 'ja', rate: jr});
      if(enName)  apxPlayAllQueue.push({text: enName, lang: 'en', rate: er});
    });
  } else {
    apxPlayAllQueue = rows.map(row => {
      const name = row.dataset.name || '';
      const en   = row.dataset.en   || '';
      return { text: _apxBuildText(row, name, en, lang), lang };
    }).filter(x => x.text.trim());
  }
  if(!apxPlayAllQueue.length) return;
  apxPlayAllActive = true;
  document.getElementById('apx-play-all-jp').textContent   = lang==='ja'   ? '⏹ 停止' : '▶ 日';
  document.getElementById('apx-play-all-en').textContent   = lang==='en'   ? '⏹ 停止' : '▶ 英';
  document.getElementById('apx-play-all-both').textContent = lang==='both' ? '⏹ 停止' : '▶ 双方';
  window.speechSynthesis.cancel();
  let idx = 0;
  function next(){
    if(!apxPlayAllActive || idx >= apxPlayAllQueue.length){ apxStopAll(); return; }
    const {text, lang: l, rate} = apxPlayAllQueue[idx++];
    _apxUtter(text, l, next, rate);
  }
  next();
}

function apxStopAll(){
  apxPlayAllActive = false;
  window.speechSynthesis.cancel();
  const bj = document.getElementById('apx-play-all-jp');
  const be = document.getElementById('apx-play-all-en');
  const bb = document.getElementById('apx-play-all-both');
  if(bj) bj.textContent = '▶ 日';
  if(be) be.textContent = '▶ 英';
  if(bb) bb.textContent = '▶ 双方';
}

function showApx(){
  apxInitVoices(); // iOS Safari は遅延ロードのためここでも呼ぶ
  const el = document.getElementById('apx-overlay');
  if(!document.getElementById('apx-content').innerHTML){
    document.getElementById('apx-content').innerHTML = buildApxContent();
    const tabsEl = document.getElementById('apx-tabs');
    const indBtn = tabsEl.querySelector('[data-type="industrial"]');
    ACCT_Q_CHAP_ORDER.filter(chap => !chap.startsWith('工業簿記')).forEach(chap => {
      const btn = document.createElement('button');
      btn.className = 'apx-tab';
      btn.dataset.type = 'chap:' + chap;
      btn.textContent = chap.replace(/：.*/, '');
      btn.title = chap;
      btn.onclick = () => setApxTab('chap:' + chap);
      tabsEl.insertBefore(btn, indBtn);
    });
  }
  el.classList.add('show');
  apxCurrentTab = 'all';
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'all'));
  applyApxFilter('all');
}
function hideApx(){ document.getElementById('apx-overlay').classList.remove('show'); }

function setApxTab(type){
  apxCurrentTab = type;
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  applyApxFilter(type);
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  const dispEl = content.querySelector('.disp-section');
  if(dispEl){
    dispEl.style.display = (tab === 'display') ? '' : 'none';
    if(tab === 'display')
      dispEl.querySelectorAll('.disp-row').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category === 'chap';
    else if(tab.startsWith('chap:')) typeMatch = sec.dataset.chap === tab.slice(5);
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else typeMatch = false;

    if(!typeMatch){ sec.style.display = 'none'; return; }

    sec.style.display = '';
    sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
  });
}

let qaAllItems  = null;
function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

  { id:730, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式を2段階で取得した。Ｘ1年度末：Ｓ社株式20％を180,000円で取得。Ｘ2年度末：追加でＳ社株式40％を400,000円で取得し、合計60％保有として支配を獲得した。支配獲得時点でのＳ社株式20％（既存保有分）の<mark class="q-asset">時価は200,000円であった</mark>。<mark class="q-revenue">既存投資を時価に評価替えする</mark>仕訳を示しなさい（段階取得）。',
    en_q:'Company P acquired Company S\'s shares in two stages: 20% for ¥180,000 at the end of Year 1, and an additional 40% for ¥400,000 at the end of Year 2 (gaining control with 60% total). At the date control was obtained, the fair value of the previously held 20% was ¥200,000. Record the entry revaluing the existing investment to fair value (step acquisition).',
    e:[{d:[['S社株式',20000]], c:[['段階取得に係る差益',20000]]}],
    exp:'「段階取得」とは、一気に支配株主になるのではなく、少しずつ株を買い増して最終的に子会社化するケースです。まるで少額投資からコツコツ持ち株を増やしていって、ある日ついに筆頭株主になるようなイメージです。この場合、「支配を獲得した瞬間」に、それまで持っていた分（20％）も含めて全部を「今の時価」で評価し直すというルールがあります。以前180,000円で買った20％分が、今では200,000円の価値になっていたので、差額20,000円を「段階取得に係る差益」（連結上の収益）として計上します。'
  },
  { id:731, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式60％を保有し、既に支配している（非支配株主持分40％）。追加で<mark class="q-asset">Ｓ社株式20％を250,000円で取得した</mark>（合計80％保有）。<mark class="q-equity">追加取得時のＳ社純資産は1,000,000円であった</mark>。追加取得の連結修正仕訳を示しなさい。',
    en_q:'Company P already controls Company S with a 60% holding (non-controlling interest 40%). P acquired an additional 20% for ¥250,000 (80% total). S\'s net assets at the time of additional acquisition were ¥1,000,000. Record the consolidation entry for the additional acquisition.',
    e:[{d:[['非支配株主持分',200000],['資本剰余金',50000]], c:[['S社株式',250000]]}],
    exp:'すでに子会社にしている会社の株を「追加で」買い増すケースです。もう支配は獲得済みなので、のれんは新たに計算しません。まるでグループ会社の株を仲間内で融通し合うようなイメージで、非支配株主（他の株主）から株を買い取ることになるので、非支配株主持分のうち買い取った分（Ｓ社純資産1,000,000×20％＝200,000円）を減らします。実際に払った金額250,000円との差額50,000円は、損益ではなく「資本剰余金」（純資産の内訳の一つ）の減少として処理します。「グループ内の株主構成が変わっただけ」なので、儲けや損としては扱わないのがポイントです。'
  },
  { id:732, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式80％（取得原価800,000円）を保有している。このうち20％を300,000円で売却した（売却後60％保有・支配は継続）。<mark class="q-equity">売却時のＳ社純資産は1,200,000円</mark>。個別財務諸表上、売却価額300,000円と売却原価200,000円（＝800,000×20/80）の差額100,000円を<mark class="q-revenue">「子会社株式売却益」として計上済みである</mark>。連結修正仕訳を示しなさい。',
    en_q:'Company P holds 80% of Company S (cost ¥800,000). It sold 20% for ¥300,000 (retaining 60%, control continues). S\'s net assets at the time of sale were ¥1,200,000. On P\'s individual financial statements, a ¥100,000 gain (sale price ¥300,000 less cost basis ¥200,000, i.e. 800,000×20/80) was already recorded as "gain on sale of subsidiary shares." Record the consolidation adjusting entry.',
    e:[{d:[['子会社株式売却益',100000],['資本剰余金',140000]], c:[['非支配株主持分',240000]]}],
    exp:'子会社株式を一部だけ売っても、まだ支配が続いている（60％保有で子会社のまま）場合、連結上は「損益」として扱いません。理由は「グループの外に売ったわけではなく、単に株主の内訳（親会社の取り分と非支配株主の取り分）が変わっただけ」だからです。まるで家族経営の会社の株を親戚内でやり取りしただけのようなイメージです。①個別財務諸表で計上した「子会社株式売却益」100,000円は、連結上は取り消します。②非支配株主の取り分は、売った20％分だけ増えます：Ｓ社純資産1,200,000×20％＝240,000円。③この240,000円と、取り消した売却益100,000円との差額140,000円は「資本剰余金」の減少として調整します。'
  },
  { id:733, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社（子会社）に対して<mark class="q-asset">500,000円を貸し付けている</mark>。連結財務諸表を作成するにあたり、この債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P has lent ¥500,000 to subsidiary S. When preparing consolidated financial statements, record the entry eliminating this intercompany receivable/payable.',
    e:[{d:[['借入金',500000]], c:[['貸付金',500000]]}],
    exp:'連結財務諸表は「グループ全体を1つの会社」として見た財務諸表です。Ｐ社が貸してＳ社が借りたお金は、グループの外から見れば「自分の左のポケットから右のポケットにお金を移しただけ」で、実質的な貸し借りはありません。そこでＰ社の「貸付金」（資産）とＳ社の「借入金」（負債）を、金額をぶつけ合って両方ともゼロにします。この作業を「連結上の相殺消去」と呼びます。'
  },
  { id:734, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'上記の貸付金に対応する利息について、Ｐ社は<mark class="q-revenue">受取利息20,000円</mark>、Ｓ社は<mark class="q-expense">支払利息20,000円</mark>をそれぞれ計上している。連結財務諸表を作成するにあたり、この収益・費用を相殺消去する仕訳を示しなさい。',
    en_q:'For the loan above, P recorded interest income of ¥20,000 and S recorded interest expense of ¥20,000. When preparing consolidated financial statements, record the entry eliminating this intercompany revenue/expense.',
    e:[{d:[['受取利息',20000]], c:[['支払利息',20000]]}],
    exp:'前問の貸付金・借入金とセットで発生する利息も同じ考え方です。Ｐ社が受け取った利息（収益）とＳ社が支払った利息（費用）は、グループ全体で見れば「グループ内でお金が動いただけ」で、外部から見た本当の収益・費用ではありません。まるで家族間でお小遣いを貸し借りしても、家計全体としては何も増えていないのと同じで、そこで「受取利息」と「支払利息」を相殺してゼロにします。貸付金・借入金の元本だけでなく、そこから生まれる利息も必ずセットで消去する、と覚えておきましょう。'
  },
  { id:735, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社へ<mark class="q-asset">現金100,000円を送金した</mark>が、決算日時点でＳ社側では未処理（未達）であった。①Ｓ社側で未達取引を整理する仕訳（<mark class="q-liability">借入金として処理</mark>）②その後、債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P remitted ¥100,000 cash to subsidiary S, but as of the balance sheet date, S had not yet recorded the receipt (in transit). Record ①the entry on S\'s books to recognize the in-transit item (as a loan payable) and ②the subsequent elimination of the intercompany receivable/payable.',
    e:[{d:[['現金',100000]], c:[['借入金',100000]]}, {d:[['借入金',100000]], c:[['貸付金',100000]]}],
    exp:'「未達取引」とは、親会社は送金の記録をつけたのに、子会社側の帳簿にまだその入金が反映されていない状態のことです（銀行の処理が決算日をまたいでしまった、などが原因）。振込がまだ相手の通帳に記帳されていない「タイムラグ」のようなイメージです。このままでは相殺消去（貸付金と借入金をぶつけ合う作業）がうまくできないので、①まずＳ社側の帳簿を「本来あるべき状態」に修正します（現金を受け取った記録を追加）。②その上で、Ｐ社の「貸付金」とＳ社の「借入金」を相殺消去します。「相殺消去の前に、まず両社の帳簿の金額を一致させる」というのがこの処理のポイントです。'
  },
  { id:736, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社、Ｐ社持分80％）は<mark class="q-expense">原価80,000円の商品をＰ社に100,000円で販売した</mark>。<mark class="q-asset">期末にＰ社の在庫にこの商品が全量残っている</mark>。①未実現利益の消去②非支配株主持分への按分の仕訳を示しなさい（<strong>アップストリーム取引</strong>）。',
    en_q:'Subsidiary S (80% owned by P) sold goods costing ¥80,000 to P for ¥100,000. All of these goods remain in P\'s ending inventory. Record ①the elimination of unrealized profit and ②the allocation to non-controlling interests (upstream transaction).',
    e:[{d:[['売上原価',20000]], c:[['棚卸資産',20000]]}, {d:[['非支配株主持分',4000]], c:[['非支配株主に帰属する当期純利益',4000]]}],
    exp:'「アップストリーム」とは、子会社（Ｓ社）から親会社（Ｐ社）へ商品が流れる取引のことです（逆に親会社→子会社は「ダウンストリーム」）。①Ｓ社が乗せた利益20,000円（＝100,000－80,000）は、Ｐ社の在庫にまだ残っている＝グループ外にまだ売れていないので、「未実現利益」として消去します（売上原価を増やして在庫の評価を下げる）。まるでグループ内でぐるぐる回っているだけの商品にまだ「本当の儲け」を認めないイメージです。②アップストリームの場合、この利益はもともと「Ｓ社の利益」なので、非支配株主（Ｓ社の他の株主）にも一部負担してもらう必要があります。非支配株主の負担分：20,000×20％＝4,000円。この4,000円分だけ、非支配株主の取り分（非支配株主持分）を減らします。ダウンストリーム（親→子）の場合はこの按分は行わない点が違いです。'
  },
  { id:737, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の<mark class="q-equity">当期純利益は500,000円であった（Ｐ社持分80％、非支配株主持分20％）</mark>。非支配株主に帰属する当期純利益を非支配株主持分に振り替える仕訳を示しなさい。',
    en_q:'Subsidiary S\'s net income for the period was ¥500,000 (P holds 80%, non-controlling interest 20%). Record the entry allocating the non-controlling interests\' share of net income to non-controlling interests.',
    e:[{d:[['非支配株主に帰属する当期純利益',100000]], c:[['非支配株主持分',100000]]}],
    exp:'子会社が稼いだ利益は、親会社の取り分だけでなく、非支配株主（他の株主）の取り分もあります。Ｓ社の当期純利益500,000円のうち、非支配株主の持分割合20％にあたる100,000円は、連結損益計算書上「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）を増やします。まるでグループ全体の利益をケーキのように切り分けて、それぞれの株主の皿に配るイメージです。「子会社の儲けのうち、親会社の分は親会社の利益剰余金へ、他の株主の分は非支配株主持分へ」と、取り分に応じて分けます。'
  },
  { id:738, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社、Ｐ社持分80％）が保有する<mark class="q-equity">その他有価証券に評価益50,000円が生じた</mark>（税効果は考慮しない）。連結上、この評価差額のうち非支配株主に帰属する部分を非支配株主持分に振り替える仕訳を示しなさい。',
    en_q:'Subsidiary S (80% owned by P) recognized a ¥50,000 unrealized gain on available-for-sale securities (ignore tax effects). Record the entry allocating the non-controlling interests\' share of this valuation gain to non-controlling interests.',
    e:[{d:[['その他有価証券評価差額金',10000]], c:[['非支配株主持分',10000]]}],
    exp:'子会社が保有する有価証券の評価差額（純資産直入項目）も、当期純利益と同じように、親会社と非支配株主で取り分を分ける必要があります。評価益50,000円のうち非支配株主の持分20％にあたる10,000円は、非支配株主持分（純資産）へ振り替えます。「損益計算書を通らない純資産の変動（評価差額など）も、当期純利益と同じ考え方で持分割合に応じて按分する」というのがポイントです。'
  },
  { id:739, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'前期末に資本連結仕訳（<mark class="q-equity">資本金400,000円・利益剰余金100,000円</mark>・<mark class="q-asset">のれん50,000円</mark>／<mark class="q-asset">Ｓ社株式450,000円</mark>・<mark class="q-equity">非支配株主持分100,000円</mark>）を行った。前期中、<mark class="q-asset">のれん償却5,000円</mark>・<mark class="q-equity">非支配株主に帰属する前期純利益15,000円</mark>が発生した。当期首の開始仕訳（前期末までの純資産の動きを反映したもの）を示しなさい。',
    en_q:'At the end of last period, a capital consolidation entry was recorded (capital ¥400,000, retained earnings ¥100,000, goodwill ¥50,000 / S shares ¥450,000, non-controlling interests ¥100,000). During last period, goodwill amortization of ¥5,000 and non-controlling interests\' share of last period\'s net income of ¥15,000 occurred. Record this period\'s opening entry, reflecting the cumulative effect through the end of last period.',
    e:[{d:[['資本金',400000],['利益剰余金当期首残高',120000],['のれん',45000]], c:[['S社株式',450000],['非支配株主持分',115000]]}],
    exp:'連結の仕訳は、個別財務諸表（Ｐ社・Ｓ社それぞれの帳簿）には一切記録されません。そのため、連結精算表を作るたびに「過去に行った連結修正を最初からもう一度全部やり直す」必要があります。これを「開始仕訳」と呼びます。まるで毎年新しい白紙のノートに、過去の記録をすべて書き写し直す作業のようなものです。前期末の資本連結仕訳をベースに、①のれん償却5,000円（費用なので利益剰余金を減らす）②非支配株主に帰属する前期純利益15,000円（非支配株主持分を増やす）の2つの累積効果を反映させます。過去分の損益の動きは、当期の損益計算書には出せないので、代わりに「利益剰余金当期首残高」という純資産の勘定にまとめて計上します：100,000＋5,000（のれん償却の累積）＋15,000（非支配株主帰属利益の累積）＝120,000円。のれんは償却済みの5,000円を差し引いて45,000円、非支配株主持分は15,000円増えて115,000円になります。'
  },

  // ===== 1級：企業結合・事業分離 =====
  { id:740, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、<mark class="q-equity">Ｓ社株主にＰ社株式100株（1株当たり時価8,000円）を交付した</mark>。合併により引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産2,000,000円</mark>・<mark class="q-liability">諸負債1,300,000円</mark>であった。合併の仕訳を示しなさい（増加する資本金は全額資本金とする）。',
    en_q:'Company P absorbed Company S in a merger, issuing 100 P shares (fair value ¥8,000 each) to S\'s shareholders. The fair values of S\'s assets and liabilities taken over were: assets ¥2,000,000, liabilities ¥1,300,000. Record the merger entry (the full increase is credited to Capital).',
    e:[{d:[['諸資産',2000000],['のれん',100000]], c:[['諸負債',1300000],['資本金',800000]]}],
    exp:'合併の会計処理（パーチェス法）は、Ｓ社を「時価で丸ごと買った」と考えて処理します。まるで老舗の店を看板ごと買収するイメージです。対価（取得原価）＝交付した株式の時価：100株×8,000円＝800,000円。引き継いだ純資産（時価）：諸資産2,000,000－諸負債1,300,000＝700,000円。対価800,000円の方が引き継いだ純資産700,000円より高いので、差額100,000円は「のれん」（ブランド力や将来の収益力に対して余分に払った分）として資産計上します。'
  },
  { id:741, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、<mark class="q-equity">Ｓ社株主にＰ社株式50株（1株当たり時価6,000円）を交付した</mark>。合併により引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産1,500,000円</mark>・<mark class="q-liability">諸負債1,000,000円</mark>であった。合併の仕訳を示しなさい。',
    en_q:'Company P absorbed Company S, issuing 50 P shares (fair value ¥6,000 each). Fair values taken over: assets ¥1,500,000, liabilities ¥1,000,000. Record the merger entry.',
    e:[{d:[['諸資産',1500000]], c:[['諸負債',1000000],['資本金',300000],['負ののれん発生益',200000]]}],
    exp:'対価（取得原価）：50株×6,000円＝300,000円。引き継いだ純資産（時価）：1,500,000－1,000,000＝500,000円。今回は対価300,000円より引き継いだ純資産500,000円の方が大きい、つまり「バーゲンセールでお買い得に買えた」状態です。この差額200,000円は「負ののれん発生益」として、その期の収益に一括計上します（のれんとは逆で、資産にはせず、すぐに利益にする点に注意）。'
  },
  { id:742, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社の発行済株式全部（100％）を取得し、完全親子会社関係を創設する株式交換を行った。対価としてＰ社株式を交付し、<mark class="q-asset">Ｓ社の時価純資産は900,000円であった</mark>。Ｐ社（完全親会社）の個別財務諸表上、Ｓ社株式の取得原価を計上する仕訳を示しなさい（資本金を全額計上する）。',
    en_q:'Company P acquired 100% of Company S\'s shares via a share exchange, creating a wholly-owned parent-subsidiary relationship, issuing P shares as consideration. S\'s fair value net assets were ¥900,000. On P\'s (the wholly-owning parent\'s) individual financial statements, record the entry recognizing the cost of the S shares (crediting the full amount to Capital).',
    e:[{d:[['S社株式',900000]], c:[['資本金',900000]]}],
    exp:'株式交換は、合併のように会社そのものが1つになるわけではなく、「Ｓ社の株を全部Ｐ社の株と交換して、Ｓ社をＰ社の100％子会社にする」手続きです。まるでグループ会社に迎え入れる養子縁組のようなイメージで、合併と違い、Ｓ社の資産・負債を直接Ｐ社の帳簿に受け入れるのではなく、Ｐ社の個別財務諸表上は「Ｓ社株式」という投資（資産）を計上するだけにとどまります。Ｓ社の資産・負債は、後で連結財務諸表を作るときに合算されます。'
  },
  { id:743, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社とＳ社は株式移転により、共同で新設完全親会社Ｈ社を設立した。Ｈ社の個別財務諸表上、<mark class="q-asset">Ｐ社株式（時価1,200,000円）とＳ社株式（時価800,000円）を取得原価として計上し</mark>、<mark class="q-equity">資本金を全額計上する</mark>仕訳を示しなさい。',
    en_q:'Companies P and S jointly established a new wholly-owning parent company H via a share transfer. On H\'s individual financial statements, record the entry recognizing the cost of the P shares (fair value ¥1,200,000) and S shares (fair value ¥800,000) received, crediting the full amount to Capital.',
    e:[{d:[['P社株式',1200000],['S社株式',800000]], c:[['資本金',2000000]]}],
    exp:'株式移転は、既存の会社（Ｐ社・Ｓ社）ではなく、まったく新しい会社（Ｈ社）を作って、その新会社の下にＰ社とＳ社を完全子会社としてぶら下げる手続きです。まるで2つの会社が結婚して、新しい「持株会社」という名字の下に入るようなイメージです。株式交換が「既存の会社同士」で行うのに対し、株式移転は「新会社を作る」点が違います。新設されたＨ社の個別財務諸表には、Ｐ社株式とＳ社株式という2つの投資（資産）が計上され、対応する金額が資本金になります。'
  },
  { id:744, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業部門（時価：<mark class="q-asset">資産1,500,000円</mark>・<mark class="q-liability">負債800,000円</mark>）を吸収分割によりＳ社へ移転し、対価として<mark class="q-asset">Ｓ社株式700,000円を受け取った</mark>。Ｐ社（分割会社）の仕訳を示しなさい。',
    en_q:'Company P transferred one of its business segments (fair value: assets ¥1,500,000, liabilities ¥800,000) to Company S via a company split, receiving S shares worth ¥700,000 as consideration. Record the entry on P\'s (the splitting company\'s) books.',
    e:[{d:[['諸負債',800000],['S社株式',700000]], c:[['諸資産',1500000]]}],
    exp:'会社分割は「事業（資産と負債のセット）を丸ごと他社へ渡す」手続きです。まるで会社の一部門をパッケージごと引っ越しさせるイメージで、渡す側（分割会社＝Ｐ社）は、移転する資産・負債を帳簿から取り除き、代わりに受け取った対価（Ｓ社株式）を計上します。移転する純資産（時価）：1,500,000－800,000＝700,000円。今回は対価700,000円とちょうど同額なので、差益・差損は生じません。'
  },
  { id:745, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｓ社は、Ｐ社の一事業部門（時価：<mark class="q-asset">資産1,500,000円</mark>・<mark class="q-liability">負債800,000円</mark>）を吸収分割により承継し、対価として<mark class="q-equity">Ｓ社株式700,000円をＰ社に交付した</mark>。Ｓ社（承継会社）の仕訳を示しなさい（増加する資本金は全額資本金とする）。',
    en_q:'Company S received a business segment from Company P (fair value: assets ¥1,500,000, liabilities ¥800,000) via a company split, issuing S shares worth ¥700,000 to P as consideration. Record the entry on S\'s (the receiving company\'s) books (the full increase is credited to Capital).',
    e:[{d:[['諸資産',1500000]], c:[['諸負債',800000],['資本金',700000]]}],
    exp:'前問の「渡す側」に対して、こちらは「受け取る側」（承継会社＝Ｓ社）の仕訳です。まるで引っ越してきた事業部門を新居に迎え入れるようなイメージで、受け入れた資産・負債をそのまま計上し、対価として交付した自社株式の分だけ資本金を増やします。合併の仕訳とよく似ていますが、合併は「会社そのもの」を丸ごと受け入れるのに対し、会社分割は「特定の事業だけ」を切り出して受け入れる点が違います。'
  },
  { id:746, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業（帳簿価額：<mark class="q-asset">資産2,000,000円</mark>・<mark class="q-liability">負債1,200,000円</mark>）を、Ｓ社へ事業譲渡し、対価として<mark class="q-asset">現金900,000円を受け取った</mark>。<mark class="q-revenue">事業譲渡益（または損）</mark>を含めた仕訳を示しなさい。',
    en_q:'Company P sold one of its businesses (book value: assets ¥2,000,000, liabilities ¥1,200,000) to Company S for ¥900,000 cash. Record the entry, including the gain (or loss) on the business sale.',
    e:[{d:[['諸負債',1200000],['現金',900000]], c:[['諸資産',2000000],['事業譲渡益',100000]]}],
    exp:'事業譲渡は、株式のやり取りではなく「現金など」を対価とする点が会社分割と違います（会社分割は原則株式が対価、事業譲渡は現金などの財産が対価）。まるで会社の一部門を丸ごと現金で売却するイメージです。譲渡する事業の帳簿価額（純資産）：2,000,000－1,200,000＝800,000円。受け取った現金900,000円との差額100,000円は「事業譲渡益」（収益）として計上します。'
  },
  { id:747, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｓ社はＰ社から一事業（時価：<mark class="q-asset">資産2,200,000円</mark>・<mark class="q-liability">負債1,200,000円</mark>）を事業譲受し、対価として<mark class="q-asset">現金900,000円を支払った</mark>。<mark class="q-revenue">負ののれん</mark>を含めた仕訳を示しなさい。',
    en_q:'Company S acquired a business from Company P (fair value: assets ¥2,200,000, liabilities ¥1,200,000), paying ¥900,000 cash as consideration. Record the entry, including any negative goodwill.',
    e:[{d:[['諸資産',2200000]], c:[['諸負債',1200000],['現金',900000],['負ののれん発生益',100000]]}],
    exp:'事業を譲り受ける側（Ｓ社）の仕訳です。受け入れる純資産（時価）：2,200,000－1,200,000＝1,000,000円。支払った対価は900,000円で、受け入れた純資産の方が100,000円多いので「お買い得」＝負ののれん発生益（収益）を計上します。事業譲渡・会社分割・合併のどれでも、「対価＜受け入れた純資産」なら負ののれん発生益、「対価＞受け入れた純資産」ならのれん、という判定方法は共通です。'
  },
  { id:748, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は完全子会社であるＳ社（帳簿価額：<mark class="q-asset">諸資産1,000,000円</mark>・<mark class="q-liability">諸負債600,000円</mark>）を吸収合併した。共通支配下の取引に該当するため、Ｓ社の資産・負債は帳簿価額で引き継ぐ。合併の仕訳を示しなさい（増加する資本金はゼロとし、<mark class="q-equity">差額はその他資本剰余金とする</mark>）。',
    en_q:'Company P absorbed its wholly-owned subsidiary S (book values: assets ¥1,000,000, liabilities ¥600,000) in a merger. As this is a transaction under common control, S\'s assets and liabilities are carried over at book value. Record the merger entry (no increase to Capital; the difference is credited to Other Capital Surplus).',
    e:[{d:[['諸資産',1000000]], c:[['諸負債',600000],['その他資本剰余金',400000]]}],
    exp:'すでに100％子会社になっている会社を合併する場合は「グループ内部の組織再編」に過ぎず、グループ外の視点では何も変わっていません（これを「共通支配下の取引」と言います）。まるで同じ家族の中で引っ越し作業をするようなもので、そのため、通常の合併のように時価評価をしたり、のれんを計算したりはせず、Ｓ社の資産・負債を帳簿価額のまま、そっくりそのままＰ社に移すだけです。差額（1,000,000－600,000＝400,000円）は「のれん」ではなく「その他資本剰余金」として処理します。「グループ内の引っ越しなので、儲け・損は発生しない」というイメージです。'
  },
  { id:749, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併するにあたり、<mark class="q-asset">新株の交付事務費用（印刷費・証券会社手数料等）80,000円を現金で支払った</mark>。株式交付費として計上する仕訳を示しなさい。',
    en_q:'In connection with absorbing Company S, Company P paid ¥80,000 cash for share-issuance administrative costs (printing, brokerage fees, etc.). Record the entry recognizing this as share issuance costs.',
    e:[{d:[['株式交付費',80000]], c:[['現金',80000]]}],
    exp:'合併や増資で新しく株式を発行するときにかかる事務費用（印刷代・証券会社への手数料など）は「株式交付費」という勘定で処理します。まるで結婚式の招待状印刷代のような事務コストです。似た名前の「取得関連費用」（弁護士・会計士への相談料）は必ずその場で費用にしますが、株式交付費は一定の要件のもとで資産計上して数年かけて償却することも認められています。「M&Aの相談料」と「株式発行の事務費用」は名前は似ていますが別物、と覚えておきましょう。'
  },
  { id:800, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併するにあたり、<mark class="q-expense">デューデリジェンス費用（弁護士・公認会計士への報酬）50,000円を</mark>、<mark class="q-asset">現金で支払った</mark>。取得関連費用の会計処理として、発生時に費用処理する仕訳を示しなさい。',
    en_q:'In connection with absorbing Company S, Company P paid ¥50,000 cash for due diligence fees (legal and accounting advisory fees). Record the entry expensing these acquisition-related costs as incurred.',
    e:[{d:[['支払手数料',50000]], c:[['現金',50000]]}],
    exp:'企業結合にかかる取得関連費用（デューデリジェンス費用、アドバイザリー報酬など）は、取得原価（のれんの計算に含める金額）には含めず、発生した期の費用として処理します。まるで家を買うときの不動産鑑定料や司法書士報酬のような手続きコストです。「のれんは買収対象そのものの価値に対して払った超過額であり、手続きにかかった事務コストとは性質が違う」という考え方です。前問（株式交付費）とは異なる勘定科目（支払手数料）を使う点に注意しましょう。'
  },
  { id:801, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、対価として<mark class="q-asset">現金600,000円</mark>に加え、Ｓ社の将来の業績目標達成を条件とする<mark class="q-liability">条件付取得対価（アーンアウト、公正価値50,000円）を計上した</mark>。引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産900,000円</mark>・<mark class="q-liability">諸負債300,000円</mark>であった。合併時の仕訳を示しなさい。',
    en_q:"Company P absorbed Company S, paying ¥600,000 cash plus recognizing a contingent consideration (earnout, fair value ¥50,000) payable if S meets future performance targets. Fair values taken over: assets ¥900,000, liabilities ¥300,000. Record the merger entry.",
    e:[{d:[['諸資産',900000],['のれん',50000]], c:[['諸負債',300000],['現金',600000],['条件付取得対価',50000]]}],
    exp:'条件付取得対価（アーンアウト条項）とは、「将来、業績目標を達成したら追加で対価を払う」という約束です。まるで成功報酬型のボーナス契約のようなもので、この将来の支払義務も、企業結合時点の公正価値（見積額）で負債として認識し、取得原価（のれんの計算のもと）に含めます。対価総額：現金600,000円＋条件付取得対価50,000円＝650,000円。引き継いだ純資産600,000円との差額50,000円がのれんです。'
  },
  { id:802, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'上記の<mark class="q-liability">条件付取得対価（当初の公正価値50,000円）について</mark>、測定期間内（企業結合日から1年以内）に新たな情報が判明し、<mark class="q-liability">公正価値の見積りを70,000円に修正した</mark>。差額20,000円を<mark class="q-asset">のれんの調整として処理する</mark>仕訳を示しなさい。',
    en_q:'For the contingent consideration above (initial fair value ¥50,000), new information came to light within the measurement period (within one year of the acquisition date), revising the fair value estimate to ¥70,000. Record the entry treating the ¥20,000 difference as an adjustment to goodwill.',
    e:[{d:[['のれん',20000]], c:[['条件付取得対価',20000]]}],
    exp:'企業結合日時点で入手可能だった情報に基づく見積りの修正が「測定期間」（原則1年以内）中に生じた場合、その修正はのれんの金額を直接調整します（過去に遡って、企業結合時点の見積りが違っていたと考えるイメージ）。まるで契約直後に価格交渉のやり直しが認められる猶予期間のようなもので、測定期間を過ぎてからの見積り変更は、のれんを調整せず、その期の損益として処理する点が対照的です（次問参照）。'
  },
  { id:803, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'上記の<mark class="q-liability">条件付取得対価（帳簿価額70,000円）について</mark>、測定期間経過後に業績目標の達成状況が確定し、<mark class="q-liability">実際の支払額が90,000円となった</mark>。差額20,000円を<mark class="q-expense">損益として処理する</mark>仕訳を示しなさい。',
    en_q:'For the contingent consideration above (book value ¥70,000), after the measurement period ended, the actual performance outcome was determined and the amount payable became ¥90,000. Record the entry recognizing the ¥20,000 difference in profit or loss.',
    e:[{d:[['条件付取得対価',70000],['取得対価精算損',20000]], c:[['未払金',90000]]}],
    exp:'測定期間を過ぎてから条件付取得対価の金額が確定・変動した場合は、企業結合時点の見積りをさかのぼって修正するのではなく、確定した期の「損益」として処理します。まるで契約後しばらく経ってから精算金額が変わった場合、もう最初の見積りには遡らず、その時点の損益として扱うイメージです。負債（条件付取得対価）70,000円を取り崩し、実際に支払うことになった90,000円との差額20,000円を費用（取得対価精算損）として計上します。'
  },
  { id:804, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業部門（帳簿価額：<mark class="q-asset">資産1,200,000円</mark>・<mark class="q-liability">負債500,000円</mark>）を新設分割により、新たに設立するＴ社へ移転した。<mark class="q-equity">Ｔ社の資本金は全額この移転による純資産額とする</mark>。Ｔ社（新設会社）側の仕訳を示しなさい。',
    en_q:'Company P transferred one of its business segments (book value: assets ¥1,200,000, liabilities ¥500,000) to newly-established Company T via a newly-formed company split. T\'s Capital equals the full net assets transferred. Record the entry on T\'s (the newly-formed company\'s) books.',
    e:[{d:[['諸資産',1200000]], c:[['諸負債',500000],['資本金',700000]]}],
    exp:'新設分割は、既存の会社（吸収分割の場合のＳ社）ではなく、新しく設立する会社に事業を移転する会社分割の方法です。まるで独立部門を切り出して新会社として起業させるようなイメージで、受け入れ側（新設されたＴ社）の処理は、吸収分割の承継会社の場合と基本的に同じで、引き継いだ資産・負債をそのまま計上し、対応する分を資本金として計上します。「既存の会社に事業を渡すか、新しい会社を作って渡すか」が吸収分割と新設分割の違いで、会計処理の基本パターンは共通です。'
  },
  { id:805, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'上記のＰ社（分割会社）は、新設分割により<mark class="q-asset">Ｔ社株式700,000円を受け取った</mark>。Ｐ社側の仕訳を示しなさい。',
    en_q:"For Company P (the splitting company) above, record the entry recognizing the ¥700,000 of T shares received as consideration for the newly-formed company split.",
    e:[{d:[['諸負債',500000],['T社株式',700000]], c:[['諸資産',1200000]]}],
    exp:'事業を渡す側（分割会社＝Ｐ社）は、移転した資産・負債を帳簿から取り除き、その対価として受け取った新設会社の株式（Ｔ社株式）を投資として計上します。吸収分割の分割会社の処理（すでに存在する会社に事業を渡すケース）とまったく同じ考え方で、渡す相手が「既存の会社」か「これから設立される新しい会社」かの違いだけです。諸負債500,000円＋Ｔ社株式700,000円＝諸資産1,200,000円で貸借が一致します。'
  },
  { id:806, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は他社と共同で、新会社（共同支配企業）Ｊ社を設立するにあたり、<mark class="q-asset">現金300,000円を出資した</mark>。Ｐ社の持分比率は40％で、重要な影響力を有するに留まる（支配は獲得しない）。持分法を適用する場合のＰ社の仕訳を示しなさい。',
    en_q:'Company P contributed ¥300,000 cash to jointly establish new company J (a jointly-controlled entity) with another company. P\'s ownership is 40%, giving it significant influence but not control. Record the entry under the equity method.',
    e:[{d:[['関係会社株式',300000]], c:[['現金',300000]]}],
    exp:'複数の会社が共同で支配する企業（共同支配企業、ジョイントベンチャー）は、単独では支配していないため、通常の子会社のように連結せず、「持分法」（投資の額を、相手の業績に応じて増減させる方法）を適用します。まるで複数の会社が共同出資で作った合弁会社のようなもので、出資時点では、単純に出資額を「関係会社株式」として計上するだけで、通常の子会社株式取得や合併のような、のれんの計算は行いません（持分法ではのれん相当額は投資額に含まれたまま個別に区分しません）。'
  },
  { id:807, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は、あらかじめ保有していたＳ社株式（帳簿価額200,000円）に加え、Ｓ社を吸収合併した。合併により交付した新株の時価は<mark class="q-equity">600,000円</mark>、引き継いだＳ社の<mark class="q-asset">資産（時価1,800,000円）</mark>・<mark class="q-liability">負債（時価1,050,000円）</mark>であった。①<mark class="q-asset">抱合せ株式の評価替え（帳簿価額200,000円→時価250,000円）</mark>②合併の仕訳（新株の時価600,000円＋評価後の<mark class="q-asset">抱合せ株式250,000円</mark>＝取得原価850,000円）をそれぞれ示しなさい。',
    en_q:"Company P absorbed Company S, having already held S shares (book value ¥200,000) before the merger. The fair value of newly-issued shares was ¥600,000; S's assets (fair value ¥1,800,000) and liabilities (fair value ¥1,050,000) were taken over. Record ①the revaluation of the pre-existing (\"tote-awase\") shares from book value ¥200,000 to fair value ¥250,000, and ②the merger entry (acquisition cost = new shares ¥600,000 + revalued pre-existing shares ¥250,000 = ¥850,000).",
    e:[{d:[['S社株式',50000]], c:[['抱合せ株式評価益',50000]]}, {d:[['諸資産',1800000],['のれん',100000]], c:[['諸負債',1050000],['資本金',600000],['S社株式',250000]]}],
    exp:'「抱合せ株式」とは、合併する前からすでに保有していた、合併される側（Ｓ社）の株式のことです。まるで結婚前からすでに交際していた相手と、正式に一緒になるようなイメージで、合併にあたっては、①まずこの抱合せ株式を合併時点の時価（250,000円）に評価替えし、帳簿価額との差額（50,000円）を「抱合せ株式評価益」として損益に計上します。②その上で、合併の取得原価は「新たに交付した株式の時価（600,000円）」＋「評価替え後の抱合せ株式（250,000円）」＝850,000円となります。これと引き継いだＳ社の時価純資産750,000円（1,800,000－1,050,000）との差額100,000円がのれんです。'
  },
  { id:808, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併した。合併対価は<mark class="q-asset">現金1,000,000円</mark>。引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産600,000円</mark>・<mark class="q-liability">諸負債200,000円</mark>に加え、新たに識別された<mark class="q-asset">顧客関連資産（無形資産）150,000円が認められた</mark>。合併の仕訳を示しなさい。',
    en_q:"Company P absorbed Company S for ¥1,000,000 cash. Fair values taken over were: assets ¥600,000, liabilities ¥200,000, plus a newly identified customer-related intangible asset of ¥150,000. Record the merger entry.",
    e:[{d:[['諸資産',600000],['顧客関連資産',150000],['のれん',450000]], c:[['諸負債',200000],['現金',1000000]]}],
    exp:'企業結合では、対象会社の資産・負債を時価評価して引き継ぎますが、その際、対象会社の個別財務諸表には計上されていなかった無形資産（顧客関連資産・商標権・技術関連資産など）が新たに識別されることがあります（PPA：Purchase Price Allocation、取得原価の配分）。まるで買収した会社の「見えない資産」を丁寧に棚卸しして値札をつけていくような作業です。今回は「顧客関連資産」150,000円が新たに認識されました。のれんは、対価1,000,000円から、識別可能純資産（諸資産600,000＋顧客関連資産150,000－諸負債200,000＝550,000円）を差し引いた450,000円です。識別可能な無形資産をきちんと分離して計上するほど、のれん（正体不明の超過収益力）の金額は小さくなる、という関係を理解しておきましょう。'
  },
  { id:809, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はすでにＳ社株式60％を保有していたが、残り40％の少数株主から株式交換によりＳ社を完全子会社化した。<mark class="q-asset">交付したＰ社株式の時価は400,000円であった</mark>。会社法の規定により、<mark class="q-equity">増加する払込資本のうち半額を資本金、残り半額を資本準備金とする</mark>場合のＰ社個別財務諸表上の仕訳を示しなさい。',
    en_q:'Company P already held 60% of Company S, and acquired the remaining 40% from minority shareholders via a share exchange to make S a wholly-owned subsidiary. The fair value of P shares issued was ¥400,000. Under the Companies Act, half of the increase in paid-in capital is credited to Capital and half to Capital Surplus. Record the entry on P\'s individual financial statements.',
    e:[{d:[['S社株式',400000]], c:[['資本金',200000],['資本準備金',200000]]}],
    exp:'すでに子会社化している会社の残りの株式（非支配株主の持分）を株式交換で取得するケースです。まるでグループ会社の残り株を最後まで買い集めて完全子会社化するイメージで、個別財務諸表上は、通常の株式交換と同じく「Ｓ社株式」という投資を追加取得したものとして計上します。会社法上、新株発行の対価は全額を資本金にする必要はなく、その一部（最大半額）を「資本準備金」とすることができます。今回は半分ずつとする指示なので、400,000円を200,000円ずつ資本金と資本準備金に計上します。'
  },

  // ===== 1級：金融商品会計（デリバティブ・ヘッジ会計） =====
  { id:750, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は国債先物の取引を行うため、<mark class="q-asset">証券会社に先物取引差入証拠金50,000円を現金で差し入れた</mark>。この取引の仕訳を示しなさい。',
    en_q:'Company X deposited ¥50,000 cash with a securities firm as a margin deposit (先物取引差入証拠金) to trade government bond futures. Record this entry.',
    e:[{d:[['先物取引差入証拠金',50000]], c:[['現金',50000]]}],
    exp:'先物取引は「将来の一定時点で、あらかじめ決めた価格で売買する」契約です。実際に売買するまでの間、証券会社に担保として証拠金を預けます。まるでスポーツジムの入会時に預ける保証金のようなもので、証拠金はまだ損益が確定したわけではなく、後で返ってくる「預け金」的な性質なので、資産の勘定科目（先物取引差入証拠金）として計上します。「保証金を預けて取引の枠を確保している状態」とイメージすると分かりやすいです。'
  },
  { id:751, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は保有する国債先物について、決算日に時価評価を行ったところ、<mark class="q-asset">契約時と比べて50,000円値上がりしていることが判明した</mark>。決算時の評価替えの仕訳を示しなさい。',
    en_q:'At fiscal year-end, Company X marked its government bond futures position to market and found the value had risen ¥50,000 since the contract date. Record the year-end revaluation entry.',
    e:[{d:[['先物取引差金',50000]], c:[['先物損益',50000]]}],
    exp:'デリバティブ（先物・オプション・スワップなど）は原則として「時価評価」が強制され、評価差額はその期の損益として即座に計上します（これは他の有価証券と大きく違う点です）。まるでFXの含み損益をリアルタイムでチェックするようなもので、値上がり分は「先物取引差金」という資産（未収の含み益）を計上し、相手科目として「先物損益」という収益（デリバティブ評価損益）を計上します。'
  },
  { id:752, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'<mark class="q-asset">Ｘ社はコール・オプションを30,000円で購入し、代金を現金で支払った</mark>。オプション取得時の仕訳を示しなさい。',
    en_q:'Company X purchased a call option for ¥30,000 cash. Record the entry at the time of acquiring the option.',
    e:[{d:[['オプション資産',30000]], c:[['現金',30000]]}],
    exp:'オプション（権利）を買うために支払った金額（オプション料）は、「その権利を将来行使できる」という価値を持つ資産なので、「オプション資産」として計上します。まるで「後で好きなタイミングでこの値段で買える券」を買うようなもので、まだ権利を行使していない段階では、実際に株式などを売買したわけではないので、損益は一切発生しません。「権利そのものにお金を払って買った」という状態です。'
  },
  { id:753, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社が保有するオプション（取得原価30,000円）について、<mark class="q-asset">決算日の時価は45,000円であった</mark>。決算時の評価替えの仕訳を示しなさい。',
    en_q:"Company X's option (cost ¥30,000) had a fair value of ¥45,000 at fiscal year-end. Record the year-end revaluation entry.",
    e:[{d:[['オプション資産',15000]], c:[['オプション差損益',15000]]}],
    exp:'オプションも先物と同様、決算日には時価評価が必要です。時価（45,000円）と帳簿価額（30,000円）との差額15,000円だけ「オプション資産」を増額し、相手科目として評価損益（オプション差損益）を計上します。値下がりしていれば逆に評価損を計上します。デリバティブは原則として決算日ごとに時価評価が強制される点が、他の資産と大きく異なります。'
  },
  { id:754, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は将来の外貨建取引に備えて為替予約（ヘッジ手段）を締結し、繰延ヘッジ会計を適用している。決算日において、<mark class="q-asset">この為替予約の時価評価益が30,000円生じた</mark>。税効果を考慮しない場合の仕訳を示しなさい。',
    en_q:"Company X entered into a forward foreign exchange contract as a hedge for a future foreign-currency transaction and applies deferred hedge accounting. At fiscal year-end, the forward contract's fair value gain was ¥30,000. Record the entry, ignoring tax effects.",
    e:[{d:[['為替予約',30000]], c:[['繰延ヘッジ損益',30000]]}],
    exp:'「繰延ヘッジ会計」とは、ヘッジ手段（為替予約など）の評価損益を、対象となる取引（ヘッジ対象）が実際に発生するまで損益計算書に出さず、純資産の部（その他包括利益）に一旦保留しておく方法です。まるで保険金を受け取っても、実際の事故が確定するまで金庫にしまっておくようなイメージで、評価益が出ても「収益」にはせず、「繰延ヘッジ損益」という純資産の科目に振り替えます。ヘッジ対象の取引が実際に発生した時点で、初めて損益として実現させます。'
  },
  { id:755, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は上記と同様の為替予約について繰延ヘッジ会計を適用しており、<mark class="q-asset">決算日の時価評価益は30,000円であった</mark>。<mark class="q-liability">実効税率30％として税効果会計を適用した場合</mark>の仕訳を示しなさい。',
    en_q:'For the same forward contract under deferred hedge accounting, the fair value gain at fiscal year-end was ¥30,000. Record the entry applying tax-effect accounting at an effective tax rate of 30%.',
    e:[{d:[['為替予約',30000]], c:[['繰延税金負債',9000],['繰延ヘッジ損益',21000]]}],
    exp:'繰延ヘッジ損益は純資産に計上される項目ですが、この評価益は将来課税対象になる（税金を増やす）含み益なので、税効果会計を適用して「繰延税金負債」（将来支払う税金）を認識します。評価益30,000円のうち、税金相当額9,000円（30,000×30％）を繰延税金負債として差し引き、残り21,000円を税引後の金額として繰延ヘッジ損益（純資産）に計上します。'
  },
  { id:756, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社はその他有価証券（帳簿価額200,000円）について、時価下落リスクをヘッジするためデリバティブ取引を行い、時価ヘッジ会計を適用している。決算日において、<mark class="q-expense">その他有価証券の時価が40,000円下落し</mark>、<mark class="q-revenue">ヘッジ手段であるデリバティブの評価益が40,000円生じた</mark>。①その他有価証券の評価替えと②デリバティブの評価替えの仕訳をそれぞれ示しなさい。',
    en_q:"Company X applies fair value hedge accounting to hedge the price-decline risk of available-for-sale securities (book value ¥200,000) using a derivative. At fiscal year-end, the securities' fair value fell by ¥40,000 while the hedging derivative recorded a ¥40,000 valuation gain. Record (1) the securities revaluation and (2) the derivative revaluation.",
    e:[{d:[['投資有価証券評価損',40000]], c:[['その他有価証券',40000]]}, {d:[['デリバティブ資産',40000]], c:[['有価証券評価益',40000]]}],
    exp:'「時価ヘッジ会計」は繰延ヘッジと違い、ヘッジ対象（その他有価証券）の評価損益も、ヘッジ手段（デリバティブ）の評価損益も、両方ともその期の損益として計上する方法です。その他有価証券の評価差額は通常「純資産直入」ですが、時価ヘッジを適用すると例外的に損益計算書を通します。まるでシーソーの両端に損益を置いて釣り合わせるように、値下がり損40,000円と、デリバティブの値上がり益40,000円が同時に計上されるため、両者が相殺され、ヘッジの効果（リスクを打ち消す）が損益計算書上でも見える化されます。'
  },
  { id:757, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は満期保有目的で他社社債（額面2,000,000円、額面より安く取得）を保有している。<mark class="q-asset">当期のクーポン利息の受取額は20,000円であり</mark>、<mark class="q-asset">実効利子率法によって計算された金利調整差額（取得差額）の償却額は8,500円であった</mark>。利息法による当期の有価証券利息計上の仕訳を示しなさい。',
    en_q:"Company X holds another company's bonds (face value ¥2,000,000, acquired below face value) as held-to-maturity securities. This period's coupon interest received was ¥20,000, and the amortization of the acquisition discount computed under the effective interest method was ¥8,500. Record this period's bond interest entry using the effective interest method.",
    e:[{d:[['現金',20000],['満期保有目的債券',8500]], c:[['有価証券利息',28500]]}],
    exp:'満期保有目的の債券を額面より安く取得した場合、その差額（金利調整差額）は「実質的な利息」の一部とみなされ、満期までの期間にわたって毎期コツコツ償却（帳簿価額に加算）していきます（＝利息法）。クーポン利息20,000円に加えて、償却額8,500円も「有価証券利息」という収益に含めます。償却した分は現金では受け取っていないため、相手科目は現金ではなく「満期保有目的債券」（帳簿価額を増やす）になります。'
  },
  { id:758, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は取引先Ｙ社に対する貸付金1,000,000円について、Ｙ社の財政状態が著しく悪化したため、<mark class="q-expense">貸倒懸念先として個別に将来キャッシュ・フローを見積り、貸倒引当金150,000円を計上することとした</mark>。決算時の仕訳を示しなさい。',
    en_q:"Company X holds a ¥1,000,000 loan receivable from Company Y. Because Y's financial condition has significantly deteriorated, X classifies it as a doubtful claim, estimates future cash flows individually, and recognizes an allowance for doubtful accounts of ¥150,000. Record the year-end entry.",
    e:[{d:[['貸倒引当金繰入',150000]], c:[['貸倒引当金',150000]]}],
    exp:'金融商品会計基準では、金銭債権を「一般債権」「貸倒懸念債権」「破産更生債権等」の3区分に分けて評価します。貸倒懸念先（経営破綻はしていないが返済に重大な問題がある先）については、まるで危険水準に入った患者を個別に検査するように、個別に将来キャッシュ・フローを見積り、その現在価値と債権額との差額を貸倒引当金として計上します（キャッシュ・フロー見積法）。費用側は「貸倒引当金繰入」、資産のマイナスとして「貸倒引当金」を計上します。'
  },
  { id:759, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は転換社債型新株予約権付社債（額面1,000,000円）を発行し、<mark class="q-asset">払込金額1,000,000円を現金で受け取った</mark>。区分法により、<mark class="q-liability">社債の対価部分950,000円</mark>・<mark class="q-equity">新株予約権の対価部分50,000円に区分して処理する</mark>。発行時の仕訳を示しなさい。',
    en_q:'Company X issued convertible bonds with warrants (face value ¥1,000,000) and received ¥1,000,000 in cash. Under the split method, ¥950,000 is allocated to the bond (liability) component and ¥50,000 to the warrant (equity) component. Record the issuance entry.',
    e:[{d:[['現金',1000000]], c:[['社債',950000],['新株予約権',50000]]}],
    exp:'転換社債型新株予約権付社債は「社債（負債）」と「新株予約権（将来株式に転換できる権利＝純資産）」がセットになった複合金融商品です。まるで「借金」と「将来の株主になれる権利」がひとまとめになったハイブリッド商品のようなもので、「区分法」では、払込金額を合理的な基準で社債部分と新株予約権部分に分けて、それぞれ別の勘定科目（負債と純資産）で計上します（両方をまとめて「社債」で計上する「一括法」という方法もあります）。'
  },
  { id:760, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は上記の転換社債型新株予約権付社債（<mark class="q-liability">社債部分の帳簿価額950,000円</mark>・<mark class="q-equity">新株予約権50,000円</mark>）について、社債権者からの請求により全額が株式に転換された。<mark class="q-equity">増加する資本金は全額とする</mark>場合の仕訳を示しなさい。',
    en_q:'The bondholder exercised the conversion right on the entire convertible bond above (bond component book value ¥950,000, warrants ¥50,000). Record the conversion entry, assuming the full amount is credited to Common Stock.',
    e:[{d:[['社債',950000],['新株予約権',50000]], c:[['資本金',1000000]]}],
