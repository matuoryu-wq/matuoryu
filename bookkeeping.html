function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category !== 'industrial';
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else if(tab === 'level3' || tab === 'level2') typeMatch = category !== 'industrial';
    else typeMatch = (type === tab && category !== 'industrial');

    if(!typeMatch){ sec.style.display = 'none'; return; }

    if(tab === 'level3' || tab === 'level2'){
      const targetLevel = tab === 'level3' ? '3' : '2';
      let anyVisible = false;
      sec.querySelectorAll('.apx-row').forEach(row => {
        const match = row.dataset.level === targetLevel;
        row.classList.toggle('hidden', !match);
        if(match) anyVisible = true;
      });
      sec.style.display = anyVisible ? '' : 'none';
    } else {
      sec.style.display = '';
      sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
    }
  });
}

// ===================== 一問一答モード =====================
let qaAllItems = null;
let qaActive   = [];
let qaIdx      = 0;
let qaRevealed = false;
let qaKnown    = new Set();
let qaFilter   = 'all';

const QA_TYPE_LABEL = {asset:'資産',liability:'負債',expense:'費用',revenue:'収益',equity:'純資産',other:'その他'};

// 答えの単語を問題文から伏せる
function qaMask(html, term){
  if(!term) return html;
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return html.replace(new RegExp(esc,'g'),'<span class="qa-mask">▓▓▓</span>');
}

// （...）を薄くする
function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

// HTMLタグを除いた表示用テキストを抽出（問題文のプレビュー用）
function qaStripTags(html){ return html.replace(/<[^>]+>/g,''); }

function buildQAAllItems(){
  const items = [];
  const typeLabel = QA_TYPE_LABEL;

  // 商業簿記 勘定科目：説明文が問い、科目名が答え
  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name]||'other';
    items.push({
      src:'acct', type, lv:lv||3,
      hint: typeLabel[type]+'科目',
      hintCls: type,
      q: qaMask(note, name),
      q_en: note_en ? qaMask(note_en, en) : '',
      ans: name,
      ans_en: en,
    });
  });

  // 工業簿記 勘定科目
  const IND_ACCT_TYPE = {
    '材料・在庫':   '資産科目（流動資産）',
    '労務費':       '費用（製造直接費 / 間接費）',
    '製造間接費':   '費用（製造間接費）',
    '原価差異':     '差異勘定　不利差異→借方 / 有利差異→貸方',
    '本社・工場':   '内部取引勘定（合算時に消去）',
  };
  INDUSTRIAL_DATA.forEach(([name, en, note, subcat, note_en]) => {
    items.push({
      src:'industrial', type:'industrial', subcat,
      hint: subcat,
      hintCls: 'industrial',
      acctType: IND_ACCT_TYPE[subcat] || '',
      q: qaMask(note, name),
      q_en: note_en ? qaMask(note_en, en) : '',
      ans: name,
      ans_en: en,
    });
  });

  // 用語集：定義が問い、用語名が答え
  GLOSSARY_DATA.forEach(({category, items:gi}, catIdx) => {
    gi.forEach(({term, en, def, def_en}) => {
      items.push({
        src:'gloss', type:'gloss', cat:category, catIdx,
        hint: category,
        hintCls: 'gloss',
        q: qaMask(def, term),
        q_en: def_en ? qaMask(def_en, en) : '',
        ans: term,
        ans_en: en,
      });
    });
  });

  return items;
}

function getQAFiltered(){
  if(!qaAllItems) qaAllItems = buildQAAllItems();
  if(qaFilter==='all')         return [...qaAllItems];
  if(qaFilter==='asset3')      return qaAllItems.filter(i=>i.src==='acct' && i.type==='asset'    && i.lv===3);
  if(qaFilter==='asset2')      return qaAllItems.filter(i=>i.src==='acct' && i.type==='asset'    && i.lv===2);
  if(qaFilter==='liability')   return qaAllItems.filter(i=>i.src==='acct' && i.type==='liability');
  if(qaFilter==='expense3')    return qaAllItems.filter(i=>i.src==='acct' && i.type==='expense'  && i.lv===3);
  if(qaFilter==='expense2')    return qaAllItems.filter(i=>i.src==='acct' && i.type==='expense'  && i.lv===2);
  if(qaFilter==='revenue')     return qaAllItems.filter(i=>i.src==='acct' && i.type==='revenue');
  if(qaFilter==='equity')      return qaAllItems.filter(i=>i.src==='acct' && i.type==='equity');
  if(qaFilter==='industrial')  return qaAllItems.filter(i=>i.src==='industrial');
  if(qaFilter==='gloss-basic') return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx<=3);
  if(qaFilter==='gloss-comm')  return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx>=4 && i.catIdx<=13);
  if(qaFilter==='gloss-ind')   return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx===14);
  if(qaFilter==='gloss-adv')   return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx>=15);
  return [...qaAllItems];
}

function showQA(){
  if(!qaAllItems) qaAllItems = buildQAAllItems();
  qaFilter='all'; qaIdx=0; qaRevealed=false; qaKnown=new Set();
  qaActive = getQAFiltered();
  document.querySelectorAll('#qa-tabs .qa-tab').forEach(t=>t.classList.toggle('active',t.dataset.f==='all'));
  document.getElementById('qa-overlay').classList.add('show');
  renderQABody();
}

function closeQA(){ document.getElementById('qa-overlay').classList.remove('show'); }

function setQAFilter(f){
  qaFilter=f; qaIdx=0; qaRevealed=false; qaKnown=new Set();
  qaActive = getQAFiltered();
  document.querySelectorAll('#qa-tabs .qa-tab').forEach(t=>t.classList.toggle('active',t.dataset.f===f));
  renderQABody();
}

function renderQABody(){
  const body  = document.getElementById('qa-body');
  const total = qaActive.length;
  const prog  = total ? Math.round((qaIdx+1)/total*100) : 0;
  document.getElementById('qa-prog-text').textContent = total ? `${qaIdx+1} / ${total}` : '0 / 0';
  document.getElementById('qa-prog-fill').style.width  = prog+'%';

  if(!total){ body.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px">問題がありません</p>'; return; }

  if(qaIdx >= total){
    body.innerHTML = buildQADone(total);
    return;
  }

  const item = qaActive[qaIdx];
  const knownCount = qaKnown.size;

  // 問題文のサフィックス（何を答えるかを示す）
  const suffix = item.src==='acct'       ? 'この<b>勘定科目</b>は何？'
               : item.src==='industrial' ? 'この<b>工業簿記の科目</b>は何？'
               :                           'この<b>簿記用語</b>は何？';

  const acctTypeLine = (item.src==='industrial' && item.acctType)
    ? `<div class="qa-ans-type">${item.acctType}</div>` : '';

  const ansHtml = qaRevealed ? `
    <div class="qa-ans-area">
      <div class="qa-ans-label">答え</div>
      <div class="qa-ans-text">${item.ans}</div>
      <div class="qa-ans-en">${item.ans_en}</div>
      ${acctTypeLine}
    </div>
    <div class="qa-judge-row">
      <button class="qa-judge-btn qa-again-btn" onclick="qaJudge(false)">↩ もう一度</button>
      <button class="qa-judge-btn qa-known-btn" onclick="qaJudge(true)">✓ 知ってた!</button>
    </div>` : `
    <button class="qa-reveal-btn" onclick="qaReveal()">▼ 答えを確認する</button>`;

  body.innerHTML = `
    <div class="qa-q-card">
      <div class="qa-q-meta">
        <span class="qa-q-badge ${item.hintCls}">${item.hint}</span>
        ${item.lv===2?'<span class="qa-q-badge cat">2級</span>':''}
      </div>
      <div class="qa-q-text">${styleParens(addQBreaks(item.q))}<span class="qa-q-suffix">${suffix}</span></div>
      ${item.q_en ? `<div class="qa-q-en">${item.q_en}</div>` : ''}
    </div>
    ${ansHtml}
    <div class="qa-nav-row">
      <button class="qa-nav-btn" onclick="qaPrev()" ${qaIdx===0?'disabled':''}>← 前</button>
      <span class="qa-known-count">✓ 済み ${knownCount}問</span>
      <button class="qa-nav-btn" onclick="qaSkip()">スキップ →</button>
    </div>`;
}

function qaReveal(){
  qaRevealed = true;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 999;
}

function qaJudge(known){
  if(known) qaKnown.add(qaIdx);
  qaIdx++; qaRevealed=false;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 0;
}

function qaSkip(){
  qaIdx++; qaRevealed=false;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 0;
}

function qaPrev(){
  if(qaIdx>0){ qaIdx--; qaRevealed=false; renderQABody(); document.getElementById('qa-body').scrollTop=0; }
}

function buildQADone(total){
  const k = qaKnown.size;
  const pct = Math.round(k/total*100);
  return `<div class="qa-done-card">
    <div class="qa-done-emoji">${pct>=80?'🎉':pct>=50?'😊':'📚'}</div>
    <div class="qa-done-title">${pct>=80?'素晴らしい！':pct>=50?'いい調子！':'もう一度挑戦！'}</div>
    <div class="qa-done-sub">${total}問中 ${k}問 知ってた！（${pct}%）</div>
    <button class="qa-restart-btn" onclick="qaRestart()">もう一度最初から</button>
  </div>`;
}

function qaRestart(){
  qaIdx=0; qaRevealed=false; qaKnown=new Set();
  renderQABody();
  document.getElementById('qa-body').scrollTop=0;
}

  { id:94, cat:'帳簿・精算表',

  { id:95, cat:'帳簿・精算表',
    q:'雑貨店（A社）の損益計算書（P/L）を作成し、売上総利益と当期純利益を求めよ。\n・売上（雑貨の売上合計）：800円\n・期首商品（4月1日時点の雑貨在庫）：120円\n・当期仕入（今期仕入れた雑貨の原価）：500円\n・期末商品（3月31日時点の売れ残り雑貨）：130円\n・給料（店員の人件費）：280円',
    q_en:'Given sales ¥800, beginning inventory ¥120, purchases ¥500, ending inventory ¥130, and salaries ¥280, prepare an income statement (P/L) and calculate gross profit and net income.',
    ans_html: `<div class="tbl-sec">損益計算書（P/L）　単位：円</div><table><tbody><tr><td>売上高</td><td></td><td class="hl">800</td></tr><tr><td>　期首商品棚卸高</td><td>120</td><td></td></tr><tr><td>　当期商品仕入高</td><td>500</td><td></td></tr><tr><td>　合計</td><td>620</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>(130)</td><td></td></tr><tr><td>　売上原価</td><td></td><td>(490)</td></tr><tr class="total-row"><td class="hl">売上総利益（粗利益）</td><td></td><td class="hl">310</td></tr><tr><td>　給料</td><td></td><td>(280)</td></tr><tr class="total-row"><td class="hl">当期純利益</td><td></td><td class="hl">30</td></tr></tbody></table><div class="formula-box">売上総利益＝売上高－売上原価　　当期純利益＝売上総利益－販管費合計</div>`,
    exp:'損益計算書は「今年1年の稼ぎと出費のまとめ表」です。売上から商品の仕入れ代（売上原価）を引いた残りが「売上総利益（粗利き）」。そこから給料などを引いた残りが「当期純利益（最終的な利益）」です。売上原価は「しくりくりし（期首商品＋仕入−期末商品）」で計算します。' ,
    exp_en:'An income statement summarizes a year\'s revenues and costs. Gross profit = sales − COGS. Net income = gross profit − operating expenses. COGS = beginning inventory + purchases − ending inventory (the "shikuri-kurishiwa" formula).',
    steps:[

      {label:'当期純利益', hint:'売上総利益310 − 給料280', ans:30, unit:'円', choices:[30,20,50,40]}
    ]
  },

  },

  { id:97, cat:'帳簿・精算表',
    q:'りんごの商品有高帳（先入先出法・FIFO＝古い仕入れから順に払い出す）：\n4/1 前月繰越：りんご10個（@100円、計1,000円）\n4/5 仕入：りんご20個（@130円、計2,600円）\n4/10 売上：りんご20個を販売\n払出金額（売上原価）と期末残高を求めよ。',
    q_en:'Merchandise inventory ledger (FIFO method): Opening 10 units @¥100 (¥1,000); 4/5 purchase 20 units @¥130 (¥2,600); 4/10 sold 20 units. Calculate cost of goods sold and ending balance.',
    ans_html: `<div class="tbl-sec">商品有高帳（先入先出法・FIFO）　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>受入<br>単価</th><th>受入<br>数量</th><th>受入<br>金額</th><th>払出<br>単価</th><th>払出<br>数量</th><th>払出<br>金額</th><th>残高<br>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>@100</td><td>10</td><td>1,000</td><td></td><td></td><td></td><td>1,000</td></tr><tr><td>4/5</td><td>仕入</td><td>@130</td><td>20</td><td>2,600</td><td></td><td></td><td></td><td>3,600</td></tr><tr><td>4/10</td><td>売上</td><td></td><td></td><td></td><td>@100</td><td>10</td><td>1,000</td><td></td></tr><tr><td></td><td>（続）</td><td></td><td></td><td></td><td>@130</td><td>10</td><td>1,300</td><td class="hl">1,300</td></tr><tr class="total-row"><td colspan="3">払出合計</td><td></td><td></td><td colspan="2">20個</td><td class="hl">2,300</td><td></td></tr></tbody></table><div class="formula-box">先入先出法：古い仕入（@100）から順に払い出す。期末残高は最新仕入単価（@130×10個）で構成される。</div>`,
    exp:'「古い商品から先に売れた」と考える計算方法です。先に仕入れた@100円の10個から売り、足りない分は後から仕入れた@130円から売るとします。20個売れたら（@100×10）＋（@130×10）＝2,300円が売上原価。残る10個は一番新しい@130円で評価されます。' ,
    exp_en:'FIFO (first-in, first-out) assumes the oldest inventory is sold first. 20 units sold: 10 @¥100 + 10 @¥130 = ¥2,300 COGS. Remaining 10 units are valued at the latest purchase price @¥130, giving ending balance ¥1,300.',
    steps:[
      {label:'払出金額（売上原価）', hint:'先入先出：古い仕入分から順に払い出す', ans:2300, unit:'円', choices:[2300,2600,2000,1300]},
      {label:'期末残高', hint:'残数 × 最終仕入単価（FIFO：最後に仕入れた単価）', ans:1300, unit:'円', choices:[1300,2600,1000,1500]}
    ]
  },

  { id:98, cat:'帳簿・精算表',
    q:'りんごの商品有高帳（移動平均法＝仕入れのたびに平均単価を計算し直す）：\n4/1 前月繰越：りんご10個（@100円、計1,000円）\n4/5 仕入：りんご20個（@130円、計2,600円）\n4/10 売上：りんご20個を販売\n払出金額（売上原価）と期末残高を求めよ。',
    q_en:'Merchandise inventory ledger (moving average method): Opening 10 units @¥100 (¥1,000); 4/5 purchase 20 units @¥130 (¥2,600); 4/10 sold 20 units. Calculate cost of goods sold and ending balance.',
    ans_html: `<div class="tbl-sec">商品有高帳（移動平均法）　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>受入<br>単価</th><th>受入<br>数量</th><th>受入<br>金額</th><th>払出<br>単価</th><th>払出<br>数量</th><th>払出<br>金額</th><th>残高<br>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>@100</td><td>10</td><td>1,000</td><td></td><td></td><td></td><td>1,000</td></tr><tr><td>4/5</td><td>仕入</td><td>@130</td><td>20</td><td>2,600</td><td></td><td></td><td></td><td class="hl">3,600</td></tr><tr><td></td><td>→平均単価</td><td class="hl" colspan="3">（1,000＋2,600）÷（10＋20）＝@120</td><td></td><td></td><td></td><td></td></tr><tr><td>4/10</td><td>売上</td><td></td><td></td><td></td><td class="hl">@120</td><td>20</td><td class="hl">2,400</td><td class="hl">1,200</td></tr></tbody></table><div class="formula-box">移動平均法：仕入れのたびに（残高金額＋受入金額）÷（残高数量＋受入数量）で平均単価を再計算する。</div>`,
    exp:'仕入れるたびに「1個あたりの平均値段」を計算し直す方法です。古い在庫と新しい仕入れを混ぜて割り算します。今回は（1,000円＋2,600円）÷30個＝@120円が新しい平均単価。20個売れたら@120×20＝2,400円が売上原価、残り10個は@120×10＝1,200円です。先入先出法（1,300円）と比べると期末在庫の評価が変わります。' ,
    exp_en:'The moving average method recalculates average cost per unit each time goods are purchased. New average: (¥1,000 + ¥2,600) ÷ 30 = @¥120. 20 units sold: @¥120 × 20 = ¥2,400. Ending balance: @¥120 × 10 = ¥1,200. Compare with FIFO (¥1,300) — same goods, different valuations.',
    steps:[
      {label:'移動平均単価', hint:'移動平均：(在庫金額 ＋ 仕入金額) ÷ (在庫数量 ＋ 仕入数量)', ans:120, unit:'円/個', choices:[120,100,130,110]},
      {label:'払出金額', hint:'払出数量 × 移動平均単価', ans:2400, unit:'円', choices:[2400,2300,2600,2000]},
      {label:'期末残高', hint:'残数 × 移動平均単価', ans:1200, unit:'円', choices:[1200,1300,1000,1500]}
    ]
  },

  { id:99, cat:'帳簿・精算表',
    q:'帳簿の種類について、（　）に当てはまる言葉を答えよ。どの会社も必ず作る帳簿を【①】といい、「仕訳帳」と「総勘定元帳」からなる。特定の内容を詳しく記録する帳簿を【②】といい、現金出納帳・得意先元帳などがある。',
    q_en:'The mandatory books every company must maintain are called [①___], consisting of the journal and general ledger. Books recording specific items in detail are called [②___]. Fill in the blanks.',
    ans_html: `<div class="tbl-sec">帳簿の分類</div><table><thead><tr><th>区分</th><th>帳簿名</th><th>役割</th></tr></thead><tbody><tr><td rowspan="2" class="hl">主要簿<br>（必須）</td><td>仕訳帳</td><td>すべての取引を日付順に仕訳記入</td></tr><tr><td>総勘定元帳</td><td>勘定科目ごとに分類・残高管理</td></tr><tr><td rowspan="5" class="hl">補助簿<br>（必要に応じ）</td><td>現金出納帳</td><td>現金の入出金があるとき</td></tr><tr><td>売掛金元帳（得意先元帳）</td><td>売掛金の増減があるとき（取引先別）</td></tr><tr><td>買掛金元帳（仕入先元帳）</td><td>買掛金の増減があるとき（仕入先別）</td></tr><tr><td>商品有高帳</td><td>商品の受入・払出があるとき</td></tr><tr><td>固定資産台帳</td><td>固定資産の取得・除却があるとき</td></tr></tbody></table><div class="tbl-sec">その他の主な補助簿</div><table><thead><tr><th>補助簿</th><th>記入タイミング</th></tr></thead><tbody><tr><td class="hl">当座預金出納帳</td><td>当座預金の入出金があるとき</td></tr><tr><td class="hl">売上帳・仕入帳</td><td>売上・仕入取引があるとき</td></tr><tr><td class="hl">受取手形記入帳</td><td>受取手形の取得・消滅があるとき</td></tr><tr><td class="hl">支払手形記入帳</td><td>支払手形の振出・消滅があるとき</td></tr></tbody></table>`,
    exp:'帳簿には2種類あります。①主要簿：全ての取引を日記みたいに書く「仕訳帳」と、科目ごとに集計する「総勘定元帳」です（どの会社も必ず作ります）。②補助簿：現金だけの帳簿や、お客さんごとの明細帳など、特定のことを詳しく記録する帳簿です（必要な分だけ作ります）。' ,
    exp_en:'There are two types of accounting books. ① Main books (mandatory): the journal (records all transactions chronologically) and the general ledger (classifies by account). ② Subsidiary books (as needed): specific records like the cash book or customer receivables ledger.',
    steps:[
      {label:'①どの会社も必ず作る帳簿', hint:'仕訳帳（取引を日付順に記録）と総勘定元帳（科目別に転記）の2冊セット。すべての会社が義務として備える帳簿。補助簿（現金出納帳・得意先元帳など）は任意', ans:'主要簿', choices:['主要簿','補助簿','仕訳帳','精算表']},
      {label:'②特定の内容を詳しく記録する帳簿', hint:'現金出納帳・得意先元帳など', ans:'補助簿', choices:['補助簿','主要簿','補助記入帳','総勘定元帳']}
    ]
  },

  { id:100, cat:'帳簿・精算表',
    q:'試算表の種類について（　）に答えよ。①借方・貸方それぞれの合計を書くものを【ア】という。②差し引き後の残高だけ書くものを【イ】という。③両方を記入するものを【ウ】という。現金（借方合計500・貸方合計200）の場合、残高はいくらか。',
    q_en:'Three trial balance types: ① listing total debits and credits is called [ア___]; ② listing only net balances is [イ___]; ③ listing both is [ウ___]. What is the balance of Cash (debit total ¥500, credit total ¥200)?',
    ans_html: `<div class="tbl-sec">試算表の種類と特徴</div><table><thead><tr><th>種類</th><th>借方に記入</th><th>貸方に記入</th><th>主な用途</th></tr></thead><tbody><tr><td class="hl">①合計試算表</td><td>借方合計</td><td>貸方合計</td><td>転記の正確性チェック</td></tr><tr><td class="hl">②残高試算表</td><td>借方残高</td><td>貸方残高</td><td>各勘定の純残高確認</td></tr><tr><td class="hl">③合計残高試算表</td><td>残高＋合計</td><td>合計＋残高</td><td>①②両方の機能を持つ</td></tr></tbody></table><div class="tbl-sec">合計残高試算表の記入例（現金：借方合計500・貸方合計200）</div><table><thead><tr><th colspan="2">借方</th><th>勘定科目</th><th colspan="2">貸方</th></tr><tr><th>残高</th><th>合計</th><th></th><th>合計</th><th>残高</th></tr></thead><tbody><tr><td class="hl">300</td><td>500</td><td>現金</td><td>200</td><td></td></tr></tbody></table><div class="formula-box">借方残高（300）＝借方合計500－貸方合計200　　試算表の借方合計＝貸方合計（貸借平均の原理）</div>`,
    exp:'試算表は「転記ミスがないか確認するための表」です。3種類あります。①合計試算表：左（借方）と右（貸方）それぞれの合計をそのまま書く。②残高試算表：差し引きした残高だけ書く。③合計残高試算表：①と②の両方を書く。どれも「借方合計＝貸方合計」になります。' ,
    exp_en:'A trial balance verifies posting accuracy. Key rule: debit total = credit total. This rule can be used in reverse to find an unknown balance. Cash balance = ¥500 − ¥200 = ¥300.'
,
    note:'仕訳の基本：\n借方（左）＝ 資産増・費用・負債減・資本減\n貸方（右）＝ 負債増・資本増・資産減・収益\n借方合計＝貸方合計（必ず一致）',
    steps:[
      {label:'ア　借方・貸方合計を書く試算表', hint:'現金勘定なら「借方合計500/貸方合計200」のように合計のみ記載。残高は自分で計算する必要あり。全科目の借方合計＝貸方合計で転記ミスを検証できる', ans:'合計試算表', choices:['合計試算表','残高試算表','合計残高試算表','精算表']},
      {label:'イ　残高だけ書く試算表', hint:'差し引いた後の残高のみ記載', ans:'残高試算表', choices:['残高試算表','合計試算表','合計残高試算表','精算表']},
      {label:'ウ　両方を記入する試算表', hint:'合計と残高の両方を記載', ans:'合計残高試算表', choices:['合計残高試算表','合計試算表','残高試算表','精算表']},
      {label:'現金の残高', hint:'借方合計500 − 貸方合計200（現金）', ans:300, unit:'円', choices:[300,200,500,700]}
    ]
  },

  { id:101, cat:'帳簿・精算表',
    q:'帳簿の締め切りについて（　）に答えよ。①費用・収益勘定は決算時に【ア】勘定にまとめてゼロにする。②その差額（純利益）は【イ】に振り替える。③資産・負債・純資産勘定は【ウ】として翌期に引き継がれる。',
    q_en:'About year-end closing: ① Revenue and expense accounts are zeroed out by transferring to the [ア___] account. ② The net income is transferred to [イ___]. ③ Asset/liability/equity accounts carry forward as [ウ___]. Fill in the blanks.',
    ans_html: `<div class="tbl-sec">帳簿締め切りの手順</div><table><thead><tr><th>順序</th><th>対象勘定</th><th>締め切り方法</th></tr></thead><tbody><tr><td class="hl">①</td><td>費用勘定（仕入・給料等）</td><td>損益勘定の借方へ振替 → 費用勘定をゼロにする</td></tr><tr><td class="hl">②</td><td>収益勘定（売上・受取利息等）</td><td>損益勘定の貸方へ振替 → 収益勘定をゼロにする</td></tr><tr><td class="hl">③</td><td>損益勘定（集計勘定）</td><td>純利益→繰越利益剰余金へ振替 → 損益勘定をゼロにする</td></tr><tr><td class="hl">④</td><td>資産・負債・純資産勘定</td><td>残高を「次期繰越」として記入し帳簿を締め切る</td></tr></tbody></table><div class="tbl-sec">損益勘定のイメージ</div><table><thead><tr><th>損益（借方：費用）</th><th>損益（貸方：収益）</th></tr></thead><tbody><tr><td>仕入　490</td><td>売上　800</td></tr><tr><td>給料　280</td><td></td></tr><tr><td class="hl">当期純利益（→繰越利益剰余金）　30</td><td></td></tr><tr class="total-row"><td>合計　800</td><td>合計　800</td></tr></tbody></table>`,
    exp:'年末に帳簿をリセットする作業です。給料・売上などの費用・収益は「損益」という口座にまとめてゼロにし、差額（純利益）を純資産に移します。現金・建物などの資産・負債・純資産は消えずに「来年に繰り越し（次期繰越）」と書いて翌年のスタート残高になります。費用・収益はリセット、資産・負債は引き継ぎです。' ,
    exp_en:'Closing the books resets revenue and expense accounts to zero. All expenses → P&L account (debit), all revenues → P&L account (credit). Net difference (profit/loss) moves to Retained Earnings. Asset/liability/equity accounts carry forward their balances.'
,
    note:'有価証券の分類：\n売買目的 → 有価証券（流動資産）\n満期保有 → 満期保有目的債券（固定資産）\nその他 → 投資有価証券（固定資産）',
    steps:[
      {label:'ア　費用・収益をまとめる勘定', hint:'期末に売上・仕入などをこの勘定へ振り替えて差額（純利益）を計算する一時勘定。「ゴミ箱」イメージで費用・収益を集めて最後に繰越利益剰余金へ振替。翌期に残高ゼロにリセット', ans:'損益', choices:['損益','繰越利益剰余金','資本金','売上']},
      {label:'イ　純利益の振替先', hint:'損益勘定の差額（純利益）はここへ振り替え', ans:'繰越利益剰余金', choices:['繰越利益剰余金','損益','資本金','利益準備金']},
      {label:'ウ　資産・負債・純資産の引継ぎ', hint:'翌期に繰り越すための一覧', ans:'繰越試算表', choices:['繰越試算表','残高試算表','精算表','合計試算表']}
    ]
  },

  { id:102, cat:'帳簿・精算表',
    q:'雑貨店（A社）精算表の修正記入3件：①売れ残り雑貨（繰越商品）：期首100→期末150へ修正（売上原価算定）②未払給料30の見越し計上（店員の当期分未払い）③前払保険料20の繰延べ（翌期分を資産に戻す）',
    q_en:'Three year-end worksheet adjustments: ① Beginning inventory ¥100, ending inventory ¥150 (COGS calculation). ② Record accrued unpaid salaries of ¥30. ③ Defer prepaid insurance of ¥20. Record the adjusting entries.',
    ans_html: `<div class="tbl-sec">精算表　修正記入欄の整理</div><table><thead><tr><th>整理内容</th><th>借方（修正）</th><th>貸方（修正）</th></tr></thead><tbody><tr><td>①しくり<br>（期首商品を仕入に加算）</td><td class="hl">仕入　100</td><td>繰越商品　100</td></tr><tr><td>①くりしわ<br>（期末商品を繰越商品に振替）</td><td class="hl">繰越商品　150</td><td>仕入　150</td></tr><tr><td>②未払給料の計上</td><td class="hl">給料　30</td><td>未払費用　30</td></tr><tr><td>③前払保険料の繰延べ</td><td class="hl">前払費用　20</td><td>支払保険料　20</td></tr><tr class="total-row"><td>修正合計</td><td>300</td><td>300</td></tr></tbody></table><div class="formula-box">修正記入欄の借方合計＝貸方合計（必ず均衡する）　　売上原価＝仕入残高＋100（期首）－150（期末）</div>`,
    exp:'精算表に3つの決算整理を書き込む作業です。①しくりくりし（在庫の確認）：期首商品を仕入に足して期末商品を引く。②まだ払っていない給料を費用に計上して「未払費用（負債）」も書く。③来年分の保険料を「前払費用（資産）」に移して今年の費用から除く。3つ書き終えると、修正欄の左合計と右合計が一致します。' ,
    exp_en:'Three adjusting entries for the worksheet: ① "Shikuri-kurishiwa" — add beginning inventory to Purchases, then remove ending inventory. ② Accrue unpaid salaries. ③ Defer next-period insurance. After all three, debit and credit totals in the adjustments column will be equal.',
    steps:[
      {label:'①期末商品の金額', hint:'修正記入で「しくりくりし」の期末商品額', ans:150, unit:'円', choices:[150,100,130,200]},
      {label:'②未払給料の金額', hint:'当期分でまだ払っていない給料の見越計上', ans:30, unit:'円', choices:[30,20,40,50]},
      {label:'③前払保険料の金額', hint:'当期分を超えて払い過ぎた保険料の繰延', ans:20, unit:'円', choices:[20,30,10,40]}
    ]
  },

  { id:103, cat:'帳簿・精算表',
    q:'伝票の種類について（　）に答えよ。3伝票制では①現金の入金→【ア】伝票、②現金の出金→【イ】伝票、③現金以外の取引→【ウ】伝票を使う。5伝票制ではさらに【エ】伝票と【オ】伝票が加わる。また代金の一部だけ現金で払った場合は何枚の伝票に分けて起票するか。',
    q_en:'About voucher types: ① cash receipts → [ア] voucher; ② cash payments → [イ] voucher; ③ non-cash → [ウ] voucher. The five-voucher system adds [エ] and [オ] vouchers. How many vouchers for a mixed-payment purchase?',
    ans_html: `<div class="tbl-sec">伝票の種類</div><table><thead><tr><th>伝票</th><th>記入内容</th><th>3伝票制</th><th>5伝票制</th></tr></thead><tbody><tr><td class="hl">入金伝票</td><td>現金の入金取引</td><td>○</td><td>○</td></tr><tr><td class="hl">出金伝票</td><td>現金の出金取引</td><td>○</td><td>○</td></tr><tr><td class="hl">振替伝票</td><td>現金以外の取引（掛け等）</td><td>○</td><td>○</td></tr><tr><td class="hl">売上伝票</td><td>掛け売上取引</td><td>×</td><td>○</td></tr><tr><td class="hl">仕入伝票</td><td>掛け仕入取引</td><td>×</td><td>○</td></tr></tbody></table><div class="tbl-sec">一部現金取引の起票例（3伝票制）：備品250を現金50・当座預金200で購入</div><table><thead><tr><th>伝票種類</th><th>仕訳内容</th></tr></thead><tbody><tr><td class="hl">出金伝票</td><td>備品　50 ／ 現金　50</td></tr><tr><td class="hl">振替伝票</td><td>備品　200 ／ 当座預金　200</td></tr><tr class="total-row"><td>合算仕訳</td><td>備品　250 ／ 現金50・当座預金200</td></tr></tbody></table><div class="formula-box">伝票 → 仕訳集計表 → 総勘定元帳 の順に転記する</div>`,
    exp:'伝票は「仕訳を書く専用のメモ用紙」です。3伝票制では：現金が入ったとき→入金伝票、現金が出たとき→出金伝票、現金を使わない取引→振替伝票、の3種類に分けます。5伝票制はさらに掛け売上・掛け仕入専用の伝票が加わります。代金の一部だけ現金で払った場合は「現金の伝票」と「残りの伝票」の2枚に分けて起票します。' ,
    exp_en:'Vouchers are specialized memo pads for recording transactions. Under the three-voucher system: cash in → receipt voucher, cash out → payment voucher, no cash → journal voucher. A mixed-payment purchase (partly cash, partly on credit) requires two vouchers.',
    steps:[
      {label:'ア　現金入金の伝票', hint:'現金が流入する取引（売掛金回収・現金売上など）に起票。借方が必ず「現金」になるため現金の記入を省略する慣行がある。3伝票制の1つ', ans:'入金伝票', choices:['入金伝票','出金伝票','振替伝票','受取伝票']},
      {label:'イ　現金出金の伝票', hint:'現金を支払う取引に使う伝票', ans:'出金伝票', choices:['出金伝票','入金伝票','振替伝票','支払伝票']},
      {label:'ウ　現金以外の取引伝票', hint:'現金が動かない取引に使う伝票', ans:'振替伝票', choices:['振替伝票','入金伝票','出金伝票','仕訳伝票']},
      {label:'エ　5伝票制で追加（売上）', hint:'3伝票制に加わる売上専用伝票', ans:'売上伝票', choices:['売上伝票','入金伝票','振替伝票','受取伝票']},
      {label:'オ　5伝票制で追加（仕入）', hint:'3伝票制に加わる仕入専用伝票', ans:'仕入伝票', choices:['仕入伝票','出金伝票','振替伝票','支払伝票']}
    ]
  },

  { id:104, cat:'財務諸表読解',
    q:'下記の「売掛金」総勘定元帳を読み、4月30日の次月繰越（月末残高）を求めよ。',
    q_en:'Read the Accounts Receivable general ledger below and calculate the balance carried forward at April 30.',
    q_html: `<div class="tbl-sec">売掛金　総勘定元帳（抜粋）　単位：円</div><table><thead><tr><th colspan="3">借　方</th><th colspan="3">貸　方</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>200,000</td><td>4/10</td><td>現金回収</td><td>150,000</td></tr><tr><td>4/5</td><td>売上（A商店）</td><td>100,000</td><td>4/18</td><td>返品（A商店）</td><td>20,000</td></tr><tr><td>4/20</td><td>売上（B商店）</td><td>80,000</td><td>4/30</td><td>次月繰越</td><td class="q-blank">？</td></tr><tr class="total-row"><td></td><td>合計</td><td>380,000</td><td></td><td>合計</td><td>380,000</td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">売掛金　総勘定元帳（抜粋）　単位：円</div><table><thead><tr><th colspan="3">借　方</th><th colspan="3">貸　方</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>200,000</td><td>4/10</td><td>現金回収</td><td>150,000</td></tr><tr><td>4/5</td><td>売上（A商店）</td><td>100,000</td><td>4/18</td><td>返品（A商店）</td><td>20,000</td></tr><tr><td>4/20</td><td>売上（B商店）</td><td>80,000</td><td>4/30</td><td class="hl">次月繰越</td><td class="hl">210,000</td></tr><tr class="total-row"><td></td><td>合計</td><td>380,000</td><td></td><td>合計</td><td>380,000</td></tr></tbody></table><div class="formula-box">次月繰越＝借方合計380,000－現金回収150,000－返品20,000＝210,000円</div>`,
    exp:'T字型の帳簿では、左（借方）の合計と右（貸方）の合計を必ず一致させます。差額を埋めるために「次月繰越」を書き込みます。残高の求め方：「左合計（380,000）から右の取引（回収150,000＋返品20,000）を引く＝210,000円」です。合計を揃えるための数字と実際の残高は別物なので区別しましょう。' ,
    exp_en:'In a T-account ledger, debit totals must equal credit totals. The "balance carried forward" is the balancing figure. Method: debit total (¥380,000) minus credit transactions (¥150,000 + ¥20,000) = ¥210,000.',
    steps:[

    ]
  },

    ans_html: `<div class="tbl-sec">損益計算書（自 令和X年4/1 至 令和X+1年3/31）　単位：円</div><table><tbody><tr><td>Ⅰ 売上高</td><td></td><td>1,200,000</td></tr><tr><td>Ⅱ 売上原価</td><td></td><td></td></tr><tr><td>　期首商品棚卸高</td><td>100,000</td><td></td></tr><tr><td>　当期商品仕入高</td><td>800,000</td><td></td></tr><tr><td>　合計</td><td>900,000</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>△120,000</td><td></td></tr><tr><td>　売上原価　計</td><td></td><td>△780,000</td></tr><tr class="total-row"><td class="hl">（ア）売上総利益</td><td></td><td class="hl">420,000</td></tr><tr><td>Ⅲ 販売費及び一般管理費</td><td></td><td></td></tr><tr><td>　給料</td><td>200,000</td><td></td></tr><tr><td>　支払家賃</td><td>120,000</td><td></td></tr><tr><td>　減価償却費</td><td>50,000</td><td></td></tr><tr><td>　貸倒引当金繰入</td><td>10,000</td><td></td></tr><tr><td>　費用合計</td><td></td><td>△380,000</td></tr><tr class="total-row"><td class="hl">（イ）当期純利益</td><td></td><td class="hl">40,000</td></tr></tbody></table><div class="formula-box">（ア）売上総利益＝1,200,000－780,000＝420,000　　（イ）当期純利益＝420,000－380,000＝40,000</div>`,
    exp:'損益計算書（P/L）は「1年間の会社の成績表」です。売上総利益（粗利）＝売上高－売上原価で「商品ビジネスそのものの儲け」を計算します。そこから給料・家賃・減価償却費など「会社を動かすコスト（販管費）」を引いた残りが最終利益（当期純利益）です。粗利が高くても運営コストが大きければ赤字になります。' ,
    exp_en:'An income statement (P/L) is the company\'s annual scorecard. Gross profit = ¥1,200,000 − ¥780,000 = ¥420,000. Net income = ¥420,000 − ¥380,000 = ¥40,000. Note that depreciation and allowance are included in operating expenses even though no cash is paid.',
    steps:[
      {label:'ア（売上総利益）', hint:'売上高 − 売上原価', ans:420000, unit:'円', choices:[420000,400000,440000,380000]},

    ans_html: `<div class="tbl-sec">貸借対照表（令和X年3月31日現在）　単位：円</div><table><thead><tr><th colspan="2">資産の部</th><th colspan="2">負債・純資産の部</th></tr></thead><tbody><tr><td>【流動資産】</td><td></td><td>【流動負債】</td><td></td></tr><tr><td>現金及び預金</td><td>480,000</td><td>買掛金</td><td>220,000</td></tr><tr><td>売掛金</td><td>300,000</td><td>未払費用</td><td>30,000</td></tr><tr><td>貸倒引当金</td><td>△6,000</td><td>前受収益</td><td>20,000</td></tr><tr><td>繰越商品</td><td>120,000</td><td>流動負債合計</td><td>270,000</td></tr><tr><td>前払費用</td><td>10,000</td><td>【固定負債】</td><td></td></tr><tr><td>流動資産合計</td><td>904,000</td><td>長期借入金</td><td>300,000</td></tr><tr><td>【固定資産】</td><td></td><td>固定負債合計</td><td>300,000</td></tr><tr><td>備品</td><td>400,000</td><td>負債合計</td><td>570,000</td></tr><tr><td>減価償却累計額</td><td>△100,000</td><td>【純資産の部】</td><td></td></tr><tr><td>固定資産合計</td><td>300,000</td><td>資本金</td><td>500,000</td></tr><tr><td></td><td></td><td class="hl">②繰越利益剰余金</td><td class="hl">134,000</td></tr><tr><td></td><td></td><td class="hl">①純資産合計</td><td class="hl">634,000</td></tr><tr class="total-row"><td>資産合計</td><td>1,204,000</td><td>負債・純資産合計</td><td>1,204,000</td></tr></tbody></table><div class="formula-box">①純資産合計＝資産合計1,204,000－負債合計570,000＝634,000　　②繰越利益剰余金＝634,000－資本金500,000＝134,000</div>`,
    exp:'貸借対照表（B/S）は「今この日時点の財産状態」を示す表です。資産（持っているもの）＝負債（借りたもの）＋純資産（本当に自分のもの）は会計の鉄則です。純資産とは「全資産から借金を全部返した後に残る本当の自分の財産」。繰越利益剰余金はその中の「これまでに稼いだ利益の積み重ね」です。' ,
    exp_en:'A balance sheet shows the financial position on a specific date. The accounting equation: equity = total assets − total liabilities = ¥1,204,000 − ¥570,000 = ¥634,000. Retained earnings = ¥634,000 − ¥500,000 = ¥134,000.',

  { id:107, cat:'財務諸表読解',
    q:'得意先元帳（A商店）を読んで、4月28日現在の売掛金残高を求めよ。',
    q_en:'Read the accounts receivable ledger for Customer A and calculate the balance as of April 28.',
    q_html: `<div class="tbl-sec">得意先元帳（売掛金元帳）　A商店　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>借方（売上等）</th><th>貸方（回収等）</th><th>残高</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td></td><td></td><td>80,000</td></tr><tr><td>4/5</td><td>掛け売上</td><td>120,000</td><td></td><td>200,000</td></tr><tr><td>4/12</td><td>普通預金入金</td><td></td><td>80,000</td><td>120,000</td></tr><tr><td>4/20</td><td>掛け売上</td><td>60,000</td><td></td><td>180,000</td></tr><tr><td>4/28</td><td>返品</td><td></td><td>10,000</td><td class="q-blank">？</td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">得意先元帳（売掛金元帳）　A商店　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>借方（売上等）</th><th>貸方（回収等）</th><th>残高</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td></td><td></td><td>80,000</td></tr><tr><td>4/5</td><td>掛け売上</td><td>120,000</td><td></td><td>200,000</td></tr><tr><td>4/12</td><td>普通預金入金</td><td></td><td>80,000</td><td>120,000</td></tr><tr><td>4/20</td><td>掛け売上</td><td>60,000</td><td></td><td>180,000</td></tr><tr><td>4/28</td><td>返品</td><td></td><td>10,000</td><td class="hl">170,000</td></tr></tbody></table><div class="formula-box">4/28残高＝180,000－10,000＝170,000円</div>`,
    exp:'得意先元帳は「A商店との掛け取引の専用通帳」のようなものです。売上で残高が増え、入金や返品で残高が減ります。総勘定元帳の売掛金勘定が全取引先の合計なら、得意先元帳はその取引先別の内訳明細です。両者の合計は常に一致します。' ,
    exp_en:'An accounts receivable ledger is a "dedicated passbook" for each customer. Sales increase the balance; collections and returns decrease it. The total of all customer ledgers always equals the Accounts Receivable control account in the general ledger.',
    steps:[

  { id:108, cat:'財務諸表読解',

    ans_html: `<div class="tbl-sec">現金出納帳　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>収入</th><th>支出</th><th>残高</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td></td><td></td><td>100,000</td></tr><tr><td>4/3</td><td>売掛金回収</td><td>50,000</td><td></td><td>150,000</td></tr><tr><td>4/8</td><td>仕入代金支払</td><td></td><td>80,000</td><td>70,000</td></tr><tr><td>4/15</td><td>給料支払</td><td></td><td>30,000</td><td>40,000</td></tr><tr><td>4/22</td><td>受取手数料</td><td>20,000</td><td></td><td>60,000</td></tr><tr><td>4/28</td><td>旅費交通費支払</td><td></td><td>15,000</td><td class="hl">45,000</td></tr><tr class="total-row"><td></td><td>月計</td><td>70,000</td><td>125,000</td><td></td></tr></tbody></table><div class="formula-box">逐次：60,000－15,000＝45,000　　検算：100,000＋70,000－125,000＝45,000 ✓</div>`,

    exp_en:'A cash book is the "household account book" of a company\'s cash. The balance is always: prior balance + receipts − disbursements. Verify in two ways: running total (row by row) or lump sum (opening + total receipts − total disbursements).',
    steps:[

  { id:109, cat:'財務諸表読解',
    q:'下記の残高試算表を読み、（ア）借入金の残高と（イ）試算表の貸方合計を求めよ。借方合計は1,500,000円である。',
    q_en:'Read the trial balance below and calculate (a) the Borrowings balance and (b) the credit column total. The debit total is ¥1,500,000.',
    q_html: `<div class="tbl-sec">残高試算表（抜粋）　単位：円</div><table><thead><tr><th>借方残高</th><th>勘定科目</th><th>貸方残高</th></tr></thead><tbody><tr><td>450,000</td><td>現金</td><td></td></tr><tr><td>300,000</td><td>売掛金</td><td></td></tr><tr><td>150,000</td><td>繰越商品</td><td></td></tr><tr><td>200,000</td><td>備品</td><td></td></tr><tr><td></td><td>買掛金</td><td>180,000</td></tr><tr><td></td><td>借入金</td><td class="q-blank">（ア）？</td></tr><tr><td></td><td>資本金</td><td>500,000</td></tr><tr><td>400,000</td><td>仕入</td><td></td></tr><tr><td></td><td>売上</td><td>720,000</td></tr><tr class="total-row"><td>1,500,000</td><td>合計</td><td class="q-blank">（イ）？</td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">残高試算表（抜粋）　単位：円</div><table><thead><tr><th>借方残高</th><th>勘定科目</th><th>貸方残高</th></tr></thead><tbody><tr><td>450,000</td><td>現金</td><td></td></tr><tr><td>300,000</td><td>売掛金</td><td></td></tr><tr><td>150,000</td><td>繰越商品</td><td></td></tr><tr><td>200,000</td><td>備品</td><td></td></tr><tr><td></td><td>買掛金</td><td>180,000</td></tr><tr><td></td><td>借入金</td><td class="hl">（ア）100,000</td></tr><tr><td></td><td>資本金</td><td>500,000</td></tr><tr><td>400,000</td><td>仕入</td><td></td></tr><tr><td></td><td>売上</td><td>720,000</td></tr><tr class="total-row"><td>1,500,000</td><td>合計</td><td class="hl">（イ）1,500,000</td></tr></tbody></table><div class="formula-box">（イ）貸方合計＝借方合計（貸借平均の原理）＝1,500,000　　（ア）借入金＝1,500,000－180,000－500,000－720,000＝100,000円</div>`,
    exp:'試算表最大の武器は「借方合計＝貸方合計（貸借平均の原理）」です。この法則を使えば、合計が既知なら未知の勘定残高を逆算できます。「貸方合計＝借方合計（1,500,000円）」なので、判明している金額を合計から引くと残りが求まります。試験では「空欄が1つ」の逆算問題がよく出ます。' ,
    exp_en:'The key principle: debit total = credit total. ② credit total = ¥1,500,000. ① Borrowings = ¥1,500,000 − ¥180,000 − ¥500,000 − ¥720,000 = ¥100,000. When there is one unknown, use the balancing rule to solve by subtraction.',
    steps:[
