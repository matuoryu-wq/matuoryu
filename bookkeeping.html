  '仕訳日計表': '1日の仕訳を勘定科目別に集計した集計表を【　　　　　　】という。\n例）1日分の仕訳を科目別に集計（仕入勘定借方合計200万円・現金勘定貸方合計200万円…という一覧表を作成）し、総勘定元帳へ1日1回まとめて転記する（個別に何十回も転記する手間を省く）。\nポイント：大量の取引がある場合に、個々の転記でなく日計表経由で集計してから元帳へ1回転記する効率化の仕組み（日計表→元帳が1日1回で済む）。',
  '貸借対照表': '期末時点での資産・負債・純資産の残高を示す財務諸表を【　　　　　　】という。\n例）資産合計2,000万円（現金・売掛金・建物等の財産）＝負債合計1,200万円（借入金・買掛金等の返す義務）＋純資産合計800万円（資本金・繰越利益剰余金等の自己資本）。\nポイント：左側（資産：どんな財産があるか）＝右側（負債＋純資産：その財産をどう調達したか）が常に成立（B/S等式）。会社の「財産と調達源泉の状態を期末時点で撮ったスナップショット」。',
  '損益計算書': '一定期間の収益・費用を示し当期純利益を計算する財務諸表を【　　　　　　】という。\n例）売上500万円－売上原価300万円（商品を仕入れた原価）＝売上総利益200万円（粗利）。-販管費100万円（給料・家賃等の経費）＝営業利益100万円（本業の儲け）。±営業外損益20万円（利息など）＝経常利益120万円（通常の企業活動の儲け）。±特別損益▲20万円（臨時の損益）＝税引前純利益100万円。-法人税等30万円＝当期純利益70万円（最終的な手取りの儲け）。\nポイント：利益の段階（売上総利益・営業利益・経常利益・純利益）の計算構造が試験頻出。',
  '株主資本等変動計算書': '株主資本や評価差額金の期中変動を科目別に示す財務諸表を【　　　　　　】という。\n例）純資産の変動：期首資本金500万円→増資200万円（新株を発行した）→期末700万円。繰越利益剰余金：期首300万円＋当期純利益100万円（今期稼いだ利益）－配当50万円（株主に配った分）＝期末350万円。\nポイント：B/S（残高：財産の状態）とP/L（利益：稼ぎ）の橋渡し役（どちらにも使われる繰越利益剰余金の変動を説明する）。配当・増資・純利益等の純資産変動要因をすべて示す。',
  '売上総利益': '売上高から売上原価を差し引いた第1段階の利益（粗利）を【　　　　　　】という。\n例）売上高500万円－売上原価350万円（その商品を仕入れるのにかかったコスト）＝【　　　】150万円（粗利益・粗利：仕入れと販売の差額）。\nポイント：「いくらで売っていくらでできたか」を示す第1段階の利益（最も基本的な儲け）。粗利率（【　　　】÷売上高）が高いほど商品力が高い（値引きしなくても売れる）。',
  '営業利益': '売上総利益から販売費及び一般管理費を差し引いた本業の利益を【　　　　　　】という。\n例）売上総利益150万円－販売費及び一般管理費50万円（給料・家賃・広告費等：本業を行うために必要な経費）＝【　　　】100万円（本業で稼いだ利益）。\nポイント：本業の稼ぎ力を示す（「本業が強いか」の指標）。受取利息（本業以外の財務活動から）は含まない。「本業で100万円稼いだ」という意味。',
  '経常利益': '営業利益に営業外収益・費用を加減した正常な経営活動の利益を【　　　　　　】という。\n例）営業利益100万円＋受取利息5万円（銀行預金や貸付金からの利息：営業外収益）－支払利息3万円（銀行借入金の利息：営業外費用）＝【　　　】102万円（本業＋財務活動を合わせた通常の活動の利益）。\nポイント：本業＋財務活動を合わせた「通常の企業活動全体の利益」（毎期コンスタントに出る利益）。特別損益（臨時・異常な損益：めったにない出来事）は含まない。',
  '税引前当期純利益': '経常利益に特別損益を加減した法人税等控除前の利益を【　　　　　　】という。\n例）経常利益102万円＋固定資産売却益（特別利益：土地や建物を売って得た特別な儲け）20万円－火災損失（特別損失：火事による臨時の損害）10万円＝【　　　】112万円。\nポイント：経常利益に特別損益（臨時的な損益：普通はない出来事の損益）を加減したもの。この段階からさらに法人税等を引いて当期純利益を算出。',
  '当期純利益': '税引前当期純利益から法人税等を差し引いた最終的な利益を【　　　　　　】という。\n例）税引前【　　　】112万円－法人税等30万円（国や地方自治体に払う税金）＝【　　　】82万円（最終的な手取りの利益）。この82万円が繰越利益剰余金（翌期に持ち越す利益の蓄積）へ転記される。\nポイント：損益計算書の最終行（最後の結論）。株主に帰属する利益（株主のものになる利益）。マイナスなら「当期純損失（赤字）」。',
  '試算表': '全勘定の合計または残高を集計して転記の正確性を確認するための一覧表を【　　　　　　】という。\n例）全勘定（すべての科目）の残高を集計した一覧表（科目ごとに金額を並べた表）。借方合計＝貸方合計であれば転記に算術ミスなし（計算的な誤りはない）。\nポイント：【　　　】には3種類ある：合計【　　　】（借方・貸方の合計額を並べる）、残高【　　　】（純残高のみ表示：最終的な残高のみ）、合計残高【　　　】（両方を表示：最も詳しい）。',
  '合計試算表': '各勘定口座の借方合計額・貸方合計額を集計した試算表を【　　　　　　】という。\n例）現金勘定：借方合計200万円（入ってきた合計）・貸方合計150万円（出ていった合計）。売掛金勘定：借方合計100万円・貸方合計70万円…という形式。\nポイント：すべての取引金額が反映（増加・減少の全履歴が見える）。残高はわからない（純残高＝借方合計－貸方合計の差は残高試算表で確認）。',
  '残高試算表': '各勘定口座の純残高（借方残高または貸方残高）を集計した試算表を【　　　　　　】という。\n例）現金勘定：借方残高50万円（200万円－150万円の差額：今の現金残高）。売掛金：借方残高30万円（100万円－70万円：まだもらっていない代金の残高）。借入金：貸方残高500万円（まだ返していない借金の残高）…という形式。\nポイント：【　　　】はそのまま財務諸表の元データになる（残高がそのままB/SやP/Lに反映される）。',
  '合計残高試算表': '合計試算表と残高試算表を合体した試算表形式を【　　　　　　】という。\n例）各勘定について「借方合計（全入金額）・貸方合計（全出金額）・借方残高（今の残高）・貸方残高」を4列で表示。合計試算表と残高試算表を1つに合体したもの（最も情報量が多い）。\nポイント：日商簿記では最も多く出題される試算表形式（実際の試験に頻繁に出る）。合計と残高の両方が確認できる（一枚で全情報がわかる）。',
  '精算表': '決算整理から財務諸表作成までの過程をまとめたワークシートを【　　　　　　】という。\n例）【　　　】は「残高試算表（期末前の各科目の残高）→決算整理（期末に必要な修正：減価償却・前払費用等）→P/L・B/S」の流れをワークシートにまとめたもの。残高試算表の数値に決算整理仕訳（前払費用・未払費用・減価償却等の修正）を加減してP/LとB/Sを作成する。\nポイント：決算整理後の各勘定残高がP/L（損益計算書）かB/S（貸借対照表）のどちらに行くかを整理できる（全体の流れが一目でわかる）。',
  '三分法': '仕入・繰越商品・売上の3科目で商品売買を記録する方法を【　　　　　　】という。\n例）商品100万円を仕入：（借）仕入100万円（費用として記録） ／（貸）買掛金100万円（後で払う義務）。商品150万円で販売：（借）売掛金150万円（代金請求権） ／（貸）売上150万円（収益）。期末に決算整理（しくりくりし：期首・期末在庫を仕入に振り替える操作）で繰越商品・仕入を振替えて売上原価を確定。\nポイント：仕入（費用）・繰越商品（在庫資産）・売上（収益）の3科目を使う→【　　　】。分記法（1科目で利益を直接認識）・売上原価対立法（販売のたびに原価振替）とは別の処理方式。',
  '分記法': '商品科目と商品売買益科目を使い販売時に原価と利益を分けて記録する方法を【　　　　　　】という。\n例）原価80万円の商品を100万円で販売：（借）現金100万円（代金受取） ／（貸）商品80万円（在庫が減る）・商品売買益20万円（販売時に利益を直接認識）。\nポイント：仕入は使わない。「商品（在庫）」「商品売買益（その取引の利益）」の2科目を使う。売るたびに原価と利益を分けて記録するので手間がかかる（少量・高額商品向き）。',
  '売上原価対立法': '商品を仕入時に商品勘定に計上し販売のたびに売上原価に振り替える方法を【　　　　　　】という。\n例）商品100万円を仕入：（借）商品100万円（在庫として資産計上） ／（貸）買掛金100万円（支払義務）。150万円で販売：（借）現金150万円 ／（貸）売上150万円 ＋（借）売上原価100万円（販売のたびに原価を費用化） ／（貸）商品100万円（在庫が減る）。\nポイント：販売のたびに原価を売上原価（費用）へ振替→常に商品残高が正確な在庫原価を表す（リアルタイムで在庫金額がわかる）。三分法より手間がかかるが在庫管理に優れる。',
  'しくりくりし': '三分法における期末の売上原価算定仕訳（期首・期末の繰越商品の振替）の覚え方を【　　　　　　】という。\n例）三分法の決算整理仕訳：①（借）仕入XX万円（期首在庫を費用に加える） ／（貸）繰越商品XX万円（期首在庫の資産を取り崩す）。→「し（仕入に）くり（繰越商品を移す）」。②（借）繰越商品YY万円（期末在庫を資産として残す） ／（貸）仕入YY万円（費用から期末在庫を除く）。→「くり（繰越商品に）し（仕入から戻す）」。\nポイント：売上原価＝期首繰越商品（昨年から持ち越した在庫）＋当期仕入高（今年仕入れた分）－期末繰越商品（今年末の在庫）。この手順が「【　　　】」の語呂。',
  '棚卸': '期末に商品・材料等の現物を確認し帳簿残高と照合する手続きを【　　　　　　】という。\n例）期末に倉庫の商品を数えた（実地【　　　】：実際に数えること）→実際数量95個。帳簿上は100個→差5個が【　　　】減耗（盗難・自然損耗・ミス等による差異）。\nポイント：【　　　】は「手で数える（実地【　　　】：実際に現物を確認）」と「帳簿で確認（帳簿【　　　】：記録上の数量を確認）」の2つ。差異が【　　　】減耗損（紛失・損耗による費用）。',
  '先入先出法': '商品を古いものから先に払い出す想定で在庫原価を計算する方法を【　　　　　　】という。\n例）商品仕入：@100円×10個（4/1仕入：古い単価）、@110円×10個（4/10仕入：新しい単価）。4/15に12個払出し→先に入ったものから払い出す想定：100円×10個＋110円×2個＝1,220円（払出原価）。期末在庫8個は110円×8個＝880円（最新単価が残る）。\nポイント：【　　　】→古いものから先に払い出す想定（実際の倉庫管理と同じ感覚）。在庫は最新単価。インフレ時（物価上昇時）は期末在庫が高くなり利益も高くなりやすい。',
  '移動平均法': '仕入のたびに在庫を平均単価で更新して払出原価を計算する方法を【　　　　　　】という。\n例）在庫@100円×10個＝1,000円（既存在庫）の時に@110円×10個仕入（新しく仕入れた）→平均単価（1,000＋1,100）÷20個＝@105円（新しい平均単価）。この105円で次の払出を計算（平均単価で原価を計算）。\nポイント：仕入のたびに平均単価を更新→「移動」平均（仕入のたびに動く）。計算が手間だが単価が安定する（急激な価格変動の影響が薄まる）。',
  '低価法': '棚卸資産を取得原価と期末時価を比較して低い方で評価する方法を【　　　　　　】という。\n例）商品の取得原価1,000円・期末正味売却価額（今売ったらいくらになるか）800円→【　　　】適用→商品評価損200円（原価1,000円と時価800円の差：値下がり損）を計上：（借）商品評価損200円 ／（貸）商品200万円（帳簿価額を時価まで下げる）。\nポイント：取得原価＞時価（正味売却価額）→時価まで切下げ（商品評価損を計上：損失を早期に認識）。保守主義の原則（損失は早めに認識する考え方）から損失を早期認識。',
  '棚卸減耗損': '帳簿数量と実際数量の差（数量不足）に取得原価を乗じて計上する費用を【　　　　　　】という。\n例）帳簿在庫100個・実地棚卸95個→5個が不足（盗難・紛失・自然損耗等による）。原価1,000円/個→【　　　】5,000円（5個×1,000円）：（借）【　　　】5,000円 ／（貸）繰越商品5,000円（帳簿上の在庫を実数に合わせる）。\nポイント：【　　　】＝「数量の差（紛失・盗難・自然損耗による数量不足の損失）」。商品評価損＝「単価の差（時価が下落したことによる価格の損失）」。この区別が重要（原因が違う）。',
  '売上原価': '販売した商品・製品の仕入原価の合計を【　　　　　　】という。\n例）三分法：【　　　】＝期首繰越商品50万円（昨年末の在庫）＋当期仕入250万円（今年仕入れた商品）－期末繰越商品30万円（今年末の在庫）＝270万円（実際に売れた商品のコスト）。売上300万円－【　　　】270万円＝売上総利益30万円（粗利）。\nポイント：「売れた商品の仕入原価の合計」（売った商品にかかったコストの合算）。三分法では決算整理で確定。【　　　】対立法では販売のたびに確定（仕入れた日から確定）。',
  '約束手形': '振出人が名宛人（受取人）に直接支払いを約束する2者間の手形を【　　　　　　】という。\n例）振出人A社が「3か月後に100万円支払います」と記載した手形をB社に渡す→A社：支払手形100万円（3か月後に払う義務という負債）、B社：受取手形100万円（3か月後にもらえる権利という資産）。満期日（3か月後）に当座預金から自動決済。\nポイント：【　　　】は「振出人が受取人に直接支払いを約束する」2者間の手形（AがBに直接約束する）。為替手形（3者間の命令型）と区別する。',
  '為替手形': '振出人が第三者（名宛人）に支払いを命令する3者間の手形を【　　　　　　】という。\n例）A社（振出人：命令を出す人）がB社（名宛人・引受人：支払いを命じられる人）に「C社への100万円をB社の当座預金から支払え」と命令する3者間の手形。A社：受取手形（またはすぐ裏書）、B社：支払手形（引受後：命令を受け入れたら支払義務が生じる）、C社：現金受取。\nポイント：【　　　】の登場人物→振出人（命令する人）・引受人＝名宛人（命令される人）・受取人（代金をもらう人）の3者。引受時にB社が支払手形を計上（引き受けた段階で義務が生じる）。',
  '手形の裏書譲渡': '保有中の手形の裏面に署名して第三者に譲渡する手形決済手段を【　　　　　　】という。\n例）保有中の受取手形50万円（あとでもらえる権利）を仕入代金の支払いとして仕入先に裏書譲渡（手形の裏に署名して相手に渡す）：（借）仕入50万円 ／（貸）受取手形50万円（受取手形という権利が消える）。\nポイント：裏書譲渡＝手形の裏に署名して他者に渡すこと（現金の代わりに手形で支払う）。受取手形が消滅→代わりに仕入（または買掛金等）を支払う。遡及請求リスクがある（相手が支払えなかったら自分に請求が来る）が割引よりコスト低。',
  '手形の割引': '保有中の手形を満期前に金融機関に売却して資金化する手法を【　　　　　　】という。\n例）受取手形50万円（3か月後にもらえる権利）を満期前に銀行で割引（期限前に売却）。割引料5,000円控除（早く現金化する手数料）→49.5万円受取：（借）当座預金49.5万円・手形売却損5,000円 ／（貸）受取手形50万円（権利を銀行に売った）。\nポイント：割引＝手形を満期前に銀行に売ること（資金を早く受け取るための資金調達手段）。割引料が手形売却損（費用：早期現金化のコスト）。',
  '不渡り': '手形の満期日に振出人が支払を行えなかった状態（決済不能）を【　　　　　　】という。\n例）受取手形50万円の満期日に振出人（手形を作った人）の口座残高不足→決済されず【　　　】（お金が払われなかった）→受取人は振出人に手形金額＋拒絶費用（【　　　】処理にかかった実費）を請求可能。\nポイント：同一業者が6か月以内に2回【　　　】を出すと銀行取引停止（実質倒産：社会的に信用を失う）。不渡手形（資産として管理・回収を目指す）として管理し回収不能確定なら貸倒損失（損失として計上）へ。',
  '電子記録債権・債務': '電子記録機関への登録によって発生する電子的な金銭債権・債務を【　　　　　　】という。\n例）売掛金100万円を得意先と協議の上、電子記録に切替（紙の手形から電子データへ）：（借）電子記録債権100万円（電子データで管理する権利） ／（貸）売掛金100万円（売掛金から切り替える）。仕入側は：（借）買掛金100万円 ／（貸）電子記録債務100万円（電子データで管理する義務）。\nポイント：電子記録債権（お金をもらう側）・電子記録債務（お金を払う側）はセットで覚える。紙手形のデジタル版（紛失リスクがない・コスト低い）。',
  'クレジット売掛金': 'クレジットカード販売時にカード会社への請求権として計上する売上債権を【　　　　　　】という。\n例）商品1万円をクレジットカードで販売（顧客はカードで支払う）：（借）【　　　】1万円（カード会社にお金をもらう権利） ／（貸）売上1万円（収益が発生）。後日カード会社から手数料3%引き9,700円入金：（借）普通預金9,700円・支払手数料300円（カード会社への手数料） ／（貸）【　　　】1万円（権利が消える）。\nポイント：相手方はカード会社（顧客からではなくカード会社から回収する）。手数料は支払手数料（費用：カード会社に払う費用）。',
  '有形固定資産': '有形固定資産＝B/Sの固定資産欄に計上される「カタチのある」長期資産を【　　　　　　】という。\n例）建物（工場や事務所）・機械装置（製造設備）・車両運搬具（トラック・社用車）・土地（工場・事務所用地）・備品（パソコン・事務機器）など実体のある長期資産が【　　　】。毎期減価償却する（使いながら価値が減っていく：土地は例外で減らない）。\nポイント：有形→目に見える・触れる（物体として存在する）。無形（特許権・ソフトウェア等：目に見えない権利）と区別する。',
  '無形固定資産': '目に見えない知的財産権・ソフトウェア等を計上するB/S固定資産区分を【　　　　　　】という。\n例）特許権（発明の独占権）・実用新案権・商標権（ブランド名の独占使用権）・ソフトウェア（コンピュータプログラム）・のれん（買収時の超過支払額）など形がない長期資産。直接法で償却（累計額勘定なし：資産から直接差し引く）。\nポイント：無形→目に見えない・触れない（権利や知的財産）。有形固定資産（建物・機械等：物体として存在するもの）と区別。【　　　】を償却する際は直接法のみ（「減価償却累計額」勘定を使わない）。',
  '取得原価': '固定資産・棚卸資産等を取得した際の購入代金と付随費用を合わせた原始取得価額を【　　　　　　】という。\n例）機械の購入代金2,900万円＋設置費用100万円（設置に必要な工事費）＝【　　　】3,000万円（実際にかかったコストの合計：付随費用も含む）。\nポイント：【　　　】＝購入代金＋付随費用（運送費・設置費・手数料等：取得するためにかかったコスト全部）。税込みか税抜きかは消費税処理方法による（税抜処理なら消費税は含まない）。',
  '帳簿価額': '固定資産等の取得原価から減価償却累計額等を差し引いた残高（会計上の価値）を【　　　　　　】という。\n例）建物：取得原価1,000万円・減価償却累計額300万円（今まで費用化した合計額）→【　　　】700万円（今の会計上の価値）（売却時の損益計算の基準になる）。\nポイント：【　　　】＝取得原価－減価償却累計額（有形固定資産の場合）（減った分を引いた残り）。【　　　】と売却価格の差が売却損益（帳簿よりも高く売れたら利益・安く売れたら損失）。',
  '耐用年数': '固定資産が使用に耐えると見込まれる期間（減価償却の計算基礎）を【　　　　　　】という。\n例）パソコン（【　　　】4年・定額法）：取得原価20万円÷4年＝年5万円の減価償却費（4年間毎年5万円を費用化）。税法上の【　　　】は省令で定められている（法定【　　　】：国が決めた使用可能年数）。\nポイント：法定【　　　】は資産の種類ごとに税法で規定（パソコン・建物・機械等で異なる）。経済的【　　　】（実際使えると見込む期間）とは異なる場合がある。',
  '定額法': '取得原価を耐用年数で均等分割して毎期同額を費用計上する減価償却方法を【　　　　　　】という。\n例）取得原価100万円・耐用年数5年・残存価額ゼロ（現在の原則：使いきれば価値はゼロ）：毎年20万円（100万円÷5年）の均等額を減価償却費として計上（毎年同じ金額だから計算が簡単）。5年後の帳簿価額はゼロ（または備忘価額1円：帳簿から消えないようにする最小値）。\nポイント：【　　　】→毎年同額（平等に分割して費用化）。定率法→初期に多く後半に少ない（逓減：だんだん減る）。どちらを使うかは固定資産の種類・会社の方針による。',
  '定率法': '帳簿価額に一定率を乗じて毎期漸減する金額を費用計上する減価償却方法を【　　　　　　】という。\n例）取得原価100万円・償却率40%（2倍【　　　】等：定額法の2倍の速さで減らす）：1年目40万円（100万円×40%）、2年目24万円（60万円×40%）、3年目14.4万円（36万円×40%）…と年々減少（最初が大きく後が小さい）。\nポイント：【　　　】→初期に多く計上→初期の税負担を軽減できる（早く費用化して税金を後回しにする効果）。後期は少なくなる。建物附属設備・機械装置等に多く使われる（建物は定額法のみ）。',
  '間接法': '固定資産の帳簿価額を直接減らさず減価償却累計額勘定を使って間接的に控除する方法を【　　　　　　】という。\n例）備品（取得原価20万円）：（借）減価償却費5万円（費用） ／（貸）備品減価償却累計額5万円（過去の累計額を積み上げる）。B/Sには「備品20万円・△減価償却累計額5万円（今まで費用化した合計）＝帳簿価額15万円」と表示（取得原価と減った分が両方わかる）。\nポイント：【　　　】→取得原価をそのまま残し累計額勘定で控除表示→取得原価（いくらで買ったか）と蓄積した累計額（今まで費用化した合計）が両方わかる。直接法→固定資産を直接減額→帳簿価額しかわからない（いくらで買ったかがわからなくなる）。',
  '資本的支出': '固定資産の価値・耐用年数を高める改修・改良のための支出を【　　　　　　】という。\n例）工場の大規模改修（耐用年数延長・生産性向上：機能をグレードアップした）300万円：（借）建物300万円（固定資産に加える） ／（貸）現金300万円（将来にわたり減価償却で費用化）。\nポイント：【　　　】→固定資産として計上→将来の費用（減価償却で分割：今すぐ全額費用にしない）。収益的支出→当期費用（修繕費等：今すぐ全額費用）として一括計上。「グレードアップ（性能を上げる）」が【　　　】、「現状回復（元に戻す）」が収益的支出。',
  '収益的支出': '固定資産の現状維持・原状回復のための支出で当期費用に計上するものを【　　　　　　】という。\n例）雨漏りの応急修理（元の状態に戻すだけ）30万円：（借）修繕費30万円（当期費用として全額計上） ／（貸）現金30万円。\nポイント：【　　　】→当期費用（修繕費等：今すぐ全額費用）。資本的支出→固定資産計上（将来にわたり費用化：分割して費用化）。「元に戻す（現状回復）」→【　　　】。「性能を上げる（グレードアップ）」→資本的支出。この区別が試験で頻出。',
  'ファイナンス・リース': 'リース期間中の中途解約不能とフルペイアウトを満たすリース取引で「実質的に買ったも同然」として資産計上と減価償却が必要なものを【　　　　　　】という。\n例）5年間解約不可（途中でやめられない）・支払総額300万円（利息相当30万円含む）のコピー機リース。仕訳①契約時：（借）リース資産270万円（実質購入した資産として計上）／（貸）リース債務270万円（元本相当：返済義務を負債として計上）。仕訳②毎年の支払い（元本54万円＋利息6万円＝60万円）：（借）リース債務54万円（負債を少しずつ返す）＋支払利息6万円（利息部分：費用）／（貸）現金60万円（実際の支払い）。仕訳③毎年の減価償却：（借）減価償却費54万円（毎年価値が減る分を費用に）／（貸）リース資産54万円（270万円÷5年）。\nポイント：ファイナンスリース→「資産計上・債務計上・減価償却（B/Sに資産と負債が両方出てくる）」の3点セット。オペレーティングリース→「支払リース料（費用）のみ（B/Sに何も出てこない）」。解約不能（途中でやめられない）＋フルペイアウト（リース料の合計がほぼ資産の価値をカバーする）がファイナンスリースの2要件。',
  'オペレーティング・リース': 'ファイナンス・リースの要件（中途解約不能＋フルペイアウト）を満たさないリース取引で資産計上せず支払リース料のみを費用処理するものを【　　　　　　】という。\n例）1年更新で解約可能（いつでもやめられる）な複合機のリース月額3万円。1年36万円を費用計上するだけ（賃借料と同じ扱い）。仕訳）月次：（借）支払リース料3万円（費用）／（貸）現金3万円。資産ゼロ・負債ゼロ・減価償却なし（B/Sに影響しない）。\nポイント：ファイナンスリース→資産＋負債がB/Sに出てくる（オフバランスにならない：財務諸表に表れる）。オペレーティングリース→B/Sに計上されない（オフバランス：財務諸表に出てこない）。',
  '圧縮記帳': '国庫補助金等を受けた際に固定資産の取得原価を補助金相当額だけ減額することで課税を将来の減価償却期間に分散させる税務上の処理を【　　　　　　】という。\n例）補助金3,000万円で5,000万円の設備取得。仕訳①補助金受取：（借）現金3,000万円／（貸）国庫補助金受贈益3,000万円（収益：もらった補助金は一旦収益）。仕訳②固定資産取得：（借）機械5,000万円／（貸）現金5,000万円。仕訳③【　　　】（課税を避けるための帳簿価額の引き下げ）：（借）固定資産圧縮損3,000万円（費用：受贈益と相殺するための損失）／（貸）機械3,000万円（帳簿価額2,000万円に圧縮：設備の価値を帳簿上で下げる）→補助金収益と圧縮損が相殺されて当期課税ゼロ（その年は税金がかからない）。以後2,000万円ベースで減価償却（低くなった帳簿価額から毎年費用化）。\nポイント：【　　　】は「課税の繰延べ（税金が消えるのではなく先送りになるだけ）（免除ではない）」。減価償却が少なくなるため将来に課税所得が増える仕組み（将来に分散して税金を払う）。',
  '減損会計': '固定資産の収益性が著しく低下し投資額を将来の収益で回収できない見込みになった場合に帳簿価額を回収可能価額まで切り下げる会計処理を【　　　　　　】という。\n例）工場（帳簿価額5億円）が不採算（赤字続き）になり①正味売却価額（今すぐ売ったらいくら？）3億円・②使用価値（このまま使い続けたら将来いくら稼げる？の現在価値）3.5億円と判定。回収可能価額＝max（3億円、3.5億円）＝3.5億円（より高い方を使う）。仕訳）（借）減損損失1.5億円（5億円－3.5億円：回収できない分を損失として計上）／（貸）固定資産1.5億円（帳簿価額を3.5億円に切下げ）。以後3.5億円ベースで残存耐用年数にわたり減価償却（低くなった価値から再計算）。\nポイント：減損の判定手順①「減損の兆候（収益性の著しい低下：稼げなくなった兆候）」があるか→②「減損損失の認識（割引前CF＜帳簿価額：将来の収入合計より帳簿価額が高い）」か→③「回収可能価額まで切下げ（減損損失の測定：いくら損失を計上するか）」。この3ステップが試験の核心。',
  '回収可能価額': '減損会計で固定資産の帳簿価額を切り下げる基準となる価額を【　　　　　　】という。\n例）工場について①正味売却価額（今すぐ売ったら3億円）・②使用価値（将来の収益の現在価値3.5億円：これからも使い続けたら得られる価値）→【　　　】＝max（3億円、3.5億円）＝3.5億円（いずれか大きい方）。\nポイント：【　　　】＝「正味売却価額（売ったらいくら）」と「使用価値（使い続けたらいくら）」のうち大きい方（より有利な選択肢）。帳簿価額をこの金額まで切り下げる。',
  '売買目的有価証券': '短期的な売買差益を目的として保有する有価証券で期末に時価評価し評価差額を損益に計上するものを【　　　　　　】という。\n例）A株式を100万円で購入（売買目的：短期で売って差益を狙う）→期末時価120万円（値上がりした）。仕訳①購入：（借）【　　　】100万円（資産）／（貸）現金100万円。仕訳②期末評価替え（決算日に時価に更新）：（借）【　　　】20万円（資産増加）／（貸）有価証券評価益20万円（P/L計上：利益として認識）。翌期首の洗替仕訳（元に戻す仕訳）：（借）有価証券評価益20万円（前期の評価益を取り消す）／（貸）【　　　】20万円（取得原価に戻す）。\nポイント：【3区分比較】売買目的→時価評価・差額はP/L（損益に影響）。満期保有目的→時価評価なし・償却原価法（時価に関係なく）。その他有価証券→時価評価・差額はB/S純資産（損益に影響しない）。この区分の暗記が最重要。',
  '満期保有目的債券': '満期まで保有する意図と能力を持って取得した社債などの債券で償却原価法で評価するものを【　　　　　　】という。\n例）額面100万円（満期に返してもらえる金額）の社債を96万円（割引価格）で取得（4年満期保有予定）。差額4万円（96円→100円に近づく分）を4年で按分（毎年少しずつ利息として受取る）。仕訳）取得時：（借）【　　　】96万円（資産）／（貸）現金96万円（現金が出ていく）。毎年度末（償却原価法：帳簿価額を少しずつ額面に近づける方法）：（借）【　　　】1万円（帳簿価額を増やす）／（貸）有価証券利息1万円（4万円÷4年＝追加利息）。4年後：帳簿価額100万円で満期償還（額面通りに戻ってくる）。\nポイント：満期保有目的は「時価がいくらでも評価替えしない（値段が変わっても関係ない）」のが最大の特徴。取得価格と額面の差は「事実上の追加利息（安く買った分、後で返してもらえる分）」→毎期受取利息に加算。試験では「償却原価法の計算（毎年の利息額を求める問題）」が必出。',
  'その他有価証券': '売買目的・満期保有目的以外の有価証券（投資目的等）で期末時価評価し評価差額を純資産に計上するものを【　　　　　　】という。\n例）取引先維持目的でC社株式30万円を購入（長期保有予定：売買目的でも満期保有でもない）→投資有価証券30万円（固定資産：長期で持つ）。期末時価35万円：（借）投資有価証券5万円 ／（貸）繰延税金負債1.5万円（将来の税負担）・【　　　】評価差額金3.5万円（純資産直入：P/Lを通さず純資産へ）。\nポイント：【　　　】＝売買目的でも満期保有目的でもない有価証券（持合い株式・長期投資等）。評価差額はP/Lを経由せず純資産へ直入（今期の損益に影響させない）。',
  '洗替法': '期末に評価替えした有価証券の評価差額を翌期首に元の取得原価へ戻す方法を【　　　　　　】という。\n例）取得原価1,000円の有価証券が期末時価1,200円（200円値上がり）。評価益200円を計上。仕訳①期末：（借）有価証券200円（資産増加）／（貸）有価証券評価益200円（P/L：今期の利益）。仕訳②翌期首（洗替え：一旦元に戻す）：（借）有価証券評価益200円（前期の評価益を取り消す）／（貸）有価証券200円（取得原価1,000円に戻す）。翌年末時価1,100円なら：評価益は100円（1,100－1,000：取得原価との差だけ認識）のみ認識。\nポイント：【　　　】→「毎期独立して時価と取得原価の差を計算（毎年ゼロから計算し直す）」。切放法→「前期末時価をそのまま翌期の帳簿価額に引き継ぎ（値段が下がったら戻らない）」。売買目的有価証券は【　　　】が原則。',
  '切放法': '期末評価後の時価をそのまま翌期以降の帳簿価額として引き継ぐ方法を【　　　　　　】という。\n例）取得原価1,000円→期末時価800円（評価損200円計上）→【　　　】なら800円が翌期の帳簿価額（値下がりした価格を引き継ぐ）。仕訳①期末評価損：（借）有価証券評価損200円（費用：損失を認識）／（貸）有価証券200円（800円に切下げ）。翌期首：仕訳なし（800円が帳簿価額のまま：一度下がったら戻らない）。翌年末時価750円なら：評価損は50円（750－800：前期の800円からの差のみ）のみ認識（前期の評価損200円は戻らない）。\nポイント：【　　　】→「低下したコストは戻らない（一度下がったら取得原価には戻らない）」保守主義的方法（損はすぐ認識・益は慎重に）。特に「その他有価証券」の評価損に適用される。洗替法（翌期首に戻し入れ：一度元に戻す）との違いを押さえる。',
  '償却原価法': '社債・債券を額面と異なる価額で取得した場合にその差額を利息として毎期均等に配分し帳簿価額を満期の額面に近づける方法を【　　　　　　】という。\n例）額面100万円の社債を96万円で取得（4万円安く買えた）・4年満期保有。差額4万円÷4年＝毎年1万円を受取利息に加算（安く買った分を毎年少しずつ利息として受け取るイメージ）。仕訳①取得：（借）満期保有目的債券96万円（資産：取得価格で計上）／（貸）現金96万円。仕訳②毎年（利払い＋【　　　】）：（借）現金3万円（クーポン3%：実際の利息受取）＋満期保有目的債券1万円（帳簿価額を少しずつ増やす）／（貸）受取利息4万円（名目3万円＋償却分1万円＝実質の利息）。4年後：帳簿価額100万円で満期償還（額面通りに戻ってくる）。\nポイント：割引取得（安く買った）→毎年帳簿価額が増加（額面に近づいていく）。プレミアム取得（高く買った）→毎年帳簿価額が減少。受取利息の金額が名目金額より多い（割引：安く買った分が追加利息）または少ない（プレミアム：高く買った分を毎年取り崩す）点が特徴。',
  '全部純資産直入法': 'その他有価証券の評価差額（評価益も評価損も）をすべて純資産に計上する方法を【　　　　　　】という。\n例）その他有価証券（取得原価100万円）が期末時価80万円（評価損20万円：値下がりした）。税率30%。仕訳（【　　　】：損得どちらもP/Lを通さず直接純資産へ）：（借）その他有価証券評価差額金14万円（純資産マイナス：手取りの損失分）＋繰延税金資産6万円（税効果：将来の節税分）／（貸）投資有価証券20万円（評価損：資産を時価に下げる）。P/Lには損益計上なし（損益計算書に影響しない）。B/Sの純資産が14万円減る。\nポイント：【　　　】→評価損益ともにP/Lをスルーして直接純資産へ（利益も損失も損益計算書に出さない）。部分純資産直入法→評価益は純資産へ、評価損はP/Lへ（損だけは損益計算書に出す：保守主義）。',
  '部分純資産直入法': 'その他有価証券の評価益は純資産に計上するが評価損は当期損失として処理する方法を【　　　　　　】という。\n例）その他有価証券（取得原価100万円）が期末時価80万円（評価損20万円）。税率30%。仕訳（【　　　】：損はP/Lへ・益は純資産へ）：（借）投資有価証券評価損20万円（P/L費用：損失を今期の損として計上）＋繰延税金資産6万円（将来の節税分）／（貸）投資有価証券20万円（時価に切り下げ）。法人税等調整額△6万円（節税効果：税金を6万円分減らす）を計上。\nポイント：全部vs部分の違い→評価損をP/Lに出すか出さないか（損失を今期の損益に含めるか）。部分法は「損は早めに認識（保守主義：損を素早く計上してリスクを開示）」という考え方。どちらを使うかで当期利益が変わる点がポイント（部分法を使うと評価損分だけ利益が減る）。',
  '引当金': '将来の特定の費用・損失に備えて当期に費用計上し負債として積み立てる勘定を【　　　　　　】という。\n例）賞与【　　　】：7月ボーナスの当期分を3月決算で先取り費用計上（今年度分の賞与費用を払う前に計上）。製品保証【　　　】：アフターサービス費用の見込みを計上（将来発生しそうな修理費を先に計上）。貸倒【　　　】：回収不能の見込みを計上（もらえなくなりそうな売掛金の分を費用化）。退職給付【　　　】：将来の退職金の当期発生分を計上（毎年少しずつ退職金を積み立てる）。【　　　】設定の4要件：①将来の特定費用・損失（何のためか明確）②発生が確実（高い確率：必ず起きそう）③当期以前の事象による（今期の活動が原因）④金額が合理的に見積もれる（いくらか計算できる）。\nポイント：4要件を全て満たさないと【　　　】設定不可。「偶発債務（確率が低い：たまたま起きるかもしれない）」→注記にとどめる（【　　　】にはしない）。',
  '評価勘定': '固定資産等の帳簿価額を間接的に修正するためにB/Sで対象資産から控除表示される補助的な科目を【　　　　　　】という。\n例）売掛金1,000万円に対し貸倒引当金20万円（回収できないかもしれない分の見積もり）→B/Sに「売掛金1,000万円・△貸倒引当金20万円（マイナスして表示）＝980万円（実質的な価値）」と表示。貸倒引当金が「【　　　】」として売掛金から控除表示される（資産の実質価値を示す）。\nポイント：【　　　】は資産（または負債）の帳簿価額を調整するための補助的な科目（本体から差し引いて実態を示す）。貸倒引当金・減価償却累計額が代表例。',
  '差額補充法': '引当金の期末残高が必要額に不足する場合に不足額のみを追加計上する方法を【　　　　　　】という。\n例）貸倒引当金の必要額20万円・現在残高8万円（前期から引き継いだ残り）。【　　　】（不足分だけ補充する方法）：不足額12万円（20万円－8万円）だけ追加：（借）貸倒引当金繰入12万円（費用）／（貸）貸倒引当金12万円（残高を20万円に増やす）。洗替法（全額取り崩してから再設定する方法）なら：①（借）貸倒引当金8万円（全額取り崩す）／（貸）貸倒引当金戻入8万円（収益：取り崩した分が収益）。②（借）貸倒引当金繰入20万円（必要額を全額計上）／（貸）貸倒引当金20万円。\nポイント：【　　　】→「足りない分だけ補充（シンプルな仕訳）」→仕訳が少ない（実務向き）。洗替法→「全額取り崩してから再設定（収益と費用が両方出てくる）」→計算が明確。どちらを使うかを問題文で確認。',
  '洗替法（引当金）': '引当金の残高を翌期首に全額取り崩してから改めて必要額を計上し直す方法を【　　　　　　】という。\n例）前期末貸倒引当金10万円（洗替法）。翌期首洗替（全額取り崩す処理）：（借）貸倒引当金10万円（全額消す）／（貸）貸倒引当金戻入10万円（全額収益：一旦収益に戻す）。当期末に必要額15万円を再設定（また新たに積み直す）：（借）貸倒引当金繰入15万円（費用）／（貸）貸倒引当金15万円。P/L：貸倒引当金繰入15万円（費用）－貸倒引当金戻入10万円（収益）＝実質5万円の純費用増加（引当金が5万円増えた分の費用）。\nポイント：「洗替法」の問題では翌期首の「戻し入れ仕訳（全額取り崩す仕訳）」を忘れないこと。差額補充法（戻し入れなし：足りない分だけ追加）では戻し入れ仕訳は不要。試験では洗替法が多く出題される。',
  '退職給付引当金': '従業員の将来の退職給付支払義務のうち当期までに発生した分を見積もって積み立てる引当金を【　　　　　　】という。\n例）全従業員の退職給付債務（将来退職金の現在価値：将来払う退職金を今の価値に換算した合計）10億円・年金資産（運用積立：積み立てて運用中のお金）7億円→【　　　】3億円（B/S負債：まだ準備できていない退職金の義務）。当年度の退職給付費用500万円（①勤務費用300万円：今年1年働いた分の積上げ＋②利息コスト200万円：残存債務の利息分）。仕訳①費用計上：（借）退職給付費用500万円（費用）／（貸）【　　　】500万円（負債が増える）。仕訳②実際の退職金支払：（借）【　　　】XXX万円（積み立てた分を使う）／（貸）現金XXX万円（実際支払い）（引当金を取り崩す）。\nポイント：【　　　】＝退職給付債務－年金資産（積立済みを差し引いた未積立分）。年金資産（積立済み）は控除する（すでに備えている分は引く）。費用の2要素：①勤務費用（今年1年働いた分の積上げ）＋②利息費用（債務残高×割引率：時間の経過による利息分）。',
  '純資産': '資産合計から負債合計を差し引いた株主（出資者）に帰属する正味財産を【　　　　　　】という。\n例）B/S：資産5,000万円－負債3,000万円＝【　　　】2,000万円（会社の正味財産：株主のもの）。内訳：資本金500万円（株主が払い込んだ元手）＋資本準備金500万円（払込余剰分）＋利益準備金100万円（利益から積み立てた法定準備金）＋繰越利益剰余金950万円（これまで稼いだ利益の累積）＋その他有価証券評価差額金△50万円（評価損：含み損が【　　　】を減らしている）＝【　　　】2,000万円。\nポイント：【　　　】の構成→①株主資本（資本金・資本剰余金・利益剰余金・自己株式）＋②評価・換算差額等（その他有価証券評価差額金等：含み損益）＋③新株予約権（ストックオプション等）。「株主に帰属するもの（株主資本：投資した分と稼いだ分）」と「評価差額等（含み損益）」は別区分で表示する。',
  '法定準備金': '会社法の規定に基づき積立が義務付けられた準備金（資本準備金＋利益準備金）を【　　　　　　】という。\n例）配当100万円→利益準備金積立最低10万円（100万円×1/10：配当の10分の1は強制積立）義務。資本金1,000万円・合計目標250万円（1,000万円×1/4：資本金の4分の1になるまで）まで積立義務。\nポイント：【　　　】＝資本準備金（増資時の出資余剰）＋利益準備金（配当時の強制積立）。会社法で強制的に積立を義務付けた準備金（国が決めたルールで積まなければならない）。任意積立金（株主が自由に決める）とは区別。',
  '任意積立金': '株主総会の決議により任意に設定・取崩しができる利益剰余金の積立金を【　　　　　　】という。\n例）株主総会決議で将来の設備投資に備え「別途積立金50万円（将来の設備を買うための貯金）」を積立：（借）繰越利益剰余金50万円（利益を取り崩す） ／（貸）別途積立金50万円（専用の積立金として別に管理）。取崩し：（借）別途積立金50万円 ／（貸）繰越利益剰余金50万円（利益に戻す）。\nポイント：【　　　】は「株主総会で自由に積立・取崩しできる（使途を自由に決められる）」。法定準備金（資本準備金・利益準備金）は強制積立で取崩し要件あり（法律で決まっている）。',
  '自己株式': '発行済株式のうち会社が買い戻して保有している自社株で純資産のマイナス項目として計上される科目を【　　　　　　】という。\n例）自社株100万円分を買い戻し（市場で自分の会社の株を買い戻す）。仕訳①取得：（借）【　　　】100万円（純資産がマイナスになる：株主への払い戻しと同じ効果）／（貸）現金100万円（現金が出ていく）。仕訳②消却（株式を正式に消す）：（借）その他資本剰余金100万円（資本を減らす）／（貸）【　　　】100万円（資産がゼロになる）。仕訳③再売却（120万円で売却）：（借）現金120万円（高く売れた）／（貸）【　　　】100万円（取得原価）＋その他資本剰余金20万円（差益は資本剰余金：利益ではなく資本の増加）。\nポイント：【　　　】は「純資産のマイナス（会社が自分の株を持つのは実質的に株主への払い戻し）」→資産ではない。再売却時の差益は「利益ではなく資本剰余金（損益計算書に出さない）」。消却時の差損は「その他資本剰余金から控除」。',
  '新株予約権': '一定の行使価格で会社の新株を取得できる権利で行使時に資本金が増加し失効時には利益として計上される純資産の項目を【　　　　　　】という。\n例）ストック・オプション（社員に自社株を安く買う権利を与える制度）：従業員に「1株1,000円で100株買える権利」を付与→【　　　】10万円を純資産計上（権利の価値を負債でなく純資産に計上）。仕訳①付与時（費用計上）：（借）株式報酬費用10万円（費用：権利を付与したコスト）／（貸）【　　　】10万円（純資産に積む）。仕訳②行使時（株価2,000円のときに権利を使った）：（借）現金10万円（行使価格分を払い込む）＋【　　　】10万円（権利を使い消す）／（貸）資本金10万円＋資本準備金10万円（払込金額の1/2ずつ：資本に取り込む）。仕訳③失効時（権利が消えた）：（借）【　　　】10万円（純資産から消す）／（貸）【　　　】戻入益10万円（P/L収益：使われなかった分が利益になる）。\nポイント：【　　　】は純資産（負債ではない）。行使→資本金・資本準備金増加（お金が入り資本が増える）。失効→収益（【　　　】戻入益：権利が使われなかった分）。',
  '株主資本': '純資産のうち株主に帰属する部分（資本金・資本剰余金・利益剰余金・自己株式）の合計を【　　　　　　】という。\n例）純資産＝【　　　】（資本金500万円＋資本剰余金200万円＋利益剰余金300万円－自己株式▲50万円：株主が直接持っている部分）＋評価・換算差額等（その他有価証券評価差額金30万円：時価変動による差額）。\nポイント：純資産のうち「株主に帰属する部分（株主が実際に出資・蓄積した分）」が【　　　】。評価差額等（その他有価証券評価差額金）は純資産に含まれるが【　　　】には含まれない（市場変動による不確かな分）。',
  '配当': '会社が獲得した利益の一部を株主に分配することで繰越利益剰余金を減少させ株主への利益還元を実現する行為を【　　　　　　】という。\n例）株主総会で1株50円・発行済み200万株の【　　　】決議（株主への利益分配の決定）→【　　　】総額1億円。同時に利益準備金として【　　　】額の10%（1,000万円）を強制積立（資本金×1/4に達するまで法律で義務付けられている積立）。仕訳①決議時：（借）繰越利益剰余金1.1億円（過去の積み上げ利益から支払う）／（貸）未払【　　　】金1億円（株主への未払：まだ払っていない）＋利益準備金1,000万円（法定積立）。仕訳②支払時：（借）未払【　　　】金1億円（負債を消す）／（貸）現金1億円（実際に株主へ支払い）。\nポイント：【　　　】と同時に「利益準備金の積立（【　　　】額×1/10）」が義務（法律で決まっているルール）。利益準備金＋資本準備金が「資本金×1/4」に達したら積立不要。中間【　　　】は取締役会決議で実施可能（株主総会を経なくてよい）。',
  '増資': '新株の発行などにより会社の資本金を増加させる行為を【　　　　　　】という。\n例）【　　　】（外部から新たに資金を集める）で新株1万株（1株1,000円・払込金額1,000万円）を発行し普通預金へ入金。仕訳①払込受取：（借）別段預金1,000万円（申込証拠金として専用口座：一般口座と混在させない専用口座）／（貸）株式申込証拠金1,000万円（負債：まだ正式な資本ではない）。仕訳②払込完了・資本組入：（借）株式申込証拠金1,000万円（負債を消す）／（貸）資本金500万円（払込額の1/2以上：法律で最低半分は資本金に）＋資本準備金500万円（残り）。同時：（借）普通預金1,000万円（一般口座へ移す）／（貸）別段預金1,000万円（専用口座を解除）。\nポイント：払込額の1/2以上を資本金に組入れ（残りは資本準備金：会社法の規定）。別段預金→専用口座（払込確認まで普通口座に混在させない：募集中の資金を一般資金と分ける）。',
  '発生主義': '収益・費用を現金の授受でなく経済的事実の発生した時点で認識する会計原則を【　　　　　　】という。\n例）3月決算・3月にサービス提供済みだが代金未受領の2万円→未収収益2万円を計上（【　　　】：お金が来ていなくても3月の収益として認識）。3月に費用支払い義務が発生したが未払い→未払費用として当期費用に計上（お金を払っていなくても3月の費用として認識）。\nポイント：【　　　】→実際のお金の動きに関係なく「経済的事実が発生した時点（サービスを提供した・受けた時点）」で収益・費用を認識する。現金主義（お金が動いた時点：実際に入出金した時点）とは異なる。',
  '現金主義': '収益・費用を現金が入出金した時点で認識する会計方法（企業会計では原則不採用）を【　　　　　　】という。\n例）【　　　】なら「代金を受け取った時に収益（お金が入ってきた時だけ収益）」「支払った時に費用（お金を払った時だけ費用）」。家計簿（個人の収支記録）が典型例。\nポイント：発生主義（企業会計の原則：提供した時点で収益）と対比：発生主義は3月の売上→3月収益、【　　　】は代金回収した月→収益（ずれる）。企業会計は発生主義が原則（より正確な期間損益計算のため）。【　　　】は資金管理には優れるが期間損益が歪む（利益の計算が実態とずれる）。',
  '費用収益対応の原則': '関連する収益と費用を同一の会計期間に対応させて計上する会計原則を【　　　　　　】という。\n例）商品の売上（収益：今期の稼ぎ）を計上するときは対応する仕入原価（費用＝売上原価：その商品を仕入れたコスト）を同じ期に計上する（稼ぎとコストを同じ期で対応させる）。期末の在庫は繰越商品（資産：来期以降に売れる商品）として翌期に繰り越す。\nポイント：費用は関連する収益と同じ期に対応させて計上する原則（同じ期の稼ぎに対応するコストを同じ期に計上）。製品保証引当金（将来の修理費を販売時に計上：販売時の収益と修理費を対応させる）も【　　　】に基づく。',
  '前払費用': '当期に費用を支払ったが翌期以降に対応する未経過分を資産計上する経過勘定を【　　　　　　】という。\n例）10月1日に保険料12万円を1年分前払い（3月決算）→翌4〜9月分6万円が未経過（まだサービスを受けていない分）：（借）【　　　】6万円（翌期分を資産として繰り延べる） ／（貸）支払保険料6万円（今期の費用から除く）（期末繰延べ）。翌期4月1日に再振替（資産を費用に戻す）：（借）支払保険料6万円 ／（貸）【　　　】6万円。\nポイント：【　　　】＝「お金は払ったがサービスはまだ受けていない（来期以降に受ける）」部分→資産（将来の費用として取っておく）。前受収益（収益側の裏：お金は受け取ったがサービスはまだ提供していない）とセットで覚える。',
  '前受収益': '当期に収益を受け取ったが翌期以降に対応する未経過分を負債計上する経過勘定を【　　　　　　】という。\n例）10月1日に家賃1年分12万円を受取（3月決算）→翌4〜9月分6万円が未経過（まだサービスを提供していない分）：（借）受取家賃6万円（今期の収益から除く） ／（貸）【　　　】6万円（翌期分を負債として繰り延べる）（期末繰延べ）。翌期4月1日に再振替（負債を収益に戻す）：（借）【　　　】6万円 ／（貸）受取家賃6万円。\nポイント：【　　　】＝「お金は受け取ったがサービスはまだ提供していない（来期以降に提供する）」部分→負債（まだ果たしていない義務）。前払費用（費用側：払ったがサービスはまだ受けていない）とセットで覚える。',
  '未払費用': '当期に発生した費用のうちまだ支払っていない部分を見越し計上する負債科目を【　　　　　　】という。\n例）3月決算・2〜3月分の給料20万円が未払（サービスは受けたがまだ払っていない）→（借）給料20万円（今期の費用として計上：サービスは受けている） ／（貸）【　　　】20万円（後で払う義務が生じる）（見越し計上）。4月に支払い：（借）【　　　】20万円（義務を消す） ／（貸）現金20万円（再び給料計上しない：今期費用はすでに認識済み）。\nポイント：【　　　】＝「サービスは受けたがまだ払っていない（払う義務がある）」→負債（後で払う必要がある）。未収収益（収益側の裏：サービスは提供したがまだ受け取っていない）とセットで覚える。',
  '未収収益': '当期に発生した収益のうちまだ受け取っていない部分を見越し計上する資産科目を【　　　　　　】という。\n例）3月決算・2〜3月分の家賃収入2万円が未入金（サービスは提供したがまだ受け取っていない）→（借）【　　　】2万円（後でもらえる権利が生じる） ／（貸）受取家賃2万円（今期の収益として計上：サービスは提供している）（見越し計上）。4月に受取：（借）現金2万円 ／（貸）【　　　】2万円（権利を消す：再び受取家賃計上しない：今期収益はすでに認識済み）。\nポイント：【　　　】＝「サービスは提供したがまだ受け取っていない（もらえる権利がある）」→資産（後でもらえる）。未払費用（費用側：サービスを受けたがまだ払っていない）とセットで覚える。',
  '継続性の原則': '一度採用した会計処理の方法・手続きを毎期継続して適用する会計原則を【　　　　　　】という。\n例）前期から定額法（毎年同額の減価償却）を使って減価償却していた建物を当期から突然定率法（初期が多い減価償却）に変更→【　　　】に違反する可能性（正当な理由がなければ変更不可：恣意的な変更を禁止）。\nポイント：【　　　】→一度採用した会計処理方法を毎期継続して適用する（コロコロ変えない）。理由なく変更すると恣意的な利益操作が可能になるため禁止（変えることで利益を意図的に増減できてしまう）。',
  '保守主義の原則': '将来の損失・費用は早期に認識し・将来の収益は慎重に扱う会計原則を【　　　　　　】という。\n例）商品の時価が下落した時→低価法で評価損を認識（損失を早期に計上：悪いことは早めに認識）。固定資産の減損→早期に損失認識（値下がり損を早めに計上）。\nポイント：保守主義＝「利益は慎重に（確実なものだけ）、損失は早めに（可能性があれば早期に計上）」。不確実な利益を先取りせず（まだ確実でない利益を計上しない）、発生可能性のある損失は早期に認識する姿勢。過度な保守主義（故意に利益を少なく見せる：意図的な過小計上）は禁止。',
  '重要性の原則': '金額的・質的に重要性が低い項目には本来の厳密な処理でなく簡便な処理を認める会計原則を【　　　　　　】という。\n例）10万円未満の固定資産→消耗品費で即費用処理（原則は固定資産計上だが金額が少額のため簡略処理）。切手の未使用分が数百円なら貯蔵品計上せず全額費用に（金額が重要でないため正確な処理をしなくてよい）。\nポイント：重要性が高いもの→原則通り厳格に処理（正確さが必要）。重要性が低いもの→簡便な処理が許容される（コスト対効果：手間をかける価値がない場合は簡略可）。簡便処理は「恣意的な判断（意図的な操作）」ではなく「合理的な判断（コストと効果のバランス）」。',
  '繰延資産': '支出済みだが将来の効果に対応させるために資産として繰り延べる項目を【　　　　　　】という。\n例）創立費50万円（会社設立時の費用：登記費用等）（5年均等償却：5年間で費用化）・開業費60万円（事業開始前の費用：広告・人件費等）（5年均等）・株式交付費200万円（株式発行の費用）（3年均等）。毎年均等額を費用化（分割して費用にしていく）。\nポイント：【　　　】は「すでに支出済みだが将来にわたり効果がある費用（将来への投資）」を資産計上する項目（厳密には資産の要件を満たさない特例）。特別に資産として扱われる5種類（創立費・開業費・株式交付費・社債発行費・開発費）。',
  '消費税（税込処理）': '消費税を取引金額に含めて記帳し期末に納付額を費用として処理する方式を【　　　　　　】という。\n例）商品110万円（税込：消費税10万円を含む金額）を仕入：（借）仕入110万円（消費税10万円も仕入のコストとして含める） ／（貸）買掛金110万円。期末に消費税納付額が確定したら→租税公課（費用：税金のコスト）として計上。\nポイント：税込処理→消費税を仕入・売上に含めて記帳（消費税を区別しない）。期末に差額を確定→納付分は租税公課。税抜処理→仮払・仮受で区分記帳→期末に相殺して納付（未払消費税）（消費税を別途管理する）。',
  '消費税（税抜処理）': '消費税を仮払・仮受で区分計上し期末に相殺して差額を納付する方式を【　　　　　　】という。\n例）商品110万円（税込）を仕入（税抜処理）：（借）仕入100万円（税抜の本体価格）・仮払消費税10万円（後で戻ってくる消費税の立替払い） ／（貸）買掛金110万円。販売時（税込220万円）：（借）売掛金220万円 ／（貸）売上200万円・仮受消費税20万円（預かった消費税）。期末：（借）仮受消費税20万円 ／（貸）仮払消費税10万円・未払消費税10万円（差額が国に払う消費税）。\nポイント：税抜処理→消費税を別途計上（消費税を明確に区別して管理）→P/Lの金額が税抜きになる（実態を正確に反映）。',
  '税効果会計': '会計上の利益と課税所得の差異による税負担のズレを繰延税金資産・負債を用いて調整する会計処理を【　　　　　　】という。\n例）会計利益1,000万円・税務上の課税所得1,200万円（差異200万円：貸倒引当金超過が原因。会計では費用なのに税務はまだ認めない分）、税率30%。実際納税額：1,200万円×30%＝360万円（多すぎる税金）。繰延税金資産：200万円×30%＝60万円を計上（将来戻ってくる税金の前払い分）。仕訳）（借）繰延税金資産60万円（将来の節税額という資産）／（貸）法人税等調整額60万円（法人税等を60万円減らす：実態に合った税負担に調整）。P/L：法人税等360万円（実際の納税）／ 法人税等調整額△60万円（調整：節税分を差し引く）→実効税負担300万円（1,000万円×30%：本来あるべき税負担）。\nポイント：【　　　】の目的は「会計利益×税率＝P/L上の税金負担（損益計算書の税金費用が会計利益に対応するようにする）」にすること。繰延税金資産は「払いすぎた税金の将来返金（将来安く払える権利）」のイメージ。',
  '一時差異': '資産・負債の会計上の帳簿価額と税務上の金額の差で将来解消される差異を【　　　　　　】という。\n例①将来減算【　　　】（将来に課税所得が減る差異））貸倒引当金20万円（会計費用→税務：今期認めない→将来認定：いつか費用として認められる）→繰延税金資産（将来節税：将来に税金を安く払える権利）。例②将来加算【　　　】（将来に課税所得が増える差異））その他有価証券評価益100万円（会計収益→税務：売却時に課税：売ってから税金を払う）→繰延税金負債（将来税負担増：将来に余分に税金を払う義務）。例③永久差異（ずっと解消されない差異））交際費超過額50万円（永遠に損金不算入：どの年度でも税務上認められない）→税効果会計の対象外（繰延処理できない）。\nポイント：【　　　】＝「時期のズレ（今は違うが将来に解消する）」→税効果会計の対象。永久差異＝「永遠に解消されないズレ（ずっと違いが残る）」→税効果会計の対象外。この区別が【　　　】理解の核心。',
  '法人税の中間申告': '事業年度途中に法人税の概算額を前払いする制度を【　　　　　　】という。\n例）12月決算法人：前期の法人税300万円の1/2（150万円）を中間申告・納付（年度の半分が終わったら概算で前払いする）：（借）仮払法人税等150万円（前払いした税金の資産） ／（貸）現金150万円。12月末確定額280万円なら：（借）法人税等280万円 ／（貸）仮払法人税等150万円（前払い分を消す）・未払法人税等130万円（残りを後で払う）。\nポイント：中間申告は「前期実績の1/2（簡単な方法）」または「仮決算（実際に計算する方法）」のどちらかを選択可能。前払いした中間申告額→仮払法人税等（資産：後で精算される）。',
  '繰越欠損金': '当期に生じた税務上の欠損金を翌期以降10年間繰り越して将来の課税所得と相殺できる制度を【　　　　　　】という。\n例）今期の税務上の欠損（赤字：税務計算上の損失）1,000万円→【　　　】1,000万円として税務上繰り越す（将来の黒字と相殺するために取っておく）。税効果：繰延税金資産1,000万円×30%＝300万円を計上（将来使える節税額）。仕訳）（借）繰延税金資産300万円（将来の節税権利）／（貸）法人税等調整額300万円（税金費用を減らす）。翌期課税所得800万円：【　　　】800万円を使い→課税所得ゼロ（赤字と相殺して税金ゼロ）→法人税ゼロ。繰延税金資産240万円を取崩し（使い切った分だけ資産を減らす）。\nポイント：【　　　】の繰延税金資産は「将来利益が出た時に使える節税カード（赤字が将来の黒字を減らしてくれる権利）」。ただし「回収可能性（将来利益が出るかどうか：本当に使えるか）」が不確かなら資産計上できない（赤字続きなら節税の見込みがないので資産にできない）。この判断が試験で問われる。',
  '入金伝票': '現金が入金された取引を記録するために使用する伝票で3伝票制（入金・出金・振替の3種類）において現金収入取引を他の取引と分けて記録するものを【　　　　　　】という。\n例）商品100万円を現金で販売 → 【　　　】に「売上100万円（現金が入ってきた原因）」と記録。\nポイント：現金が入金される取引（現金の受け取りがある）のみに使用。現金が出るなら出金伝票（現金を支払う取引）、現金が動かないなら振替伝票（現金以外の取引）。',
  '出金伝票': '現金が出金された取引を記録するために使用する伝票で3伝票制において現金支出取引を他の取引と分けて記録するものを【　　　　　　】という。\n例）消耗品5,000円を現金で購入（現金を払って文房具等を買った）→ 【　　　】に「消耗品費5,000円（現金が出ていった原因）」と記録。\nポイント：現金の出金がある取引（現金を支払う）のみに使用。入金は入金伝票（現金を受け取る）、現金以外は振替伝票（現金が動かない取引）。',
  '振替伝票': '現金取引以外の振替取引（掛取引・未払計上等）を記録するために使用する伝票を【　　　　　　】という。\n例）商品100万円を掛けで仕入れた（現金は動かない）→ 【　　　】に「（借）仕入100万円（費用が発生） ／（貸）買掛金100万円（後で払う義務が生じる）」と記録。\nポイント：現金が動かない取引（掛取引・振替等）はすべて【　　　】。入金・出金伝票に含まれない全ての取引を記録する（現金が関係しない全取引）。',
  '本支店会計': '本店と支店がそれぞれ独立した帳簿を持ち本社・支店間の取引を内部勘定で処理する会計制度を【　　　　　　】という。\n例）本店が支店に商品100万円（原価80万円）を送付（本店から支店へ商品を移す）。本店仕訳：（借）支店100万円（支店への債権として記録）／（貸）仕入（商品）80万円＋内部利益20万円（本店から支店への利益を記録）。支店仕訳：（借）仕入100万円（本店から仕入れたとして記録）／（貸）本店100万円（本店への債務として記録）（本店から受け取ったとして処理）。合算時の消去：①本店勘定↔支店勘定を相殺消去（内部の貸し借りを消す）。②内部利益20万円を消去（本店→支店の未実現利益：外部に売れるまで利益にならない）。\nポイント：【　　　】の合算処理で最重要なのは「内部利益の消去（本店が支店に付けた利益をなかったことにする）」。支店がまだ外部に売っていない商品に含まれる本店から付けた利益は合算時に消去する（外部に売るまでは利益として認めない）。',
  '内部取引の消去': '本支店合算財務諸表作成の際に内部の債権債務を相殺除去する手続きを【　　　　　　】という。\n例）本店の支店勘定100万円（本店B/Sの資産：支店への貸付みたいなもの）と支店の本店勘定100万円（支店B/Sの負債：本店への借入みたいなもの）を相殺消去（内部の債権と債務を消す）。合算仕訳：（借）本店勘定100万円（支店のB/Sから消す）／（貸）支店勘定100万円（本店のB/Sから消す）（双方消去）。消去しないと：合算B/Sに架空の「資産100万円・負債100万円」が残り財務諸表が膨らむ（実態より大きく見えてしまう）（実態と異なる）。\nポイント：本支店会計の合算で必ず行う消去は①本店勘定↔支店勘定の相殺（内部の貸し借りを消す）②内部利益の消去（未達取引があれば追加記帳後に消去：先に未達を処理してから消去）。「内部の貸し借りを外から見えないようにする（グループ内のやり取りを消す）」作業。',
  '未達取引': '本店・支店間の取引で一方が記帳済みだが他方にまだ情報が届いていない取引を【　　　　　　】という。\n例）本店が支店へ商品50万円を発送・本店は記帳済み（本店は送ったと記録した）。支店には届いていない（未達：まだ支店に到着していない）。合算前の処理（支店側）：（借）仕入50万円（支店が受取ったとして先に仕訳を追加記帳）／（貸）本店50万円（本店への債務として記録）→これで本店・支店双方の帳簿が対応する（両方同じ内容になる）。通常の内部取引消去を実施：本店勘定50万円↔支店勘定50万円を相殺（内部の貸し借りを消す）。\nポイント：【　　　】の処理手順：①未達側で「受け取ったor支払ったとして」仕訳追加（届いていないが届いたとして先に記録する）→②通常の内部取引消去を実施（普通の内部消去手順を適用）。「合算前に未達を解消してから相殺（先に両方の帳簿を合わせてから相殺する）」が正しい手順。',
  '内部利益': '本支店間の商品売買などでグループ内部に含まれる未実現の利益を【　　　　　　】という。\n例）本店が原価80万円の商品を100万円で支店へ売却（グループ内で20万円の利益が出たように見える）。支店はまだ外部に未販売（在庫中：外部のお客さんにはまだ売っていない）。【　　　】：20万円（100万円－80万円）が支店の在庫に含まれている（在庫の帳簿価額が実際の原価より20万円高い）。合算時の消去仕訳：（借）本店売上100万円（グループ内の売上を消す）／（貸）支店仕入100万円（グループ内の仕入を消す）（売上・仕入の相殺）。（借）【　　　】20万円（利益を消す）／（貸）支店商品20万円（在庫の過大評価部分を消去：在庫を原価80万円に戻す）。消去後：支店の在庫は原価80万円（実態：本当のコスト）に修正される。\nポイント：【　　　】は「グループ外部への販売が完了するまで利益として認められない（外部に売れたら初めて利益）」。支店が外部に販売した時点で初めて利益が実現する。',
  '原価計算': '製品の製造にかかった費用を材料費・労務費・経費の3要素に分類して集計・計算する手続きを【　　　　　　】という。\n例）製品A1個の【　　　】：直接材料費500円（鉄板：素材費：製品に直接使う材料のコスト）＋直接労務費300円（加工作業員賃金：製品を加工する作業員の給与）＋製造間接費配賦額200円（工場電気代・工場長給与等の按分：複数製品に共通するコストを割り振った分）＝製品原価1,000円。販売価格1,500円→粗利500円（原価の上に乗せた利益）。\nポイント：製造原価の3要素：①材料費（モノのコスト：素材・部品のコスト）②労務費（ヒトのコスト：工場従業員の賃金）③経費（上記以外のコスト：機械の減価償却・電気代等）。それぞれを「直接費（製品への直接賦課：どの製品に使ったか直接わかる）」と「間接費（配賦が必要：複数製品に共通するので割り振りが必要）」に分類する二次元の分類が【　　　】の基本骨格。',
  '原価の3要素': '製造原価を構成する「材料費・労務費・経費」の3つの分類を【　　　　　　】という。\n例）自動車1台の製造原価：材料費60万円（鋼板・タイヤ・バッテリー等：製品を構成するモノのコスト）＋労務費30万円（工場作業員の賃金・賞与・法定福利費：工場で働く人のコスト）＋経費20万円（機械減価償却費・工場電気代・外注加工費等：モノとヒト以外の全コスト）＝製造原価110万円。\nポイント：材料費は「モノを使う（消費する）」コスト（材料の購入・使用）。労務費は「人が働く（作業する）」コスト（賃金・給与・社会保険料）。経費は「それ以外のすべて（機械・光熱費・外注等）」のコスト（モノとヒト以外）。各費用を直接費・間接費に分けることで仕掛品への賦課（どの製品にいくらかを割り当てる）と製造間接費への集約（共通コストをまとめる）が決まる。',
  '直接費': '特定の製品に直接割り当てられる原価を【　　　　　　】という。\n例）製品Aに使った鉄板（直接材料費：製品Aに使ったと特定できる材料）・製品Aの製造ラインで働いた作業員の賃金（直接労務費：製品Aに関わった人件費）など。\nポイント：「どの製品に使ったか（どの製品のコストか）」が明確なため配賦計算（割り当て計算）が不要（直接加算できる）。間接費は配賦基準（作業時間・機械時間等）で各製品に案分が必要（誰の分かわからないから割り当てる）。',
  '間接費': '複数の製品に共通して発生し特定の製品に直接割り当てられない原価を【　　　　　　】という。\n例）工場全体の電気代（どの製品の電気かわからない）・工場長の給与（工場全体の管理）・機械の減価償却費（複数製品に使う機械のコスト）など → 製品A・B・Cに何%ずつ使ったかわからないため、作業時間比率などで各製品に配賦（割り当てる）。\nポイント：複数の製品に共通して発生し特定製品に直接割り当てられない（誰の分かわからない）。配賦基準（作業時間・機械時間等）で案分が必要（合理的な方法で割り当てる）。',
  '配賦': '間接費を一定基準で各製品・部門に割り当てる手続きを【　　　　　　】という。\n例）製造間接費100万円（どの製品の分かわからない共通費）を直接作業時間（製品A：60時間・製品B：40時間）で【　　　】 → A：60万円（100万円×60%：Aの比率）・B：40万円（100万円×40%：Bの比率）を各製品原価に加算。\nポイント：作業時間比率・面積比・人数比など合理的な基準を選ぶ（実態に合った割り当て方を選ぶ）。',
  '予定配賦': '年度初めに設定した予定配賦率を使って製造間接費を製品に割り当てる方法を【　　　　　　】という。\n例）年度初めに「直接作業時間1時間当たり1,000円の製造間接費を配賦する（【　　　】率：あらかじめ設定した1時間当たりのコスト）」と設定→ 実際作業時間×1,000円で月次に製品原価を計算（月ごとに素早く計算できる）→ 期末に実際発生額との差（配賦差異：予定と実際の差）を調整。\nポイント：実際原価確定前に迅速に計算できるが配賦差異が生じる（予定が実際とずれる）。',
  '配賦差異': '予定配賦額と製造間接費の実際発生額との差額を【　　　　　　】という。\n例）予定配賦額100万円（あらかじめ割り当てた分）・実際発生額110万円（実際にかかった分）→ 【　　　】10万円（不利差異：10万円多くかかった：追加計上が必要）→ 年度末に売上原価等へ振替（差額を費用に修正する）。\nポイント：実際＞予定なら不利差異（多くかかった：予定より悪い）、実際＜予定なら有利差異（少なく済んだ：予定より良い）。',
  '個別原価計算': '特定の製造指図書ごとに原価を集計する方法を【　　　　　　】という。\n例）建築・造船・特注機械（1つ1つが違う注文製品）→製品ごとに「製造指図書№001（この製品はこの番号で管理）」のように番号をつけて原価を集計。№001の指図書：直接材料費200万円（この製品に直接使った材料）＋直接労務費100万円（この製品を作るのにかかった作業員の給与）＋製造間接費配賦額80万円（作業時間基準で配賦：共通コストの割り当て）＝製品原価380万円。仕訳）製造指図書№001の完成：（借）製品380万円（完成品として在庫計上）／（貸）仕掛品380万円（指図書別集計額を製品へ：完成したので仕掛品から製品へ移す）。\nポイント：【　　　】→「一品一様（1つずつ違う製品を作る）」の受注生産向け。各指図書が独立した原価計算対象（番号ごとに別々に管理）。対比：総合原価計算（同じ製品を大量に作る）→「同一品種の大量連続生産」向け。どちらの方法を使うかは生産形態で決まる。',
  '総合原価計算': '同種製品を大量・連続生産する場合に一定期間の総製造費用を完成品数量で割って単位原価を求める方法を【　　　　　　】という。\n例）月産1万本の飲料水（同じ製品を大量に作り続ける）。月間製造費用：材料費500万円＋労務費300万円＋製造間接費200万円＝1,000万円。月末仕掛品（加工進捗50%：半分まで加工が進んでいる未完成品）が1,000本。完成品換算量：完成品9,000本＋仕掛品500本（1,000本×50%：半分できているので0.5本分に換算）＝9,500本。単位原価1,000万円÷9,500本≒1,053円/本（1本あたりのコスト）。\nポイント：【　　　】の核心は「月末仕掛品をどう評価するか（未完成品にコストをどう割り振るか）」。材料費は投入時点で全量計上（製造開始時に全部入れる場合など）→進捗度関係なし。加工費は進捗度に応じて計算→完成品換算量を使う（どこまで加工したかで計算）。この区別が必出。',
  '標準原価計算': 'あらかじめ設定した標準原価と実際原価を比較して差異分析を行う原価計算方法を【　　　　　　】という。\n例）製品1個の標準原価（目標のコスト）：材料費（標準単価1,000円×標準消費量0.5kg）500円＋賃金（標準賃率1,500円×標準時間0.2時間）300円＋製造間接費200円＝1,000円/個（目標原価）。実際原価が1,100円（実際にかかったコスト）→差異100円（目標と実績のズレ）。差異の分解（なぜズレたのかを分析）：材料費差異（価格差異：単価のズレ＋数量差異：消費量のズレ）、労務費差異（賃率差異：時給のズレ＋作業時間差異：作業時間のズレ）、製造間接費差異（予算差異＋能率差異＋操業度差異：工場の効率と稼働率のズレ）に分解して原因を特定。仕訳）仕掛品は標準原価で計上：（借）仕掛品1,000円（目標コスト）／（貸）材料500円・賃金300円・製造間接費200円。差異は別科目で管理（実際とのズレを別に把握）。\nポイント：【　　　】は「目標管理ツール（予算通りに製造できているかを管理する）」。差異の借方（不利差異：目標より悪い）・貸方（有利差異：目標より良い）の区別を確実に押さえること。',
  '不利差異': '製造コストが想定以上にかかったことを示す差異を【　　　　　　】という。\n例）材料を予定より高く仕入れた（価格上昇：材料費が予定より多くかかった）・作業ミスで材料を無駄遣いした（使用量超過：予定より多く使った）→ 【　　　】（借方差異：コストが予定を超えた）。\nポイント：実際原価が標準原価・予算を超過した場合（予定より悪い）。有利差異（実際＜標準：予定より良い）と逆。',
  '有利差異': '実際原価が標準原価を下回り利益を増加させる方向の差異を【　　　　　　】という。\n例）材料を予定より安く仕入れられた（価格低下：材料費を予定より少なく抑えた）・作業効率が上がって時間が短縮できた（作業時間短縮：予定より少ない時間で完成）→ 【　　　】（貸方差異：コストが予定を下回った）。\nポイント：実際原価が標準原価・予算を下回った場合（予定より良い）。「良いことだがなぜ良かったのか（どこで改善できたか）」の原因分析も重要。不利差異（実際＞標準：予定より悪い）と逆。',
  'CVP分析': '原価（Cost）を固定費・変動費に分けて売上高（Volume）・原価・利益（Profit）の関係を分析する意思決定手法を【　　　　　　】という。\n例）固定費200万円（売上に関わらず必ずかかるコスト）・変動費率60%（売上の60%がコストになる）。①損益分岐点売上高（利益がゼロになる売上高）＝固定費÷（1－変動費率）＝200万円÷0.4＝500万円。②目標利益100万円のための売上高＝（200万円＋100万円）÷0.4＝750万円。③安全余裕率（どれだけ売上が下がっても大丈夫か）：実際売上600万円なら＝（600万円－500万円）÷600万円≒16.7%。\nポイント：【　　　】では「限界利益率＝1－変動費率（売上のうちコストを除いた部分の割合）」が核心。試験では①損益分岐点売上高②目標利益売上高③安全余裕率の3つの計算が頻出。',
  '損益分岐点': '売上高と総費用が一致して利益がゼロになる売上水準を【　　　　　　】という。\n例）固定費200万円・変動費率60%。【　　　】売上高（利益＝0になる売上額）＝200万円÷（1－0.6）＝500万円。【　　　】販売量（単価2,000円なら）＝500万円÷2,000円＝2,500個（何個売れば損もしないか）。確認：売上500万円・変動費300万円（60%）・固定費200万円→利益＝0円 ✓（ちょうど収支トントン）。\nポイント：【　　　】は「固定費÷限界利益率（固定費を1円の利益でどれだけ積み上げれば回収できるか）」で求める。固定費が増えると【　　　】が上昇（より多くの売上が必要になる）。変動費率が低いほど（限界利益率が高いほど：1円売るごとに手元に残る率が高い）【　　　】が下がる。',
  '貢献利益': '売上高から変動費を差し引いた利益で固定費の回収と利益獲得に「貢献」する部分を【　　　　　　】という。\n例）製品A：単価2,000円・単位変動費1,200円→単位【　　　】800円（1個売るごとに固定費回収に使える利益）。月間1,000個販売→【　　　】80万円（固定費回収のための総利益）。固定費60万円→営業利益20万円（【　　　】で固定費を回収した残り）。追加受注の意思決定（別の注文を受けるべきか）：変動費1,200円以上の価格なら受注すべき（固定費はすでに発生しているため：追加で固定費はかからない）。単価1,500円の特別受注→単位【　　　】300円でプラスになるから受注OK（1個当たり300円の利益が追加で得られる）。\nポイント：【　　　】（限界利益）は「固定費をまず回収し、その後が利益になる（まず固定費を埋めてから利益が出る）」という考え方。短期の意思決定（追加受注・製品廃止）は「変動費が回収できるか（少しでもプラスになるか）」で判断→固定費は埋没原価（すでに発生して取り返せないコスト）として無視する。',
  '直接原価計算': '変動製造原価のみを製品原価とし固定製造間接費を期間費用として一括処理する方法を【　　　　　　】という。\n例）【　　　】（管理会計用の損益計算書）：売上高1,000万円－変動売上原価600万円（変動製造原価のみ：製品1個ごとに発生するコスト）＝限界利益400万円（売るほど増える利益の総量）－固定製造間接費200万円（一括期間費用：この期間に全額費用化）－固定販管費50万円＝営業利益150万円。\nポイント：【　　　】→固定費を期間費用に（その期に全額費用化）→在庫が増えても利益に影響しない（在庫に固定費が隠れない）→経営管理・意思決定に使う（内部向け：社内の判断に使う）。全部原価計算→固定費を製品原価に（在庫に固定費が含まれる）→外部財務報告に使う（外部向け：投資家への報告）。財務報告では【　　　】は使えない（制度会計では全部原価計算が必要：財務諸表には全部原価計算が必要）。',
  '全部原価計算': '固定製造間接費も含む全製造原価を製品原価として計算する方法を【　　　　　　】という。\n例）【　　　】での固定費300万円の処理：製品原価に含める（在庫にも固定費が入る）→在庫100万円増加の中に固定費30万円が含まれる（在庫として資産に）→P/Lに計上されない（在庫の中に留まる：売れるまで費用にならない）→利益が30万円多く見える（固定費を費用化しなかった分だけ利益が増える）。直接原価計算なら→固定費300万円を全額当期費用に（全部この期に費用化）→利益は30万円少なくなる。\nポイント：「【　　　】の営業利益＞直接原価計算の営業利益」の場合は期末在庫増加（固定費が在庫に隠れている：売れていない在庫に固定費が含まれている）。この差が「固定費調整（2つの計算方法の利益の差を説明する）」。試験では固定費調整の計算（直接原価→全部原価の利益換算）が頻出。',
  '固定費調整': '直接原価計算と全部原価計算の営業利益の差を期首・期末在庫の固定費増減分で調整する手続きを【　　　　　　】という。\n例）直接原価計算の営業利益800万円（固定費を全額費用化した利益）。期末在庫に含まれる固定費150万円（全部原価計算では費用化されていない：在庫の中に隠れている分）、期首在庫に含まれる固定費100万円（全部原価計算では当期費用化：売れた製品に含まれていた固定費）。【　　　】：800万円＋150万円（期末在庫の固定費を加算：全部原価計算は費用化しないので足す）－100万円（期首在庫の固定費を控除：全部原価計算は費用化するので引く）＝全部原価計算の営業利益850万円。\nポイント：【　　　】の方向→「直接→全部：期末在庫固定費を加算・期首在庫固定費を控除」。「期末に固定費が在庫に残っている＝利益がその分多い（全部原価の方が利益が大きい）」が記憶のコツ。',
  '製造原価報告書': '当期に発生した材料費・労務費・経費の内訳と当期製品製造原価を報告する明細書を【　　　　　　】という。\n例）【　　　】（製造業の原価明細書）：直接材料費2,000万円＋間接材料費200万円＝材料費2,200万円（原材料のコスト）。労務費1,800万円（工場従業員の賃金等）。製造間接費1,000万円（電気代・機械減価償却費等）。＝当期製造費用5,000万円（今期に工場で発生した全コスト）。＋期首仕掛品200万円（前期から引き継いだ未完成品のコスト）－期末仕掛品300万円（今期末の未完成品のコスト）＝当期製品製造原価4,900万円（今期に完成した製品の総コスト）。\nポイント：【　　　】→損益計算書→B/Sの流れを把握（製造原価がどこへ流れていくかを追う）。「当期製品製造原価（完成品のコスト）」がP/Lの「売上原価（売った分のコスト）」の計算に入っていく。売上原価＝期首製品在庫＋当期製品製造原価－期末製品在庫。',
  '当期製品製造原価': '当期に製造が完了した製品に集計された製造原価の合計を【　　　　　　】という。\n例）期首仕掛品原価200万円（前期から引き継いだ未完成品）＋当期製造費用5,000万円（今期に工場で発生した全コスト）＝当期製造に関する費用合計5,200万円。そこから期末仕掛品原価300万円（今期末に未完成の分：次期へ持ち越す）を引く＝【　　　】4,900万円（完成して製品在庫になった分）。P/Lの売上原価：期首製品在庫400万円（前期から引き継いだ完成品）＋【　　　】4,900万円－期末製品在庫500万円（今期末の完成品在庫）＝売上原価4,800万円（実際に売れた分のコスト）。\nポイント：製造業の原価計算の「最終目標値（この数字を求めるために計算する）」が【　　　】。仕掛品（未完成）と製品（完成品）の期首・期末の調整が計算のポイント（完成した分だけを製品として認識）。計算式＝期首仕掛品＋当期製造費用－期末仕掛品。',
  '完成品換算量': '仕掛品の加工進捗度を考慮して完成品何個分に相当するかを換算した数量を【　　　　　　】という。\n例）月末仕掛品100個（まだ完成していない製品）・加工進捗度60%（60%まで加工が進んでいる）→加工費の【　　　】60個（100個×60%：完成品の60個分に相当するコストがかかっている）。材料費は投入時点で全量投入（製造開始時に全部の材料を入れる場合など）（進捗度関係なし）→月末仕掛品100個のままで計算（換算しない）。加工費の配分：（完成品1,000個＋月末仕掛品換算量60個）で総加工費を按分（完成品と未完成品にコストを割り振る）。月末仕掛品への加工費＝総加工費×60÷1,060（換算量の比率で割り振る）。\nポイント：材料費は「投入タイミング（工程の始点・終点・均等等）」で按分するため換算量は使わない場合が多い（材料を入れた時点で全額がかかっている）。加工費は「どれだけ加工したか（進捗度）」で按分するため換算量を使う（作業した分だけコストがかかる）。この区別が総合原価計算の核心。',
  '月末仕掛品の評価': '総合原価計算において期末未完成品に配分する原価を平均法・先入先出法などで計算する手続きを【　　　　　　】という。\n例）当月製造費用1,000万円、期首仕掛品原価100万円、完成品1,000個、月末仕掛品100個（進捗度50%→換算量50個）。平均法（期首と当月を混ぜて平均する）：総原価1,100万円÷（1,000個＋50個）＝1,048円/個（換算量1個当たりのコスト）。月末仕掛品原価＝1,048円×50個＝5.24万円（未完成品に割り当てるコスト）。完成品原価＝1,100万円－5.24万円＝1,094.76万円（完成品のコスト）。先入先出法（期首仕掛品を先に完成させてから当月分を計算）：期首仕掛品は先に完成したとして計算→月末仕掛品の原価は当月費用のみから算定（期首分を除いて計算）。\nポイント：平均法→「期首＋当月」で平均→計算がシンプル（一緒に計算）。先入先出法→「期首と当月を分けて計算（古いものから先に完成）」→当月の成果が純粋に見える。試験では平均法が多く出題される。',
  '等級別総合原価計算': '同一の製造工程から異なる等級・規格の製品が生産される場合に等価係数を用いて総合原価を各等級に配分する方法を【　　　　　　】という。\n例）同一工程で特大・大・小サイズのシャツを製造（同じ生産ラインで大きさだけ違う製品）。等価係数（大きさに応じたコスト比率）：特大1.5・大1.0・小0.7に設定。各等級の完成品数：特大200枚・大500枚・小800枚。積数（等価係数×完成品数：コスト按分の基準）：特大300・大500・小560＝合計1,360。総合原価13,600円÷1,360×各積数で各等級の原価を算定（積数の比率でコストを割り振る）。特大原価：13,600円×300÷1,360＝3,000円→1枚15円（特大1枚のコスト）。\nポイント：等価係数は「単位当たりのコスト比（大きさやコストの比率）」。積数（等価係数×生産量）で総原価を按分する（比率に応じてコストを分ける）。組別（製品種類が全く異質）との違いを押さえる（等級別：同じ製品の大小違い）。',
  '組別総合原価計算': '異なる種類の製品（組）を同一工場で製造する場合に組ごとに直接費を集計し製造間接費を配賦して原価を計算する方法を【　　　　　　】という。\n例）同一工場でシャンプーとリンス（全く異なる製品）を製造（組A：シャンプー・組B：リンス）。直接材料費：A組500万円・B組300万円（それぞれ直接わかるコスト）。製造間接費200万円を直接材料費比率（5：3）で配賦（共通コストを比率で割り振る）：A組125万円・B組75万円。各組の製造原価：A組625万円・B組375万円（各製品グループのコスト）。\nポイント：等級別（大中小など量的な違い）→同じ製品を大中小に分ける（量的差異：サイズが違う同じ製品）。組別（全く異なる製品を作る）→全く異なる種類の製品（質的差異：別々の製品）。配賦基準には直接材料費・直接労務費・機械時間等が使われる（共通コストをどの基準で割り振るか）。',
  '度外視法': '正常仕損・正常減損の原価を分離計算せず良品に自動的に負担させる簡便な方法を【　　　　　　】という。\n例）月間生産100個のうち5%（5個）は正常仕損（製造上やむを得ない失敗品）が予測されている。【　　　】（仕損品を無視して計算する簡便法）：仕損品5個の原価は分離せず→完成品95個でのみ総原価を割り算（95個で割る）→完成品1個当たりの原価が自動的に割高になる（仕損コストが良品に平均化されて含まれる）。\nポイント：【　　　】→「仕損品を無視して計算すると、良品の単位原価に仕損コストが自動的に含まれる（仕損のコストが良品に上乗せされる）」。非【　　　】→「仕損品の原価を分離して明示的に計算（仕損のコストがいくらかを明確にする）」。試験では【　　　】が多く出題。仕損発生点が「工程の途中」か「終点」かで按分方法が変わる点も重要（いつ仕損が発生したかで計算が変わる）。',
  '非度外視法': '正常仕損・正常減損の原価を計算上明示して把握する方法を【　　　　　　】という。\n例）仕損品5個の評価額（スクラップ価値：くず売りしたらいくらになるか）が1個200円→仕損品評価額1,000円。【　　　】（仕損品のコストを明示して計算）：正味仕損費（仕損品原価）＝仕損品負担コスト－評価額1,000円を分離計算（くず売り収入を差し引いた純コスト）。残りを完成品・月末仕掛品に按分（仕損コストを良品と未完成品に割り振る）。仕訳）仕損品：（借）仕損品1,000円（スクラップとして資産化）／（貸）仕掛品1,000円（スクラップ価値分を仕掛品から切り出す）。\nポイント：【　　　】は「仕損費の原因と金額が明確になる（何でいくらのロスが出たかが見える）」→製造管理に役立つが計算が複雑（より詳細な計算が必要）。仕損品に評価額がある場合は【　　　】の考え方も必要。',
  '前工程費': '連続する製造工程の総合原価計算において前の工程で発生した原価を次の工程に引き継ぐ際の集計額を【　　　　　　】という。\n例）第1工程の製品原価：材料費200万円＋加工費100万円＝300万円（第1工程で完成品1,000個）。第2工程へ1,000個転送（半製品を次の工程に引き渡す）。第2工程の原価計算：【　　　】300万円（材料費扱い：工程始点で全量投入・第1工程で発生したコストを全て引き継ぐ）＋第2工程加工費120万円（第2工程で追加されるコスト）＝完成品原価420万円（1個当たり420円）。\nポイント：【　　　】は「次工程の材料費（前の工程から渡されたコストは材料と同じ扱い）」として扱う。進捗度とは無関係に計算（工程始点で全量が引き継がれる：最初から全部のコストが来る）。月末仕掛品の【　　　】は換算量を使わず実数で計算する点が加工費と異なる（【　　　】は進捗度で按分しない）。',
  '収益認識基準': '顧客との契約から生じる収益をいつ・いくら認識するかを5つのステップで定めた会計基準を【　　　　　　】という。\n例（機器＋保守サービスのセット販売）：①契約の識別（有効な契約かを確認：お客さんとの約束が成立しているか）：有効な契約の確認。②履行義務の識別（何をやる約束かを分解）：「機器の引渡し」と「1年間の保守サービス提供」の2つに分解（1つの契約を複数の約束に分ける）。③取引価格（全体でいくらもらえるか）：セット価格11万円（変動対価を考慮）。④取引価格の配分（それぞれにいくら割り当てるか）：機器8万円・保守3万円に配分（独立販売価格比：単独で売るときの値段の比率）。⑤収益認識（いつ収益にするか）：機器引渡し時に8万円・保守は毎月2,500円を認識。\nポイント：従来の「商品引渡し＝売上（物を渡したら収益）」から「履行義務の充足＝収益（約束を果たしたら収益）」へ。一つの契約に複数の履行義務がある場合の分解と按分が最重要論点。',
  '履行義務': '収益認識基準において顧客との契約で企業が約束した財・サービスを移転する義務を【　　　　　　】という。\n例①一時点で充足される【　　　】（ある瞬間に終わる約束））商品の引渡し（物を渡した瞬間に完了）→引渡し完了時に収益認識（一時点：その瞬間に全額収益）。例②一定期間にわたって充足される【　　　】（時間をかけて果たす約束））建設工事・サポートサービス（作り続けながら・サービスし続けながら完了）→進捗度に応じて収益を認識（少しずつ収益）。例③複数の【　　　】を含む契約（1つの契約に複数の約束が含まれる））スマホ＋通信サービス→「端末の引渡し（一時点）」と「通信サービスの提供（一定期間）」を別々の【　　　】として識別（2つの約束に分ける）→それぞれの充足時点で収益認識（別々のタイミングで収益）。\nポイント：「一時点」vs「一定期間」の区別と、「複数の【　　　】への分解（契約を約束ごとに分ける）」が収益認識基準の中核。',
  '委託販売': '他者（受託者）に商品販売を委託し受託者が実際に販売した時点で収益を認識する販売形態を【　　　　　　】という。\n例）A社（委託者：頼む側）がB社（受託者：代わりに売る側）に商品を積送（取得原価80万円：商品を預ける）。B社が100万円で外部顧客に販売・仕切精算書（いくらで売れたかの報告書）を送付。仕訳①積送時（A社）：（借）積送品80万円（在庫の分類を変更：B社に預けた商品）／（貸）商品80万円（手元の在庫が減る）（棚卸資産区分を変更）。仕訳②仕切精算書受取時（A社）：（借）売掛金95万円（100万円－手数料5万円：実際に回収できる金額）／（貸）積送品売上100万円（B社が売った金額を収益認識）。同時：（借）積送品売上原価80万円（売れた分のコストを費用に）／（貸）積送品80万円（在庫が売れたので消す）。\nポイント：【　　　】は「受託者が売ったとき（仕切精算書受取時）に売上計上（B社が売って報告が来た時点）」。積送時・B社に在庫中は積送品（資産：まだ売れていない在庫）のまま（収益にしない）。',
  '受託販売': '委託者から商品を預かって代わりに販売し販売手数料のみを収益として認識する販売形態を【　　　　　　】という。\n例）B社（受託者：代わりに売る側）がA社（委託者：頼んだ側）の商品を100万円で販売。手数料は5万円（売ってあげた報酬）。仕訳①販売時（B社）：（借）現金100万円（お客さんから受け取ったお金）／（貸）【　　　】100万円（全額を預り金的に処理：A社のお金をまとめて預かっている）（売上にしない：自分の売上ではない）。仕訳②精算・送金時（B社）：（借）【　　　】100万円（預かり金を精算）／（貸）手数料収益5万円（B社の本当の収益）＋現金95万円（A社へ送金：A社のお金を返す）。\nポイント：受託者の収益は「手数料のみ（5万円だけが自分の稼ぎ）」。販売代金100万円を自己の売上にしてはいけない（A社の商品を預かって売っただけ）。B社はA社から預かって売るだけ→消費税の扱いも「売上ではなく手数料（実際の収益分だけが対象）」が正しい。',
  '試用販売': '顧客が一定期間試用し購入意思表示があった時点で収益を認識する販売形態を【　　　　　　】という。\n例）掃除機（原価5万円）を1週間試用させる（実際に使ってみてから買うかどうか決める販売方法）。顧客が「買います（8万円）」と連絡（購入の意思表示）。仕訳①試送時（B社に預ける：試しに使わせる）：（借）試送品5万円（在庫の分類変更：試用中の商品）／（貸）商品5万円（手元の在庫が減る）（売上はまだ計上しない：まだ買うかどうか決まっていない）。仕訳②買取連絡時（買いますという連絡が来た時点）：（借）売掛金8万円（代金の請求権）／（貸）売上8万円（この時点で収益認識：約束が確定した）。（借）売上原価5万円（費用）／（貸）試送品5万円（試送品を売上原価に振替：売れた分のコストを費用化）。\nポイント：【　　　】のポイント→「購入意思表示があった時点で収益認識（買うと言った瞬間に収益）」。試用期間中は試送品（資産）のまま（まだ売上にしない）。期末時点で試用中の場合は試送品として在庫計上（まだ売れていない扱い）。',
  '割賦販売': '商品代金を分割払いで受け取ることを前提とした販売形態の収益認識を【　　　　　　】という。\n例）原価30万円の家具を総額50万円・10回分割払いで販売（引渡し完了）。仕訳①引渡し時（収益認識基準）：（借）割賦売掛金50万円（分割回収予定の代金）／（貸）売上50万円（一括認識：物を渡した時点で全額収益）。（借）売上原価30万円（費用）／（貸）商品30万円（在庫が売れた）。仕訳②毎月回収（5万円×10回）：（借）現金5万円（実際の入金）／（貸）割賦売掛金5万円（割賦売掛金が減る）。\nポイント：収益認識基準→「引渡し時に一括収益認識（物を渡したら全額収益）」が原則（分割回収の都度ではない：もらう度に収益にしない）。未回収分は割賦売掛金（資産：まだもらっていない代金）として管理。例外：金利相当部分が重要な場合は利息部分を分離して計上（金利が大きい場合は利息収益として別処理）。',
  '工事契約': '一定期間にわたる建設・製造請負で工事の進捗度に応じて段階的に収益を認識する契約形態を【　　　　　　】という。\n例）総請負価格1億円・工事原価見込み8,000万円・2年間の工事（大型建設プロジェクト）。1年目の実際原価3,200万円。進捗度（どれだけ進んだか）＝3,200万円÷8,000万円＝40%（見込みコストの40%を使った）。仕訳①1年目の収益認識：（借）工事未収入金4,000万円（まだもらっていない代金）／（貸）工事収益4,000万円（1億円×40%：できた分だけ収益）。（借）工事原価3,200万円（費用）／（貸）仕掛品3,200万円（工事原価も40%分認識：費用と収益を同時に認識）。2年目完成・引渡し：残りの60%（6,000万円）を収益認識。\nポイント：進捗度の測定方法→「原価比例法（発生原価÷見込総原価：コストの進捗率で工事の進捗を測る）」が最も一般的。収益認識基準では進捗度が合理的に見積もれる場合は進捗度基準（少しずつ認識）、見積もれない場合は完成基準（全部終わったら認識）を使用。',
  '返品権付き販売': '顧客が商品を返品できる権利を持つ販売形態で返品見込み分を返金負債として計上するものを【　　　　　　】という。\n例）書店へ商品（取得原価70万円）を100万円で納品（売れなければ返品可能な契約）。返品見込み10%（10万円分・原価7万円分：過去実績から10%が返品になりそう）。仕訳①納品時：（借）売掛金100万円（代金の請求権）／（貸）売上90万円（100万円×90%：返品分を除いた確実な収益）＋返金負債10万円（返品時に返金が必要な義務：返品されたら返すお金）。（借）売上原価63万円（70万円×90%：売れた分のコスト）＋返品資産7万円（返品されたら戻ってくる在庫の価値）／（貸）商品70万円。仕訳②実際に10万円分返品：（借）返金負債10万円（負債を消す）／（貸）現金10万円（返金）。（借）商品7万円（在庫が戻ってくる）／（貸）返品資産7万円（返品資産を消す）。\nポイント：【　　　】では「売上と返金負債」「売上原価と返品資産」の2セットを記録する。',
  '収益認識の5ステップ': '①契約の識別→②履行義務の識別→③取引価格の算定→④履行義務への配分→⑤履行義務充足時の収益認識という体系的な手順を【　　　　　　】という。\n例）クラウドサービス年額12万円（機能追加オプション2万円含む）：①契約識別（有効な契約かを確認）：有効な契約の確認。②履行義務の識別（何をやる約束かを整理）：「基本クラウドサービス（年間継続提供）」＋「機能追加オプション（特定機能の提供）」の2つ。③取引価格（合計でいくらもらうか）：12万円（変動なし）。④配分（それぞれにいくら割り当てるか）：基本10万円・オプション2万円（独立販売価格比で按分：単独で売るときの値段比で割り振る）。⑤認識（いつ収益にするか）：基本サービス→月々8,333円（年間：毎月少しずつ収益化）・オプション→オプション提供開始時に2万円（一時点で全額）。\nポイント：試験では各ステップのどれが問われているか確認。特に②「履行義務の識別と分解（契約を約束に分ける）」・④「取引価格の配分方法（どう割り振るか）」・⑤「一時点 vs 一定期間（いつ収益にするか）」の3点が頻出。',
  '変動対価': '割引・返金・ボリュームリベートなどにより最終的な受取金額が変動する可能性がある取引価格の構成部分を【　　　　　　】という。\n例）年間購入1,000万円超なら3%のボリュームリベート（値引き：たくさん買ってくれたら割引する約束）がある契約。当年の累計購入800万円の時点で年間1,000万円超が見込まれる（確率高い：多分1,000万円を超えそう）。【　　　】の見積もり：1,200万円×3%＝36万円のリベートを見積もり（見込まれるなら先に計算しておく）。収益の減額：売上計上時に【　　　】分を控除（不確かな分を先に差し引いておく）→返金負債36万円（負債：実際に割引が確定した時に払い戻す義務）として計上し売上を減額。\nポイント：【　　　】は「確実視される部分のみ収益に含める（制約あり：不確かなものは収益にしない）」。典型例：ボリュームディスカウント（量に応じた値引き）・返品（返品されそうな分）・インセンティブ（条件達成ボーナス）・マイルストーンボーナス。',
  '外貨建取引': '取引金額が外国通貨で表示された取引を【　　　　　　】という。\n例）米国企業に1万ドル（取引時レート：1ドル100円＝100万円）の商品を輸出（外国通貨で代金をもらう取引）。仕訳①輸出時：（借）売掛金100万円（取引時レートで換算）／（貸）売上100万円。仕訳②決算時（1ドル108円：円安になった）：（借）売掛金8万円（資産が増加：同じドルが今はより多くの円になる）／（貸）為替差益8万円（円安→外貨建て資産の価値増加：儲かった）。仕訳③翌期に1ドル110円で入金：（借）現金110万円（実際の入金）／（貸）売掛金108万円（決算時換算後の帳簿値）＋為替差益2万円（決済時に追加で儲かった分）。\nポイント：外貨建て「資産（売掛金・貸付金）（外貨でもらう予定のお金）」→円安（外貨高）で為替差益（もらえる円が増える）、円高で為替差損（もらえる円が減る）。外貨建て「負債（買掛金・借入金）（外貨で払う予定のお金）」→円安で為替差損（払う円が増える）、円高で為替差益（払う円が減る）。',
  '直物為替レート': '外貨の即時受渡しに適用される当日の為替交換レートを【　　　　　　】という。\n例）本日の【　　　】（スポットレート：今すぐ換金する場合のレート）：1ドル＝108円（今日108円払えば1ドルと交換できる）。今日1万ドルを108万円に換金できる。3か月後の先物レート（将来の受渡しを今日の値段で確定）：1ドル＝110円（3か月後に110円で交換することを今日約束）。外貨建て取引の基本：取引発生日の直物レートで仕訳を行い（取引した日の値段で記録）、期末には決算時レート（CR）で換算替え（決算日の値段に更新）。\nポイント：直物レート（スポット）＝今日の交換レート（今すぐ換金）。先物レート＝将来の交換レートを今日確定（先に値段を決めておく）。外貨建て取引では取引発生時・期末・決済時の3回レートが問題になる（3つのタイミングでレートを使う）。',
  '取引発生時レート': '外貨建て取引が発生した日に適用する為替レートを【　　　　　　】という。\n例）4月1日（取引発生時）：1ドル100円→売掛金1万ドル＝100万円で計上（取引した日の値段で記録）。3月31日（決算時）：1ドル106円→売掛金106万円に換算替え（決算日の値段に更新）→為替差益6万円（円安で価値が上がった分を収益に）。4月15日（入金時）：1ドル104円→現金104万円受取（実際に入ってきた金額）→残りの為替差損2万円（106万円→104万円：決算後に円高で価値が下がった分）を認識。合計為替差益：6万円（期末）－2万円（決済時）＝4万円の純為替差益（全体でみると4万円の得）。\nポイント：取引時レートで計上（まず取引日の値段で記録）→期末にCR（決算時レート）で換算替え（決算日の値段に直す）→差額が為替差損益（その差が損益）。決済時は「期末帳簿価額と決済額の差（換算替え後の値と実際の差）」が差損益。3段階で処理を追えるようにする（3回のレートを追いかける）。',
  '決算時レート（CR）': '外貨建ての資産・負債の期末評価に適用する決算日現在の為替レートを【　　　　　　】という。\n例）決算時レート（CR：Current Rate：今現在のレートの略）：1ドル108円。期末の外貨建て売掛金1万ドル→108万円に換算替え（取引時100万円との差額8万円→為替差益）。外貨建て買掛金5千ドル→54万円（取引時50万円との差額4万円→為替差損：円安で払うべき円が増えた）。仕訳）売掛金換算替え：（借）売掛金8万円（資産増加）／（貸）為替差益8万円（収益：円安で資産の価値が上がった）。買掛金換算替え：（借）為替差損4万円（費用：円安で負債の負担が増えた）／（貸）買掛金4万円（負債増加）。\nポイント：貨幣性項目（現金・売掛金・買掛金・借入金等：金額が確定している金銭の権利・義務）→決算時レートで換算替え（毎期末に最新のレートで更新）。非貨幣性項目（棚卸資産・固定資産等：モノそのもの）→取引時レートのまま（換算替えなし：モノの価値は為替で変わらない）。',
  '為替差損益': '外貨建て取引の換算レートの変動により生じる損益を【　　　　　　】という。\n例①輸出企業（外貨建て売掛金：外貨でもらう予定）：取引時1ドル100円→決算時90円（円高：円の価値が上がった）→売掛金が100万円→90万円に減少→為替差損10万円（「円高は輸出企業に損失（もらえる円が減る）」の会計的反映）。例②輸入企業（外貨建て買掛金：外貨で払う予定）：取引時1ドル100円→決済時110円（円安）→買掛金110万円支払い→為替差損10万円（「円安は輸入企業に損失（払う円が増える）」の会計的反映）。\nポイント：外貨資産＋円安（外貨高）＝差益（資産の価値が上がる）、外貨資産＋円高（外貨安）＝差損（資産の価値が下がる）、外貨負債＋円安＝差損（払うべき円が増える）、外貨負債＋円高＝差益（払うべき円が減る）、と表にして整理する。',
  '貨幣性項目・非貨幣性項目': '外貨換算における換算基準の分類を【　　　　　　】という。\n例）貨幣性項目（現金・売掛金・貸付金・借入金・買掛金等：いくらと金額が決まっている金銭の権利・義務）→決算時レート（CR）で換算替え（毎期末に最新レートで更新）→為替差損益を認識（レートの変動が損益に影響）。非貨幣性項目（棚卸資産・固定資産・繰延資産等：モノや権利そのもの）→取引時レートのまま（換算替えなし）→為替差損益を認識しない（モノ自体の価値は為替で変わらない）。例）外貨建て商品在庫（非貨幣性）→換算替えなし（仕入れた時のレートのまま）。外貨建て売掛金（貨幣性）→決算時レートで換算替え・差額は為替差損益。\nポイント：「いくらで換金できるか額が決まっている（金銭請求権：お金を受け取る・払う権利）」→貨幣性→CR換算（レートで価値が変わる）。「換金額が決まっていない（モノや権利：売らないと金額がわからない）」→非貨幣性→取引時レート維持（レートで価値は変えない）。',
  '社債の発行': '企業が資金調達のために投資家に社債を発行する方法を【　　　　　　】という。\n例）額面1億円（最終的に返す金額）（1口1,000円×10万口）・クーポン年1%（毎年払う利息の率）・5年満期の社債を95円（95百万円）で発行（割引発行：額面より安く発行）。仕訳①発行時：（借）当座預金9,500万円（実際に入ってきた資金）／（貸）社債9,500万円（発行価額で計上：返済義務を負債に）。仕訳②毎年利息：（借）社債利息100万円（1%×1億円：クーポン分の実際の支払い）＋社債利息100万円（償却分：差額500万円÷5年：割引分を毎年利息に加算）＝合計200万円社債利息（実質的な年間利息費用）／（貸）当座預金100万円（実際支払）＋社債100万円（帳簿価額増加：少しずつ額面に近づける）。仕訳③満期償還：（借）社債1億円（負債消滅）／（貸）当座預金1億円（額面分を返済）。\nポイント：割引発行→実際の支払利息（名目：クーポン分）より社債利息の費用が多い（償却分が加算されるため）→帳簿価額が毎年増加して満期に額面へ到達（5年かけて9,500万円→1億円）。',
  '額面金額': '社債や手形などに記載された満期時に支払われる元本の金額を【　　　　　　】という。\n例）社債（額面1億円・発行価格9,500万円・5年満期）。差額500万円（9,500万円→1億円に近づける分）＝事実上の追加利息（5年間で分割負担：割安で売った分を毎年少しずつ利息として払う）。毎年100万円（500万円÷5年）を社債利息に加算（クーポン分に加えて追加費用を計上）。帳簿価額の推移：発行時9,500万円→1年後9,600万円→2年後9,700万円→…→5年後1億円（額面：目指す値）。\nポイント：【　　　】は「最終的に返さなければならない金額（満期の返済額）」。発行時の帳簿価額（発行価格）と額面の差が「実質的な追加利息コスト（安く発行した分のコスト）」。満期時に帳簿価額が額面に一致するのが償却原価法の目標（毎年少しずつ帳簿価額を額面に近づける）。',
  'クーポン': '社債の保有者に定期的に支払われる表面利率に基づく利息を【　　　　　　】という。\n例）額面100円・【　　　】（表面利率：証書に書かれた利率）1%・年1回利払いの社債→毎年1円を投資家に支払い（実際の現金支払い）。市場利率（世間一般の利回り）2%の場合：投資家は1%では不満（2%より低い）→95円（割引価格）なら「5円の値上がり益（95円→100円）＋年1円利息」で実質利回り2%に近づく。仕訳）【　　　】利息の支払：（借）社債利息100万円（額面1億円×1%）／（貸）当座預金100万円（実際の支払い）。\nポイント：【　　　】（表面利率）＞市場利率→プレミアム発行（額面超えで発行：投資家が進んで買うので高く売れる）。【　　　】＜市場利率→割引発行（額面未満で発行：魅力が低いので安くする）。【　　　】と市場利率の比較が発行価格を決定する（利率の高低が値段を決める）。',
  '割引発行': '社債を額面金額より低い価格で発行することを【　　　　　　】という。\n例）額面100円の社債を95円で発行（割引率5%：5円安く売る）。投資家は5円の値上がり益（取得95円→満期100円：持っているだけで5円得になる）＋クーポン利息を受取れる（実質利回りが高くなる）。発行体（企業）は5円分を5年間で分割負担（償却原価法：毎年少しずつ費用化）→毎年1円を社債利息費用に加算。仕訳）発行：（借）当座預金9,500万円（1億円×0.95：実際に入ったお金）／（貸）社債9,500万円（発行価額で計上）。毎年（償却原価法）：（借）社債利息100万円（差額1,000万円×1/10年：追加利息分）／（貸）社債100万円（帳簿価額増加：少しずつ額面に近づける）。\nポイント：【　　　】→実際の現金支払額（クーポン）より費用計上額が多い（追加で費用を計上する）→帳簿価額が毎年増加して額面へ収束（満期に額面通りになる）。',
  '社債の償却原価法': '社債の発行差金を利息として毎期均等配分し帳簿価額を満期額面に近づける方法を【　　　　　　】という。\n例）額面1億円を9,500万円で発行（差額500万円：割引発行）・10年満期。償却原価法（定額法：毎年均等に配分）：年50万円（500万円÷10年）を毎期社債利息に加算し社債帳簿価額を増加（毎年少しずつ額面に近づける）。仕訳（毎年）：（借）社債利息50万円（追加の利息費用）／（貸）社債50万円（帳簿価額が増える）。これにより年1%のクーポン（100万円：実際の支払い）と合わせて計150万円が年間の社債利息費用（実質利率≒1.5%：本当の利息コスト）。10年後：社債帳簿価額9,500万円＋50万円×10年＝1億円（額面）で満期償還（ぴったり額面になる）。\nポイント：社債利息の計上額＝クーポン（現金支払）＋償却原価法による加算額（または控除額：プレミアムなら控除）。試験では「毎期の社債利息計上額と社債帳簿価額の計算（毎年いくらの利息費用・帳簿はいくらか）」が必出。',
  '端数利息': '社債の利払日と売買日のズレから生じる経過利息を【　　　　　　】という。\n例）年2回利払い（6月末・12月末）の社債（クーポン1%・額面100万円）を9月末に売買（利払日と売買日がずれている）。【　　　】（前の利払い日から売買日までに積み上がった利息：売主が持っていた期間分）：前回利払日（6月末）から9月末までの3か月分＝100万円×1%×3/12＝2,500円（3か月分の利息）。仕訳（買手）：（借）売買目的有価証券XX万円（社債の代金）＋有価証券利息2,500円（【　　　】を先払い）／（貸）現金（社債代金＋【　　　】）（売主に代金と【　　　】をまとめて払う）。12月末利払日に6か月分5,000円を受取：（借）現金5,000円（半年分の利息全額を受取）／（貸）有価証券利息5,000円（【　　　】2,500円分は相殺されて3か月分が実質の収益：自分が持っていた3か月分だけが本当の収益）。\nポイント：【　　　】は「前回利払い以降の売主保有期間の利息を買主が代わりに受け取る分の前払い（売主の分を買主が立て替える）」。次の利払日に全額受取って精算する（全額もらってから【　　　】を差し引いた分が自分の収益）。',
  '取引の8要素': '簿記のすべての取引を表現する8つの要素を【　　　　　　】という。\n例）商品100万円を現金で仕入れ → 費用（仕入）の発生（費用が生じた）＋資産（現金）の減少（現金が出ていった）。商品を120万円で現金販売 → 資産（現金）の増加（現金が入ってきた）＋収益（売上）の発生（収益が生じた）。\nポイント：資産の増加・減少（財産が増えた・減った）、負債の増加・減少（借金が増えた・減った）、資本の増加・減少（元手が増えた・減った）、収益の発生（稼ぎが生じた）、費用の発生（コストが生じた）の8要素。すべての仕訳はこれらの組み合わせで表現できる（どんな取引もこの8つで説明できる）。',
  '決算振替仕訳': '収益・費用の残高を損益勘定へ振り替え当期純利益を繰越利益剰余金へ振り替える仕訳を【　　　　　　】という。\n例）売上500万円・仕入350万円・給料100万円等の全収益・費用を損益勘定（損益を集計する一時的な勘定）へ振替 → 損益勘定残高（利益の合計）50万円を繰越利益剰余金（翌期に持ち越す）へ振替 → 収益・費用の全勘定がゼロリセット（翌期は新たにゼロから始まる）。\nポイント：名目勘定（収益・費用：毎期新しく計算する）の残高をゼロにして翌期に繰り越さない（毎期リセット）。実質勘定（資産・負債・純資産：蓄積するもの）は繰り越す（翌期も残る）。',
  '損益勘定': '決算においてすべての収益・費用を集約し当期純利益を算定するための一時的な勘定を【　　　　　　】という。\n例）収益500万円・費用450万円を【　　　】（すべての損益を集める一時的な口座）に集約 → 【　　　】残高50万円（純利益）を繰越利益剰余金へ振替（利益を次期に持ち越す）→ 【　　　】の残高ゼロで閉鎖（使い終わったら消える）。翌期には【　　　】は存在しない（毎期ゼロから作られる）。\nポイント：決算においてすべての収益・費用を集約する一時的な勘定（決算期だけ使う特別な勘定）。純利益確定後に閉鎖されて消滅する（翌期には残らない）。',
  '帳簿の締め切り': '決算において各勘定の残高を次期に引き継ぐための作業を【　　　　　　】という。\n例）現金勘定残高50万円（期末の現金が50万円）→ 「次期繰越50万円（翌期に持ち越す）」で締め切り翌期首に「前期繰越50万円（前期から引き継いだ）」として引き継ぐ。売上勘定残高500万円 → 損益勘定へ振替してゼロに（翌期にはゼロから始まる：翌期の売上は新たに計算する）。\nポイント：実質勘定（資産・負債・純資産：財産・借金・元手）は残高を繰り越す（翌期も続く）。名目勘定（収益・費用：稼ぎとコスト）はゼロにリセットする（毎期新しく計算する）。',
  '資本等式': '「資産－負債＝純資産（資本）」という貸借対照表の基本的な関係式を【　　　　　　】という。\n例）資産5,000万円（財産の総額）－負債3,000万円（借金の総額）＝純資産2,000万円（株主のもの）。「会社の財産（5,000万円）から借金（3,000万円）を引いたら株主のもの（2,000万円）が残る」という意味（自己資本）。\nポイント：【　　　】＝資産－負債＝純資産（借金を除いた正味の財産）。貸借対照表等式（資産＝負債＋純資産：財産の調達源泉を示す）と表裏一体（同じことを違う向きから見ている）。',
  '損益計算書等式': '「費用＋当期純利益＝収益」という損益計算書の基本的な関係式を【　　　　　　】という。\n例）費用450万円＋当期純利益50万円＝収益500万円（費用に利益を加えると収益になる）。つまり「収益（稼ぎ）－費用（コスト）＝利益（手取り）」。損益計算書全体が常にこの等式を満たしている（左右がバランスしている）。\nポイント：【　　　】＝費用＋当期純利益＝収益（利益は収益からコストを引いた残り）。収益と費用の差額が当期純利益になることを示す（稼ぎからコストを引いた残りが利益）。',
  '継続企業の前提': '企業が将来にわたって事業を継続するという会計上の基本的な前提を【　　　　　　】という。\n例）通常の財務諸表は「この会社はこれからも続く（倒産しない）」という前提で作られている（固定資産を長期で償却するなど：長期計画が成立する）。倒産の危機にある場合はこの前提が崩れ財務諸表への注記が義務付けられる（前提が成り立たないことを開示する）。\nポイント：ゴーイングコンサーン（Going Concern：継続企業）ともいう。前提が成立しない懸念がある場合は財務諸表に追記情報として開示が必要（投資家に警告する）。',
  '連結会計': '親会社と子会社をひとつの経済的実体とみなして財務諸表を合算・調整する会計処理を【　　　　　　】という。\n例）A社（親：持株80%：B社を80%支配）＋B社（子）のグループ。A社個別：売上100億円・資産500億円。B社個別：売上50億円・資産200億円。単純合算（単純に足すだけ）：売上150億円・資産700億円。しかし連結修正仕訳が必要（グループ内の取引を消す）：①A社→B社への売上20億円を相殺（グループ内の売上は外部売上ではない）②B社株式（投資）とB社資本（純資産）を相殺消去（親の投資と子の資本を消す）③のれんと非支配株主持分を計上→連結後：売上130億円・資産650億円（グループ外部との取引だけの実態）。\nポイント：連結財務諸表作成の3大論点：①投資と資本の相殺消去（初年度：親子の株式と資本を消す）②内部取引の相殺消去（毎年：グループ内売買を消す）③未実現利益の消去（毎年：グループ内でまだ外部に売れていない利益を消す）。「グループ内の取引はなかったことにする（外部から見た実態を表す）」という視点が重要。',
  '連結財務諸表': '親会社と子会社グループ全体の財政状態・経営成績を示す財務諸表を【　　　　　　】という。\n例）【　　　】の作成手順：①個別財務諸表の合算（親＋子の各科目を足し合わせ：まず単純に合計する）。②開始仕訳（前期末の連結修正を引き継ぐ：前期の修正を今期にも持ち込む）。③投資と資本の相殺消去→のれん・非支配株主持分の計上（親の投資と子の資本を相殺して差額をのれんに）。④内部取引の相殺消去（グループ内の売上↔仕入・債権↔債務：グループ内で売り買いした分を消す）。⑤未実現利益の消去（グループ内で未販売の在庫に含まれる内部利益を除去：まだ外部に売れていない利益を消す）。⑥のれんの償却（毎年）。\nポイント：【　　　】＝個別財務諸表の合算＋連結修正仕訳（修正を加えて実態を表す）。グループ内の「内部取引（グループの中だけの取引）」と「未実現利益（グループ内でまだ実現していない利益）」の消去が連結会計の核心作業。',
  '支配獲得日': '親会社が子会社に対する支配を獲得した日を【　　　　　　】という。\n例）3月31日（【　　　】：この日から子会社として連結に取り込む）にA社がB社の60%株式（取得原価6,000万円）を取得。B社の純資産の帳簿価額8,000万円・時価8,500万円（500万円の評価差額：時価の方が高い）。連結修正仕訳①（子会社資産の時価評価：帳簿価額→時価に修正）：（借）土地500万円（時価が帳簿より高い部分）／（貸）評価差額金500万円（子会社資産を時価に修正）。連結修正仕訳②（投資と資本の相殺消去：親の投資と子の資本を消す）：（借）資本金等8,500万円（時価評価後）／（貸）子会社株式6,000万円（A社の投資：親が持っている株）＋非支配株主持分XX万円（外部株主の取り分）＋のれんXX万円（超過支払分）。\nポイント：【　　　】は「連結開始日（この日からグループとして扱う）」。子会社の資産・負債は「帳簿価額」でなく「時価（市場価値）」で評価し直してから連結に組み込む。',
  '投資と資本の相殺消去': '連結手続きにおいて親会社の子会社株式と子会社の資本を相殺消去する処理を【　　　　　　】という。\n例）A社（親）がB社（子）の80%株式8,000万円を取得（親がB社の80%を持っている）。B社の純資産時価1億円。連結修正仕訳：（借）B社資本金等1億円（子の資本を消す）／（貸）子会社株式8,000万円（A社の投資：親が持っている株を消す）＋非支配株主持分2,000万円（1億円×20%：外部株主の取り分）＋のれん0円（差額なし）。別例：取得額9,000万円の場合→のれん1,000万円（9,000万円－1億円×80%：払いすぎた分）が計上される。\nポイント：相殺消去の式：「親の投資額（子会社株式）＋非支配株主持分（子会社純資産×少数比率）＝子会社純資産時価」（足し算が一致するはず）。超過分がのれん（一致しなければのれんが出る）。',
  '非支配株主持分': '子会社の純資産のうち親会社以外の少数株主に帰属する部分を【　　　　　　】という。\n例）A社がB社の70%を保有（残30%は外部株主：A社以外の株主）。B社の純資産（時価評価後）500万円。連結B/Sへの計上：【　　　】＝500万円×30%＝150万円（純資産の部に計上：外部株主の取り分）。B社の当期純利益100万円→連結P/L：親会社持分70万円（A社の取り分）・【　　　】30万円（外部株主の取り分）に按分。仕訳（連結修正・毎期）：（借）【　　　】当期変動額30万円（変動を記録）／（貸）【　　　】30万円（B社利益30%分が【　　　】を増加させる：外部株主の取り分が増える）。\nポイント：【　　　】は「子会社の外部株主の取り分（A社以外の株主が持つB社の価値）」。連結純資産に含まれるが親会社株主のものではない（A社の株主のお金ではない）。',
  '内部取引の相殺消去': '連結グループ内の親子会社間取引を連結財務諸表上で相殺除去する手続きを【　　　　　　】という。\n例）A社（親）がB社（子）に商品1,000万円を販売・B社はまだ外部未販売（B社の在庫）。連結修正仕訳①（売上・仕入の相殺：グループ内の売買を消す）：（借）売上1,000万円（A社の売上を消す）／（貸）売上原価1,000万円（B社の仕入を消す）（A社の売上とB社の仕入を相殺）。連結修正仕訳②（債権・債務の相殺：グループ内の貸し借りを消す）：（借）買掛金1,000万円（B社の買掛金を消す）／（貸）売掛金1,000万円（A社の売掛金を消す）（B社の買掛金とA社の売掛金を相殺）。\nポイント：【　　　】でグループ連結売上は「外部への売上のみ（グループ外に売った分だけ）」になる。相殺する科目：売上↔売上原価（P/L：損益計算書）、売掛金↔買掛金（B/S：貸借対照表）。さらに未実現利益の消去も必要（在庫に含まれる内部利益も消す）。',
  '未実現利益の消去': '連結グループ内の取引で発生した未実現の利益を連結財務諸表から除去する処理を【　　　　　　】という。\n例）A社（親）が原価800万円の商品をB社（子）に1,000万円で販売（グループ内に200万円の利益）。B社はまだ外部に未販売（B社の在庫：外部にまだ売っていない）→B社の在庫に200万円の未実現利益が含まれている（まだ外部に売っていないので本当の利益ではない）。連結修正仕訳：（借）売上原価200万円（費用を増やして利益を消す）／（貸）商品200万円（B社在庫の未実現利益分を減額→在庫を原価800万円に修正：実際の原価に戻す）。翌期B社が外部に1,200万円で販売→この時点で200万円の利益が実現（グループ外に売れた）→翌期の連結修正仕訳で利益消去を取消す（実現したので消去を解除する）。\nポイント：ダウンストリーム（親→子に販売）→全額消去（全部の利益を消す）。アップストリーム（子→親に販売）→非支配株主持分にも按分して消去（外部株主の取り分も考慮）。',
  '持分法': '投資先の純資産・損益の変動に応じて投資勘定を増減させる会計処理を【　　　　　　】という。\n例）A社がB社（関連会社：持分30%：支配はないが影響力は持っている）の株式3,000万円を保有。B社当期純利益1,000万円。【　　　】仕訳（B社の利益のうち自分の取り分を反映）：（借）投資有価証券300万円（A社持分30%分だけ資産が増える）／（貸）【　　　】投資損益300万円（収益：B社が稼いだ分のうち30%が自分の収益）。B社が配当200万円を実施→（借）現金60万円（200万円×30%：自分の取り分の配当）／（貸）投資有価証券60万円（配当で投資勘定を減らす：配当は資産の取り崩し）。【　　　】後の投資有価証券帳簿価額：3,000万円＋300万円－60万円＝3,240万円（B社の純資産の変動を反映）。\nポイント：【　　　】は「連結に準じた1行連結（B社の損益を1行だけ自社の損益に取り込む）」。20〜50%保有→関連会社（影響力あり）→【　　　】。50%超→子会社（支配）→完全連結（全部合算）。',
  'のれん（連結）': '連結において子会社の純資産公正価値を超えて支払った超過取得原価を【　　　　　　】という。\n例）A社がB社を1億円で買収（B社の価値より高い値段で買った）。B社の純資産時価8,000万円（時価で評価した正味財産）。のれん＝1億円－8,000万円＝2,000万円（超過支払：B社のブランド・顧客基盤・技術力への対価・目に見えない価値への支払い）。10年均等償却なら年200万円（10年かけて費用化）。仕訳①相殺消去：（借）B社純資産8,000万円（子の資本を消す）＋のれん2,000万円（差額を無形資産として計上）／（貸）子会社株式1億円（親の投資を消す）。仕訳②毎年償却：（借）のれん償却200万円（費用）／（貸）のれん200万円（連結修正仕訳：毎年少しずつ資産を減らす）。\nポイント：のれん＝「支払った代金－時価純資産（払いすぎた分）」。連結財務諸表にだけ出てくる無形資産（個別財務諸表にはない）。20年以内で均等償却必須。IFRS（国際基準：IFRSという会計ルール）では償却なし・減損テストのみ（日本の会計と違う）。',

const DETAIL = {};

function getSectionQuestions(sec){ return sec ? ALL.filter(SECS[sec]) : ALL; }

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base.filter(q=>!checkOnly||checked[q.id]);
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}



function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  return styleParens(txt);
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}</div>
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){
  const q=expQuestions[expQIdx];
  btn.style.display='none';
  const ro=document.getElementById('exp-ro-ans');
  ro.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa=q.exp?`<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>`:'';
  const area=document.createElement('div');
  area.className='exp-fill-exp-area';
  area.innerHTML=expJa+checkBtn;
  ro.insertAdjacentElement('afterend',area);
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa = isLastEntry && q.exp ? `<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>` : '';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${expJa}${checkBtn}${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${expJa}${checkBtn}${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  const res=document.getElementById('exp-res');
  if(res){ res.style.display='none'; res.innerHTML=''; }
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

// ===== スクロールモードここまで =====

function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  ['sec-s3','sec-s2c','sec-s2i'].forEach(id=>{
    const btn=document.getElementById(id);
    if(btn) btn.classList.toggle('active',
      (sec==='s3'&&id==='sec-s3')||
      (sec==='s2c'&&id==='sec-s2c')||
      (sec==='s2i'&&id==='sec-s2i')
    );
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}




function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? 'チェックのみ解除' : 'チェックのみ';
  buildDeck();
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='チェックのみ'; }
  setSection('s3');
}



function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('s3');
</script>
