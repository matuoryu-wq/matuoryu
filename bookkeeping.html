    exp:'遊休資産を事業用に転用しても、日本基準では減損損失の戻し入れを行わないため、時価が回復していても帳簿価額はそのまま据え置かれます（700,000円のまま）。まるで一度大きく評価を下げた土地が、その後値上がりしても帳簿上は評価を戻さないようなイメージで、この仕訳は金額を変えずに勘定科目の表示区分だけを付け替えるものです。「一度計上した減損損失は、その後の状況好転があっても取り消さない」という日本基準の原則を、転用というイベントを通じて確認する問題です。'
  },
  { id:836, calc:'', level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社はファイナンス・リース契約の開始にあたり、頭金（リース料の一部前払い）100,000円を<mark class="q-asset">現金で支払った</mark>。この頭金は<mark class="q-asset">リース資産の取得価額に含める</mark>処理をする場合の仕訳を示しなさい。',
    en_q:'At the inception of a finance lease, Company X paid a ¥100,000 cash down payment (a partial prepayment of lease payments). Record the entry treating this down payment as part of the leased asset\'s acquisition cost.',
    e:[{d:[['リース資産',100000]], c:[['現金',100000]]}],
    exp:'リース契約開始時に支払う頭金（リース料の一部前払い）は、通常の前払費用のように扱うのではなく、リース資産の取得価額の一部として資産計上します。まるで住宅ローンの頭金が物件価格の一部に含まれるようなイメージで、「将来支払うはずだったリース料の一部を、先に前払いした」と考え、リース債務ではなく、リース資産そのものの取得原価に含めます。'
  },
  { id:837, calc:'残存価額：1,500,000×10％＝150,000円\n減価償却費：（1,500,000－150,000）÷6年＝225,000円', level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転ファイナンス・リース（リース資産計上額1,500,000円、経済的耐用年数6年、残存価額はリース資産計上額の10％）を契約した。<mark class="q-expense">1年分の減価償却費を計上する</mark>（<mark class="q-as-li">間接法でリース資産減価償却累計額に記帳する</mark>）仕訳を示しなさい（定額法）。',
    en_q:'Company X entered an ownership-transfer finance lease (leased asset ¥1,500,000, economic useful life 6 years, residual value 10% of the leased asset amount). Record one year of straight-line depreciation.',
    e:[{d:[['減価償却費',225000]], c:[['リース資産減価償却累計額',225000]]}],
    exp:'所有権移転ファイナンス・リースは、契約終了後に所有権が借手に移るため、自己所有の固定資産と全く同じ方法で減価償却します。残存価額が設定されている場合は、取得価額から残存価額を差し引いた金額（要償却額）を耐用年数で割ります。残存価額：1,500,000×10％＝150,000円。要償却額：1,500,000－150,000＝1,350,000円。年間償却額：1,350,000÷6年＝225,000円。所有権移転外リース（原則残存価額ゼロ）とは異なり、残存価額の考慮が必要な点に注意しましょう。'
  },
  { id:838, calc:'備品の取得原価：（1,000,000－800,000）＋50,000＝250,000円', level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転外ファイナンス・リース（リース資産の取得原価1,000,000円、<mark class="q-as-li">減価償却累計額800,000円</mark>）について、リース期間満了時に割安購入選択権を行使し、<mark class="q-asset">追加で50,000円を現金で支払って資産の所有権を取得した</mark>。<mark class="q-asset">リース資産を</mark>通常の固定資産である<mark class="q-asset">備品に振り替える</mark>仕訳を示しなさい。',
    en_q:'Company X exercised a bargain purchase option at the end of a non-ownership-transfer finance lease term (leased asset acquisition cost ¥1,000,000, accumulated depreciation ¥800,000), paying an additional ¥50,000 cash to acquire ownership. Record the entry reclassifying the leased asset into ordinary owned equipment.',
    e:[{d:[['備品',250000],['リース資産減価償却累計額',800000]], c:[['リース資産',1000000],['現金',50000]]}],
    exp:'所有権移転外ファイナンス・リースでも、契約に「割安購入選択権」（相場よりかなり安い価格でリース物件を買い取れる権利）が付いている場合、これを行使すると、その時点でリース資産としての性格が終わり、まるでレンタカーの契約終了時に格安で買い取るオプションを使うようなイメージで、通常の自己所有の固定資産（備品）に切り替わります。リース資産の帳簿価額200,000円（取得原価1,000,000円－減価償却累計額800,000円）に、追加で支払った買取り代金50,000円を加えた250,000円が、新たな備品としての取得原価になります。'
  },
  { id:839, calc:'支払リース料：50,000－10,000＝40,000円', level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社はオペレーティング・リース契約（<mark class="q-expense">月額リース料50,000円</mark>のうち、<mark class="q-expense">10,000円は付随するメンテナンスサービス費用</mark>）を締結し、<mark class="q-asset">1ヶ月分を現金で支払った</mark>。リース料とメンテナンス費用を区分して処理する仕訳を示しなさい。',
    en_q:'Company X entered an operating lease (monthly payment ¥50,000, of which ¥10,000 is for bundled maintenance services) and paid one month\'s payment in cash. Record the entry separating the lease payment from the maintenance cost.',
    e:[{d:[['支払リース料',40000],['修繕費',10000]], c:[['現金',50000]]}],
    exp:'リース契約の中に、リース物件の借入とは別に、保守・メンテナンスサービスの提供が含まれている場合、契約書上の金額を「純粋なリース料」部分と「サービス費用」部分に区分して処理する必要があります。まるで複合機のリース料の中に月額の保守サービス料が組み込まれているようなイメージで、40,000円（リース料相当部分）は「支払リース料」、10,000円（メンテナンス部分）は「修繕費」として、それぞれ別の性質の費用として計上します。「リース料に何が含まれているか」を見極めることが実務上のポイントです。'
  },
  { id:840, calc:'600,000－500,000＝100,000円', level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は<mark class="q-asset">保有する備品（帳簿価額500,000円）を</mark>リース会社に600,000円で売却し、<mark class="q-asset">現金を受け取った</mark>。同時にこの備品をオペレーティング・リースとしてリースバックする契約を締結した。オペレーティング・リースに該当する場合、<mark class="q-revenue">売却損益は繰延べず、その場で認識する</mark>。売却時の仕訳を示しなさい。',
    en_q:'Company X sold equipment (book value ¥500,000) to a leasing company for ¥600,000 cash, and simultaneously leased it back under an operating lease. Because the leaseback is an operating lease, the sale gain is not deferred and is recognized immediately. Record the entry at the time of sale.',
    e:[{d:[['現金',600000]], c:[['備品',500000],['固定資産売却益',100000]]}],
    exp:'セール・アンド・リースバックでも、リースバック部分がファイナンス・リースではなく「オペレーティング・リース」（単なる賃貸借）に該当する場合は、ファイナンス・リースのケース（前の応用問題を参照）とは異なり、売却損益を繰延べる必要はなく、通常の固定資産売却と同じようにその場で損益を認識します。まるで単純に資産を売って、別の資産を新たにレンタルし始めるようなイメージで、現金600,000円－帳簿価額500,000円＝売却益100,000円をそのまま計上します。「リースバックがファイナンスか、オペレーティングか」によって処理が正反対になる点が、この論点のハイライトです。'
  },

  // ===== 1級：会計方針の変更・誤謬の訂正 =====
  { id:787, calc:'', level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は棚卸資産の評価方法を先入先出法から総平均法に変更した（<strong>会計方針の変更</strong>）。この変更を過去の財務諸表に遡って適用した結果、<mark class="q-asset">過去の期首商品棚卸高が総平均法によればより低い金額であったことが判明し</mark>、<mark class="q-equity">利益剰余金期首残高を150,000円減額修正する必要が生じた</mark>（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its inventory valuation method from FIFO to the weighted-average method. Applying this change retrospectively revealed that opening inventory under the new method would have been ¥150,000 lower, requiring a ¥150,000 reduction to opening retained earnings, ignoring tax effects. Record the retrospective-application adjustment entry.',
    e:[{d:[['利益剰余金期首残高',150000]], c:[['繰越商品',150000]]}],
    exp:'「会計方針の変更」（棚卸資産の評価方法など）は、原則として新たな会計方針を過去の期間にも遡って適用したかのように会計処理します（遡及適用）。まるでルールを変更した後、過去の記録もそのルールで書き直すようなイメージで、過去の損益はすでに確定しているため、当期の損益計算書を通さず、直接「利益剰余金期首残高」を修正します。変更後の方法（総平均法）で計算し直した結果、過去の商品棚卸高が150,000円少なかったことになるため、繰越商品（資産）を減額し、対応する分だけ利益剰余金期首残高を減額します。'
  },
  { id:788, calc:'', level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の決算において、<mark class="q-liability">経費80,000円の計上漏れ（未払費用の計上漏れ）があったことを当期に発見した</mark>。過去の誤謬の訂正として、<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示の仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had failed to accrue ¥80,000 of expenses (an omitted accrued liability) in last period\'s financial statements. Record the retrospective restatement entry correcting this prior-period error, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',80000]], c:[['未払費用',80000]]}],
    exp:'前期以前の財務諸表に誤り（誤謬）があったことが当期に判明した場合、その影響を当期の損益として計上するのではなく、「修正再表示」といって、あたかも誤りがなかったかのように過去の財務諸表を直接修正します。まるで過去のテストの採点ミスを見つけて、今年の成績ではなく過去の記録を修正するようなイメージで、当期の損益計算書を通さず、直接「利益剰余金期首残高」を修正することで、過去の誤りを訂正します。未払費用（負債）の計上漏れだったため、利益剰余金期首残高を減額し、未払費用を追加計上します。'
  },
  { id:789, calc:'', level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に<mark class="q-asset">売上高を120,000円過大に計上していたことが当期に判明した（実際には売上が発生していなかった）</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had overstated sales revenue by ¥120,000 last period (the sale had not actually occurred). Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',120000]], c:[['売掛金',120000]]}],
    exp:'前期に本来計上すべきでなかった売上高（売掛金）が誤って計上されていたケースです。誤りを発見した当期の売上高を減額するのではなく、過去の誤りとして「利益剰余金期首残高」を直接減額し、過大計上されていた売掛金を取り消します。まるで昨年の帳簿の記載ミスを見つけて、今年の帳簿ではなく昨年の記録として訂正するようなイメージで、誤謬の訂正は、発生した年度ではなく発見した年度の当期純利益に影響を与えない、という点がポイントです。'
  },
  { id:790, calc:'600,000÷3年＝200,000円', level:3, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社が保有する機械装置（取得原価1,000,000円、これまで耐用年数10年・定額法で償却、期首時点の帳簿価額600,000円）について、今後の使用見込みを再検討した結果、残存耐用年数を当初の残り6年から3年に変更した（<strong>会計上の見積りの変更</strong>）。過去の年度は修正せず、<mark class="q-expense">変更後の残存耐用年数で当期の減価償却費を計上する</mark>（<mark class="q-as-li">間接法で減価償却累計額に記帳する</mark>）仕訳を示しなさい（残存価額ゼロ・定額法）。',
    en_q:'Company X reassessed the useful life of its machinery (acquisition cost ¥1,000,000, previously depreciated straight-line over 10 years, opening book value ¥600,000) and revised the remaining useful life from 6 years to 3 years. Without restating prior periods, record this period\'s depreciation entry using the revised remaining life (zero residual value, straight-line).',
    e:[{d:[['減価償却費',200000]], c:[['減価償却累計額',200000]]}],
    exp:'「会計上の見積りの変更」（耐用年数の変更、引当金の見積り変更など）は、「会計方針の変更」とは異なり、過去に遡って財務諸表を修正しません（遡及処理をしません）。変更があった期以後の将来に向かって、新しい見積りに基づいて会計処理を行います（プロスペクティブ処理）。まるで「これからの計画を見直しただけで、過去の記録は変えない」というイメージで、期首帳簿価額600,000円を、変更後の残存耐用年数3年で償却：600,000÷3年＝200,000円。「過去は正しかったが、これからの見積りを変えた」という整理なので、利益剰余金の修正は一切発生しない点が、会計方針の変更・誤謬の訂正との大きな違いです。'
  },
  { id:791, calc:'繰延税金資産：100,000×30％＝30,000円\n利益剰余金期首残高の減少：100,000－30,000＝70,000円', level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に<mark class="q-liability">費用100,000円の計上漏れがあったことを当期に発見した</mark>。<strong>誤謬の訂正</strong>による修正再表示（<mark class="q-equity">利益剰余金期首残高の修正</mark>）にあたり、<mark class="q-asset">実効税率30％として税効果を考慮した</mark>仕訳を示しなさい。',
    en_q:'Company X discovered this period that it had failed to record ¥100,000 of expenses last period. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['利益剰余金期首残高',70000],['繰延税金資産',30000]], c:[['未払費用',100000]]}],
    exp:'修正再表示にも税効果会計を適用します。過去に計上漏れだった費用100,000円は、将来（税務上の扱いが確定した時点で）税金負担を軽減する効果を持つため、繰延税金資産30,000円（100,000×30％）を認識します。残り70,000円が税引後ベースでの利益剰余金期首残高の減額分です。誤謬の訂正であっても、通常の決算整理と同じように税効果会計のルールを適用する点を押さえておきましょう。'
  },
  { id:841, calc:'600,000÷5年＝120,000円', level:3, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は機械装置（取得原価1,000,000円、期首時点の帳簿価額600,000円、残存耐用年数5年）の減価償却方法を、定率法から定額法に変更した。この変更は「会計上の見積りの変更と区別することが困難な会計方針の変更」に該当するため、遡及適用せず、<mark class="q-expense">変更後の方法により当期の減価償却費を計上する</mark>（<mark class="q-as-li">間接法で減価償却累計額に記帳する</mark>）仕訳を示しなさい（残存価額ゼロ・定額法）。',
    en_q:'Company X changed its depreciation method for machinery (acquisition cost ¥1,000,000, opening book value ¥600,000, 5 years remaining useful life) from the declining-balance method to straight-line. Because this qualifies as "a change in accounting policy that is difficult to distinguish from a change in accounting estimate," it is not applied retrospectively. Record this period\'s depreciation under the new method (zero residual value, straight-line).',
    e:[{d:[['減価償却費',120000]], c:[['減価償却累計額',120000]]}],
    exp:'減価償却方法の変更（定率法→定額法など）は、本来は「会計方針の変更」に見えますが、日本基準では「会計上の見積りの変更と区別することが困難な会計方針の変更」として特別に扱い、過去に遡って財務諸表を修正しません（遡及適用しません）。まるで「見た目は方針変更でも、実質は見積りの見直しに近い」とみなすようなイメージで、変更した期以後、新しい方法で将来に向かって計算するだけです。期首帳簿価額600,000円÷残存耐用年数5年＝120,000円。「会計方針の変更なのに、なぜか見積りの変更と同じ扱いになる」という、1級で頻出のひっかけポイントです。'
  },
  { id:842, calc:'', level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は売買目的有価証券の評価方法を移動平均法から総平均法に変更した（<strong>会計方針の変更</strong>）。過去の財務諸表に遡って適用した結果、<mark class="q-asset">過去の有価証券の帳簿価額が総平均法によればより高い金額であったことが判明し</mark>、<mark class="q-equity">利益剰余金期首残高を60,000円増額修正する必要が生じた</mark>（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its valuation method for trading securities from the moving-average method to the weighted-average method. Applying this retrospectively revealed that the securities\' book value under the new method would have been ¥60,000 higher, requiring a ¥60,000 increase to opening retained earnings, ignoring tax effects. Record the retrospective-application entry.',
    e:[{d:[['売買目的有価証券',60000]], c:[['利益剰余金期首残高',60000]]}],
    exp:'棚卸資産の評価方法と同様に、有価証券の評価方法（移動平均法・総平均法など）の変更も「会計方針の変更」に該当し、遡及適用が必要です。今回は変更後の方法（総平均法）によれば過去の有価証券の帳簿価額がより高かったことが判明したため、有価証券（資産）を増額し、対応する分だけ利益剰余金期首残高を増額します（前に学んだ棚卸資産のケースとは逆に、利益剰余金が増える方向の修正です）。'
  },
  { id:843, calc:'', level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は棚卸資産の評価方法を総平均法から先入先出法に変更した（<strong>会計方針の変更</strong>）。この変更を過去の財務諸表に遡って適用した結果、<mark class="q-asset">過去の期首商品棚卸高が先入先出法によればより高い金額であったことが判明し</mark>、<mark class="q-equity">利益剰余金期首残高を90,000円増額修正する必要が生じた</mark>（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its inventory valuation method from the weighted-average method to FIFO. Applying this retrospectively revealed that opening inventory under FIFO would have been ¥90,000 higher, requiring a ¥90,000 increase to opening retained earnings, ignoring tax effects. Record the retrospective-application entry.',
    e:[{d:[['繰越商品',90000]], c:[['利益剰余金期首残高',90000]]}],
    exp:'会計方針の変更による遡及適用は、必ずしも利益剰余金を減らす方向とは限りません。今回のように、変更後の方法（先入先出法）によれば過去の棚卸資産の評価額がより高かった場合は、逆に繰越商品（資産）を増額し、利益剰余金期首残高も増額修正します。まるで計算方法を変えたら過去の在庫が「実は少し多く評価されるべきだった」と判明したようなイメージで、「遡及適用は増える場合も減る場合もある」という点を、最初に学んだ問題（総平均法への変更で減額したケース）と対比して押さえておきましょう。'
  },
  { id:844, calc:'', level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の決算において、<mark class="q-as-li">備品の減価償却費40,000円の計上を失念していたことを当期に発見した</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had forgotten to record ¥40,000 of depreciation on equipment last period. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',40000]], c:[['減価償却累計額',40000]]}],
    exp:'減価償却費の計上漏れも、過去の財務諸表の誤りです（誤謬）。当期の減価償却費として今さら計上するのではなく、過去の誤りとして「利益剰余金期首残高」を直接減額し、本来計上すべきだった減価償却累計額を追加します。「見つけた時点の費用にしない、過去に遡って直接純資産を修正する」という誤謬訂正の基本パターンをもう一度確認する問題です。'
  },
  { id:845, calc:'', level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に、本来は修繕費として費用処理すべきであった<mark class="q-asset">支出（<strong>収益的支出</strong>）70,000円を、誤って建物の取得原価に含めて資産計上していた（<strong>資本的支出</strong>として処理していた）ことを当期に発見した</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい（減価償却の影響は考慮しない、税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had mistakenly capitalized ¥70,000 of expenditure into the cost of a building last period, when it should have been expensed as repairs. Record the retrospective restatement entry (ignore the depreciation impact and tax effects).',
    e:[{d:[['利益剰余金期首残高',70000]], c:[['建物',70000]]}],
    exp:'本来は費用にすべき支出（収益的支出）を、誤って資産（建物などの資本的支出）に計上してしまうケースも誤謬に該当します。まるで単なる補修費用を「リフォーム扱い」で資産に計上してしまったミスを直すようなイメージで、過大に計上されていた建物（資産）を減額し、対応する分だけ利益剰余金期首残高を減額して訂正します。「資産に計上しすぎていた」誤りも、収益・費用の計上誤りと同じように、利益剰余金期首残高を通じて修正する点は共通です。'
  },
  { id:846, calc:'120,000－80,000＝40,000円', level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の貸倒引当金の設定にあたり、計算式の入力ミスにより、<mark class="q-as-li">本来120,000円計上すべきところを80,000円しか計上していなかったことを当期に発見した</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that a calculation input error had caused it to record only ¥80,000 of allowance for doubtful accounts last period, when ¥120,000 was required. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',40000]], c:[['貸倒引当金',40000]]}],
    exp:'単純な計算ミスによって引当金が過少に計上されていた場合も誤謬に該当します（後で判明した新しい情報に基づく「見積りの変更」とは違い、当時すでに入手できていた情報の使い方を間違えた場合は誤謬です）。まるでExcelの計算式の入力ミスを後から見つけたようなイメージで、不足していた40,000円（120,000円－80,000円）を追加計上し、利益剰余金期首残高を減額します。'
  },
  { id:847, calc:'', level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の実地棚卸において、<mark class="q-asset">倉庫の一角にあった商品60,000円分を数え忘れており、期末商品棚卸高が過小に計上されていたことを当期に発見した</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that, during last period\'s physical inventory count, ¥60,000 of goods in a corner of the warehouse were overlooked, understating ending inventory. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['繰越商品',60000]], c:[['利益剰余金期首残高',60000]]}],
    exp:'実地棚卸の数え忘れのような、単純な事実誤認・集計ミスも誤謬に該当します。倉庫の隅にあった在庫を数え忘れていたケースで、過小だった繰越商品（資産）を追加計上し、対応する分だけ利益剰余金期首残高を増額修正します。誤謬の内容によって利益剰余金が増えるか減るかは変わりますが、「発見した期の損益にせず、利益剰余金期首残高を直接修正する」という処理方法自体は常に共通です。'
  },
  { id:848, calc:'', level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の法人税等の計算において、税率の適用誤りにより、<mark class="q-liability">本来より30,000円少なく法人税等を計上していたことを当期に発見した</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい。',
    en_q:'Company X discovered this period that, due to an incorrect tax rate applied last period, income taxes were understated by ¥30,000. Record the retrospective restatement entry.',
    e:[{d:[['利益剰余金期首残高',30000]], c:[['未払法人税等',30000]]}],
    exp:'損益項目だけでなく、税金費用（法人税等）の計算誤りも誤謬の訂正の対象になります。まるで確定申告の税率適用ミスを後から修正するようなイメージで、過少に計上されていた未払法人税等（負債）を追加計上し、利益剰余金期首残高を減額します。「税金の計算を間違えていた」というのも、会計上は他の費用の計上漏れと同じ枠組みで訂正します。'
  },
  { id:849, calc:'2,000,000×3％－40,000＝20,000円', level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は過去の貸倒実績率の見直しにより、当期末の貸倒引当金の設定率を売掛金残高の2％から3％に変更した（<strong>会計上の見積りの変更</strong>）。<mark class="q-expense">当期末売掛金残高2,000,000円に対する引当金の追加計上額（見積りの変更に伴う当期の影響分）を計上する</mark>（<mark class="q-as-li">同額を貸倒引当金に繰り入れる</mark>）仕訳を示しなさい（差額補充法、前期末引当金残高40,000円）。',
    en_q:"Company X revised its allowance rate for doubtful accounts from 2% to 3% of receivables, based on updated historical loss experience. Given a year-end receivables balance of ¥2,000,000 and a prior allowance balance of ¥40,000, record the entry recognizing the additional allowance required (using the incremental method).",
    e:[{d:[['貸倒引当金繰入',20000]], c:[['貸倒引当金',20000]]}],
    exp:'過去の貸倒実績（実際にどれくらい貸し倒れたか）が変化したことに基づいて引当金の設定率を見直すのは、新しい情報に基づく合理的な判断であり、「会計上の見積りの変更」に該当します。まるで保険の掛け金を最新のリスクデータに基づいて見直すようなイメージで、過去に遡って修正はせず、変更した当期以降の引当金の計算に、新しい設定率（3％）をそのまま反映させます。60,000円（2,000,000×3％）－40,000円（前期末残高）＝20,000円を当期に追加計上します。'
  },
  { id:850, calc:'550,000－500,000＝50,000円', level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社が計上している資産除去債務（帳簿価額500,000円）について、<mark class="q-liability">将来の除去費用の見積りが変更され（<strong>会計上の見積りの変更</strong>）、資産除去債務の金額を550,000円に修正する必要が生じた</mark>。<mark class="q-asset">見積りの変更による増加額を計上する</mark>仕訳を示しなさい（対応する資産の帳簿価額を増加させる）。',
    en_q:"Company X's recognized asset retirement obligation (book value ¥500,000) required revision to ¥550,000 due to a change in the estimated future removal cost. Record the entry recognizing the increase from this estimate change (increasing the corresponding asset's book value).",
    e:[{d:[['機械装置',50000]], c:[['資産除去債務',50000]]}],
    exp:'資産除去債務は「将来、その資産を撤去・処分するのにいくらかかるか」という見積りに基づいて計上します。物価上昇や技術動向の変化などにより、この見積り自体が変わることがあります。まるで将来の解体費用の見積りを、資材価格の上昇に合わせて見直すようなイメージで、これも「会計上の見積りの変更」に該当し、過去に遡って修正せず、変更があった時点で差額（50,000円）を資産除去債務（負債）と対応する固定資産（資産）の両方に反映させます。増加した分の固定資産は、残存耐用年数にわたって今後の減価償却を通じて費用化されます。'
  },
  { id:851, calc:'4,000,000×1.5％－40,000＝20,000円', level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は過去の保証実績データの見直しにより、製品保証引当金の設定率を売上高の1％から1.5％に変更した（<strong>会計上の見積りの変更</strong>）。<mark class="q-expense">当期売上高4,000,000円に対する引当金の追加計上額を計上する</mark>（<mark class="q-liability">同額を引当金に繰り入れる</mark>）仕訳を示しなさい（差額補充法、前期末引当金残高40,000円）。',
    en_q:"Company X revised its product warranty provision rate from 1% to 1.5% of sales, based on updated warranty claim experience. Given sales of ¥4,000,000 and a prior provision balance of ¥40,000, record the entry recognizing the additional provision required.",
    e:[{d:[['商品保証引当金繰入',20000]], c:[['商品保証引当金',20000]]}],
    exp:'製品保証引当金の設定率の見直しも、貸倒引当金と同じ「会計上の見積りの変更」です。まるで過去の故障発生率のデータをもとに、保証コストの見積りを更新するようなイメージで、過去の実績データが更新されたことに基づく合理的な判断なので、遡及適用はせず、当期の引当金計算に新しい設定率（1.5％）をそのまま反映させます。60,000円（4,000,000×1.5％）－40,000円（前期末残高）＝20,000円を追加計上します。'
  },
  { id:852, calc:'', level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の退職給付費用の計算において、勤務費用の集計ミスにより、<mark class="q-liability">本来より50,000円少なく退職給付費用を計上していたことを当期に発見した</mark>。<mark class="q-equity">前期以前の損益への影響は利益剰余金期首残高で修正する</mark>修正再表示（<strong>誤謬の訂正</strong>）の仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X discovered this period that a clerical error in tallying service cost caused last period's retirement benefit expense to be understated by ¥50,000. Record the retrospective restatement entry, ignoring tax effects.",
    e:[{d:[['利益剰余金期首残高',50000]], c:[['退職給付引当金',50000]]}],
    exp:'退職給付会計のような複雑な見積りを伴う領域でも、「入手可能だった情報に基づく計算を単純に間違えた」場合は、見積りの変更ではなく誤謬に該当します。まるで複雑な計算式の中の1つの数字を打ち間違えていたようなイメージで、不足していた退職給付引当金50,000円を追加計上し、利益剰余金期首残高を減額して訂正します。「新しい情報で見積りが変わった」のか「当時の情報の使い方を間違えた」のかを区別することが、誤謬と見積りの変更を見分けるポイントです。'
  },
  { id:853, calc:'繰延税金資産：90,000×30％＝27,000円\n利益剰余金期首残高の減少：90,000－27,000＝63,000円', level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に<mark class="q-asset">売上高（売掛金）を90,000円過大に計上していたことを当期に発見した</mark>。<strong>誤謬の訂正</strong>による修正再表示（<mark class="q-equity">利益剰余金期首残高の修正</mark>）にあたり、<mark class="q-asset">実効税率30％として税効果を考慮した</mark>仕訳を示しなさい。',
    en_q:'Company X discovered this period that it had overstated sales revenue (accounts receivable) by ¥90,000 last period. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['利益剰余金期首残高',63000],['繰延税金資産',27000]], c:[['売掛金',90000]]}],
    exp:'誤謬の訂正にも税効果会計を適用します。過大計上されていた売上高（売掛金）90,000円を取り消すと、将来的に税務上の調整を通じて税金負担が軽減される効果を持つため、繰延税金資産27,000円（90,000×30％）を認識します。残り63,000円が税引後ベースでの利益剰余金期首残高の減額分です。'
  },
  { id:854, calc:'繰延税金負債：50,000×30％＝15,000円\n利益剰余金期首残高の増加：50,000－15,000＝35,000円', level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の実地棚卸において、<mark class="q-asset">商品50,000円分を数え忘れており、期末商品棚卸高が過小に計上されていたことを当期に発見した</mark>。<strong>誤謬の訂正</strong>による修正再表示（<mark class="q-equity">利益剰余金期首残高の修正</mark>）にあたり、<mark class="q-liability">実効税率30％として税効果（<strong>将来加算一時差異</strong>）を考慮した</mark>仕訳を示しなさい。',
    en_q:'Company X discovered this period that, during last period\'s physical inventory count, ¥50,000 of goods were overlooked, understating ending inventory. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['繰越商品',50000]], c:[['繰延税金負債',15000],['利益剰余金期首残高',35000]]}],
    exp:'資産の過小計上（棚卸資産の数え忘れなど）を修正すると、過去の利益がその分増えていたはずだったことになるため、将来的な税金負担が増える効果（将来加算一時差異）を持ち、繰延税金負債15,000円（50,000×30％）を認識します。残り35,000円が税引後ベースでの利益剰余金期首残高の増額分です。修正再表示のたびに、その内容が「将来減算」なのか「将来加算」なのかを見極めて、繰延税金資産・負債のどちらを計上するか判断する必要があります。'
  },
  { id:855, calc:'', level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前々期および前期の2期にわたり、リース料の計上区分を誤っており、<mark class="q-liability">各期10,000円ずつ、合計20,000円の費用の計上漏れがあったことを当期に発見した</mark>。この累積影響額を<mark class="q-equity">利益剰余金期首残高で修正再表示する</mark>（<strong>誤謬の訂正</strong>）仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that a misclassification of lease payments over two prior periods resulted in ¥10,000 of unrecorded expense each period, totaling ¥20,000. Record the entry restating this cumulative effect, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',20000]], c:[['未払費用',20000]]}],
    exp:'誤謬が1期だけでなく複数の過去の期間にわたって生じていた場合は、それぞれの期の影響額を合計した「累積影響額」を、当期首の利益剰余金期首残高に対する一括修正として反映させます。まるで数年分の記帳ミスを一気にまとめて精算するようなイメージで、前々期分10,000円＋前期分10,000円＝合計20,000円。何年前の誤りであっても、発見した期の損益には一切影響させず、あくまで期首の純資産を直接修正する、という誤謬訂正の原則は変わりません。'
  },

  // ===== 1級：標準原価計算（差異分析・応用） =====
  { id:792, calc:'材料Ａ：200円×（735－750）kg＝△3,000円\n材料Ｂ：100円×（315－300）kg＝1,500円\n合計：△1,500円（不利差異）', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は製品を製造するにあたり、材料Ａ（標準単価＠200円）と材料Ｂ（標準単価＠100円）を標準配合比率7：3で投入している。当月、実際には材料Ａ750kg・材料Ｂ300kgを投入し（合計1,050kg）、標準配合比率で計算した実際投入量ベースの配合量は材料Ａ735kg・材料Ｂ315kgであった。<mark class="q-other">配合差異を計算し</mark>、<mark class="q-asset">仕掛品から</mark>配合差異勘定へ振り替える仕訳を示しなさい（不利差異）。',
    en_q:'Company X combines material A (standard price ¥200/kg) and material B (standard price ¥100/kg) in a standard mix ratio of 7:3. This month it actually used 750kg of A and 300kg of B (total 1,050kg); at the standard mix ratio, the actual total input implies 735kg of A and 315kg of B. Compute the mix variance and record the entry transferring it from work-in-process to the mix variance account (unfavorable).',
    e:[{d:[['配合差異',1500]], c:[['仕掛品',1500]]}],
    exp:'配合差異とは、複数の材料を組み合わせて製品を作る場合に、実際の配合比率が標準の配合比率とズレたことによって生じる差異です。まるでカレーのレシピで「肉多め・野菜少なめ」にアレンジしたら食材費が変わったようなイメージで、標準よりも単価の高い材料Ａを多く（735kg→750kg、15kg超過）、単価の低い材料Ｂを少なく（315kg→300kg、15kg減少）投入した結果、材料Ａ：200円×(735－750)＝△3,000円、材料Ｂ：100円×(315－300)＝＋1,500円、合計△1,500円（不利差異）が生じました。投入量の合計（1,050kg）は変わらなくても、「高い材料の比率を増やした」ことでコストが増加しています。'
  },
  { id:793, calc:'材料Ａ：200円×（700－735）kg＝△7,000円\n材料Ｂ：100円×（300－315）kg＝△1,500円\n合計：△8,500円（不利差異）', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＸ社において、標準投入量は材料Ａ700kg・材料Ｂ300kg（標準配合比率での実際生産量に対する必要量）であった。<mark class="q-other">歩留差異を計算し</mark>、<mark class="q-asset">仕掛品から</mark>歩留差異勘定へ振り替える仕訳を示しなさい（不利差異）。',
    en_q:'For Company X above, the standard input required for actual output (at the standard mix ratio) was 700kg of A and 300kg of B. Compute the yield variance and record the entry transferring it from work-in-process to the yield variance account (unfavorable).',
    e:[{d:[['歩留差異',8500]], c:[['仕掛品',8500]]}],
    exp:'歩留差異とは、材料の配合比率は標準どおりだったとしても、投入量の合計そのものが標準より多かった（＝歩留り＝原材料が製品に変わる効率が悪かった）ことによって生じる差異です。まるで料理の下ごしらえで皮を厚く剥きすぎて材料を無駄にしてしまったようなイメージで、標準配合比率のまま計算した必要量合計1,000kg（700kg＋300kg）に対し、実際には1,050kg（配合比率どおりで735kg＋315kg）を投入したため、50kg分（歩留りの悪化分）が余分にコストとしてかかっています。材料Ａ：200円×(700－735)＝△7,000円、材料Ｂ：100円×(300－315)＝△1,500円、合計△8,500円（不利差異）。'
  },
  { id:794, calc:'仕掛品：100,000×20％＝20,000円\n製品：100,000×30％＝30,000円\n売上原価：100,000×50％＝50,000円', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は標準原価計算を採用しており、当月の原価差異（不利差異）100,000円が比較的多額であったため、期末の<mark class="q-asset">仕掛品</mark>・<mark class="q-asset">製品</mark>・<mark class="q-expense">売上原価</mark>の標準原価の比率（仕掛品20％・製品30％・売上原価50％）で配分することとした。<mark class="q-other">原価差異を配分する</mark>仕訳を示しなさい。',
    en_q:'Company X uses standard costing. This month\'s cost variance (¥100,000 unfavorable) was relatively large, so it is allocated across ending work-in-process, finished goods, and cost of goods sold in proportion to their standard cost balances (WIP 20%, finished goods 30%, COGS 50%). Record the allocation entry.',
    e:[{d:[['仕掛品',20000],['製品',30000],['売上原価',50000]], c:[['原価差異',100000]]}],
    exp:'標準原価計算で生じた原価差異は、原則として当月の売上原価に賦課（すべて売上原価に加算）します。ただし、差異の金額が「比較的多額」である場合は、棚卸資産（期末仕掛品・期末製品）にもその発生原因が及んでいると考え、まるで大きな値上がりコストを在庫商品にも按分して反映させるようなイメージで、各在庫と売上原価の残高比率で配分します。100,000円×仕掛品20％＝20,000円、製品30％＝30,000円、売上原価50％＝50,000円。「差異が小さければ全部売上原価、大きければ在庫にも配分」という原価差異の会計処理の原則を扱う問題です。'
  },
  { id:795, calc:'', level:2, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は標準原価計算を採用しており、<mark class="q-other">当月の原価差異（有利差異）15,000円は少額であった</mark>ため、<mark class="q-expense">全額を売上原価に賦課する</mark>こととした。仕訳を示しなさい（有利差異のため売上原価を減額する）。',
    en_q:"Company X uses standard costing. This month's cost variance (¥15,000 favorable) was small, so it is charged entirely to cost of goods sold. Record the entry (a favorable variance reduces cost of goods sold).",
    e:[{d:[['原価差異',15000]], c:[['売上原価',15000]]}],
    exp:'原価差異が少額の場合は、簡便的に全額をその月の売上原価に賦課します。有利差異（実際原価が標準原価より少なくて済んだ）の場合は、売上原価を減額する方向で処理します。まるで予算より安く仕入れられた分、その月の原価がまるまる浮いたようなイメージで、「儲けが出た分だけ、売上原価が少なくて済んだ」ことになります。反対に不利差異であれば、売上原価を増額する方向で調整します。'
  },

  // ===== 1級：活動基準原価計算（ABC）・本社工場会計 =====
  { id:796, calc:'', level:3, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は活動基準原価計算（ABC）を採用しており、段取活動にかかる<mark class="q-expense">製造間接費240,000円を</mark>、段取回数（合計80回）を配賦基準として、活動基準配賦率＠3,000円で各製品に配賦する。製品Ａに40回・製品Ｂに40回の段取りが行われた場合、<mark class="q-asset">製造間接費を仕掛品へ配賦する</mark>仕訳を示しなさい。',
    en_q:'Company X uses activity-based costing (ABC). ¥240,000 of overhead from the setup activity is allocated using the number of setups (80 total) as the cost driver, at an activity rate of ¥3,000 per setup. Products A and B each required 40 setups. Record the entry allocating overhead to work-in-process.',
    e:[{d:[['仕掛品',240000]], c:[['製造間接費',240000]]}],
    exp:'活動基準原価計算（ABC）は、製造間接費を「生産量」ではなく「活動（段取り・検査・発注など）の発生回数」を基準に配賦する方法です。まるで工場の共通コストを「誰がどれだけ手間をかけさせたか」で公平に割り勘するようなイメージで、段取活動にかかる費用240,000円を、段取り回数合計80回で割ると、活動基準配賦率＠3,000円／回。製品Ａ・Ｂともに40回ずつ段取りが行われたため、それぞれ120,000円（40回×3,000円）が配賦されます。従来の「直接作業時間」などの単一基準による配賦よりも、実際に原価を発生させている活動の実態に即して配賦できる点がABCの利点です。'
  },
  { id:797, calc:'200時間×＠300円＝60,000円', level:3, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は検査活動にかかる<mark class="q-expense">製造間接費150,000円を</mark>、検査時間（合計500時間）を配賦基準として活動基準配賦率＠300円で配賦している（<strong>活動基準原価計算＝ABC</strong>）。製品Ｃに200時間の検査が行われた場合、<mark class="q-asset">製品Ｃへ配賦される製造間接費を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Company X allocates ¥150,000 of overhead from the inspection activity using inspection hours (500 total) as the cost driver, at an activity rate of ¥300 per hour. Product C required 200 inspection hours. Record the entry allocating the overhead assigned to Product C to work-in-process.',
    e:[{d:[['仕掛品',60000]], c:[['製造間接費',60000]]}],
    exp:'検査活動という別のコストプールについても同様に、活動の発生量（検査時間）を基準に配賦率を計算します。150,000円÷500時間＝＠300円／時間。製品Ｃに200時間の検査が行われたため、60,000円（200時間×300円）が製品Ｃに配賦されます。ABCでは、このように活動（コストドライバー）ごとに複数の配賦基準を使い分けるのが特徴です。'
  },
  { id:798, calc:'', sides:['本社側','工場側'], level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社会計と工場会計を独立させている（本社工場会計）。<mark class="q-asset">本社は工場のために材料500,000円を購入し</mark>、<mark class="q-asset">現金で支払い（<strong>立替払い</strong>）</mark>、そのまま<mark class="q-other">工場へ送付した</mark>（<mark class="q-other">工場側では本社勘定で受け入れる</mark>）。①本社側②工場側の仕訳をそれぞれ示しなさい。',
    en_q:"Company X keeps separate head-office and factory ledgers. The head office purchased ¥500,000 of materials for the factory, paying cash, and shipped them directly to the factory. Record the entries on (1) the head office's books and (2) the factory's books.",
    e:[{d:[['工場',500000]], c:[['現金',500000]]}, {d:[['材料',500000]], c:[['本社',500000]]}],
    exp:'本社工場会計では、本社と工場がそれぞれ独立した帳簿を持ちます。まるで支店と本店がそれぞれ独自の家計簿をつけているようなイメージで、本社と工場の間の取引は、通常の外部取引と同じように仕訳しますが、相手科目には「工場」「本社」という内部取引専用の勘定（照合勘定）を使います。①本社側：材料代金を立替払いし、工場に送付したので「工場」勘定（本社から見た工場への債権のようなもの）を借方に、現金を貸方に計上。②工場側：材料を受け入れたので「材料」を借方に、本社からの送付分として「本社」勘定（工場から見た本社への債務）を貸方に計上します。この2つの帳簿を合算すると、内部取引（工場・本社勘定）は相殺されて消えます。'
  },
  { id:799, calc:'', sides:['工場側','本社側'], level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＸ社において、<mark class="q-asset">工場で製品600,000円が完成し</mark>、<mark class="q-other">ただちに本社倉庫へ発送した</mark>（工場では製品勘定を持たず、<mark class="q-asset">完成した製品はすべて本社が管理する</mark>。<mark class="q-other">本社側は工場勘定を相手に受け入れる</mark>）。①工場側②本社側の仕訳をそれぞれ示しなさい。',
    en_q:"For Company X above, the factory completed ¥600,000 of finished goods and shipped them directly to the head office warehouse (the factory keeps no finished goods account; the head office manages all finished goods). Record the entries on (1) the factory's books and (2) the head office's books.",
    e:[{d:[['本社',600000]], c:[['仕掛品',600000]]}, {d:[['製品',600000]], c:[['工場',600000]]}],
    exp:'工場では、完成した製品を自ら保管せず、すぐに本社へ送付する場合があります。まるで工場直送のネット通販のように、①工場側：仕掛品（製造中の原価）が完成し、本社に送ったので「本社」勘定を借方（本社への送付＝本社に対する債権的な意味合い）に、仕掛品を貸方に計上。②本社側：工場から製品を受け入れたので「製品」を借方に、「工場」勘定を貸方に計上します。本社工場会計では、このように工場側の帳簿には「製品」勘定が登場しないケースも典型的な出題パターンです。'
  },
  { id:856, calc:'材料Ｃ：300円×（528－500）kg＝8,400円\n材料Ｄ：150円×（352－380）kg＝△4,200円\n合計：4,200円（有利差異）', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は材料Ｃ（標準単価＠300円）と材料Ｄ（標準単価＠150円）を標準配合比率6：4で投入している。当月、実際には材料Ｃ500kg・材料Ｄ380kgを投入し（合計880kg）、標準配合比率で計算した実際投入量ベースの配合量は材料Ｃ528kg・材料Ｄ352kgであった。<mark class="q-other">配合差異を計算し</mark>、<mark class="q-asset">仕掛品から</mark>配合差異勘定へ振り替える仕訳を示しなさい（有利差異）。',
    en_q:'Company X combines material C (standard price ¥300/kg) and material D (standard price ¥150/kg) in a standard mix ratio of 6:4. This month it actually used 500kg of C and 380kg of D (total 880kg); at the standard mix ratio, the actual total input implies 528kg of C and 352kg of D. Compute the mix variance and record the entry transferring it from work-in-process to the mix variance account (favorable).',
    e:[{d:[['仕掛品',4200]], c:[['配合差異',4200]]}],
    exp:'標準よりも単価の高い材料Ｃを少なく（528kg→500kg、28kg減少）、単価の低い材料Ｄを多く（352kg→380kg、28kg増加）投入した結果、材料Ｃ：300円×(528－500)＝＋8,400円、材料Ｄ：150円×(352－380)＝△4,200円、合計＋4,200円（有利差異）となりました。まるで高級食材の使用量を控えめにして、コストを抑えることに成功したレシピ改良のようなイメージで、安い材料の比率を増やしたことでコストが節約されています。有利差異の場合は、不利差異のときとは逆に、仕掛品を借方、配合差異を貸方に計上します。'
  },
  { id:857, calc:'材料Ｃ：300円×（540－528）kg＝3,600円\n材料Ｄ：150円×（360－352）kg＝1,200円\n合計：4,800円（有利差異）', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＸ社において、標準投入量は材料Ｃ540kg・材料Ｄ360kg（標準配合比率での実際生産量に対する必要量）であった。<mark class="q-other">歩留差異を計算し</mark>、<mark class="q-asset">仕掛品から</mark>歩留差異勘定へ振り替える仕訳を示しなさい（有利差異）。',
    en_q:'For Company X above, the standard input required for actual output (at the standard mix ratio) was 540kg of C and 360kg of D. Compute the yield variance and record the entry transferring it from work-in-process to the yield variance account (favorable).',
    e:[{d:[['仕掛品',4800]], c:[['歩留差異',4800]]}],
    exp:'標準配合比率のまま計算した必要量合計900kg（540kg＋360kg）に対し、実際の投入量合計は880kg（配合比率どおりで528kg＋352kg）で済んだため、20kg分だけ材料の無駄が少なく、歩留りが良かったことになります。まるで丁寧な作業で食材ロスを減らせた料理人のようなイメージで、材料Ｃ：300円×(540－528)＝＋3,600円、材料Ｄ：150円×(360－352)＝＋1,200円、合計＋4,800円（有利差異）。歩留りが標準より良かった分、コストが節約されたことを表しています。'
  },
  { id:858, calc:'材料（予定価格）：1,000kg×＠250円＝250,000円\n材料受入価格差異：260,000－250,000＝10,000円', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は材料の購入時点で価格差異を把握する方式を採用している。<mark class="q-asset">材料1,000kgを予定価格＠250円（合計250,000円）で購入する予定であったが、実際には＠260円（合計260,000円）で購入し</mark>、<mark class="q-asset">現金で支払った</mark>。購入時の仕訳を示しなさい（材料は予定価格で受け入れ、<mark class="q-other">実際との差額は材料受入価格差異とする</mark>）。',
    en_q:'Company X recognizes material price variances at the point of purchase. It purchased 1,000kg of material at an actual price of ¥260/kg (total ¥260,000) versus a standard price of ¥250/kg (total ¥250,000), paying cash. Record the purchase entry (materials are recorded at standard price).',
    e:[{d:[['材料',250000],['材料受入価格差異',10000]], c:[['現金',260000]]}],
    exp:'材料の価格差異を「消費時点」ではなく「購入（受入）時点」で把握する方法を「材料受入価格差異」と呼びます。まるで仕入れた瞬間にレシートを見て「予算オーバーした分」をすぐに帳簿につけるようなイメージで、材料そのものは予定価格（＠250円）で帳簿に受け入れ、実際の支払額（260,000円）との差額10,000円は、購入した時点ですぐに「材料受入価格差異」（不利差異）として区分します。この方法のメリットは、材料を消費するたびに複雑な価格差異の計算をしなくて済み、材料勘定が常に予定価格で統一される点です。'
  },
  { id:859, calc:'予定配賦額：400,000×5％＝20,000円\n差異：22,000－20,000＝2,000円（不利差異）', level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は材料の購入にあたり、材料副費（引取運賃等）を購入代価の5％で予定配賦している。材料の購入代価は400,000円、<mark class="q-other">実際にかかった材料副費は22,000円であった</mark>。予定配賦額との<mark class="q-other">差異を材料副費差異として計上する</mark>仕訳を示しなさい。',
    en_q:"Company X applies incidental material costs (freight-in, etc.) at a predetermined rate of 5% of purchase price. The purchase price was ¥400,000, while actual incidental costs were ¥22,000. Record the entry recognizing the variance from the applied amount.",
    e:[{d:[['材料副費差異',2000]], c:[['材料副費',2000]]}],
    exp:'材料副費（引取運賃、購入手数料など）も、実際発生額を都度集計するのは煩雑なため、購入代価に対する一定率で「予定配賦」することがあります。まるで送料をあらかじめ「商品代金の5％」とざっくり見積もっておき、後で実際の請求額と精算するようなイメージで、予定配賦額20,000円（400,000×5％）に対し、実際発生額は22,000円だったため、2,000円の不利差異（予定より多くかかった）が生じます。材料副費勘定を予定配賦額でいったん締め、実際発生額との差額を「材料副費差異」として区分します。'
  },
  { id:860, calc:'12回×＠3,000円＝36,000円', level:2, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は発注活動にかかる<mark class="q-expense">製造間接費90,000円を</mark>、発注回数（合計30回）を配賦基準として活動基準配賦率＠3,000円で配賦している（<strong>活動基準原価計算＝ABC</strong>）。製品Ｄに12回の発注が行われた場合、<mark class="q-asset">製品Ｄへ配賦される製造間接費を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Company X allocates ¥90,000 of overhead from the ordering activity using the number of purchase orders (30 total) as the cost driver, at an activity rate of ¥3,000 per order. Product D required 12 purchase orders. Record the entry allocating the overhead assigned to Product D to work-in-process.',
    e:[{d:[['仕掛品',36000]], c:[['製造間接費',36000]]}],
    exp:'発注活動（購買部門が材料や部品を発注する業務）も、ABCでは独立したコストプールとして扱われます。90,000円÷30回＝＠3,000円／回。製品Ｄに12回分の発注が発生したため、36,000円（12回×3,000円）が製品Ｄに配賦されます。段取活動・検査活動と同じように、活動の発生量に応じて配賦する考え方は共通です。'
  },
  { id:861, calc:'配賦率：300,000÷1,000時間＝＠300円\n製品Ｅ：300時間×＠300円＝90,000円', level:2, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は従来、<mark class="q-expense">製造間接費300,000円を</mark>直接作業時間（合計1,000時間）を基準に一律配賦していたが、製品Ｅに要した直接作業時間は300時間であった。ABC導入前の伝統的な配賦方法による<mark class="q-asset">製品Ｅへの配賦額を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Before adopting ABC, Company X allocated ¥300,000 of overhead uniformly based on direct labor hours (1,000 total). Product E required 300 direct labor hours. Record the entry allocating overhead to Product E under the traditional (pre-ABC) method.',
    e:[{d:[['仕掛品',90000]], c:[['製造間接費',90000]]}],
    exp:'ABC導入前の伝統的な原価計算では、直接作業時間や機械稼働時間など「単一の配賦基準」で製造間接費をまとめて配賦します。まるで会社の共通経費を全社員数で単純に割り勘するような大雑把な方法で、300,000円÷1,000時間＝＠300円／時間。製品Ｅの作業時間300時間分：90,000円（300時間×300円）が配賦されます。ABC（活動ごとに複数の配賦基準を使う）と比べて計算はシンプルですが、活動の実態を反映しにくく、原価の歪みが生じやすいという欠点があります。両者を対比して理解しておきましょう。'
  },
  { id:862, calc:'35回×＠2,000円＝70,000円', level:2, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は品質検査活動にかかる<mark class="q-expense">製造間接費200,000円を</mark>、検査回数（合計100回）を配賦基準として活動基準配賦率＠2,000円で配賦している。製品Ｆに35回の検査が行われた場合、<mark class="q-asset">製品Ｆへ配賦される製造間接費を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Company X allocates ¥200,000 of overhead from the quality inspection activity using the number of inspections (100 total) as the cost driver, at an activity rate of ¥2,000 per inspection. Product F required 35 inspections. Record the entry allocating the overhead assigned to Product F to work-in-process.',
    e:[{d:[['仕掛品',70000]], c:[['製造間接費',70000]]}],
    exp:'検査活動のコストドライバーは「検査時間」（すでに学んだ例）だけでなく、「検査回数」を使うこともあります。どちらのドライバーがより実態を表すかは、活動の性質によって使い分けます。200,000円÷100回＝＠2,000円／回。製品Ｆに35回の検査が行われたため、70,000円（35回×2,000円）が配賦されます。同じ「検査」という活動でも、時間基準か回数基準かでコストドライバーの選び方が変わる、という実務上の判断ポイントを扱う問題です。'
  },
  { id:863, calc:'本社の従業員の給料：500,000－300,000＝200,000円', sides:['本社側','工場側'], level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社工場会計を採用しており、本社が全従業員の<mark class="q-expense">給与500,000円</mark>（うち<mark class="q-expense">工場従業員分300,000円</mark>）を、<mark class="q-asset">現金で一括支払った</mark>。<mark class="q-other">工場従業員分は工場勘定で工場へ付け替え</mark>、<mark class="q-other">工場側は本社勘定で受け入れる</mark>。①本社側②工場側の仕訳をそれぞれ示しなさい。',
    en_q:"Company X keeps separate head-office and factory ledgers. The head office paid all employees' salaries of ¥500,000 in cash in one lump sum (of which ¥300,000 relates to factory employees). Record the entries on (1) the head office's books and (2) the factory's books.",
    e:[{d:[['給料',200000],['工場',300000]], c:[['現金',500000]]}, {d:[['賃金・給料',300000]], c:[['本社',300000]]}],
    exp:'本社が全社員分の給与をまとめて支払う場合、本社は自社負担分（本社従業員分200,000円）を「給料」として計上し、工場負担分（300,000円）は「工場」勘定（内部取引の照合勘定）として区分します。まるで家族の共通口座から全員分の支払いをまとめて済ませ、後で誰がいくら使ったか精算するようなイメージで、工場側は、本社が立て替えて支払ってくれた自分たちの給与を「賃金・給料」として計上し、相手科目に「本社」勘定（本社への債務）を計上します。「本社が全部払うが、工場の分は内部で精算する」という構造です。'
  },
  { id:864, calc:'', sides:['本社側','工場側'], level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社工場会計を採用しており、固定資産（機械装置）はすべて本社の帳簿で管理している。工場で使用する<mark class="q-expense">機械装置の当月減価償却費50,000円について</mark>、<mark class="q-as-li">本社は減価償却累計額を計上し</mark>、<mark class="q-other">工場勘定に付け替え</mark>、<mark class="q-other">工場は本社勘定を相手に受け入れる</mark>。①本社側②工場側の仕訳をそれぞれ示しなさい。',
    en_q:"Company X keeps separate head-office and factory ledgers, with all fixed assets (machinery) recorded on the head office's books. Record the entries on (1) the head office's books and (2) the factory's books for this month's ¥50,000 depreciation on machinery used at the factory.",
    e:[{d:[['工場',50000]], c:[['減価償却累計額',50000]]}, {d:[['製造間接費',50000]], c:[['本社',50000]]}],
    exp:'固定資産を本社が一括管理している場合、工場で使う機械装置の減価償却費であっても、資産の減少（減価償却累計額の増加）自体は本社の帳簿で記録します。まるでグループ会社の設備を親会社が一括管理し、使用料だけを子会社に請求するようなイメージで、本社は工場のための費用を負担した形になるので「工場」勘定（内部債権）を借方に計上します。工場側は、この減価償却費を自らの製造原価（製造間接費）として受け入れ、相手科目に「本社」勘定（内部債務）を計上します。「資産の管理は本社、費用の発生は工場」という役割分担を仕訳で表現しています。'
  },
  { id:865, calc:'', sides:['工場側','本社側'], level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社工場会計を採用しており、工場は完成した製品を本社を経由せず、得意先へ直接発送・販売することがある。工場が<mark class="q-asset">製品（原価400,000円）を</mark>得意先へ<mark class="q-revenue">600,000円で直接販売し</mark>、<mark class="q-asset">販売代金は本社の当座預金口座に振り込まれた</mark>。①工場側（<mark class="q-expense">売上原価</mark>を<mark class="q-other">本社勘定で本社へ付け替える</mark>）②本社側（売上を計上し、<mark class="q-other">売上原価を工場勘定で受け入れる</mark>）の仕訳をそれぞれ示しなさい。',
    en_q:"Company X's factory sometimes ships and sells finished goods directly to customers without routing through the head office. The factory sold goods (cost ¥400,000) directly to a customer, and the ¥600,000 proceeds were deposited into the head office's checking account. Record the entries on (1) the factory's books (transferring the cost) and (2) the head office's books (recognizing the sale).",
    e:[{d:[['本社',400000]], c:[['製品',400000]]}, {d:[['当座預金',600000],['売上原価',400000]], c:[['売上',600000],['工場',400000]]}],
    exp:'工場が得意先へ製品を直接発送・販売するケースでも、売上の計上自体は原則として本社側で行います（工場は製造・出荷の実行部隊、本社が販売・会計の窓口という役割分担）。まるで工場から直接発送される通販商品でも、売上計上や経理処理は本社が一元管理するようなイメージで、①工場側：出荷した製品（原価400,000円）を製品勘定から減らし、本社に対する内部債権として「本社」勘定を計上します。②本社側：得意先からの入金600,000円を「売上」として計上するとともに、工場から引き継いだ原価400,000円を「売上原価」として計上し、その相手科目として「工場」勘定（内部債務）を計上します。'
  },
  { id:866, calc:'125,000×25／125＝25,000円', level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社の工場は、本社へ製品（原価400,000円）を振替価格500,000円（原価に25％の内部利益を加算）で発送している。決算時点で、本社の製品在庫のうち振替価格125,000円分（原価100,000円相当）が未販売のまま残っていた。<mark class="q-expense">この未実現の内部利益を消去し</mark>、<mark class="q-as-li">同額を繰延内部利益として繰り延べる</mark>仕訳を示しなさい。',
    en_q:"Company X's factory ships products to the head office at a transfer price of ¥500,000 (cost ¥400,000 plus a 25% internal markup). At year-end, ¥125,000 (at transfer price; ¥100,000 at cost) of this inventory remained unsold at the head office. Record the entry eliminating the unrealized internal profit.",
    e:[{d:[['内部利益控除',25000]], c:[['繰延内部利益',25000]]}],
    exp:'工場が本社へ製品を振替価格（原価400,000円に25％の利益を上乗せした500,000円）で送っている場合、本社に残っている未販売の製品在庫にも、まだ実現していない「内部利益」が含まれてしまっています。まるでグループ会社間で商品を転売するたびに少しずつ利益を上乗せしていくと、在庫の評価額が実態より膨らんでしまうようなイメージで、決算にあたっては、この未実現の内部利益（125,000円×25／125＝25,000円）を、貸借対照表上の棚卸資産の評価額から除く必要があります。借方に「内部利益控除」（損益計算書上、売上原価の調整項目）、貸方に「繰延内部利益」（貸借対照表の評価性引当のような性質の科目）を計上し、翌期に振り戻します。'
  },
  { id:867, calc:'', sides:['合算時'], level:2, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社の本社工場会計において、決算時に<mark class="q-other">本社元帳の「工場」勘定残高は800,000円（借方）</mark>、<mark class="q-other">工場元帳の「本社」勘定残高は800,000円（貸方）</mark>であり、両者は一致していた。この場合、合算財務諸表を作成するにあたり、内部取引を相殺消去する仕訳を示しなさい。',
    en_q:"In Company X's head-office/factory accounting, at year-end the head office's \"Factory\" account had an ¥800,000 debit balance, matching the factory's \"Head Office\" account ¥800,000 credit balance. When preparing combined financial statements, record the entry eliminating this internal transaction.",
    e:[{d:[['本社',800000]], c:[['工場',800000]]}],
    exp:'本社工場会計では、本社の「工場」勘定と工場の「本社」勘定は、通常、常に同額（貸借逆）になっているはずです（内部取引のたびにセットで記帳しているため）。まるで家計簿の「貸した」「借りた」がぴったり一致するのを確認するようなイメージで、合算した財務諸表（本社と工場を1つにまとめたもの）を作成する際は、この内部取引専用の勘定（照合勘定）を相殺消去し、外部から見える金額だけを残します。連結会計における債権債務の相殺消去と同じ考え方が、本社工場会計にも当てはまります。'
  },
  { id:878, calc:'', sides:['Ａ事業部側','Ｂ事業部側'], level:2, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は事業部制を採用しており、<mark class="q-asset">Ａ事業部は製品（部品）を</mark>全部原価（製造原価）400,000円で<mark class="q-other">Ｂ事業部へ振り替え</mark>、<mark class="q-asset">Ｂ事業部はこれを材料として</mark><mark class="q-other">Ａ事業部から受け入れた</mark>。振替価格に利益を加算しない場合の①Ａ事業部側②Ｂ事業部側の仕訳を示しなさい。',
    en_q:'Company X uses a divisional structure. Division A transferred parts to Division B at full cost (manufacturing cost) of ¥400,000, with no profit markup on the transfer price. Record the entries on (1) Division A\'s books and (2) Division B\'s books.',
    e:[{d:[['B事業部',400000]], c:[['製品',400000]]}, {d:[['材料',400000]], c:[['A事業部',400000]]}],
    exp:'全部原価基準による振替は、振り渡す事業部（Ａ事業部）が製造原価のまま、利益を一切乗せずに振り替える方法です。まるで社内の別部署に材料を「原価そのまま」で融通するイメージで、Ａ事業部にとっては利益がゼロなので、業績評価の観点からは不満が残る場合がありますが、グループ全体で見れば最もシンプルで、内部利益の消去も不要という利点があります。「A事業部」「B事業部」という勘定は、本社工場会計の「本社」「工場」勘定と同じ、事業部間の内部取引を管理するための照合勘定です。'
  },
  { id:879, calc:'', sides:['Ａ事業部側','Ａ事業部側'], level:3, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社のＡ事業部は、<mark class="q-revenue">外部市場での販売価格（市価）500,000円</mark>（<mark class="q-expense">原価400,000円</mark>）で<mark class="q-other">Ｂ事業部へ</mark><mark class="q-asset">製品を振り替えた</mark>。Ａ事業部側の仕訳を示しなさい。',
    en_q:"Company X's Division A transferred products to Division B at the external market price of ¥500,000 (cost ¥400,000). Record the entry on Division A's books.",
    e:[{d:[['B事業部',500000]], c:[['製品振替収益',500000]]}, {d:[['売上原価',400000]], c:[['製品',400000]]}],
    exp:'市価基準による振替は、外部の市場価格をそのまま使って事業部間の取引を行う方法です。まるで社内の別部署にも「外部のお客さんと同じ値段」で売るようなイメージで、Ａ事業部からみれば、外部に売ったのと同じように「収益」（製品振替収益）を認識でき、原価との差額100,000円が事業部の利益として業績評価に反映されます。ただし、Ｂ事業部にとっては外部から買うのと同じコストがかかるため、グループ全体で見ると「内部利益」が生じている点に注意が必要です（決算時の消去は別問参照）。'
  },
  { id:880, calc:'', sides:['Ｂ事業部側'], level:2, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＢ事業部は、<mark class="q-other">Ａ事業部から</mark>振替価格500,000円で<mark class="q-asset">製品を材料として受け入れた</mark>。Ｂ事業部側の仕訳を示しなさい。',
    en_q:"Division B above received products from Division A at the transfer price of ¥500,000. Record the entry on Division B's books.",
    e:[{d:[['材料',500000]], c:[['A事業部',500000]]}],
    exp:'受け入れる側（Ｂ事業部）は、外部から購入する場合と同じように、振替価格（500,000円）をそのまま材料の取得原価として計上します。Ｂ事業部にとっては、この振替価格が外部購入価格と同じかどうかに関わらず、実際に負担した金額として処理する点がポイントです。振替価格の決め方（全部原価・市価・交渉価格）が違っても、受け入れ側の処理そのものは変わりません。'
  },
  { id:881, calc:'300,000－240,000＝60,000円', level:3, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記の取引について、決算時点でＢ事業部がＡ事業部から受け入れた製品（振替価格500,000円、原価400,000円相当）のうち、300,000円分（原価240,000円相当）がまだ外部に販売されずＢ事業部の在庫として残っていた。<mark class="q-expense">この未実現の内部利益を消去し</mark>、<mark class="q-as-li">同額を繰延内部利益として繰り延べる</mark>仕訳を示しなさい。',
    en_q:"At year-end, of the products Division B received from Division A (transfer price ¥500,000, cost ¥400,000), ¥300,000 (at transfer price; cost ¥240,000) remained unsold in Division B's inventory. Record the entry eliminating the unrealized internal profit.",
    e:[{d:[['内部利益控除',60000]], c:[['繰延内部利益',60000]]}],
    exp:'市価基準や原価に利益を上乗せする方式で事業部間の振替を行うと、受け入れた事業部の在庫にまだ売れ残りがある場合、そこに含まれる内部利益（グループ全体では実現していない利益）を、連結財務諸表や合算財務諸表を作成する際に消去する必要があります。本社工場会計で学んだ「内部利益控除」「繰延内部利益」と全く同じ処理です。300,000円×20％（利益率）＝60,000円が未実現の内部利益です。'
  },
  { id:882, calc:'', sides:['Ａ事業部側','Ａ事業部側'], level:3, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社のＡ事業部とＢ事業部は、事業部間の交渉により<mark class="q-revenue">振替価格を450,000円</mark>（<mark class="q-expense">Ａ事業部の原価400,000円</mark>、市価500,000円の中間）に合意し、<mark class="q-asset">製品を</mark><mark class="q-other">Ｂ事業部へ振り替えた</mark>。Ａ事業部側の仕訳を示しなさい。',
    en_q:"Divisions A and B of Company X negotiated a transfer price of ¥450,000 (between Division A's cost of ¥400,000 and the market price of ¥500,000). Record the entry on Division A's books.",
    e:[{d:[['B事業部',450000]], c:[['製品振替収益',450000]]}, {d:[['売上原価',400000]], c:[['製品',400000]]}],
    exp:'交渉価格基準は、全部原価（400,000円）と市価（500,000円）の間で、事業部同士が話し合って振替価格を決める方法です。まるで社内の2つのチームが「お互い納得できる値段」を話し合って決めるようなイメージで、今回は中間の450,000円で合意しました。Ａ事業部の利益は50,000円（450,000－400,000）となり、全部原価基準（利益ゼロ）と市価基準（利益100,000円）の中間的な結果になります。「両事業部が納得できる価格を交渉で決める」という、実務でもよく使われる柔軟な方法です。'
  },
  { id:883, calc:'', sides:['合算時'], level:2, cat:'振替価格', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社（<strong>事業部制</strong>）の決算時、<mark class="q-other">Ａ事業部元帳の「Ｂ事業部」勘定残高は450,000円（借方）</mark>、<mark class="q-other">Ｂ事業部元帳の「Ａ事業部」勘定残高は450,000円（貸方）</mark>であった。合算財務諸表を作成するにあたり、この内部取引を相殺消去する仕訳を示しなさい。',
    en_q:"At year-end, Division A's \"Division B\" account had a ¥450,000 debit balance, matching Division B's \"Division A\" account ¥450,000 credit balance. When preparing combined financial statements, record the entry eliminating this internal transaction.",
    e:[{d:[['A事業部',450000]], c:[['B事業部',450000]]}],
    exp:'事業部制でも、本社工場会計と同様に、事業部間の内部取引を管理するための照合勘定（「Ａ事業部」「Ｂ事業部」）を使います。決算時に合算財務諸表を作る際は、グループ内部でのお金の動きに過ぎない部分（内部取引残高）を相殺消去し、外部との取引だけが財務諸表に反映されるようにします。事業部制であっても本社工場会計であっても、「内部取引は最終的に相殺してゼロにする」という考え方は共通です。'
  },

  // ===== PDF教材準拠（新版）差し替え開始 =====
  // --- 第1章：商品売買 ---
  { id:1001, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'洗剤や日用品を小売店に卸しているX社は、洗剤メーカーのY社から、洗剤や柔軟剤などの<mark class="q-expense">商品100円分を購入</mark>して受け取った。<mark class="q-liability">代金は月末にまとめて支払う約束</mark>（<strong>掛け</strong>）になっている。仕訳を行いなさい。',
    e:[{d:[['仕入',100]],c:[['買掛金',100]]}],
    exp:'「掛け」とは、商品を受け取る時点では代金を払わず、後日まとめて支払う約束で取引することです。商品を受け取った瞬間に「仕入」という費用（＝会社の財産を使って得た対価）がすでに発生しているので、代金をまだ払っていなくても仕入は計上します。一方、「あとで払わなければならない」という義務は「買掛金」という負債（＝将来、他人に支払う義務）として記録します。費用（仕入）が増え、負債（買掛金）も増える、という組み合わせです。'
  },
  { id:1002, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、ドラッグストアチェーンのZ社に、洗剤などの<mark class="q-revenue">商品150円分を納品</mark>した。<mark class="q-asset">代金は翌月末に振り込んでもらう約束（掛け）になっている</mark>。仕訳を行いなさい。',
    e:[{d:[['売掛金',150]],c:[['売上',150]]}],
    exp:'商品を渡す時点では代金を受け取らず、後日まとめて受け取る約束で取引するのが「掛け」です。商品を渡した瞬間に「売上」という収益（＝会社の財産が増える原因になる出来事）が発生したと考えます。まだ代金を受け取っていない分は「売掛金」という資産（＝将来、お金を受け取れる権利）として記録します。収益（売上）が増え、資産（売掛金）も増える、という組み合わせです。'
  },
  { id:1003, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社から掛けで<mark class="q-expense">購入した商品</mark>のうち、注文とは違う種類の柔軟剤10円分が届いていたため、その分を送り返し、<mark class="q-liability">支払う代金</mark>から差し引いてもらうことにした。仕訳を行いなさい。',
    e:[{d:[['買掛金',10]],c:[['仕入',10]]}],
    exp:'商品を仕入先に返品すると、もともと計上していた仕入（費用）と買掛金（負債）を、その分だけ取り消す必要があります。「返品＝仕入れがなかったことにする」とイメージすると分かりやすく、仕入れたときとちょうど逆向きの仕訳（借方・貸方を入れ替えた仕訳）になります。買掛金（負債）が減り、仕入（費用）も減る、という組み合わせです。'
  },
  { id:1004, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に掛けで<mark class="q-revenue">納品した商品</mark>のうち、箱がつぶれた不良品が混じっていたため、Z社の申し出を受けて15円分の代金を引き下げ、Z社が<mark class="q-asset">支払う代金</mark>から差し引くことにした。商品はZ社がそのまま使用する。仕訳を行いなさい。',
    e:[{d:[['売上',15]],c:[['売掛金',15]]}],
    exp:'商品を返品してもらうわけではなく、品質の悪さを理由に代金を値引きするケースです。この場合、商品自体は動かないので在庫の仕訳はせず、単純に売上（収益）を値引き分だけ減らし、まだ受け取っていない代金の権利である売掛金（資産）も同額減らします。「売上を少し安くした分、将来受け取れるお金も少なくなる」という関係です。'
  },
  { id:1005, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社に洗剤100円分を注文し、契約の際に、代金の一部として<mark class="q-asset">20円を前払いし（内金）</mark>、<mark class="q-asset">現金で渡した</mark>。商品はまだ届いていない。仕訳を行いなさい。',
    e:[{d:[['前払金',20]],c:[['現金',20]]}],
    exp:'「内金」とは、注文や契約を確実にするために、代金の一部を前もって渡すお金のことです。まだ商品を受け取っていない段階なので、この20円はまだ「仕入」という費用にはなりません。「将来、商品を受け取れる権利」として「前払金」という資産（＝将来、何かを受け取れる権利）で処理します。現金（資産）が前払金（資産）という形に姿を変えただけ、と考えると分かりやすいです。'
  },
  { id:1006, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社から洗剤など100円分の注文を受け、契約の際に、代金の一部として<mark class="q-asset">20円を現金で</mark><mark class="q-liability">先に受け取った（内金）</mark>。商品はまだ渡していない。仕訳を行いなさい。',
    e:[{d:[['現金',20]],c:[['前受金',20]]}],
    exp:'こちらは内金を受け取る側の処理です。まだ商品を渡していないので、受け取った20円はまだ「売上」という収益にはなりません。「将来、商品を渡さなければならない義務」として「前受金」という負債（＝将来、何かをしなければならない義務）で処理します。現金（資産）は増えますが、同時に「商品を渡す義務」という負債も増える、という組み合わせです。'
  },
  { id:1007, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社に対する<mark class="q-liability">月末払いの商品代金100円</mark>を<mark class="q-asset">現金で支払った</mark>。仕訳を行いなさい。',
    e:[{d:[['買掛金',100]],c:[['現金',100]]}],
    exp:'仕入れた時点ですでに「買掛金」という負債（＝後で払う義務）を計上済みです。今回はその約束を現金で果たしただけなので、新たに費用は発生しません。買掛金（負債）が消え、現金（資産）が減る、という単純な取引です。'
  },
  { id:1008, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に納品済みで<mark class="q-asset">まだ受け取っていなかった代金</mark>150円を、Z社から<mark class="q-asset">現金</mark>で受け取った。仕訳を行いなさい。',
    e:[{d:[['現金',150]],c:[['売掛金',150]]}],
    exp:'売り上げた時点ですでに「売掛金」という資産（＝後で受け取れる権利）を計上済みです。今回はその権利が実際の現金に変わっただけなので、新たに収益は発生しません。売掛金（資産）が減り、現金（資産）が増える、資産の中身が入れ替わるだけの取引です。'
  },
  { id:1009, calc:'仕入：100＋5＝105円（引取運賃は仕入に含める）', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社から商品100円分を<mark class="q-liability">掛け</mark>で<mark class="q-expense">購入</mark>した。Y社の倉庫からX社の倉庫まで商品を運んでもらった運送会社への運賃5円は、X社が<mark class="q-asset">現金で支払った</mark>（<strong>引取運賃</strong>）。仕訳を行いなさい。',
    e:[{d:[['仕入',105]],c:[['買掛金',100],['現金',5]]}],
    exp:'「引取運賃」とは、購入した商品を、相手先から自社の倉庫まで運んでもらうための運賃のことです。商品を仕入れて使えるようになるまでにかかった費用は、すべて仕入（商品の取得コスト）に含めるのが原則なので、商品代金100円に運賃5円を足した105円を「仕入」として計上します。代金のうち100円は買掛金（負債）、運賃5円は現金払いなので現金（資産）の減少として処理します。'
  },
  { id:1010, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に商品100円分を<mark class="q-asset">掛け</mark>で<mark class="q-revenue">納品した</mark>。<mark class="q-expense">配送業者への発送費5円は</mark>、X社が<mark class="q-asset">現金で支払った</mark>（X社の負担）。仕訳を行いなさい。',
    e:[{d:[['売掛金',100],['発送費',5]],c:[['売上',100],['現金',5]]}],
    exp:'商品を売る側が負担する発送費は、商品そのものの売上とは別の性質の費用として「発送費」で処理します。売上代金100円は売掛金（資産）として計上し、自社が負担した発送費5円は現金（資産）の減少とあわせて費用（発送費）として計上します。売上の金額と発送費の金額を混ぜずに、別々に記録するのがポイントです。'
  },
  { id:1011, calc:'売掛金：100＋5＝105円（先方負担の発送費は代金とあわせて請求）', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社に<mark class="q-revenue">商品100円分を掛け</mark>で納品した。配送業者への発送費5円は、いったんX社が<mark class="q-asset">現金で支払った</mark>が、契約により、この発送費はZ社が負担することになっている（<strong>先方負担</strong>）。<mark class="q-asset">この発送費は、商品の代金とあわせてZ社に請求する</mark>。仕訳を行いなさい。',
    e:[{d:[['売掛金',105]],c:[['売上',100],['現金',5]]}],
    exp:'「先方負担」とは、相手の会社が費用を負担することです。発送費は一時的にX社が現金で立て替えましたが、最終的にはZ社に請求するため、X社にとっては費用にはなりません。売上代金100円と立て替えた発送費5円を合わせた105円を、まとめて売掛金（資産）として計上します。「自分の費用ではなく、相手への請求額の一部」として扱う点が、前の問題（自社負担）との大きな違いです。'
  },
  { id:1012, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Z社が本来負担すべき配送料5円を、<mark class="q-asset">Z社に立て替えて</mark>配送業者に<mark class="q-asset">現金で支払った</mark>。この配送料は、商品の代金とは別に、後でZ社に請求する。仕訳を行いなさい。',
    e:[{d:[['立替金',5]],c:[['現金',5]]}],
    exp:'前の問題と似ていますが、こちらは商品の代金とは別立てで、あとから改めてZ社に請求するケースです。この5円はX社の費用ではなく、「Z社の代わりに一時的に立て替えたお金」なので、「立替金」という資産（＝あとで返してもらえる権利）として記録します。現金（資産）が立替金（資産）という形に姿を変えた取引です。'
  },
  { id:1013, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、Y社に対する<mark class="q-liability">未払いの商品代金100円</mark>について、<mark class="q-revenue">支払期日より早く支払ったため、Y社から3円の割引</mark>を受け、残りの97円を<mark class="q-asset">現金で支払った</mark>。仕訳を行いなさい。',
    e:[{d:[['買掛金',100]],c:[['現金',97],['仕入割引',3]]}],
    exp:'期日より早く支払ったお礼として代金を割引してもらうことがあります。これは商品そのものの値引きではなく、「早く払ったことへのご褒美」という金融的な性質のものなので、仕入の金額そのものを減らすのではなく「仕入割引」という収益（＝早期支払いによって得をした分）として区別して計上します。買掛金100円（負債）が消え、現金97円（資産）が減り、差額3円は仕入割引（収益）になります。'
  },
  { id:1014, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'商品の売買を<strong>売上原価対立法</strong>で記帳しているX社は、Y社から<mark class="q-asset">商品100円分を購入</mark>し、代金は<mark class="q-asset">現金で支払った</mark>。仕訳を行いなさい。',
    e:[{d:[['商品',100]],c:[['現金',100]]}],
    exp:'「売上原価対立法」とは、商品と売上原価の2つの科目を使う記帳方法です。これまでの問題で使っていた「仕入」という費用科目は使わず、代わりに「商品」という資産科目で仕入れを記録します。つまり、商品を買った時点では費用にはならず、いったん資産（在庫）として計上しておくのがこの方法の特徴です。'
  },
  { id:1015, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'商品の売買を<strong>売上原価対立法</strong>で記帳しているX社は、<mark class="q-expense">原価60円</mark>の<mark class="q-asset">商品</mark>を、Z社に<mark class="q-revenue">100円で売り</mark>、代金を<mark class="q-asset">現金で受け取った</mark>。仕訳を行いなさい。',
    e:[{d:[['現金',100],['売上原価',60]],c:[['売上',100],['商品',60]]}],
    exp:'売上原価対立法では、商品を売ったその瞬間に、売上（収益）の計上と同時に、売れた分の原価を「商品」という資産から取り除く処理もあわせて行います。売った値段100円を売上（収益）として計上し、同時に、売れた商品の仕入れ値60円分を資産（商品）から減らします。「売るたびに、在庫がその場でリアルタイムに減っていく」というイメージの記帳方法です。'
  },
  { id:1016, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'雑貨を小売店に卸しているX社は、今期に開業したばかりで、前の期から持ち越した在庫はない。決算日の3月31日に倉庫の商品を実際に数えたところ（<strong>実地棚卸</strong>）、<mark class="q-asset">まだ売れていない商品</mark>が、<mark class="q-expense">仕入れたときの金額で30円分</mark>あった。同社は<strong>三分法</strong>で商品売買を記帳している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['繰越商品',30]],c:[['仕入',30]]}],
    exp:'「三分法」とは、商品売買を、仕入・繰越商品・売上の3つの科目に分けて記帳する方法です。「実地棚卸」とは、倉庫や店頭にある商品を実際に数えて、在庫の数量と金額を確認することです。期中は買った商品を全部「仕入」という費用に計上していますが、決算日にまだ売れ残っている分（30円）は、今期の費用にすべきではないので、仕入から取り除き、「繰越商品」という資産（＝来期に持ち越す在庫）に振り替えます。'
  },
  { id:1017, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、開業2年目の決算を迎えた。<mark class="q-asset">この期の初めには、前の期の決算で確認した売れ残りの商品30円分</mark><mark class="q-expense">が倉庫に残っていた</mark>。この期の決算日に倉庫の商品を実際に数えたところ（<strong>実地棚卸</strong>）、<mark class="q-asset">まだ売れていない商品</mark>が、<mark class="q-expense">仕入れたときの金額で40円分</mark>あった。同社は<strong>三分法</strong>で商品売買を記帳している。この期の決算に必要な仕訳を行いなさい。',
    e:[{d:[['仕入',30],['繰越商品',40]],c:[['繰越商品',30],['仕入',40]]}],
    exp:'2期目以降は、期首と期末の両方の在庫を調整する必要があります。①期首の在庫（前期末の繰越商品30円）は、今期の間に売れた可能性が高いので、いったん今期の仕入（費用）に足し戻します。②今期末に残っている在庫（40円）は、今期の費用から取り除き、新しく繰越商品（資産）として計上し直します。この「期首分を仕入に足す、期末分を仕入から引く」という2つの処理を合わせて行うことで、今期に実際に売れた分だけが正しく仕入（売上原価）として残ります。'
  },
  { id:1018, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'文房具を一般のお客さんに売っているX社は、<mark class="q-liability">自社で発行する商品券50円分</mark>を売り出し、購入したお客さんから<mark class="q-asset">現金で50円を受け取った</mark>。仕訳を行いなさい。',
    e:[{d:[['現金',50]],c:[['商品券',50]]}],
    exp:'自社で発行する商品券を売ると、お客さんから現金を受け取りますが、この時点ではまだ商品を渡したわけではないので、売上（収益）にはなりません。「将来、商品券と引き換えに商品を渡さなければならない義務」として「商品券」という負債で処理します。現金（資産）が増える代わりに、将来の引き渡し義務（負債）も増える、という組み合わせです。'
  },
  { id:1019, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、お客さんに<mark class="q-revenue">商品30円分を引き渡し</mark>、代金として、商店街の<mark class="q-asset">別の店が発行した商品券</mark>30円分を受け取った。仕訳を行いなさい。',
    e:[{d:[['他店商品券',30]],c:[['売上',30]]}],
    exp:'自社が発行した商品券（前問）とは違い、他店が発行した商品券を代金として受け取った場合は「他店商品券」という別の資産科目で処理します。これは発行元の他店に持ち込めば換金してもらえる「他店に対する請求権」という意味の資産です。商品を渡したので売上（収益）はしっかり計上し、代金の受け取り方が現金ではなく商品券だった、という違いだけです。'
  },
  { id:1020, calc:'（10枚－8枚）×10円＝20円', cat:'商品売買', chap:'第1章：商品売買',
    q:'Tシャツなどの衣料品を小売店に卸しているX社は、決算にあたり、倉庫の商品を実際に数えたところ（<mark class="q-asset">実地棚卸</mark>）、<mark class="q-expense">帳簿の上では10枚あるはずのTシャツが、実際には8枚</mark>しかなかった（<strong>棚卸減耗</strong>）。このTシャツは1枚10円で仕入れたもので、枚数が減った原因はわからなかった。減った分について、決算に必要な仕訳を行いなさい。',
    e:[{d:[['棚卸減耗損',20]],c:[['繰越商品',20]]}],
    exp:'帳簿上は10枚あるはずなのに、実際に数えたら8枚しかなかった――この「数のズレ」から生じる損失を「棚卸減耗損」と呼びます。(10枚－8枚)×10円＝20円分、本来あるべき在庫が消えてしまったことになるので、資産である繰越商品を20円減らし、その分を費用（棚卸減耗損）として計上します。原因不明の目減りを、実際の数量に合わせて帳簿を修正する処理です。'
  },
  { id:1021, calc:'（10円－8円）×8枚＝16円', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、決算にあたり、<mark class="q-asset">期末に倉庫に残っていた</mark>Tシャツ8枚を確認した。このTシャツは1枚10円で仕入れたものだが、流行が過ぎて値崩れしたため、<mark class="q-expense">決算の時点で売れると見込まれる金額（<strong>正味売却価額</strong>）は1枚8円に下がっていた</mark>。決算に必要な仕訳を行いなさい。',
    e:[{d:[['商品評価損',16]],c:[['繰越商品',16]]}],
    exp:'「正味売却価額」とは、決算の時点で、その商品が売れると見込まれる金額のことです。「取得原価」とは、その商品を買ったときに支払った金額のことです。商品の数は合っていても、市場での値段（正味売却価額8円）が、仕入れたときの値段（取得原価10円）より下がってしまうことがあります。このまま仕入れた値段のまま資産計上していると、実態より高く見積もりすぎることになるため、下がった分（10円－8円＝2円×8枚＝16円）を商品評価損として費用計上し、繰越商品の金額を実態に合わせて引き下げます。'
  },
  { id:1022, calc:'', cat:'商品売買', chap:'第1章：商品売買',
    q:'X社は、前の期の決算で、Tシャツの値崩れにより、<mark class="q-asset">期末の在庫</mark>の金額を<mark class="q-expense">16円分だけ引き下げ</mark>ていた。同社は<strong>洗替法</strong>を採用している。この期の初めに必要な仕訳を行いなさい。',
    e:[{d:[['繰越商品',16]],c:[['商品評価損',16]]}],
    exp:'「洗替法」とは、前の期の決算で評価替えした金額を、次の期の初めにいったん元の金額に戻す方法です（これに対して「切放法」は、戻さずにそのまま次の期に引き継ぐ方法です）。前期末に評価損として繰越商品を減らしていた16円を、新しい期が始まったタイミングでいったん元に戻す（逆仕訳をする）ことで、新しい期は「まっさらな状態」から改めて評価をやり直せるようにします。'
  },
  { id:1023, calc:'支払手数料：100×2％＝2円\nクレジット売掛金：100－2＝98円', cat:'商品売買', chap:'第1章：商品売買',
    q:'本を一般のお客さんに売っているX社は、書籍100円分を、お客さんが<mark class="q-revenue">クレジットカードで支払う条件で販売した</mark>。カード会社（<strong>信販会社</strong>）へは、<mark class="q-expense">販売代金の2％を手数料</mark>として支払う契約になっており、この手数料は、商品を販売した時点で計上する。<mark class="q-asset">代金は、後日カード会社から受け取る</mark>。仕訳を行いなさい。',
    e:[{d:[['クレジット売掛金',98],['支払手数料',2]],c:[['売上',100]]}],
    exp:'「信販会社」とは、お客さんがカードで払った代金を、お客さんに代わって店に支払い、後でお客さんから回収する会社のことです。クレジットカード払いでは、実際にお金をくれるのはお客さんではなくカード会社です。カード会社に払う手数料（100円×2％＝2円）は販売した時点で確定する費用（支払手数料）として計上し、手数料を差し引いた残り98円を「クレジット売掛金」という資産（＝カード会社から受け取れる権利）として計上します。売上そのものは値引きせず、全額100円を計上する点がポイントです。'
  },
  // --- 収益認識・現金預金 ---
  { id:1024, calc:'', cat:'収益認識', chap:'収益認識・現金預金',
    q:'飲料水を酒店やスーパーに卸しているX社は、得意先との間で、次のような約束をしている。「1年間に一定の量以上を買ってくれた得意先には、代金の一部をあとから返す」（<strong>割戻し</strong>・<strong>リベート</strong>）。今期は、この約束の対象になりそうな得意先が、何社かある。決算にあたり、X社は、<mark class="q-revenue">今期の売上</mark>のうち、この約束によって、<mark class="q-liability">あとから返すことになると見込まれる金額を5円と見積もった</mark>。この見積額について、決算に必要な仕訳を行いなさい。',
    e:[{d:[['売上',5]],c:[['返金負債',5]]}],
    exp:'「割戻し」とは、一定の量以上を買ってくれた得意先に、代金の一部を、あとから返すことです（「リベート」とも呼ばれます）。収益認識の考え方では、あとで返す可能性が高い金額は「本当に確定した売上」とは言えないため、その分だけ売上（収益）を減らし、「将来、お金を返す義務」として「返金負債」という負債で処理します。「売ったつもりの金額のうち、見込みで返す分は、最初から売上に入れない」というのがポイントです。'
  },
  { id:1025, calc:'', cat:'収益認識', chap:'収益認識・現金預金',
    q:'会計ソフトを開発して企業に販売しているX社は、ある企業と、次のような1つの契約を結んだ。1つ目は、会計ソフトを引き渡すこと。2つ目は、そのあと1年間、使い方などのサポートサービスを提供することである。この2つをあわせて1つの契約としている。契約を結んだ日に、X社は、<mark class="q-asset">代金の一部として40円を現金で先に受け取った</mark>。この時点では、<mark class="q-liability">会計ソフトはまだ引き渡しておらず、サポートサービスもまだ始めていない</mark>。契約を結んだ日の仕訳を行いなさい。',
    e:[{d:[['現金',40]],c:[['契約負債',40]]}],
    exp:'代金を先に受け取っても、商品やサービスをまだ何も提供していない段階では、売上（収益）には計上できません。ソフトの引き渡しとサポートサービスという「これから果たすべき2つの義務」が残っているため、受け取った40円は「将来、約束を果たさなければならない義務」として「契約負債」という負債で処理します。現金（資産）が増える一方、同額の義務（負債）も増える、という組み合わせです。'
  },
  { id:1026, calc:'', cat:'収益認識', chap:'収益認識・現金預金',
    q:'ホームページの制作を請け負っているX社は、ある飲食店から、お店のホームページの制作を受注した。制作には、デザインの作業が必要である。X社は、このデザインを外部のデザイナーに依頼した。そして、デザイナーへの報酬として、<mark class="q-asset">25円を現金で支払った</mark>。ホームページは、この時点では<mark class="q-asset">まだ完成しておらず、飲食店に引き渡していない</mark>。報酬を支払った日の仕訳を行いなさい。',
    e:[{d:[['仕掛品',25]],c:[['現金',25]]}],
    exp:'「受注」とは、注文を受けることです。まだ仕事が完成しておらず、お客さんに引き渡していない段階でかかった費用は、その場で費用にはせず、「まだ完成していない仕事にかかった費用」として、いったん「仕掛品」という資産で処理します。完成して引き渡したときに、初めてこの仕掛品を費用（原価）に振り替えます。現金（資産）が仕掛品（資産）という形に姿を変えた取引です。'
  },
  { id:1027, calc:'', cat:'収益認識', chap:'収益認識・現金預金',
    q:'その後、X社は、上記の<mark class="q-revenue">ホームページを完成させて、飲食店に引き渡した</mark>。制作代金は50円で、X社は飲食店に請求書を送った。<mark class="q-asset">代金は後日、飲食店から支払ってもらう約束である</mark>。引き渡した日の仕訳を行いなさい。',
    e:[{d:[['売掛金',50]],c:[['役務収益',50]]}],
    exp:'商品の販売とは違い、サービス（役務）を提供して得る収益は「役務収益」という科目で処理します。ホームページが完成し、飲食店に引き渡した瞬間に、サービス提供という約束を果たしたことになるので、代金50円を役務収益（収益）として計上します。まだ代金を受け取っていないので、「あとで受け取れる権利」として売掛金（資産）を計上します。'
  },
  { id:1028, calc:'', cat:'収益認識', chap:'収益認識・現金預金',
    q:'上記のホームページについて、飲食店への<mark class="q-asset">引渡しと代金の請求が終わり、この制作の仕事は完了</mark>した。X社は、この仕事のために、これまでに25円を支払っている（デザイナーへの報酬）。この25円は、仕事が完成するまでは、<mark class="q-expense">まだ完成していない仕事にかかった費用として、別に記録してきた</mark>。仕事が完了した日に（<strong>費用収益対応の原則</strong>）、この25円について、必要な仕訳を行いなさい。',
    e:[{d:[['役務原価',25]],c:[['仕掛品',25]]}],
    exp:'仕事が完了し、収益（役務収益）を計上したタイミングで、それに対応する原価も費用として計上する必要があります（収益と費用を対応させる「費用収益対応の原則」）。これまで仕掛品（資産）として積み立てていた25円を、「役務原価」という費用に振り替えます。「仕事が完成して初めて、積み立てていたコストが正式な費用に変わる」というイメージです。'
  },
  { id:1029, calc:'10＋5＝15円', cat:'現金預金', chap:'収益認識・現金預金',
    q:'建築資材を工務店に卸しているX社は、決算の日に、金庫の中を確認した。すると、得意先の工務店から、<mark class="q-asset">代金の回収として</mark>受け取っていた、<mark class="q-asset">他社が振り出した小切手10円と、郵便為替証書5円</mark>が、そのまま保管されていた。この2つは、まだ帳簿には現金として記録されていなかった。決算にあたり、これらについて必要な仕訳を行いなさい。',
    e:[{d:[['現金',15]],c:[['売掛金',15]]}],
    exp:'簿記でいう「現金」には、紙幣・硬貨だけでなく、他社が振り出した小切手や郵便為替証書のように「銀行や郵便局に持っていけばすぐに現金化できる証書」（通貨代用証券）も含まれます。これらを受け取った時点ですでに代金回収は完了しているので、帳簿上の「現金」として記録し直し、まだ記録が済んでいなかった分だけ売掛金（資産）を減らして現金（資産）を増やします。'
  },
  { id:1030, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、期の途中で、金庫の中の現金を実際に数えてみた。すると、<mark class="q-asset">帳簿に記録されている現金の残高より5円少なかった</mark>。担当者が調べたが、<mark class="q-asset">原因はまだわかっていない</mark>。この時点で、必要な仕訳を行いなさい。',
    e:[{d:[['現金過不足',5]],c:[['現金',5]]}],
    exp:'帳簿の金額と実際の金庫の中身が合わないとき、原因がすぐに分からなくても、まずは実際に数えた金額に帳簿を合わせる必要があります。原因が判明するまでの一時的な置き場所として「現金過不足」という科目を使い、実際の金庫の中身（現金が5円少ない状態）に帳簿を合わせます。原因が後で分かれば正しい科目に振り替え、最後まで分からなければ決算時に「雑損」や「雑益」として精算します。'
  },
  { id:1031, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'<mark class="q-asset">上記の5円の差額</mark>について、X社は、その後も、金庫の出し入れの記録や領収書などを見直して、原因を調べ続けた。しかし、<mark class="q-expense">決算日になっても、原因はわからなかった</mark>。この5円の差額は、決算日の時点で、そのまま残っている。決算日に、必要な仕訳を行いなさい。',
    e:[{d:[['雑損',5]],c:[['現金過不足',5]]}],
    exp:'現金過不足という一時的な置き場所に入れていた5円について、決算日になってもどうしても原因が分からなかった場合は、これ以上原因を探すのをあきらめ、「雑損」という費用（＝原因不明の損失）として処理し、帳簿を締めます。現金過不足（一時的な仮の科目）を、最終的な正式な費用科目（雑損）に置き換える仕訳です。'
  },
  { id:1032, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、別の期の決算の日に、金庫の中の現金を実際に数えた。すると、<mark class="q-asset">帳簿に記録されている現金の残高より3円多かった</mark>。調べても、<mark class="q-revenue">原因はわからなかった</mark>。決算にあたり、必要な仕訳を行いなさい。',
    e:[{d:[['現金',3]],c:[['雑益',3]]}],
    exp:'今度は逆に、実際の現金の方が帳簿より多かったケースです。決算日まで原因が分からなかったので、増えた3円は「雑益」という収益（＝原因不明の利益）として処理します。現金が多い場合も少ない場合も、「まず実際の金額に帳簿を合わせ、原因不明の分は最終的に雑損・雑益で精算する」という考え方は共通です。'
  },
  { id:1033, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、金庫に置いておく現金が多くなってきた。盗難や紛失の心配があるうえ、日々の支払いも、小切手や銀行の引き落としで行うことが増えている。そこで、金庫の<mark class="q-asset">現金</mark>のうち100円を、取引銀行の<mark class="q-asset">当座預金口座に預け入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',100]],c:[['現金',100]]}],
    exp:'「当座預金」とは、小切手を振り出したり、口座からの引き落としで支払ったりするために、銀行に預けておく預金のことです（利息はつきません）。金庫の現金を銀行口座に移しただけなので、損益には一切影響せず、現金（資産）が当座預金（資産）という形に姿を変えるだけの取引です。'
  },
  { id:1034, calc:'当座借越：30－20＝10円', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、取引銀行と<mark class="q-liability">当座借越契約</mark>を結んでいる。この契約では、当座預金の残高を超えて小切手を振り出しても、限度額の50円までは、銀行が支払ってくれる。ある日、X社は、仕入先のY社に、<mark class="q-liability">未払いの商品代金30円を支払う</mark>ため、<mark class="q-asset">小切手を振り出し</mark>た。この日、当座預金口座の残高は20円であった。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',30]],c:[['当座預金',20],['当座借越',10]]}],
    exp:'当座借越契約があると、口座残高が足りなくても、銀行が契約の限度額まで一時的に立て替えて支払ってくれます。今回は残高20円のところ30円の小切手を振り出したので、まず残高の20円分は当座預金（資産）の減少として処理し、残りの不足分10円は、銀行からの一時的な借り入れとして「当座借越」という負債で処理します。買掛金（負債）が消える一方、当座預金（資産）が減り、不足分は当座借越（負債）になる、という組み合わせです。'
  },
  { id:1035, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、営業所を新しく開設した。営業所で使うために、<mark class="q-asset">パソコンと机</mark>を合計40円で購入した。パソコンと机は、すでに営業所に届いているが、<mark class="q-liability">代金は月末にまとめて支払う約束</mark>である。この日の仕訳を行いなさい。',
    e:[{d:[['備品',40]],c:[['未払金',40]]}],
    exp:'パソコンや机のような、長く使う目的で買ったモノは「備品」という資産で処理します。商品の仕入れとは違い、営業に使う道具を買ったときの未払いの代金は、「買掛金」ではなく「未払金」という負債で処理します（買掛金は「商品」を仕入れたときに限って使う科目です）。備品（資産）が増え、未払金（負債）も増える、という組み合わせです。'
  },
  { id:1036, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、少額の支払いのための現金の管理方法として、<strong>定額資金前渡制度</strong>を採用している。この制度では、少額の支払いを担当する係（用度係）に、あらかじめ決めた額の資金を渡しておき、使った分だけあとから補給する。今週の始めに、X社は、<mark class="q-asset">用度係に渡す資金</mark>として、<mark class="q-asset">小切手20円を振り出し</mark>て、前渡しした。この日の仕訳を行いなさい。',
    e:[{d:[['小口現金',20]],c:[['当座預金',20]]}],
    exp:'会社の本体の現金とは別に、文房具代や交通費など日々の細かい支払い専用に、あらかじめ一定額を用度係に渡しておく仕組みが「定額資金前渡制度」です。この専用のお財布を「小口現金」という資産科目で管理します。当座預金（資産）が小口現金（資産）という形に姿を変えた取引です。'
  },
  { id:1037, calc:'8＋5＋3＝16円', cat:'現金預金', chap:'収益認識・現金預金',
    q:'<mark class="q-asset">用度係は、今週の始めに渡された資金の中から、少額の支払い</mark>を行ってきた。今週の終わりに、用度係は、使った内容をX社の経理担当者に報告した。支払いの内訳は、<mark class="q-expense">文房具の購入</mark>が8円、<mark class="q-expense">出張の電車代</mark>が5円、<mark class="q-expense">郵便代</mark>が3円であった。X社は、この報告を受けて、必要な仕訳を行いなさい。',
    e:[{d:[['消耗品費',8],['旅費交通費',5],['通信費',3]],c:[['小口現金',16]]}],
    exp:'用度係が日々の細かい支払いを立て替えていても、会社の本帳簿にはまだ何も記録されていません。用度係から「何にいくら使ったか」の報告を受けた、まさにその瞬間に初めて費用として記録します。文房具代は消耗品費、出張の電車代は旅費交通費、郵便代は通信費と、内容ごとに正しい科目へ振り分け、同時に小口現金（資産）をその分減らします。'
  },
  { id:1038, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、上記の報告を受けたあと、すぐに、用度係が使った16円と同じ金額の<mark class="q-asset">小切手を振り出し</mark>て、<mark class="q-asset">用度係に渡し、資金を補給</mark>した。これで、用度係の手元の資金は、あらかじめ決めた額に戻った。この日の仕訳を行いなさい。',
    e:[{d:[['小口現金',16]],c:[['当座預金',16]]}],
    exp:'用度係のお財布（小口現金）の中身が減った分を、会社の当座預金口座から補充します。費用はすでに前の問題で報告を受けたときに記録済みなので、ここでは新たな費用は発生せず、単に「会社の口座のお金が、用度係のお財布に移った」という資産同士の入れ替えだけが記録されます。'
  },
  { id:1039, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、金庫に置いておく現金が多くなってきた。日常の出し入れに使うため、いつでも引き出せる預金に預けておきたいと考えている。そこで、金庫の<mark class="q-asset">現金</mark>のうち50円を、取引銀行の<mark class="q-asset">普通預金口座に預け入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['普通預金',50]],c:[['現金',50]]}],
    exp:'「普通預金」とは、いつでも自由に預け入れや引き出しができる預金のことです。当座預金とは違って小切手は使えませんが、ATMなどで日常的に出し入れしやすいのが特徴です。現金（資産）が普通預金（資産）という形に姿を変えただけの取引で、損益には影響しません。'
  },
  { id:1040, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社の<mark class="q-asset">普通預金口座</mark>には、当分使う予定のない資金がたまっていた。普通預金には、ほとんど利息がつかない。そこで、その資金のうち100円を、少しでも高い利息を得るために、期間1年・年利率2％の<mark class="q-asset">定期預金に預け替えた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['定期預金',100]],c:[['普通預金',100]]}],
    exp:'「定期預金」とは、あらかじめ決めた期間、原則として引き出さないことを約束して預ける預金のことです。普通預金より利率が高いのが特徴です。当分使う予定のない資金を、より有利な条件の預金に移し替えただけなので、普通預金（資産）が定期預金（資産）という形に姿を変える取引になります。'
  },
  { id:1285, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、決算にあたり、銀行の残高証明書と帳簿の当座預金の残高が一致しない原因を調べた（<strong>銀行勘定調整表</strong>）。その結果、<mark class="q-liability">買掛金40円の支払いのために小切手を作成し、記帳していた</mark>が、<mark class="q-asset">その小切手がまだ仕入先に渡されず、金庫に残っていた</mark>（未渡小切手）ことがわかった。必要な仕訳を行いなさい。',
    e:[{d:[['当座預金',40]],c:[['買掛金',40]]}],
    exp:'「未渡小切手」とは、作って帳簿に記録したのに、まだ相手に渡していない小切手です。渡していない以上、当座預金は減っていないし、買掛金もまだ払っていません。そこで、小切手を作ったときの記録を取り消して、当座預金と買掛金を元に戻します。'
  },
  { id:1286, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、銀行勘定調整表を作成したところ、<mark class="q-liability">広告宣伝費15円の支払いのために作成し、記帳していた小切手</mark>が、<mark class="q-asset">まだ相手に渡されていなかった</mark>（未渡小切手）ことがわかった。必要な仕訳を行いなさい。',
    e:[{d:[['当座預金',15]],c:[['未払金',15]]}],
    exp:'未渡小切手で当座預金を元に戻すのは同じです。ただし、費用の支払いの場合は、広告宣伝費そのものは発生しているので取り消しません。まだ払っていない分を、商品代金ではない後払いの義務として「未払金」にします。商品代金なら買掛金、それ以外なら未払金です。'
  },
  { id:1287, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、銀行勘定調整表を作成したところ、<mark class="q-asset">得意先から売掛金30円が当座預金口座に振り込まれていた</mark>が、<mark class="q-asset">銀行からの連絡がX社に届いておらず、記帳していなかった</mark>（連絡未通知）ことがわかった。必要な仕訳を行いなさい。',
    e:[{d:[['当座預金',30]],c:[['売掛金',30]]}],
    exp:'「連絡未通知」とは、銀行ではもう入金や引落しが済んでいるのに、会社に連絡が届いていないため記録していないものです。実際には売掛金を回収済みなので、当座預金を増やし、売掛金を消します。'
  },
  { id:1288, calc:'70－50＝20円', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、銀行勘定調整表を作成したところ、<mark class="q-asset">売掛金70円が当座預金口座に入金された</mark>ときに、<mark class="q-asset">誤って50円と記帳していた</mark>（誤記入）ことがわかった。必要な仕訳を行いなさい。',
    e:[{d:[['当座預金',20]],c:[['売掛金',20]]}],
    exp:'誤記入は、正しい金額との差額だけを直します。実際には70円入金されていたのに50円しか記録していないので、足りない20円分、当座預金を増やして売掛金を減らします。'
  },
  { id:1289, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'X社は、従業員が出張に行くにあたり、<mark class="q-asset">旅費の概算額30円を、現金で前渡しした</mark>。実際にいくらかかるかは、出張から戻るまでわからない。この日の仕訳を行いなさい。',
    e:[{d:[['仮払金',30]],c:[['現金',30]]}],
    exp:'「仮払金」とは、お金は払ったけれど、何に使うか・いくらかかるかがまだ確定していないときに、一時的に使う資産の勘定です。旅費の額が決まるまでは費用にできないので、仮払金にしておきます。'
  },
  { id:1290, calc:'30－26＝4円', cat:'現金預金', chap:'収益認識・現金預金',
    q:'上記の従業員が出張から戻り、<mark class="q-expense">旅費は26円だった</mark>と報告を受けた。<mark class="q-asset">残りの4円は、現金で返された</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['旅費交通費',26],['現金',4]],c:[['仮払金',30]]}],
    exp:'使い道と金額が確定したので、仮払金30円を消します。実際に使った26円は「旅費交通費」という費用にし、戻ってきた4円は現金を増やします。'
  },
  { id:1291, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'出張中の従業員から、X社の<mark class="q-asset">当座預金口座に50円が振り込まれた</mark>。しかし、<mark class="q-liability">何のお金なのか、まだわからない</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',50]],c:[['仮受金',50]]}],
    exp:'「仮受金」とは、お金は受け取ったけれど、何のお金かがまだわからないときに、一時的に使う負債の勘定です。内容がわかるまでは、売上なのか回収なのか決められないので、仮受金にしておきます。'
  },
  { id:1292, calc:'', cat:'現金預金', chap:'収益認識・現金預金',
    q:'上記の50円について、従業員が帰社して報告を受けた。<mark class="q-asset">40円は得意先からの売掛金の回収</mark>、<mark class="q-liability">10円は新しい注文を受けたときの手付金</mark>であった。この日の仕訳を行いなさい。',
    e:[{d:[['仮受金',50]],c:[['売掛金',40],['前受金',10]]}],
    exp:'内容がわかったので、仮受金50円を消して、正しい勘定に振り替えます。40円は売掛金の回収なので売掛金を減らし、10円はまだ商品を渡していない注文の手付金なので「前受金」（商品を渡す義務）にします。'
  },
  // --- 第4章：債権債務（手形・電子記録債権） ---
  { id:1041, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'工作機械の部品を製造して機械メーカーに納めているX社は、得意先のY社から、部品の<mark class="q-asset">代金60円をまだ受け取っていない</mark>。Y社は、この代金の支払いのために、約束手形を振り出して、X社に渡した。X社は、この<mark class="q-asset">約束手形を受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['受取手形',60]],c:[['売掛金',60]]}],
    exp:'「約束手形」とは、振出人が、決められた日に代金を支払うことを約束した証券のことです（この証券を作って渡すことを「振り出す」といいます）。もともと「売掛金」という資産（＝あとで回収する権利）だったものが、「受取手形」というより確実な資産（＝期日に必ず支払われる証券上の権利）に姿を変えます。まだお金を受け取ったわけではありませんが、権利の種類が変わっただけなので、収益にはなりません。'
  },
  { id:1042, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、材料を仕入先のZ社から掛けで購入している。<mark class="q-liability">代金60円はまだ支払っていない</mark>。今月は、他の支払いが重なったため、Z社に頼んで、現金ではなく、約束手形で支払うことにした。X社は、<mark class="q-liability">約束手形を振り出して</mark>、Z社に渡した。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',60]],c:[['支払手形',60]]}],
    exp:'受け取る側とは逆に、支払う側が約束手形を振り出すと、「買掛金」という負債（＝あとで払う義務）が、「支払手形」というより重い負債（＝期日に必ず支払わなければならない証券上の義務）に変わります。手形は口約束の買掛金より法的な強制力が強いため、「本気度の高い借用書」とイメージすると分かりやすいです。'
  },
  { id:1043, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'決算にあたり、X社は、得意先に対する未回収の代金と、受取手形の期末の残高を合計して、100円あることを確認した。得意先の中には、経営が苦しくなる会社が出る可能性がある。そこで、この100円のうち、<mark class="q-as-li">回収できなくなる分</mark>を、<mark class="q-expense">100円の4％と見積もる</mark>ことにした。この見積りは<strong>差額補充法</strong>によって行う。見積りをする前の、この見積りに関する残高はゼロである。決算に必要な仕訳を行いなさい。',
    e:[{d:[['貸倒引当金繰入',4]],c:[['貸倒引当金',4]]}],
    exp:'「差額補充法」とは、見積もった金額と、すでにある残高との差額だけを、追加で計上する方法です。売掛金や受取手形などの債権は、将来回収できなくなる（貸し倒れる）リスクがあります。そこで決算のたびに、回収不能になりそうな金額をあらかじめ見積もって、「貸倒引当金」という資産のマイナス項目（＝将来の損失に備える引当金）として計上し、同時に「貸倒引当金繰入」という費用も計上します。今回はまだ残高がゼロなので、見積額の4円がそのまま繰入額になります。'
  },
  { id:1044, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、得意先のY社から、<mark class="q-asset">代金50円をまだ受け取っていない</mark>。Y社は、最近、手形ではなく、電子的な方法で代金を支払う仕組みを使い始めた。そこで、この代金について、X社は、<mark class="q-asset">電子債権記録機関に、代金を請求する権利を、電子的に記録してもらった</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['電子記録債権',50]],c:[['売掛金',50]]}],
    exp:'「電子債権記録機関」とは、代金を請求する権利（債権）を、電子的に記録して管理する機関のことです（手形の代わりに使われます）。紙の手形の代わりにデータで権利を管理する仕組みで、売掛金（資産）が、より安全に管理できる電子記録債権（資産）という形に姿を変えます。紛失・盗難のリスクがなく、印紙税もかからないのがメリットです。'
  },
  { id:1045, calc:'50－48＝2円', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、急に資金が必要になった。しかし、上記の電子的に記録された50円の代金請求の権利の支払期日は、まだ先である。そこで、この権利を、支払期日の前に、<mark class="q-asset">取引銀行に譲渡</mark>した。銀行から支払われた<mark class="q-expense">譲渡の代金は48円で</mark>、<mark class="q-asset">当座預金口座に振り込まれた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',48],['電子記録債権売却損',2]],c:[['電子記録債権',50]]}],
    exp:'満期を待たずに、電子記録債権を銀行に買い取ってもらって先に現金化することを「譲渡（割引）」といいます。銀行は満期までのリスクや利息相当分を差し引くため、50円分の権利でも実際に受け取れるのは48円になります。この差額2円は「早く現金化するために払ったコスト」として「電子記録債権売却損」という費用で処理します。'
  },
  { id:1046, calc:'60－57＝3円', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、以前に得意先から受け取っていた約束手形60円を持っている。支払期日はまだ先だが、資金が必要になったため、この<mark class="q-asset">手形を取引銀行に持ち込んで、現金に換えてもらった（割引）</mark>。銀行は、<mark class="q-expense">期日までの利息にあたる割引料を差し引き</mark>、残りの57円を、<mark class="q-asset">当座預金口座に入金した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',57],['手形売却損',3]],c:[['受取手形',60]]}],
    exp:'「割引」とは、手形を、支払期日の前に銀行に買い取ってもらって、現金にすることです（銀行は、期日までの利息にあたる割引料を差し引きます）。額面60円の手形でも、早く現金化する代わりに銀行へ利息相当分を払うため、実際に受け取れるのは57円になります。この差額3円は「手形売却損」という費用で処理します。'
  },
  { id:1047, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記のように、X社は、<mark class="q-asset">約束手形60円を、取引銀行で割り引いていた</mark>。ところが、<mark class="q-asset">支払期日になっても、この手形の代金は、支払われなかった（<strong>不渡り</strong>）</mark>。銀行から、その通知がX社に届いた。この日の仕訳を行いなさい。',
    e:[{d:[['不渡手形',60]],c:[['受取手形',60]]}],
    exp:'「不渡り」とは、手形の代金が、支払期日に支払われないことです。期日に払われなかった手形は、普通の「受取手形（順調な権利）」から「不渡手形（問題を抱えた権利）」という特別な科目に振り替えて管理します。まだ全く回収できないと決まったわけではないので、資産として扱い続け、今後の回収状況を見守ります。'
  },
  { id:1048, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'その後、X社は、上記の<mark class="q-asset">不渡りとなった手形60円</mark>について、手形を振り出した会社と交渉を続けた。その結果、この会社は、手形の代金60円を、<mark class="q-revenue">手形の支払期日を過ぎた分の利息2円</mark>とあわせて、支払ってくれることになった。X社は、この合計62円を、<mark class="q-asset">現金で回収した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',62]],c:[['不渡手形',60],['受取利息',2]]}],
    exp:'不渡りになっても、その後の交渉で無事に回収できることがあります。もともとの手形代金60円は不渡手形（資産）を取り崩して現金に換え、支払いが遅れた分のお詫びとして上乗せされた利息2円は、新たに「受取利息」という収益として計上します。トラブルはあったものの、最終的に利息付きで回収できた、というハッピーエンドの仕訳です。'
  },
  { id:1049, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、工場で使っていた<mark class="q-asset">備品のうち、不要になったものをY社に売却</mark>した。この備品の帳簿上の金額は、40円である。売却の代金も40円で、Y社が振り出した<mark class="q-asset">約束手形で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['営業外受取手形',40]],c:[['備品',40]]}],
    exp:'商品の売買ではなく、備品のような固定資産を売った代金として手形を受け取る場合は、日常の商売で使う「受取手形」とは区別して「営業外受取手形」という科目を使います。「営業外」というのは「本業の商売（商品売買）以外の取引で生じた」という目印です。帳簿価額と同額の40円で売れたので、売却損益は発生しません。'
  },
  { id:1050, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、事務所で使う<mark class="q-asset">備品を、新しく購入</mark>することにした。購入先に、代金40円の支払いを、約束手形で行いたいと申し出て、承諾された。そこで、備品を購入し、代金の支払いのために、<mark class="q-liability">約束手形を振り出して</mark>、購入先に渡した。この日の仕訳を行いなさい。',
    e:[{d:[['備品',40]],c:[['営業外支払手形',40]]}],
    exp:'備品のような固定資産の代金を手形で支払う場合も、商品仕入れで使う「支払手形」とは区別して「営業外支払手形」という科目を使います。「本業の商売以外の取引で生じた約束」という目印をつけることで、後から帳簿を見返したときに取引の性質が一目で分かるようにしています。'
  },
  { id:1051, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、仕入先のZ社に、<mark class="q-liability">材料の代金40円をまだ支払っていない</mark>。ちょうど、得意先のY社から受け取った約束手形40円を、手元に持っている。そこで、この約束手形を、Z社への支払いに使うことにした。X社は、この<mark class="q-asset">約束手形を、裏書きして</mark>、Z社に渡した。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['受取手形',40]]}],
    exp:'「裏書き」とは、手形の裏面に署名して、他の人に渡すことです。保有していた受取手形（お金を受け取る権利）を、そのまま仕入代金の支払いに使うことができます。現金を使わずに、手形という紙一枚で代金決済が完了する、手形ならではの便利な使い方です。買掛金（負債）が消え、受取手形（資産）も消える、という組み合わせです。'
  },
  { id:1052, calc:'新しい手形：50＋2＝52円', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、以前にZ社に、<mark class="q-liability">約束手形50円を振り出している</mark>。ところが、資金繰りが苦しくなったため、Z社に、この手形の支払期日を延ばしてほしいと頼み、承諾された。X社は、延ばした期間の<mark class="q-expense">利息2円</mark>を加えた、<mark class="q-liability">新しい約束手形を振り出して</mark>、古い手形と交換した。この日の仕訳を行いなさい。',
    e:[{d:[['支払手形',50],['支払利息',2]],c:[['支払手形',52]]}],
    exp:'期日までに支払えないとき、相手の同意を得て新しい期日の手形に書き換えてもらうことがあります。これは「古い約束をいったん取り消して、新しい約束をし直す」ことと同じなので、古い支払手形（50円）をいったん消し、新しい支払手形（52円）を計上し直します。支払いを延ばしてもらう対価として発生する利息2円は、「支払利息」という費用として別途計上します。'
  },
  { id:1053, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、仕入先のZ社に、<mark class="q-liability">材料の代金50円をまだ支払っていない</mark>。Z社は、手形の代わりに、電子的な仕組みで支払いを受けたいと希望した。そこで、X社は、この代金の支払いを、電子債権記録機関を通じて行うことにし、<mark class="q-liability">支払いの約束が電子的に記録されるよう、請求</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['買掛金',50]],c:[['電子記録債務',50]]}],
    exp:'買掛金という口約束の負債を、電子債権記録機関にデータとして記録される、より明確な支払義務に置き換える手続きです。買掛金（負債）が消え、電子記録債務（負債）が同額増えます。紙の手形と違って印紙税がかからず、紛失・盗難のリスクもない点がメリットです。'
  },
  { id:1054, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記の<mark class="q-liability">電子的に記録された50円の支払いの約束</mark>について、支払期日が来た。X社の当座預金口座には、この日に必要な資金が入っていた。そして、<mark class="q-asset">当座預金口座から、50円が引き落とされ</mark>、Z社に支払われた。この日の仕訳を行いなさい。',
    e:[{d:[['電子記録債務',50]],c:[['当座預金',50]]}],
    exp:'電子記録債務の支払期日が来ると、銀行のシステムが自動的に処理を行い、口座からお金が引き落とされます。「必ず払います」という約束（電子記録債務）が実際の支払いに変わることで負債が消え、同時に当座預金（資産）が同額減少します。'
  },
  { id:1055, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、Y社と、次のような契約を結んだ。部品Aと部品Bを、あわせて売る。代金の請求は、部品Aと部品Bの両方を引き渡した後に、まとめて行う。X社は、<mark class="q-revenue">まず部品Aを引き渡した</mark>（部品Aの<strong>履行義務</strong>を充足した）。部品Aの分の代金は、30円である。<mark class="q-asset">部品Bを引き渡すまでは、代金を請求できない</mark>。部品Aを引き渡した日の仕訳を行いなさい。',
    e:[{d:[['契約資産',30]],c:[['売上',30]]}],
    exp:'部品Aを引き渡した時点で、その分の商品を渡すという約束（履行義務）はすでに果たしているので、売上（収益）は計上できます。しかし、契約上、部品Bも引き渡すまでは正式に代金を請求できないため、「あとで確実にお金を受け取れるが、まだ請求書を出せる状態ではない権利」として、通常の「売掛金」ではなく「契約資産」という資産で処理します。'
  },
  { id:1056, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'その後、X社は、<mark class="q-revenue">部品Bも引き渡した</mark>。そこで、部品Aと部品Bの<mark class="q-asset">代金の合計60円をY社に請求した</mark>。このうち<mark class="q-asset">30円は、部品Aを引き渡した日に、すでに処理してある</mark>。部品Bを引き渡した日の仕訳を行いなさい。',
    e:[{d:[['売掛金',60]],c:[['契約資産',30],['売上',30]]}],
    exp:'部品Bも引き渡したことで、ようやく正式に代金60円を請求できるようになりました。すでに「契約資産」として計上していた部品A分の30円は、正式な請求権である「売掛金」に振り替え、新たに引き渡した部品B分の30円は、新しく売上（収益）として計上します。合計で売掛金が60円計上される結果になります。'
  },
  { id:1057, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、得意先のY社から、<mark class="q-asset">代金40円をまだ受け取っていない</mark>。Y社は、この代金を、次の方法で支払うことにした。Y社に代金を払う義務があるW社を支払人とし、X社を受取人とする、為替手形40円を作った。<mark class="q-asset">W社は、この手形の支払いを承諾した</mark>（<strong>引受け</strong>）。手形は、Y社からX社に渡された。X社の仕訳を行いなさい。',
    e:[{d:[['受取手形',40]],c:[['売掛金',40]]}],
    exp:'「為替手形」とは、振出人が、第三者（支払人）に対して、受取人に代金を支払うよう依頼する証券です（「引受け」とは、支払いを頼まれた人が、その手形の代金を支払うことを承諾することです）。受取人であるX社から見れば、これから代金を払ってくれるのがY社からW社に変わっただけで、「お金を受け取れる権利」という意味では約束手形と同じく「受取手形」として処理します。'
  },
  { id:1058, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'食品を小売店に卸しているW社は、仕入先のY社に、<mark class="q-liability">代金40円をまだ支払っていない</mark>。Y社は、X社を受取人とし、W社を支払人とする、為替手形40円を作った。W社は、<mark class="q-liability">この手形の引受けを求められ、これを引き受けた</mark>。W社の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['支払手形',40]]}],
    exp:'今度は支払人（W社）側の視点です。もともとY社に対して持っていた買掛金（支払う義務）を、「これから、X社に直接払います」という支払手形に置き換えます。支払う相手がY社からX社に変わるだけで、W社が払うべき金額そのものは変わりません。'
  },
  { id:1059, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'家具を製造して販売しているX社は、取引先のY社から、「今月は、材料の仕入れが重なって、資金が足りない。お金を貸してほしい」と頼まれた。X社は、Y社と長い付き合いがあるので、頼みに応じることにした。そこで、<mark class="q-asset">現金60円を渡し</mark>、<mark class="q-asset">貸し付けて借用証書を受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['貸付金',60]],c:[['現金',60]]}],
    exp:'「借用証書」とは、お金を借りた事実と、返済の約束を書いた書類のことです。他社にお金を貸すと、現金（資産）が「将来返してもらえる権利」である「貸付金」という資産に姿を変えます。貸した時点ではまだ利息は発生していないので、元本の60円だけを貸付金として計上します。'
  },
  { id:1060, calc:'60＋2＝62円', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'上記の貸付けについて、約束の返済の日が来た。Y社は、資金の都合がついたため、約束どおりに返済してきた。X社は、<mark class="q-asset">貸していた60円</mark>と、<mark class="q-revenue">利息2円</mark>を、あわせて<mark class="q-asset">現金で回収した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',62]],c:[['貸付金',60],['受取利息',2]]}],
    exp:'貸していたお金が返済されるとき、元本の60円は、もともと自分のお金が一巡して戻ってきただけなので儲けにはなりません（貸付金という資産が現金という資産に戻るだけ）。上乗せされた利息2円だけが、お金を貸したことによる正真正銘の儲け（受取利息という収益）です。'
  },
  { id:1061, calc:'', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'X社は、家具を作る機械を、新しいものに入れ替えることにした。そのための資金が足りないので、取引銀行に相談したところ、60円を貸してもらえることになった。X社は、<mark class="q-asset">現金60円を借り入れ</mark>、<mark class="q-liability">借用証書を銀行に差し入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',60]],c:[['借入金',60]]}],
    exp:'銀行からお金を借りると、手元の現金（資産）は増えますが、それは「いずれ必ず返さなければならないお金」なので、同時に「借入金」という負債も同額増えます。利息は借りている期間に応じて後から発生するものなので、この時点ではまだ計上しません。'
  },
  { id:1062, calc:'60＋3＝63円', cat:'債権債務', chap:'第4章：債権債務（手形・電子記録債権）',
