    q:'下記の精算表（8欄）を読み、（ア）当期純利益と（イ）繰越利益剰余金の期末残高を求めよ。なお期末商品は150,000円。',
    q_en:'Read the 8-column worksheet below and calculate (a) net income and (b) the ending balance of retained earnings. Ending inventory is ¥150,000.',
    q_html: `<div class="tbl-sec">精算表（8欄）　単位：円</div><table><thead><tr><th rowspan="2">勘定科目</th><th colspan="2">残高試算表</th><th colspan="2">修正記入</th><th colspan="2">損益計算書</th><th colspan="2">貸借対照表</th></tr><tr><th>借</th><th>貸</th><th>借</th><th>貸</th><th>費用</th><th>収益</th><th>資産</th><th>負債・純資産</th></tr></thead><tbody><tr><td>現金</td><td>1,200,000</td><td></td><td></td><td></td><td></td><td></td><td>1,200,000</td><td></td></tr><tr><td>繰越商品</td><td>100,000</td><td></td><td>150,000</td><td>100,000</td><td></td><td></td><td>150,000</td><td></td></tr><tr><td>買掛金</td><td></td><td>200,000</td><td></td><td></td><td></td><td></td><td></td><td>200,000</td></tr><tr><td>資本金</td><td></td><td>1,000,000</td><td></td><td></td><td></td><td></td><td></td><td>1,000,000</td></tr><tr><td>繰越利益剰余金</td><td></td><td>100,000</td><td></td><td></td><td></td><td></td><td></td><td class="q-blank">（イ）？</td></tr><tr><td>売上</td><td></td><td>700,000</td><td></td><td></td><td></td><td>700,000</td><td></td><td></td></tr><tr><td>仕入</td><td>500,000</td><td></td><td>100,000</td><td>150,000</td><td>450,000</td><td></td><td></td><td></td></tr><tr><td>給料</td><td>200,000</td><td></td><td></td><td></td><td>200,000</td><td></td><td></td><td></td></tr><tr class="total-row"><td>損益計算書欄小計</td><td></td><td></td><td></td><td></td><td>650,000</td><td>700,000</td><td></td><td></td></tr><tr class="total-row"><td>（ア）当期純利益</td><td></td><td></td><td></td><td></td><td></td><td class="q-blank">（ア）？</td><td></td><td></td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">精算表（8欄）　単位：円</div><table><thead><tr><th rowspan="2">勘定科目</th><th colspan="2">残高試算表</th><th colspan="2">修正記入</th><th colspan="2">損益計算書</th><th colspan="2">貸借対照表</th></tr><tr><th>借</th><th>貸</th><th>借</th><th>貸</th><th>費用</th><th>収益</th><th>資産</th><th>負債・純資産</th></tr></thead><tbody><tr><td>現金</td><td>1,200,000</td><td></td><td></td><td></td><td></td><td></td><td>1,200,000</td><td></td></tr><tr><td>繰越商品</td><td>100,000</td><td></td><td class="hl">150,000</td><td class="hl">100,000</td><td></td><td></td><td class="hl">150,000</td><td></td></tr><tr><td>買掛金</td><td></td><td>200,000</td><td></td><td></td><td></td><td></td><td></td><td>200,000</td></tr><tr><td>資本金</td><td></td><td>1,000,000</td><td></td><td></td><td></td><td></td><td></td><td>1,000,000</td></tr><tr><td>繰越利益剰余金</td><td></td><td>100,000</td><td></td><td></td><td></td><td></td><td></td><td class="hl">（イ）150,000</td></tr><tr><td>売上</td><td></td><td>700,000</td><td></td><td></td><td></td><td class="hl">700,000</td><td></td><td></td></tr><tr><td>仕入</td><td>500,000</td><td></td><td>100,000</td><td>150,000</td><td class="hl">450,000</td><td></td><td></td><td></td></tr><tr><td>給料</td><td>200,000</td><td></td><td></td><td></td><td class="hl">200,000</td><td></td><td></td><td></td></tr><tr class="total-row"><td>損益計算書欄小計</td><td></td><td></td><td></td><td></td><td>650,000</td><td>700,000</td><td></td><td></td></tr><tr class="total-row"><td class="hl">（ア）当期純利益</td><td></td><td></td><td></td><td></td><td></td><td class="hl">50,000</td><td></td><td></td></tr></tbody></table><div class="formula-box">（ア）当期純利益＝収益700,000－費用650,000＝50,000　　（イ）繰越利益剰余金＝前期繰越100,000＋純利益50,000＝150,000</div>`,
    exp:'精算表では「費用合計と収益合計の差額」が当期純利益（収益＞費用の場合）です。この純利益はB/S欄の繰越利益剰余金に上乗せされ、P/LとB/Sの数字が繋がります。「利益が出ると純資産（繰越利益剰余金）が増える」仕組みをここで確認できます。' ,
    exp_en:'In a worksheet, the difference between credit total (revenues) and debit total (expenses) in the P/L section is net income = ¥700,000 − ¥650,000 = ¥50,000. This increases retained earnings: ¥100,000 + ¥50,000 = ¥150,000.'
,
    note:'退職給付引当金：\n毎期：（借）退職給付費用 ÷（貸）退職給付引当金\n支払時：（借）退職給付引当金 ÷（貸）現金等',
    steps:[
      {label:'ア（当期純利益）', hint:'精算表損益計算書欄の差額', ans:50000, unit:'円', choices:[50000,40000,60000,30000]},
      {label:'イ（繰越利益剰余金）', hint:'前期繰越 ＋ 当期純利益', ans:150000, unit:'円', choices:[150000,100000,200000,130000]}
    ]
  },

  // ===== 2級：株式発行・合併 =====
  { id:111, level:2, cat:'株式発行',
    q:'会社設立時に株式10株を1株50円で発行し、払込金（500円）が普通預金に振り込まれた（資本金は払込金額の1/2）。また設立費用100円を現金で支払った。仕訳を示せ。',
    q_en:'At incorporation, 10 shares at ¥50 each were issued and ¥500 was deposited into an ordinary bank account (50% to share capital). Incorporation costs of ¥100 were paid in cash. Record the journal entries.',
    e:[{d:[['普通預金',500]], c:[['資本金',250],['資本準備金',250]]}, {d:[['創立費',100]], c:[['現金',100]]}],
    note:'払込金500→資本金250・資本準備金250（各1/2）',
    exp:'株式を発行して投資家から500円を集めました。会社法のルールで「もらった500円の半分（250円）は絶対に守らなくてはいけない元手（資本金）」、「もう半分（250円）は予備の資本（資本準備金）」に分けます。設立費100円は「お店を開くための準備費用（創立費・資産）」として一度資産に計上し、後から少しずつ費用にします。' ,
    exp_en:'When shares are issued, investors\' funds (¥500) flow in. Company law requires at least half (¥250) to be Share Capital (permanent equity); the other half can be Share Capital Reserve. The ¥100 incorporation cost is "Organization Costs" (intangible asset) to be amortized later.'
  },

  { id:112, level:2, cat:'株式発行',
    q:'①株式の申込を受け付け、申込証拠金300円を受け入れた。②株式を正式に発行し、証拠金を資本金・資本準備金（各150円）に振り替え、普通預金に移した。仕訳を示せ。',
    q_en:'① Received share application deposits of ¥300. ② Formally issued shares, transferred deposits to share capital and share capital reserve (¥150 each), and moved funds to ordinary account. Record the journal entries.',
    e:[
      {d:[['別段預金',300]], c:[['株式申込証拠金',300]]},
      {d:[['株式申込証拠金',300]], c:[['資本金',150],['資本準備金',150]]},
      {d:[['普通預金',300]], c:[['別段預金',300]]}
    ],
    note:'①申込受付：別段預金に入金　②発行確定：証拠金→資本金・資本準備金（各150）、別段→普通預金へ移動',
    exp:'株式発行は2ステップです。①申込受付時：まだ正式に株式を出していないのでもらったお金を「別段預金（申込専用の銀行口座）」に入れて、もらった義務「株式申込証拠金（負債）」を記録します。②発行確定時：「証拠金→資本金・資本準備金」に振り替え、「別段預金→普通預金」に移します。「まず仮置きして、確定したら本番に移す」という2段階処理です。' ,
    exp_en:'Share issuance is a two-step process. ① On application: funds go into "Separate Deposits" (special bank account) and create "Share Application Deposits" (liability). ② On issue confirmation: deposits are reclassified to share capital/reserve, and the separate deposit moves to the ordinary account.'
  },

  { id:113, level:2, cat:'企業合併',
    q:'A社はB社を吸収合併し、B社の諸資産1,000円と諸負債400円を引き継いだ。対価として自社の資本金を800円増加させた。仕訳を示せ。',
    q_en:'Company A absorbed Company B, acquiring B\'s assets of ¥1,000 and liabilities of ¥400, and increased its own share capital by ¥800. Record the journal entry.',
    e:[{d:[['諸資産',1000],['のれん',200]], c:[['諸負債',400],['資本金',800]]}],
    note:'のれん = 投資額（取得対価）− 取得した純資産の時価',
    exp:'吸収合併とは「A社がB社を丸ごと買い取ること」です。B社の財産（諸資産1,000）と借金（諸負債400）を引き継ぎ、差し引きの実質的価値は600円です。でもA社は800円分の株式を渡しました。余分に払った200円が「のれん（資産）」です。のれんとは「B社のお客さんや信頼・ブランドなど目に見えない価値に払ったお金」のことです。' ,
    exp_en:'A merger means Company A buys Company B entirely. B\'s net assets = ¥1,000 − ¥400 = ¥600. A paid ¥800 (in shares), which is ¥200 more than the fair net assets. This excess ¥200 is "Goodwill" (intangible asset) — the premium paid for B\'s customer relationships, brand, and intangible value.'
  },

  // ===== 2級：決算振替 =====
  { id:114, level:2, cat:'決算振替',
    q:'決算振替として、①当期純利益300円、②当期純損失200円（別の期の例）それぞれにおける損益勘定の振替仕訳を示せ。',
    q_en:'Record closing entries to transfer ① net income of ¥300 and ② net loss of ¥200 (two separate examples) from the P&L account to retained earnings.',
    e:[{d:[['損益',300]], c:[['繰越利益剰余金',300]]}, {d:[['繰越利益剰余金',200]], c:[['損益',200]]}],
    exp:'1年間の稼ぎと出費を「損益」という集計口座に全部集めます。①利益が出た（300円）場合：損益勘定が貸方残（利益）になるので、借方に損益を書いて会社の貯金（繰越利益剰余金）に移します。②赤字（200円）の場合：逆に貯金（繰越利益剰余金）を削ります。損益勘定は毎年リセットされる「1年用の成績集計表」です。' ,
    exp_en:'All revenues and expenses are gathered in the P&L account. ① If a profit (credit balance): transfer to Retained Earnings (Dr P&L, Cr Retained Earnings). ② If a loss (debit balance): Retained Earnings decreases (Dr Retained Earnings, Cr P&L). The P&L account is a "one-year summary" reset to zero each year.'
  },

  // ===== 2級：剰余金・配当・準備金 =====
  { id:115, level:2, cat:'剰余金・配当',
    q:'株主総会で繰越利益剰余金を財源に、配当金1,000円の支払い・利益準備金100円の積立・別途積立金300円の積立を決議した。仕訳を示せ。',
    q_en:'The shareholders\' meeting resolved to pay dividends of ¥1,000, set aside legal retained earnings reserve of ¥100, and set aside a discretionary reserve of ¥300, all from retained earnings. Record the journal entry.',
    e:[{d:[['繰越利益剰余金',1400]], c:[['未払配当金',1000],['利益準備金',100],['別途積立金',300]]}],
    note:'準備金の取崩額 = 配当金 ＋ 役員賞与 ＋ 欠損補填 等の合計',
    exp:'株主総会で「配当しよう！」と決議した瞬間に、「まだ払っていなくても未払配当金（負債）」が生まれます。お財布（繰越利益剰余金）から出ていくイメージです。利益準備金は法律で「絶対に積み立てなさい」と決められた貯金。別途積立金は「念のために取っておこう」という会社独自の貯金です。合計1,400円が繰越利益剰余金から出ていきます。' ,
    exp_en:'Once a dividend is declared at the shareholders\' meeting, "Dividends Payable" (liability) is created immediately. Legal Retained Earnings Reserve is legally required; Discretionary Reserve is optional. Total ¥1,400 comes out of Retained Earnings.'
  },

  { id:116, level:2, cat:'剰余金・配当',
    q:'株主総会で、その他資本剰余金を財源として配当金800円の支払いと、資本準備金80円の積立を決議した。仕訳を示せ。',
    q_en:'The shareholders\' meeting resolved to pay dividends of ¥800 and set aside ¥80 in Share Capital Reserve, using Other Capital Surplus as the source. Record the journal entry.',
    e:[{d:[['その他資本剰余金',880]], c:[['未払配当金',800],['資本準備金',80]]}],
    note:'資本準備金の取崩：減少させる項目の合計額が取崩額',
    exp:'配当のお金がどこから出るかで「積み立てる準備金の種類」が変わります。「その他資本剰余金（株主から集めたお金系）」を使うなら→「資本準備金」を積み立てる。「繰越利益剰余金（稼いだ利益系）」を使うなら→「利益準備金」を積み立てる。「お金の出どころと積立先がセットになっている」と覚えましょう。' ,
    exp_en:'The type of reserve required depends on the source of dividends. If from "Other Capital Surplus" → set aside "Share Capital Reserve." If from "Retained Earnings" → set aside "Legal Retained Earnings Reserve." The funding source and corresponding reserve are always linked.'
  },

  { id:117, level:2, cat:'剰余金・配当',
    q:'繰越利益剰余金を財源に500円の配当を行う。資本金60,000円・資本準備金4,000円・利益準備金3,000円のとき、今回積み立てるべき利益準備金はいくらか。仕訳を示せ。',
    q_en:'A dividend of ¥500 will be paid from retained earnings. Share capital ¥60,000, share capital reserve ¥4,000, legal retained earnings reserve ¥3,000. How much legal retained earnings reserve must be set aside? Record the journal entry.',
    e:[{d:[['繰越利益剰余金',550]], c:[['未払配当金',500],['利益準備金',50]]}],
    note:'利益準備金積立額 = min(配当金÷10, 積立限度額の残り) / 積立限度額 = 資本金 ÷ 4 − 既積立額',
    exp:'利益準備金には「これ以上積まなくていい上限」があります。上限＝資本金の1/4（60,000÷4＝15,000円）から、すでに積んだ準備金の合計（資本準備金4,000＋利益準備金3,000＝7,000円）を引いた8,000円です。今回積む義務がある金額は「配当の1/10＝500÷10＝50円」です。上限8,000円に余裕があるので50円丸ごと積み立てます。上限に達したら積立ゼロでOKになります。' ,
    exp_en:'The legal retained earnings reserve has a ceiling: one-quarter of share capital (¥15,000) minus existing reserves (¥7,000) = ¥8,000 remaining capacity. Mandatory amount per dividend: ¥500 ÷ 10 = ¥50. Since ¥50 < ¥8,000, set aside the full ¥50.'
  },

  { id:118, level:2, cat:'剰余金・準備金',
    q:'①資本準備金200円を資本金に組み入れた。②利益準備金100円を繰越利益剰余金に振り替えた。仕訳を示せ。',
    q_en:'① Share capital reserve of ¥200 was incorporated into share capital. ② Legal retained earnings reserve of ¥100 was transferred back to retained earnings. Record the journal entries.',
    e:[{d:[['資本準備金',200]], c:[['資本金',200]]}, {d:[['利益準備金',100]], c:[['繰越利益剰余金',100]]}],
    exp:'資本準備金を資本金に移すのは「予備の資本金を本番の資本金に昇格させる」だけです。純資産の中での引っ越しなのでトータルは変わりません。逆に利益準備金を繰越利益剰余金に戻すと「法定貯金を自由なお財布に戻す」ので、配当に使える金額が増えます。どちらも純資産内部の組み替えで、外からは何も変わりません。' ,
    exp_en:'Moving share capital reserve to share capital is an internal transfer within equity (total equity unchanged). Moving legal reserve back to retained earnings frees up restricted capital for potential dividends. Both are equity reclassifications.'
  },

  // ===== 2級：法人税等・消費税 =====
  { id:119, level:2, cat:'法人税等',
    q:'①決算で当期の法人税・住民税及び事業税2,500円を確定させた（中間納付1,000円は先払いとして計上済）。②翌期に残額を現金で納付した。仕訳を示せ。',
    q_en:'① At year-end, corporate taxes were finalized at ¥2,500 (¥1,000 interim payment already recorded as a prepaid asset). ② In the following period, the remaining balance was paid in cash. Record the journal entries.',
    e:[
      {d:[['法人税・住民税及び事業税',2500]], c:[['仮払法人税等',1000],['未払法人税等',1500]]},
      {d:[['未払法人税等',1500]], c:[['現金',1500]]}
    ],
    note:'①決算確定：中間納付1,000を相殺→残1,500を未払計上　②翌期：未払分を現金で納付',
    exp:'2級では法人税の正式名称「法人税・住民税及び事業税」を使います。年度の途中で払う1,000円は「まだ確定していない仮払い（仮払法人税等・資産）」として帳簿に置いておきます。年末に2,500円と確定したら「仮払い1,000円を差し引いた残り1,500円がまだ払っていない税金（未払法人税等・負債）」として記録します。翌年に払って負債が消えます。' ,
    exp_en:'At Level 2, use the full name "Corporate Income Tax, Inhabitant Tax and Enterprise Tax." The ¥1,000 interim payment is a temporary asset. At year-end, ¥2,500 confirmed: ¥1,000 offset → remaining ¥1,500 becomes "Accrued Corporate Tax Payable" (liability), paid the following year.'
  },

  { id:120, level:2, cat:'消費税',
    q:'税抜経理方式を採用している食料品店。①りんご1個（本体100円）を税込110円で現金仕入した。②みかん3個（本体300円）を税込330円で現金売上した（消費税率10%）。仕訳を示せ。',
    q_en:'Using the tax-exclusive method: ① Purchased goods at ¥100 net (¥110 cash, 10% tax). ② Sold goods at ¥300 net (¥330 cash). Record the journal entries.',
    e:[{d:[['仕入',100],['仮払消費税',10]], c:[['現金',110]]}, {d:[['現金',330]], c:[['売上',300],['仮受消費税',30]]}],
    note:'①110＝本体100＋消費税10　②330＝本体300＋消費税30',
    exp:'税抜経理とは「消費税と本体の値段を別々に記録する方法」です。商品を100円で仕入れて消費税10円を払ったとき、本体100円は「仕入（費用）」、消費税10円は「仮払消費税（資産）」として分けて記録します。売上側の消費税は「仮受消費税（負債）」として国への預かりものにします。決算でこの2つを相殺して差額を国に納めます。' ,
    exp_en:'Under the tax-exclusive method, consumption tax is recorded separately from the base price. ¥10 paid on purchase = "Prepaid Consumption Tax" (asset). ¥30 collected on sale = "Accrued Consumption Tax" (liability). At year-end, the difference is the net tax payable.'
  },

  { id:121, level:2, cat:'消費税',
    q:'①決算：仕入時の消費税1,000円・売上時の預り消費税3,000円を確定させた。②翌期：確定した消費税を現金で納付した。仕訳を示せ。',
    q_en:'① Year-end: settle prepaid consumption tax ¥1,000 and accrued consumption tax ¥3,000. ② Following period: pay the confirmed consumption tax in cash. Record the journal entries.',
    e:[
      {d:[['仮受消費税',3000]], c:[['仮払消費税',1000],['未払消費税',2000]]},
      {d:[['未払消費税',2000]], c:[['現金',2000]]}
    ],
    note:'①決算：仮受3,000から仮払1,000を相殺→未払消費税2,000　②翌期：現金で納付',
    exp:'決算時に「仮受消費税（3,000円）から仮払消費税（1,000円）を引いた差額（2,000円）」が国に払う「未払消費税（負債）」になります。3,000円預かって1,000円立て替えたので差し引き2,000円を国に納めます。翌期に実際に払って負債が消えます。' ,
    exp_en:'At year-end, offset accrued consumption tax (¥3,000 collected) against prepaid consumption tax (¥1,000 paid). The net ¥2,000 becomes "Consumption Tax Payable" (liability), remitted to the government the following period.'
  },

  // ===== 2級：商品売買 =====
  { id:122, level:2, cat:'商品売買',
    q:'衣料品店がTシャツ1枚（原価1,500円）を2,100円で掛け売りした。売上のつど売上原価を計上する方法（商品勘定使用）を採用している。仕訳を示せ。',
    q_en:'Goods with a cost of ¥1,500 were sold on credit for ¥2,100. The company recognizes cost of goods sold at each sale (perpetual method). Record the journal entries.',
    e:[{d:[['売掛金',2100]], c:[['売上',2100]]}, {d:[['売上原価',1500]], c:[['商品',1500]]}],
    note:'①売上2,100を計上　②原価1,500を商品→売上原価へ振替',
    exp:'商品を売るたびに「収益（売上）と費用（売上原価）を同時に記録する方法」です。たとえばラーメン屋さんが1杯1,500円で麺700円を使って売ったとき、「売上1,500・売上原価700」を同時に記録します。レジを打つたびに利益がリアルタイムでわかります。3級の「三分法（期末一括計算）」と違い、即座に粗利が計算できます。' ,
    exp_en:'Under the perpetual method, both revenue and COGS are recorded simultaneously at every sale. Revenue (¥2,100) and cost (¥1,500) → gross profit (¥600) is visible in real time. This contrasts with the periodic method (Level 3) where COGS is calculated only at year-end.'
  },

  { id:123, level:2, cat:'商品売買',
    q:'仕入先から当月の仕入高に対する割戻し（リベート）10円が通知された（掛け代金から差し引く）。仕訳を示せ。',
    q_en:'The supplier notified the company of a purchase rebate of ¥10 on this month\'s purchases, to be deducted from accounts payable. Record the journal entry.',
    e:[{d:[['買掛金',10]], c:[['仕入',10]]}],
    exp:'割戻し（リベート）とは「たくさん買ってくれてありがとう！その分値引きします」というご褒美です。仕入先から「買掛金10円を減らしてあげる」と通知が来たので、買掛金（借金）を10円減らし、仕入（費用）も10円取り消します。現金のやり取りなしで帳簿上だけで「仕入コストが安くなる」処理です。' ,
    exp_en:'A purchase rebate is a reward for buying in volume. The supplier reduces the accounts payable balance and the purchase cost is simultaneously reduced. No cash changes hands; only ledger balances are adjusted.'
  },

  // ===== 2級：手形 =====
  { id:124, level:2, cat:'手形',
    q:'①所持する約束手形1,000円を電子部品の仕入代金の支払いとして裏書譲渡した。②電子部品（2,000円分）を売り上げ、得意先振出し約束手形を受け取った。仕訳を示せ。',
    q_en:'① Notes receivable of ¥1,000 were endorsed and transferred to the supplier as payment. ② Goods worth ¥2,000 were sold and a promissory note drawn by the customer was received. Record the journal entries.',
    e:[{d:[['仕入',1000]], c:[['受取手形',1000]]}, {d:[['受取手形',2000]], c:[['売上',2000]]}],
    exp:'受取手形とは「○○日に銀行に入金されます」という約束書です。この約束書を「仕入代金の支払い」に使うことを「裏書き譲渡」といいます。手形の裏に署名して相手に渡せば現金なしで仕入代金が払えます。手形という「券」で別の支払いを連鎖させる仕組みです。現金が足りないときの資金繰りにも使われます。' ,
    exp_en:'A notes receivable is "a promise that payment will be deposited on a specific date." Using such a note to pay a supplier is "endorsement transfer" — signing the back of the note and handing it over settles the purchase debt without cash.'
  },

  { id:125, level:2, cat:'手形',
    q:'所持する約束手形（額面100円）を期日前に銀行で換金した。換金手数料10円を差し引かれた手取金90円が当座預金に振り込まれた。仕訳を示せ。',
    q_en:'A notes receivable of ¥100 (face value) was discounted at the bank before its due date. Net proceeds of ¥90 (after a ¥10 discount fee) were deposited into the checking account. Record the journal entry.',
    e:[{d:[['当座預金',90],['手形売却損',10]], c:[['受取手形',100]]}],
    note:'手取金90＝額面100－割引料10',
    exp:'手形を期日前に銀行に「売って」現金に換えることを「手形割引」といいます。100円の手形を今すぐ現金化したいので銀行に持っていくと「手数料を引いて90円しか払えないよ」と言われます。差額10円が「手形売却損（費用）」です。急いで現金が必要なときに使う方法ですが、10円損してしまいます。' ,
    exp_en:'Note discounting is selling a note receivable to the bank to convert it to cash before the due date. The bank charges a fee (¥10) and pays only ¥90. The ¥10 difference is "Loss on Note Discounting" (expense).'
  },

  { id:126, level:2, cat:'手形',
    q:'①満期日に受取手形500円が不渡りとなり、償還請求費用20円を現金で支払った。②その後、不渡分の全額（520円）が回収された。仕訳を示せ。',
    q_en:'① On its due date, a notes receivable of ¥500 was dishonored; recovery costs of ¥20 were paid in cash. ② Subsequently, the full amount (¥520) was collected. Record the journal entries.',
    e:[
      {d:[['不渡手形',520]], c:[['受取手形',500],['現金',20]]},
      {d:[['現金',520]], c:[['不渡手形',520]]}
    ],
    note:'不渡手形 = 手形金額 ＋ 償還費用 / 回収時：現金 ／ 不渡手形（消去）',
    exp:'不渡りとは「期日になったのにお金が入ってこなかった手形」のことです。手形の名前を「受取手形（普通の権利）」から「不渡手形（問題のある権利）」に変えて管理します。法的な取り立て費用20円もプラスして520円として追跡します。全額回収できたら「不渡手形を消して現金を増やす」だけです。回収できなければ「貸倒損失」として損失にします。' ,
    exp_en:'A dishonored note was not paid on its due date. The note is reclassified to "Dishonored Notes" (problem asset). Recovery costs (¥20) are added to make the total claim ¥520. If fully collected, the asset converts to cash.'
  },

  { id:127, level:2, cat:'手形',
    q:'不渡手形300円（諸費用含む）が回収不能と判明し、貸倒れ処理した。仕訳を示せ。',
    q_en:'Dishonored notes of ¥300 (including related costs) proved uncollectible and were written off as bad debt. Record the journal entry.',
    e:[{d:[['貸倒損失',300]], c:[['不渡手形',300]]}],
    exp:'もう絶対に返ってこないとわかったとき、「不渡手形（資産）」を消して「貸倒損失（費用・損失）」に変えます。「あきらめて損失として確定させる」処理です。もし事前に「引当金（そなえ）」を積んでいれば、そちらで先に賄えるので追加の損失が少なくなります。' ,
    exp_en:'When recovery is confirmed as impossible, the "Dishonored Notes" asset is removed and "Bad Debt Loss" (expense) is recognized. This is the write-off — acknowledging the loss as final.'
  },

  // ===== 2級：電子記録 =====
  { id:128, level:2, cat:'電子記録',
    q:'電子記録債務の支払期日が到来し、A社（債務者）の当座預金からB社（債権者）へ1,000円が決済された。A・B両社それぞれの仕訳を示せ。',
    q_en:'An electronic debt of ¥1,000 reached its due date and was settled from Company A\'s checking account to Company B. Record the journal entries for both A and B.',
    e:[
      {d:[['電子記録債務',1000]], c:[['当座預金',1000]]},
      {d:[['当座預金',1000]], c:[['電子記録債権',1000]]}
    ],
    note:'A社（債務者）の仕訳　B社（債権者）の仕訳',
    exp:'電子記録の期日決済は「電子データが消えてお金が動く」瞬間です。支払うA社は「電子記録の借金が消えて銀行残高が減り」、受け取るB社は「電子記録の権利が消えて銀行残高が増え」ます。紙の手形と違ってデータだけでやり取りするので、A社とB社の仕訳は「かがみ写し（まったく逆）」になります。' ,
    exp_en:'When an e-note reaches its due date, the digital record disappears and money moves. A (payer): electronic liability vanishes and bank balance decreases. B (receiver): electronic asset vanishes and bank balance increases. A and B\'s entries are perfect mirror images.'
  },

  { id:129, level:2, cat:'電子記録',
    q:'BはAに対する電子債権1,000円を、C社への掛け代金支払いとしてCに譲渡した。B・C両社それぞれの仕訳を示せ。',
    q_en:'Company B assigned its electronic receivable of ¥1,000 (from Company A) to Company C in payment of ¥1,000 in accounts payable. Record the journal entries for both B and C.',
    e:[
      {d:[['買掛金',1000]], c:[['電子記録債権',1000]]},
      {d:[['電子記録債権',1000]], c:[['売掛金',1000]]}
    ],
    note:'B（譲渡人）の仕訳　C（譲受人）の仕訳',
    exp:'電子記録債権の譲渡は「電子化した受取手形の裏書き渡し」とまったく同じです。BはAから受け取った「電子記録の権利」をCへの買掛金支払いに使います。C商店は「AさんからBさんに支払われるはずだったお金を、直接自分がもらう権利」を受け取ります。現金なしでB・C間の借金が解決できます。' ,
    exp_en:'Assigning an electronic receivable is exactly the same as endorsing a note receivable. B uses its right to collect from A to pay its debt to C. C receives the right to collect from A directly. No cash changes hands between B and C.'
  },

  { id:130, level:2, cat:'電子記録',
    q:'所持する電子記録債権1,000円を950円で金融機関に売却し、代金が当座預金に入金された。仕訳を示せ。',
    q_en:'Electronic receivable of ¥1,000 was sold to a financial institution for ¥950; proceeds were deposited into the checking account. Record the journal entry.',
    e:[{d:[['当座預金',950],['電子記録債権売却損',50]], c:[['電子記録債権',1000]]}],
    note:'手取金950＝額面1,000－損失50',
    exp:'電子記録債権を「手形割引と同じように期日前に売って現金化する」処理です。1,000円の権利なのに急いでいるので950円で銀行に売ります。差額50円が損（電子記録債権売却損・費用）になります。「50円損してでも今すぐ現金がほしい！」という状況で使います。' ,
    exp_en:'Selling an electronic receivable before its due date converts it to immediate cash. Face value (¥1,000) > proceeds (¥950), so the difference ¥50 is "Loss on Sale of Electronic Receivable" (expense).'
  },

  { id:131, level:2, cat:'電子記録',
    q:'備品（帳簿価額700円）を700円で売却し、代金は電子記録によることとした。仕訳を示せ。',
    q_en:'Equipment (book value ¥700) was sold for ¥700 and payment was to be made via electronic record. Record the journal entry.',
    e:[{d:[['営業外電子記録債権',700]], c:[['備品',700]]}],
    exp:'備品（固定資産）を売ったお金を電子記録で受け取る場合、商品の売り上げではないので「営業外電子記録債権」という特別な名前を使います。通常の電子記録債権（商品売買用）と区別するための名前の違いだけで、性質は同じです。「日常の商売以外（営業外）の取引で生まれた電子記録の権利」という意味です。' ,
    exp_en:'When proceeds from selling equipment (a fixed asset) are collected electronically, a special account is used: "Non-trade Electronic Receivable" (営業外電子記録債権). This distinguishes it from the regular electronic receivable used in merchandise trade.'
  },

  { id:132, level:2, cat:'電子記録',
    q:'事業用の土地800円を購入し、代金は電子記録によることとした。仕訳を示せ。',
    q_en:'Business land was purchased for ¥800 and payment was to be made via electronic record. Record the journal entry.',
    e:[{d:[['土地',800]], c:[['営業外電子記録債務',800]]}],
    exp:'土地（固定資産）を買う代金を電子記録で支払う約束をした場合、商品の仕入れではないので「営業外電子記録債務」という特別な名前を使います。通常の買掛金の代わりに電子記録を使う場合（= 電子記録債務）と区別するための名前です。「日常の商売以外の取引で生まれた電子記録の借金」という意味です。' ,
    exp_en:'When a fixed asset (land) purchase is settled electronically, it is recorded as "Non-trade Electronic Debt" (営業外電子記録債務). This distinguishes it from ordinary accounts payable or electronic debt from merchandise trade.'
  },

  { id:133, level:2, cat:'電子記録',
    q:'A社に対して未回収代金300円と未払代金500円がある。両社の合意のもと300円分を相殺した。仕訳を示せ。',
    q_en:'There is accounts receivable of ¥300 and accounts payable of ¥500 owed to Company A. With both parties\' consent, ¥300 was offset. Record the journal entry.',
    e:[{d:[['買掛金',300]], c:[['売掛金',300]]}],
    exp:'相殺とは「お互いの貸し借りを帳消しにすること」です。「A社に300円払う」と「A社から300円もらう」が同時にあるなら、差し引きゼロにすれば2回のお金の動きを省けます。実際に現金を往復させる手間がなくなります。相殺後は買掛金が500円から300円引かれて200円だけ残ります。' ,
    exp_en:'Offsetting means canceling mutual receivables and payables. If ¥300 is owed to and from the same company, eliminating both sides saves two cash movements. After offsetting, only the remaining ¥200 accounts payable remains.'
  },

  { id:134, level:2, cat:'電子記録',
    q:'A社に対する未回収代金1,000円をD社（ファクタリング会社）に950円で売却し、代金が普通預金に入金された。仕訳を示せ。',
    q_en:'Accounts receivable of ¥1,000 (from Company A) was sold to Company D (factoring company) for ¥950; proceeds were deposited into the ordinary bank account. Record the journal entry.',
    e:[{d:[['普通預金',950],['債権売却損',50]], c:[['売掛金',1000]]}],
    note:'手取金950＝売掛金1,000－損失50',
    exp:'ファクタリングとは「将来もらえるはずの売掛金をファクタリング会社に売ってすぐ現金化する」仕組みです。本来1,000円もらえるはずの権利を950円で売るので50円の損（債権売却損）が出ます。でも「翌月まで待たずに今すぐ現金がほしい！」ときに使います。リスクを引き受けた代わりにD社が50円を儲けるという仕組みです。' ,
    exp_en:'Factoring means selling future receivables to a factoring company for immediate cash. Selling a ¥1,000 receivable for ¥950 generates a ¥50 loss. The trade-off: lose ¥50 but get cash now. Company D profits by collecting the full ¥1,000 later.'
  },

  // ===== 2級：修正仕訳 =====
  { id:135, level:2, cat:'修正仕訳',
    q:'得意先から未回収の販売代金300円が当座預金に振り込まれていたが、会社はまだ通知を受け取っておらず未記帳だった。仕訳を示せ。',
    q_en:'A customer had transferred ¥300 into the company\'s checking account, but the company had not yet received notification and the transaction was unrecorded. Record the journal entry.',
    e:[{d:[['当座預金',300]], c:[['売掛金',300]]}],
    exp:'銀行には入金されているのに会社の帳簿には載っていない！という場合の処理です。「銀行側はもう処理済み、会社側がまだ」という「企業未処理」のケースです。通知を受け取った時点で「当座預金（銀行口座の残高）が増えた＋売掛金（受け取る権利）が消えた」という仕訳を書いて帳簿を実態に合わせます。' ,
    exp_en:'The bank already processed this, but the company\'s books haven\'t caught up ("enterprise unprocessed"). Upon receiving notification, the company records: checking account increases + accounts receivable eliminated. The books are brought into line with reality.'
  },

  { id:136, level:2, cat:'修正仕訳',
    q:'売掛金50円を現金で回収した際、誤って「当座預金50 / 売掛金50」と記帳した。正しい仕訳に訂正せよ。',
    q_en:'When ¥50 of accounts receivable was collected in cash, it was incorrectly recorded as "Checking Account ¥50 / Accounts Receivable ¥50." Correct the entry.',
    e:[{d:[['売掛金',50]], c:[['当座預金',50]]}, {d:[['現金',50]], c:[['売掛金',50]]}],
    exp:'間違えた仕訳を直す方法は「①間違いを逆向きに消す→②正しく書き直す」の2ステップです。①「当座預金50 / 売掛金50」を逆にすると「売掛金50 / 当座預金50」（これで間違いがゼロに）、②正しくは「現金50 / 売掛金50」。2本を足すと「現金50 / 当座預金50」の1本になります。テストでは「逆仕訳＋正しい仕訳」の2本を書けばOKです。' ,
    exp_en:'To correct a wrong entry: ① reverse the wrong entry (write it backwards to zero it out); ② record the correct entry. ① Reverse: AR ¥50 / Checking Account ¥50; ② Correct: Cash ¥50 / AR ¥50. Combined: Cash ¥50 / Checking Account ¥50.'
  },

  { id:137, level:2, cat:'修正仕訳',
    q:'買掛金800円の支払いのため小切手を振り出し「買掛金800 / 当座預金800」と記帳したが、この小切手はまだ仕入先に渡していなかった。修正仕訳を示せ。',
    q_en:'A check was drawn to pay ¥800 of accounts payable and recorded as "AP ¥800 / Checking Account ¥800," but the check had not yet been delivered to the supplier. Record the correcting entry.',
    e:[{d:[['当座預金',800]], c:[['買掛金',800]]}],
    exp:'小切手を作っても「まだ相手に渡していない」なら支払いは完了していません！なのに帳簿から「当座預金800を減らして買掛金を消す」という仕訳を先にしてしまっています。これを元に戻すため「当座預金800を増やして買掛金を復活させる」逆仕訳を書きます。「渡してから支払い完了」というルールを忘れないようにしましょう。' ,
    exp_en:'Writing a check without delivering it does not complete payment. The entry was premature. Correcting entry: reverse the checking account decrease and reinstate the accounts payable. Rule: "payment is complete only when the check is delivered."'
  },

  { id:138, level:2, cat:'修正仕訳',
    q:'広告宣伝費600円の支払いのため小切手を振り出し「広告宣伝費600 / 当座預金600」と記帳したが、この小切手はまだ広告会社に渡していなかった。修正仕訳を示せ。',
    q_en:'A check was drawn to pay ¥600 of advertising expense and recorded as "Ad Expense ¥600 / Checking Account ¥600," but the check had not yet been delivered. Record the correcting entry.',
    e:[{d:[['当座預金',600]], c:[['未払金',600]]}],
    exp:'Q137との違いがポイントです。買掛金（仕入れ代金）のケース（Q137）は支払い・費用ともに未確定でした。広告費のケースでは「広告サービスを受けた事実はある＝費用はすでに確定」しているのでそのまま残します。ただし「小切手を渡していない＝まだ払っていない」ので当座預金の減少だけ取り消し、「未払金（負債）」に置き換えます。' ,
    exp_en:'Key difference from Q137: advertising service has already been rendered (expense confirmed). So Advertising Expense stays. Only the premature reduction of checking account is reversed, replaced by "Accrued Accounts Payable" (liability). Expense: confirmed. Payment: not yet.'
  },

  // ===== 2級：固定資産（営業外手形・割賦・減価償却・除却・建設仮勘定） =====
  { id:139, level:2, cat:'固定資産',
    q:'備品を購入し、代金の支払いに約束手形を振り出した。仕訳を示せ。',
    q_en:'Equipment was purchased and a promissory note was issued in payment. Record the journal entry.',
    e:[{d:['備品'], c:['営業外支払手形']}],
    exp:'固定資産（備品）の購入代金に手形を使うとき、商品仕入の手形（支払手形）と区別して「営業外支払手形（負債）」と書きます。「営業外」とは「商品の売り買い以外の取引」という意味です。性質は支払手形と同じ「○日に必ず払います」という約束書です。' ,
    exp_en:'When a promissory note is issued to pay for a fixed asset (not merchandise), the liability is called "Non-trade Notes Payable" (営業外支払手形), distinguished from "Notes Payable" used for merchandise. Same substance — a binding promise to pay on a specific date.'
  },

  { id:140, level:2, cat:'固定資産',
    q:'備品（帳簿価額800円・直接法）を850円で売却し、代金は約束手形で受け取った。仕訳を示せ。',
    q_en:'Equipment (book value ¥800, direct method) was sold for ¥850, with payment received in a promissory note. Record the journal entry.',
    e:[{d:[['営業外受取手形',850]], c:[['備品',800],['固定資産売却益',50]]}],
    exp:'直接法とは「減価償却した分を備品の金額から直接引いてある記帳方法」です。なので帳簿に載っている備品の価額がそのまま「帳簿価額（800円）」になります。850円で売れたので差額50円が「固定資産売却益（収益）」です。代金を手形で受け取ったので「営業外受取手形（資産）」に記録します。' ,
    exp_en:'Under the direct method, the balance sheet shows net book value (¥800). Selling above book value (¥850 > ¥800) generates "Gain on Sale of Fixed Assets" (¥50). The note received is "Non-trade Notes Receivable" (営業外受取手形).',
    note:'連結決算：\n内部取引・内部利益の消去\n親子会社の資本・負債の相殺消去'
  },

  { id:141, level:2, cat:'固定資産',
    q:'備品6万円を6回払い（月10,500円）で購入した。利息分は前払利息で処理する。仕訳を示せ。',
    q_en:'Equipment costing ¥60,000 was purchased in 6 monthly installments of ¥10,500 each. Interest is recorded as prepaid interest. Record the journal entry.',
    e:[{d:[['備品',60000],['前払利息',3000]], c:[['未払金',63000]]}],
    note:'合計支払63,000－本体60,000＝利息3,000',
    exp:'割賦（かっぷ）購入とは「分割払いで買うこと」です。本体60,000円の備品を6回払い合計63,000円で買うので、差額3,000円が「金利・利息」分です。備品の本体価格（60,000円）は資産、利息分（3,000円）は「前払利息（資産）」として先に計上し、毎回の支払い時に少しずつ費用にします。合計の支払義務63,000円は「未払金（負債）」です。' ,
    exp_en:'Installment purchase: equipment costs ¥60,000 but total payments are ¥63,000 (6 × ¥10,500), so ¥3,000 is the financing cost (interest). Equipment ¥60,000 (asset); Prepaid Interest ¥3,000 (asset, expensed monthly); total obligation ¥63,000 (Accounts Payable, liability).'
  },

  { id:142, level:2, cat:'固定資産',
    q:'備品（現金正価6万円・月10,500円・6回払い）の第1回目の割賦金を普通預金から支払った。前払利息は定額法により配分する。仕訳を示せ。',
    q_en:'The first installment payment (¥10,500) for the equipment (cash price ¥60,000, 6 × ¥10,500) was paid from the ordinary bank account. Interest is allocated by straight-line method. Record the journal entries.',
    e:[{d:[['未払金',10500]], c:[['普通預金',10500]]}, {d:[['支払利息',500]], c:[['前払利息',500]]}],
    note:'1回の利息 = 額面 × 利率 ÷ 利払い回数',
    exp:'毎月の払いは2本の仕訳をセットで行います。①未払金（借金）10,500円を普通預金（銀行口座）から払って負債を減らす、②前払い済みの利息（前払利息）のうち今回の1回分500円を「支払利息（費用）」に振り替える。「借金を減らす＋利息を費用にする」の2本セットです。' ,
    exp_en:'Each monthly payment requires two entries: ① reduce accounts payable by ¥10,500 (bank transfer); ② transfer one installment\'s share of prepaid interest (¥3,000 ÷ 6 = ¥500) to Interest Expense. "Pay the debt + recognize the interest cost" — two entries as a set.'
  },

  { id:143, level:2, cat:'固定資産',
    q:'当期首に購入した建物（取得原価10,000円・残存価額0・耐用年数20年）を定額法（毎年同額を費用化）で減価償却した。記帳方法は直接法（建物の金額を直接減らす方法）。仕訳を示せ。',
    q_en:'A building purchased at the start of the year (cost ¥10,000, residual ¥0, life 20 years) was depreciated using the straight-line method (direct method). Record the journal entry.',
    e:[{d:[['減価償却費',500]], c:[['建物',500]]}],
    note:'定額法：年間償却額 = (取得価額 − 残存価額) ÷ 耐用年数',
    exp:'定額法とは「毎年同じ金額ずつ価値を減らす計算方法」です。10,000円の建物が20年で使えなくなるので、1年ごとに10,000÷20＝500円ずつ価値が下がります。直接法とは「建物の金額から直接500円を引く方法」です。建物の帳簿価額が毎年500円ずつ小さくなっていきます。' ,
    exp_en:'Straight-line depreciation charges an equal amount each year: ¥10,000 ÷ 20 years = ¥500 per year. Under the direct method, the asset\'s book value is reduced directly. The building\'s recorded value decreases by ¥500 each year until it reaches zero.'
  },

  { id:144, level:2, cat:'固定資産',
    q:'前期首に購入した建物（取得原価10,000円・残存価額0・耐用年数20年）を定額法で減価償却した。記帳方法は間接法（「減価償却累計額」という別勘定に累積していく方法）。仕訳を示せ。',
    q_en:'A building purchased at the start of the prior year (cost ¥10,000, residual ¥0, life 20 years) was depreciated using the straight-line method (indirect method). Record the journal entry.',
    e:[{d:[['減価償却費',500]], c:[['建物減価償却累計額',500]]}],
    note:'定額法：年間償却額 = (取得原価 − 残存価額) ÷ 耐用年数',
    exp:'間接法とは「建物の金額は変えずに、別の勘定（建物減価償却累計額）で「これまで減った合計」を記録する方法」です。建物は10,000円のまま帳簿に残り、別の場所に「これまでで累計○円減りましたよ」という記録が積み上がります。実際の帳簿価額は「建物－建物減価償却累計額」で計算します。' ,
    exp_en:'Under the indirect method, the asset\'s cost (¥10,000) remains unchanged, and a separate "Accumulated Depreciation" account accumulates the total depreciated amount. Net book value = asset cost − accumulated depreciation. The original cost is preserved for reference.'
  },

  { id:145, level:2, cat:'固定資産',
    q:'当期12/1に購入した備品（取得原価30,000円）を定率法（残存価額に率を掛けて毎年減らす方法・償却率20%）で減価償却。決算日3/31・間接法（減価償却累計額を使う方法）。①取得後1年目②2年目③3年目の決算整理仕訳を示せ。',
    q_en:'Equipment purchased on Dec 1 (cost ¥30,000, 20% declining balance rate, indirect, year-end Mar 31). Record year-end depreciation entries for ① year 1, ② year 2, ③ year 3.',
    e:[
      {d:[['減価償却費',2000]], c:[['備品減価償却累計額',2000]]},
      {d:[['減価償却費',5600]], c:[['備品減価償却累計額',5600]]},
      {d:[['減価償却費',4480]], c:[['備品減価償却累計額',4480]]}
    ],
    note:'定率法：各期の償却額 = 期首帳簿価額 × 償却率 / 初年度は月数按分（取得月数 ÷ 12）',
    exp:'定率法とは「残っている価値の一定割合（20%）を毎年减価償却する方法」です。最初は減る金額が大きく、年々小さくなります。①1年目は12/1購入なので4か月分のみ：30,000×20%×4/12＝2,000円。②2年目は残り28,000円の20%：5,600円。③3年目は残り22,400円の20%：4,480円。残る価値が減るので、毎年少しずつ償却額も減っていきます。' ,
    exp_en:'Declining balance: each year\'s depreciation = remaining book value × rate. ① Year 1 (4 months, Dec–Mar): ¥30,000 × 20% × 4/12 = ¥2,000. ② Year 2: ¥28,000 × 20% = ¥5,600. ③ Year 3: ¥22,400 × 20% = ¥4,480. Earlier years have larger charges; amounts decrease each year.'
  },

  { id:146, level:2, cat:'固定資産',
    q:'当期首に購入した備品（取得原価30,000円・耐用年数5年・残存価額0）を200%定率法（定額法の2倍の速さで減らす方法）で減価償却した。記帳方法は間接法（減価償却累計額を使う方法）。仕訳を示せ。',
    q_en:'Equipment purchased at year start (cost ¥30,000, life 5 years, residual ¥0) was depreciated using the 200% declining balance method (indirect method). Record the journal entry.',
    e:[{d:[['減価償却費',12000]], c:[['備品減価償却累計額',12000]]}],
    note:'200%定率法：償却率 = 1 ÷ 耐用年数 × 200% / 償却額 = 期首帳簿価額 × 償却率',
    exp:'200%定率法とは「定額法の2倍の速さで減価償却する方法」です。定額法（毎年同じ額）の償却率は1÷5年＝20%。それを2倍にするので「200%定率法の償却率は40%」です。1年目の償却費：30,000×40%＝12,000円。定率法より最初の数年に多く費用化するので、新品のうちに大きく価値を下げられます。' ,
    exp_en:'The 200% declining balance method uses twice the straight-line rate. Straight-line rate = 1 ÷ 5 years = 20%. Double it: 40%. Year 1: ¥30,000 × 40% = ¥12,000. The 200% method front-loads depreciation in the early years when the asset is most productive.'
  },

  { id:147, level:2, cat:'固定資産',
    q:'当期10/1に購入した車両（取得原価180,000円・残存価額0・総走行可能距離10,000km）を生産高比例法（使った分だけ減らす方法）で減価償却。当期の走行距離1,000km・決算日3/31・間接法（減価償却累計額を使う方法）。仕訳を示せ。',
    q_en:'A vehicle purchased on Oct 1 (cost ¥180,000, residual ¥0, total estimated mileage 10,000 km) is depreciated using the units-of-production method. Current-period mileage: 1,000 km; year-end Mar 31; indirect method. Record the journal entry.',
    e:[{d:[['減価償却費',18000]], c:[['車両運搬具減価償却累計額',18000]]}],
    note:'生産高比例法：年間償却額 = 取得原価 × (当期生産量 ÷ 総予定生産量)',
    exp:'生産高比例法とは「どれだけ使ったかに比例して減価償却する方法」です。タクシーやトラックのように「走れば走るほど価値が減る」車両に使います。180,000円の車が10,000km走ったら価値がゼロになる、と仮定すると「1km走るごとに18円ずつ減る」。今年1,000km走ったので18,000円を費用にします。' ,
    exp_en:'The units-of-production method depreciates assets in proportion to actual use. Per-km: ¥180,000 ÷ 10,000 km = ¥18/km. Current period: ¥18 × 1,000 km = ¥18,000. Useful for vehicles and machinery whose wear depends on usage rather than time.'
  },

  { id:148, level:2, cat:'固定資産',
    q:'車両（取得原価200,000円・期首減価償却累計額108,000円＝これまで費用化した合計額・間接法）を下取り価額85,000円（古い車を引き取ってもらう価格）で下取りに出し、新車両300,000円を購入した。差額は翌月末に支払う。仕訳を示せ。',
    q_en:'A vehicle (cost ¥200,000, accumulated depreciation ¥108,000, indirect) was traded in at ¥85,000 and a new vehicle costing ¥300,000 was purchased. The balance is payable next month. Record the journal entry.',
    e:[{d:[['車両運搬具',300000],['車両運搬具減価償却累計額',108000],['固定資産売却損',7000]], c:[['車両運搬具',200000],['未払金',215000]]}],
    note:'帳簿価額 = 取得原価 − 減価償却累計額 / 売却損益 = 売却価額 − 帳簿価額 / 未払金 = 売却価額 − 受取済現金',
    exp:'下取りとは「古い物を売って、その代金を新しい物の購入代金の一部に充てること」です。①古い車を売る：帳簿価額92,000円（200,000－108,000）の車を85,000円で売ったので7,000円の損（固定資産売却損）が出ます。②新しい車300,000円を買う：古い車の下取り代金85,000円を引いて残り215,000円を後払い（未払金）にします。' ,
    exp_en:'A trade-in sells old and buys new in one transaction. ① Old vehicle: book value ¥92,000 (¥200,000 − ¥108,000) traded in for ¥85,000 → ¥7,000 loss. ② New vehicle: ¥300,000 purchased, trade-in ¥85,000 credited → ¥215,000 remaining as Accounts Payable.'
  },

  { id:149, level:2, cat:'固定資産',
    q:'備品（取得原価60,000円・期首減価償却累計額36,000円＝これまで費用化した合計・間接法）を除却（使用をやめて帳簿から消す）した。除却資産の見積処分価額（売れそうな金額の見積もり）は18,000円。仕訳を示せ。',
    q_en:'Equipment (cost ¥60,000, accumulated depreciation ¥36,000, indirect) was retired from service. Estimated disposal value: ¥18,000. Record the journal entry.',
    e:[{d:[['備品減価償却累計額',36000],['貯蔵品',18000],['固定資産除却損',6000]], c:[['備品',60000]]}],
    note:'帳簿価額24,000－処分価額18,000＝除却損6,000',
    exp:'除却（じょきゃく）とは「まだ売れるが、もう使わないので帳簿から消す」ことです。帳簿価額（60,000－36,000＝24,000円）のうち、捨てずに売れる部分（18,000円）は「貯蔵品（資産）」として残します。それでも帳簿価額24,000円より少ないので差額6,000円が「固定資産除却損（費用）」です。' ,
    exp_en:'Retirement (除却) means removing an asset from service even though it can still be sold. Book value = ¥24,000. Estimated sale value (¥18,000) → Supplies (asset). Unrecoverable portion (¥24,000 − ¥18,000 = ¥6,000) → "Loss on Retirement of Fixed Assets" (expense).'
  },

  { id:150, level:2, cat:'固定資産',
    q:'備品（取得原価60,000円・期首減価償却累計額36,000円＝これまで費用化した合計・間接法）を廃棄（完全に捨てる）した。廃棄費用500円を現金で支払った。仕訳を示せ。',
    q_en:'Equipment (cost ¥60,000, accumulated depreciation ¥36,000, indirect) was scrapped. Disposal costs of ¥500 were paid in cash. Record the journal entry.',
    e:[{d:[['備品減価償却累計額',36000],['固定資産廃棄損',24500]], c:[['備品',60000],['現金',500]]}],
    note:'帳簿価額24,000＋廃棄費用500＝廃棄損24,500',
    exp:'廃棄（はいき）とは「完全に捨ててしまうこと」です。除却（Q149）と違って売れる部分がゼロです。帳簿価額（60,000－36,000＝24,000円）の分だけ損が出るうえに、廃棄するのにもお金（500円）がかかります。合計24,500円が「固定資産廃棄損（費用）」です。' ,
    exp_en:'Scrapping (廃棄) means disposing completely with zero resale value. Book value (¥24,000) is entirely lost, plus ¥500 for disposal costs. Total loss = ¥24,500 "Loss on Disposal of Fixed Assets" (expense).'
  },

  { id:151, level:2, cat:'固定資産',
    q:'ビル新築のため建設会社と請負契約（請負金額500,000円）を結び、手付金100,000円を小切手を振り出して支払った。仕訳を示せ。',
    q_en:'A construction contract (total ¥500,000) was signed for a new building, and a deposit of ¥100,000 was paid by check. Record the journal entry.',
    e:[{d:[['建設仮勘定',100000]], c:[['当座預金',100000]]}],
    exp:'建設仮勘定とは「まだ完成していない建物のために払ったお金を一時的に置いておく場所」です。完成する前に払う手付金は「建物（資産）」にはまだなれないので「建設仮勘定（資産）」という仮の場所に置きます。「仮（かり）」という字のとおり、完成したら「建物」に振り替えます。' ,
    exp_en:'"Construction in Progress" (建設仮勘定) is a temporary asset for payments toward an incomplete building. Since the building is not yet finished, the deposit cannot be classified as "Buildings" yet. It is parked in Construction in Progress until completion.'
  },

  { id:152, level:2, cat:'固定資産',
    q:'ビル工事（請負500,000円・手付金100,000円支払済み）が完成し引き渡しを受けた。残額400,000円は小切手を振り出して支払った。仕訳を示せ。',
    q_en:'The building construction (total ¥500,000, ¥100,000 deposit already paid) was completed and delivered. The remaining ¥400,000 was paid by check. Record the journal entry.',
    e:[{d:[['建物',500000]], c:[['建設仮勘定',100000],['当座預金',400000]]}],
    exp:'ついに建物が完成しました！今まで「建設仮勘定（仮の場所）」に置いておいた手付金100,000円と、今日払う残り400,000円を合わせた500,000円が「建物（資産）」になります。「仮置き場から本番の資産へ引っ越し」というイメージです。' ,
    exp_en:'Building completion moves the asset from the temporary "Construction in Progress" account to the permanent "Buildings" account. Total cost = ¥100,000 (prior deposit) + ¥400,000 (final payment) = ¥500,000. "Move from temporary to permanent asset."'
  },

  { id:153, level:2, cat:'固定資産',
    q:'建物の増築・改良（建物の価値や耐用年数が増す工事）を行い、50,000円を現金で支払った。仕訳を示せ。',
    q_en:'Building extensions and improvements (increasing value and useful life) were completed, with ¥50,000 paid in cash. Record the journal entry.',
    e:[{d:[['建物',50000]], c:[['現金',50000]]}],
    exp:'資本的支出とは「固定資産をより良くする投資」のことです。増築や大規模改良などで建物の価値や寿命が増えるなら、費用ではなく「建物（資産）の取得原価に上乗せ」します。その後、減価償却を通じて毎期少しずつ費用化されます。「価値が上がる → 資産に追加」と覚えましょう。' ,
    exp_en:'Capital expenditure: improvements that increase a fixed asset\'s value or useful life are added to the asset\'s cost (not expensed). The enhanced building will be depreciated over its new, longer life. "Value goes up → add to asset."'
  },

  { id:154, level:2, cat:'固定資産',
    q:'建物の現状維持のための修繕（壁の補修など）を行い、20,000円を現金で支払った。仕訳を示せ。',
    q_en:'Maintenance repairs to the building (restoring current condition only) were completed, with ¥20,000 paid in cash. Record the journal entry.',
    e:[{d:[['修繕費',20000]], c:[['現金',20000]]}],
    exp:'収益的支出とは「元の状態に戻すだけの修繕・補修」のことです。壁の塗り直しや軽微な補修は建物の価値を上げないので、全額「修繕費（費用）」として今すぐ計上します。「Q153と何が違う？」→「より良くなる（資本的支出）」か「元どおりにするだけ（収益的支出）」かの違いです。' ,
    exp_en:'Revenue expenditure: repairs that merely restore the asset to its original condition are expensed immediately as Repairs Expense. Compare with Q153: "improves" (add to asset) vs. "restores to original" (expense immediately).'
  },

  { id:155, level:2, cat:'固定資産',
    q:'建物（取得原価300,000円・期首減価償却累計額162,000円＝これまで費用化した合計・間接法）が火災により焼失した。仕訳を示せ。',
    q_en:'A building (cost ¥300,000, accumulated depreciation ¥162,000, indirect) was destroyed by fire. Record the journal entry.',
    e:[{d:[['建物減価償却累計額',162000],['火災損失',138000]], c:[['建物',300000]]}],
    note:'帳簿価額 = 取得原価 − 減価償却累計額',
    exp:'火災で建物が焼失した場合、帳簿から消去します。300,000円の建物のうち減価償却した162,000円（減価償却累計額）は差し引き済みなので、残り138,000円が「まだ価値があったのに燃えてしまった損」です。これが「火災損失（費用）」になります。保険に入っていない場合、全額損失です。' ,
    exp_en:'When a building is destroyed by fire, it is removed from the books. The accumulated depreciation (¥162,000) is also removed; the remaining book value (¥138,000) is "Fire Loss" (expense). With no insurance, the full book value is lost.'
  },

  { id:156, level:2, cat:'固定資産',
    q:'建物（取得原価300,000円・期首減価償却累計額162,000円＝これまで費用化した合計・間接法）が火災により焼失した。この建物には200,000円の火災保険がかかっており、ただちに保険会社に連絡した。仕訳を示せ。',
    q_en:'A building (cost ¥300,000, accumulated depreciation ¥162,000, indirect) was destroyed by fire. The building was insured for ¥200,000 and the insurer was immediately notified. Record the journal entry.',
    e:[{d:[['建物減価償却累計額',162000],['未決算',138000]], c:[['建物',300000]]}],
    note:'保険金確定まで帳簿価額138,000を未決算に置く',
    exp:'保険に入っている場合、「保険金がいくらもらえるかまだわからない」段階では損失と確定できません。そこで帳簿価額138,000円を「未決算（資産）」という仮置き場に置きます。後で保険金200,000円が確定すれば：①138,000円以内なら「差額を火災損失」、②138,000円より多ければ「差額を保険差益（収益）」として処理します。' ,
    exp_en:'With insurance, the final settlement amount is unknown at the time of fire. The book value (¥138,000) is parked in "Pending" (未決算, a temporary asset) rather than recognized as a loss immediately. Once the settlement is confirmed: if proceeds ≥ book value → "Insurance Proceeds Gain"; if proceeds < book value → "Fire Loss" for the shortfall.'
  },

  // ===== 3級 穴埋め問題 =====
  { id:157, level:3, cat:'基本用語',
    q:'仕訳のルールについて（　）に当てはまる言葉を答えよ。現金が増えたとき→【①借方・貸方】どちらに記入するか。買掛金が増えたとき→【②借方・貸方】。仕入が発生したとき→【③借方・貸方】。売上が発生したとき→【④借方・貸方】。貸倒引当金が増えたとき→【⑤借方・貸方】。',
    q_en:'Fill in the blanks about journal entry rules. When cash increases → record on which side [①debit/credit]? When AP increases → [②]? When purchases arise → [③]? When sales arise → [④]? When allowance for doubtful accounts increases → [⑤]?',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>借方（左）← 資産の増加</td></tr><tr><td class="hl">②</td><td>貸方（右）← 負債の増加</td></tr><tr><td class="hl">③</td><td>借方（左）← 費用の発生</td></tr><tr><td class="hl">④</td><td>貸方（右）← 収益の発生</td></tr><tr><td class="hl">⑤</td><td>貸方（右）← 評価勘定（負債的性質）</td></tr></tbody></table><div class="formula-box">資産・費用 → 増加は借方（左）　　負債・純資産・収益・貸倒引当金 → 増加は貸方（右）</div>`,
    exp:'借方・貸方のルールは勘定の種類で決まります。資産と費用は増えたら左（借方）、負債・純資産・収益は増えたら右（貸方）です。貸倒引当金は資産のマイナス（評価勘定）なので、増えると右（貸方）に記録します。' ,
    exp_en:'Debit/credit rules follow the account category. Assets and expenses: increase on the debit (left) side. Liabilities, equity, and revenues: increase on the credit (right) side. Allowance for doubtful accounts is a contra-asset (negative asset), so it increases on the credit side.'
,
    note:'費用の仕訳：\n費用発生 → 借方に費用科目\n費用の支払 → 貸方に現金/当座預金',
    steps:[
      {label:'①現金が増えたとき', hint:'現金は資産グループ。資産が増えたときの記入側は？', ans:'借方', choices:['借方','貸方','どちらでも','記入しない']},
      {label:'②買掛金が増えたとき', hint:'買掛金は負債グループ。負債が増えたときの記入側は？', ans:'貸方', choices:['貸方','借方','どちらでも','記入しない']},
      {label:'③仕入が発生したとき', hint:'仕入は費用グループ。費用が発生したときの記入側は？', ans:'借方', choices:['借方','貸方','どちらでも','記入しない']},
      {label:'④売上が発生したとき', hint:'売上は収益グループ。収益が発生したときの記入側は？', ans:'貸方', choices:['貸方','借方','どちらでも','記入しない']},
      {label:'⑤費用が増えたとき', hint:'費用が発生した時、どちら側に記入するか？', ans:'借方', choices:['借方','貸方','どちらでも','記入しない']}
    ]
  },

  { id:158, level:3, cat:'基本用語',
    q:'仕訳の基本について（　）に当てはまる言葉を答えよ。仕訳の左側を【①】といい、右側を【②】という。資産が増えたときは【③左/右】に書き、負債が増えたときは【④左/右】に書く。費用は増えたとき【⑤左/右】に書く。',
    q_en:'Fill in the blanks. The left side of a journal entry is called [①]. The right side is [②]. An asset increase is on the [③left/right]. A liability increase is on the [④left/right]. An expense is on the [⑤left/right].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>借方（かりかた）</td></tr><tr><td class="hl">②</td><td>貸方（かしかた）</td></tr><tr><td class="hl">③</td><td>左（借方）</td></tr><tr><td class="hl">④</td><td>右（貸方）</td></tr><tr><td class="hl">⑤</td><td>左（借方）</td></tr></tbody></table><div class="formula-box">資産・費用の増加 → 借方（左）　　負債・純資産・収益の増加 → 貸方（右）</div>`,
    exp:'「借方・貸方」は単なる「左・右」の名前です。資産と費用は増えたら左、負債・純資産・収益は増えたら右。逆向きなら反対側です。' ,
    exp_en:'"Debit" and "credit" are simply names for "left" and "right" in accounting. Assets and expenses increase on the left (debit); liabilities, equity, and revenues increase on the right (credit).',
    steps:[
      {label:'①仕訳の左側', hint:'英語のDebit（デビット）に対応。資産の増加・費用の発生は左（借方）に記入する。「借りた記録→借方」という語源。左＝資産・費用、右＝負債・純資産・収益と覚える', ans:'借方', choices:['借方','貸方','元帳','仕訳']},
      {label:'②仕訳の右側', hint:'英語のCredit（クレジット）に対応。負債の増加・収益の発生・純資産の増加は右（貸方）に記入する。「貸した記録→貸方」という語源。左右で金額が必ず一致する（貸借平均の原理）', ans:'貸方', choices:['貸方','借方','収益','費用']},
      {label:'③資産が増えた→', hint:'資産増加を記入する側', ans:'左（借方）', choices:['左（借方）','右（貸方）','どちらでも','上']},
      {label:'④負債が増えた→', hint:'負債増加を記入する側', ans:'右（貸方）', choices:['右（貸方）','左（借方）','どちらでも','上']},
      {label:'⑤費用が増えた→', hint:'費用グループの増加方向（左か右か）', ans:'左（借方）', choices:['左（借方）','右（貸方）','どちらでも','上']}
    ]
  },

  { id:159, level:3, cat:'消費税',
    q:'消費税の処理（税抜経理）について（　）に答えよ。文具（ノート類）を税込1,100円で仕入れたとき、本体1,000円は【①】（費用）、消費税100円は【②】（資産）として記録する。文具を税込2,200円で売り上げたとき、本体2,000円は【③】（収益）、消費税200円は【④】（負債）として記録する。決算で両者を相殺した差額（1,100円）が【⑤】（負債）になる。',
    q_en:'About tax-exclusive consumption tax: purchased goods at ¥1,100 tax-inclusive; base ¥1,000 is [①___] (expense), tax ¥100 is [②___] (asset). Sold at ¥2,200; base ¥2,000 is [③___] (revenue), tax ¥200 is [④___] (liability). Year-end net difference (¥1,100) becomes [⑤___] (liability).',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>仕入</td></tr><tr><td class="hl">②</td><td>仮払消費税</td></tr><tr><td class="hl">③</td><td>売上</td></tr><tr><td class="hl">④</td><td>仮受消費税</td></tr><tr><td class="hl">⑤</td><td>未払消費税</td></tr></tbody></table><div class="formula-box">仕入時：仕入1,000・仮払消費税100 ／ 現金1,100　　売上時：現金2,200 ／ 売上2,000・仮受消費税200　　決算：仮受消費税1,100 ／ 未払消費税1,100（純額）</div>`,
    exp:'税抜経理では消費税を本体と分けて記録します。仕入時の消費税は「仮払消費税（資産）」、売上時は「仮受消費税（負債）」。決算で差し引きした差額だけ「未払消費税（負債）」として国に納めます。' ,
    exp_en:'Under the tax-exclusive method, consumption tax is recorded separately from the base price. Tax paid on purchases = "Prepaid Consumption Tax" (asset). Tax collected on sales = "Accrued Consumption Tax" (liability). At year-end, the net difference (collected minus paid) becomes "Consumption Tax Payable."',
    steps:[
      {label:'①仕入時の本体科目', hint:'税込1,100円を支払うと「仕入1,000円＋仮払消費税100円」の2科目で記帳（税抜方式）。「仮払」は一時的な資産で後で仮受消費税と相殺して納税額を確定する', ans:'仕入', choices:['仕入','仮払消費税','買掛金','消耗品費']},
      {label:'②仕入時の消費税科目', hint:'仕入時の消費税100円の仕訳科目', ans:'仮払消費税', choices:['仮払消費税','仮受消費税','消費税','未払消費税']},
      {label:'③売上時の本体科目', hint:'税込2,200円のうち本体2,000円の仕訳科目', ans:'売上', choices:['売上','仮受消費税','売掛金','受取利息']},
      {label:'④売上時の消費税科目', hint:'売上時の消費税200円の仕訳科目', ans:'仮受消費税', choices:['仮受消費税','仮払消費税','消費税','未払消費税']}
    ]
  },

  { id:160, level:3, cat:'現金・預金',
    q:'現金・預金について（　）に答えよ。簿記上の現金には通貨だけでなく、他店振出し【①】・郵便為替証書・配当金領収書なども含まれ、これらを【②現金】という。会社が銀行と契約し、小切手で引き出せる預金口座を【③預金】という。',
    q_en:'About cash and deposits: bookkeeping "cash" includes not only currency but also checks drawn by others [①___], postal money orders, and dividend receipts — collectively called [②___ cash]. A check-based bank account is called [③___ deposit].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>小切手</td></tr><tr><td class="hl">②</td><td>通貨代用証券（現金）</td></tr><tr><td class="hl">③</td><td>当座預金</td></tr></tbody></table><div class="formula-box">通貨代用証券：他店振出小切手・郵便為替・配当金領収書 → 受け取ったらすぐ「現金」に計上</div>`,
    exp:'「現金」には実際のお金だけでなく、すぐに換金できる証書類も含みます。他店の小切手は受け取った時点で現金扱いです。' ,
    exp_en:'In bookkeeping, "cash" includes not just coins and bills but also instruments convertible to cash immediately — called "currency equivalents." A check drawn by another company is treated as cash from the moment it is received.',
    steps:[
      {label:'①簿記上の現金に含まれる証書', hint:'他社が振り出した小切手は銀行で即座に現金化できるため「現金」に含める（通貨代用証券）。自社が振り出した小切手は当座預金の減少。手形は現金ではなく受取手形（資産）として別処理', ans:'小切手', choices:['小切手','紙幣','手形','商品券']},
      {label:'②通貨と同様に使える証書の総称', hint:'現金以外で即座に換金できる証書類', ans:'通貨代用証券', choices:['通貨代用証券','有価証券','手形','電子マネー']},
      {label:'③小切手で引き出せる預金口座', hint:'銀行と契約する専用口座の種類', ans:'当座', choices:['当座','普通','定期','外貨']}
    ]
  },

  { id:161, level:3, cat:'経過勘定',
    q:'経過勘定の4種類について（　）に答えよ。当期分の費用をまだ払っていない→【①費用】（負債）。当期分の費用をすでに払いすぎた→【②費用】（資産）。当期分の収益をまだ受け取っていない→【③収益】（資産）。当期分の収益をすでに受け取りすぎた→【④収益】（負債）。',
    q_en:'About the four accrual/deferral accounts: current-period expense not yet paid → [①___ expense] (liability). Already paid in advance → [②___ expense] (asset). Current revenue not yet received → [③___ revenue] (asset). Already received in advance → [④___ revenue] (liability).',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>未払費用</td></tr><tr><td class="hl">②</td><td>前払費用</td></tr><tr><td class="hl">③</td><td>未収収益</td></tr><tr><td class="hl">④</td><td>前受収益</td></tr></tbody></table><div class="formula-box">「未」→ まだ払っていない/受け取っていない　　「前」→ 先に払いすぎ/受け取りすぎ</div>`,
    exp:'経過勘定は「時期のズレ」を記録するための科目です。「未」は「まだしていない」、「前」は「先にやりすぎた」と覚えましょう。費用か収益か×未か前か＝4パターンです。' ,
    exp_en:'Accrual/deferral accounts record "timing differences." "未 (mi, not yet)" = not yet paid or received. "前 (mae, advance)" = already paid in advance or already received in advance. Four combinations: expense × (not yet / advance) and revenue × (not yet / advance).',
    steps:[
      {label:'①当期分まだ払っていない費用', hint:'9月30日時点で9月分給料30万円が翌月払い→「未払費用30万円（負債）」を計上。翌期に支払時に負債を消去。発生主義の典型例で、現金支払より先に費用を認識する', ans:'未払費用', choices:['未払費用','前払費用','未収収益','前受収益']},
      {label:'②当期分払いすぎた費用', hint:'翌期分まで先払いした費用（資産）', ans:'前払費用', choices:['前払費用','未払費用','未収収益','前受収益']},
      {label:'③当期分まだ受取っていない収益', hint:'収益が発生したが現金未収（資産）', ans:'未収収益', choices:['未収収益','前受収益','未払費用','前払費用']},
      {label:'④当期分受け取りすぎた収益', hint:'翌期分まで先受けした収益（負債）', ans:'前受収益', choices:['前受収益','未収収益','未払費用','前払費用']}
    ]
  },

  { id:162, level:3, cat:'減価償却',
    q:'減価償却について（　）に答えよ。固定資産の価値が毎年減っていく分を費用として計上することを【①】という。毎期同じ金額を費用にする方法を【②法】、帳簿価額に一定率をかける方法を【③法】という。帳簿価額から直接差し引く記帳法を【④接法】、累計額勘定を使う方法を【⑤接法】という。',
    q_en:'About depreciation: recording the annual decrease in fixed asset value as expense is called [①___]. Equal annual charges = [②___ method]. Fixed rate on book value = [③___ method]. Direct reduction of asset balance = [④ direct/indirect method]. Using an accumulated depreciation account = [⑤ direct/indirect method].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>減価償却</td></tr><tr><td class="hl">②</td><td>定額法</td></tr><tr><td class="hl">③</td><td>定率法</td></tr><tr><td class="hl">④</td><td>直接法</td></tr><tr><td class="hl">⑤</td><td>間接法</td></tr></tbody></table><div class="formula-box">定額法：（取得原価－残存価額）÷耐用年数　　間接法：「減価償却累計額」勘定を使う</div>`,
    exp:'建物や車は使うほど価値が減ります。その減少分を毎年「費用（減価償却費）」に計上するのが減価償却です。3級では定額法・直接法が中心です。' ,
    exp_en:'Buildings and vehicles lose value over time. Depreciation allocates this cost as an annual expense. The straight-line method charges equal amounts each year; the declining balance method charges larger amounts early. For Level 3, focus on the straight-line method and the direct recording method.',
    steps:[
      {label:'①固定資産の価値減少費用', hint:'PC200万円・耐用年数5年→毎年40万円を費用化（定額法）。使用期間に費用を配分する考え方。現金は購入時に出ているが費用は毎期に分割計上される非現金費用の代表例', ans:'減価償却', choices:['減価償却','売上原価','引当金繰入','評価損']},
      {label:'②毎期同額を費用にする方法', hint:'取得原価÷耐用年数で毎期同額', ans:'定額法', choices:['定額法','定率法','生産高比例法','最終仕入原価法']},
      {label:'③帳簿価額×率をかける方法', hint:'残存価値に一定率をかけて計算', ans:'定率法', choices:['定率法','定額法','生産高比例法','償却原価法']},
      {label:'④固定資産を直接減額する方法', hint:'減価償却累計額を使わず直接貸方記入', ans:'直接法', choices:['直接法','間接法','総額法','純額法']},
      {label:'⑤減価償却累計額を使う方法', hint:'資産を直接減らさず累計額勘定で処理', ans:'間接法', choices:['間接法','直接法','総額法','純額法']}
    ]
  },

  { id:163, level:3, cat:'貸倒引当金',
    q:'貸倒引当金について（　）に答えよ。売掛金などが将来回収できないリスクに備えて、あらかじめ見積もって計上する勘定を【①】という。この設定時に使う費用科目を【②繰入】という。実際に貸し倒れたとき、引当金の範囲内なら【③】を取り崩し、引当金を超えた分は【④損失】として費用計上する。',
    q_en:'About allowance for doubtful accounts: the account set up in advance to cover uncollectible risk is [①___]. The expense used when setting it up is [②___ Provision]. When a bad debt occurs within the allowance, [③] is reduced; any excess is charged to [④___ Loss].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>貸倒引当金</td></tr><tr><td class="hl">②</td><td>貸倒引当金繰入</td></tr><tr><td class="hl">③</td><td>貸倒引当金（を取り崩す）</td></tr><tr><td class="hl">④</td><td>貸倒損失</td></tr></tbody></table><div class="formula-box">引当金設定：貸倒引当金繰入（費用）／貸倒引当金　　貸倒時：貸倒引当金／売掛金（引当金の範囲内）</div>`,
    exp:'貸倒引当金は「いつか回収できないかも」という不安を前もって費用にしておく仕組みです。実際に貸し倒れたとき、引当金があれば費用にせず引当金を取り崩すだけです。' ,
    exp_en:'An allowance for doubtful accounts is a pre-emptive reserve for expected future losses on receivables. Recording the expense now smooths the P/L impact. When an actual bad debt occurs, the allowance absorbs it — no new expense if within the reserve.',
    steps:[
      {label:'①期末に設定する引当金勘定', hint:'売掛金1,000万円の2%（20万円）が回収不能と見込んで決算で引当金設定。実際の貸し倒れより前に損失を計上する保守主義の原則。実際に貸し倒れたら引当金と相殺して取り崩す', ans:'貸倒引当金', choices:['貸倒引当金','貸倒損失','貸倒引当金繰入','売掛金']},
      {label:'②引当金を費用計上する科目', hint:'期末に引当金を設定するときの費用科目', ans:'貸倒引当金繰入', choices:['貸倒引当金繰入','貸倒引当金','貸倒損失','営業外費用']},
      {label:'③貸倒発生時に取り崩す勘定', hint:'実際に貸し倒れたとき引当金を充当', ans:'貸倒引当金', choices:['貸倒引当金','貸倒損失','貸倒引当金繰入','売掛金']},
      {label:'④引当金不足時に計上する損失', hint:'引当金で不足する部分を損失として計上', ans:'貸倒損失', choices:['貸倒損失','貸倒引当金','売上原価','雑損失']}
    ]
  },

  { id:164, level:3, cat:'損益計算書',
    q:'損益計算書（P/L）の構造について（　）に答えよ。売上高（例：りんご20個×@100円＝2,000円）から【①】（仕入れた原価）を引いた粗利益を【②益】という。そこから販売費・一般管理費（給料など）を引いた最終利益を【③益】という。売上原価は「期首商品＋【④高】－期末商品」で求める。精算表では【⑤】と【⑥】の2本仕訳で処理する。',
    q_en:'About the income statement (P/L) structure: sales minus [①___] equals [②___ profit]. Deducting selling and admin expenses gives [③ net ___]. COGS = opening inventory + [④ current-period ___] − ending inventory. In a worksheet, this is expressed by two entries called [⑤___] and [⑥___].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>売上原価</td></tr><tr><td class="hl">②</td><td>売上総利益（粗利益）</td></tr><tr><td class="hl">③</td><td>当期純利益</td></tr><tr><td class="hl">④</td><td>当期商品仕入高</td></tr><tr><td class="hl">⑤</td><td>しくり（仕入 ／ 繰越商品）</td></tr><tr><td class="hl">⑥</td><td>くりしわ（繰越商品 ／ 仕入）</td></tr><tr><td colspan="2">⑤⑥合わせて「しくりくりし」と覚える</td></tr></tbody></table><div class="formula-box">売上総利益＝売上高－売上原価　　当期純利益＝売上総利益－販管費　　売上原価＝期首商品＋当期仕入－期末商品</div>`,
    exp:'損益計算書は「今期の儲けと出費のまとめ表」です。売上から商品仕入コスト（売上原価）を引いた粗利益、そこから給料・家賃などを引いた最終利益という2段階の計算構造を理解しましょう。精算表では「しくりくりし」という2本の修正記入で売上原価を計算します。' ,
    exp_en:'An income statement has a two-level profit calculation: gross profit (sales − COGS) and net income (gross profit − operating expenses). The "shikuri-kurishiwa" technique in a worksheet computes COGS using two adjusting entries.',
    steps:[
      {label:'①売上高から引く主要費用', hint:'「期首在庫100＋仕入500−期末在庫130＝売上原価470」。売れた分の原価のみを費用化し、売れ残り（期末在庫）は翌期に繰り越す。仕入≠売上原価の点が重要', ans:'売上原価', choices:['売上原価','販管費','営業外費用','製造原価']},
      {label:'②売上高 − 売上原価', hint:'商品を売った最初の利益', ans:'売上総利益', choices:['売上総利益','営業利益','経常利益','当期純利益']},
      {label:'③販管費を引いた最終利益', hint:'3級P/L：売上総利益から販管費を引いた最終的な利益', ans:'当期純利益', choices:['当期純利益','営業利益','経常利益','売上総利益']},
      {label:'④商品の購入代金', hint:'損益計算書の売上原価を構成する主要項目', ans:'仕入高', choices:['仕入高','売上原価','購入費','商品代金']}
    ]
  },

  { id:165, level:3, cat:'手形',
    q:'手形について（　）に答えよ。電子部品を仕入れて代金に手形を振り出した場合は【①手形】（負債）が発生する。商品（Tシャツなど）を売り上げて手形を受け取った場合は【②手形】（資産）が発生する。保有する受取手形を仕入代金の支払いに充てることを【③渡し】という。受取手形を期日前に銀行で換金することを手形【④き】という。このとき銀行に支払う費用を【⑤損】という。',
    q_en:'About promissory notes: issuing a note for purchases creates [①___ note] (liability). Receiving a note for sales creates [②___ note] (asset). Using a held note to pay a supplier is [③___ endorsement transfer]. Converting a note to cash before due date at a bank is [④ note ___]. The fee paid is called [⑤___ loss].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>支払手形</td></tr><tr><td class="hl">②</td><td>受取手形</td></tr><tr><td class="hl">③</td><td>裏書き譲渡し</td></tr><tr><td class="hl">④</td><td>割引き</td></tr><tr><td class="hl">⑤</td><td>手形売却損</td></tr></tbody></table><div class="formula-box">裏書き譲渡：受取手形 → 仕入代金に充当（現金不要）　　手形割引：受取手形を銀行に売却し手数料（手形売却損）を差し引いた現金を受取</div>`,
    exp:'手形は「将来の確実な支払約束書」です。振り出せば支払手形（借金）、受け取れば受取手形（資産）になります。受取手形は「裏書き（別の支払いに使う）」か「銀行で割り引いて（期日前に現金化）」かで有効活用できます。' ,
    exp_en:'A promissory note is "a written promise to pay on a specific future date." Issuing one creates Notes Payable (liability); receiving one creates Notes Receivable (asset). Notes receivable can be "recycled" by endorsement (pay another supplier) or "cashed" by discounting (sell to a bank before due date, for a fee).',
    steps:[
      {label:'①振り出した約束手形', hint:'約束手形を振り出した側は満期日に支払う義務（負債）が発生→貸方に「支払手形」。受け取った側は「受取手形（資産）」。手形は信用取引の道具で、不渡り（不払い）は事実上の倒産', ans:'支払手形', choices:['支払手形','受取手形','当座預金','買掛金']},
      {label:'②受け取った約束手形', hint:'手形を受け取って集金待ちの勘定', ans:'受取手形', choices:['受取手形','支払手形','売掛金','約束手形']},
      {label:'③他者への手形譲渡', hint:'受取手形を他の人への支払いに使うこと', ans:'裏書', choices:['裏書','割引','振出','書換']},
      {label:'④銀行での手形現金化', hint:'期日前に銀行で受取手形を現金化', ans:'割引', choices:['割引','裏書','振出','換金']}
    ]
  },

  { id:166, level:3, cat:'基本用語',
    q:'会計の基礎について（　）に答えよ。企業の活動を区切るための1年間の期間を【①期間】という。収益・費用を現金のやり取りではなく取引が起きた時点で記録するルールを【②主義】という。これに対し現金を受け取った・払った時点で記録するルールを【③主義】という。貸借対照表は【④日】の財産状態を、損益計算書は【⑤間】の損益を表す。',
    q_en:'About accounting fundamentals: the one-year business period is called the [①___ period]. Recording when earned/incurred (not when cash moves) is [②___ basis]. Recording when cash moves is [③___ basis]. A balance sheet shows the position as of [④ specific ___]; an income statement covers [⑤___ period].',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>会計期間</td></tr><tr><td class="hl">②</td><td>発生主義</td></tr><tr><td class="hl">③</td><td>現金主義</td></tr><tr><td class="hl">④</td><td>決算日（特定の日付）</td></tr><tr><td class="hl">⑤</td><td>会計期間（1年間）</td></tr></tbody></table><div class="formula-box">発生主義：現金の動きに関係なく、経済的事実が起きた時点で記録する　　B/S：ある時点の「残高写真」　P/L：一定期間の「成績表」</div>`,
    exp:'簿記では「お金が動いてから記録する（現金主義）」ではなく「取引が起きた時点で記録する（発生主義）」が原則です。貸借対照表はある日の財産の「静止画」、損益計算書は1年間の損益の「動画（記録）」と覚えましょう。' ,
    exp_en:'The accrual basis records economic events when they occur, not when cash moves. This is the foundation of modern accounting. A balance sheet is a "snapshot" of financial position at a specific moment; an income statement is a "recording" of performance over a period of time.',
    steps:[
      {label:'①会計の1年間の期間', hint:'通常1年間（例：4月1日〜3月31日）。この期間の損益をP/Lで、期末1日時点の財産状況をB/Sで示す。複数期間の比較で業績トレンドを分析できる', ans:'会計期間', choices:['会計期間','営業年度','決算期間','事業期間']},
      {label:'②取引発生時点で費用・収益を認識', hint:'現金の収支に関わらず認識する基準', ans:'発生主義', choices:['発生主義','現金主義','実現主義','取得原価主義']},
      {label:'③現金収支があったとき認識', hint:'現金が動いたときだけ認識する基準', ans:'現金主義', choices:['現金主義','発生主義','実現主義','時価主義']},
      {label:'④B/Sが表す特定時点', hint:'貸借対照表はある一日（期末）の財産状態を表す', ans:'決算日', choices:['決算日','会計期間','期首日','事業年度']},
      {label:'⑤P/Lが表す期間', hint:'損益計算書は1年間の収益・費用・利益の成績を表す', ans:'会計期間', choices:['会計期間','決算日','営業日','期末日']}
    ]
  },
  {

    q:'文具店の期末棚卸結果（ノート）：\n帳簿棚卸数量（帳簿に記録しているノートの数）：200冊\n実地棚卸数量（実際に倉庫で数えた数）：180冊（20冊 行方不明）\n帳簿単価（ノート1冊あたりの原価）：1,000円\n棚卸減耗損（在庫不足の損失）の仕訳を示せ。',

  {

    cat:'棚卸資産',
    q:'食料品店の期末棚卸結果（缶詰）：\n帳簿数量（帳簿に記録している缶詰の数）：200缶\n実地数量（実際に倉庫で数えた数）：180缶（20缶 不明）\n帳簿単価（缶詰1缶の原価）：1,000円\n正味売却価額（今の市場で売れる見込み価格）：800円（値下がり！）\n棚卸減耗損（在庫不足）と商品評価損（値下がり）を同時に計上する仕訳を示せ。',
    q_en:'Year-end: book qty 200, physical qty 180, book cost @¥1,000, NRV @¥800. Record shrinkage loss and write-down together.',

    exp:'①棚卸減耗損＝（200－180）×1,000＝20,000円　②商品評価損＝（1,000－800）×180（実地数量！）＝36,000円　合計56,000円を繰越商品から控除。棚卸減耗損は「数が足りない」、商品評価損は「価値が低い」という2種類の損失。どちらも繰越商品（資産）を減らします。',
    exp_en:'①Shrinkage = (200−180)×¥1,000 = ¥20,000 ②Write-down = (¥1,000−¥800)×180 units (physical count!) = ¥36,000. Total ¥56,000 deducted from Merchandise. Shrinkage = quantity gap; write-down = value gap.',
    note:'減耗損=(帳簿-実地)×帳簿単価 / 評価損=(帳簿単価-NRV)×実地数量'
  },
  {
    id:170,
    level:2,
    cat:'棚卸資産',
    q:'（穴埋め）\n━━ 低価法とは ━━\n期末商品を「原価 vs 正味売却価額（NRV）」のうち低い方で評価するルール。\n値下がりしたら損失を早めに認識する（保守主義）。値上がりしても評価益は計上しない。\n━━━━━━━━━━\n\n例）取得原価：500円、見積売価：600円、見積追加原価：80円、見積販売費：70円\n\n① NRVの計算\n   正味売却価額（NRV）＝ 600 − 80 − 70 ＝ 【①】円\n\n② 低価法による評価額\n   min（取得原価, NRV）＝ min（500, 【①】）＝ 【②】円\n\n③ 商品評価損\n   評価損 ＝ 500 − 【②】 ＝ 【③】円',
    q_en:'(Fill in) Under the lower-of-cost-or-NRV rule, year-end inventory is valued at the lower of [①___] or [②___]. ② equals the estimated selling price [③___] estimated additional costs and selling costs.',
    a:'① 450　② 450　③ 50\n\n【計算過程】\nNRV ＝ 600 − 80 − 70 ＝ 450円\n低価法評価額 ＝ min（500, 450）＝ 450円\n評価損 ＝ 500 − 450 ＝ 50円\n\n▶ ポイント：値下がりは評価損を計上するが、値上がりしても評価益は計上しない（保守主義）',
    exp:'低価法（Lower of Cost or NRV）は「原価と市場価値のうち低い方」で在庫評価する方法です。時価が原価を下回った場合、将来損失が確実なので今期に評価損を計上します（保守主義の原則）。日本基準では2008年改正後、低価法が強制適用されています。',
    exp_en:'The lower-of-cost-or-NRV method values inventory at whichever is lower: original cost or NRV. When market value falls below cost, the future loss is certain, so we recognize it now (conservatism principle). In Japanese GAAP, LCM became mandatory after the 2008 revision.',
    steps:[
      {label:'①正味売却価額（NRV）', hint:'見積売価 − 見積追加原価 − 見積販売費 = 600−80−70', ans:450, unit:'円', choices:[450,500,600,400]},
      {label:'②低価法の評価額', hint:'min（取得原価500, NRV450）→ 低い方を選ぶ', ans:450, unit:'円', choices:[450,500,420,480]},
      {label:'③商品評価損', hint:'取得原価 − 低価法評価額 = 500 − 450', ans:50, unit:'円', choices:[50,100,150,80]}
    ]
  },
  {

    ]

  {
    id:172,
    level:2,
    cat:'棚卸資産',
    q:'みかんを移動平均法で管理している食料品店。\n現在の在庫：みかん100個（@200円、合計20,000円）があるとき、\n新たに みかん100個を@240円（合計24,000円）で仕入れた。\n仕入れ後の移動平均単価はいくらか。',
    q_en:'Moving average: Current stock 100 units @¥200 (¥20,000). Purchase 100 more units @¥240 (¥24,000). What is the new moving average unit cost?',
    ans_html:`<div class="tbl-sec">答え：@220円</div><div class="formula-box">移動平均単価＝（旧在庫金額＋新仕入金額）÷（旧数量＋新数量）<br>＝（20,000＋24,000）÷（100＋100）<br>＝44,000÷200＝@220円</div>`,

    ]

  {
    id:173,
    level:2,
    cat:'棚卸資産',
    q:'（穴埋め）\n━━ 棚卸減耗損の表示区分とは ━━\n「なぜ在庫が減ったか」によって、損益計算書上の表示場所が変わる。\n正常な減耗は営業コストの一部（原価性あり）、異常な減耗は別表示（原価性なし）。\n━━━━━━━━━━\n\n① 原価性あり（通常範囲内の減耗）\n   例：倉庫内の自然蒸発・乾燥による微量の減耗\n   → 【②】に含める\n\n③ 原価性なし（異常な減耗・盗難等）\n   例：洪水・火災・盗難による大量消失\n   → 【④】に表示する',
    q_en:'(Fill in) Inventory shrinkage loss classification depends on cost nature: [①with cost nature (normal range)] → included in [②___]; [③without cost nature (abnormal/theft)] → shown under [④___].',
    a:'② 売上原価（売上原価の内訳）\n④ 販売費及び一般管理費（または特別損失）\n\n【まとめ】\n原価性あり → 売上原価\n原価性なし → 販管費 or 特別損失\n（試験では問題の指示に従う）\n\n▶ ポイント：「なぜなくなったか」がポイント。正常なら原価に含め、異常（盗難・災害）なら別表示',
    exp:'棚卸減耗損の表示は「その損失が正常な営業活動のコストか否か」で変わります。例えば倉庫内での通常の蒸発・乾燥による減耗は原価性ありで売上原価。一方、洪水や火災・盗難による異常な減耗は原価性なしで特別損失に計上します。',
    exp_en:'Shrinkage classification depends on whether the loss is a normal cost of operations. Normal evaporation or drying in a warehouse = cost nature → Cost of Goods Sold. Flood, fire, or theft = no cost nature → Special Loss. Follow exam instructions.',

      {label:'④原価性なし（異常）の表示', hint:'盗難・災害など異常な減耗の表示先', ans:'販管費（特別損失）', choices:['販管費（特別損失）','売上原価','営業外費用','当期純損失']}

  {
    id:174,
    level:2,

    q:'文具店（ノート販売）の決算整理仕訳（売上原価の算定）：\n期首繰越商品（ノートの期首在庫）：30,000円\n期末帳簿数量（帳簿に記録しているノートの数）：110冊\n実地数量（実際に倉庫で数えたノートの数）：100冊（10冊 不明）\n帳簿単価（ノート1冊の原価）：600円\n正味売却価額（今の市場でノートが売れる見込み価格）：550円（値下がり！）\n（棚卸減耗損・商品評価損は原価性なし＝売上原価に含めない）',
    q_en:'Record COGS entries: opening merchandise ¥30,000, book qty 110, physical qty 100, book cost @¥600, NRV @¥550. (Shrinkage and write-down have no cost nature.)',

    exp_en:'①Transfer opening stock to Purchases (¥30,000) ②Set closing stock at cost (100×¥600=¥60,000) ③Shrinkage=(110-100)×¥600=¥6,000 ④Write-down=(¥600-¥550)×100=¥5,000. No cost nature → excluded from COGS. Final Merchandise = ¥49,000.',

  {
    id:175,
    level:2,

    q:'（穴埋め）\n━━ 売価還元法とは ━━\nスーパー・百貨店が何万品種もの商品を一括管理する方法。\n「売価合計 × 原価率」で期末在庫の原価を逆算する。\n━━━━━━━━━━\n\n例）期首：原価200,000円 ／ 売価250,000円\n    仕入：原価600,000円 ／ 売価750,000円\n    期末棚卸（売価）：200,000円\n\n① 原価合計\n   200,000 ＋ 600,000 ＝ 【①】円\n\n② 売価合計\n   250,000 ＋ 750,000 ＝ 【②】円\n\n③ 原価率\n   【①】 ÷ 【②】 × 100 ＝ 【③】%\n\n④ 期末棚卸原価\n   200,000 × 【③】% ＝ 【④】円',
    q_en:'(Fill in) The method that estimates cost by applying a cost ratio to total selling prices (used to manage many items collectively) is called the [①___ method]. The cost ratio is calculated as [②___].',
    a:'① 800,000　② 1,000,000　③ 80　④ 160,000\n\n【計算過程】\n原価合計 ＝ 200,000 ＋ 600,000 ＝ 800,000円\n売価合計 ＝ 250,000 ＋ 750,000 ＝ 1,000,000円\n原価率 ＝ 800,000 ÷ 1,000,000 × 100 ＝ 80%\n期末棚卸原価 ＝ 200,000 × 80% ＝ 160,000円\n\n▶ ポイント：仕入単価ではなく合計額（原価合計 ÷ 売価合計）で原価率を計算する',
    exp:'売価還元法はスーパーやデパートで活躍する方法。何万品種もある商品をいちいち原価管理するのは大変なので、売価ベースで管理して原価率を掛けて原価に換算します。「レジのデータだけで在庫原価がわかる」実務的な方法です。',
    exp_en:'The retail inventory method is used by supermarkets and department stores managing thousands of items. Instead of tracking each item\'s cost individually, they manage by selling price and multiply by a cost ratio to estimate cost. "Inventory cost from register data alone."',
    steps:[

      {label:'②売価合計', hint:'期首売価 ＋ 当期仕入売価 ＝ 250,000 ＋ 750,000', ans:1000000, unit:'円', choices:[1000000,900000,1100000,800000]},

    q:'（穴埋め）\n━━ 先入先出法（FIFO）の計算とは ━━\n古い仕入から順番に払い出したと仮定する方法。\nスーパーの棚のように、先に仕入れた商品が先に売れる。\n━━━━━━━━━━\n\n例）期首在庫：10個 @100円 ／ 当月仕入：20個 @120円 ／ 払出：15個\n\n① 払出の計算（古い仕入から順番に）\n   まず期首から：10個 × 【①】円 ＝ 【②】円\n   次に仕入から：5個 × 【③】円 ＝ 【④】円\n\n② 払出合計\n   【②】 ＋ 【④】 ＝ 【⑤】円\n\n③ 期末在庫（残り15個はすべて最新の仕入単価）\n   15個 × 【③】円 ＝ 【⑥】円',
    q_en:'(Fill in) Name three methods for calculating unit cost of merchandise issued. When year-end market value falls below cost, record a write-down under the [④___ method].',

    q:'（穴埋め）\n━━ 税効果の一時差異とは ━━\n会計と税務のルールの違いにより生じる、「今はズレているが将来解消する」差異のこと。\n将来税金が減るか増えるかで、繰延税金資産か繰延税金負債かが決まる。\n━━━━━━━━━━\n\n一時差異 ＝ 【①】と\n           【②】の差額\n\n例①：貸倒引当金（将来減算差異）\n   会計上費用→税務は今期損金NG→将来貸倒れで解消→課税所得減少\n   → 【③】差異 → 繰延税金資産（将来の節税権）\n\n例②：その他有価証券評価益（将来加算差異）\n   会計収益→税務は今期益金NG→将来売却で解消→課税所得増加\n   → 【④】差異 → 繰延税金負債',
    q_en:'(Fill in) A "temporary difference" in tax effect accounting is the difference between [①___] and [②___]. Differences that reduce taxable income when they reverse are [③___] differences; those that increase it are [④___] differences.',
    a:'① 会計上の資産・負債の帳簿価額\n② 税務上の資産・負債の金額（税務基準額）\n③ 将来減算（繰延税金資産）\n④ 将来加算（繰延税金負債）\n\n【まとめ】\n将来減算差異 → 繰延税金資産（将来の節税権）\n将来加算差異 → 繰延税金負債（将来の税金追加払い）\n\n▶ ポイント：「将来に税金が減るか増えるか」で判断。減る→資産、増える→負債',
    exp:'一時差異は「今期は会計と税務でずれているが、将来解消する差異」です。例：①貸倒引当金超過額（今期は費用・非損金→将来解消時に損金）→将来減算差異→繰延税金資産。②その他有価証券評価益（今期は収益・非益金→将来売却時に益金）→将来加算差異→繰延税金負債。',
    exp_en:'A temporary difference exists now between accounting and tax values, but reverses in the future. Example ①: Bad debt allowance excess (expensed now, deductible later) → deductible temporary difference → deferred tax asset. Example ②: Other securities gain (recognized now, taxed when sold) → taxable temporary difference → deferred tax liability.',
    steps:[
      {label:'①一時差異の定義①', hint:'帳簿価額の何が基準になるか', ans:'会計上の帳簿価額', choices:['会計上の帳簿価額','税務上の金額','公正価値','取得原価']},
      {label:'②一時差異の定義②', hint:'税務上の何と比較するか', ans:'税務上の金額', choices:['税務上の金額','会計上の帳簿価額','公正価値','償却後残高']},
      {label:'③課税所得を将来減少させる差異', hint:'繰延税金資産を生み出す一時差異', ans:'将来減算差異', choices:['将来減算差異','将来加算差異','永久差異','一時差異']},
      {label:'④課税所得を将来増加させる差異', hint:'繰延税金負債を生み出す一時差異', ans:'将来加算差異', choices:['将来加算差異','将来減算差異','永久差異','評価差額']}
    ]

  {

    level:2,
    cat:'税効果会計',
    q:'（穴埋め）\n━━ 永久差異とは ━━\n会計と税務の差が「永遠に解消しない」差異のこと。\n将来に課税関係が生じないので、繰延税金資産・負債の計上対象外。\n━━━━━━━━━━\n\n例①：接待交際費50万円\n   会計では費用 → 税務では永遠に損金不算入（将来も解消しない）\n\n例②：受取配当金（二重課税防止のため益金不算入）\n   会計では収益 → 税務では永遠に益金不算入\n\n永久差異には繰延税金資産・負債を計上【①】\n（将来に課税関係が生じないため）\n\n代表例：\n【②】（費用だが永遠に損金NG）\n【③】（収益だが永遠に益金NG）',
    q_en:'(Fill in) Tax effect accounting does [①___] deferred taxes for "permanent differences." Examples include [②___] (recognized as expense but never tax-deductible) and [③___] (recognized as income but never taxable).',
    a:'① しない（対象外）\n② 交際費の損金不算入額、罰金・課徴金\n③ 受取配当金の益金不算入額\n\n【まとめ】\n永久差異 → 繰延税金資産・負債なし（将来に課税効果がない）\n一時差異 → 繰延税金資産または負債あり（将来に課税効果がある）\n\n▶ ポイント：「将来解消するか？」が判断基準。永久に解消しないなら繰延税金は計上しない',
    exp:'永久差異は「会計と税務の差が永遠に解消しない」差異です。交際費の損金不算入（会計上費用、税務上は永遠に損金不算入）は永久差異。将来課税関係を生じないので繰延税金資産・負債を計上しません。一方、一時差異は「今はずれているが将来解消する」→繰延税金資産・負債の対象。',
    exp_en:'Permanent differences never reverse — they stay as accounting/tax gaps forever. Entertainment expense disallowance (expensed in accounting, permanently non-deductible) is a permanent difference. No deferred tax is recognized because there\'s no future tax impact. Temporary differences (gap reverses later) → recognize deferred taxes.',
    steps:[
      {label:'①永久差異の繰延税金計上', hint:'永久差異に繰延税金資産・負債を計上するか', ans:'しない', choices:['しない','する（資産）','する（負債）','条件による']},
      {label:'②永久差異の例（費用として損金不算入）', hint:'会計上費用だが税務上は永久に損金にならない例', ans:'交際費・罰金', choices:['交際費・罰金','受取配当金','減価償却費','貸倒引当金']},
      {label:'③永久差異の例（収益として益金不算入）', hint:'会計上収益だが税務上は永久に益金にならない例', ans:'受取配当金', choices:['受取配当金','交際費','罰金','売上割引']}
    ]

  {
    id:231,
    level:2,
    cat:'税効果会計',
    q:'（穴埋め）\n━━ 繰延税金資産の回収可能性とは ━━\n繰延税金資産は「将来の節税権」だが、将来に黒字がなければ節税できない「絵に描いた餅」。\n本当に使えるか（回収できるか）を判断しなければならない。\n━━━━━━━━━━\n\n例）毎期赤字が続く会社\n→ 将来の課税所得がないと予測\n→ 繰延税金資産は実際には使えない\n\n① 回収可能性とは\n   【①】どうかの判断\n\n② 回収可能性がないと判断された場合\n   【②】必要がある',
    q_en:'(Fill in) The recoverability of a deferred tax asset refers to whether [①___]. If not recoverable, it is necessary to [②___].',
    a:'① 将来十分な課税所得が発生し、繰延税金資産が実際に使える（税金が減額される）どうかの判断\n② 評価性引当額を設定し、繰延税金資産を減額（取り消し）する\n\n【まとめ】\n繰延税金資産を計上できる → 将来に課税所得が見込める場合のみ\n回収可能性がない → 評価性引当額を設定して繰延税金資産を減額\n\n▶ ポイント：赤字続きの会社は将来の課税所得がないので、繰延税金資産を減額（または計上しない）必要がある',
    exp:'繰延税金資産は「将来の節税権」ですが、将来に課税所得がなければ節税できません（黒字がなければ税金を減らせない）。そこで「回収可能性」の検討が必要：将来の課税所得見込みがなければ繰延税金資産を計上しないか、評価性引当額で減額します。「絵に描いた餅にならないか確認する」作業です。',
    exp_en:'A deferred tax asset is a "future tax savings right" — but only useful if there is future taxable income to offset. With no future profits, the deferred asset cannot be recovered. Hence: assess recoverability. If insufficient future income, reduce or eliminate the deferred tax asset with a valuation allowance. "Verify it\'s not just a paper benefit."',
    steps:[

      {label:'②回収可能性がない場合の処理', hint:'回収不能な繰延税金資産の処理', ans:'評価性引当額を設定', choices:['評価性引当額を設定','全額費用計上','繰延税金負債に変換','その他有価証券として処理']}

  {
    id:232,
    level:2,
    cat:'リース会計',
    q:'（穴埋め）\n━━ ファイナンス・リースの判定とは ━━\n形式上は「借りている」でも、実質的に「買ったのと同じ」と判断されると、\nリース資産・リース債務をB/Sに計上しなければならない（ファイナンス・リース）。\n━━━━━━━━━━\n\n判定要件（2つとも満たすとファイナンス・リース）：\n\n①【】\n   → リース期間中は途中解約できない（または巨額の違約金が生じる）\n   → 会社は全リース料を支払う義務あり（ローンと同じ拘束力）\n\n②【フ】\n   → 支払リース料の合計 ≒ 物件の購入価額（経済的価値のほぼ全額）\n\n①② 両方OK → ファイナンス・リース → B/S計上（実質購入扱い）\n①② どちらか欠ける → オペレーティング・リース → 費用処理のみ（賃貸借）',
    q_en:'(Fill in) State two conditions that classify a lease as a finance lease: ① [___] ② [___]',
    a:'① 解約不能：リース期間中に解約できない（または中途解約で多大な違約金が生じる）\n② フルペイアウト：リース物件の経済的価値のほぼすべてをリース料として支払う\n\n【判断基準まとめ】\n①② 両方満たす → ファイナンス・リース（資産・負債を計上）\nどちらかでも満たさない → オペレーティング・リース（費用処理）\n\n▶ ポイント：形式上は「借りている」でも実質が「購入と同じ」ならB/Sに載せる。実質優先の考え方',
    exp:'ファイナンス・リースは「実質的に資産を購入したのと同じ」と考えます。①解約不能（途中でやめられない）②フルペイアウト（支払総額≒購入価格）の2条件を満たす場合、リース物件を自社資産として計上し、リース債務を負債計上します。形式は賃貸借でも実質は購入なのです。',
    exp_en:'A finance lease is economically equivalent to purchasing an asset. Two conditions: ①Non-cancellable (or cancellation triggers significant penalties) ②Full payout (total lease payments ≈ fair value of the asset, i.e., lessee bears substantially all risks and rewards). If both met: record asset and liability. Even if legally a rental, economically it\'s a purchase.',
    steps:[

      {label:'②ファイナンスリース要件2', hint:'リース料総額が経済的価値のほぼ全額', ans:'フルペイアウト', choices:['フルペイアウト','解約不能','リスク移転','全額現金払い']}

    exp:'流動比率は「1年以内に支払う負債を1年以内に現金化できる資産で賄えるか」を示す安全性指標。200%以上が理想とされます。当座比率はより厳格で「すぐに現金化できる資産（当座資産）」のみで計算。棚卸資産は除外（換金に時間がかかるため）。100%以上が目安です。',

  {
    id:265,
    level:2,
    cat:'財務分析',
    q:'（穴埋め）\n━━ デュポン分析とは ━━\nROE（自己資本利益率）を3つの要因に分解して「どこを改善すればROEが上がるか」を分析する手法。\n「収益性×効率性×レバレッジ」の掛け算で分解できる。\n━━━━━━━━━━\n\n例）純利益：200万円 ／ 売上高：2,000万円 ／ 総資産：4,000万円 ／ 自己資本：1,000万円\n\n① 収益性（売上高純利益率）\n   200 ÷ 2,000 × 100 ＝ 【①】%\n\n② 効率性（総資産回転率）\n   2,000 ÷ 4,000 ＝ 【②】回\n\n③ レバレッジ（財務レバレッジ）\n   4,000 ÷ 1,000 ＝ 【③】倍\n\n④ ROE（デュポン式）\n   【①】% × 【②】 × 【③】 ＝ 【④】%',
    q_en:'(Fill in) In DuPont analysis, ROE is expressed as the product of three ratios: ROE = [①___] × [②___] × [③___].',
    a:'① 10　② 0.5　③ 4　④ 20\n\n【計算過程】\n売上高純利益率 ＝ 200 ÷ 2,000 × 100 ＝ 10%\n総資産回転率 ＝ 2,000 ÷ 4,000 ＝ 0.5回\n財務レバレッジ ＝ 4,000 ÷ 1,000 ＝ 4倍\nROE ＝ 10% × 0.5 × 4 ＝ 20%\n\n▶ ポイント：ROEを上げるには「①儲かる商品を作る」「②少ない資産で多く売る」「③借入を増やしてレバレッジをかける」の3つのアプローチがある',
    exp:'デュポン分析でROEを3因子に分解：①収益性（どれだけ稼ぐか）×②効率性（資産をどれだけ活用するか）×③レバレッジ（どれだけ借入で増幅するか）。「収益性が低くても、資産効率かレバレッジで補える」→ROEの改善策を特定するのに有用な分析ツールです。',
    exp_en:'DuPont analysis decomposes ROE into: ①Profitability (how much profit per yen of sales) × ②Efficiency (how much sales per yen of assets) × ③Leverage (how much assets per yen of equity). "Even with low margins, you can improve ROE through efficiency or leverage." Useful for identifying which lever to pull.',

    exp:'工業簿記の原価の流れを「料理の比喩」で覚えましょう。①材料（食材を買う）→②仕掛品（調理中）→③製品（料理完成）→④売上原価（お客様に出す）。この流れが工業簿記の骨格です。商業簿記では「商品→売上原価」の1ステップだけでしたが、工業簿記では製造プロセスを細かく追跡します。',

    exp:'移動平均法では仕入のたびに平均単価を計算し直します。（旧在庫金額＋新仕入金額）÷（旧数量＋新数量）＝@213.33円。この単価で消費・月末残高を計算します。先入先出法と比べ、単価の変動が緩やかで安定した原価計算ができます。実務では端数処理のルールに注意。',
    exp_en:'Moving average recalculates unit cost after each purchase. (¥20,000 + ¥44,000) ÷ (100 + 200) = ¥213.33/kg. Apply this rate to both consumption and closing balance. Compared to FIFO, moving average smooths out price fluctuations — useful when purchase prices vary frequently.',

    q_en:'(Fill in) When using a predetermined material price, the difference between (predetermined price × actual qty) and (actual price × actual qty) is called [①___]. If actual > predetermined (debit balance), it is a [②___] variance; if actual < predetermined (credit balance), it is a [③___] variance.',
    a:'① 材料消費価格差異\n② 不利（借方・超過）\n③ 有利（貸方・節約）\n\n【計算過程】\n材料消費価格差異 ＝ 予定消費価格 × 実際数量 − 実際消費価格 × 実際数量\n　　　　　　　 ＝ （予定単価 − 実際単価） × 実際消費量\n\n▶ ポイント：「予定より高く買った→不利差異（コスト超過）」「予定より安く買えた→有利差異（コスト節約）」',
    exp:'予定単価を使うことで材料費を素早く計算できますが、実際単価との差（材料消費価格差異）が生じます。「予定より高く買ってしまった→不利差異（追加コスト）」「予定より安く買えた→有利差異（コスト節約）」。月末に差異を原価差異勘定（or 売上原価）に振り替えます。',
    exp_en:'Using a predetermined price speeds up cost calculation, but creates a "material price variance" vs. actual. "Bought at higher price than expected → unfavorable (over budget)." "Got a better deal → favorable (under budget)." Transfer the variance to a variance account (or COGS) at month-end.',

    q:'（穴埋め）\n━━ 製造間接費配賦差異の2分法とは ━━\n配賦差異（予定配賦額と実際発生額のズレ）を2種類の原因に分解して分析する方法。\n「使い方の問題か」「稼働率の問題か」を切り分ける。\n━━━━━━━━━━\n\n配賦差異 ＝ 予定配賦額 − 実際発生額\n\n① 予算差異（コスト管理のズレ）\n   ＝ 【①】\n   マイナス（実際 ＞ 予算）→ 浪費（不利差異）\n   プラス → 節約（有利差異）\n\n② 操業度差異（設備稼働率のズレ）\n   ＝ 【②】\n   設備を目標より少なく動かした → 固定費の回収不足 → 不利差異',
    q_en:'(Fill in) Describe the two-variance method for overhead variance analysis. ①Budget variance = [___] ②Volume variance = [___].',

    q:'（穴埋め）\n━━ 総合原価計算とは ━━\n同じ製品を大量生産する場合に使う原価計算方法。\n1か月の総コストを生産量で割って単位原価を求める。\n━━━━━━━━━━\n\n例）飲料メーカーが1か月でコーラ10万本を大量生産\n→ 全て同一製品なので指図書別管理は不要、1か月の総コストを本数で割るだけ\n\n総合原価計算 ＝ 【①】生産に用いられる方法\n\n1か月の総製造費用を【②】で割って単位原価を計算\n\n個別原価計算との最大の違いは製造【③】の有無\n（個別は指図書あり、総合は指図書なし）',

  {
    id:318,
    level:2,
    cat:'総合原価計算',
    q:'（穴埋め）\n━━ 正常仕損 vs 異常仕損の処理とは ━━\n製造中の不合格品（仕損）が「想定内か想定外か」によって処理が変わる。\n度外視法では正常仕損を計算から除外し、自動的に良品に負担させる。\n━━━━━━━━━━\n\n例）100個製造 → 5個は製造上避けられない不合格（正常）、10個は設備故障で大量不合格（異常）\n\n① 正常仕損（5個：予定内の不合格品）\n   仕損費は【ア】として処理\n   （度外視法：仕損を無視して計算）\n   →「製品コストの一部として仕方ない」という考え方\n\n② 異常仕損（10個：予定外の大量不合格品）\n   仕損費は【イ】として処理\n   →「通常のコストではないため製品原価に含めない」',
    q_en:'(Fill in) ①Normal spoilage (unavoidable in normal production) costs are treated as [ア___] (using the neglect method). ②Abnormal spoilage costs are treated as [イ___].',
    a:'ア 完成品（と月末仕掛品）の製造原価の一部として吸収\nイ 非原価項目（異常仕損費）として損失計上\n\n【計算過程】\n正常仕損（度外視法）：仕損品を計算から除外 → 自動的に良品に負担させる\n異常仕損：製品原価に含めず → 「異常仕損費」として営業外費用・特別損失に計上\n\n▶ ポイント：「想定内の失敗は製品コストに含める（度外視）、想定外の失敗は別途損失計上」',
    exp:'度外視法は「仕損品を存在しないものとして計算する」シンプルな方法。正常仕損を度外視すると、完成品と月末仕掛品でその分のコストを自然に負担します。異常仕損（地震・機械故障など特別原因）は「正常な製造活動のコストではない」ため製品原価から除外し、「異常仕損費」として営業外費用・特別損失に計上。',
    exp_en:'The neglect method ignores normal spoilage in calculations — its cost is automatically absorbed by good output and closing WIP. Simple but less precise. Abnormal spoilage (caused by accidents, machine breakdowns) is NOT a product cost → separate as "Abnormal Spoilage Loss" (non-operating/special loss). "Normal waste is the cost of doing business; abnormal waste is a separate mishap."',
    steps:[

      {label:'イ　異常仕損費の処理方法', hint:'事故・機械故障など特別原因による仕損は製品原価に含めるか？', ans:'非原価項目に計上', choices:['非原価項目に計上','製品原価に算入','製造間接費として配賦','仕掛品に計上']}

    q:'（穴埋め）\n━━ 工程別総合原価計算とは ━━\n複数の工程を経て製品が完成する場合の原価計算方法。\n第1工程の完成品が第2工程の「原材料」となる。\n━━━━━━━━━━\n\n例）製紙工場：第1工程（パルプ製造）→ 第2工程（紙加工・仕上げ）\n\n第1工程完成品原価500,000円を第2工程に引き渡す\n→ 第2工程では第1工程の完成品原価を【①】として受け入れ\n→ さらに第2工程の材料費・加工費を加えて最終完成品原価を計算\n\n引き渡し時の仕訳：\n借方【②】\n貸方【③】',
    q_en:'(Fill in) Process-by-process costing: finished output from Process 1 is transferred to Process 2 as [①___]. Process 2 adds its own materials and conversion costs to calculate final product cost. Transfer entry: Dr. [②___] / Cr. [③___].',

    q:'（穴埋め）\n━━ 製造間接費差異の2分法とは ━━\n配賦差異（予定と実際のズレ）を「予算差異」と「操業度差異」の2種類に分けて分析する方法。\n「使い方の問題か」「稼働率の問題か」を切り分ける。\n━━━━━━━━━━\n\n製造間接費予算：変動費率300円/h・固定費予算120,000円/月・基準操業度400h/月\n当月実績：実際時間380h・標準時間370h・実際発生額234,000円\n\n① 予算差異（コスト管理のズレ）\n   予算許容額 ＝ 変動費@300 × 実際時間 ＋ 固定費予算\n             ＝ 300 × 380 ＋ 120,000 ＝ 【①】円\n   予算差異 ＝ 予算許容額 − 実際発生額 ＝ 【②】円\n\n② 操業度差異（設備稼働率のズレ）\n   固定費率 ＝ 120,000 ÷ 400h ＝ 【③】円/h\n   操業度差異 ＝ 固定費率 × （実際操業度 − 基準操業度）\n             ＝ 300 × （380 − 400）＝ 【④】円',
