function buildApxContent(){
  const freq = {};
  ALL.forEach(q => {
    if(!q.e) return;
    const seen = new Set();
    q.e.forEach(entry => {
      [...(entry.d||[]), ...(entry.c||[])].forEach(([name]) => seen.add(name));
    });
    seen.forEach(name => { freq[name] = (freq[name]||0) + 1; });
  });

  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name] || 'other';
    byType[type].push({ name, en, note, lv, note_en });
  });
  order.forEach(type => byType[type].sort((a, b) => (freq[b.name]||0) - (freq[a.name]||0)));

  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(({ name, en, note, lv, note_en }) =>
      `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${type}">(${name})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`
    ).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note, , note_en]) => {
      const type = T[name] || 'other';
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${type}">(${name})</span>
          <span class="apx-lv ind">工業</span>
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def, def_en }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-en">${en}</span> <span class="gloss-term-text">(${term})</span></div>
          <div class="gloss-def">${def_en?`<div class="gloss-def-en">${def_en}</div>`:''}<div class="gloss-def-ja">${def}</div></div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  return commercialHtml + indHtml + glossHtml;
}

let apxCurrentTab = 'all';

function showApx(){
  const el = document.getElementById('apx-overlay');
  if(!document.getElementById('apx-content').innerHTML)
    document.getElementById('apx-content').innerHTML = buildApxContent();
  el.classList.add('show');
  apxCurrentTab = 'all';
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'all'));
  applyApxFilter('all');
}
function hideApx(){ document.getElementById('apx-overlay').classList.remove('show'); }

function setApxTab(type){
  apxCurrentTab = type;
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  applyApxFilter(type);
}

function toggleHideNames(){
  const btn = document.getElementById('apx-hide-btn');

  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('names-hidden', nowActive);
  btn.textContent = nowActive ? '👁 科目名を表示' : '👁 科目名を隠す';
}

function toggleHideEnglish(){
  const btn = document.getElementById('apx-hide-en-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('en-hidden', nowActive);
  btn.textContent = nowActive ? '🔤 英語を表示' : '🔤 英語を隠す';
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category !== 'industrial';
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else if(tab === 'level3' || tab === 'level2') typeMatch = category !== 'industrial';
    else typeMatch = (type === tab && category !== 'industrial');

    if(!typeMatch){ sec.style.display = 'none'; return; }

    if(tab === 'level3' || tab === 'level2'){
      const targetLevel = tab === 'level3' ? '3' : '2';
      let anyVisible = false;
      sec.querySelectorAll('.apx-row').forEach(row => {
        const match = row.dataset.level === targetLevel;
        row.classList.toggle('hidden', !match);
        if(match) anyVisible = true;
      });
      sec.style.display = anyVisible ? '' : 'none';
    } else {
      sec.style.display = '';
      sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
    }
  });
}

// 答えの単語を問題文から伏せる
function qaMask(html, term){
  if(!term) return html;
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return html.replace(new RegExp(esc,'g'),'<span class="qa-mask">▓▓▓</span>');
}

// （...）を薄くする
function markQKey(text){
  // Highlight the distinctive feature clause (after で、/ が、/ を指し、)
  // while leaving the final question stem (は何か？ / を何というか？) unmarked
  const m = text.match(/^([\s\S]+?)(で、|が、|を指し、)([\s\S]+?)(は何か？|を何というか？|は何というか？)$/);
  if(m) return m[1] + m[2] + '<mark>' + m[3] + '</mark>' + m[4];
  return text;
}

function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

// HTMLタグを除いた表示用テキストを抽出（問題文のプレビュー用）
function qaStripTags(html){ return html.replace(/<[^>]+>/g,''); }

  '子会社株式': '例）A社の発行済株式の60%（議決権過半数）を5,000万円で取得 → 子会社株式5,000万円（固定資産）。株価が下がっても原則として時価評価しない。',
  '関係会社株式': '例）B社の25%の株式を3,000万円で取得（重大な影響を与えられる関連会社）→ 関係会社株式3,000万円（固定資産）。',
  '投資有価証券': '例）取引先との関係維持のために長期保有するC社株式30万円（その他有価証券）。期末時価35万円。\n仕訳）取得時：（借）投資有価証券30万円 ／（貸）現金30万円。期末評価替え：（借）投資有価証券5万円 ／（貸）その他有価証券評価差額金5万円（純資産へ、P/L経由なし）。\nポイント：その他有価証券の評価差額は「P/Lをスルーして純資産へ直入」。売買目的の評価差額は「P/Lへ」。この違いを「どちらがP/L経由か」で整理すること。',
  '長期前払費用': '例）5年間の火災保険料60万円を一括前払い（3月決算）。今後1年以内費用化分12万円→前払費用（流動資産）。1年超の費用化分48万円→長期前払費用（固定資産）。毎年12万円ずつ保険料（費用）に振替。\n仕訳）支払時：（借）前払費用12万円＋長期前払費用48万円 ／（貸）現金60万円。毎年：（借）保険料12万円 ／（貸）前払費用12万円（流動分）。翌年：長期前払費用から12万円を前払費用へ振替。\nポイント：1年基準の区分→1年以内に費用化→前払費用（流動）。1年超→長期前払費用（固定）。毎決算時に見直してB/S上の分類を変える。',
  '繰延税金資産': '例）貸倒引当金20万円を会計上費用計上したが税務は今期認めない→将来認定時に課税所得が減る→節税効果。税率30%なら繰延税金資産6万円（20万円×30%）。\n仕訳）（借）繰延税金資産6万円 ／（貸）法人税等調整額6万円（P/L：税金を6万円分減らす効果）。翌期に税務認定された時：（借）法人税等調整額6万円 ／（貸）繰延税金資産6万円（資産解消）。\nポイント：繰延税金資産は「将来の節税効果の前払い」。引当金・減損・未払費用などで会計＞税務の費用認識ズレが生じる時に発生。法人税等調整額はP/Lで税金負担を調整する科目。',
  '別段預金': '例）増資（新株発行）の際、申込者から株式申込証拠金を受け取り専用口座に入金 → 別段預金（資産）と株式申込証拠金（負債）を同額計上。払込完了後 → 資本金等へ振替。',
  '商品': '例）小売業での期末在庫（在庫の総コスト）200万円 → 商品200万円（資産）。売れたものは売上原価として費用に、売れ残りはこの科目で次期へ繰越。\nポイント：「商品」と「繰越商品」は同じ意味で使われることが多いが、勘定科目として使い分けることがある。',
  '不渡手形': '例）得意先が倒産し満期の手形50万円が決済されなかった → 受取手形50万円を不渡手形50万円へ振替。回収見込みが低ければ貸倒引当金（リスクの積み立て）も設定。',
  '建設仮勘定': '例）新工場建設（総額5億円）で着工金として2億円を支払い。完成まで1年かかる。\n仕訳）着工金支払：（借）建設仮勘定2億円 ／（貸）現金2億円。工事中間払い：（借）建設仮勘定1億円 ／（貸）現金1億円。完成・引渡し時：（借）建物5億円 ／（貸）建設仮勘定3億円＋現金2億円（残金）。\nポイント：建設仮勘定は「完成していないので減価償却しない」資産。完成して使い始めた時点で減価償却が始まる。工事代金の支払ごとに加算し、完成時に一括して正式固定資産に振り替える。',
  '未決算': '例）火災で工場設備が焼失、保険金が未定 → 未決算（資産）として一時計上。保険金額確定後 → 保険金（現金）と焼失損失に振り替え。',
  '破産更生債権等': '例）取引先が民事再生法を申請。売掛金200万円を → 破産更生債権等200万円（固定資産）に振替。回収見込みが5%なら190万円の貸倒引当金を設定。',
  '工事未収入金': '例）工事進捗度50%で工事収益5,000万円を計上したが、請求・入金は工事完成後。\n仕訳）収益認識時：（借）工事未収入金5,000万円 ／（貸）工事収益5,000万円。入金時：（借）現金5,000万円 ／（貸）工事未収入金5,000万円。\nポイント：一般の売掛金＝商品引渡し後の未収金。工事未収入金＝建設・工事業での未収金。どちらも「売上（収益）計上後の代金未回収分」という意味は同じ。試験では建設業の問題に出てくる。',
  '長期貸付金': '例）関連会社に3年返済の条件で1億円を貸付 → 長期貸付金1億円（固定資産）。1年以内の分は流動資産の「貸付金」として表示する。',
  '営業外受取手形': '例）備品（固定資産）を売却し代金として手形を受け取り → 営業外受取手形（資産）。商品売買の手形なら受取手形だが、固定資産売却なら別科目で管理。',
  '営業外電子記録債権': '例）備品（固定資産）を売却し代金として電子記録債権を受取 → 営業外電子記録債権（資産）。商品売買の電子記録債権とは性質が異なるため区別して表示。',
  '諸資産': '例）試算表作成中、細かい資産科目をまとめて表示する場合に「諸資産」として一括表示。正式な財務諸表では個別科目に分けて表示するのが原則。',
  '買掛金': '例）仕入先から商品100万円を「月末に払って」という約束で仕入れ → 買掛金100万円（負債）。月末に普通預金から振り込んで支払ったら → 買掛金100万円を消去。\nポイント：「商品を掛けで仕入れた」→ 買掛金。「パソコンを後払いで買った」→ 未払金。相手がモノの場合に使い分け。',
  '支払手形': '例）仕入先に対し「3か月後に支払います」という約束手形100万円を振り出し → 支払手形100万円（負債）。3か月後の満期日に当座預金100万円から自動引落し → 支払手形を消去。\nポイント：手形を「振り出す」のが支払手形（自社の義務）、「受け取る」のが受取手形（自社の権利）。',
  '電子記録債務': '例）仕入先への代金100万円を紙の手形の代わりに電子記録で支払い義務を登録 → 電子記録債務100万円（負債）。支払期日に口座から自動引落しされて消滅。',
  '未払金': '例）事務用パソコン20万円を購入したが代金は来月払い → 未払金20万円（負債）。翌月に支払ったら未払金を消去。\nポイント：「商品の掛け仕入」→ 買掛金、「それ以外のもの・サービスの後払い」→ 未払金。',
  '借入金': '例）銀行から1,000万円を年利2%・3年返済で借り入れ → 借入金1,000万円（負債）。毎年の利息20万円は支払利息（費用）として計上しながら元本を返済。\nポイント：「借り入れた元本の残額」が借入金。利息の未払いは未払利息（別の科目）。',
  '手形借入金': '例）金融機関に約束手形を担保として渡し500万円を借り入れ → 手形借入金500万円（負債）。満期日に手形を決済して消滅。',
  '未払利息': '例）3月末決算で、2〜3月分の借入利息2万円が未払い → 未払利息2万円（負債）を計上（費用：支払利息2万円も同時計上）。4月に実際に払ったとき → 未払利息2万円を消去（費用の二重計上を防ぐ）。',
  '前受金': '例）来月届ける予定の商品50万円の注文を受け、手付金10万円を受領 → 前受金10万円（負債：まだ商品を渡していないので）。来月商品引渡し時 → 前受金10万円＋現金40万円 → 売上50万円へ振替。',
  '仮受金': '例）口座に100万円の振込があったが送金人・目的が不明 → 仮受金100万円（負債）。後日、得意先からの売掛金回収と判明 → 売掛金100万円を消去して仮受金も消去。',
  '当座借越': '例）当座預金残高50万円なのに小切手80万円を振り出し → 当座借越30万円（負債）が発生（銀行が立替払いした状態）。後日入金があれば自動的に解消。\nポイント：当座借越契約がある場合のみ発生。この契約なしに残高超過の小切手は不渡りになる。',
  '預り金': '例）社員の給料30万円から源泉所得税3万円・住民税2万円を天引き → 給料25万円（手取り）を支払い、預り金5万円（負債）を計上。翌月に税務署等へ納付 → 預り金5万円を消去・現金減少。',
  '社会保険預り金': '例）社員給料30万円から健康保険料1.5万円・厚生年金1.8万円（従業員負担分）を天引き → 社会保険預り金3.3万円（負債）。会社負担分3.3万円は法定福利費（費用）として別途計上。翌月まとめて年金事務所へ6.6万円を支払い。',
  '所得税預り金': '例）給与計算で従業員の源泉所得税2万円を天引き → 所得税預り金2万円（負債）。翌月10日までに税務署へ2万円を納付 → 所得税預り金を消去。',
  '未払法人税等': '例）決算で法人税等が120万円と確定。中間申告で50万円前払い済み → 仮払法人税等50万円と相殺して未払法人税等70万円（負債）を計上。2か月以内に70万円を納付。',
  '未払消費税': '例）決算時：仮受消費税100万円（お客様から預かった分）－仮払消費税80万円（仕入先に支払った分）＝未払消費税20万円（負債：国へ納付する消費税）。申告期限（通常2か月以内）に20万円を納付。',
  '仮受消費税': '例）商品1,000万円（税抜）を販売し消費税100万円を顧客から受取 → 売上1,000万円・仮受消費税100万円（負債）を計上。国への納付義務だから負債。',
  '未払配当金': '例）株主総会で1株当たり10円の配当（発行済み100万株）→ 合計1,000万円の配当を決議 → 繰越利益剰余金1,000万円を減額し未払配当金1,000万円（負債）を計上。株主への振込後 → 消去。',
  '前受収益': '例）10月に1年分の地代120万円を受取（3月決算）→ 翌4〜9月分60万円は前受収益（負債）として翌期へ繰延べ。「お金は受け取ったがサービスはまだ提供していない分」が負債として残る。',
  '未払費用': '例）3月末決算で3月分の借入利息2万円が未払い → 支払利息2万円（費用）・未払費用2万円（負債）を計上。4月払時：未払費用2万円を消去するだけ（費用は3月に計上済み）。',
  '社債': '例）額面1億円・クーポン1%・5年満期の社債を9,700万円（97円発行）で発行。差額300万円は5年で均等償却（年60万円を社債利息に加算）。\n仕訳）発行時：（借）当座預金9,700万円 ／（貸）社債9,700万円。毎年利息：（借）社債利息100万円（名目利息）＋60万円（償却原価法分）／（貸）当座預金100万円・社債60万円。満期：（借）社債1億円 ／（貸）当座預金1億円。\nポイント：割引発行→発行価額＜額面→差額を毎期社債利息に加算し帳簿価額を額面に近づける（償却原価法）。プレミアム発行→発行価額＞額面→差額を毎期社債利息から控除。試験では「年間社債利息の計算（名目利息＋償却原価法分）」が必出。',
  'リース債務': '例）5年間・総額300万円（利息相当30万円含む）のコピー機ファイナンスリース契約\n→ リース債務270万円（負債：元本相当）を計上。毎年60万円のリース料のうち、元本54万円をリース債務の減少・利息6万円（支払利息）として処理。',
  '製品保証引当金': '例）当期売上100万円の製品について過去実績から2%（2万円）の無償修理が予想される。\n仕訳）引当金設定：（借）製品保証引当金繰入2万円（費用）／（貸）製品保証引当金2万円（負債）。翌期実際に修理費1.5万円発生：（借）製品保証引当金1.5万円 ／（貸）現金1.5万円（引当金を取り崩す）。残0.5万円は翌決算で差額補充法または洗替法で調整。\nポイント：引当金設定の4要件→①将来の特定の費用・損失、②発生が確実または確率高い、③原因が当期、④金額を合理的に見積れる。4つ全てを満たす時だけ引当金を積む。',
  '退職給付引当金': '例）全従業員の退職給付債務（将来退職金の現在価値）10億円・年金資産（運用積立）7億円→退職給付引当金3億円（B/S負債）。当年度の退職給付費用500万円（①当年度の勤務コスト300万円＋②利息コスト200万円）。\n仕訳①費用計上：（借）退職給付費用500万円 ／（貸）退職給付引当金500万円。\n仕訳②実際の退職金支払：（借）退職給付引当金XXX万円 ／（貸）現金XXX万円（引当金を取り崩す）。\nポイント：退職給付引当金＝退職給付債務－年金資産。年金資産（積立済み）は控除する。費用の2要素：①勤務費用（今年1年働いた分の積上げ）＋②利息費用（債務残高×割引率）。この計算構造が試験に出る。',
  '繰延税金負債': '例）その他有価証券の評価益100万円→会計上は純資産増加・税務は未課税（売却時に課税）。税率30%なら将来税負担30万円増加。\n仕訳）（借）その他有価証券評価差額金30万円 ／（貸）繰延税金負債30万円（純資産内の評価差額から税効果相当を控除）。将来売却・課税時：（借）繰延税金負債30万円 ／（貸）法人税等30万円（税負担を実現）。\nポイント：繰延税金負債は「将来の税負担の先取り」。その他有価証券の評価益や積立金の取崩しなど「会計＜税務の費用」または「会計＞税務の収益」の場合に発生。',
  '株式申込証拠金': '例）増資で1株1,000円の新株10万株の申込を受け、1億円を受取 → 別段預金1億円（資産）・株式申込証拠金1億円（負債）を計上。払込完了後 → 資本金5,000万円・資本準備金5,000万円へ振替（別段預金は普通預金へ）。',
  '工事未払金': '例）建設工事で資材業者から材料300万円分を仕入れたが代金は来月払い → 工事未払金300万円（負債）。一般企業でいう買掛金にあたる建設業の勘定科目。',
  '営業外電子記録債務': '例）工場設備100万円を購入し代金を電子記録で支払い義務を登録（営業外取引）→ 営業外電子記録債務100万円（負債）。通常の仕入なら電子記録債務だが、固定資産購入なので別科目。',
  '営業外支払手形': '例）事務所の什器200万円を購入し代金として約束手形を振り出し → 営業外支払手形200万円（負債）。商品の仕入なら支払手形だが、固定資産購入なので別科目。',
  '諸負債': '例）試算表作成中に細かい負債科目をまとめて表示する場合に「諸負債」として一括表示。正式な財務諸表では個別科目（未払金・預り金など）に分けて表示するのが原則。',
  '仕入': '例）商品100万円を仕入先から購入 → 仕入100万円（費用）。期末の決算整理で「期首繰越商品＋当期仕入－期末繰越商品」の計算式で売上原価を算定。\nポイント：期中は「仕入」として費用計上し、期末にのみ繰越商品と振り替えて売上原価を確定する。',
  '支払家賃': '例）毎月10万円の事務所家賃を1年分まとめて前払い120万円 → まず支払家賃120万円（費用）計上後、翌期分を前払費用に振替。または月々10万円ずつ支払家賃として費用計上。',
  '支払手数料': '例）銀行への振込手数料550円（税込）→ 支払手数料550円（費用）。不動産仲介で事務所を借りた際の仲介手数料30万円 → 支払手数料30万円（費用）。',
  '支払利息': '例）借入金1,000万円・年利2%なら年間利息20万円 → 支払利息20万円（費用）。社債の利息は「社債利息」という別科目を使う場合もある。\nポイント：「元本の返済」は費用ではない（借入金の減少）。「利息の支払い」だけが支払利息（費用）。',
  '支払保険料': '例）1年分の火災保険料12万円を4月1日に支払い（3月決算）→ 支払保険料12万円（費用）として全額計上後、翌4〜3月分12万円全額が当期費用（1年間の保険なので全額当期）。もし10月払いなら翌4〜9月分6万円を前払費用に振替。',
  '租税公課': '例）事務所の固定資産税（年10万円）→ 租税公課10万円（費用）。契約書に貼る200円の収入印紙 → 租税公課200円（費用）。',
  '広告宣伝費': '例）SNS広告費50万円・新聞折込チラシ印刷費20万円 → 広告宣伝費70万円（費用）。不特定多数に宣伝するのが広告宣伝費、特定の取引先を接待するのは交際費。',
  '通信費': '例）月の電話代3万円・切手購入1万円分（うち5,000円未使用）→ 通信費3万5,000円（費用）として計上後、期末に未使用切手5,000円を貯蔵品（資産）へ振替。',
  '旅費交通費': '例）東京出張で交通費1万円・宿泊費1.5万円。事前に仮払金2万円を渡していた場合 → 旅費交通費2.5万円（費用）／仮払金2万円（消去）＋現金5,000円（追加精算）。',
  '修繕費': '例）雨漏り修理（屋根の部分修理）に30万円 → 修繕費30万円（費用）。大規模な屋根の全面取り替えで価値が増す場合は資本的支出として建物に計上。\nポイント：「元に戻す修理」→ 修繕費（費用）、「グレードアップ工事」→ 資本的支出（資産）。',
  '貸倒損失': '例）売掛金100万円の取引先が倒産し回収不能確定。貸倒引当金が60万円積み立て済みなら → 貸倒引当金60万円（取崩し）＋貸倒損失40万円（費用）で合計100万円の損失を処理。',
  '貸倒引当金繰入': '例）期末売掛金残高1,000万円に対し貸倒実績率2%を適用 → 貸倒引当金20万円が必要。現在残高が8万円なら差額12万円を追加 → 貸倒引当金繰入12万円（費用）・貸倒引当金12万円（増加）。',
  '減価償却費': '例）パソコン（取得原価20万円、耐用年数4年、定額法）→ 毎年5万円の減価償却費（20万円÷4年）を計上。間接法なら → 減価償却費5万円（費用）／減価償却累計額5万円（評価勘定）。\nポイント：現金は出ていかない「非現金費用」。でもちゃんと利益を減らす費用として認識する。',
  '発送費': '例）商品をヤマト運輸で顧客に発送、送料1,500円（当社負担）→ 発送費1,500円（費用）。もし「着払い」で顧客負担なら発送費は計上しない。',
  '雑損': '例）帳簿上の現金残高より実際現金が3,000円少なく、原因を調査しても決算時に判明しなかった → 雑損3,000円（費用）に振替。\nポイント：実際 < 帳簿（現金不足）→ 雑損。実際 > 帳簿（現金超過）→ 雑益（収益）。',
  '法定福利費': '例）従業員給与30万円の社会保険料（会社負担分）：健康保険1.5万円＋厚生年金1.8万円＝3.3万円 → 法定福利費3.3万円（費用）として計上。従業員負担分は社会保険預り金（負債）。',
  '給料': '例）事務員5名の給与総額100万円を月末に支払い。源泉所得税5万円・社会保険3万円を天引き → 給料100万円（費用）／現金・預金92万円（支払）・預り金8万円（天引き分）。',
  '法人税等': '例）決算で当期純利益を計算したら法人税等が120万円。うち中間申告で50万円前払い済み → 法人税等120万円（費用）を計上し、仮払法人税等50万円（資産）と相殺して未払法人税等70万円（負債）を確定。',
  '固定資産売却損': '例）帳簿価額80万円（取得200万円－累計120万円）の機械を60万円で売却 → 固定資産売却損20万円（80万円－60万円）を特別損失に計上。',
  '消耗品費': '例）コピー用紙を2万円分購入し全部使用 → 消耗品費2万円（費用）。もし期末に5,000円分が未使用なら → 消耗品費5,000円を消耗品（資産）へ振替（翌期に費用化）。',
  '手形売却損': '例）3か月後満期の受取手形100万円を銀行で割引。割引料3万円を差し引かれ97万円を受取 → 手形売却損3万円（費用）・現金97万円・受取手形100万円（消去）。',
  '売上原価': '例）期首商品50万円＋当期仕入300万円－期末商品70万円＝売上原価280万円。売上高400万円－売上原価280万円＝売上総利益120万円。「売れた商品の原価」がこの金額。',
  '棚卸減耗損': '例）帳簿100個・実地棚卸95個 → 5個×原価1,000円＝棚卸減耗損5,000円（費用）。「数が足りない」損失。品質低下による「値段が下がった」損失は商品評価損（別科目）。',
  '商品評価損': '例）原価1,000円の商品が時代遅れになり正味売却価額が750円に低下 → 250円（1,000円－750円）の商品評価損（費用）を計上。保守主義の原則「損は早めに認識」の具体例。',
  '有価証券評価損': '例）1,000円で購入した売買目的有価証券（株式）が決算時に800円に値下がり → 有価証券評価損200円（費用）を当期損失として計上（実際に売っていなくても損失認識）。',
  '有価証券売却損': '例）帳簿価額1,000円の株式を850円で売却 → 有価証券売却損150円（費用）を計上。',
  '電子記録債権売却損': '例）3か月後満期の電子記録債権100万円を銀行に売却し割引料2万円を差し引かれ98万円を受取 → 電子記録債権売却損2万円（費用）・現金98万円・電子記録債権100万円（消去）。',
  '債権売却損': '例）100万円の売掛金をファクタリング会社に95万円で売却して早期現金化 → 債権売却損5万円（費用）。資金繰りのため早期に現金にしたコスト。',
  '社債利息': '例）社債1億円（年利1.5%）→ 年間利息150万円を社債利息（費用）として計上。社債利息は借入金の「支払利息」とは別科目（どちらも営業外費用だが区別する）。',
  'のれん償却': '例）のれん2,000万円を5年で均等償却 → 毎年のれん償却400万円（費用）。5年で2,000万円が全額費用化されのれんの帳簿残高がゼロになる。',
  '退職給付費用': '例）当期の退職給付費用が500万円と計算 → 退職給付費用500万円（費用）・退職給付引当金500万円（負債）を計上。将来の退職金支払義務を毎期少しずつ費用認識していくイメージ。',
  '製品保証引当金繰入': '例）当期製品売上100万円の2%（2万円）を無償修理費として見積もり → 製品保証引当金繰入2万円（費用）・製品保証引当金2万円（負債）を計上。',
  '法人税・住民税及び事業税': '例）決算で法人税120万円・住民税20万円・事業税30万円が確定 → 法人税・住民税及び事業税170万円（費用）として損益計算書の最終段階に一括計上。',
  '火災損失': '例）帳簿価額500万円の建物が火災で全焼 → 火災損失500万円（特別損失）。その後保険金600万円を受取 → 保険差益100万円（600万円－500万円）を特別利益に計上。',
  '固定資産除却損': '例）帳簿価額30万円（取得100万円－減価償却累計額70万円）のパソコンを廃棄処分に → 固定資産除却損30万円（特別損失）を計上。廃棄費用が別途かかる場合もある。',
  '固定資産廃棄損': '例）帳簿価額50万円の機械を廃棄処分。廃棄業者への解体費用10万円も発生 → 固定資産廃棄損60万円（50万円＋10万円）を特別損失として計上。',
  '工事原価': '例）マンション建設工事が完成。材料費2,000万円・労務費1,000万円・外注費500万円・経費200万円 → 工事原価3,700万円（費用）。完成工事収益5,000万円との差額1,300万円が完成工事総利益。',
  '売上': '例）商品を現金400万円で販売 → 売上400万円（収益）を計上。後日5万円分が返品されたら売上5万円（減少）を計上。売上400万円－売上原価280万円＝売上総利益120万円（粗利）。',
  '受取家賃': '例）会社所有のテナント物件を月10万円で貸出 → 受取家賃10万円（収益）。支払家賃（費用）とは逆の立場。前受けした分は前受収益（負債）として翌期に繰り延べる。',
  '受取手数料': '例）不動産仲介で30万円の手数料を受取 → 受取手数料30万円（収益）。仲介業なら売上として計上。本業以外なら営業外収益として計上。',
  '受取利息': '例）貸付金1,000万円に対する利息20万円（年利2%）→ 受取利息20万円（収益）。普通預金の利息100円なども受取利息として計上。',
  '固定資産売却益': '例）帳簿価額80万円（取得200万円－累計120万円）の機械を100万円で売却 → 固定資産売却益20万円（100万円－80万円）を特別利益または営業外収益として計上。',
  '受取配当金': '例）保有株式100株に対し1株当たり50円の配当を受取 → 受取配当金5,000円（収益）。',
  '償却債権取立益': '例）2年前に貸倒損失として処理した売掛金10万円が、取引先の事業再生により30%（3万円）回収できた → 償却債権取立益3万円（収益）。棚ぼた的な収益。',
  '雑益': '例）帳簿より現金が2,000円多く、原因不明なら → 雑益2,000円（収益）に振替。不用品の売却で数百円を受取なども雑益。\nポイント：実際 > 帳簿（現金多い）→ 雑益（収益）。',
  '有価証券売却益': '例）帳簿価額1,000円の株式を1,200円で売却 → 有価証券売却益200円（収益）。',
  '有価証券評価益': '例）1,000円で購入した売買目的の株式が決算時1,200円に値上がり → 有価証券評価益200円（収益）を当期に計上（実際に売っていなくても利益認識）。',
  '有価証券利息': '例）社債（額面100万円・年利1.5%）保有 → 年間利息1.5万円を有価証券利息（収益）として計上。',
  '工事収益': '例）総請負価格1億円・2年間の工事。1年目の進捗度40% → 工事収益4,000万円を計上。2年目完成・引渡し → 残り6,000万円を計上。\n仕訳）1年目：（借）工事未収入金4,000万円 ／（貸）工事収益4,000万円。同時に（借）工事原価XX万円 ／（貸）仕掛品XX万円（原価も進捗度按分）。\nポイント：進捗度に応じて毎期収益を計上する「進捗度基準」と工事完成引渡し時に一括計上する「完成基準」がある。収益認識基準では原則「進捗度基準（一定期間にわたる充足）」を採用。',
  '資本金': '例）創業時に株主から1,000万円の払込。うち500万円を資本金に登記、500万円を資本準備金に → 資本金500万円・資本準備金500万円（純資産）。全額を資本金にする場合は資本金1,000万円。',
  '繰越利益剰余金': '例）昨年末の繰越利益剰余金500万円＋今期純利益100万円＝600万円 → 株主総会で配当80万円・利益準備金8万円を決議 → 繰越利益剰余金512万円（600万円－80万円－8万円）へ減少。',
  '利益準備金': '例）資本金1,000万円の場合、資本準備金と利益準備金の合計が250万円（1,000万円×1/4）になるまで配当のたびに強制積立。配当100万円なら最低10万円（100万円×1/10）の積立が義務。',
  '資本準備金': '例）増資で株主から1,000万円の払込。会社法上は全額資本金にできるが、500万円だけ資本金に組み入れ → 残り500万円は資本準備金（純資産）として積立。',
  '別途積立金': '例）将来の設備投資に備えて株主総会で「今期100万円の別途積立金を積み立てる」と決議 → 繰越利益剰余金100万円を減少・別途積立金100万円（純資産）を積立。設備投資時に取り崩す。',
  'その他資本剰余金': '例）自己株式（取得原価100万円）を120万円で売却 → その他資本剰余金20万円（売却益の資本計上：利益ではなく資本の増加として処理）。',
  '自己株式': '例）自社株100万円分を買い戻し。\n仕訳①取得：（借）自己株式100万円 ／（貸）現金100万円（純資産がマイナスになる）。\n仕訳②消却（株式を消す）：（借）その他資本剰余金100万円 ／（貸）自己株式100万円（資本が正式に減少）。\n仕訳③再売却（120万円で売却）：（借）現金120万円 ／（貸）自己株式100万円＋その他資本剰余金20万円（差益は資本剰余金）。\nポイント：自己株式は「純資産のマイナス」→資産ではない。再売却時の差益は「利益ではなく資本剰余金」。消却時の差損は「利益剰余金（その他資本剰余金）から控除」。',
  '新株予約権': '例）ストック・オプション：従業員に「1株1,000円で100株買える権利」を付与→新株予約権10万円（100株×1,000円÷時価換算等）を純資産計上。\n仕訳①付与時（費用計上）：（借）株式報酬費用10万円 ／（貸）新株予約権10万円。\n仕訳②行使時（株価2,000円）：（借）現金10万円（行使価格）＋新株予約権10万円 ／（貸）資本金10万円＋資本準備金10万円（払込金額の1/2ずつ）。\n仕訳③失効時（権利消滅）：（借）新株予約権10万円 ／（貸）新株予約権戻入益10万円（P/L収益）。\nポイント：新株予約権は純資産。行使→資本金・資本準備金増加。失効→収益（新株予約権戻入益）。',
  'その他有価証券評価差額金': '例）その他有価証券（取得原価100万円）が期末時価130万円に上昇。税率30%。\n仕訳）（借）投資有価証券30万円 ／（貸）繰延税金負債9万円・その他有価証券評価差額金21万円（評価差額30万円から税効果9万円を除いた21万円が純資産へ）。\nポイント：評価差額30万円がそのまま純資産に行くのではなく「評価差額－税効果＝純資産計上額」。試験では税率30%での計算問題が必出。評価損の場合は逆（純資産が減る）。',
  '貸倒引当金': '例）期末売掛金100万円に対し2%の貸倒引当金2万円を設定 → B/S表示：売掛金100万円－貸倒引当金2万円＝回収見込額98万円。「お客さん全員が払うとは限らない」リスクを財務諸表に反映。',
  '減価償却累計額': '例）機械（取得原価100万円、毎年20万円償却）を3年使用 → 減価償却累計額60万円（20万円×3年）。B/S表示：機械100万円－累計60万円＝帳簿価額40万円（今の価値）。',
  '損益': '例）決算振替仕訳で売上500万円・仕入350万円・給料100万円等をすべて「損益」に振替 → 損益50万円の利益残高 → 繰越利益剰余金へ振替して損益勘定を閉鎖。',
  '建物減価償却累計額': '例）建物（取得原価3,000万円、耐用年数30年・定額法）を10年使用 → 建物減価償却累計額1,000万円（100万円×10年）。B/S：建物3,000万円－累計1,000万円＝帳簿価額2,000万円。',
  '備品減価償却累計額': '例）備品（取得原価20万円、耐用年数4年）を2年使用 → 備品減価償却累計額10万円（5万円×2年）。B/S：備品20万円－累計10万円＝帳簿価額10万円。',
  '車両運搬具減価償却累計額': '例）営業車（取得原価200万円、耐用年数5年）を3年使用 → 累計120万円（40万円×3年）。B/S：車両運搬具200万円－累計120万円＝帳簿価額80万円。',
  '機械装置減価償却累計額': '例）機械（取得原価1,000万円、耐用年数10年）を5年使用 → 累計500万円（100万円×5年）。B/S：機械装置1,000万円－累計500万円＝帳簿価額500万円。',
  '構築物減価償却累計額': '例）駐車場舗装（取得原価300万円、耐用年数15年）を5年使用 → 累計100万円（20万円×5年）。B/S：構築物300万円－累計100万円＝帳簿価額200万円。',
  '工具器具備品減価償却累計額': '例）精密測定器（取得原価50万円、耐用年数5年）を3年使用 → 累計30万円（10万円×3年）。B/S：工具器具備品50万円－累計30万円＝帳簿価額20万円。',
  '契約資産': '例）スマホ本体（10万円）＋1年保守サービス（4万円）のセット14万円を現金で受取。本体を引渡した時点では保守サービスはまだ完了していない。\n仕訳）本体引渡時：（借）現金14万円 ／（貸）契約資産10万円（本体分、確定した対価）＋契約負債4万円（保守分の前受け）。保守完了時：（借）契約負債4万円 ／（貸）役務収益4万円。\nポイント：契約資産vs売掛金の違い→売掛金は「代金請求権が無条件に確立している」資産。契約資産は「他の条件（別の履行義務の充足等）が残っている」状態の資産。',
  '特許権': '例）特許取得費用（弁理士費用・登録料等）計60万円 → 特許権60万円（無形固定資産）。10年間で均等償却すれば毎年6万円を特許権償却（費用）へ。',
  'ソフトウェア仮勘定': '例）社内システムを開発中に外注費50万円を支払い → ソフトウェア仮勘定50万円（資産）として一時計上。システム完成後 → ソフトウェア50万円（無形固定資産）へ振替し償却開始。',
  '開業費': '例）開業前の広告宣伝費30万円・開業記念パーティー費10万円・テスト運転費5万円 → 開業費45万円（繰延資産）。5年で均等償却すれば毎年9万円を開業費償却（費用）へ。',
  '支店': '例）本店が支店に商品100万円を送付 → 本店側：支店勘定100万円（資産的に計上）。支店側：本店勘定100万円（負債的に計上）。合算時に両者を相殺して消去。',
  '本店': '例）支店が本店から商品100万円を受け取り → 支店側：本店勘定100万円（負債的に計上）。本店側の支店勘定と合算・相殺。支店独自の損益は最終的に本店勘定へ振替。',
  '返金負債': '例）書店へ100万円の本を納品。過去実績から10%（10万円）が返品見込み。\n仕訳）納品時：（借）売掛金100万円 ／（貸）売上90万円（返品分10万円は収益計上しない）＋返金負債10万円（負債：返品時に返金が必要な義務）。実際に10万円分返品：（借）返金負債10万円 ／（貸）売掛金10万円。\nポイント：返品が予想される場合は「予想返品分だけ収益を減らして返金負債を計上」する。これが収益認識基準の「変動対価の考え方」の具体的な処理。',
  '契約負債': '例）1年分の保守サービス料12万円を受領（3月決算、10月受領）→ 契約負債12万円（負債）。毎月1万円ずつサービスを提供するたびに売上へ振替（前受金と似た概念だが収益認識基準上の用語）。',
  '賞与引当金': '例）3月決算・7月支給予定の夏季賞与600万円のうち、10〜3月（当期）分300万円を引当計上。\n仕訳）決算時：（借）賞与引当金繰入300万円（費用）／（貸）賞与引当金300万円（負債）。7月支給時：（借）賞与引当金300万円（引当金取崩し）＋賞与300万円（翌期4〜6月分：当期費用）／（貸）現金600万円。\nポイント：「支払時に全額費用計上」では費用収益対応の原則に反する（当期の業績に3月分が入らない）。引当金で「働いた期間に費用を先取り」することで期間損益が適正化される。',
  '役務収益': '例）システム開発の請負契約（総額1,000万円・6か月プロジェクト）。進捗度50%の時点で役務収益500万円を計上。\n仕訳）役務収益の計上：（借）契約資産（または売掛金）500万円 ／（貸）役務収益500万円。プロジェクト完了時：（借）売掛金1,000万円 ／（貸）役務収益500万円（残り）＋契約資産500万円（解消）。\nポイント：役務収益は「サービスの提供にともなう収益」。一時点で完了する役務（修理等）→完了時点で収益認識。一定期間にわたる役務（保守・コンサル等）→期間按分で収益認識。',
  '為替差益': '例）1ドル100円で輸出し売掛金1万ドル（100万円）を計上。決算時1ドル108円。\n仕訳）決算時換算替え：（借）売掛金8万円 ／（貸）為替差益8万円（円安→外貨建て資産の価値増加）。決済時に1ドル110円になっていた場合：（借）現金110万円 ／（貸）売掛金108万円・為替差益2万円（追加で2万円の利益）。\nポイント：外貨建て債権（売掛金・貸付金等）は円安になると為替差益。外貨建て債務（買掛金・借入金等）は円高になると為替差益。「自分にとって得になる方向の動き」で差益が発生。',
  '為替差損': '例）1ドル100円で輸入し買掛金1万ドル（100万円）を計上。決算時1ドル110円（円安）。\n仕訳）決算時換算替え：（借）為替差損10万円 ／（貸）買掛金10万円（円安→外貨建て負債の負担増）。決済時に1ドル112円なら：（借）買掛金110万円・為替差損2万円 ／（貸）現金112万円（追加で2万円の損失）。\nポイント：外貨建て取引の損益は「取引時レートvs決算時（または決済時）レートの差×外貨金額」で計算。輸出企業→円高で損失・円安で利益。輸入企業→円安で損失・円高で利益。',
  '保険差益': '例）帳簿価額500万円の建物が火災で全焼。保険金800万円受取。\n仕訳）保険金受取時：（借）現金800万円 ／（貸）建物500万円（資産消滅）＋保険差益300万円（収益）。圧縮記帳する場合：取得した代替資産の帳簿価額から300万円を圧縮→当期課税を回避。\nポイント：「焼失資産の帳簿価額＞保険金」→火災損失（費用）。「帳簿価額＜保険金」→保険差益（収益）。保険差益には圧縮記帳が使えることを覚えておく。',
  '負のれん発生益': '例）B社の純資産時価1億円の会社を8,000万円で買収（2,000万円割安）。\n仕訳）買収時：（借）諸資産 ／（貸）諸負債＋現金8,000万円。差額：（借）諸資産（純資産時価按分）2,000万円 ／（貸）負のれん発生益2,000万円（一括収益認識）。\nポイント：のれん（正）→20年以内に均等償却（毎期費用）。負のれん→発生時に即座に全額収益計上（毎期の費用化なし）。正と負で会計処理が真逆になる点が試験頻出。',
  '国庫補助金受贈益': '例）省エネ設備導入のために国から2,000万円の補助金を受け取り。\n仕訳）補助金受取時：（借）現金2,000万円 ／（貸）国庫補助金受贈益2,000万円（収益）。同時に設備取得・圧縮記帳：（借）固定資産圧縮損2,000万円 ／（貸）機械2,000万円（圧縮処理）→補助金収益2,000万円と圧縮損2,000万円が相殺されて当期は実質ゼロ課税。\nポイント：受贈益だけ計上して圧縮記帳しなければ、その年に2,000万円が課税対象になる。圧縮記帳することで課税を将来に繰り延べる。',
  '工事負担金受贈益': '例）電力会社が顧客の要望で送電設備を整備、顧客から工事費負担金500万円を受取 → 工事負担金受贈益500万円（収益）。圧縮記帳で固定資産圧縮損500万円と相殺可能。',
  '固定資産圧縮損': '例）国から補助金3,000万円を受け取り→国庫補助金受贈益3,000万円（収益）計上。同時に5,000万円の機械を取得（補助金3,000万円＋自己資金2,000万円）。圧縮記帳：機械を5,000万円→2,000万円に圧縮。\n仕訳）圧縮時：（借）固定資産圧縮損3,000万円 ／（貸）機械3,000万円（帳簿価額を直接減額）。効果：受贈益3,000万円と圧縮損3,000万円が相殺→当期の課税所得に含まれない→課税が将来の減価償却期間に分散。\nポイント：圧縮記帳は「課税の免除」ではなく「課税の繰延べ」。将来の減価償却が少なくなり（圧縮後の低い帳簿価額が基礎）、その分将来の課税所得が増える仕組み。',
  '法人税等調整額': '例）会計上の税引前利益1,000万円・一時差異（貸倒引当金超過）200万円、税率30%。課税所得1,200万円（税務）→実際納税額360万円。繰延税金資産60万円（200万円×30%）を計上。\n損益計算書：法人税等360万円 ／ 法人税等調整額△60万円（控除）＝実効税負担300万円（1,000万円×30%）。\nポイント：法人税等調整額は「税金費用の修正項目」。繰延税金資産増加時→調整額がマイナス（税金減）。繰延税金負債増加時→調整額がプラス（税金増）。「調整後の法人税等＝税引前利益×実効税率」になることを確認すること。',
  '役務原価': '例）システム開発プロジェクトで投入した人件費200万円・外注費100万円・ソフトウェアライセンス費50万円 → 役務原価350万円。\n損益計算書：役務収益1,000万円－役務原価350万円＝役務粗利（サービスグロスマージン）650万円。\nポイント：役務収益と役務原価は対応させて計上（費用収益対応の原則）。役務収益を進捗度で按分した場合、役務原価も同じ進捗度で按分するのが原則。',
  '賞与引当金繰入': '例）6月支給のボーナス（当期12〜3月分）600万円相当を3月末に見積もり → 賞与引当金繰入600万円（費用）・賞与引当金600万円（負債）を計上。6月支給時には費用は計上しない（既に計上済み）。',
  '賞与': '例）6月に600万円のボーナスを支給。賞与引当金が600万円積み立て済みなら → 賞与引当金600万円（取崩し）で処理し賞与（費用）はゼロ。引当金なしなら賞与600万円（費用）を支給時に全額計上。',
  '支払リース料': '例）事務所のコピー機をオペレーティング・リース契約（解約可能・資産計上不要）で利用、月3万円のリース料 → 支払リース料3万円（費用）として毎月計上。資産・負債は計上しない。',
  '特許権償却': '例）特許権60万円（10年間）→ 毎年6万円を特許権償却（費用）として計上し特許権の帳簿価額を減少。10年後に特許権がゼロになる。',
  '創立費償却': '例）創立費30万円を5年均等償却 → 毎年6万円を創立費償却（費用）として計上。5年後に創立費の帳簿価額がゼロになる。',
  '株式交付費償却': '例）株式交付費60万円を3年均等償却 → 毎年20万円を株式交付費償却（費用）として計上。3年後に残高ゼロ。',
  '開業費償却': '例）開業費45万円を5年均等償却 → 毎年9万円を開業費償却（費用）として計上。',
  'ソフトウェア償却': '例）ソフトウェア300万円（耐用年数5年）→ 毎年60万円をソフトウェア償却（費用）として計上。ソフトウェア残高を直接減額する（直接法）のが一般的。',
  '研究開発費': '例）新薬の研究に年間2億円を支出 → 研究開発費2億円（費用）として全額当期費用に計上。たとえ「将来必ず実を結ぶ」と思っても資産にはできない（国際基準では一部資産化可能な場合あり）。',
  '新築積立金': '例）老朽化した本社ビルの建替え資金として株主総会で毎期500万円の新築積立金を積み立てると決議 → 繰越利益剰余金から新築積立金500万円（純資産）へ振替。建替え実施時に取り崩す。',
  '材料': '例）自動車メーカーの材料：鋼板（素材）＋タイヤ（買入部品）＋潤滑油（工場消耗品）をまとめて「材料」として管理。\n仕訳）材料を200万円で仕入れた：（借）材料200万円 ／（貸）買掛金200万円。消費時：（借）仕掛品・製造間接費 ／（貸）材料200万円。\nポイント：材料費＝製造原価の3要素のひとつ。「どの製品に使ったか明確」→直接材料費、「複数製品に共通」→間接材料費（製造間接費に分類）。',
  '素材': '例）木工業の木材・自動車の鋼板・食品加工の小麦粉など。そのまま製品には使えず「加工して製品の一部になる」点がポイント。\n仕訳）直接材料として300万円消費：（借）仕掛品300万円 ／（貸）材料300万円。\nポイント：素材は「直接材料費」→仕掛品に直接賦課。買入部品（そのまま組み込む）と区別して覚える。',
  '買入部品': '例）自動車メーカーが外部購入してそのまま取り付けるタイヤ・バッテリー・カーナビ。素材＝加工して使う、買入部品＝そのまま使う、の区別が重要。\n仕訳）買入部品50万円を製品に組み込み消費：（借）仕掛品50万円 ／（貸）材料50万円。\nポイント：試験では「加工が必要かどうか」で素材・買入部品を区別する。どちらも仕掛品に直接賦課される直接材料費。',
  '補助材料': '例）機械の潤滑油・塗料・研磨剤・接着剤など。製品の骨格（素材）でなく「製造プロセスを助けるもの」。\n仕訳）補助材料10万円を消費：（借）製造間接費10万円 ／（貸）材料10万円（間接材料費として製造間接費へ）。\nポイント：素材・買入部品は「直接材料費→仕掛品」、補助材料・工場消耗品は「間接材料費→製造間接費」。この分類が原価計算の基本。',
  '工場消耗品': '例）機械の潤滑油・安全手袋・清掃用雑巾・工場照明の電球など。製品には入らないが工場を動かすために消費する。\n仕訳）工場消耗品5万円を消費：（借）製造間接費5万円 ／（貸）材料5万円。\nポイント：「製品に入る」→直接材料費（素材・買入部品）、「製品に入らない」→間接材料費（補助材料・工場消耗品）→製造間接費。',
  '消耗工具器具備品': '例）ドリルビット（頻繁に交換）・低価格ノギス・検査用ゲージなど。10万円未満なら固定資産に計上せず費用処理（重要性の原則）。\n仕訳）消耗工具器具備品8万円を使用：（借）製造間接費8万円 ／（貸）材料8万円（または消耗工具器具備品8万円を直接費用化）。\nポイント：10万円以上で1年超使用できるなら固定資産（工具器具備品）→減価償却。未満なら消耗工具器具備品として即時費用処理。',
  '仕掛品': '例）自動車工場でエンジン取付完了・塗装未完了の車体 → 仕掛品として資産計上。\n仕訳）当月製造費用300万円を仕掛品に集計：（借）仕掛品300万円 ／（貸）材料・賃金・製造間接費 各xxx万円。完成時：（借）製品250万円 ／（貸）仕掛品250万円。\nポイント：原価の流れ「材料・賃金・製造間接費 → 仕掛品 → 製品 → 売上原価」。仕掛品は加工が完了していないもの。半製品は外部に売れる状態になったもの。',
  '半製品': '例）自動車部品メーカーのエンジン（完成品として外販もできるし、自社組立にも使える）。外販するかどうかが不明な時点で完成した中間製品。\n仕訳）半製品が完成：（借）半製品100万円 ／（貸）仕掛品100万円。外部に販売：（借）売上原価 ／（貸）半製品100万円。\nポイント：仕掛品との違い→「外部に売れる状態」になったら半製品。完成まで待てないが外販もできる中間品。製品との違い→最終完成品でないもの。',
  '製品': '例）工場で全工程が終わり出荷待ちの完成品。\n仕訳）製品の完成：（借）製品300万円 ／（貸）仕掛品300万円。販売時：（借）売上原価300万円 ／（貸）製品300万円 → 同時に（借）売掛金500万円 ／（貸）売上500万円。\nポイント：製品→販売されると「売上原価（費用）」に振り替わる。期末に残っている製品は棚卸資産（資産）としてB/Sに計上。「製品＝完成品在庫」のイメージ。',
  '副産物': '例）製材業：角材（主製品）を切り出す際に発生するおがくず・端材（副産物）→ 燃料・パーティクルボード原料として売却可。\n会計処理）副産物の評価額（見込み売価－処理費）を主製品の製造原価から控除：（借）副産物XX万円 ／（貸）仕掛品XX万円。\nポイント：副産物の収益は主製品の原価を下げる（原価控除法）。主製品の製造コストを正確に把握するために「意図せず生じた有価物」を分離して評価する。',
  '作業くず': '例）金属プレス加工で生じる鉄くず・木材加工の端切れ → スクラップ業者に売却可能。\n会計処理）作業くず3万円分を回収・評価：（借）作業くず3万円 ／（貸）仕掛品3万円（製品原価を3万円分減額）。売却時：（借）現金3万円 ／（貸）作業くず3万円。\nポイント：副産物との違い→副産物は「意図せず生じる有価な産出物」で量も一定程度ある。作業くずは「加工の端材・廃材」。いずれも製造原価を下げる効果がある。',
  '賃金': '例）工場の製造ラインで働く作業員への月給150万円 → 賃金（製造原価：労務費）。同社の営業事務員への月給100万円 → 給料（販管費）。\n仕訳）賃金150万円を計上：（借）賃金150万円 ／（貸）現金預金150万円。製品への振替：（借）仕掛品100万円・製造間接費50万円 ／（貸）賃金150万円（直接・間接に振り分け）。\nポイント：「工場の人件費」→賃金（製造原価）。「本社・営業所の人件費」→給料（販管費）。同じ「給与」でも発生場所で科目が変わり、損益計算書上の区分も違う。',
  '雑給': '例）工場繁忙期に雇ったアルバイト・パートへの賃金20万円 → 雑給（労務費の一部）として製造原価に含める。\n仕訳）雑給20万円：（借）雑給20万円 ／（貸）現金20万円。製品への振替：（借）製造間接費20万円 ／（貸）雑給20万円（通常は間接労務費）。\nポイント：賃金（正社員）・雑給（パート等）はいずれも労務費。賃金は直接・間接に分かれるが、雑給は一般的に間接労務費として製造間接費に集約する。',
  '従業員賞与手当': '例）工場作業員への夏季賞与50万円・残業手当10万円 → 従業員賞与手当60万円（労務費として製造原価へ）。本社社員のボーナスは「賞与（販管費）」として計上。\n仕訳）従業員賞与手当60万円：（借）製造間接費60万円 ／（貸）現金60万円（間接労務費として一旦製造間接費へ）。\nポイント：工場と本社で同じ賞与でも科目と費用分類が変わる。試験では「工場 vs 本社」の区別を常に意識すること。',
  '製造間接費': '例）工場の電気代30万円・工場長の給与50万円・機械の減価償却費20万円 → すべて製造間接費100万円。製品A（直接作業600時間）・B（400時間）、計1,000時間で配賦：A→60万円・B→40万円。\n仕訳）製造間接費を仕掛品へ配賦：（借）仕掛品100万円 ／（貸）製造間接費100万円。\nポイント：「どの製品のためかわからない費用」→製造間接費→配賦基準（直接作業時間・機械時間等）で按分して各製品に割り振る。直接費は賦課、間接費は配賦、と用語を区別する。',
  '外注加工費': '例）金属部品の熱処理加工を専門業者に委託し50万円を支払い → 外注加工費50万円（製造原価の経費として直接費扱い）。\n仕訳）外注加工費の発生：（借）仕掛品50万円（直接経費として仕掛品へ直接賦課）または（借）製造間接費50万円 ／（貸）買掛金50万円（間接的なら製造間接費へ）。\nポイント：外注加工費は「製造原価の経費」に分類。外部への委託なので「自社の賃金ではない労働力コスト」のイメージ。品質管理・コスト管理の両面で重要な項目。',
  '材料消費価格差異': '例）予定単価1,000円・実際単価1,200円、実際消費量500個 → 材料消費価格差異：（1,200－1,000）×500＝10万円（不利差異：実際＞予定のため費用超過）。\n仕訳）差異の認識：（借）材料消費価格差異10万円（不利）／（貸）材料10万円（※予定単価で仕掛品に計上したため実際単価との差を修正）。期末：（借）売上原価10万円 ／（貸）材料消費価格差異10万円（P/L処理）。\nポイント：価格差異の原因＝「いくらで買ったか」の問題→仕入先値上げ・調達タイミング失敗など。数量差異の原因＝「どれだけ使ったか」の問題→作業員の腕・材料品質など。この区別が差異分析の核心。',
  '材料消費数量差異': '例）製品100個の標準消費量500個・実際消費量550個、標準単価1,000円 → 材料消費数量差異：（550－500）×1,000＝5万円（不利差異：実際消費量＞標準消費量）。\n仕訳）差異の認識：（借）材料消費数量差異5万円 ／（貸）仕掛品5万円（標準量で賦課した仕掛品から余分な使用分を分離）。\nポイント：数量差異の原因＝廃材多発・加工ミス・材料品質不良など「使いすぎ」の問題。管理責任は製造現場（数量差異）vs 購買部門（価格差異）。',
  '賃率差異': '例）予定賃率1,500円/時間・実際賃率1,600円/時間、実際作業時間200時間 → 賃率差異：（1,600－1,500）×200＝2万円（不利差異）。\n仕訳）（借）賃率差異2万円 ／（貸）賃金2万円（予定賃率で計算した額と実際賃金との差額を分離）。\nポイント：賃率差異は「賃金単価の高低」の問題。原因：賃上げ・残業割増増加・正社員 vs アルバイトの比率変化など。作業時間差異は「時間の長短」の問題。',
  '作業時間差異': '例）製品100個の標準作業時間200時間・実際作業時間230時間、予定賃率1,500円/時間 → 作業時間差異：（230－200）×1,500＝4.5万円（不利差異：効率が悪かった）。\n仕訳）（借）作業時間差異4.5万円 ／（貸）賃金4.5万円（標準時間で計算した賃金と実際賃金との差額）。\nポイント：作業時間差異の原因＝機械トラブルによる手待ち・不慣れな作業・工程の流れの悪さなど。改善の責任は製造現場の監督者にある。賃率差異の責任は人事・管理部門。',
  '製造間接費予算差異': '例）基準操業度250時間・固定費予算10万円・変動費率600円/時間。実際操業度200時間の予算許容額＝10万円＋600円×200時間＝22万円。実際発生額24万円 → 予算差異：24万円－22万円＝2万円（不利差異：コスト超過）。\n仕訳）製造間接費差異の認識（期末）：（借）製造間接費予算差異2万円 ／（貸）製造間接費2万円。\nポイント：製造間接費の差異は「予算差異」「能率差異」「操業度差異」の3つに分解される。予算差異は「コスト管理の成否」、能率差異は「作業効率の良否」、操業度差異は「設備稼働率の高低」。',
  '製造間接費能率差異': '例）標準作業時間200時間・実際作業時間220時間、標準配賦率1,000円/時間 → 能率差異：（220－200）×1,000＝2万円（不利差異：余分な間接費が掛かった）。\n仕訳）（借）製造間接費能率差異2万円 ／（貸）製造間接費2万円（実際配賦額と標準配賦額の差）。\nポイント：能率差異は作業効率が悪く余計に時間がかかったせいで間接費が多く配賦された分。標準原価計算では「価格差異・数量（効率）差異」に分けるのが基本。製造間接費も同様に「予算差異（価格相当）・能率差異・操業度差異」に分解する。',
  '製造間接費操業度差異': '例）基準操業度250時間・実際作業時間200時間、固定費率800円/時間 → 操業度差異：（200－250）×800＝4万円（不利差異：設備が遊んだ分の固定費回収不足）。\n仕訳）（借）製造間接費操業度差異4万円 ／（貸）製造間接費4万円。\nポイント：操業度差異は「設備投資の固定費を回収できたか」の差異。生産量が少ないと設備が遊び、固定費（減価償却費・工場賃借料等）が売上に回収されないまま無駄になる。この損失が操業度差異として可視化される。',
  '本社': '例）本社が工場のために材料100万円を現金で購入し工場に送付。\n工場側仕訳：（借）材料100万円 ／（貸）本社100万円（本社からもらったとして本社勘定に計上）。\n本社側仕訳：（借）工場100万円 ／（貸）現金100万円（工場に渡したとして工場勘定に計上）。\n合算時：本社100万円と工場100万円を相殺消去 → 材料100万円・現金100万円だけが残る（実態通り）。\nポイント：本社勘定と工場勘定は「鏡の関係」。一方が増えればもう一方も同額増える。合算時に両者を相殺すればグループ内の内部取引が消える。',
  '工場': '例）本社が工場へ材料100万円を送付。\n本社側仕訳：（借）工場100万円 ／（貸）材料100万円（材料を工場に渡し、工場勘定を増やす）。\n工場側仕訳：（借）材料100万円 ／（貸）本社100万円（本社から受取り、本社勘定を増やす）。\n合算時：工場勘定100万円と本社勘定100万円を相殺消去。\nポイント：工場会計の合算財務諸表作成では①本社・工場勘定の相殺②合算後の残高で財務諸表作成、の2ステップが重要。',
  '月次損益': '例）4月の売上500万円・製造原価350万円・販管費80万円 → 月次損益70万円（黒字）。5月に50万円（赤字）なら「5月に何があったか」を即時把握して改善策を打てる。\n仕訳（工場会計での月次損益振替）：（借）月次損益XX万円 ／（貸）本社XX万円（工場の月次利益を本社へ報告・振替）。\nポイント：月次損益は工業簿記特有の概念。工場では月次で損益を集計し本社に報告する。年度末だけでなく毎月PDCAを回すための管理会計上の指標。',
  '借方': '例）現金100万円を受け取った → 借方：現金100万円（資産の増加）。\nポイント：「借方」は「左」と機械的に覚える。「借りている人が左」と語呂で覚えてもOK。複式簿記では左右必ず同額になる。',
  '貸方': '例）現金100万円を売上として受け取った → 貸方：売上100万円（収益の発生）。\nポイント：「貸方」は「右」。借方と貸方の合計は常に一致する（貸借平均の原則）。',
  '仕訳': '例）商品100万円を現金で仕入れた取引：\n（借方）仕入100万円 ／ （貸方）現金100万円\nという形式で記録する。これが仕訳。まず何が増えて何が減ったかを考える。',
  '複式簿記': '例）商品100万円を現金で販売 → 借方：現金100万円 ／ 貸方：売上100万円。1つの取引を「もらった側（借方）」と「渡した側（貸方）」の2面から記録。単式簿記（家計簿のように収支だけ記録）より情報量が多い。',
  '勘定科目': '例）「現金」「売掛金」「借入金」「売上」「仕入」などがすべて勘定科目。取引を記録するための「ラベル」のようなもの。同じ科目の増減を一か所に集めて残高を把握する。',
  '勘定': '例）「現金」勘定：借方（入金）合計200万円 ／ 貸方（出金）合計150万円 → 残高50万円。T字の左（借方）に入金を、右（貸方）に出金を記録していく。',
  '転記': '例）仕訳帳に「仕入100万円 ／ 現金100万円」を記録 → 総勘定元帳の「仕入勘定」の借方に100万円、「現金勘定」の貸方に100万円をそれぞれ転記（書き写す）。',
  '会計期間': '例）4月1日〜翌年3月31日（3月決算期）や1月1日〜12月31日（12月決算期）が一般的。期首に前期から資産・負債を引き継ぎ、期末に利益を確定して翌期に繰り越す。',
  '貸借平均の原則': '例）試算表を作ったとき借方合計≠貸方合計なら → 仕訳ミスや転記漏れがある証拠。借方＝貸方なら計算は合っている（ただし「借方同士が逆」などの誤りは発見できない）。',
  '仕訳帳': '例）4月1日：仕入100万円・現金100万円。4月3日：現金50万円・売上50万円…と日付順に書き連ねた台帳。「主要簿」のひとつで、日記のように取引を記録する。',
  '総勘定元帳': '例）現金勘定・売掛金勘定・借入金勘定…と科目ごとにページを分けてT字型で増減を記録した帳簿。全科目の残高がわかる。財務諸表の元データ。',
  '補助元帳': '例）売掛金の総勘定元帳残高100万円：A社50万円＋B社30万円＋C社20万円 → 補助元帳（得意先元帳）に取引先別の明細が記録されている。合計が総勘定元帳残高と一致するか確認できる。',
  '現金出納帳': '例）4月1日残高5万円、4月2日売上現金2万円入金、4月3日消耗品現金1万円支出…という形で日々の現金出入りを記録。レジの日計表のような役割。',
  '小口現金出納帳': '例）用度係に2万円を前渡し → 交通費・切手代・文房具代等の支払いを小口現金出納帳に記録 → 支払総額1.5万円を報告 → 小切手1.5万円で補給して2万円に戻す。',
  '商品有高帳': '例）A商品の受入200個（単価1,000円）、払出150個 → 残高50個×単価＝2.5万円。先入先出法や移動平均法で払出単価を計算し売上原価と期末在庫を把握。',
  '受取手形記入帳': '例）A社振出100万円（満期6月30日）・B社振出50万円（満期7月15日）など手形を1枚ずつ記録。満期日の管理・割引・裏書譲渡の追跡に使う。',
  '支払手形記入帳': '例）C社宛50万円（満期5月31日）・D社宛30万円（満期6月15日）など振り出した手形を記録。満期日に資金を用意して決済漏れを防ぐために使う。',
  '仕訳日計表': '例）1日に100枚の伝票があっても、仕訳日計表に科目別に集計してから総勘定元帳へ一括転記することで効率化。伝票1枚ずつ転記するより速い。',
  '貸借対照表': '例）3月31日時点：資産5,000万円（現金・建物等）＝負債3,000万円（借入金等）＋純資産2,000万円（資本金・剰余金等）。B/Sとも呼ばれ、ある瞬間の財政状態のスナップショット。',
  '損益計算書': '例）4月〜3月の1年間：売上高1億円－売上原価7,000万円－販管費2,000万円＋営業外収益100万円－税金300万円＝当期純利益800万円。P/Lとも呼ばれ、1年間の経営成績のレポート。',
  '株主資本等変動計算書': '例）期首の繰越利益剰余金1,000万円 → 当期純利益800万円増加・配当200万円減少 → 期末1,600万円。純資産がどのように増減したかを株主に報告する。',
  '売上総利益': '例）売上高1億円－売上原価7,000万円＝売上総利益3,000万円（粗利30%）。この金額から人件費・家賃等の販管費を払っても利益が残るかを判断する基礎。',
  '営業利益': '例）売上総利益3,000万円－販管費2,000万円（人件費・家賃等）＝営業利益1,000万円。本業でしっかり稼いでいるかを見る重要な指標。',
  '経常利益': '例）営業利益1,000万円＋受取利息20万円－支払利息50万円＝経常利益970万円。本業＋財務活動を含む「普通に会社を運営した結果の利益」。',
  '税引前当期純利益': '例）経常利益970万円＋固定資産売却益50万円－火災損失100万円＝税引前当期純利益920万円。法人税等を計算する前の段階。',
  '当期純利益': '例）税引前当期純利益920万円－法人税等300万円＝当期純利益620万円。これが1年間の「最終的な儲け」。繰越利益剰余金620万円として翌期へ繰り越す。',
  '試算表': '例）すべての勘定の借方・貸方を集計して試算表を作成 → 借方合計1億円＝貸方合計1億円 → 転記は正しい。不一致なら転記漏れ・金額誤りを探す。',
  '合計試算表': '例）現金勘定：借方合計200万円・貸方合計150万円（残高は200万円－150万円＝50万円だが直接は見えない）。転記の正確性確認が主な目的。',
  '残高試算表': '例）現金勘定残高50万円・売掛金残高100万円・借入金残高300万円…と各科目の現時点の残高のみを列挙。貸借対照表・損益計算書作成に直接使える形式。',
  '合計残高試算表': '例）現金勘定：借方合計200万円・貸方合計150万円・残高50万円（差引）の3つの数字が一行に並ぶ。三種類の試算表の中で最も詳細な情報を持つ。',
  '精算表': '例）8桁精算表（試算表→修正記入→損益計算書→貸借対照表の4列×借方貸方2＝8桁）。試算表の各残高に決算整理（未払費用・前払費用等の修正）を加えて財務諸表を導く。',
  '三分法': '例）商品100万円を仕入れ：仕入100万円（費用）。商品を150万円で売上：売上150万円（収益）。期末に残った商品20万円：繰越商品20万円（資産）。売上原価は決算整理で計算。',
  '分記法': '例）原価80万円の商品を100万円で販売 → 現金100万円・商品80万円（減少）・商品売買益20万円。毎回原価計算が必要なため実務では三分法が優先される。',
  '売上原価対立法': '例）原価80万円の商品を100万円で販売 → 売上100万円を計上すると同時に売上原価80万円（費用）と商品（在庫）80万円（減少）も記録。在庫管理システムとの連動に適している。',
  'しくりくりし': '例）①仕入（借方）＋期首繰越商品（貸方：期首在庫を仕入へ振替）→②繰越商品（借方）＋仕入（貸方：期末在庫を仕入から外す）→ 残った仕入の残高が売上原価になる。\nポイント：「仕入に期首在庫を足し、そこから期末在庫を引く」という順序で売上原価を計算する手順。',
  '棚卸': '例）帳簿上100個のはずが実地で数えたら97個 → 差の3個分が棚卸減耗損（紛失・盗難等による損失）として費用計上される。年1回（決算期）以上行うことが原則。',
  '先入先出法': '例）4月に100円で100個・5月に120円で100個仕入れ。6月に150個払出し → 先に買った100円のもの100個＋120円のもの50個＝払出金額16,000円（平均110.7円/個×150個より少し安い計算結果になる場合もある）。',
  '移動平均法': '例）残高100個×100円に追加で100個×120円を仕入れ → 新平均単価：（100万円＋120万円）÷200個＝110円/個。以後この110円で払出計算。',
  '低価法': '例）原価1,000円の商品の時価が750円に下落 → 低価法適用：750円に評価減（商品評価損250円を計上）。「利益は慎重に、損失は早めに」が保守主義の原則。',
  '約束手形': '例）A社がB社宛に「3か月後に100万円払います」という手形を振り出す → A社が振出人（義務者）・B社が受取人。A社が約束して自分で払う約束手形。',
  '為替手形': '例）A社（振出人）がC社（支払人）に「B社（受取人）へ100万円払ってください」と依頼する手形。C社の引受けで効力発生。3者が関係する複雑な手形。',
  '手形の裏書譲渡': '例）B社がA社から受け取った手形（100万円）を、C社への仕入代金としてC社に裏書譲渡 → C社が満期日にA社から100万円を受け取る。B社は現金なしにC社への支払ができる。',
  '手形の割引': '例）3か月後満期の100万円の手形を今すぐ銀行に持ち込み、割引料3万円を引かれ97万円を受取 → 手形売却損3万円（費用）。「早めにお金にする代わりに手数料を払う」。',
  '不渡り': '例）A社振出の100万円の手形を持ってB社が銀行に呈示 → A社の口座残高不足で決済不能（不渡り）→ 受取手形を不渡手形に振替・貸倒引当金設定。A社の信用は失墜。',
  '電子記録債権・債務': '例）売掛金100万円の請求代わりに電子記録機関に「A社はB社へ100万円を支払う義務あり」と登録 → A社は電子記録債務（負債）・B社は電子記録債権（資産）が発生。',
  '有形固定資産': '例）建物・機械装置・備品・車両・土地がすべて有形固定資産。土地以外は使えば使うほど価値が下がるとみなして毎年「減価償却費」を計上。土地は永続するので償却しない。',
  '無形固定資産': '例）特許権・商標権・のれん・ソフトウェア・創立費（繰延資産）などが無形固定資産。見えないけれど価値がある。耐用年数にわたって均等に費用配分（償却）する。',
  '取得原価': '例）機械本体代900万円＋運送費20万円＋据付試験費30万円＝取得原価950万円。以後、950万円を基準に耐用年数で均等償却。購入後の修繕費は含まない。',
  '帳簿価額': '例）機械（取得原価1,000万円）を5年使用、年200万円償却 → 減価償却累計額1,000万円 → 帳簿価額ゼロ（使い切り）。800万円で売ったら固定資産売却益800万円（全額利益）。',
  '耐用年数': '例）建物（耐用年数30年）→ 毎年取得原価の1/30を減価償却費として計上。税法上の法定耐用年数（建物RC造47年、木造22年等）が一般的な目安。',
  '定額法': '例）取得原価1,000万円・耐用年数10年の機械 → 毎年100万円の減価償却費（1,000万円÷10年）。最終年まで毎年同じ金額。計算が単純でわかりやすい。',
  '定率法': '例）取得原価1,000万円・定率法率20% → 1年目：200万円（1,000万円×20%）、2年目：160万円（800万円×20%）、3年目：128万円…と年々減少。最初の費用が大きい。',
  '間接法': '例）機械1,000万円・累計額200万円を間接法でB/S表示：機械1,000万円（取得原価）－減価償却累計額200万円＝帳簿価額800万円。取得原価がわかるため管理に便利。',
  '資本的支出': '例）老朽化した機械に新機能を追加する改造費500万円 → 資本的支出：機械の帳簿価額500万円増加。雨漏り修繕費50万円 → 収益的支出：修繕費（費用）として即時計上。\nポイント：「グレードアップ」→ 資本的支出（資産）、「元通りに直す」→ 収益的支出（費用）。',
  '収益的支出': '例）事務所の壁の塗り替え30万円（劣化した外壁を元通りにするだけ）→ 収益的支出：修繕費30万円（費用）として当期計上。価値が上がっていないので資産に加えない。',
  'ファイナンス・リース': '例）5年間解約不可・支払総額300万円（利息相当30万円含む）のコピー機リース。\n仕訳①契約時：（借）リース資産270万円 ／（貸）リース債務270万円（元本相当）。\n仕訳②毎年の支払い（元本54万円＋利息6万円＝60万円）：（借）リース債務54万円＋支払利息6万円 ／（貸）現金60万円。\n仕訳③毎年の減価償却：（借）減価償却費54万円 ／（貸）リース資産54万円（270万円÷5年）。\nポイント：ファイナンスリース→「資産計上・債務計上・減価償却」の3点セット。オペレーティングリース→「支払リース料（費用）のみ」。解約不能＋フルペイアウトがファイナンスリースの2要件。',
  'オペレーティング・リース': '例）1年更新で解約可能な複合機のリント月額3万円。1年36万円を費用計上するだけ。\n仕訳）月次：（借）支払リース料3万円 ／（貸）現金3万円。資産ゼロ・負債ゼロ・減価償却なし。\nポイント：ファイナンスリース→資産＋負債がB/Sに出てくる（「オフバランス」にならない）。オペレーティングリース→B/Sに計上されない（「オフバランス」）。リース会計の目的は「経済的実態をB/Sに反映させる」こと。',
  '圧縮記帳': '例）補助金3,000万円で5,000万円の設備取得。圧縮記帳しない場合：補助金収益3,000万円がそのまま当期課税対象。圧縮記帳する場合：\n仕訳①補助金受取：（借）現金3,000万円 ／（貸）国庫補助金受贈益3,000万円（収益）。\n仕訳②固定資産取得：（借）機械5,000万円 ／（貸）現金5,000万円。\n仕訳③圧縮記帳：（借）固定資産圧縮損3,000万円 ／（貸）機械3,000万円（帳簿価額2,000万円に圧縮）→補助金収益と圧縮損が相殺されて当期課税ゼロ。以後2,000万円ベースで減価償却。\nポイント：圧縮記帳は「課税の繰延べ（免除ではない）」。減価償却が少なくなるため将来に課税所得が増える仕組み。',
  '減損会計': '例）工場（帳簿価額5億円）が不採算になり、①売却価値（正味売却価額）3億円・②将来キャッシュフローの現在価値（使用価値）3.5億円と判定。回収可能価額＝max（3億円、3.5億円）＝3.5億円。\n仕訳）（借）減損損失1.5億円（5億円－3.5億円）／（貸）固定資産1.5億円（帳簿価額を3.5億円に切下げ）。以後3.5億円ベースで残存耐用年数にわたり減価償却。\nポイント：減損の判定手順①「減損の兆候（収益性の著しい低下等）」があるか→②「減損損失の認識（割引前CF＜帳簿価額）」か→③「回収可能価額まで切下げ（減損損失の測定）」。この3ステップが試験の核心。',
  '回収可能価額': '例）機械の帳簿価額5億円に対し：正味売却価額3億円・使用価値4億円 → 回収可能価額は高い方の4億円 → 帳簿価額5億円－回収可能価額4億円＝減損損失1億円を計上。',
  'その他有価証券': '例）取引先との関係維持のため長期保有する株式。決算時に値上がりしても損益計算書の利益は増やさず、貸借対照表の純資産（その他有価証券評価差額金）を増やす。',
  '洗替法': '例）取得原価1,000円の有価証券が期末時価1,200円。評価益200円を計上。\n仕訳①期末：（借）有価証券200円 ／（貸）有価証券評価益200円（P/L）。\n仕訳②翌期首（洗替え）：（借）有価証券評価益200円 ／（貸）有価証券200円（取得原価1,000円に戻す）。\n翌年末時価1,100円なら：評価益は100円（1,100－1,000）のみ認識。\nポイント：洗替法→「毎期独立して時価と取得原価の差を計算」。切放法→「前期末時価をそのまま翌期の帳簿価額に引き継ぎ」。売買目的有価証券は洗替法が原則。',
  '切放法': '例）取得原価1,000円→期末時価800円（評価損200円計上）→切放法なら800円が翌期の帳簿価額。\n仕訳①期末評価損：（借）有価証券評価損200円 ／（貸）有価証券200円（800円に切下げ）。\n翌期首：仕訳なし（800円が帳簿価額のまま）。\n翌年末時価750円なら：評価損は50円（750－800）のみ認識（前期の評価損200円は戻らない）。\nポイント：切放法→「低下したコストは戻らない」保守主義的方法。特に「その他有価証券」の評価損に適用される（損失を積み重ねて資産を保守的に評価）。洗替法と切放法のどちらを使うか問題が出る。',
  '償却原価法': '例）額面100万円の社債を96万円で取得・4年満期保有。差額4万円÷4年＝毎年1万円を受取利息に加算。\n仕訳①取得：（借）満期保有目的債券96万円 ／（貸）現金96万円。\n仕訳②毎年（利払い＋償却原価法）：（借）現金3万円（クーポン3%）＋満期保有目的債券1万円 ／（貸）受取利息4万円（名目3万円＋償却分1万円）。\n4年後：帳簿価額100万円（96＋1×4）で満期償還。\nポイント：償却原価法の仕訳で「債券の帳簿価額が毎年増加（割引取得の場合）」または「毎年減少（プレミアム取得の場合）」することを理解する。受取利息の金額が名目金額より多い（割引）または少ない（プレミアム）点が特徴。',
  '全部純資産直入法': '例）その他有価証券（取得原価100万円）が期末時価80万円（評価損20万円）。税率30%。\n仕訳（全部純資産直入法）：（借）その他有価証券評価差額金14万円（純資産マイナス）＋繰延税金資産6万円（税効果） ／（貸）投資有価証券20万円（評価損）。\nP/Lには損益計上なし。B/Sの純資産が14万円減る。\nポイント：全部純資産直入法→評価損益ともにP/Lをスルーして直接純資産へ。部分純資産直入法→評価益は純資産へ、評価損はP/Lへ（保守主義）。',
  '部分純資産直入法': '例）その他有価証券（取得原価100万円）が期末時価80万円（評価損20万円）。税率30%。\n仕訳（部分純資産直入法）：（借）投資有価証券評価損20万円（P/L費用）＋繰延税金資産6万円 ／（貸）投資有価証券20万円。法人税等調整額△6万円（節税効果）を計上。\nポイント：全部vs部分の違い→評価損をP/Lに出すか出さないか。部分法は「損は早めに認識（保守主義）」という考え方。試験では「どちらを使うかで当期利益が変わる」点がポイント。',
  '引当金': '例）賞与引当金：7月ボーナスの当期分を3月決算で先取り費用計上。製品保証引当金：アフターサービス費用の見込みを計上。貸倒引当金：回収不能の見込みを計上。退職給付引当金：将来の退職金の当期発生分を計上。\n引当金設定の4要件：①将来の特定費用・損失 ②発生が確実（高い確率） ③当期以前の事象による ④金額が合理的に見積もれる\nポイント：4要件を全て満たさないと引当金設定不可。「偶発債務（確率が低い）」→注記にとどめる（引当金にはしない）。引当金の設定・取崩しの仕訳パターンを確実に習得すること。',
  '評価勘定': '例）売掛金100万円に対する貸倒引当金2万円（評価勘定）→ B/S表示：売掛金100万円－貸倒引当金2万円＝回収見込98万円。取得原価を変えずに実態を見せる工夫。',
  '差額補充法': '例）貸倒引当金の必要額20万円・現在残高8万円。\n差額補充法：不足額12万円だけ追加：（借）貸倒引当金繰入12万円 ／（貸）貸倒引当金12万円。\n洗替法なら：①（借）貸倒引当金8万円 ／（貸）貸倒引当金戻入8万円。②（借）貸倒引当金繰入20万円 ／（貸）貸倒引当金20万円。\nポイント：差額補充法→「足りない分だけ補充」→仕訳が少ない（実務向き）。洗替法→「全額取り崩してから再設定」→計算が明確になる（試験では洗替法の問題が多い）。どちらを使うかを問題文で確認。',
  '洗替法（引当金）': '例）前期末貸倒引当金10万円（洗替法）。\n翌期首洗替：（借）貸倒引当金10万円 ／（貸）貸倒引当金戻入10万円（全額取崩し→収益）。当期末に必要額15万円を再設定：（借）貸倒引当金繰入15万円 ／（貸）貸倒引当金15万円。\nP/L：貸倒引当金繰入15万円（費用）－貸倒引当金戻入10万円（収益）＝実質5万円の純費用増加。\nポイント：「洗替法」の問題では翌期首の「戻し入れ仕訳」を忘れないこと。差額補充法では戻し入れ仕訳は不要。試験では洗替法が多く出題される。',
  '純資産': '例）B/S：資産5,000万円－負債3,000万円＝純資産2,000万円。内訳：資本金500万円＋資本準備金500万円＋利益準備金100万円＋繰越利益剰余金950万円＋その他有価証券評価差額金△50万円（評価損）＝純資産2,000万円。\nポイント：純資産の構成→①株主資本（資本金・資本剰余金・利益剰余金・自己株式）＋②評価・換算差額等（その他有価証券評価差額金等）＋③新株予約権。「株主に帰属するもの（株主資本）」と「評価差額等」は別区分で表示する。',
  '法定準備金': '例）配当のたびに利益準備金を強制積立（配当金の10%・資本金×1/4まで）。資本準備金は株式発行時の超過払込分を積立。法律で「使ってはいけない（簡単には）」と定められた留保。',
  '任意積立金': '例）「将来の新工場建設のために毎期500万円の新築積立金を積み立てる」という決議 → 任意積立金。法定準備金と違い、必要になればいつでも取り崩せる（株主総会決議が必要）。',
  '株主資本': '例）株主資本＝資本金500万円＋資本準備金500万円＋繰越利益剰余金1,000万円－自己株式100万円＝1,900万円。「株主が実質的に持っているもの」。',
  '配当': '例）株主総会で1株50円・発行済み200万株の配当決議→配当総額1億円。同時に利益準備金として配当額の10%（1,000万円）を強制積立（資本金×1/4に達するまで）。\n仕訳①決議時：（借）繰越利益剰余金1.1億円 ／（貸）未払配当金1億円＋利益準備金1,000万円。\n仕訳②支払時：（借）未払配当金1億円 ／（貸）現金1億円。\nポイント：配当と同時に「利益準備金の積立（配当額×1/10）」が義務。利益準備金＋資本準備金が「資本金×1/4」に達したら積立不要。中間配当（年1回の決算前の仮配当）の場合は取締役会決議で実施可能。',
  '増資': '例）増資で新株1万株（1株1,000円・払込金額1,000万円）を発行し普通預金へ入金。\n仕訳①払込受取：（借）別段預金1,000万円（申込証拠金として専用口座）／（貸）株式申込証拠金1,000万円（負債）。\n仕訳②払込完了・資本組入：（借）株式申込証拠金1,000万円 ／（貸）資本金500万円（払込額の1/2以上を資本金）＋資本準備金500万円（残りを資本準備金）。同時：（借）普通預金1,000万円 ／（貸）別段預金1,000万円。\nポイント：払込額の1/2以上を資本金に組入れ、残りは資本準備金（会社法の規定）。別段預金→専用口座（払込確認まで普通口座に混在させない）。払込完了後に普通預金へ。',
  '発生主義': '例）3月分の家賃10万円が4月に支払われる場合 → 発生主義：3月末に未払費用10万円・支払家賃10万円を計上（現金は動いていないが3月の費用）。現金主義なら4月に費用計上。',
  '現金主義': '例）3月分の家賃10万円を4月に支払 → 現金主義：4月に支払家賃10万円（費用）。シンプルだが「3月分費用が4月計上」というズレが生じ、企業会計には向かない。',
  '費用収益対応の原則': '例）今期売れた商品の仕入原価（売上原価）と今期の売上高は同じ期に計上 → 売上総利益が正確に計算できる。退職給付費用を毎期積み立てるのも「今働いている従業員の費用は今期に」という同原則の適用。',
  '継続性の原則': '例）定額法で5年間減価償却していた機械を突然定率法に変更 → 過去との比較が難しくなり利益操作に使われる恐れ。変更する場合は正当な理由と注記開示が必要。',
  '保守主義の原則': '例）低価法（時価が下がれば評価損を計上する）・貸倒引当金（回収リスクを早めに認識）・引当金一般。「良い情報は控えめに、悪い情報は早めに」。ただし過度な保守は誤りにもなる。',
  '重要性の原則': '例）100円のボールペンを「消耗品（資産）」に計上せず「消耗品費（費用）」として即時処理 → 重要性の原則の適用。少額なら厳密な棚卸資産処理は不要。',
  '繰延資産': '例）創立費・開業費・株式交付費・社債発行費・開発費の5種類が会社法・会計基準で認められる繰延資産。「お金を使ったが、その効果は将来に及ぶ」ということで資産として繰延べ、毎期少しずつ費用化。',
  '消費税（税込処理）': '例）商品1,100円（うち消費税100円）を現金で販売 → 税込処理：現金1,100円 ／ 売上1,100円（消費税込み）。期末に「売上に含まれている消費税」と「仕入に含まれている消費税」の差を計算して申告。',
  '消費税（税抜処理）': '例）商品1,100円（税込）を販売 → 税抜処理：現金1,100円 ／ 売上1,000円・仮受消費税100円（負債）。消費税を分けることで売上高が正確（税抜の本体価格のみ）に把握できる。',
  '税効果会計': '例）会計利益1,000万円・税務上の課税所得1,200万円（差異200万円：貸倒引当金超過が原因）、税率30%。\n実際納税額：1,200万円×30%＝360万円。繰延税金資産：200万円×30%＝60万円を計上。\n仕訳）（借）繰延税金資産60万円 ／（貸）法人税等調整額60万円（法人税等を60万円減らす）。\nP/L：法人税等360万円 ／ 法人税等調整額△60万円 → 実効税負担300万円（1,000万円×30%）。\nポイント：税効果会計の目的は「会計利益×税率＝P/L上の税金負担」にすること。繰延税金資産は「払いすぎた税金の将来返金」のイメージ。繰延税金負債は「まだ払っていない税金の将来支払い」のイメージ。',
  '一時差異': '例①将来減算一時差異）貸倒引当金20万円（会計費用→税務：今期認めない→将来認定）→繰延税金資産（将来節税）。\n例②将来加算一時差異）その他有価証券評価益100万円（会計収益→税務：売却時に課税）→繰延税金負債（将来税負担増）。\n例③永久差異）交際費超過額50万円（永遠に損金不算入）→税効果会計の対象外。\nポイント：一時差異＝「時期のズレ（将来に解消）」→税効果会計の対象。永久差異＝「永遠に解消されないズレ」→税効果会計の対象外。この区別が一時差異理解の核心。',
  '法人税の中間申告': '例）前期法人税200万円 → 中間申告：100万円を仮払い（仮払法人税等として資産計上）。期末確定税額が250万円なら → 未払法人税等150万円（250万円－100万円）を計上。',
  '繰越欠損金': '例）今期の税務上の欠損1,000万円→繰越欠損金1,000万円として税務上繰り越す。税効果：繰延税金資産1,000万円×30%＝300万円を計上（回収可能性の判断が必要）。\n仕訳）（借）繰延税金資産300万円 ／（貸）法人税等調整額300万円。翌期課税所得800万円：800万円×30%＝240万円から繰越欠損金800万円を使い→課税所得ゼロ→法人税ゼロ。繰延税金資産240万円を取崩し。\nポイント：繰越欠損金の繰延税金資産は「将来利益が出た時に使える節税カード」。ただし「回収可能性（将来利益が出るかどうか）」が不確かなら資産計上できない。この判断が試験で問われる。',
  '入金伝票': '例）商品100万円を現金で販売 → 入金伝票に「売上100万円」と記録。現金の入金がある取引のみに使用する。出金は出金伝票、現金以外の取引は振替伝票を使う。',
  '出金伝票': '例）消耗品5,000円を現金で購入 → 出金伝票に「消耗品費5,000円」と記録。現金の出金がある取引のみに使用。',
  '振替伝票': '例）商品100万円を掛けで仕入れた → 振替伝票に「仕入100万円 ／ 買掛金100万円」と記録。現金が動かない取引はすべて振替伝票。',
  '本支店会計': '例）本店が支店に商品100万円（原価80万円）を送付。\n本店仕訳：（借）支店100万円 ／（貸）仕入（商品）80万円＋内部利益20万円（内部利益を計上）。\n支店仕訳：（借）仕入100万円 ／（貸）本店100万円（本店から受け取ったとして処理）。\n合算時の消去：①本店勘定↔支店勘定を相殺消去。②内部利益20万円を消去（本店→支店の未実現利益）。\nポイント：本支店会計の合算処理で最重要なのは「内部利益の消去」。支店がまだ外部に売っていない商品に含まれる本店から付けた利益は合算時に消去する。',
  '内部取引の消去': '例）本店の支店勘定100万円（本店B/Sの資産）と支店の本店勘定100万円（支店B/Sの負債）を相殺消去。\n合算仕訳：（借）本店勘定100万円 ／（貸）支店勘定100万円（双方消去）。\n消去しないと：合算B/Sに架空の「資産100万円・負債100万円」が残り、財務諸表が膨らむ（実態と異なる）。\nポイント：本支店会計の合算で必ず行う消去は①本店勘定↔支店勘定の相殺②内部利益の消去（未達取引があれば追加記帳後に消去）。「内部の貸し借りを外から見えないようにする」作業。',
  '未達取引': '例）本店が支店へ商品50万円を発送・本店は記帳済み。支店には届いていない（未達）。\n合算前の処理（支店側）：（借）仕入50万円 ／（貸）本店50万円（支店が受取ったとして記帳）→これで本店・支店双方の帳簿が対応する。\n→通常の内部取引消去を実施：本店勘定50万円↔支店勘定50万円を相殺。\nポイント：未達取引の処理手順：①未達側で「受け取ったor支払ったとして」仕訳追加→②通常の内部取引消去を実施。「合算前に未達を解消してから相殺」が正しい手順。',
  '内部利益': '例）本店が原価80万円の商品を100万円で支店へ売却。支店はまだ外部に未販売（在庫中）。\n内部利益：20万円（100万円－80万円）が支店の在庫に含まれている。\n合算時の消去仕訳：（借）本店売上100万円 ／（貸）支店仕入100万円（売上・仕入の相殺）。（借）内部利益20万円 ／（貸）支店商品20万円（在庫の過大評価部分を消去）。\n消去後：支店の在庫は原価80万円（実態）に修正される。\nポイント：内部利益は「グループ外部への販売が完了するまで利益として認められない」。支店が外部に販売した時点で初めて利益が実現→その時点で内部利益消去を取消す（期首内部利益の反転）。',
  '原価計算': '例）製品A1個の原価計算：直接材料費500円（鉄板：素材費）＋直接労務費300円（加工作業員賃金）＋製造間接費配賦額200円（工場電気代・工場長給与等の按分）＝製品原価1,000円。販売価格1,500円→粗利500円。\nポイント：製造原価の3要素：①材料費（モノのコスト）②労務費（ヒトのコスト）③経費（上記以外のコスト）。それぞれを「直接費（製品への直接賦課）」と「間接費（配賦が必要）」に分類する二次元の分類が原価計算の基本骨格。',
  '原価の3要素': '例）自動車1台の製造原価：\n材料費60万円（鋼板・タイヤ・バッテリー等）\n＋労務費30万円（工場作業員の賃金・賞与・法定福利費）\n＋経費20万円（機械減価償却費・工場電気代・外注加工費等）\n＝製造原価110万円\nポイント：材料費は「モノを使う」コスト。労務費は「人が働く」コスト。経費は「それ以外のすべて（機械・光熱費・外注等）」のコスト。各費用を直接費・間接費に分けることで、仕掛品への賦課と製造間接費への集約が決まる。',
  '直接費': '例）製品Aに使った鉄板（直接材料費）・製品Aの製造ラインで働いた作業員の賃金（直接労務費）など。どの製品のために使ったかが明確にわかる費用が直接費。',
  '間接費': '例）工場全体の電気代・工場長の給与・機械の減価償却費など → 間接費。製品A・B・Cに何%ずつ使ったかわからないため、作業時間比率などで各製品に配賦（割り振り）。',
  '配賦': '例）製造間接費100万円を直接作業時間（製品A：60時間・製品B：40時間、合計100時間）で配賦 → A：60万円・B：40万円を各製品原価に加算。「面積比・人数比」など合理的な基準を選ぶ。',
  '予定配賦': '例）年度初めに「直接作業時間1時間当たり1,000円の製造間接費を配賦する」と設定（予定配賦率）。実際に作業した時間×1,000円で月次に製品原価を計算。期末に実際発生額との差（配賦差異）を調整。',
  '配賦差異': '例）予定配賦額100万円・実際発生額110万円 → 配賦差異10万円（不利差異：追加計上が必要）。年度末に製造間接費勘定の残高として把握し売上原価等に振替えて処理。',
  '個別原価計算': '例）建築・造船・特注機械→製品ごとに「製造指図書№001」のように番号をつけて原価を集計。\n№001の指図書：直接材料費200万円＋直接労務費100万円＋製造間接費配賦額80万円（作業時間基準）＝製品原価380万円。\n仕訳）製造指図書№001の完成：（借）製品380万円 ／（貸）仕掛品380万円（指図書別集計額を製品へ）。\nポイント：個別原価計算→「一品一様」の受注生産向け。各指図書が独立した原価計算対象。対比：総合原価計算→「同一品種の大量連続生産」向け。どちらの方法を使うかは生産形態で決まる。',
  '総合原価計算': '例）月産1万本の飲料水。月間製造費用：材料費500万円＋労務費300万円＋製造間接費200万円＝1,000万円。月末仕掛品（加工進捗50%）が1,000本。完成品換算量：完成品9,000本＋仕掛品500本（1,000本×50%）＝9,500本。単位原価1,000万円÷9,500本≒1,053円/本。\nポイント：総合原価計算の核心は「月末仕掛品をどう評価するか」。材料費は投入時点で全量計上→進捗度関係なし。加工費は進捗度に応じて計算→完成品換算量を使う。この区別が必出。',
  '標準原価計算': '例）製品1個の標準原価：材料費（標準単価1,000円×標準消費量0.5kg）500円＋賃金（標準賃率1,500円×標準時間0.2時間）300円＋製造間接費200円＝1,000円/個。実際原価が1,100円→差異100円。\n差異の分解：材料費差異（価格差異＋数量差異）、労務費差異（賃率差異＋作業時間差異）、製造間接費差異（予算差異＋能率差異＋操業度差異）に分解して原因を特定。\n仕訳）仕掛品は標準原価で計上：（借）仕掛品1,000円 ／（貸）材料500円・賃金300円・製造間接費200円。差異は別科目で管理。\nポイント：標準原価計算は「目標管理ツール」。差異を分析して改善の方向性を示す。差異の借方（不利差異）・貸方（有利差異）の区別を確実に押さえること。',
  '不利差異': '例）材料を予定より高く仕入れた（価格上昇）・作業ミスで材料を無駄遣いした（使用量超過）→ 不利差異。借方差異ともいい、製造コストが想定以上にかかった証拠。',
  '有利差異': '例）材料を予定より安く仕入れられた・作業効率が上がって時間が短縮できた → 有利差異（貸方差異）。「良いことだが、なぜ良かったのか」の原因分析も重要。',
  'CVP分析': '例）固定費200万円・変動費率60%（売上高の60%が変動費）。\n①損益分岐点売上高＝固定費÷（1－変動費率）＝200万円÷0.4＝500万円。\n②目標利益100万円のための売上高＝（固定費＋目標利益）÷限界利益率＝（200万円＋100万円）÷0.4＝750万円。\n③安全余裕率：実際売上600万円の場合＝（600万円－500万円）÷600万円≒16.7%。\nポイント：CVP分析では「限界利益率＝1－変動費率」が核心。「売上高1円増えたら利益が何円増えるか」が限界利益率。試験では①損益分岐点売上高②目標利益売上高③安全余裕率の3つの計算が頻出。',
  '損益分岐点': '例）固定費200万円・変動費率60%（1個売るたびに売価の60%が変動費として発生）。\n損益分岐点売上高＝200万円÷（1－0.6）＝500万円。\n損益分岐点販売量（単価2,000円なら）＝500万円÷2,000円＝2,500個。\n確認：売上500万円・変動費300万円（60%）・固定費200万円→利益＝0円 ✓\nポイント：損益分岐点は「固定費÷限界利益率」で求める。固定費が増えると損益分岐点が上昇（高い売上が必要になる）。変動費率が低いほど（限界利益率が高いほど）損益分岐点が下がる。',
  '貢献利益': '例）製品A：単価2,000円・単位変動費1,200円→単位貢献利益800円。月間1,000個販売→貢献利益80万円。固定費60万円→営業利益20万円。\n追加受注の意思決定：変動費1,200円以上の価格なら受注すべき（固定費はすでに発生しているため）。単価1,500円の特別受注→単位貢献利益300円でプラスになるから受注OK。\nポイント：貢献利益（限界利益）は「固定費をまず回収し、その後が利益になる」という考え方。短期の意思決定（追加受注・製品廃止）は「変動費が回収できるか」で判断→固定費は埋没原価として無視する。',
  '直接原価計算': '例）直接原価計算の損益計算書：\n売上高1,000万円\n－変動売上原価600万円（変動製造原価のみ）\n＝限界利益400万円\n－固定製造間接費200万円（一括期間費用）\n－固定販管費50万円\n＝営業利益150万円\nポイント：直接原価計算→固定費を期間費用に→在庫が増えても利益に影響しない→経営管理・意思決定に使う（内部向け）。全部原価計算→固定費を製品原価に→外部財務報告に使う（外部向け）。財務報告では直接原価計算は使えない（制度会計では全部原価計算が必要）。',
  '全部原価計算': '例）全部原価計算での固定費300万円の処理：製品原価に含める→在庫100万円増加の中に固定費30万円が含まれる→P/Lに計上されない（在庫の中に留まる）→利益が30万円多く見える。\n直接原価計算なら→固定費300万円を全額当期費用に→利益は30万円少なくなる。\nポイント：「全部原価計算の営業利益＞直接原価計算の営業利益」の場合は期末在庫増加（固定費が在庫に隠れている）。この差が「固定費調整」。試験では固定費調整の計算（直接原価→全部原価の利益換算）が頻出。',
  '固定費調整': '例）直接原価計算の営業利益800万円。期末在庫に含まれる固定費150万円（全部原価計算では費用化されていない）、期首在庫に含まれる固定費100万円（全部原価計算では当期費用化）。\n固定費調整：800万円＋150万円（期末在庫の固定費を加算）－100万円（期首在庫の固定費を控除）＝全部原価計算の営業利益850万円。\nポイント：固定費調整の方向→「直接→全部：期末在庫固定費を加算・期首在庫固定費を控除」。記憶法：「期末に固定費が在庫に残っている＝利益がその分多い（全部）」「期首の固定費が当期に出てくる＝利益がその分少ない（全部）」。',
  '製造原価報告書': '例）製造原価報告書：\n直接材料費2,000万円＋間接材料費200万円＝材料費2,200万円\n直接労務費1,500万円＋間接労務費300万円＝労務費1,800万円\n製造間接費（その他経費）1,000万円\n＝当期製造費用5,000万円\n＋期首仕掛品200万円\n－期末仕掛品300万円\n＝当期製品製造原価4,900万円\nポイント：製造原価報告書→損益計算書→B/Sの流れを把握。「当期製品製造原価」がP/Lの「売上原価」の計算に入っていく。売上原価＝期首製品在庫＋当期製品製造原価－期末製品在庫。',
  '当期製品製造原価': '例）期首仕掛品原価200万円＋当期製造費用5,000万円＝当期製造に関する費用合計5,200万円。そこから期末仕掛品原価300万円を引く＝当期製品製造原価4,900万円（完成して製品在庫になった分）。\nP/Lの売上原価：期首製品在庫400万円＋当期製品製造原価4,900万円－期末製品在庫500万円＝売上原価4,800万円。\nポイント：製造業の原価計算の「最終目標値」が当期製品製造原価。これを求めるために製造原価報告書を作成する。仕掛品（未完成）と製品（完成品）の期首・期末の調整が計算のポイント。',
  '完成品換算量': '例）月末仕掛品100個・加工進捗度60%→加工費の完成品換算量60個（100個×60%）。材料費は投入時点で全量投入（進捗度関係なし）→月末仕掛品100個のままで計算。\n加工費の配分：（完成品1,000個＋月末仕掛品換算量60個）で総加工費を按分。月末仕掛品への加工費＝総加工費×60÷1,060。\nポイント：材料費は「投入タイミング（工程の始点・終点・均等等）」で按分するため換算量は使わない場合が多い。加工費は「どれだけ加工したか（進捗度）」で按分するため換算量を使う。この区別が総合原価計算の核心。',
  '月末仕掛品の評価': '例）当月製造費用1,000万円、期首仕掛品原価100万円、完成品1,000個、月末仕掛品100個（進捗度50%→換算量50個）。\n平均法：総原価1,100万円÷（1,000個＋50個）＝1,048円/個（換算量1個当たり）。月末仕掛品原価＝1,048円×50個＝5.24万円。完成品原価＝1,100万円－5.24万円＝1,094.76万円。\n先入先出法：期首仕掛品は先に完成したとして計算→月末仕掛品の原価は当月費用のみから算定。\nポイント：平均法→「期首＋当月」で平均→計算がシンプル。先入先出法→「期首と当月を分けて計算」→当月の成果が純粋に見える。試験では平均法が多く出題される。',
  '等級別総合原価計算': '例）同一工程で特大・大・小サイズのシャツを製造。等価係数：特大1.5・大1.0・小0.7に設定（コストの比率）。各等級の完成品数：特大200枚・大500枚・小800枚。\n積数（等価係数×完成品数）：特大300・大500・小560＝合計1,360。総合原価13,600円÷1,360×各積数で各等級の原価を算定。特大原価：13,600円×300÷1,360＝3,000円→1枚15円。\nポイント：等価係数は「単位当たりのコスト比」。積数（等価係数×生産量）で総原価を按分する。',
  '組別総合原価計算': '例）同一工場でシャンプーとリンスを製造（組A：シャンプー・組B：リンス）。直接材料費：A組500万円・B組300万円。製造間接費200万円を直接材料費比率（5：3）で配賦：A組125万円・B組75万円。\n各組の製造原価：A組625万円・B組375万円。\nポイント：等級別→同じ製品を大中小に分ける（量的差異）。組別→全く異なる製品を作る（質的差異）。配賦基準には直接材料費・直接労務費・機械時間等が使われる。どの基準を使うかを問題文で確認。',
  '度外視法': '例）月間生産100個のうち5%（5個）は正常仕損が予測されている。度外視法：仕損品5個の原価は分離せず→完成品95個でのみ総原価を割り算→完成品1個当たりの原価が自動的に割高になる（仕損コストが平均化）。\nポイント：度外視法→「仕損品を無視して計算すると、良品の単位原価に仕損コストが自動的に含まれる」。非度外視法→「仕損品の原価を分離して明示的に計算」。試験では度外視法が多く出題。仕損発生点が「工程の途中」か「終点」かで按分方法が変わる点も重要。',
  '非度外視法': '例）仕損品5個の評価額（スクラップ価値）が1個200円→仕損品評価額1,000円。\n非度外視法：正味仕損費（仕損品原価）＝仕損品負担コスト－評価額1,000円を分離計算。残りを完成品・月末仕掛品に按分。\n仕訳）仕損品：（借）仕損品1,000円 ／（貸）仕掛品1,000円（スクラップ価値分を仕掛品から切り出す）。\nポイント：非度外視法は「仕損費の原因と金額が明確になる」→製造管理に役立つが計算が複雑。試験では度外視法が多いが、仕損品に評価額がある場合は非度外視法の考え方も必要。',
  '前工程費': '例）第1工程の製品原価：材料費200万円＋加工費100万円＝300万円（完成品1,000個）。第2工程へ1,000個転送。第2工程の原価計算：前工程費300万円（材料費扱い：工程始点で全量投入）＋第2工程加工費120万円＝完成品原価420万円（1個当たり420円）。\nポイント：前工程費は「次工程の材料費」として扱う。進捗度とは無関係に計算（工程始点で全量が引き継がれる）。月末仕掛品の前工程費は換算量を使わず実数で計算する点が加工費と異なる。',
  '収益認識基準': '収益認識5ステップ（例：機器＋保守サービスのセット販売）：\n①契約の識別：顧客との有効な契約を確認。\n②履行義務の識別：「機器の引渡し」と「1年間の保守サービス提供」の2つに分解。\n③取引価格の算定：セット価格11万円（返品・割引・変動対価を考慮）。\n④取引価格の配分：機器8万円・保守3万円に配分（独立販売価格比）。\n⑤収益認識：機器引渡し時に8万円・保守は毎月2,500円を認識。\nポイント：従来の「商品引渡し＝売上」から「履行義務の充足＝収益」へ。一つの契約に複数の履行義務がある場合の分解と按分が最重要論点。',
  '履行義務': '例①一時点で充足される履行義務）商品の引渡し→引渡し完了時に収益認識（一時点）。\n例②一定期間にわたって充足される履行義務）建設工事・サポートサービス→期間にわたって充足→進捗度に応じて収益を認識。\n例③複数の履行義務を含む契約）スマホ＋通信サービス→「端末の引渡し」と「通信サービスの提供」を別々の履行義務として識別→それぞれの充足時点で収益認識。\nポイント：「一時点」vs「一定期間」の区別と、「複数の履行義務への分解」が収益認識基準の中核。契約書に何が約束されているかを分析する能力が必要。',
  '委託販売': '例）A社（委託者）がB社（受託者）に商品を積送（取得原価80万円）。B社が100万円で外部顧客に販売・仕切精算書を送付。\n仕訳①積送時（A社）：（借）積送品80万円 ／（貸）商品80万円（棚卸資産区分を変更）。\n仕訳②仕切精算書受取時（A社）：（借）売掛金95万円（100万円－手数料5万円）／（貸）積送品売上100万円。同時：（借）積送品売上原価80万円 ／（貸）積送品80万円。\nポイント：委託販売は「受託者が売ったとき（仕切精算書受取時）」に売上計上。積送時・B社に在庫中は積送品（資産）のまま。売上を早めに計上できない点が一般の販売と異なる。',
  '受託販売': '例）B社（受託者）がA社（委託者）の商品を100万円で販売。手数料は5万円。\n仕訳①販売時（B社）：（借）現金100万円 ／（貸）受託販売100万円（全額を預り金的に処理。売上にしない）。\n仕訳②精算・送金時（B社）：（借）受託販売100万円 ／（貸）手数料収益5万円＋現金95万円（A社へ送金）。\nポイント：受託者の収益は「手数料のみ」。販売代金100万円を自己の売上にしてはいけない。B社はA社から預かって売るだけ→消費税の扱いも「売上ではなく手数料」が正しい。',
  '試用販売': '例）掃除機（原価5万円）を1週間試用させる。顧客が「買います（8万円）」と連絡。\n仕訳①試送時：（借）試送品5万円 ／（貸）商品5万円（在庫分類を変更・売上はまだ計上しない）。\n仕訳②買取連絡時：（借）売掛金8万円 ／（貸）売上8万円。（借）売上原価5万円 ／（貸）試送品5万円（試送品を売上原価に振替）。\nポイント：試用販売のポイント→「購入意思表示があった時点で収益認識」。試用期間中は試送品（資産）のまま。期末時点で試用中の場合は試送品として在庫計上。',
  '割賦販売': '例）原価30万円の家具を総額50万円・10回分割払いで販売（引渡し完了）。\n仕訳①引渡し時（収益認識基準）：（借）割賦売掛金50万円 ／（貸）売上50万円（一括認識）。（借）売上原価30万円 ／（貸）商品30万円。\n仕訳②毎月回収（5万円×10回）：（借）現金5万円 ／（貸）割賦売掛金5万円。\nポイント：収益認識基準→「引渡し時に一括収益認識」が原則（分割回収の都度ではない）。未回収分は割賦売掛金（資産）として管理。例外：金利相当部分が重要な場合は利息部分を分離して計上。',
  '工事契約': '例）総請負価格1億円・工事原価見込み8,000万円・2年間の工事。1年目の実際原価3,200万円。進捗度＝3,200万円÷8,000万円＝40%。\n仕訳①1年目の収益認識：（借）工事未収入金4,000万円 ／（貸）工事収益4,000万円（1億円×40%）。（借）工事原価3,200万円 ／（貸）仕掛品3,200万円（工事原価も40%分認識）。\n2年目完成・引渡し：残りの60%（6,000万円）を収益認識。\nポイント：進捗度の測定方法→「原価比例法（発生原価÷見込総原価）」が最も一般的。収益認識基準では進捗度が合理的に見積もれる場合は進捗度基準、見積もれない場合は完成基準を使用。',
  '返品権付き販売': '例）書店へ商品（取得原価70万円）を100万円で納品。返品見込み10%（10万円分・原価7万円分）。\n仕訳①納品時：（借）売掛金100万円 ／（貸）売上90万円（100万円×90%）＋返金負債10万円（返品時に返金が必要な義務）。（借）売上原価63万円（70万円×90%）＋返品資産7万円（返品されたら戻ってくる在庫の権利）／（貸）商品70万円。\n仕訳②実際に10万円分返品：（借）返金負債10万円 ／（貸）現金10万円。（借）商品7万円 ／（貸）返品資産7万円。\nポイント：返品権付き販売では「売上と返金負債」「売上原価と返品資産」の2セットを記録する。',
  '収益認識の5ステップ': '例）クラウドサービス年額12万円（機能追加オプション2万円含む）：\n①契約識別：有効な契約の確認。\n②履行義務の識別：「基本クラウドサービス」＋「機能追加オプション」の2つ。\n③取引価格：12万円（変動なし）。\n④配分：基本10万円・オプション2万円（独立販売価格比で按分）。\n⑤認識：基本サービス→月々8,333円（年間）・オプション→オプション提供開始時に2万円。\nポイント：試験では各ステップのどれが問われているか確認。特に②「履行義務の識別と分解」・④「取引価格の配分方法」・⑤「一時点 vs 一定期間」の3点が頻出。',
  '変動対価': '例）年間購入1,000万円超なら3%のボリュームリベート（値引き）がある契約。当年の累計購入800万円の時点で年間1,000万円超が見込まれる（確率高い）。\n変動対価の見積もり：1,200万円×3%＝36万円のリベートを見積もり。\n収益の減額：売上計上時に変動対価分を控除→返金負債36万円（負債）として計上し売上を減額。\nポイント：変動対価は「確実視される部分のみ収益に含める（制約あり）」。過大な収益計上を防ぐために将来の調整を見込む。典型例：ボリュームディスカウント・返品・インセンティブ・マイルストーンボーナス。',
  '外貨建取引': '例）米国企業に1万ドル（取引時レート：1ドル100円＝100万円）の商品を輸出。\n仕訳①輸出時：（借）売掛金100万円 ／（貸）売上100万円。\n仕訳②決算時（1ドル108円）：（借）売掛金8万円 ／（貸）為替差益8万円（貨幣性資産の換算替え）。\n仕訳③翌期に1ドル110円で入金：（借）現金110万円 ／（貸）売掛金108万円＋為替差益2万円。\nポイント：外貨建て「資産（売掛金・貸付金）」→円安（外貨高）で為替差益、円高で為替差損。外貨建て「負債（買掛金・借入金）」→円安で為替差損、円高で為替差益。「自分にとって有利な動き」が差益。',
  '直物為替レート': '例）本日の直物為替レート（スポットレート）：1ドル＝108円。今日1万ドルを108万円に換金できる。3か月後の先物レート：1ドル＝110円（将来の受渡しを今日確定）。\n外貨建て取引の基本：取引発生日の直物レートで仕訳を行い、期末には決算時レート（CR）で換算替え。\nポイント：直物レート（スポット）＝今日の交換レート。先物レート＝将来の交換レートを今日確定。外貨建て取引では取引発生時・期末・決済時の3回レートが問題になる。',
  '取引発生時レート': '例）4月1日（取引発生時）：1ドル100円→売掛金1万ドル＝100万円で計上。\n3月31日（決算時）：1ドル106円→売掛金106万円に換算替え→為替差益6万円。\n4月15日（入金時）：1ドル104円→現金104万円受取→残りの為替差損2万円（106万円→104万円）を認識。\n合計為替差益：6万円（期末）－2万円（決済時）＝4万円の純為替差益。\nポイント：取引時レートで計上→期末にCR（決算時レート）で換算替え→差額が為替差損益。決済時は「期末帳簿価額と決済額の差」が差損益。3段階で処理を追えるようにする。',
  '決算時レート（CR）': '例）決算時レート（CR：Current Rate）：1ドル108円。期末の外貨建て売掛金1万ドル→108万円に換算替え（取引時100万円との差額8万円→為替差益）。外貨建て買掛金5千ドル→54万円（取引時50万円との差額4万円→為替差損）。\n仕訳）売掛金換算替え：（借）売掛金8万円 ／（貸）為替差益8万円。買掛金換算替え：（借）為替差損4万円 ／（貸）買掛金4万円。\nポイント：貨幣性項目（現金・売掛金・買掛金・借入金等）→決算時レートで換算替え。非貨幣性項目（棚卸資産・固定資産等）→取引時レートのまま（換算替えなし）。',
  '為替差損益': '例①輸出企業（外貨建て売掛金）：取引時1ドル100円→決算時90円（円高）→売掛金が100万円→90万円に減少→為替差損10万円。「円高は輸出企業に損失」の会計的反映。\n例②輸入企業（外貨建て買掛金）：取引時1ドル100円→決済時110円（円安）→買掛金110万円支払い→為替差損10万円。「円安は輸入企業に損失」の会計的反映。\nポイント：「外貨建て資産」は円高→差損・円安→差益。「外貨建て負債」は円安→差損・円高→差益。これを表にして整理：外貨資産＋円安＝差益、外貨資産＋円高＝差損、外貨負債＋円安＝差損、外貨負債＋円高＝差益。',
  '貨幣性項目・非貨幣性項目': '例）外貨建て資産・負債の換算基準：\n貨幣性項目（現金・売掛金・貸付金・借入金・買掛金等）→決算時レート（CR）で換算替え→為替差損益を認識。\n非貨幣性項目（棚卸資産・固定資産・繰延資産等）→取引時レートのまま→為替差損益を認識しない。\n例）外貨建て商品在庫（非貨幣性）→換算替えなし。外貨建て売掛金（貨幣性）→決算時レートで換算替え・差額は為替差損益。\nポイント：「いくらで換金できるか額が決まっている（金銭請求権）」→貨幣性→CR換算。「換金額が決まっていない（モノや権利）」→非貨幣性→取引時レート維持。',
  '社債の発行': '例）額面1億円（1口1,000円×10万口）・クーポン年1%・5年満期の社債を95円（95百万円）で発行（割引発行）。差額5百万円（発行費用ではなく事実上の追加利息）。\n仕訳①発行時：（借）当座預金9,500万円 ／（貸）社債9,500万円（発行価額で計上）。\n仕訳②毎年利息（名目利息1%＋償却原価法5%÷5年＝1%）：（借）社債利息100万円（1%×1億円）＋社債利息100万円（償却分：差額500万円÷5年）＝200万円 ／（貸）当座預金100万円（実際支払）＋社債100万円（帳簿価額増加）。\n仕訳③満期償還：（借）社債1億円 ／（貸）当座預金1億円。\nポイント：割引発行→実際の支払利息（名目）より社債利息の費用が多い（償却分が加算）→帳簿価額が毎年増加して満期に額面へ到達。',
  '額面金額': '例）社債（額面1億円・発行価格9,500万円・5年満期）。\n差額500万円＝事実上の追加利息（5年間で分割負担）。毎年100万円（500万円÷5年）を社債利息に加算。\n帳簿価額の推移：発行時9,500万円→1年後9,600万円→2年後9,700万円→…→5年後1億円（額面）。\nポイント：額面金額は「最終的に返さなければならない金額」。発行時の帳簿価額（発行価格）と額面の差が「実質的な追加利息コスト」。満期時に帳簿価額が額面に一致するのが償却原価法の目標。',
  'クーポン': '例）額面100円・クーポン（表面利率）1%・年1回利払いの社債→毎年1円を投資家に支払い。市場利率2%の場合：投資家は1%では不満→95円（割引価格）なら「5円の値上がり益＋年1円利息」で実質利回り2%に近づく。\n仕訳）クーポン利息の支払：（借）社債利息100万円（額面1億円×1%）／（貸）当座預金100万円。\nポイント：クーポン（表面利率）＞市場利率→プレミアム発行（額面超えで発行）。クーポン＜市場利率→割引発行（額面未満で発行）。クーポンと市場利率の比較が発行価格を決定する。',
  '割引発行': '例）額面100円の社債を95円で発行（割引率5%）。投資家は5円の値上がり益（取得95円→満期100円）＋クーポン利息を受取れる→実質利回りが高くなる。\n発行体（企業）は5円分を5年間で分割負担（償却原価法）→毎年1円を社債利息費用に加算。\n仕訳）発行：（借）当座預金9,500万円（1億円×0.95）／（貸）社債9,500万円。毎年（償却原価法）：（借）社債利息100万円（差額1,000万円×1/10年） ／（貸）社債100万円（帳簿価額増加）。\nポイント：割引発行→実際の現金支払額（クーポン）より費用計上額が多い→帳簿価額が毎年増加して額面へ収束。',
  '社債の償却原価法': '例）額面1億円を9,500万円で発行（差額500万円）・10年満期。\n償却原価法（定額法）：年50万円（500万円÷10年）を毎期社債利息に加算し社債帳簿価額を増加。\n仕訳（毎年）：（借）社債利息50万円 ／（貸）社債50万円。これにより年1%のクーポン（100万円）と合わせて計150万円が年間の社債利息費用（実質利率≒1.5%）。\n10年後：社債帳簿価額9,500万円＋50万円×10年＝1億円（額面）で満期償還。\nポイント：社債利息の計上額＝クーポン（現金支払）＋償却原価法による加算額（または控除額）。試験では「毎期の社債利息計上額と社債帳簿価額の計算」が必出。',
  '端数利息': '例）年2回利払い（6月末・12月末）の社債（クーポン1%・額面100万円）を9月末に売買。\n端数利息：前回利払日（6月末）から9月末までの3か月分＝100万円×1%×3/12＝2,500円。\n仕訳（買手）：（借）売買目的有価証券XX万円＋有価証券利息2,500円 ／（貸）現金（社債代金＋端数利息）。\n12月末利払日に6か月分5,000円を受取：（借）現金5,000円 ／（貸）有価証券利息5,000円（端数利息2,500円分は相殺されて3か月分が実質の収益）。\nポイント：端数利息は「前回利払い以降の売主保有期間の利息を買主が代わりに受け取る分の前払い」。次の利払日に全額受取って精算する。',
  '取引の8要素': '例）商品100万円を現金で仕入れ → 費用（仕入）の発生＋資産（現金）の減少。商品を120万円で現金販売 → 資産（現金）の増加＋収益（売上）の発生。全ての取引がこの8要素に当てはまる。',
  '決算振替仕訳': '例）売上500万円・仕入350万円・給料100万円等の全収益・費用を損益勘定へ振替 → 損益勘定残高（利益）50万円を繰越利益剰余金へ振替 → 収益・費用の全勘定が翌期に向けてゼロリセット。',
  '損益勘定': '例）収益500万円・費用450万円を損益勘定に集約 → 損益勘定残高50万円（純利益）を繰越利益剰余金へ振替 → 損益勘定の残高ゼロで閉鎖。翌期には損益勘定は存在しない。',
  '帳簿の締め切り': '例）現金勘定残高50万円 → 「次期繰越50万円」で締め切り、翌期首に「前期繰越50万円」として引き継ぐ。売上勘定残高500万円 → 損益勘定へ振替してゼロに（翌期にはゼロから始まる）。',
  '資本等式': '例）資産5,000万円－負債3,000万円＝純資産2,000万円。これは「会社の財産（5,000万円）から借金（3,000万円）を引いたら株主のもの（2,000万円）が残る」という意味。',
  '損益計算書等式': '例）費用450万円＋当期純利益50万円＝収益500万円。つまり「収益－費用＝利益（または損失）」。損益計算書全体が常にこの等式を満たしている。',
  '継続企業の前提': '例）通常の財務諸表は「この会社はこれからも続く」という前提で作られている（固定資産を長期で償却するなど）。倒産の危機にある場合はこの前提が崩れ、財務諸表への注記が義務付けられる。',

function buildQAAllItems(){
  const items = [];
  const typeLabel = QA_TYPE_LABEL;

  // 商業簿記 勘定科目：説明文が問い、科目名が答え
  ACCT_DATA.forEach(([name, en, note, lv]) => {
    const type = T[name]||'other';
    items.push({
      src:'acct', type, lv:lv||3,
      hint: typeLabel[type]+'科目',
      hintCls: type,
      q: ACCT_Q[name] || qaMask(note, name),
      ans: name,
      ex: DETAIL[name] || '',
    });
  });

  // 工業簿記 勘定科目
  const IND_ACCT_TYPE = {
    '材料・在庫':   '資産科目（流動資産）',
    '労務費':       '費用（製造直接費 / 間接費）',
    '製造間接費':   '費用（製造間接費）',
    '原価差異':     '差異勘定　不利差異→借方 / 有利差異→貸方',
    '本社・工場':   '内部取引勘定（合算時に消去）',
  };
  INDUSTRIAL_DATA.forEach(([name, en, note, subcat]) => {
    items.push({
      src:'industrial', type:'industrial', subcat,
      hint: subcat,
      hintCls: 'industrial',
      acctType: IND_ACCT_TYPE[subcat] || '',
      q: IND_Q[name] || qaMask(note, name),
      ans: name,
      ex: DETAIL[name] || '',
    });
  });

  // 用語集：定義が問い、用語名が答え
  GLOSSARY_DATA.forEach(({category, items:gi}, catIdx) => {
    gi.forEach(({term, def}) => {
      items.push({
        src:'gloss', type:'gloss', cat:category, catIdx,
        hint: category,
        hintCls: 'gloss',
        q: GLOSSARY_Q[term] || qaMask(def, term),
        ans: term,
        ex: DETAIL[term] || '',
      });
    });
  });

  return items;
}

function getQAFiltered(){
  if(!qaAllItems) qaAllItems = buildQAAllItems();
  if(qaFilter==='all')         return [...qaAllItems];
  if(qaFilter==='asset3')      return qaAllItems.filter(i=>i.src==='acct' && i.type==='asset'    && i.lv===3);
  if(qaFilter==='asset2')      return qaAllItems.filter(i=>i.src==='acct' && i.type==='asset'    && i.lv===2);
  if(qaFilter==='liability')   return qaAllItems.filter(i=>i.src==='acct' && i.type==='liability');
  if(qaFilter==='expense3')    return qaAllItems.filter(i=>i.src==='acct' && i.type==='expense'  && i.lv===3);
  if(qaFilter==='expense2')    return qaAllItems.filter(i=>i.src==='acct' && i.type==='expense'  && i.lv===2);
  if(qaFilter==='revenue')     return qaAllItems.filter(i=>i.src==='acct' && i.type==='revenue');
  if(qaFilter==='equity')      return qaAllItems.filter(i=>i.src==='acct' && i.type==='equity');
  if(qaFilter==='industrial')  return qaAllItems.filter(i=>i.src==='industrial');
  if(qaFilter==='gloss-basic') return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx<=3);
  if(qaFilter==='gloss-comm')  return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx>=4 && i.catIdx<=13);
  if(qaFilter==='gloss-ind')   return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx===14);
  if(qaFilter==='gloss-adv')   return qaAllItems.filter(i=>i.src==='gloss' && i.catIdx>=15);
  if(qaFilter==='checked')     return qaAllItems.filter(i=>qaChecked.has(qaItemKey(i)));
  return [...qaAllItems];
}

function qaItemKey(item){ return item.src + ':' + item.ans; }

function saveQAChecked(){
  localStorage.setItem('bk_qa_checked', JSON.stringify([...qaChecked]));
  const el = document.getElementById('qa-checked-count');
  if(el) el.textContent = qaChecked.size;
}

function qaToggleCheck(){
  if(qaIdx >= qaActive.length) return;
  const key = qaItemKey(qaActive[qaIdx]);
  if(qaChecked.has(key)) qaChecked.delete(key); else qaChecked.add(key);
  saveQAChecked();
  const btn = document.getElementById('qa-check-btn');
  if(btn){ btn.classList.toggle('on', qaChecked.has(key)); btn.title = qaChecked.has(key)?'チェック解除':'チェックする'; }
}

function showQA(){
  if(!qaAllItems) qaAllItems = buildQAAllItems();
  qaFilter='all'; qaIdx=0; qaRevealed=false; qaKnown=new Set(); qaMCCurrent=null;
  qaActive = getQAFiltered();
  document.querySelectorAll('#qa-tabs .qa-tab').forEach(t=>t.classList.toggle('active',t.dataset.f==='all'));
  document.getElementById('qa-overlay').classList.add('show');
  const el = document.getElementById('qa-checked-count');
  if(el) el.textContent = qaChecked.size;
  renderQABody();
}

function closeQA(){ document.getElementById('qa-overlay').classList.remove('show'); }

function setQAFilter(f){
  qaFilter=f; qaIdx=0; qaRevealed=false; qaKnown=new Set(); qaMCCurrent=null;
  qaActive = getQAFiltered();
  document.querySelectorAll('#qa-tabs .qa-tab').forEach(t=>t.classList.toggle('active',t.dataset.f===f));
  renderQABody();
}

function generateMCChoices(item) {
  const correct = item.ans;
  const allCands = qaActive.filter(i => i.ans !== correct);
  const shuffle = a => [...a].sort(() => Math.random()-0.5);
  let preferred = [];
  if(item.src === 'acct')       preferred = allCands.filter(i => i.src==='acct' && i.type===item.type);
  else if(item.src === 'gloss') preferred = allCands.filter(i => i.src==='gloss' && i.cat===item.cat);
  else                          preferred = allCands.filter(i => i.src===item.src);

  const seen = new Set();
  const distractors = [];
  for(const cand of shuffle(preferred)) {
    if(!seen.has(cand.ans)){ seen.add(cand.ans); distractors.push(cand.ans); }
    if(distractors.length===3) break;
  }
  if(distractors.length<3) {
    for(const cand of shuffle(allCands)) {
      if(!seen.has(cand.ans)){ seen.add(cand.ans); distractors.push(cand.ans); }
      if(distractors.length===3) break;
    }
  }
  const choices = distractors.slice(0,3);
  const correctIdx = Math.floor(Math.random()*4);
  choices.splice(correctIdx, 0, correct);
  return { choices, correctIdx, chosen: null };
}

function qaMCChoose(idx) {
  if(!qaMCCurrent || qaMCCurrent.chosen !== null) return;
  qaMCCurrent.chosen = idx;
  const isCorrect = (idx === qaMCCurrent.correctIdx);
  if(isCorrect) qaKnown.add(qaIdx);
  document.querySelectorAll('.qa-choice-btn').forEach((b, i) => {
    b.disabled = true;
    if(i === qaMCCurrent.correctIdx) b.classList.add('correct');
    else if(i === idx) b.classList.add('wrong');
  });
  const r = document.getElementById('qa-mc-result');
  if(r) {
    r.className = 'qa-mc-result ' + (isCorrect ? 'ok' : 'ng');
    r.textContent = isCorrect ? '✓ 正解！' : '✗ 不正解（正解：' + qaMCCurrent.choices[qaMCCurrent.correctIdx] + '）';
  }
  const n = document.getElementById('qa-mc-next');
  if(n) n.style.display = 'block';
  const sc = document.querySelector('.qa-known-count');
  if(sc) sc.textContent = '✓ 正解 ' + qaKnown.size + '問';
}

function qaMCNext() {
  qaMCCurrent = null;
  qaIdx++;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 0;
}

function renderQABody(){
  const body  = document.getElementById('qa-body');
  const total = qaActive.length;
  const prog  = total ? Math.round((qaIdx+1)/total*100) : 0;
  document.getElementById('qa-prog-text').textContent = total ? `${qaIdx+1} / ${total}` : '0 / 0';
  document.getElementById('qa-prog-fill').style.width  = prog+'%';

  if(!total){ body.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px">問題がありません</p>'; return; }

  if(qaIdx >= total){
    body.innerHTML = buildQADone(total);
    return;
  }

  const item = qaActive[qaIdx];
  const knownCount = qaKnown.size;

  if(!qaMCCurrent) qaMCCurrent = generateMCChoices(item);
  const { choices, correctIdx, chosen } = qaMCCurrent;

  const choicesHtml = choices.map((c, i) => {
    let cls = '';
    if(chosen !== null) {
      if(i === correctIdx) cls = ' correct';
      else if(i === chosen) cls = ' wrong';
    }
    return `<button class="qa-choice-btn${cls}" onclick="qaMCChoose(${i})" ${chosen!==null?'disabled':''}>${c}</button>`;
  }).join('');

  const resultText = chosen !== null
    ? (chosen===correctIdx ? '✓ 正解！' : '✗ 不正解（正解：' + choices[correctIdx] + '）')
    : '';
  const resultCls = chosen !== null ? (chosen===correctIdx ? 'ok' : 'ng') : '';

  const isChecked = qaChecked.has(qaItemKey(item));
  body.innerHTML = `
    <div class="qa-q-card">
      <div class="qa-q-meta">
        <span class="qa-q-badge ${item.hintCls}">${item.hint}</span>
        ${item.lv===2?'<span class="qa-q-badge cat">2級</span>':''}
        <button id="qa-check-btn" class="qa-check-btn${isChecked?' on':''}" onclick="qaToggleCheck()" title="${isChecked?'チェック解除':'チェックする'}">★</button>
      </div>
      <div class="qa-q-text">${styleParens(addQBreaks(markQKey(item.q)))}</div>
    </div>
    <div class="qa-choices">${choicesHtml}</div>
    <div id="qa-mc-result" class="qa-mc-result ${resultCls}">${resultText}</div>
    ${item.ex ? `<div class="qa-ex-text">${item.ex.replace(/\n/g,'<br>')}</div>` : ''}
    <button id="qa-mc-next" class="qa-mc-next" onclick="qaMCNext()" style="display:${chosen!==null?'block':'none'}">次へ →</button>
    <div class="qa-nav-row">
      <button class="qa-nav-btn" onclick="qaPrev()" ${qaIdx===0?'disabled':''}>← 前</button>
      <span class="qa-known-count">✓ 正解 ${knownCount}問</span>
      <button class="qa-nav-btn" onclick="qaSkip()">スキップ →</button>
    </div>`;
}

function qaReveal(){
  qaRevealed = true;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 999;
}

function qaJudge(known){
  if(known) qaKnown.add(qaIdx);
  qaIdx++; qaRevealed=false;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 0;
}

function qaSkip(){
  qaMCCurrent=null; qaIdx++; qaRevealed=false;
  renderQABody();
  document.getElementById('qa-body').scrollTop = 0;
}

function qaPrev(){
  if(qaIdx>0){ qaMCCurrent=null; qaIdx--; qaRevealed=false; renderQABody(); document.getElementById('qa-body').scrollTop=0; }
}

function buildQADone(total){
  const k = qaKnown.size;
  const pct = Math.round(k/total*100);
  return `<div class="qa-done-card">
    <div class="qa-done-emoji">${pct>=80?'🎉':pct>=50?'😊':'📚'}</div>
    <div class="qa-done-title">${pct>=80?'素晴らしい！':pct>=50?'いい調子！':'もう一度挑戦！'}</div>
    <div class="qa-done-sub">${total}問中 ${k}問 正解！（${pct}%）</div>
    <button class="qa-restart-btn" onclick="qaRestart()">もう一度最初から</button>
  </div>`;
}

function qaRestart(){
  qaMCCurrent=null; qaIdx=0; qaRevealed=false; qaKnown=new Set();
  renderQABody();
  document.getElementById('qa-body').scrollTop=0;
}

    a:'① 800円（有利）　② 1,200円（有利）\n【計算過程】\n変動費能率差異 ＝ (490 − 480) × 80 ＝ 800円（有利）\n固定費能率差異 ＝ (490 − 480) × 120 ＝ 1,200円（有利）\n能率差異合計 ＝ 800 ＋ 1,200 ＝ 2,000円（有利）\n▶ ポイント：4分法は3分法の能率差異を変動費・固定費に分けたもの。作業時間の節約が変動費・固定費の両方の節約につながる',

    a:'① 20,000　② 仕損　③ 減損　④ 正常（仕損）　⑤ 異常（仕損）\n【計算過程】\n仕損費 ＝ 200,000 × 10/100 ＝ 20,000円\n仕損：不合格品・失敗品（形はある）\n減損：蒸発・散逸など物理的に消えてなくなる（形がなくなる）\n正常仕損 → 製品原価に含める（良品に負担させる）\n異常仕損 → 製品原価に含めない → 異常仕損費として損益計算書へ\n▶ ポイント：「形があって不合格品 → 仕損」「形がなくなる → 減損」「想定内 → 正常」「想定外 → 異常」で分類する',
    exp:'工場で100個作っても、全部が合格品になるとは限りません。これが「仕損」です。\n【仕損のイメージ】陶芸で焼いたら歪んでしまった → 仕損品（不合格品）\n【減損のイメージ】塗料が蒸発して減ってしまった → 減損（量が減る）\n正常仕損は「想定内のコスト」なので製品の原価に上乗せします（良品が仕損分のコストも負担する）。\n異常仕損は「想定外のコスト」なので製品原価に含めず、特別損失として処理します。\n【覚え方】正常＝コストに含める（製品が責任持つ）、異常＝コストから除く（製品は被害者）',

    a:'① 仕掛品　② 製造間接費　③ 製品　④ 売上原価　⑤ 100,000\n【計算過程】\n材料（直接材料費）→ 仕掛品（直接、製品に追跡可能）\n材料（間接材料費）→ 製造間接費（間接、複数製品に共通）\n製造間接費配賦額 ＝ 配賦率@1,000 × 操業度100h ＝ 100,000円\n仕掛品（完成時）→ 製品（在庫として保管）\n製品（販売時）→ 売上原価（費用として損益計算書へ）\n▶ ポイント：この勘定連絡図を頭に入れれば工業簿記の仕訳問題の大半が解ける。「直接→仕掛品直行」「間接→製造間接費経由」が最重要',
    exp:'工業簿記の勘定連絡図は試験で必ず問われる核心知識。「直接費→仕掛品直行」「間接費→製造間接費→配賦→仕掛品」「完成→製品」「販売→売上原価」この4つの矢印の流れを図で頭に入れましょう。この図を理解していれば仕訳問題の8割は解けます。',
    steps:[
      {label:'①直接材料費80,000円の振替先勘定への金額', ans:80000, unit:'円', choices:[80000,20000,100000,60000]},
      {label:'②間接材料費の振替先（製造間接費）への金額', ans:20000, unit:'円', choices:[20000,80000,100000,40000]},
      {label:'③配賦額（配賦率@1,000円×操業度100h）の計算', ans:100000, unit:'円', choices:[100000,80000,120000,150000]},
      {label:'④完成品原価（例：期首なし・当月費用280,000・期末仕掛30,000）', ans:250000, unit:'円', choices:[250000,280000,30000,200000]},
      {label:'⑤配賦額（配賦率@1,000円×操業度100h）', ans:100000, unit:'円', choices:[100000,80000,120000,150000]}
    ]
  },

  // ===== 為替手形（追加）=====

  { id:382, level:2, cat:'手形',
    q:'次の取引のとき、各当事者に関する数値を答えなさい。\n  A社（振出人）はC社への買掛金80,000円を決済するため、\n  B社宛に「C社へ80,000円払え」という為替手形を振り出した。\n  B社（引受人）はA社への買掛金80,000円を持ち、引き受けた。\n  C社（受取人）はA社への売掛金80,000円を持っていた。\n為替手形では振出人・引受人・受取人の3者が関わる。\n振出人は買掛金と売掛金を同時に消去でき、\n引受人は買掛金を支払手形へ、受取人は売掛金を受取手形へ振り替える。\n① 振出人A社が貸方に計上する金額（売掛金の減少額）（円）\n② 引受人B社が支払手形（負債）へ振替える金額（円）\n③ 受取人C社が受取手形（資産）として計上する金額（円）',
    a:'① 振出人（Drawer）　② 引受人（Acceptor）　③ 受取人（Payee）\n【計算過程】\n振出人：「私の代わりに払ってくれ」と手形を作成して発行する者\n引受人：「わかった、払います」と承諾して手形を引き受ける者（支払義務を負う）\n受取人：手形を受け取り、満期日に引受人から代金を受け取る者\n▶ ポイント：約束手形は2者（振出人が払う）、為替手形は3者（引受人が払う）。振出人は買掛金と売掛金を同時に決済できる',
    exp:'為替手形は振出人・引受人・受取人の3者間の手形。振出人はBへの買掛金とCへの売掛金を同時に決済できる。引受人は振出人への買掛金を支払手形に振り替え、受取人は振出人への売掛金を受取手形に振り替える。',
    steps:[
      {label:'①振出人A社の貸方（売掛金の減少額）', ans:80000, unit:'円', choices:[80000,40000,160000,60000]},
      {label:'②引受人B社の支払手形（負債）への振替額', ans:80000, unit:'円', choices:[80000,40000,160000,60000]},
      {label:'③受取人C社の受取手形（資産）の計上額', ans:80000, unit:'円', choices:[80000,40000,160000,60000]}
    ]
  },

    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">買掛金</td><td class="hl">80,000</td><td class="hl">売掛金</td><td class="hl">80,000</td></tr></tbody></table><div class="formula-box">振出人：買掛金（仕入先への債務）が消え、売掛金（得意先への債権）も消える</div>`,

  { id:386, level:2, cat:'手形',
    q:'為替手形80,000円（B社引受）が期日を迎えた。①引受人B社が当座預金から支払い、②受取人C社が当座預金に受け取った。各社の仕訳を行いなさい。',

  { id:387, level:2, cat:'手形',

  // ===== 圧縮記帳（追加）=====
  { id:390, level:2, cat:'圧縮記帳',
    q:'国庫補助金2,000,000円を普通預金に受け取り、機械装置4,000,000円を現金で購入した（耐用年数4年・残存価額0円・定額法）。積立金方式で圧縮記帳を行う場合の①補助金受取②機械購入③圧縮積立金設定の仕訳と、④1年目の減価償却費と積立金取崩額を答えよ。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①補助金受取</td><td>普通預金</td><td>2,000,000</td><td class="hl">国庫補助金受贈益</td><td>2,000,000</td></tr><tr><td>②機械購入</td><td>機械装置</td><td>4,000,000</td><td>現金</td><td>4,000,000</td></tr><tr><td>③圧縮積立金</td><td class="hl">繰越利益剰余金</td><td>2,000,000</td><td class="hl">圧縮積立金</td><td>2,000,000</td></tr></tbody></table><div class="formula-box">④減価償却費＝4,000,000÷4年＝1,000,000円（帳簿価額は変わらないので全額ベース）<br>積立金取崩額＝2,000,000÷4年＝500,000円（圧縮積立金→繰越利益剰余金）</div>`,
    exp:'積立金方式は「帳簿価額はそのまま、利益剰余金から圧縮積立金へ積み立てる」方法。固定資産の価額は変わらないので減価償却費は取得原価全額ベースで計算。毎期、補助金相当額÷耐用年数を圧縮積立金から繰越利益剰余金へ取り崩す（課税の繰り延べ効果を均等に享受）。',
    steps:[
      {label:'①の貸方（補助金受取時の収益科目）', ans:'国庫補助金受贈益', choices:['国庫補助金受贈益','受取補助金','補助金収入','固定資産圧縮損']},
      {label:'③借方（圧縮積立金の設定時借方）', ans:'繰越利益剰余金', choices:['繰越利益剰余金','固定資産圧縮損','機械装置','利益準備金']},
      {label:'④1年目の減価償却費', ans:1000000, unit:'円', choices:[1000000,800000,500000,750000]},
      {label:'④1年目の積立金取崩額', ans:500000, unit:'円', choices:[500000,400000,1000000,250000]}
    ]
  },

  { id:391, level:2, cat:'圧縮記帳',
    q:'直接控除方式で圧縮記帳済みの建物：取得原価10,000,000円・固定資産圧縮損3,000,000円（計上済み）・耐用年数20年・残存価額0円・定額法。\n①圧縮後の帳簿価額②毎年の減価償却費③減価償却の仕訳を行いなさい。',
    ans_html:`<div class="formula-box">①圧縮後帳簿価額＝10,000,000－3,000,000＝7,000,000円<br>②年間減価償却費＝7,000,000÷20年＝350,000円<br>③借：減価償却費 350,000　／　貸：減価償却累計額 350,000</div>`,
    exp:'直接控除方式では固定資産の帳簿価額そのものを補助金分だけ減らすため、減価償却の基礎となる帳簿価額も小さくなる。積立金方式（取得原価全額で償却）と比べ毎期の減価償却費が少なくなる。どちらの方式も補助金受取時の益金を将来に分散して課税する効果がある。',
    steps:[
      {label:'①圧縮後帳簿価額', ans:7000000, unit:'円', choices:[7000000,10000000,3000000,8000000]},
      {label:'②年間減価償却費', ans:350000, unit:'円', choices:[350000,500000,300000,400000]},
      {label:'③減価償却の借方勘定', ans:'減価償却費', choices:['減価償却費','固定資産圧縮損','建物','圧縮積立金']}
    ]
  },

  { id:392, level:2, cat:'圧縮記帳',
    q:'次の条件のとき、直接控除方式と積立金方式の比較計算を行いなさい。\n  国庫補助金受取額：2,000,000円\n  機械装置の取得原価：4,000,000円\n  耐用年数：4年（定額法・残存価額ゼロ）\n直接控除方式：取得原価 − 補助金額 ＝ 圧縮後の帳簿価額（小さくなる）\n積立金方式：取得原価は変わらない（補助金相当額を圧縮積立金として計上）\n① 直接控除方式における圧縮後の帳簿価額（円）\n② 直接控除方式における年間減価償却費（円）\n③ 積立金方式における年間減価償却費（円）\n④ 積立金方式における年間の圧縮積立金取崩額（円）',
    a:'① 収益（国庫補助金受贈益）　② 減額（圧縮）　③ 小さく　④ 変わらない　⑤ 圧縮積立金\n【計算過程】\n直接控除方式：帳簿価額を補助金額だけ下げる → 減価償却の基礎が小さくなる → 毎期の償却費が減る → 少しずつ課税\n積立金方式：帳簿価額はそのまま → 圧縮積立金（純資産）を積立 → 毎期取崩して課税調整\n▶ ポイント：両方式とも「補助金受取時の一括課税を避けて、将来に分割課税する」効果は同じ。直接控除方式が簡単で実務主流',
