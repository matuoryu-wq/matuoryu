<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記仕訳 練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }
    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }
    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.expense   { background: #F4849A; }
    .dot.liability { background: #70B8EA; }
    .dot.revenue   { background: #5DC06A; }
    .dot.equity    { background: #FF8A50; }
    .filter-bar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 12px; color: var(--muted); }
    .ftab {
      padding: 5px 14px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.15s;
    }
    .ftab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }
    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #6A1B9A; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }
    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }
    .card-body { padding: 20px 18px; }
    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }
    .answer-area { display: none; }
    .answer-area.show { display: block; }
    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    .tag.expense   { background: #FCE4EC; color: #880E4F; border: 1.5px solid #F4849A; }
    .tag.liability { background: #E3F2FD; color: #0D47A1; border: 1.5px solid #70B8EA; }
    .tag.revenue   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #5DC06A; }
    .tag.equity    { background: #FFF3E0; color: #E65100; border: 1.5px solid #FF8A50; }
    .tag.other     { background: #F3E5F5; color: #4A148C; border: 1.5px solid #CE93D8; }
    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }
    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }
    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="header">
  <h1>簿記仕訳 練習アプリ</h1>
  <p>問題を読んで仕訳を考え、答えを確認しよう</p>
</div>
<div class="legend">
  <div class="legend-item"><div class="dot asset"></div>資産</div>
  <div class="legend-item"><div class="dot expense"></div>費用</div>
  <div class="legend-item"><div class="dot liability"></div>負債</div>
  <div class="legend-item"><div class="dot revenue"></div>収益</div>
  <div class="legend-item"><div class="dot equity"></div>純資産</div>
</div>
<div class="filter-bar">
  <span class="filter-label">レベル：</span>
  <button class="ftab active" onclick="setLevel('all',this)">すべて</button>
  <button class="ftab" onclick="setLevel('3',this)">3級</button>
  <button class="ftab" onclick="setLevel('2',this)">2級</button>
</div>
<div class="controls">
  <button class="ctrl-btn" onclick="shuffle()">🔀 シャッフル</button>
  <button class="ctrl-btn" id="btn-hide-mem" onclick="toggleHideMem()">習得済みを除く</button>
  <button class="ctrl-btn" onclick="resetAll()">🔄 リセット</button>
</div>
<div class="stats-bar">
  <div class="stat"><div class="stat-num total" id="s-total">0</div><div class="stat-label">問題数</div></div>
  <div class="stat"><div class="stat-num correct" id="s-ok">0</div><div class="stat-label">正解</div></div>
  <div class="stat"><div class="stat-num wrong" id="s-ng">0</div><div class="stat-label">不正解</div></div>
  <div class="stat"><div class="stat-num mem" id="s-mem">0</div><div class="stat-label">習得済</div></div>
</div>
<div class="card-area">
  <div class="progress-row">
    <span id="prog-text"></span>
    <span id="prog-cat" style="font-size:12px;color:var(--muted)"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  <div id="card-container"></div>
  <div class="nav-row" id="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="go(-1)">← 前へ</button>
    <button class="nav-btn" id="btn-next" onclick="go(+1)">次へ →</button>
  </div>
</div>

let deck=[],idx=0,answered={},memorized={},hideMem=false,levelFilter='all';
function buildDeck(){
  deck=ALL.filter(q=>{
    if(levelFilter!=='all'&&q.lv!==levelFilter)return false;
    if(hideMem&&memorized[q.id])return false;
    return true;
  });
}
function shuffle(){
  buildDeck();
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0;render();
}
function setLevel(lv,btn){
  levelFilter=lv;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildDeck();idx=0;render();
}
function toggleHideMem(){
  hideMem=!hideMem;
  const btn=document.getElementById('btn-hide-mem');
  btn.classList.toggle('active',hideMem);
  btn.textContent=hideMem?'全問題を表示':'習得済みを除く';
  buildDeck();idx=0;render();
}
function resetAll(){
  answered={};memorized={};hideMem=false;
  document.getElementById('btn-hide-mem').classList.remove('active');
  document.getElementById('btn-hide-mem').textContent='習得済みを除く';
  buildDeck();idx=0;render();
}
function go(dir){idx=Math.max(0,Math.min(deck.length-1,idx+dir));render();}
function revealAnswer(){
  document.getElementById('rev-btn').style.display='none';
  document.getElementById('ans-area').classList.add('show');
}
function judge(ok){
  const q=deck[idx];
  answered[q.id]=ok;
  if(ok)memorized[q.id]=true;
  updateStats();
  if(idx<deck.length-1){idx++;render();}else{showComplete();}
}
function showComplete(){
  const total=Object.keys(answered).length;
  const ok=Object.values(answered).filter(v=>v).length;
  document.getElementById('card-container').innerHTML=`<div class="complete-card"><div class="complete-emoji">🎉</div><div class="complete-title">全問完了！</div><div class="complete-score">${ok}<span style="font-size:24px;color:var(--muted)">/${total}</span></div><div class="complete-sub">正解数 / 回答数</div><button class="restart-btn" onclick="resetAll()">もう一度</button></div>`;
  document.getElementById('nav-row').style.display='none';
  document.getElementById('prog-text').textContent='';
  document.getElementById('prog-cat').textContent='';
  document.getElementById('prog-fill').style.width='100%';
}
function updateStats(){
  document.getElementById('s-total').textContent=deck.length;
  document.getElementById('s-ok').textContent=Object.values(answered).filter(v=>v).length;
  document.getElementById('s-ng').textContent=Object.values(answered).filter(v=>!v).length;
  document.getElementById('s-mem').textContent=Object.keys(memorized).length;
}
function makeTags(arr){return arr.map(a=>`<span class="tag ${tagType(a)}">${a}</span>`).join('');}
function render(){
  document.getElementById('nav-row').style.display='flex';
  updateStats();
  if(deck.length===0){
    document.getElementById('card-container').innerHTML='<div class="complete-card" style="padding:40px 24px;"><div style="font-size:32px">📭</div><div style="margin-top:12px;font-size:16px;font-weight:700">表示できる問題がありません</div><div style="margin-top:6px;color:var(--muted);font-size:13px">フィルターを変えるか「リセット」してください</div></div>';
    document.getElementById('prog-text').textContent='';
    document.getElementById('prog-cat').textContent='';
    document.getElementById('prog-fill').style.width='0%';
    document.getElementById('btn-prev').disabled=true;
    document.getElementById('btn-next').disabled=true;
    return;
  }
  const q=deck[idx];
  const pct=Math.round((idx+1)/deck.length*100);
  document.getElementById('prog-text').textContent=`${idx+1} / ${deck.length}`;
  document.getElementById('prog-cat').textContent=q.cat;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('btn-prev').disabled=idx===0;
  document.getElementById('btn-next').disabled=idx===deck.length-1;
  let entriesHtml='';
  q.e.forEach((entry,i)=>{
    const label=q.e.length>1?`仕訳 ${i+1}`:'仕訳';
    entriesHtml+=`<div class="journal-entry"><div class="entry-header">${label}</div><div class="entry-row"><div class="entry-side"><div class="side-lbl">借　方</div><div class="tags">${makeTags(entry.d)}</div></div><div class="entry-sep"></div><div class="entry-side"><div class="side-lbl">貸　方</div><div class="tags">${makeTags(entry.c)}</div></div></div></div>`;
  });
  if(q.note)entriesHtml+=`<div class="note-box">💡 ${q.note}</div>`;
  document.getElementById('card-container').innerHTML=`<div class="flashcard"><div class="card-top"><span class="level-badge">簿記${q.lv}級</span><span class="category-tag">${q.cat}</span></div><div class="card-body"><div class="scenario-label">問題</div><div class="scenario">${q.q}</div><div class="divider"></div><button class="reveal-btn" id="rev-btn" onclick="revealAnswer()">▼ 答えを見る</button><div class="answer-area" id="ans-area"><div class="answer-label">仕訳（解答）</div>${entriesHtml}<div class="judge-btns"><button class="judge-btn ng" onclick="judge(false)">✗ 不正解</button><button class="judge-btn ok" onclick="judge(true)">○ 正解！</button></div></div></div></div>`;
}
buildDeck();render();
</script>
