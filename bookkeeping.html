  { id:96, cat:'帳簿・精算表',
    q:'現金500・繰越商品130・買掛金200・資本金300・繰越利益剰余金100・当期純利益30のとき、貸借対照表（B/S）を作成せよ',
    ans_html: `<div class="tbl-sec">貸借対照表（B/S）　単位：円</div><table><thead><tr><th colspan="2">資産の部（借方）</th><th colspan="2">負債・純資産の部（貸方）</th></tr></thead><tbody><tr><td>現金</td><td>500</td><td>【負債の部】</td><td></td></tr><tr><td>繰越商品</td><td>130</td><td>買掛金</td><td>200</td></tr><tr><td></td><td></td><td>負債合計</td><td>200</td></tr><tr><td></td><td></td><td>【純資産の部】</td><td></td></tr><tr><td></td><td></td><td>資本金</td><td>300</td></tr><tr><td></td><td></td><td>繰越利益剰余金</td><td class="hl">130</td></tr><tr><td></td><td></td><td>純資産合計</td><td>430</td></tr><tr class="total-row"><td class="hl">資産合計</td><td class="hl">630</td><td class="hl">負債・純資産合計</td><td class="hl">630</td></tr></tbody></table><div class="formula-box">繰越利益剰余金（期末）＝前期繰越100＋当期純利益30＝130　　資産合計＝負債合計＋純資産合計</div>`,
    exp:'貸借対照表は「決算日の財産の記念写真」です。左側に「持っているもの（資産）」、右側に「借りているもの（負債）＋本当に自分のもの（純資産）」を書きます。左と右は必ず同じ金額になります。今年の利益（純利益）は「繰越利益剰余金」として純資産に加わります。' },

  { id:97, cat:'帳簿・精算表',
    q:'商品有高帳（先入先出法）：4/1残高@100×10個（計1,000円）、4/5仕入@130×20個（計2,600円）、4/10売上20個 のとき払出金額と期末残高を求めよ',
    ans_html: `<div class="tbl-sec">商品有高帳（先入先出法・FIFO）　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>受入<br>単価</th><th>受入<br>数量</th><th>受入<br>金額</th><th>払出<br>単価</th><th>払出<br>数量</th><th>払出<br>金額</th><th>残高<br>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>@100</td><td>10</td><td>1,000</td><td></td><td></td><td></td><td>1,000</td></tr><tr><td>4/5</td><td>仕入</td><td>@130</td><td>20</td><td>2,600</td><td></td><td></td><td></td><td>3,600</td></tr><tr><td>4/10</td><td>売上</td><td></td><td></td><td></td><td>@100</td><td>10</td><td>1,000</td><td></td></tr><tr><td></td><td>（続）</td><td></td><td></td><td></td><td>@130</td><td>10</td><td>1,300</td><td class="hl">1,300</td></tr><tr class="total-row"><td colspan="3">払出合計</td><td></td><td></td><td colspan="2">20個</td><td class="hl">2,300</td><td></td></tr></tbody></table><div class="formula-box">先入先出法：古い仕入（@100）から順に払い出す。期末残高は最新仕入単価（@130×10個）で構成される。</div>`,
    exp:'「古い商品から先に売れた」と考える計算方法です。先に仕入れた@100円の10個から売り、足りない分は後から仕入れた@130円から売るとします。20個売れたら（@100×10）＋（@130×10）＝2,300円が売上原価。残る10個は一番新しい@130円で評価されます。' },

  { id:98, cat:'帳簿・精算表',
    q:'商品有高帳（移動平均法）：4/1残高@100×10個（計1,000円）、4/5仕入@130×20個（計2,600円）、4/10売上20個 のとき払出金額と期末残高を求めよ',
    ans_html: `<div class="tbl-sec">商品有高帳（移動平均法）　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>受入<br>単価</th><th>受入<br>数量</th><th>受入<br>金額</th><th>払出<br>単価</th><th>払出<br>数量</th><th>払出<br>金額</th><th>残高<br>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>@100</td><td>10</td><td>1,000</td><td></td><td></td><td></td><td>1,000</td></tr><tr><td>4/5</td><td>仕入</td><td>@130</td><td>20</td><td>2,600</td><td></td><td></td><td></td><td class="hl">3,600</td></tr><tr><td></td><td>→平均単価</td><td class="hl" colspan="3">（1,000＋2,600）÷（10＋20）＝@120</td><td></td><td></td><td></td><td></td></tr><tr><td>4/10</td><td>売上</td><td></td><td></td><td></td><td class="hl">@120</td><td>20</td><td class="hl">2,400</td><td class="hl">1,200</td></tr></tbody></table><div class="formula-box">移動平均法：仕入れのたびに（残高金額＋受入金額）÷（残高数量＋受入数量）で平均単価を再計算する。</div>`,
    exp:'仕入れるたびに「1個あたりの平均値段」を計算し直す方法です。古い在庫と新しい仕入れを混ぜて割り算します。今回は（1,000円＋2,600円）÷30個＝@120円が新しい平均単価。20個売れたら@120×20＝2,400円が売上原価、残り10個は@120×10＝1,200円です。先入先出法（1,300円）と比べると期末在庫の評価が変わります。' },

  { id:99, cat:'帳簿・精算表',
    q:'帳簿の種類について、（　）に当てはまる言葉を答えよ。どの会社も必ず作る帳簿を【①　　　】といい、「仕訳帳」と「総勘定元帳」からなる。特定の内容を詳しく記録する帳簿を【②　　　】といい、現金出納帳・得意先元帳などがある。',
    ans_html: `<div class="tbl-sec">帳簿の分類</div><table><thead><tr><th>区分</th><th>帳簿名</th><th>役割</th></tr></thead><tbody><tr><td rowspan="2" class="hl">主要簿<br>（必須）</td><td>仕訳帳</td><td>すべての取引を日付順に仕訳記入</td></tr><tr><td>総勘定元帳</td><td>勘定科目ごとに分類・残高管理</td></tr><tr><td rowspan="5" class="hl">補助簿<br>（必要に応じ）</td><td>現金出納帳</td><td>現金の入出金があるとき</td></tr><tr><td>売掛金元帳（得意先元帳）</td><td>売掛金の増減があるとき（取引先別）</td></tr><tr><td>買掛金元帳（仕入先元帳）</td><td>買掛金の増減があるとき（仕入先別）</td></tr><tr><td>商品有高帳</td><td>商品の受入・払出があるとき</td></tr><tr><td>固定資産台帳</td><td>固定資産の取得・除却があるとき</td></tr></tbody></table><div class="tbl-sec">その他の主な補助簿</div><table><thead><tr><th>補助簿</th><th>記入タイミング</th></tr></thead><tbody><tr><td class="hl">当座預金出納帳</td><td>当座預金の入出金があるとき</td></tr><tr><td class="hl">売上帳・仕入帳</td><td>売上・仕入取引があるとき</td></tr><tr><td class="hl">受取手形記入帳</td><td>受取手形の取得・消滅があるとき</td></tr><tr><td class="hl">支払手形記入帳</td><td>支払手形の振出・消滅があるとき</td></tr></tbody></table>`,
    exp:'帳簿には2種類あります。①主要簿：全ての取引を日記みたいに書く「仕訳帳」と、科目ごとに集計する「総勘定元帳」です（どの会社も必ず作ります）。②補助簿：現金だけの帳簿や、お客さんごとの明細帳など、特定のことを詳しく記録する帳簿です（必要な分だけ作ります）。' },

  { id:100, cat:'帳簿・精算表',
    q:'試算表の種類について（　）に答えよ。①借方・貸方それぞれの合計を書くものを【ア　　　】という。②差し引き後の残高だけ書くものを【イ　　　】という。③両方を記入するものを【ウ　　　】という。現金（借方合計500・貸方合計200）の場合、残高はいくらか。',
    ans_html: `<div class="tbl-sec">試算表の種類と特徴</div><table><thead><tr><th>種類</th><th>借方に記入</th><th>貸方に記入</th><th>主な用途</th></tr></thead><tbody><tr><td class="hl">①合計試算表</td><td>借方合計</td><td>貸方合計</td><td>転記の正確性チェック</td></tr><tr><td class="hl">②残高試算表</td><td>借方残高</td><td>貸方残高</td><td>各勘定の純残高確認</td></tr><tr><td class="hl">③合計残高試算表</td><td>残高＋合計</td><td>合計＋残高</td><td>①②両方の機能を持つ</td></tr></tbody></table><div class="tbl-sec">合計残高試算表の記入例（現金：借方合計500・貸方合計200）</div><table><thead><tr><th colspan="2">借方</th><th>勘定科目</th><th colspan="2">貸方</th></tr><tr><th>残高</th><th>合計</th><th></th><th>合計</th><th>残高</th></tr></thead><tbody><tr><td class="hl">300</td><td>500</td><td>現金</td><td>200</td><td></td></tr></tbody></table><div class="formula-box">借方残高（300）＝借方合計500－貸方合計200　　試算表の借方合計＝貸方合計（貸借平均の原理）</div>`,
    exp:'試算表は「転記ミスがないか確認するための表」です。3種類あります。①合計試算表：左（借方）と右（貸方）それぞれの合計をそのまま書く。②残高試算表：差し引きした残高だけ書く。③合計残高試算表：①と②の両方を書く。どれも「借方合計＝貸方合計」になります。' },

  { id:101, cat:'帳簿・精算表',
    q:'帳簿の締め切りについて（　）に答えよ。①費用・収益勘定は決算時に【ア　　】勘定にまとめてゼロにする。②その差額（純利益）は【イ　　　　　　　】に振り替える。③資産・負債・純資産勘定は【ウ　　　】として翌期に引き継がれる。',
    ans_html: `<div class="tbl-sec">帳簿締め切りの手順</div><table><thead><tr><th>順序</th><th>対象勘定</th><th>締め切り方法</th></tr></thead><tbody><tr><td class="hl">①</td><td>費用勘定（仕入・給料等）</td><td>損益勘定の借方へ振替 → 費用勘定をゼロにする</td></tr><tr><td class="hl">②</td><td>収益勘定（売上・受取利息等）</td><td>損益勘定の貸方へ振替 → 収益勘定をゼロにする</td></tr><tr><td class="hl">③</td><td>損益勘定（集計勘定）</td><td>純利益→繰越利益剰余金へ振替 → 損益勘定をゼロにする</td></tr><tr><td class="hl">④</td><td>資産・負債・純資産勘定</td><td>残高を「次期繰越」として記入し帳簿を締め切る</td></tr></tbody></table><div class="tbl-sec">損益勘定のイメージ</div><table><thead><tr><th>損益（借方：費用）</th><th>損益（貸方：収益）</th></tr></thead><tbody><tr><td>仕入　490</td><td>売上　800</td></tr><tr><td>給料　280</td><td></td></tr><tr><td class="hl">当期純利益（→繰越利益剰余金）　30</td><td></td></tr><tr class="total-row"><td>合計　800</td><td>合計　800</td></tr></tbody></table>`,
    exp:'年末に帳簿をリセットする作業です。給料・売上などの費用・収益は「損益」という口座にまとめてゼロにし、差額（純利益）を純資産に移します。現金・建物などの資産・負債・純資産は消えずに「来年に繰り越し（次期繰越）」と書いて翌年のスタート残高になります。費用・収益はリセット、資産・負債は引き継ぎです。' },

  { id:102, cat:'帳簿・精算表',
    q:'精算表の修正記入：①期首商品100・期末商品150（売上原価算定）②未払給料30の計上 ③前払保険料20の繰延べ — の3件を精算表の修正記入欄に記入せよ',
    ans_html: `<div class="tbl-sec">精算表　修正記入欄の整理</div><table><thead><tr><th>整理内容</th><th>借方（修正）</th><th>貸方（修正）</th></tr></thead><tbody><tr><td>①しくり<br>（期首商品を仕入に加算）</td><td class="hl">仕入　100</td><td>繰越商品　100</td></tr><tr><td>①くりしわ<br>（期末商品を繰越商品に振替）</td><td class="hl">繰越商品　150</td><td>仕入　150</td></tr><tr><td>②未払給料の計上</td><td class="hl">給料　30</td><td>未払費用　30</td></tr><tr><td>③前払保険料の繰延べ</td><td class="hl">前払費用　20</td><td>支払保険料　20</td></tr><tr class="total-row"><td>修正合計</td><td>300</td><td>300</td></tr></tbody></table><div class="formula-box">修正記入欄の借方合計＝貸方合計（必ず均衡する）　　売上原価＝仕入残高＋100（期首）－150（期末）</div>`,
    exp:'精算表に3つの決算整理を書き込む作業です。①しくりくりし（在庫の確認）：期首商品を仕入に足して期末商品を引く。②まだ払っていない給料を費用に計上して「未払費用（負債）」も書く。③来年分の保険料を「前払費用（資産）」に移して今年の費用から除く。3つ書き終えると、修正欄の左合計と右合計が一致します。' },

  { id:103, cat:'帳簿・精算表',
    q:'伝票の種類について（　）に答えよ。3伝票制では①現金の入金→【ア】伝票、②現金の出金→【イ】伝票、③現金以外の取引→【ウ】伝票を使う。5伝票制ではさらに【エ】伝票と【オ】伝票が加わる。また代金の一部だけ現金で払った場合は何枚の伝票に分けて起票するか。',
    ans_html: `<div class="tbl-sec">伝票の種類</div><table><thead><tr><th>伝票</th><th>記入内容</th><th>3伝票制</th><th>5伝票制</th></tr></thead><tbody><tr><td class="hl">入金伝票</td><td>現金の入金取引</td><td>○</td><td>○</td></tr><tr><td class="hl">出金伝票</td><td>現金の出金取引</td><td>○</td><td>○</td></tr><tr><td class="hl">振替伝票</td><td>現金以外の取引（掛け等）</td><td>○</td><td>○</td></tr><tr><td class="hl">売上伝票</td><td>掛け売上取引</td><td>×</td><td>○</td></tr><tr><td class="hl">仕入伝票</td><td>掛け仕入取引</td><td>×</td><td>○</td></tr></tbody></table><div class="tbl-sec">一部現金取引の起票例（3伝票制）：備品250を現金50・当座預金200で購入</div><table><thead><tr><th>伝票種類</th><th>仕訳内容</th></tr></thead><tbody><tr><td class="hl">出金伝票</td><td>備品　50 ／ 現金　50</td></tr><tr><td class="hl">振替伝票</td><td>備品　200 ／ 当座預金　200</td></tr><tr class="total-row"><td>合算仕訳</td><td>備品　250 ／ 現金50・当座預金200</td></tr></tbody></table><div class="formula-box">伝票 → 仕訳集計表 → 総勘定元帳 の順に転記する</div>`,
    exp:'伝票は「仕訳を書く専用のメモ用紙」です。3伝票制では：現金が入ったとき→入金伝票、現金が出たとき→出金伝票、現金を使わない取引→振替伝票、の3種類に分けます。5伝票制はさらに掛け売上・掛け仕入専用の伝票が加わります。代金の一部だけ現金で払った場合は「現金の伝票」と「残りの伝票」の2枚に分けて起票します。' },

  // ===== 財務諸表読解 =====
  { id:104, cat:'財務諸表読解',
    q:'下記の「売掛金」総勘定元帳を読み、4月30日の次月繰越（月末残高）を求めよ。',
    q_html: `<div class="tbl-sec">売掛金　総勘定元帳（抜粋）　単位：円</div><table><thead><tr><th colspan="3">借　方</th><th colspan="3">貸　方</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>200,000</td><td>4/10</td><td>現金回収</td><td>150,000</td></tr><tr><td>4/5</td><td>売上（A商店）</td><td>100,000</td><td>4/18</td><td>返品（A商店）</td><td>20,000</td></tr><tr><td>4/20</td><td>売上（B商店）</td><td>80,000</td><td>4/30</td><td>次月繰越</td><td class="q-blank">？</td></tr><tr class="total-row"><td></td><td>合計</td><td>380,000</td><td></td><td>合計</td><td>380,000</td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">売掛金　総勘定元帳（抜粋）　単位：円</div><table><thead><tr><th colspan="3">借　方</th><th colspan="3">貸　方</th></tr><tr><th>日付</th><th>摘要</th><th>金額</th><th>日付</th><th>摘要</th><th>金額</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td>200,000</td><td>4/10</td><td>現金回収</td><td>150,000</td></tr><tr><td>4/5</td><td>売上（A商店）</td><td>100,000</td><td>4/18</td><td>返品（A商店）</td><td>20,000</td></tr><tr><td>4/20</td><td>売上（B商店）</td><td>80,000</td><td>4/30</td><td class="hl">次月繰越</td><td class="hl">210,000</td></tr><tr class="total-row"><td></td><td>合計</td><td>380,000</td><td></td><td>合計</td><td>380,000</td></tr></tbody></table><div class="formula-box">次月繰越＝借方合計380,000－現金回収150,000－返品20,000＝210,000円</div>`,
    exp:'T字型の帳簿では、左（借方）の合計と右（貸方）の合計を必ず一致させます。差額を埋めるために「次月繰越」を書き込みます。残高の求め方：「左合計（380,000）から右の取引（回収150,000＋返品20,000）を引く＝210,000円」です。合計を揃えるための数字と実際の残高は別物なので区別しましょう。' },

  { id:105, cat:'財務諸表読解',
    q:'下記の損益計算書（P/L）の空欄（ア）売上総利益と（イ）当期純利益を求めよ。',

    ans_html: `<div class="tbl-sec">損益計算書（自 令和X年4/1 至 令和X+1年3/31）　単位：円</div><table><tbody><tr><td>Ⅰ 売上高</td><td></td><td>1,200,000</td></tr><tr><td>Ⅱ 売上原価</td><td></td><td></td></tr><tr><td>　期首商品棚卸高</td><td>100,000</td><td></td></tr><tr><td>　当期商品仕入高</td><td>800,000</td><td></td></tr><tr><td>　合計</td><td>900,000</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>△120,000</td><td></td></tr><tr><td>　売上原価　計</td><td></td><td>△780,000</td></tr><tr class="total-row"><td class="hl">（ア）売上総利益</td><td></td><td class="hl">420,000</td></tr><tr><td>Ⅲ 販売費及び一般管理費</td><td></td><td></td></tr><tr><td>　給料</td><td>200,000</td><td></td></tr><tr><td>　支払家賃</td><td>120,000</td><td></td></tr><tr><td>　減価償却費</td><td>50,000</td><td></td></tr><tr><td>　貸倒引当金繰入</td><td>10,000</td><td></td></tr><tr><td>　費用合計</td><td></td><td>△380,000</td></tr><tr class="total-row"><td class="hl">（イ）当期純利益</td><td></td><td class="hl">40,000</td></tr></tbody></table><div class="formula-box">（ア）売上総利益＝1,200,000－780,000＝420,000　　（イ）当期純利益＝420,000－380,000＝40,000</div>`,
    exp:'損益計算書（P/L）は「1年間の会社の成績表」です。売上総利益（粗利）＝売上高－売上原価で「商品ビジネスそのものの儲け」を計算します。そこから給料・家賃・減価償却費など「会社を動かすコスト（販管費）」を引いた残りが最終利益（当期純利益）です。粗利が高くても運営コストが大きければ赤字になります。' },

  { id:106, cat:'財務諸表読解',
    q:'下記の貸借対照表（B/S）を読み、①純資産合計と②繰越利益剰余金の残高を求めよ。',

    ans_html: `<div class="tbl-sec">貸借対照表（令和X年3月31日現在）　単位：円</div><table><thead><tr><th colspan="2">資産の部</th><th colspan="2">負債・純資産の部</th></tr></thead><tbody><tr><td>【流動資産】</td><td></td><td>【流動負債】</td><td></td></tr><tr><td>現金及び預金</td><td>480,000</td><td>買掛金</td><td>220,000</td></tr><tr><td>売掛金</td><td>300,000</td><td>未払費用</td><td>30,000</td></tr><tr><td>貸倒引当金</td><td>△6,000</td><td>前受収益</td><td>20,000</td></tr><tr><td>繰越商品</td><td>120,000</td><td>流動負債合計</td><td>270,000</td></tr><tr><td>前払費用</td><td>10,000</td><td>【固定負債】</td><td></td></tr><tr><td>流動資産合計</td><td>904,000</td><td>長期借入金</td><td>300,000</td></tr><tr><td>【固定資産】</td><td></td><td>固定負債合計</td><td>300,000</td></tr><tr><td>備品</td><td>400,000</td><td>負債合計</td><td>570,000</td></tr><tr><td>減価償却累計額</td><td>△100,000</td><td>【純資産の部】</td><td></td></tr><tr><td>固定資産合計</td><td>300,000</td><td>資本金</td><td>500,000</td></tr><tr><td></td><td></td><td class="hl">②繰越利益剰余金</td><td class="hl">134,000</td></tr><tr><td></td><td></td><td class="hl">①純資産合計</td><td class="hl">634,000</td></tr><tr class="total-row"><td>資産合計</td><td>1,204,000</td><td>負債・純資産合計</td><td>1,204,000</td></tr></tbody></table><div class="formula-box">①純資産合計＝資産合計1,204,000－負債合計570,000＝634,000　　②繰越利益剰余金＝634,000－資本金500,000＝134,000</div>`,
    exp:'貸借対照表（B/S）は「今この日時点の財産状態」を示す表です。資産（持っているもの）＝負債（借りたもの）＋純資産（本当に自分のもの）は会計の鉄則です。純資産とは「全資産から借金を全部返した後に残る本当の自分の財産」。繰越利益剰余金はその中の「これまでに稼いだ利益の積み重ね」です。' },

  { id:107, cat:'財務諸表読解',
    q:'得意先元帳（A商店）を読んで、4月28日現在の売掛金残高を求めよ。',

    ans_html: `<div class="tbl-sec">得意先元帳（売掛金元帳）　A商店　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>借方（売上等）</th><th>貸方（回収等）</th><th>残高</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td></td><td></td><td>80,000</td></tr><tr><td>4/5</td><td>掛け売上</td><td>120,000</td><td></td><td>200,000</td></tr><tr><td>4/12</td><td>普通預金入金</td><td></td><td>80,000</td><td>120,000</td></tr><tr><td>4/20</td><td>掛け売上</td><td>60,000</td><td></td><td>180,000</td></tr><tr><td>4/28</td><td>返品</td><td></td><td>10,000</td><td class="hl">170,000</td></tr></tbody></table><div class="formula-box">4/28残高＝180,000－10,000＝170,000円</div>`,
    exp:'得意先元帳は「A商店との掛け取引の専用通帳」のようなものです。売上で残高が増え、入金や返品で残高が減ります。総勘定元帳の売掛金勘定が全取引先の合計なら、得意先元帳はその取引先別の内訳明細です。両者の合計は常に一致します。' },

  { id:108, cat:'財務諸表読解',
    q:'現金出納帳を読んで4月28日の現金残高を求めよ。また「前月繰越＋収入合計－支出合計」で検算せよ。',
    q_html: `<div class="tbl-sec">現金出納帳　単位：円</div><table><thead><tr><th>日付</th><th>摘要</th><th>収入</th><th>支出</th><th>残高</th></tr></thead><tbody><tr><td>4/1</td><td>前月繰越</td><td></td><td></td><td>100,000</td></tr><tr><td>4/3</td><td>売掛金回収</td><td>50,000</td><td></td><td>150,000</td></tr><tr><td>4/8</td><td>仕入代金支払</td><td></td><td>80,000</td><td>70,000</td></tr><tr><td>4/15</td><td>給料支払</td><td></td><td>30,000</td><td>40,000</td></tr><tr><td>4/22</td><td>受取手数料</td><td>20,000</td><td></td><td>60,000</td></tr><tr><td>4/28</td><td>旅費交通費支払</td><td></td><td>15,000</td><td class="q-blank">？</td></tr><tr class="total-row"><td></td><td>月計</td><td>70,000</td><td>125,000</td><td></td></tr></tbody></table>`,

    exp:'現金出納帳は「会社の財布の家計簿」です。残高は「前の残高＋収入－支出」で常に計算できます。逐次計算（一行ずつ）と合計計算（前月繰越＋収入合計－支出合計）の2通りで検算できます。この帳簿の残高は総勘定元帳の現金勘定と必ず一致します。ズレがあれば転記ミスのサインです。' },

  { id:109, cat:'財務諸表読解',
    q:'下記の残高試算表を読み、（ア）借入金の残高と（イ）試算表の貸方合計を求めよ。借方合計は1,500,000円である。',
    q_html: `<div class="tbl-sec">残高試算表（抜粋）　単位：円</div><table><thead><tr><th>借方残高</th><th>勘定科目</th><th>貸方残高</th></tr></thead><tbody><tr><td>450,000</td><td>現金</td><td></td></tr><tr><td>300,000</td><td>売掛金</td><td></td></tr><tr><td>150,000</td><td>繰越商品</td><td></td></tr><tr><td>200,000</td><td>備品</td><td></td></tr><tr><td></td><td>買掛金</td><td>180,000</td></tr><tr><td></td><td>借入金</td><td class="q-blank">（ア）？</td></tr><tr><td></td><td>資本金</td><td>500,000</td></tr><tr><td>400,000</td><td>仕入</td><td></td></tr><tr><td></td><td>売上</td><td>720,000</td></tr><tr class="total-row"><td>1,500,000</td><td>合計</td><td class="q-blank">（イ）？</td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">残高試算表（抜粋）　単位：円</div><table><thead><tr><th>借方残高</th><th>勘定科目</th><th>貸方残高</th></tr></thead><tbody><tr><td>450,000</td><td>現金</td><td></td></tr><tr><td>300,000</td><td>売掛金</td><td></td></tr><tr><td>150,000</td><td>繰越商品</td><td></td></tr><tr><td>200,000</td><td>備品</td><td></td></tr><tr><td></td><td>買掛金</td><td>180,000</td></tr><tr><td></td><td>借入金</td><td class="hl">（ア）100,000</td></tr><tr><td></td><td>資本金</td><td>500,000</td></tr><tr><td>400,000</td><td>仕入</td><td></td></tr><tr><td></td><td>売上</td><td>720,000</td></tr><tr class="total-row"><td>1,500,000</td><td>合計</td><td class="hl">（イ）1,500,000</td></tr></tbody></table><div class="formula-box">（イ）貸方合計＝借方合計（貸借平均の原理）＝1,500,000　　（ア）借入金＝1,500,000－180,000－500,000－720,000＝100,000円</div>`,
    exp:'試算表最大の武器は「借方合計＝貸方合計（貸借平均の原理）」です。この法則を使えば、合計が既知なら未知の勘定残高を逆算できます。「貸方合計＝借方合計（1,500,000円）」なので、判明している金額を合計から引くと残りが求まります。試験では「空欄が1つ」の逆算問題がよく出ます。' },

    q_html: `<div class="tbl-sec">精算表（8欄）　単位：円</div><table><thead><tr><th rowspan="2">勘定科目</th><th colspan="2">残高試算表</th><th colspan="2">修正記入</th><th colspan="2">損益計算書</th><th colspan="2">貸借対照表</th></tr><tr><th>借</th><th>貸</th><th>借</th><th>貸</th><th>費用</th><th>収益</th><th>資産</th><th>負債・純資産</th></tr></thead><tbody><tr><td>現金</td><td>1,200,000</td><td></td><td></td><td></td><td></td><td></td><td>1,200,000</td><td></td></tr><tr><td>繰越商品</td><td>100,000</td><td></td><td>150,000</td><td>100,000</td><td></td><td></td><td>150,000</td><td></td></tr><tr><td>買掛金</td><td></td><td>200,000</td><td></td><td></td><td></td><td></td><td></td><td>200,000</td></tr><tr><td>資本金</td><td></td><td>1,000,000</td><td></td><td></td><td></td><td></td><td></td><td>1,000,000</td></tr><tr><td>繰越利益剰余金</td><td></td><td>100,000</td><td></td><td></td><td></td><td></td><td></td><td class="q-blank">（イ）？</td></tr><tr><td>売上</td><td></td><td>700,000</td><td></td><td></td><td></td><td>700,000</td><td></td><td></td></tr><tr><td>仕入</td><td>500,000</td><td></td><td>100,000</td><td>150,000</td><td>450,000</td><td></td><td></td><td></td></tr><tr><td>給料</td><td>200,000</td><td></td><td></td><td></td><td>200,000</td><td></td><td></td><td></td></tr><tr class="total-row"><td>損益計算書欄小計</td><td></td><td></td><td></td><td></td><td>650,000</td><td>700,000</td><td></td><td></td></tr><tr class="total-row"><td>（ア）当期純利益</td><td></td><td></td><td></td><td></td><td></td><td class="q-blank">（ア）？</td><td></td><td></td></tr></tbody></table>`,
    ans_html: `<div class="tbl-sec">精算表（8欄）　単位：円</div><table><thead><tr><th rowspan="2">勘定科目</th><th colspan="2">残高試算表</th><th colspan="2">修正記入</th><th colspan="2">損益計算書</th><th colspan="2">貸借対照表</th></tr><tr><th>借</th><th>貸</th><th>借</th><th>貸</th><th>費用</th><th>収益</th><th>資産</th><th>負債・純資産</th></tr></thead><tbody><tr><td>現金</td><td>1,200,000</td><td></td><td></td><td></td><td></td><td></td><td>1,200,000</td><td></td></tr><tr><td>繰越商品</td><td>100,000</td><td></td><td class="hl">150,000</td><td class="hl">100,000</td><td></td><td></td><td class="hl">150,000</td><td></td></tr><tr><td>買掛金</td><td></td><td>200,000</td><td></td><td></td><td></td><td></td><td></td><td>200,000</td></tr><tr><td>資本金</td><td></td><td>1,000,000</td><td></td><td></td><td></td><td></td><td></td><td>1,000,000</td></tr><tr><td>繰越利益剰余金</td><td></td><td>100,000</td><td></td><td></td><td></td><td></td><td></td><td class="hl">（イ）150,000</td></tr><tr><td>売上</td><td></td><td>700,000</td><td></td><td></td><td></td><td class="hl">700,000</td><td></td><td></td></tr><tr><td>仕入</td><td>500,000</td><td></td><td>100,000</td><td>150,000</td><td class="hl">450,000</td><td></td><td></td><td></td></tr><tr><td>給料</td><td>200,000</td><td></td><td></td><td></td><td class="hl">200,000</td><td></td><td></td><td></td></tr><tr class="total-row"><td>損益計算書欄小計</td><td></td><td></td><td></td><td></td><td>650,000</td><td>700,000</td><td></td><td></td></tr><tr class="total-row"><td class="hl">（ア）当期純利益</td><td></td><td></td><td></td><td></td><td></td><td class="hl">50,000</td><td></td><td></td></tr></tbody></table><div class="formula-box">（ア）当期純利益＝収益700,000－費用650,000＝50,000　　（イ）繰越利益剰余金＝前期繰越100,000＋純利益50,000＝150,000</div>`,
    exp:'精算表では「費用合計と収益合計の差額」が当期純利益（収益＞費用の場合）です。この純利益はB/S欄の繰越利益剰余金に上乗せされ、P/LとB/Sの数字が繋がります。「利益が出ると純資産（繰越利益剰余金）が増える」仕組みをここで確認できます。' },

  // ===== 2級：株式発行・合併 =====
  { id:111, level:2, cat:'株式発行',
    q:'会社設立時に株式10株を1株50円で発行し、払込金（500円）が普通預金に振り込まれた（資本金は払込金額の1/2）。また設立費用100円を現金で支払った。仕訳を示せ。',
    e:[{d:[['普通預金',500]], c:[['資本金',250],['資本準備金',250]]}, {d:[['創立費',100]], c:[['現金',100]]}],
    note:'払込金500→資本金250・資本準備金250（各1/2）',
    exp:'株式を発行して投資家から500円を集めました。会社法のルールで「もらった500円の半分（250円）は絶対に守らなくてはいけない元手（資本金）」、「もう半分（250円）は予備の資本（資本準備金）」に分けます。設立費100円は「お店を開くための準備費用（創立費・資産）」として一度資産に計上し、後から少しずつ費用にします。' },

  { id:112, level:2, cat:'株式発行',
    q:'①株式の申込を受け付け、申込証拠金300円を受け入れた。②株式を正式に発行し、証拠金を資本金・資本準備金（各150円）に振り替え、普通預金に移した。仕訳を示せ。',
    e:[
      {d:[['別段預金',300]], c:[['株式申込証拠金',300]]},
      {d:[['株式申込証拠金',300]], c:[['資本金',150],['資本準備金',150]]},
      {d:[['普通預金',300]], c:[['別段預金',300]]}
    ],
    note:'①申込受付：別段預金に入金　②発行確定：証拠金→資本金・資本準備金（各150）、別段→普通預金へ移動',
    exp:'株式発行は2ステップです。①申込受付時：まだ正式に株式を出していないのでもらったお金を「別段預金（申込専用の銀行口座）」に入れて、もらった義務「株式申込証拠金（負債）」を記録します。②発行確定時：「証拠金→資本金・資本準備金」に振り替え、「別段預金→普通預金」に移します。「まず仮置きして、確定したら本番に移す」という2段階処理です。' },

  { id:113, level:2, cat:'企業合併',
    q:'A社はB社を吸収合併し、B社の諸資産1,000円と諸負債400円を引き継いだ。対価として自社の資本金を800円増加させた。仕訳を示せ。',
    e:[{d:[['諸資産',1000],['のれん',200]], c:[['諸負債',400],['資本金',800]]}],
    note:'のれん＝交付資本800－引継純資産（1,000－400）＝200',
    exp:'吸収合併とは「A社がB社を丸ごと買い取ること」です。B社の財産（諸資産1,000）と借金（諸負債400）を引き継ぎ、差し引きの実質的価値は600円です。でもA社は800円分の株式を渡しました。余分に払った200円が「のれん（資産）」です。のれんとは「B社のお客さんや信頼・ブランドなど目に見えない価値に払ったお金」のことです。' },

  // ===== 2級：決算振替 =====
  { id:114, level:2, cat:'決算振替',
    q:'決算振替として、①当期純利益300円、②当期純損失200円（別の期の例）それぞれにおける損益勘定の振替仕訳を示せ。',
    e:[{d:[['損益',300]], c:[['繰越利益剰余金',300]]}, {d:[['繰越利益剰余金',200]], c:[['損益',200]]}],
    exp:'1年間の稼ぎと出費を「損益」という集計口座に全部集めます。①利益が出た（300円）場合：損益勘定が貸方残（利益）になるので、借方に損益を書いて会社の貯金（繰越利益剰余金）に移します。②赤字（200円）の場合：逆に貯金（繰越利益剰余金）を削ります。損益勘定は毎年リセットされる「1年用の成績集計表」です。' },

  // ===== 2級：剰余金・配当・準備金 =====
  { id:115, level:2, cat:'剰余金・配当',
    q:'株主総会で繰越利益剰余金を財源に、配当金1,000円の支払い・利益準備金100円の積立・別途積立金300円の積立を決議した。仕訳を示せ。',
    e:[{d:[['繰越利益剰余金',1400]], c:[['未払配当金',1000],['利益準備金',100],['別途積立金',300]]}],
    note:'取崩額＝1,000＋100＋300＝1,400',
    exp:'株主総会で「配当しよう！」と決議した瞬間に、「まだ払っていなくても未払配当金（負債）」が生まれます。お財布（繰越利益剰余金）から出ていくイメージです。利益準備金は法律で「絶対に積み立てなさい」と決められた貯金。別途積立金は「念のために取っておこう」という会社独自の貯金です。合計1,400円が繰越利益剰余金から出ていきます。' },

  { id:116, level:2, cat:'剰余金・配当',
    q:'株主総会で、その他資本剰余金を財源として配当金800円の支払いと、資本準備金80円の積立を決議した。仕訳を示せ。',
    e:[{d:[['その他資本剰余金',880]], c:[['未払配当金',800],['資本準備金',80]]}],
    note:'取崩額＝800＋80＝880',
    exp:'配当のお金がどこから出るかで「積み立てる準備金の種類」が変わります。「その他資本剰余金（株主から集めたお金系）」を使うなら→「資本準備金」を積み立てる。「繰越利益剰余金（稼いだ利益系）」を使うなら→「利益準備金」を積み立てる。「お金の出どころと積立先がセットになっている」と覚えましょう。' },

  { id:117, level:2, cat:'剰余金・配当',
    q:'繰越利益剰余金を財源に500円の配当を行う。資本金60,000円・資本準備金4,000円・利益準備金3,000円のとき、今回積み立てるべき利益準備金はいくらか。仕訳を示せ。',
    e:[{d:[['繰越利益剰余金',550]], c:[['未払配当金',500],['利益準備金',50]]}],
    note:'積立限度額＝60,000÷4－(4,000＋3,000)＝8,000　配当500÷10＝50 → 50円積立',
    exp:'利益準備金には「これ以上積まなくていい上限」があります。上限＝資本金の1/4（60,000÷4＝15,000円）から、すでに積んだ準備金の合計（資本準備金4,000＋利益準備金3,000＝7,000円）を引いた8,000円です。今回積む義務がある金額は「配当の1/10＝500÷10＝50円」です。上限8,000円に余裕があるので50円丸ごと積み立てます。上限に達したら積立ゼロでOKになります。' },

  { id:118, level:2, cat:'剰余金・準備金',
    q:'①資本準備金200円を資本金に組み入れた。②利益準備金100円を繰越利益剰余金に振り替えた。仕訳を示せ。',
    e:[{d:[['資本準備金',200]], c:[['資本金',200]]}, {d:[['利益準備金',100]], c:[['繰越利益剰余金',100]]}],
    exp:'資本準備金を資本金に移すのは「予備の資本金を本番の資本金に昇格させる」だけです。純資産の中での引っ越しなのでトータルは変わりません。逆に利益準備金を繰越利益剰余金に戻すと「法定貯金を自由なお財布に戻す」ので、配当に使える金額が増えます。どちらも純資産内部の組み替えで、外からは何も変わりません。' },

  // ===== 2級：法人税等・消費税 =====
  { id:119, level:2, cat:'法人税等',
    q:'①決算で当期の法人税・住民税及び事業税2,500円を確定させた（中間納付1,000円は仮払法人税等として計上済）。②翌期に未払分を現金で納付した。仕訳を示せ。',
    e:[
      {d:[['法人税・住民税及び事業税',2500]], c:[['仮払法人税等',1000],['未払法人税等',1500]]},
      {d:[['未払法人税等',1500]], c:[['現金',1500]]}
    ],
    note:'①決算確定：中間納付1,000を相殺→残1,500を未払計上　②翌期：未払分を現金で納付',
    exp:'2級では法人税の正式名称「法人税・住民税及び事業税」を使います。年度の途中で払う1,000円は「まだ確定していない仮払い（仮払法人税等・資産）」として帳簿に置いておきます。年末に2,500円と確定したら「仮払い1,000円を差し引いた残り1,500円がまだ払っていない税金（未払法人税等・負債）」として記録します。翌年に払って負債が消えます。' },

  { id:120, level:2, cat:'消費税',
    q:'税抜経理方式を採用している。①商品（本体100円）を税込110円で現金仕入した。②商品（本体300円）を税込330円で現金売上した（消費税率10%）。仕訳を示せ。',
    e:[{d:[['仕入',100],['仮払消費税',10]], c:[['現金',110]]}, {d:[['現金',330]], c:[['売上',300],['仮受消費税',30]]}],
    note:'①110＝本体100＋消費税10　②330＝本体300＋消費税30',
    exp:'税抜経理とは「消費税と本体の値段を別々に記録する方法」です。商品を100円で仕入れて消費税10円を払ったとき、本体100円は「仕入（費用）」、消費税10円は「仮払消費税（資産）」として分けて記録します。売上側の消費税は「仮受消費税（負債）」として国への預かりものにします。決算でこの2つを相殺して差額を国に納めます。' },

  { id:121, level:2, cat:'消費税',
    q:'①決算：仮払消費税1,000円・仮受消費税3,000円を確定させた。②翌期：確定した消費税を現金で納付した。仕訳を示せ。',
    e:[
      {d:[['仮受消費税',3000]], c:[['仮払消費税',1000],['未払消費税',2000]]},
      {d:[['未払消費税',2000]], c:[['現金',2000]]}
    ],
    note:'①決算：仮受3,000から仮払1,000を相殺→未払消費税2,000　②翌期：現金で納付',
    exp:'決算時に「仮受消費税（3,000円）から仮払消費税（1,000円）を引いた差額（2,000円）」が国に払う「未払消費税（負債）」になります。3,000円預かって1,000円立て替えたので差し引き2,000円を国に納めます。翌期に実際に払って負債が消えます。' },

  // ===== 2級：商品売買 =====
  { id:122, level:2, cat:'商品売買',
    q:'原価1,500円の商品を2,100円で掛け売りした。売上のつど売上原価を計上する方法（商品勘定使用）を採用している。仕訳を示せ。',
    e:[{d:[['売掛金',2100]], c:[['売上',2100]]}, {d:[['売上原価',1500]], c:[['商品',1500]]}],
    note:'①売上2,100を計上　②原価1,500を商品→売上原価へ振替',
    exp:'商品を売るたびに「収益（売上）と費用（売上原価）を同時に記録する方法」です。たとえばラーメン屋さんが1杯1,500円で麺700円を使って売ったとき、「売上1,500・売上原価700」を同時に記録します。レジを打つたびに利益がリアルタイムでわかります。3級の「三分法（期末一括計算）」と違い、即座に粗利が計算できます。' },

  { id:123, level:2, cat:'商品売買',
    q:'仕入先から当月の仕入高に対する割戻し（リベート）10円が通知された（掛け代金から差し引く）。仕訳を示せ。',
    e:[{d:[['買掛金',10]], c:[['仕入',10]]}],
    exp:'割戻し（リベート）とは「たくさん買ってくれてありがとう！その分値引きします」というご褒美です。仕入先から「買掛金10円を減らしてあげる」と通知が来たので、買掛金（借金）を10円減らし、仕入（費用）も10円取り消します。現金のやり取りなしで帳簿上だけで「仕入コストが安くなる」処理です。' },

  // ===== 2級：手形 =====
  { id:124, level:2, cat:'手形',
    q:'①所持する受取手形1,000円を仕入代金の支払いとして裏書譲渡した。②商品を2,000円で売り上げ、得意先振出・当社宛の約束手形を受け取った。仕訳を示せ。',
    e:[{d:[['仕入',1000]], c:[['受取手形',1000]]}, {d:[['受取手形',2000]], c:[['売上',2000]]}],
    exp:'受取手形とは「○○日に銀行に入金されます」という約束書です。この約束書を「仕入代金の支払い」に使うことを「裏書き譲渡」といいます。手形の裏に署名して相手に渡せば現金なしで仕入代金が払えます。手形という「券」で別の支払いを連鎖させる仕組みです。現金が足りないときの資金繰りにも使われます。' },

  { id:125, level:2, cat:'手形',
    q:'所持する受取手形（額面100円）を期日前に銀行で換金（割引）した。割引料10円を差し引かれた手取金90円が当座預金に振り込まれた。仕訳を示せ。',
    e:[{d:[['当座預金',90],['手形売却損',10]], c:[['受取手形',100]]}],
    note:'手取金90＝額面100－割引料10',
    exp:'手形を期日前に銀行に「売って」現金に換えることを「手形割引」といいます。100円の手形を今すぐ現金化したいので銀行に持っていくと「手数料を引いて90円しか払えないよ」と言われます。差額10円が「手形売却損（費用）」です。急いで現金が必要なときに使う方法ですが、10円損してしまいます。' },

  { id:126, level:2, cat:'手形',
    q:'①満期日に受取手形500円が不渡りとなり、償還請求費用20円を現金で支払った。②その後、不渡分の全額（520円）が回収された。仕訳を示せ。',
    e:[
      {d:[['不渡手形',520]], c:[['受取手形',500],['現金',20]]},
      {d:[['現金',520]], c:[['不渡手形',520]]}
    ],
    note:'①不渡り発生：手形500＋償還費用20＝520を不渡手形に振替　②全額回収：現金で回収・不渡手形を消去',
    exp:'不渡りとは「期日になったのにお金が入ってこなかった手形」のことです。手形の名前を「受取手形（普通の権利）」から「不渡手形（問題のある権利）」に変えて管理します。法的な取り立て費用20円もプラスして520円として追跡します。全額回収できたら「不渡手形を消して現金を増やす」だけです。回収できなければ「貸倒損失」として損失にします。' },

  { id:127, level:2, cat:'手形',
    q:'不渡手形300円（諸費用含む）が回収不能と判明し、貸倒れ処理した。仕訳を示せ。',
    e:[{d:[['貸倒損失',300]], c:[['不渡手形',300]]}],
    exp:'もう絶対に返ってこないとわかったとき、「不渡手形（資産）」を消して「貸倒損失（費用・損失）」に変えます。「あきらめて損失として確定させる」処理です。もし事前に「引当金（そなえ）」を積んでいれば、そちらで先に賄えるので追加の損失が少なくなります。' },

  // ===== 2級：電子記録 =====
  { id:128, level:2, cat:'電子記録',
    q:'電子記録債務の支払期日が到来し、A社（債務者）の当座預金からB社（債権者）へ1,000円が決済された。A・B両社それぞれの仕訳を示せ。',
    e:[
      {d:[['電子記録債務',1000]], c:[['当座預金',1000]]},
      {d:[['当座預金',1000]], c:[['電子記録債権',1000]]}
    ],
    note:'A社（債務者）の仕訳　B社（債権者）の仕訳',
    exp:'電子記録の期日決済は「電子データが消えてお金が動く」瞬間です。支払うA社は「電子記録の借金が消えて銀行残高が減り」、受け取るB社は「電子記録の権利が消えて銀行残高が増え」ます。紙の手形と違ってデータだけでやり取りするので、A社とB社の仕訳は「かがみ写し（まったく逆）」になります。' },

  { id:129, level:2, cat:'電子記録',
    q:'BはAに対する電子記録債権1,000円を、C社への買掛金支払いとしてCに譲渡した。B・C両社それぞれの仕訳を示せ。',
    e:[
      {d:[['買掛金',1000]], c:[['電子記録債権',1000]]},
      {d:[['電子記録債権',1000]], c:[['売掛金',1000]]}
    ],
    note:'B（譲渡人）の仕訳　C（譲受人）の仕訳',
    exp:'電子記録債権の譲渡は「電子化した受取手形の裏書き渡し」とまったく同じです。BはAから受け取った「電子記録の権利」をCへの買掛金支払いに使います。C商店は「AさんからBさんに支払われるはずだったお金を、直接自分がもらう権利」を受け取ります。現金なしでB・C間の借金が解決できます。' },

  { id:130, level:2, cat:'電子記録',
    q:'所持する電子記録債権1,000円を950円で金融機関に売却し、代金が当座預金に入金された。仕訳を示せ。',
    e:[{d:[['当座預金',950],['電子記録債権売却損',50]], c:[['電子記録債権',1000]]}],
    note:'手取金950＝額面1,000－損失50',
    exp:'電子記録債権を「手形割引と同じように期日前に売って現金化する」処理です。1,000円の権利なのに急いでいるので950円で銀行に売ります。差額50円が損（電子記録債権売却損・費用）になります。「50円損してでも今すぐ現金がほしい！」という状況で使います。' },

  { id:131, level:2, cat:'電子記録',
    q:'備品（帳簿価額700円）を700円で売却し、代金は電子記録によることとした。仕訳を示せ。',
    e:[{d:[['営業外電子記録債権',700]], c:[['備品',700]]}],
    exp:'備品（固定資産）を売ったお金を電子記録で受け取る場合、商品の売り上げではないので「営業外電子記録債権」という特別な名前を使います。通常の電子記録債権（商品売買用）と区別するための名前の違いだけで、性質は同じです。「日常の商売以外（営業外）の取引で生まれた電子記録の権利」という意味です。' },

  { id:132, level:2, cat:'電子記録',
    q:'事業用の土地800円を購入し、代金は電子記録によることとした。仕訳を示せ。',
    e:[{d:[['土地',800]], c:[['営業外電子記録債務',800]]}],
    exp:'土地（固定資産）を買う代金を電子記録で支払う約束をした場合、商品の仕入れではないので「営業外電子記録債務」という特別な名前を使います。通常の買掛金の代わりに電子記録を使う場合（= 電子記録債務）と区別するための名前です。「日常の商売以外の取引で生まれた電子記録の借金」という意味です。' },

  { id:133, level:2, cat:'電子記録',
    q:'A社に対して売掛金300円と買掛金500円がある。両社の合意のもと300円分を相殺した。仕訳を示せ。',
    e:[{d:[['買掛金',300]], c:[['売掛金',300]]}],
    exp:'相殺とは「お互いの貸し借りを帳消しにすること」です。「A社に300円払う」と「A社から300円もらう」が同時にあるなら、差し引きゼロにすれば2回のお金の動きを省けます。実際に現金を往復させる手間がなくなります。相殺後は買掛金が500円から300円引かれて200円だけ残ります。' },

  { id:134, level:2, cat:'電子記録',
    q:'A社に対する売掛金1,000円をD社（ファクタリング会社）に950円で売却し、代金が普通預金に入金された。仕訳を示せ。',
    e:[{d:[['普通預金',950],['債権売却損',50]], c:[['売掛金',1000]]}],
    note:'手取金950＝売掛金1,000－損失50',
    exp:'ファクタリングとは「将来もらえるはずの売掛金をファクタリング会社に売ってすぐ現金化する」仕組みです。本来1,000円もらえるはずの権利を950円で売るので50円の損（債権売却損）が出ます。でも「翌月まで待たずに今すぐ現金がほしい！」ときに使います。リスクを引き受けた代わりにD社が50円を儲けるという仕組みです。' },

  // ===== 2級：修正仕訳 =====
  { id:135, level:2, cat:'修正仕訳',
    q:'得意先から売掛金300円が当座預金に振り込まれていたが、会社はまだ通知を受け取っておらず未記帳だった。仕訳を示せ。',
    e:[{d:[['当座預金',300]], c:[['売掛金',300]]}],
    exp:'銀行には入金されているのに会社の帳簿には載っていない！という場合の処理です。「銀行側はもう処理済み、会社側がまだ」という「企業未処理」のケースです。通知を受け取った時点で「当座預金（銀行口座の残高）が増えた＋売掛金（受け取る権利）が消えた」という仕訳を書いて帳簿を実態に合わせます。' },

  { id:136, level:2, cat:'修正仕訳',
    q:'売掛金50円を現金で回収した際、誤って「当座預金50 / 売掛金50」と記帳した。正しい仕訳に訂正せよ。',
    e:[{d:[['売掛金',50]], c:[['当座預金',50]]}, {d:[['現金',50]], c:[['売掛金',50]]}],
    exp:'間違えた仕訳を直す方法は「①間違いを逆向きに消す→②正しく書き直す」の2ステップです。①「当座預金50 / 売掛金50」を逆にすると「売掛金50 / 当座預金50」（これで間違いがゼロに）、②正しくは「現金50 / 売掛金50」。2本を足すと「現金50 / 当座預金50」の1本になります。テストでは「逆仕訳＋正しい仕訳」の2本を書けばOKです。' },

  { id:137, level:2, cat:'修正仕訳',
    q:'買掛金800円の支払いのため小切手を振り出し「買掛金800 / 当座預金800」と記帳したが、この小切手はまだ仕入先に渡していなかった。修正仕訳を示せ。',
    e:[{d:[['当座預金',800]], c:[['買掛金',800]]}],
    exp:'小切手を作っても「まだ相手に渡していない」なら支払いは完了していません！なのに帳簿から「当座預金800を減らして買掛金を消す」という仕訳を先にしてしまっています。これを元に戻すため「当座預金800を増やして買掛金を復活させる」逆仕訳を書きます。「渡してから支払い完了」というルールを忘れないようにしましょう。' },

  { id:138, level:2, cat:'修正仕訳',
    q:'広告宣伝費600円の支払いのため小切手を振り出し「広告宣伝費600 / 当座預金600」と記帳したが、この小切手はまだ広告会社に渡していなかった。修正仕訳を示せ。',
    e:[{d:[['当座預金',600]], c:[['未払金',600]]}],
    exp:'Q137との違いがポイントです。買掛金（仕入れ代金）のケース（Q137）は支払い・費用ともに未確定でした。広告費のケースでは「広告サービスを受けた事実はある＝費用はすでに確定」しているのでそのまま残します。ただし「小切手を渡していない＝まだ払っていない」ので当座預金の減少だけ取り消し、「未払金（負債）」に置き換えます。' },

  // ===== 2級：固定資産（営業外手形・割賦・減価償却・除却・建設仮勘定） =====
  { id:139, level:2, cat:'固定資産',
    q:'備品を購入し、代金の支払いに約束手形を振り出した。仕訳を示せ。',
    e:[{d:['備品'], c:['営業外支払手形']}],
    exp:'固定資産（備品）の購入代金に手形を使うとき、商品仕入の手形（支払手形）と区別して「営業外支払手形（負債）」と書きます。「営業外」とは「商品の売り買い以外の取引」という意味です。性質は支払手形と同じ「○日に必ず払います」という約束書です。' },

  { id:140, level:2, cat:'固定資産',
    q:'備品（帳簿価額800円・直接法）を850円で売却し、代金は約束手形で受け取った。仕訳を示せ。',
    e:[{d:[['営業外受取手形',850]], c:[['備品',800],['固定資産売却益',50]]}],
    exp:'直接法とは「減価償却した分を備品の金額から直接引いてある記帳方法」です。なので帳簿に載っている備品の価額がそのまま「帳簿価額（800円）」になります。850円で売れたので差額50円が「固定資産売却益（収益）」です。代金を手形で受け取ったので「営業外受取手形（資産）」に記録します。' },

  { id:141, level:2, cat:'固定資産',
    q:'備品6万円を6回払い（月10,500円）で購入した。利息分は前払利息で処理する。仕訳を示せ。',
    e:[{d:[['備品',60000],['前払利息',3000]], c:[['未払金',63000]]}],
    note:'合計支払63,000－本体60,000＝利息3,000',
    exp:'割賦（かっぷ）購入とは「分割払いで買うこと」です。本体60,000円の備品を6回払い合計63,000円で買うので、差額3,000円が「金利・利息」分です。備品の本体価格（60,000円）は資産、利息分（3,000円）は「前払利息（資産）」として先に計上し、毎回の支払い時に少しずつ費用にします。合計の支払義務63,000円は「未払金（負債）」です。' },

  { id:142, level:2, cat:'固定資産',
    q:'備品（現金正価6万円・月10,500円・6回払い）の第1回目の割賦金を普通預金から支払った。前払利息は定額法により配分する。仕訳を示せ。',
    e:[{d:[['未払金',10500]], c:[['普通預金',10500]]}, {d:[['支払利息',500]], c:[['前払利息',500]]}],
    note:'利息1回分＝3,000÷6＝500円',
    exp:'毎月の払いは2本の仕訳をセットで行います。①未払金（借金）10,500円を普通預金（銀行口座）から払って負債を減らす、②前払い済みの利息（前払利息）のうち今回の1回分500円を「支払利息（費用）」に振り替える。「借金を減らす＋利息を費用にする」の2本セットです。' },

  { id:143, level:2, cat:'固定資産',
    q:'当期首に購入した建物（取得原価10,000円・残存価額0・耐用年数20年）を定額法で減価償却した。記帳方法は直接法。仕訳を示せ。',
    e:[{d:[['減価償却費',500]], c:[['建物',500]]}],
    note:'10,000÷20年＝500円',
    exp:'定額法とは「毎年同じ金額ずつ価値を減らす計算方法」です。10,000円の建物が20年で使えなくなるので、1年ごとに10,000÷20＝500円ずつ価値が下がります。直接法とは「建物の金額から直接500円を引く方法」です。建物の帳簿価額が毎年500円ずつ小さくなっていきます。' },

  { id:144, level:2, cat:'固定資産',
    q:'前期首に購入した建物（取得原価10,000円・残存価額0・耐用年数20年）を定額法で減価償却した。記帳方法は間接法。仕訳を示せ。',
    e:[{d:[['減価償却費',500]], c:[['建物減価償却累計額',500]]}],
    note:'10,000÷20年＝500円',
    exp:'間接法とは「建物の金額は変えずに、別の勘定（建物減価償却累計額）で「これまで減った合計」を記録する方法」です。建物は10,000円のまま帳簿に残り、別の場所に「これまでで累計○円減りましたよ」という記録が積み上がります。実際の帳簿価額は「建物－建物減価償却累計額」で計算します。' },

  { id:145, level:2, cat:'固定資産',
    q:'当期12/1に購入した備品（取得原価30,000円）を定率法（償却率20%）で減価償却。決算日3/31・間接法。①取得後1年目②2年目③3年目の決算整理仕訳を示せ。',
    e:[
      {d:[['減価償却費',2000]], c:[['備品減価償却累計額',2000]]},
      {d:[['減価償却費',5600]], c:[['備品減価償却累計額',5600]]},
      {d:[['減価償却費',4480]], c:[['備品減価償却累計額',4480]]}
    ],
    note:'①1年目(4か月)：30,000×20%×4/12＝2,000　②2年目(12か月)：(30,000－2,000)×20%＝5,600　③3年目(12か月)：(28,000－5,600)×20%＝4,480',
    exp:'定率法とは「残っている価値の一定割合（20%）を毎年减価償却する方法」です。最初は減る金額が大きく、年々小さくなります。①1年目は12/1購入なので4か月分のみ：30,000×20%×4/12＝2,000円。②2年目は残り28,000円の20%：5,600円。③3年目は残り22,400円の20%：4,480円。残る価値が減るので、毎年少しずつ償却額も減っていきます。' },

  { id:146, level:2, cat:'固定資産',
    q:'当期首に購入した備品（取得原価30,000円・耐用年数5年・残存価額0）を200%定率法で減価償却した。記帳方法は間接法。仕訳を示せ。',
    e:[{d:[['減価償却費',12000]], c:[['備品減価償却累計額',12000]]}],
    note:'定額法率1/5×200%＝40%、30,000×40%＝12,000',
    exp:'200%定率法とは「定額法の2倍の速さで減価償却する方法」です。定額法（毎年同じ額）の償却率は1÷5年＝20%。それを2倍にするので「200%定率法の償却率は40%」です。1年目の償却費：30,000×40%＝12,000円。定率法より最初の数年に多く費用化するので、新品のうちに大きく価値を下げられます。' },

  { id:147, level:2, cat:'固定資産',
    q:'当期10/1に購入した車両（取得原価180,000円・残存価額0・総走行可能距離10,000km）を生産高比例法で減価償却。当期の走行距離1,000km・決算日3/31・間接法。仕訳を示せ。',
    e:[{d:[['減価償却費',18000]], c:[['車両運搬具減価償却累計額',18000]]}],
    note:'180,000×(1,000/10,000)＝18,000',
    exp:'生産高比例法とは「どれだけ使ったかに比例して減価償却する方法」です。タクシーやトラックのように「走れば走るほど価値が減る」車両に使います。180,000円の車が10,000km走ったら価値がゼロになる、と仮定すると「1km走るごとに18円ずつ減る」。今年1,000km走ったので18,000円を費用にします。' },

  { id:148, level:2, cat:'固定資産',
    q:'車両（取得原価200,000円・期首減価償却累計額108,000円・間接法）を下取り価額85,000円で下取りに出し、新車両300,000円を購入した。差額は翌月末に支払う。仕訳を示せ。',
    e:[{d:[['車両運搬具',300000],['車両運搬具減価償却累計額',108000],['固定資産売却損',7000]], c:[['車両運搬具',200000],['未払金',215000]]}],
    note:'帳簿価額＝200,000－108,000＝92,000　売却損＝92,000－85,000＝7,000　未払金＝300,000－85,000＝215,000',
    exp:'下取りとは「古い物を売って、その代金を新しい物の購入代金の一部に充てること」です。①古い車を売る：帳簿価額92,000円（200,000－108,000）の車を85,000円で売ったので7,000円の損（固定資産売却損）が出ます。②新しい車300,000円を買う：古い車の下取り代金85,000円を引いて残り215,000円を後払い（未払金）にします。' },

  { id:149, level:2, cat:'固定資産',
    q:'備品（取得原価60,000円・期首減価償却累計額36,000円・間接法）を除却した。除却資産の見積処分価額は18,000円。仕訳を示せ。',
    e:[{d:[['備品減価償却累計額',36000],['貯蔵品',18000],['固定資産除却損',6000]], c:[['備品',60000]]}],
    note:'帳簿価額24,000－処分価額18,000＝除却損6,000',
    exp:'除却（じょきゃく）とは「まだ売れるが、もう使わないので帳簿から消す」ことです。帳簿価額（60,000－36,000＝24,000円）のうち、捨てずに売れる部分（18,000円）は「貯蔵品（資産）」として残します。それでも帳簿価額24,000円より少ないので差額6,000円が「固定資産除却損（費用）」です。' },

  { id:150, level:2, cat:'固定資産',
    q:'備品（取得原価60,000円・期首減価償却累計額36,000円・間接法）を廃棄した。廃棄費用500円を現金で支払った。仕訳を示せ。',
    e:[{d:[['備品減価償却累計額',36000],['固定資産廃棄損',24500]], c:[['備品',60000],['現金',500]]}],
    note:'帳簿価額24,000＋廃棄費用500＝廃棄損24,500',
    exp:'廃棄（はいき）とは「完全に捨ててしまうこと」です。除却（Q149）と違って売れる部分がゼロです。帳簿価額（60,000－36,000＝24,000円）の分だけ損が出るうえに、廃棄するのにもお金（500円）がかかります。合計24,500円が「固定資産廃棄損（費用）」です。' },

  { id:151, level:2, cat:'固定資産',
    q:'ビル新築のため建設会社と請負契約（請負金額500,000円）を結び、手付金100,000円を小切手を振り出して支払った。仕訳を示せ。',
    e:[{d:[['建設仮勘定',100000]], c:[['当座預金',100000]]}],
    exp:'建設仮勘定とは「まだ完成していない建物のために払ったお金を一時的に置いておく場所」です。完成する前に払う手付金は「建物（資産）」にはまだなれないので「建設仮勘定（資産）」という仮の場所に置きます。「仮（かり）」という字のとおり、完成したら「建物」に振り替えます。' },

  { id:152, level:2, cat:'固定資産',
    q:'ビル工事（請負500,000円・手付金100,000円支払済み）が完成し引き渡しを受けた。残額400,000円は小切手を振り出して支払った。仕訳を示せ。',
    e:[{d:[['建物',500000]], c:[['建設仮勘定',100000],['当座預金',400000]]}],
    exp:'ついに建物が完成しました！今まで「建設仮勘定（仮の場所）」に置いておいた手付金100,000円と、今日払う残り400,000円を合わせた500,000円が「建物（資産）」になります。「仮置き場から本番の資産へ引っ越し」というイメージです。' },

  { id:153, level:2, cat:'固定資産',
    q:'建物の増築・改良（建物の価値や耐用年数が増す工事）を行い、50,000円を現金で支払った。仕訳を示せ。',
    e:[{d:[['建物',50000]], c:[['現金',50000]]}],
    exp:'資本的支出とは「固定資産をより良くする投資」のことです。増築や大規模改良などで建物の価値や寿命が増えるなら、費用ではなく「建物（資産）の取得原価に上乗せ」します。その後、減価償却を通じて毎期少しずつ費用化されます。「価値が上がる → 資産に追加」と覚えましょう。' },

  { id:154, level:2, cat:'固定資産',
    q:'建物の現状維持のための修繕（壁の補修など）を行い、20,000円を現金で支払った。仕訳を示せ。',
    e:[{d:[['修繕費',20000]], c:[['現金',20000]]}],
    exp:'収益的支出とは「元の状態に戻すだけの修繕・補修」のことです。壁の塗り直しや軽微な補修は建物の価値を上げないので、全額「修繕費（費用）」として今すぐ計上します。「Q153と何が違う？」→「より良くなる（資本的支出）」か「元どおりにするだけ（収益的支出）」かの違いです。' },

  { id:155, level:2, cat:'固定資産',
    q:'建物（取得原価300,000円・期首減価償却累計額162,000円・間接法）が火災により焼失した。仕訳を示せ。',
    e:[{d:[['建物減価償却累計額',162000],['火災損失',138000]], c:[['建物',300000]]}],
    note:'帳簿価額＝300,000－162,000＝138,000',
    exp:'火災で建物が焼失した場合、帳簿から消去します。300,000円の建物のうち減価償却した162,000円（減価償却累計額）は差し引き済みなので、残り138,000円が「まだ価値があったのに燃えてしまった損」です。これが「火災損失（費用）」になります。保険に入っていない場合、全額損失です。' },

  { id:156, level:2, cat:'固定資産',
    q:'建物（取得原価300,000円・期首減価償却累計額162,000円・間接法）が火災により焼失した。この建物には200,000円の火災保険がかかっており、ただちに保険会社に連絡した。仕訳を示せ。',
    e:[{d:[['建物減価償却累計額',162000],['未決算',138000]], c:[['建物',300000]]}],
    note:'保険金確定まで帳簿価額138,000を未決算に置く',
    exp:'保険に入っている場合、「保険金がいくらもらえるかまだわからない」段階では損失と確定できません。そこで帳簿価額138,000円を「未決算（資産）」という仮置き場に置きます。後で保険金200,000円が確定すれば：①138,000円以内なら「差額を火災損失」、②138,000円より多ければ「差額を保険差益（収益）」として処理します。' },

  // ===== 3級 穴埋め問題 =====
  { id:157, level:3, cat:'基本用語',
    q:'仕訳のルールについて（　）に当てはまる言葉を答えよ。現金が増えたとき→【①借方・貸方】どちらに記入するか。買掛金が増えたとき→【②借方・貸方】。仕入が発生したとき→【③借方・貸方】。売上が発生したとき→【④借方・貸方】。貸倒引当金が増えたとき→【⑤借方・貸方】。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>借方（左）← 資産の増加</td></tr><tr><td class="hl">②</td><td>貸方（右）← 負債の増加</td></tr><tr><td class="hl">③</td><td>借方（左）← 費用の発生</td></tr><tr><td class="hl">④</td><td>貸方（右）← 収益の発生</td></tr><tr><td class="hl">⑤</td><td>貸方（右）← 評価勘定（負債的性質）</td></tr></tbody></table><div class="formula-box">資産・費用 → 増加は借方（左）　　負債・純資産・収益・貸倒引当金 → 増加は貸方（右）</div>`,
    exp:'借方・貸方のルールは勘定の種類で決まります。資産と費用は増えたら左（借方）、負債・純資産・収益は増えたら右（貸方）です。貸倒引当金は資産のマイナス（評価勘定）なので、増えると右（貸方）に記録します。' },

  { id:158, level:3, cat:'基本用語',
    q:'仕訳の基本について（　）に当てはまる言葉を答えよ。仕訳の左側を【①　】といい、右側を【②　】という。資産が増えたときは【③左/右　】に書き、負債が増えたときは【④左/右　】に書く。費用は増えたとき【⑤左/右　】に書く。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>借方（かりかた）</td></tr><tr><td class="hl">②</td><td>貸方（かしかた）</td></tr><tr><td class="hl">③</td><td>左（借方）</td></tr><tr><td class="hl">④</td><td>右（貸方）</td></tr><tr><td class="hl">⑤</td><td>左（借方）</td></tr></tbody></table><div class="formula-box">資産・費用の増加 → 借方（左）　　負債・純資産・収益の増加 → 貸方（右）</div>`,
    exp:'「借方・貸方」は単なる「左・右」の名前です。資産と費用は増えたら左、負債・純資産・収益は増えたら右。逆向きなら反対側です。' },

  { id:159, level:3, cat:'消費税',
    q:'消費税の処理（税抜経理）について（　）に答えよ。商品を税込1,100円で仕入れたとき、本体1,000円は【①　　】（費用）、消費税100円は【②　　　　　】（資産）として記録する。商品を税込2,200円で売り上げたとき、本体2,000円は【③　　】（収益）、消費税200円は【④　　　　　】（負債）として記録する。決算で両者を相殺した差額（1,100円）が【⑤　　　　　】（負債）になる。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>仕入</td></tr><tr><td class="hl">②</td><td>仮払消費税</td></tr><tr><td class="hl">③</td><td>売上</td></tr><tr><td class="hl">④</td><td>仮受消費税</td></tr><tr><td class="hl">⑤</td><td>未払消費税</td></tr></tbody></table><div class="formula-box">仕入時：仕入1,000・仮払消費税100 ／ 現金1,100　　売上時：現金2,200 ／ 売上2,000・仮受消費税200　　決算：仮受消費税1,100 ／ 未払消費税1,100（純額）</div>`,
    exp:'税抜経理では消費税を本体と分けて記録します。仕入時の消費税は「仮払消費税（資産）」、売上時は「仮受消費税（負債）」。決算で差し引きした差額だけ「未払消費税（負債）」として国に納めます。' },

  { id:160, level:3, cat:'現金・預金',
    q:'現金・預金について（　）に答えよ。簿記上の現金には通貨だけでなく、他店振出し【①　　】・郵便為替証書・配当金領収書なども含まれ、これらを【②　　現金】という。会社が銀行と契約し、小切手で引き出せる預金口座を【③　　預金】という。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>小切手</td></tr><tr><td class="hl">②</td><td>通貨代用証券（現金）</td></tr><tr><td class="hl">③</td><td>当座預金</td></tr></tbody></table><div class="formula-box">通貨代用証券：他店振出小切手・郵便為替・配当金領収書 → 受け取ったらすぐ「現金」に計上</div>`,
    exp:'「現金」には実際のお金だけでなく、すぐに換金できる証書類も含みます。他店の小切手は受け取った時点で現金扱いです。' },

  { id:161, level:3, cat:'経過勘定',
    q:'経過勘定の4種類について（　）に答えよ。当期分の費用をまだ払っていない→【①　　費用】（負債）。当期分の費用をすでに払いすぎた→【②　　費用】（資産）。当期分の収益をまだ受け取っていない→【③　　収益】（資産）。当期分の収益をすでに受け取りすぎた→【④　　収益】（負債）。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>未払費用</td></tr><tr><td class="hl">②</td><td>前払費用</td></tr><tr><td class="hl">③</td><td>未収収益</td></tr><tr><td class="hl">④</td><td>前受収益</td></tr></tbody></table><div class="formula-box">「未」→ まだ払っていない/受け取っていない　　「前」→ 先に払いすぎ/受け取りすぎ</div>`,
    exp:'経過勘定は「時期のズレ」を記録するための科目です。「未」は「まだしていない」、「前」は「先にやりすぎた」と覚えましょう。費用か収益か×未か前か＝4パターンです。' },

  { id:162, level:3, cat:'減価償却',
    q:'減価償却について（　）に答えよ。固定資産の価値が毎年減っていく分を費用として計上することを【①　　　　】という。毎期同じ金額を費用にする方法を【②　　法】、帳簿価額に一定率をかける方法を【③　　法】という。帳簿価額から直接差し引く記帳法を【④　接法】、累計額勘定を使う方法を【⑤　接法】という。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>減価償却</td></tr><tr><td class="hl">②</td><td>定額法</td></tr><tr><td class="hl">③</td><td>定率法</td></tr><tr><td class="hl">④</td><td>直接法</td></tr><tr><td class="hl">⑤</td><td>間接法</td></tr></tbody></table><div class="formula-box">定額法：（取得原価－残存価額）÷耐用年数　　間接法：「減価償却累計額」勘定を使う</div>`,
    exp:'建物や車は使うほど価値が減ります。その減少分を毎年「費用（減価償却費）」に計上するのが減価償却です。3級では定額法・直接法が中心です。' },

  { id:163, level:3, cat:'貸倒引当金',
    q:'貸倒引当金について（　）に答えよ。売掛金などが将来回収できないリスクに備えて、あらかじめ見積もって計上する勘定を【①　　　　　】という。この設定時に使う費用科目を【②　　　　繰入】という。実際に貸し倒れたとき、引当金の範囲内なら【③】を取り崩し、引当金を超えた分は【④　　損失】として費用計上する。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>貸倒引当金</td></tr><tr><td class="hl">②</td><td>貸倒引当金繰入</td></tr><tr><td class="hl">③</td><td>貸倒引当金（を取り崩す）</td></tr><tr><td class="hl">④</td><td>貸倒損失</td></tr></tbody></table><div class="formula-box">引当金設定：貸倒引当金繰入（費用）／貸倒引当金　　貸倒時：貸倒引当金／売掛金（引当金の範囲内）</div>`,
    exp:'貸倒引当金は「いつか回収できないかも」という不安を前もって費用にしておく仕組みです。実際に貸し倒れたとき、引当金があれば費用にせず引当金を取り崩すだけです。' },

  { id:164, level:3, cat:'損益計算書',
    q:'損益計算書（P/L）の構造について（　）に答えよ。売上高から【①　　　　　】を引いた金額を【②　　　　　益】という。そこからさらに販売費・一般管理費を引いた最終的な利益を【③　　　　益】という。なお売上原価は「期首商品＋【④　　　　高】－期末商品」の計算式で求める。この計算を精算表では【⑤　　】と【⑥　　　　】（2本の仕訳）で表す。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>売上原価</td></tr><tr><td class="hl">②</td><td>売上総利益（粗利益）</td></tr><tr><td class="hl">③</td><td>当期純利益</td></tr><tr><td class="hl">④</td><td>当期商品仕入高</td></tr><tr><td class="hl">⑤</td><td>しくり（仕入 ／ 繰越商品）</td></tr><tr><td class="hl">⑥</td><td>くりしわ（繰越商品 ／ 仕入）</td></tr><tr><td colspan="2">⑤⑥合わせて「しくりくりし」と覚える</td></tr></tbody></table><div class="formula-box">売上総利益＝売上高－売上原価　　当期純利益＝売上総利益－販管費　　売上原価＝期首商品＋当期仕入－期末商品</div>`,
    exp:'損益計算書は「今期の儲けと出費のまとめ表」です。売上から商品仕入コスト（売上原価）を引いた粗利益、そこから給料・家賃などを引いた最終利益という2段階の計算構造を理解しましょう。精算表では「しくりくりし」という2本の修正記入で売上原価を計算します。' },

  { id:165, level:3, cat:'手形',
    q:'手形について（　）に答えよ。商品を仕入れて代金に手形を振り出した場合は【①　　手形】（負債）が発生する。商品を売り上げて手形を受け取った場合は【②　　手形】（資産）が発生する。保有する受取手形を仕入代金の支払いに充てることを【③　　　　渡し】という。受取手形を期日前に銀行で換金することを手形【④　　き】という。このとき銀行に支払う費用を【⑤　　　　損】という。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>支払手形</td></tr><tr><td class="hl">②</td><td>受取手形</td></tr><tr><td class="hl">③</td><td>裏書き譲渡し</td></tr><tr><td class="hl">④</td><td>割引き</td></tr><tr><td class="hl">⑤</td><td>手形売却損</td></tr></tbody></table><div class="formula-box">裏書き譲渡：受取手形 → 仕入代金に充当（現金不要）　　手形割引：受取手形を銀行に売却し手数料（手形売却損）を差し引いた現金を受取</div>`,
    exp:'手形は「将来の確実な支払約束書」です。振り出せば支払手形（借金）、受け取れば受取手形（資産）になります。受取手形は「裏書き（別の支払いに使う）」か「銀行で割り引いて（期日前に現金化）」かで有効活用できます。' },

  { id:166, level:3, cat:'基本用語',
    q:'会計の基礎について（　）に答えよ。企業の活動を区切るための1年間の期間を【①　　期間】という。収益・費用を現金のやり取りではなく取引が起きた時点で記録するルールを【②　　主義】という。これに対し現金を受け取った・払った時点で記録するルールを【③　　主義】という。貸借対照表は【④　　日】の財産状態を、損益計算書は【⑤　　間】の損益を表す。',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①</td><td>会計期間</td></tr><tr><td class="hl">②</td><td>発生主義</td></tr><tr><td class="hl">③</td><td>現金主義</td></tr><tr><td class="hl">④</td><td>決算日（特定の日付）</td></tr><tr><td class="hl">⑤</td><td>会計期間（1年間）</td></tr></tbody></table><div class="formula-box">発生主義：現金の動きに関係なく、経済的事実が起きた時点で記録する　　B/S：ある時点の「残高写真」　P/L：一定期間の「成績表」</div>`,
    exp:'簿記では「お金が動いてから記録する（現金主義）」ではなく「取引が起きた時点で記録する（発生主義）」が原則です。貸借対照表はある日の財産の「静止画」、損益計算書は1年間の損益の「動画（記録）」と覚えましょう。' },
];

function q2Id(q){ if((q.level||3)===2) return q.id-110; if(q.id>156) return q.id-46; return q.id; }

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(levelFilter === 0){
    row.style.display = 'none';
    groupFilter = 0;
    return;
  }
  row.style.display = '';
  const groups = levelFilter === 2 ? GROUPS2 : GROUPS3;
  let html = '<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html += `<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  groups.forEach((g, i) => {
    const n = i + 1;
    const label = g[1] >= 9000 ? `Q${g[0]}-` : `Q${g[0]}-${g[1]}`;
    html += `<button class="ctrl-btn grp-btn${groupFilter===n?' active':''}" onclick="setGroup(${n})">${label}</button>`;
  });
  row.innerHTML = html;
}

let deck = [];
let idx  = 0;
let answered  = JSON.parse(localStorage.getItem('bk_answered')  || '{}');
let memorized = JSON.parse(localStorage.getItem('bk_memorized') || '{}');
let hideMem    = false;
let groupFilter = 0;
let levelFilter = 0;

function saveProgress(){
  localStorage.setItem('bk_answered',  JSON.stringify(answered));
  localStorage.setItem('bk_memorized', JSON.stringify(memorized));
}

function buildDeck(){
  deck = ALL.filter(q => {
    if(hideMem && memorized[q.id]) return false;
    if(groupFilter > 0){
      const groups = levelFilter === 2 ? GROUPS2 : GROUPS3;
      const g = groups[groupFilter-1];
      if(!g) return false;
      const qnum = q2Id(q);
      if(qnum < g[0] || qnum > g[1]) return false;
    }
    if(levelFilter === 1 && (q.level||3) !== 3) return false;
    if(levelFilter === 2 && (q.level||3) !== 2) return false;
    return true;
  });
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  if(expActive){ syncExpFromDeck(0); document.getElementById('exp-panel').innerHTML='<div id="exp-main"></div>'; loadExpQ(); return; }
  render();
}

// ===== スクロールモード =====
let expActive=false;
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  return [
    ...entry.d.map(([name,amt])=>({name,amt,side:'d'})),
    ...entry.c.map(([name,amt])=>({name,amt,side:'c'}))
  ];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}

function toggleExp(){
  expActive=!expActive;
  document.getElementById('exp-toggle-btn').classList.toggle('active',expActive);
  document.getElementById('exp-panel').style.display=expActive?'block':'none';
  document.querySelector('.stats-bar').style.display=expActive?'none':'flex';
  document.querySelector('.card-area').style.display=expActive?'none':'block';
  if(expActive){
    syncExpFromDeck(idx);
    document.getElementById('exp-panel').innerHTML='<div id="exp-main"></div>';
    loadExpQ();
  } else {
    idx=expQIdx;
    render();
  }
}

function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  const main=document.getElementById('exp-main');

  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${q.q_html||q.q}</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${q.q}</div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  window._expCards=[...accounts];
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
      <div class="exp-hint" style="left:8px;color:#0288D1;">← 借方</div>
      <div class="exp-hint" style="right:8px;color:#388E3C;">貸方 →</div>
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>
    <div class="exp-result" id="exp-res"></div>`;
  renderExpCard();
}

function expRevealAns(btn){
  btn.style.display='none';
  document.getElementById('exp-ro-ans').style.display='block';
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span><div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}<span class="tag-amt"> ${a.amt.toLocaleString()}円</span></span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}<span class="tag-amt"> ${a.amt.toLocaleString()}円</span></span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${isLastEntry && q.exp ? `<div class="exp-res-exp">${q.exp}</div>` : ''}
      ${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

// ===== スクロールモードここまで =====

function setLevel(n){
  levelFilter = n;
  groupFilter = 0;
  for(let i=0; i<=2; i++){
    const btn = document.getElementById('lvl-'+i);
    if(btn) btn.classList.toggle('active', i === n);
  }
  updateGroupButtons();
  buildDeck();
  idx = 0;
  if(expActive){ syncExpFromDeck(0); document.getElementById('exp-panel').innerHTML='<div id="exp-main"></div>'; loadExpQ(); return; }
  render();
}

function shuffle(){
  buildDeck();
  for(let i = deck.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  render();
}


function toggleHideMem(){
  hideMem = !hideMem;
  const btn = document.getElementById('btn-hide-mem');
  btn.classList.toggle('active', hideMem);
  btn.textContent = hideMem ? '全問題を表示' : '習得済みを除く';
  buildDeck();
  idx = 0;
  render();
}

function resetAll(){
  answered = {};
  memorized = {};
  saveProgress();
  hideMem = false;
  groupFilter = 0;
  levelFilter = 0;
  document.getElementById('btn-hide-mem').classList.remove('active');
  document.getElementById('btn-hide-mem').textContent = '習得済みを除く';
  for(let i=0; i<=2; i++){
    const btn = document.getElementById('lvl-'+i);
    if(btn) btn.classList.toggle('active', i === 0);
  }
  updateGroupButtons();
  buildDeck();
  idx = 0;
  render();
}

function go(dir){
  idx = Math.max(0, Math.min(deck.length-1, idx+dir));
  render();
}

function revealAnswer(){
  document.getElementById('rev-btn').style.display = 'none';
  const area = document.getElementById('ans-area');
  area.classList.add('show');
  colorizeAccountsInEl(area);
}

function judge(ok){
  const q = deck[idx];
  answered[q.id] = ok;
  if(ok) memorized[q.id] = true;
  saveProgress();
  updateStats();
  if(idx < deck.length-1){
    idx++;
    render();
  } else {
    showComplete();
  }
}

function showComplete(){
  const total = Object.keys(answered).length;
  const ok = Object.values(answered).filter(v=>v).length;
  document.getElementById('card-container').innerHTML = `
    <div class="complete-card">
      <div class="complete-emoji">🎉</div>
      <div class="complete-title">全問完了！</div>
      <div class="complete-score">${ok}<span style="font-size:24px;color:var(--muted)">/${total}</span></div>
      <div class="complete-sub">正解数 / 回答数</div>
      <button class="restart-btn" onclick="resetAll()">もう一度</button>
    </div>`;
  document.getElementById('prog-text').textContent = '';
  document.getElementById('prog-cat').textContent = '';
  document.getElementById('prog-fill').style.width = '100%';
}

function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-ok').textContent  = Object.values(answered).filter(v=>v).length;
  document.getElementById('s-ng').textContent  = Object.values(answered).filter(v=>!v).length;
  document.getElementById('s-mem').textContent = Object.keys(memorized).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function colorizeAccountsInEl(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

function render(){
  updateStats();

  if(deck.length === 0){
    document.getElementById('card-container').innerHTML = `
      <div class="complete-card" style="padding:40px 24px;">
        <div style="font-size:32px">📭</div>
        <div style="margin-top:12px;font-size:16px;font-weight:700">表示できる問題がありません</div>
        <div style="margin-top:6px;color:var(--muted);font-size:13px">フィルターを変えるか「リセット」してください</div>
      </div>`;
    document.getElementById('prog-text').textContent = '';
    document.getElementById('prog-cat').textContent = '';
    document.getElementById('prog-fill').style.width = '0%';
    return;
  }

  const q = deck[idx];
  const pct = Math.round((idx+1)/deck.length*100);

  document.getElementById('prog-text').textContent = `${idx+1} / ${deck.length}`;
  document.getElementById('prog-cat').textContent  = q.cat;
  document.getElementById('prog-fill').style.width = pct + '%';

  let ansContent = '';
  if(q.ans_html){
    ansContent = `<div class="ans-table-wrap">${q.ans_html}</div>`;
    if(q.exp){ ansContent += `<div class="exp-box"><div class="exp-label">解説</div>${q.exp}</div>`; }
  } else {
    q.e.forEach((entry, i) => {
      const label = q.e.length > 1 ? `仕訳 ${i+1}` : '仕訳';
      ansContent += `
        <div class="journal-entry">
          <div class="entry-header">${label}</div>
          <div class="entry-row">
            <div class="entry-side">
              <div class="side-lbl">借　方</div>
              <div class="tags">${makeTags(entry.d)}</div>
            </div>
            <div class="entry-sep"></div>
            <div class="entry-side">
              <div class="side-lbl">貸　方</div>
              <div class="tags">${makeTags(entry.c)}</div>
            </div>
          </div>
        </div>`;
    });
    if(q.note){ ansContent += `<div class="note-box">💡 ${q.note}</div>`; }
    if(q.exp){ ansContent += `<div class="exp-box"><div class="exp-label">解説</div>${q.exp}</div>`; }
  }
  const ansLabel = q.ans_html ? '解答' : '仕訳（解答）';

  document.getElementById('card-container').innerHTML = `
    <div class="flashcard">
      <div class="card-top">
        <span class="level-badge">簿記${q.level||3}級 Q${q2Id(q)}</span>
        <span class="category-tag">${q.cat}</span>
      </div>
      <div class="card-body">
        <div class="scenario-label">問題</div>
        <div class="scenario">${q.q}</div>
        ${q.q_html ? `<div class="ans-table-wrap" style="margin-top:12px">${q.q_html}</div>` : ''}
        <div class="divider"></div>
        <div class="nav-row" style="margin-bottom:10px;">
          <button class="nav-btn" onclick="go(-1)" ${idx===0?'disabled':''}>← 前へ</button>
          <button class="nav-btn" onclick="go(+1)" ${idx===deck.length-1?'disabled':''}>次へ →</button>
        </div>
        <button class="reveal-btn" id="rev-btn" onclick="revealAnswer()">
          ▼ 答えを見る
        </button>
        <div class="answer-area" id="ans-area">
          <div class="answer-label">${ansLabel}</div>
          ${ansContent}
          <div class="judge-btns">
            <button class="judge-btn ng" onclick="judge(false)">✗ 不正解</button>
            <button class="judge-btn ok" onclick="judge(true)">○ 正解！</button>
          </div>
        </div>
      </div>
    </div>`;
}

buildDeck();
render();
</script>
</body>
</html>
