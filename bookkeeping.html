function dispSynonymsOf(name){
  const s = new Set([name]);
  DISP_SYNONYMS.forEach(g => { if(g.includes(name)) g.forEach(n => s.add(n)); });
  return s;
}

function dispPickJaChoices(item){
  const ng = dispSynonymsOf(item.name);
  const cand = DISPLAY_DATA.filter(d => !ng.has(d.name));
  // 選択肢は、同じ小分け → 同じグループ → 同じタイプ（資産・負債など）の順に選ぶ（似た科目と区別できるかを問う）
  const me = ACCT_GROUP_OF[item.name] || {};
  const gs = d => ACCT_GROUP_OF[d.name] || {};
  const base = [d => gs(d).s && gs(d).s===me.s, d => gs(d).g && gs(d).g===me.g && gs(d).s!==me.s, d => gs(d).g!==me.g && d.cat===item.cat, d => gs(d).g!==me.g && d.cat!==item.cat];
  // 逆向きでは表示区分などから種類で消去法できないよう、同じタイプの科目を先に使う
  const tiers = acctQuizReverse ? [...base.map(f=>d=>f(d)&&d.cat===item.cat), ...base.map(f=>d=>f(d)&&d.cat!==item.cat)] : base;
  const picked = tiers.flatMap(f => shuffleArr(cand.filter(f))).slice(0,3).map(d => d.name);
  return shuffleArr([item.name, ...picked]);
}

function acctQDef(item){
  const d = ACCT_EXPL[item.name] || item.def.replace(/^<strong>[^<]*<\/strong>とは、/, '').replace(/<\/?strong>/g,'');
  return item.name.length>=2 ? d.split(item.name).join('◯◯') : d;
}

// ===== 勘定科目クイズここまで =====

// ===== 総合問題（財務諸表作成・本支店会計・株主資本等変動・標準原価計算・CVP分析）=====
// ===== shared helpers =====
function compRandMult(base, loMult, hiMult){
  // 目視で計算しやすいよう、金額（1,000円以上の単位）は切りのよい倍数（5の倍数、なければ偶数）にする
  let cands = [];
  for(let n=loMult;n<=hiMult;n++) cands.push(n);
  if(base >= 1000){
    const r5 = cands.filter(n=>n%5===0), r2 = cands.filter(n=>n%2===0);
    if(r5.length >= 2) cands = r5; else if(r2.length >= 2) cands = r2;
  }
  return (base >= 500 ? base/COMP_SCALE : base) * cands[Math.floor(Math.random()*cands.length)];
}
// 金額の桁を小さくする（1,000円以上の単位をこの数で割る）
const COMP_SCALE = 100;
function compPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtVar(n){
  return `${Math.abs(n).toLocaleString()}円（${n<0?'不利':'有利'}差異）`;
}
function yen(n){ return n.toLocaleString(); }

// dedupe numeric choices: correct + candidate wrong numbers, pad/jitter if needed.
// Jitter is scaled to the magnitude of the correct answer and always stays positive,
// so a distractor is never an obviously-impossible negative quantity/amount.
function numChoices(correct, candidates){
  const out = [correct];
  const seen = new Set([correct]);
  for(const c of candidates){
    if(Number.isInteger(c) && c >= 0 && !seen.has(c) && out.length<4){ seen.add(c); out.push(c); }
  }
  let guard=0;
  const step = Math.max(1, Math.round(Math.abs(correct)*0.05)) || 1;
  while(out.length<4 && guard++<80){
    const mag = step * compRandMult(1, 1, 6);
    let jitter = correct + compPick([-1,1])*mag;
    if(jitter < 0 || !Number.isInteger(jitter)) jitter = correct + mag;
    if(!seen.has(jitter)){ seen.add(jitter); out.push(jitter); }
  }
  return out;
}
// build a hint line showing already-solved step answers needed for the current step.
// pairs: [[label, formattedValueString], ...]
function compHint(pairs){
  return pairs.map(([l,v])=>`${l}＝<strong>${v}</strong>`).join('　／　');
}

// dedupe string choices (for signed variance display)
function varChoices(correctN, candidateNs){
  const out = [correctN];
  const seen = new Set([fmtVar(correctN)]);
  for(const c of candidateNs){
    const f = fmtVar(c);
    if(!seen.has(f) && out.length<4){ seen.add(f); out.push(c); }
  }
  let guard=0;
  while(out.length<4 && guard++<50){
    const jitter = correctN + compPick([-1,1])*compRandMult(1000,1,20);
    const f = fmtVar(jitter);
    if(!seen.has(f)){ seen.add(f); out.push(jitter); }
  }
  return out.map(fmtVar);
}

// ===== financial-statement rendering helpers =====
// stmtRow(label, value, lineKey, cls): one line of a statement table.
//   lineKey: data-line id used to highlight this row from a step (omit for non-highlightable rows)
//   cls: 'i' = indented sub-item, 'sub' = subtotal/bold row
//   value: pass a string (already formatted, e.g. '△12,000円') to override the default '<number>円' format
function stmtRow(label, value, lineKey, cls){
  const dk = lineKey ? ` data-line="${lineKey}"` : '';
  const c = cls ? ` class="${cls}"` : '';
  const v = typeof value === 'string' ? value : `${yen(value)}円`;
  return `<tr${dk}${c}><td>${label}</td><td>${v}</td></tr>`;
}
function stmtHd(label){
  return `<tr class="hd"><td colspan="2">${label}</td></tr>`;
}
function stmtTable(rows){
  return `<table class="comp-stmt">${rows.join('')}</table>`;
}

// ===== FS-1 generator =====
function genFS1(){
  const uketori = compRandMult(10000, 10, 20);
  const urikake = compRandMult(10000, 15, 30);
  const taoreireRate = compPick([2,3,4,5]);
  const taoreireNeed = Math.round((uketori+urikake)*taoreireRate/100);
  const taoreireExisting = compRandMult(1000, 1, Math.max(1, Math.floor(taoreireNeed/1000)-1));
  const kishuShouhin = compRandMult(10000, 5, 12);
  const tatemonoNensuu = compPick([20,25,40,50]);
  const tatemono = compRandMult(tatemonoNensuu*1000, 10, 24);
  const tatemonoGenkaYr = tatemono/tatemonoNensuu;
  const tatemonoRuikei0 = tatemonoGenkaYr * compRandMult(1,2,6);
  const bihinNensuu = compPick([5,8,10]);
  const bihin = compRandMult(bihinNensuu*1000, 8, 20);
  const bihinGenkaYr = bihin/bihinNensuu;
  const bihinRuikei0 = bihinGenkaYr * compRandMult(1,1,Math.max(1,bihinNensuu-3));
  const kakekin = compRandMult(10000, 8, 20);
  const kariirekin = compRandMult(100000, 1, 5);
  const kariirekinRate = compPick([2,3,4,6]);
  const kariirekinMonths = compPick([3,6,9]);
  const risokuMikarai = Math.round(kariirekin * kariirekinRate/100 * kariirekinMonths/12);
  const shihonkin = compRandMult(100000, 3, 8);
  const kurikoshiKishu = compRandMult(10000, 5, 20);
  const shiire = compRandMult(10000, 40, 90);
  const kyuryo = compRandMult(10000, 8, 20);
  const hoken = compRandMult(1000, 15, 30);
  const hokenMaebarai = compRandMult(1000, 2, Math.max(2, Math.floor(hoken/1000)-3));
  const genmatsuShouhin = compRandMult(10000, 6, 15);
  const shiharaiRisokuMoto = compRandMult(1000, 4, 12);

  const urigenka = kishuShouhin + shiire - genmatsuShouhin;
  const uriage = urigenka + compRandMult(50000, 8, 20);

  const taoreireKurinyure = taoreireNeed - taoreireExisting;
  const genkahi = tatemonoGenkaYr + bihinGenkaYr;
  const hokenHiyou = hoken - hokenMaebarai;
  const hanri = kyuryo + hokenHiyou + taoreireKurinyure + genkahi;
  const uriageSorieki = uriage - urigenka;
  const eigyouRieki = uriageSorieki - hanri;
  const shiharaiRisoku = shiharaiRisokuMoto + risokuMikarai;
  const keijou = eigyouRieki - shiharaiRisoku;
  const hojinzei = Math.round(keijou * 0.3);
  const junRieki = keijou - hojinzei;

  const tatemonoRuikeiMatsu = tatemonoRuikei0 + tatemonoGenkaYr;
  const tatemonoBs = tatemono - tatemonoRuikeiMatsu;
  const bihinRuikeiMatsu = bihinRuikei0 + bihinGenkaYr;
  const bihinBs = bihin - bihinRuikeiMatsu;

  const totalDebitNoGenkin = uketori+urikake+kishuShouhin+tatemono+bihin+shiire+kyuryo+hoken+shiharaiRisokuMoto;
  const totalCredit = taoreireExisting+tatemonoRuikei0+bihinRuikei0+kakekin+kariirekin+shihonkin+kurikoshiKishu+uriage;
  const genkin = totalCredit - totalDebitNoGenkin;

  // sanity: must be valid for a believable problem
  if(genkin < 50000/COMP_SCALE || keijou <= 0 || junRieki <= 0 || hokenHiyou < 0 || taoreireKurinyure <= 0) return genFS1();

  const shisanGoukei = genkin + uketori + urikake - taoreireNeed + genmatsuShouhin + hokenMaebarai + tatemonoBs + bihinBs;
  const fusai = kakekin + risokuMikarai + hojinzei + kariirekin;
  const jyunshisan = shihonkin + (kurikoshiKishu + junRieki);
  // balance check
  if(Math.abs((fusai+jyunshisan) - shisanGoukei) > 0) return genFS1();

  const plHtml = stmtTable([
    stmtRow('売上高', uriage, 'uriage'),
    stmtRow('売上原価', urigenka, 'urigenka'),
    stmtRow('売上総利益', uriageSorieki, 'sorieki', 'sub'),
    stmtHd('販売費及び一般管理費'),
    stmtRow('給料', kyuryo, null, 'i'),
    stmtRow('保険料', hokenHiyou, 'hoken', 'i'),
    stmtRow('貸倒引当金繰入', taoreireKurinyure, 'taoreireKurinyure', 'i'),
    stmtRow('減価償却費', genkahi, 'genka', 'i'),
    stmtRow('販管費計', hanri, null, 'i'),
    stmtRow('営業利益', eigyouRieki, 'eigyou', 'sub'),
    stmtHd('営業外費用'),
    stmtRow('支払利息', shiharaiRisoku, null, 'i'),
    stmtRow('経常利益', keijou, 'keijou', 'sub'),
    stmtRow('法人税、住民税及び事業税', hojinzei, 'hojinzei'),

// ===== FS-2 generator =====
function genFS2(){
  const urikake = compRandMult(10000, 15, 35);
  const taoreireRate = compPick([1,2,3,4]);
  const taoreireNeed = Math.round(urikake*taoreireRate/100);
  const taoreireExisting = compRandMult(500, 1, Math.max(1, Math.floor(taoreireNeed/500)-1));
  const kishuShouhin = compRandMult(10000, 4, 10);
  const bihinNensuu = compPick([4,5,6,8]);
  const bihin = compRandMult(bihinNensuu*1000, 8, 20);
  const bihinGenkaYr = bihin/bihinNensuu;
  const bihinRuikei0 = bihinGenkaYr * compRandMult(1,1,Math.max(1,bihinNensuu-2));
  const kakekin = compRandMult(10000, 6, 15);
  const shihonkin = compRandMult(100000, 2, 6);
  const kurikoshiKishu = compRandMult(10000, 3, 10);
  const shiire = compRandMult(10000, 30, 70);
  const kyuryo = compRandMult(10000, 6, 15);
  const koukoku = compRandMult(1000, 15, 40);
  const koukokuMaebarai = compRandMult(1000, 2, Math.max(2, Math.floor(koukoku/1000)-3));
  const zappi = compRandMult(1000, 5, 15);
  const genmatsuShouhin = compRandMult(10000, 4, 12);
  const hojinzei = compRandMult(1000, 10, 30);

  const urigenka = kishuShouhin + shiire - genmatsuShouhin;
  const uriage = urigenka + compRandMult(50000, 5, 15);

  const taoreireKurinyure = taoreireNeed - taoreireExisting;
  const koukokuHiyou = koukoku - koukokuMaebarai;
  const hanri = kyuryo + koukokuHiyou + zappi + taoreireKurinyure + bihinGenkaYr;
  const uriageSorieki = uriage - urigenka;
  const eigyouRieki = uriageSorieki - hanri;
  const junRieki = eigyouRieki - hojinzei;

  const bihinRuikeiMatsu = bihinRuikei0 + bihinGenkaYr;
  const bihinBs = bihin - bihinRuikeiMatsu;

  const totalDebitNoGenkin = urikake+kishuShouhin+bihin+shiire+kyuryo+koukoku+zappi;
  const totalCredit = taoreireExisting+bihinRuikei0+kakekin+shihonkin+kurikoshiKishu+uriage;
  const genkin = totalCredit - totalDebitNoGenkin;

  if(genkin < 30000/COMP_SCALE || eigyouRieki<=0 || junRieki<=0 || koukokuHiyou<0 || taoreireKurinyure<=0) return genFS2();

  const shisanGoukei = genkin + urikake - taoreireNeed + genmatsuShouhin + koukokuMaebarai + bihinBs;
  const fusai = kakekin + hojinzei;
  const jyunshisan = shihonkin + (kurikoshiKishu + junRieki);
  if(Math.abs((fusai+jyunshisan)-shisanGoukei) > 0) return genFS2();

  const plHtml = stmtTable([
    stmtRow('売上高', uriage, 'uriage'),
    stmtRow('売上原価', urigenka, 'urigenka'),
    stmtRow('売上総利益', uriageSorieki, 'sorieki', 'sub'),
    stmtHd('販売費及び一般管理費'),
    stmtRow('給料', kyuryo, null, 'i'),
    stmtRow('広告宣伝費', koukokuHiyou, 'koukoku', 'i'),
    stmtRow('雑費', zappi, null, 'i'),
    stmtRow('貸倒引当金繰入', taoreireKurinyure, 'taoreireKurinyure', 'i'),
    stmtRow('減価償却費', bihinGenkaYr, 'genka', 'i'),
    stmtRow('販管費計', hanri, null, 'i'),
    stmtRow('営業利益＝経常利益＝税引前当期純利益', eigyouRieki, 'eigyou', 'sub'),
    stmtRow('法人税、住民税及び事業税', hojinzei, 'hojinzei'),
    stmtRow('当期純利益', junRieki, 'junrieki', 'sub'),
  ]);
  const bsHtml = stmtTable([
    stmtHd('資産の部'),
    stmtRow('現金預金', genkin, null),
    stmtRow('売掛金', urikake, null),
    stmtRow('貸倒引当金', `△${yen(taoreireNeed)}円`, 'taoreireBs', 'i'),
    stmtRow('商品', genmatsuShouhin, null),
    stmtRow('前払費用', koukokuMaebarai, null),
    stmtRow('備品', bihinBs, 'bihinBs'),
    stmtRow('資産合計', shisanGoukei, 'shisanGoukei', 'sub'),
    stmtHd('負債の部'),
    stmtRow('買掛金', kakekin, null),
    stmtRow('未払法人税等', hojinzei, null),
    stmtRow('負債合計', fusai, null, 'sub'),
    stmtHd('純資産の部'),
    stmtRow('資本金', shihonkin, null),
    stmtRow('繰越利益剰余金', kurikoshiKishu+junRieki, null),
    stmtRow('純資産合計', jyunshisan, null, 'sub'),
  ]);

  return {
    stmt: { pl:{title:'損益計算書', html:plHtml}, bs:{title:'貸借対照表', html:bsHtml} },
    title: '財務諸表作成②：決算整理後のP/L・B/S',
    scenario_html: `
      <div class="comp-sect-hd">決算整理前残高試算表（一部・単位：円）</div>
      <div class="comp-table">

// ===== Branch-2 generator =====
function genBranch2(){
  const markupPct = compPick([10,20,25,30]);
  const naibuGenka = compRandMult(100, 300, 1500);
  const naibuBaika = Math.round(naibuGenka*(100+markupPct)/100);
  const shitenKimatsuHontenGenka = compRandMult(100, 50, Math.max(50,Math.floor(naibuGenka/100)));
  const shitenKimatsuHonten = Math.round(shitenKimatsuHontenGenka*(100+markupPct)/100);
  const miJitsugen = shitenKimatsuHonten - shitenKimatsuHontenGenka;
  const shitenKimatsuGai = compRandMult(1000, 5, 20);
  const shitenKimatsuTotal = shitenKimatsuHonten + shitenKimatsuGai;

  const hontenKimatsu = compRandMult(10000, 4, 10);
  const hontenKishu = compRandMult(10000, 3, 8);
  const shitenKishu = compRandMult(10000, 1, 4);
  const hontenShiire = compRandMult(50000, 6, 14);
  const shitenShiireGai = compRandMult(10000, 5, 15);
  const hontenKyuryo = compRandMult(10000, 6, 15);
  const shitenKyuryo = compRandMult(10000, 2, 8);
  const hontenUriage = compRandMult(50000, 10, 20);
  const shitenUriage = compRandMult(50000, 4, 8);

  const gappeiUriage = hontenUriage + shitenUriage - naibuBaika;
  const gappeiKishu = hontenKishu + shitenKishu;
  const gappeiShiire = hontenShiire + shitenShiireGai;
  const gappeiKimatsuShinjitsu = hontenKimatsu + (shitenKimatsuHontenGenka + shitenKimatsuGai);
  const gappeiGenka = gappeiKishu + gappeiShiire - gappeiKimatsuShinjitsu;
  const gappeiSorieki = gappeiUriage - gappeiGenka;
  const gappeiKyuryo = hontenKyuryo + shitenKyuryo;

  const shihonkinKishu = compRandMult(100000, 8, 20);
  const shihonJunbiKishu = compRandMult(10000, 10, 30);
  const riekiJunbiKishu = compRandMult(10000, 2, 8);
  const kurikoshiKishu = compRandMult(10000, 30, 70);
  const jikokabuShutoku = compRandMult(10000, 4, 12);
  const shobunWariai = compPick([0.25, 0.5, 0.75]);
  const genkaSoutou = jikokabuShutoku*shobunWariai;
  const shobunBairitsu = compPick([1.05, 1.1, 1.15, 1.2, 1.25]);
  const shobunKakaku = Math.round(genkaSoutou*shobunBairitsu);
  const shobunSagaku = shobunKakaku - genkaSoutou;
  const jikokabuMatsu = jikokabuShutoku - genkaSoutou;
  const junRieki = compRandMult(50000, 3, 10);
  const kurikoshiMatsu = kurikoshiKishu + junRieki;
  const goukei = shihonkinKishu + (shihonJunbiKishu+shobunSagaku) + (riekiJunbiKishu+kurikoshiMatsu) - jikokabuMatsu;

  if(!Number.isInteger(genkaSoutou) || shobunSagaku<=0 || jikokabuMatsu<=0) return genEquity2();

  const stmtHtml = stmtTable([
    stmtHd('【資本剰余金】（資本準備金＋その他資本剰余金）'),
    stmtRow('当期首残高', shihonJunbiKishu, null, 'i'),
    stmtRow('自己株式の処分差益', `+${yen(shobunSagaku)}円`, 'shobun-sagaku', 'i'),

// ===== StdCost-1 generator（材料費差異） =====
function genStdCost1(){
  const hyoujunTanka = compRandMult(10, 15, 40);
  const hyoujunPerUnit = compPick([2,3,4,5]);
  const seisanryou = compRandMult(10, 5, 20);
  const hyoujunShouhiryou = seisanryou*hyoujunPerUnit;
  const jissaiShouhiryou = hyoujunShouhiryou + compPick([-1,1])*compRandMult(1, 5, 30);
  const jissaiTanka = hyoujunTanka + compPick([-1,1])*compRandMult(1, 5, 25);
  if(jissaiShouhiryou<=0 || jissaiTanka<=0) return genStdCost1();
  const jissaiShouhigaku = jissaiShouhiryou*jissaiTanka;

  const hyoujunZairyouhi = hyoujunShouhiryou*hyoujunTanka;
  const kakakuSai = (hyoujunTanka-jissaiTanka)*jissaiShouhiryou;
  const suuryouSai = (hyoujunShouhiryou-jissaiShouhiryou)*hyoujunTanka;
  const souSai = hyoujunZairyouhi-jissaiShouhigaku;
  if(kakakuSai===0 || suuryouSai===0) return genStdCost1();

  return {
    title: '標準原価計算①：材料費差異（価格差異・数量差異）',

      { label:'実際単価はいくらか？', ans:jissaiTanka, unit:'円／kg', relKeys:['jissai-shouhiryou','jissai-shouhigaku'],
        choices:numChoices(jissaiTanka, [hyoujunTanka, Math.round(jissaiShouhigaku/hyoujunShouhiryou)]),

  if(jissaiJikan<=0 || jissaiChingin<=0) return genStdCost2();
  const jissaiRoumuhi = jissaiJikan*jissaiChingin;

  const hyoujunRoumuhi = hyoujunJikan*hyoujunChingin;
  const chinritsuSai = (hyoujunChingin-jissaiChingin)*jissaiJikan;
  const jikanSai = (hyoujunJikan-jissaiJikan)*hyoujunChingin;

// ===== StdCost-3 generator（製造間接費差異） =====
function genStdCost3(){
  const hendouhiRitsu = compRandMult(1, 20, 50);
  const kiteihiRitsu = compRandMult(1, 15, 40);
  const kijunSougyoudo = compRandMult(10, 10, 25);
  const kiteihiYosan = kiteihiRitsu*kijunSougyoudo;
  const hyoujunHaifuRitsu = hendouhiRitsu+kiteihiRitsu;

  const hyoujunJikan = kijunSougyoudo + compPick([-1,1])*compRandMult(1, 2, 15);
  const jissaiJikan = hyoujunJikan + compPick([-1,1])*compRandMult(1, 2, 15);
  if(hyoujunJikan<=0 || jissaiJikan<=0) return genStdCost3();
  const yosanKyoyougaku = hendouhiRitsu*jissaiJikan + kiteihiYosan;
  const jissaiHassei = yosanKyoyougaku + compPick([-1,1])*compRandMult(1000, 5, 40);
  if(jissaiHassei<=0) return genStdCost3();

  const hyoujunHaifugaku = hyoujunJikan*hyoujunHaifuRitsu;
  const yosanSai = yosanKyoyougaku - jissaiHassei;
  const nouritsuSai = hyoujunHaifuRitsu*(hyoujunJikan-jissaiJikan);
  const sougyoudoSai = kiteihiRitsu*(jissaiJikan-kijunSougyoudo);
  const souSai = hyoujunHaifugaku - jissaiHassei;
  if(yosanSai===0 || nouritsuSai===0 || sougyoudoSai===0) return genStdCost3();

  return {

// ===== CVP-1 generator =====
function genCVP1(){
  const hendouhi = compRandMult(10, 5, 25);
  const kouken = compRandMult(10, 3, 15);
  const hanbaikakaku = hendouhi+kouken;
  const koteihi = kouken * compRandMult(1000, 2, 10);
  const bepRyou = koteihi/kouken;
  const bepUriage = bepRyou*hanbaikakaku;
  const mokuhyouRieki = kouken * compRandMult(1000, 1, 5);
  const mokuhyouRyou = (koteihi+mokuhyouRieki)/kouken;
  const mokuhyouUriage = mokuhyouRyou*hanbaikakaku;
  const extraRyou = compRandMult(Math.max(5,Math.round(bepRyou*0.02)), 2, 24);
  const jissaiRyou = bepRyou+extraRyou;
  const jissaiUriage = jissaiRyou*hanbaikakaku;
  const anzenYoyuuRitsu = Math.round((jissaiUriage-bepUriage)/jissaiUriage*100);
  if(anzenYoyuuRitsu<=0) return genCVP1();

  return {
    title: 'CVP分析①：損益分岐点と目標利益・安全余裕率',
    scenario_html: `

        exp:`貢献利益${yen(kouken)}円が、販売価格${yen(hanbaikakaku)}円の何%にあたるかを計算します。${yen(kouken)}÷${yen(hanbaikakaku)}×100≒<strong>${Math.round(kouken/hanbaikakaku*100)}%</strong>。` },

// ===== CVP-2 generator =====
function genCVP2(){
  const hendouHanbaihi = compRandMult(10, 5, 30);
  const hendouSeizouhi = compRandMult(10, 5, 25);
  const taniKouken = compRandMult(10, 3, 15);
  const hanbaikakaku = hendouSeizouhi+hendouHanbaihi+taniKouken;
  const koteiTotal = taniKouken * compRandMult(10, 3, 15);
  const koteiSeizouHiritsu = compPick([0.6,0.65,0.7,0.75]);
  const koteiSeizou = Math.round(koteiTotal*koteiSeizouHiritsu);
  const koteiHankan = koteiTotal - koteiSeizou;
  const bepRyou = koteiTotal/taniKouken;
  const bepUriage = bepRyou*hanbaikakaku;
  const extraRyou = compRandMult(Math.max(10,Math.round(bepRyou*0.1)), 1, 4);
  const hanbairyou = bepRyou + extraRyou;
  const koukenTotal = taniKouken*hanbairyou;
  const eigyouRieki = koukenTotal - koteiTotal;
  if(eigyouRieki<=0 || koteiHankan<=0 || koteiSeizou<=0) return genCVP2();

  const uriageTotal = hanbaikakaku*hanbairyou;
  const hendouTotal = uriageTotal - koukenTotal;
  const stmtHtml = stmtTable([
    stmtRow('売上高', uriageTotal, null),
    stmtRow('変動費（変動製造費＋変動販売費）', hendouTotal, null),
    stmtRow('貢献利益', koukenTotal, 'kouken-total', 'sub'),
    stmtRow('固定費（固定製造間接費＋固定販管費）', koteiTotal, 'kotei-total'),
    stmtRow('営業利益', eigyouRieki, 'eigyou', 'sub'),
  ]);

  return {
    stmt: { stmt:{title:'直接原価計算による損益計算書', html:stmtHtml} },
    title: 'CVP分析②：直接原価計算によるP/Lと損益分岐点',

        <div class="comp-row" data-key="hendou-hanbaihi"><span class="l">変動販売費（1個あたり）</span><span class="r">${yen(hendouHanbaihi)}円</span></div>
        <div class="comp-row" data-key="kotei-seizou"><span class="l">固定製造間接費（月間）</span><span class="r">${yen(koteiSeizou)}円</span></div>
        <div class="comp-row" data-key="kotei-hankan"><span class="l">固定販売費及び一般管理費（月間）</span><span class="r">${yen(koteiHankan)}円</span></div>
        <div class="comp-row" data-key="hanbairyou"><span class="l">当月の生産・販売量（期首期末在庫なし）</span><span class="r">${yen(hanbairyou)}個</span></div>
      </div>`,
    steps: [
      { label:'固定費合計（固定製造間接費＋固定販管費）はいくらか？', ans:koteiTotal, unit:'円', relKeys:['kotei-seizou','kotei-hankan'], stmtKey:'stmt', stmtLines:['kotei-total'],
        choices:numChoices(koteiTotal, [koteiSeizou, koteiHankan]),
        exp:`固定製造間接費${yen(koteiSeizou)}円と固定販売費及び一般管理費${yen(koteiHankan)}円は、どちらも生産・販売量に関わらずかかる期間費用なので、まとめて合計します。${yen(koteiSeizou)}＋${yen(koteiHankan)}＝<strong>${yen(koteiTotal)}円</strong>。` },
      { label:'製品1個あたりの貢献利益はいくらか？', ans:taniKouken, unit:'円', relKeys:['hanbaikakaku','hendou-seizouhi','hendou-hanbaihi'],
        choices:numChoices(taniKouken, [hanbaikakaku-hendouSeizouhi, hanbaikakaku-hendouHanbaihi]),
        exp:`販売価格${yen(hanbaikakaku)}円から変動製造費${yen(hendouSeizouhi)}円と変動販売費${yen(hendouHanbaihi)}円を引きます。${yen(hanbaikakaku)}－${yen(hendouSeizouhi)}－${yen(hendouHanbaihi)}＝<strong>${yen(taniKouken)}円</strong>。` },
      { label:'当月の貢献利益（総額）はいくらか？', ans:koukenTotal, unit:'円', relKeys:['hanbairyou'], stmtKey:'stmt', stmtLines:['kouken-total'],

let compChecked = {};

function compKey(item){ return item.ckey || ('C:'+item.title); }
// チェックは設問ごと（鍵＝問題の鍵＋#設問の番号）。以前の問題単位のチェックは、全設問にチェックとみなす
function stepOrig(item, si){ return item._idx ? item._idx[si] : si; }
function stepKey(item, si){ return compKey(item)+'#'+stepOrig(item, si); }
function isStepChecked(item, si){ return !!(compChecked[stepKey(item, si)] || compChecked[compKey(item)]); }
function toggleCompCheck(){
  const item = compQuizDeck[compQuizIdx], si = compQuizStepIdx, ck = compKey(item);
  if(compChecked[ck]){ // 以前の問題単位のチェックを設問単位に分ける
    delete compChecked[ck];
    const n = item._total || item.steps.length;
    for(let i=0;i<n;i++) compChecked[ck+'#'+i] = true;
  }
  const k = stepKey(item, si);
  if(compChecked[k]) delete compChecked[k]; else compChecked[k] = true;
  try{ localStorage.setItem('bk_comp_checked', JSON.stringify(compChecked)); }catch(e){}
  const b = document.getElementById('comp-check-btn');
  if(b){ const c=!!compChecked[k]; b.textContent = c ? '☑ この設問はチェック済み' : '☐ この設問にチェック'; b.classList.toggle('active', c); }
}
// 問題ごとのチェックの鍵：総合は分野と番号、1級計算・理論は題名や問題文
function compCkFor(key, i, fn){
  if(compMode==='sogo') return 'S:'+key+':'+i;

}
function compAllPairs(){

}
function compCheckedCount(){
  // チェックした設問の数
  const keys = Object.keys(compChecked);
  return compAllPairs().reduce((s,[fn,ck])=>{ if(compChecked[ck]) return s + fn().steps.length; return s + keys.filter(k=>k.startsWith(ck+'#')).length; }, 0);
}
function k1Gens(cats){

  for(let i=0;i<o['k1-all'].length;i+=20) o['k1-chunk-'+(i/20+1)] = o['k1-all'].slice(i,i+20);
  return o;
}

function launchCompCat(key, one){
  // one を指定すると、その分野の1問だけを解く（総合で問題を選んだとき）
  compQuizLastCat = key; compQuizLastOne = (one===undefined ? null : one);
  let pairs;
  if(key==='chk'){ pairs = compAllPairs(); }
  else {
    const gens = (compMode==='calc' ? calcGensFor(key) : compGens()[key]);
    pairs = gens.map((fn,i)=>[fn, compCkFor(key,i,fn)]);
    if(compQuizLastOne!==null) pairs = [pairs[compQuizLastOne]];
  }
  compQuizDeck = pairs.map(([fn,ck])=>{ const d=fn(); d.ckey=ck; d._total=d.steps.length; return d; });
  if(key==='chk'){ // チェックした設問だけを残す
    compQuizDeck = compQuizDeck.map(d=>{ const idx=d.steps.map((_,i)=>i).filter(i=>compChecked[d.ckey+'#'+i]||compChecked[d.ckey]); if(!idx.length) return null; d._idx=idx; d.steps=idx.map(i=>d.steps[i]); return d; }).filter(Boolean);
  }
  if(key==='k1-all' || key==='chk') shuffleArr(compQuizDeck);
  if(!compQuizDeck.length){ alert('チェックした設問はまだありません'); renderCompCatSelect(); return; }
  compQuizIdx = 0;
  compQuizStepIdx = 0;
  compQuizCorrectFirstTry = 0;
  compQuizTotalSteps = compQuizDeck.reduce((s,d)=>s+d.steps.length,0);
  compQuizFirstAttemptUsed = false;
  renderCompProblem();
}

function compQuizNavBar(){
  const total=compQuizDeck.length, i=compQuizIdx;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="exitCompQuiz()">✕ 終了</button>
    <span class="exp-nav-info">問題 ${i+1} / ${total}</span>
    <span style="width:64px;"></span>
  </div>`;
}

function compFmtChoice(v){
  return typeof v === 'number' ? v.toLocaleString() : String(v);
}

function renderCompProblem(){
  if(compQuizIdx >= compQuizDeck.length){ renderCompQuizFinish(); return; }
  const item = compQuizDeck[compQuizIdx];
  const main=document.getElementById('exp-main');
  main.innerHTML = `
    ${compQuizNavBar()}
    <div class="exp-q-card">
      <div class="comp-title">${item.title}</div>
      <div id="comp-scenario">${item.scenario_html}</div>
    </div>
    <div id="comp-step-area"></div>
    <div class="exp-result" id="comp-res"></div>`;
  compQuizStepIdx = 0;
  compQuizFirstAttemptUsed = false;
  renderCompStep();
}

function compClearHighlight(){
  document.querySelectorAll('#comp-scenario [data-key]').forEach(el=>el.classList.remove('comp-hl'));
}

function compApplyHighlight(keys){
  compClearHighlight();
  (keys||[]).forEach(k=>{
    document.querySelectorAll(`#comp-scenario [data-key="${k}"]`).forEach(el=>el.classList.add('comp-hl'));
  });
}

function renderCompStep(){
  const item = compQuizDeck[compQuizIdx];
  const step = item.steps[compQuizStepIdx];
  const area = document.getElementById('comp-step-area');
  const res = document.getElementById('comp-res');
  if(res){ res.style.display = 'none'; res.innerHTML=''; }
  compApplyHighlight(step.relKeys);
  const dots = item.steps.map((_,i)=>{
    const cls = i<compQuizStepIdx ? 'done' : (i===compQuizStepIdx ? 'active' : '');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled = [...step.choices].sort(()=>Math.random()-0.5);
  window._compChoices = shuffled;
  const isLong = shuffled.some(v=>String(compFmtChoice(v)).length>10) || typeof step.ans !== 'number';
  compQuizFirstAttemptUsed = false;
  area.innerHTML = `
    <div class="exp-step-header">
      <span class="exp-step-label">設問 ${compQuizStepIdx+1}/${item.steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    ${step.hint ? `<div class="comp-hint">💡 前の設問の答えを使う：${step.hint}</div>` : ''}
    <button class="exp-reveal-btn" id="ans-show-btn" onclick="compShowAns()">答えを表示</button>
    <div class="exp-step-choices${isLong?' wide':''}">
      ${shuffled.map((c,i)=>`<button class="exp-step-choice-btn" onclick="selectCompChoice(this,${i})">${compFmtChoice(c)}${(typeof c==='number' && step.unit)?('　'+step.unit):''}</button>`).join('')}
    </div>`;
}

function selectCompChoice(btn, idx){
  const item = compQuizDeck[compQuizIdx];
  const step = item.steps[compQuizStepIdx];
  const chosen = window._compChoices[idx];
  const ok = chosen === step.ans;
  if(ok){
    if(!compQuizFirstAttemptUsed) compQuizCorrectFirstTry++;
    const showBtn=document.getElementById('ans-show-btn'); if(showBtn) showBtn.style.display='none';
    document.querySelectorAll('#comp-step-area .exp-step-choice-btn').forEach(b=>{
      b.disabled = true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity = '0.4';
    });
    showCompStepExplanation();
  } else {
    compQuizFirstAttemptUsed = true;
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'), 500);
  }
}

// 「答えを表示」：解かずに正解と解説を出す（1回目で正解できなかった扱い）
function compShowAns(){
  const step = compQuizDeck[compQuizIdx].steps[compQuizStepIdx];
  compQuizFirstAttemptUsed = true;
  const ai = window._compChoices.indexOf(step.ans);
  document.querySelectorAll('#comp-step-area .exp-step-choice-btn').forEach((b,i)=>{
    b.disabled = true;
    if(i===ai) b.classList.add('correct'); else b.style.opacity = '0.4';
  });
  showCompStepExplanation(true);
}

function compStmtHtml(item, step){
  if(!step.stmtKey || !item.stmt || !item.stmt[step.stmtKey]) return '';
  const entry = item.stmt[step.stmtKey];
  return `<div class="comp-stmt-wrap" id="comp-stmt-area">
    <div class="comp-stmt-title">${entry.title}のどこに入るか</div>
    ${entry.html}
  </div>`;
}

function showCompStepExplanation(revealed){
  const item = compQuizDeck[compQuizIdx];
  const step = item.steps[compQuizStepIdx];
  const isLastStepOfProblem = compQuizStepIdx >= item.steps.length - 1;
  const isLastProblem = compQuizIdx >= compQuizDeck.length - 1;
  const nextLabel = isLastStepOfProblem ? (isLastProblem ? '結果を見る →' : '次の問題へ →') : '次の設問へ →';
  const res = document.getElementById('comp-res');
  res.className = 'exp-result ok';
  res.style.display = 'block';
  const showBtn=document.getElementById('ans-show-btn'); if(showBtn) showBtn.style.display='none';
  res.innerHTML = `
    <div class="exp-res-hd">${revealed?'📖 答え':'⭕ 正解'}</div>
    ${compStmtHtml(item, step)}
    <button class="exp-nav-btn exp-nav-next" style="width:100%;margin:10px 0;" onclick="compQuizNextStep()">${nextLabel}</button>
    ${(()=>{ const c=isStepChecked(item, compQuizStepIdx); return `<div style="margin:0 0 10px;"><button id="comp-check-btn" class="exp-check-btn${c?' active':''}" onclick="toggleCompCheck()">${c?'☑ この設問はチェック済み':'☐ この設問にチェック'}</button></div>`; })()}
    <div class="exp-res-exp">${step.exp}</div>`;
  if(step.stmtKey && step.stmtLines){
    (step.stmtLines||[]).forEach(k=>{
      document.querySelectorAll(`#comp-stmt-area [data-line="${k}"]`).forEach(el=>el.classList.add('comp-hl'));
    });
  }
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function compQuizNextStep(){
  const item = compQuizDeck[compQuizIdx];
  compQuizStepIdx++;
  if(compQuizStepIdx >= item.steps.length){
    compQuizIdx++;
    renderCompProblem();
  } else {
    renderCompStep();
  }
}

function renderCompQuizFinish(){
  const pct = compQuizTotalSteps ? Math.round(compQuizCorrectFirstTry/compQuizTotalSteps*100) : 0;
  const main=document.getElementById('exp-main');
  main.innerHTML = `
    <div class="exp-fin">
      <div class="exp-fin-score">${compQuizCorrectFirstTry} / ${compQuizTotalSteps}</div>
      <div class="exp-fin-label">1回目で正解した設問の割合：${pct}%</div>
      <div class="exp-fin-btns">
        <button class="exp-fin-btn exp-fin-btn-retry" onclick="launchCompCat('${compQuizLastCat}'${compQuizLastOne===null?'':','+compQuizLastOne})">もう一度（数字は変わります）</button>
        <button class="exp-fin-btn exp-fin-btn-back" onclick="exitCompQuiz()">仕訳問題に戻る</button>
      </div>
      <button class="exp-nav-btn" style="width:100%;margin-top:10px;" onclick="renderCompCatSelect()">↩ 別の分野を選ぶ</button>
    </div>`;
}
// ===== 計算問題（2級までの計算論点を網羅・一歩ずつ選ぶ形式） =====
function calcRand(lo, hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }
function calcTable(rows){
  return `<div class="comp-table calc-table">${rows.map(([k,l,r])=>`<div class="comp-row" data-key="${k}"><span class="l">${l}</span><span class="r">${r}</span></div>`).join('')}</div>`;
}
function calcStrChoices(correct, others){
  const out=[correct];
  others.forEach(o=>{ if(!out.includes(o) && out.length<4) out.push(o); });
  return out;
}

function genCalcAssetSale(){

        choices:numChoices(bv,[cost-accum, cost-depNow]),
        exp:`${yen(cost)}－${yen(accum)}－${yen(depNow)}＝<strong>${yen(bv)}円</strong>` },

function genCalcSecurities(){
  const n1 = calcRand(2,6)*100, n2 = calcRand(2,6)*100;
  const avg = calcRand(8,15)*100;
  const p1 = avg - calcRand(1,4)*10*(n2/100);
  const p2 = (avg*(n1+n2) - p1*n1)/n2;
  const s = calcRand(1,Math.floor((n1+n2)/100)-1)*100;
  const ps = avg + compPick([-3,-2,-1,1,2,3,4])*20;
  const cost = s*avg;
  const gain = s*ps - cost;
  const rest = n1+n2-s;
  const jika = avg + compPick([-3,-2,-1,1,2,3])*10;
  const hyouka = rest*(jika-avg);
  return {
    title:'売買目的有価証券（平均単価・売却損益・期末評価）',
    scenario_html: calcTable([
      ['buy1','1回目の購入',`${n1}株を＠${yen(p1)}円で購入`],
      ['buy2','2回目の購入',`${n2}株を＠${yen(p2)}円で購入`],
      ['sell','売却',`${s}株を＠${yen(ps)}円で売却（平均原価法）`],
      ['jika','期末の時価',`＠${yen(jika)}円`],
    ]),
    steps:[
      { label:'1株あたりの平均単価はいくらか？', ans:avg, unit:'円', relKeys:['buy1','buy2'],
        choices:numChoices(avg,[(p1+p2)/2===avg?avg+10:Math.round((p1+p2)/2), p1, p2]),
        exp:`（${n1}×${yen(p1)}＋${n2}×${yen(p2)}）÷${n1+n2}株＝<strong>${yen(avg)}円</strong>` },
      { label:'売却した株式の帳簿価額（売却原価）はいくらか？', ans:cost, unit:'円', relKeys:['sell'],
        hint:compHint([['平均単価',`${yen(avg)}円`]]),
        choices:numChoices(cost,[s*p1, s*ps]),
        exp:`${s}株×${yen(avg)}円＝<strong>${yen(cost)}円</strong>` },
      { label:`有価証券売却${gain>=0?'益':'損'}はいくらか？`, ans:Math.abs(gain), unit:'円', relKeys:['sell'],
        choices:numChoices(Math.abs(gain),[Math.abs(s*(ps-p1)), s*ps]),
        exp:`${yen(s*ps)}－${yen(cost)}＝<strong>${gain>=0?'':'△'}${yen(Math.abs(gain))}円</strong>（売却${gain>=0?'益':'損'}）` },
      { label:`期末の評価${hyouka>=0?'益':'損'}（残りの株式を時価に評価替え）はいくらか？`, ans:Math.abs(hyouka), unit:'円', relKeys:['jika'],
        choices:numChoices(Math.abs(hyouka),[Math.abs((n1+n2)*(jika-avg)), rest*jika]),
        exp:`残り${rest}株×（${yen(jika)}－${yen(avg)}）円＝<strong>${hyouka>=0?'':'△'}${yen(Math.abs(hyouka))}円</strong>` },
    ]
  };
}

function genCalcBond(){
  const face = calcRand(5,20)*100000;
  const years = compPick([4,5]);
  const gap = years*calcRand(2,8)*1000;

  const r = compPick([1,2,3]);
  const amort = gap/years;
  const coupon = face*r/100;
  return {
    title:'満期保有目的債券（償却原価法・定額法）',
    scenario_html: calcTable([
      ['face','社債の額面',`${yen(face)}円（利率年${r}％・利払いは年1回の決算日）`],
      ['cost','取得価額',`${yen(cost)}円（期首に取得）`],
      ['years','満期まで',`${years}年`],

        choices:numChoices(gap,[amort, coupon]),
        exp:`${yen(face)}－${yen(cost)}＝<strong>${yen(gap)}円</strong>` },
      { label:'当期の償却額（帳簿価額に加える額）はいくらか？', ans:amort, unit:'円', relKeys:['years'],

        choices:numChoices(coupon+amort,[coupon, cost*r/100]),

function genCalcAccrual(){
  const payMonth = compPick([8,9,10,11,12,1]);

  return {
    title:'経過勘定（前払費用・未払費用の月割計算）',
    scenario_html: calcTable([
      ['ins','保険料',`${payMonth}月1日に向こう1年分${yen(premium)}円を支払い、全額費用にした`],

      ['lastpay','利息の最後の支払日',`${lastPay}月末（その後の利息は未払い）`],

        choices:numChoices(usedMonths,[12-usedMonths, usedMonths+1]),

      { label:'前払費用（翌期分の保険料）はいくらか？', ans:prepaid, unit:'円', relKeys:['ins'],
        hint:compHint([['当期分',`${usedMonths}か月`]]),
        choices:numChoices(prepaid,[premium*usedMonths/12, premium]),
        exp:`${yen(premium)}×${12-usedMonths}／12＝<strong>${yen(prepaid)}円</strong>` },
      { label:'未払利息は何か月分か？', ans:accrMonths, unit:'か月', relKeys:['lastpay','close'],
        choices:numChoices(accrMonths,[accrMonths+1, 12-accrMonths]),

function genCalcMaterial(){
  const q0 = calcRand(1,4)*100, p0 = calcRand(40,60)*10;
  const q1 = calcRand(3,6)*100, p1 = p0 + calcRand(1,4)*10;
  const use = q0 + calcRand(1,q1/100-1)*100;
  const fifo = q0*p0 + (use-q0)*p1;
  const avgTotal = q0*p0+q1*p1;
  const avgQ = q0+q1;
  let avgP = avgTotal/avgQ;
  if(!Number.isInteger(avgP)) return genCalcMaterial();
  const avgUse = use*avgP;
  return {
    title:'材料費（先入先出法・平均法）',
    scenario_html: calcTable([
      ['begin','月初の材料',`${q0}kg（＠${yen(p0)}円）`],
      ['buy','当月の購入',`${q1}kg（＠${yen(p1)}円）`],
      ['use','当月の消費',`${use}kg（すべて直接材料として消費）`],
    ]),
    steps:[
      { label:'先入先出法の場合、当月の材料消費額はいくらか？', ans:fifo, unit:'円', relKeys:['begin','buy','use'],
        choices:numChoices(fifo,[use*p1, use*p0, avgUse]),
        exp:`月初分から先に使う：${q0}kg×${yen(p0)}＋${use-q0}kg×${yen(p1)}＝<strong>${yen(fifo)}円</strong>` },
      { label:'平均法（総平均法）の場合、平均単価はいくらか？', ans:avgP, unit:'円', relKeys:['begin','buy'],
        choices:numChoices(avgP,[(p0+p1)/2===avgP?avgP+5:Math.round((p0+p1)/2), p1]),
        exp:`（${yen(q0*p0)}＋${yen(q1*p1)}）÷${avgQ}kg＝<strong>${yen(avgP)}円</strong>` },
      { label:'平均法の場合、当月の材料消費額はいくらか？', ans:avgUse, unit:'円', relKeys:['use'],
        hint:compHint([['平均単価',`${yen(avgP)}円`]]),
        choices:numChoices(avgUse,[fifo, use*p1]),
        exp:`${use}kg×${yen(avgP)}＝<strong>${yen(avgUse)}円</strong>` },
      { label:'先入先出法の場合、月末の材料はいくらか？', ans:(q0+q1-use)*p1, unit:'円', relKeys:['buy'],
        choices:numChoices((q0+q1-use)*p1,[(q0+q1-use)*avgP, (q0+q1-use)*p0]),

    ]
  };
}

function genCalcLabor(){

      { label:'間接労務費（予定賃率×間接作業時間）はいくらか？', ans:rate*hIndirect, unit:'円', relKeys:['rate','hours'],
        choices:numChoices(rate*hIndirect,[rate*hDirect, rate*(hDirect-hIndirect)]),
        exp:`${yen(rate)}×${hIndirect}時間＝<strong>${yen(rate*hIndirect)}円</strong>` },

function genCalcOverhead(){
  const N = calcRand(8,15)*100;
  const v = calcRand(2,6)*100;
  const fRate = calcRand(3,8)*100;
  const F = fRate*N;
  const A = N - calcRand(1,3)*50;
  const yRate = v + fRate;
  const haifu = yRate*A;
  const budgetAllow = v*A + F;
  const budgetDiff = compPick([-1,1])*calcRand(1,8)*5000;
  const X = budgetAllow - budgetDiff;
  const opDiff = (A-N)*fRate;
  const total = haifu - X;
  return {
    title:'製造間接費の予定配賦と差異分析（公式法変動予算）',
    scenario_html: calcTable([
      ['N','基準操業度（月間）',`${yen(N)}時間`],
      ['budget','月間予算',`変動費率＠${yen(v)}円・固定費${yen(F)}円`],
      ['A','当月の実際操業度',`${yen(A)}時間`],
      ['X','当月の実際発生額',`${yen(X)}円`],
    ]),
    steps:[
      { label:'予定配賦率（1時間あたり）はいくらか？', ans:yRate, unit:'円', relKeys:['N','budget'],
        choices:numChoices(yRate,[v, fRate, F/A]),
        exp:`変動費率${yen(v)}＋固定費率${yen(F)}÷${yen(N)}＝<strong>${yen(yRate)}円</strong>` },
      { label:'予定配賦額はいくらか？', ans:haifu, unit:'円', relKeys:['A'],
        hint:compHint([['予定配賦率',`${yen(yRate)}円`]]),
        choices:numChoices(haifu,[yRate*N, X]),
        exp:`${yen(yRate)}×${yen(A)}時間＝<strong>${yen(haifu)}円</strong>` },
      { label:'製造間接費配賦差異（総差異）は？', ans:fmtVar(total), relKeys:['X'],
        hint:compHint([['予定配賦額',`${yen(haifu)}円`]]),
        choices:varChoices(total,[-total, budgetDiff]),
        exp:`${yen(haifu)}－${yen(X)}＝<strong>${total<0?'△':''}${yen(Math.abs(total))}円</strong>` },
      { label:'予算差異は？', ans:fmtVar(budgetDiff), relKeys:['budget','X'],
        choices:varChoices(budgetDiff,[-budgetDiff, opDiff, total]),
        exp:`予算許容額（${yen(v)}×${yen(A)}＋${yen(F)}＝${yen(budgetAllow)}）－実際${yen(X)}＝<strong>${budgetDiff<0?'△':''}${yen(Math.abs(budgetDiff))}円</strong>` },
      { label:'操業度差異は？', ans:fmtVar(opDiff), relKeys:['N','A'],
        choices:varChoices(opDiff,[-opDiff, (A-N)*v]),
        exp:`（${yen(A)}－${yen(N)}）時間×固定費率${yen(fRate)}＝<strong>${opDiff<0?'△':''}${yen(Math.abs(opDiff))}円</strong>（基準より稼働が少ない＝不利）` },
    ]
  };
}

function calcSign(n, plus, minus){ return `${n>=0?plus:minus} ${yen(Math.abs(n))}円`; }
function calcSignChoices(n, plus, minus, others){
  const c = calcSign(n, plus, minus);
  const alts = [calcSign(-n, plus, minus), ...others.map(o=>calcSign(n>=0?Math.abs(o):-Math.abs(o), plus, minus))];
  return calcStrChoices(c, alts);
}

function genCalcMovingAvg(){
  const q0 = calcRand(1,4)*10, p0 = calcRand(40,80)*10;
  const q1 = calcRand(2,6)*10;
  const avg1 = p0 + calcRand(1,4)*10*(q1/10);
  const p1 = (avg1*(q0+q1) - p0*q0)/q1;
  const s1 = calcRand(1,(q0+q1)/10-1)*10;
  const rest = q0+q1-s1;
  const q2 = calcRand(2,6)*10;
  const avg2 = avg1 + calcRand(1,3)*10*(q2/10);
  const p2 = (avg2*(rest+q2) - avg1*rest)/q2;
  const s2 = calcRand(1,(rest+q2)/10-1)*10;
  if(!Number.isInteger(p1) || !Number.isInteger(p2)) return genCalcMovingAvg();
  return {
    title:'商品の払出単価（移動平均法）',
    scenario_html: calcTable([
      ['b','前月繰越',`${q0}個（＠${yen(p0)}円）`],
      ['in1','5日 仕入',`${q1}個（＠${yen(p1)}円）`],
      ['out1','10日 売上',`${s1}個`],
      ['in2','15日 仕入',`${q2}個（＠${yen(p2)}円）`],
      ['out2','20日 売上',`${s2}個`],
    ]),
    steps:[
      { label:'5日の仕入後の平均単価はいくらか？', ans:avg1, unit:'円', relKeys:['b','in1'],
        choices:numChoices(avg1,[Math.round((p0+p1)/2)===avg1?avg1+5:Math.round((p0+p1)/2), p1]),
        exp:`（${q0}×${yen(p0)}＋${q1}×${yen(p1)}）÷${q0+q1}個＝<strong>${yen(avg1)}円</strong>` },
      { label:'10日の売上原価はいくらか？', ans:s1*avg1, unit:'円', relKeys:['out1'],
        hint:compHint([['平均単価',`${yen(avg1)}円`]]),
        choices:numChoices(s1*avg1,[s1*p0, s1*p1]),
        exp:`${s1}個×${yen(avg1)}＝<strong>${yen(s1*avg1)}円</strong>` },
      { label:'15日の仕入後の平均単価はいくらか？', ans:avg2, unit:'円', relKeys:['in2'],
        hint:compHint([['10日時点の在庫',`${rest}個×${yen(avg1)}円`]]),
        choices:numChoices(avg2,[Math.round((avg1+p2)/2)===avg2?avg2+5:Math.round((avg1+p2)/2), p2]),
        exp:`（${rest}×${yen(avg1)}＋${q2}×${yen(p2)}）÷${rest+q2}個＝<strong>${yen(avg2)}円</strong>` },
      { label:'20日の売上原価はいくらか？', ans:s2*avg2, unit:'円', relKeys:['out2'],
        hint:compHint([['平均単価',`${yen(avg2)}円`]]),
        choices:numChoices(s2*avg2,[s2*avg1, s2*p2]),
        exp:`${s2}個×${yen(avg2)}＝<strong>${yen(s2*avg2)}円</strong>` },
    ]
  };
}

function genCalcMerger(){

  const liab = calcRand(5,Math.floor(assets/100000)-10)*100000;

  const pp = Math.round((net + compPick([-3,-2,-1,1,2,3])*100000)/shares/100)*100;

  if(diff===0 || pp<=0) return genCalcMerger();
  return {
    title:'合併（のれん・負ののれん）',
    scenario_html: calcTable([
      ['a','受け入れた資産（時価）',`${yen(assets)}円`],

        choices:numChoices(net,[assets, assets+liab]),
        exp:`${yen(assets)}－${yen(liab)}＝<strong>${yen(net)}円</strong>` },
      { label:'取得原価（交付した株式の時価）はいくらか？', ans:price, unit:'円', relKeys:['s'],

        exp:`${shares}株×${yen(pp)}＝<strong>${yen(price)}円</strong>` },
      { label:'差額はどう処理するか？', ans:calcSign(diff,'のれん','負ののれん発生益'), relKeys:['a','s'],

function genCalcDeptMutual(){
  const [a,b,c] = compPick([[4,3,1],[5,3,2],[3,2,1],[6,3,1]]);
  const [d,e,f] = compPick([[2,3,1],[3,4,1],[3,2,1],[2,2,1]]);
  const s1=a+b+c, s2=d+e+f;
  const P = s1*(d+e)*calcRand(1,4)*1000;
  const R = s2*(a+b)*calcRand(1,4)*1000;
  const p1cut = P*a/s1, p1rep = P*c/s1;
  const r1cut = R*d/s2, r1pow = R*f/s2;
  const p2cut = r1pow*a/(a+b);
  const r2cut = p1rep*d/(d+e);
  const totalCut = p1cut + r1cut + p2cut + r2cut;
  return {
    title:'部門別配賦（相互配賦法・簡便法）',
    scenario_html: calcTable([
      ['own','補助部門費',`動力部門${yen(P)}円・修繕部門${yen(R)}円`],
      ['kw','動力の配賦基準',`切削${a}・組立${b}・修繕${c}`],
      ['rep','修繕の配賦基準',`切削${d}・組立${e}・動力${f}`],
      ['rule','配賦方法',`第1次配賦は補助部門にも配賦し、第2次配賦は製造部門だけに配賦`],
    ]),
    steps:[
      { label:'第1次配賦：動力部門費のうち切削部門へはいくらか？', ans:p1cut, unit:'円', relKeys:['own','kw'],
        choices:numChoices(p1cut,[P*a/(a+b), P*b/s1]),
        exp:`${yen(P)}×${a}／${s1}＝<strong>${yen(p1cut)}円</strong>` },
      { label:'第1次配賦：修繕部門費のうち切削部門へはいくらか？', ans:r1cut, unit:'円', relKeys:['own','rep'],
        choices:numChoices(r1cut,[R*d/(d+e), R*e/s2]),
        exp:`${yen(R)}×${d}／${s2}＝<strong>${yen(r1cut)}円</strong>` },
      { label:'第2次配賦：修繕部門から動力部門へ移った分のうち、切削部門へはいくらか？', ans:p2cut, unit:'円', relKeys:['kw','rep'],
        hint:compHint([['修繕→動力（第1次）',`${yen(r1pow)}円`]]),
        choices:numChoices(p2cut,[r1pow, r1pow*a/s1===p2cut?p2cut+1000:Math.round(r1pow*a/s1)]),
        exp:`${yen(r1pow)}×${a}／（${a}＋${b}）＝<strong>${yen(p2cut)}円</strong>` },
      { label:'第2次配賦：動力部門から修繕部門へ移った分のうち、切削部門へはいくらか？', ans:r2cut, unit:'円', relKeys:['kw','rep'],
        hint:compHint([['動力→修繕（第1次）',`${yen(p1rep)}円`]]),
        choices:numChoices(r2cut,[p1rep, Math.round(p1rep*d/s2)===r2cut?r2cut+1000:Math.round(p1rep*d/s2)]),
        exp:`${yen(p1rep)}×${d}／（${d}＋${e}）＝<strong>${yen(r2cut)}円</strong>` },
      { label:'切削部門への配賦額の合計はいくらか？', ans:totalCut, unit:'円', relKeys:['own'],
        choices:numChoices(totalCut,[p1cut+r1cut, P*a/(a+b)+R*d/(d+e)]),
        exp:`${yen(p1cut)}＋${yen(r1cut)}＋${yen(p2cut)}＋${yen(r2cut)}＝<strong>${yen(totalCut)}円</strong>` },
    ]
  };
}

function genCalcSpoilage(){
  const atEnd = Math.random()<0.5;
  const qc = calcRand(8,15)*10, qs = calcRand(1,3)*5, q1 = calcRand(2,5)*10;
  const p1 = compPick([0.4,0.5,0.6]);
  const um = calcRand(3,9)*10, uk = calcRand(4,12)*10;
  const denomM = atEnd ? qc+qs+q1 : qc+q1;
  const denomK = atEnd ? qc+qs+q1*p1 : qc+q1*p1;
  const M = um*denomM, K = uk*denomK;
  const wipM = um*q1, wipK = uk*q1*p1;
  const done = M+K-wipM-wipK;
  return {

      ['qs','正常仕損',`${qs}個（${atEnd?'工程の終点':'工程の始点'}で発生・処分価値なし）`],
      ['q1','月末仕掛品',`${yen(q1)}個（加工進捗度${p1*100}％）`],

        choices:['完成品のみ','完成品と月末仕掛品の両方'],
        exp: atEnd ? `仕損は終点で発生、月末仕掛品（${p1*100}％）はまだ終点を通っていないので<strong>完成品のみ</strong>が負担` : `仕損は始点で発生、月末仕掛品も始点を通っているので<strong>両方</strong>が負担（仕損の数量を無視して按分）` },
      { label:'月末仕掛品の直接材料費はいくらか？', ans:wipM, unit:'円', relKeys:['in','q1'],
        choices:numChoices(wipM,[Math.round(M*q1/(atEnd?qc+q1:qc+qs+q1)), um*q1*p1]),
        exp: atEnd ? `仕損も分母に含める：${yen(M)}×${yen(q1)}／（${yen(qc)}＋${qs}＋${yen(q1)}）＝<strong>${yen(wipM)}円</strong>` : `仕損を無視して按分：${yen(M)}×${yen(q1)}／（${yen(qc)}＋${yen(q1)}）＝<strong>${yen(wipM)}円</strong>` },
      { label:'月末仕掛品の加工費はいくらか？', ans:wipK, unit:'円', relKeys:['in','q1'],
        choices:numChoices(wipK,[Math.round(K*q1*p1/(atEnd?qc+q1*p1:qc+qs+q1*p1)), uk*q1]),
        exp: atEnd ? `${yen(K)}×${yen(q1*p1)}／（${yen(qc)}＋${qs}＋${yen(q1*p1)}）＝<strong>${yen(wipK)}円</strong>` : `${yen(K)}×${yen(q1*p1)}／（${yen(qc)}＋${yen(q1*p1)}）＝<strong>${yen(wipK)}円</strong>` },
      { label:'完成品総合原価（仕損費を含む）はいくらか？', ans:done, unit:'円', relKeys:['in'],

function genCalcStdVariance(){
  const sp = calcRand(5,15)*10, sq = calcRand(2,5);
  const out = calcRand(10,40)*10;
  const ap = sp + compPick([-2,-1,1,2])*5;
  const aq = sq*out + compPick([-3,-2,-1,1,2,3])*10;
  const priceVar = (sp-ap)*aq;
  const qtyVar = (sq*out-aq)*sp;
  const sr = calcRand(8,15)*100, sh = compPick([0.5,1,2]);
  const ar = sr + compPick([-2,-1,1,2])*50;
  const ah = sh*out + compPick([-2,-1,1,2])*10;
  const rateVar = (sr-ar)*ah;
  const timeVar = (sh*out-ah)*sr;
  return {
    title:'標準原価計算（直接材料費・直接労務費の差異分析）',
    scenario_html: calcTable([
      ['std','製品1個あたりの標準',`直接材料＠${sp}円×${sq}kg・直接労務＠${yen(sr)}円×${sh}時間`],
      ['out','当月の生産量',`${out}個（月初・月末の仕掛品なし）`],
      ['mat','直接材料の実際',`＠${ap}円×${yen(aq)}kg`],
      ['lab','直接労務の実際',`＠${yen(ar)}円×${yen(ah)}時間`],
    ]),
    steps:[
      { label:'価格差異（直接材料）は？', ans:fmtVar(priceVar), relKeys:['std','mat'],
        choices:varChoices(priceVar,[-priceVar, (sp-ap)*sq*out]),
        exp:`（標準${sp}－実際${ap}）×実際${yen(aq)}kg＝<strong>${priceVar<0?'△':''}${yen(Math.abs(priceVar))}円</strong>` },
      { label:'数量差異（直接材料）は？', ans:fmtVar(qtyVar), relKeys:['std','out','mat'],
        choices:varChoices(qtyVar,[-qtyVar, (sq*out-aq)*ap]),
        exp:`（標準${yen(sq*out)}kg－実際${yen(aq)}kg）×標準${sp}円＝<strong>${qtyVar<0?'△':''}${yen(Math.abs(qtyVar))}円</strong>` },
      { label:'賃率差異（直接労務）は？', ans:fmtVar(rateVar), relKeys:['std','lab'],
        choices:varChoices(rateVar,[-rateVar, (sr-ar)*sh*out]),
        exp:`（標準${yen(sr)}－実際${yen(ar)}）×実際${yen(ah)}時間＝<strong>${rateVar<0?'△':''}${yen(Math.abs(rateVar))}円</strong>` },
      { label:'時間差異（直接労務）は？', ans:fmtVar(timeVar), relKeys:['std','out','lab'],
        choices:varChoices(timeVar,[-timeVar, (sh*out-ah)*ar]),
        exp:`（標準${yen(sh*out)}時間－実際${yen(ah)}時間）×標準${yen(sr)}円＝<strong>${timeVar<0?'△':''}${yen(Math.abs(timeVar))}円</strong>` },
    ]
  };
}

  '発生した期間に正しく割り当て':'発生主義',

  '対応表示':'費用収益対応の原則',
  '期間的対応':'費用収益対応の原則',
  '個別的対応':'費用収益対応の原則',
  '取得原価を基礎':'取得原価主義',
  '相対的な真実':'真実性の原則',
  '必要な会計事実を':'明瞭性の原則',
  '処理の原則及び手続を毎期':'継続性の原則',
  '不利な影響を及ぼす可能性':'保守主義の原則',
};
function theoryTermsHtml(stmt, ans){
  const src = stmt + ' ' + (ans||'');
  let hits = Object.keys(THEORY_TERMS).filter(k => src.includes(k) && !stmt.includes(k+'とは'));
  Object.entries(THEORY_ALIAS).forEach(([ph,k]) => { if(src.includes(ph) && !hits.includes(k)) hits.push(k); });
  hits = hits.filter(k => !hits.some(o => o!==k && o.includes(k)));
  if(!hits.length) return '';
  return `<div class="exp-sec-hd" style="margin-top:10px;">用語</div>` + hits.map(k=>`<div class="exp-term"><strong>${k}</strong>：${THEORY_TERMS[k]}</div>`).join('');
}

  ['税効果','将来の課税所得と相殺可能な（　　）は、一時差異と同様に取り扱う。','繰越欠損金',['繰越欠損金','永久差異','交際費','受取配当金'],'一時差異等として、繰延税金資産の計上対象になる。'],
  ['退職給付','退職給付債務は、退職により見込まれる退職給付の総額のうち、期末までに発生していると認められる額を割り引いて計算する。','正しい',null,'割引率は安全性の高い債券の利回りを基礎とする。'],

  ['収益認識','変動対価の額は、最頻値による方法又は期待値による方法のうち、企業が権利を得ることとなる対価の額をより適切に予測できる方法を用いて見積る。','正しい',null,'見積った変動対価は、重大な戻入れが生じない可能性が高い部分に限って取引価格に含める。','会計学（会計基準）'],

  ['金融商品','金融資産の契約上の権利を行使したとき、権利を喪失したとき又は権利に対する支配が他に移転したときは、当該金融資産の消滅を認識しなければならない。','正しい',null,'消滅の認識の要件。','会計学（会計基準）'],

  ['リース','ファイナンス・リース取引とは、解約不能（ノンキャンセラブル）及びフルペイアウトの2つの要件を満たすリース取引をいう。','正しい',null,'どちらかを満たさなければオペレーティング・リース取引。','会計学（会計基準）'],

  ['企業結合','企業結合のうち取得とされたものの会計処理は、パーチェス法による。','正しい',null,'取得企業が、受け入れた資産・負債を時価で受け入れる。','会計学（会計基準）'],

  ['原価計算基準','製造間接費は、原則として予定配賦率をもって各製品に配賦する。','正しい',null,'実際配賦では、月ごとの変動で製品原価がぶれるため。','原価計算基準'],

  ['資産除去債務','割引前将来キャッシュ・フローの見積りが増加した場合、その時点の割引率を適用して、増加部分の資産除去債務を計上する。','正しい',null,'減少した場合は、負債計上時の割引率を適用する。','会計学（会計基準）'],

  ['純資産','自己株式の取得原価には、取得に要した付随費用を含める。','誤り',null,'付随費用は、損益計算書の営業外費用として処理する。','会計学（会計基準）'],
  ['純資産','ストック・オプションの付与日から権利確定日までの間、従業員等から取得するサービスの消費に応じて費用を計上し、対応する金額を権利行使又は失効が確定するまで新株予約権として計上する。','正しい',null,'費用は株式報酬費用。','会計学（会計基準）'],
  ['純資産','転換社債型新株予約権付社債の発行者側の処理は、一括法と区分法のいずれかによる。','正しい',null,'それ以外の新株予約権付社債は区分法による。','会計学（会計基準）'],
  ['純資産','資本準備金を減少させて資本金を増加させることはできるが、資本準備金を減少させてその他資本剰余金を増加させることはできない。','誤り',null,'株主総会の決議により、資本準備金を減少させてその他資本剰余金を増加させることもできる。','会計学（会計基準）'],
  ['企業結合','取得原価は、原則として、取得の対価となる財の企業結合日における時価で算定する。','正しい',null,'対価が株式の場合も、企業結合日の時価で算定する。','会計学（会計基準）'],
  ['企業結合','段階取得の場合、個別財務諸表上、取得原価は企業結合日における時価で算定し、それまでに保有していた株式との差額を段階取得に係る損益とする。','誤り',null,'個別財務諸表上は、支配を獲得するに至った個々の取引ごとの原価の合計額を取得原価とする。時価で算定し直して損益を計上するのは連結財務諸表上。','会計学（会計基準）'],
  ['企業結合','取得した資産に法律上の権利など分離して譲渡可能な無形資産が含まれる場合には、識別可能なものとして取り扱う。','正しい',null,'のれんとは区別して計上する。','会計学（会計基準）'],
  ['事業分離','分離元企業は、移転した事業に関する投資が清算されたとみる場合、受け取った対価の時価と移転した事業の株主資本相当額との差額を移転損益として認識する。','正しい',null,'対価が現金などの場合。','会計学（会計基準）'],
  ['事業分離','分離元企業が、移転した事業の対価として分離先企業の株式のみを受け取り、分離先企業が子会社となる場合でも、移転損益を認識する。','誤り',null,'投資が継続しているとみるので、移転損益は認識しない。受け取った株式の取得原価は、移転した事業の株主資本相当額。','会計学（会計基準）'],
  ['事業分離','事業分離に要した支出額は、発生時の事業年度の費用として処理する。','正しい',null,'取得関連費用と同じく費用処理。','会計学（会計基準）'],
  ['持分法','関連会社とは、出資、人事、資金、技術、取引等の関係を通じて、子会社以外の他の企業の財務及び営業又は事業の方針の決定に対して重要な影響を与えることができる場合における当該他の企業をいう。','正しい',null,'議決権の20％以上の所有が目安だが、実質で判断する。','会計学（会計基準）'],
  ['持分法','持分法適用会社に対する投資差額のうち、のれん相当額は、連結貸借対照表上、のれんとして区分して表示する。','誤り',null,'のれん相当額は投資の額（投資勘定）に含めて処理し、区分表示しない。','会計学（会計基準）'],
  ['持分法','持分法適用会社の決算日と連結決算日の差異が3か月を超えない場合には、持分法適用会社の正規の決算を基礎として持分法を適用することができる。','正しい',null,'子会社の決算日の差異の扱いと同じ考え方。','会計学（会計基準）'],
  ['外貨換算','為替予約の振当処理では、取引発生時と為替予約日の直物為替相場の差額（直々差額）は予約日の属する期の損益とし、直物為替相場と先物為替相場の差額（直先差額）は期間配分する。','正しい',null,'直先差額は、予約日から決済日までの期間に配分する。','会計学（会計基準）'],
  ['外貨換算','在外子会社の財務諸表の換算によって生じた換算差額は、為替換算調整勘定として当期の損益に計上する。','誤り',null,'為替換算調整勘定は、純資産の部（その他の包括利益累計額）に計上する。','会計学（会計基準）'],
  ['会計方針・誤謬','会計方針の変更を会計上の見積りの変更と区別することが困難な場合については、会計上の見積りの変更と同様に取り扱い、遡及適用は行わない。','正しい',null,'例：有形固定資産の減価償却方法の変更。','会計学（会計基準）'],
  ['会計方針・誤謬','過去の財務諸表における誤謬が発見された場合には、修正再表示を行う。','正しい',null,'誤謬の訂正は、過去の財務諸表を修正して表示し直す。','会計学（会計基準）'],
  ['会計方針・誤謬','財務諸表の表示方法を変更した場合には、表示する過去の財務諸表について新たな表示方法に従い組替えを行うが、これは遡及処理には含まれない。','誤り',null,'表示方法の変更による組替えも遡及処理に含まれる（遡及処理＝遡及適用・財務諸表の組替え・修正再表示）。','会計学（会計基準）'],
  ['キャッシュ・フロー計算書','間接法による営業活動によるキャッシュ・フローは、税引前当期純利益に非資金損益項目、営業活動に係る資産及び負債の増減、投資活動及び財務活動の区分に含まれる損益項目を加減して表示する。','正しい',null,'税引後の当期純利益から始めるのではない。','会計学（会計基準）'],
  ['キャッシュ・フロー計算書','利息の支払額は、営業活動によるキャッシュ・フローの区分に記載する方法のみが認められる。','誤り',null,'営業活動の区分に記載する方法と、財務活動の区分に記載する方法のいずれかを選択して継続適用する。','会計学（会計基準）'],
  ['包括利益','当期に当期純利益に含められた金額のうち、当期又は過去の期間にその他の包括利益に含まれていた部分は、組替調整額として、その他の包括利益の内訳項目ごとに注記する。','正しい',null,'例：その他有価証券を売却して売却損益が実現した場合。','会計学（会計基準）'],
  ['包括利益','連結財務諸表における包括利益の表示には、損益及び包括利益計算書の1計算書方式と、損益計算書と包括利益計算書の2計算書方式がある。','正しい',null,'どちらかを選択する。','会計学（会計基準）'],
  ['1株当たり利益','潜在株式が希薄化効果を有しない場合でも、潜在株式調整後1株当たり当期純利益を開示しなければならない。','誤り',null,'希薄化効果を有する場合に開示する。','会計学（会計基準）'],
  ['収益認識','顧客との契約から生じた債権とは、企業が顧客に対して有する対価に対する権利のうち、無条件のもの（対価の支払期限到来前に時の経過のみが要求されるもの）をいう。','正しい',null,'条件付きの権利は契約資産。','会計学（会計基準）'],
  ['収益認識','買戻し義務を負っている有償支給取引では、支給品の消滅を認識せず、有償支給時に収益も認識しない。','正しい',null,'受け取った対価は負債（有償支給取引に係る負債）とする。','会計学（会計基準）'],
  ['収益認識','契約に重要な金融要素が含まれる場合でも、取引価格は約束した対価の額のまま算定し、金利相当分の調整は行わない。','誤り',null,'金利相当分の影響を調整する。ただし、移転から支払までが1年以内なら調整しないことができる。','会計学（会計基準）'],
  ['収益認識','返品権付きの販売では、返品が見込まれる部分について収益を認識せず、返金負債を計上するとともに、顧客から製品を回収する権利を資産（返品資産）として計上する。','正しい',null,'返品資産は、販売した商品の帳簿価額をもとに計上する。','会計学（会計基準）'],

  ['金融商品','満期保有目的の債券、子会社株式及び関連会社株式並びにその他有価証券のうち、時価のあるものについて時価が著しく下落したときは、回復する見込みがあると認められる場合を除き、時価をもって貸借対照表価額とし、評価差額は当期の損失として処理する。','正しい',null,'減損処理。著しい下落は、取得原価に比べて50％程度以上の下落が目安。','会計学（会計基準）'],
  ['金融商品','債権の貸倒見積高の算定にあたっては、債務者の財政状態等に応じて、一般債権、貸倒懸念債権、破産更生債権等に区分し、すべてキャッシュ・フロー見積法で算定する。','誤り',null,'一般債権は貸倒実績率法、貸倒懸念債権は財務内容評価法かキャッシュ・フロー見積法、破産更生債権等は財務内容評価法。','会計学（会計基準）'],
  ['連結','子会社の決算日と連結決算日の差異が3か月を超えない場合には、子会社の正規の決算を基礎として連結決算を行うことができる。','正しい',null,'その場合も、決算日が異なることから生じる連結会社間の取引の重要な不一致は調整する。','会計学（会計基準）'],
  ['連結','親会社が子会社株式を一部売却した後も支配が継続している場合、売却価額と売却した持分との差額は、連結上、子会社株式売却損益として処理する。','誤り',null,'支配が継続しているので、差額は資本剰余金とする。子会社株式売却損益が生じるのは個別財務諸表上。','会計学（会計基準）'],
  ['連結','支配が一時的であると認められる企業であっても、支配している以上は連結の範囲に含めなければならない。','誤り',null,'支配が一時的と認められる企業などは、連結の範囲に含めない。','会計学（会計基準）'],
  ['税効果','将来減算一時差異とは、当該一時差異が解消するときに、その期の課税所得を減額する効果をもつものをいう。','正しい',null,'繰延税金資産の対象。将来加算一時差異は繰延税金負債の対象。','会計学（会計基準）'],
  ['税効果','繰延税金資産と繰延税金負債は、異なる納税主体のものであっても、相殺して表示する。','誤り',null,'同一の納税主体のものは相殺して表示するが、異なる納税主体のものは相殺しない。','会計学（会計基準）'],
  ['税効果','連結財務諸表固有の一時差異には、未実現損益の消去や、子会社の資産・負債の時価評価により生じる差異がある。','正しい',null,'個別財務諸表にはない、連結修正で生じる一時差異。','会計学（会計基準）'],
  ['退職給付','小規模な企業等では、退職給付債務を期末自己都合要支給額とするなどの簡便法を用いることができる。','正しい',null,'従業員数300人未満などが目安。','会計学（会計基準）'],
  ['退職給付','年金資産の額は、期末における時価により計算する。','正しい',null,'退職給付債務から年金資産を控除した額を負債（引当金）として計上する。','会計学（会計基準）'],
  ['退職給付','連結貸借対照表では、退職給付債務から年金資産を控除した額を退職給付引当金として計上する。','誤り',null,'連結貸借対照表では「退職給付に係る負債」（資産になる場合は退職給付に係る資産）として計上する。退職給付引当金は個別財務諸表上の科目。','会計学（会計基準）'],
  ['時価算定','時価とは、算定日において市場参加者間で秩序ある取引が行われると想定した場合の、当該取引における資産の購入のために支払う価格をいう。','誤り',null,'時価は出口価格。資産の売却によって受け取る価格（又は負債の移転のために支払う価格）であり、購入のために支払う入口価格ではない。','会計学（会計基準）'],
  ['時価算定','時価の算定に用いるインプットのうち、レベル1のインプットは、観察できないインプットである。','誤り',null,'レベル1は同一の資産・負債の活発な市場での相場価格。観察できないインプットはレベル3。','会計学（会計基準）'],
  ['セグメント情報','セグメント情報は、経営上の意思決定を行い業績を評価するために、経営者が企業を事業の構成単位に分別した方法を基礎として開示する（マネジメント・アプローチ）。','正しい',null,'経営者の視点で区分する。','会計学（会計基準）'],
  ['セグメント情報','事業セグメントの売上高が全事業セグメントの売上高の合計額の5％以上である場合には、報告セグメントとして開示しなければならない。','誤り',null,'量的基準は10％以上。','会計学（会計基準）'],
  ['賃貸等不動産','賃貸等不動産については、貸借対照表価額を時価に評価替えしなければならない。','誤り',null,'評価替えはせず、時価などを注記する。','会計学（会計基準）'],
  ['原価計算基準','原価計算の目的は、財務諸表作成目的と価格計算目的の2つに限られる。','誤り',null,'原価計算基準は、財務諸表作成・価格計算・原価管理・予算管理・基本計画設定の5つの目的を挙げている。','原価計算基準'],
  ['原価計算基準','原価要素は、形態別分類として、材料費、労務費及び経費に分類する。','正しい',null,'他に、機能別分類、製品との関連による分類、操業度との関連による分類などがある。','原価計算基準'],
  ['原価計算基準','直接原価計算は、原価計算基準において原価計算制度として認められている。','誤り',null,'直接原価計算は制度としては認められていない。外部報告では固定費調整で全部原価計算の利益に直す。','原価計算基準'],
  ['原価計算基準','個別原価計算は、種類を異にする製品を個別的に生産する生産形態に適用し、特定製造指図書について個別的に直接費及び間接費を集計する。','正しい',null,'総合原価計算は同種製品を反復連続的に生産する形態に適用する。','原価計算基準'],
  ['原価計算基準','部門別計算の目的は、原価管理と、製品原価の正確な計算にある。','正しい',null,'部門ごとに原価を集計し、責任を明らかにする。','原価計算基準'],
  ['原価計算基準','等級別総合原価計算では、各等級製品について適当な等価係数を定め、完成品総合原価を等価係数に基づいて各等級製品に按分する。','正しい',null,'同一工程で、形状・大きさ・品位などが異なる同種製品を生産する場合に適用する。','原価計算基準'],
  ['原価計算基準','連産品の価額は、連産品の正常市価等を基準として定めた等価係数に基づき、一期間の総合原価を按分して計算する。','正しい',null,'必要に応じて、主産物の総合原価から副産物の価額を控除する。','原価計算基準'],
  ['原価計算基準','副産物の価額は、主産物の総合原価に加算する。','誤り',null,'副産物の価額は、主産物の総合原価から控除する。','原価計算基準'],
  ['原価計算基準','標準原価は、原価管理のためにも、予算編成のためにも、また、たな卸資産価額及び売上原価算定のためにも、現状に即した標準でなければならないから、常にその適否を吟味し、機械設備、生産方式等生産の基本条件ならびに材料価格、賃率等に重大な変化が生じた場合には、現状に即するようにこれを改訂する。','正しい',null,'標準原価の改訂（基準42）。','原価計算基準'],
  ['原価計算基準','材料の消費価格は、原則として実際の購入原価とし、予定価格等をもって計算することは認められない。','誤り',null,'必要ある場合には、予定価格等をもって計算することができる。','原価計算基準'],

// 理論の分野一覧を作る（趣旨の問題は別タブ）
function buildTheoryCats(wantShushi){
  const cats = [];
  KYU1_THEORY.forEach(([std, s, ans, ch, exp, group], idx) => {
    const isFill = !!ch, isShushi = !!ch && !s.includes('（　　）');
    if(isShushi !== wantShushi) return;
    let c = cats.find(x => x.label === std);
    if(!c){ c = {key:(wantShushi?'k1s-':'k1t-')+cats.length, label:std, group: group || '会計学（会計基準）', gens:[]}; cats.push(c); }
    const info = SHUSHI_INFO[s];
    c.gens.push(() => ({
      title: `${std}（${isShushi?'趣旨':isFill?'穴埋め':'正誤'}）`,
      scenario_html: `<div class="comp-table"><div class="comp-row"><span class="l" style="font-weight:400;line-height:1.8;">${s}</span></div></div>`
        + (isShushi && info ? `<div class="k1-term-box"><strong>用語</strong>　${info[0]}</div><div class="k1-ex"><strong>具体例</strong>　${info[1]}</div>`
          : THEORY_EXAMPLES[idx] ? `<button class="k1-ex-btn" onclick="this.style.display='none';this.nextElementSibling.style.display='block';">💡 具体例を見る</button><div class="k1-ex" style="display:none;"><strong>具体例</strong>　${THEORY_EXAMPLES[idx]}</div>` : ''),
      ckey: 'T:'+s,
      steps: [{ label: isShushi ? '最も適切なものを選んでください' : isFill ? '（　　）に入る語句は？' : 'この文は正しいか？', ans, choices: ch || ['正しい','誤り'],
        exp: exp + (THEORY_SHUSHI[idx] ? `<div class="k1-shushi"><strong>趣旨</strong>　${THEORY_SHUSHI[idx]}</div>` : '') + (isShushi ? '' : theoryTermsHtml(s, isFill ? ans : '')) }]
    }));
  });
  const order = ['会計学（基礎・2級の復習）','会計学（会計基準）','原価計算基準'];
  return cats.sort((a,b)=>order.indexOf(a.group)-order.indexOf(b.group));
}

// チェックした問題の番号を、チャットに貼れる形でコピーする
function copyCheckedIds(){
  const ids = Object.keys(checked).map(Number).sort((a,b)=>a-b);
  if(!ids.length){ alert('チェックした問題はまだありません'); return; }
  const text = `チェック（${ids.length}問）: ${ids.map(i=>'#'+i).join(', ')}`;
  const fallback = () => { window.prompt('次の文字をコピーしてください', text); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert(`${ids.length}問の番号をコピーしました。チャットに貼り付けてください。`)).catch(fallback);
  } else fallback();
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}${acctEnHtml(name)}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}${acctEnHtml(a)}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

(function restoreMarksFromHash(){

  const before = {d:Object.keys(doubled).length, c:Object.keys(checked).length};
  decodeURIComponent(m[1]).split(';').forEach(part => {

  });

  alert(`付け直しました：チェック${Object.keys(checked).length-before.c}問`);
})();
