<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記 仕訳練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      touch-action: manipulation;
    }

    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.liability { background: #C2185B; }
    .dot.expense   { background: #388E3C; }
    .dot.revenue   { background: #0288D1; }
    .dot.equity    { background: #FB8C00; }
    .dot.other     { background: #fff; border: 1.5px solid #9E9E9E; }

    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }

    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #00838F; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }

    .card-body { padding: 20px 18px; }

    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }

    .answer-area { display: none; }
    .answer-area.show { display: block; }

    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tag-amt { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }
    /* 資産：黄色 */
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    /* 負債：ピンク/紫 */
    .tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    /* 費用：緑 */
    .tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    /* 収益：水色 */
    .tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    /* 純資産：オレンジ */
    .tag.equity    { background: #FFF3E0; color: #E65100; border: 1.5px solid #FB8C00; }
    /* その他（評価勘定・損益等）：白 */
    .tag.other     { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    /* 資産のマイナス（減価償却累計額・貸倒引当金等）：白地に資産の黄枠 */
    .tag.other.contra-asset { border: 1.5px solid #F9C400; }

    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }

    .exp-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #F0F7FF;
      border-left: 3px solid #42A5F5;
      border-radius: 4px;
      font-size: 13px;
      color: #1A2B3C;
      line-height: 1.7;
    }
    .exp-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* 表形式の解答 */
    .ans-table-wrap {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .ans-table-wrap table,
    .exp-readonly-ans table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      min-width: 260px;
    }
    .ans-table-wrap th,
    .exp-readonly-ans th {
      background: #1E4D7B;
      color: white;
      padding: 5px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
    }
    .ans-table-wrap td,
    .exp-readonly-ans td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      line-height: 1.5;
    }
    .ans-table-wrap tr:nth-child(even) td,
    .exp-readonly-ans tr:nth-child(even) td { background: #D6EAF8; }
    .ans-table-wrap .total-row td,
    .exp-readonly-ans .total-row td { background: #AED6F1; font-weight: 700; }
    .ans-table-wrap .hl,
    .exp-readonly-ans .hl { background: #FFF9C4 !important; font-weight: 700; }
    .ans-table-wrap .q-blank,
    .exp-readonly-ans .q-blank { background: #FFF3E0 !important; color: #E65100; font-weight: 700; text-align: center; border: 2px dashed #FB8C00 !important; }
    .tbl-sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .formula-box {
      margin: 8px 0;
      padding: 8px 12px;
      background: #E8F5E9;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1B5E20;
      text-align: center;
    }

    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    /* ===== Appendix modal ===== */
    .apx-btn { background:var(--primary); color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .apx-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; padding:0; }
    .apx-overlay.show { display:flex; }
    .apx-modal { background:#fff; width:100%; max-width:none; border-radius:0; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow:hidden; margin:0; }
    .apx-sticky-header { flex-shrink:0; padding:16px 18px 10px; background:#fff; border-bottom:1px solid var(--border); }
    .apx-modal-body { overflow-y:auto; flex:1; padding:10px 18px 20px; -webkit-overflow-scrolling:touch; }
    .apx-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
    .apx-title { font-size:17px; font-weight:800; color:var(--primary); }
    .apx-subtitle { font-size:11px; color:var(--muted); margin-top:2px; }
    .apx-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
    .apx-section { margin-bottom:22px; }
    .apx-section-hd { font-size:13px; font-weight:800; padding:7px 12px; border-radius:8px; margin-bottom:5px; display:flex; align-items:center; gap:8px; }
    .apx-section-hd.asset      { background:#FFF9C4; color:#5D4037; border:1.5px solid #F9C400; }
    .apx-section-hd.liability  { background:#FCE4EC; color:#880E4F; border:1.5px solid #C2185B; }
    .apx-section-hd.expense    { background:#E8F5E9; color:#1B5E20; border:1.5px solid #388E3C; }
    .apx-section-hd.revenue    { background:#E1F5FE; color:#01579B; border:1.5px solid #0288D1; }
    .apx-section-hd.equity     { background:#FFF3E0; color:#E65100; border:1.5px solid #FB8C00; }
    .apx-section-hd.other      { background:#fff; color:#333; border:1.5px solid #9E9E9E; }
    .apx-section-hd.industrial { background:#FFF3E0; color:#BF360C; border:1.5px solid #FF8F00; }
    .apx-section-sub { font-size:11px; color:var(--muted); margin-bottom:6px; padding-left:4px; }
    .apx-row { padding:8px 4px; border-bottom:1px solid var(--border); }
    .apx-row.hidden { display:none; }
    .apx-row-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px; }
    .apx-en { font-size:11px; color:var(--muted); }
    .apx-note { font-size:12px; color:#444; line-height:1.6; }
    .apx-note strong, .gloss-def-en strong { color:#1A2B3C; font-weight:700; }
    .apx-note mark, .gloss-def-en mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    .apx-lv { display:inline-block; font-size:9px; font-weight:700; background:var(--primary); color:#fff; border-radius:4px; padding:1px 5px; }
    .apx-lv.ind { background:#FF8F00; }
    .apx-tabs-wrap { margin-bottom:8px; }
    .apx-tabs-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:5px; }
    .apx-tabs-toggle-arrow { font-size:10px; transition:transform 0.2s; }
    .apx-tabs-wrap.collapsed .apx-tabs-toggle-arrow { transform:rotate(-90deg); }
    .apx-tabs-wrap.collapsed .apx-tabs { display:none; }
    .sec-tabs-wrap { width:100%; }
    .sec-tabs-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .sec-tabs-toggle-arrow { font-size:10px; transition:transform 0.2s; }
    .sec-tabs-wrap.collapsed .sec-tabs-toggle-arrow { transform:rotate(-90deg); }
    .sec-tabs-wrap.collapsed .sec-tabs { display:none; }
    .sec-tabs { display:flex; flex-wrap:wrap; gap:6px; }
    .apx-tabs { display:flex; flex-wrap:wrap; gap:5px; }
    .apx-tab { padding:5px 11px; border:1.5px solid var(--border); border-radius:20px; background:#fff; font-size:12px; cursor:pointer; color:var(--muted); font-weight:600; transition:background 0.15s,color 0.15s,border-color 0.15s; }
    .apx-tab:hover { background:#f5f5f5; }
    .apx-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .apx-hide-btns { display:flex; gap:8px; margin-bottom:0; }
    .apx-hide-btn { flex:1; padding:7px 10px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:12px; cursor:pointer; color:var(--text); font-weight:600; text-align:center; transition:background 0.15s; }
    .apx-hide-btn.active { background:#eee; border-color:#999; }
    #apx-content.ans-hidden .tag { color:transparent !important; background:#e0e0e0 !important; border-color:#bbb !important; user-select:none; min-width:50px; display:inline-block; }
    #apx-content.ans-hidden .apx-en { visibility:hidden; }
    #apx-content.ans-hidden .gloss-term-text { color:transparent !important; background:#e0e0e0 !important; border-radius:3px; user-select:none; }
    #apx-content.ans-hidden .gloss-en { display:none; }
    /* ===== Glossary ===== */
    .gloss-section { margin-bottom:10px; }
    .gloss-hd { font-size:14px; font-weight:800; color:var(--primary); padding:8px 12px; background:var(--primary-light); border-radius:8px; margin:14px 0 6px; }
    .gloss-row { padding:9px 4px; border-bottom:1px solid var(--border); }
    .gloss-term { font-size:13px; font-weight:800; margin-bottom:3px; }
    .gloss-en { font-size:11px; color:var(--muted); }
    .gloss-def { font-size:12px; color:#444; line-height:1.6; }
    .gloss-def strong { color:#1A2B3C; }
    .gloss-def mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    .gloss-def-en { font-size:12px; color:var(--text); line-height:1.6; }
    .apx-note .apx-note-ja { font-size:11px; color:var(--muted); line-height:1.55; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border); }
    .gloss-def .gloss-def-ja { font-size:11px; color:var(--muted); line-height:1.55; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border); }
    /* ===== 表示区分（一問一答） ===== */
    .disp-section { margin-bottom:10px; }
    .disp-row { padding:10px 4px; border-bottom:1px solid var(--border); }
    .disp-no { font-size:10px; color:var(--muted); font-weight:700; }
    .disp-q { font-size:15px; font-weight:800; margin:2px 0 7px; color:#1A2B3C; }
    .disp-ans-line { display:flex; align-items:baseline; gap:7px; margin-bottom:4px; flex-wrap:wrap; }
    .disp-stmt { display:inline-block; font-size:10px; font-weight:800; color:#fff; border-radius:4px; padding:2px 7px; flex-shrink:0; white-space:nowrap; }
    .disp-stmt.pl { background:#1565C0; }
    .disp-stmt.bs { background:#2E7D32; }
    .disp-stmt.cost { background:#E65100; }
    .disp-stmt.none { background:#757575; }
    .disp-cat { font-size:13px; font-weight:700; color:#1A2B3C; }
    .disp-dispname { font-size:11px; color:var(--muted); margin:4px 0 0; }
    .disp-reason { font-size:12px; color:#444; line-height:1.6; margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); }
    #apx-content.ans-hidden .disp-ans-wrap { display:none; }

    /* ===== 勘定科目一覧 TTS ===== */
    .apx-tts-ctrl { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
    .apx-tts-ctrl label { font-weight:600; }
    .apx-tts-rate-sel { font-size:12px; padding:3px 6px; border-radius:8px; border:1.5px solid var(--border); background:#fff; color:var(--fg); cursor:pointer; }
    .apx-tts-btns { display:inline-flex; gap:4px; margin-left:4px; vertical-align:middle; }
    .apx-tts-btn { font-size:11px; padding:2px 7px; border-radius:10px; border:1.5px solid var(--border); background:#fff; color:var(--primary); cursor:pointer; font-weight:700; line-height:1.4; transition:background 0.12s; }
    .apx-tts-btn:hover { background:var(--primary); color:#fff; }
    .apx-tts-btn.en { color:#1565C0; border-color:#90CAF9; }
    .apx-tts-btn.en:hover { background:#1565C0; color:#fff; }
    .apx-tts-btn.both { color:#7B3F00; border-color:#D2A679; }
    .apx-tts-btn.both:hover { background:#7B3F00; color:#fff; }
    .apx-play-all-btn { font-size:11px; padding:2px 9px; }
    .apx-stop-btn { color:#B71C1C; border-color:#EF9A9A; }
    .apx-stop-btn:hover { background:#B71C1C; color:#fff; }
    .apx-voice-row { display:inline-flex; align-items:center; gap:4px; }
    .apx-voice-sel { max-width:160px; }
    /* ===== スクロールモード ===== */
    .exp-panel { display:block; max-width:640px; margin:0 auto; padding:14px 14px; }
    .exp-q-card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px; border:1.5px solid var(--border); font-size:14px; line-height:2.0; font-weight:500; }
    .exp-q-card br+br { display:block; content:''; margin-top:4px; }
    .exp-q-card mark { color:inherit; padding:0 2px; border-radius:2px; }
    .exp-q-card mark.q-asset { background:#FCF569; }
    .exp-q-card mark.q-liability { background:#FE8980; }
    .exp-q-card mark.q-revenue { background:#8FE0FB; }
    .exp-q-card mark.q-expense { background:#95D15F; }
    .exp-q-card mark.q-equity { background:#FDC475; }
    .exp-q-card mark.q-other { background:#C6CDD3; }
    .q-en-trans { margin-top:8px; font-size:12px; color:var(--text-sub,#666); font-weight:400; border-top:1px solid var(--border); padding-top:6px; font-style:italic; }
    .q-paren { color:#9AA0A6; font-weight:400; }
    .exp-swipe-wrap { position:relative; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .exp-swipe-card {
      width:160px; background:#fff; border-radius:14px; border:2.5px solid var(--border);
      padding:14px; text-align:center; font-size:15px; font-weight:800;

</head>

   '製品の<strong>主な材料（主要材料）</strong>で、製品の本体を構成する材料です。鉄・木材・プラスチックペレットなどが典型例です。「材料」科目に含まれることもありますが、素材として独立計上する場合もあります。','材料・在庫',
    'The primary (direct) materials forming the body of the product: steel, timber, plastic pellets, etc. When consumed, transferred directly to Work in Process as Direct Materials cost.'],
  ['買入部品','Purchased Components',
   '外部から買ってそのまま組み込む完成部品です。<strong>自社で加工しない</strong>という点で素材（原材料）と区別されます。自動車のエンジン・液晶パネルなど。消費時は直接材料費として仕掛品に振り替えます。','材料・在庫',
    'Completed parts bought from outside suppliers and assembled into the product without further processing. Classified as direct materials; transferred to Work in Process when used.'],
  ['補助材料','Indirect Materials',
   '製品の一部にはなるが、<mark>主要材料ほど多くは使わない材料</mark>です。塗料・接着剤・ネジなどが該当します。製造間接費として処理することが多く、個別に製品に割り当てにくいという特徴があります。','材料・在庫',
    'Materials that become part of the product but are minor in quantity or value: paint, adhesive, screws, etc. Usually charged to Manufacturing Overhead because they cannot be easily traced to individual products.'],
  ['工場消耗品','Factory Supplies',
   '工場で使う<strong>消耗品（製品にはならないもの）</strong>です。潤滑油・砥石・清掃用品・安全用品など。製造間接費に分類され、製品の製造に間接的に必要な消耗品です。','材料・在庫',
    'Consumables used in the factory that do not become part of the product: lubricants, grinding wheels, cleaning supplies, safety gear. Classified as Manufacturing Overhead.'],
  ['消耗工具器具備品','Consumable Tools',
   '比較的早く使い捨てになる工具・器具・備品（ドリル刃・計測器・作業台など）を記録します。耐久性は低いため固定資産ではなく<mark>流動資産</mark>として扱い、使用時に製造間接費へ振り替えます。','材料・在庫',
    'Relatively short-lived tools, instruments, and fixtures (drill bits, gauges, work tables) that wear out quickly. Treated as current assets (not fixed assets); transferred to Manufacturing Overhead when used.'],
  ['仕掛品','Work in Process',
   '製造の途中にある<strong>半完成品（製造中の製品）</strong>の原価を記録する科目です。材料費・労務費・製造間接費を集計していき、完成したときに「製品（資産）」に振り替えます。原価計算の中心となる重要な科目です。','材料・在庫',
    'The accumulated cost (direct materials + direct labor + manufacturing overhead) of products currently in production. Transferred to Finished Goods when manufacturing is complete. The central account in cost accounting.'],
  ['半製品','Semi-finished Goods',
   '製造の途中で<strong>いったん倉庫に入れた中間製品</strong>で、そのまま外部に販売もできる状態のものです。仕掛品（完成前）と製品（最終完成品）の中間に位置します。一部の製造業に特有の科目です。','材料・在庫',
    'Partially completed products temporarily stored in a warehouse that can also be sold externally in their current state. Intermediate between Work in Process (internal only) and Finished Goods (fully complete).'],
  ['製品','Finished Goods',
   '製造が完成した販売可能な<mark>完成品</mark>を記録する科目です。「仕掛品」から完成品になったタイミングで「製品（資産）」に振り替え、販売されたとき「売上原価（費用）」に振り替えます。商業簿記の「繰越商品」に相当します。','材料・在庫',
    'Completed products ready for sale. Transferred from Work in Process upon completion; expensed to Cost of Goods Sold when sold. The manufacturing equivalent of Merchandise Inventory in trading companies.'],
  ['副産物','By-products',
   '主製品を製造する過程で<strong>偶然に生じる別の製品</strong>です。ビール醸造の麦かす・木材加工時のおが屑など。売却可能なため資産として評価しますが、評価額は低廉に抑え、その分主製品の原価を下げる処理をします。','材料・在庫',
    'Secondary products arising incidentally during manufacture of the main product: brewery grain waste, sawdust from lumber processing, etc. Valued at a low net realizable value; reduces the main product\'s cost.'],
  ['作業くず','Scrap',
   '製造中に出る端材・切り屑・廃棄物など<mark>価値の低い残材</mark>です。売却できる場合は評価額を資産計上し、主製品原価から控除します。鉄くず・木くず・金属片などが典型例です。','材料・在庫',
    'Low-value waste and off-cuts from manufacturing: metal shavings, wood scraps, etc. If salable, estimated value is recorded as an asset and deducted from main product cost.'],
  // --- 労務費 ---
  ['賃金','Wages',
   '工場の<strong>直接工員（製品を直接作る作業者）</strong>に支払う給料（時間給・出来高給）を記録する費用です。商業簿記の「給料」に相当しますが、工業簿記では<mark>製品の製造に直接かかる賃金</mark>として仕掛品原価に集計します。','労務費',
    'Pay for direct production workers (time wages or piece-rate wages). The manufacturing equivalent of Salaries. Labor directly traceable to products is accumulated in Work in Process.'],
  ['雑給','Miscellaneous Wages',
   '直接工員以外の補助的な作業者（間接工・パート・臨時工など）の給与を記録します。<strong>製造間接費として処理</strong>され、製品への直接割り当てではなく、配賦基準（作業時間など）で各製品に間接的に配分します。','労務費',
    'Wages for indirect workers (supervisors, maintenance staff, part-time workers). Classified as Manufacturing Overhead and allocated to products using an allocation base (e.g., machine hours).'],
  ['従業員賞与手当','Employee Bonuses and Allowances',
   '工場の従業員に支払う賞与・各種手当（残業手当・通勤手当・家族手当など）を記録します。<mark>直接工員分は直接労務費、間接工員分は製造間接費</mark>として処理します。','労務費',
    'Bonuses and allowances (overtime, commuting, family) paid to factory workers. Direct workers\' amounts are Direct Labor; indirect workers\' amounts go to Manufacturing Overhead.'],
  // --- 製造間接費 ---
  ['製造間接費','Manufacturing Overhead',
   '特定の製品に直接割り当てられない<strong>工場全体にかかる費用</strong>を一時的にまとめる科目です。間接材料費・間接労務費・工場の家賃・電力代・減価償却費などが含まれます。期末に<mark>配賦基準（機械時間・直接労務時間など）</mark>で各製品に配分（配賦）します。','製造間接費',
    'A temporary collection account for all indirect factory costs that cannot be directly traced to individual products: indirect materials, indirect labor, factory rent, utilities, depreciation, etc. Allocated to products using an allocation base.'],
  ['外注加工費','Subcontract Costs',
   '自社工場で加工できない工程を<strong>外部の会社に委託（外注）</strong>した加工費用です。直接外注できる場合は直接費として仕掛品に計上し、間接的な場合は製造間接費に含めます。','製造間接費',
    'Fees paid to outside contractors for manufacturing processes the company cannot perform in-house. Treated as direct costs if traceable to a specific job; otherwise included in Manufacturing Overhead.'],
  // --- 原価差異 ---
  ['材料消費価格差異','Material Price Variance',
   '標準原価計算で、<strong>材料の実際購入価格と標準価格の差額</strong>に消費数量をかけたものです。実際価格が標準より高ければ「不利差異（借方）」、低ければ「有利差異（貸方）」となります。<mark>原材料の価格変動や購買効率</mark>を測る指標です。','原価差異',
    'In standard costing, the difference between actual purchase price and standard price, multiplied by actual quantity consumed. Unfavorable (debit) if actual > standard; favorable (credit) if actual < standard. Measures purchasing efficiency.'],
  ['材料消費数量差異','Material Quantity Variance',
   '標準原価計算で、<strong>材料の実際消費量と標準消費量の差額</strong>に標準価格をかけたものです。実際消費量が多ければ不利差異（無駄遣い）、少なければ有利差異（節約）を示します。<mark>製造現場の材料使用効率</mark>を表します。','原価差異',
    'In standard costing, the difference between actual quantity consumed and standard quantity allowed for actual output, multiplied by the standard price. Measures how efficiently materials were used in production.'],
  ['賃率差異','Wage Rate Variance',
   '標準原価計算で、<strong>実際賃率と標準賃率の差額</strong>に実際作業時間をかけたものです。予想より高い賃率で雇用した場合に不利差異が生じます。<mark>人件費のコントロール</mark>を管理する指標です。','原価差異',
    'In standard costing, the difference between the actual wage rate and the standard rate, multiplied by actual hours worked. An unfavorable variance indicates labor was paid at a higher rate than budgeted.'],
  ['作業時間差異','Labor Efficiency Variance',
   '標準原価計算で、<strong>実際作業時間と標準作業時間の差額</strong>に標準賃率をかけたものです。実際作業時間が多いほど不利差異（非効率）となります。<mark>作業員の生産性・作業効率</mark>を測る指標です。','原価差異',
    'In standard costing, the difference between actual hours worked and standard hours allowed for actual output, multiplied by the standard rate. Measures worker productivity — more hours than standard = unfavorable.'],
  ['製造間接費予算差異','MOH Budget Variance',
   '標準原価計算で、<strong>製造間接費の実際発生額と予算額の差額</strong>です（固定費部分は予算額、変動費部分は実際操業度に対応する予算額と比較）。コスト管理上の<mark>無駄遣いや節約</mark>を示します。','原価差異',
    'In standard costing, the difference between actual overhead incurred and the budgeted overhead for the actual level of activity. Indicates whether overhead spending was controlled within budget.'],
  ['製造間接費能率差異','MOH Efficiency Variance',
   '標準原価計算で、<strong>実際操業度と標準操業度の差額</strong>に変動費率（または標準配賦率）をかけたものです。作業効率の良し悪しが製造間接費に与えた影響を示します。<mark>作業時間差異の製造間接費版</mark>です。','原価差異',
    'In standard costing, the overhead impact of working more or fewer hours than the standard hours allowed for actual output. The manufacturing overhead analog of the Labor Efficiency Variance.'],
  ['製造間接費操業度差異','MOH Volume Variance',
   '標準原価計算で、<strong>実際操業度と基準操業度の差額</strong>に固定費率をかけたものです。工場を十分に稼働させているかどうか（遊休設備の有無）を示す差異です。<mark>操業度が低いと不利差異</mark>（固定費の回収不足）となります。','原価差異',
    'In standard costing, the difference between actual activity level and normal (standard) capacity, multiplied by the fixed overhead rate. Indicates whether fixed overhead was fully absorbed — low activity leads to an unfavorable (under-absorbed) variance.'],
  // --- 本社・工場 ---
  ['本社','Head Office (Factory Books)',
   '工場が独立した帳簿を持つ「<strong>本社工場会計</strong>」において、工場の帳簿に記録する科目です。本社から送られてきた材料費・経費などを「本社」勘定で受け取ります。本社の「工場」勘定と対応関係にあります。','本社・工場',
    'In head-office/factory accounting (where the factory keeps separate books), the account on the factory\'s books for resources received from the head office. The mirror of the \'Factory\' account on the head office\'s books.'],
  ['工場','Factory (Head Office Books)',
   '本社工場会計において、<strong>本社の帳簿に記録する科目</strong>です。工場に送った材料費・経費・設備費などを「工場」勘定で処理します。工場の「本社」勘定と対応し、合算すると消去される内部勘定です。','本社・工場',
    'In head-office/factory accounting, the account on the head office\'s books for resources sent to the factory. The mirror of the \'Head Office\' account on the factory\'s books. Both accounts are eliminated when combining statements.'],
  ['月次損益','Monthly Profit and Loss',
   '本社工場会計で、工場が当月に計上した<mark>損益（製品原価に含まれる損益）</mark>を本社に報告するために使う科目です。月末に工場の損益を本社に振り替える仕訳で使用します。','本社・工場',
    'In head-office/factory accounting, the account the factory uses to report its monthly profit or loss (product cost result) to the head office. Used at month-end when the factory transfers its cost results to the head office.'],
];

// ===== 用語解説集データ =====
const GLOSSARY_DATA = [
  { category:'① 簿記の基本', items:[
    { term:'借方', en:'Debit (Dr.)', def:'<strong>仕訳の左側</strong>を「借方」といいます。<mark>資産の増加・費用の発生・負債の減少・純資産の減少</mark>を記録します。例：現金100円を受け取った→借方に「現金100」と書く。「左＝借方」と体で覚えましょう。', def_en:'The <strong>left side</strong> of a journal entry. Record here when assets increase, expenses occur, liabilities decrease, or equity decreases. Example: receiving ¥100 cash → write "Cash 100" on the debit (left) side.' },
    { term:'貸方', en:'Credit (Cr.)', def:'<strong>仕訳の右側</strong>を「貸方」といいます。<mark>負債の増加・収益の発生・資産の減少・純資産の増加</mark>を記録します。例：商品100円を売った→貸方に「売上100」と書く。「右＝貸方」と覚えましょう。', def_en:'The <strong>right side</strong> of a journal entry. Record here when liabilities increase, revenues occur, assets decrease, or equity increases. Example: selling goods for ¥100 → write "Sales 100" on the credit (right) side.' },
    { term:'仕訳', en:'Journal Entry', def:'取引が起きたときに<strong>借方（左）と貸方（右）に分けて記録する基本作業</strong>です。必ず「借方合計＝貸方合計」になります。例：商品を現金100円で仕入れた→（借）仕入100 ／（貸）現金100。', def_en:'The fundamental recording step: split every transaction into a <strong>debit (left)</strong> and a <strong>credit (right)</strong>. Totals must always balance. Example: buying goods for ¥100 cash → Dr. Purchases 100 / Cr. Cash 100.' },
    { term:'複式簿記', en:'Double-entry Bookkeeping', def:'すべての取引を<strong>必ず2科目以上の借方・貸方で記録</strong>する仕組みです。「借方合計＝貸方合計」が常に成立するため、記録ミスを自動検出できます。現金の出入りだけ記録する「単式簿記」と対比して覚えましょう。', def_en:'A system where <strong>every transaction is recorded in at least two accounts</strong> (debit and credit). Because every debit must equal every credit, errors are automatically detectable — unlike single-entry bookkeeping which only tracks cash flows.' },
    { term:'勘定科目', en:'Account Title', def:'取引の内容を表す<mark>標準的な分類名称</mark>です。現金・売掛金・借入金・売上など、決まった名前を使います。例：「お金を払った」→「現金」「普通預金」など具体的な科目名で記録します。試験では正確な科目名が必須です。', def_en:'<mark>Standardized labels</mark> used to classify transactions — Cash, Accounts Receivable, Loans Payable, Sales Revenue, etc. Example: "paid money" must be recorded as a specific account title like "Cash" or "Bank Deposits." Exact names are required on exams.' },
    { term:'勘定', en:'Account', def:'勘定科目ごとの「残高管理ページ」です。T字型（Tフォーム）で、左が借方・右が貸方。差額が現在の残高です。例：現金勘定の借方合計500・貸方合計200なら現金残高は300円。', def_en:'A T-shaped ledger page for each account. Left = debits, Right = credits; the difference is the current balance. Example: if Cash has ¥500 in debits and ¥200 in credits, the Cash balance is ¥300.' },
    { term:'転記', en:'Posting', def:'仕訳帳に書いた仕訳を<strong>勘定科目ごとの元帳（総勘定元帳）に書き写す作業</strong>です。仕訳帳→元帳の順が記帳の基本の流れです。転記ミスは試算表の不一致として発見できます。', def_en:'<strong>Copying journal entries into the individual account pages</strong> of the general ledger. The flow is: journal → ledger. Posting errors show up as imbalances in the trial balance.' },
    { term:'会計期間', en:'Accounting Period', def:'財務諸表を作る区切りの期間で、<mark>通常1年間（例：4月1日〜翌3月31日）</mark>です。期間の始まりを「期首」、終わりを「期末（決算日）」といいます。日本の多くの会社は3月31日が期末です。', def_en:'The time span covered by financial statements — <mark>usually one fiscal year</mark> (e.g., April 1 – March 31). The start is the "beginning of period" and the end is the "fiscal year-end." Most Japanese companies end their fiscal year on March 31.' },
    { term:'貸借平均の原則', en:'Principle of Debit-Credit Balance', def:'<strong>すべての仕訳で借方合計＝貸方合計が必ず成立する</strong>というルールです。試算表の借方・貸方合計が一致するのもこの原則があるためです。合計がずれたら転記ミスを疑いましょう。', def_en:'The rule that <strong>total debits always equal total credits</strong> in every journal entry. This is why the debit and credit columns of a trial balance must match — if they don\'t, there\'s a recording error.' },
  ]},
  { category:'② 帳簿の種類', items:[
    { term:'仕訳帳', en:'Journal', def:'取引が発生した順番に<strong>時系列で仕訳を記録する主要帳簿</strong>です。「日記帳」のイメージで、すべての取引はまずここに記録されてから元帳へ転記されます。', def_en:'The primary book that records journal entries in <strong>chronological order</strong> — think of it as a diary of all transactions. Every transaction is first entered here, then posted to the general ledger.' },
    { term:'総勘定元帳', en:'General Ledger', def:'<strong>勘定科目ごとに取引を集計した主要帳簿</strong>です。現金の元帳には現金の増減だけが集まり、残高を見れば今の現金残高がすぐわかります。仕訳帳と並ぶ2大主要帳簿です。', def_en:'The primary book that <strong>summarizes transactions by account title</strong>. The Cash account page shows only cash movements; the balance tells you exactly how much cash you have. It\'s one of the two core accounting books (with the journal).' },
    { term:'補助元帳', en:'Subsidiary Ledger', def:'売掛金・買掛金などを<strong>取引先ごとに細かく管理する補助帳簿</strong>です。例：「A社への売掛金はいくら？」を把握するために使います。得意先元帳・仕入先元帳が代表例です。', def_en:'A <strong>detailed subsidiary book</strong> that breaks down accounts like Accounts Receivable or Payable by individual customer or supplier. Example: "How much does Company A owe us?" — you look it up in the accounts receivable subsidiary ledger.' },
    { term:'現金出納帳', en:'Cash Book', def:'現金の入出金を日付順に記録する補助帳簿です。帳簿の残高と<strong>実際の手元現金が毎日一致しているか確認</strong>するために使います。差があればレジ違いや紛失を疑います。', def_en:'A subsidiary book recording cash receipts and payments in date order. Used to verify that the book balance <strong>matches the actual cash on hand every day</strong>. Any discrepancy signals a register error or missing cash.' },
    { term:'小口現金出納帳', en:'Petty Cash Book', def:'小口現金係が日々の小払い（切手代・交通費など）を記録する帳簿です。<strong>費目別（交通費・消耗品費など）に集計</strong>し、定期的に経理へ報告して補充を受けます。', def_en:'Records day-to-day small payments (postage, transit fares, etc.) handled by a petty cash custodian. Expenses are <strong>tracked by category</strong> (travel, supplies, etc.) and periodically reported to accounting for reimbursement.' },
    { term:'商品有高帳', en:'Inventory Record', def:'商品の入庫・出庫・残高を<strong>数量と単価で管理する補助帳簿</strong>です。先入先出法や移動平均法で単価を計算し、いつでも在庫の数量と金額がわかります。', def_en:'Tracks inventory movements (in/out/balance) by <strong>quantity and unit cost</strong>. Using FIFO or moving-average methods, it tells you the exact quantity and value of stock at any time.' },
    { term:'受取手形記入帳', en:'Notes Receivable Book', def:'受け取った手形を<strong>振出人・金額・満期日ごとに管理</strong>する補助帳簿です。満期になったら取り立て、割引・裏書した場合もここで追跡します。', def_en:'Manages received promissory notes by <strong>issuer, amount, and maturity date</strong>. Used to track when to collect, and to record endorsements or discounting of notes.' },
    { term:'支払手形記入帳', en:'Notes Payable Book', def:'自社が振り出した手形を<strong>受取人・金額・満期日ごとに管理</strong>する補助帳簿です。満期日を過ぎると不渡りになるため、期日管理が最重要です。', def_en:'Manages notes payable (promissory notes issued by your company) by <strong>payee, amount, and due date</strong>. Due-date management is critical — missing a payment date causes a dishonored note.' },
    { term:'仕訳日計表', en:'Daily Summary Journal', def:'1日分の伝票（入金・出金・振替）を<strong>科目ごとに集計して1枚にまとめた表</strong>です。これを使うことで毎日の転記作業を効率化できます。多拠点・大量取引の会社向けです。', def_en:'A <strong>daily summary</strong> that totals all vouchers (receipts, payments, transfers) by account for one day. It streamlines posting to the ledger and is used by companies with high transaction volumes or multiple locations.' },
  ]},
  { category:'③ 財務諸表', items:[
    { term:'貸借対照表', en:'Balance Sheet (B/S)', def:'<mark>決算日時点</mark>での財産状態を写真のように切り取った表です。左に資産、右に負債＋純資産が並び、<strong>「資産＝負債＋純資産」</strong>が常に成立します。「今この会社にいくら財産があり、いくら借金があるか」がわかります。', def_en:'A <strong>snapshot of financial position</strong> on the balance sheet date. Assets on the left; liabilities + equity on the right. The equation <strong>Assets = Liabilities + Equity</strong> always holds. It answers: "What does the company own, and how much does it owe?"' },
    { term:'損益計算書', en:'Income Statement (P/L)', def:'<mark>1年間（会計期間）</mark>の収益・費用・利益を動画のように記録した表です。「売上－コスト＝いくら儲けたか」を段階的に計算します。会社の稼ぎ力を判断する最重要書類の一つです。', def_en:'A <strong>record of revenues, expenses, and profit</strong> over an accounting period (usually one year). It progressively calculates profit: "Sales minus costs = how much the company earned." One of the most important financial statements for judging profitability.' },
    { term:'株主資本等変動計算書', en:'Statement of Changes in Equity', def:'純資産の各項目（資本金・繰越利益剰余金など）が<strong>1年間でどう増減したかを記録した表</strong>です。配当で純資産が減った・利益で増えた、などの変動をすべて追跡できます。2級必須書類です。', def_en:'Shows <strong>how each component of equity changed during the year</strong> (capital stock, retained earnings, etc.). It tracks every change — profits added, dividends paid, new shares issued. Required knowledge for the Level 2 exam.' },
    { term:'売上総利益', en:'Gross Profit', def:'<strong>売上高から売上原価（商品の仕入コスト）を引いた最初の利益</strong>です。「粗利」とも呼ばれます。例：商品を1,000円で売り、仕入コストが600円なら粗利は400円。この400円でさらに人件費などを賄います。', def_en:'The <strong>first-level profit: Sales minus Cost of Goods Sold</strong>. Also called "gross margin." Example: sell goods for ¥1,000, bought for ¥600 → gross profit is ¥400. This ¥400 then covers operating expenses like salaries.' },
    { term:'営業利益', en:'Operating Profit', def:'売上総利益から<strong>販売費・一般管理費（人件費・広告費・家賃など）を引いた本業の利益</strong>です。「本業でどれだけ稼げているか」を示す最も重要な利益指標です。', def_en:'<strong>Gross profit minus operating expenses</strong> (salaries, advertising, rent, etc.). This shows "how much the core business earns" — the most important profitability metric.' },
    { term:'経常利益', en:'Ordinary Profit', def:'営業利益に<strong>受取利息・受取配当などの営業外収益を加え、支払利息などの営業外費用を差し引いた利益</strong>です。本業＋財務活動を合わせた「通常の企業活動全体」の利益です。', def_en:'<strong>Operating profit plus non-operating income (interest received, dividends) minus non-operating expenses (interest paid)</strong>. Represents the profit from all <em>ordinary</em> business activities, including financial management.' },
    { term:'税引前当期純利益', en:'Income Before Tax', def:'経常利益に<strong>特別利益（固定資産売却益など）を加え、特別損失（災害損失など）を引いた利益</strong>です。臨時・異常な損益も含めた最終計算で、ここから法人税を引きます。', def_en:'<strong>Ordinary profit adjusted for extraordinary items</strong> (e.g., gains from asset sales, losses from disasters). Includes all one-time or unusual items. Corporate taxes are then subtracted to arrive at net income.' },
    { term:'当期純利益', en:'Net Income', def:'税引前当期純利益から<strong>法人税等を差し引いた「最終的な手残り利益」</strong>です。この金額が貸借対照表の繰越利益剰余金に加算されます。マイナスの場合を「当期純損失」といいます。', def_en:'The <strong>final "bottom line" profit after subtracting corporate taxes</strong> from income before tax. This amount is added to retained earnings on the balance sheet. If negative, it is called a "net loss."' },
  ]},
  { category:'④ 試算表・精算表', items:[
    { term:'試算表', en:'Trial Balance', def:'すべての勘定科目の残高を一覧にして<strong>借方合計＝貸方合計かを確認する表</strong>です。一致していれば転記ミスはないと判断できます（ただし2科目を逆に転記した「逆仕訳ミス」などは発見できません）。', def_en:'A list of all account balances used to <strong>verify that total debits equal total credits</strong>. If balanced, no posting errors exist — though some mistakes (like reversed entries across two accounts) won\'t be caught.' },
    { term:'合計試算表', en:'Sum Trial Balance', def:'各勘定の<strong>借方合計と貸方合計をそのまま並べた試算表</strong>です。仕訳量の確認には使えますが、残高はひと目ではわかりません。', def_en:'Lists the <strong>total debits and total credits</strong> for each account side by side. Useful for checking transaction volumes, but you can\'t easily see the current balance of each account.' },
    { term:'残高試算表', en:'Balance Trial Balance', def:'各勘定の<strong>差引残高（借方超か貸方超かの差額）だけを並べた試算表</strong>です。各科目の今の残高がひと目でわかるため、決算作業に最もよく使われます。', def_en:'Lists only the <strong>net balance (debit minus credit) of each account</strong>. The current balance of every account is immediately visible, making it the most practical format for preparing financial statements.' },
    { term:'合計残高試算表', en:'Sum-Balance Trial Balance', def:'合計試算表と残高試算表を合体した表で、<strong>合計額と残高の両方を一覧できる</strong>最も情報量の多い試算表です。作成に手間がかかりますが試験で最もよく出題されます。', def_en:'Combines both formats: shows <strong>total debits/credits AND the net balance</strong> for every account. The most information-rich format, and the most frequently tested on the bookkeeping exam.' },
    { term:'精算表', en:'Worksheet', def:'試算表・決算整理仕訳・損益計算書・貸借対照表を<strong>一枚の大きな表にまとめた作業用シート</strong>です。6桁（試算表＋整理記入＋BS/PL）が基本です。決算書作成の途中過程を整理するための表です。', def_en:'A large <strong>working spreadsheet</strong> that combines the trial balance, adjusting entries, income statement, and balance sheet in one place (typically 6 or 8 columns). It organizes the steps from trial balance to finished financial statements.' },
  ]},
  { category:'⑤ 商品売買・在庫', items:[
    { term:'三分法', en:'Three-Account Method', def:'商品売買を<strong>仕入（費用）・売上（収益）・繰越商品（資産）の3科目</strong>で記録する最もポピュラーな方法です。仕入時→（借）仕入、売上時→（貸）売上と記録し、期末に「しくりくりし」で売上原価を計算します。', def_en:'The most common inventory method, using <strong>three accounts: Purchases (expense), Sales (revenue), and Merchandise Inventory (asset)</strong>. Record "Purchases" when buying, "Sales" when selling, then do the period-end inventory adjustment.' },
    { term:'分記法', en:'Separate Method', def:'商品を売るたびに<strong>商品原価の減少と利益の両方を同時に記録</strong>する方法です。「商品（資産）を減らして、その差額を商品売買益（収益）に計上」します。リアルタイムで利益がわかりますが仕訳が複雑です。', def_en:'Records <strong>both the reduction in inventory cost and the profit margin simultaneously at each sale</strong>. "Reduce the Merchandise asset, and record the gain as Merchandise Sales Profit." Profit is visible in real time, but entries are more complex.' },
    { term:'売上原価対立法', en:'Cost of Sales Method', def:'売り上げた時点で売上と同時に<strong>売上原価（費用）と商品（資産）の減少も一緒に仕訳</strong>する方法です。三分法の期末調整が不要で、売上原価がリアルタイムでわかります。', def_en:'At the point of sale, records <strong>both the revenue AND the cost of goods sold simultaneously</strong>. No period-end adjustment needed. Cost of goods sold is always up to date — unlike the three-account method.' },
    { term:'しくりくりし', en:'Inventory Adjustment (Period-end)', def:'三分法の期末に行う2つの決算整理仕訳の語呂合わせです。①<strong>（借）仕入／（貸）繰越商品</strong>：期首在庫を仕入に加算。②<strong>（借）繰越商品／（貸）仕入</strong>：期末在庫を仕入から控除。この2仕訳で売上原価が確定します。', def_en:'A mnemonic for the two period-end adjusting entries in the three-account method: ① Dr. Purchases / Cr. Merchandise Inventory — add beginning inventory to purchases; ② Dr. Merchandise Inventory / Cr. Purchases — subtract ending inventory. These two entries calculate the exact cost of goods sold.' },
    { term:'棚卸', en:'Inventory Count', def:'期末に倉庫の商品を実際に数えて帳簿と照合する作業です。帳簿残高より実際が少なければ差額を<strong>棚卸減耗損（費用）</strong>として計上します。年に1回（決算時）行うのが一般的です。', def_en:'Physically counting warehouse stock at period-end to verify it matches the book balance. If actual count is less than the book balance, the difference is recorded as <strong>Inventory Shrinkage Loss (expense)</strong>. Typically done once a year at fiscal year-end.' },
    { term:'先入先出法', en:'FIFO (First-In, First-Out)', def:'先に仕入れた商品から先に売れたと<strong>仮定して払出単価を計算</strong>する方法です。例：100円で買った在庫があるとき、追加で110円で仕入れた場合、次に売れたのは100円の分とみなします。', def_en:'Assumes that the <strong>oldest inventory is sold first</strong>. Example: if you have stock at ¥100 and then buy more at ¥110, the next item sold is costed at ¥100. During inflation, this results in higher reported profits.' },
    { term:'移動平均法', en:'Moving Average Method', def:'仕入のたびに<strong>「（既存在庫金額＋今回仕入金額）÷（既存数量＋今回数量）」で新しい平均単価を計算</strong>し直す方法です。売るたびにその時点の平均単価で原価を計算します。', def_en:'Recalculates the <strong>weighted average unit cost after every purchase</strong>: (existing inventory cost + new purchase cost) ÷ (existing units + new units). Each sale is costed at the current average.' },
    { term:'低価法', en:'Lower of Cost or Market', def:'在庫を<strong>「原価と正味売却価額（時価）のうち低い方」で評価する保守的な方法</strong>です。例：原価1,000円の商品が時価800円に下落→800円で評価し、差額200円を商品評価損（費用）として計上します。', def_en:'Values inventory at the <strong>lower of original cost or net realizable value (market price)</strong>. Example: goods cost ¥1,000 but market price drops to ¥800 → record at ¥800, and recognize ¥200 as Inventory Write-down Loss. Prevents overstating assets.' },
    { term:'棚卸減耗損', en:'Inventory Shrinkage Loss', def:'実際在庫数量が帳簿より少ない場合の差額損失です。原因は<strong>盗難・紛失・腐敗・破損</strong>など。正常範囲の減耗は売上原価に算入し、異常に大きい場合は特別損失として処理します。', def_en:'The loss from actual inventory being less than the book quantity. Causes include <strong>theft, loss, spoilage, or damage</strong>. Normal shrinkage is included in cost of goods sold; abnormal amounts are treated as an extraordinary loss.' },
    { term:'売上原価', en:'Cost of Goods Sold', def:'「<strong>期首繰越商品＋当期仕入高－期末繰越商品</strong>」で計算する、販売した商品の仕入コスト合計です。売上高からこれを差し引くと売上総利益（粗利）になります。', def_en:'The total cost of goods actually sold: <strong>Beginning Inventory + Purchases − Ending Inventory</strong>. Subtracting this from Sales Revenue gives Gross Profit.' },
  ]},
  { category:'⑥ 手形・電子記録', items:[
    { term:'約束手形', en:'Promissory Note', def:'「○月○日に○円払います」という<strong>支払い約束を記した証書</strong>です。振り出した会社→支払手形（負債）、受け取った会社→受取手形（資産）で記録します。約束した期日に銀行を通じて決済されます。', def_en:'A written promise to pay a specific amount on a specified date. The <strong>issuer records Notes Payable (liability); the recipient records Notes Receivable (asset)</strong>. Payment is settled through the bank on the due date.' },
    { term:'為替手形', en:'Bill of Exchange', def:'振出人が第三者（引受人）に「受取人へ○円払え」と命令する<strong>3者間の手形</strong>です。①振出人②引受人③受取人の3者が登場し、約束手形より複雑です。引受人が支払いを承諾することで成立します。', def_en:'A three-party instrument where the <strong>drawer orders a third party (the drawee/acceptor) to pay the payee</strong>. Three parties: ① drawer ② acceptor ③ payee. More complex than a promissory note; becomes binding when the drawee accepts it.' },
    { term:'手形の裏書譲渡', en:'Endorsement Transfer', def:'受け取った手形を<strong>別の支払いに使うために第三者へ渡すこと</strong>です。手形の裏面に署名（裏書）して渡します。裏書した側には「万が一決済されなければ代わりに払う」という遡及債務が残ります。', def_en:'<strong>Transferring a received note to a third party as payment</strong> by signing the back of the note. The endorser retains a contingent liability — if the original issuer defaults, the endorser must pay.' },
    { term:'手形の割引', en:'Discounting Notes', def:'受取手形を<strong>満期前に銀行へ持ち込んで現金化すること</strong>です。残存日数分の利息（手形売却損）が差し引かれます。資金繰りが急に必要なときに利用します。', def_en:'<strong>Cashing a note receivable at a bank before its due date</strong>. The bank deducts interest for the remaining days (recorded as Notes Discounting Loss). Used when immediate cash is needed before the note matures.' },
    { term:'不渡り', en:'Dishonor', def:'手形の期日に銀行へ呈示したが<strong>振出人の口座残高不足等で決済されなかった</strong>状態です。受取側は「受取手形→不渡手形」に振り替えます。同一企業が6か月以内に2回不渡りを出すと銀行取引停止（事実上倒産）になります。', def_en:'When a note is presented to the bank on its due date but <strong>payment fails due to insufficient funds</strong>. The holder reclassifies the note from "Notes Receivable" to "Dishonored Notes." Two dishonors within six months results in bank account suspension — effectively bankruptcy.' },
    { term:'電子記録債権・債務', en:'Electronic Receivables/Payables', def:'「でんさいネット」（電子債権記録機関）に登録する<strong>デジタル版の手形</strong>です。手形と同じ機能で紙がなく、紛失・盗難ゼロ、分割譲渡も可能です。近年急速に普及しています。', def_en:'A <strong>digital equivalent of promissory notes</strong>, registered with Japan\'s electronic credit platform (Densai Net). Same function as paper notes but no physical document — eliminating loss/theft risk and enabling partial transfers. Growing rapidly in usage.' },
    { term:'クレジット売掛金', en:'Credit Card Receivable', def:'クレジットカード決済で売り上げた際に、<strong>カード会社からまだ振り込まれていない代金</strong>を管理する科目です。通常の売掛金と区別して記録し、入金時にカード手数料（支払手数料）が差し引かれます。', def_en:'Tracks the <strong>amount owed by the credit card company</strong> after a card sale. Recorded separately from regular accounts receivable. When payment arrives, the card processing fee (Payment Fees expense) is deducted.' },
  ]},
  { category:'⑦ 固定資産・減価償却', items:[
    { term:'有形固定資産', en:'Tangible Fixed Assets', def:'<strong>形があり長期間使用する資産</strong>で、建物・機械・車両・備品・土地などが該当します。土地を除き使用するにつれて価値が減るため、毎期「減価償却」として費用化します。', def_en:'<strong>Physical assets held for long-term use</strong>: buildings, machinery, vehicles, equipment, land, etc. Except land, these lose value over time, so their cost is gradually expensed through annual depreciation.' },
    { term:'無形固定資産', en:'Intangible Fixed Assets', def:'<strong>形はないが法的な権利や価値を持つ長期資産</strong>です。特許権・商標権・ソフトウェア・のれんなどが該当します。有形固定資産と同様に耐用年数にわたって償却します。', def_en:'<strong>Long-term assets with no physical form but legal rights or value</strong>: patents, trademarks, software, goodwill (のれん), etc. Like tangible assets, they are amortized over their useful life.' },
    { term:'取得原価', en:'Acquisition Cost', def:'固定資産を取得するためにかかった<strong>購入代金＋すべての附随費用（運送費・据付費・試運転費など）</strong>の合計です。この金額が減価償却の計算の出発点になります。', def_en:'The <strong>total cost to acquire a fixed asset: purchase price plus all incidental costs</strong> (shipping, installation, test runs, etc.). This total is the starting point for depreciation calculations.' },
    { term:'帳簿価額', en:'Book Value', def:'固定資産の現在の帳簿上の価値で「<strong>取得原価－減価償却累計額</strong>」で計算します。「簿価」とも呼ばれます。売却・除却時にこれと売却額の差額が売却益・売却損になります。', def_en:'The current value of a fixed asset on the books: <strong>Acquisition Cost minus Accumulated Depreciation</strong>. Also called "carrying amount" or "book value." The difference between this and the sale price is the gain or loss on disposal.' },
    { term:'耐用年数', en:'Useful Life', def:'固定資産が使用に耐えると見込まれる<strong>年数</strong>です。税法で資産の種類ごとに「法定耐用年数」が定められており、例えば木造建物30年・乗用車6年などです。', def_en:'The estimated number of years a fixed asset can be usefully employed. <strong>Legally prescribed useful lives</strong> (e.g., wooden buildings: 30 years, passenger cars: 6 years) are set by tax law and used as the basis for depreciation.' },
    { term:'定額法', en:'Straight-line Method', def:'「<strong>（取得原価－残存価額）÷ 耐用年数</strong>」で毎年同額を償却する方法です。例：取得原価1,000円、残存価額0円、耐用年数5年なら毎年200円。計算がシンプルで建物・ソフトウェアに多く使われます。', def_en:'Depreciates equal amounts every year: <strong>(Cost − Residual Value) ÷ Useful Life</strong>. Example: cost ¥1,000, residual ¥0, 5 years → ¥200/year. Simple to calculate; commonly used for buildings and software.' },
    { term:'定率法', en:'Declining Balance Method', def:'毎年の<strong>期首帳簿価額（未償却残高）×一定率</strong>で償却額を計算する方法です。最初の年が最も償却額が多く年々減少します。機械・車両など初期に価値が大きく下がる資産に使われます。', def_en:'Applies a <strong>fixed percentage to the remaining book value</strong> each year. Depreciation is highest in early years and decreases over time. Suited for machinery and vehicles that lose value faster when new.' },
    { term:'間接法', en:'Indirect Method (Depreciation)', def:'減価償却の仕訳を「<strong>（借）減価償却費 ／（貸）減価償却累計額</strong>」と記録する方法です。固定資産の取得原価は帳簿に残し、累計額を別科目で管理します。B/S上で「建物1,000 △累計額600 ＝簿価400」と表示されます。', def_en:'Records depreciation as: <strong>Dr. Depreciation Expense / Cr. Accumulated Depreciation</strong>. The original acquisition cost stays on the books; the running total of depreciation is in a separate account. The balance sheet shows: "Building ¥1,000 − Acc. Dep. ¥600 = Book Value ¥400."' },
    { term:'資本的支出', en:'Capital Expenditure', def:'固定資産の<strong>性能を向上させたり耐用年数を延ばす改良工事</strong>への支出です。資産の取得原価に加算して資産計上します。例：エアコン増設→資本的支出。単なる修理→収益的支出（修繕費）。', def_en:'Spending that <strong>improves performance or extends the useful life</strong> of a fixed asset. Added to the asset\'s acquisition cost (capitalized). Example: installing additional air conditioning = capital expenditure; routine repairs = revenue expenditure (expense).' },
    { term:'収益的支出', en:'Revenue Expenditure', def:'固定資産を<strong>現状維持・原状回復するための修繕費用</strong>で、当期の費用（修繕費）として計上します。資産の価値を上げるものではなく、壊れた部分を元に戻す支出です。', def_en:'Spending to <strong>maintain or restore a fixed asset to its original condition</strong>. Expensed immediately as Repairs Expense. It doesn\'t add value or extend life — it just keeps the asset working as before.' },
    { term:'ファイナンス・リース', en:'Finance Lease', def:'実質的に<strong>分割払いで資産を購入するのと同じリース契約</strong>です。「リース資産（資産）／リース債務（負債）」として帳簿に計上し、毎期減価償却します。リース料の支払いは元本返済＋利息の扱いです。', def_en:'A lease that is <strong>economically equivalent to buying an asset on installments</strong>. Record "Lease Asset (asset) / Lease Liability (liability)" on the books and depreciate annually. Each lease payment is split into principal repayment and interest.' },
    { term:'オペレーティング・リース', en:'Operating Lease', def:'通常の<strong>賃貸借（レンタル）と同様に扱うリース</strong>です。資産・負債に計上せず、支払いのたびに「支払リース料（費用）」を計上するだけです。カーリースや機器レンタルが典型例です。', def_en:'Treated like a regular <strong>rental agreement</strong>. No asset or liability is recorded; each payment is simply expensed as "Lease Payments." Car leases and equipment rentals are typical examples.' },
    { term:'圧縮記帳', en:'Compression Entry', def:'国庫補助金や保険差益を受け取って固定資産を取得したとき、<strong>帳簿価額を圧縮（下げる）ことで課税を将来に繰り延べる処理</strong>です。「固定資産圧縮損（費用）」を計上して取得価額を引き下げます。', def_en:'When an asset is acquired using a government grant or insurance proceeds, the <strong>book value is reduced to defer tax liability into future years</strong>. Record "Asset Compression Loss (expense)" to reduce the acquisition cost.' },
    { term:'減損会計', en:'Impairment Accounting', def:'固定資産（建物・機械・土地など）の<strong>帳簿価額が実際に回収できる価値を大幅に上回ってしまった状態</strong>を「減損」といい、帳簿価額を引き下げる処理が減損会計です。判断の流れ：①<mark>減損の兆候</mark>をチェック（赤字が続く・その資産に関連する市場価値が大幅に下がったなど）→②<mark>回収可能価額</mark>を計算→③帳簿価額＞回収可能価額なら差額を「<strong>減損損失（費用）</strong>」として計上。一度引き下げた帳簿価額は原則として戻せません（不可逆）。', def_en:'When a fixed asset\'s book value significantly exceeds the amount recoverable from it, the asset is "impaired." The process: ① Check for impairment indicators (ongoing losses, sharp market value decline, etc.) → ② Calculate the recoverable amount → ③ If book value > recoverable amount, record the difference as "Impairment Loss (expense)." Once written down, the book value cannot be restored.' },
    { term:'回収可能価額', en:'Recoverable Amount', def:'減損の判定に使う「<strong>この資産から得られる最大の経済的価値</strong>」のことです。次の2つのうち<strong>高い方</strong>を使います。①<mark>正味売却価額</mark>＝今すぐ売ったとき手元に残る金額（売却価格から処分費用を引いた額）、②<mark>使用価値</mark>＝このまま使い続けた場合に将来得られるキャッシュフローを現在価値に直した金額。シンプルに言うと「<strong>売るか使うか、どちらか有利な方の価値</strong>」です。', def_en:'The maximum economic value recoverable from an asset — the higher of: ① Net Selling Price (what you\'d pocket if you sold it today, after disposal costs) and ② Value in Use (the present value of estimated future cash flows from continuing to use it). In short: "the better of selling it or keeping it."' },
  ]},
  { category:'⑧ 有価証券', items:[
    { term:'売買目的有価証券', en:'Trading Securities', def:'<strong>短期の値上がり益狙いで保有する株式・債券</strong>です。期末に時価評価し、取得原価との差額を「有価証券評価益（収益）」または「有価証券評価損（費用）」として損益計上します。翌期首に取得原価へ戻す洗替法を使います。', def_en:'Stocks or bonds held for <strong>short-term capital gains</strong>. At year-end, mark to fair value; record the difference as "Securities Valuation Gain (revenue)" or "Loss (expense)." The "reset method" reverses the entry at the start of next year.' },
    { term:'満期保有目的債券', en:'Held-to-maturity Securities', def:'<strong>満期まで保有し続ける前提で購入した債券</strong>です。時価評価は行いません。取得価額と額面の差額を満期まで毎期少しずつ帳簿価額に加算（または減算）する「償却原価法」を適用します。', def_en:'Bonds purchased with the <strong>intent to hold until maturity</strong>. Not revalued at fair value. Instead, the difference between acquisition cost and face value is gradually adjusted each year using the amortized cost method.' },
    { term:'その他有価証券', en:'Available-for-sale Securities', def:'売買目的でも満期保有目的でもない<strong>長期保有目的の株式・債券</strong>です。期末に時価評価しますが、差額は損益ではなく純資産の「その他有価証券評価差額金」に計上します（損益に影響しない点が特徴）。', def_en:'Securities held for the <strong>long term</strong>, but not classified as trading or held-to-maturity. Revalued at fair value at year-end, but the difference goes to equity ("Other Securities Valuation Difference") — not to the income statement.' },
    { term:'洗替法', en:'Mark-to-Market (Reset Method)', def:'期末に有価証券の評価差額を計上した後、<strong>翌期首に前期末の仕訳を逆仕訳して帳簿価額を取得原価に戻す方法</strong>です。毎期同じ取得原価からスタートするため差額管理がシンプルです。', def_en:'After recording the year-end valuation entry, <strong>reverses it at the start of next year</strong>, resetting the book value back to acquisition cost. Each year starts fresh from the original cost, making it easy to track changes.' },
    { term:'切放法', en:'Cost Retention Method', def:'期末の評価差額を翌期首に戻さず<strong>そのまま引き継ぐ方法</strong>です。洗替法と対比して覚えましょう。なお、売買目的有価証券には切放法の適用が認められていません。', def_en:'Keeps the year-end valuation adjustment as-is into the next year — <strong>no reversal</strong>. Contrast with the reset method. Note: the cost retention method is not permitted for trading securities.' },
    { term:'償却原価法', en:'Amortized Cost Method', def:'取得価額と額面の差額を<strong>満期まで毎期均等に帳簿価額へ加算（または減算）していく方法</strong>です。例：額面1,000円の債券を970円で購入した場合、差額30円を満期まで毎期少しずつ加算して最終的に1,000円になります。', def_en:'Gradually adjusts the bond\'s book value toward face value over its life. Example: buy a ¥1,000 face-value bond for ¥970 — the ¥30 discount is <strong>added to book value in equal annual installments</strong> until it reaches ¥1,000 at maturity.' },
    { term:'全部純資産直入法', en:'Full Net-Assets Direct Method', def:'「その他有価証券」を期末に時価評価したとき、生じた差額（<strong>評価益も評価損もどちらも</strong>）を損益計算書に計上せず、<strong>直接、純資産の「その他有価証券評価差額金」に記入する方法</strong>です。当期純利益には一切影響しません。「純資産方式」とも呼ばれ、<strong>J-GAAPでは原則この方法</strong>を使います。税効果（繰延税金資産・負債）も同時に計上します。', def_en:'When "available-for-sale securities" are revalued at year-end, all valuation differences — both gains and losses — bypass the income statement and go <strong>directly into equity</strong> as "Other Securities Valuation Difference." Net income is unaffected. Also called the "net assets method"; this is the default under Japanese GAAP. Deferred tax effects must also be recorded.' },
    { term:'部分純資産直入法', en:'Partial Net-Assets Direct Method', def:'「その他有価証券」の時価評価で、<strong>評価益（時価が帳簿価額より高い）→ 純資産（その他有価証券評価差額金）に直接計上、評価損（時価が帳簿価額より低い）→ 損益計算書（当期損失）に計上</strong>する方法です。利益は隠し、損失はすぐ見せる、という保守的な考え方に基づきます。全部純資産直入法が原則で、こちらは例外的な処理です。', def_en:'For "available-for-sale securities": unrealized <strong>gains go directly to equity</strong> (bypassing the income statement); unrealized <strong>losses are recognized on the income statement</strong>. Based on the conservative principle of "show losses immediately but defer gains." The full method is the default; this partial method is the exception.' },
  ]},
  { category:'⑨ 引当金・評価勘定', items:[
    { term:'引当金', en:'Allowance / Reserve', def:'将来発生が見込まれる費用や損失を<strong>あらかじめ当期に計上しておく負債（または資産の控除）</strong>です。4要件：①将来費用等の原因、②当期以前に原因がある、③発生可能性が高い、④金額を合理的に見積もれる。例：来年回収できなくなりそうな売掛金に備えて当期に貸倒引当金を計上。', def_en:'An estimated liability (or asset contra account) that <strong>recognizes a future expense or loss in the current period</strong>. Four requirements: ① future expense expected; ② cause exists in current or prior period; ③ likely to occur; ④ amount can be reasonably estimated. Example: setting aside an allowance for doubtful accounts this year because a receivable may go bad next year.' },
    { term:'評価勘定', en:'Valuation Account', def:'資産（または負債）の帳簿価額を<strong>間接的にマイナス調整するための対照科目</strong>です。代表例：貸倒引当金（売掛金の控除）、減価償却累計額（固定資産の控除）。B/S上で「売掛金500 △引当金20 ＝実質480」のように表示します。', def_en:'A <strong>contra account that indirectly reduces the book value</strong> of an asset (or liability). Examples: Allowance for Doubtful Accounts (contra to Accounts Receivable), Accumulated Depreciation (contra to Fixed Assets). Shown on the balance sheet as "A/R ¥500 − Allowance ¥20 = Net ¥480."' },
    { term:'差額補充法', en:'Allowance Adjustment Method', def:'引当金の<strong>期末残高と当期必要額の差額だけを追加計上（または取り崩し）する方法</strong>です。例：貸倒引当金残高100円、必要額130円なら差額30円だけ繰入れます。仕訳が少なく効率的です。', def_en:'Only records the <strong>difference between the current allowance balance and the required amount</strong>. Example: current Allowance for Doubtful Accounts = ¥100, required = ¥130 → record only ¥30 additional. Fewer journal entries than the full reversal method.' },
    { term:'洗替法（引当金）', en:'Full Reversal Method', def:'毎期初めに前期の引当金残高を全額取り崩してゼロにし、<strong>改めて当期必要額を全額新規計上する方法</strong>です。仕訳は2本必要になりますが、当期の繰入額がはっきりわかります。', def_en:'At the start of each period, <strong>fully reverses the prior balance to zero, then records the full new amount needed</strong>. Requires two entries per period but makes the current year\'s expense amount explicit.' },
    { term:'退職給付引当金', en:'Retirement Benefit Obligation', def:'将来支払う退職金の見積額を<strong>毎期少しずつ負債として積み立てる勘定</strong>です。「（借）退職給付費用 ／（貸）退職給付引当金」と仕訳し、実際に退職金を支払ったときに引当金を取り崩します。', def_en:'A liability built up gradually each year to cover <strong>estimated future retirement benefit payments</strong>. Entry: Dr. Retirement Benefit Expense / Cr. Retirement Benefit Obligation. When actual retirement payments are made, the liability is reduced.' },
  ]},
  { category:'⑩ 資本・株式', items:[
    { term:'純資産', en:'Net Assets / Equity', def:'「<strong>資産－負債＝純資産</strong>」で計算される、会社が実質的に所有する財産です。株主が出資したお金＋これまでに稼いだ利益の積み上げです。資本金・利益剰余金・自己株式などで構成されます。', def_en:'The residual interest after subtracting liabilities from assets: <strong>Assets − Liabilities = Net Assets (Equity)</strong>. Represents the shareholders\' stake — paid-in capital plus accumulated profits. Consists of capital stock, retained earnings, treasury stock, etc.' },
    { term:'法定準備金', en:'Legal Reserve', def:'会社法で積み立てが義務付けられた準備金です。<strong>資本準備金</strong>（株式発行時の払込余剰分）と<strong>利益準備金</strong>（配当時に利益から積み立てる分）の2種類があります。損失補填・資本組入れ以外には使えません。', def_en:'Reserves <strong>required by the Companies Act</strong>. Two types: <strong>Capital Reserve</strong> (from share issuance proceeds above par) and <strong>Legal Earnings Reserve</strong> (set aside from dividends). Can only be used to cover losses or incorporated into capital stock.' },
    { term:'任意積立金', en:'Voluntary Reserve', def:'法律上の義務ではなく<strong>会社が目的を決めて自由に積み立てる剰余金</strong>です。「別途積立金」「新築積立金」などがあります。株主総会の決議で設定でき、目的が達成されたら取り崩します。', def_en:'Reserves <strong>voluntarily set aside by the company for self-determined purposes</strong> — e.g., "General Reserve," "Building Fund." Created and dissolved by shareholder resolution once the purpose is achieved.' },
    { term:'自己株式', en:'Treasury Stock', def:'自社が発行した株式を市場から<strong>買い戻した株式（金庫株）</strong>です。純資産のマイナス項目として貸借対照表に計上されます。再発行（処分）や消却ができます。', def_en:'Shares of the company\'s own stock that it has <strong>repurchased from the market</strong>. Shown as a deduction from equity on the balance sheet. Can be reissued (disposed of) or cancelled.' },
    { term:'新株予約権', en:'Stock Warrants', def:'将来<strong>一定価格で自社株を購入できる権利</strong>です。ストックオプション（役員・社員向けのインセンティブ）や転換社債に組み込まれます。発行時は純資産の一部（新株予約権）に計上します。', def_en:'The right to <strong>purchase company shares at a fixed price in the future</strong>. Used in stock option plans (employee/executive incentives) and convertible bonds. Recorded as part of equity (Stock Warrants) when issued.' },
    { term:'株主資本', en:'Shareholders\' Equity', def:'純資産のうち<strong>資本金・資本剰余金・利益剰余金・自己株式からなる部分</strong>です。新株予約権やその他有価証券評価差額金は株主資本には含まれない点に注意です。', def_en:'The component of equity comprising <strong>capital stock, capital surplus, retained earnings, and treasury stock</strong>. Note: stock warrants and other securities valuation differences are part of net assets but NOT part of shareholders\' equity.' },
    { term:'配当', en:'Dividend', def:'会社の利益を<strong>株主に分配すること</strong>です。株主総会で金額が決議されると「未払配当金（負債）」を計上し、実際に支払ったときに取り崩します。配当時は同時に配当額の10分の1（利益準備金の積立上限まで）を利益準備金に積み立てます。', def_en:'Distributing company profits to shareholders. When declared at the annual meeting, record <strong>Dividends Payable (liability)</strong>; remove it when paid. Simultaneously, set aside 1/10 of the dividend amount as Legal Earnings Reserve (until the statutory limit is reached).' },
    { term:'増資', en:'Capital Increase', def:'新株を発行して投資家から<strong>新たに出資を募り、資本金を増やすこと</strong>です。払込金額の<strong>最大2分の1まで資本準備金</strong>に積み立て、残りを資本金とします。', def_en:'Issuing new shares to <strong>raise additional capital</strong>. Up to <strong>half of the proceeds can be allocated to Capital Reserve</strong>; the rest goes to Capital Stock.' },
  ]},
  { category:'⑪ 決算整理', items:[
    { term:'発生主義', en:'Accrual Basis', def:'<strong>現金の動きに関係なく、取引が発生した時点で収益・費用を認識する</strong>原則です。例：12月に仕事を完了して翌1月に入金でも、収益は12月に計上します。日本の企業会計の基本原則です。', def_en:'Recognizes revenues and expenses <strong>when they are earned or incurred — regardless of when cash changes hands</strong>. Example: work completed in December but paid in January → record revenue in December. The foundation of corporate accounting.' },
    { term:'現金主義', en:'Cash Basis', def:'<strong>実際に現金を受け取ったときに収益、支払ったときに費用を認識</strong>する方法です。家計簿や小規模事業では使いやすいですが、企業会計では発生主義が原則です。', def_en:'Recognizes revenue when <strong>cash is received</strong> and expenses when <strong>cash is paid</strong>. Simple for personal finances or small businesses, but corporate accounting requires the accrual basis.' },
    { term:'費用収益対応の原則', en:'Matching Principle', def:'<strong>収益に対応する費用は同じ期間に計上する</strong>原則です。例：3月に売れた商品の仕入コストは3月の費用（売上原価）として計上し、4月に計上しない。期ずれを防ぐためのルールです。', def_en:'<strong>Expenses must be recognized in the same period as the revenues they helped generate</strong>. Example: the cost of goods sold in March must be expensed in March — not April. Prevents income from being shifted between periods.' },
    { term:'前払費用', en:'Prepaid Expenses', def:'当期に支払ったが<strong>来期以降の期間に対応する費用の分を資産に振り替えた金額</strong>です。例：4月から1年分の火災保険料12,000円を当期3月に支払った場合、4月以降の11か月分11,000円を前払費用（資産）として翌期に繰り延べます。', def_en:'The portion of a payment made this period that <strong>covers future periods — reclassified as an asset</strong>. Example: pay ¥12,000 for a 12-month insurance policy in March; the ¥11,000 covering April onward is recorded as Prepaid Expense (asset) and expensed next year.' },
    { term:'前受収益', en:'Deferred Revenue', def:'当期に受け取ったが<strong>来期以降の期間に対応する収益の分を負債に振り替えた金額</strong>です。例：4月から1年分の家賃を当期3月に受け取った場合、4月以降の分を前受収益（負債）として翌期に繰り延べます。', def_en:'Money received this period that <strong>covers future periods — reclassified as a liability</strong> (obligation to provide future service). Example: receive a full year\'s rent in March; the portion covering April onward is Deferred Revenue (liability).' },
    { term:'未払費用', en:'Accrued Expenses', def:'当期中にすでに発生しているのに<strong>まだ支払っていない費用を負債として計上</strong>します。例：12月31日が決算で1〜12月分の給料のうち12月分がまだ未払いなら「未払給料（負債）」を計上します。', def_en:'Expenses already incurred this period but <strong>not yet paid — recorded as a liability</strong>. Example: fiscal year ends December 31; December\'s salary not yet paid → record "Accrued Salaries Payable (liability)".' },
    { term:'未収収益', en:'Accrued Revenue', def:'当期中にすでに稼いでいるのに<strong>まだ受け取っていない収益を資産として計上</strong>します。例：12月分の受取利息がまだ入金されていない場合、「未収利息（資産）」を計上します。', def_en:'Revenue already earned this period but <strong>not yet received — recorded as an asset</strong>. Example: interest earned in December not yet received → record "Accrued Interest Receivable (asset)".' },
    { term:'継続性の原則', en:'Consistency Principle', def:'一度採用した会計方針（在庫評価方法・減価償却方法など）を<strong>正当な理由なく変更してはならない</strong>原則です。変更すると過年度比較が不可能になり、恣意的な利益調整ができてしまいます。', def_en:'Once adopted, accounting methods (inventory valuation, depreciation method, etc.) must <strong>not be changed without good reason</strong>. Arbitrary changes would make year-over-year comparisons meaningless and enable earnings manipulation.' },
    { term:'保守主義の原則', en:'Conservatism Principle', def:'<strong>利益は控えめに（過大計上しない）、損失は早めに（先取りして）認識する</strong>原則です。在庫の低価法評価・引当金の積み立て・減価償却などがこの原則に基づいています。', def_en:'<strong>Recognize revenues conservatively (don\'t overstate); recognize losses promptly (don\'t delay)</strong>. This principle underlies lower-of-cost-or-market inventory valuation, allowance accruals, and depreciation policies.' },
    { term:'重要性の原則', en:'Materiality Principle', def:'<strong>金額的に重要でない項目は簡便な処理が認められる</strong>原則です。例：10円の消耗品を購入時に全額費用計上する（資産計上して減価償却しない）のはこの原則が根拠です。', def_en:'Items that are <strong>not material (insignificant in amount) may be treated in a simplified way</strong>. Example: expensing a ¥10 supply item immediately rather than capitalizing and depreciating it is justified by this principle.' },
    { term:'繰延資産', en:'Deferred Assets', def:'すでに現金を支払ったが<strong>将来の期間に分けて費用計上する特殊な資産</strong>です。創立費・開業費・株式交付費・社債発行費の4種類があり、支出後5年以内（社債発行費は3年以内）に均等償却します。', def_en:'Costs already paid but <strong>spread (amortized) as expenses over future periods</strong>. Four types: incorporation costs, startup costs, stock issuance costs, and bond issuance costs. Amortized within 5 years (3 years for bond issuance costs).' },
  ]},
  { category:'⑫ 税金', items:[
    { term:'消費税（税込処理）', en:'Tax Inclusive Method', def:'本体価格＋消費税を<strong>区別せずにまとめて記録する方法</strong>です。仕訳がシンプルですが、決算時に消費税相当額を仮払消費税・仮受消費税へ振り替える調整が必要です。', def_en:'Records prices <strong>inclusive of consumption tax without separating them</strong>. Simpler entries day-to-day, but requires a period-end adjustment to separate the tax portion from the base amount.' },
    { term:'消費税（税抜処理）', en:'Tax Exclusive Method', def:'<strong>本体価格と消費税を分けて記録する方法</strong>です。仕入時→仮払消費税（資産）、売上時→仮受消費税（負債）を計上し、決算時に差額を未払消費税（負債）として確定します。3級の標準的な処理です。', def_en:'<strong>Separates the tax amount from the base price</strong> in every entry. Purchases: record Deferred Input Tax (asset); Sales: record Deferred Output Tax (liability). At year-end, net the two to get Taxes Payable. Standard method for Level 3.' },
    { term:'税効果会計', en:'Tax Effect Accounting', def:'会計上の利益と税務上の課税所得の<mark>一時的なズレ（一時差異）を繰延税金資産・繰延税金負債で調整する処理</mark>です。例：会計では当期費用だが税務では翌期損金→繰延税金資産を計上して当期の税負担を正しく反映します。', def_en:'Adjusts for <mark>temporary differences between accounting income and taxable income</mark> using Deferred Tax Assets/Liabilities. Example: an expense recognized for accounting purposes this year but deductible for tax next year → record a Deferred Tax Asset to reflect the correct tax expense this period.' },
    { term:'一時差異', en:'Temporary Difference', def:'会計と税法の処理時期のズレで<strong>将来に解消する差異</strong>です。将来の節税につながる差異→繰延税金資産を計上。将来に税負担が増える差異→繰延税金負債を計上します。', def_en:'A timing difference between accounting and tax treatment that <strong>reverses in future periods</strong>. Differences that reduce future taxes → Deferred Tax Asset. Differences that increase future taxes → Deferred Tax Liability.' },
    { term:'法人税の中間申告', en:'Interim Tax Filing', def:'法人税は年1回確定申告ですが、<strong>期の途中（6か月経過後）に前年法人税額の50%を先払いする制度</strong>があります。先払い分は「仮払法人税等（資産）」に計上し、決算後の確定申告で精算します。', def_en:'Corporate tax is filed annually, but companies must <strong>prepay 50% of the prior year\'s tax amount at the midpoint of the fiscal year</strong>. Record this as "Prepaid Corporate Tax (asset)" and settle it against the final tax liability at year-end.' },
    { term:'繰越欠損金', en:'Net Operating Loss Carryforward', def:'企業が赤字（欠損金）を出した年の損失を、<strong>翌年以降（最大10年間）に繰り越して黒字の利益と相殺し、法人税を減らせる制度</strong>です。会計では「将来の節税効果が見込まれる」として<mark>繰延税金資産（資産）</mark>に計上します。例：今年100万円の欠損→来年100万円の利益と相殺→法人税30万円の節税（税率30%の場合）。ただし<strong>「将来確実に黒字になる」見込みがなければ計上できません</strong>（回収可能性の判断が重要）。', def_en:'A tax provision allowing a company to carry a net loss forward up to 10 years to offset future taxable income and reduce future corporate tax. In accounting, the expected future tax benefit is recognized as a Deferred Tax Asset. Example: a ¥1M loss this year → offset against ¥1M profit next year → saves 30% × ¥1M = ¥300,000 in taxes. The asset can only be recorded if future profitability is probable — the recoverability judgment is key.' },
  ]},
  { category:'⑬ 伝票会計', items:[
    { term:'入金伝票', en:'Receipt Voucher', def:'<strong>現金を受け取った取引を記録する伝票</strong>です。借方は必ず「現金」になります。記入するのは貸方科目（何を対価に現金を受け取ったか）だけです。例：売掛金を現金で回収→入金伝票の貸方「売掛金○○円」と記入。', def_en:'A voucher recording <strong>cash receipts</strong>. The debit side is always Cash. Only the credit account (what you received cash in exchange for) needs to be written. Example: collecting a receivable in cash → credit side "Accounts Receivable ¥XX".' },
    { term:'出金伝票', en:'Payment Voucher', def:'<strong>現金を支払った取引を記録する伝票</strong>です。貸方は必ず「現金」になります。記入するのは借方科目（何のために現金を払ったか）だけです。例：消耗品を現金で購入→出金伝票の借方「消耗品費○○円」と記入。', def_en:'A voucher recording <strong>cash payments</strong>. The credit side is always Cash. Only the debit account (what you paid cash for) needs to be written. Example: buying supplies with cash → debit side "Supplies Expense ¥XX".' },
    { term:'振替伝票', en:'Transfer Voucher', def:'<strong>現金が動かない取引を記録する伝票</strong>です。掛け売買・手形取引・決算整理仕訳などに使います。借方・貸方の両方を記入します。', def_en:'Records <strong>transactions that do not involve cash</strong> — credit sales, note transactions, adjusting entries, etc. Both debit and credit sides must be fully written out.' },
    { term:'仕訳日計表', en:'Daily Summary Journal', def:'入金・出金・振替の3種の伝票を<strong>勘定科目ごとに集計して1日分にまとめた一覧表</strong>です。これを使って元帳へ転記します。大量取引のある会社では毎日の伝票を個別転記せずに日計表経由でまとめて転記できます。', def_en:'A <strong>daily summary of all three voucher types</strong> (receipts, payments, transfers), totaled by account. Used to post to the ledger. In high-volume companies, instead of posting each voucher individually, totals from this sheet are posted once a day.' },
  ]},
  { category:'⑭ 本支店会計', items:[
    { term:'本支店会計', en:'Head Office / Branch Accounting', def:'本社と支店が<strong>それぞれ独立した帳簿で仕訳・記録を行う会計方式</strong>です。本社の帳簿には「支店（資産科目）」、支店の帳簿には「本店（純資産的科目）」が計上されます。決算時に両方を合算して合計財務諸表を作ります。', def_en:'An accounting structure where <strong>the head office and each branch maintain independent sets of books</strong>. The head office records a "Branch" asset; the branch records a "Head Office" equity-like account. At year-end, both sets are combined into consolidated financial statements.' },
    { term:'内部取引の消去', en:'Elimination of Internal Transactions', def:'本支店を合算する決算で、<strong>本社の「支店」勘定と支店の「本店」勘定を相殺消去する処理</strong>です。消去しないと同じ取引が本社と支店の両方に計上されて資産・利益が二重になります。', def_en:'In the combined year-end closing, <strong>the head office\'s "Branch" account and the branch\'s "Head Office" account cancel each other out</strong>. Without this elimination, the same transaction would appear on both sets of books, overstating assets and profits.' },
    { term:'未達取引', en:'In-transit Transactions', def:'本社が処理済みだが<strong>支店にまだ連絡・物が届いていない取引</strong>（または逆）のことです。合算前に未達側（支店または本社）で対応する仕訳を追加して残高を一致させます。', def_en:'Transactions that <strong>one side has recorded but the other side has not yet received or been notified of</strong>. Before combining the books, the uninformed side must record the missing entries so that both sets of books agree.' },
    { term:'内部利益', en:'Internal Profit', def:'本社が支店に商品を<strong>仕入原価に利益を上乗せした価格（振替価格）で送り出した場合</strong>、その商品が支店でまだ売れていないときに期末在庫の中に含まれている「見かけ上の利益」のことです。例：仕入100円の商品を本社が120円で支店に送る→支店の在庫に20円の内部利益が含まれる。本支店を合算して財務諸表を作る際は、<strong>未実現の内部利益を消去</strong>しないと会社全体の利益と資産が実際より多く見えてしまいます。', def_en:'The unrealized profit embedded in goods transferred from the head office to a branch at a marked-up price. Example: goods costing ¥100 are transferred to the branch at ¥120 — the ¥20 markup is "internal profit" if those goods are still in the branch\'s inventory at year-end. When combining branch and head-office statements, this internal profit must be eliminated — otherwise both profit and inventory will be overstated.' },
  ]},
  { category:'⑮ 工業簿記・原価計算', items:[
    { term:'原価計算', en:'Cost Accounting', def:'製品1単位あたりの<strong>製造コストを計算する仕組み</strong>です。材料費・労務費・製造間接費の3要素に分けて集計します。原価を正確に把握することで、適切な販売価格の設定や利益管理が可能になります。', def_en:'A system for <strong>calculating the cost to manufacture each unit of product</strong>. Costs are classified into three elements: materials, labor, and manufacturing overhead. Accurate cost data enables proper pricing and profit management.' },
    { term:'原価の3要素', en:'Three Cost Elements', def:'製造原価を構成する<strong>①材料費（木材・鉄など物にかかるコスト）②労務費（工場で働く人の給料）③製造間接費（工場の電気代・設備の減価償却など）</strong>の3種類です。これらが仕掛品（製造中の品）に集まり、完成したら製品へ移ります。', def_en:'The three components of manufacturing cost: <strong>① Materials (wood, steel, etc.); ② Labor (factory worker wages); ③ Manufacturing Overhead (electricity, equipment depreciation, etc.)</strong>. All three accumulate in WIP (Work in Process) and transfer to Finished Goods when complete.' },
    { term:'直接費', en:'Direct Costs', def:'<strong>特定の製品に直接結びつけられる費用</strong>です。主要材料（その製品に使った木材など）や直接工の賃金（その製品を作った工員の給料）が代表例です。仕掛品勘定に直接集計します。', def_en:'Costs that can be <strong>directly traced to a specific product</strong>: direct materials (the main materials in that product) and direct labor (wages of workers who made that product). Charged directly to the WIP account.' },
    { term:'間接費', en:'Indirect Costs', def:'複数の製品に共通してかかり<strong>特定の製品に直接割り当てられない費用</strong>です。工場の電気代・補助材料（油・接着剤）・間接工の賃金・設備の減価償却費などが該当します。製造間接費として集計し、一定の基準（配賦）で各製品に配分します。', def_en:'Costs <strong>shared across multiple products that cannot be directly traced to any single one</strong>: factory electricity, lubricants, indirect labor wages, equipment depreciation, etc. Pooled as "Manufacturing Overhead" and then allocated to products using a predetermined rate.' },
    { term:'配賦', en:'Cost Allocation', def:'製造間接費を<strong>一定の基準（配賦基準）で各製品に割り振る計算</strong>です。計算式：製造間接費合計 ÷ 配賦基準合計 × 各製品の基準値。配賦基準には直接作業時間・機械稼働時間・直接材料費などが使われます。', def_en:'The process of <strong>distributing manufacturing overhead to each product</strong> using a predetermined basis. Formula: Total Overhead ÷ Total Allocation Basis × Each Product\'s Share. Common bases: direct labor hours, machine hours, or direct material cost.' },
    { term:'予定配賦', en:'Predetermined Allocation', def:'実際の間接費が集計される前に<strong>あらかじめ決めた予定配賦率で間接費を配賦する方法</strong>です。予定配賦率＝年間予算間接費÷年間予算配賦基準。月次で迅速に原価計算できますが、実際との差（配賦差異）が生じます。', def_en:'Allocates overhead using a <strong>rate fixed in advance</strong>, before actual costs are known. Rate = Annual budgeted overhead ÷ Annual budgeted allocation base. Enables timely monthly costing but creates a variance between actual and applied overhead.' },
    { term:'配賦差異', en:'Allocation Variance', def:'予定配賦額と実際間接費の差額です。<strong>実際 ＞ 予定 → 不利差異（借方差異：コストオーバー）、実際 ＜ 予定 → 有利差異（貸方差異：コスト節約）</strong>となります。期末に売上原価などに一括処理します。', def_en:'The difference between applied overhead and actual overhead. <strong>Actual > Applied → Unfavorable (debit) variance (cost overrun); Actual < Applied → Favorable (credit) variance (cost savings)</strong>. Closed to Cost of Goods Sold at period-end.' },
    { term:'個別原価計算', en:'Job Order Costing', def:'<strong>オーダー（製造指図書）ごとに原価を個別集計する方法</strong>です。建設・印刷・造船など受注生産に向いています。指図書に材料費・労務費・間接費を記入し、完成したら製品原価が確定します。', def_en:'<strong>Accumulates costs separately for each job order</strong>. Suited for custom/job-shop production: construction, printing, shipbuilding, etc. Material, labor, and overhead costs are recorded on a job cost sheet; total cost is finalized when the job is complete.' },
    { term:'総合原価計算', en:'Process Costing', def:'大量生産で<strong>一定期間（月単位）の総製造コストを総生産量で割って単位原価を求める方法</strong>です。食品・化学・自動車部品など規格品の連続生産に向いています。月末仕掛品の完成品換算が計算の要です。', def_en:'For mass production: <strong>divides the total manufacturing cost of a period by total units produced</strong> to get the cost per unit. Suited for continuous production of standard goods (food, chemicals, auto parts). Calculating equivalent units for WIP is the key step.' },
    { term:'標準原価計算', en:'Standard Costing', def:'あらかじめ設定した<strong>目標原価（標準原価）と実際原価を比較して差異を分析する方法</strong>です。コスト管理・業績評価に役立ちます。差異分析（価格差異・数量差異・能率差異・操業度差異）が核心です。', def_en:'Sets a <strong>target cost (standard cost) in advance and analyzes variances from actual costs</strong>. Essential for cost control and performance evaluation. Key variances include price, quantity, efficiency, and volume variances.' },
