<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記 仕訳練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      touch-action: manipulation;
    }

    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.liability { background: #C2185B; }
    .dot.expense   { background: #388E3C; }
    .dot.revenue   { background: #0288D1; }
    .dot.equity    { background: #fff; border: 1.5px solid #9E9E9E; }


    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }

    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #6A1B9A; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }

    .card-body { padding: 20px 18px; }

    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }

    .answer-area { display: none; }
    .answer-area.show { display: block; }

    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tag-amt { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }
    /* 資産：黄色 */
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    /* 負債：ピンク/紫 */
    .tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    /* 費用：緑 */
    .tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    /* 収益：水色 */
    .tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    /* 純資産：白 */
    .tag.equity    { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    /* その他（評価勘定・損益等）*/
    .tag.other     { background: #F3E5F5; color: #4A148C; border: 1.5px solid #CE93D8; }

    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }

    .exp-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #F0F7FF;
      border-left: 3px solid #42A5F5;
      border-radius: 4px;
      font-size: 13px;
      color: #1A2B3C;
      line-height: 1.7;
    }
    .exp-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* 表形式の解答 */
    .ans-table-wrap {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .ans-table-wrap table,
    .exp-readonly-ans table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      min-width: 260px;
    }
    .ans-table-wrap th,
    .exp-readonly-ans th {
      background: #1E4D7B;
      color: white;
      padding: 5px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
    }
    .ans-table-wrap td,
    .exp-readonly-ans td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      line-height: 1.5;
    }
    .ans-table-wrap tr:nth-child(even) td,
    .exp-readonly-ans tr:nth-child(even) td { background: #D6EAF8; }
    .ans-table-wrap .total-row td,
    .exp-readonly-ans .total-row td { background: #AED6F1; font-weight: 700; }
    .ans-table-wrap .hl,
    .exp-readonly-ans .hl { background: #FFF9C4 !important; font-weight: 700; }
    .ans-table-wrap .q-blank,
    .exp-readonly-ans .q-blank { background: #FFF3E0 !important; color: #E65100; font-weight: 700; text-align: center; border: 2px dashed #FB8C00 !important; }
    .tbl-sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .formula-box {
      margin: 8px 0;
      padding: 8px 12px;
      background: #E8F5E9;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1B5E20;
      text-align: center;
    }

    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    /* ===== Appendix modal ===== */
    .apx-btn { background:var(--primary); color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .apx-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; padding:0; }
    .apx-overlay.show { display:flex; }
    .apx-modal { background:#fff; width:100%; max-width:none; border-radius:0; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow:hidden; margin:0; }
    .apx-sticky-header { flex-shrink:0; padding:16px 18px 10px; background:#fff; border-bottom:1px solid var(--border); }
    .apx-modal-body { overflow-y:auto; flex:1; padding:10px 18px 20px; -webkit-overflow-scrolling:touch; }
    .apx-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
    .apx-title { font-size:17px; font-weight:800; color:var(--primary); }
    .apx-subtitle { font-size:11px; color:var(--muted); margin-top:2px; }
    .apx-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
    .apx-section { margin-bottom:22px; }
    .apx-section-hd { font-size:13px; font-weight:800; padding:7px 12px; border-radius:8px; margin-bottom:5px; display:flex; align-items:center; gap:8px; }
    .apx-section-hd.asset      { background:#FFF9C4; color:#5D4037; border:1.5px solid #F9C400; }
    .apx-section-hd.liability  { background:#FCE4EC; color:#880E4F; border:1.5px solid #C2185B; }
    .apx-section-hd.expense    { background:#E8F5E9; color:#1B5E20; border:1.5px solid #388E3C; }
    .apx-section-hd.revenue    { background:#E1F5FE; color:#01579B; border:1.5px solid #0288D1; }
    .apx-section-hd.equity     { background:#F5F5F5; color:#333; border:1.5px solid #9E9E9E; }
    .apx-section-hd.other      { background:#F3E5F5; color:#4A148C; border:1.5px solid #CE93D8; }
    .apx-section-hd.industrial { background:#FFF3E0; color:#BF360C; border:1.5px solid #FF8F00; }
    .apx-section-sub { font-size:11px; color:var(--muted); margin-bottom:6px; padding-left:4px; }
    .apx-row { padding:8px 4px; border-bottom:1px solid var(--border); }
    .apx-row.hidden { display:none; }
    .apx-row-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px; }
    .apx-en { font-size:11px; color:var(--muted); }
    .apx-note { font-size:12px; color:#444; line-height:1.6; }
    .apx-note strong, .gloss-def-en strong { color:#1A2B3C; font-weight:700; }
    .apx-note mark, .gloss-def-en mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    .apx-lv { display:inline-block; font-size:9px; font-weight:700; background:var(--primary); color:#fff; border-radius:4px; padding:1px 5px; }
    .apx-lv.ind { background:#FF8F00; }
    .apx-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
    .apx-tab { padding:5px 11px; border:1.5px solid var(--border); border-radius:20px; background:#fff; font-size:12px; cursor:pointer; color:var(--muted); font-weight:600; transition:background 0.15s,color 0.15s,border-color 0.15s; }
    .apx-tab:hover { background:#f5f5f5; }
    .apx-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .apx-hide-btns { display:flex; gap:8px; margin-bottom:0; }
    .apx-hide-btn { flex:1; padding:7px 10px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:12px; cursor:pointer; color:var(--text); font-weight:600; text-align:center; transition:background 0.15s; }
    .apx-hide-btn.active { background:#eee; border-color:#999; }
    #apx-content.names-hidden .tag { color:transparent !important; background:#e0e0e0 !important; border-color:#bbb !important; user-select:none; min-width:50px; display:inline-block; }
    #apx-content.names-hidden .gloss-term-text { color:transparent !important; background:#e0e0e0 !important; border-radius:3px; user-select:none; }
    #apx-content.en-hidden .apx-en, #apx-content.en-hidden .gloss-en { display:none; }
    /* ===== Glossary ===== */
    .gloss-section { margin-bottom:10px; }
    .gloss-hd { font-size:14px; font-weight:800; color:var(--primary); padding:8px 12px; background:var(--primary-light); border-radius:8px; margin:14px 0 6px; }
    .gloss-row { padding:9px 4px; border-bottom:1px solid var(--border); }
    .gloss-term { font-size:13px; font-weight:800; margin-bottom:3px; }
    .gloss-en { font-size:11px; color:var(--muted); }
    .gloss-def { font-size:12px; color:#444; line-height:1.6; }
    .gloss-def strong { color:#1A2B3C; }
    .gloss-def mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    .gloss-def-en { font-size:12px; color:var(--text); line-height:1.6; }
    .apx-note .apx-note-ja { font-size:11px; color:var(--muted); line-height:1.55; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border); }
    .gloss-def .gloss-def-ja { font-size:11px; color:var(--muted); line-height:1.55; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border); }
    #apx-content.en-hidden .apx-note .apx-note-ja,
    #apx-content.en-hidden .gloss-def .gloss-def-ja { color:#444; font-size:12px; margin-top:0; padding-top:0; border-top:none; }
    #apx-content.en-hidden .gloss-def-en { display:none; }

    /* ===== 一問一答モード ===== */
    .qa-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; padding:0; }
    .qa-overlay.show { display:flex; }
    .qa-modal { background:#fff; width:100%; max-width:none; border-radius:0; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow:hidden; margin:0; }
    .qa-sticky-hd { flex-shrink:0; padding:12px 16px 10px; background:#fff; border-bottom:1px solid var(--border); }
    .qa-hd-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .qa-title { font-size:16px; font-weight:800; color:var(--primary); }
    .qa-prog-text { font-size:13px; font-weight:700; color:var(--muted); }
    .qa-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; padding:2px 6px; }
    .qa-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
    .qa-tab { padding:5px 12px; border:1.5px solid var(--border); border-radius:20px; background:#fff; font-size:12px; cursor:pointer; color:var(--muted); font-weight:600; transition:background 0.15s,color 0.15s,border-color 0.15s; }
    .qa-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .qa-prog-bar-wrap { height:5px; background:#E0E0E0; border-radius:3px; overflow:hidden; }
    .qa-prog-bar-fill { height:100%; background:var(--primary); border-radius:3px; transition:width 0.3s; }
    .qa-body { overflow-y:auto; flex:1; padding:14px 14px 24px; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:12px; }

    /* 問題カード */
    .qa-q-card { background:#fff; border-radius:14px; border:1.5px solid var(--border); padding:16px 18px; }
    .qa-q-meta { display:flex; gap:6px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
    .qa-q-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
    .qa-q-badge.asset     { background:#FFF9C4; color:#5D4037; border:1.5px solid #F9C400; }
    .qa-q-badge.liability { background:#FCE4EC; color:#880E4F; border:1.5px solid #C2185B; }
    .qa-q-badge.revenue   { background:#E1F5FE; color:#01579B; border:1.5px solid #0288D1; }
    .qa-q-badge.expense   { background:#E8F5E9; color:#1B5E20; border:1.5px solid #388E3C; }
    .qa-q-badge.equity    { background:#F3E5F5; color:#4A148C; border:1.5px solid #CE93D8; }
    .qa-q-badge.gloss     { background:#FFF3E0; color:#BF360C; border:1.5px solid #FF8F00; }
    .qa-q-badge.industrial{ background:#FFF3E0; color:#BF360C; border:1.5px solid #FF8F00; }
    .qa-q-badge.cat       { background:#E8EAF6; color:#283593; border:1.5px solid #9FA8DA; }
    .qa-q-text { font-size:13px; color:#333; line-height:1.8; }
    .qa-q-text mark { background:linear-gradient(transparent 45%, rgba(255,210,0,0.45) 45%); padding:0 1px; border-radius:0; color:inherit; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
    .qa-q-text strong { color:#1A2B3C; }
    .q-paren { color: #a0b5c8; font-size: 0.88em; }
    .qa-mask { display:inline-block; background:#333; color:transparent; border-radius:3px; padding:0 4px; min-width:3em; user-select:none; }
    .qa-q-suffix { display:block; margin-top:10px; font-size:13px; font-weight:700; color:var(--primary); }

    /* 答え表示エリア */
    .qa-ans-area { background:#F8F9FF; border-radius:14px; border:1.5px solid var(--border); padding:16px 18px; }
    .qa-ans-area.hidden { display:none; }
    .qa-ans-label { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:6px; }
    .qa-ans-text { font-size:28px; font-weight:800; color:var(--primary); margin-bottom:4px; }
    .qa-ans-en { font-size:15px; color:#1565C0; font-weight:700; margin-bottom:4px; }
    .qa-q-en { font-size:11px; color:var(--muted); line-height:1.65; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
    .qa-q-en mark { background:#E3F2FD; padding:0 2px; border-radius:2px; }
    .qa-q-en strong { color:#37474F; }
    .qa-ans-type { margin-top:8px; font-size:12px; color:#BF360C; background:#FFF3E0; border:1px solid #FF8F00; border-radius:6px; padding:4px 8px; display:inline-block; font-weight:700; }

    /* 答えを見るボタン */
    .qa-reveal-btn { width:100%; padding:12px; border:2px dashed var(--border); border-radius:12px; background:#fff; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; transition:background 0.15s,border-color 0.15s; }

   '帳簿残高と実際残高の差を原因判明まで一時的に記録する科目です。<strong>「実際＞帳簿」→貸方に記録（過剰）、「実際＜帳簿」→借方に記録（不足）</strong>。原因判明後は正しい科目に振り替えます。<mark>期末まで原因不明なら「雑益（過剰）」または「雑損（不足）」へ</mark>振り替えて残高をゼロにします。',3,
    'Temporary account for unexplained cash discrepancies. <strong>Actual > Book → credit (overage); Actual < Book → debit (shortage).</strong> Once the cause is found, reclassify to the appropriate account. <mark>Still unexplained at year-end → transfer to Misc. Revenue (overage) or Misc. Loss (shortage).</mark>'],
  ['消耗品','Supplies (Unused)',
   '購入したがまだ使っていない消耗品（ペン・ノート・コピー用紙など）を期末に資産として計上するときに使う科目です。購入時に全額「消耗品費（費用）」とした場合、期末の未使用分を消耗品（資産）に振り戻します。',3,
    'Unused consumable supplies (pens, notebooks, copy paper, etc.) recorded as an asset at period-end. If supplies were expensed when purchased, the unused portion is reversed to this account.'],
  ['小口現金','Petty Cash',
   '各部署の担当者（小口現金係）にあらかじめ渡す少額の現金です。交通費・文具代など細かい支払いに使い、「定額資金前渡制度」では一定額を常に担当者に保持させ、使った分は領収書と引き換えに補充します。',3,
    'A small cash fund entrusted to a petty cash custodian for minor day-to-day expenses (transit fares, stationery, etc.). Under the imprest system, a fixed amount is always kept on hand and replenished when spent.'],
  // 2級 資産
  ['車両運搬具','Vehicles',
   '会社が所有している乗用車・トラック・フォークリフトなど業務に使う車です。毎期減価償却します。一般的な乗用車の耐用年数は4〜6年です。',2,
    'Company-owned cars, trucks, and forklifts used for business. Depreciated annually; typical useful life for passenger cars is 4–6 years.'],
  ['機械装置','Machinery',
   '製品を製造するために使う工場の機械・大型設備・生産ラインなどです。製造業で多く使われる有形固定資産で、毎期減価償却します。種類によって耐用年数は3〜17年程度と幅があります。',2,
    'Factory machines, large equipment, and production lines used in manufacturing. A major tangible fixed asset for manufacturers, depreciated over 3–17 years depending on type.'],
  ['構築物','Structures',
   '建物以外の土木・建設設備（駐車場の舗装・フェンス・ガードレール・橋・貯水池など）です。有形固定資産として毎期減価償却します。耐用年数は種類によって15〜50年程度です。',2,
    'Civil-engineering structures other than buildings: parking lot paving, fences, guardrails, bridges, water tanks, etc. Depreciated over 15–50 years depending on type.'],
  ['工具器具備品','Tools, Furniture and Fixtures',
   '工具・器具・備品をまとめて記録する科目です（3級の「備品」をより広くした概念）。机・棚・工具・測定器・看板なども含まれます。有形固定資産として毎期減価償却します。',2,
    'A broad category covering tools, instruments, and fixtures in addition to basic equipment: desks, shelving, measuring instruments, signage, etc. Depreciated annually.'],
  ['ソフトウェア','Software',
   '業務用の自社開発プログラムや購入した基幹システムを資産計上した無形固定資産です。物体がないため「無形固定資産」に分類され、毎期均等償却します（耐用年数は5年が多い）。',2,
    'Internally developed or purchased business software recorded as an intangible fixed asset (no physical form). Amortized straight-line, typically over 5 years.'],
  ['リース資産','Leased Assets',
   'ファイナンス・リース契約で借りている設備・機械・車両などを資産として計上した科目です。実質的に自分のものとして使っているので、資産計上して毎期減価償却します。相手科目はリース債務（負債）です。',2,
    'Equipment, machinery, or vehicles held under a finance lease, capitalized because the lessee bears substantially all risks and rewards. Depreciated annually; the offsetting liability is Lease Obligations.'],
  ['のれん','Goodwill',
   '会社合併や事業買収のとき、引き継いだ会社の純資産（資産－負債）の時価より多く払った差額です。相手のブランド力・顧客基盤・技術・人材などの「見えない価値」に払ったお金で、無形固定資産として計上し20年以内で均等償却します。',2,
    'The excess paid over the fair value of net assets (assets minus liabilities) when acquiring a company or business. Represents brand value, customer base, and know-how. Recorded as an intangible asset; amortized evenly within 20 years.'],
  ['創立費','Organization Costs',
   '会社設立のためにかかった費用（定款認証費・登記費用・設立時宣伝費など）を資産計上した繰延資産です。設立直後に全額費用にせず、5年以内に均等償却して少しずつ費用化します。',2,
    'Expenses incurred to incorporate a company (charter notarization, registration fees, promotional costs at founding) recorded as a deferred asset. Amortized evenly within 5 years.'],
  ['株式交付費','Stock Issuance Costs',
   '新株（増資）を発行するためにかかった費用（印刷費・証券会社手数料・宣伝費など）を資産計上した繰延資産です。3年以内に均等償却します。当期一括計上すると損失が大きくなりすぎるため分割処理します。',2,
    'Costs incurred to issue new shares (printing, underwriting commissions, advertising) recorded as a deferred asset. Amortized evenly within 3 years to avoid a large one-time charge.'],
  ['売買目的有価証券','Trading Securities',
   '株価・債券価格の値上がり益を狙って短期的に売買するための株式・債券です。期末に時価で評価し直し、帳簿価額との差額を「有価証券評価益（収益）」または「有価証券評価損（費用）」として計上します（洗替法が原則）。',2,
    'Securities (stocks, bonds) held for short-term trading profits. Marked to market at period-end; the difference is recognized as an unrealized gain or loss in profit/loss (mark-to-market / \'washing\' method).'],
  ['満期保有目的債券','Held-to-maturity Securities',
   '満期まで保有し続けることを目的として取得した国債・社債などの債券です。時価評価は行わず「償却原価法」で評価します（取得価額と額面金額の差額を満期まで少しずつ調整する方法）。',2,
    'Bonds acquired with the intent and ability to hold until maturity. Not marked to market; evaluated using the amortized cost method, gradually adjusting book value toward face value over the holding period.'],
  ['子会社株式','Subsidiary Stocks',
   '議決権の過半数（50%超）を持つなど、実質的に支配している会社（子会社）の株式です。短期売買目的ではなく長期支配目的なので原則として取得原価で評価し、時価評価しません。',2,
    'Shares in subsidiaries (generally >50% voting control). Held for strategic control, not trading; measured at cost and not marked to market.'],
  ['関係会社株式','Affiliated Company Stocks',
   '議決権の20〜50%を持つなど、財務・経営方針に重要な影響を与えられる会社（関連会社）の株式です。子会社株式と同様に原則として取得原価で評価します。',2,
    'Shares in affiliated companies (typically 20–50% voting influence). Like subsidiary stocks, measured at cost and not marked to market.'],
  ['投資有価証券','Investment Securities',
   '売買目的でも子会社・関連会社の支配目的でもない、長期保有目的の株式・債券（「その他有価証券」）を記録する科目です。期末に時価評価し、差額は損益ではなく純資産の「その他有価証券評価差額金」に計上します。',2,
    'Long-term securities held neither for trading nor for controlling subsidiaries (\'other securities\'). Marked to market at year-end; the difference goes directly to equity as Unrealized Gains/Losses on Other Securities, not to profit/loss.'],
  ['長期前払費用','Long-term Prepaid Expenses',
   '前払いした費用のうち、決算日の翌日から1年を超えて費用になる部分です。例えば5年分の保険料を一括払いした場合、1年以内分は「前払費用（流動資産）」、1年超の部分は「長期前払費用（固定資産）」に分類します。',2,
    'The portion of prepaid expenses that will be expensed more than one year after the balance sheet date. Example: a 5-year insurance prepayment — year 1 is Prepaid Expenses (current); years 2–5 are here (non-current).'],
  ['繰延税金資産','Deferred Tax Assets',
   '税効果会計で認識する「将来の税金の節約分（前払税金）」です。会計上は費用として認めても税法上はまだ認められていない場合に生じます。将来的に税金が少なくなることが確実なときに計上する資産です。',2,
    'Under deferred tax accounting, the future tax savings arising from temporary differences where accounting expense is recognized before the tax deduction is allowed. Recorded when the future tax reduction is probable.'],
  ['別段預金','Separate Deposit',
   '増資のとき、株式申込者から受け取った申込証拠金を入れておく専用の銀行口座のお金です。株式発行が確定したら普通預金に移し、資本金（と資本準備金）に振り替えます。',2,
    'A dedicated bank account holding application deposits received from stock subscribers during a capital increase. Transferred to the ordinary account and credited to Capital Stock (and Capital Reserve) once the issuance is confirmed.'],
  ['商品','Merchandise',
   '販売用の商品を記録する科目で、分記法や売上原価対立法で使います。三分法では「繰越商品」を使いますが、それ以外の記帳方法では「商品」科目で常に在庫金額をリアルタイムで管理します。',2,
    'Goods held for sale recorded under the separate method or cost-of-sales method. Unlike the three-account method (Merchandise Inventory appears only at year-end), this account always reflects the current inventory balance in real time.'],
  ['不渡手形','Dishonored Notes',
   '期日に銀行に持ち込んだが、振出人の口座残高不足などで支払いを断られた（不渡りになった）手形を記録する科目です。受け取った側は受取手形から不渡手形に振り替え、違約金・拒絶証書費用を加算して相手に請求できます。',2,
    'Promissory notes presented to a bank on their due date but dishonored (bounced) due to insufficient funds. Reclassified from Notes Receivable; penalty fees and protest costs are added to the claim amount.'],
  ['建設仮勘定','Construction in Progress',
   '建設・製作中でまだ完成していない固定資産（建設中のビル・製作中の機械など）への支出を一時的に記録する科目です。完成・引き渡し後に正しい科目（建物・機械装置など）に振り替えます。完成するまでは減価償却しません。',2,
    'Payments for fixed assets under construction or being custom-manufactured that are not yet complete. Transferred to the proper account (Building, Machinery, etc.) upon completion and handover. Not depreciated until complete.'],
  ['未決算','Suspense Account',
   '火災・事故などで損失額や保険金額がまだ確定していない間、一時的に記録しておく科目です。例えば火災で建物が焼けた直後は未決算に計上し、保険金額が確定したときに損益や保険金収入（未収入金など）に振り替えます。',2,
    'A temporary holding account used when a loss amount or insurance claim has not yet been determined (e.g., immediately after a fire). Cleared to the appropriate income/loss account once the final amounts are confirmed.'],
  ['破産更生債権等','Bankruptcy Claims',
   '取引先が倒産や経営再建中で回収が非常に困難になった売掛金・貸付金などを通常の売掛金から分離して管理するための科目です。回収不能額に対して貸倒引当金を多額（100%近く）設定します。',2,
    'Receivables (accounts receivable, loans) from counterparties in bankruptcy or debt restructuring that are very difficult to collect. Separated from normal receivables; a near-full bad debt allowance (often 100%) is established.'],
  ['工事未収入金','Construction Receivables',
   '工事進行基準を採用している会社で、当期に計上した工事収益のうちまだ受け取っていない金額を記録する科目です。建設業特有の売掛金に相当します（完成工事未収入金とも呼ばれます）。',2,
    'Under the percentage-of-completion method, revenue recognized for the current period that has not yet been collected in cash. The construction-industry equivalent of Accounts Receivable.'],
  ['長期貸付金','Long-term Loans Receivable',
   '貸付金のうち、返済期限が決算日の翌日から1年を超えるものです。1年以内に返済される貸付金は流動資産の「貸付金」に、1年超のものはこの「長期貸付金（固定資産）」に分類します。',2,
    'Loans receivable due more than one year from the balance sheet date. Loans due within one year are classified as current assets (Loans Receivable); those due in over one year are non-current (here).'],
  ['営業外受取手形','Non-trade Notes Receivable',
   '固定資産の売却代金として受け取った手形など、通常の商品取引（営業取引）以外から生じた受取手形です。通常の受取手形と区別して管理します。',2,
    'Notes received as payment for fixed asset sales or other non-trade transactions. Segregated from ordinary trade Notes Receivable to distinguish their origin.'],
  ['営業外電子記録債権','Non-trade Electronic Receivable',
   '固定資産の売却など、通常の営業取引以外から生じた電子記録債権です。通常の電子記録債権と区別して計上します。',2,
    'Electronic receivables arising from non-trade transactions such as fixed asset sales. Distinguished from ordinary trade electronic receivables.'],
  ['諸資産','Various Assets',
   '会社合併・事業譲受の仕訳をするとき、引き継いだ全ての資産をいったんまとめて記録するための仮の科目です。後で個別の科目（現金・建物・土地など）に振り分けます。',2,
    'A composite temporary account for all assets assumed in a business combination or transfer. Later separated into individual accounts (Cash, Building, Land, etc.).'],
  // ===== 負債 =====
  ['買掛金','Accounts Payable',
   '商品を<mark>掛け（後払い）で仕入れたとき</mark>の未払代金を記録する負債科目です。<strong>営業取引の債務</strong>なので、非営業取引（固定資産購入など）の未払金とは<mark>未払金</mark>で区別します。支払手形・電子記録債務に切り替えた場合はそれぞれの科目へ振り替えます。',3,
    'Unpaid balance for <mark>credit (open-account) merchandise purchases</mark> — the liability mirror of Accounts Receivable. <strong>Key rule: Accounts Payable is ONLY for merchandise.</strong> Non-trade purchases (fixed assets, etc.) → Non-trade Payable. Can be reclassified to Notes Payable or Electronic Payable.'],
  ['支払手形','Notes Payable',
   '代金の支払いとして振り出した<mark>約束手形</mark>を記録する負債科目です。<strong>振出時に「支払手形（負債）」を計上し、期日に「当座預金」から自動引き落とし</strong>で消去します。<mark>不渡り（支払不能）</mark>になると高額の制裁があるため、残高管理が重要です。',3,
    'Promissory notes issued as payment. Recorded as liability on issue; <strong>automatically debited from Checking Account on the due date</strong>. <mark>Dishonor (failure to pay) triggers severe penalties</mark>, so maintaining adequate checking account balance is critical.'],
  ['電子記録債務','Electronic Payable',
   '買掛金や支払手形の代わりに、でんさいネット（電子債権記録機関）に登録したデジタルの支払い義務です。紙の手形と違って紛失・盗難の心配がなく、手続きが楽なため近年利用が増えています。',3,
    'A digital payment obligation registered with an electronic credit recording agency, replacing paper notes or accounts payable. No risk of loss or theft; rapidly replacing paper-based instruments.'],
  ['未払金','Non-trade Payable',
   '<mark>商品以外（固定資産・有価証券・経費など）</mark>を買ったがまだ払っていない代金を記録する負債科目です。<strong>「買掛金は商品の掛け仕入専用」</strong>、それ以外の未払いはすべて未払金を使います。給与・家賃・保険料の翌月払い分も未払金ではなく<mark>未払費用（費用見越し）</mark>と区別します。',3,
    'Unpaid amounts for <mark>non-merchandise purchases</mark> (fixed assets, securities, etc.). <strong>Rule: Accounts Payable is for merchandise ONLY.</strong> All other unpaid purchases → Non-trade Payable. Distinct from <mark>Accrued Expenses</mark> (which is for services already consumed but not yet billed).'],
  ['借入金','Borrowings',
   '銀行などから借りた<strong>元本</strong>を記録する負債科目です。利息は別科目（<mark>支払利息</mark>）で管理します。<strong>返済期限1年以内→流動負債、1年超→固定負債（長期借入金）</strong>と分類します（1年基準）。期中に返済期限が1年以内に近づいたら「長期→短期」への振り替えも必要です。',3,
    'Principal of bank loans. Interest tracked separately as <mark>Interest Expense</mark>. <strong>Due within 1 year → current liability; over 1 year → non-current (Long-term Borrowings).</strong> As repayment nears, reclassify from long-term to current.'],
  ['手形借入金','Notes Payable (Loans)',
   '銀行からお金を借りるとき、約束手形を差し入れる条件で借りたものです。普通の借入金と同様に元本を記録しますが、手形を担保として差し出している点が異なります。',3,
    'Borrowings where the borrower provides a promissory note to the lender as collateral. Recorded the same as ordinary borrowings but backed by a pledge of a note.'],
  ['未払利息','Accrued Interest Payable',
   '今期分として確定・発生しているが<strong>まだ払っていない利息</strong>を記録する負債科目（<mark>「費用の見越し」</mark>）。期末に「支払利息（費用）／未払利息（負債）」と計上し、翌期首に<strong>再振替仕訳（未払利息／支払利息）</strong>で取り消します。',3,
    'Interest <strong>accrued but not yet paid</strong> — an <mark>accrual of expense</mark>. Year-end: Dr. Interest Expense / Cr. Accrued Interest Payable. <strong>Reversing entry required at the start of next period.</strong>'],
  ['前受金','Customer Advances',
   '商品の引渡し前にお客さんからもらった<mark>手付金・内金</mark>を記録する負債科目です。<strong>まだ商品を渡していないので収益（売上）にならず</strong>、「将来渡す義務」として負債計上します。商品引渡し時に「前受金（負債）／売上（収益）」と振り替えます。',3,
    'Advance payments / deposits from customers <mark>before goods are delivered</mark>. A <strong>liability because delivery is still owed</strong>. On delivery: Dr. Customer Advances / Cr. Sales Revenue. Exam tip: contrast with <mark>Deferred Revenue</mark> (for service/rent advances).'],
  ['仮受金','Temporary Receipt',
   '入金があったが<strong>理由が不明または金額・内容が未確定</strong>のお金を一時的に記録する負債科目です。原因判明後に正しい科目（売掛金・前受金・借入金など）へ振り替えます。<mark>仮受金は「理由不明」、前受金は「理由明確だが商品未渡し」</mark>という点で異なります。',3,
    'Temporary liability for cash received with <strong>unknown or unconfirmed purpose</strong>. Reclassify to the proper account once identified. <mark>Key distinction: Temporary Receipt = unknown reason; Customer Advances = known (ordered goods, not yet delivered).</mark>'],
  ['当座借越','Bank Overdraft',
   '当座預金残高を超えて支払いが行われた<mark>超過額（銀行への短期借入）</mark>を記録する負債科目です。<strong>期中は当座預金のマイナス残高のまま管理し、期末に「当座借越（負債）」として分離表示</strong>します。借越契約の枠内で行われた自動融資です。',3,
    'The <mark>overdraft amount</mark> owed to the bank when Checking Account goes negative. <strong>During the period: keep as negative Checking Account balance; at year-end: reclassify to Bank Overdraft (liability) for separate disclosure.</strong>'],
  ['預り金','Deposits Received',
   '従業員の給与から天引きした<mark>所得税・社会保険料</mark>などを、納付するまで一時的に保管する負債科目です。<strong>「会社自身のお金ではなく、他者から預かった金銭」</strong>なので負債に計上します。内訳は<mark>所得税預り金・社会保険預り金</mark>などで管理します。',3,
    'Cash withheld from employees\' salaries (income tax, social insurance) held pending remittance to authorities. A <strong>liability because it belongs to others</strong>, not the company. Sub-accounts: <mark>Income Tax Withheld, Social Insurance Withheld</mark>.'],
  ['社会保険預り金','Social Insurance Withheld',
   '給料から天引きした、従業員負担の健康保険料・厚生年金保険料です。会社は毎月、自社負担分（法定福利費）と合わせて社会保険事務所に翌月納付します。',3,
    'Employee-share health insurance and pension premiums withheld from salaries. Remitted together with the employer share (Welfare Expense) to the social insurance authority each month.'],
  ['所得税預り金','Income Tax Withheld',
   '給料から源泉徴収（天引き）した所得税です。会社は毎月翌月10日までに税務署に納付する義務があります。年末調整で最終税額を計算し、過払い分は従業員に返還します。',3,
    'Income tax withheld at source from salaries. Remitted to the tax office by the 10th of the following month. Year-end tax adjustments reconcile the final amounts.'],
  ['未払法人税等','Corporate Tax Payable',
   '法人税の確定申告で確定した税額から<mark>中間納付済み（仮払法人税等）</mark>を差し引いた残額を記録する負債科目です。<strong>（確定税額）－（仮払法人税等）＝（未払法人税等）</strong>という計算式が頻出です。翌期に現金で納付したとき消去します。',3,
    'The remaining corporate tax after offsetting the <mark>interim prepayment (Prepaid Corporate Tax)</mark>. Formula: <strong>Tax confirmed − Prepaid Corporate Tax = Corporate Tax Payable.</strong> Paid in cash in the following period.'],
  ['未払消費税','Consumption Tax Payable',
   '課税期間中にお客さんから預かった消費税（仮受消費税）から、仕入等で払った消費税（仮払消費税）を差し引いた残りで、まだ税務署に納めていない分です。',3,
    'Net consumption tax still owed to the tax office: Consumption Tax Collected (from customers) minus Consumption Tax Paid (on purchases). The balance not yet remitted at year-end.'],
  ['仮受消費税','Consumption Tax Collected',
   '商品を売ったときにお客さんから預かった消費税を記録する科目です（税抜処理の場合）。自分の利益ではなく国（税務署）に代わって預かっているだけなので負債として計上します。',3,
    'Consumption tax collected from customers when selling goods under the tax-exclusive method. Treated as a liability because it belongs to the government — the company is merely the collection agent.'],
  ['未払配当金','Dividends Payable',
   '株主総会で「1株あたり○円の配当を払う」と決議されたが、まだ株主に払っていない配当金です。決議した時点で負債として計上し、実際に支払ったとき消去します。',3,
    'Dividends declared by the shareholders\' meeting but not yet paid to shareholders. Recorded as a liability when declared; extinguished when actually paid.'],
  ['前受収益','Deferred Revenue',
   '当期に受け取ったが<mark>次期以降に対応する収益</mark>の部分を負債として繰り延べる科目です（<strong>「収益の繰延べ」</strong>）。例：3か月先払いの家賃のうち次期分は「受取家賃／前受収益」で計上。翌期首に<strong>再振替仕訳（前受収益／受取家賃）</strong>で取り消します。',3,
    'Cash received in advance for services or rights relating to <mark>future periods</mark>. A <strong>deferral of revenue</strong>. Year-end: Dr. Rent Revenue (etc.) / Cr. Deferred Revenue. <strong>Reversing entry required at start of next period.</strong>'],
  ['未払費用','Accrued Expenses',
   '今期のサービスを受け済み（費用発生済み）だが<strong>代金をまだ払っていない</strong>費用を記録する負債科目（<mark>「費用の見越し」</mark>）。例：月末締め翌月払いの給料・利息など。期末に「費用／未払費用」と計上し、翌期首に<strong>再振替仕訳（未払費用／費用）</strong>で取り消します。',3,
    'Expenses <strong>incurred but not yet paid</strong> — an <mark>accrual of expense</mark>. Examples: month-end salary on next-month payroll, unpaid interest. Year-end: Dr. Salary Expense / Cr. Accrued Expenses. <strong>Reversing entry required at start of next period.</strong>'],
  // 2級 負債
  ['社債','Corporate Bonds',
   '会社が発行する借用証書（債券）で、広く投資家からお金を集める方法です。社債権者には定期的に利息（クーポン）を払い、満期になったら元本を一括返済します。銀行借入と異なり不特定多数に販売できます。',2,
    'Debt securities issued to investors to raise capital. Interest (coupons) is paid periodically; the principal is repaid at maturity. Unlike bank loans, bonds can be sold to the general public.'],
  ['リース債務','Lease Obligations',
   'ファイナンス・リース契約で設備・機械などを借りたときの残りの支払い義務を記録する科目です。毎月のリース料を払うたびに残高が減っていきます。相手科目はリース資産（資産）です。',2,
    'The remaining payment obligation under a finance lease for equipment, machinery, or vehicles. Reduced with each lease payment. The offsetting asset is Leased Assets.'],
  ['製品保証引当金','Product Warranty Reserve',
   '売った製品・商品に不具合が生じたとき無償修理・交換するための費用を、あらかじめ見積もって積み立てる負債です。積み立てる際は「製品保証引当金繰入（費用）」を計上し、実際に修理が発生したとき取り崩します。',2,
    'A liability estimated in advance for expected future warranty costs (free repairs/replacements) on products sold. Built up via Product Warranty Expense; drawn down when actual warranty work occurs.'],
  ['退職給付引当金','Retirement Benefit Obligation',
   '将来従業員に払う退職金の見積もり額を毎期少しずつ積み立てる負債です。毎期「退職給付費用（費用）／退職給付引当金（負債）」と仕訳し、実際に退職金を払ったとき取り崩します。',2,
    'The accumulated estimated retirement benefit obligation, accrued gradually each period. Recorded as Dr. Retirement Benefit Expense / Cr. Retirement Benefit Obligation; drawn down when retirement payments are made.'],
  ['繰延税金負債','Deferred Tax Liabilities',
   '税効果会計で認識する「将来払う税金の増加分（先送りされた税金）」です。会計上は収益として認めていないのに税法上は課税されている場合や、投資有価証券の評価益が生じている場合などに計上します。',2,
    'Under deferred tax accounting, future tax increases that arise because accounting income is recognized before it becomes taxable. Also arises from unrealized gains on investment securities.'],
  ['株式申込証拠金','Stock Subscription Deposits',
   '増資（新株発行）のとき、申込者から受け取る申込金（証拠金）を一時的に記録する科目です。株式発行が確定したとき「資本金（と資本準備金）」に振り替えます。それまでは負債として計上します。',2,
    'Application deposits received from stock subscribers during a capital increase, held as a liability until the issuance is confirmed. Then transferred to Capital Stock and Capital Reserve.'],
  ['工事未払金','Construction Payables',
   '工事進行基準を採用している会社で、計上した工事原価のうちまだ外注先や材料業者に払っていない金額です。建設業特有の買掛金に相当します。',2,
    'Under the percentage-of-completion method, construction costs accrued but not yet paid to subcontractors or material suppliers. The construction-industry equivalent of Accounts Payable.'],
  ['営業外電子記録債務','Non-trade Electronic Payable',
   '固定資産などの購入代金を電子記録（でんさいネット）にした支払い義務です。通常の商品仕入れ以外の取引から生じた電子記録債務で、通常の電子記録債務と区別して計上します。',2,
    'Electronic payment obligations arising from non-trade purchases (e.g., fixed asset acquisitions). Distinguished from ordinary trade electronic payables.'],
  ['営業外支払手形','Non-trade Notes Payable',
   '固定資産などの購入代金として振り出した手形です。通常の商品仕入れ代金の支払手形と区別して計上します。',2,
    'Promissory notes issued as payment for fixed assets or other non-trade transactions. Distinguished from ordinary trade notes payable.'],
  ['諸負債','Various Liabilities',
   '会社合併・事業譲受の仕訳をするとき、引き継いだ全ての負債をいったんまとめて記録するための仮の科目です。後で個別の科目（買掛金・借入金など）に振り分けます。',2,
    'A composite temporary account for all liabilities assumed in a business combination or transfer. Later separated into individual accounts (Accounts Payable, Borrowings, etc.).'],
  // ===== 費用 =====
  ['仕入','Purchases',
   '<mark>三分法</mark>で商品を仕入れたときに計上する費用科目です。決算時に<strong>売上原価＝期首商品（仕入へ）＋当期仕入－期末商品（仕入から）</strong>を計算します。付随費用（引取運賃など）は<strong>仕入原価に含めます</strong>（取得原価主義）。返品・値引き・割戻しは「仕入戻し・仕入値引・仕入割戻し」として仕入から差し引きます。',3,
    'Purchases of merchandise under the <mark>three-account method</mark>. COGS = Beginning Inv. + Purchases \u2212 Ending Inv. <strong>Include incidental costs (inbound freight) in cost.</strong> Returns, discounts, and rebates reduce this account.'],
  ['支払家賃','Rent Expense',
   '事務所・店舗・倉庫・駐車場などの<mark>賃借料</mark>を記録する費用科目です。翌期以降の分を前払いした場合は<strong>「前払費用（資産）」へ振り替え</strong>、未払分は<strong>「未払費用（負債）」へ見越し</strong>計上します（経過勘定の典型例）。',3,
    'Rent for offices, stores, warehouses, etc. Advance payments → <strong>Prepaid Expenses (asset)</strong>; unpaid but incurred → <strong>Accrued Expenses (liability)</strong>. Classic example of <mark>accrual adjustments (経過勘定)</mark>.'],
  ['支払手数料','Commission Expense',
   '不動産の仲介手数料・銀行の振込手数料・証券会社への売買委託手数料など、サービスに対して支払う手数料を記録する科目です。',3,
    'Fees paid for services: real estate agency fees, bank wire transfer fees, brokerage commissions, etc.'],
  ['支払利息','Interest Expense',
   '借入金・手形借入金・社債などの<mark>利息支払い</mark>を記録する費用科目です。<strong>前払い分→前払利息（資産）、未払い分→未払利息（負債）</strong>として経過勘定処理を行います。社債の割引発行時は差額を毎期<mark>社債利息</mark>に加算します。',3,
    'Interest on borrowings, promissory notes, and corporate bonds. <strong>Prepaid portion → Prepaid Interest (asset); unpaid but incurred → Accrued Interest Payable (liability).</strong> For discount bonds, the discount is also amortized into <mark>Bond Interest Expense</mark>.'],
  ['支払保険料','Insurance Expense',
   '建物・車両への<mark>火災保険・損害保険</mark>などの保険料を記録する費用科目です。翌期以降の分を前払いした場合は<strong>「前払費用（資産）」へ振り替え</strong>ます（「費用の繰延べ」）。翌期首に再振替仕訳（前払費用→支払保険料）が必要です。',3,
    'Fire / property insurance premiums. Advance payments covering future periods → <strong>Prepaid Expenses (asset)</strong> — a typical <mark>deferral of expense</mark>. Reversing entry required at the start of the next period.'],
  ['租税公課','Taxes and Dues',
   '固定資産税・印紙税・自動車税・事業所税・登録免許税など<mark>法人税・所得税・消費税を除く</mark>税金・公課を記録する費用科目です。<strong>収入印紙の購入・貼付は全額ここに計上</strong>します。期末に未使用の印紙が残れば<mark>貯蔵品（資産）</mark>へ振り替えます。',3,
    'Public taxes and levies <mark>excluding corporate income tax, personal income tax, and consumption tax</mark>: property tax, stamp tax, vehicle tax, registration tax, etc. <strong>Revenue stamps are expensed here when purchased or affixed.</strong> Unused stamps at year-end → <mark>Supplies Inventory (asset)</mark>.'],
  ['広告宣伝費','Advertising Expense',
   '新聞・テレビ・インターネット・チラシ・看板・展示会など、自社の商品やサービスを広く宣伝するための費用です。不特定多数に向けた宣伝はすべてここに計上します。',3,
    'Costs for newspaper, TV, internet, flyer, signage, and trade-show advertising to promote products or services to the general public.'],
  ['通信費','Communication Expense',
   '電話料金・郵便料金・切手・宅配便・インターネット接続料など、通信に関わる費用を記録する科目です。未使用の切手や収入印紙が期末に残っていれば「貯蔵品（資産）」に振り戻します。',3,
    'Phone bills, postage, courier services, and internet fees. Unused stamps or revenue stamps remaining at year-end are reclassified to Supplies Inventory (asset).'],
  ['旅費交通費','Travel Expense',
   '電車・バス・タクシー代、出張の宿泊費・日当など、<mark>業務上の移動に関する費用</mark>を記録します。概算で前払いした場合は一旦<mark>仮払金（資産）</mark>に計上し、精算後に旅費交通費へ振り替えます。差額が生じた場合は現金で精算します。',3,
    'Transportation (train, bus, taxi) and overnight trip expenses (accommodation, per diem). When advances are given, park them in <mark>Advance Payment (仮払金)</mark>; reclassify to Travel Expense after settlement.'],
  ['修繕費','Repair Expense',
   '建物・機械・車両を<strong>現状に戻す</strong>修理費を記録する費用科目です（<mark>収益的支出</mark>）。<strong>一方、現状を超えた機能向上工事（増築・大型改修）は「資本的支出」として固定資産に加算</strong>します。<mark>「収益的支出か資本的支出か」の判断</mark>は2級頻出の重要論点です。',3,
    'Costs to <strong>restore</strong> an asset to its original condition — a <mark>revenue expenditure</mark>. <strong>Critical distinction: improvements beyond original capability (extensions, major upgrades) are capital expenditures added to the asset cost.</strong> This <mark>revenue vs. capital expenditure judgment</mark> is a key Level 2 exam topic.'],
  ['貸倒損失','Bad Debt Expense',
   '売掛金・貸付金・受取手形などが<mark>回収不能と確定</mark>したときの損失です。<strong>①引当金あり：「貸倒引当金（資産のマイナス）」を取り崩し、超過分だけ「貸倒損失（費用）」</strong>。<strong>②引当金なし：全額「貸倒損失（費用）」</strong>。後日回収できたら<mark>償却債権取立益（収益）</mark>を計上します。',3,
    'Loss when receivables are <mark>confirmed uncollectible</mark>. <strong>① With allowance: reduce Allowance for Bad Debts first; any excess → Bad Debt Expense.</strong> <strong>② No allowance: full amount → Bad Debt Expense.</strong> Later recovery → <mark>Recovery of Written-off Claims (revenue)</mark>.'],
  ['貸倒引当金繰入','Bad Debt Allowance Expense',
   '決算時に将来の貸倒れに備えて<mark>貸倒引当金</mark>を見積もり計上する費用科目です。仕訳：<strong>「貸倒引当金繰入（費用）／貸倒引当金（資産のマイナス）」</strong>。計算式：<mark>売掛金×貸倒見積率</mark>。当期計上額と必要額の差額調整（差額補充法）も2級では重要です。',3,
    'Year-end expense to build up the <mark>Allowance for Bad Debts</mark>. Entry: <strong>Dr. Bad Debt Allowance Expense / Cr. Allowance for Bad Debts</strong>. Estimate: <mark>receivables × estimated default rate</mark>. Level 2: use the "difference method" to adjust to the required balance.'],
  ['減価償却費','Depreciation Expense',
   '固定資産の価値減少分を毎期費用化する科目です。主な方法：<strong>①定額法：（取得原価－残存価額）÷耐用年数（毎年同額）</strong>、<strong>②定率法：期首帳簿価額×定率（毎年逓減）</strong>。仕訳は<mark>間接法：「減価償却費／減価償却累計額（評価勘定）」</mark>が原則です。建物・無形固定資産などは定額法限定です。',3,
    'Periodic charge allocating fixed asset cost over useful life. <strong>\u2460 Straight-line: (Cost \u2212 Residual) \u00f7 Life (equal each year).</strong> <strong>\u2461 Declining-balance: opening book value \xd7 fixed rate (decreasing each year).</strong> Credit side: <mark>Accumulated Depreciation (contra asset, indirect method)</mark>. Buildings and intangibles \u2192 straight-line only.'],
  ['発送費','Shipping Expense',
   '商品をお客さんに届けるときの運送料・梱包費などを記録する科目です。当社が負担する場合に計上します（着払いでお客さんが負担する場合は計上しません）。',3,
    'Delivery and packaging costs when shipping goods to customers, if borne by the seller. Not recorded when the buyer pays shipping (cash on delivery).'],
  ['雑損','Miscellaneous Loss',
   '少額の損失や原因不明の現金不足など、他の費用科目に当てはまらない雑多な費用です。現金過不足の原因が期末まで判明しなかった場合の不足額もここに振り替えます。',3,
    'Small losses and miscellaneous expenses that do not fit other accounts. Unresolved cash shortages at year-end are transferred here from Cash Overage/Shortage.'],
  ['法定福利費','Welfare Expense',
   '法律で義務付けられた<mark>健康保険・厚生年金保険の会社負担分</mark>を記録する費用科目です。<strong>従業員負担分は「社会保険預り金（負債）」、会社負担分は「法定福利費（費用）」</strong>として別に記録します。毎月、両者を合算して社会保険事務所へ納付します。',3,
    'Employer\'s share of <mark>health insurance and pension contributions</mark>. <strong>Employee share \u2192 Social Insurance Withheld (liability); employer share \u2192 Welfare Expense.</strong> Both are remitted together to the social insurance authority each month.'],
  ['給料','Salaries',
   '従業員への基本給・残業代・手当などを記録する費用科目です。支払い時は<mark>所得税（所得税預り金）・社会保険料（社会保険預り金）・立替金を差し引いた手取り額</mark>のみを現金等で支払います。<strong>仕訳の借方は総支給額全額、貸方の合計も一致させること</strong>が重要です。',3,
    'Gross wages and allowances. At payment: <mark>Debit: full gross salary; Credits: Income Tax Withheld + Social Insurance Withheld + Advances Paid for Others + Cash (net pay)</mark>. <strong>Always debit gross; credits must sum to the same total.</strong>'],
  ['法人税等','Corporate Tax Expense',
   '会社の<mark>年間利益に課される法人税・地方法人税・住民税・事業税の合計</mark>を記録する費用科目（3級での略称）。期末仕訳：<strong>「法人税等（費用）／仮払法人税等（資産取消し）＋未払法人税等（負債）」</strong>の3行で確定させます。翌期に現金納付で未払法人税等を消去します。',3,
    'The combined <mark>corporate income tax, local corporate tax, inhabitant\'s tax, and enterprise tax</mark>. Year-end three-line entry: <strong>Dr. Corporate Tax Expense / Cr. Prepaid Corporate Tax (cancel) + Cr. Corporate Tax Payable (remainder)</strong>. Paid in cash the following period.'],
  ['固定資産売却損','Loss on Sale of Fixed Assets',
   '固定資産を売ったとき、<mark>売却価格＜帳簿価額（取得原価－減価償却累計額）</mark>の場合の差額損失を記録します。仕訳：<strong>現金（売却額）＋減価償却累計額＋固定資産売却損（差額）　／　建物（取得原価）</strong>の形が頻出です。',3,
    'Loss when <mark>sale price < book value (cost − accumulated depreciation)</mark>. Typical entry: <strong>Dr. Cash + Dr. Accumulated Depr. + Dr. Loss on Sale / Cr. Building (at cost)</strong>. The loss is the balancing figure.'],
  ['消耗品費','Supplies Expense',
   'ペン・コピー用紙・電球など<mark>短期間で使い切る消耗品</mark>の費用です。期末に未使用分が残れば<strong>「消耗品（資産）」へ振り替え</strong>ます（翌期首に再振替）。購入時に「消耗品（資産）」とした場合は、期末使用分を費用へ振り替えます（どちらの方法も頻出）。',3,
    'Short-lived consumables (pens, paper, bulbs, etc.). <strong>If expensed when purchased:</strong> reverse unused amount to <mark>Supplies (asset)</mark> at year-end. <strong>If treated as asset when purchased:</strong> expense the used portion at year-end. Both methods appear on exams.'],
  ['手形売却損','Loss on Sale of Notes',
   '受取手形を期日前に銀行で<mark>割り引いて（現金化して）</mark>もらうときに支払う手数料（割引料）を記録する費用科目です。<strong>割引料＝手形額面×割引率×残存日数÷365</strong>。手取金＝手形額面－割引料。仕訳：<strong>「現金（手取金）＋手形売却損（割引料）　／　受取手形（額面）」</strong>が頻出です。',3,
    'Discount fee for early <mark>discounting (early cashing)</mark> of a received note at a bank. <strong>Fee = Face value × discount rate × remaining days ÷ 365.</strong> Proceeds = Face value − Fee. Entry: <strong>Dr. Cash (proceeds) + Dr. Loss on Sale of Notes (fee) / Cr. Notes Receivable (face value)</strong>.'],
  // 2級 費用
  ['売上原価','Cost of Goods Sold',
   '売れた商品の仕入れコストを記録する科目で、「期首商品＋当期仕入－期末商品」で計算します。分記法や売上原価対立法では商品を売るたびにリアルタイムで売上原価を計上します。',2,
    'Total cost of goods actually sold: Beginning Inventory + Purchases − Ending Inventory. Under the separate and cost-of-sales methods, recognized in real time at each sale rather than at period-end.'],
  ['棚卸減耗損','Inventory Shrinkage Loss',
   '実際に倉庫で数えた在庫数量（実地棚卸）が帳簿の数量より少ないときの差額損失です。盗難・紛失・腐敗・破損などが原因です。正常な範囲の減耗は売上原価に算入し、異常な減耗は特別損失に計上します。',2,
    'The loss from actual inventory being less than the book quantity, due to theft, loss, spoilage, or damage. Normal shrinkage is included in cost of goods sold; abnormal amounts are extraordinary losses.'],
  ['商品評価損','Merchandise Write-down',
   '在庫商品の正味売却価額（今売ったらいくらになるか）が帳簿価額（取得原価）より低くなったときの差額損失です。在庫を実勢価格より高い金額で帳簿に載せることを禁じる「低価法」から生じます。',2,
    'The loss when inventory\'s net realizable value (estimated selling price minus selling costs) falls below its book cost. Required under the lower-of-cost-or-market rule to prevent overstating assets.'],
  ['有価証券評価損','Loss on Valuation of Securities',
   '売買目的有価証券を期末に時価評価したとき、時価が帳簿価額より低かった場合の差額損失です。翌期首には帳簿価額を時価に修正して（洗替法）再スタートします。',2,
    'When trading securities are marked to market at year-end and market value is below book value, the difference is recognized as a loss. Under the \'washing\' method, book value is reset to market at the start of the next period.'],
  ['有価証券売却損','Loss on Sale of Securities',
   '株式・債券などの有価証券を売ったとき、売却価格が帳簿価額より低かった場合の差額損失を記録する科目です。',2,
    'The loss when securities (stocks, bonds) are sold for less than their book value.'],
  ['電子記録債権売却損','Loss on Electronic Receivable Sale',
   '電子記録債権を期日前に金融機関に売却（割り引き）したときの手数料分の損失です。手形売却損の電子記録版です。',2,
    'The discount fee when an electronic receivable is sold (discounted) to a financial institution before maturity — the electronic equivalent of Loss on Sale of Notes.'],
  ['債権売却損','Loss on Sale of Receivables',
   '売掛金などの債権を第三者（ファクタリング会社など）に売却したとき、売却額が帳簿価額を下回った差額を記録する科目です。',2,
    'The loss when accounts receivable or other claims are sold to a third party (e.g., a factoring company) for less than their book value.'],
  ['社債利息','Bond Interest Expense',
   '社債の保有者（社債権者）に支払う利息を記録する科目です。額面金額×クーポン利率で計算します。社債を割引発行した場合は、割引額も毎期「社債利息」として追加計上（社債の帳簿価額を増加させる）します。',2,
    'Interest paid to bondholders: face value × coupon rate. If bonds were issued at a discount, the discount is also amortized into this account each period (increasing the bond\'s book value toward face value).'],
  ['のれん償却','Goodwill Amortization',
   '資産として計上したのれんを毎期少しずつ費用化していく科目です。計上した全額を最長20年以内に均等償却します（例：5年均等なら毎期のれん残高の20%を費用計上）。',2,
    'The periodic amortization of capitalized goodwill, expensed evenly within 20 years. Example: over 5 years, 20% of the goodwill balance is expensed each period.'],
  ['退職給付費用','Retirement Benefit Expense',
   '当期に発生した従業員への退職給付義務の増加分を費用として計上する科目です。毎期「退職給付費用（費用）／退職給付引当金（負債）」と仕訳し、実際に退職金を払ったとき引当金を取り崩します。',2,
    'The current-period increase in the retirement benefit obligation recognized as an expense. Journal entry: Dr. Retirement Benefit Expense / Cr. Retirement Benefit Obligation.'],
  ['製品保証引当金繰入','Product Warranty Expense',
   '売った製品への保証費用を見積もって製品保証引当金を積み立てるための費用科目です。「製品保証引当金繰入（費用）／製品保証引当金（負債）」と計上します。',2,
    'The periodic expense of building up the product warranty reserve based on estimated future warranty costs. Journal entry: Dr. Product Warranty Expense / Cr. Product Warranty Reserve.'],
  ['法人税・住民税及び事業税','Corporate Tax (Full Name)',
   '法人税・地方法人税・住民税・事業税の合計額で、2級での正式な表記です。3級では「法人税等」と略して記載することもあります。実務ではこの正式名称を使います。',2,
    'The full legal name for the combined corporate tax, local corporate tax, inhabitant\'s tax, and enterprise tax — used on the Level 2 exam and in actual practice.'],
  ['火災損失','Fire Loss',
   '火災によって建物・商品・備品などが焼失したときの損失を記録する科目です。焼失した固定資産の帳簿価額が損失となります。火災保険に入っていれば保険金で補填でき、差し引いた残りが実質的な損失です。',2,
    'The loss from buildings, merchandise, or equipment destroyed by fire. The book value of the destroyed assets is the loss. Fire insurance proceeds offset it; any excess over the loss is Insurance Proceeds Gain.'],
  ['固定資産除却損','Loss on Retirement of Assets',
   '固定資産を帳簿から取り除くとき（廃棄・取り壊し・使用不能時）の未償却残高（帳簿価額）を損失として計上します。例えば帳簿価額50万円の機械を廃棄すれば50万円の除却損が発生します。',2,
    'The un-depreciated book value recognized as a loss when a fixed asset is removed from service (discarded, demolished, or rendered unusable). Example: retiring machinery with a ¥500,000 book value → ¥500,000 loss.'],
  ['固定資産廃棄損','Loss on Disposal of Assets',
   '固定資産を実際に廃棄処分したときの帳簿価額を損失計上する科目で、除却損とほぼ同義です。廃棄費用（解体費など）がかかる場合はそれも加算します。',2,
    'Similar to Loss on Retirement; recognized when a fixed asset is physically disposed of. Any disposal costs (e.g., demolition fees) are added to the loss.'],
  ['工事原価','Construction Cost',
   '工事進行基準を採用している場合に、その期に計上した工事収益に対応する実際の工事費用（材料費・労務費・外注費など）を記録する科目です。',2,
    'Under the percentage-of-completion method, the actual construction costs (materials, labor, subcontracting, etc.) matched against Construction Revenue recognized in the period.'],
  // ===== 収益 =====
  ['売上','Sales Revenue',
   '会社の<mark>本業（商品・サービス販売）</mark>から得る収益の基本科目です。返品・値引き・割戻しは「売上戻り・売上値引・売上割戻し」として差し引き、<strong>純売上高を算出</strong>します。掛けで売った場合は「売掛金／売上」、手形受取なら「受取手形／売上」と仕訳します。',3,
    'Revenue from the company\'s <mark>core business</mark>. Returns, discounts, and rebates reduce gross sales to arrive at <strong>net sales</strong>. For credit sales: Dr. Accounts Receivable / Cr. Sales. For note: Dr. Notes Receivable / Cr. Sales.'],
  ['受取家賃','Rent Revenue',
   '所有する建物・土地を貸して得る<mark>家賃・地代収入</mark>です。<strong>営業外収益（本業以外の副収入）</strong>に分類されます。翌期以降の分を先にもらった場合は<mark>前受収益（負債）</mark>へ、未回収分は<mark>未収収益（資産）</mark>へ計上します（経過勘定処理）。',3,
    'Rent received for owned buildings or land — <strong>non-operating income</strong>. Advance receipts for future periods → <mark>Deferred Revenue (liability)</mark>; earned but not yet received → <mark>Accrued Revenue (asset)</mark>. Classic accrual adjustment target.'],
  ['受取手数料','Commission Revenue',
   '仲介・代理・紹介などのサービスに対してもらう手数料収入です。不動産仲介手数料・金融商品の販売手数料・代理店手数料などが該当します。',3,
    'Fees received for brokerage, agency, or referral services: real estate agent commissions, financial product sales fees, dealer fees, etc.'],
  ['受取利息','Interest Revenue',
   '銀行預金・貸付金などに対して受け取る<mark>利息収入</mark>です（<strong>営業外収益</strong>）。当期分だがまだ受け取っていない利息は<mark>未収利息（資産）</mark>として見越し計上し、翌期首に再振替します。<strong>有価証券（社債等）の利息は「有価証券利息」で区別</strong>します（2級）。',3,
    'Interest on bank deposits and loans — <strong>non-operating income</strong>. Earned but not yet received → <mark>Accrued Interest Receivable (asset)</mark>. Level 2: <strong>bond coupon income → Interest on Securities (separate account)</strong>.'],
  ['固定資産売却益','Gain on Sale of Fixed Assets',
   '固定資産を売ったとき、<mark>売却価格＞帳簿価額（取得原価－減価償却累計額）</mark>の場合の差額利益を記録します。仕訳：<strong>「現金（売却額）＋減価償却累計額　／　建物（取得原価）＋固定資産売却益（差額）」</strong>の形が頻出です。',3,
    'Gain when <mark>sale price > book value</mark>. Entry: <strong>Dr. Cash + Dr. Accumulated Depr. / Cr. Building (at cost) + Cr. Gain on Sale of Fixed Assets (balancing figure)</strong>.'],
  ['受取配当金','Dividend Revenue',
   '保有している株式に対して、その会社（投資先）から受け取る配当金収入です。投資先企業が利益の一部を株主に分配するものです。',3,
    'Dividends received from companies in which shares are held. Represents a distribution of the investee company\'s profits to its shareholders.'],
  ['償却債権取立益','Recovery of Written-off Claims',
   '以前に<mark>貸倒損失（費用）として全額処理した債権</mark>が後日一部または全額回収できたときに計上する収益科目です。<strong>「現金／償却債権取立益」の仕訳1本</strong>だけで記録します（貸倒引当金の補充などは不要）。3級・2級ともに頻出の科目です。',3,
    'Revenue when a previously written-off receivable is unexpectedly recovered. <strong>Simple entry: Dr. Cash / Cr. Recovery of Written-off Claims.</strong> No need to reinstate the old allowance or bad debt entry. Appears on both Level 3 and Level 2 exams.'],
  ['雑益','Miscellaneous Revenue',
   '少額の収益や原因不明の現金超過など、他の収益科目に当てはまらない雑多な収益を記録する科目です。現金過不足の原因が期末まで判明しなかった超過額もここに振り替えます。',3,
    'Small incidental revenues and other income that does not fit other accounts. Unresolved cash overages at year-end are transferred here from Cash Overage/Shortage.'],
  // 2級 収益
  ['有価証券売却益','Gain on Sale of Securities',
   '株式・債券などの有価証券を売ったとき、売却価格が帳簿価額より高かった場合の差額利益を記録する科目です。',2,
    'The gain when securities (stocks, bonds) are sold for more than their book value.'],
  ['有価証券評価益','Gain on Valuation of Securities',
   '売買目的有価証券を期末に時価評価したとき、時価が帳簿価額より高かった場合の差額利益です。翌期首には帳簿価額を時価に修正して（洗替法）再スタートします。',2,
    'When trading securities are marked to market at year-end and market value is above book value, the difference is recognized as a gain. Book value is reset at the start of next period (washing method).'],
  ['有価証券利息','Interest on Securities',
   '保有している社債・国債などの債券から受け取る利息（クーポン収入）を記録する科目です。受取利息が預金等の利息なのに対し、有価証券利息は債券の利息に使います。',2,
    'Coupon income received from bonds (corporate bonds, government bonds) held. Distinct from Interest Revenue, which covers deposit and loan interest.'],
  ['工事収益','Construction Revenue',
   '工事進行基準を採用している会社で認識する、工事の進捗に応じた収益です。「完成した工事の割合（進捗率）×工事合計請負代金」で計算し、工事完了前でも進んだ分だけ毎期収益計上します。',2,
    'Under the percentage-of-completion method, revenue recognized proportional to the stage of completion: completion % × total contract price. Recognized each period as work progresses.'],
  // ===== 純資産 =====
  ['資本金','Capital Stock',
   '株主が会社へ出資したお金の<mark>元手部分</mark>を記録する純資産科目です。<strong>株主は出資額を超えた責任を負わない（有限責任）</strong>代わりに、会社は必ずしも返済しません（返済不要）。増資時は払込金額の<strong>1/2以上を資本金、残りを資本準備金</strong>に計上できます（会社法）。',3,
    'Capital contributed by shareholders. <strong>Limited liability: shareholders\' maximum loss = amount invested.</strong> No repayment obligation. On new share issuance: <strong>at least half of proceeds &#x2192; Capital Stock; remainder may go to Capital Reserve</strong> (Companies Act).'],
  ['繰越利益剰余金','Retained Earnings',
   '過去から積み上げてきた<mark>利益の蓄積</mark>を記録する純資産科目です。<strong>毎期：当期純利益が加算、配当金・準備金積立てで減少</strong>します。株主総会で「①繰越利益剰余金（借方）→②未払配当金（貸方）＋利益準備金（貸方）＋別途積立金（貸方）」の振替仕訳が2級で頻出です。',3,
    'Cumulative past profits retained in the business. <strong>Increased by Net Income; decreased by dividends and transfers to reserves.</strong> Level 2 key entry (shareholders\' meeting): <strong>Dr. Retained Earnings / Cr. Dividends Payable + Cr. Legal Reserve + Cr. Other reserves.</strong>'],
  ['利益準備金','Legal Earned Reserve',
   '会社法で義務付けられた<mark>法定積立金</mark>の一つです。<strong>配当金×1/10を積み立て（資本金の1/4に達するまで）</strong>という計算が試験で頻出です。積立限度額＝<strong>資本金÷4－（資本準備金＋利益準備金残高）</strong>。損失補填・減資・資本金の組み入れに使えます。',3,
    'Statutory earned reserve. <strong>Required contribution: 10% of each dividend payment, until the total of Capital Reserve + Legal Earned Reserve = Capital Stock ÷ 4.</strong> Formula: limit = <strong>Capital Stock ÷ 4 − (Capital Reserve + current Legal Earned Reserve)</strong>. Frequently tested at Level 2.'],
  // 2級 純資産
  ['資本準備金','Capital Reserve',
   '会社法で義務付けられた法定準備金のもう一つです。株式を発行するとき、払込金額の2分の1以上を資本準備金として積み立てます（残りは資本金）。利益準備金と合わせて「法定準備金」と呼ばれます。',2,
    'The other statutory reserve required by the Companies Act. At least half of the stock issuance price must be credited here (the remainder to Capital Stock). Together with the Legal Earned Reserve, called the \'Legal Reserve.\''],
  ['別途積立金','Special Reserve',
   '会社が自由に決める任意積立金です。将来の設備投資・損失補填・配当の安定化などの目的で積み立てます。法律で義務付けられているわけではなく、取締役会や株主総会の決議で積み立て・取り崩しができます。',2,
    'A voluntary reserve set aside at the company\'s discretion (not required by law) for future purposes such as facility investment, loss coverage, or dividend stability. Can be accumulated or released by board or shareholder resolution.'],
  ['その他資本剰余金','Other Capital Surplus',
   '資本取引（出資や自己株式の処分など）から生じる資本準備金以外の剰余金です。自己株式を売却したときの売却差益（自己株式処分差益）などがここに計上されます。',2,
    'Capital surplus other than the Capital Reserve, arising from capital transactions such as gains from disposing of treasury stock (excess of selling price over cost).'],
  ['自己株式','Treasury Stock',
   '会社が自社の発行済み株式を市場から買い戻したもの（金庫株）です。純資産のマイナスとして貸借対照表に計上します。買い戻した株式は再発行（処分）したり消却したりできます。',2,
    'The company\'s own shares repurchased from the market (\'treasury shares\'). Recorded as a deduction (negative amount) in shareholders\' equity on the balance sheet. Can be reissued or cancelled.'],
  ['新株予約権','Stock Warrants',
   '将来一定の価格で株式を買える権利です。ストックオプション（役員・従業員への付与）や新株予約権付社債（転換社債型）などが代表例です。発行時に純資産に計上し、行使されたとき資本金等に振り替えます。',2,
    'The right to purchase company shares at a fixed price in the future. Common forms: stock options granted to executives/employees, and warrants attached to convertible bonds. Recorded in equity when issued; transferred to Capital Stock when exercised.'],
  ['その他有価証券評価差額金','Unrealized Gains/Losses on Securities',
   '投資有価証券（その他有価証券）を期末に時価評価したときの差額を、損益にではなく直接純資産に計上した金額です。税効果会計で税額を差し引いた後の純額が純資産に計上されます。',2,
    'The after-tax net change in fair value of \'other securities\' (investment securities) at period-end, recorded directly in equity rather than in profit or loss. Positive = unrealized gain; negative = unrealized loss.'],
  // ===== 評価勘定・その他 =====
  ['貸倒引当金','Allowance for Bad Debts',
   '売掛金・受取手形などの<mark>回収不能見積額を差し引く評価勘定（資産のマイナス）</mark>です。B/S上は資産から差し引いて表示します。<strong>貸倒発生時は「貸倒引当金（取崩し）→貸倒損失（超過分のみ費用）」</strong>の順で処理します。「差額補充法」では既存残高との差額だけ追加計上します（2級）。',3,
    'A <mark>contra asset</mark> reducing the carrying value of receivables by the estimated uncollectible amount. Displayed as a deduction on the balance sheet. <strong>On write-off: reduce Allowance first, then charge any excess to Bad Debt Expense.</strong> Level 2: "difference method" — only add the incremental amount needed.'],
  ['減価償却累計額','Accumulated Depreciation',
   '固定資産に対してこれまで計上した<mark>減価償却費の累計額を記録する評価勘定（資産のマイナス）</mark>です。<strong>帳簿価額（簿価）＝取得原価－減価償却累計額</strong>。売却時に全額取り崩し（借方計上）します。「間接法」の必須科目で、直接法では使いません。',3,
    'A <mark>contra asset</mark> recording total depreciation since acquisition. <strong>Book value = Cost − Accumulated Depreciation.</strong> On disposal, debit (cancel) the full accumulated amount. Used under the <mark>indirect method</mark>; not used under the direct method.'],
  ['損益','Income Summary',
   '決算時に<mark>全収益・全費用を集合させて当期純利益（純損失）を計算</mark>する一時的な勘定です。<strong>①収益→損益の貸方、②費用→損益の借方、③差額（利益）→繰越利益剰余金の貸方</strong>と振り替え、最終残高はゼロになります。3級・2級の決算整理仕訳の核心です。',3,
    'Temporary year-end account that gathers all revenues and expenses to compute net income. Closing sequence: <strong>① All revenues → credit Income Summary; ② All expenses → debit Income Summary; ③ Net income (balance) → credit Retained Earnings.</strong> Ends at zero.'],
  // 2級 評価勘定
  ['建物減価償却累計額','Accum. Depr. (Building)',
   '建物のこれまでの減価償却費の合計額です。貸借対照表で「建物（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Building account. Shown as a deduction from Buildings on the balance sheet.'],
  ['備品減価償却累計額','Accum. Depr. (Equipment)',
   '備品のこれまでの減価償却費の合計額です。貸借対照表で「備品（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Equipment account. Shown as a deduction from Equipment on the balance sheet.'],
  ['車両運搬具減価償却累計額','Accum. Depr. (Vehicles)',
   '車両運搬具のこれまでの減価償却費の合計額です。貸借対照表で「車両運搬具（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Vehicles account. Shown as a deduction from Vehicles on the balance sheet.'],
  ['機械装置減価償却累計額','Accum. Depr. (Machinery)',
   '機械装置のこれまでの減価償却費の合計額です。貸借対照表で「機械装置（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Machinery account. Shown as a deduction from Machinery on the balance sheet.'],
  ['構築物減価償却累計額','Accum. Depr. (Structures)',

   '直接工員以外の補助的な作業者（間接工・パート・臨時工など）の給与を記録します。<strong>製造間接費として処理</strong>され、製品への直接割り当てではなく、配賦基準（作業時間など）で各製品に間接的に配分します。','労務費',
    'Wages for indirect workers (supervisors, maintenance staff, part-time workers). Classified as Manufacturing Overhead and allocated to products using an allocation base (e.g., machine hours).'],
  ['従業員賞与手当','Employee Bonuses and Allowances',
   '工場の従業員に支払う賞与・各種手当（残業手当・通勤手当・家族手当など）を記録します。<mark>直接工員分は直接労務費、間接工員分は製造間接費</mark>として処理します。','労務費',
    'Bonuses and allowances (overtime, commuting, family) paid to factory workers. Direct workers\' amounts are Direct Labor; indirect workers\' amounts go to Manufacturing Overhead.'],
  // --- 製造間接費 ---
  ['製造間接費','Manufacturing Overhead',
   '特定の製品に直接割り当てられない<strong>工場全体にかかる費用</strong>を一時的にまとめる科目です。間接材料費・間接労務費・工場の家賃・電力代・減価償却費などが含まれます。期末に<mark>配賦基準（機械時間・直接労務時間など）</mark>で各製品に配分（配賦）します。','製造間接費',
    'A temporary collection account for all indirect factory costs that cannot be directly traced to individual products: indirect materials, indirect labor, factory rent, utilities, depreciation, etc. Allocated to products using an allocation base.'],
  ['外注加工費','Subcontract Costs',
   '自社工場で加工できない工程を<strong>外部の会社に委託（外注）</strong>した加工費用です。直接外注できる場合は直接費として仕掛品に計上し、間接的な場合は製造間接費に含めます。','製造間接費',
    'Fees paid to outside contractors for manufacturing processes the company cannot perform in-house. Treated as direct costs if traceable to a specific job; otherwise included in Manufacturing Overhead.'],
  // --- 原価差異 ---
  ['材料消費価格差異','Material Price Variance',
   '標準原価計算で、<strong>材料の実際購入価格と標準価格の差額</strong>に消費数量をかけたものです。実際価格が標準より高ければ「不利差異（借方）」、低ければ「有利差異（貸方）」となります。<mark>原材料の価格変動や購買効率</mark>を測る指標です。','原価差異',
    'In standard costing, the difference between actual purchase price and standard price, multiplied by actual quantity consumed. Unfavorable (debit) if actual > standard; favorable (credit) if actual < standard. Measures purchasing efficiency.'],
  ['材料消費数量差異','Material Quantity Variance',
   '標準原価計算で、<strong>材料の実際消費量と標準消費量の差額</strong>に標準価格をかけたものです。実際消費量が多ければ不利差異（無駄遣い）、少なければ有利差異（節約）を示します。<mark>製造現場の材料使用効率</mark>を表します。','原価差異',
    'In standard costing, the difference between actual quantity consumed and standard quantity allowed for actual output, multiplied by the standard price. Measures how efficiently materials were used in production.'],
  ['賃率差異','Wage Rate Variance',
   '標準原価計算で、<strong>実際賃率と標準賃率の差額</strong>に実際作業時間をかけたものです。予想より高い賃率で雇用した場合に不利差異が生じます。<mark>人件費のコントロール</mark>を管理する指標です。','原価差異',
    'In standard costing, the difference between the actual wage rate and the standard rate, multiplied by actual hours worked. An unfavorable variance indicates labor was paid at a higher rate than budgeted.'],
  ['作業時間差異','Labor Efficiency Variance',
   '標準原価計算で、<strong>実際作業時間と標準作業時間の差額</strong>に標準賃率をかけたものです。実際作業時間が多いほど不利差異（非効率）となります。<mark>作業員の生産性・作業効率</mark>を測る指標です。','原価差異',
    'In standard costing, the difference between actual hours worked and standard hours allowed for actual output, multiplied by the standard rate. Measures worker productivity — more hours than standard = unfavorable.'],
  ['製造間接費予算差異','MOH Budget Variance',
   '標準原価計算で、<strong>製造間接費の実際発生額と予算額の差額</strong>です（固定費部分は予算額、変動費部分は実際操業度に対応する予算額と比較）。コスト管理上の<mark>無駄遣いや節約</mark>を示します。','原価差異',
    'In standard costing, the difference between actual overhead incurred and the budgeted overhead for the actual level of activity. Indicates whether overhead spending was controlled within budget.'],
  ['製造間接費能率差異','MOH Efficiency Variance',
   '標準原価計算で、<strong>実際操業度と標準操業度の差額</strong>に変動費率（または標準配賦率）をかけたものです。作業効率の良し悪しが製造間接費に与えた影響を示します。<mark>作業時間差異の製造間接費版</mark>です。','原価差異',
    'In standard costing, the overhead impact of working more or fewer hours than the standard hours allowed for actual output. The manufacturing overhead analog of the Labor Efficiency Variance.'],
  ['製造間接費操業度差異','MOH Volume Variance',
   '標準原価計算で、<strong>実際操業度と基準操業度の差額</strong>に固定費率をかけたものです。工場を十分に稼働させているかどうか（遊休設備の有無）を示す差異です。<mark>操業度が低いと不利差異</mark>（固定費の回収不足）となります。','原価差異',
    'In standard costing, the difference between actual activity level and normal (standard) capacity, multiplied by the fixed overhead rate. Indicates whether fixed overhead was fully absorbed — low activity leads to an unfavorable (under-absorbed) variance.'],
  // --- 本社・工場 ---
  ['本社','Head Office (Factory Books)',
   '工場が独立した帳簿を持つ「<strong>本社工場会計</strong>」において、工場の帳簿に記録する科目です。本社から送られてきた材料費・経費などを「本社」勘定で受け取ります。本社の「工場」勘定と対応関係にあります。','本社・工場',
    'In head-office/factory accounting (where the factory keeps separate books), the account on the factory\'s books for resources received from the head office. The mirror of the \'Factory\' account on the head office\'s books.'],
  ['工場','Factory (Head Office Books)',
   '本社工場会計において、<strong>本社の帳簿に記録する科目</strong>です。工場に送った材料費・経費・設備費などを「工場」勘定で処理します。工場の「本社」勘定と対応し、合算すると消去される内部勘定です。','本社・工場',
    'In head-office/factory accounting, the account on the head office\'s books for resources sent to the factory. The mirror of the \'Head Office\' account on the factory\'s books. Both accounts are eliminated when combining statements.'],
  ['月次損益','Monthly Profit and Loss',
   '本社工場会計で、工場が当月に計上した<mark>損益（製品原価に含まれる損益）</mark>を本社に報告するために使う科目です。月末に工場の損益を本社に振り替える仕訳で使用します。','本社・工場',
    'In head-office/factory accounting, the account the factory uses to report its monthly profit or loss (product cost result) to the head office. Used at month-end when the factory transfers its cost results to the head office.'],
