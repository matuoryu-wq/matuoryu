  { id:402, level:2, cat:'株式発行', chap:'第10章：株式会社会計',
    q:'株主総会の決議により①資本準備金600,000円を資本金に組み入れ、②繰越利益剰余金400,000円を利益準備金に積み立てた。各仕訳を行いなさい。',
    exp:'①資本準備金を資本金に組み入れるのは、予備の資本金を正式な資本金に昇格させる処理です。②繰越利益剰余金を利益準備金に積み立てるのは、稼いだ利益の一部を、法律で定められた将来への備えに振り分ける処理です。どちらも純資産の中で科目が変わるだけで、純資産合計そのものは変化しません。配当を行う際には、この利益準備金の積み立てが会社法上義務づけられています。',
    e:[{d:[['資本準備金',600000]],c:[['資本金',600000]]},{d:[['繰越利益剰余金',400000]],c:[['利益準備金',400000]]}]
  },

  // ===== 特殊商品売買・収益認識（追加）=====
  { id:403, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（委託販売・委託者の仕訳）A社（委託者）はB社（受託者）に商品（原価240,000円）を積送した。後日、B社から売上計算書（販売額400,000円・受託手数料20,000円・送金額380,000円）が届き現金が振り込まれた。A社の①積送時②計算書受取・入金時③売上原価振替の仕訳を行いなさい。',
    exp:'委託販売では、商品を発送しただけではまだ「売れた」ことにはなりません。①商品を送った時点では、まだ自社の在庫が場所を変えただけなので「積送品」という資産に振り替えます。②実際にB社が販売して売上計算書が届いた時点で、初めて売上（収益）を認識します。③それと同時に、積送品としていた原価を売上原価に振り替えて、収益と費用を対応させます。',
    e:[{d:[['積送品',240000]],c:[['仕入',240000]]},{d:[['現金',380000],['支払手数料',20000]],c:[['売上',400000]]},{d:[['売上原価',240000]],c:[['積送品',240000]]}]
  },

  { id:404, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（委託販売・受託者の仕訳）B社（受託者）はA社（委託者）から委託された商品を現金400,000円で全量販売した。手数料20,000円を差し引いた380,000円をA社に現金送金した。B社の①販売時②手数料計上③送金時の仕訳を行いなさい。',
    exp:'受託者にとって、預かった商品は自分のものではなく、売れた代金もそのまま自分の売上にはなりません。①販売代金は「委託者から預かっているお金」として、いったん「受託販売」という負債に計上します。②自分の取り分である手数料だけが本当の収益（受取手数料）です。③残りの代金を委託者に送金すると、預かっていた負債（受託販売）が消えます。委託者と受託者で、まったく違う視点から同じ取引を記録している点に注目しましょう。',
    e:[{d:[['現金',400000]],c:[['受託販売',400000]]},{d:[['受託販売',20000]],c:[['受取手数料',20000]]},{d:[['受託販売',380000]],c:[['現金',380000]]}]
  },

  { id:405, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（試用販売・手許商品区分法）A社は商品（原価150,000円）を得意先に試用のため発送した。後日、得意先から購入の意思表示があり代金250,000円を現金で受け取った。A社の①試送時②意思表示受取・代金受取時③売上原価計上の仕訳を行いなさい。',
    exp:'試用販売は「まず試してもらい、気に入ったら買ってもらう」という売り方です。①商品を発送しただけの段階では、まだお客様が買うと決めていないので「試用品」という資産に振り替えるだけで、売上にはしません。②お客様が実際に「買います」と意思表示した瞬間に、初めて売上を認識します。③それと同時に試用品としていた原価を売上原価に振り替えます。「お客様の意思表示があって初めて取引が確定する」という点が、通常の販売との違いです。',
    e:[{d:[['試用品',150000]],c:[['仕入',150000]]},{d:[['現金',250000]],c:[['売上',250000]]},{d:[['仕入',150000]],c:[['試用品',150000]]}]
  },

  { id:406, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（割賦販売・収益認識基準）B社は商品（原価200,000円）を割賦で販売した（販売価額450,000円・毎月15,000円×30回払い）。収益認識基準では商品の引渡し時点に全額認識する。①販売（商品引渡）時②初回割賦金受取時の仕訳を行いなさい。',
    exp:'割賦販売（分割払いでの販売）でも、現在の収益認識基準では「お客様に商品の支配が移った時点」、つまり商品を引き渡した時点で売上の全額を計上します。以前は代金を受け取るたびに少しずつ売上を計上する方法も認められていましたが、今は「モノを渡した時点で、売る側の義務は基本的に果たされている」という考え方に統一されています。毎回の入金は、すでに計上済みの売掛金（割賦売掛金）を回収しているだけです。',
    e:[{d:[['割賦売掛金',450000]],c:[['売上',450000]]},{d:[['売上原価',200000]],c:[['商品',200000]]},{d:[['現金',15000]],c:[['割賦売掛金',15000]]}]
  },

  // ===== リース会計（追加）=====
  { id:407, level:2, cat:'リース会計', chap:'無形資産・リース・引当金',
    q:'ファイナンス・リース取引（利子抜き法）：リース物件の現金購入価額1,000,000円・リース料総額1,200,000円・リース期間5年・年間リース料240,000円（1年目の利息：1,000,000円×4%=40,000円）。①リース開始時②1年目リース料支払時（元本と利息を分けて処理）の仕訳を行いなさい。',
    exp:'利子抜き法は、リース資産・リース債務の金額を「今すぐ現金で買うとしたらいくらか（現在価値）」で計上する、より原則的な方法です（利子込み法はリース料の総額でしたが、こちらは現在価値なので金額が少なくなります）。毎回のリース料支払い時には、負債を返す部分（元本）と、借りていることへの対価（利息）を分けて処理します。1年目の利息40,000円は、まだ返済していない元本1,000,000円に利率4％をかけて計算しています。',
    e:[{d:[['リース資産',1000000]],c:[['リース債務',1000000]]},{d:[['リース債務',200000],['支払利息',40000]],c:[['現金',240000]]}]
  },

  { id:456, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'売買目的で上場株式100株を1株@100円で現金購入した。', en_q:'Purchased 100 shares of trading securities at ¥100 per share in cash.', e:[{d:[['売買目的有価証券',10000]], c:[['現金',10000]]}] , exp:'売買目的有価証券は「短期間で売買して差益を得る」ことを目的に持つ株式や債券です。購入時はそのままの取得原価で資産計上し、その後決算のたびに時価で評価し直して、評価差額をその期の損益に反映させるのが最大の特徴です。'},
  { id:457, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'帳簿価額10,000円の売買目的有価証券を11,500円で現金売却した。', en_q:'Sold trading securities (book value ¥10,000) for ¥11,500 in cash.', e:[{d:[['現金',11500]], c:[['売買目的有価証券',10000], ['有価証券売却益',1500]]}] , exp:'有価証券を帳簿価額より高く売却できた場合、その差額が「有価証券売却益」という収益になります。11,500円－10,000円＝1,500円が、この売却によって実際に得られた利益です。'},
  { id:458, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'帳簿価額10,000円の売買目的有価証券を8,500円で現金売却した。', en_q:'Sold trading securities (book value ¥10,000) for ¥8,500 in cash.', e:[{d:[['現金',8500], ['有価証券売却損',1500]], c:[['売買目的有価証券',10000]]}] , exp:'有価証券を帳簿価額より安く売却してしまった場合、その差額が「有価証券売却損」という費用になります。8,500円－10,000円＝△1,500円分、売った方が損をしたことになります。'},
  { id:459, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、売買目的有価証券（帳簿価額10,000円）の時価が12,000円となった。', en_q:'At year-end, trading securities (book value ¥10,000) have a fair value of ¥12,000.', e:[{d:[['売買目的有価証券',2000]], c:[['有価証券評価益',2000]]}] , exp:'売買目的有価証券は決算のたびに時価評価します。時価（12,000円）が帳簿価額（10,000円）を上回ったので、その含み益2,000円を「有価証券評価益」として、まだ売っていなくても収益に計上し、資産の帳簿価額も時価まで引き上げます。'},
  { id:460, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、売買目的有価証券（帳簿価額10,000円）の時価が7,500円となった。', en_q:'At year-end, trading securities (book value ¥10,000) have a fair value of ¥7,500.', e:[{d:[['有価証券評価損',2500]], c:[['売買目的有価証券',2500]]}] , exp:'売買目的有価証券の時価が帳簿価額より下がった場合、まだ売っていなくてもその含み損2,500円を「有価証券評価損」として費用計上し、資産の帳簿価額を時価まで引き下げます。売買目的の有価証券はいつでも市場で換金できるため、含み損益もその期のうちに正直に反映させます。'},
  { id:461, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'満期保有目的で社債（額面100,000円）を97,000円（残存3年）で現金購入した。', en_q:'Purchased held-to-maturity bonds (face value ¥100,000) for ¥97,000 in cash (3 years remaining).', e:[{d:[['満期保有目的債券',97000]], c:[['現金',97000]]}] , exp:'満期まで持ち続けるつもりの社債を額面より安く買えた場合、その差額（3,000円）は単なる値引きではなく、実質的な利息の前払いのようなものとみなされます。時価評価は行わず、この差額を満期までの期間にわたって少しずつ利息として計上していきます（償却原価法）。'},
  { id:462, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'上記の満期保有目的債券について、額面100,000円・表面利率2%の利払いを現金で受け取った。', en_q:'Received cash coupon interest on the above held-to-maturity bonds (face ¥100,000, coupon rate 2%).', e:[{d:[['現金',2000]], c:[['有価証券利息',2000]]}] , exp:'社債の利息は「額面×表面利率」で計算します。100,000円×2％＝2,000円が、この社債から定期的に受け取れる利息（クーポン）で、そのまま受取利息（収益）として計上します。'},
  { id:463, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'上記の満期保有目的債券（取得97,000円・額面100,000円・残存3年）について、決算時に定額法で償却原価法の処理を行った。', en_q:'Applied the amortized cost method (straight-line) at year-end on held-to-maturity bonds (cost ¥97,000, face ¥100,000, 3 years remaining).', e:[{d:[['満期保有目的債券',1000]], c:[['有価証券利息',1000]]}] , exp:'額面と取得価額の差額（3,000円）を、残りの保有期間（3年）で均等に分けて、毎年少しずつ有価証券利息として計上していきます。3,000÷3年＝1,000円です。この処理を続けることで、満期を迎えるころには帳簿価額がちょうど額面（100,000円）と一致します。'},
  { id:464, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'子会社株式200株を1株@500円で現金購入した。', en_q:'Purchased 200 shares of a subsidiary\'s stock at ¥500 per share in cash.', e:[{d:[['子会社株式',100000]], c:[['現金',100000]]}] , exp:'他社の議決権の過半数を持ち、その会社を支配する目的で保有する株式が「子会社株式」です。短期的な値上がり益を狙う売買目的有価証券とは違い、長期にわたって保有し続けることが前提なので、時価が変動しても評価替えはせず、取得原価のまま帳簿に残し続けます（原価法）。'},
  { id:465, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'関連会社株式150株を1株@400円で現金購入した。', en_q:'Purchased 150 shares of an affiliate\'s stock at ¥400 per share in cash.', e:[{d:[['関連会社株式',60000]], c:[['現金',60000]]}] , exp:'議決権の20％〜50％を持ち、その会社の経営に重要な影響を与えられる立場にある株式が「関連会社株式」です。子会社株式と同じように、支配や影響力の維持が目的であって売買差益が目的ではないため、時価評価はせず取得原価のまま保有します。'},
  { id:466, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'その他有価証券（株式）を50,000円で現金購入した。', en_q:'Purchased other securities (equity) for ¥50,000 in cash.', e:[{d:[['その他有価証券',50000]], c:[['現金',50000]]}] , exp:'売買目的でも、満期保有目的でも、子会社・関連会社株式でもない有価証券は「その他有価証券」に分類されます。決算のたびに時価評価はしますが、評価差額をすぐに損益とはせず、いったん純資産の部に直接計上する「全部純資産直入法」という特別な扱いを受けます。'},
  { id:467, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、その他有価証券（帳簿価額50,000円）の時価が55,000円となった（全部純資産直入法）。', en_q:'At year-end, other securities (book ¥50,000) have a fair value of ¥55,000 (full mark-to-market through equity).', e:[{d:[['その他有価証券',5000]], c:[['その他有価証券評価差額金',5000]]}] , exp:'その他有価証券の時価が上がった場合、その含み益（5,000円）は損益計算書を通さず、純資産の部の「その他有価証券評価差額金」として直接計上します。「まだ売るつもりはないので利益にはしないが、貸借対照表には今の価値を反映させる」という考え方です。'},
  { id:468, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、その他有価証券（帳簿価額50,000円）の時価が44,000円となった（全部純資産直入法）。', en_q:'At year-end, other securities (book ¥50,000) have a fair value of ¥44,000 (full mark-to-market through equity, loss)', e:[{d:[['その他有価証券評価差額金',6000]], c:[['その他有価証券',6000]]}] , exp:'その他有価証券の時価が下がった場合も同じように、損益計算書を通さず、純資産の部の「その他有価証券評価差額金」を直接減らして対応します。売買目的有価証券のように費用（評価損）として処理するのとは異なる点がポイントです。'},
  { id:469, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'子会社から配当金10,000円を現金で受け取った。', en_q:'Received a cash dividend of ¥10,000 from a subsidiary.', e:[{d:[['現金',10000]], c:[['受取配当金',10000]]}] , exp:'子会社から受け取る配当金も、他の株式から受け取る配当金と同じように「受取配当金」という収益として計上します（連結財務諸表を作るときは、グループ内部の取引として消去されますが、個別財務諸表ではそのまま収益になります）。'},
  { id:470, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'投資有価証券（帳簿価額80,000円）を95,000円で現金売却した。', en_q:'Sold investment securities (book value ¥80,000) for ¥95,000 in cash.', e:[{d:[['現金',95000]], c:[['投資有価証券',80000], ['投資有価証券売却益',15000]]}] , exp:'その他有価証券のように長期保有目的の有価証券（投資有価証券）を売却したときも、帳簿価額より高く売れた分が利益になります。95,000円－80,000円＝15,000円が「投資有価証券売却益」です。売買目的有価証券の売却益とは科目名が違いますが、考え方は同じです。'},
  { id:471, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'投資有価証券（帳簿価額80,000円）を70,000円で現金売却した。', en_q:'Sold investment securities (book value ¥80,000) for ¥70,000 in cash.', e:[{d:[['現金',70000], ['投資有価証券売却損',10000]], c:[['投資有価証券',80000]]}] , exp:'投資有価証券を帳簿価額より安く売却してしまった場合は、その差額が「投資有価証券売却損」という費用になります。70,000円－80,000円＝△10,000円分、売った方が損をしたことになります。'},
  { id:472, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、来期に予定している機械の修繕費用20,000円を見積もり、修繕引当金を設定した。', en_q:'At year-end, estimated ¥20,000 for planned machine repairs next period and recorded a provision for repairs.', e:[{d:[['修繕引当金繰入',20000]], c:[['修繕引当金',20000]]}] , exp:'引当金とは「将来発生しそうな費用・損失を、実際に発生する前から見積もって、今期の費用として先取りしておく」仕組みです。来期に予定している機械の修繕は、今期の事業活動によって生じた摩耗などが原因と考えられるため、その費用を先取りして計上し、負債（修繕引当金）として備えておきます。'},
  { id:473, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'修繕引当金20,000円の計上後、実際に機械の修繕費18,000円を現金で支払った。', en_q:'After recording a provision for repairs of ¥20,000, actually paid ¥18,000 in cash for machine repairs.', e:[{d:[['修繕引当金',18000]], c:[['現金',18000]]}] , exp:'実際に修繕費が発生したら、あらかじめ積んでおいた引当金を取り崩して充てます。見積もっていた金額（20,000円）より実際の費用（18,000円）が少なかったので、差額の2,000円はそのまま引当金の残高として残ります（後日、決算時に戻し入れなどで調整されます）。'},
  { id:474, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'修繕引当金15,000円の計上後、実際の修繕費が22,000円となり現金で支払った。', en_q:'After recording a provision for repairs of ¥15,000, the actual repair cost was ¥22,000, paid in cash.', e:[{d:[['修繕引当金',15000], ['修繕費',7000]], c:[['現金',22000]]}] , exp:'見積もっていた金額（15,000円）より実際の費用（22,000円）の方が多くかかってしまったケースです。引当金の範囲内（15,000円）はそのまま充当し、それでも足りない超過分（7,000円）は、新たに今期の費用（修繕費）として追加計上します。'},
  { id:475, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、役員賞与の支払見込額30,000円について役員賞与引当金を設定した。', en_q:'At year-end, recorded a provision for director bonuses of ¥30,000 expected to be paid.', e:[{d:[['役員賞与引当金繰入',30000]], c:[['役員賞与引当金',30000]]}] , exp:'役員に支払う賞与も、一般社員の賞与と同じように「発生した期間の費用として先取りする」のが原則です。実際に支払うのが来期であっても、その対象となる働きはすでに今期に発生しているため、見積額を今期のうちに費用（役員賞与引当金繰入）と負債（役員賞与引当金）として計上します。'},
  { id:476, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'役員賞与引当金30,000円を取り崩し、役員賞与を現金で支払った。', en_q:'Reversed the provision for director bonuses of ¥30,000 and paid the bonuses in cash.', e:[{d:[['役員賞与引当金',30000]], c:[['現金',30000]]}] , exp:'実際に役員賞与を支払う段階では、費用はすでに前期（引当計上時）に計上済みなので、今回はただ負債（役員賞与引当金）を取り崩して現金を減らすだけです。二重に費用計上しないよう、「支払い＝負債の解消」として処理するのがポイントです。'},
  { id:477, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、退職給付見込額の当期負担分50,000円を計上した。', en_q:'At year-end, recorded ¥50,000 as the current-period portion of estimated retirement benefits.', e:[{d:[['退職給付費用',50000]], c:[['退職給付引当金',50000]]}] , exp:'退職給付引当金は、将来支払う退職金を、従業員が実際に働いた期間に応じて少しずつ費用として積み立てていく仕組みです。今期の労働に対応する見込み額（50,000円）を、今期のうちに費用（退職給付費用）と負債（退職給付引当金）として計上します。'},
  { id:478, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'退職給付引当金200,000円を取り崩し、退職金を現金で支払った。', en_q:'Reversed the retirement benefit provision of ¥200,000 and paid retirement benefits in cash.', e:[{d:[['退職給付引当金',200000]], c:[['現金',200000]]}] , exp:'実際に退職金を支払う段階では、費用はすでに過去の期間にわたって計上済みなので、今回はこれまで積み立ててきた引当金（負債）を取り崩して現金を減らすだけです。「積み立てておいたお金を、約束通り支払う」というシンプルな処理です。'},
  { id:479, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、当期販売分の商品保証費用の見積額8,000円について商品保証引当金を設定した。', en_q:'At year-end, recorded a provision for product warranties of ¥8,000 estimated for goods sold this period.', e:[{d:[['商品保証引当金繰入',8000]], c:[['商品保証引当金',8000]]}] , exp:'商品保証引当金は、販売した商品に将来発生するかもしれない無償修理・交換の費用を、販売した期のうちに見積もって先取りしておく仕組みです。「今期売った商品の保証費用は、今期の売上に対応するコストである」という発生主義の考え方にもとづいています。'},
  { id:480, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'商品保証引当金8,000円があるなか、実際の保証修理費用として11,000円を現金で支払った。', en_q:'With a product warranty provision of ¥8,000, paid ¥11,000 in cash for actual warranty repairs.', e:[{d:[['商品保証引当金',8000], ['商品保証費',3000]], c:[['現金',11000]]}] , exp:'実際に保証修理の費用が発生したら、まず引当金（8,000円）を取り崩して充て、それでも足りない超過分（3,000円）は、新たに今期の費用（商品保証費）として追加計上します。見積もりが実際の費用より少なかった場合の、不足分の埋め合わせです。'},
  { id:481, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'前期設定の貸倒引当金5,000円を全額取り崩し（洗替法）、当期末の売掛金残高200,000円に対して3%で再設定した。', en_q:'Reversed last year\'s allowance for doubtful accounts (¥5,000) in full (allowance reset method), then set a new allowance at 3% of the ¥200,000 accounts receivable balance.', e:[{d:[['貸倒引当金',5000]], c:[['貸倒引当金戻入',5000]]}, {d:[['貸倒引当金繰入',6000]], c:[['貸倒引当金',6000]]}] , exp:'洗替法は、前期に設定していた引当金をいったん全額取り消し（貸倒引当金戻入という収益で相殺）、そのうえで当期末の残高をもとにゼロから新しく引当金を設定し直す方法です。前期の見積りをいったんリセットしてから、最新のデータで作り直すイメージで、不足分だけを追加する「差額補充法」とは対照的な処理方法です。'},
  { id:482, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'商品をUSドル建てで輸出し、売掛金1,000ドルが生じた。取引時のレートは1ドル＝150円。', en_q:'Exported goods and recorded an accounts receivable of $1,000 at the transaction date rate of ¥150/USD.', e:[{d:[['売掛金',150000]], c:[['売上',150000]]}] , exp:'外国の取引先との取引でも、日本の帳簿には「取引が発生したその日のレート（取引時レート）」で円換算して記録します。1,000ドル×150円＝150,000円という金額で、売掛金（資産）と売上（収益）を同時に計上します。'},
  { id:483, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'上記の売掛金1,000ドルが決済され、現金を受け取った。決済時のレートは1ドル＝155円。', en_q:'Collected the above accounts receivable of $1,000 in cash. Settlement rate: ¥155/USD.', e:[{d:[['現金',155000]], c:[['売掛金',150000], ['為替差損益',5000]]}] , exp:'外貨建ての売掛金を回収するときは、もともと記録していた金額（取引時レートで計算した150,000円）と、実際に受け取る金額（決済時レートで計算した155,000円）を比較します。決済時の方が円安（ドル高）に動いていたため、予定より多く受け取れることになり、その差額5,000円は得をした分として為替差損益（収益）に計上します。'},
  { id:484, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'外貨建売掛金1,000ドルが決済され、現金を受け取った。取引時レート150円→決済時レート145円。', en_q:'Collected foreign-currency accounts receivable of $1,000 in cash. Rate fell from ¥150 to ¥145/USD.', e:[{d:[['現金',145000], ['為替差損益',5000]], c:[['売掛金',150000]]}] , exp:'今度は取引時（150円）より決済時（145円）の方が円高に動いたケースです。1,000ドルの売掛金の価値が150,000円から145,000円へと目減りしてしまったので、差額5,000円は「予定より少ない金額しか受け取れなかった＝損をした」ことを表す為替差損益（損失側）として計上します。円高は輸出企業にとって不利に働くことを示す典型例です。'},
  { id:485, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'商品をUSドル建てで輸入し、買掛金500ドルが生じた。取引時のレートは1ドル＝150円。', en_q:'Imported goods and recorded an accounts payable of $500 at the transaction date rate of ¥150/USD.', e:[{d:[['仕入',75000]], c:[['買掛金',75000]]}] , exp:'商品を輸入した場合も、取引が発生した時点のレートで円換算します。1ドル150円で500ドル分の商品を仕入れたので、75,000円分の仕入（費用）と、同額の買掛金（負債、後で支払う義務）が発生します。'},
  { id:486, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'外貨建買掛金500ドルを現金で決済した。取引時レート150円→決済時レート148円。', en_q:'Paid foreign-currency accounts payable of $500 in cash. Rate fell from ¥150 to ¥148/USD.', e:[{d:[['買掛金',75000]], c:[['現金',74000], ['為替差損益',1000]]}] , exp:'外貨建ての買掛金を決済するときは、もともと記録していた金額（取引時レートで計算した75,000円）と、実際に支払う金額（決済時レートで計算した74,000円）を比較します。決済時の方が円高（ドル安）に動いていたため、予定より少ない金額で支払いが済み、その差額1,000円は得をした分として為替差損益（利益）に計上します。円高は輸入企業にとって有利に働きます。'},
  { id:487, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'外貨建買掛金500ドルを現金で決済した。取引時レート150円→決済時レート153円。', en_q:'Paid foreign-currency accounts payable of $500 in cash. Rate rose from ¥150 to ¥153/USD.', e:[{d:[['買掛金',75000], ['為替差損益',1500]], c:[['現金',76500]]}] , exp:'今度は取引時（150円）より決済時（153円）の方が円安に動いたケースです。500ドルの支払いに必要な円が75,000円から76,500円に増えてしまったので、差額1,500円は「予定より多く払わなければならなかった＝損をした」ことを表す為替差損益（損失）として計上します。'},
  { id:488, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'決算時、外貨建売掛金2,000ドルを決算時レート（1ドル＝152円）で換算した。取引時レートは1ドル＝148円。', en_q:'At year-end, translated foreign-currency receivables of $2,000 at the closing rate (¥152/USD). Transaction rate was ¥148/USD.', e:[{d:[['売掛金',8000]], c:[['為替差損益',8000]]}] , exp:'外貨建ての金銭債権（売掛金）は、決算のたびに「今のレート（決算時レート）」で換算し直すのが原則です。取引時（148円）より決算時（152円）の方が円安・ドル高に動いていたため、円換算した売掛金の価値が148,000円から152,000円に増加しました。これは「将来受け取れる金額が増えた＝得をした」ことを意味するので、差額8,000円を為替差損益（収益）として計上します。'},
  { id:489, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'決算時、外貨建買掛金1,000ドルを決算時レート（1ドル＝153円）で換算した。取引時レートは1ドル＝150円。', en_q:'At year-end, translated foreign-currency payables of $1,000 at the closing rate (¥153/USD). Transaction rate was ¥150/USD.', e:[{d:[['為替差損益',3000]], c:[['買掛金',3000]]}] , exp:'外貨建ての金銭債務（買掛金）も、決算のたびに決算時レートで換算し直します。取引時（150円）より決算時（153円）の方が円安・ドル高に動いていたため、円換算した支払義務が増えてしまいました。これは「これから払う金額が増えた＝損をした」ことを意味するので、差額3,000円を為替差損益（損失）として計上します。'},
  { id:490, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'輸入商品の手付金として前払金200ドルを現金で支払った。支払時のレートは1ドル＝150円。決済時（商品受取時）のレートは155円。', en_q:'Paid a deposit of $200 in cash for imported goods at ¥150/USD. At settlement (goods receipt), rate was ¥155/USD.', e:[{d:[['前払金',30000]], c:[['現金',30000]]}, {d:[['仕入',30000]], c:[['前払金',30000]]}] , exp:'前払金のような「まだモノやサービスを受け取っていないが、お金だけ先に払った」項目（非貨幣性項目）は、支払った時点のレート（取引時レート）で金額を固定し、その後レートが変動しても換算し直しません。決済時（商品を受け取った時点）には、この固定された金額をそのまま仕入という費用に振り替えます。'},
  { id:491, level:2, cat:'税効果会計', chap:'税効果', q:'決算時、貸倒引当金の損金算入限度超過額20,000円（将来減算一時差異）について、法定実効税率30%で繰延税金資産を計上した。', en_q:'At year-end, recorded a deferred tax asset for a ¥20,000 temporary difference (excess allowance for doubtful accounts over the tax deduction limit) at a 30% statutory effective tax rate.', e:[{d:[['繰延税金資産',6000]], c:[['法人税等調整額',6000]]}] , exp:'会計上の費用と税務上の費用（損金）にズレがあり、それが「今は認められないが将来は認められる」性質のもの（将来減算一時差異）である場合、将来の税負担が軽くなる効果を、あらかじめ「繰延税金資産」として資産計上しておきます。貸倒引当金の超過分（20,000円）に実効税率（30％）をかけた6,000円がその金額です。'},
  { id:492, level:2, cat:'税効果会計', chap:'税効果', q:'前期に計上した繰延税金資産6,000円（将来減算一時差異20,000円×30%）が当期に解消した。', en_q:'The deferred tax asset of ¥6,000 recorded last year (¥20,000 temporary difference × 30%) was reversed this period.', e:[{d:[['法人税等調整額',6000]], c:[['繰延税金資産',6000]]}] , exp:'前期に見込んでいた「将来の税負担が軽くなる効果」が、当期になって実際に実現しました（税務上も損金として認められた）。見込みが現実になった段階で、資産として持っていた繰延税金資産を取り崩し、その分を法人税等調整額という費用として計上します。'},
  { id:493, level:2, cat:'税効果会計', chap:'税効果', q:'固定資産の減価償却費について、会計上の償却額500,000円に対し税務上の損金算入額が300,000円だった。差額200,000円に対して実効税率30%で税効果を計上する。', en_q:'Depreciation for tax was ¥300,000 vs. accounting depreciation of ¥500,000. Record tax effect on the ¥200,000 difference (taxable temporary difference) at a 30% rate.', e:[{d:[['法人税等調整額',60000]], c:[['繰延税金負債',60000]]}] , exp:'減価償却費が、会計上と税務上で認められる金額に差がある場合、その差額の性質によって扱いが変わります。今回は税務上の方が少なく認められているため、将来（この差が解消するとき）にはむしろ税負担が重くなると見込まれます（将来加算一時差異）。この将来の追加負担分（200,000×30％＝60,000円）を、あらかじめ「繰延税金負債」として負債計上しておきます。'},
  { id:494, level:2, cat:'税効果会計', chap:'税効果', q:'前期に計上した繰延税金負債60,000円が当期に解消した（固定資産の一時差異200,000円が解消）。', en_q:'The deferred tax liability of ¥60,000 recorded last year reversed this period.', e:[{d:[['繰延税金負債',60000]], c:[['法人税等調整額',60000]]}] , exp:'前期に見込んでいた「将来、税負担が重くなる」という予測が、当期になって実際に実現しました。見込んでいた分の負債（繰延税金負債）を取り崩し、実際に税負担が増える分を法人税等調整額という費用として計上します。'},
  { id:495, level:2, cat:'税効果会計', chap:'税効果', q:'その他有価証券（評価差額5,000円の評価益）について、実効税率30%で税効果を同時計上した（全部純資産直入法）。', en_q:'Recorded a tax effect (30% rate) alongside the ¥5,000 unrealized gain on other securities under the full mark-to-market equity method.', e:[{d:[['その他有価証券',5000]], c:[['繰延税金負債',1500], ['その他有価証券評価差額金',3500]]}] , exp:'その他有価証券の評価差益に税効果を適用する場合、将来売却時に課税される税金相当額（5,000×30％＝1,500円）を繰延税金負債として見積もり、純資産に計上する評価差額金は税引後の金額（3,500円）だけにします。会計上の利益と税務上の課税所得のズレを、あらかじめ調整しておく仕組みです。'},
  { id:496, level:2, cat:'税効果会計', chap:'税効果', q:'当期の税引前当期純利益は500,000円。法人税等（当期税額）は160,000円、税効果調整後の法人税等調整額は△6,000円（繰延税金資産6,000円の計上）。', en_q:'Pre-tax income is ¥500,000. Current tax expense is ¥160,000; deferred tax benefit is ¥6,000 (deferred tax asset). Record the net income tax expense.', e:[{d:[['法人税等',160000]], c:[['未払法人税等',160000]]}, {d:[['繰延税金資産',6000]], c:[['法人税等調整額',6000]]}] , exp:'法人税等には2つの側面があります。①今期実際に納めるべき税額（160,000円）をそのまま未払法人税等として計上し、②会計と税務のズレを調整する繰延税金資産の計上によって生じる「法人税等調整額」（6,000円）を、別途損益に反映させます。結果として、損益計算書に表れる正味の税負担は154,000円（160,000－6,000）になります。'},
  { id:497, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本店が支店へ現金50,000円を送付した（本店側の仕訳）。', en_q:'The head office sent ¥50,000 in cash to the branch (head office entry).', e:[{d:[['支店',50000]], c:[['現金',50000]]}] , exp:'本店と支店は同じ会社ですが、帳簿を分けて管理するため、社内のやり取りを「支店」「本店」という専用の勘定で記録します。本店から支店へ現金を送ると、本店にとってはお金を支店に貸したのと同じことなので、現金が減る代わりに支店勘定（資産）が増えます。'},
  { id:498, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'支店が本店から現金50,000円を受け取った（支店側の仕訳）。', en_q:'The branch received ¥50,000 in cash from the head office (branch entry).', e:[{d:[['現金',50000]], c:[['本店',50000]]}] , exp:'支店が受け取った現金は、支店自身が稼いだお金ではなく本店から融通してもらったお金なので、支店の帳簿では「本店に対する借り」として本店勘定（負債的な性質）を増やします。本店側の支店勘定と支店側の本店勘定は表裏一体で、常に同じ金額になります。'},
  { id:499, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本店が支店へ原価80,000円の商品を送付した（本店側の仕訳）。', en_q:'The head office shipped goods costing ¥80,000 to the branch (head office entry).', e:[{d:[['支店',80000]], c:[['仕入',80000]]}] , exp:'本店が商品を支店へ送ると、本店の手元にあった商品（仕入）が外に出ていく一方、それは支店に貸した資産と考えられるため、支店勘定（資産）が増えます。商品という形が「本店の在庫」から「支店への貸付」に変わったイメージです。'},
  { id:500, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'支店が本店から商品80,000円を受け取った（支店側の仕訳）。', en_q:'The branch received goods worth ¥80,000 from the head office (branch entry).', e:[{d:[['仕入',80000]], c:[['本店',80000]]}] , exp:'支店が本店から商品を受け取ると、支店の在庫（仕入）が増える一方、まだ代金を精算していないので本店に対する借り（本店勘定）が増えます。本店側の支店勘定と支店側の本店勘定は必ず一致する、対になった内部勘定です。'},
  { id:501, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'支店の当期純利益30,000円を本店に報告した（支店側の仕訳）。', en_q:'The branch reported its net income of ¥30,000 to the head office (branch entry).', e:[{d:[['損益',30000]], c:[['本店',30000]]}] , exp:'支店が1年間で稼いだ利益は、最終的に会社全体の利益としてまとめる必要があるため、支店の帳簿ではいったん集計した損益を「本店」勘定に振り替えて締めくくります。本店はこの報告を受け取り、支店勘定（資産）と損益（収益）の両方を増やして自社の利益に取り込みます。'},
  { id:502, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本支店合算財務諸表の作成にあたり、支店勘定（資産・本店側）80,000円と本店勘定（負債・支店側）80,000円を相殺消去した。', en_q:'When preparing combined head office-branch financial statements, eliminated the intercompany branch/head office balances of ¥80,000 against each other.', e:[{d:[['本店',80000]], c:[['支店',80000]]}] , exp:'本店と支店の財務諸表を合算して会社全体の財務諸表を作るとき、本店の「支店」勘定（社内向けの資産）と支店の「本店」勘定（社内向けの負債）をそのまま残すと、実際には存在しない資産・負債が二重に表示されてしまいます。そこでこの2つの内部勘定を相殺消去し、社外に対する本当の資産・負債だけが残るようにします。'},
  { id:503, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本店は支店の当期純利益30,000円を受け取り、本店の損益勘定に振り替えた（本店側の仕訳）。', en_q:'The head office received the branch\'s net income of ¥30,000 and transferred it to its own income account (head office entry).', e:[{d:[['支店',30000]], c:[['損益',30000]]}] , exp:'支店から利益の報告を受けた本店は、その利益を自社の損益として取り込む必要があります。いったん「支店に対する貸し（支店勘定）が増えた」と記録し、同時に「損益（収益）が増えた」として処理することで、支店の頑張りが会社全体の利益にきちんと反映されます。'},
  { id:504, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親会社がA社株式の60%（取得原価240,000円）を取得した。A社の純資産は350,000円（資本金200,000円、利益剰余金150,000円）。連結開始仕訳（投資と資本の相殺消去）を行いなさい。のれんも計上すること。', en_q:'Parent acquired 60% of A Co. (cost ¥240,000). A Co.\'s net assets: capital ¥200,000, retained earnings ¥150,000. Prepare the consolidation entry (elimination of investment vs. equity). Include goodwill.', e:[{d:[['資本金',200000], ['利益剰余金',150000], ['のれん',30000]], c:[['子会社株式',240000], ['非支配株主持分',140000]]}] , exp:'子会社株式を取得すると、親会社の帳簿の「投資額」と子会社の帳簿の「純資産」という、実質的に同じものが二重に存在する状態になります。連結財務諸表ではこの重複を相殺消去しますが、投資額（240,000円）の方が親会社の持分相当額（350,000円×60％＝210,000円）より多い場合、その差額はブランド力などの見えない価値への対価として「のれん」に計上します。また親会社が持っていない残り40％分は「非支配株主持分」として区別します。'},
  { id:505, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'のれん30,000円について、10年で均等償却した（当期分）。', en_q:'Amortized goodwill of ¥30,000 on a straight-line basis over 10 years (current year portion).', e:[{d:[['のれん償却',3000]], c:[['のれん',3000]]}] , exp:'のれんは「買収時に払った、目に見えない価値への対価」です。これを一括で費用にせず、その価値が会社に貢献してくれるであろう期間に分けて、毎年少しずつ費用として計上（償却）していきます。買収してすぐに全額費用にしてしまうと、その期だけ利益が大きく落ち込んでしまうため、複数年に分けるのが合理的です。'},
  { id:506, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'連結上、子会社の当期純利益60,000円のうち、非支配株主持分（40%）へ利益を配分する連結修正仕訳を行いなさい。', en_q:'In consolidation, allocate the non-controlling interests\' share (40%) of the subsidiary\'s net income of ¥60,000.', e:[{d:[['非支配株主に帰属する当期純利益',24000]], c:[['非支配株主持分',24000]]}] , exp:'子会社が稼いだ利益のすべてが親会社のものになるわけではありません。親会社が持っていない残り40％の株式を持つ非支配株主にも、その持分に応じた利益の取り分があります。60,000円×40％＝24,000円を「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）に加算することで、親会社の利益と非支配株主の利益を正しく分けて表示します。'},
  { id:507, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'子会社が配当金20,000円を宣言し支払った。親会社（60%保有）は12,000円の配当を受け取っている。連結修正仕訳を行いなさい。', en_q:'Subsidiary declared and paid dividends of ¥20,000. Parent (60% ownership) received ¥12,000. Prepare the consolidation elimination entry.', e:[{d:[['受取配当金',12000], ['非支配株主持分',8000]], c:[['利益剰余金',20000]]}] , exp:'子会社が配当を支払っても、グループ全体で見れば内部でお金が動いただけです。親会社が受け取った配当金（12,000円）はもともと親会社の利益の一部として二重に計上されるため取り消し、非支配株主が受け取った分（8,000円）は非支配株主持分を減らす形で処理し、どちらも子会社の利益剰余金の減少としてまとめます。'},
  { id:508, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親子会社間の売上・仕入取引500,000円を連結上で相殺消去した。', en_q:'Eliminated intercompany sales/purchases of ¥500,000 in consolidation.', e:[{d:[['売上高',500000]], c:[['売上原価',500000]]}] , exp:'親子会社間の売買は、グループ全体から見れば「同じ会社の中でモノが移動しただけ」です。親会社が計上した売上高と、子会社が計上した仕入（売上原価）はそれぞれ相手が存在して初めて成り立つ取引なので、連結財務諸表を作るときは両方とも消去し、グループが本当に外部へ売った分だけを残します。'},
  { id:509, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親子会社間の売掛金・買掛金80,000円を連結上で相殺消去した。', en_q:'Eliminated intercompany accounts receivable/payable of ¥80,000 in consolidation.', e:[{d:[['買掛金',80000]], c:[['売掛金',80000]]}] , exp:'親会社の売掛金と子会社の買掛金は、グループの外から見れば単なる社内の貸し借りにすぎません。連結財務諸表を作るときはこれを相殺消去し、グループが本当に外部に対して持っている債権・債務だけが表示されるようにします。'},
  { id:510, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親会社が子会社へ原価40,000円の商品を60,000円で販売した。期末に子会社の在庫にこの商品が全量残っている。ダウンストリームの未実現利益を消去しなさい。', en_q:'Parent sold goods (cost ¥40,000) to subsidiary for ¥60,000. All goods remain in subsidiary\'s closing inventory. Eliminate the downstream unrealized profit.', e:[{d:[['売上原価',20000]], c:[['棚卸資産',20000]]}] , exp:'親会社が子会社に売った商品がまだ売れずに子会社の在庫として残っている場合、そこに含まれる利益（20,000円）はグループ全体で見ればまだ外部のお客様に届いていない「未実現」の利益です。連結財務諸表では、この分の利益をいったん取り消し、棚卸資産の金額も本来の原価水準まで引き下げます。'},
  { id:511, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'子会社が親会社へ原価30,000円の商品を45,000円で販売した。期末に親会社の在庫に全量残っている。アップストリームの未実現利益を消去し、非支配株主持分への影響も処理しなさい（非支配株主40%）。', en_q:'Subsidiary sold goods (cost ¥30,000) to parent for ¥45,000. All goods remain in parent\'s closing inventory. Eliminate the upstream unrealized profit and adjust non-controlling interests (40%).', e:[{d:[['売上原価',15000]], c:[['棚卸資産',15000]]}, {d:[['非支配株主持分',6000]], c:[['非支配株主に帰属する当期純利益',6000]]}] , exp:'今度は子会社が親会社に売った商品が親会社の在庫として残っているケース（アップストリーム）です。この利益はもともと子会社が稼いだものなので、消去する際には非支配株主にもその負担分（40％）を反映させる必要があります。未実現利益15,000円を消去し、そのうち6,000円分（15,000×40％）を非支配株主持分からも取り除きます。'},
  { id:512, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'連結上、親会社が子会社に対して貸付金100,000円を持ち、子会社は同額の借入金を持っている。内部取引として相殺消去しなさい。', en_q:'In consolidation, the parent has a loan receivable of ¥100,000 from the subsidiary, and the subsidiary has the corresponding borrowing. Eliminate the intercompany loan.', e:[{d:[['借入金',100000]], c:[['貸付金',100000]]}] , exp:'親会社が子会社にお金を貸し、子会社がそれを借入金として計上している場合、グループ全体で見ればこれも社内でのお金の融通にすぎません。連結財務諸表では、この貸付金（親会社の資産）と借入金（子会社の負債）を相殺消去し、外部に対する本当の資産・負債だけを残します。'},
  { id:513, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'前期末に消去した子会社在庫の未実現利益20,000円（ダウンストリーム）を当期首に再振替（実現）させる開始仕訳を行いなさい。', en_q:'Reverse last year\'s elimination of ¥20,000 downstream unrealized profit in the opening consolidation entry (the profit is now realized).', e:[{d:[['棚卸資産',20000]], c:[['売上原価',20000]]}] , exp:'前の期に「まだ売れていない」として取り消した利益が、当期になって実際に外部へ販売され、本当に実現したとします。この場合、前期末に行った消去の仕訳をそっくりそのまま逆向きに戻す「開始仕訳」を入れることで、前期の消去の効果を打ち消し、当期の実現した利益を正しく反映させます。'},
  { id:514, level:2, cat:'材料費', chap:'工業簿記', q:'素材300,000円を掛けで購入し、引取運賃5,000円を現金で支払った。', en_q:'Purchased raw materials for ¥300,000 on credit and paid ¥5,000 in cash for freight-in.', e:[{d:[['材料',305000]], c:[['買掛金',300000], ['現金',5000]]}] , exp:'材料を仕入れる代金だけでなく、そこまで運んでもらうための送料（引取運賃）も、材料を使えるようにするために必要な費用です。商品を仕入れるときの「仕入諸掛」と同じ考え方で、運賃も含めた305,000円全額をその材料の取得原価として資産計上します。'},
  { id:515, level:2, cat:'材料費', chap:'工業簿記', q:'材料200,000円を直接材料として製造に投入した。', en_q:'Issued ¥200,000 of materials as direct materials into production.', e:[{d:[['仕掛品',200000]], c:[['材料',200000]]}] , exp:'材料を製造現場に投入し、特定の製品づくりに直接使ったときは、材料という「まだ使っていない在庫」から、仕掛品という「製造中の製品」へとコストの居場所が変わります。材料自体がなくなるわけではなく、製品の一部として姿を変えたとイメージしましょう。'},
  { id:516, level:2, cat:'材料費', chap:'工業簿記', q:'材料30,000円を間接材料として工場で消費した。', en_q:'Consumed ¥30,000 of materials as indirect materials in the factory.', e:[{d:[['製造間接費',30000]], c:[['材料',30000]]}] , exp:'潤滑油や軍手のように、工場のどこでも使われるけれど「どの製品のために使ったか」をはっきり特定できない材料は、いったん製造間接費という集計箱にまとめておきます。あとで作業時間などの基準を使って、各製品に公平に配分されます。'},
  { id:517, level:2, cat:'材料費', chap:'工業簿記', q:'期末材料の帳簿棚卸高50,000円に対し実地棚卸高は47,000円であった。棚卸減耗を計上しなさい。', en_q:'The book balance of materials at period-end is ¥50,000; the physical count shows ¥47,000. Record the inventory shortage.', e:[{d:[['棚卸減耗損',3000]], c:[['材料',3000]]}] , exp:'帳簿上の在庫数と、実際に数えた在庫数は、保管中の目減りなどでズレることがあります。このズレ（棚卸減耗）はもう手元にない材料なので、材料という資産を減らし、その分を費用（棚卸減耗損）として認識します。50,000円－47,000円＝3,000円が、帳簿にはあるが実際には存在しない材料の金額です。'},
  { id:518, level:2, cat:'労務費', chap:'工業簿記', q:'当月の賃金250,000円を現金で支払った（賃金の支払い）。', en_q:'Paid ¥250,000 in wages for the current month in cash.', e:[{d:[['賃金',250000]], c:[['現金',250000]]}] , exp:'工員への給料を支払った直後の段階では、まだその賃金が「どの製品のために使われた人件費か」を振り分けていません。そのためいったん「賃金」という勘定にまとめて記録しておき、後から直接工の分は仕掛品へ、間接工の分は製造間接費へと振り分けていきます。'},
  { id:519, level:2, cat:'労務費', chap:'工業簿記', q:'当月消費した賃金180,000円（直接労務費）と70,000円（間接労務費）を製造勘定に振り替えた。', en_q:'Transferred ¥180,000 of direct labor and ¥70,000 of indirect labor to manufacturing accounts.', e:[{d:[['仕掛品',180000], ['製造間接費',70000]], c:[['賃金',250000]]}] , exp:'支払った賃金250,000円のうち、特定の製品のために直接働いた分（直接労務費180,000円）は仕掛品へ、工場の管理業務など製品に直接ひもづかない分（間接労務費70,000円）は製造間接費へ、それぞれ振り分けます。この振り分け作業を「賃金の消費」と呼びます。'},
  { id:520, level:2, cat:'労務費', chap:'工業簿記', q:'月末に賃金の未払分30,000円を見越し計上した。', en_q:'Accrued unpaid wages of ¥30,000 at month-end.', e:[{d:[['賃金',30000]], c:[['未払賃金',30000]]}] , exp:'給料の締め日と支払日がずれていると、月末時点で「もう働いてもらった分だが、まだ支払っていない賃金」が発生します。これは今月の費用として先に計上しておく必要があるため、賃金（費用）を計上すると同時に、未払賃金という負債（後で支払う義務）を記録します。翌月になって実際に支払うときに、この未払賃金を取り崩します。'},
  { id:521, level:2, cat:'経費', chap:'工業簿記', q:'外注加工費60,000円が確定し、掛けで計上した（直接経費）。', en_q:'Recorded ¥60,000 of subcontracting costs (direct expenses) on credit.', e:[{d:[['仕掛品',60000]], c:[['買掛金',60000]]}] , exp:'外注加工費は「自社の代わりに外部の業者に加工をお願いした」費用で、どの製品のための出費かがはっきり分かります。材料費・労務費と同じように、製造間接費を経由せず、直接「仕掛品」として製品の原価に組み込みます。'},
  { id:522, level:2, cat:'経費', chap:'工業簿記', q:'工場設備の減価償却費40,000円を間接経費として計上した。', en_q:'Recorded ¥40,000 of factory equipment depreciation as indirect expenses.', e:[{d:[['製造間接費',40000]], c:[['減価償却累計額',40000]]}] , exp:'工場の機械や建物の減価償却費は、特定の一つの製品のためだけに発生するわけではなく、工場全体でいろいろな製品を作るために使われている設備のコストです。そのため、どの製品にいくらとは直接決められず、いったん製造間接費に集めておき、後で各製品に配分（配賦）します。'},
  { id:523, level:2, cat:'経費', chap:'工業簿記', q:'工場の水道光熱費20,000円（間接経費）と事務所の電気代8,000円（販売費及び一般管理費）を現金で支払った。', en_q:'Paid ¥20,000 for factory utilities (indirect manufacturing expense) and ¥8,000 for office electricity (SG&A) in cash.', e:[{d:[['製造間接費',20000], ['水道光熱費',8000]], c:[['現金',28000]]}] , exp:'同じ「電気代」でも、工場で使った分は製品を作るためのコスト（製造間接費）、事務所で使った分は製品とは無関係な期間費用（販売費及び一般管理費）として、別々の勘定に記録します。「工場のコストか、それとも本社・営業のコストか」を区別することが、正しい製品原価の計算には欠かせません。'},
  { id:524, level:2, cat:'製造間接費', chap:'工業簿記', q:'当月の製造間接費を予定配賦率（直接作業時間1時間あたり500円）で配賦した。当月の直接作業時間は200時間。', en_q:'Applied manufacturing overhead using a predetermined rate of ¥500 per direct labor hour × 200 hours this month.', e:[{d:[['仕掛品',100000]], c:[['製造間接費',100000]]}] , exp:'製造間接費は実際の合計額が確定するまで待つと計算が遅れてしまうため、あらかじめ決めておいた予定配賦率（1時間あたり500円）に、実際の作業時間（200時間）を掛けて、先に仕掛品へ配分します。500円×200時間＝100,000円がこの製品の負担分です。実際発生額との差は、あとでまとめて精算（差異分析）します。'},
  { id:525, level:2, cat:'製造間接費', chap:'工業簿記', q:'当月の製造間接費実際発生額は108,000円、予定配賦額は100,000円だった。製造間接費配賦差異を把握しなさい。', en_q:'Actual manufacturing overhead was ¥108,000; applied overhead was ¥100,000. Record the overhead variance.', e:[{d:[['製造間接費配賦差異',8000]], c:[['製造間接費',8000]]}] , exp:'予定配賦率を使って先に仕掛品へ配分した金額（予定配賦額）と、月末に確定した本当の金額（実際発生額）は、ぴったり一致するとは限りません。実際の方が多くかかった（108,000円＞100,000円）ので、8,000円分は予定より余計にコストがかかったことになります。この差額を「製造間接費配賦差異」として区別して計上し、後で分析・精算します。'},
  { id:526, level:2, cat:'製造間接費', chap:'工業簿記', q:'当月の製造間接費実際発生額は95,000円、予定配賦額は100,000円だった。有利差異（配賦超過）を把握しなさい。', en_q:'Actual manufacturing overhead was ¥95,000; applied overhead was ¥100,000. Record the favorable overhead variance.', e:[{d:[['製造間接費',5000]], c:[['製造間接費配賦差異',5000]]}] , exp:'今回は逆に、実際にかかった金額（95,000円）よりも、予定で配分した金額（100,000円）の方が多かったケースです。つまり見込みより実際のコストが少なくて済んだ「有利差異」です。多く配分しすぎた5,000円分を、製造間接費配賦差異として区別しておき、後で精算します。'},
  { id:527, level:2, cat:'個別原価計算', chap:'工業簿記', q:'製造指図書No.1の製品が完成した。直接材料費100,000円・直接労務費80,000円・製造間接費50,000円。製品勘定へ振り替えなさい。', en_q:'Job No.1 was completed. Direct materials ¥100,000, direct labor ¥80,000, manufacturing overhead ¥50,000. Transfer to finished goods.', e:[{d:[['製品',230000]], c:[['仕掛品',230000]]}] , exp:'製造指図書ごとに、直接材料費・直接労務費・製造間接費配賦額を積み上げていくのが個別原価計算です。指図書No.1に集まった原価の合計100,000円＋80,000円＋50,000円＝230,000円が、その製品が完成した時点で「作りかけ（仕掛品）」から「完成品（製品）」へとまるごと引き継がれます。'},
  { id:528, level:2, cat:'個別原価計算', chap:'工業簿記', q:'完成した製品（原価230,000円）を280,000円で掛けで販売した。売上原価も計上しなさい。', en_q:'Sold finished goods (cost ¥230,000) for ¥280,000 on credit. Also record cost of goods sold.', e:[{d:[['売掛金',280000]], c:[['売上',280000]]}, {d:[['売上原価',230000]], c:[['製品',230000]]}] , exp:'製品が完成して倉庫にあるだけでは、まだ会社の儲けにはなりません。実際にお客様に販売して初めて、①売上（収益）を認識すると同時に、②それまで資産として持っていた製品の原価を「売上原価」という費用に振り替えます。売上280,000円と売上原価230,000円の差額（50,000円）が、この販売から得た利益です。'},
  { id:529, level:2, cat:'部門別原価計算', chap:'工業簿記', q:'補助部門費（動力部門20,000円・修繕部門15,000円）を製造部門（第1製造部門・第2製造部門）へ配賦した。第1製造部門へ：動力12,000円・修繕10,000円。第2製造部門へ：動力8,000円・修繕5,000円。', en_q:'Allocated service department costs (power dept. ¥20,000, maintenance dept. ¥15,000) to manufacturing departments: Dept.1 gets power ¥12,000 + maintenance ¥10,000; Dept.2 gets power ¥8,000 + maintenance ¥5,000.', e:[{d:[['第1製造部門費',22000], ['第2製造部門費',13000]], c:[['動力部門費',20000], ['修繕部門費',15000]]}] , exp:'動力部門や修繕部門のように、直接製品を作るのではなく他の部門を支える「補助部門」の費用は、最終的にすべて実際に製品を作る「製造部門」へ配分します。動力部門の20,000円は第1製造部門に12,000円・第2製造部門に8,000円、修繕部門の15,000円は第1製造部門に10,000円・第2製造部門に5,000円というように、実際の利用量に応じた基準で振り分けます。'},
  { id:530, level:2, cat:'総合原価計算', chap:'工業簿記', q:'当月の製造費用：直接材料費180,000円・加工費120,000円。月初仕掛品なし。完成品400個・月末仕掛品100個（加工進捗度40%）。平均法で月末仕掛品原価を計算し、完成品原価を求めなさい。', en_q:'Manufacturing costs: direct materials ¥180,000, conversion costs ¥120,000. No opening WIP. Completed 400 units; closing WIP 100 units (40% complete). Using average method, calculate closing WIP cost and cost of completed units.', e:[{d:[['製品',255000]], c:[['仕掛品',255000]]}] , exp:'総合原価計算は、同じ規格の製品を大量生産するときに使う方法で、指図書ごとではなく「工程全体」で原価を計算します。平均法では、月初にあった仕掛品のコストと当月新しく投入したコストをいったん全部合算し、それを完成品と月末仕掛品（加工進捗度を考慮した換算量）に平均的に配分します。「途中経過を区別せず、ひとつの大きな鍋で混ぜてから均等に取り分ける」イメージです。'},
  { id:531, level:2, cat:'総合原価計算', chap:'工業簿記', q:'先入先出法：月初仕掛品200個（進捗度50%、材料費20,000円・加工費10,000円）、当月投入材料費100,000円・加工費90,000円、完成品600個、月末仕掛品100個（進捗度60%）。完成品原価を求めなさい。', en_q:'FIFO method: Opening WIP 200 units (50% complete, materials ¥20,000, conversion ¥10,000); current costs materials ¥100,000, conversion ¥90,000; completed 600 units; closing WIP 100 units (60% complete). Find cost of completed units.', e:[{d:[['製品',185500]], c:[['仕掛品',185500]]}] , exp:'先入先出法では、月初にすでにあった仕掛品（前月から作りかけだった分）を先に完成させ、それでも足りない分を当月新しく投入した材料・加工費でまかなうと考えます。平均法のようにすべてを混ぜてしまうのではなく、「古いものから先に完成させる」という順序を意識して計算するため、月初仕掛品の単価と当月投入分の単価を分けて扱う点が特徴です。'},
  { id:532, level:2, cat:'総合原価計算', chap:'工業簿記', q:'工程別総合原価計算：第1工程完了品は第2工程の前工程費となる。第1工程完成品原価160,000円（400個）を第2工程仕掛品（前工程費）に振り替えなさい。', en_q:'Process cost accounting: Transfer the cost of 400 completed units from Process 1 (¥160,000) as prior-process costs to Process 2 WIP.', e:[{d:[['第2工程仕掛品',160000]], c:[['第1工程仕掛品',160000]]}] , exp:'製品が複数の工程（第1工程→第2工程）を経て完成する場合、各工程ごとに原価を集計します。第1工程で完成した分は、第2工程にとっては「すでに出来上がった材料」のような扱いになり、これを「前工程費」と呼びます。第1工程の完成品原価160,000円は、そのまま第2工程の仕掛品として引き継がれます。'},
  { id:533, level:2, cat:'標準原価計算', chap:'工業簿記', q:'完成品300個の標準原価を仕掛品から製品勘定に振り替えた。標準原価：直接材料費@200円・直接労務費@150円・製造間接費@100円。', en_q:'Transferred the standard cost of 300 completed units to finished goods. Standard: DM @¥200, DL @¥150, OH @¥100 per unit.', e:[{d:[['製品',135000]], c:[['仕掛品',135000]]}] , exp:'標準原価計算では、実際にいくらかかったかではなく、あらかじめ「本来これくらいのコストで作れるはず」という目標値（標準原価）を先に決めておきます。完成品300個について、材料費・労務費・間接費それぞれの標準単価を合計した＠450円（200＋150＋100）を掛けた135,000円を、仕掛品から製品へ振り替えます。実際のコストとの差は、後で差異として分析します。'},
  { id:534, level:2, cat:'標準原価計算', chap:'工業簿記', q:'直接材料費差異を分析した。実際購入単価@210円×実際消費量320kg、標準単価@200円×標準消費量300kg。価格差異と数量差異を計上しなさい。', en_q:'Analyze direct material variances. Actual: @¥210 × 320 kg; Standard: @¥200 × 300 kg. Record price variance and usage variance.', e:[{d:[['直接材料費差異',7200]], c:[['仕掛品',7200]]}] , exp:'実際にかかった原価（実際単価210円×実際消費量320kg）と、本来かかるはずだった原価（標準単価200円×標準消費量300kg）を比べると、7,200円多くかかっています。この差額の原因は「単価が高かったこと」なのか「使いすぎたこと」なのか、まだこの段階では分かりません。次の問題でこの差異をさらに細かく分解していきます。'},
  { id:535, level:2, cat:'標準原価計算', chap:'工業簿記', q:'上記の直接材料費差異7,200円（不利差異）を価格差異と数量差異に分解しなさい。価格差異＝（@210－@200）×320＝3,200円（不利）、数量差異＝@200×（320－300）＝4,000円（不利）。', en_q:'Break down the ¥7,200 unfavorable DM variance: price variance = (¥210−¥200)×320 = ¥3,200 unfav.; usage variance = ¥200×(320−300) = ¥4,000 unfav.', e:[{d:[['直接材料費価格差異',3200], ['直接材料費数量差異',4000]], c:[['直接材料費差異',7200]]}] , exp:'直接材料費差異は、「単価のズレ（価格差異）」と「使った量のズレ（数量差異）」の2つの原因に分解できます。価格差異＝（実際単価210－標準単価200）×実際消費量320kg＝3,200円は、仕入れの単価が予定より高かったことによる差異（購買担当の責任範囲）。数量差異＝標準単価200×（実際320－標準300）＝4,000円は、材料を予定より多く使ってしまったことによる差異（製造現場の責任範囲）です。'},
  { id:536, level:2, cat:'標準原価計算', chap:'工業簿記', q:'直接労務費差異を分析した。実際賃率@550円×実際作業時間200h、標準賃率@500円×標準作業時間180h。賃率差異と時間差異を計上しなさい。', en_q:'Analyze direct labor variances. Actual: @¥550 × 200h; Standard: @¥500 × 180h. Record rate variance and efficiency variance.', e:[{d:[['直接労務費差異',20000]], c:[['仕掛品',20000]]}] , exp:'直接材料費と同じように、直接労務費の差異も「実際にかかった人件費」と「本来かかるはずだった人件費」の差として最初にまとめて把握します。実際（賃率550円×時間200h）と標準（賃率500円×時間180h）の差は20,000円で、これも「時給が高かったから」なのか「時間がかかりすぎたから」なのか、次の問題で細かく分解します。'},
  { id:537, level:2, cat:'標準原価計算', chap:'工業簿記', q:'上記の直接労務費差異20,000円（不利）を賃率差異と作業時間差異に分解しなさい。賃率差異＝（@550－@500）×200＝10,000（不利）、時間差異＝@500×（200－180）＝10,000（不利）。', en_q:'Break down the ¥20,000 unfavorable DL variance: rate variance = (¥550−¥500)×200 = ¥10,000 unfav.; efficiency variance = ¥500×(200−180) = ¥10,000 unfav.', e:[{d:[['直接労務費賃率差異',10000], ['直接労務費時間差異',10000]], c:[['直接労務費差異',20000]]}] , exp:'直接労務費差異は「賃率のズレ（賃率差異）」と「時間のズレ（時間差異）」に分解できます。賃率差異＝（実際550－標準500）×実際200h＝10,000円は、実際の時給が予定より高かったことによる差異。時間差異＝標準500×（実際200－標準180）＝10,000円は、作業に予定より時間がかかりすぎたことによる差異です。原因を分けることで、どこを改善すべきかが見えてきます。'},
  { id:538, level:2, cat:'標準原価計算', chap:'工業簿記', q:'製造間接費差異を分析した。実際発生額32,000円、予定配賦額（標準配賦率@100×標準作業時間180h）＝18,000円。予算差異と操業度差異を求めなさい。固定費予算18,000円（変動費ゼロと仮定）、基準操業度200h。', en_q:'Analyze OH variances. Actual ¥32,000; applied (¥100×180h)=¥18,000. Fixed OH budget ¥18,000 (zero variable), normal capacity 200h. Find budget variance and volume variance.', e:[{d:[['製造間接費差異',14000]], c:[['仕掛品',14000]]}] , exp:'製造間接費も、材料費・労務費と同じように「実際発生額」と「予定配賦額（標準配賦率×標準作業時間）」を比べて差異を把握します。実際32,000円－予定18,000円＝14,000円の不利差異です。この差異はさらに「予算そのものとのズレ（予算差異）」と「工場をどれだけ稼働させたかのズレ（操業度差異）」に分解して分析できます。'},
  { id:539, level:2, cat:'標準原価計算', chap:'工業簿記', q:'期末に原価差異（直接材料費差異7,200円・直接労務費差異20,000円・製造間接費差異14,000円）を売上原価に振り替えた。', en_q:'At period-end, closed all cost variances (DM ¥7,200, DL ¥20,000, OH ¥14,000) to cost of goods sold.', e:[{d:[['売上原価',41200]], c:[['直接材料費差異',7200], ['直接労務費差異',20000], ['製造間接費差異',14000]]}] , exp:'月末になると、それまで別々に把握していた材料費差異・労務費差異・製造間接費差異をまとめて精算します。実際の原価が標準原価より多くかかった（不利差異）場合は、その分だけ売上原価を増やす方向で調整します。標準原価計算で「あらかじめ決めた理想の原価」で記帳しておき、最後に現実とのズレをまとめて調整する、という全体の流れを確認する問題です。'},
  { id:540, level:2, cat:'収益認識', chap:'収益認識・現金預金', q:'工事進行基準：工事請負額500,000円、工事原価総見積額400,000円、当期発生工事原価100,000円（進捗率25%）。当期の収益と費用を計上しなさい。', en_q:'Percentage-of-completion: Contract price ¥500,000, total estimated cost ¥400,000, actual cost incurred ¥100,000 (25% complete). Record current-period revenue and expense.', e:[{d:[['工事未収金',125000]], c:[['完成工事高',125000]]}, {d:[['完成工事原価',100000]], c:[['工事原価',100000]]}] , exp:'工事のように完成まで時間のかかる契約では、工事の進み具合（進捗率）に応じて、少しずつ収益と費用を計上していきます。今期は原価ベースで25％進んだと計算できるので、請負金額の25％（125,000円）を収益として、対応する当期発生原価（100,000円）を費用として計上します。工事が進んだ分だけ、売上と原価を同じペースで認識していくのがポイントです。'},
  { id:541, level:2, cat:'収益認識', chap:'収益認識・現金預金', q:'返品権付き販売：商品100,000円（原価70,000円）を掛けで販売した。過去実績から10%（10,000円）の返品が見込まれる。', en_q:'Sale with right of return: sold goods for ¥100,000 (cost ¥70,000) on credit. Historical return rate: 10% (¥10,000 expected).', e:[{d:[['売掛金',100000]], c:[['売上',90000], ['返品負債',10000]]}, {d:[['売上原価',63000], ['返品資産',7000]], c:[['棚卸資産',70000]]}] , exp:'返品が見込まれる分（10,000円相当）は、まだお客様に本当に受け入れてもらえるか確定していないため、売上ではなく「返品負債」という負債にいったん留めておきます。同時に、返品されれば戻ってくる商品の原価（7,000円）も「返品資産」として区別することで、確実に実現した分だけを売上・売上原価として計上する仕組みになっています。'},
  { id:542, level:2, cat:'収益認識', chap:'収益認識・現金預金', q:'ポイント付与：商品50,000円を現金販売し、購入額の2%相当のポイント（1,000円分）を顧客に付与した。ポイントは独立販売価格として考慮する。', en_q:'Loyalty points: Sold goods for ¥50,000 in cash and granted points worth ¥1,000 (2% of purchase). Allocate revenue between goods and points based on stand-alone selling prices.', e:[{d:[['現金',50000]], c:[['売上',49020], ['契約負債',980]]}] , exp:'商品を売ると同時にポイントを付与する場合、そのポイントは「将来、商品と交換できる別の約束」とみなされます。そこで売上代金の一部（1,000円相当）を、まだ果たしていない義務として「契約負債」に振り分け、残りの金額（49,020円）だけを、今回の商品販売による本当の売上として認識します。'},
  { id:543, level:2, cat:'銀行勘定調整', chap:'収益認識・現金預金', q:'銀行勘定調整表：銀行残高証明書の残高は200,000円、当社帳簿残高は195,000円。差異の内訳：①時間外預入5,000円（銀行未処理）②未取立小切手8,000円（銀行未処理）③手数料2,000円（当社未記帳）。銀行側・当社側の修正仕訳（当社側のみ）を行いなさい。', en_q:'Bank reconciliation: Bank statement ¥200,000, book balance ¥195,000. Items: ①deposit in transit ¥5,000 (unprocessed by bank); ②outstanding check ¥8,000 (unprocessed by bank); ③bank service charge ¥2,000 (not yet booked). Record only the company-side adjusting entry.', e:[{d:[['支払手数料',2000]], c:[['当座預金',2000]]}] , exp:'銀行の残高証明書と自社の帳簬の金額が食い違う原因には、いくつかの種類があります。時間外預入や未取立小切手のように「銀行側がまだ処理していないだけ」のものは、自社の帳簿を直す必要はありません。一方、銀行手数料のように「銀行はすでに処理済みだが自社が記帳していない」ものは、自社の帳簿を実態に合わせて修正する必要があります。'},
  { id:544, level:2, cat:'銀行勘定調整', chap:'収益認識・現金預金', q:'銀行から得意先振込の通知があったが、当社はまだ帳簿に記帳していなかった。振込額30,000円を当座預金に計上しなさい。', en_q:'The bank notified the company of a customer\'s wire transfer of ¥30,000, which has not yet been recorded in the books. Record the deposit.', e:[{d:[['当座預金',30000]], c:[['売掛金',30000]]}] , exp:'銀行はすでに入金として処理しているのに、自社の帳簿にまだ記録していない場合、帳簿の方を実態に合わせて修正する必要があります。得意先からの入金30,000円を当座預金の増加として計上し、対応する売掛金（回収された債権）を減らします。銀行残高証明書と帳簿の金額を一致させるための調整です。'},
  { id:545, level:3, cat:'個人事業主', chap:'本支店・連結・個人事業主', q:'個人事業主が事業用の現金50,000円を生活費として引き出した（引出金を使用）。', en_q:'A sole proprietor withdrew ¥50,000 in business cash for personal living expenses (use owner\'s drawings account).', e:[{d:[['引出金（事業主貸）',50000]], c:[['現金',50000]]}] , exp:'個人事業主には「会社の財布」と「個人の財布」という区別が法律上ありません（事業と個人が同一人格です）。それでも帳簿の上では両者を分けて管理したいので、事業のお金を生活費として使ったときは「引出金（事業主貸）」という専用の科目で記録し、決算時にまとめて元入金（事業主の元手）から差し引きます。'},
  { id:546, level:3, cat:'個人事業主', chap:'本支店・連結・個人事業主', q:'個人事業主が私的な口座から事業用口座へ80,000円を振り込んだ（事業主借を使用）。', en_q:'A sole proprietor transferred ¥80,000 from a personal account to the business account (use owner\'s contribution account).', e:[{d:[['普通預金',80000]], c:[['事業主借',80000]]}] , exp:'個人事業主が自分のプライベートなお金を事業に投入するのは、会社でいう「増資」に近いイメージです。ただし個人事業では資本金という科目を使わず、「事業主借」という科目で処理し、決算時に元入金へ合算します。「事業主から事業への貸し」という名前ですが、実質的には元手を増やす取引です。'},
  { id:547, level:3, cat:'個人事業主', chap:'本支店・連結・個人事業主', q:'決算時、引出金（事業主貸）の残高120,000円を元入金に振り替えた。', en_q:'At year-end, transferred the owner\'s drawings balance of ¥120,000 to the capital account.', e:[{d:[['元入金',120000]], c:[['引出金（事業主貸）',120000]]}] , exp:'個人事業主の決算では、1年間の「事業主貸（生活費として引き出した分）」と「事業主借（私財を投入した分）」を、まとめて元入金（事業主の元手＝純資産）に振り替えて精算します。引出金は元入金を減らす方向、事業主借は元入金を増やす方向にそれぞれ作用し、翌期はゼロからスタートします。'},

  // ===== 工業簿記：費目別計算（材料費） =====
  { id:548, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'主要材料200kgを@500円で掛け購入。引取運賃2,000円は現金払い。材料の購入原価で仕訳しなさい。',
    e:[{d:[['材料',102000]], c:[['買掛金',100000],['現金',2000]]}],
    exp:'材料を仕入れるときの代金だけでなく、そこまで運んでもらうための引取運賃も、材料が使えるようになるまでにかかった費用として取得原価に含めます。200kg×500円＝100,000円に運賃2,000円を足した102,000円が、この材料の本当の取得コストです。'
  },
  { id:549, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'主要材料100kgを製造に直接使用（予定消費単価@510円）。直接材料費の仕訳をしなさい。',
    e:[{d:[['仕掛品',51000]], c:[['材料',51000]]}],
    exp:'工場で実際に製品づくりに使った材料は、材料という在庫から仕掛品という製造中の製品へと姿を変えます。あらかじめ決めておいた予定単価（1kgあたり510円）を使うことで、実際の単価が確定するのを待たずに、すぐに原価計算を進められます。100kg×510円＝51,000円がこの製品に振り替わる材料費です。'
  },
  { id:550, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'補助材料20kgを工場で消費（予定消費単価@510円）。間接材料費の仕訳をしなさい。',
    e:[{d:[['製造間接費',10200]], c:[['材料',10200]]}],
    exp:'補助材料のように、どの製品にどれだけ使ったかをはっきり特定できない材料は、間接材料費として製造間接費にまとめて集計します。あとで作業時間などの基準を使って、各製品に公平に配分されます。20kg×510円＝10,200円がこの分の間接材料費です。'
  },
  { id:551, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'月末棚卸：帳簿残高50kg、実地残高47kg、予定消費単価@510円。棚卸減耗（製造間接費処理）の仕訳をしなさい。',
    e:[{d:[['製造間接費',1530]], c:[['材料',1530]]}],
    exp:'帳簿上の在庫数と実際に数えた在庫数がズレることはよくあります（保管中の目減りなど）。今月は帳簿50kgに対し実際は47kgしかなかったので、3kg分（1,530円）が正常な範囲の減耗として製造間接費に計上されます。もし異常に大きな減耗であれば、原価に含めず特別損失として別扱いにします。'
  },
  { id:552, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'予定消費単価@510円で100kg消費。実際消費単価が@500円と判明。材料消費価格差異（有利）の仕訳をしなさい。',
    e:[{d:[['材料',1000]], c:[['材料消費価格差異',1000]]}],
    exp:'予定単価（510円）で仮に計算していた消費額と、実際の単価（500円）で計算し直した消費額を比べると、実際の方が1,000円安く済んでいます。見積もりより安く済んだので「有利差異」と呼び、材料勘定を増やす（差異を貸方に計上する）形で調整します。'
  },
  { id:553, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'予定消費単価@500円で100kg消費。実際消費単価が@520円と判明。材料消費価格差異（不利）の仕訳をしなさい。',
    e:[{d:[['材料消費価格差異',2000]], c:[['材料',2000]]}],
    exp:'今回は逆に、予定単価（500円）より実際単価（520円）の方が高かったケースです。見積もりより2,000円多くコストがかかったので「不利差異」と呼び、材料勘定を減らす（差異を借方に計上する）形で調整します。'
  },
  // ===== 工業簿記：費目別計算（労務費） =====
  { id:554, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'賃金支給総額200,000円。所得税預り金15,000円・社会保険料預り金20,000円を控除して現金払い。賃金支払の仕訳をしなさい。',
    e:[{d:[['賃金給料',200000]], c:[['所得税預り金',15000],['社会保険料預り金',20000],['現金',165000]]}],
    exp:'給料日には、会社が約束した支給総額をいったん全額費用として認識します。ただし手元に残る現金は、会社が代わりに天引きして国や保険機関に納める所得税・社会保険料を差し引いた金額です。天引き分は「まだ外部に払っていないお金」として預り金（負債）に計上し、200,000－15,000－20,000＝165,000円だけを実際に現金で支払います。'
  },
  { id:555, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'直接工の直接作業時間200h、予定賃率@1,000円/h。直接労務費を仕掛品に振り替える仕訳をしなさい。',
    e:[{d:[['仕掛品',200000]], c:[['賃金給料',200000]]}],
    exp:'直接工がどの製品にどれだけの時間を費やしたかがはっきり分かるとき、その人件費は「直接労務費」として、実際の給料計算を待たずにあらかじめ決めた予定賃率を使ってすぐに仕掛品へ振り替えられます。200時間×1,000円＝200,000円がこの製品の労務費です。'
  },
  { id:556, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'直接工の間接作業30h・手待時間10h（予定賃率@1,000円）、間接工賃金50,000円。製造間接費への振替仕訳をしなさい。',
    e:[{d:[['製造間接費',90000]], c:[['賃金給料',90000]]}],
    exp:'同じ工員でも、製品を直接組み立てる作業以外の時間（間接作業・機械の空き時間である手待時間）や、間接工の賃金は、特定の製品のためのコストとは言えないため、製造間接費にまとめて集計します。30時間分・10時間分の賃金と間接工の給料50,000円を合計した90,000円が、この分の間接労務費です。'
  },
  { id:557, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'予定賃率@1,000円/h、実際作業時間200h。実際発生賃金198,000円。賃率差異（有利）の仕訳をしなさい。',
    e:[{d:[['賃金給料',2000]], c:[['賃率差異',2000]]}],
    exp:'あらかじめ決めていた予定賃金（1,000円×200時間＝200,000円）よりも、実際に支払った賃金（198,000円）の方が少なくて済んだケースです。見積もりより安く済んだので「有利差異」となり、賃率差異を貸方に計上します。'
  },
  { id:558, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'月末に未払賃金30,000円を計上する仕訳をしなさい。',
    e:[{d:[['賃金給料',30000]], c:[['未払賃金',30000]]}],
    exp:'給料の締め日と支払日がずれていると、月末時点で「もう働いてもらった分だが、まだ支払っていない賃金」が発生します。発生主義の考え方に基づき、実際に支払う前でも今月の費用として先に計上し、未払賃金という負債を記録しておきます。翌月の支払時にこの未払賃金を取り崩します。'
  },
  // ===== 工業簿記：費目別計算（経費） =====
  { id:559, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'外注加工費50,000円を現金払いした。直接経費として処理する仕訳をしなさい。',
    e:[{d:[['仕掛品',50000]], c:[['現金',50000]]}],
    exp:'外注加工費は、自社の代わりに外部業者へ製品の加工をお願いした費用で、どの製品のためにかかったかがはっきり分かります。材料費・直接労務費と同じように、製造間接費を経由せず直接「仕掛品」へ計上する、数少ない直接経費の代表例です。'
  },
  { id:560, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'工場建物の減価償却費120,000円を間接経費として計上する仕訳をしなさい。',
    e:[{d:[['製造間接費',120000]], c:[['減価償却累計額',120000]]}],
    exp:'工場の建物にかかる減価償却費は、特定の一つの製品のためだけに発生するわけではなく、工場全体でさまざまな製品を作るために使われている設備のコストです。どの製品にいくらとは直接決められないため、いったん製造間接費に集めておき、後で各製品に配分します。'
  },
  // ===== 工業簿記：製造間接費の配賦 =====
  { id:561, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造間接費の予定配賦率@800円/直接作業時間。当月の直接作業時間300h。製造間接費を仕掛品へ予定配賦する仕訳をしなさい。',
    e:[{d:[['仕掛品',240000]], c:[['製造間接費',240000]]}],
    exp:'製造間接費は実際の総額が確定するまで待つと原価計算が遅れてしまうため、あらかじめ決めた予定配賦率（1時間あたり800円）に、実際の作業時間（300時間）を掛けて、先に仕掛品へ配分します。800円×300時間＝240,000円がこの製品の負担分です。'
  },
  { id:562, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造間接費実際発生額：間接材料費11,730円＋間接労務費90,000円＋減価償却費120,000円＋その他28,270円＝合計250,000円。集計の仕訳をしなさい。',
    e:[{d:[['製造間接費',250000]], c:[['材料',11730],['賃金給料',90000],['減価償却累計額',120000],['現金等',28270]]}],
    exp:'製造間接費に含まれる費用は、間接材料費・間接労務費・間接経費（減価償却費など）といったさまざまな種類の費用の寄せ集めです。これらをすべて「製造間接費」という一つの勘定にまとめて集計すると、実際に工場でかかった間接費の総額（250,000円）が分かります。この実際発生額と、あらかじめ配分しておいた予定配賦額（240,000円）を比べることで、差異を把握できます。'
  },
  { id:563, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造間接費の予定配賦額240,000円、実際発生額250,000円。配賦差異（不利）の仕訳をしなさい。',
    e:[{d:[['製造間接費配賦差異',10000]], c:[['製造間接費',10000]]}],
    exp:'実際に発生した製造間接費の総額（250,000円）が、あらかじめ配分しておいた予定配賦額（240,000円）よりも多かったので、10,000円分は見積もりより余計にコストがかかったことになります（不利差異）。この差額を製造間接費配賦差異として区別しておき、精算します。'
  },
  { id:564, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造間接費配賦差異10,000円（不利・借方残）を売上原価に賦課する仕訳をしなさい。',
    e:[{d:[['売上原価',10000]], c:[['製造間接費配賦差異',10000]]}],
    exp:'標準原価計算で生じた差異は、多くの場合そのままその月の売上原価に加減算（賦課）して精算します。不利差異（見積もりより多くコストがかかった分）は、売上原価を増やす方向で調整します。「予定より高くついた分だけ、実際の利益はその分減ることになる」という結果を反映させる処理です。'
  },
  // ===== 工業簿記：個別原価計算 =====
  { id:565, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造指図書#1に直接材料費80,000円・直接労務費60,000円・製造間接費配賦額40,000円を集計する仕訳をしなさい。',
    e:[{d:[['仕掛品',180000]], c:[['材料',80000],['賃金給料',60000],['製造間接費',40000]]}],
    exp:'個別原価計算では、製造指図書という「製品ごとの原価集計シート」に、直接材料費・直接労務費・製造間接費配賦額をすべて足し合わせて、仕掛品として計上します。80,000円＋60,000円＋40,000円＝180,000円が、この指図書#1にかかった原価の合計です。'
  },
  { id:566, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造指図書#1の製品が完成した（原価合計180,000円）。完成時の仕訳をしなさい。',
    e:[{d:[['製品',180000]], c:[['仕掛品',180000]]}],
    exp:'製造指図書に集計されていた原価は、製品が完成した瞬間に「作りかけ（仕掛品）」から「完成品（製品）」へとまるごと引き継がれます。まだ売れていないので、このままでは損益に影響せず、在庫として保有し続けます。売れたときに初めて費用（売上原価）になります。'
  },
  { id:567, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'完成品（原価180,000円）を250,000円で掛け販売した。売上と売上原価の両方を仕訳しなさい。',
    e:[{d:[['売掛金',250000],['売上原価',180000]], c:[['売上',250000],['製品',180000]]}],
    exp:'製品が実際にお客様に売れたときは、①売上という収益を認識すると同時に、②その製品にかかっていた原価を「製品」という資産から「売上原価」という費用に振り替えます。売上250,000円と売上原価180,000円の差額70,000円が、この販売で得られた利益（売上総利益）です。商業簿記の「仕入」に相当する役割を、工業簿記では「売上原価」が担っています。'
  },
  { id:568, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'月末：製造指図書#2が未完成（直接材料費50,000円・直接労務費30,000円・製造間接費20,000円集計済み）。月末仕掛品の振替仕訳をしなさい。',
    e:[{d:[['月末仕掛品',100000]], c:[['仕掛品',100000]]}],
    exp:'月末時点でまだ完成していない製造指図書があれば、それまでに集計された原価（材料費・労務費・間接費）は、そのまま「仕掛品」として翌月に繰り越されます。50,000＋30,000＋20,000＝100,000円が、この未完成の指図書に眠っている製造中のコストです。'
  },
  // ===== 工業簿記：総合原価計算 =====
  { id:569, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'総合原価計算（平均法）：月初仕掛品なし、当月材料費200,000円・加工費150,000円。完成品400個、月末仕掛品100個（進捗度50%）。月末仕掛品原価を計算し製品への振替仕訳をしなさい。',
    e:[{d:[['製品',296667],['仕掛品（月末）',53333]], c:[['仕掛品',350000]]}],
    exp:'総合原価計算では、月末時点でまだ完成していない製品（月末仕掛品）にも、その進捗度に応じたコストが乗っています。材料費は工程の最初にまとめて投入されることが多いので数量そのままで、加工費は「どれだけ手が加わったか（進捗度）」を考慮した換算量で按分します。この按分によって、完成品と月末仕掛品にそれぞれ適切な原価が配分されます。',
    note:'四捨五入により金額に誤差が生じる場合があります。'
  },
  { id:570, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'当月完成品500個の製造原価が850,000円。完成品を倉庫に収める仕訳をしなさい。',
    e:[{d:[['製品',850000]], c:[['仕掛品',850000]]}],
    exp:'総合原価計算では、同じ規格の製品を大量に作るため、1個ずつ個別に原価計算をするのではなく、工程全体でかかったコストを完成数量で割って平均単価を求めます。完成した500個の製造原価850,000円がそのまま製品として計上され、仕掛品からの振替が完了します。'
  },
  { id:571, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'先入先出法：月初仕掛品200個（加工進捗40%）・当月投入800個。完成品850個・月末仕掛品150個（進捗60%）。月末仕掛品加工費換算量を計算しなさい。加工費当月投入分：月初完成120個＋新規完成650個＋月末90個。',
    e:[{d:[['製品',850000]], c:[['仕掛品',850000]]}],
    exp:'先入先出法では、月初にすでにあった仕掛品と、当月新たに完成させた分、さらに月末にまだ作りかけの分を、それぞれ分けて計算します。加工費の当月投入分（換算量）は、月初仕掛品の残り工程分（120個）＋当月に着手して完成させた分（650個）＋月末仕掛品の進捗分（90個）を合計した860個です。この換算量を使うことで、進捗度の違う仕掛品同士を公平に比較できます。'
  },
  { id:572, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'正常仕損品10個発生。評価額@200円/個。仕損品を資産計上する仕訳をしなさい。',
    e:[{d:[['仕損品',2000]], c:[['仕掛品',2000]]}],
    exp:'不合格品（仕損品）であっても、スクラップとして売れる見込みがあるなら、その分の価値は残っています。仕損品10個×評価額200円＝2,000円を、仕掛品から「仕損品」という資産へ振り替えます。残りの本当の損失（正味仕損費）は、正常な仕損であれば完成品の原価に自然に含まれます。'
  },
  // ===== 工業簿記：標準原価計算 =====
  { id:573, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'標準原価計算（シングルプラン）：標準直接材料費@1,000円/個。完成品300個。標準原価で仕掛品を計上する仕訳をしなさい。',
    e:[{d:[['仕掛品',300000]], c:[['材料',300000]]}],
    exp:'標準原価計算のシングルプランでは、実際の原価がいくらかを待たず、あらかじめ決めた標準原価で仕掛品を先に計上してしまいます。完成品300個×標準単価1,000円＝300,000円が、この段階で計上される仕掛品の金額です。実際にかかった原価との差額は、あとで別途「差異」として把握します。'
  },
  { id:574, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'直接材料費の価格差異：標準単価@500円、実際単価@520円、実際消費量620kg。価格差異（不利）の仕訳をしなさい。',
    e:[{d:[['直接材料費差異',12400]], c:[['材料',12400]]}],
    exp:'実際の購入単価（520円）が標準単価（500円）より高かったために生じた差異が「価格差異」です。（520－500）×実際消費量620kg＝12,400円分、予定より多くコストがかかったことになります。仕入れの単価交渉や市況の影響など、主に購買担当の責任範囲とされる差異です。'
  },
  { id:575, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'直接材料費の数量差異：実際消費量620kg、標準消費量600kg（300個×2kg）、標準単価@500円。数量差異（不利）の仕訳をしなさい。',
    e:[{d:[['直接材料費差異',10000]], c:[['材料',10000]]}],
    exp:'標準で決めていた消費量（600kg）よりも実際の消費量（620kg）の方が多かったために生じた差異が「数量差異」です。（620－600）×標準単価500円＝10,000円分、材料を余計に使ってしまったことになります。作業のムダや加工ミスなど、主に製造現場の責任範囲とされる差異です。'
  },
  { id:576, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'直接労務費の賃率差異：標準賃率@1,000円、実際賃率@980円、実際作業時間310h。賃率差異（有利）の仕訳をしなさい。',
    e:[{d:[['賃金給料',6200]], c:[['直接労務費差異',6200]]}],
    exp:'実際の時給（980円）が標準の時給（1,000円）よりも安く済んだために生じた差異が「賃率差異」です。（980－1,000）×実際310時間＝△6,200円で、予定より人件費が少なく済んだ「有利差異」です。残業が少なかった、あるいは経験の浅い工員が担当したなど、いろいろな理由が考えられます。'
  },
  { id:577, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'直接労務費の時間差異：実際作業時間310h、標準作業時間300h（300個×1h）、標準賃率@1,000円。時間差異（不利）の仕訳をしなさい。',
    e:[{d:[['直接労務費差異',10000]], c:[['賃金給料',10000]]}],
    exp:'標準で見込んでいた作業時間（300時間）よりも実際にかかった時間（310時間）の方が長かったために生じた差異が「時間差異」です。（310－300）×標準賃率1,000円＝10,000円分、予定より人件費が多くかかったことになります。作業の効率が悪かったことを示す差異で、製造現場の責任範囲とされます。'
  },
  { id:578, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'製造間接費差異（2分法）：予算差異5,000円（有利）・操業度差異8,000円（不利）。合計差異の仕訳をしなさい。',
    e:[{d:[['製造間接費配賦差異',3000]], c:[['製造間接費',3000]]}],
    exp:'製造間接費の差異を「予算差異」と「操業度差異」の2つに分けて分析する方法を2分法と呼びます。予算差異が5,000円の有利（コスト減）、操業度差異が8,000円の不利（工場の稼働が計画より低調だった）で、差し引き3,000円の不利差異が最終的な製造間接費配賦差異として残ります。'
  },
  { id:579, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造間接費（変動予算・公式法）：変動費率@200円/h・固定費月額100,000円。実際操業度190h・実際発生額142,000円。予算差異の仕訳をしなさい。',
    e:[{d:[['製造間接費配賦差異',4000]], c:[['製造間接費',4000]]}],
    exp:'変動予算（公式法）では、実際の操業度に合わせて「本来これくらいかかるはずだった予算」を計算し直します。実際190時間分の変動費（190×200円）に固定費100,000円を足した138,000円が、実際の稼働状況に見合った予算許容額です。これと実際発生額142,000円との差、4,000円が予算差異（コストが見積もりより多くかかった分）です。'
  },
  { id:580, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'標準原価計算（シングルプラン）：材料600kg購入（実際@520円）、標準単価@500円。購入時に差異を即時認識する仕訳をしなさい。',
    e:[{d:[['材料',300000],['材料消費価格差異',12000]], c:[['買掛金',312000]]}],
    exp:'シングルプランでは、材料を購入した時点ですでに標準単価で記帳し、実際の単価との差を即座に把握します。材料は標準単価（500円×600kg＝300,000円）で計上する一方、実際に支払う金額は実際単価（520円×600kg＝312,000円）なので、差額12,000円が購入時点で「材料消費価格差異」として即座に認識されます。'
  },
  { id:581, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'製造原価報告書：直接材料費300,000円・直接労務費200,000円・製造間接費240,000円、月初仕掛品50,000円、月末仕掛品70,000円。当期製品製造原価で製品へ振り替える仕訳をしなさい。',
    e:[{d:[['製品',720000]], c:[['仕掛品',720000]]}],
    exp:'製造原価報告書は、その期の製造活動でかかった費用（直接材料費・直接労務費・製造間接費）に、月初仕掛品を足し、月末仕掛品を差し引いて、完成品の原価を求める書類です。(300,000＋200,000＋240,000)＋50,000－70,000＝720,000円が、今期完成した製品にかかった本当のコストで、これがそのまま仕掛品から製品へ振り替わります。'
  },
  { id:582, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'組別総合原価計算：共通費500,000円を機械時間（A組300h・B組200h）で配賦。A組への配賦仕訳をしなさい。',
    e:[{d:[['A組仕掛品',300000]], c:[['製造間接費',300000]]}],
    exp:'複数のグループ（組）で異なる製品を並行して製造している場合、どちらの組にも共通してかかる費用（共通費）は、機械時間などの合理的な基準で各組に配分します。A組は300時間、B組は200時間使ったので、共通費500,000円のうちA組の負担分は500,000×(300÷500)＝300,000円です。'
  },
  { id:583, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'等級別総合原価計算：A品（等価係数1.0）300個・B品（等価係数1.5）200個。完成品総原価750,000円。A品単位原価を計算し、完成品振替仕訳をしなさい。',
    e:[{d:[['製品（A品）',375000],['製品（B品）',375000]], c:[['仕掛品',750000]]}],
    exp:'等級別総合原価計算では、同じ工程で作るけれど品質やサイズが違う製品（等級）ごとに「等価係数」という重みを設定し、それに応じて原価を配分します。A品300個×1.0＋B品200個×1.5＝600という「積数」を求め、これに比例させて完成品総原価750,000円を配分します。等価係数が大きいB品ほど、1個あたりの単価が高く計算されます。'
  },
  { id:584, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'工程別総合原価計算：第1工程完成品500個・原価350,000円を第2工程へ移す仕訳をしなさい。',
    e:[{d:[['第2工程仕掛品',350000]], c:[['第1工程仕掛品',350000]]}],
    exp:'複数の工程を経て製品が完成する場合、前の工程で完成した分は、次の工程にとっては「すでに出来上がった材料」のような扱いになります（これを前工程費と呼びます）。第1工程で完成した500個・350,000円分が、そのまま第2工程の仕掛品として引き継がれます。'
  },
  { id:585, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'副産物が生産工程から発生（売却見込価格3,000円）。仕掛品原価から控除する仕訳をしなさい。',
    e:[{d:[['副産物',3000]], c:[['仕掛品',3000]]}],
    exp:'主製品を作る過程で、価値は低いが売れば多少のお金になる副産物が生じることがあります。その売却見込価格3,000円分は、主製品の製造原価から差し引いて、副産物という別の資産として区別して管理します。主製品の原価がその分だけ軽くなる、という考え方です。'
  },
  { id:586, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'月末、製造間接費勘定：借方（実際）250,000円、貸方（予定配賦）240,000円。配賦差異を振り替える仕訳をしなさい。',
    e:[{d:[['製造間接費配賦差異',10000]], c:[['製造間接費',10000]]}],
    exp:'製造間接費勘定の借方（実際に発生した費用）と貸方（予定で配分した金額）を比べて、その差額を配賦差異として振り替えることで、製造間接費勘定の残高をゼロにします。実際250,000円＞予定配賦240,000円なので、配賦しきれなかった10,000円分（不利差異）を製造間接費配賦差異勘定に移します。'
  },
  { id:587, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'直接原価計算の損益計算書：売上高500,000円、変動売上原価200,000円、変動販売費30,000円、固定製造原価120,000円、固定販売管理費80,000円。営業利益を示す決算仕訳をしなさい。',
    e:[{d:[['損益',430000]], c:[['変動売上原価',200000],['変動販売費',30000],['固定製造原価',120000],['固定販売管理費',80000]]}],
    exp:'直接原価計算の損益計算書では、費用を「売上に比例して増減する変動費」と「売上に関係なく一定額かかる固定費」に分けて表示します。売上高から変動費（変動売上原価＋変動販売費）を引いた「貢献利益」がまず270,000円と分かり、そこから固定費（固定製造原価＋固定販売管理費）200,000円を引いた70,000円が最終的な営業利益です。全部原価計算とは違い、固定費を製品原価に含めない点が最大の特徴です。'
  },
  { id:588, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'CVP分析：販売単価@1,000円、変動費@600円、固定費100,000円。損益分岐点販売量・売上高を計算する仕訳形式で示しなさい。（損益分岐点売上高での仕訳）',
    e:[{d:[['固定費',100000],['損益',0]], c:[['貢献利益',100000]]}],
    exp:'CVP分析（損益分岐点分析）は「どれだけ売れば赤字も黒字もない状態になるか」を求める分析です。売上高が1円増えるごとに貢献利益（限界利益）が40％（1,000円－600円÷1,000円）ずつ積み上がっていくので、固定費100,000円をちょうど回収できる売上高は100,000÷0.4＝250,000円（250個）です。これより多く売れれば黒字、少なければ赤字になります。'
  },
  { id:589, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'全部原価計算：生産500個・販売400個、固定製造原価100,000円（@200円/個）。期末製品在庫（100個）への固定費繰延べ仕訳をしなさい。',
    e:[{d:[['製品',20000]], c:[['売上原価',20000]]}],
    exp:'全部原価計算では、固定製造原価も製品原価の一部として扱うため、まだ売れずに在庫として残っている製品には、その分の固定費も一緒に「繰り延べられて」次の期に持ち越されます。生産500個のうち100個が在庫として残ったので、固定費100,000円のうち100個分（20,000円）は今期の費用にならず、翌期に持ち越されます。直接原価計算であれば、固定費は全額その期の費用になるため、この違いが両者の利益額の差を生みます。'
  },
  { id:590, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'労務費の分類：直接工賃金（直接作業）200,000円・間接作業30,000円、間接工賃金50,000円、賞与引当金繰入20,000円。仕掛品と製造間接費に振り分ける仕訳をしなさい。',
    e:[{d:[['仕掛品',200000],['製造間接費',100000]], c:[['賃金給料',280000],['賞与引当金',20000]]}],
    exp:'労務費は、働き方によって仕掛品行きと製造間接費行きに分かれます。特定の製品のために直接作業した分（200,000円）は仕掛品へ、間接的な作業（間接作業・間接工の賃金）や、将来の賞与に備えて積み立てる引当金繰入額（20,000円）は、どれも特定の製品には直接ひもづかないため、まとめて製造間接費（100,000円）へ計上します。'
  },
  { id:591, level:2, cat:'工業簿記', chap:'工業簿記',
    q:'内部材料副費（倉庫費等）を購入代価の5%で予定配賦。当月購入代価100,000円。材料副費配賦の仕訳をしなさい。',
    e:[{d:[['材料',5000]], c:[['材料副費',5000]]}],
    exp:'材料副費の中には、引取運賃のように取引ごとに金額がはっきりするものだけでなく、倉庫の維持費や材料担当者の給料のように、日常的にかかり続ける費用（内部材料副費）もあります。これらは購入代価に対する一定の比率（5％）であらかじめ予定配賦しておき、材料の取得原価に含めます。100,000円×5％＝5,000円がこの分の材料副費です。'
  },
  { id:592, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'原価差異（総額）：材料費差異22,400円（不利）・労務費差異3,800円（不利）・製造間接費差異3,000円（不利）。合計29,200円を売上原価に賦課する仕訳をしなさい。',
    e:[{d:[['売上原価',29200]], c:[['直接材料費差異',22400],['直接労務費差異',3800],['製造間接費配賦差異',3000]]}],
    exp:'標準原価計算では、材料費・労務費・製造間接費それぞれで生じた差異を、期末にまとめて精算します。すべて実際の方が多くかかった不利差異（借方残）なので、合計29,200円を売上原価に足し込みます。「予定より高くついた分は、最終的に売上原価を増やす形で調整する」というのが、差異の代表的な処理方法です。'
  },
  { id:593, level:3, cat:'工業簿記', chap:'工業簿記',
    q:'特別注文（差額原価分析）：変動費@500円の製品を@700円で100個追加受注。遊休設備あり・固定費増加なし。受注した場合の増分利益を仕訳で示しなさい。',
    e:[{d:[['売掛金',70000]], c:[['売上',70000]]}],
    exp:'追加注文を受けるかどうかは、「その注文によって、新たに発生する収益と費用（差額原価収益）」だけで判断します。遊休設備を使うので固定費は増えず、変動費（1個500円）だけがかかります。売価700円×100個－変動費500円×100個＝20,000円のプラスなので、たとえ通常の販売価格より安くても、この注文は受けた方が会社の利益は増えます。'
  },
  // ===== 連結会計 =====
  { id:594, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社はS社株式80%を800,000円で取得。取得日S社純資産800,000円（資本金500,000円・利益剰余金300,000円）。のれん160,000円。連結開始仕訳をしなさい。',
    e:[{d:[['資本金',500000],['利益剰余金',300000],['のれん',160000]], c:[['子会社株式',800000],['非支配株主持分',160000]]}],
    exp:'子会社株式を取得すると、親会社の「投資額」と子会社の「純資産」という、実質的に同じものが帳簿上は別々に存在してしまいます。連結財務諸表ではこの重複を相殺消去し、①親会社が持っていない20％分は「非支配株主持分」として区分し、②投資額が子会社の持分相当額より多く払った分（160,000円）は「のれん」として計上します。'
  },
  { id:595, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'のれん160,000円を20年定額償却。1年分の仕訳をしなさい。',
    e:[{d:[['のれん償却額',8000]], c:[['のれん',8000]]}],
    exp:'のれんは、買収時に子会社の帳簿上の価値以上に払った「見えない価値」への対価です。これを一括で費用にせず、その価値が会社に貢献してくれるであろう期間（20年）に分けて、毎年少しずつ費用として計上（償却）していきます。160,000円÷20年＝8,000円が今年の負担分です。'
  },
  { id:596, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'S社の当期純利益200,000円のうち非支配株主（20%）への帰属分の仕訳をしなさい。',
    e:[{d:[['非支配株主に帰属する当期純利益',40000]], c:[['非支配株主持分',40000]]}],
    exp:'子会社の利益のすべてが親会社のものになるわけではなく、親会社が持っていない20％分の株式を持つ非支配株主にも、その持分に応じた取り分があります。200,000円×20％＝40,000円を「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）に振り替えることで、親会社の取り分（残り80％＝160,000円）だけが連結純利益に反映されます。'
  },
  { id:597, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',

    e:[{d:[['受取配当金',80000],['非支配株主持分',20000]], c:[['利益剰余金',100000]]}],
    exp:'子会社が配当を支払っても、グループ全体で見れば内部でお金が動いただけです。親会社が受け取った配当金（80,000円）はもともと連結上の利益として計上済みなので取り消し、非支配株主が受け取った分（20,000円）は非支配株主持分を減らす形で処理して、子会社の利益剰余金の減少として一つにまとめます。'
  },
  { id:598, level:3, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社→S社への売上500,000円（売上原価400,000円）を連結上で消去する仕訳をしなさい（ダウンストリーム）。',

    exp:'親会社から子会社への販売は、グループ全体で見れば「自社の中でモノが移動しただけ」です。親会社が計上した売上高とS社が計上した仕入（売上原価の一部）は、相手があって初めて成立する取引なので、連結財務諸表を作るときは両方とも消去し、グループが本当に外部へ売った分だけを残します。'
  },
  { id:599, level:3, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社がS社に売った商品のうちS社期末在庫に含まれる未実現利益50,000円（ダウンストリーム）を消去する仕訳をしなさい。',

    exp:'親会社から子会社に売った商品がまだ子会社の倉庫に残っている場合、そこに乗っている利益（50,000円）はグループ全体で見ればまだ外部のお客様に届いていません。連結財務諸表では、この未実現の利益を取り消し、棚卸資産の評価額を本来の原価水準まで引き下げます。'
  },
  { id:600, level:3, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'アップストリーム：S社→P社の商品売上に含まれる未実現利益30,000円を消去。非支配株主（20%）への影響を含めて仕訳しなさい。',
    e:[{d:[['売上原価',30000]], c:[['棚卸資産',24000],['非支配株主持分',6000]]}],
    exp:'子会社から親会社へ売った商品に含まれる未実現利益（30,000円）は、もともと子会社が稼いだ利益なので、消去する際には非支配株主にもその負担分を反映させる必要があります。30,000円×20％＝6,000円を非支配株主持分から取り除き、残り24,000円を棚卸資産の評価額から消去します。'
  },
  { id:601, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社のS社への長期貸付金300,000円とS社の長期借入金300,000円を連結消去する仕訳をしなさい。',
    e:[{d:[['長期借入金',300000]], c:[['長期貸付金',300000]]}],
    exp:'親会社が子会社にお金を貸し、子会社がそれを借入金として計上している場合、グループ全体で見ればこれも社内でのお金の融通にすぎません。連結財務諸表では、この長期貸付金（親会社の資産）と長期借入金（子会社の負債）を相殺消去し、外部に対する本当の資産・負債だけを残します。'
  },
  { id:602, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社のS社への受取利息30,000円とS社の支払利息30,000円を連結消去する仕訳をしなさい。',
    e:[{d:[['受取利息',30000]], c:[['支払利息',30000]]}],
    exp:'貸付金・借入金の元本と同じように、そこから生まれる利息のやり取りも、グループ全体で見れば内部での資金移動にすぎません。親会社が受け取った受取利息と子会社が支払った支払利息を相殺消去することで、グループが本当に外部とやり取りした収益・費用だけが連結損益計算書に残ります。'
  },
  { id:603, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社売掛金にS社からの未収分500,000円、S社買掛金にP社分500,000円が含まれる。P社が設定した貸倒引当金25,000円（5%）も含め2本の消去仕訳をしなさい。',
    e:[{d:[['買掛金',500000],['貸倒引当金',25000]], c:[['売掛金',500000],['貸倒引当金繰入',25000]]}],
    exp:'グループ内の売掛金・買掛金を相殺消去するときは、その債権に対して設定していた貸倒引当金も一緒に取り消す必要があります。グループ内部の相手が貸し倒れることを見込んで引当金を積むのは、連結全体で見れば意味がない（自社が自社に貸し倒れることを心配しているようなもの）ため、貸倒引当金・貸倒引当金繰入もあわせて消去します。'
  },
  { id:604, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'S社がP社に土地（帳簿価額800,000円）を1,000,000円で売却した。連結上で未実現利益を消去する仕訳をしなさい。',
    e:[{d:[['固定資産売却益',200000]], c:[['土地',200000]]}],
    exp:'子会社が親会社に土地を売って利益を得ても、グループ全体で見ればその土地はまだグループの外に出ていません。連結財務諸表では、この売却益（200,000円）を未実現利益として取り消し、親会社の帳簿上の土地の金額も、子会社が本来持っていた帳簿価額（800,000円）まで修正します。'
  },
  { id:605, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'持分法：P社はA社株式30%（関連会社）取得。A社当期純利益100,000円。持分法による投資損益の仕訳をしなさい。',
    e:[{d:[['関連会社株式',30000]], c:[['持分法による投資利益',30000]]}],
    exp:'持分法は、子会社ほど強い支配関係にはないけれど、一定の影響力を持つ関連会社（議決権30％など）に使う方法です。関連会社の資産・負債をすべて取り込むのではなく、関連会社が稼いだ利益のうち自社の持分比率に応じた分だけを、投資額に上乗せする形で反映します。100,000円×30％＝30,000円が、この期に業績を反映して増える投資額です。'
  },
  { id:606, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'持分法：関連会社A社が配当50,000円支払い（P社受取分15,000円）。持分法適用時の仕訳をしなさい。',
    e:[{d:[['現金',15000]], c:[['関連会社株式',15000]]}],
    exp:'持分法を適用している関連会社から配当を受け取ったときは、通常の「受取配当金（収益）」としては処理しません。すでに関連会社の利益を持分法によって投資額に織り込み済みなので、配当を受け取った分は「投資額の一部を現金として回収した」と考え、関連会社株式（資産）を減らします。二重に利益を計上しないための工夫です。'
  },
  { id:607, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'本支店会計：本店がS支店に商品150,000円を送った（原価ベース）。本店側の仕訳をしなさい。',
    e:[{d:[['支店',150000]], c:[['仕入',150000]]}],
    exp:'本店が支店へ商品を送ると、本店の帳簿では商品（仕入）が外に出ていく一方、それは支店に対する貸しと考えて支店勘定（資産）が増えます。支店側では商品（仕入）が増え、その代金をまだ精算していないので本店勘定（負債的性質）が増えます。本店・支店を合算するときに、この2つの内部勘定は相殺され消えます。'
  },
  { id:608, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'本支店会計：本店が支店の当期純利益50,000円を受け入れる決算仕訳（本店側）をしなさい。',

    exp:'支店が稼いだ利益は、最終的に会社全体の利益としてまとめる必要があります。本店は支店からの利益報告を受け取ったと考えて、支店勘定（資産）を増やすと同時に、自社の損益（収益）に組み入れます。本支店の損益計算書を合算するときは、このように支店の業績が本店にまとめて反映されます。'
  },
  { id:609, level:3, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'未達取引：支店が本店へ送った現金30,000円がまだ本店に届いていない。本店側で未達取引を修正する仕訳をしなさい。',
    e:[{d:[['現金',30000]], c:[['支店',30000]]}],
    exp:'支店が本店へお金を送っても、届くまでにタイムラグがあり、決算日をまたいでしまうことがあります（未達取引）。この場合、送った側（支店）の帳簿ではすでに処理済みでも、受け取る側（本店）の帳簿にはまだ記録されていません。本店側で「本来あるべき状態」に合わせて、現金の受け取りと支店勘定の減少を追加で記録します。'
  },
  { id:610, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',

    exp:'前の期に「まだ売れていない」として取り消した利益（未実現利益）が、当期になって実際に外部へ販売され、本当に実現したとします。この場合、前期末の消去仕訳をそのまま逆向きに戻す「開始仕訳」を入れて、棚卸資産の金額と利益剰余金を元に戻すことで、当期に実現した利益が正しく反映されるようにします。'
  },
  { id:611, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主',

    e:[{d:[['受取配当金',40000],['非支配株主持分',10000]], c:[['利益剰余金',50000]]}],
    exp:'子会社が配当を支払うと、グループ全体で見れば内部でお金が動いただけです。親会社が受け取った配当金（40,000円）はもともと連結上の利益として計上済みなので取り消し、非支配株主が受け取った分（10,000円）は非支配株主持分を減らす形で処理して、子会社の利益剰余金の減少として一つにまとめます。'
  },
  // ===== 外貨建取引の補充 =====
  { id:612, level:2, cat:'外貨建', chap:'外貨建・伝票・給与',

  },
  { id:613, level:2, cat:'外貨建', chap:'外貨建・伝票・給与',
