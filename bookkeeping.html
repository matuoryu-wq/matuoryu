  { id:1192, calc:'', cat:'貸倒引当金', chap:'決算整理',
    q:'X社は、前の期の決算で、回収できなくなる可能性に備えて、貸倒引当金を設定していた。今期の決算にあたり、得意先の状況が改善したため、<mark class="q-revenue">この見積りが、3円、大きすぎたことがわかった</mark>。X社は、<mark class="q-as-li">この3円分を、取り消す</mark>。決算に必要な仕訳を行いなさい。',
    e:[{d:[['貸倒引当金',3]],c:[['貸倒引当金戻入',3]]}],
    exp:'前期に見積もった貸倒引当金が、実際には多すぎたと分かった場合は、その超過分を取り崩して「貸倒引当金戻入」という収益として計上します。「将来の損失に備えて多めに積み立てすぎていた分を、状況の改善にあわせて払い戻す」というイメージです。'
  },
  { id:1193, calc:'10＋5＝15円', cat:'租税・貯蔵品', chap:'決算整理',
    q:'X社は、新商品の案内状を、お客さん200人に送ることにした。案内状に貼る<mark class="q-expense">郵便切手10円分</mark>と、契約書に貼る<mark class="q-expense">収入印紙5円分</mark>が、必要になった。そこで、郵便局で、郵便切手10円分と、収入印紙5円分を、<mark class="q-asset">現金で購入した</mark>。購入したときは、すぐに、費用として記録した。この日の仕訳を行いなさい。',
    e:[{d:[['通信費',10],['租税公課',5]],c:[['現金',15]]}],
    exp:'郵便切手は通信のための費用なので「通信費」、収入印紙は税金関係の費用なので「租税公課」と、それぞれ性質の異なる科目に分けて計上します。購入した時点でいったん全額を費用として処理するのが一般的なやり方です。'
  },
  { id:1194, calc:'4＋2＝6円', cat:'租税・貯蔵品', chap:'決算整理',
    q:'決算にあたり、X社は、上記の郵便切手と収入印紙のうち、まだ使っていない分を確認した。<mark class="q-asset">未使用の郵便切手は4円分、未使用の収入印紙は2円分</mark>であった。これらは、まだ使っていないので、価値が残っている。購入時に、<mark class="q-expense">郵便切手は通信費</mark>、<mark class="q-expense">収入印紙は租税公課</mark>として費用処理している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['貯蔵品',6]],c:[['通信費',4],['租税公課',2]]}],
    exp:'切手や収入印紙は、購入した時点でいったん全額を費用として計上するのが一般的ですが、決算時にまだ使っていない分が残っていたら、それは「来期以降に使う分」なので、今期の費用から取り除いて「貯蔵品」という資産に振り替えます。未使用の切手4円と収入印紙2円、合わせて6円を貯蔵品に計上します。'
  },
  { id:1195, calc:'4＋2＝6円', cat:'租税・貯蔵品', chap:'決算整理',
    q:'翌期の期首（期の初め）を迎えた。X社は、前の期の決算で、未使用の郵便切手4円分と収入印紙2円分を、<mark class="q-asset">貯蔵品として処理していた</mark>。これらは、翌期も使うため、そのまま持ち越している。<mark class="q-expense">郵便切手は通信費</mark>、<mark class="q-expense">収入印紙は租税公課</mark>に戻すため、翌期の期首にあたり、X社は、これらについて、<strong>再振替仕訳</strong>を行いなさい。',
    e:[{d:[['通信費',4],['租税公課',2]],c:[['貯蔵品',6]]}],
    exp:'「期首」とは、会計期間の最初の日のことです。「再振替仕訳」とは、前の期の決算で行った、経過勘定などの処理を、次の期の初めに、いったん元に戻す仕訳のことです。前期末に貯蔵品（資産）としていったん計上していた切手・印紙を、新しい期が始まったタイミングで、もとの費用科目（通信費・租税公課）に戻します。こうすることで、翌期に実際に使ったときは、あらためて複雑な調整をせずに済みます。'
  },
  { id:1196, calc:'800＋2＝802円', cat:'決算振替', chap:'決算整理',
    q:'書籍や文房具を販売しているX社は、決算を迎えた。会社は、決算のときに、その期の収益と費用を、それぞれの勘定から、損益勘定という1つの勘定に集めて、その期の利益を計算する。収益の勘定のうち、<mark class="q-revenue">売上の残高は800円</mark>、<mark class="q-revenue">受取利息の残高は2円</mark>であった。これらの収益の勘定の残高を、<mark class="q-other">損益勘定に振り替える</mark>、決算の仕訳を行いなさい。',
    e:[{d:[['売上',800],['受取利息',2]],c:[['損益',802]]}],
    exp:'「損益勘定」とは、その期の収益と費用を、1か所に集めて、利益を計算するための、決算専用の勘定のことです。決算になると、まず収益の勘定（売上・受取利息など）をすべてこの損益勘定に集め、それぞれの収益の勘定を空っぽ（ゼロ）に戻します。売上800円と受取利息2円を合わせた802円が、損益勘定の貸方に集まります。'
  },
  { id:1197, calc:'600＋50＝650円', cat:'決算振替', chap:'決算整理',
    q:'X社は、上記の続きの決算の手続きとして、今度は、費用の勘定の残高を、損益勘定に振り替える。上記で、収益の勘定を損益勘定に集めたのと、同じ手続きである。費用の勘定のうち、<mark class="q-expense">仕入の残高は600円</mark>、<mark class="q-expense">給料の残高は50円</mark>であった。これらの費用の勘定の残高を、<mark class="q-other">損益勘定に振り替える</mark>、決算の仕訳を行いなさい。',
    e:[{d:[['損益',650]],c:[['仕入',600],['給料',50]]}],
    exp:'決算振替の2つ目のステップとして、費用の勘定（仕入・給料など）もすべて損益勘定に集めます。これで、損益勘定の借方には費用の合計（650円）、貸方には収益の合計（802円、前問）が並ぶことになり、この差額がそのまま「今期の儲け（当期純利益）」を表します。'
  },
  { id:1198, calc:'', cat:'決算振替', chap:'決算整理',
    q:'X社は、収益と費用の勘定の残高を、損益勘定に集めた。収益の合計802円から、費用の合計650円を引いた、<mark class="q-equity">152円の残高（当期純利益）</mark>が、損益勘定の貸方に残った。X社は、当期純利益を、これまでに稼いだ利益の蓄積を表す勘定に加えていく。<mark class="q-other">損益勘定の貸方残高152円を</mark>、その勘定に振り替える、決算の仕訳を行いなさい。',
    e:[{d:[['損益',152]],c:[['繰越利益剰余金',152]]}],
    exp:'損益勘定に集計した結果、収益（802円）が費用（650円）を上回り、152円の利益が出たことが分かりました。この利益は最終的に会社の財産（純資産）の一部として蓄積されるので、「繰越利益剰余金」という純資産の勘定に振り替えます。これで損益勘定はきれいにゼロに戻り、翌期の集計に備えられます。'
  },
  { id:1199, calc:'', cat:'決算振替', chap:'決算整理',
    q:'個人でパン屋（山田ベーカリー）を営む山田花子さんは、決算にあたり、収益と費用の勘定の残高を、損益勘定に集めた。その結果、損益勘定の貸方に、<mark class="q-equity">152円の残高（当期純利益）</mark>が残った。個人事業では、当期純利益は、店主の元手を表す勘定に加える。<mark class="q-other">損益勘定の貸方残高152円を</mark>、その勘定に振り替える、決算の仕訳を行いなさい。',
    e:[{d:[['損益',152]],c:[['資本金',152]]}],
    exp:'株式会社では利益を「繰越利益剰余金」に振り替えますが、個人事業主の場合は、利益を店主の元手を表す「資本金」という勘定に直接加えます。会社の形態によって、利益の行き先の科目が異なる点に注意しましょう。'
  },
  { id:1200, calc:'', cat:'経過勘定', chap:'決算整理',
    q:'荷物の運送をしているX社は、前の期の決算で、翌期に対応する<mark class="q-expense">保険料8円を</mark>、<mark class="q-asset">前払費用として処理していた</mark>。この保険料は、前の期に、支払ったときに、費用として記録したものを、決算で、費用から差し引いた分である。当期の期首（期の初め）を迎えた。X社は、この前払費用を、もとの保険料の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['支払保険料',8]],c:[['前払費用',8]]}],
    exp:'前期末の決算で「まだ使っていない保険期間の分」を前払費用（資産）として計上していました。新しい期が始まったら、この分をいったん逆向きの仕訳で取り消しておきます。こうすることで、翌期分の保険期間が実際に経過したときに、余計な調整をせず、シンプルに費用計上できるようになります。'
  },
  { id:1201, calc:'', cat:'経過勘定', chap:'決算整理',
    q:'X社は、前の期の決算で、<mark class="q-expense">まだ支払っていなかった利息3円を</mark>、<mark class="q-liability">未払費用として処理していた</mark>。この利息は、前の期に、すでに発生していたものを、決算で、見越して費用に計上した分である。当期の期首を迎えたので、この未払費用を、もとの利息の費用の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['未払費用',3]],c:[['支払利息',3]]}],
    exp:'前期末の決算で「まだ支払っていないが今期分として発生している費用」を未払費用（負債）として先取りして計上していました。新しい期が始まったら、この先取り分をいったん逆向きの仕訳で取り消しておきます。こうすることで、実際に支払ったときに余計な調整をせず、シンプルに記録できるようになります。'
  },
  { id:1202, calc:'', cat:'経過勘定', chap:'決算整理',
    q:'X社は、前の期の決算で、<mark class="q-revenue">まだ提供していない期間の家賃8円を</mark>、<mark class="q-liability">前受収益として処理していた</mark>。この家賃は、前の期に、受け取ったときに、収益として記録したものを、決算で、収益から差し引いた分である。当期の期首を迎えたので、この前受収益を、もとの家賃の収益の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['前受収益',8]],c:[['受取家賃',8]]}],
    exp:'前期末の決算で「まだサービスを提供していない翌期分」を前受収益（負債）として計上していました。新しい期が始まったら、この分をいったん逆向きの仕訳で取り消しておきます。これにより、翌期に実際にサービス提供期間が経過したときに、素直に収益として認識できるようになります。'
  },
  { id:1203, calc:'', cat:'経過勘定', chap:'決算整理',
    q:'X社は、前の期の決算で、<mark class="q-revenue">まだ受け取っていなかった利息2円を</mark>、<mark class="q-asset">未収収益として処理していた</mark>。この利息は、前の期に、すでに発生していたものを、決算で、見越して収益に計上した分である。当期の期首を迎えたので、この未収収益を、もとの利息の収益の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['受取利息',2]],c:[['未収収益',2]]}],
    exp:'前期末の決算で「まだ受け取っていないが今期分として発生している収益」を未収収益（資産）として先取りして計上していました。新しい期が始まったら、この先取り分をいったん逆向きの仕訳で取り消しておきます。実際に利息を受け取ったときに、あらためて収益として記録し直す準備です。'
  },
  { id:1204, calc:'', cat:'修正仕訳', chap:'決算整理',
    q:'X社は、仕入先に対する<mark class="q-liability">未払いの代金40円を、現金で支払った</mark>。経理担当者は、この取引を、誤って、<mark class="q-expense">借方を「仕入」として記帳していた</mark>（貸方の現金は、正しく記帳している）。決算のときに、この誤りが見つかった。誤りを訂正して、正しい仕訳にするための、訂正の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['仕入',40]]}],
    exp:'間違えた仕訳を直す方法は「①間違いを逆向きに消す→②正しく書き直す」の2ステップですが、まとめて1本の訂正仕訳で表すこともできます。誤って記帳していた「仕入40／現金40」を正しい「買掛金40／現金40」に直すには、貸方の現金はすでに正しいのでそのままにし、借方だけを「仕入」から「買掛金」に付け替えます。差額として「買掛金40／仕入40」という訂正仕訳を行うことで、帳簿が正しい状態になります。'
  },
  { id:1205, calc:'', cat:'修正仕訳', chap:'決算整理',
    q:'X社は、<mark class="q-asset">得意先に対する未回収の代金を</mark>、現金で回収した。<mark class="q-asset">回収した金額は、150円であったが、経理担当者は、誤って、120円と記帳していた</mark>。決算のときに、この誤りが見つかった。差額の30円を訂正する仕訳を行いなさい。',
    e:[{d:[['現金',30]],c:[['売掛金',30]]}],
    exp:'本当は150円回収していたのに、120円としか記帳していなかったケースです。記帳が足りなかった差額30円分だけ、現金（資産）を追加で増やし、売掛金（資産）を追加で減らします。「記帳し忘れていた分を、あとから付け足す」シンプルな訂正仕訳です。'
  },
  { id:1300, calc:'', cat:'帳簿の締切', chap:'決算整理',
    q:'X社は、決算にあたり、収益と費用の勘定の残高を損益勘定に集めた。その結果、<mark class="q-other">費用の合計が収益の合計を20円上回った</mark>（損益勘定の借方残高20円＝当期純損失）。この損益勘定の残高を、<mark class="q-equity">これまでに稼いだ利益の蓄積を表す勘定</mark>に振り替えなさい。',
    e:[{d:[['繰越利益剰余金',20]],c:[['損益',20]]}],
    exp:'損益勘定の借方残高は、費用が収益を上回った分＝当期純損失です。この残高を反対側（貸方）に書いて損益勘定を0にし、繰越利益剰余金を減らします（借方）。純利益のときと、貸借がちょうど逆になります。'
  },
  // --- 工業簿記 ---
  { id:1211, calc:'50＋5＝55円', cat:'材料費', chap:'工業簿記①材料費・労務費',
    q:'自動車向けの金属部品を製造しているX社は、<mark class="q-asset">部品の材料となる鋼材50円分</mark>を、鉄鋼商社のY社から<mark class="q-liability">掛けで購入</mark>した。鋼材を工場まで運んでもらうための引取運賃5円は、X社が負担し、<mark class="q-asset">現金で支払</mark>った。<u class="q-ul">引取運賃は、材料の取得原価に含める</u>決まりになっている。この日の仕訳を行いなさい。',
    e:[{d:[['材料',55]],c:[['買掛金',50],['現金',5]]}],
    exp:'「引取運賃」とは、買ったものを、相手先から自社まで運んでもらうための運賃のことです。「取得原価」とは、買ったときに支払った金額のことです。工業簿記でも商業簿記と同じように、材料を使えるようになるまでにかかった付随費用（引取運賃）は、材料本体の値段に含めます。鋼材代金50円に運賃5円を加えた55円を「材料」という資産として計上します。'
  },
  { id:1212, calc:'', cat:'材料費', chap:'工業簿記①材料費・労務費',
    q:'X社は、<mark class="q-asset">材料を製造に使った</mark>とき、あらかじめ決めておいた価格（<strong>予定消費価格</strong>）で消費額を計算し、記帳している。当月は、予定消費価格で計算した消費額が50円であった。月末に、実際に仕入れた価格で計算しなおすと、消費額は52円であった。<mark class="q-other">実際の消費額のほうが2円多い</mark>ため、月末に、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['材料消費価格差異',2]],c:[['材料',2]]}],
    exp:'「予定消費価格」とは、材料の消費額を計算するために、あらかじめ決めておく1単位あたりの価格のことです。実際の価格を待たずに、あらかじめ決めた価格で計算しておくことで、すばやく原価を把握できます。月末に実際の価格で計算しなおした結果とのズレ（52円－50円＝2円）は、「材料消費価格差異」という差異の科目で処理し、材料という資産の帳簿価額も実際の金額に合わせて修正します。'
  },
  { id:1213, calc:'', cat:'労務費', chap:'工業簿記①材料費・労務費',
    q:'X社は、毎月25日に、従業員に労働の対価を支払っている。今月の支給日を迎え、工場の製造ラインで、部品の切断や研磨などの加工を行っている作業員に、今月の<mark class="q-expense">労働の対価40円</mark>を、<mark class="q-asset">現金で支払</mark>った。<u class="q-ul">作業員は、製品の加工に直接たずさわっている</u>。この日の仕訳を行いなさい。',
    e:[{d:[['賃金',40]],c:[['現金',40]]}],
    exp:'製品の加工に直接たずさわる作業員の労働の対価は「賃金」という労務費（製造原価の一部）で処理します。工場で働く人の人件費でも、製品を直接作る作業員（直接工）には「賃金」、事務作業を行う職員（間接工）には「給料」というように、役割によって使う科目が分かれる点がポイントです。'
  },
  { id:1214, calc:'', cat:'労務費', chap:'工業簿記①材料費・労務費',
    q:'X社は、同じ支給日に、<mark class="q-expense">工場の事務所で働く職員にも、労働の対価</mark>を支払った。この職員は、材料の発注や帳簿付けなどの管理の仕事を行っており、製品の加工にはたずさわっていない。支払った今月の労働の対価は20円で、<mark class="q-asset">現金で支払</mark>った。この日の仕訳を行いなさい。',
    e:[{d:[['給料',20]],c:[['現金',20]]}],
    exp:'製品の加工に直接たずさわらない、管理的な仕事をする職員の労働の対価は「給料」で処理します。前問の「賃金」（製品を直接作る作業員）とは区別し、製造間接費（どの製品にかかったか直接特定できない費用）として扱われることになります。'
  },
  { id:1215, calc:'', cat:'労務費', chap:'工業簿記①材料費・労務費',
    q:'X社は、<mark class="q-expense">作業員の労働の消費額</mark>を、あらかじめ決めた1時間あたりの金額（<strong>予定賃率</strong>）で計算し、記帳している。当月は、残業が多かったため、実際の1時間あたりの金額（実際賃率）が予定賃率より高くなった。その結果、実際の消費額が、<mark class="q-other">予定賃率で計算した額より3円多くなった</mark>。月末に、この<u class="q-ul">差額を賃金の勘定から振り替え</u>るために必要な仕訳を行いなさい。',
    e:[{d:[['賃率差異',3]],c:[['賃金',3]]}],
    exp:'「予定賃率」とは、労働の消費額を計算するために、あらかじめ決めておく1時間あたりの金額のことです。「実際賃率」とは、実際に支払った労働の対価から計算した、1時間あたりの金額のことです。材料費の予定消費価格と同じ考え方で、労務費も予定賃率であらかじめ計算しておき、月末に実際の金額とのズレを「賃率差異」として処理します。残業が多いと実際の時給が上がり、不利な差異（費用が増える方向）が生じやすくなります。'
  },
  { id:1216, calc:'', cat:'経費', chap:'工業簿記②経費・製造間接費・個別',
    q:'月末に、X社は、工場の建物について、当月分の減価償却費15円を計上する。工場の建物は、すべての製品の製造に使われているため、その減価償却費は、<mark class="q-expense">どの製品にかかったかを直接特定できない製造のための費用</mark>として扱う。記帳は<mark class="q-asset">間接法</mark>による。この日の仕訳を行いなさい。',
    e:[{d:[['製造間接費',15]],c:[['減価償却累計額',15]]}],
    exp:'工場の建物のように、特定の製品にではなく、工場全体の製造活動のために使われる資産の減価償却費は「製造間接費」として処理します。どの製品にいくらかかったかを直接特定できない費用は、いったんこの「製造間接費」という科目にまとめて集め、あとで一定の基準で各製品に振り分けます（配賦）。'
  },
  { id:1217, calc:'10＋8＋5＝23円', cat:'製造間接費', chap:'工業簿記②経費・製造間接費・個別',
    q:'X社は、材料・労働・その他の費用のうち、<mark class="q-expense">どの製品にかかったかを直接特定できないもの</mark>を、月末に、まとめて1つの勘定に集めている。当月の、そうした間接的な費用は、<mark class="q-asset">材料10円</mark>、<mark class="q-expense">労働8円</mark>、その<mark class="q-expense">他の費用5円</mark>であった。その他の費用（電力料など）は、発生したときに、材料や労働とは別の勘定に記録してある。月末に、これらを1つの勘定（製造間接費）に集める仕訳を行いなさい。',
    e:[{d:[['製造間接費',23]],c:[['材料',10],['賃金',8],['経費',5]]}],
    exp:'間接的な材料費（補助材料など）、間接的な労務費（間接工の給料など）、そして電力料のような「経費」を、月末にまとめて「製造間接費」という1つの勘定に集計します。材料10円＋賃金8円＋経費5円＝23円が、今月の製造間接費の総額です。これを次の問題で、各製品に配賦していきます。'
  },
  { id:1218, calc:'', cat:'製造間接費', chap:'工業簿記②経費・製造間接費・個別',
    q:'X社は、上記のように集めた<mark class="q-expense">間接的な費用</mark>を、製品ごとの原価に含めるため、製造中の製品に割り振っている。月末まで待たずに製品の原価を計算できるよう、割り振りには、あらかじめ決めた配賦率（<strong>予定配賦率</strong>）を使う。当月、予定配賦率にもとづいて間接的な費用から、<mark class="q-asset">製造中の製品に配賦した額は、23円</mark>であった。この仕訳を行いなさい。',
    e:[{d:[['仕掛品',23]],c:[['製造間接費',23]]}],
    exp:'「配賦」とは、共通してかかった費用を、一定の基準で、製品などに割り振ることです。「予定配賦率」とは、間接的な費用を配賦するために、あらかじめ決めておく割合のことです。製造間接費という「まとめ箱」に集めた費用を、あらかじめ決めた配賦率で、実際に製造している製品（仕掛品）の原価に振り分けます。'
  },
  { id:1219, calc:'', cat:'個別原価計算', chap:'工業簿記②経費・製造間接費・個別',
    q:'X社は、当月、得意先から<mark class="q-asset">注文を受けていたブレーキ部品</mark>の製造を完了した。<mark class="q-asset">完成した部品の製造原価は、100円</mark>である。完成した部品は、工場から倉庫に移され、出荷を待っている。完成した日の仕訳を行いなさい。',
    e:[{d:[['製品',100]],c:[['仕掛品',100]]}],
    exp:'製造が完了すると、それまで製造中の原価を集計していた「仕掛品」（未完成の在庫）から、完成品を表す「製品」という資産に振り替えます。材料費・労務費・製造間接費がすべて集まって、ようやく1つの完成品の原価が確定する瞬間です。'
  },
  { id:1220, calc:'', cat:'製造間接費', chap:'工業簿記②経費・製造間接費・個別',
    q:'月末に、X社が、当月の<mark class="q-expense">間接的な費用</mark>の実際の発生額を集計したところ、25円であった。一方、予定配賦率にもとづいて製造中の製品に配賦した額は、23円であった。<mark class="q-other">実際の発生額のほうが2円多く</mark>、配賦しきれずに残っている。この差額について、月末に必要な仕訳を行いなさい。',
    e:[{d:[['製造間接費配賦差異',2]],c:[['製造間接費',2]]}],
    exp:'予定配賦率で各製品に配り終えた後、製造間接費という勘定には「実際にかかった金額」と「予定で配った金額」の差額が残ります。実際発生額（25円）の方が予定配賦額（23円）より多かったので、この差額2円を「製造間接費配賦差異」という差異の科目で処理し、製造間接費の勘定をゼロに締め切ります。'
  },
  { id:1221, calc:'', cat:'個別原価計算', chap:'工業簿記②経費・製造間接費・個別',
    q:'X社は、ある得意先から注文を受けた部品の製造中に、<mark class="q-expense">通常起こりうる程度の不良品（</mark><strong><mark class="q-expense">正常仕損</mark></strong><mark class="q-expense">）</mark>を出した。この不良品は、補修すれば使えるため、補修の作業を行った。補修にかかった費用は、<mark class="q-asset">補修のための指図書に集計した6円</mark>である。この補修の費用を、補修指図書（仕掛品）から、仕損による費用として計上する仕訳を行いなさい。',
    e:[{d:[['仕損費',6]],c:[['仕掛品',6]]}],
    exp:'「仕損」とは、製造の途中で、不良品が出ることです。「指図書」とは、製造や補修の作業の内容を指示し、その費用を集計する書類のことです。通常の製造活動の中で起こりうる程度の不良（正常仕損）は、その補修費用を「仕損費」として製品の原価の一部に含めます。'
  },
  { id:1222, calc:'', cat:'個別原価計算', chap:'工業簿記②経費・製造間接費・個別',
    q:'X社では、別の月に、工場の機械が大きく故障し、<mark class="q-expense">通常では考えられない量の不良品が出た（</mark><strong><mark class="q-expense">異常仕損</mark></strong>）。この不良品は、直すことができず、廃棄した。この<mark class="q-asset">不良品にかかっていた製造原価は、6円</mark>である。異常仕損による損失は、製品の原価に含めず、製造とは関係のない損失（営業外費用）として処理する。この日の仕訳を行いなさい。',
    e:[{d:[['異常仕損費',6]],c:[['仕掛品',6]]}],
    exp:'「営業外費用」とは、会社の本来の営業活動とは関係なく生じた費用や損失のことです。機械の大故障のような、通常では考えられない異常な原因で生じた仕損は、正常な製造活動のコストとはみなさず、「異常仕損費」として製品原価から切り離し、特別な損失として処理します。「正常な仕損は原価に、異常な仕損は損失に」という区別がポイントです。'
  },
  { id:1223, calc:'', sides:['本社側','工場側'], cat:'本社工場会計', chap:'工業簿記②経費・製造間接費・個別',
    q:'X社は、<mark class="q-other">本社</mark>と<mark class="q-other">工場</mark>で、それぞれ別々に帳簿をつけている（<strong>本社工場会計</strong>）。工場の帳簿には、現金の勘定がなく、お金の支払いは、すべて本社が行う。当月、本社は、工場の<mark class="q-expense">作業員の労働の対価</mark>30円を、<mark class="q-asset">現金で支払った</mark>。本社は工場勘定で工場に付け替え、工場は本社勘定を相手に記帳する。本社と工場の、それぞれの仕訳を行いなさい。',
    e:[{d:[['工場',30]],c:[['現金',30]]},{d:[['賃金',30]],c:[['本社',30]]}],
    exp:'「本社工場会計」とは、本社と工場が、それぞれ別々に帳簿をつける仕組みのことです（本社と工場の間のやりとりは、相手を表す勘定で記録します）。本社は、工場のために立て替えて払った現金を「工場」という内部取引専用の勘定（照合勘定）で記録し、工場は、受け取った労働対価を「賃金」という費用として計上し、相手科目に「本社」勘定を使います。この2つの帳簿を合算すると、内部取引（本社・工場勘定）は相殺されて消えます。'
  },
  { id:1224, calc:'', cat:'部門別原価計算', chap:'工業簿記③部門別・直接原価',
    q:'注文を受けて、1点ずつ家具を製造しているX社の工場には、木材を切って削る<strong>切削部門</strong>と、部品を組み立てる<strong>組立部門</strong>の、2つの製造部門がある。当月、<mark class="q-expense">どの製品にかかったかを直接特定できない間接的な費用</mark>が、30円発生した。X社は、この30円を、各部門の機械の稼働時間を基準にして、<mark class="q-expense">切削部門に18円</mark>、<mark class="q-expense">組立部門に12円</mark>、割り振った（第1次集計）。この仕訳を行いなさい。',
    e:[{d:[['切削部門費',18],['組立部門費',12]],c:[['製造間接費',30]]}],
    exp:'「製造部門」とは、製品の加工を直接行う部門のことです。「第1次集計」とは、間接的な費用を、まず各部門に割り振ることです。工場全体でまとめて集計していた製造間接費（30円）を、どの部門でどれだけ使われたかに応じて、各部門専用の勘定（切削部門費・組立部門費）に振り分けます。「会社全体のどんぶり勘定から、部門ごとの家計簿に分ける」最初のステップです。'
  },
  { id:1225, calc:'', cat:'部門別原価計算', chap:'工業簿記③部門別・直接原価',
    q:'X社の工場には、製造部門のほかに、工場の機械に電力を供給する<strong>動力部門</strong>がある。動力部門は、製品の加工を直接は行わない、補助部門である。当月の<mark class="q-expense">動力部門の費用10円</mark>を、各製造部門の電力の使用量を基準にして、<mark class="q-expense">切削部門に6円</mark>、<mark class="q-expense">組立部門に4円</mark>、配賦した。配賦にあたっては、補助部門どうしのやりとりを無視して、製造部門だけに配賦する方法（<strong>直接配賦法</strong>）を採用している。この仕訳を行いなさい。',
    e:[{d:[['切削部門費',6],['組立部門費',4]],c:[['動力部門費',10]]}],
    exp:'「補助部門」とは、製造部門の仕事を支えるための部門のことです（製品の加工は直接行いません）。「直接配賦法」とは、補助部門の費用を、補助部門どうしのやりとりを無視して、製造部門だけに配賦する方法のことです。動力部門のような補助部門の費用（10円）は、最終的には製品を直接加工する製造部門（切削・組立）に振り分けて、製品原価に反映させる必要があります。電力の使用量という実態に合った基準で配分するのがポイントです。'
  },
  { id:1226, calc:'', cat:'部門別原価計算', chap:'工業簿記③部門別・直接原価',
    q:'第1次集計と、動力部門からの配賦を終えた結果、当月、X社の<mark class="q-expense">切削部門に集まった費用は、合計24円</mark>になった。X社は、注文ごとに家具の原価を計算するため、この24円を、予定配賦率にもとづいて、<mark class="q-asset">注文ごとに製造中の家具</mark>に配賦した。この仕訳を行いなさい。',
    e:[{d:[['仕掛品',24]],c:[['切削部門費',24]]}],
    exp:'「予定配賦率」とは、間接的な費用を配賦するために、あらかじめ決めておく割合のことです。部門ごとに集計した費用（切削部門費24円）を、最後に注文ごとの製品原価（仕掛品）に配賦することで、「工場全体の共通費用→部門ごとの費用→製品ごとの原価」という3段階の流れが完成します。部門別に集計することで、工場全体でまとめて配賦するよりも、より実態に合った正確な製品原価を計算できます。'
  },
  { id:1227, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'袋入りの焼き菓子を製造しているX社は、標準原価計算を採用し、<strong>シングルプラン</strong>で記帳している。当月、製造に投入した分の標準原価は、<mark class="q-asset">材料40円</mark>、<mark class="q-expense">労働35円</mark>、<mark class="q-expense">間接的な費用25円</mark>の、合計100円であった。この当月投入分を、<mark class="q-asset">製造途中の製品</mark>の勘定に記帳する仕訳を行いなさい。',
    e:[{d:[['仕掛品',100]],c:[['材料',40],['賃金',35],['製造間接費',25]]}],
    exp:'「標準原価」とは、製品1個あたりに、本来かかるべき原価として、あらかじめ決めておく原価のことです。「シングルプラン」とは、製造途中の製品の勘定に、投入した分を標準原価で記帳する方法です（差異は、材料・労働・間接費の各勘定で把握します）。実際にかかった金額ではなく、あらかじめ決めた「本来あるべき金額」で仕掛品を記帳するのが特徴で、無駄がどこで生じたかを素早く把握できます。'
  },
  { id:1228, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'ゼリーを製造しているX社は、標準原価計算を採用し、<strong>パーシャルプラン</strong>で記帳している。当月、製造に投入した分の実際原価は、<mark class="q-asset">材料42円</mark>、<mark class="q-expense">労働36円</mark>、<mark class="q-expense">間接的な費用25円</mark>の、合計103円であった。この当月投入分を、<mark class="q-asset">製造途中の製品</mark>の勘定に記帳する仕訳を行いなさい。',
    e:[{d:[['仕掛品',103]],c:[['材料',42],['賃金',36],['製造間接費',25]]}],
    exp:'「パーシャルプラン」とは、製造途中の製品の勘定に、投入した分を実際原価で記帳する方法です（差異は、製造途中の製品の勘定で把握します）。「実際原価」とは、実際にかかった原価のことです。シングルプラン（前問、標準原価で記帳）とは違い、パーシャルプランでは、まず実際にかかった金額をそのまま仕掛品に記帳し、差異は後で仕掛品勘定の中でまとめて計算します。'
  },
  { id:1229, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'X社では、当月、<mark class="q-other">材料の実際の<u class="q-ul">消費数量</u>が、実際の生産量から計算した標準の消費数量を上回った</mark>。生地の仕込みで失敗が続いたためである。その結果、材料の消費額に、標準より4円多い不利な差が生じた。シングルプランのもとで、この差額を<mark class="q-asset">材料の勘定から振り替え</mark>るために必要な仕訳を行いなさい。',
    e:[{d:[['数量差異',4]],c:[['材料',4]]}],
    exp:'材料を無駄遣いしてしまい、本来必要な量（標準消費数量）より多く使ってしまった場合、その差額は「数量差異」という費用（不利差異）で処理します。「仕込みの失敗が続いた」という原因からも分かるように、現場での作業効率の悪さが、材料のロスとして数値に表れたケースです。'
  },
  { id:1230, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'X社では、当月、新しく入った作業員が作業に慣れていなかったため、<mark class="q-other">実際の<u class="q-ul">作業時間</u>が、実際の生産量から計算した標準の作業時間を上回った</mark>。その結果、労働の消費額に、標準より3円多い不利な差が生じた。シングルプランのもとで、この差額を<mark class="q-expense">賃金の勘定から振り替え</mark>るために必要な仕訳を行いなさい。',
    e:[{d:[['時間差異',3]],c:[['賃金',3]]}],
    exp:'作業に慣れていない新人が多いと、本来かかるはずの時間（標準作業時間）より多くの時間がかかってしまいます。この差額は「時間差異」という費用（不利差異）で処理します。材料の数量差異と似た考え方で、こちらは「時間の無駄」が差異として数値化されたものです。'
  },
  { id:1231, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'X社では、当月、電力料金の値上がりにより、<mark class="q-other">間接的な費用の実際の発生額が、実際の操業度にもとづいて計算した予算額（予算許容額）を、2円上回った</mark>。シングルプランのもとで、この差額を<mark class="q-expense">製造間接費の勘定から振り替え</mark>るために必要な仕訳を行いなさい。',
    e:[{d:[['予算差異',2]],c:[['製造間接費',2]]}],
    exp:'「操業度」とは、工場の設備の稼働の度合いのことで、作業時間などで測ります。「予算許容額」とは、実際の操業度のもとで、本来かかってよいとされる間接的な費用の予算額のことです。電力料金の値上がりのような、外部要因による単価の上昇は「予算差異」として処理します。作業の効率とは関係なく、単純に「値段が上がった」ことによる差異です。'
  },
  { id:1232, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'X社では、当月、作業の段取りが悪く、実際の作業時間が、標準の作業時間を上回った。そのため、<mark class="q-other">作業時間を基準に配賦する間接的な費用にも、標準より2円多い不利な差</mark>が生じた。シングルプランのもとで、この差額を<mark class="q-expense">製造間接費の勘定から振り替え</mark>るために必要な仕訳を行いなさい。',
    e:[{d:[['能率差異',2]],c:[['製造間接費',2]]}],
    exp:'作業の段取りの悪さなど、作業の効率（能率）の問題によって、製造間接費にも余分なコストがかかってしまうことがあります。この差額は「能率差異」として処理します。前問の予算差異（単価の問題）とは違い、こちらは「作業のやり方の問題」によって生じた差異です。'
  },
  { id:1233, calc:'', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'X社では、当月、大口の注文が取り消されたため、<mark class="q-other">工場の実際の稼働時間が、あらかじめ想定していた通常の稼働の水準（基準<u class="q-ul">操業度</u>）を下回った</mark>。そのため、稼働の水準にかかわらず一定額かかる固定費を配賦しきれず、3円の不利な差が生じた。シングルプランのもとで、この差額を<mark class="q-expense">製造間接費の勘定から振り替え</mark>るために必要な仕訳を行いなさい。',
    e:[{d:[['操業度差異',3]],c:[['製造間接費',3]]}],
    exp:'「基準操業度」とは、予算を立てるときに、あらかじめ想定しておく通常の稼働の水準のことです。工場の設備費や家賃のような固定費は、稼働が多くても少なくても一定額かかりますが、実際の稼働が予定より少ないと、その固定費を十分に製品に配り切れなくなります。この「稼働が足りなかったことによる差異」を「操業度差異」として処理します。'
  },
  { id:1234, calc:'2＋4＝6円', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'決算にあたり、X社は、材料について生じた差異を、<mark class="q-other">材料費全体の差異</mark>として、1つの勘定にまとめて表示することにした。当期の<mark class="q-other">材料の価格による差異は2円</mark>、<mark class="q-other">数量による差異は4円</mark>で、いずれも不利な差異である。これらを1つにまとめる仕訳を行いなさい。',
    e:[{d:[['直接材料費差異',6]],c:[['材料消費価格差異',2],['数量差異',4]]}],
    exp:'材料に関する2種類の差異（価格差異と数量差異）を、決算にあたって「直接材料費差異」という1つの科目にまとめます。バラバラに管理していた価格の問題と数量の問題を、最終的に「材料費全体で、標準からいくらズレたか」という1つの数字に集約する処理です。'
  },
  { id:1235, calc:'3＋3＝6円', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'決算にあたり、X社は、労働について生じた差異を、<mark class="q-other">労務費全体の差異</mark>として、1つの勘定にまとめて表示することにした。当期の<mark class="q-other">賃率による差異は3円</mark>、<mark class="q-other">作業時間による差異は3円</mark>で、いずれも不利な差異である。これらを1つにまとめる仕訳を行いなさい。',
    e:[{d:[['直接労務費差異',6]],c:[['賃率差異',3],['時間差異',3]]}],
    exp:'労働に関する2種類の差異（賃率差異と時間差異）を、決算にあたって「直接労務費差異」という1つの科目にまとめます。材料費の場合と同じように、「人件費の単価の問題」と「作業時間の問題」を、最終的に1つの数字に集約します。'
  },
  { id:1236, calc:'2＋2＋3＝7円', cat:'標準原価計算', chap:'工業簿記④標準原価計算',
    q:'決算にあたり、X社は、<mark class="q-other">間接的な費用について生じた3つの差異</mark>を、1つの勘定にまとめて表示することにした。当期の<mark class="q-other">予算による差異は2円</mark>、<mark class="q-other">能率による差異は2円</mark>、<mark class="q-other">稼働の水準による差異は3円</mark>で、いずれも不利な差異である。これらを1つにまとめる仕訳を行いなさい。',
    e:[{d:[['製造間接費差異',7]],c:[['予算差異',2],['能率差異',2],['操業度差異',3]]}],
    exp:'製造間接費に関する3種類の差異（予算差異・能率差異・操業度差異）を、決算にあたって「製造間接費差異」という1つの科目にまとめます。「単価の問題（予算）」「作業効率の問題（能率）」「稼働不足の問題（操業度）」という、それぞれ原因の異なる3つの差異を、最終的に1つの金額に集約する、標準原価計算の総仕上げの処理です。'
  },
  { id:1237, calc:'', cat:'標準原価計算', chap:'工業簿記③部門別・直接原価',
    q:'食品用のプラスチック容器を製造しているX社は、社内の管理のために、<strong>直接原価計算</strong>を採用している。当月、工場で発生した<u class="q-ul">間接的な費用</u>のうち、生産量に応じて増減するものは60円、生産量にかかわらず一定額かかるものは20円であった。<mark class="q-expense">生産量に応じて増減する60円</mark>は、<mark class="q-asset">製造途中の製品の原価に配賦</mark>する。<mark class="q-expense">一定額かかる20円</mark>は、製品の原価に含めず、当月の期間費用として、そのまま<mark class="q-other">当月の利益の計算に振り替え</mark>る。この仕訳を行いなさい。',
    e:[{d:[['仕掛品',60],['損益',20]],c:[['変動製造間接費',60],['固定製造間接費',20]]}],
    exp:'「直接原価計算」とは、生産量に応じて増減する原価（変動費）だけを製品の原価とし、一定額かかる原価（固定費）は、発生した期間の費用とする計算方法です。生産量に応じて増える変動費（60円）は、これまでどおり仕掛品（製品原価）に配賦しますが、生産量に関係なく一定額かかる固定費（20円）は、製品の原価に含めず、その期の費用としてすぐに損益計算に反映させます。「作れば作るほど増える費用」と「作っても作らなくてもかかる費用」を、はっきり分けて扱うのが直接原価計算の最大の特徴です。'
  },
  { id:1238, calc:'', cat:'標準原価計算', chap:'工業簿記③部門別・直接原価',
    q:'X社の、直接原価計算による当期の営業利益は、45円であった。外部に報告する決算書には、全部原価計算による営業利益が必要になるため、<mark class="q-asset">直接原価計算の利益を、全部原価計算の利益に直す</mark>調整を行う。<mark class="q-other">期首の製品に含まれる固定費は5円</mark>、<mark class="q-other">期末の製品に含まれる固定費は8円</mark>である。期末の分と、期首の分の、それぞれの仕訳を行いなさい。',
    e:[{d:[['繰延固定製造間接費',8]],c:[['固定費調整',8]]},{d:[['固定費調整',5]],c:[['繰延固定製造間接費',5]]}],
    exp:'「全部原価計算」とは、変動費と固定費の、すべての製造原価を、製品の原価とする計算方法です。直接原価計算では固定費をすぐに費用にしますが、外部に報告する決算書は全部原価計算にもとづく必要があるため、決算で調整が必要です。①期末の在庫に含まれる固定費（8円）は、本来は全部原価計算なら資産（在庫）に残るはずの金額なので、「繰延固定製造間接費」という資産として加え、利益を8円増やす調整をします。②期首の在庫に含まれていた固定費（5円）は、逆に今期の費用として実現したとみなし、利益を5円減らす調整をします。この2つの調整によって、直接原価計算の利益（45円）が、全部原価計算の利益に変換されます。'
  },
  { id:1239, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'お菓子を大量生産しているX社は、単純総合原価計算を採用している。当月、月初仕掛品原価250円と当月製造費用2,750円の合計3,000円について、<strong>平均法</strong>により月末仕掛品原価を計算したところ、<mark class="q-asset">完成品原価は2,400円</mark>、月末仕掛品原価は600円となった。<mark class="q-asset">完成品原価を仕掛品から製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['製品',2400]],c:[['仕掛品',2400]]}],
    exp:'「平均法」とは、月初仕掛品と当月製造費用を区別せず、ひとまとめにして平均単価を計算し、その平均単価で完成品と月末仕掛品に原価を割り振る方法です。月初仕掛品原価250円と当月製造費用2,750円を合計した3,000円を、完成品の数量と月末仕掛品の完成品換算量の比で分けた結果、完成品原価2,400円・月末仕掛品原価600円となりました。完成品分は「仕掛品」から「製品」に振り替え、月末仕掛品分は、そのまま仕掛品として翌月に残ります。'
  },
  { id:1240, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'キャンディを大量生産しているX社は、単純総合原価計算を採用している。当月、月初仕掛品原価200円と当月製造費用2,860円の合計3,060円について、<strong>先入先出法</strong>により月末仕掛品原価を計算したところ、<mark class="q-asset">完成品原価は2,500円</mark>、月末仕掛品原価は560円となった。<mark class="q-asset">完成品原価を仕掛品から製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['製品',2500]],c:[['仕掛品',2500]]}],
    exp:'「先入先出法」とは、先に着手した月初仕掛品が先に完成するとみなして、月初仕掛品原価をそのまま完成品原価に含め、当月製造費用の中から月末仕掛品原価を計算する方法です。平均法とは異なり、月初仕掛品原価と当月製造費用を区別して計算するため、単価の変動がある場合に、より当月の実際原価に近い結果が得られます。完成品原価2,500円を「仕掛品」から「製品」に振り替えます。'
  },
  { id:1241, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'パンを製造しているX社の工程では、通常起こりうる程度の正常仕損が発生した。仕損が発生したのは工程の終点に近い地点（<strong>月末仕掛品の進捗度より後</strong>）であったため、<strong>度外視法</strong>のもとでは、仕損の原価は完成品のみが負担する。<mark class="q-asset">完成品原価2,600円</mark>を、仕掛品から<mark class="q-asset">製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['製品',2600]],c:[['仕掛品',2600]]}],
    exp:'「度外視法」は、正常仕損の原価を個別に計算せず、完成品や月末仕掛品の原価に自動的に上乗せ（吸収）させる方法です。仕損が発生した地点（仕損点）が、月末仕掛品の進捗度よりも後ろ（工程の終点側）にある場合、月末仕掛品はまだその地点を通過していないため仕損の原価を負担せず、「完成品のみが負担する」ことになります。そのため、仕損費はそのまま完成品原価に含まれたまま、製品に振り替えられます。'
  },
  { id:1242, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'上記と同じ工場で、別の月に正常仕損が発生した。今回は仕損が発生したのが工程の始点に近い地点（<strong>月末仕掛品の進捗度より前</strong>）であったため、度外視法のもとでは、仕損の原価は完成品と月末仕掛品の両方で負担する。<mark class="q-asset">完成品原価2,520円</mark>を、仕掛品から<mark class="q-asset">製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['製品',2520]],c:[['仕掛品',2520]]}],
    exp:'仕損点が、月末仕掛品の進捗度よりも前（工程の始点側）にある場合は、月末仕掛品もすでにその地点を通過しているため、完成品だけでなく月末仕掛品も仕損の原価を一部負担します（両者負担）。この場合、仕損費は完成品と月末仕掛品の両方に、完成品換算量の比で自動的に配分されます。完成品が負担した分を含む完成品原価2,520円を、製品に振り替えます。'
  },
  { id:1243, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'メッキ加工をしているX社の工程で生じた仕損品について、スクラップとしての処分価値が80円あることが判明した。この<mark class="q-asset">仕損品を資産</mark>として受け入れ、<mark class="q-asset">仕損の総原価（仕掛品）から処分価額を差し引く</mark>仕訳を行いなさい。',
    e:[{d:[['仕損品',80]],c:[['仕掛品',80]]}],
    exp:'仕損品であっても、スクラップなどとして売却できる価値（処分価額）が見込める場合は、その分を仕損の原価から差し引き、「仕損品」という資産として計上します。「失敗した分でも、売れる部分は資産として別に取っておく」というイメージです。これにより、完成品や月末仕掛品が負担する仕損の原価は、処分価額を差し引いた残りの金額に抑えられます。'
  },
  { id:1244, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'化学薬品を製造しているX社の工程では、蒸発によって原材料の一部が失われる正常減損が生じる。減損が発生したのは工程の終点に近い地点（<strong>月末仕掛品の進捗度より後</strong>）であったため、度外視法のもとでは、減損の原価は完成品のみが負担する。<mark class="q-asset">完成品原価2,450円</mark>を、仕掛品から<mark class="q-asset">製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['製品',2450]],c:[['仕掛品',2450]]}],
    exp:'「減損」とは、蒸発・ガス化・粉散などによって、原材料そのものが工程の途中で消えてしまう現象のことです。不良品として形が残る「仕損」とは異なりますが、会計上の処理方法（度外視法での完成品・月末仕掛品への負担の考え方）は仕損とまったく同じです。今回は減損点が月末仕掛品の進捗度よりも後ろにあるため、完成品のみが減損の原価を負担します。'
  },
  { id:1245, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'塗料を製造しているX社は、工程別総合原価計算（累加法）を採用し、第1工程・第2工程の2つの工程を経て製品を完成させる。当月、<mark class="q-asset">第1工程で完成した半製品の原価（</mark><strong><mark class="q-asset">前工程費</mark></strong><mark class="q-asset">）1,200円</mark>を、そのまま<mark class="q-asset">第2工程の仕掛品に投入</mark>する仕訳を行いなさい。',
    e:[{d:[['第2工程仕掛品',1200]],c:[['第1工程仕掛品',1200]]}],
    exp:'「工程別総合原価計算」とは、複数の工程を順番に経て製品を完成させる場合に、工程ごとに原価を計算する方法です。「累加法」では、前の工程で完成した分の原価を、そのまま次の工程の仕掛品原価に加えます（これを「前工程費」と呼びます）。前工程費は、次工程の開始時点ですでに100％投入済みとして扱われる点が特徴です。'
  },
  { id:1246, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'上記のX社において、第2工程でさらに加工が加わり、前工程費1,200円と第2工程費800円の合計2,000円で製品が完成した。完成品原価を<mark class="q-asset">第2工程の仕掛品</mark>から<mark class="q-asset">製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['製品',2000]],c:[['第2工程仕掛品',2000]]}],
    exp:'第2工程の仕掛品には、第1工程から引き継いだ前工程費（1,200円）と、第2工程で新たに加わった加工費など（800円）が集計されています。すべての工程を終えて完成した時点で、合計2,000円を「第2工程仕掛品」から「製品」に振り替えます。工程がいくつあっても、最後に製品へ振り替える仕訳そのものは、単純総合原価計算のときと同じ形になります。'
  },
  { id:1247, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'上記のX社は、第1工程の完成品の一部を、そのまま外部に販売できる状態として、倉庫にいったん保管することにした。保管する分の原価500円を、<mark class="q-asset">第1工程の仕掛品</mark>から<mark class="q-asset">半製品に振り替え</mark>る仕訳を行いなさい。',
    e:[{d:[['半製品',500]],c:[['第1工程仕掛品',500]]}],
    exp:'「半製品」とは、製造の途中でいったん倉庫に入れた中間製品で、そのまま外部に販売することもできる状態のものです。第1工程の完成品は、通常はそのまま第2工程に進みますが、一部を外部販売用やストック用として、いったん「半製品」という資産に振り替えておくことがあります。仕掛品（未完成）と製品（最終完成品）の中間に位置する科目です。'
  },
  { id:1248, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'上記のX社は、倉庫に保管していた<mark class="q-asset">半製品500円分</mark>を、追加注文に対応するため、<mark class="q-asset">第2工程の材料として投入</mark>することにした。この仕訳を行いなさい。',
    e:[{d:[['第2工程仕掛品',500]],c:[['半製品',500]]}],
    exp:'いったん半製品として保管していたものも、必要になれば、あとから次の工程に投入して、さらに加工を進めることができます。この場合、半製品という資産から、第2工程の仕掛品という資産へ、同じ金額をそのまま振り替えます。「倉庫に置いておいたものを、必要になったので製造ラインに戻した」というイメージです。'
  },
  { id:1249, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'家具（A組）と雑貨（B組）を同じ工場で製造しているX社は、組別総合原価計算を採用している。<mark class="q-expense">当月の組間接費600円</mark>を、各組の直接作業時間の比（A組：B組＝2：1）で配賦したところ、<mark class="q-asset">A組仕掛品400円</mark>・<mark class="q-asset">B組仕掛品200円</mark>となった。この仕訳を行いなさい。',
    e:[{d:[['A組仕掛品',400],['B組仕掛品',200]],c:[['製造間接費',600]]}],
    exp:'「組別総合原価計算」とは、同じ工場で、異なる種類の製品（組）を並行して生産する場合の原価計算方法です。それぞれの組に直接かかった費用（組直接費）はそのまま各組の仕掛品に集計しますが、どちらの組にかかったか直接特定できない費用（組間接費）は、作業時間などの基準で各組に配分（組間接費の配賦）します。これにより、組ごとの正確な製造原価が計算できます。'
  },
  { id:1250, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'上記のX社において、当月、<mark class="q-asset">A組の完成品原価1,800円とB組の完成品原価900円</mark>が、それぞれ完成した。<mark class="q-asset">両組の完成品原</mark>価を、それぞれA組仕掛品・B組仕掛品から製品に振り替える仕訳を行いなさい。',
    e:[{d:[['製品（A品）',1800],['製品（B品）',900]],c:[['A組仕掛品',1800],['B組仕掛品',900]]}],
    exp:'組別総合原価計算でも、最終的な「完成品を製品に振り替える」という処理は、単純総合原価計算と同じです。ただし、組ごとに仕掛品・製品の勘定を別々に用意しておくことで、「A組（家具）はどれだけ儲かっているか」「B組（雑貨）はどれだけ儲かっているか」を、それぞれ個別に把握できるようになります。'
  },
  { id:1251, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'同じ工程で、サイズの異なる1級品と2級品を生産しているX社は、等級別総合原価計算を採用している。当月の<mark class="q-asset">完成品総合原価3,000円（仕掛品）</mark>を、等価係数（1級品1.0・2級品0.6）に生産量を掛けた積数の比で配分したところ、<mark class="q-asset">1級品2,000円・2級品1,000円</mark>となった。この仕訳を行いなさい。',
    e:[{d:[['製品（1級品）',2000],['製品（2級品）',1000]],c:[['仕掛品',3000]]}],
    exp:'「等級別総合原価計算」は、同じ工程で、サイズや品質が異なる等級品（1級品・2級品など）を生産する場合の原価計算方法です。組別とは異なり、仕掛品の勘定はひとつにまとめたまま製造し、完成した時点で、等価係数（品質やサイズに応じた重み）に生産量を掛けた「積数」の比で、完成品総合原価を各等級に配分します。'
  },
  { id:1252, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'上記と同様の方法で、X社が1級品・2級品・3級品の3等級を生産する場合、当月の<mark class="q-asset">完成品総合原価4,500円（仕掛品）</mark>を積数（<strong>等価係数×生産量</strong>）の比で配分したところ、<mark class="q-asset">1級品2,000円・2級品1,500円・3級品1,000円</mark>となった。この仕訳を行いなさい。',
    e:[{d:[['製品（1級品）',2000],['製品（2級品）',1500],['製品（3級品）',1000]],c:[['仕掛品',4500]]}],
    exp:'等級が2つでも3つでも、考え方は同じです。各等級の積数（等価係数×生産量）の比で、完成品総合原価全体を配分します。等級が増えても、「仕掛品」という1つの勘定から、それぞれの等級の「製品」勘定へ、積数の比に応じて金額を振り分けるだけなので、処理の手間はさほど変わりません。'
  },
  { id:1253, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'石油製品を製造しているX社の工程からは、主産品のほかに副産物も生じる。この副産物に、60円の見積売却価額があることが判明した。<mark class="q-asset">主産品の製造原価（仕掛品）</mark>から、この60円を差し引いて、<mark class="q-asset">副産物を資産として受け入れる</mark>仕訳を行いなさい。',
    e:[{d:[['副産物',60]],c:[['仕掛品',60]]}],
    exp:'「副産物」とは、主産品を製造する過程で、付随的に生じる、主産品ほど重要ではない生産物のことです（例：大豆油の製造過程で生じる大豆かすなど）。副産物に見積売却価額がある場合は、その金額を主産品の製造原価（仕掛品）から差し引き、「副産物」という資産として受け入れます。主産品の原価を、副産物の価値の分だけ軽くするイメージです。'
  },
  { id:1254, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'金属部品を製造しているX社の工程からは、<mark class="q-asset">削りくずなどの作業くず</mark>が生じる。この作業くずに、15円の見積売却価額があることが判明した。<mark class="q-expense">製造間接費</mark>から、この15円を差し引いて、作業くずを資産として受け入れる仕訳を行いなさい。',
    e:[{d:[['作業くず',15]],c:[['製造間接費',15]]}],
    exp:'「作業くず」とは、材料を加工する過程で生じる、削りくずや切れ端などのことです。副産物と似ていますが、作業くずは特定の製品の加工から生じることが多いため、仕掛品からではなく、発生源に近い製造間接費や、特定の製造指図書の原価から差し引くのが一般的です。見積売却価額の分だけ、資産として受け入れます。'
  },
  { id:1255, calc:'', cat:'総合原価計算', chap:'工業簿記⑤総合原価計算',
    q:'原油を精製しているX社は、同じ原料・工程から複数の製品が同時に生まれる連産品（P重油・軽油）を生産している。分離点までにかかった<mark class="q-asset">結合原価2,400円（仕掛品）</mark>を、分離点における正常市価の比（P重油：軽油＝5：3）で配分したところ、<mark class="q-asset">P重油1,500円・軽油900円</mark>となった。この仕訳を行いなさい。',
    e:[{d:[['製品（P重油）',1500],['製品（軽油）',900]],c:[['仕掛品',2400]]}],
    exp:'「連産品」とは、同じ原料・工程から、必然的に複数の種類の製品が同時に生まれるもので、分離するまでは個別の原価を把握できません（原油からガソリン・軽油・重油などが同時に生まれるのが典型例）。分離するまでにかかった原価（結合原価）は、分離点における各製品の市場価格（正常市価）の比で、各製品に配分するのが一般的です。'
  },
  { id:1256, calc:'', cat:'標準原価計算', chap:'工業簿記③部門別・直接原価',
    q:'X社の、直接原価計算による当期の営業利益は、60円であった。<mark class="q-asset">全部原価計算の利益に直す調整</mark>を行うにあたり、<mark class="q-other">前期末（＝当期の期首）の製品に含まれていた固定費は3円</mark>であったが、当期末の製品には固定費が含まれていない（在庫がゼロになった）。期首の分の固定費調整の仕訳を行いなさい。',
    e:[{d:[['固定費調整',3]],c:[['繰延固定製造間接費',3]]}],
    exp:'期首の在庫に含まれていた固定費（3円）は、前期末の時点では全部原価計算上の資産（繰延固定製造間接費）として扱われていましたが、当期にその在庫がすべて販売され、ゼロになったということは、その固定費も今期の費用として実現したとみなされます。そのため、「繰延固定製造間接費」という資産を取り崩し、「固定費調整」によって今期の利益を3円減らす調整を行います。期末の在庫が残っていない、シンプルなケースです。'
  },
  // ===== PDF教材準拠（新版パート2）差し替え終了 =====
  // ===== 工業簿記の追加問題 =====
  { id:1257, calc:"", cat:"材料費", chap:"工業簿記①材料費・労務費", q:"X社は、先日Y社から<mark class=\"q-liability\">掛けで購入</mark>した材料のうち、注文と違う<mark class=\"q-asset\">鋼材10円分</mark>を、Y社に<u class=\"q-ul\">返品</u>した。返品した分は、Y社に支払う代金から差し引いてもらうことになった。この日の仕訳を行いなさい。", e:[{"d": [["買掛金", 10]], "c": [["材料", 10]]}], exp:"返品した材料は手元からなくなるので、材料を10円減らします。同時に、その分だけY社に払う義務（買掛金）も減ります。商業簿記の仕入の返品と同じ考え方で、工業簿記では「仕入」の代わりに「材料」の勘定を使うのが違いです。材料は工場で使うために持っている在庫なので、商業簿記の「商品」にあたると考えるとイメージしやすくなります。" },
  { id:1258, calc:"80－75＝5円", cat:"材料費", chap:"工業簿記①材料費・労務費", q:"月末に、X社は、倉庫の材料を実際に数えた（<strong>実地棚卸</strong>）。帳簿の上では80円分あるはずの<mark class=\"q-asset\">材料が、実際には75円分しかなかった（</mark><strong><mark class=\"q-asset\">棚卸減耗</mark></strong><mark class=\"q-asset\">）</mark>。この減った分は、毎月ふつうに生じる程度のもの（正常な減耗）なので、<mark class=\"q-expense\">どの製品のためとも言えない間接的な費用</mark>として扱う。この仕訳を行いなさい。", e:[{"d": [["製造間接費", 5]], "c": [["材料", 5]]}], exp:"実地棚卸で、帳簿の80円分に対して実際は75円分しかありませんでした。この差5円が棚卸減耗です。正常な範囲の減耗は、製品を作るうえで避けられないコストとして製品の原価に含めますが、どの製品の分とも言えないので、間接経費として製造間接費に集めます。商業簿記の棚卸減耗損と同じ現象ですが、工業簿記では「費用にして終わり」ではなく、製造間接費を通じて製品の原価に入っていく点が違います。" },
  { id:1259, calc:"", cat:"材料費", chap:"工業簿記①材料費・労務費", q:"X社は、当月、<mark class=\"q-asset\">倉庫の補助材料（接着剤・塗料）と工場消耗品（軍手・機械油）を、合計12円分使った</mark>。これらは、<mark class=\"q-expense\">どの製品に使ったか直接わからない間接的な材料</mark>である。この仕訳を行いなさい。", e:[{"d": [["製造間接費", 12]], "c": [["材料", 12]]}], exp:"接着剤・塗料などの補助材料や、軍手・機械油などの工場消耗品は、どの製品にどれだけ使ったかを測るのが難しい材料です。このような材料の費用を間接材料費といい、仕掛品に直接入れず、製造間接費にいったん集めます。集めた製造間接費は、あとで作業時間などの基準で各製品に配賦されます。" },
  { id:1260, calc:"60＋15＝75円", cat:"材料費", chap:"工業簿記①材料費・労務費", q:"X社は、当月、<mark class=\"q-asset\">材料を75円分使った</mark>。このうち、<mark class=\"q-asset\">特定の製品の部品として使った分が60円</mark>（直接材料費）、<mark class=\"q-expense\">工場全体の修理などに使った分が15円</mark>（間接材料費）であった。材料の倉庫から払い出したときの仕訳を行いなさい。", e:[{"d": [["仕掛品", 60], ["製造間接費", 15]], "c": [["材料", 75]]}], exp:"材料を倉庫から出して使ったら、使い道で行き先が分かれます。特定の製品の部品になった60円は直接材料費として仕掛品へ、工場全体の修理などに使った15円は間接材料費として製造間接費へ移します。倉庫から出た材料は合計75円なので、材料の勘定は75円減ります。「直接→仕掛品、間接→製造間接費」は、労務費・経費でも同じ考え方です。" },
  { id:1261, calc:"102－100＝2円（不利）", cat:"材料費", chap:"工業簿記①材料費・労務費", q:"X社は、材料を買い入れたときに、あらかじめ決めた価格（<strong>予定受入価格</strong>）で記帳している。当月、材料を<mark class=\"q-liability\">掛けで購入し、実際の購入代価は102円</mark>であった。<mark class=\"q-asset\">予定受入価格で計算すると、この材料は100円</mark>になる。<mark class=\"q-other\">実際との差額は、受入価格の差異</mark>として処理する。この仕訳を行いなさい。", e:[{"d": [["材料", 100], ["材料受入価格差異", 2]], "c": [["買掛金", 102]]}], exp:"予定受入価格を使う方法では、材料を買ったときから予定価格で材料の勘定に入れます。この問題では、材料の勘定には予定の100円を入れ、実際に払う義務（買掛金）は102円です。差の2円は材料受入価格差異になり、実際の方が高いので不利差異（借方）です。材料を使うときの予定消費価格の差異（材料消費価格差異）とは、発生するタイミングが違う別の差異なので区別しましょう。" },
  { id:1262, calc:"100－10＝90円", cat:"労務費", chap:"工業簿記①材料費・労務費", q:"X社は、給与支給日に、<mark class=\"q-expense\">工場の作業員に当月の賃金100円</mark>を支払った。このうち、<mark class=\"q-liability\">所得税10円は源泉徴収</mark>して預かり、残りを<mark class=\"q-asset\">現金で支払った</mark>。この日の仕訳を行いなさい。", e:[{"d": [["賃金", 100]], "c": [["所得税預り金", 10], ["現金", 90]]}], exp:"賃金は、天引きする前の総額100円で記録します。手取りの90円で記録しないのがポイントです。差し引いた所得税10円は、会社が従業員の代わりに国に納めるまで預かっているお金なので、所得税預り金という負債にします。商業簿記の給料の支払いと同じ形で、工場の作業員の分なので「給料」の代わりに「賃金」を使います。" },
  { id:1263, calc:"", cat:"労務費", chap:"工業簿記①材料費・労務費", q:"X社は、前月末に、働いてもらったのに<mark class=\"q-liability\">まだ支払っていない賃金20円</mark>を未払賃金として計上していた。当月の初めにあたり、この未払賃金を、<mark class=\"q-expense\">もとの賃金の勘定に戻す（再振替）</mark>。この仕訳を行いなさい。", e:[{"d": [["未払賃金", 20]], "c": [["賃金", 20]]}], exp:"前月末に、前月に働いてもらったのにまだ払っていない20円を、賃金（費用）と未払賃金（負債）に計上していました。当月の初めにこの仕訳を逆にして、未払賃金を消し、賃金の勘定の貸方に20円を入れておきます。こうしておくと、当月の支払日に支払額の全額を賃金の借方に記録しても、前月分の20円が差し引かれ、当月の消費額だけが残ります。商業簿記の未払費用の再振替と同じ考え方です。" },
  { id:1264, calc:"", cat:"労務費", chap:"工業簿記①材料費・労務費", q:"月末に、X社は、当月の支給日以降に作業員が働いた分のうち、<mark class=\"q-liability\">まだ支払っていない賃金25円</mark>があることを確認した。この分は<mark class=\"q-expense\">当月の賃金の消費額</mark>に含め、翌月に支払う。この仕訳を行いなさい。", e:[{"d": [["賃金", 25]], "c": [["未払賃金", 25]]}], exp:"当月に働いてもらった分は、支払いが翌月でも当月の賃金の消費額に含めます。まだ払っていない25円は未払賃金（負債）にします。賃金の消費額は「当月の支払額−前月末の未払額＋当月末の未払額」で計算され、この問題はそのうち「＋当月末の未払額」にあたる仕訳です。" },
  { id:1265, calc:"10＋20＝30円", cat:"労務費", chap:"工業簿記①材料費・労務費", q:"X社は、当月の賃金の消費額を計算した。<mark class=\"q-asset\">直接工が特定の製品の加工に直接たずさわった分が70円</mark>、<mark class=\"q-expense\">直接工が段取りなど間接的な作業をした分が10円、間接工の賃金が20円</mark>であった。賃金の勘定から、それぞれ振り替える仕訳を行いなさい。", e:[{"d": [["仕掛品", 70], ["製造間接費", 30]], "c": [["賃金", 100]]}], exp:"賃金の消費額は、直接労務費と間接労務費に分けて振り替えます。直接労務費になるのは、直接工が製品の加工を直接行った時間の分だけです。直接工が段取りなどの間接作業をした分は、直接工の賃金でも間接労務費になります。間接工の賃金も間接労務費です。したがって、直接労務費70円は仕掛品へ、間接労務費10＋20＝30円は製造間接費へ振り替え、賃金の勘定からは合計100円が減ります。" },
  { id:1306, calc:'材料副費：100×5％＝5円', cat:'材料費', chap:'工業簿記①材料費・労務費',
    q:'X社は、材料100円を掛けで購入した。X社は、<mark class="q-other">材料の引取運賃や保管料などの材料副費を、購入代価の5％で予定配賦している</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['材料',105]],c:[['買掛金',100],['材料副費',5]]}],
    exp:'材料副費（引取運賃・保管料・検収費など）は、材料を使える状態にするまでの費用なので、材料の値段に含めます。ただし実際の額が月末までわからないものもあるため、購入代価の5％で予定配賦し、材料の金額を105円にします。予定で配った5円は、材料副費の勘定の貸方に記入します。'
  },
  { id:1307, calc:'6－5＝1円（不利）', cat:'材料費', chap:'工業簿記①材料費・労務費',
    q:'月末に、X社が当月の<mark class="q-other">材料副費の実際の発生額を集計したところ、6円</mark>であった（すでに材料副費の勘定の借方に記録済み）。一方、<mark class="q-other">材料に予定配賦した額は、5円</mark>である。この差額を、材料副費の勘定から振り替えなさい。',
    e:[{d:[['材料副費差異',1]],c:[['材料副費',1]]}],
    exp:'材料副費の勘定には、借方に実際の発生額6円、貸方に予定配賦額5円が記録されていて、1円の借方残高が残っています。実際の方が多い＝予定より余分にかかった不利差異です。この1円を「材料副費差異」に移して、材料副費の勘定を空にします。'
  },
  { id:1266, calc:"", cat:"経費", chap:"工業簿記②経費・製造間接費・個別", q:"X社は、製品の一部のメッキ加工を外部の業者に依頼し（<strong>外注加工</strong>）、<mark class=\"q-liability\">加工賃15円を後日支払う</mark>ことにした。この加工賃は、<mark class=\"q-asset\">特定の製品のためにかかった直接経費</mark>である。この仕訳を行いなさい。", e:[{"d": [["仕掛品", 15]], "c": [["買掛金", 15]]}], exp:"外注加工賃は、外部の業者に加工を頼んだ代金で、経費の一つです。特定の製品のために頼んだものなので直接経費にあたり、製造間接費を経由せずに仕掛品に直接入れます。代金は後日払うので、後払いの負債（買掛金）にします。なお、いったん経費の勘定に記録してから振り替える出題もあるので、問題文の指示に従います。" },
  { id:1267, calc:"8＋4＝12円", cat:"経費", chap:"工業簿記②経費・製造間接費・個別", q:"X社は、当月の工場の電力料8円と、工場建物の保険料4円を、経費として集計していた。これらは、<mark class=\"q-expense\">どの製品のためとも言えない間接経費</mark>である。<mark class=\"q-expense\">経費の勘定から振り替える</mark>仕訳を行いなさい。", e:[{"d": [["製造間接費", 12]], "c": [["経費", 12]]}], exp:"電力料や工場建物の保険料は、工場全体のためにかかる費用で、どの製品の分とも言えません。このような経費を間接経費といい、経費の勘定から製造間接費に移して集めます。合計は8＋4＝12円です。製造間接費に集めた費用は、あとで予定配賦率などを使って製品に配賦されます。" },
  { id:1268, calc:"", cat:"製造間接費", chap:"工業簿記②経費・製造間接費・個別", q:"会計期間の末日に、X社の製造間接費配賦差異（借方残高3円）を確認した。<mark class=\"q-other\">予定配賦額より実際発生額が多かった不利差異</mark>である。この差異は、<mark class=\"q-expense\">売上原価に加える</mark>。この仕訳を行いなさい。", e:[{"d": [["売上原価", 3]], "c": [["製造間接費配賦差異", 3]]}], exp:"予定配賦率で配賦した結果、実際の発生額との差（製造間接費配賦差異）が残っています。借方残高3円は、実際の方が多かった不利差異で、その分だけ製品の原価が少なく計算されていたことになります。会計期間の末日に、この差異を売上原価に振り替えて締め切り、原価を実際の額に近づけます。不利差異は売上原価を増やし、有利差異（貸方残高）は売上原価を減らします。" },
  { id:1269, calc:"", cat:"製品の販売", chap:"工業簿記②経費・製造間接費・個別", q:"X社は、倉庫に保管していた<mark class=\"q-asset\">製品（製造原価80円）</mark>を、<mark class=\"q-revenue\">得意先に150円で販売</mark>し、<mark class=\"q-asset\">代金は掛け</mark>とした。X社は、販売のたびに、<mark class=\"q-expense\">販売した製品の原価を売上原価に振り替え</mark>ている。この日の仕訳を行いなさい。", e:[{"d": [["売掛金", 150], ["売上原価", 80]], "c": [["売上", 150], ["製品", 80]]}], exp:"製品を売ったときは、2つのことを同時に記録します。1つは売上で、売価150円で売掛金と売上を計上します。もう1つは原価で、渡した製品の原価80円を製品から売上原価に移します。これは商業簿記の売上原価対立法と同じ形で、商業簿記の「商品」が工業簿記の「製品」になったと考えれば同じです。" },
  { id:1270, calc:"", sides:["本社側", "工場側"], cat:"本社工場会計", chap:"工業簿記②経費・製造間接費・個別", q:"X社は本社工場会計を採用しており、材料の購入代金の支払いは本社が行う。当月、<mark class=\"q-other\">本社は</mark>、仕入先から<mark class=\"q-asset\">材料50円</mark>を<mark class=\"q-liability\">掛けで購入</mark>し、<mark class=\"q-other\">工場に直接納品させた</mark>。本社は工場勘定で工場に付け替え、工場は本社勘定を相手に記帳する。本社と工場の、それぞれの仕訳を行いなさい。", e:[{"d": [["工場", 50]], "c": [["買掛金", 50]]}, {"d": [["材料", 50]], "c": [["本社", 50]]}], exp:"本社工場会計では、本社と工場が別々に帳簿をつけます。代金を払う義務（買掛金）は本社が負いますが、材料を受け取るのは工場です。本社は工場の分を立て替えたので相手を「工場」、工場は本社に負担してもらったので相手を「本社」にします。本支店会計の本店・支店と同じ考え方で、2つの帳簿を合わせると工場勘定と本社勘定は消え、「材料／買掛金」だけが残ります。" },
  { id:1271, calc:"", sides:["工場側", "本社側"], cat:"本社工場会計", chap:"工業簿記②経費・製造間接費・個別", q:"X社は本社工場会計を採用しており、<mark class=\"q-other\">製品の販売は本社が行う</mark>。当月、<mark class=\"q-other\">工場は</mark>、得意先の注文に応じて、<mark class=\"q-asset\">完成した製品200円</mark>（<mark class=\"q-expense\">製造原価</mark>）を得意先に直接発送した。工場は本社勘定を相手に製品を減らし、本社はその原価を売上原価として工場勘定を相手に計上する。工場と本社の、それぞれの仕訳を行いなさい（売上の仕訳は不要）。", e:[{"d": [["本社", 200]], "c": [["製品", 200]]}, {"d": [["売上原価", 200]], "c": [["工場", 200]]}], exp:"製品を持っているのは工場、販売するのは本社です。工場は製品を減らし、相手を「本社」にします。本社は売上原価を計上し、相手を「工場」にします。2つの帳簿を合わせると、本社勘定と工場勘定は消えて「売上原価／製品」だけが残り、会社全体で見た正しい取引になります。" },
  { id:1272, calc:"3×10＝30円、2×10＝20円", cat:"部門別原価計算", chap:"工業簿記③部門別・直接原価", q:"X社は、部門別の予定配賦率で、製造部門の費用を製品に配賦している。当月の直接作業時間は、切削部門10時間、組立部門10時間で、予定配賦率は、<mark class=\"q-expense\">切削部門が1時間あたり3円</mark>、<mark class=\"q-expense\">組立部門が1時間あたり2円</mark>である。<mark class=\"q-asset\">製造中の製品に予定配賦</mark>する仕訳を行いなさい。", e:[{"d": [["仕掛品", 50]], "c": [["切削部門費", 30], ["組立部門費", 20]]}], exp:"部門別に予定配賦するときは、製造部門ごとの予定配賦率に実際の直接作業時間を掛けて、配賦額を計算します。切削部門は3×10＝30円、組立部門は2×10＝20円です。それぞれの部門費の勘定から仕掛品へ振り替え、仕掛品には合計50円が入ります。" },
  { id:1273, calc:"32－30＝2円（不利）", cat:"部門別原価計算", chap:"工業簿記③部門別・直接原価", q:"月末に、X社の<mark class=\"q-expense\">切削部門費の実際発生額は32円</mark>であった。一方、予定配賦率にもとづいて製品に配賦した額は30円である。この差額を、<mark class=\"q-other\">部門費配賦差異に振り替え</mark>る。この仕訳を行いなさい。", e:[{"d": [["部門費配賦差異", 2]], "c": [["切削部門費", 2]]}], exp:"切削部門費の実際発生額は32円、予定配賦額は30円なので、切削部門費の勘定には2円が配りきれずに残っています。実際の方が多いので不利差異です。この2円を部門費配賦差異に振り替えて、切削部門費の勘定を締め切ります。製造間接費配賦差異と同じ考え方を、部門ごとに行うものです。" },
  { id:1274, calc:"12＋8＝20円", cat:"部門別原価計算", chap:"工業簿記③部門別・直接原価", q:"X社の工場には、製造部門（切削・組立）のほかに、機械の修理を担当する補助部門（修繕部門）がある。<mark class=\"q-expense\">当月の修繕部門費20円</mark>を、修理時間の比率にもとづいて、<mark class=\"q-expense\">切削部門に12円</mark>、<mark class=\"q-expense\">組立部門に8円</mark>配賦した（直接配賦法）。この仕訳を行いなさい。", e:[{"d": [["切削部門費", 12], ["組立部門費", 8]], "c": [["修繕部門費", 20]]}], exp:"修繕部門は機械の修理を担当する補助部門で、製品を直接は作りません。そのため、その費用を製造部門に配賦してから製品に乗せます（第2次集計）。直接配賦法なので、補助部門どうしのやりとりは無視し、修理時間の比で切削部門に12円、組立部門に8円を配ります。修繕部門費は空になり、切削部門費・組立部門費が増えます。" },
  { id:1275, calc:"30＋20＋10＝60円", cat:"部門別原価計算", chap:"工業簿記③部門別・直接原価", q:"X社は、<mark class=\"q-expense\">当月の製造間接費60円を、各部門に集計</mark>した（第1次集計）。部門ごとの金額は、<mark class=\"q-expense\">切削部門30円</mark>、<mark class=\"q-expense\">組立部門20円</mark>、<mark class=\"q-expense\">動力部門10円</mark>であった。この仕訳を行いなさい。", e:[{"d": [["切削部門費", 30], ["組立部門費", 20], ["動力部門費", 10]], "c": [["製造間接費", 60]]}], exp:"部門別計算の最初の段階が第1次集計です。工場全体の製造間接費60円を、製造部門（切削・組立）と補助部門（動力）の各部門費に集計します。特定の部門だけで発生した費用（部門個別費）はその部門へ、複数の部門に共通する費用（部門共通費）は床面積などの基準で配ります。この後、補助部門の動力部門費を製造部門に配賦します（第2次集計）。" },
  { id:1276, calc:"", cat:"標準原価計算", chap:"工業簿記④標準原価計算", q:"X社は標準原価計算（パーシャルプラン）を採用している。当月の<mark class=\"q-asset\">完成品の標準原価は90円</mark>であった。完成品は、<mark class=\"q-asset\">製造中の製品</mark>の勘定から、標準原価で振り替える。この仕訳を行いなさい。", e:[{"d": [["製品", 90]], "c": [["仕掛品", 90]]}], exp:"標準原価計算では、完成品は標準原価で仕掛品から製品へ振り替えます。これはシングルプランでもパーシャルプランでも同じです。パーシャルプランでは、仕掛品の借方（当月投入）に実際原価を入れ、完成品と月末仕掛品は標準原価で出すので、標準と実際のズレ（原価差異）が仕掛品の勘定の中に残ります。" },
  // ===== 1級：追加分野 =====
  { id:1332, calc:'返金負債：1,000,000×5％＝50,000\n返品資産：700,000×5％＝35,000\n売上原価：700,000－35,000＝665,000', level:2, sides:['販売','原価'], cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、<mark class="q-revenue">商品1,000,000円</mark>（<mark class="q-expense">原価700,000円</mark>）を<mark class="q-asset">掛けで販売した</mark>。この販売には返品権が付いており、過去の実績から<mark class="q-liability">販売額の5％が返品される</mark>と見込まれる。Ｘ社は売上原価対立法により記帳している。販売時の仕訳を示しなさい。',
    e:[{d:[['売掛金',1000000]],c:[['売上',950000],['返金負債',50000]]},{d:[['売上原価',665000],['返品資産',35000]],c:[['商品',700000]]}],
    exp:'返品が見込まれる5％分は、まだ売上が確定していないので、売上にせず「返金負債」にします。あわせて、返品で戻ってくる商品を受け取る権利を、原価の5％分だけ「返品資産」にし、その分だけ売上原価を減らします。'
  },
  { id:1333, calc:'売上は現金販売価格1,000,000\n1年目の利息：1,000,000×10％＝100,000', level:2, sides:['販売時','1年後の決算'], cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、当期首に商品を販売し、<mark class="q-asset">代金1,210,000円は2年後に一括して受け取る</mark>条件とした。この商品の<mark class="q-revenue">現金販売価格は1,000,000円</mark>であり、<mark class="q-revenue">代金には年10％の金利相当分が含まれている</mark>（重要な金融要素）。販売時と、1年後の決算時の仕訳を示しなさい。',
    e:[{d:[['売掛金',1000000]],c:[['売上',1000000]]},{d:[['売掛金',100000]],c:[['受取利息',100000]]}],
    exp:'2年後払いの代金1,210,000円には、金利の分が含まれています。売上は、すぐに現金で払った場合の価格1,000,000円だけにし、差額は時の経過に応じて「受取利息」として受け取っていきます。'
  },
  { id:1334, calc:'代理人は手数料部分だけを収益にする：500,000－450,000＝50,000', level:2, cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、Ｙ社の商品を自社の店舗で販売しており、<mark class="q-revenue">この取引における代理人に該当する</mark>。当日、顧客にＹ社の商品を販売し、<mark class="q-asset">代金500,000円を現金で受け取った</mark>。Ｙ社には、このうち<mark class="q-liability">450,000円を後日支払う</mark>。販売時の仕訳を示しなさい。',
    e:[{d:[['現金',500000]],c:[['未払金',450000],['受取手数料',50000]]}],
    exp:'代理人は、他社の商品の販売を手配しているだけなので、受け取った代金の全額を売上にはしません。自社の取り分である手数料50,000円だけを収益にし、Ｙ社に払う450,000円は未払金にします。'
  },
  { id:1335, calc:'配分：商品100,000×100,000/125,000＝80,000、ポイント100,000×25,000/125,000＝20,000\n使用分：20,000×10,000/25,000＝8,000', level:2, sides:['販売時','ポイント使用時'], cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、<mark class="q-revenue">商品100,000円</mark>を<mark class="q-asset">現金で販売し</mark>、顧客に<mark class="q-liability">25,000ポイント（1ポイント＝1円）</mark>を付与した。ポイントはすべて使用されると見込まれる。商品の独立販売価格は100,000円、ポイントの独立販売価格は25,000円である。その後、当期中に<mark class="q-revenue">10,000ポイントが使用された</mark>。販売時と、ポイント使用時の仕訳を示しなさい。',
    e:[{d:[['現金',100000]],c:[['売上',80000],['契約負債',20000]]},{d:[['契約負債',8000]],c:[['売上',8000]]}],
    exp:'受け取った100,000円を、商品とポイントの独立販売価格の比（100,000：25,000）で分けます。商品の分80,000円は渡した時点で売上、ポイントの分20,000円は将来商品を渡す義務なので「契約負債」です。ポイントが使われた割合に応じて、契約負債を売上に振り替えます。'
  },
  { id:1336, calc:'進捗度：2,400,000÷8,000,000＝30％\n収益：10,000,000×30％＝3,000,000', level:2, sides:['収益','原価'], cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、当期に建物の建設工事を請け負った。工事収益総額は10,000,000円、見積工事原価総額は8,000,000円である。履行義務の充足に係る<mark class="q-revenue">進捗度は原価比例法</mark>により見積もる。<mark class="q-expense">当期に発生した工事原価は2,400,000円</mark>であり、未成工事支出金に計上している。決算時の仕訳を示しなさい（<mark class="q-asset">工事代金の請求はまだ行っていない</mark>）。',
    e:[{d:[['契約資産',3000000]],c:[['完成工事高',3000000]]},{d:[['完成工事原価',2400000]],c:[['未成工事支出金',2400000]]}],
    exp:'工事の進み具合（進捗度）に応じて、少しずつ売上を計上します。進捗度は、見積総原価のうちどれだけ原価が発生したか（原価比例法）で測ります。まだ請求できない代金は「契約資産」です。'
  },
  { id:1337, calc:'工事全体の損失：5,400,000－5,000,000＝400,000\n当期に計上済みの損失：1,620,000－1,500,000＝120,000\n引当金：400,000－120,000＝280,000', level:2, cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社が当期に請け負った工事は、工事収益総額5,000,000円に対し、見積工事原価総額が5,400,000円となり、<mark class="q-expense">工事全体で損失が見込まれる</mark>。当期の進捗度は30％であり、当期の工事収益1,500,000円と工事原価1,620,000円はすでに計上済みである。決算において、<mark class="q-liability">今後見込まれる損失</mark>について必要な仕訳を示しなさい。',
    e:[{d:[['工事損失引当金繰入',280000]],c:[['工事損失引当金',280000]]}],
    exp:'工事全体で赤字になると分かった時点で、まだ計上していない将来の損失を前もって費用にします。全体の損失400,000円のうち、当期に計上済みの120,000円を除いた分を「工事損失引当金」にします。'
  },
  { id:1338, calc:'買戻し義務があるので材料の消滅を認識しない。受け取る320,000は負債', level:2, cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、帳簿価額300,000円の材料を、外注先に320,000円で有償支給した。<mark class="q-asset">代金は後日受け取る</mark>。Ｘ社は、<mark class="q-liability">加工後の部品を外注先から買い戻す義務</mark>を負っている。支給時の仕訳を示しなさい。',
    e:[{d:[['未収入金',320000]],c:[['有償支給取引に係る負債',320000]]}],
    exp:'材料を外注先に渡しても、加工後に買い戻す義務があるので、材料はまだ自社の支配下にあるとみます。材料は減らさず、売上も計上しません。受け取る代金は「有償支給取引に係る負債」にします。'
  },
  { id:1339, calc:'使用見込額：1,000,000－100,000＝900,000\n非行使部分の収益：100,000×450,000/900,000＝50,000\n収益：450,000＋50,000＝500,000', level:2, sides:['発行時','引換時'], cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、<mark class="q-liability">自社の商品券1,000,000円を発行し</mark>、<mark class="q-asset">現金を受け取った</mark>。過去の実績から、<mark class="q-revenue">このうち100,000円分は使用されない</mark>と見込まれる。当期中に、<mark class="q-revenue">商品券450,000円分と引換えに商品を引き渡した</mark>。発行時と、引換時の仕訳を示しなさい。',
    e:[{d:[['現金',1000000]],c:[['契約負債',1000000]]},{d:[['契約負債',500000]],c:[['売上',500000]]}],
    exp:'商品券を発行したときは、まだ商品を渡していないので「契約負債」です。使われない見込みの分は、実際に使われた割合に応じて少しずつ収益にします。今回は使用見込み900,000円のうち450,000円分が使われたので、非行使分100,000円の半分も収益になります。'
  },
  { id:1340, calc:'積送品：600,000＋20,000＝620,000\n売上は総額1,000,000、手取額1,000,000－100,000＝900,000', level:2, sides:['(1)積送','(2)販売','(3)原価'], cat:'収益認識', chap:'1級：収益認識・資産',
    q:'Ｘ社は、委託販売を行っている。<br>(1) <mark class="q-asset">商品（原価600,000円）を受託者に積送し</mark>、<mark class="q-expense">発送費用20,000円</mark>を現金で支払った。発送費用は積送品の原価に含める。<br>(2) 受託者から、<mark class="q-revenue">積送品をすべて1,000,000円で販売した</mark>との売上計算書が届いた。<mark class="q-expense">販売手数料100,000円</mark>が差し引かれた<mark class="q-asset">手取額は、後日受け取る</mark>。<br>(3) <mark class="q-expense">販売した積送品の原価を仕入勘定に振り替えた</mark>。',
    e:[{d:[['積送品',620000]],c:[['仕入',600000],['現金',20000]]},{d:[['積送売掛金',900000],['積送諸掛',100000]],c:[['積送品売上',1000000]]},{d:[['仕入',620000]],c:[['積送品',620000]]}],
    exp:'商品を受託者に送ったときは、まだ売れていないので「積送品」に移します（発送費用も原価に含めます）。受託者が売った時点で、販売額の総額を「積送品売上」にし、手数料は「積送諸掛」という費用にします。'
  },
  { id:1341, calc:'原価法：500,000×64％＝320,000\n低価法：500,000×60％＝300,000\n差額：20,000', level:2, cat:'棚卸資産', chap:'1級：収益認識・資産',
    q:'Ｘ社は売価還元法を採用している。<mark class="q-asset">期末商品の売価は500,000円</mark>、<mark class="q-expense">原価法の原価率は64％、低価法の原価率は60％</mark>である。売価還元低価法により期末商品を評価する。商品評価損についての仕訳を示しなさい（期末商品は原価法の原価率で繰越商品に計上済み）。',
    e:[{d:[['商品評価損',20000]],c:[['繰越商品',20000]]}],
    exp:'売価還元法では、期末商品の売価に原価率を掛けて原価を出します。低価法の原価率を使うと評価額が小さくなり、原価法との差が収益性の低下による「商品評価損」です。'
  },
  { id:1342, calc:'償却額：（10,000－9,600）÷4＝100ドル×期中平均105＝10,500\n償却原価：9,700ドル×110＝1,067,000\n換算差額：1,067,000－（960,000＋10,500）＝96,500', level:2, sides:['償却','換算'], cat:'有価証券', chap:'1級：収益認識・資産',
    q:'Ｘ社は、当期首に、<mark class="q-asset">満期保有目的でＡ社社債</mark>（額面10,000ドル、満期4年）を9,600ドルで取得した（取得時の為替相場1ドル100円）。<mark class="q-revenue">額面との差額は償却原価法（定額法）で処理する</mark>。期中平均相場は1ドル105円、<mark class="q-other">決算時の為替相場は1ドル110円</mark>である。決算時の償却原価法と換算の仕訳を示しなさい（利息の受取りは考えない）。',
    e:[{d:[['満期保有目的債券',10500]],c:[['有価証券利息',10500]]},{d:[['満期保有目的債券',96500]],c:[['為替差損益',96500]]}],
    exp:'外貨建の満期保有目的債券は、まず外貨で償却原価法を行い、その償却額を期中平均相場で円に直します。次に、外貨の償却原価全体を決算時の相場で換算し直し、差額は「為替差損益」にします。'
  },
  { id:1343, calc:'取得原価：5,000×100＝500,000\n期末：5,400×108＝583,200\n差額：83,200（換算差額も含めて評価差額金）', level:2, cat:'有価証券', chap:'1級：収益認識・資産',
    q:'Ｘ社は、当期に<mark class="q-asset">その他有価証券としてＢ社株式を5,000ドルで取得した</mark>（取得時の為替相場1ドル100円）。決算時の<mark class="q-equity">時価は5,400ドル、為替相場は1ドル108円</mark>である。全部純資産直入法を採用しており、税効果は考えない。決算時の仕訳を示しなさい。',
    e:[{d:[['その他有価証券',83200]],c:[['その他有価証券評価差額金',83200]]}],
    exp:'外貨建のその他有価証券は、外貨の時価に決算時の為替相場を掛けて円の時価を出します。取得原価との差額は、時価の変動分も為替の変動分もまとめて「その他有価証券評価差額金」にします。'
  },
  { id:1344, calc:'売買目的からの変更は、変更時の時価で振り替え、差額は損益：320,000－300,000＝20,000', level:2, cat:'有価証券', chap:'1級：収益認識・資産',
    q:'Ｘ社は、保有する売買目的有価証券（帳簿価額300,000円）を、<mark class="q-asset">保有目的を変更してその他有価証券に振り替えた</mark>。<mark class="q-revenue">変更時の時価は320,000円</mark>である。振替時の仕訳を示しなさい。',
    e:[{d:[['その他有価証券',320000]],c:[['売買目的有価証券',300000],['有価証券評価益',20000]]}],
    exp:'売買目的有価証券を他の区分に変えるときは、変更した時点の時価で振り替えます。売買目的では時価の変動が利益になるので、帳簿価額との差額は「有価証券評価益」にします。'
  },
  { id:1345, calc:'割引現在価値：121,000÷1.1÷1.1＝100,000\n利息費用：100,000×10％＝10,000\n減価償却：1,100,000÷2＝550,000\n履行差額：125,000－121,000＝4,000', level:2, sides:['(1)取得','(2)決算','(3)除去'], cat:'資産除去債務', chap:'1級：収益認識・資産',
    q:'Ｘ社（決算日3月31日）は、×1年4月1日に<mark class="q-asset">機械装置1,000,000円を現金で取得した</mark>。使用後に除去する法的義務があり、<mark class="q-liability">2年後の除去費用は121,000円</mark>と見積もられた（割引率10％）。機械装置は耐用年数2年、残存価額ゼロ、定額法（間接法）で償却する。<br>(1) 取得時<br>(2) ×2年3月31日の決算（<mark class="q-expense">時の経過による資産除去債務の増加と減価償却</mark>）<br>(3) ×3年3月31日に除去し、<mark class="q-expense">除去費用125,000円を現金で支払った</mark>（この時点の資産除去債務は121,000円。除去時の仕訳のみ示す）',
    e:[{d:[['機械装置',1100000]],c:[['現金',1000000],['資産除去債務',100000]]},{d:[['利息費用',10000],['減価償却費',550000]],c:[['資産除去債務',10000],['減価償却累計額',550000]]},{d:[['資産除去債務',121000],['履行差額',4000]],c:[['現金',125000]]}],
    exp:'将来の撤去費用を今の価値に割り引いた額を「資産除去債務」として負債に計上し、同じ額を機械装置の取得原価に加えます。毎年、時の経過で負債が増える分は「利息費用」です。実際の撤去費用との差は「履行差額」になります。'
  },
  { id:1346, calc:'繰延税金負債：1,000,000×30％＝300,000、積立金：1,000,000－300,000＝700,000\n減価償却：3,000,000÷5＝600,000\n取崩し：補助金分1,000,000÷5＝200,000→税効果60,000、積立金140,000', level:2, sides:['(1)税効果','(1)積立て','(2)減価償却','(3)税効果','(3)取崩し'], cat:'有形固定資産', chap:'1級：収益認識・資産',
    q:'Ｘ社は、当期首に国庫補助金1,000,000円を受け取り（受贈益として計上済み）、<mark class="q-asset">機械装置3,000,000円を取得した</mark>。圧縮記帳は<mark class="q-equity">積立金方式</mark>により行い、<mark class="q-liability">税効果会計を適用する（実効税率30％）</mark>。機械装置は耐用年数5年、残存価額ゼロ、<mark class="q-expense">定額法（間接法）で償却する</mark>。当期末の決算において、次の仕訳を示しなさい。<br>(1) 圧縮積立金の積立てと税効果<br>(2) 減価償却<br>(3) 当期の減価償却に応じた税効果と圧縮積立金の取崩し',
    e:[{d:[['法人税等調整額',300000]],c:[['繰延税金負債',300000]]},{d:[['繰越利益剰余金',700000]],c:[['圧縮積立金',700000]]},{d:[['減価償却費',600000]],c:[['減価償却累計額',600000]]},{d:[['繰延税金負債',60000]],c:[['法人税等調整額',60000]]},{d:[['圧縮積立金',140000]],c:[['繰越利益剰余金',140000]]}],
    exp:'積立金方式では、建物などの帳簿価額は減らさず、補助金の分を繰越利益剰余金から「圧縮積立金」に積み立てます。税金は将来の減価償却で取り戻されるので、まず税金分を「繰延税金負債」にします。減価償却に合わせて、積立金と繰延税金負債を少しずつ取り崩します。'
  },
  { id:1347, calc:'同種資産の交換は、譲渡資産の帳簿価額を取得原価とし、損益を認識しない：800,000－500,000＝300,000', level:2, cat:'有形固定資産', chap:'1級：収益認識・資産',
    q:'Ｘ社は、保有する機械装置（取得原価800,000円、減価償却累計額500,000円）と、<mark class="q-asset">同種・同一用途の機械装置</mark>を交換した。交換時の仕訳を示しなさい。',
    e:[{d:[['機械装置',300000],['減価償却累計額',500000]],c:[['機械装置',800000]]}],
    exp:'同じ種類・同じ用途の資産どうしの交換は、投資が続いているとみるので、損益を出しません。手放した資産の帳簿価額（取得原価－減価償却累計額）を、新しい資産の取得原価にします。'
  },
  { id:1348, calc:'見込販売数量：900,000×1,200/3,000＝360,000\n均等配分：900,000÷3＝300,000\n大きい方：360,000', level:2, cat:'無形固定資産', chap:'1級：収益認識・資産',
    q:'Ｘ社は、市場販売目的の<mark class="q-asset">ソフトウェアの制作費900,000円を無形固定資産に計上している</mark>。見込販売数量は3年間で3,000個、<mark class="q-expense">当期の実績販売数量は1,200個</mark>である。見込販売数量にもとづく償却額と、残存有効期間にもとづく均等配分額のいずれか大きい額を償却する。当期の償却の仕訳を示しなさい。',
    e:[{d:[['ソフトウェア償却',360000]],c:[['ソフトウェア',360000]]}],
    exp:'市場販売目的のソフトウェアは、見込販売数量に対する実際の販売数量の割合で償却します。ただし、残りの有効期間で均等に割った額より小さくはできません。今回は販売数量による額の方が大きいので、そちらを使います。'
  },
  { id:1349, calc:'利息費用：950,000×5％＝47,500\n支払額：1,000,000×3％＝30,000\n償却額：47,500－30,000＝17,500', level:2, sides:['発行時','利払い時'], cat:'社債', chap:'1級：負債・純資産・外貨・税効果',
    q:'Ｘ社は、当期首に<mark class="q-liability">額面1,000,000円の社債を950,000円で発行し</mark>、<mark class="q-asset">払込金は当座預金とした</mark>。クーポン利率は年3％（年1回期末払い）、<mark class="q-expense">実効利子率は年5％</mark>であり、償却原価法（利息法）を適用する。発行時と、期末の利払い時の仕訳を示しなさい。',
    e:[{d:[['当座預金',950000]],c:[['社債',950000]]},{d:[['社債利息',47500]],c:[['当座預金',30000],['社債',17500]]}],
    exp:'社債を額面より安く発行したときは、差額を満期までの期間に配分して社債の帳簿価額を増やします（償却原価法）。利息法では、帳簿価額×実効利子率を利息の費用とし、実際に払うクーポン利息との差を社債に足します。'
  },
  { id:1350, calc:'償還する社債の帳簿価額：980,000×1/2＝490,000\n支払額：500,000×99/100＝495,000\n償還損：5,000', level:2, cat:'社債', chap:'1級：負債・純資産・外貨・税効果',
    q:'Ｘ社は、額面総額1,000,000円の社債（<mark class="q-liability">帳簿価額980,000円</mark>）のうち、<mark class="q-expense">半分を額面100円につき99円で買入償還</mark>し、<mark class="q-asset">代金は当座預金から支払った</mark>（端数利息は考えない）。買入償還の仕訳を示しなさい。',
    e:[{d:[['社債',490000],['社債償還損',5000]],c:[['当座預金',495000]]}],
    exp:'社債を満期前に買い戻すと、買い戻した分の帳簿価額と支払額の差が損益になります。支払額の方が多ければ「社債償還損」です。'
  },
  { id:1351, calc:'損失の発生可能性が高く、金額を合理的に見積もれるので引当金を計上する', level:2, cat:'引当金', chap:'1級：負債・純資産・外貨・税効果',
    q:'Ｘ社は、取引先Ｃ社の借入金の保証人となっている。当期末に、Ｃ社の財政状態が悪化し、<mark class="q-expense">Ｘ社が保証債務を履行する可能性が高くなった</mark>。履行による<mark class="q-liability">損失見込額は400,000円</mark>である。決算時の仕訳を示しなさい。',
    e:[{d:[['債務保証損失引当金繰入',400000]],c:[['債務保証損失引当金',400000]]}],
    exp:'保証している会社の財政状態が悪くなり、代わりに支払う可能性が高くなったら、その損失を見積もって前もって費用にします（債務保証損失引当金）。'
  },
  { id:1352, calc:'将来キャッシュ・フローの現在価値：1,100,000÷1.1＝1,000,000\n貸倒見積高：1,100,000－1,000,000＝100,000', level:2, cat:'債権', chap:'1級：負債・純資産・外貨・税効果',
    q:'Ｘ社は<mark class="q-asset">Ｄ社に1,100,000円を貸し付けている</mark>（利率年10％、1年後に元利一括返済の予定）。Ｄ社の経営悪化により、<mark class="q-expense">利息を免除し、1年後に元本のみ受け取る</mark>条件に変更した。キャッシュ・フロー見積法により、当初の約定利子率で割り引いて貸倒見積高を算定する。決算時の仕訳を示しなさい。',
    e:[{d:[['貸倒引当金繰入',100000]],c:[['貸倒引当金',100000]]}],
    exp:'キャッシュ・フロー見積法では、貸付金から将来受け取れるお金を、当初の約定利子率で今の価値に割り引きます。帳簿価額との差額が貸倒見積高で、「貸倒引当金」を設定します。'
  },
  { id:1353, calc:'手取額：500,000－10,000＝490,000\n保証債務は割引時に時価で計上し、決済されたら取り崩す', level:2, sides:['割引','保証債務の計上','決済時'], cat:'債権', chap:'1級：負債・純資産・外貨・税効果',

  { id:1354, calc:'行使：払込6,000,000＋新株予約権50,000×6＝300,000\n失効：50,000×4＝200,000', level:2, sides:['発行時','行使時','失効時'], cat:'純資産', chap:'1級：負債・純資産・外貨・税効果',

  { id:1355, calc:'総額：90人×10個×6,000＝5,400,000、1年目：5,400,000÷2＝2,700,000\n行使：500個×20,000＝10,000,000、500個×6,000＝3,000,000\n失効：400個×6,000＝2,400,000', level:2, sides:['(1)1年目','(2)行使','(3)失効'], cat:'純資産', chap:'1級：負債・純資産・外貨・税効果',

  },
  { id:1356, calc:'自己株式の消却は、その他資本剰余金から減らす', level:2, cat:'純資産', chap:'1級：負債・純資産・外貨・税効果',
    q:'Ｘ社は、取締役会の決議により、保有する<mark class="q-equity">自己株式（帳簿価額800,000円）をすべて消却</mark>した。消却の仕訳を示しなさい。',

  { id:1357, calc:'上限：20,000,000×1/4－（3,000,000＋1,000,000）＝1,000,000\n配当の1/10：100,000（小さい方）\nその他資本剰余金が財源なので、積み立てるのは資本準備金', level:2, cat:'純資産', chap:'1級：負債・純資産・外貨・税効果',

  { id:1358, calc:'直々差額：（102－100）×10,000＝20,000\n直先差額：（105－102）×10,000＝30,000\n当期配分：30,000×1/3＝10,000（3月の1か月分）', level:2, sides:['2月1日','3月1日','3月31日'], cat:'外貨建取引', chap:'1級：負債・純資産・外貨・税効果',

    exp:'取引の後で為替予約をした場合、取引時と予約時の直物相場の差（直々差額）は予約した期の損益にします。予約時の直物相場と先物相場の差（直先差額）は、決済日までの期間に「前払費用」などで配分します。'

  { id:1359, calc:'回収できない120,000を取り崩す', level:2, cat:'税効果会計', chap:'1級：負債・純資産・外貨・税効果',

const KOGYO_ORDER = [1211, 1212, 1257, 1258, 1259, 1260, 1261, 1306, 1307, 1213, 1214, 1215, 1262, 1263, 1264, 1265, 1216, 1217, 1218, 1220, 1266, 1267, 1268, 1219, 1221, 1222, 1269, 1223, 1270, 1271, 1224, 1225, 1226, 1272, 1273, 1274, 1275, 1237, 1238, 1256, 1227, 1228, 1229, 1230, 1231, 1232, 1233, 1234, 1235, 1236, 1276, 1239, 1240, 1241, 1242, 1243, 1244, 1245, 1246, 1247, 1248, 1249, 1250, 1251, 1252, 1253, 1254, 1255];
function getSectionQuestions(sec){
  if(!sec) return ALL;
  if(sec === 'all'){
    const order = [...document.querySelectorAll('#sec-tabs .grp-btn')].map(b=>b.dataset.sec).filter(x=>x && x.startsWith('chap:'));
    const seen = new Set(), out = [];
    order.forEach(x => getSectionQuestions(x).forEach(q => { if(!seen.has(q.id)){ seen.add(q.id); out.push(q); } }));
    ALL.forEach(q => { if(!seen.has(q.id)) out.push(q); });
    return out;
  }
  if(sec.startsWith('big:')){
    // 大枠：その大枠に属する分野を、タブの並び順につなげる
    const big = sec.slice(4), seen = new Set(), out = [];
    [...document.querySelectorAll(`#sec-tabs .grp-btn[data-big="${big}"]`)].map(b=>b.dataset.sec).filter(x=>x.startsWith('chap:') && x!=='chap:1級')
      .forEach(x => getSectionQuestions(x).forEach(q => { if(!seen.has(q.id)){ seen.add(q.id); out.push(q); } }));
    return out;
  }
  if(sec.startsWith('chap:')){
    const chap = sec.slice(5);
    if(chap === '1級') return ALL.filter(q => q.chap && q.chap.startsWith('1級'));
    const list = ALL.filter(q => q.chap === chap);
    if(chap.startsWith('工業簿記')) list.sort((x,y)=>KOGYO_ORDER.indexOf(x.id)-KOGYO_ORDER.indexOf(y.id));
    return list;
  }
  return ALL;
}

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];

function speakBtnHtml(q){
  if(!('speechSynthesis' in window)) return '';
  return `<button class="q-speak" id="q-speak-btn" onclick="speakQ(${q.id})">🔊 読み上げ</button>`;
}
function speakText(q){
  return (q.q||'').replace(/<[^>]+>/g,'')
    .replace(/×(\d+)年/g,'エックス$1年')   // ×2年 などの年度の表記
    .replace(/＠/g,'単価');
}
function stopSpeak(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  const b=document.getElementById('q-speak-btn'); if(b) b.textContent='🔊 読み上げ';
}
// 日本語の声は O-ren を優先（Premium → Enhanced の順）。なければ高音質の声、なければ使える日本語の声
function pickJaVoice(){
  const ja=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  const rank=v=>{ const s=(v.name+' '+v.voiceURI).toLowerCase();
    const q=/premium|プレミアム/.test(s) ? 0 : /enhanced|拡張/.test(s) ? 1 : 2;
    return (/o-?ren/.test(s) ? 0 : 10) + q; };
  return ja.sort((a,b)=>rank(a)-rank(b))[0];
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
function speakQ(id){
  if(!('speechSynthesis' in window)) return;
  if(speechSynthesis.speaking){ stopSpeak(); return; }
  const q=ALL.find(x=>x.id===id); if(!q) return;
  const u=new SpeechSynthesisUtterance(speakText(q));
  u.lang='ja-JP';
  u.rate=1.4; // 速さ（ふつう＝1）
  const v=pickJaVoice(); if(v) u.voice=v;
  u.onend=u.onerror=()=>{ const b=document.getElementById('q-speak-btn'); if(b) b.textContent='🔊 読み上げ'; };
  const b=document.getElementById('q-speak-btn'); if(b) b.textContent='■ 停止';
  speechSynthesis.speak(u);
}

function renderExpStep(){

  if(!area) return;
  if(expStepIdx>=steps.length){

      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {

}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${tagType(acc.name)}" style="font-size:${fs}px;white-space:nowrap;display:inline-block;max-width:240px;">${acc.name}${acctEnHtml(acc.name)}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${tagType(a.name)}">${a.name}${acctEnHtml(a.name)}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function flowFigHtml(q){
  // 取引の図は表示せず、見出しだけを出す
  if(!FLOW_HEADS[q.id]) return '';
  const [main, sub] = FLOW_HEADS[q.id].split('｜');
  return `<div class="flow-wrap"><div class="flow-head">${main}${sub?`<div class="flow-head-sub">${sub}</div>`:''}</div></div>`;
}
function renderFlow(fig){
  const W=340, n=fig.nodes.length;
  const nodeH = fig.nodes.some(nd=>nd.sub) ? 36 : 28;
  // 箱の幅は文字数に合わせる
  const ws = fig.nodes.map(nd=>Math.max(66, nd.label.length*13+14, (nd.sub||'').length*9.5+12));
  const x0 = 8+ws[0]/2, xn = W-8-ws[n-1]/2;
  const xs = fig.nodes.map((_,i)=> n===1 ? W/2 : x0 + i*(xn-x0)/(n-1));
  const pos = Object.fromEntries(fig.nodes.map((nd,i)=>[nd.id, xs[i]]));
  const used = {}, arcs = [], lh = 13;
  // 時系列の番号：以前に起きていた取引（past）を先に、あとは並び順に①②③…
  const seq = fig.flows.length>1 ? [...fig.flows.filter(f=>f.past), ...fig.flows.filter(f=>!f.past)] : [];
  fig.flows.forEach(f=>{
    const x1=pos[f.from], x2=pos[f.to], ltr = x2>x1;
    const up = f.side ? f.side==='up' : ltr;
    const key = (up?'u':'d')+Math.min(x1,x2)+'-'+Math.max(x1,x2);
    const k = used[key]=(used[key]||0)+1;
    const no = seq.indexOf(f);
    const lines = ((no>=0 ? '①②③④⑤⑥⑦⑧⑨'[no] : '') + f.label).split('\n');
    arcs.push({f,x1,x2,up,apex:16+(k-1)*(lines.length*lh+6),lines});
  });
  const ext = a => a.apex + a.lines.length*lh + 2;
  const upMax = Math.max(0,...arcs.filter(a=>a.up).map(ext));
  const dnMax = Math.max(0,...arcs.filter(a=>!a.up).map(ext));
  const top = upMax + 2, H = top + nodeH + dnMax + 2;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:420px;margin:0 auto;font-family:inherit;">
  <defs>${Object.entries(FLOW_KIND).map(([k,v])=>`<marker id="far-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${v.color}"/></marker>`).join('')}</defs>`;
  let labels='';
  arcs.forEach(({f,x1,x2,up,apex,lines})=>{
    const kd = FLOW_KIND[f.kind];
    const dir = x2>x1?1:-1;
    const sx = x1 + dir*14, ex = x2 - dir*14;
    const y0 = up ? top : top+nodeH;
    const ay = up ? y0-apex : y0+apex;
    svg += `<path data-flow="1" d="M${sx},${y0} Q${(sx+ex)/2},${2*ay-y0} ${ex},${y0}" fill="none" stroke="${kd.color}" stroke-width="1.8" ${kd.dash?`stroke-dasharray="${kd.dash}"`:''} marker-end="url(#far-${f.kind})"${f.past?' opacity="0.35"':''}/>`;
    const lx=(sx+ex)/2;
    lines.forEach((l,i)=>{
      const ty = up ? ay - 4 - (lines.length-1-i)*lh : ay + 12 + i*lh;
      labels += `<text x="${lx}" y="${ty}" text-anchor="middle" font-size="11" font-weight="700" fill="${kd.color}" stroke="#fff" stroke-width="3" paint-order="stroke"${f.past?' opacity="0.5"':''}>${l}</text>`;
    });
  });
  fig.nodes.forEach((nd,i)=>{
    const x=pos[nd.id], me = nd.me, nodeW = ws[i];
    svg += `<rect x="${x-nodeW/2}" y="${top}" width="${nodeW}" height="${nodeH}" rx="8" fill="${me?'#ECEFF1':'#fff'}" stroke="${me?'#263238':'#B0BEC5'}" stroke-width="${me?2.2:1.2}"/>`;
    svg += `<text x="${x}" y="${top+(nd.sub?16:18.5)}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#263238">${nd.label}</text>`;
    if(nd.sub) svg += `<text x="${x}" y="${top+29}" text-anchor="middle" font-size="9" fill="#607D8B">${nd.sub}</text>`;
  });
  svg += labels + `</svg>`;
  return `${svg}${fig.note?`<div class="flow-note">💡 ${fig.note}</div>`:''}${fig.flows.some(f=>f.past)?'<div class="flow-note" style="opacity:.7">※薄い矢印は、以前に起きていた取引</div>':''}`;
}

const ACCT_GROUPS = [{"no":"資1","type":"asset","name":"決済で消える","use":"期中に借方 → 相手からお金・商品などを受け取って貸方","why":"どれも「相手に対して、あとでお金や商品をもらえる権利」。取引のときに借方に出て、相手からお金や商品を受け取った時点で貸方に出して消す、という同じ動きをする。売掛金の仕訳が書ければ、残りは科目名を入れ替えるだけで書ける。","subs":[{"label":"掛け・手形で売った代金","reason":"本業の売上で、お客さん本人から後で代金を受け取る権利。","members":["売掛金","受取手形","電子記録債権","割賦売掛金","工事未収入金"]},{"label":"第三者から受け取る代金","reason":"売上の代金だが、お客さんではなく信販会社や商品券の発行元から受け取る権利。","members":["クレジット売掛金","受取商品券","他店商品券"]},{"label":"回収が危なくなった権利","reason":"もともとの権利の回収が危なくなったので、普通の権利から振り替えて区別したもの。","members":["不渡手形","破産更生債権等"]},{"label":"本業以外の代金・配当","reason":"商品以外のものを売ったり、配当が決まったりして生じた権利。動きは本業の代金と同じ。","members":["未収入金","未収配当金","営業外受取手形","営業外電子記録債権"]},{"label":"貸したお金","reason":"代金ではなく、お金そのものを貸したときの権利。返してもらうと消える。","members":["貸付金","手形貸付金","役員貸付金","長期貸付金"]},{"label":"後で物が戻ってくる","reason":"お金ではなく、後で商品を受け取る（取り戻す）ことで消える権利。","members":["前払金","返品資産"]},{"label":"立て替えた・預けたお金","reason":"一時的に代わりに払ったり、担保として預けたりしたお金。後でお金で戻ってくる。","members":["立替金","差入保証金","先物取引差入証拠金"]}]},{"no":"資2","type":"asset","name":"振替で消える（仮置き）","use":"期中に借方 → 中身が決まったら貸方で別の科目へ振り替える","why":"どれも「中身や行き先がまだ決まっていないので、とりあえず借方に置いておく」科目。相手からお金をもらって消えるのではなく、中身が決まったときに社内で正しい科目へ振り替えて消える。","subs":[{"label":"金額・税額が後で決まる支払い","reason":"先に払っておき、内容や確定した税額がわかったら振り替える。","members":["仮払金","仮払消費税","仮払法人税等"]},{"label":"損害額が後で決まる","reason":"災害などの損害額や保険金が決まったら、損失や収益に振り替える。","members":["未決算","火災未決算"]},{"label":"完成・到着・請求を待つ","reason":"完成・到着・請求できる状態になったら、本来の科目に振り替える。","members":["建設仮勘定","ソフトウェア仮勘定","未着品","契約資産"]}]},{"no":"資3","type":"asset","name":"再振替で消える","use":"決算で借方 → 翌期首に貸方で元の科目へ戻す","why":"どれも決算のときだけ借方に出てくる科目。「今期の費用（または収益）から外す・加える」ために置き、翌期の初めに逆の仕訳（再振替）で元の科目に戻す。","subs":[{"label":"先に払った・まだ使っていない分","reason":"当期の費用から外して資産にし、翌期首に費用へ戻す。","members":["前払費用","前払利息","前払保険料","貯蔵品"]},{"label":"まだ受け取っていない分","reason":"当期の収益に加えて資産にし、翌期首に収益から戻す。","members":["未収収益","未収利息"]}]},{"no":"資4","type":"asset","name":"翌期以降の決算で入れ替え・解消","use":"決算で借方 → 次の決算などで貸方に出して入れ替える","why":"決算で借方に出し、次の決算などで貸方に出して入れ替える・解消する科目。期首に再振替はしない点が資3と違う。","subs": "]},{"label":"製造で出る副次物","reason":"製品をつくるときに一緒に出る、売却・利用できる物。","members":["副産物","作業くず","仕損品"]}]},{"no":"資9","type":"asset","name":"決済に使う","use":"あらゆる取引の相手として、入ったら借方・出たら貸方","why":"ほぼすべての取引で相手側に出てくる、お金そのもの。入ったら借方、出たら貸方という単純な動き。","subs":[{"label":"現金","reason":"手元にあるお金。","members":["現金","小口現金"]},{"label":"預金","reason":"銀行に預けてあるお金。","members":["当座預金","普通預金","定期預金","別段預金"]}]},{"no":"減","type":"contra","name":"決算で貸方に積む","use":"決算で貸方に積み増す → 貸倒れ・売却・戻入れで借方","why":"資産から差し引く科目。決算で貸方に積み増し、貸倒れ・売却・翌期の戻しのときに借方で減らす。","subs":[{"label":"見積りで差し引くもの","reason":"回収不能の見込みや社内の利益を、資産から差し引く。","members":["貸倒引当金","繰延内部利益"]},{"label":"減価償却の累計","reason":"毎期の減価償却費を積み上げ、固定資産から差し引く。","members":["減価償却累計額","建物減価償却累計額","備品減価償却累計額","車両運搬具減価償却累計額","機械装置減価償却累計額","構築物減価償却累計額","工具器具備品減価償却累計額","リース資産減価償却累計額"]}]},{"no":"負1","type":"liab","name":"決済で消える","use":"期中に貸方 → 相手にお金・商品などを渡して借方","why":"どれも「相手に対して、あとでお金や商品を渡す義務」。取引のときに貸方に出て、相手にお金や商品を渡した時点で借方に出して消す。資1の裏返し。","subs":[{"label":"仕入代金","reason":"本業の仕入で、後で代金を支払う義務。","members":["買掛金","支払手形","電子記録債務","工事未払金"]},{"label":"本業以外の代金・配当","reason":"商品以外のものを買ったり、配当を決めたりして生じた義務。","members":["未払金","営業外支払手形","営業外電子記録債務","未払配当金","条件付取得対価"]},{"label":"借りたお金","reason":"お金そのものを借りたときの義務。返すと消える。","members":["借入金","手形借入金","役員借入金","長期借入金"]},{"label":"借入金以外の形の借り","reason":"預金残高を超えた支払いや、リースで実質的に借りている分。","members":["当座借越","リース債務"]},{"label":"先にもらった代金","reason":"先にお金を受け取り、後で商品やサービスを渡す義務。","members":["前受金","契約負債","商品券","受託販売"]},{"label":"返金する見込み","reason":"売上のうち、リベートや返品で返金する見込みの分。","members":["返金負債","返品負債"]},{"label":"預かったお金","reason":"他人のお金を一時的に預かり、後で返す・納める義務。","members":["預り金","所得税預り金","社会保険料預り金","社会保険預り金"]},{"label":"納める税金","reason":"決算で確定し、これから納める税金。","members":["未払消費税","未払法人税等"]}]},{"no":"負2","type":"liab","name":"振替で消える（仮置き）","use":"期中に貸方 → 中身が決まったら借方で別の科目へ振り替える","why":"中身がまだ決まっていないので、とりあえず貸方に置いておく科目。中身が決まったら社内で正しい科目へ振り替えて消える。資2の裏返し。","subs":[{"label":null,"reason":"","members":["仮受金","仮受消費税","株式申込証拠金"]}]},{"no":"負3","type":"liab","name":"再振替で消える","use":"決算で貸方 → 翌期首に借方で元の科目へ戻す","why":"決算のときだけ貸方に出し、翌期の初めに再振替で元の科目に戻す。資3の裏返し。","subs":[{"label":"まだ払っていない分","reason":"当期の費用に加えて負債にし、翌期首に費用から戻す。","members":["未払費用","未払家賃","未払利息","未払賃金"]},{"label":"先にもらった分","reason":"当期の収益から外して負債にし、翌期首に収益へ戻す。","members":["前受収益","前受家賃"]}]},{"no":"負4","type":"liab","name":"翌期以降の決算で解消","use":"決算で貸方 → 後の期に借方で少しずつ・まとめて解消","why":"決算で貸方に出し、後の期に借方で少しずつ、またはまとめて解消する。期首の再振替はしない。資4の裏返し。","subs":[{"label":null,"reason":"","members":["繰延税金負債","長期前受収益"]}]},{"no":"負5","type":"liab","name":"決算で積み増し → 使ったら取り崩す","use":"決算で貸方に積む → 支払い・履行のときに借方","why":"決算で将来の支払いを見積って貸方に積み増し、実際に払ったときに借方で取り崩す。","subs":[{"label":"人に払う分の備え","reason":"将来の賞与や退職金のうち、当期に働いた分の見積り。","members":["賞与引当金","役員賞与引当金","退職給付引当金"]},{"label":"修理・工事・除去の備え","reason":"将来の修理・損失・取り壊しにかかる費用の見積り。","members":["修繕引当金","商品保証引当金","製品保証引当金","工事損失引当金","資産除去債務"]}]},{"no":"負6","type":"liab","name":"決算で金額を付け替え","use":"計上で貸方 → 決算で時価・償却原価に合わせて増減 → 償還・決済で借方","why":"計上したときに貸方に出て、決算のたびに時価や償却原価に合わせて金額を付け替え、返したり決済したりしたときに借方に出る。資7の裏返し。","subs":[{"label":null,"reason":"","members":["社債","デリバティブ負債"]}]},{"no":"純1","type":"eq","name":"払込み・出資で増える","use":"お金などの払込みで貸方 → 振替・取崩しで借方","why":"株主や店主がお金などを払い込んだときに貸方に出て増える。利益とは関係なく、出資に由来する。","subs":[{"label":"株式会社の出資","reason":"株主からの払込み（または将来の払込み）で増える。","members":["資本金","資本準備金","新株予約権"]},{"label":"個人事業の元手","reason":"店主が出した元手と、期中の追加。","members":["元入金","事業主借"]},{"label":"資本の剰余金","reason":"出資に由来するが、資本金・資本準備金にしなかった部分。","members":["その他資本剰余金","資本剰余金","自己株式処分差益"]}]},{"no":"純2","type":"eq","name":"利益の振替・積立で増える","use":"決算振替や配当時の積立で貸方 → 配当・取崩しで借方","why":"決算で利益を振り替えたり、配当のときに積み立てたりして貸方で増える。配当や取崩しで借方に出る。","subs":[{"label":"利益の蓄積の基本","reason":"稼いだ利益の残りと、法律で積み立てる分。","members":["繰越利益剰余金","利益剰余金","利益準備金"]},{"label":"目的を決めた積立","reason":"会社が自分で決めた目的のために積み立てる分。","members":["任意積立金","別途積立金","新築積立金","配当平均積立金","圧縮積立金"]}]},{"no":"純3","type":"eq","name":"連結仕訳で出る","use":"連結修正仕訳の中で貸方・借方に出す（個別の帳簿には出ない）","why":"個別の会社の帳簿には出てこず、連結財務諸表をつくるための連結仕訳の中でだけ使う。","subs":[{"label":null,"reason":"","members":["非支配株主持分","評価差額","利益剰余金当期首残高","利益剰余金期首残高"]}]},{"no":"純4","type":"eq","name":"借方に出て純資産を減らす","use":"借方に出る → 処分・決算振替で貸方","why":"借方に出て純資産を減らす。処分や決算の振替で貸方に出して消える。","subs":[{"label":null,"reason":"","members":["自己株式","自己株式処分差損","剰余金の配当","事業主貸"]}]},{"no":"費1","type":"exp","name":"期中に払って計上","use":"期中に借方（相手は現金・未払金・買掛金など）","why":"期中に、お金を払ったり、払う約束をしたりしたときに借方に出る、ふつうの費用。","subs":[{"label":"仕入","reason":"販売用の商品を仕入れたときの費用。","members":["仕入","本店より仕入","支店より仕入"]},{"label":"人件費","reason":"人を雇うことにかかる費用。","members":["給料","賞与","法定福利費"]},{"label":"販売のための費用","reason":"商品を売るためにかかる費用。","members":["発送費","支払手数料","販売手数料","広告宣伝費","商品保証費"]},{"label":"移動・通信","reason":"移動や連絡にかかる費用。","members":["旅費交通費","通信費"]},{"label":"場所・設備の費用","reason":"事務所や設備を使い続けるためにかかる費用。","members":["支払家賃","支払リース料","支払保険料","保険料","水道光熱費","修繕費"]},{"label":"消耗品・税金・研究","reason":"すぐ使い切る物、利益に関係ない税金、研究開発の費用。","members":["消耗品費","租税公課","研究開発費"]},{"label":"利息","reason":"お金を借りていることにかかる費用。","members":["支払利息","社債利息"]},{"label":"直接原価計算の区分","reason":"直接原価計算で、変動費・固定費に分けて表示するときの名前。","members":["変動販売費","固定販売管理費","固定費"]}]},{"no":"費2","type":"exp","name":"決算で見積り・配分して計上","use":"決算で借方（相手は資産・累計額・引当金・未払法人税等など）","why":"期中の支払いではなく、決算のときに見積りや配分で計算して借方に出す費用。相手は資産・累計額・引当金・未払法人税等など。","subs":[{"label":"資産の価値の減少","reason":"固定資産の価値の減少分を、毎期の費用に配分する。","members":["減価償却費","ソフトウェア償却","特許権償却","商標権償却"]},{"label":"のれんの償却","reason":"会社の買収で生じたのれんを、毎期の費用に配分する。","members":["のれん償却","のれん償却額"]},{"label":"繰延資産の償却","reason":"繰り延べた支出を、毎期の費用に配分する。","members":["創立費償却","開業費償却","株式交付費償却","社債発行費償却"]},{"label":"人に払う分の備え","reason":"将来の賞与・退職金などのうち、当期分を見積って費用にする。","members":["賞与引当金繰入","役員賞与引当金繰入","退職給付費用","利息費用"]},{"label":"損失・修理の備え","reason":"将来の貸倒れ・修理・損失のうち、当期分を見積って費用にする。","members":["貸倒引当金繰入","修繕引当金繰入","商品保証引当金繰入","製品保証引当金繰入","工事損失引当金繰入"]},{"label":"在庫の目減り","reason":"決算で在庫を調べて、数や価値が減っていた分。","members":["棚卸減耗損","商品評価損"]},{"label":"社内の利益の除去","reason":"社内取引で在庫に含まれた利益を取り除く。","members":["繰延内部利益控除","内部利益控除"]},{"label":"利益にかかる税金","reason":"決算で1年分の税額を確定させて費用にする。","members":["法人税等","法人税、住民税及び事業税"]}]},{"no":"費3","type":"exp","name":"資産・負債が消えた差額（損）","use":"売却・除却・評価・貸倒れ・償還で、差額がマイナスのとき借方","why":"資産や負債が売却・除却・評価などで消えたときに、帳簿価額との差額がマイナスだと借方に出る。金額は差額で決まる。","subs":[{"label":"固定資産を売る・捨てる","reason":"固定資産を手放したときの、帳簿価額との差の損。","members":["固定資産売却損","固定資産除却損","固定資産廃棄損"]},{"label":"固定資産の価値を失う・下げる","reason":"災害・収益性の低下・圧縮記帳・解約で、固定資産の価値が減った損。","members":["火災損失","減損損失","固定資産圧縮損","リース解約損"]},{"label":"有価証券を売る","reason":"有価証券を帳簿価額より安く売った損。","members":["有価証券売却損","投資有価証券売却損"]},{"label":"有価証券・株式の評価","reason":"決算などで、持っている証券の価値が下がった損。","members":["有価証券評価損","投資有価証券評価損","子会社株式評価損"]},{"label":"債権の損","reason":"債権を期日前に売ったり、回収できなくなったりした損。","members":["手形売却損","電子記録債権売却損","債権売却損","貸倒損失"]},{"label":"社債・外貨・買収","reason":"社債の償還、為替の変動、買収代金の精算で生じた損。","members":["社債償還損","為替差損","取得対価精算損"]},{"label":"異常・原因不明","reason":"通常は起こらない失敗や、原因のわからない小さな損。","members":["異常仕損費","雑損","雑損失"]}]},{"no":"費4","type":"exp","name":"他の科目から振り替えて計上","use":"製品・仕掛品などから振り替えて借方","why":"製品や仕掛品など、他の科目から振り替えて借方に出す費用。","subs":[{"label":"売上原価","reason":"売れた商品・製品の原価（直接原価計算での区分を含む）。","members":["売上原価","変動売上原価","固定製造原価"]},{"label":"サービス・工事の原価","reason":"提供したサービスや工事の原価。","members":["役務原価","工事原価","完成工事原価"]}]},{"no":"費5","type":"exp","name":"借方で集めて次へ振り替える","use":"借方で集める → 貸方で仕掛品・製造間接費へ振り替える","why":"借方で集めておいて、仕掛品や製造間接費へ貸方で振り替えていく、工業簿記の中継地点の科目。","subs":[{"label":"労務費","reason":"製造に関わる人に払う費用。","members":["賃金","雑給","賃金・給料","従業員賞与手当"]},{"label":"経費","reason":"材料費・労務費以外で、製造にかかった費用。","members":["外注加工費","経費","電力料"]},{"label":"製造間接費","reason":"製品ごとに直接わからない原価を集め、製品に配賦する。","members":["製造間接費","変動製造間接費","固定製造間接費","仕損費"]}]},{"no":"収1","type":"rev","name":"期中に受け取って計上","use":"期中に貸方（相手は現金・売掛金・本店など）","why":"期中に、お金や権利を受け取ったときに貸方に出る、ふつうの収益。","subs":[{"label":"売上","reason":"商品やサービスを外部に売ったときの収益。","members":["売上","未着品売上","役務収益"]},{"label":"社内での売上","reason":"本店から支店、工場から本社へ送ったときの社内の売上。","members":["支店へ売上","製品振替収益"]},{"label":"利息・配当","reason":"お金を貸したり、証券を持っていたりして受け取る収益。","members":["受取利息","有価証券利息","受取配当金","仕入割引"]},{"label":"家賃・手数料・回収","reason":"物を貸したり、サービスをしたり、あきらめた債権を回収したりした収益。","members":["受取家賃","受取手数料","償却 function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// チェック機能（仕訳問題のチェックとは別に保存）
let acctChecked = {};
try{ acctChecked = JSON.parse(localStorage.getItem('bk_acct_checked') || '{}') || {}; }catch(e){ acctChecked = {}; }
let acctCheckOnly = false;
function acctKeyOf(item){ return (item.en === undefined ? 'c' : 'a') + item.no; }
function toggleAcctChecked(){
  const item = dispQuizDeck[dispQuizIdx];
  if(!item) return;
  const k = acctKeyOf(item);
  if(acctChecked[k]) delete acctChecked[k]; else acctChecked[k] = true;
  try{ localStorage.setItem('bk_acct_checked', JSON.stringify(acctChecked)); }catch(e){}
  const btn = document.getElementById('acct-check-btn');
  if(btn){ btn.textContent = acctChecked[k] ? '☑ チェック済み' : '☐ チェックをつける'; btn.classList.toggle('active', !!acctChecked[k]); }
}
function acctCheckBtnHtml(item){
  const on = !!acctChecked[acctKeyOf(item)];
  return `<button id="acct-check-btn" class="exp-check-btn${on?' active':''}" onclick="toggleAcctChecked()">${on?'☑ チェック済み':'☐ チェックをつける'}</button>`;
}
function setAcctCheckOnly(on){ acctCheckOnly = on; launchDispQuiz(dispQuizTab); }

function acctGroupItems(g){ return g.subs.flatMap(s=>s.members).map(n=>ACCT_BY_NAME[n]).filter(Boolean); }
function dispTabPoolAll(tab){
  if(tab === 'concept') return CONCEPT_DATA;
  if(tab === 'all') return ACCT_GROUPS.flatMap(acctGroupItems);
  const g = ACCT_GROUPS.find(x=>x.no===tab);
  return g ? acctGroupItems(g) : [];
}
function dispTabPool(tab){
  const pool = dispTabPoolAll(tab);
  return acctCheckOnly ? pool.filter(d => acctChecked[acctKeyOf(d)]) : pool;
}

function dispTabsHtml(){
  const tabs = [
    { key:'concept', label:`表示区分の意味（${dispTabPool('concept').length}）` },
    ...ACCT_GROUPS.map(g => ({ key:g.no, label:`${g.no} ${g.name}（${dispTabPool(g.no).length}）` })),
    { key:'all', label:`全科目（${dispTabPool('all').length}）` },
  ];
  const nChecked = Object.keys(acctChecked).length;
  return `<div class="disp-tabs" id="disp-tabs">${tabs.map(t =>
    `<button class="ctrl-btn${t.key===dispQuizTab?' active':''}" onclick='launchDispQuiz(${JSON.stringify(t.key)})'>${t.label}</button>`).join('')}</div>
  <div class="sec-tabs" style="margin:6px 0 4px;align-items:center;">
    <span style="font-size:12px;font-weight:700;color:var(--muted);">表示方法：</span>
    <button class="ctrl-btn${!acctCheckOnly?' active':''}" onclick="setAcctCheckOnly(false)">全問</button>
    <button class="ctrl-btn${acctCheckOnly?' active':''}" onclick="setAcctCheckOnly(true)">チェックのみ（全${nChecked}問）</button>
  </div>`;
}
