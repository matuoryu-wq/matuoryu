  // ===== テキスト網羅：問題単位の徹底照合による補充（第2弾） =====
  { id:669, level:2, cat:'商品', chap:'第1章：商品売買',
    q:'商品売買の記帳方法を売上原価対立法によった場合の仕訳を示しなさい。①仕入先から商品を＠2,000円で30個仕入れ、代金は掛けとした。②上記の商品のうち20個を＠3,500円で得意先へ販売し、代金は掛けとした。',
    en_q:'Record the following under the cost-of-sales (perpetual) method: ①Purchased 30 units of merchandise at ¥2,000 each on credit. ②Sold 20 of those units at ¥3,500 each on credit.',
    e:[{d:[['商品',60000]], c:[['買掛金',60000]]}, {d:[['売掛金',70000]], c:[['売上',70000]]}, {d:[['売上原価',40000]], c:[['商品',40000]]}],
    exp:'売上原価対立法では、仕入時に「商品」勘定（資産）を計上し、売上時に「商品」勘定を「売上原価」勘定（費用）に振り替えます。①仕入：30個×＠2,000＝60,000円。②売上：20個×＠3,500＝70,000円。売上原価：20個×＠2,000＝40,000円。三分法と異なり、決算整理（売上原価の算定仕訳）が不要な点が特徴です。'
  },
  { id:670, level:3, cat:'収益認識', chap:'収益認識・現金預金',
    q:'資格予備校を運営する当社は、講座開始にあたり講座代金180,000円が普通預金口座に振り込まれた。その後、講師料72,000円・教材制作費18,000円を現金で支払った。決算に際して、上記講座の進捗度は60％であった（進捗部分に係る費用は54,000円）。３つの仕訳を示しなさい。',
    en_q:'A test-prep school received course fees of ¥180,000 into its bank account at the start of a course. It then paid instructor fees of ¥72,000 and course-material costs of ¥18,000 in cash. At year-end, the course was 60% complete (costs incurred to date: ¥54,000). Record all three entries.',
    e:[{d:[['普通預金',180000]], c:[['契約負債',180000]]}, {d:[['仕掛品',90000]], c:[['現金',90000]]}, {d:[['契約負債',108000]], c:[['役務収益',108000]]}, {d:[['役務原価',54000]], c:[['仕掛品',54000]]}],
    exp:'サービス業の会計処理：①サービス提供前に受け取った代金は「契約負債」（負債）で処理。②サービスに関連する費用の支払額はいったん「仕掛品」（資産）で処理。③決算時、提供済み部分を収益・費用に振り替える。役務収益：180,000×60%＝108,000円。役務原価：進捗費用そのまま54,000円（＝仕掛品の取崩額）。'
  },
  { id:671, level:2, cat:'現金預金', chap:'収益認識・現金預金',
    q:'決算日に金庫を実査したところ、紙幣硬貨80,000円・他人振出の小切手25,000円・配当金領収証15,000円・収入印紙5,000円が保管されていた。現金の帳簿残高は115,000円であり、差異の原因は不明である。決算整理仕訳を示しなさい。',
    en_q:'A cash count at year-end found: currency ¥80,000, a check issued by another party ¥25,000, a dividend receipt slip ¥15,000, and revenue stamps ¥5,000. The book balance of cash is ¥115,000, and the cause of the discrepancy is unknown. Record the year-end adjusting entry.',
    e:[{d:[['現金',5000]], c:[['雑益',5000]]}],
    exp:'現金の実査額＝通貨代用証券の合計：紙幣硬貨80,000＋他人振出小切手25,000＋配当金領収証15,000＝120,000円（収入印紙は通貨代用証券ではないため含めない）。実査額120,000－帳簿残高115,000＝5,000円（現金が多い＝雑益）。原因不明の現金超過は「雑益」、不足は「雑損」で処理します。'
  },
  { id:672, level:2, cat:'現金預金', chap:'収益認識・現金預金',
    q:'銀行勘定調整表：得意先から売掛金23,000円を回収し当座預金に入金したが、当社では誤って32,000円と記帳していた。当社側の修正仕訳を示しなさい。',
    en_q:'Bank reconciliation: Collected ¥23,000 in accounts receivable via bank deposit, but the company mistakenly recorded ¥32,000. Record the company-side correcting entry.',
    e:[{d:[['売掛金',9000]], c:[['当座預金',9000]]}],
    exp:'当社は正しくは23,000円を記帳すべきところ、誤って32,000円（当座預金32,000／売掛金32,000）と記帳していました。過大に減らしすぎた売掛金9,000円（32,000－23,000）を元に戻し、同時に当座預金も9,000円減らして修正します。銀行勘定調整の「誤記入」は当社側で修正が必要な項目の代表例です。'
  },
  { id:673, level:2, cat:'現金預金', chap:'収益認識・現金預金',
    q:'銀行勘定調整表：仕入先への買掛金支払いのために振り出した小切手12,000円が未渡しであった。また、営業費の支払いのために振り出した小切手8,000円も未渡しであった。当社側の修正仕訳を示しなさい。',
    en_q:'Bank reconciliation: A ¥12,000 check drawn to pay an accounts payable had not yet been handed over. Also, an ¥8,000 check drawn to pay operating expenses had not yet been handed over. Record the company-side correcting entries.',
    e:[{d:[['当座預金',12000]], c:[['買掛金',12000]]}, {d:[['当座預金',8000]], c:[['未払金',8000]]}],
    exp:'小切手を振り出すと、通常は仕訳のうえで当座預金がすでに減っています。しかし実際に相手に手渡す（郵送する）のを忘れていた「未渡小切手」は、まだ支払いが完了していないのと同じことなので、いったん減らした当座預金を元に戻す修正が必要です。仕入代金に関するものは買掛金として、それ以外の支払いに関するものは未払金として、負債を復活させます。'
  },
  { id:674, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'得意先に商品90,000円を販売し、代金は得意先が保有していた他社振出の約束手形を裏書譲渡された。仕訳を示しなさい。',
    en_q:'Sold goods for ¥90,000 to a customer, receiving payment via a promissory note (issued by yet another company) that the customer endorsed and transferred to us. Record the entry.',
    e:[{d:[['受取手形',90000]], c:[['売上',90000]]}],
    exp:'他社が振り出した約束手形を、商品の代金として裏書きで受け取った場合、自分にとっては「将来お金を受け取れる権利」を新たに手に入れたことになるので、受取手形（資産）として計上します。誰が最初に振り出した手形かに関わらず、「今、自分がその手形を持っていて、期日にお金を受け取れる」という事実が大切です。'
  },
  { id:675, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'買掛金180,000円の支払いのため、譲渡記録を行い、保有する電子記録債権を仕入先に譲渡した。仕訳を示しなさい。',
    en_q:'To settle an accounts payable of ¥180,000, filed a transfer record and assigned electronically recorded receivables to the supplier. Record the entry.',
    e:[{d:[['買掛金',180000]], c:[['電子記録債権',180000]]}],
    exp:'電子記録債権は、紙の手形の裏書譲渡と同じように、買掛金などの支払いに充てて他社へ譲ることができます（これを「譲渡記録」と呼びます）。譲渡した分だけ電子記録債権（資産）が減り、同時に買掛金（負債）も減ります。銀行に売って現金化する「割引」とは違い、そのまま支払いに使うだけなので売却損は発生しません。'
  },
  { id:676, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'A社から受け取った約束手形250,000円が不渡りとなった。その後、延滞利息5,000円を含めた255,000円が当座預金に振り込まれた。２つの仕訳を示しなさい。',
    en_q:'A promissory note of ¥250,000 received from Company A was dishonored. It was later collected, including ¥5,000 of overdue interest, for a total of ¥255,000 deposited into the bank account. Record both entries.',
    e:[{d:[['不渡手形',250000]], c:[['受取手形',250000]]}, {d:[['当座預金',255000]], c:[['不渡手形',250000],['受取利息',5000]]}],
    exp:'保有していた手形が不渡り（期日に支払ってもらえないこと）になると、まだ回収の可能性が残っているものとして、いったん「不渡手形」という資産に振り替えて管理します。その後、無事に回収できた場合は、不渡手形（元本相当額）を取り崩すとともに、遅れた分の利息（延滞利息）を新たに受取利息として計上します。'
  },
  { id:677, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'B社に裏書譲渡していたC社振出の約束手形40,000円が不渡りとなったため、当座預金から支払いを行い買い戻した。仕訳を示しなさい。',
    en_q:'A promissory note of ¥40,000 (issued by Company C) that we had endorsed and transferred to Company B was dishonored, so we paid from our bank account to buy it back. Record the entry.',
    e:[{d:[['不渡手形',40000]], c:[['当座預金',40000]]}],
    exp:'自分が裏書きして他社に渡した手形が不渡りになると、その手形を渡した責任として、自分が代わりにお金を払わなければなりません（これを「償還義務」と呼びます）。当座預金から支払った金額は、本来の振出人に対して「後で払ってもらう権利」として不渡手形（資産）に計上し、後日その振出人に請求します。'
  },
  { id:678, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'当社は取得原価90,000円の土地を120,000円でA社に売却し、代金はA社振出の約束手形で受け取った。当社の仕訳を示しなさい。',
    en_q:'Sold land (acquisition cost ¥90,000) to Company A for ¥120,000, receiving a promissory note issued by Company A as payment. Record our entry.',
    e:[{d:[['営業外受取手形',120000]], c:[['土地',90000],['固定資産売却益',30000]]}],
    exp:'商品の売買ではなく、土地のような固定資産を売った代金として手形を受け取る場合は、通常の「受取手形」とは区別して「営業外受取手形」という科目を使います。土地の売却では、売った金額（120,000円）と帳簿上の元の価値（90,000円）との差額30,000円が、固定資産売却益として利益に計上されます。'
  },
  { id:679, level:3, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'当社はD社の借入金400,000円の保証人となり、保証を行ったため対照勘定による備忘記録を行った。その後、D社が支払不能となったため、当社が代わりに当座預金から支払った。一連の仕訳を示しなさい。',
    en_q:'The company guaranteed a ¥400,000 loan for Company D and recorded a memorandum entry using contra accounts. Company D later became unable to pay, so the company paid on its behalf from its bank account. Record the sequence of entries.',
    e:[{d:[['保証債務見返',400000]], c:[['保証債務',400000]]}, {d:[['保証債務',400000]], c:[['保証債務見返',400000]]}, {d:[['未収入金',400000]], c:[['当座預金',400000]]}],
    exp:'他社の借金の保証人になっただけの段階では、実際にお金が動いたわけでも、自社の資産・負債が増減したわけでもありません。それでも将来お金を払う可能性がある重要な約束なので、「保証債務見返」「保証債務」という特殊な備忘記録（対照勘定）を使って、貸借対照表には載らない形で記憶しておきます。実際に相手が払えなくなって自分が代わりに支払ったときに、この備忘記録を消し、本当の債権（未収入金）として計上し直します。'
  },
  { id:680, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'A社株式を１株30,000円で５株購入し、手数料5,000円とともに現金で支払った。その後、A社株式を１株35,000円で５株購入し、手数料5,000円とともに現金で支払った。保有するA社株式のうち６株を１株33,000円で売却し、代金は現金で受け取った（売却原価は平均原価法による）。３つの仕訳を示しなさい。',
    en_q:'Purchased 5 shares of Company A stock at ¥30,000 each, paying a ¥5,000 fee, all in cash. Later purchased another 5 shares at ¥35,000 each, paying a ¥5,000 fee, in cash. Then sold 6 of the shares held at ¥33,000 each for cash (cost of shares sold determined by the average cost method). Record all three entries.',
    e:[{d:[['売買目的有価証券',155000]], c:[['現金',155000]]}, {d:[['売買目的有価証券',180000]], c:[['現金',180000]]}, {d:[['現金',198000],['有価証券売却損',3000]], c:[['売買目的有価証券',201000]]}],
    exp:'取得原価には手数料を含めます。①５株×＠30,000＋5,000＝155,000円。②５株×＠35,000＋5,000＝180,000円。平均単価：(155,000＋180,000)÷10株＝＠33,500円。③売却金額：6株×＠33,000＝198,000円。売却原価：6株×＠33,500＝201,000円。有価証券売却損：198,000－201,000＝△3,000円。有価証券を２回以上取得した場合、売却原価は平均原価法で算定します。'
  },
  { id:681, level:2, cat:'無形固定資産', chap:'無形資産・リース・引当金',
    q:'社内利用目的のソフトウェアの制作を1,200,000円で依頼し、手付金として現金500,000円を支払った。その後ソフトウェアが完成し引き渡しを受け、残額700,000円を現金で支払った。決算に際して、有効期間５年（当期12ヶ月分）で償却する。３つの仕訳を示しなさい。',
    en_q:'Commissioned in-house-use software development for ¥1,200,000, paying a ¥500,000 deposit in cash. The software was later completed and delivered, and the remaining ¥700,000 was paid in cash. At year-end, amortize over a 5-year useful life (full 12 months this period). Record all three entries.',
    e:[{d:[['ソフトウェア仮勘定',500000]], c:[['現金',500000]]}, {d:[['ソフトウェア',1200000]], c:[['ソフトウェア仮勘定',500000],['現金',700000]]}, {d:[['ソフトウェア償却',240000]], c:[['ソフトウェア',240000]]}],
    exp:'完成前のソフトウェアに支払った手付金は、まだ実際にソフトウェアという資産が完成していないため、いったん「ソフトウェア仮勘定」という仮の資産科目で記録しておきます。完成して実際に使えるようになった時点で、正式な「ソフトウェア」という無形固定資産に振り替えます。無形固定資産は建物のように減価償却累計額を使わず、直接資産の帳簿価額を減らしていく「直接法」で償却するのが特徴です。1,200,000÷5年＝240,000円が1年分の償却額です。'
  },
  { id:682, level:3, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'決算にあたり、売掛金残高300,000円のうち30,000円はX社に対するものである。X社は経営状態に重大な問題が生じているため、担保の処分見込額10,000円を控除した残額の50％を貸倒見積高とする。その他の売掛金については債権金額の２％を貸倒見積高とする。貸倒引当金の期首残高はゼロ（差額補充法）。決算整理仕訳を示しなさい。',
    en_q:'At year-end, of a ¥300,000 accounts receivable balance, ¥30,000 relates to Company X, which is in serious financial distress. Estimate its bad debt allowance at 50% of the balance after deducting the ¥10,000 collateral recovery value. For the remaining receivables, estimate 2% of the balance. The opening allowance balance is zero (allowance method, incremental basis). Record the adjusting entry.',
    e:[{d:[['貸倒引当金繰入',15400]], c:[['貸倒引当金',15400]]}],
    exp:'個別評価と一括評価を使い分けます。X社（個別評価）：(売掛金30,000－担保の処分見込額10,000)×50％＝10,000円。その他の売掛金（一括評価）：(300,000－30,000)×2％＝5,400円。貸倒見積高合計：10,000＋5,400＝15,400円。期首残高がゼロなので、差額補充法によりそのまま15,400円を繰り入れます。'
  },
  { id:683, level:2, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'当期純損失の計上により、繰越利益剰余金が350,000円の借方残高となっている。株主総会の決議により、資本金と相殺して欠損を填補した。仕訳を示しなさい。',
    en_q:'Due to a net loss, retained earnings (繰越利益剰余金) shows a ¥350,000 debit balance. By shareholders\' meeting resolution, this deficit was offset against paid-in capital. Record the entry.',
    e:[{d:[['資本金',350000]], c:[['繰越利益剰余金',350000]]}],
    exp:'繰越利益剰余金が借方残高（マイナス）になっている状態は「欠損」と呼ばれ、これまでの損失の蓄積で純資産が目減りしていることを示します。株主総会の決議によって、会社の元手である資本金を取り崩し、その分でこの欠損を埋め合わせることができます。これを「欠損填補」と呼びます。'
  },
  { id:684, level:2, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'株主総会において、以下の決議を行った。新築積立金の積立て：15,000円　別途積立金の取崩し：35,000円。必要な仕訳を示しなさい。',
    en_q:'At the shareholders\' meeting, the following were resolved: appropriation to a new-building reserve of ¥15,000; reversal of a general reserve of ¥35,000. Record the necessary entries.',
    e:[{d:[['繰越利益剰余金',15000]], c:[['新築積立金',15000]]}, {d:[['別途積立金',35000]], c:[['繰越利益剰余金',35000]]}],
    exp:'新築積立金や別途積立金のような「任意積立金」は、会社が自主的な判断で、将来の特定の目的のために利益の一部を取り分けておくものです。積み立てるときは繰越利益剰余金からその積立金へ、逆に必要がなくなって取り崩すときは積立金から繰越利益剰余金へと、自由に行き来させることができます。'
  },
  { id:685, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'株主総会において、配当金90,000円の支払いを決議し、準備金は配当金の1/10を積み立てることとした。配当財源：繰越利益剰余金60,000円、その他資本剰余金30,000円。仕訳を示しなさい。',
    en_q:'At the shareholders\' meeting, a dividend of ¥90,000 was resolved, with 1/10 of the dividend to be appropriated to statutory reserves. Dividend sources: retained earnings ¥60,000, other capital surplus ¥30,000. Record the entry.',
    e:[{d:[['繰越利益剰余金',66000],['その他資本剰余金',33000]], c:[['未払配当金',90000],['利益準備金',6000],['資本準備金',3000]]}],
    exp:'繰越利益剰余金を財源とした場合は「利益準備金」を、その他資本剰余金を財源とした場合は「資本準備金」を、それぞれの財源の1/10だけ積み立てます。利益準備金：60,000×1/10＝6,000円（繰越利益剰余金からは60,000＋6,000＝66,000円が減少）。資本準備金：30,000×1/10＝3,000円（その他資本剰余金からは30,000＋3,000＝33,000円が減少）。'
  },
  // ===== 総合問題（本支店合併財務諸表・連結精算表） =====
  { id:686, level:3, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'本店は支店へ商品を原価に25％の利益を加算して送付しており、当期の内部売上高（支店へ売上）は250,000円であった。また、支店の期末商品（送付価格ベース50,000円）に内部利益10,000円が含まれている。合併損益計算書を作成するための、①内部取引の相殺消去②内部利益の消去の仕訳を示しなさい。',
    en_q:'HQ ships goods to the branch marked up 25% over cost; this period\'s internal sales ("sales to branch") totaled ¥250,000. The branch\'s closing inventory (¥50,000 at transfer price) includes ¥10,000 of unrealized internal profit. Record ①the elimination of the internal transaction and ②the elimination of the unrealized profit needed to prepare the combined income statement.',
    e:[{d:[['支店へ売上',250000]], c:[['本店より仕入',250000]]}, {d:[['売上原価',10000]], c:[['繰越商品',10000]]}],
    exp:'本支店合併財務諸表の作成では、会社内部の取引を消去します。①本店の「支店へ売上」と支店の「本店より仕入」は同じ内部取引の裏表なので相殺消去します。②支店の期末商品に含まれる内部利益（まだ外部に売っていない、社内でだけ発生した利益）10,000円（＝送付価格50,000×利益率25/125）は、合併上の利益から除くため売上原価を増加させます。'
  },
  { id:687, level:3, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'本店の「支店」勘定（資産）300,000円と支店の「本店」勘定（負債）300,000円は、内部取引の裏表であるため相殺消去する。また、期末商品に含まれる内部利益10,000円（前問と同じ）を消去する。合併貸借対照表を作成するための仕訳を示しなさい。',
    en_q:'HQ\'s "Branch" account (asset, ¥300,000) and the branch\'s "HQ" account (liability, ¥300,000) represent the same internal transaction and must be eliminated. Also eliminate the ¥10,000 unrealized internal profit in closing inventory (same as the prior problem). Record the entries needed to prepare the combined balance sheet.',
    e:[{d:[['本店',300000]], c:[['支店',300000]]}, {d:[['繰越利益剰余金',10000]], c:[['繰越商品',10000]]}],
    exp:'①本店の「支店」勘定（資産）と支店の「本店」勘定（負債）は、会社内部の貸し借りに過ぎないため相殺消去してゼロにします。②期末商品に含まれる内部利益は、まだグループ外に実現していない利益なので、商品の評価額を減らすと同時に、繰越利益剰余金からも同額を控除します。損益計算書側の内部利益消去（売上原価の増加）と貸借対照表側の消去（繰越利益剰余金の減少）は連動しています。'
  },
  { id:688, level:3, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'P社（親会社）はS社（子会社）の発行済株式の80％を400,000円で取得し支配を獲得した。支配獲得時のS社の純資産は資本金300,000円・利益剰余金100,000円であった。資本連結（投資と資本の相殺消去）の仕訳を示しなさい。',
    en_q:'Parent P acquired 80% of subsidiary S for ¥400,000, gaining control. At acquisition, S\'s net assets were capital ¥300,000 and retained earnings ¥100,000. Record the capital consolidation entry (elimination of investment against equity).',
    e:[{d:[['資本金',300000],['利益剰余金',100000],['のれん',80000]], c:[['S社株式',400000],['非支配株主持分',80000]]}],
    exp:'S社純資産：資本金300,000＋利益剰余金100,000＝400,000円。親会社持分（80％）：320,000円。非支配株主持分（20％）：80,000円。のれん：投資額400,000－親会社持分320,000＝80,000円。連結では子会社の資本金・利益剰余金を全額消去し、親会社の投資（S社株式）とも相殺、差額をのれん、非支配株主の取り分を非支配株主持分（純資産）に振り替えます。'
  },
  { id:689, level:2, cat:'無形固定資産', chap:'無形資産・リース・引当金',
    q:'前期に吸収合併により計上したのれん400,000円について、決算に際し20年間の均等償却を行う。仕訳を示しなさい。',
    en_q:'Amortize goodwill of ¥400,000 (recorded last period upon a merger) on a straight-line basis over 20 years at year-end. Record the entry.',
    e:[{d:[['のれん償却',20000]], c:[['のれん',20000]]}],
    exp:'のれんは、他社を買収したときに「帳簿上の価値以上に払った、目に見えない価値（ブランド力・顧客とのつながりなど）」への対価です。この価値は永遠に続くわけではないと考えられるため、20年以内の期間にわたって少しずつ費用として償却していきます。400,000円÷20年＝20,000円が1年分の償却額です。'
  },
  { id:690, level:3, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'機械装置（現金購入代価1,000,000円）を取得した。当該機械の使用終了時に除去費用として100,000円（割引現在価値）を要することが見込まれるため、資産除去債務を計上する。取得時の仕訳を示しなさい。',
    en_q:'Acquired machinery for ¥1,000,000 cash. At end of use, removal costs of ¥100,000 (present value) are expected, requiring recognition of an asset retirement obligation. Record the acquisition entry.',
    e:[{d:[['機械装置',1100000]], c:[['現金',1000000],['資産除去債務',100000]]}],
    exp:'固定資産を将来使い終えたときに、法律上撤去・処分しなければならない義務があるなら、その将来の除去費用も、資産を取得した時点であらかじめ見積もって負債（資産除去債務）として計上し、同時にその見積額を固定資産の取得原価にも上乗せします。「今後の後片付け費用も、資産を取得するコストの一部」と考える処理です。'
  },
  { id:691, level:3, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'備品（帳簿価額800,000円）について減損の兆候が見られ、割引前将来キャッシュ・フローの合計額650,000円が帳簿価額を下回った。回収可能価額（正味売却価額と使用価値のいずれか高い方）は500,000円であった。減損損失の仕訳を示しなさい。',
    en_q:'Equipment (book value ¥800,000) shows indicators of impairment; undiscounted future cash flows of ¥650,000 fall below book value. The recoverable amount (higher of net selling price and value in use) is ¥500,000. Record the impairment loss.',
    e:[{d:[['減損損失',300000]], c:[['備品',300000]]}],
    exp:'減損会計は「この資産、本当にそれだけの価値があるの？」を確認する手続きです。まず割引前の将来キャッシュ・フロー（650,000円）が帳簿価額（800,000円）を下回ったことで「価値が落ちているかもしれない」と判定し、実際にいくらまで価値が下がったか（回収可能価額500,000円）を計算して、その差額300,000円を減損損失として一気に計上します。'
  },
  { id:692, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'以前計上したクレジット売掛金97,000円（手数料控除後の金額）が当座預金に入金された。仕訳を示しなさい。',
    en_q:'Previously recorded credit-card receivable of ¥97,000 (net of processing fee) was deposited into the bank account. Record the entry.',
    e:[{d:[['当座預金',97000]], c:[['クレジット売掛金',97000]]}],
    exp:'クレジット払いで商品を売ったときは、販売した時点であらかじめ信販会社への手数料を差し引いた金額（純額）で「クレジット売掛金」を計上しています。そのため、実際に信販会社からお金が振り込まれたときは、追加の費用計上をせず、単純にクレジット売掛金という資産が当座預金という資産に置き換わるだけです。'
  },
  { id:693, level:3, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'決算時、外貨建売掛金1,500ドル（帳簿価額216,000円、取引時レート144円）と外貨建買掛金800ドル（帳簿価額116,800円、取引時レート146円）を、決算時レート148円で換算替えする。２つの仕訳を示しなさい。',
    en_q:'At year-end, translate foreign-currency receivables of $1,500 (book value ¥216,000, transaction rate ¥144) and foreign-currency payables of $800 (book value ¥116,800, transaction rate ¥146) at the closing rate of ¥148. Record both entries.',
    e:[{d:[['売掛金',6000]], c:[['為替差損益',6000]]}, {d:[['為替差損益',1600]], c:[['買掛金',1600]]}],
    exp:'売掛金：1,500ドル×決算時レート148円＝222,000円。差額：222,000－216,000＝6,000円増加（債権が増える＝収益）。買掛金：800ドル×決算時レート148円＝118,400円。差額：118,400－116,800＝1,600円増加（債務が増える＝費用）。外貨建の金銭債権・債務は、資産側と負債側で為替差損益の向きが逆になる点に注意。'
  },
  { id:694, level:3, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'ファイナンス・リース取引（利子込み法、リース資産・債務計上額300,000円）について、期首減価償却累計額が100,000円ある状態で期中に解約し、規定損害金150,000円を現金で支払った。解約時点のリース債務残高は180,000円である。仕訳を示しなさい。',
    en_q:'A finance lease (recorded gross method, lease asset/liability ¥300,000, accumulated depreciation ¥100,000 at the start of the period) was cancelled mid-period, with a ¥150,000 cash penalty paid. The remaining lease liability at cancellation is ¥180,000. Record the entry.',
    e:[{d:[['リース資産減価償却累計額',100000],['リース債務',180000],['リース解約損',170000]], c:[['リース資産',300000],['現金',150000]]}],
    exp:'リース契約を中途解約する場合、リース資産（取得原価）とその減価償却累計額を取り崩し、残っているリース債務も消去します。規定損害金の支払額とこれらの差額を「リース解約損」（費用）として処理します。リース資産の帳簿価額200,000円（300,000－100,000）とリース債務180,000円、損害金150,000円の差額170,000円が解約損です。'
  },
  { id:695, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'売掛金150,000円について、取引銀行を通じて電子記録債権の発生記録を行った。仕訳を示しなさい。',
    en_q:'Filed an origination record for electronically recorded receivables of ¥150,000 through the bank, converting existing accounts receivable. Record the entry.',
    e:[{d:[['電子記録債権',150000]], c:[['売掛金',150000]]}],
    exp:'売掛金を電子記録債権に切り替えるのは、紙の証書を電子データに置き換えるようなものです。回収する権利そのものは変わらないため、金額はそのままに、勘定科目だけを売掛金から電子記録債権へ振り替えます。'
  },
  { id:696, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'額面100,000円の社債（額面100円につき＠97円）を、利率年7.3％・利払日３月末と９月末の条件で、X1年11月30日（前回利払日から61日経過、１年365日で日割計算）に、端数利息を含めた現金で購入した。購入の仕訳を示しなさい。',
    en_q:'Purchased a bond (face ¥100,000, at ¥97 per ¥100 face) carrying a 7.3% annual coupon (paid Mar 31 and Sep 30) on Nov 30, X1 (61 days since the last coupon date; use a 365-day year), paying cash including accrued interest. Record the purchase.',
    e:[{d:[['売買目的有価証券',97000],['有価証券利息',1220]], c:[['現金',98220]]}],
    exp:'取得原価：額面100,000×＠97/100＝97,000円。端数利息：額面100,000×7.3%×61日/365日＝1,220円。公社債を利払日以外で購入する場合、買主は端数利息分を売主に支払います。この端数利息は「有価証券利息」勘定の借方（収益のマイナス）で処理し、次回の利払日に受け取る利息とあわせて調整されます。'
  },
  { id:697, level:3, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'得意先が破産手続き開始の申立てを行ったため、同社に対する売掛金200,000円を「破産更生債権等」に振り替えた。なお、担保の処分見込額は50,000円であり、その残額全額を貸倒引当金として個別に設定する。２つの仕訳を示しなさい。',
    en_q:'A customer filed for bankruptcy, so the ¥200,000 receivable from them was reclassified as "claims in bankruptcy and reorganization." The collateral recovery value is ¥50,000; provide a bad-debt allowance for the full remaining balance on an individual basis. Record both entries.',
    e:[{d:[['破産更生債権等',200000]], c:[['売掛金',200000]]}, {d:[['貸倒引当金繰入',150000]], c:[['貸倒引当金',150000]]}],
    exp:'得意先が破産などで経営破綻すると、その売掛金はもう「普通に回収できる債権」とは言えなくなるため、「破産更生債権等」という特別な区分に振り替えて、回収の見込みが低いことを明示します。担保でカバーされる部分（50,000円）を除いた残り（150,000円）は、回収できる見込みがほぼないとみなし、全額をその債権専用の貸倒引当金として個別に設定します。'
  },
  { id:698, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'積立金方式による圧縮記帳を行った機械装置（圧縮積立金400,000円計上済み・耐用年数５年・定額法）について、決算に際し、減価償却費の計上と同時に圧縮積立金の取崩しを行う。取崩額は圧縮積立金を耐用年数で均等に取り崩す金額（400,000÷５年）とする。取崩しの仕訳を示しなさい。',
    en_q:'For machinery with compression accounting under the reserve method (¥400,000 compression reserve recorded, 5-year useful life, straight-line), reverse a proportional amount of the reserve alongside depreciation at year-end (¥400,000 ÷ 5 years). Record the reversal entry.',
    e:[{d:[['圧縮積立金',80000]], c:[['繰越利益剰余金',80000]]}],
    exp:'国からの補助金を使って固定資産を買った場合、補助金の分だけ会社が儲かったように見えてしまいますが、それでは補助金をもらった年だけ税負担が急に重くなってしまいます。積立金方式では、資産の取得原価はそのまま維持しつつ、補助金相当額を「圧縮積立金」として純資産に据え置き、その後の減価償却の進み具合に合わせて、少しずつ取り崩していくことで、税負担が急増しないように調整します。400,000÷5年＝80,000円が1年分の取崩額です。'
  },
  { id:699, level:2, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'新株予約権200,000円を発行し、払込金額を現金で受け取った。仕訳を示しなさい。',
    en_q:'Issued stock acquisition rights (new share warrants) for ¥200,000, receiving the subscription amount in cash. Record the entry.',
    e:[{d:[['現金',200000]], c:[['新株予約権',200000]]}],
    exp:'新株予約権は「将来、あらかじめ決めた価格で株式を取得できる権利」です。発行時に受け取るお金は、資本金でもなければ返済義務のある負債でもない、独特な性質を持つため、「新株予約権」という純資産の項目として区別して計上します。将来、権利が行使されれば資本金・資本準備金に、行使されなければ新株予約権戻入益（収益）に、それぞれ姿を変えます。'
  },
  { id:700, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'商品150,000円を掛けで販売した後、品質不良のため15,000円の値引きを行うことになった。値引き時の仕訳を示しなさい。',
    en_q:'After selling goods for ¥150,000 on credit, agreed to a ¥15,000 price reduction due to a quality defect. Record the entry at the time of the price reduction.',
    e:[{d:[['売上',15000]], c:[['売掛金',15000]]}],
    exp:'販売した後に品質の問題で値引きをすることになった場合、それは「もともと約束していた売上の金額を、後から少し下げる」ことと同じです。そこで最初に計上していた売上を直接減らし、対応する売掛金（まだ回収していない代金）も同額減らします。仕入側が受ける値引きが仕入の減少になるのと、ちょうど対称的な処理です。'
  },
  { id:701, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'株主総会で配当金200,000円（繰越利益剰余金を財源）の支払いを決議した。資本準備金180,000円・利益準備金70,000円・資本金1,000,000円である場合、積み立てるべき利益準備金の金額を求め、仕訳を示しなさい。',
    en_q:'The shareholders\' meeting resolved a ¥200,000 dividend (sourced from retained earnings). Given capital reserve ¥180,000, statutory (retained earnings) reserve ¥70,000, and paid-in capital ¥1,000,000, determine the required addition to the statutory reserve and record the entry.',
    e:[{d:[['繰越利益剰余金',200000]], c:[['未払配当金',200000]]}],
    exp:'配当の1/10（200,000×1/10＝20,000円）を積み立てるのが原則ですが、準備金合計（資本準備金180,000＋利益準備金70,000＝250,000円）がすでに資本金の1/4（1,000,000×1/4＝250,000円）に達しているため、追加の積立ては不要（積立額ゼロ）です。よって、配当金の仕訳のみが必要になります。'
  },
  { id:702, level:2, cat:'有価証券', chap:'第5章：有価証券',
    q:'売買目的有価証券としてＡ社株式（取得原価300,000円、期末時価330,000円）とＢ社株式（取得原価250,000円、期末時価235,000円）を保有している。それぞれの銘柄について時価評価の仕訳を示しなさい。',
    en_q:'Holding trading securities: Company A stock (cost ¥300,000, year-end market value ¥330,000) and Company B stock (cost ¥250,000, year-end market value ¥235,000). Record the fair-value remeasurement entry for each holding.',
    e:[{d:[['売買目的有価証券',30000]], c:[['有価証券評価益',30000]]}, {d:[['有価証券評価損',15000]], c:[['売買目的有価証券',15000]]}],
    exp:'売買目的有価証券は銘柄ごとに時価評価します。Ａ社株式：時価330,000－取得原価300,000＝＋30,000円（評価益）。Ｂ社株式：時価235,000－取得原価250,000＝△15,000円（評価損）。異なる銘柄の評価益と評価損は、原則としてそれぞれ別の勘定（有価証券評価益・有価証券評価損）で計上します。'
  },
  { id:703, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'保有する約束手形２枚（額面120,000円・180,000円）をまとめて銀行で割り引き、割引料合計9,000円を差し引かれた残額が当座預金に入金された。仕訳を示しなさい。',
    en_q:'Discounted two held promissory notes (face values ¥120,000 and ¥180,000) together at the bank, with a total discount fee of ¥9,000 deducted; the net amount was deposited into the bank account. Record the entry.',
    e:[{d:[['当座預金',291000],['手形売却損',9000]], c:[['受取手形',300000]]}],
    exp:'複数の手形をまとめて銀行で割り引く場合でも、考え方は1枚のときと同じです。すべての手形の額面を合計し（120,000＋180,000＝300,000円）、そこから銀行に払う手数料（割引料）9,000円を差し引いた291,000円が実際に入金されます。割引料は「早く現金化するために払ったコスト」として手形売却損に計上します。'
  },
  // ===== 応用問題（各章2問ずつ・複数論点の複合） =====
  { id:706, level:3, cat:'商品', chap:'第1章：商品売買',
    q:'売上原価対立法を採用する当社の取引：①商品100個を＠1,000円で掛け仕入れした。②このうち70個を＠1,500円で掛け売りした。③決算日、帳簿上は30個残っているはずだが、実地棚卸の結果は27個であり、さらに実地分の正味売却価額が＠900円に下落していた。①〜③の仕訳を示しなさい（棚卸減耗損と商品評価損は独立の科目とする）。',
    en_q:'Under the perpetual (cost-of-sales) method: ①Purchased 100 units at ¥1,000 each on credit. ②Sold 70 of them at ¥1,500 each on credit. ③At year-end, the book quantity should be 30 units, but a physical count found only 27, and the net realizable value of those 27 units had fallen to ¥900. Record entries ①–③ (show the inventory shrinkage and write-down as separate accounts).',
    e:[{d:[['商品',100000]], c:[['買掛金',100000]]}, {d:[['売掛金',105000]], c:[['売上',105000]]}, {d:[['売上原価',70000]], c:[['商品',70000]]}, {d:[['棚卸減耗損',3000],['商品評価損',2700]], c:[['商品',5700]]}],
    exp:'売上原価対立法では、仕入時に「商品」を計上し、売上のたびに売れた分だけ「商品」から「売上原価」へ振り替えます（三分法の決算整理と違い、都度リアルタイムで売上原価が確定）。②の時点で商品の帳簿残高は100個－70個＝30個（30,000円）。③決算：帳簿30個に対し実地27個しかないので、棚卸減耗損＝3個×＠1,000＝3,000円。残る27個の原価＠1,000が正味売却価額＠900まで下落しているので、商品評価損＝27個×（1,000－900）＝2,700円。両方とも「商品」の減少として処理し、期末の商品帳簿価額は27個×＠900＝24,300円になります。'
  },
  { id:707, level:3, cat:'商品', chap:'第1章：商品売買',
    q:'売上原価対立法を採用する当社：①商品50個を＠2,000円で掛け仕入れした。②このうち40個を＠3,000円で掛け売りしたが、過去実績から５個の返品が見込まれる。返品見込み分は売上に計上せず「返金負債」、対応する原価は「返品資産」として処理する。①②の仕訳を示しなさい。',
    en_q:'Under the perpetual (cost-of-sales) method: ①Purchased 50 units at ¥2,000 each on credit. ②Sold 40 of them at ¥3,000 each on credit, but 5 units are expected to be returned based on historical experience. Defer the expected-return portion as "refund liability" (revenue) and "return asset" (cost), rather than recognizing them as sales/COGS. Record entries ①–②.',
    e:[{d:[['商品',100000]], c:[['買掛金',100000]]}, {d:[['売掛金',120000]], c:[['売上',105000],['返金負債',15000]]}, {d:[['売上原価',70000],['返品資産',10000]], c:[['商品',80000]]}],
    exp:'収益認識基準の「返品権付き販売」と売上原価対立法を組み合わせた問題です。売れた40個のうち、確実に実現する35個分（105,000円）だけを売上計上し、返品が見込まれる５個分（15,000円）は「返金負債」（負債）として売上から除きます。原価側も同様に、35個分（70,000円）を売上原価、５個分（10,000円）を「返品資産」（資産＝戻ってくる見込みの商品）として区別します。返品資産・返金負債はどちらも、実際に返品されるか確定するまでの「仮置き」の勘定です。'
  },
  { id:708, level:3, cat:'収益認識', chap:'収益認識・現金預金',
    q:'工事請負金額1,000,000円・工事原価総見積額800,000円の建設契約について、工事進行基準（原価比例法）で収益を認識する。X1年度の発生原価は200,000円（進捗率25％）、X2年度の発生原価は320,000円（累計520,000円・進捗率65％）であった。X1年度・X2年度それぞれの収益・原価の計上仕訳を示しなさい。',
    en_q:'A construction contract (contract price ¥1,000,000, total estimated cost ¥800,000) uses the percentage-of-completion method (cost-to-cost basis). Year 1 costs incurred: ¥200,000 (25% complete). Year 2 costs incurred: ¥320,000 (cumulative ¥520,000, 65% complete). Record the revenue and expense entries for both years.',
    e:[{d:[['工事未収金',250000]], c:[['完成工事高',250000]]}, {d:[['完成工事原価',200000]], c:[['工事原価',200000]]}, {d:[['工事未収金',400000]], c:[['完成工事高',400000]]}, {d:[['完成工事原価',320000]], c:[['工事原価',320000]]}],
    exp:'工事進行基準では、各年度の進捗率に応じて収益を認識します。X1年度：進捗率25％→収益1,000,000×25％＝250,000円、原価は当年度発生額200,000円をそのまま計上。X2年度：累計進捗率65％→累計収益1,000,000×65％＝650,000円のうち、すでにX1年度で計上した250,000円を差し引いた400,000円が当年度の収益。原価も当年度発生額320,000円をそのまま計上します。毎年「累計進捗ベースで再計算し、前年度計上分を差し引く」という考え方がポイントです。'
  },
  { id:709, level:3, cat:'収益認識', chap:'収益認識・現金預金',
    q:'商品300,000円を掛け販売した。契約上「10日以内の支払いなら２％を割り引く」という条件があり、この割引が高い確率で使われると見込まれるため、変動対価として売上から控除して計上する。①販売時の仕訳を示しなさい。②その後、10日以内に割引適用で294,000円が現金で入金された場合の仕訳を示しなさい。',
    en_q:'Sold goods for ¥300,000 on credit under terms offering a 2% discount if paid within 10 days; this discount is highly probable to be taken and is treated as variable consideration deducted from revenue. ①Record the sale. ②Record the subsequent cash collection of ¥294,000 within the discount period.',
    e:[{d:[['売掛金',300000]], c:[['売上',294000],['返金負債',6000]]}, {d:[['現金',294000],['返金負債',6000]], c:[['売掛金',300000]]}],
    exp:'収益認識基準では、売上割引のように「高い確率で発生する値引き」は変動対価として、販売時点であらかじめ売上から控除します。①売掛金は総額300,000円を計上しつつ、売上は割引後の294,000円のみを認識し、差額6,000円（300,000×2％）を「返金負債」（負債）として据え置きます。②実際に割引が適用され294,000円が入金されると、据え置いていた返金負債6,000円を取り崩して売掛金300,000円と相殺します。見積もり通りに確定したため、差額調整は生じません。'
  },
  { id:868, level:2, cat:'未着品売買', chap:'収益認識・現金預金',
    q:'Ｘ社は海外の仕入先から商品を輸入するにあたり、船荷証券（未着品を表す証券）を受け取り、代金500,000円は掛けとした。この時点では商品はまだ倉庫に到着していない。仕訳を示しなさい。',
    en_q:'Company X received a bill of lading (representing goods in transit) for imported goods, with payment of ¥500,000 on account. The goods have not yet arrived at the warehouse. Record the entry.',
    e:[{d:[['未着品',500000]], c:[['買掛金',500000]]}],
    exp:'船で輸送中の商品は、実際に手元に届く前に、貨物を代表する証券（船荷証券など）を受け取ることで、所有権が移転し仕入取引として記録します。まだ商品そのものは倉庫に届いていない段階なので、通常の「仕入」ではなく「未着品」という資産勘定で処理します。「証券を持っている＝その商品の持ち主である」という状態を表す勘定です。'
  },
  { id:869, level:3, cat:'未着品売買', chap:'収益認識・現金預金',
    q:'Ｘ社は上記の未着品（原価500,000円）を、実際に商品が到着する前に、船荷証券を裏書きすることでＹ社へ600,000円で転売した。代金は掛けとした。仕訳を示しなさい。',
    en_q:'Company X resold the goods-in-transit above (cost ¥500,000) for ¥600,000 on credit, before physical arrival, by endorsing the bill of lading to Company Y. Record the entry.',
    e:[{d:[['売掛金',600000]], c:[['未着品売上',600000]]}, {d:[['仕入',500000]], c:[['未着品',500000]]}],
    exp:'船が港に到着する前でも、船荷証券を「裏書譲渡」することで、未着品をそのまま転売できます。①転売により生じた債権は「売掛金」、収益は区別して「未着品売上」として計上します。②同時に、未着品（資産）を仕入原価相当額だけ減らし、「仕入」（売上原価の元になる勘定）に振り替えます。「実際に商品を見ていなくても、証券のやり取りだけで売買が成立する」のが未着品売買の特徴です。'
  },
  { id:870, level:2, cat:'未着品売買', chap:'収益認識・現金預金',
    q:'Ｘ社は保有する未着品（原価300,000円）について、商品が実際に倉庫へ到着したため、通常の「仕入」（商品）勘定へ振り替える仕訳を示しなさい。',
    en_q:'Company X\'s goods-in-transit (cost ¥300,000) physically arrived at the warehouse. Record the entry reclassifying it into the ordinary "purchases" account.',
    e:[{d:[['仕入',300000]], c:[['未着品',300000]]}],
    exp:'未着品として計上していた商品が実際に倉庫へ到着すると、もはや「未着」ではなくなるため、通常の商品と同じ「仕入」勘定に振り替えます。以後は、他の仕入商品と同様に通常の販売・在庫管理の対象になります。「証券で管理していた期間が終わり、実物管理に切り替わる」タイミングを表す仕訳です。'
  },
  { id:871, level:3, cat:'未着品売買', chap:'収益認識・現金預金',
    q:'Ｘ社が保有する未着品800,000円のうち、600,000円分は船荷証券のまま転売し（売価750,000円、掛け）、残り200,000円分は実際に商品が到着した。①転売による売上計上②未着品800,000円全額を仕入へ振り替える仕訳を示しなさい（転売分・到着分をまとめて仕入に振り替える）。',
    en_q:'Of Company X\'s ¥800,000 goods-in-transit, ¥600,000 was resold via bill-of-lading endorsement (sale price ¥750,000, on credit), and the remaining ¥200,000 physically arrived. Record ①the sale entry and ②the entry reclassifying the full ¥800,000 into purchases.',
    e:[{d:[['売掛金',750000]], c:[['未着品売上',750000]]}, {d:[['仕入',800000]], c:[['未着品',800000]]}],
    exp:'未着品の一部を転売し、残りは実際に到着した場合でも、どちらのケースも最終的には「未着品」から「仕入」への振り替えが必要になります（転売した分はその後の売上原価計算のため、到着した分は通常の商品管理のため）。①転売分の売上を計上：売掛金750,000円／未着品売上750,000円。②未着品全額800,000円を仕入に振り替え：転売した600,000円分は売上原価の元に、到着した200,000円分は通常の商品在庫の元になります。'
  },
  { id:872, level:2, cat:'未着品売買', chap:'収益認識・現金預金',
    q:'Ｘ社が保有する未着品400,000円のうち、輸送中の事故により100,000円分が滅失したことが判明した。保険をかけていなかった場合の仕訳を示しなさい。',
    en_q:"¥100,000 of Company X's ¥400,000 goods-in-transit was lost in a shipping accident. Record the entry, assuming no insurance was carried.",
    e:[{d:[['雑損失',100000]], c:[['未着品',100000]]}],
    exp:'輸送中に事故が発生し、未着品の一部が失われてしまった場合、その分だけ未着品（資産）を減額し、保険による補填がなければ「雑損失」（特別損失）として処理します。「まだ手元にない商品でも、資産として計上している以上、滅失すれば損失を認識する」という点がポイントです。'
  },
  { id:873, level:3, cat:'未着品売買', chap:'収益認識・現金預金',
    q:'Ｘ社が保有する未着品300,000円が輸送中の事故により全額滅失した。この未着品には海上保険が付されており、保険会社に対して保険金280,000円を請求できることが確定した。仕訳を示しなさい。',
    en_q:"Company X's entire ¥300,000 goods-in-transit was lost in a shipping accident. The goods were covered by marine insurance, and a ¥280,000 insurance claim was confirmed as recoverable. Record the entry.",
    e:[{d:[['未収入金',280000],['雑損失',20000]], c:[['未着品',300000]]}],
    exp:'保険をかけていた場合は、滅失した金額の全額が損失になるわけではありません。保険金として回収できる見込みの金額（280,000円）は「未収入金」（資産）として計上し、保険でカバーされない差額（20,000円）だけを「雑損失」として処理します。「保険でどこまでカバーされるか」によって、損失として認識する金額が変わる点を確認する問題です。'
  },
  { id:874, level:3, cat:'工事契約', chap:'収益認識・現金預金',
    q:'Ｘ社は工事契約（請負金額2,000,000円）について、工事の初期段階であり進捗度を合理的に見積ることができないため、原価回収基準を適用している。当期の工事原価発生額は300,000円であった。原価回収基準による当期の収益・原価の計上仕訳を示しなさい（発生原価と同額を限度として収益を認識する）。',
    en_q:"Company X applies the cost-recovery method to a construction contract (contract price ¥2,000,000) because, in its early stage, progress cannot yet be reliably estimated. This period's costs incurred were ¥300,000. Record the entry recognizing revenue and expense under the cost-recovery method (revenue limited to costs incurred).",
    e:[{d:[['完成工事原価',300000],['契約資産',300000]], c:[['現金',300000],['完成工事高',300000]]}],
    exp:'原価回収基準は、工事の進捗度を合理的に見積ることができない場合に適用する、工事進行基準の例外的な処理方法です。この方法では、発生した工事原価と同額を限度として収益を認識します（利益はまだ計上しません）。当期発生原価300,000円をそのまま「完成工事原価」として費用計上するとともに、同額を「完成工事高」として収益計上するため、この時点での利益はゼロになります。「進捗が分からないなら、せめて使った分だけ回収できたとみなそう」という考え方です。'
  },
  { id:875, level:3, cat:'工事契約', chap:'収益認識・現金預金',
    q:'上記のＸ社の工事契約について、翌期に進捗度を合理的に見積れるようになり、工事進行基準に切り替えることとなった。累計発生原価は900,000円（見積総原価1,800,000円、進捗率50％）であった。これまで原価回収基準により計上した収益の累計額は300,000円（前期発生原価分）である。工事進行基準による累計収益1,000,000円（請負金額2,000,000円×50％）との差額700,000円を、切替時に追加計上する仕訳を示しなさい。',
    en_q:"For Company X's contract above, progress became reliably estimable the next period, triggering a switch to the percentage-of-completion method. Cumulative costs incurred were ¥900,000 (total estimated cost ¥1,800,000, 50% complete). Cumulative revenue previously recognized under the cost-recovery method was ¥300,000. Record the entry recognizing the additional ¥700,000 needed to reach the ¥1,000,000 cumulative revenue required under the percentage-of-completion method (contract price ¥2,000,000 × 50%).",
    e:[{d:[['契約資産',700000]], c:[['完成工事高',700000]]}],
    exp:'原価回収基準は「進捗度が分かるようになるまでの暫定的な処理」なので、進捗度を合理的に見積れるようになった時点で、通常の工事進行基準に切り替えます。切替時には、これまで原価回収基準で計上していた収益累計額（300,000円）と、工事進行基準によれば本来計上されているべき累計収益（1,000,000円）との差額700,000円を、その期に追加で収益計上します。「暫定的に少なめに計上していた収益を、進捗が分かった時点で一気に追いつかせる」というイメージです。'
  },
  { id:876, level:2, cat:'工事契約', chap:'収益認識・現金預金',
    q:'Ｘ社は原価回収基準を適用している工事契約について、工事原価総額の見積りを見直した結果、総額で150,000円の損失が見込まれることが判明した。将来発生する損失に備えて工事損失引当金を計上する仕訳を示しなさい。',
    en_q:"For a construction contract under the cost-recovery method, Company X revised its total estimated cost and determined the contract will result in a total loss of ¥150,000. Record the entry recognizing a provision for the anticipated future loss.",
    e:[{d:[['工事損失引当金繰入',150000]], c:[['工事損失引当金',150000]]}],
    exp:'原価回収基準を適用している場合でも、将来的に工事全体で損失が見込まれることが判明したら、通常の工事契約と同様に、その損失を見積った時点で全額を「工事損失引当金」として計上しなければなりません（保守主義の原則）。「収益の認識は慎重に（原価回収基準）、損失の認識は早めに」という、会計の基本姿勢がここにも表れています。'
  },
  { id:877, level:3, cat:'工事契約', chap:'収益認識・現金預金',
    q:'Ｘ社の工事契約（請負金額2,000,000円、原価回収基準を経て、その後工事進行基準に切り替えた案件）が完成した。工事完成までの総原価は1,700,000円であった。工事完成時点までに計上済みの収益累計額は1,850,000円である場合、完成時に追加計上する収益150,000円の仕訳を示しなさい。',
    en_q:"Company X's construction contract (contract price ¥2,000,000, initially under the cost-recovery method, later switched to percentage-of-completion) was completed, with total costs of ¥1,700,000. Cumulative revenue recognized to date was ¥1,850,000. Record the entry recognizing the additional ¥150,000 of revenue at completion.",
    e:[{d:[['契約資産',150000]], c:[['完成工事高',150000]]}],
    exp:'工事が完成すると、それまでの累計収益（1,850,000円）と、実際の請負金額（2,000,000円）との差額150,000円を、最終的に完成時点で計上します。工事完成基準ではなく工事進行基準・原価回収基準を採用していても、最終的には工事全体の収益合計が請負金額と一致するように調整される、という点を確認する問題です。'
  },
  { id:710, level:3, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'保有する約束手形（額面80,000円）をＢ社への買掛金支払いのため裏書譲渡した。その後、この手形が不渡りとなったため、当座預金から支払い、手形を買い戻した。さらにその後、振出人に求償し、延滞利息2,000円を含めた82,000円を現金で回収した。一連の仕訳を示しなさい。',
    en_q:'Endorsed a held promissory note (face ¥80,000) to Company B to settle accounts payable. The note was later dishonored, so we paid from our bank account to buy it back. We then sought reimbursement from the original issuer and collected ¥82,000 in cash, including ¥2,000 of overdue interest. Record the sequence of entries.',
    e:[{d:[['買掛金',80000]], c:[['受取手形',80000]]}, {d:[['不渡手形',80000]], c:[['当座預金',80000]]}, {d:[['現金',82000]], c:[['不渡手形',80000],['受取利息',2000]]}],
    exp:'手形の一生を追う複合問題です。①裏書譲渡：保有していた「受取手形」を、買掛金の支払いに充てて減少させます。②不渡り・買戻し：裏書譲渡した手形が不渡りになると、譲渡先への償還義務が生じるため、当座預金で支払い「不渡手形」（資産）として処理します。③求償・回収：本来の振出人に対して請求し、延滞利息とあわせて回収すると、「不渡手形」を取り崩し延滞利息分は「受取利息」（収益）で処理します。'
  },
  { id:711, level:3, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'売掛金300,000円について、電子記録債権の発生記録を行った。その後、資金繰りのため、このうち200,000円分を割り引き、割引料3,000円が差し引かれた197,000円が当座預金に入金された。残りの100,000円は期日に満期を迎え、当座預金に入金された。一連の仕訳を示しなさい。',
    en_q:'Filed an origination record converting ¥300,000 of accounts receivable into electronically recorded receivables. Later, ¥200,000 of it was discounted for cash flow purposes, with a ¥3,000 fee deducted, netting ¥197,000 deposited. The remaining ¥100,000 matured and was collected into the bank account. Record the sequence of entries.',
    e:[{d:[['電子記録債権',300000]], c:[['売掛金',300000]]}, {d:[['当座預金',197000],['電子記録債権売却損',3000]], c:[['電子記録債権',200000]]}, {d:[['当座預金',100000]], c:[['電子記録債権',100000]]}],
    exp:'電子記録債権のライフサイクルを一気通貫で扱う問題です。①発生記録：既存の売掛金を電子記録債権に切り替えます（金額は不変）。②一部割引：200,000円分を銀行で早期資金化し、割引料3,000円を「電子記録債権売却損」（費用）として処理します。③満期回収：残り100,000円は通常どおり期日に入金され、電子記録債権を全額取り崩します。同じ資産を「一部は早期換金・一部は満期保有」と分けて処理する点がポイントです。'
  },
  { id:712, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'Ａ社株式を１株4,000円で10株購入（手数料2,000円、現金払い）し、その後１株4,500円で10株追加購入（手数料2,000円、現金払い）した。保有株式のうち12株を１株4,600円で売却し、現金を受け取った（売却原価は平均原価法）。さらに期末に残り8株の時価は4,300円であった。①購入②売却③期末評価の仕訳を示しなさい。',
    en_q:'Purchased 10 shares of Company A at ¥4,000 each (¥2,000 fee, cash) and later another 10 shares at ¥4,500 each (¥2,000 fee, cash). Sold 12 of the shares held at ¥4,600 each for cash (average cost method). At year-end, the remaining 8 shares have a market value of ¥4,300. Record ①the purchases, ②the sale, and ③the year-end remeasurement.',
    e:[{d:[['売買目的有価証券',42000]], c:[['現金',42000]]}, {d:[['売買目的有価証券',47000]], c:[['現金',47000]]}, {d:[['現金',55200]], c:[['売買目的有価証券',53400],['有価証券売却益',1800]]}, {d:[['有価証券評価損',1200]], c:[['売買目的有価証券',1200]]}],
    exp:'取得・売却・決算評価をひと続きで扱う総合問題です。取得原価：①10株×4,000＋2,000＝42,000円、②10株×4,500＋2,000＝47,000円。平均単価＝(42,000＋47,000)÷20株＝＠4,450円。売却：12株×4,600＝55,200円（売却額）－12株×4,450＝53,400円（売却原価）＝有価証券売却益1,800円。期末：残り8株の帳簿価額8×4,450＝35,600円に対し、時価8×4,300＝34,400円→評価損1,200円。取得のたびに平均単価が変わっていく点に注意してください。'
  },
  { id:713, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'満期保有目的で社債（額面500,000円）を、１口100円につき＠95円で取得した（残存５年、定額法による償却原価法を適用）。２年経過後、保有目的をやめてこの社債を１口100円につき＠98円で売却した。①取得時②１年目・２年目の決算整理（償却）③売却時の仕訳を示しなさい。',
    en_q:'Acquired held-to-maturity bonds (face ¥500,000) at ¥95 per ¥100 face (5 years remaining, straight-line amortized cost method). After 2 years, sold the bonds at ¥98 per ¥100 face. Record ①the acquisition, ②both years\' amortization entries, and ③the sale.',
    e:[{d:[['満期保有目的債券',475000]], c:[['現金',475000]]}, {d:[['満期保有目的債券',5000]], c:[['有価証券利息',5000]]}, {d:[['満期保有目的債券',5000]], c:[['有価証券利息',5000]]}, {d:[['現金',490000]], c:[['満期保有目的債券',485000],['有価証券売却益',5000]]}],
    exp:'満期保有目的債券の償却→途中売却という一連の流れです。取得原価：500,000×95％＝475,000円。償却額／年：(額面500,000－取得原価475,000)÷5年＝5,000円。２年分の償却を経た帳簿価額：475,000＋5,000×2＝485,000円。売却額：500,000×98％＝490,000円。売却益：490,000－485,000＝5,000円。満期保有目的で取得した債券でも、途中で売却すれば「満期保有」の前提が崩れるため、その時点の帳簿価額と売却額の差額を売却損益として処理します。'
  },
  { id:714, level:3, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'国庫補助金600,000円を現金で受け取り、機械装置2,000,000円を現金で取得し、直接減額方式で圧縮記帳を行った（耐用年数５年・定額法・残存価額ゼロ）。２年後、この機械を1,000,000円で売却し現金を受け取った。①補助金受取②機械取得＋圧縮記帳③２年分の減価償却④売却時の仕訳を示しなさい。',
    en_q:'Received a government subsidy of ¥600,000 in cash and acquired machinery for ¥2,000,000 cash, applying direct-reduction compression accounting (5-year life, straight-line, zero residual). After 2 years, sold the machine for ¥1,000,000 cash. Record ①the subsidy receipt, ②the acquisition and compression entry, ③two years of depreciation, and ④the sale.',
    e:[{d:[['現金',600000]], c:[['国庫補助金受贈益',600000]]}, {d:[['機械装置',2000000]], c:[['現金',2000000]]}, {d:[['固定資産圧縮損',600000]], c:[['機械装置',600000]]}, {d:[['減価償却費',560000]], c:[['減価償却累計額',560000]]}, {d:[['現金',1000000],['減価償却累計額',560000]], c:[['機械装置',1400000],['固定資産売却益',160000]]}],
    exp:'圧縮記帳した資産をその後売却するところまで一気通貫で扱う応用問題です。圧縮後帳簿価額：2,000,000－600,000＝1,400,000円。年間減価償却費：1,400,000÷5年＝280,000円→２年分は560,000円。売却時点の帳簿価額：1,400,000－560,000＝840,000円。固定資産売却益：売却額1,000,000－帳簿価額840,000＝160,000円。圧縮記帳によって将来の減価償却費が小さくなる分、売却時の帳簿価額も低くなり、売却益が生じやすくなる（＝将来にわたって課税を繰り延べる効果）という一連のつながりを確認する問題です。'
  },
  { id:715, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'本社ビル建設のため、建設仮勘定で合計900,000円を現金で支払った。完成引渡し時、追加で付随費用100,000円を現金で支払った。引渡し後、既存の別の建物について改良工事500,000円（資本的支出）と、現状維持の修繕200,000円（収益的支出）を現金で行った。一連の仕訳を示しなさい。',
    en_q:'Paid a total of ¥900,000 in cash toward construction of a head office building, recorded in a construction-in-progress account. Upon completion and handover, paid an additional ¥100,000 cash in incidental costs. Afterward, performed ¥500,000 of capital improvements (capitalizable) and ¥200,000 of ordinary repairs (expensed) in cash on a separate existing building. Record the sequence of entries.',
    e:[{d:[['建設仮勘定',900000]], c:[['現金',900000]]}, {d:[['建物',1000000]], c:[['建設仮勘定',900000],['現金',100000]]}, {d:[['建物',500000],['修繕費',200000]], c:[['現金',700000]]}],
    exp:'新築（建設仮勘定）と既存建物の支出区分（資本的支出・収益的支出）を組み合わせた問題です。①②建設仮勘定900,000円と付随費用100,000円を合わせた1,000,000円が新しい「建物」の取得原価になります。③別の既存建物に対する支出は、価値・耐用年数を高める改良工事（資本的支出）500,000円は「建物」（資産）に追加計上し、現状維持のための修繕（収益的支出）200,000円は「修繕費」（費用）として処理します。「新築時の会計処理」と「既存資産への追加支出の区分」という異なる論点を１問で確認できます。'
  },
  { id:716, level:3, cat:'無形固定資産', chap:'無形資産・リース・引当金',
    q:'前期に吸収合併により計上したのれん600,000円（償却期間20年、経過2年）を保有する事業について、収益性の低下により減損の兆候が見られ、回収可能価額が380,000円と算定された。①２年分ののれん償却②減損損失の仕訳を示しなさい。',
    en_q:'Goodwill of ¥600,000 was recorded 2 years ago upon a merger (20-year amortization period). Due to declining profitability, impairment indicators are present, and the recoverable amount is assessed at ¥380,000. Record ①two years of goodwill amortization and ②the impairment loss.',
    e:[{d:[['のれん償却',60000]], c:[['のれん',60000]]}, {d:[['減損損失',160000]], c:[['のれん',160000]]}],
    exp:'のれんの償却と減損を組み合わせた問題です。①のれん償却：600,000÷20年＝30,000円／年×２年分＝60,000円。②２年分償却後の帳簿価額：600,000－60,000＝540,000円。回収可能価額380,000円が帳簿価額を下回っているため、減損損失：540,000－380,000＝160,000円を計上します。のれんは通常の償却（毎期規則的に価値を減らす）と、収益性悪化時の減損（一時に大きく評価減する）の両方の対象になる点を押さえましょう。'
  },
  { id:717, level:3, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'ファイナンス・リース取引（利子抜き法、見積現金購入価額500,000円、リース期間５年）を開始した。２年経過後、リース資産の収益性が低下し減損の兆候が見られたため、回収可能価額250,000円まで減損損失を計上する。①リース開始時②２年分の減価償却（定額法・直接法）③減損損失の仕訳を示しなさい。',
    en_q:'Started a finance lease (net method, estimated cash purchase price ¥500,000, 5-year term). After 2 years, the leased asset shows impairment indicators due to declining profitability; recognize an impairment loss down to a recoverable amount of ¥250,000. Record ①the lease inception, ②two years of straight-line depreciation (direct method), and ③the impairment loss.',
    e:[{d:[['リース資産',500000]], c:[['リース債務',500000]]}, {d:[['減価償却費',200000]], c:[['リース資産',200000]]}, {d:[['減損損失',50000]], c:[['リース資産',50000]]}],
    exp:'リース資産にも固定資産と同様に減損会計が適用されることを確認する問題です。①利子抜き法なので、リース資産・債務は見積現金購入価額500,000円で計上。②年間減価償却費：500,000÷5年＝100,000円（直接法なのでリース資産を直接減額）×２年分＝200,000円。２年後の帳簿価額：500,000－200,000＝300,000円。③回収可能価額250,000円を下回る分、減損損失：300,000－250,000＝50,000円を計上します。'
  },
  { id:718, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'発行していた新株予約権300,000円のうち、60％分の権利が行使され、権利行使価格400,000円が現金で払い込まれた（資本金計上額は会社法規定の最低額とする）。残り40％分は権利行使期限までに行使されず失効した。①権利行使時②失効時の仕訳を示しなさい。',
    en_q:'Of ¥300,000 in outstanding stock acquisition rights, 60% were exercised with a ¥400,000 cash exercise price paid in (capital is recorded at the statutory minimum). The remaining 40% expired unexercised. Record ①the exercise and ②the expiration.',
    e:[{d:[['現金',400000],['新株予約権',180000]], c:[['資本金',290000],['資本準備金',290000]]}, {d:[['新株予約権',120000]], c:[['新株予約権戻入益',120000]]}],
    exp:'新株予約権の「行使」と「失効」という対照的な結末を扱う問題です。①権利行使分の新株予約権：300,000×60％＝180,000円。払込金額400,000円と合わせた580,000円（400,000＋180,000）が株式発行の対価となり、会社法規定の最低額なので1/2ずつ資本金290,000円・資本準備金290,000円に計上します。②失効分の新株予約権：300,000×40％＝120,000円は、権利行使されずに消滅したため「新株予約権戻入益」（収益）に振り替えます。同じ新株予約権でも、行使されれば純資産の元手に、失効すれば利益になるという違いがポイントです。'
  },
  { id:719, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'自己株式500,000円（帳簿価額）を現金で取得した。その後、このうち300,000円分（帳簿価額）を350,000円で処分し現金を受け取った。残り200,000円分は消却した。①取得時②処分時③消却時の仕訳を示しなさい。',
    en_q:'Acquired treasury stock for ¥500,000 cash (book value). Later, disposed of ¥300,000 (book value) of it for ¥350,000 cash. The remaining ¥200,000 was retired (cancelled). Record ①the acquisition, ②the disposal, and ③the retirement.',
    e:[{d:[['自己株式',500000]], c:[['現金',500000]]}, {d:[['現金',350000]], c:[['自己株式',300000],['その他資本剰余金',50000]]}, {d:[['その他資本剰余金',200000]], c:[['自己株式',200000]]}],
    exp:'自己株式の取得・処分・消却という一連の流れをたどる問題です。①取得：自己株式（純資産のマイナス）として計上。②処分：帳簿価額300,000円を350,000円で処分できたので、差額50,000円（自己株式処分差益）は「その他資本剰余金」に計上します。③消却：残り200,000円は市場に戻さず消滅させるため、「その他資本剰余金」を減額して処理します（消却時に損益は生じません）。自己株式の売買差額はP/Lの損益ではなく、常に純資産（その他資本剰余金）で調整される点が重要です。'
  },
  { id:720, level:3, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'外貨建てのその他有価証券（Ｕ社株式、1,000ドル、取得時レート＠130円）を現金で取得した。決算時、時価は1,100ドル・決算時レート＠135円であった。実効税率30％として、税効果を考慮した評価差額の仕訳を示しなさい。',
    en_q:'Acquired foreign-currency-denominated available-for-sale securities (Company U stock, $1,000, at ¥130/USD) in cash. At year-end, fair value is $1,100 and the closing rate is ¥135/USD. Using a 30% effective tax rate, record the tax-effected remeasurement entry.',
    e:[{d:[['その他有価証券',130000]], c:[['現金',130000]]}, {d:[['その他有価証券',18500]], c:[['繰延税金負債',5550],['その他有価証券評価差額金',12950]]}],
    exp:'外貨建有価証券は「外貨のまま時価評価してから、決算時レートで円換算する」のが原則です。取得原価：1,000ドル×130円＝130,000円。決算時評価額：1,100ドル×135円＝148,500円。評価差額：148,500－130,000＝18,500円（円高・円安の影響と時価上昇の影響がまとめて反映されます）。税効果：18,500×30％＝5,550円を繰延税金負債に、残り12,950円を純資産（その他有価証券評価差額金）に計上します。外貨換算と税効果会計を同時に扱う、２級の中でも複合度の高い論点です。'
  },
  { id:721, level:3, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'外国企業に商品2,000ドルを掛けで販売した（取引時レート＠140円）。その後、この売掛金全額について１ドル＝138円で為替予約を行った（振当処理）。さらにその後、決済され現金を受け取った。①販売時②為替予約時③決済時の仕訳を示しなさい。',
    en_q:'Sold goods for $2,000 on credit to a foreign company (transaction rate ¥140/USD). Later, entered a forward contract locking in ¥138/USD for the entire receivable. The receivable was then settled in cash. Record ①the sale, ②the forward contract designation, and ③the settlement.',
    e:[{d:[['売掛金',280000]], c:[['売上',280000]]}, {d:[['為替差損益',4000]], c:[['売掛金',4000]]}, {d:[['現金',276000]], c:[['売掛金',276000]]}],
    exp:'取引発生「後」に為替予約を行うケースです（発生前の予約とは処理が異なる点に注意）。①販売時は直物レートで換算：2,000ドル×140円＝280,000円。②為替予約時：売掛金を予約レート（先物相場）に換算替えします。2,000ドル×(140－138)＝4,000円分、売掛金が減少するため「為替差損益」（費用側）を計上。③決済時：予約レートで確定した238,000...ではなく276,000円（2,000×138）がそのまま入金され、為替差損益は生じません（予約時にすでに確定済みのため）。「取引発生前の予約」は換算替えなし・差損益なし、「取引発生後の予約」は予約時に換算替えして差損益が生じる、という違いを対比して理解しましょう。'
  },
  { id:722, level:3, cat:'税効果', chap:'税効果',
    q:'決算にあたり、次の３つの一時差異について税効果会計を適用する（実効税率30％）。①貸倒引当金の損金算入限度超過額30,000円②固定資産の会計上・税務上の減価償却費の差額20,000円（会計の方が税務より大きい）③その他有価証券の評価益50,000円。それぞれの繰延税金資産・負債の仕訳を示しなさい。',
    en_q:'At year-end, apply tax-effect accounting to three temporary differences (30% effective rate): ①excess allowance for doubtful accounts ¥30,000 over the tax limit ②a ¥20,000 difference where accounting depreciation exceeds tax depreciation ③a ¥50,000 unrealized gain on other securities. Record the deferred tax entries for each.',
    e:[{d:[['繰延税金資産',9000]], c:[['法人税等調整額',9000]]}, {d:[['繰延税金資産',6000]], c:[['法人税等調整額',6000]]}, {d:[['その他有価証券',50000]], c:[['繰延税金負債',15000],['その他有価証券評価差額金',35000]]}],
    exp:'３種類の一時差異を１問でまとめて処理する、税効果会計の総まとめ問題です。①貸倒引当金の超過額（将来減算一時差異）：30,000×30％＝9,000円の繰延税金資産。②減価償却の差異（会計＞税務なので、将来その分だけ税務上損金にできる＝将来減算一時差異）：20,000×30％＝6,000円の繰延税金資産。③その他有価証券の評価益（将来売却時に課税される＝将来加算一時差異）：50,000×30％＝15,000円を繰延税金負債に、残り35,000円を純資産（その他有価証券評価差額金）に計上。①②は損益項目（法人税等調整額）として、③は純資産に直入される点の違いに注意してください。'
  },
  { id:723, level:3, cat:'税効果', chap:'税効果',
    q:'積立金方式による圧縮記帳（国庫補助金受贈益500,000円はすでに計上済み、実効税率30％）を行う場合、税効果を考慮すると圧縮積立金の設定額はどうなるか。①税効果を考慮した圧縮積立金の設定仕訳②対応する繰延税金負債の仕訳を示しなさい。',
    en_q:'Under reserve-method compression accounting (a ¥500,000 subsidy gain already recorded, 30% effective tax rate), how does considering the tax effect change the amount set aside as a compression reserve? Record ①the tax-effected compression reserve entry and ②the corresponding deferred tax liability entry.',
    e:[{d:[['繰越利益剰余金',350000]], c:[['圧縮積立金',350000]]}, {d:[['法人税等調整額',150000]], c:[['繰延税金負債',150000]]}],
    exp:'圧縮記帳と税効果会計を組み合わせた、２級でも特に応用度の高い論点です。税効果を考慮しない場合、圧縮積立金は補助金受贈益と同額（500,000円）を積み立てますが、税効果を考慮する場合は、将来支払う税金相当額（繰延税金負債）を差し引いた税引後の金額だけを積み立てます。繰延税金負債：500,000×30％＝150,000円。圧縮積立金：500,000×(1－30％)＝350,000円。「補助金の益金算入によって将来増える税金」をあらかじめ負債として認識し、その分だけ積立額を圧縮する、という考え方です。'
  },
  { id:724, level:3, cat:'標準原価計算', chap:'工業簿記',
    q:'標準原価計算を採用する当社。標準：直接材料費＠500円×２kg＝1,000円/個。当月完成品400個。実際：実際単価＠520円×実際消費量820kg。①標準消費量②価格差異③数量差異の仕訳を示しなさい（不利差異は仕掛品から差異勘定へ振り替える）。',
    en_q:'A company uses standard costing. Standard: direct material @¥500 × 2kg = ¥1,000/unit. Completed 400 units this month. Actual: @¥520 × 820kg actually consumed. Find ①the standard quantity allowed and record ②the price variance and ③the quantity variance (unfavorable variances are transferred out of WIP to variance accounts).',
    e:[{d:[['価格差異',16400]], c:[['仕掛品',16400]]}, {d:[['数量差異',10000]], c:[['仕掛品',10000]]}],
    exp:'直接材料費差異を「価格差異」と「数量差異」に分解する応用問題です。①標準消費量：２kg×400個＝800kg。②価格差異：(標準単価500－実際単価520)×実際消費量820＝△16,400円（不利差異、実際の方が高かった）。③数量差異：標準単価500×(標準消費量800－実際消費量820)＝△10,000円（不利差異、実際の方が多く使った）。合計の直接材料費差異26,400円（＝16,400＋10,000）を、原因別に分解して管理に役立てるのが標準原価計算の目的です。'
  },
  { id:725, level:3, cat:'部門別原価計算', chap:'工業簿記',
    q:'補助部門費（動力部門80,000円、修繕部門50,000円）を直接配賦法で製造部門（切削部門・組立部門）に配賦する。配賦基準：動力部門は運転時間割合（切削60％・組立40％）、修繕部門は修繕回数割合（切削50％・組立50％）。①配賦の仕訳を示しなさい。②切削部門の予定配賦額は180,000円、切削部門の実際発生額（個別費62,000円＋上記で配賦を受けた額）を求め、原価差異の仕訳を示しなさい。',
    en_q:'Allocate support department costs (Power Dept ¥80,000, Repair Dept ¥50,000) to production departments (Cutting, Assembly) using the direct method. Allocation bases: Power by machine-hours (Cutting 60%, Assembly 40%); Repair by repair count (Cutting 50%, Assembly 50%). ①Record the allocation entry. ②The Cutting department\'s predetermined applied overhead is ¥180,000; find its actual cost (¥62,000 departmental cost + the amount allocated above) and record the variance entry.',
    e:[{d:[['切削部門費',73000],['組立部門費',57000]], c:[['動力部門費',80000],['修繕部門費',50000]]}, {d:[['切削部門費',45000]], c:[['製造間接費配賦差異',45000]]}],
    exp:'部門別配賦（直接配賦法）と原価差異分析を組み合わせた問題です。①直接配賦法は補助部門間のサービスのやり取りを無視し、製造部門へだけ配賦します。切削部門の受入額：動力80,000×60％＝48,000円＋修繕50,000×50％＝25,000円＝73,000円。組立部門の受入額：動力80,000×40％＝32,000円＋修繕50,000×50％＝25,000円＝57,000円。②切削部門の実際発生額：個別費62,000円＋配賦を受けた73,000円＝135,000円。予定配賦額180,000円との差額45,000円は、実際の方が少なかった「有利差異」として製造間接費配賦差異（貸方）に振り替えます。'
  },
  // ===== 総合問題（精算表・財務諸表 追加バリエーション） =====
  { id:704, level:3, cat:'帳簿・精算表', chap:'決算整理',
    q:'雑貨店（A社）の決算整理事項：①期首商品50,000円を仕入へ振り替え、期末商品60,000円を繰越商品へ計上する（売上原価の算定）②売掛金残高200,000円の2％を貸倒引当金として設定する（期首引当金1,000円、差額補充法）③備品400,000円について定額法（耐用年数8年・残存価額ゼロ）で減価償却する④保険料24,000円のうち8,000円を前払費用として繰延べる。それぞれの決算整理仕訳を示しなさい。',
    en_q:'Year-end adjustments for a retail shop: ①transfer opening inventory ¥50,000 to Purchases and record closing inventory of ¥60,000 as Inventory (determining COGS) ②set a 2% allowance for doubtful accounts on ¥200,000 receivables (opening allowance ¥1,000, incremental method) ③depreciate equipment of ¥400,000 (straight-line, 8-year life, zero residual) ④defer ¥8,000 of the ¥24,000 insurance premium as a prepayment. Record each adjusting entry.',
    e:[{d:[['仕入',50000]], c:[['繰越商品',50000]]}, {d:[['繰越商品',60000]], c:[['仕入',60000]]}, {d:[['貸倒引当金繰入',3000]], c:[['貸倒引当金',3000]]}, {d:[['減価償却費',50000]], c:[['減価償却累計額',50000]]}, {d:[['前払費用',8000]], c:[['保険料',8000]]}],
    exp:'複数の決算整理事項をまとめて処理する総合問題です。①売上原価の算定（期首商品を仕入に加算、期末商品を仕入から控除）②貸倒引当金の差額補充：200,000×2％－1,000＝3,000円繰入③減価償却：400,000÷8年＝50,000円④保険料の前払い：8,000円分を費用から資産へ振り替え。この4つの整理事項が連動して、最終的な当期純利益・資産合計に影響します。'
  },
  { id:705, level:3, cat:'帳簿・精算表', chap:'決算整理',
    q:'雑貨店（A社）の決算整理事項：①期首商品40,000円を仕入へ振り替え、期末商品45,000円を繰越商品へ計上する（売上原価の算定）②売掛金残高150,000円の2％を貸倒引当金として設定する（期首引当金500円、差額補充法）③備品300,000円について定額法（耐用年数10年・残存価額ゼロ）で減価償却する④支払家賃96,000円のうち16,000円を前払費用として繰延べる⑤給料の未払い8,000円を見越し計上する。それぞれの決算整理仕訳を示しなさい。',
    en_q:'Year-end adjustments: ①transfer opening inventory ¥40,000 to Purchases and record closing inventory of ¥45,000 as Inventory (determining COGS) ②set a 2% allowance for doubtful accounts on ¥150,000 receivables (opening allowance ¥500, incremental method) ③depreciate equipment of ¥300,000 (straight-line, 10-year life, zero residual) ④defer ¥16,000 of the ¥96,000 rent as a prepayment ⑤accrue ¥8,000 of unpaid salaries. Record each adjusting entry.',
    e:[{d:[['仕入',40000]], c:[['繰越商品',40000]]}, {d:[['繰越商品',45000]], c:[['仕入',45000]]}, {d:[['貸倒引当金繰入',2500]], c:[['貸倒引当金',2500]]}, {d:[['減価償却費',30000]], c:[['減価償却累計額',30000]]}, {d:[['前払費用',16000]], c:[['支払家賃',16000]]}, {d:[['給料',8000]], c:[['未払費用',8000]]}],
    exp:'この問題は「見越し」（未払費用）と「繰延べ」（前払費用）を同時に扱う総合問題です。支払家賃は「まだ来ていない次期分」を前払費用として資産に振り替え（繰延べ）、給料は「まだ払っていない当期分」を未払費用として負債に計上（見越し）します。見越し・繰延べどちらも「当期の費用を正しい金額にする」ための調整である点は共通ですが、資産に計上するか負債に計上するかが逆になります。'
  },
  { id:620, level:2, cat:'有価証券', chap:'第5章：有価証券',
    q:'その他有価証券（株式）：取得原価500,000円、決算時時価550,000円（税率30%）。洗替法で評価替えの仕訳をしなさい。',
    e:[{d:[['投資有価証券',50000]], c:[['繰延税金負債',15000],['その他有価証券評価差額金',35000]]}],
    exp:'その他有価証券の評価差額にも税効果会計を適用します。評価増50,000円のうち、将来その分に課税されることを見越した税金相当額（50,000×30％＝15,000円）を繰延税金負債として計上し、税引後の残り35,000円だけを純資産（その他有価証券評価差額金）に計上します。洗替法なので、翌期首にはこの評価仕訳を逆向きに戻し、いったん取得原価に戻してから、また新しい時価で評価し直します。'
  },
  { id:621, level:2, cat:'有価証券', chap:'第5章：有価証券',
    q:'その他有価証券（株式）：取得原価500,000円、決算時時価460,000円（税率30%）。評価損の仕訳をしなさい。',
    e:[{d:[['繰延税金資産',12000],['その他有価証券評価差額金',28000]], c:[['投資有価証券',40000]]}],
    exp:'評価損が出た場合も税効果を考慮します。評価損40,000円は将来の税負担を軽減する効果があるとみなし、その税金相当額（40,000×30％＝12,000円）を繰延税金資産として計上し、税引後の残り28,000円を純資産（その他有価証券評価差額金）から差し引きます。評価益・評価損のどちらでも、その他有価証券評価差額金を通じて純資産に反映させる点は共通です。'
  },
  { id:622, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'満期保有目的債券：額面1,000,000円・取得原価960,000円・残存期間4年。償却原価法（定額法）。当期の利息受取と償却の仕訳をしなさい。',
    e:[{d:[['投資有価証券',10000]], c:[['有価証券利息',10000]]}],
    exp:'取得原価（960,000円）が額面（1,000,000円）より低い場合、その差額は実質的な利息とみなされ、満期までの期間（4年）にわたって均等に「有価証券利息」として計上していきます。(1,000,000－960,000)÷4年＝10,000円が1年分の償却額で、同時に投資有価証券という資産の帳簿価額もその分増えていきます。'
  },
  { id:623, level:2, cat:'有価証券', chap:'第5章：有価証券',
    q:'売買目的有価証券の売却：帳簿価額300,000円を350,000円で売却（現金）。仕訳をしなさい。',
    e:[{d:[['現金',350000]], c:[['売買目的有価証券',300000],['有価証券売却益',50000]]}],
    exp:'有価証券を帳簿価額より高く売却できると、その差額が「有価証券売却益」という収益になります。350,000円－300,000円＝50,000円が、この売買で実際に得られた利益です。売買目的有価証券は、期末の時価評価とは別に、実際に売却したタイミングでも改めて損益を計算します。'
  },
  { id:624, level:2, cat:'有価証券', chap:'第5章：有価証券',
    q:'売買目的有価証券：帳簿価額300,000円・期末時価280,000円。評価替えの仕訳をしなさい。',
    e:[{d:[['有価証券評価損',20000]], c:[['売買目的有価証券',20000]]}],
    exp:'売買目的有価証券は決算のたびに時価評価する必要があります。時価（280,000円）が帳簿価額（300,000円）を下回ったので、その差額20,000円を「有価証券評価損」として損益計算書に計上します。その他有価証券のように純資産に直接計上するのではなく、損益計算書を通す点が売買目的有価証券の特徴です。'
  },
  { id:625, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'子会社株式1,000,000円が著しく下落（時価400,000円）、回復可能性なし。強制評価減の仕訳をしなさい。',
    e:[{d:[['投資有価証券評価損',600000]], c:[['子会社株式',600000]]}],
    exp:'通常、子会社株式は時価が変動しても評価替えをしませんが、時価が取得原価の半分以下にまで著しく下落し、かつ回復の見込みがない場合は例外的に評価減が強制されます。1,000,000円－400,000円＝600,000円を「投資有価証券評価損」として特別損失に計上し、帳簿価額を実態に合わせて大きく引き下げます。'
  },
  // ===== 株式会社会計の補充 =====
  { id:626, level:2, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'株式1,000株を@600円で発行（払込金全額普通預金）。資本金@500円、超過額は資本準備金。仕訳をしなさい。',
    e:[{d:[['普通預金',600000]], c:[['資本金',500000],['資本準備金',100000]]}],
    exp:'株式を発行するとき、会社法上は払込金額の全額を資本金にするのが原則ですが、一定の範囲内であれば一部を「資本準備金」として計上することも認められています。今回は1株あたり600円の払込みのうち500円を資本金、残りの100円を資本準備金とする指示にしたがって、それぞれ振り分けます。'
  },
  { id:627, level:2, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'剰余金の配当：繰越利益剰余金から配当300,000円・利益準備金30,000円（配当の1/10）を計上。仕訳をしなさい。',
    e:[{d:[['繰越利益剰余金',330000]], c:[['未払配当金',300000],['利益準備金',30000]]}],
    exp:'会社法では、配当をするたびに、配当額の10分の1を「利益準備金」として積み立てることが義務づけられています（会社の財産が配当によって過度に流出するのを防ぐためのルールです）。300,000円の配当に対して、その10分の1にあたる30,000円を利益準備金として積み立て、残りを株主への支払義務（未払配当金）として計上します。'
  },
  { id:628, level:2, cat:'株式会社', chap:'第10章：株式会社会計',
