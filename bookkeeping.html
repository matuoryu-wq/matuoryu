<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記 仕訳練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      touch-action: manipulation;
    }

    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.liability { background: #C2185B; }
    .dot.expense   { background: #388E3C; }
    .dot.revenue   { background: #0288D1; }
    .dot.equity    { background: #FB8C00; }
    .dot.other     { background: #fff; border: 1.5px solid #9E9E9E; }

    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }

    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #00838F; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }

    .card-body { padding: 20px 18px; }

    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }

    .answer-area { display: none; }
    .answer-area.show { display: block; }

    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tag-amt { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }
    /* 資産：黄色 */
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    /* 負債：ピンク/紫 */
    .tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    /* 費用：緑 */
    .tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    /* 収益：水色 */
    .tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    /* 純資産：オレンジ */
    .tag.equity    { background: #FFF3E0; color: #E65100; border: 1.5px solid #FB8C00; }
    /* その他（評価勘定・損益等）：白 */
    .tag.other     { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    /* 資産のマイナス（減価償却累計額・貸倒引当金等）：白地に資産の黄枠 */
    .tag.other.contra-asset { border: 1.5px solid #F9C400; }
    /* 勘定科目名の色分けタグ（表示区分クイズ等、"解答を隠す"の対象にしないため.tagとは別クラス） */
    .acct-tag { padding: 4px 11px; border-radius: 12px; font-size: 13px; font-weight: 700; text-align: center; display:inline-block; }
    .acct-tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    .acct-tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    .acct-tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    .acct-tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    .acct-tag.equity    { background: #FFF3E0; color: #E65100; border: 1.5px solid #FB8C00; }
    .acct-tag.other     { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    .acct-tag.other.contra-asset { border: 1.5px solid #F9C400; }
    .acct-tag.acct-tag-lg { font-size:16px; padding:7px 18px; border-radius:14px; }

    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }

    .exp-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #F0F7FF;
      border-left: 3px solid #42A5F5;
      border-radius: 4px;
      font-size: 13px;
      color: #1A2B3C;
      line-height: 1.7;
    }
    .exp-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* 表形式の解答 */
    .ans-table-wrap {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .ans-table-wrap table,
    .exp-readonly-ans table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      min-width: 260px;
    }
    .ans-table-wrap th,
    .exp-readonly-ans th {
      background: #1E4D7B;
      color: white;
      padding: 5px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
    }
    .ans-table-wrap td,
    .exp-readonly-ans td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      line-height: 1.5;
    }
    .ans-table-wrap tr:nth-child(even) td,
    .exp-readonly-ans tr:nth-child(even) td { background: #D6EAF8; }
    .ans-table-wrap .total-row td,
    .exp-readonly-ans .total-row td { background: #AED6F1; font-weight: 700; }
    .ans-table-wrap .hl,
    .exp-readonly-ans .hl { background: #FFF9C4 !important; font-weight: 700; }
    .ans-table-wrap .q-blank,
    .exp-readonly-ans .q-blank { background: #FFF3E0 !important; color: #E65100; font-weight: 700; text-align: center; border: 2px dashed #FB8C00 !important; }
    .tbl-sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .formula-box {
      margin: 8px 0;
      padding: 8px 12px;
      background: #E8F5E9;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1B5E20;
      text-align: center;
    }

    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    .apx-btn { background:var(--primary); color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .apx-btn.active { background:#E65100; }
    .sec-tabs-wrap { width:100%; }
    .sec-tabs-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .sec-tabs-toggle-arrow { font-size:10px; transition:transform 0.2s; }
    .sec-tabs-wrap.collapsed .sec-tabs-toggle-arrow { transform:rotate(-90deg); }
    .sec-tabs-wrap.collapsed .sec-tabs { display:none; }
    .sec-tabs { display:flex; flex-wrap:wrap; gap:6px; }

    /* ===== 総合問題（財務諸表作成・本支店会計・株主資本等変動・標準原価計算・CVP分析） ===== */
    .comp-title { font-size:15px; font-weight:800; margin-bottom:8px; color:var(--primary); }
    .comp-sect-hd { font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 4px; }
    .comp-table { font-size:13px; line-height:1.6; }
    .comp-row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--border); padding:3px 0; }
    .comp-row .l { color:#333; }
    .comp-row .r { font-weight:700; color:#1A2B3C; white-space:nowrap; }
    .comp-note, .comp-list { font-size:12px; color:#444; line-height:1.75; margin:6px 0; }
    .comp-list div { margin-bottom:4px; }
    .comp-counter { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:6px; }
    .comp-row[data-key], .comp-list > div[data-key] { transition:background-color 0.25s, box-shadow 0.25s; border-radius:6px; }
    .comp-row.comp-hl, .comp-list > div.comp-hl { background:#FFF59D; box-shadow:0 0 0 4px #FFF59D; font-weight:700; }

    /* ===== スクロールモード ===== */
    .exp-panel { display:block; max-width:640px; margin:0 auto; padding:14px 14px; }
    .exp-q-card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px; border:1.5px solid var(--border); font-size:14px; line-height:2.0; font-weight:500; }
    .exp-q-card br+br { display:block; content:''; margin-top:4px; }
    .exp-q-card mark { color:inherit; padding:0 2px; border-radius:2px; }
    .exp-q-card mark.q-asset { background:#FCF569; }
    .exp-q-card mark.q-liability { background:#FE8980; }
    .exp-q-card mark.q-revenue { background:#8FE0FB; }
    .exp-q-card mark.q-expense { background:#95D15F; }
    .exp-q-card mark.q-equity { background:#FDC475; }
    .exp-q-card mark.q-other { background:#C6CDD3; }
    .q-en-trans { margin-top:8px; font-size:12px; color:var(--text-sub,#666); font-weight:400; border-top:1px solid var(--border); padding-top:6px; font-style:italic; }
    .q-paren { color:#9AA0A6; font-weight:400; }
    .exp-swipe-wrap { position:relative; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .exp-swipe-card {
      width:160px; background:#fff; border-radius:14px; border:2.5px solid var(--border);
      padding:14px; text-align:center; font-size:15px; font-weight:800;
      box-shadow:0 4px 18px rgba(0,0,0,0.12); touch-action:none; user-select:none; cursor:grab;
      position:relative; z-index:2; will-change:transform;
    }
    .exp-swipe-card.tilt-l { border-color:#0288D1; background:#E3F2FD; }
    .exp-swipe-card.tilt-r { border-color:#388E3C; background:#E8F5E9; }
    .exp-swipe-card.anim { transition:transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s; }
    .exp-zones { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .exp-zone { border-radius:12px; padding:10px; min-height:62px; border:2px dashed; }
    .exp-zone-d { border-color:#90CAF9; background:#F0F8FF; }
    .exp-zone-c { border-color:#A5D6A7; background:#F0FBF0; }
    .exp-zone-label { font-size:11px; font-weight:800; margin-bottom:6px; }
    .exp-zone-d .exp-zone-label { color:#0277BD; }
    .exp-zone-c .exp-zone-label { color:#2E7D32; }
    .exp-placed { display:flex; flex-wrap:wrap; gap:4px; min-height:24px; }
    .exp-nav-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:6px; }
    .exp-nav-btn { padding:7px 12px; border:1.5px solid var(--border); border-radius:18px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--text); white-space:nowrap; }
    .exp-nav-btn:disabled { opacity:0.3; cursor:default; }
    .exp-nav-next { background:var(--primary); color:#fff; border-color:var(--primary); }
    .exp-nav-info { font-size:13px; font-weight:700; color:var(--muted); flex:1; text-align:center; }
    .exp-undo-btn { width:100%; padding:9px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:var(--text); margin-bottom:8px; }
    .exp-result { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:12px; border:2px solid var(--border); display:none; }
    .exp-result.ok { border-color:#2E7D32; background:#F1FBF4; }
    .exp-result.ng { border-color:#C62828; background:#FFF5F5; }
    .exp-res-hd { font-size:20px; font-weight:800; margin-bottom:8px; }
    .exp-res-ans { margin-bottom:8px; }
    .exp-res-exp { font-size:12px; color:#444; line-height:1.9; padding:10px 12px; background:rgba(0,0,0,0.04); border-radius:8px; white-space:pre-line; }
    .exp-readonly-ans { margin:10px 0; padding:12px 14px; background:#EFF6FF; border-radius:10px; border-left:4px solid var(--primary); display:none; overflow-x:auto; }
    .exp-fill-exp-area { margin-top:10px; padding:14px 16px; background:#F1FBF4; border-radius:12px; border:2px solid #2E7D32; }
    .exp-fill-exp-area .exp-res-exp { background:rgba(0,0,0,0.03); }
    .exp-fin { text-align:center; padding:30px 16px; background:#fff; border-radius:14px; }
    .exp-fin-score { font-size:52px; font-weight:900; color:var(--primary); line-height:1; }
    .exp-fin-label { font-size:14px; color:var(--muted); margin:6px 0 16px; }
    .exp-fin-btns { display:flex; gap:10px; }
    .exp-fin-btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
    .exp-fin-btn-retry { background:var(--primary); color:#fff; }
    .exp-fin-btn-back { background:var(--bg); color:var(--text); border:1.5px solid var(--border); }
    .exp-btn { background:#FF8F00; color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .exp-btn.active { background:#E65100; }
    .exp-scroll-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .exp-scroll-tab { padding:5px 13px; border:1.5px solid var(--border); border-radius:16px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--text); }
    .exp-scroll-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    /* exp-readonly-ans は上の .exp-fill-exp-area ブロックで再定義 */
    /* ===== チェック機能 ===== */
    .check-bar { background:white; border-bottom:1px solid var(--border); padding:8px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .exp-check-btn { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:var(--text); margin-top:8px; text-align:center; transition:all 0.15s; }
    .exp-check-btn.active { background:#FFF3E0; border-color:#FB8C00; color:#E65100; }

    .exp-reveal-btn { width:100%; padding:10px; border:none; border-radius:8px; background:#546E7A; color:#fff; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:8px; }
    /* === 段階的計算ステップUI === */
    .exp-step-area { background:#fff; border-radius:12px; padding:14px; margin-top:8px; border:1.5px solid var(--border); }
    .exp-step-header { display:flex; align-items:center; justify-content:space-between; margin:0 0 8px; }
    .exp-step-progress { display:flex; gap:6px; align-items:center; }
    .exp-step-dot { width:10px; height:10px; border-radius:50%; background:#E0E0E0; display:inline-block; flex-shrink:0; }
    .exp-step-dot.done { background:#2E7D32; }
    .exp-step-dot.active { background:var(--primary); }
    .exp-step-label { font-size:12px; font-weight:700; color:var(--muted); }
    .exp-step-hint { font-size:12px; color:var(--muted); background:#F8F9FF; border-radius:8px; padding:8px 12px; margin-bottom:10px; }
    .exp-step-choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .exp-step-choices.wide { grid-template-columns:1fr; }
    .exp-step-choice-btn { padding:13px 8px; border:2px solid var(--border); border-radius:12px; background:#fff; font-size:13px; font-weight:700; cursor:pointer; text-align:center; line-height:1.4; transition:background 0.12s, border-color 0.12s; }

  { no:1, name:'材料', ans:[['B/S','流動資産']], disp:'原材料（問題の指示による）', reason:'材料とは、製品を作るために仕入れた、まだ加工前の原料のことです。工業簿記特有の資産科目で、使う（消費する）と仕掛品や製造間接費に振り替わります。製造業の通常の営業サイクルの中にある資産なので、金額の大小にかかわらずB/S上は流動資産に表示します（正常営業循環基準）。' },
  { no:2, name:'受取家賃', ans:[['P/L','営業外収益']], reason:'受取家賃とは、自社が所有する不動産を他人に貸して得た賃貸料収入のことです。不動産業を本業としていない会社にとって、部屋や土地を貸すことは本業の商品販売・サービス提供ではなく、毎期ふつうに生じる副次的な収益なので、P/L上は営業外収益に表示します。' },
  { no:3, name:'仕入', ans:[['P/L','売上原価']], disp:'当期商品仕入高（売上原価の内訳）', reason:'仕入とは、販売するための商品を仕入先から購入したときの原価を記録する費用科目です。三分法では、決算で売れ残った分（期末商品棚卸高）を差し引いて売上原価を計算するため、P/L上は売上原価の内訳（当期商品仕入高）として表示されます。' },
  { no:4, name:'前払保険料', ans:[['B/S','流動資産（1年以内の分）'],['B/S','投資その他の資産（1年より先の分）']], disp:'前払費用 ／ 長期前払費用', reason:'前払保険料とは、まだ経過していない契約期間の分の保険料を、先に支払ったときに計上する資産科目です。まだサービス（保険の補償）を受けていない期間に対応する「サービスを受ける権利」なので資産になります。決算日の翌日から1年以内に費用化される分は流動資産（前払費用）、1年を超えて先の分は投資その他の資産（長期前払費用）に分けます（1年基準）。' },
  { no:5, name:'長期借入金', ans:[['B/S','固定負債（返済が1年より先の分）'],['B/S','流動負債（1年以内に返済する分）']], disp:'流動負債に移す分は「1年内返済予定の長期借入金」など', reason:'長期借入金とは、返済期限が1年を超える借入金のことです。借りているお金なので負債ですが、決算日の翌日から1年以内に返済期限が来る分は「1年内返済予定の長期借入金」という名前に変えて流動負債に振り替え、まだ1年より先に返済する分だけを固定負債の長期借入金として残します（1年基準）。' },
  { no:6, name:'法人税、住民税及び事業税', ans:[['P/L','税引前当期純利益の下で差し引く']], reason:'法人税、住民税及び事業税とは、会社の1年間のもうけ（所得）に対してかかる税金の合計額です。収益や費用ではなく「稼いだ利益の分け前を国・地方に渡す」性質のものなので、営業外や特別の区分には入れず、税引前当期純利益を計算したあとに、そこから直接差し引く形でP/Lの一番下近くに表示します。' },
  { no:7, name:'電子記録債権', ans:[['B/S','流動資産']], reason:'電子記録債権とは、でんさいネットに登録して電子化した、売掛金と同じ性質の債権（代金を受け取る権利）です。紙の手形と違い電子データでやり取りしますが、本業の商品販売から生じる点は売掛金・受取手形と同じなので、B/S上は流動資産に表示します。' },
  { no:8, name:'賞与引当金繰入', ans:[['P/L','販売費及び一般管理費']], reason:'賞与引当金繰入とは、まだ支給日が来ていない従業員ボーナスのうち、今期の労働にすでに対応している分を、費用として前もって見積り計上するときの勘定科目です。ボーナスは給料と同じ人件費の一種なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:9, name:'減価償却費', ans:[['P/L','販売費及び一般管理費'],['製造原価報告書','経費（工場の資産の分）']], reason:'減価償却費とは、建物や機械などの固定資産の取得原価を、使用する期間にわたって少しずつ費用として配分したものです。本社や営業所で使う資産の分はP/L上の販売費及び一般管理費になりますが、工場の製造設備にかかる分は製品を作るためのコストなので、製造原価報告書の経費として扱われます。' },
  { no:10, name:'未払法人税等', ans:[['B/S','流動負債']], reason:'未払法人税等とは、決算で確定した法人税等の金額のうち、すでに中間納付した分を差し引いた、まだ納めていない残額を記録する負債科目です。決算日の翌日から2か月以内など、ごく近いうちに納付するため、B/S上は流動負債に表示します。' },
  { no:11, name:'修繕引当金', ans:[['B/S','流動負債']], reason:'修繕引当金とは、来期に予定している建物や設備の定期修繕に備えて、その費用をあらかじめ見積り計上しておく負債科目です。通常は1年以内（翌期）に実際の修繕が行われることを想定しているため、B/S上は流動負債に表示します。' },
  { no:12, name:'リース債務', ans:[['B/S','流動負債（1年以内に支払う分）'],['B/S','固定負債（1年より先に支払う分）']], reason:'リース債務とは、ファイナンス・リース取引で、リース資産を分割払いで購入したのと同じように扱うときに計上する、将来のリース料支払義務（負債）です。長期借入金と同じく、決算日の翌日から1年以内に支払う分は流動負債、1年より先の分は固定負債に分けて表示します（1年基準）。' },
  { no:13, name:'売買目的有価証券', ans:[['B/S','流動資産']], disp:'有価証券', reason:'売買目的有価証券とは、短期的な値上がり益を狙って保有する株式や債券のことです。長く持ち続けるつもりがなく、いつでも売って現金化できる性質の資産なので、B/S上は流動資産に「有価証券」という名前で表示します。' },
  { no:14, name:'建物', ans:[['B/S','有形固定資産']], reason:'建物とは、本社・店舗・工場など、会社が長期間にわたって営業のために使用する不動産（形のある資産）のことです。1年を超えて使い続けるために保有しているので、B/S上は有形固定資産に表示します。' },
  { no:15, name:'資本金', ans:[['B/S','純資産（株主資本）']], reason:'資本金とは、株主が会社の設立や増資のときに出資したお金のうち、会社法の規定にもとづいて資本金とした部分です。株主が会社に払い込んだ、返済不要の元手の中心部分なので、B/S上は純資産の株主資本に表示します。' },
  { no:16, name:'役務収益', ans:[['P/L','売上高']], reason:'役務収益とは、形のある商品ではなく、語学レッスンや清掃サービスなど、無形のサービスを提供したことによって得た収益のことです。サービス業にとってはサービスの提供こそが本業の収益そのものなので、P/L上は売上高に表示します。' },
  { no:17, name:'未払消費税', ans:[['B/S','流動負債']], reason:'未払消費税とは、税抜方式のもとで、お客さんから預かった消費税（仮受消費税）から、自社が支払った消費税（仮払消費税）を差し引いた、まだ税務署に納めていない残額を記録する負債科目です。決算後すぐに納付する義務なので、B/S上は流動負債に表示し、税抜方式ではP/Lには消費税額そのものは出てきません。' },
  { no:18, name:'ソフトウェア償却', ans:[['P/L','販売費及び一般管理費']], reason:'ソフトウェア償却とは、自社利用目的で購入・開発したソフトウェア（無形固定資産）の取得原価を、利用する期間にわたって少しずつ費用化したものです。建物の減価償却と同じ考え方で、本業を営むために使う資産の費用化なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:19, name:'負ののれん発生益', ans:[['P/L','特別利益']], reason:'負ののれん発生益とは、他社を買収したときに支払った金額が、引き継いだ資産・負債の時価の正味の価値より少なかった（割安に買えた）場合に生じる差額の利益です。毎期ふつうに生じるものではなく、M&Aという臨時的な取引から生じる利益なので、P/L上は特別利益に表示します。' },
  { no:20, name:'売掛金', ans:[['B/S','流動資産']], reason:'売掛金とは、商品やサービスを掛け（後払い）で販売したときに生じる、代金をあとで受け取る権利（債権）のことです。商品売買という本業の営業サイクルの中で生じる債権なので、金額の大小や回収時期にかかわらず、B/S上は流動資産に表示します（正常営業循環基準）。' },
  { no:21, name:'固定資産圧縮損', ans:[['P/L','特別損失']], reason:'固定資産圧縮損とは、国庫補助金などを受け取って固定資産を取得したとき、圧縮記帳という方法で、その資産の帳簿価額をあえて引き下げる処理をしたときに計上する費用科目です。補助金を受け取った臨時的な取引に伴うものなので、対になる国庫補助金受贈益と同じく、P/L上は特別損失に表示します。' },
  { no:22, name:'ソフトウェア', ans:[['B/S','無形固定資産']], reason:'ソフトウェアとは、自社利用目的で購入・開発したコンピュータプログラムのことです。建物のように形はありませんが、長期間にわたって利用し続ける資産なので、B/S上は無形固定資産に表示します。' },
  { no:23, name:'その他有価証券評価差額金', ans:[['B/S','純資産（評価・換算差額等）']], reason:'その他有価証券評価差額金とは、長期保有目的の「その他有価証券」を決算時に時価評価したときに生じる、帳簿価額との差額のことです。まだ売却していない段階の値上がり・値下がりは確定した儲け・損ではないという考え方から、P/Lを通さずに直接、B/S純資産の評価・換算差額等に計上します。' },
  { no:24, name:'未収利息', ans:[['B/S','流動資産']], disp:'未収収益', reason:'未収利息とは、すでに時間の経過で発生している利息のうち、まだ実際には受け取っていない分を記録する資産科目です。「もう権利として発生している、近いうちに受け取れるお金」なので、B/S上は流動資産（表示科目：未収収益）に表示します。' },
  { no:25, name:'棚卸減耗損', ans:[['P/L','売上原価'],['P/L','販売費及び一般管理費']], reason:'棚卸減耗損とは、実地棚卸をしたときに、帳簿上の在庫数量より実際の数量が少なかった場合の、その差額分の損失のことです。毎期ふつうに生じる程度の減耗は、商品を売るためにやむを得ず生じるコストと考え、問題文の指示にしたがって売上原価または販売費及び一般管理費に含めます。' },
  { no:26, name:'繰延税金負債', ans:[['B/S','固定負債']], reason:'繰延税金負債とは、税効果会計を適用したときに、将来の税金を増やす原因となる一時差異（例：その他有価証券の評価益など）に対して計上する負債科目です。2級の範囲では一律、固定負債に表示するというルールになっており、繰延税金資産がある場合はそれと相殺して、差額だけをB/Sに記載します。' },
  { no:27, name:'電子記録債務', ans:[['B/S','流動負債']], reason:'電子記録債務とは、でんさいネットに登録して電子化した、買掛金と同じ性質の債務（代金を支払う義務）です。紙の手形と違い電子データでやり取りしますが、本業の仕入れから生じる点は買掛金・支払手形と同じなので、B/S上は流動負債に表示します。' },
  { no:28, name:'仕掛品', ans:[['B/S','流動資産']], reason:'仕掛品とは、工場でまだ製造の途中にある、完成していない製品にかかった原価を集計する資産科目です。材料費・労務費・製造間接費が積み重なっていく製造業特有の勘定で、通常の営業サイクルの中にある資産なので、B/S上は流動資産に表示します。' },
  { no:29, name:'支払家賃', ans:[['P/L','販売費及び一般管理費']], reason:'支払家賃とは、本社・店舗などの土地・建物を借りるために支払う賃借料のことです。本業を営むための場所を確保するための費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:30, name:'契約資産', ans:[['B/S','流動資産']], reason:'契約資産とは、収益認識基準にもとづき、商品の引渡しなど一部の義務はすでに果たしたものの、対価を請求するにはまだ別の条件（時間経過など）を満たす必要がある状態の権利のことです。近いうちに条件を満たして売掛金に振り替わる、商売のサイクルの中にある資産なので、B/S上は流動資産に表示します。' },
  { no:31, name:'貯蔵品', ans:[['B/S','流動資産']], reason:'貯蔵品とは、まだ使っていない郵便切手や収入印紙、あるいは固定資産を除却したときに残る部品などの、換金性・利用可能性のある少額資産をまとめて記録する科目です。近いうちに使用または売却されるものなので、B/S上は流動資産に表示します。' },
  { no:32, name:'製造間接費配賦差異', ans:[['表示なし','売上原価に振り替える']], disp:'P/Lでは「原価差異」（売上原価の内訳）', reason:'製造間接費配賦差異とは、工場でかかった製造間接費を、あらかじめ決めた予定配賦率で各製品に配り終えたあと、実際にかかった金額との間に生じるズレのことです。決算時には原則としてこの差異を売上原価に加減して締め切るため、B/S・P/Lに独立した科目としては残らず、P/L上は「原価差異」として売上原価の内訳に吸収されます。' },
  { no:33, name:'リース資産', ans:[['B/S','有形固定資産']], reason:'リース資産とは、ファイナンス・リース取引で借りている資産を、実質的に分割払いで購入したのと同じとみなして計上する資産科目です。形のある資産を長期間使い続ける点で自己所有の固定資産と変わらないため、B/S上は有形固定資産に表示します。' },
  { no:34, name:'有価証券利息', ans:[['P/L','営業外収益']], reason:'有価証券利息とは、社債や国債などの債券を保有していることで得られる利息収入のことです。本業の商品販売ではなく、余ったお金を運用した結果として毎期ふつうに生じる収益なので、P/L上は営業外収益に表示します。' },
  { no:35, name:'退職給付引当金', ans:[['B/S','固定負債']], reason:'退職給付引当金とは、従業員が将来退職するときに支払う退職金・年金に備えて、現在までに発生している分をあらかじめ見積り計上しておく負債科目です。実際の支払いは通常ずっと先になるため、B/S上は固定負債に表示します。' },
  { no:36, name:'商品保証引当金', ans:[['B/S','流動負債']], reason:'商品保証引当金とは、販売した商品に対する無料の保証修理（アフターサービス）に備えて、その費用をあらかじめ見積り計上しておく負債科目です。通常は1年以内に保証期間内の修理が発生することを想定しているため、B/S上は流動負債に表示します。' },
  { no:37, name:'投資有価証券売却益', ans:[['P/L','特別利益']], reason:'投資有価証券売却益とは、長期保有目的で持っていた「その他有価証券」などを売却したときに生じた利益のことです。長期保有目的の株式・債券を売ることは毎期ふつうに起きる取引ではなく臨時的なので、P/L上は特別利益に表示します（短期売買目的の有価証券の売却益は営業外収益になる点と区別しましょう）。' },
  { no:38, name:'建設仮勘定', ans:[['B/S','有形固定資産']], reason:'建設仮勘定とは、建物などの固定資産が完成するまでの間に、工事の請負業者へ前払いした金額を、完成するまで一時的にプールしておく資産科目です。完成すれば正式に「建物」などに振り替わる、いわば建設中の固定資産なので、B/S上は有形固定資産に表示します。' },
  { no:39, name:'売上', ans:[['P/L','売上高']], disp:'売上高', reason:'売上とは、商品やサービスを販売して得た、会社の本業そのものの収益を記録する科目です。会社が何のために存在するかを表す一番大切な収益なので、P/L上は一番上の売上高として表示します。' },
  { no:40, name:'繰延税金資産', ans:[['B/S','投資その他の資産']], reason:'繰延税金資産とは、税効果会計を適用したときに、将来の税金を減らす効果がある一時差異（例：貸倒引当金の繰入限度超過額など）に対して計上する資産科目です。2級の範囲では一律、投資その他の資産（固定資産）に表示するというルールになっており、繰延税金負債がある場合はそれと相殺して差額だけを記載します。' },
  { no:41, name:'のれん', ans:[['B/S','無形固定資産']], reason:'のれんとは、他社を買収したときに支払った金額が、引き継いだ資産・負債の時価の正味の価値を上回った場合の、その超過額のことです。その会社のブランド力や将来の収益力に対して追加で払った、形のない資産と考えるため、B/S上は無形固定資産に表示します。' },
  { no:42, name:'商品保証引当金繰入', ans:[['P/L','販売費及び一般管理費']], reason:'商品保証引当金繰入とは、商品保証引当金を計上するときの、費用側の相手勘定です。売った商品の無料修理に備える費用は、商品を売るための活動に伴うコストなので、P/L上は販売費及び一般管理費に表示します。' },
  { no:43, name:'貸付金', ans:[['B/S','流動資産（1年以内に回収する分）'],['B/S','投資その他の資産（1年より先に回収する分）']], disp:'短期貸付金 ／ 長期貸付金', reason:'貸付金とは、取引先や従業員などにお金を貸したときに生じる、将来返してもらう権利（債権）のことです。決算日の翌日から1年以内に返済期日が来る分は流動資産（短期貸付金）、1年より先の分は投資その他の資産（長期貸付金）に分けて表示します（1年基準）。' },
  { no:44, name:'土地', ans:[['B/S','有形固定資産']], reason:'土地とは、本社・店舗・工場の敷地など、会社が長期間保有して使用する不動産のことです。建物などと同じく形のある資産なのでB/S上は有形固定資産に表示しますが、使っても価値が減っていくわけではないため、ほかの固定資産と違って減価償却は行いません。' },
  { no:45, name:'給料', ans:[['P/L','販売費及び一般管理費']], reason:'給料とは、本社・店舗など、商品を売ったり管理業務を行ったりする従業員に支払う労働の対価のことです。本業を営むために欠かせない人件費なので、P/L上は販売費及び一般管理費に表示します。なお、工場で製品づくりに従事する人の給料は、製造原価報告書の労務費として扱われる点に注意しましょう。' },
  { no:46, name:'子会社株式', ans:[['B/S','投資その他の資産']], disp:'関係会社株式', reason:'子会社株式とは、他社の意思決定を支配する目的で、発行済株式の過半数などを長期間保有する株式のことです。値上がり益を狙う投資ではなく、企業グループ経営のために長く持ち続ける資産なので、B/S上は投資その他の資産に表示し、関連会社株式とあわせて「関係会社株式」という名前で記載します。' },
  { no:47, name:'前払金（商品代金の前払い）', ans:[['B/S','流動資産']], disp:'前渡金', reason:'前払金とは、商品を受け取る前に、仕入先へあらかじめ代金の一部または全部を支払ったときに生じる、将来商品を受け取る権利のことです。本業の仕入れという営業サイクルの中にある資産なので、B/S上は流動資産に「前渡金」という名前で表示します。' },
  { no:48, name:'当座預金', ans:[['B/S','流動資産']], disp:'現金預金（現金・普通預金などと合算）', reason:'当座預金とは、小切手や手形の決済に使うために銀行に預けているお金のことです。いつでも引き出して支払いに使える流動性の高い資産なので、B/S上は流動資産に表示し、現金や普通預金などとあわせて「現金預金」という1つの金額にまとめて記載するのが一般的です。' },
  { no:49, name:'有価証券評価損益', ans:[['P/L','営業外収益（益の場合）'],['P/L','営業外費用（損の場合）']], disp:'有価証券評価益 ／ 有価証券評価損', reason:'有価証券評価損益とは、売買目的有価証券を決算時に時価評価したときに生じる、帳簿価額との差額のことです。短期的な資金運用（投資）の成果とみなされるため、値上がりなら「有価証券評価益」として営業外収益に、値下がりなら「有価証券評価損」として営業外費用に表示します。' },
  { no:50, name:'繰越商品', ans:[['B/S','流動資産']], disp:'商品', reason:'繰越商品とは、三分法で商品売買を記録しているときに、期末に売れ残っている商品の金額を表す資産科目です。来期も販売目的で持ち続ける、本業の営業サイクルの中にある資産なので、B/S上は流動資産に「商品」という名前で表示します。' },
  { no:51, name:'非支配株主に帰属する当期純利益', ans:[['P/L','当期純利益の下で差し引く']], reason:'非支配株主に帰属する当期純利益とは、連結財務諸表を作るときに、子会社が稼いだ利益のうち、親会社以外の株主（非支配株主）の取り分にあたる部分のことです。連結損益計算書では、まず会社全体の純利益を計算したあと、この非支配株主の取り分を差し引いて「親会社株主に帰属する当期純利益」を求める形で表示します。' },
  { no:52, name:'未払家賃', ans:[['B/S','流動負債']], disp:'未払費用', reason:'未払家賃とは、すでに経過した期間の家賃のうち、まだ支払っていない分を記録する負債科目です。「もうサービス（場所の利用）は受けた、近いうちに払わなければならない義務」なので、B/S上は流動負債（表示科目：未払費用）に表示します。' },
  { no:53, name:'満期保有目的債券', ans:[['B/S','投資その他の資産（満期が1年より先）'],['B/S','流動資産（満期が1年以内）']], disp:'投資有価証券（固定）／ 有価証券（流動）', reason:'満期保有目的債券とは、満期まで保有し続けるつもりで購入した社債や国債などの債券のことです。時価の変動に関係なく持ち続ける前提の資産なので、満期までの期間が1年を超える間は投資その他の資産（投資有価証券）、満期が1年以内に迫った分は流動資産（有価証券）に振り替えます（1年基準）。' },
  { no:54, name:'固定資産除却損', ans:[['P/L','特別損失']], reason:'固定資産除却損とは、まだ使えなくなっていない固定資産を、使用をやめて処分したときに生じる、帳簿価額相当の損失のことです。固定資産を手放すことは毎期ふつうに起きる取引ではなく臨時的なので、P/L上は特別損失に表示します。' },
  { no:55, name:'その他有価証券', ans:[['B/S','投資その他の資産']], disp:'投資有価証券', reason:'その他有価証券とは、売買目的でも満期保有目的でもない、主に他社との関係維持などの目的で長期間保有する株式・債券のことです。すぐに売る予定のない長期保有資産なので、B/S上は投資その他の資産に「投資有価証券」という名前で表示します。' },
  { no:56, name:'退職給付費用', ans:[['P/L','販売費及び一般管理費'],['製造原価報告書','労務費（工場の従業員の分）']], reason:'退職給付費用とは、当期に発生した、従業員への将来の退職金・年金の見積額を費用として計上したものです。本社・営業部門の従業員の分は人件費としてP/L上の販売費及び一般管理費になりますが、工場の従業員の分は製品を作るためのコストなので、製造原価報告書の労務費として扱われます。' },
  { no:57, name:'未払金', ans:[['B/S','流動負債']], reason:'未払金とは、備品や有価証券など、商品以外のものを購入した代金のうち、まだ支払っていない分を記録する負債科目です。商品の仕入れから生じる「買掛金」とは区別され、1年以内に支払う見込みのものなので、B/S上は流動負債に表示します。' },
  { no:58, name:'利益準備金', ans:[['B/S','純資産（株主資本の利益剰余金）']], reason:'利益準備金とは、会社が配当を行う際に、会社法の規定にしたがって、もうけの中から強制的に積み立てておかなければならない準備金のことです。株主への配当の原資となる利益剰余金の一部なので、B/S上は純資産の株主資本（利益剰余金）に表示します。' },
  { no:59, name:'為替差損益', ans:[['P/L','営業外収益（貸方残の場合）'],['P/L','営業外費用（借方残の場合）']], disp:'為替差益 ／ 為替差損', reason:'為替差損益とは、外貨建ての取引や資産・負債を円換算したときに、為替レートの変動によって生じる差額のことです。本業の商品販売ではなく、たまたま円高・円安になったことによる損益なので、P/L上は営業外収益（為替差益）または営業外費用（為替差損）に、原則として差益と差損を相殺した純額で表示します。' },
  { no:60, name:'契約負債', ans:[['B/S','流動負債']], reason:'契約負債とは、収益認識基準にもとづき、商品の引渡しなどの義務を果たす前に、先に代金を受け取った場合に生じる負債のことです。「お金は受け取ったが、まだ約束を果たしていない」義務を表すので、B/S上は流動負債に表示します。' },
  { no:61, name:'当期純利益', ans:[['P/L','最後の行'],['B/S','純資産（繰越利益剰余金に含めて表示）']], reason:'当期純利益とは、収益から費用・税金まですべてを差し引いた、1年間の会社の最終的なもうけのことです。P/Lでは一番下に「結論」として表示され、この金額がそのままB/Sの純資産（繰越利益剰余金）に積み上がっていくため、P/LとB/Sをつなぐ重要な数字です。' },
  { no:62, name:'受取配当金', ans:[['P/L','営業外収益']], reason:'受取配当金とは、他社の株式を保有していることで得られる配当金収入のことです。本業の商品販売ではなく、株式投資という資金運用の成果として毎期ふつうに生じる収益なので、P/L上は営業外収益に表示します。' },
  { no:63, name:'固定資産売却損', ans:[['P/L','特別損失']], reason:'固定資産売却損とは、建物や備品などの固定資産を、帳簿価額より低い金額で売却したときに生じる損失のことです。固定資産の売却は毎期ふつうに起きる取引ではなく臨時的なので、P/L上は特別損失に表示します（売却益が出た場合は特別利益になります）。' },
  { no:64, name:'商品評価損', ans:[['P/L','売上原価（原則）'],['P/L','特別損失（臨時かつ多額の場合）']], reason:'商品評価損とは、期末に保有する商品の時価（正味売却価額）が、仕入れたときの原価より下落した場合の、その下落分の損失のことです。商品の値下がりは商品を売るための原価の一部と考え、通常は売上原価の内訳に含めますが、金額が非常に大きく臨時的な場合は特別損失として扱うこともあります。' },
  { no:65, name:'支払利息', ans:[['P/L','営業外費用']], reason:'支払利息とは、銀行などからお金を借りていることによって生じる利息の支払額のことです。本業の商品販売ではなく、資金調達（金融活動）に伴う費用なので、P/L上は営業外費用に表示します。' },
  { no:66, name:'国庫補助金受贈益', ans:[['P/L','特別利益']], reason:'国庫補助金受贈益とは、国や地方公共団体から固定資産の取得などのために補助金を受け取ったときに生じる収益のことです。毎期ふつうに受け取るものではなく臨時的な収益なので、P/L上は特別利益に表示し、圧縮記帳を行う場合は対になる固定資産圧縮損（特別損失）とセットで処理します。' },
  { no:67, name:'別途積立金', ans:[['B/S','純資産（株主資本の利益剰余金）']], reason:'別途積立金とは、会社が稼いだ利益のうち、特定の使いみちを法律で定めずに、会社が自分の判断で将来に備えて取っておいた任意積立金のことです。配当せずに社内に留保した利益の一部なので、B/S上は純資産の株主資本（利益剰余金）に表示します。' },
  { no:68, name:'賞与引当金', ans:[['B/S','流動負債']], reason:'賞与引当金とは、賞与引当金繰入によって見積り計上した、次のボーナス支給額の負債側の科目です。通常は1年以内（次の支給日）に実際の支払いが行われることを想定しているため、B/S上は流動負債に表示します。' },
  { no:69, name:'建物減価償却累計額', ans:[['B/S','有形固定資産（建物の下に△で控除）']], disp:'減価償却累計額', reason:'建物減価償却累計額とは、建物についてこれまで計上してきた減価償却費の合計額を記録する評価勘定です。建物そのものの価値を直接減らすのではなく、取得原価はそのまま残したうえで、その下に△（マイナス）として差し引く形でB/S上の有形固定資産に表示します（間接法）。負債ではない点に注意しましょう。' },
  { no:70, name:'電子記録債権売却損', ans:[['P/L','営業外費用']], reason:'電子記録債権売却損とは、保有する電子記録債権を満期日前に銀行などに買い取ってもらって現金化したとき、満期までの利息相当分として差し引かれる金額のことです。実質的には資金を早く得るための金融コスト（利息）なので、手形売却損と同じくP/L上は営業外費用に表示します。' },
  { no:71, name:'貸倒引当金繰入', ans:[['P/L','販売費及び一般管理費（売掛金など営業債権の分）'],['P/L','営業外費用（貸付金など営業外の債権の分）']], reason:'貸倒引当金繰入とは、将来回収できなくなる可能性に備えて、貸倒引当金を計上するときの費用科目です。売掛金など本業の販売から生じた債権への備えはP/L上の販売費及び一般管理費になりますが、貸付金など本業以外の債権への備えは営業外費用に表示します。' },
  { no:72, name:'のれん償却', ans:[['P/L','販売費及び一般管理費']], reason:'のれん償却とは、他社買収時に計上した「のれん」という資産を、一定の期間（原則20年以内）にわたって少しずつ費用化したものです。のれんは本業の収益力に対して払ったものなので、その償却費用もP/L上は本業の費用である販売費及び一般管理費に表示します。' },
  { no:73, name:'前受家賃', ans:[['B/S','流動負債']], disp:'前受収益', reason:'前受家賃とは、まだ提供していない期間（翌期以降）の家賃を、先に受け取ったときに計上する負債科目です。「お金は先に受け取ったが、まだ部屋を貸すサービスを提供していない」義務を表すので、B/S上は流動負債（表示科目：前受収益）に表示します。' },
  { no:74, name:'未払配当金', ans:[['B/S','流動負債']], reason:'未払配当金とは、株主総会で配当を行うことが決まったものの、まだ実際には株主に支払っていない金額を記録する負債科目です。決算後まもなく支払われる義務なので、B/S上は流動負債に表示します。' },
  { no:75, name:'貸倒引当金', ans:[['B/S','流動資産（売掛金などの下に△で控除）'],['B/S','投資その他の資産（長期貸付金の下に△で控除）']], reason:'貸倒引当金とは、将来、売掛金や貸付金などが回収できなくなる可能性に備えて、あらかじめ見積り計上しておく評価勘定です。負債ではなく、対応する債権の価値を間接的に減らすものなので、売掛金など流動資産に対する分は流動資産の下に、長期貸付金など固定資産に対する分は投資その他の資産の下に、それぞれ△（マイナス）で差し引いて表示します。' },
  { no:76, name:'火災損失', ans:[['P/L','特別損失']], reason:'火災損失とは、火災によって建物や商品などの資産が失われたときに生じる損失のことです。自然災害・事故による損失は毎期ふつうに起きるものではなく臨時的なので、P/L上は特別損失に表示します。' },
  { no:77, name:'現金過不足', ans:[['表示なし','雑損・雑益に振り替える']], disp:'雑損（営業外費用）／ 雑益（営業外収益）', reason:'現金過不足とは、帳簿上の現金残高と実際の手元現金が一致しないときに、原因がわかるまで一時的に使う仮の勘定です。決算までに原因が判明しなかった分は、不足なら「雑損」、過剰なら「雑益」に振り替えるため、現金過不足という科目名自体はB/S・P/Lのどこにも残りません。' },
  { no:78, name:'役務原価', ans:[['P/L','売上原価']], reason:'役務原価とは、サービス業において、提供したサービスに直接かかった人件費や諸経費などの原価のことです。商品販売業における「仕入」に相当するもので、サービスという商品を提供するためのコストなので、P/L上は売上原価に表示します。' },
  { no:79, name:'法人税等調整額', ans:[['P/L','法人税、住民税及び事業税の下で加減する']], reason:'法人税等調整額とは、税効果会計を適用したときに、会計上の利益と税法上の所得のズレを調整するために計上する科目です。税金そのものの金額を調整するものなので、営業外や特別の区分には入れず、P/L上は法人税、住民税及び事業税のすぐ下で加減する形で表示します。' },
  { no:80, name:'仮払法人税等', ans:[['表示なし','法人税等を計上するときに差し引く']], reason:'仮払法人税等とは、決算を待たずに、期の中間時点で法人税等の一部をあらかじめ納付した（中間納付した）ときに計上する一時的な資産科目です。決算で法人税等を計上する際にこの中間納付額を差し引き、残りを未払法人税等とするため、仮払法人税等という科目自体はB/S・P/Lに残りません。' },
  { no:81, name:'非支配株主持分', ans:[['B/S','純資産（株主資本とは別の区分）']], reason:'非支配株主持分とは、連結財務諸表を作るときに、子会社の純資産（資本）のうち、親会社以外の株主（非支配株主）の取り分にあたる部分のことです。親会社が出したお金ではないため、株主資本とは別の区分として、B/S上は純資産の中に独立して表示します。' },
  { no:82, name:'買掛金', ans:[['B/S','流動負債']], reason:'買掛金とは、商品を掛け（後払い）で仕入れたときに生じる、代金をあとで支払う義務（債務）のことです。商品仕入れという本業の営業サイクルの中で生じる負債なので、B/S上は流動負債に表示します（正常営業循環基準）。' },
  { no:83, name:'広告宣伝費', ans:[['P/L','販売費及び一般管理費']], reason:'広告宣伝費とは、テレビCMやチラシなど、商品やサービスを宣伝して売るために使った費用のことです。商品を売るための直接的な営業活動の費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:84, name:'仮払金', ans:[['表示なし','決算で正しい科目に振り替える']], reason:'仮払金とは、出張の前払い旅費など、使いみちや金額が確定していない支出を、とりあえず一時的に記録しておく仮の資産科目です。決算までには必ず内容を確認して、正しい費用科目や資産科目に振り替える必要があるため、仮払金という科目自体はB/S・P/Lに残りません。' },
  { no:85, name:'資本準備金', ans:[['B/S','純資産（株主資本の資本剰余金）']], reason:'資本準備金とは、株主が出資したお金のうち、会社法にしたがって資本金にはしなかった部分（出資額の2分の1まで）を積み立てた準備金のことです。株主からの払込資本の一部なので、B/S上は純資産の株主資本（資本剰余金）に表示します。' },
  { no:86, name:'仮受消費税', ans:[['表示なし','仮払消費税と相殺する']], disp:'差額は「未払消費税」（流動負債）', reason:'仮受消費税とは、税抜方式のもとで、商品を売ったときにお客さんから預かった消費税額を、一時的に記録しておく科目です。決算で、自社が支払った消費税（仮払消費税）と相殺し、差額だけを「未払消費税」として納付するため、仮受消費税という科目自体はB/S・P/Lに残りません。' },
  { no:87, name:'現金', ans:[['B/S','流動資産']], disp:'現金預金（当座預金・普通預金などと合算）', reason:'現金とは、紙幣・硬貨のほか、他人振出の小切手や期限の到来した公社債の利札など、いつでも支払いに使える通貨代用証券も含む、最も流動性の高い資産です。いつでも使える資産の典型なので、B/S上は流動資産に表示し、通常は当座預金・普通預金などとあわせて「現金預金」という1つの金額にまとめます。' },
  { no:88, name:'普通預金', ans:[['B/S','流動資産']], disp:'現金預金', reason:'普通預金とは、銀行にいつでも自由に出し入れできる形で預けているお金のことです。当座預金と同じくすぐに引き出して使える流動性の高い資産なので、B/S上は流動資産に表示し、「現金預金」としてほかの預金とまとめて記載します。' },
  { no:89, name:'小口現金', ans:[['B/S','流動資産']], disp:'現金預金', reason:'小口現金とは、文房具代や交通費など、日々のちょっとした支払いのために、経理担当者から各部署の小口現金係にあらかじめ渡しておく少額の現金のことです。性質は現金そのものなので、B/S上は流動資産に表示し、「現金預金」としてまとめて記載します。' },
  { no:90, name:'定期預金', ans:[['B/S','流動資産（満期が1年以内）'],['B/S','投資その他の資産（満期が1年より先）']], disp:'現金預金（1年以内）／ 長期性預金（1年より先）', reason:'定期預金とは、一定期間は引き出さない約束で銀行に預けるお金のことです。満期までの期間が1年以内のものは流動資産（現金預金）、1年を超えるものは投資その他の資産（長期性預金）に分けて表示します（1年基準）。' },
  { no:91, name:'別段預金', ans:[['B/S','流動資産']], disp:'現金預金', reason:'別段預金とは、増資の払込金や社債の発行代金などを、正式に資本金・社債として処理するまでの間、一時的にプールしておく特別な預金口座のことです。性質としてはすぐに使える預金なので、B/S上は流動資産に表示し、「現金預金」としてまとめて記載します。' },
  { no:92, name:'受取手形', ans:[['B/S','流動資産']], reason:'受取手形とは、商品代金の決済として、得意先から「将来の期日に代金を支払う」という約束手形を受け取ったときに生じる債権のことです。売掛金と同じく本業の販売から生じる権利なので、B/S上は流動資産に表示します。' },
  { no:93, name:'クレジット売掛金', ans:[['B/S','流動資産']], reason:'クレジット売掛金とは、お客さんがクレジットカードで支払った商品代金のうち、まだカード会社から入金されていない分を記録する債権科目です。通常の売掛金とは区別しますが、やはり本業の販売から生じる権利なので、B/S上は流動資産に表示します。' },
  { no:94, name:'未収入金', ans:[['B/S','流動資産']], reason:'未収入金とは、商品以外のもの（例えば不要になった備品など）を売却した代金のうち、まだ受け取っていない分を記録する資産科目です。本業の商品販売から生じる売掛金とは区別されますが、近いうちに回収する権利なので、B/S上は流動資産に表示します。' },
  { no:95, name:'立替金', ans:[['B/S','流動資産']], reason:'立替金とは、取引先や従業員が本来負担すべき費用を、会社が一時的に代わりに支払ったときに生じる、あとで返してもらう権利のことです。近いうちに精算される一時的な債権なので、B/S上は流動資産に表示します。' },
  { no:96, name:'差入保証金', ans:[['B/S','投資その他の資産']], reason:'差入保証金とは、建物を借りるときの敷金のように、契約の担保として相手に預けておくお金のことです。契約が終わるまで長期間返ってこないことが多いため、B/S上は原則として投資その他の資産に表示します。' },
  { no:97, name:'手形貸付金', ans:[['B/S','流動資産（1年以内に回収する分）'],['B/S','投資その他の資産（1年より先に回収する分）']], disp:'短期貸付金 ／ 長期貸付金', reason:'手形貸付金とは、お金を貸すときに、借用証書の代わりに約束手形を受け取る形で貸し付けた場合の債権のことです。貸付金と同じ性質の資産なので、1年以内に返済される分は流動資産（短期貸付金）、1年より先の分は投資その他の資産（長期貸付金）に分けて表示します（1年基準）。' },
  { no:98, name:'受取商品券', ans:[['B/S','流動資産']], reason:'受取商品券とは、自社の商品を売ったときに、他社や商店街が発行した商品券を代金として受け取った場合に生じる資産のことです。あとでその発行元に代金を請求できる権利なので、B/S上は流動資産に表示します。' },
  { no:99, name:'営業外受取手形', ans:[['B/S','流動資産']], reason:'営業外受取手形とは、備品の売却代金など、商品販売以外の取引によって受け取った約束手形のことです。本業の受取手形とは区別して表示しますが、近いうちに回収する債権である点は同じなので、B/S上は流動資産に表示します。' },
  { no:100, name:'役員貸付金', ans:[['B/S','流動資産（1年以内に回収する分）'],['B/S','投資その他の資産（1年より先に回収する分）']], reason:'役員貸付金とは、会社の役員に対してお金を貸し付けたときに生じる債権のことです。通常の貸付金と同様、決算日の翌日から1年以内に回収する分は流動資産、1年より先の分は投資その他の資産に表示します（1年基準）。' },
  { no:101, name:'工事未収入金', ans:[['B/S','流動資産']], reason:'工事未収入金とは、建設業などで、工事の請負代金のうち、まだ受け取っていない分を記録する債権科目です。商品販売業における売掛金に相当するもので、本業の営業サイクルの中にある資産なので、B/S上は流動資産に表示します。' },
  { no:102, name:'破産更生債権等', ans:[['B/S','投資その他の資産']], reason:'破産更生債権等とは、取引先が倒産するなどして、回収がかなり難しくなった売掛金や貸付金のことです。1年以内に回収できる見込みが薄いため、通常の債権とは区別して、B/S上は投資その他の資産に表示します。' },
  { no:103, name:'前払費用（一般）', ans:[['B/S','流動資産']], reason:'前払費用とは、前払家賃や前払保険料など、将来のサービスをまだ受けていない期間に対応する前払分をまとめて表示するときに使う科目名です。決算日の翌日から1年以内にサービスを受ける（費用化される）分なので、B/S上は流動資産に表示します。' },
  { no:104, name:'前払利息', ans:[['B/S','流動資産']], disp:'前払費用', reason:'前払利息とは、まだ経過していない期間の利息を、先に支払ったときに計上する資産科目です。前払保険料と同じ考え方で、まだ発生していない将来の利息費用に対応する権利なので、B/S上は流動資産（表示科目：前払費用）に表示します。' },
  { no:105, name:'仮払消費税', ans:[['表示なし','仮受消費税と相殺する']], reason:'仮払消費税とは、税抜方式のもとで、仕入れや経費の支払い時に、代金とあわせて支払った消費税額を一時的に記録しておく科目です。決算で、お客さんから預かった消費税（仮受消費税）と相殺し、差額だけを未払消費税（または未収還付消費税）として表示するため、仮払消費税という科目自体はB/S・P/Lに残りません。' },
  { no:106, name:'消耗品', ans:[['B/S','流動資産']], reason:'消耗品とは、文房具やコピー用紙など、購入時に資産として計上した、まだ使っていない物品のことです。期末に未使用分が残っている場合、貯蔵品と同じ考え方で、近いうちに使用される資産としてB/S上は流動資産に表示します。' },
  { no:107, name:'商品券', ans:[['B/S','流動負債']], reason:'商品券とは、自社が発行した、将来商品と引き換えることを約束する券のことです。お客さんから代金を先に受け取っているのに、まだ商品を渡す義務を果たしていない状態なので、B/S上は流動負債に表示します。' },
  { no:108, name:'他店商品券', ans:[['B/S','流動資産']], reason:'他店商品券とは、自社の販売代金として、他の店や商店街が発行した商品券を受け取ったときに生じる資産のことです。発行元に換金や商品との交換を請求できる権利なので、B/S上は流動資産に表示します。' },
  { no:109, name:'備品', ans:[['B/S','有形固定資産']], reason:'備品とは、パソコンや机・椅子など、営業のために長期間使用する、比較的小型の形のある資産のことです。建物や機械と同じく1年を超えて使い続けるために保有しているので、B/S上は有形固定資産に表示します。' },
  { no:110, name:'車両運搬具', ans:[['B/S','有形固定資産']], reason:'車両運搬具とは、営業用の自動車やトラックなど、人や物を運ぶために使用する形のある資産のことです。長期間使用する目的で保有しているので、B/S上は有形固定資産に表示します。' },
  { no:111, name:'機械装置', ans:[['B/S','有形固定資産']], reason:'機械装置とは、工場で製品を作るために使う、大型の生産設備のことです。長期間使用する目的で保有する形のある資産なので、B/S上は有形固定資産に表示します。' },
  { no:112, name:'構築物', ans:[['B/S','有形固定資産']], reason:'構築物とは、舗装道路や塀、看板など、土地の上に定着して作られた、建物以外の工作物のことです。長期間使用する形のある資産なので、B/S上は有形固定資産に表示します。' },
  { no:113, name:'工具器具備品', ans:[['B/S','有形固定資産']], reason:'工具器具備品とは、測定工具や事務機器など、比較的小さな道具・器具類をまとめて記録する資産科目です。備品と同じく長期間使用する形のある資産なので、B/S上は有形固定資産に表示します。' },
  { no:114, name:'備品減価償却累計額', ans:[['B/S','有形固定資産（備品の下に△で控除）']], disp:'減価償却累計額', reason:'備品減価償却累計額とは、備品についてこれまで計上してきた減価償却費の合計額を記録する評価勘定です。建物減価償却累計額と同じく、取得原価はそのまま残し、その下に△（マイナス）で差し引く形でB/S上の有形固定資産に表示します（間接法）。車両運搬具・機械装置・構築物・工具器具備品についても、それぞれの資産の下に同じように控除する形で表示します。' },
  { no:115, name:'特許権', ans:[['B/S','無形固定資産']], reason:'特許権とは、自社が開発した発明などを独占的に利用できる、法律上の権利のことです。形はありませんが、長期間にわたって事業に活用できる価値ある権利なので、B/S上は無形固定資産に表示します。' },
  { no:116, name:'商標権', ans:[['B/S','無形固定資産']], reason:'商標権とは、自社のブランド名やロゴマークなどを独占的に使用できる、法律上の権利のことです。形はありませんが、長期間にわたって事業価値を支える権利なので、B/S上は無形固定資産に表示します。' },
  { no:117, name:'ソフトウェア仮勘定', ans:[['B/S','無形固定資産']], reason:'ソフトウェア仮勘定とは、自社利用目的のソフトウェアがまだ完成していない開発途中の段階で、それまでにかかった支出を一時的にプールしておく資産科目です。建設仮勘定のソフトウェア版にあたり、完成すれば「ソフトウェア」に振り替わるので、B/S上は無形固定資産に表示します。' },
  { no:118, name:'創立費', ans:[['B/S','繰延資産']], reason:'創立費とは、会社を設立するためにかかった、定款の作成費用や設立登記の登録免許税などの費用のことです。名前に「費」とつきますが、会社の設立という将来に効果が及ぶ支出なので、費用にせず、いったん資産（繰延資産）として計上し、数年かけて償却していきます。' },
  { no:119, name:'開業費', ans:[['B/S','繰延資産']], reason:'開業費とは、会社設立後、実際に営業を開始するまでの間にかかった、広告費や事務所の準備費用などのことです。創立費と同じく、開業準備という将来に効果が及ぶ支出なので、資産（繰延資産）としていったん計上し、数年かけて償却していきます。' },
  { no:120, name:'株式交付費', ans:[['B/S','繰延資産']], reason:'株式交付費とは、新しく株式を発行するためにかかった、印刷費や証券会社への手数料などの事務費用のことです。資金調達という将来に効果が及ぶ支出とみなして、資産（繰延資産）としていったん計上し、数年かけて償却していきます。' },
  { no:121, name:'社債発行費', ans:[['B/S','繰延資産']], reason:'社債発行費とは、社債を発行するためにかかった、印刷費や証券会社への手数料などの事務費用のことです。株式交付費と同じ考え方で、資金調達のための支出を資産（繰延資産）としていったん計上し、数年かけて償却していきます。' },
  { no:122, name:'創立費償却', ans:[['P/L','営業外費用']], reason:'創立費償却とは、繰延資産として計上した創立費を、一定の期間にわたって少しずつ費用化したものです。本業の販売活動そのものではなく、会社設立という財務面の支出の償却なので、P/L上は営業外費用に表示します。' },
  { no:123, name:'開業費償却', ans:[['P/L','営業外費用']], reason:'開業費償却とは、繰延資産として計上した開業費を、一定の期間にわたって少しずつ費用化したものです。創立費償却と同じく、本業の販売活動ではなく財務面の支出の償却なので、P/L上は営業外費用に表示します。' },
  { no:124, name:'株式交付費償却', ans:[['P/L','営業外費用']], reason:'株式交付費償却とは、繰延資産として計上した株式交付費を、一定の期間にわたって少しずつ費用化したものです。資金調達に伴う支出の償却なので、P/L上は営業外費用に表示します。' },
  { no:125, name:'社債発行費償却', ans:[['P/L','営業外費用']], reason:'社債発行費償却とは、繰延資産として計上した社債発行費を、一定の期間にわたって少しずつ費用化したものです。資金調達に伴う支出の償却なので、P/L上は営業外費用に表示します。' },
  { no:126, name:'研究開発費', ans:[['P/L','販売費及び一般管理費']], reason:'研究開発費とは、新しい製品や技術を開発するために支出した費用のことです。将来の成果が不確実なため資産にはせず、発生したときに全額を費用として処理し、P/L上は販売費及び一般管理費に表示します。' },
  { no:127, name:'支払手形', ans:[['B/S','流動負債']], reason:'支払手形とは、商品代金の決済として、仕入先へ「将来の期日に代金を支払う」という約束手形を振り出したときに生じる債務のことです。買掛金と同じく本業の仕入れから生じる義務なので、B/S上は流動負債に表示します。' },
  { no:128, name:'借入金', ans:[['B/S','流動負債']], reason:'借入金とは、銀行などからお金を借りたときに生じる返済義務のことです。長期借入金と違って返済期限が1年以内のものを指すため、B/S上は流動負債に表示します。' },
  { no:129, name:'手形借入金', ans:[['B/S','流動負債']], disp:'短期借入金', reason:'手形借入金とは、お金を借りるときに、借用証書の代わりに約束手形を振り出す形で借り入れた場合の負債のことです。通常の借入金と同じ性質なので、B/S上は流動負債に「短期借入金」として表示します。' },
  { no:130, name:'未払利息', ans:[['B/S','流動負債']], disp:'未払費用', reason:'未払利息とは、すでに時間の経過で発生している利息のうち、まだ支払っていない分を記録する負債科目です。未払家賃と同じ考え方で「すでに発生しているが、まだ払っていない義務」なので、B/S上は流動負債（表示科目：未払費用）に表示します。' },
  { no:131, name:'未払費用（一般）', ans:[['B/S','流動負債']], reason:'未払費用とは、未払利息や未払家賃など、すでに発生しているサービスの対価のうち、まだ支払っていない分をまとめて表示するときに使う科目名です。近いうちに支払う義務が確定しているので、B/S上は流動負債に表示します。' },
  { no:132, name:'前受金', ans:[['B/S','流動負債']], reason:'前受金とは、商品を引き渡す前に、得意先からあらかじめ代金の一部または全部を受け取ったときに生じる、将来商品を引き渡す義務のことです。本業の販売という営業サイクルの中にある負債なので、B/S上は流動負債に表示します。' },
  { no:133, name:'前受収益（一般）', ans:[['B/S','流動負債']], reason:'前受収益とは、前受家賃など、まだサービスを提供していない期間に対応する前受分をまとめて表示するときに使う科目名です。決算日の翌日から1年以内にサービスを提供する義務なので、B/S上は流動負債に表示します。' },
  { no:134, name:'仮受金', ans:[['表示なし','決算で正しい科目に振り替える']], reason:'仮受金とは、入金はあったものの、その内容や相手先がまだ確定していない金額を、一時的に記録しておく仮の負債科目です。決算までには必ず内容を確認して正しい科目に振り替えるため、仮受金という科目自体はB/S・P/Lに残りません。' },
  { no:135, name:'当座借越', ans:[['B/S','流動負債']], disp:'短期借入金', reason:'当座借越とは、当座預金の残高を超えて小切手を振り出した場合に生じる、銀行からの一時的な借入れのことです。実質的に銀行からお金を借りている状態なので、B/S上は流動負債に「短期借入金」として表示します。' },
  { no:136, name:'預り金', ans:[['B/S','流動負債']], reason:'預り金とは、従業員の給料から天引きした源泉所得税や社会保険料など、会社がいったん預かって、あとで本人に代わって納付・支払いする義務のあるお金のことです。近いうちに外部へ納付・支払いする義務なので、B/S上は流動負債に表示します。' },
  { no:137, name:'社会保険料預り金', ans:[['B/S','流動負債']], disp:'預り金', reason:'社会保険料預り金とは、従業員の給料から天引きした社会保険料（健康保険・厚生年金など）のうち、会社が年金事務所などへまだ納付していない分を記録する負債科目です。預り金の一種として、B/S上は流動負債に表示します。' },
  { no:138, name:'所得税預り金', ans:[['B/S','流動負債']], disp:'預り金', reason:'所得税預り金とは、従業員の給料から天引きした源泉所得税のうち、会社が税務署へまだ納付していない分を記録する負債科目です。預り金の一種として、B/S上は流動負債に表示します。' },
  { no:139, name:'社債', ans:[['B/S','固定負債']], reason:'社債とは、会社が多数の投資家から資金を借り入れるために発行する、債券形式の借用証書のことです。通常は返済（償還）までの期間が1年を超えるため、B/S上は固定負債に表示します（償還期限が1年以内に迫れば流動負債に振り替えます）。' },
  { no:140, name:'工事未払金', ans:[['B/S','流動負債']], reason:'工事未払金とは、建設業などで、工事に必要な資材や外注費などの未払額を記録する負債科目です。商品販売業における買掛金に相当するもので、本業の営業サイクルの中にある負債なので、B/S上は流動負債に表示します。' },
  { no:141, name:'営業外支払手形', ans:[['B/S','流動負債']], reason:'営業外支払手形とは、備品の購入代金など、商品仕入れ以外の取引によって振り出した約束手形のことです。本業の支払手形とは区別して表示しますが、近いうちに支払う義務である点は同じなので、B/S上は流動負債に表示します。' },
  { no:142, name:'返金負債', ans:[['B/S','流動負債']], reason:'返金負債とは、収益認識基準にもとづき、返品や値引きが見込まれる分について、将来お客さんに返金する義務をあらかじめ見積り計上しておく負債科目です。近いうちに返金する可能性が高い義務なので、B/S上は流動負債に表示します。' },
  { no:143, name:'役員賞与引当金', ans:[['B/S','流動負債']], reason:'役員賞与引当金とは、まだ支給日が来ていない役員向けのボーナスのうち、今期の職務にすでに対応している分を、あらかじめ見積り計上しておく負債科目です。通常は1年以内に支給されることを想定しているため、B/S上は流動負債に表示します。' },
  { no:144, name:'製品保証引当金', ans:[['B/S','流動負債']], reason:'製品保証引当金とは、製造業において、販売した製品に対する無料の保証修理に備えて、その費用をあらかじめ見積り計上しておく負債科目です。商品保証引当金と同じ考え方で、通常は1年以内に修理が発生することを想定しているため、B/S上は流動負債に表示します。' },
  { no:145, name:'株式申込証拠金', ans:[['B/S','純資産（株主資本、資本金の次に独立の項目として表示）']], reason:'株式申込証拠金とは、新株を発行するときに、株式の引受人（申込者）から払い込まれたお金を、正式に資本金・資本準備金に振り替えるまでの間、一時的に記録しておく科目です。将来株主となる人からすでに払い込まれたお金なので、B/S上は純資産（株主資本）に表示します。' },
  { no:146, name:'繰越利益剰余金', ans:[['B/S','純資産（株主資本の利益剰余金）']], reason:'繰越利益剰余金とは、これまで会社が稼いだ利益のうち、配当などで社外に出さずに積み上がってきた、会社に蓄積された利益の合計です。当期純利益が毎期ここに加算されていく、会社の「貯金」にあたる項目なので、B/S上は純資産の株主資本（利益剰余金）に表示します。' },
  { no:147, name:'その他資本剰余金', ans:[['B/S','純資産（株主資本の資本剰余金）']], reason:'その他資本剰余金とは、株主からの払込資本のうち、資本準備金以外の資本剰余金をまとめて記録する科目です。株主が出したお金に由来する項目なので、B/S上は純資産の株主資本（資本剰余金）に表示します。' },
  { no:148, name:'自己株式', ans:[['B/S','純資産（株主資本、末尾にマイナス表示）']], reason:'自己株式とは、会社が自社の発行した株式を買い戻して保有しているもののことです。株主に払い戻したお金とみなされるため、資産ではなく、B/S上は純資産の株主資本の一番下にマイナス（控除項目）として表示します。' },
  { no:149, name:'新株予約権', ans:[['B/S','純資産（株主資本とは別の区分）']], reason:'新株予約権とは、あらかじめ決めた価格で将来株式を取得できる権利のことです。権利が行使されるまでは株主としての出資が確定していないため、株主資本とは別の区分として、B/S上は純資産の中に独立して表示します。' },
  { no:150, name:'新築積立金', ans:[['B/S','純資産（株主資本の利益剰余金）']], reason:'新築積立金とは、将来の建物の新築・増改築に備えて、会社が利益の中から任意に積み立てておく積立金のことです。別途積立金と同じ任意積立金の一種なので、B/S上は純資産の株主資本（利益剰余金）に表示します。' },
  { no:151, name:'圧縮積立金', ans:[['B/S','純資産（株主資本の利益剰余金）']], reason:'圧縮積立金とは、税法上の圧縮記帳を、固定資産の帳簿価額を直接減らす方法ではなく、剰余金の処分として積み立てる方法で行ったときに計上する科目です。利益の中からの積立てなので、B/S上は純資産の株主資本（利益剰余金）に表示します。' },
  { no:152, name:'自己株式処分差益', ans:[['B/S','純資産（その他資本剰余金に含める）']], reason:'自己株式処分差益とは、保有していた自己株式を、取得したときの金額より高い価格で処分（売却）したときに生じる差額のことです。損益計算書を通さず、B/S上は純資産のその他資本剰余金に含めて表示します。' },
  { no:153, name:'自己株式処分差損', ans:[['B/S','純資産（その他資本剰余金から控除）']], reason:'自己株式処分差損とは、保有していた自己株式を、取得したときの金額より低い価格で処分（売却）したときに生じる差額のことです。自己株式処分差益と同じく損益計算書を通さず、B/S上は純資産のその他資本剰余金から控除する形で表示します。' },
  { no:154, name:'支払手数料', ans:[['P/L','販売費及び一般管理費']], reason:'支払手数料とは、銀行の振込手数料やクレジットカードの決済手数料など、取引に伴って発生する各種の手数料のことです。本業の営業活動を支える一般的な費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:155, name:'支払保険料', ans:[['P/L','販売費及び一般管理費']], reason:'支払保険料とは、火災保険や自動車保険など、会社が加入している各種保険の保険料のことです。本業の営業活動に伴うリスクに備える費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:156, name:'租税公課', ans:[['P/L','販売費及び一般管理費']], reason:'租税公課とは、収入印紙代や固定資産税など、法人税等以外の税金や公的な負担金をまとめて記録する費用科目です。本業を営むうえで生じる諸費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:157, name:'通信費', ans:[['P/L','販売費及び一般管理費']], reason:'通信費とは、電話代や郵便切手代、インターネット回線料など、情報をやり取りするためにかかった費用のことです。本業を営むための諸費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:158, name:'旅費交通費', ans:[['P/L','販売費及び一般管理費']], reason:'旅費交通費とは、出張費や電車・バス代など、業務のための移動にかかった費用のことです。本業を営むための諸費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:159, name:'修繕費', ans:[['P/L','販売費及び一般管理費']], reason:'修繕費とは、固定資産を元の状態に維持・回復するための、現状維持目的の修理費用のことです。資産の価値を高めるものではなく、その期の費用として処理するため、P/L上は販売費及び一般管理費に表示します。' },
  { no:160, name:'貸倒損失', ans:[['P/L','販売費及び一般管理費（売掛金など営業債権の分）'],['P/L','営業外費用（貸付金など営業外の債権の分）']], reason:'貸倒損失とは、売掛金や貸付金などが実際に回収不能になったときに計上する費用のことです。貸倒引当金繰入と同じ考え方で、売掛金など本業の債権の貸倒れはP/L上の販売費及び一般管理費に、貸付金など本業以外の債権の貸倒れは営業外費用に表示します。' },
  { no:161, name:'発送費', ans:[['P/L','販売費及び一般管理費']], reason:'発送費とは、販売した商品をお客さんのもとへ届けるための配送料・運送料のことです。商品を売るための直接的な費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:162, name:'雑損', ans:[['P/L','営業外費用']], reason:'雑損とは、現金過不足の原因不明の不足分など、金額が小さく、独立した科目を立てるほどではない雑多な損失をまとめて記録する科目です。本業以外で生じる軽微な損失なので、P/L上は営業外費用に表示します。' },
  { no:163, name:'法定福利費', ans:[['P/L','販売費及び一般管理費']], reason:'法定福利費とは、健康保険料や厚生年金保険料など、法律で負担が義務づけられている、会社負担分の社会保険料のことです。給料と同じ人件費の一種なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:164, name:'消耗品費', ans:[['P/L','販売費及び一般管理費']], reason:'消耗品費とは、文房具やコピー用紙など、短期間で使い切ってしまう物品を購入したときの費用のことです。本業を営むための諸費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:165, name:'手形売却損', ans:[['P/L','営業外費用']], reason:'手形売却損とは、保有する受取手形を満期日前に銀行に買い取ってもらって現金化したとき、満期までの利息相当分として差し引かれる金額のことです。実質的な金融コスト（利息）なので、P/L上は営業外費用に表示します。' },
  { no:166, name:'売上原価', ans:[['P/L','売上原価']], reason:'売上原価とは、売上原価対立法などで、売れた商品の原価を売上のつど直接計上するときに使う費用科目です。販売した商品そのものの仕入コストなので、P/L上は売上原価に表示します。' },
  { no:167, name:'有価証券評価損', ans:[['P/L','営業外費用']], reason:'有価証券評価損とは、保有する有価証券を時価評価した結果、帳簿価額より時価が下落した場合の、その下落分の損失のことです。資金運用（投資）の結果生じる損失なので、P/L上は営業外費用に表示します。' },
  { no:168, name:'有価証券売却損', ans:[['P/L','営業外費用']], reason:'有価証券売却損とは、保有する有価証券を、帳簿価額より低い価格で売却したときに生じる損失のことです。資金運用の結果生じる損失なので、P/L上は営業外費用に表示します。' },
  { no:169, name:'債権売却損', ans:[['P/L','営業外費用']], reason:'債権売却損とは、電子記録債権などの金銭債権を、満期前に第三者へ売却（譲渡）したときに生じる、額面との差額の損失のことです。電子記録債権売却損・手形売却損と同じ性質の金融コストなので、P/L上は営業外費用に表示します。' },
  { no:170, name:'社債利息', ans:[['P/L','営業外費用']], reason:'社債利息とは、社債を発行して借り入れたお金に対して支払う利息のことです。支払利息と同じく資金調達に伴う費用なので、P/L上は営業外費用に表示します。' },
  { no:171, name:'固定資産廃棄損', ans:[['P/L','特別損失']], reason:'固定資産廃棄損とは、固定資産を売却・譲渡せずに、そのまま廃棄処分したときに生じる、帳簿価額相当の損失のことです。固定資産除却損と同じく、毎期ふつうに起きる取引ではなく臨時的なので、P/L上は特別損失に表示します。' },
  { no:172, name:'工事原価', ans:[['P/L','売上原価']], disp:'完成工事原価', reason:'工事原価とは、建設業などで、完成して引き渡した工事にかかった原価のことです。商品販売業における売上原価に相当するもので、P/L上は売上原価（完成工事原価）に表示します。' },
  { no:173, name:'受取手数料', ans:[['P/L','営業外収益']], reason:'受取手数料とは、商品の仲介や紹介などを行って得た手数料収入のことです。本業の商品販売そのものではなく、毎期ふつうに生じる副次的な収益なので、P/L上は営業外収益に表示します。' },
  { no:174, name:'受取利息', ans:[['P/L','営業外収益']], reason:'受取利息とは、銀行預金や貸付金などから得られる利息収入のことです。本業の商品販売ではなく、資金運用の成果として毎期ふつうに生じる収益なので、P/L上は営業外収益に表示します。' },
  { no:175, name:'固定資産売却益', ans:[['P/L','特別利益']], reason:'固定資産売却益とは、建物や備品などの固定資産を、帳簿価額より高い金額で売却したときに生じる利益のことです。固定資産の売却は毎期ふつうに起きる取引ではなく臨時的なので、P/L上は特別利益に表示します。' },
  { no:176, name:'償却債権取立益', ans:[['P/L','営業外収益']], reason:'償却債権取立益とは、過去の決算で貸倒れとして処理し、帳簿から消していた債権が、あとになって思いがけず回収できたときに生じる収益のことです。回収できた期の、本業以外のいわば臨時収入的な性格の収益なので、P/L上は営業外収益に表示します。' },
  { no:177, name:'雑益', ans:[['P/L','営業外収益']], reason:'雑益とは、現金過不足の原因不明の過剰分など、金額が小さく、独立した科目を立てるほどではない雑多な収益をまとめて記録する科目です。本業以外で生じる軽微な収益なので、P/L上は営業外収益に表示します。' },
  { no:178, name:'有価証券売却益', ans:[['P/L','営業外収益']], reason:'有価証券売却益とは、保有する有価証券を、帳簿価額より高い価格で売却したときに生じる利益のことです。資金運用の成果として生じる収益なので、P/L上は営業外収益に表示します。' },
  { no:179, name:'有価証券評価益', ans:[['P/L','営業外収益']], reason:'有価証券評価益とは、保有する有価証券を時価評価した結果、帳簿価額より時価が上昇した場合の、その上昇分の利益のことです。資金運用の結果生じる収益なので、P/L上は営業外収益に表示します。' },
  { no:180, name:'工事収益', ans:[['P/L','売上高']], disp:'完成工事高', reason:'工事収益とは、建設業などで、工事を請け負って得た収益のことです。商品販売業における売上高に相当するもので、本業そのものの収益なので、P/L上は売上高（完成工事高）に表示します。' },
  { no:181, name:'保険差益', ans:[['P/L','特別利益']], reason:'保険差益とは、火災などで資産を失ったときに受け取った保険金が、失った資産の帳簿価額を上回った場合の、その上回った分の利益のことです。火災という臨時的な出来事から生じる利益なので、P/L上は特別利益に表示します。' },
  { no:182, name:'工事負担金受贈益', ans:[['P/L','特別利益']], reason:'工事負担金受贈益とは、電力会社などが設備工事の費用の一部を負担してくれたときに生じる収益のことです。毎期ふつうに受け取るものではなく臨時的な収益なので、P/L上は特別利益に表示します。' },
  { no:183, name:'賞与', ans:[['P/L','販売費及び一般管理費']], reason:'賞与とは、実際に支給された従業員へのボーナスのことです。給料と同じ人件費の一種なので、本社・営業部門の従業員の分はP/L上の販売費及び一般管理費に表示し、工場の従業員の分は製造原価報告書の労務費になります。' },
  { no:184, name:'支払リース料', ans:[['P/L','販売費及び一般管理費']], reason:'支払リース料とは、オペレーティング・リース取引で、資産・負債を計上せずに、リース料を支払うたびにそのまま費用として処理する科目です。通常の賃借料（レンタル料）と同じ性質の費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:185, name:'特許権償却', ans:[['P/L','販売費及び一般管理費']], reason:'特許権償却とは、無形固定資産である特許権の取得原価を、利用できる期間にわたって少しずつ費用化したものです。ソフトウェア償却と同じく、本業を営むために使う資産の費用化なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:186, name:'仕入割引', ans:[['P/L','営業外収益']], reason:'仕入割引とは、買掛金の支払期日より早く代金を支払ったことで、仕入先から代金の一部を免除してもらったときに生じる収益のことです。商品そのものの値引きではなく、早期支払いという金融的な側面から生じる収益なので、P/L上は営業外収益に表示します（仕入値引・仕入戻しとは区別しましょう）。' },
  { no:187, name:'未決算', ans:[['表示なし','火災損失・保険差益等に振り替える']], reason:'未決算とは、火災などで資産が失われたものの、保険金でいくら補填されるかがまだ確定していない間、一時的に記録しておく仮の勘定です。保険金額が確定した時点で、火災損失や保険差益など正しい科目に振り替えるため、未決算という科目自体はB/S・P/Lに残りません。' },
  { no:188, name:'修繕引当金繰入', ans:[['P/L','販売費及び一般管理費']], reason:'修繕引当金繰入とは、修繕引当金を計上するときの、費用側の相手勘定です。来期の修繕に備える費用は、固定資産を良好な状態で維持するための諸費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:189, name:'製品保証引当金繰入', ans:[['P/L','販売費及び一般管理費']], reason:'製品保証引当金繰入とは、製品保証引当金を計上するときの、費用側の相手勘定です。商品保証引当金繰入と同じく、売った製品の無料修理に備える費用なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:190, name:'貸倒引当金戻入', ans:[['P/L','営業外収益']], reason:'貸倒引当金戻入とは、前期に見積もった貸倒引当金が、実際には多すぎたと判明したときに、その超過分を取り崩して計上する収益のことです。前期の見積りの修正から生じる収益なので、P/L上は営業外収益に表示します。' },
  { no:191, name:'役員賞与引当金繰入', ans:[['P/L','販売費及び一般管理費']], reason:'役員賞与引当金繰入とは、役員賞与引当金を計上するときの、費用側の相手勘定です。役員へのボーナスの見積額は人件費の一種なので、P/L上は販売費及び一般管理費に表示します。' },
  { no:192, name:'商品保証費', ans:[['P/L','販売費及び一般管理費']], reason:'商品保証費とは、引当金を設定せず、実際に保証修理が発生したときにその場で費用として処理する場合の科目です。売った商品のアフターサービスにかかる費用なので、P/L上は販売費及び一般管理費に表示します。' },

  { no:2, q:'決算日の翌日から起算して、支払期限が1年を超える負債を何という？', ans:'固定負債', reason:'固定負債とは、決算日の翌日から1年を超えてから支払期限が来る負債のことです（1年基準）。長期借入金・社債・退職給付引当金などが含まれます。' },
  { no:3, q:'現金預金のようにすぐに使える資産や、1年以内に現金化・費用化される資産、あるいは商品・売掛金のように通常の営業サイクルの中にある資産を何という？', ans:'流動資産', reason:'流動資産とは、現金預金のようにすぐに使えるお金や、1年以内に現金化・費用化される資産、あるいは商品・売掛金のように通常の営業サイクル（正常営業循環基準）の中にある資産のことです。' },

  { no:5, q:'建物・土地・機械装置・備品など、長期間使用する形のある資産が分類される区分を何という？', ans:'有形固定資産', reason:'有形固定資産とは、建物・土地・機械装置・備品など、形があって長期間使用する資産の区分です。土地以外は、使用にともなって減価償却を行います。' },
  { no:6, q:'のれん・特許権・商標権・ソフトウェアなど、長期間事業に役立つ、形のない資産が分類される区分を何という？', ans:'無形固定資産', reason:'無形固定資産とは、のれん・特許権・商標権・ソフトウェアなど、形はないが長期間にわたって事業に役立つ資産の区分です。' },
  { no:7, q:'子会社株式・その他有価証券・長期貸付金・繰延税金資産など、短期売買ではなく長期的な投資や関係維持のために保有する資産が分類される区分を何という？', ans:'投資その他の資産', reason:'投資その他の資産とは、子会社株式・その他有価証券・長期貸付金・繰延税金資産など、短期的な売買や使用ではなく、長期的な投資や関係維持のために保有する資産の区分です。' },
  { no:8, q:'創立費・開業費・株式交付費・社債発行費のように、すでに支払った費用の効果が将来にも及ぶため、資産としていったん計上し、数年かけて償却していく特殊な資産の区分を何という？', ans:'繰延資産', reason:'繰延資産とは、すでに現金を支払ったものの、その効果が将来の期間にも及ぶため、いったん資産として計上し、数年かけて償却していく特殊な資産の区分です。' },
  { no:9, q:'資本金・資本剰余金・利益剰余金・自己株式など、株主が出資した元手や会社が稼いで蓄積した利益をまとめた、純資産の中の区分を何という？', ans:'株主資本', reason:'株主資本とは、純資産のうち、株主が出資したお金（資本金・資本剰余金）と、会社がこれまでに稼いで蓄積した利益（利益剰余金）、および自己株式をまとめた区分です。' },
  { no:10, q:'その他有価証券評価差額金のように、決算時の時価評価で生じたが、まだ売却などで損益として確定していない評価差額が分類される、純資産の中の区分を何という？', ans:'評価・換算差額等', reason:'評価・換算差額等とは、その他有価証券評価差額金など、決算時の時価評価によって生じたものの、まだ売却などで確定していない評価差額を計上する、純資産の中の区分です。' },

  { no:12, q:'売上高から差し引く、売れた商品の仕入原価や、提供したサービスの原価を何という？', ans:'売上原価', reason:'売上原価とは、売れた商品の仕入原価や、提供したサービスの原価のことです。売上高からこれを差し引くと、売上総利益（粗利）が計算できます。' },

  { no:14, q:'給料・広告宣伝費・減価償却費・貸倒引当金繰入など、商品を販売するための費用と、会社全体を管理するための費用をまとめた区分を何という？', ans:'販売費及び一般管理費', reason:'販売費及び一般管理費とは、商品を販売するための費用（広告宣伝費・発送費など）と、会社全体を管理するための費用（給料・家賃・減価償却費など）をまとめた区分です。「販管費」と略されることもあります。' },
  { no:15, q:'売上総利益から販売費及び一般管理費を差し引いた、本業そのものの儲けを何という？', ans:'営業利益', reason:'営業利益とは、売上総利益から販売費及び一般管理費を差し引いた利益で、「本業でどれだけ稼げているか」を示す、最も重要な利益指標の1つです。' },
  { no:16, q:'受取利息・受取配当金・有価証券売却益など、本業以外から毎期ふつうに生じる収益を何という？', ans:'営業外収益', reason:'営業外収益とは、受取利息・受取配当金・有価証券売却益など、商品販売という本業以外から、毎期ふつうに生じる収益のことです。主に資金運用（財務活動）の成果です。' },
  { no:17, q:'支払利息・手形売却損・有価証券評価損など、本業以外から毎期ふつうに生じる費用を何という？', ans:'営業外費用', reason:'営業外費用とは、支払利息・手形売却損・有価証券評価損など、商品販売という本業以外から、毎期ふつうに生じる費用のことです。主に資金調達（財務活動）に伴うコストです。' },

  { no:19, q:'固定資産売却益・負ののれん発生益・国庫補助金受贈益など、毎期ふつうには生じない臨時的な利益を何という？', ans:'特別利益', reason:'特別利益とは、固定資産売却益や負ののれん発生益など、毎期ふつうに生じるものではない、臨時的・偶発的な利益のことです。' },
  { no:20, q:'固定資産売却損・火災損失・減損損失など、毎期ふつうには生じない臨時的な損失を何という？', ans:'特別損失', reason:'特別損失とは、固定資産売却損や火災損失、減損損失など、毎期ふつうに生じるものではない、臨時的・偶発的な損失のことです。' },
  { no:21, q:'経常利益に、特別利益を加え、特別損失を差し引いた、法人税等を差し引く前の利益を何という？', ans:'税引前当期純利益', reason:'税引前当期純利益とは、経常利益に特別利益・特別損失まで加味した、法人税等を差し引く前の、最終的な儲けのことです。ここから法人税、住民税及び事業税を差し引くと当期純利益になります。' },
  { no:22, q:'税引前当期純利益から、法人税、住民税及び事業税を差し引いた、1年間の最終的な儲けを何という？', ans:'当期純利益', reason:'当期純利益とは、税引前当期純利益から法人税等を差し引いた、1年間の会社の最終的な儲けのことです。この金額が、B/Sの純資産（繰越利益剰余金）に積み上がっていきます。' },
  { no:23, q:'製造業において、1期間の製品製造にかかった材料費・労務費・製造間接費の内訳と、当期製品製造原価の計算過程をまとめて示す書類を何という？', ans:'製造原価報告書', reason:'製造原価報告書とは、製造業において、1期間の製品の製造にかかった原価（材料費・労務費・製造間接費）の内訳と、当期製品製造原価の計算過程をまとめて示す書類です。P/Lの売上原価の計算に使われます。' },
  { no:24, q:'貸倒引当金や減価償却累計額のように、対応する資産の帳簿価額を直接書き換えず、資産の下に△（マイナス）として別掲し、差し引きで正味の価値を示す項目を何という？', ans:'評価勘定（控除項目）', reason:'評価勘定（控除項目）とは、貸倒引当金や減価償却累計額のように、対応する資産の帳簿価額を直接書き換えるのではなく、資産の下に△（マイナス）として別掲し、差し引きで正味の価値を示すための項目です。' },

function toggleSecTabs(){
  const wrap = document.getElementById('sec-tabs-wrap');

function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

    exp:'「取得関連費用」とは、M&A（会社を買うこと）のときに払う、弁護士や会計士への相談料・仲介手数料のことです。家を買うときの仲介手数料や司法書士報酬が「家そのものの価値」ではなく「取引の手続き費用」であるのと同じで、会計のルールでは「S社株式の値段（取得原価）には含めず、払った期の費用として処理する」と決められています。理由は、この費用は「株式そのものの価値」ではなく「取引を成立させるための事務コスト」だからです。仕訳は普通の経費の支払いと同じで、「支払手数料（費用）／現金（資産の減少）」となります。'
  },
  { id:727, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の土地は帳簿価額500,000円であるが、<mark class="q-asset">支配獲得時の時価は650,000円であった</mark>。子会社の資産を時価評価する連結修正仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Subsidiary S\'s land has a book value of ¥500,000 but a fair value of ¥650,000 at the date control was obtained. Record the consolidation entry revaluing the subsidiary\'s asset to fair value (ignore tax effects).',
    e:[{d:[['土地',150000]], c:[['評価差額',150000]]}],
    exp:'連結会計では、子会社を「まるごと仲間に迎え入れる」ときに、子会社の資産・負債を「今の本当の価値（時価）」に評価し直すというルールがあります。これを「子会社の資産・負債の時価評価」と言います。土地の場合、帳簿には昔買ったときの値段（500,000円）が残っていますが、まるで中古住宅を今の相場で査定し直すように、今売ったら650,000円になるなら、差額150,000円を「評価差額」という純資産の勘定に計上します。「評価差額」は、後で資本連結（親会社の投資とS社の純資産を相殺する処理）のときに、S社の純資産の一部として扱われます。'
  },
  { id:728, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の土地は帳簿価額500,000円であるが、<mark class="q-asset">支配獲得時の時価は650,000円であった</mark>（<mark class="q-liability">実効税率30％</mark>）。税効果を考慮して子会社の資産を時価評価する連結修正仕訳を示しなさい。',
    en_q:'Same fact pattern as above (land: book ¥500,000, fair value ¥650,000), but now apply a 30% effective tax rate. Record the fair-value revaluation entry including the tax effect.',
    e:[{d:[['土地',150000]], c:[['繰延税金負債',45000],['評価差額',105000]]}],
    exp:'前問に税金の影響を追加したバージョンです。土地の評価差額150,000円は、将来この土地を売却したときに税金がかかる原因になるので、その将来の税金分だけ「繰延税金負債」（将来支払う税金）として先取りで計上します。繰延税金負債：150,000×30％＝45,000円。残りの105,000円（＝150,000－45,000、税引後の正味の評価差額）だけが本当の意味での「評価差額」（純資産）になります。「評価が上がった分、丸ごと得するわけではなく、税金分は差し引いて考える」というのがポイントです。'
  },
  { id:729, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社（支配獲得時の純資産：<mark class="q-equity">資本金500,000円・利益剰余金200,000円・評価差額100,000円</mark>）の<mark class="q-asset">株式80％を700,000円で取得し</mark>支配を獲得した。資本連結（投資と資本の相殺消去）の仕訳を示しなさい。',
    en_q:'Company P acquired 80% of Company S (net assets at acquisition: capital ¥500,000, retained earnings ¥200,000, revaluation surplus ¥100,000) for ¥700,000, gaining control. Record the capital consolidation entry (elimination of the investment against equity).',
    e:[{d:[['資本金',500000],['利益剰余金',200000],['評価差額',100000],['のれん',60000]], c:[['S社株式',700000],['非支配株主持分',160000]]}],
    exp:'資本連結は連結会計の一番の基本作業です。①まずS社の純資産をぜんぶ足します：資本金500,000＋利益剰余金200,000＋評価差額100,000＝800,000円（これが「時価ベースのS社の正味の価値」）。②Ｐ社の取り分（80％）＝640,000円、残り20％は「非支配株主持分」（P社以外の株主の取り分）として160,000円を純資産に計上します。③Ｐ社が払った700,000円と、Ｐ社の取り分640,000円との差額60,000円は「のれん」（S社を高く買った理由＝ブランド力や将来性への対価）として資産計上します。まるで老舗店舗を、看板の価値まで込みで買い取るようなイメージです。'
  },
  { id:730, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式を2段階で取得した。Ｘ1年度末：Ｓ社株式20％を180,000円で取得。Ｘ2年度末：追加でＳ社株式40％を400,000円で取得し、合計60％保有として支配を獲得した。支配獲得時点でのＳ社株式20％（既存保有分）の<mark class="q-asset">時価は200,000円であった</mark>。<mark class="q-revenue">既存投資を時価に評価替えする</mark>仕訳を示しなさい（段階取得）。',
    en_q:'Company P acquired Company S\'s shares in two stages: 20% for ¥180,000 at the end of Year 1, and an additional 40% for ¥400,000 at the end of Year 2 (gaining control with 60% total). At the date control was obtained, the fair value of the previously held 20% was ¥200,000. Record the entry revaluing the existing investment to fair value (step acquisition).',
    e:[{d:[['S社株式',20000]], c:[['段階取得に係る差益',20000]]}],
    exp:'「段階取得」とは、一気に支配株主になるのではなく、少しずつ株を買い増して最終的に子会社化するケースです。まるで少額投資からコツコツ持ち株を増やしていって、ある日ついに筆頭株主になるようなイメージです。この場合、「支配を獲得した瞬間」に、それまで持っていた分（20％）も含めて全部を「今の時価」で評価し直すというルールがあります。以前180,000円で買った20％分が、今では200,000円の価値になっていたので、差額20,000円を「段階取得に係る差益」（連結上の収益）として計上します。'
  },
  { id:731, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式60％を保有し、既に支配している（非支配株主持分40％）。追加で<mark class="q-asset">Ｓ社株式20％を250,000円で取得した</mark>（合計80％保有）。<mark class="q-equity">追加取得時のＳ社純資産は1,000,000円であった</mark>。追加取得の連結修正仕訳を示しなさい。',
    en_q:'Company P already controls Company S with a 60% holding (non-controlling interest 40%). P acquired an additional 20% for ¥250,000 (80% total). S\'s net assets at the time of additional acquisition were ¥1,000,000. Record the consolidation entry for the additional acquisition.',
    e:[{d:[['非支配株主持分',200000],['資本剰余金',50000]], c:[['S社株式',250000]]}],
    exp:'すでに子会社にしている会社の株を「追加で」買い増すケースです。もう支配は獲得済みなので、のれんは新たに計算しません。まるでグループ会社の株を仲間内で融通し合うようなイメージで、非支配株主（他の株主）から株を買い取ることになるので、非支配株主持分のうち買い取った分（Ｓ社純資産1,000,000×20％＝200,000円）を減らします。実際に払った金額250,000円との差額50,000円は、損益ではなく「資本剰余金」（純資産の内訳の一つ）の減少として処理します。「グループ内の株主構成が変わっただけ」なので、儲けや損としては扱わないのがポイントです。'
  },
  { id:732, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社株式80％（取得原価800,000円）を保有している。このうち20％を300,000円で売却した（売却後60％保有・支配は継続）。<mark class="q-equity">売却時のＳ社純資産は1,200,000円</mark>。個別財務諸表上、売却価額300,000円と売却原価200,000円（＝800,000×20/80）の差額100,000円を<mark class="q-revenue">「子会社株式売却益」として計上済みである</mark>。連結修正仕訳を示しなさい。',
    en_q:'Company P holds 80% of Company S (cost ¥800,000). It sold 20% for ¥300,000 (retaining 60%, control continues). S\'s net assets at the time of sale were ¥1,200,000. On P\'s individual financial statements, a ¥100,000 gain (sale price ¥300,000 less cost basis ¥200,000, i.e. 800,000×20/80) was already recorded as "gain on sale of subsidiary shares." Record the consolidation adjusting entry.',
    e:[{d:[['子会社株式売却益',100000],['資本剰余金',140000]], c:[['非支配株主持分',240000]]}],
    exp:'子会社株式を一部だけ売っても、まだ支配が続いている（60％保有で子会社のまま）場合、連結上は「損益」として扱いません。理由は「グループの外に売ったわけではなく、単に株主の内訳（親会社の取り分と非支配株主の取り分）が変わっただけ」だからです。まるで家族経営の会社の株を親戚内でやり取りしただけのようなイメージです。①個別財務諸表で計上した「子会社株式売却益」100,000円は、連結上は取り消します。②非支配株主の取り分は、売った20％分だけ増えます：Ｓ社純資産1,200,000×20％＝240,000円。③この240,000円と、取り消した売却益100,000円との差額140,000円は「資本剰余金」の減少として調整します。'
  },
  { id:733, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社（子会社）に対して<mark class="q-asset">500,000円を貸し付けている</mark>。連結財務諸表を作成するにあたり、この債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P has lent ¥500,000 to subsidiary S. When preparing consolidated financial statements, record the entry eliminating this intercompany receivable/payable.',
    e:[{d:[['借入金',500000]], c:[['貸付金',500000]]}],
    exp:'連結財務諸表は「グループ全体を1つの会社」として見た財務諸表です。Ｐ社が貸してＳ社が借りたお金は、グループの外から見れば「自分の左のポケットから右のポケットにお金を移しただけ」で、実質的な貸し借りはありません。そこでＰ社の「貸付金」（資産）とＳ社の「借入金」（負債）を、金額をぶつけ合って両方ともゼロにします。この作業を「連結上の相殺消去」と呼びます。'
  },
  { id:734, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'上記の貸付金に対応する利息について、Ｐ社は<mark class="q-revenue">受取利息20,000円</mark>、Ｓ社は<mark class="q-expense">支払利息20,000円</mark>をそれぞれ計上している。連結財務諸表を作成するにあたり、この収益・費用を相殺消去する仕訳を示しなさい。',
    en_q:'For the loan above, P recorded interest income of ¥20,000 and S recorded interest expense of ¥20,000. When preparing consolidated financial statements, record the entry eliminating this intercompany revenue/expense.',
    e:[{d:[['受取利息',20000]], c:[['支払利息',20000]]}],
    exp:'前問の貸付金・借入金とセットで発生する利息も同じ考え方です。Ｐ社が受け取った利息（収益）とＳ社が支払った利息（費用）は、グループ全体で見れば「グループ内でお金が動いただけ」で、外部から見た本当の収益・費用ではありません。まるで家族間でお小遣いを貸し借りしても、家計全体としては何も増えていないのと同じで、そこで「受取利息」と「支払利息」を相殺してゼロにします。貸付金・借入金の元本だけでなく、そこから生まれる利息も必ずセットで消去する、と覚えておきましょう。'
  },
  { id:735, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｐ社はＳ社へ<mark class="q-asset">現金100,000円を送金した</mark>が、決算日時点でＳ社側では未処理（未達）であった。①Ｓ社側で未達取引を整理する仕訳（<mark class="q-liability">借入金として処理</mark>）②その後、債権債務を相殺消去する仕訳を示しなさい。',
    en_q:'Company P remitted ¥100,000 cash to subsidiary S, but as of the balance sheet date, S had not yet recorded the receipt (in transit). Record ①the entry on S\'s books to recognize the in-transit item (as a loan payable) and ②the subsequent elimination of the intercompany receivable/payable.',
    e:[{d:[['現金',100000]], c:[['借入金',100000]]}, {d:[['借入金',100000]], c:[['貸付金',100000]]}],
    exp:'「未達取引」とは、親会社は送金の記録をつけたのに、子会社側の帳簿にまだその入金が反映されていない状態のことです（銀行の処理が決算日をまたいでしまった、などが原因）。振込がまだ相手の通帳に記帳されていない「タイムラグ」のようなイメージです。このままでは相殺消去（貸付金と借入金をぶつけ合う作業）がうまくできないので、①まずＳ社側の帳簿を「本来あるべき状態」に修正します（現金を受け取った記録を追加）。②その上で、Ｐ社の「貸付金」とＳ社の「借入金」を相殺消去します。「相殺消去の前に、まず両社の帳簿の金額を一致させる」というのがこの処理のポイントです。'
  },
  { id:736, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社、Ｐ社持分80％）は<mark class="q-expense">原価80,000円の商品をＰ社に100,000円で販売した</mark>。<mark class="q-asset">期末にＰ社の在庫にこの商品が全量残っている</mark>。①未実現利益の消去②非支配株主持分への按分の仕訳を示しなさい（<strong>アップストリーム取引</strong>）。',
    en_q:'Subsidiary S (80% owned by P) sold goods costing ¥80,000 to P for ¥100,000. All of these goods remain in P\'s ending inventory. Record ①the elimination of unrealized profit and ②the allocation to non-controlling interests (upstream transaction).',
    e:[{d:[['売上原価',20000]], c:[['棚卸資産',20000]]}, {d:[['非支配株主持分',4000]], c:[['非支配株主に帰属する当期純利益',4000]]}],
    exp:'「アップストリーム」とは、子会社（Ｓ社）から親会社（Ｐ社）へ商品が流れる取引のことです（逆に親会社→子会社は「ダウンストリーム」）。①Ｓ社が乗せた利益20,000円（＝100,000－80,000）は、Ｐ社の在庫にまだ残っている＝グループ外にまだ売れていないので、「未実現利益」として消去します（売上原価を増やして在庫の評価を下げる）。まるでグループ内でぐるぐる回っているだけの商品にまだ「本当の儲け」を認めないイメージです。②アップストリームの場合、この利益はもともと「Ｓ社の利益」なので、非支配株主（Ｓ社の他の株主）にも一部負担してもらう必要があります。非支配株主の負担分：20,000×20％＝4,000円。この4,000円分だけ、非支配株主の取り分（非支配株主持分）を減らします。ダウンストリーム（親→子）の場合はこの按分は行わない点が違いです。'
  },
  { id:737, level:2, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社）の<mark class="q-equity">当期純利益は500,000円であった（Ｐ社持分80％、非支配株主持分20％）</mark>。非支配株主に帰属する当期純利益を非支配株主持分に振り替える仕訳を示しなさい。',
    en_q:'Subsidiary S\'s net income for the period was ¥500,000 (P holds 80%, non-controlling interest 20%). Record the entry allocating the non-controlling interests\' share of net income to non-controlling interests.',
    e:[{d:[['非支配株主に帰属する当期純利益',100000]], c:[['非支配株主持分',100000]]}],
    exp:'子会社が稼いだ利益は、親会社の取り分だけでなく、非支配株主（他の株主）の取り分もあります。Ｓ社の当期純利益500,000円のうち、非支配株主の持分割合20％にあたる100,000円は、連結損益計算書上「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）を増やします。まるでグループ全体の利益をケーキのように切り分けて、それぞれの株主の皿に配るイメージです。「子会社の儲けのうち、親会社の分は親会社の利益剰余金へ、他の株主の分は非支配株主持分へ」と、取り分に応じて分けます。'
  },
  { id:738, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'Ｓ社（子会社、Ｐ社持分80％）が保有する<mark class="q-equity">その他有価証券に評価益50,000円が生じた</mark>（税効果は考慮しない）。連結上、この評価差額のうち非支配株主に帰属する部分を非支配株主持分に振り替える仕訳を示しなさい。',
    en_q:'Subsidiary S (80% owned by P) recognized a ¥50,000 unrealized gain on available-for-sale securities (ignore tax effects). Record the entry allocating the non-controlling interests\' share of this valuation gain to non-controlling interests.',
    e:[{d:[['その他有価証券評価差額金',10000]], c:[['非支配株主持分',10000]]}],
    exp:'子会社が保有する有価証券の評価差額（純資産直入項目）も、当期純利益と同じように、親会社と非支配株主で取り分を分ける必要があります。評価益50,000円のうち非支配株主の持分20％にあたる10,000円は、非支配株主持分（純資産）へ振り替えます。「損益計算書を通らない純資産の変動（評価差額など）も、当期純利益と同じ考え方で持分割合に応じて按分する」というのがポイントです。'
  },
  { id:739, level:3, cat:'連結会計', chap:'1級：連結会計',
    q:'前期末に資本連結仕訳（<mark class="q-equity">資本金400,000円・利益剰余金100,000円</mark>・<mark class="q-asset">のれん50,000円</mark>／<mark class="q-asset">Ｓ社株式450,000円</mark>・<mark class="q-equity">非支配株主持分100,000円</mark>）を行った。前期中、<mark class="q-asset">のれん償却5,000円</mark>・<mark class="q-equity">非支配株主に帰属する前期純利益15,000円</mark>が発生した。当期首の開始仕訳（前期末までの純資産の動きを反映したもの）を示しなさい。',
    en_q:'At the end of last period, a capital consolidation entry was recorded (capital ¥400,000, retained earnings ¥100,000, goodwill ¥50,000 / S shares ¥450,000, non-controlling interests ¥100,000). During last period, goodwill amortization of ¥5,000 and non-controlling interests\' share of last period\'s net income of ¥15,000 occurred. Record this period\'s opening entry, reflecting the cumulative effect through the end of last period.',
    e:[{d:[['資本金',400000],['利益剰余金当期首残高',120000],['のれん',45000]], c:[['S社株式',450000],['非支配株主持分',115000]]}],
    exp:'連結の仕訳は、個別財務諸表（Ｐ社・Ｓ社それぞれの帳簿）には一切記録されません。そのため、連結精算表を作るたびに「過去に行った連結修正を最初からもう一度全部やり直す」必要があります。これを「開始仕訳」と呼びます。まるで毎年新しい白紙のノートに、過去の記録をすべて書き写し直す作業のようなものです。前期末の資本連結仕訳をベースに、①のれん償却5,000円（費用なので利益剰余金を減らす）②非支配株主に帰属する前期純利益15,000円（非支配株主持分を増やす）の2つの累積効果を反映させます。過去分の損益の動きは、当期の損益計算書には出せないので、代わりに「利益剰余金当期首残高」という純資産の勘定にまとめて計上します：100,000＋5,000（のれん償却の累積）＋15,000（非支配株主帰属利益の累積）＝120,000円。のれんは償却済みの5,000円を差し引いて45,000円、非支配株主持分は15,000円増えて115,000円になります。'
  },

  // ===== 1級：企業結合・事業分離 =====
  { id:740, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、<mark class="q-equity">Ｓ社株主にＰ社株式100株（1株当たり時価8,000円）を交付した</mark>。合併により引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産2,000,000円</mark>・<mark class="q-liability">諸負債1,300,000円</mark>であった。合併の仕訳を示しなさい（増加する資本金は全額資本金とする）。',
    en_q:'Company P absorbed Company S in a merger, issuing 100 P shares (fair value ¥8,000 each) to S\'s shareholders. The fair values of S\'s assets and liabilities taken over were: assets ¥2,000,000, liabilities ¥1,300,000. Record the merger entry (the full increase is credited to Capital).',
    e:[{d:[['諸資産',2000000],['のれん',100000]], c:[['諸負債',1300000],['資本金',800000]]}],
    exp:'合併の会計処理（パーチェス法）は、Ｓ社を「時価で丸ごと買った」と考えて処理します。まるで老舗の店を看板ごと買収するイメージです。対価（取得原価）＝交付した株式の時価：100株×8,000円＝800,000円。引き継いだ純資産（時価）：諸資産2,000,000－諸負債1,300,000＝700,000円。対価800,000円の方が引き継いだ純資産700,000円より高いので、差額100,000円は「のれん」（ブランド力や将来の収益力に対して余分に払った分）として資産計上します。'
  },
  { id:741, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、<mark class="q-equity">Ｓ社株主にＰ社株式50株（1株当たり時価6,000円）を交付した</mark>。合併により引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産1,500,000円</mark>・<mark class="q-liability">諸負債1,000,000円</mark>であった。合併の仕訳を示しなさい。',
    en_q:'Company P absorbed Company S, issuing 50 P shares (fair value ¥6,000 each). Fair values taken over: assets ¥1,500,000, liabilities ¥1,000,000. Record the merger entry.',
    e:[{d:[['諸資産',1500000]], c:[['諸負債',1000000],['資本金',300000],['負ののれん発生益',200000]]}],
    exp:'対価（取得原価）：50株×6,000円＝300,000円。引き継いだ純資産（時価）：1,500,000－1,000,000＝500,000円。今回は対価300,000円より引き継いだ純資産500,000円の方が大きい、つまり「バーゲンセールでお買い得に買えた」状態です。この差額200,000円は「負ののれん発生益」として、その期の収益に一括計上します（のれんとは逆で、資産にはせず、すぐに利益にする点に注意）。'
  },
  { id:742, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社の発行済株式全部（100％）を取得し、完全親子会社関係を創設する株式交換を行った。対価としてＰ社株式を交付し、<mark class="q-asset">Ｓ社の時価純資産は900,000円であった</mark>。Ｐ社（完全親会社）の個別財務諸表上、Ｓ社株式の取得原価を計上する仕訳を示しなさい（資本金を全額計上する）。',
    en_q:'Company P acquired 100% of Company S\'s shares via a share exchange, creating a wholly-owned parent-subsidiary relationship, issuing P shares as consideration. S\'s fair value net assets were ¥900,000. On P\'s (the wholly-owning parent\'s) individual financial statements, record the entry recognizing the cost of the S shares (crediting the full amount to Capital).',
    e:[{d:[['S社株式',900000]], c:[['資本金',900000]]}],
    exp:'株式交換は、合併のように会社そのものが1つになるわけではなく、「Ｓ社の株を全部Ｐ社の株と交換して、Ｓ社をＰ社の100％子会社にする」手続きです。まるでグループ会社に迎え入れる養子縁組のようなイメージで、合併と違い、Ｓ社の資産・負債を直接Ｐ社の帳簿に受け入れるのではなく、Ｐ社の個別財務諸表上は「Ｓ社株式」という投資（資産）を計上するだけにとどまります。Ｓ社の資産・負債は、後で連結財務諸表を作るときに合算されます。'
  },
  { id:743, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社とＳ社は株式移転により、共同で新設完全親会社Ｈ社を設立した。Ｈ社の個別財務諸表上、<mark class="q-asset">Ｐ社株式（時価1,200,000円）とＳ社株式（時価800,000円）を取得原価として計上し</mark>、<mark class="q-equity">資本金を全額計上する</mark>仕訳を示しなさい。',
    en_q:'Companies P and S jointly established a new wholly-owning parent company H via a share transfer. On H\'s individual financial statements, record the entry recognizing the cost of the P shares (fair value ¥1,200,000) and S shares (fair value ¥800,000) received, crediting the full amount to Capital.',
    e:[{d:[['P社株式',1200000],['S社株式',800000]], c:[['資本金',2000000]]}],
    exp:'株式移転は、既存の会社（Ｐ社・Ｓ社）ではなく、まったく新しい会社（Ｈ社）を作って、その新会社の下にＰ社とＳ社を完全子会社としてぶら下げる手続きです。まるで2つの会社が結婚して、新しい「持株会社」という名字の下に入るようなイメージです。株式交換が「既存の会社同士」で行うのに対し、株式移転は「新会社を作る」点が違います。新設されたＨ社の個別財務諸表には、Ｐ社株式とＳ社株式という2つの投資（資産）が計上され、対応する金額が資本金になります。'
  },
  { id:744, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業部門（時価：<mark class="q-asset">資産1,500,000円</mark>・<mark class="q-liability">負債800,000円</mark>）を吸収分割によりＳ社へ移転し、対価として<mark class="q-asset">Ｓ社株式700,000円を受け取った</mark>。Ｐ社（分割会社）の仕訳を示しなさい。',
    en_q:'Company P transferred one of its business segments (fair value: assets ¥1,500,000, liabilities ¥800,000) to Company S via a company split, receiving S shares worth ¥700,000 as consideration. Record the entry on P\'s (the splitting company\'s) books.',
    e:[{d:[['諸負債',800000],['S社株式',700000]], c:[['諸資産',1500000]]}],
    exp:'会社分割は「事業（資産と負債のセット）を丸ごと他社へ渡す」手続きです。まるで会社の一部門をパッケージごと引っ越しさせるイメージで、渡す側（分割会社＝Ｐ社）は、移転する資産・負債を帳簿から取り除き、代わりに受け取った対価（Ｓ社株式）を計上します。移転する純資産（時価）：1,500,000－800,000＝700,000円。今回は対価700,000円とちょうど同額なので、差益・差損は生じません。'
  },
  { id:745, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｓ社は、Ｐ社の一事業部門（時価：<mark class="q-asset">資産1,500,000円</mark>・<mark class="q-liability">負債800,000円</mark>）を吸収分割により承継し、対価として<mark class="q-equity">Ｓ社株式700,000円をＰ社に交付した</mark>。Ｓ社（承継会社）の仕訳を示しなさい（増加する資本金は全額資本金とする）。',
    en_q:'Company S received a business segment from Company P (fair value: assets ¥1,500,000, liabilities ¥800,000) via a company split, issuing S shares worth ¥700,000 to P as consideration. Record the entry on S\'s (the receiving company\'s) books (the full increase is credited to Capital).',
    e:[{d:[['諸資産',1500000]], c:[['諸負債',800000],['資本金',700000]]}],
    exp:'前問の「渡す側」に対して、こちらは「受け取る側」（承継会社＝Ｓ社）の仕訳です。まるで引っ越してきた事業部門を新居に迎え入れるようなイメージで、受け入れた資産・負債をそのまま計上し、対価として交付した自社株式の分だけ資本金を増やします。合併の仕訳とよく似ていますが、合併は「会社そのもの」を丸ごと受け入れるのに対し、会社分割は「特定の事業だけ」を切り出して受け入れる点が違います。'
  },
  { id:746, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は自社の一事業（帳簿価額：<mark class="q-asset">資産2,000,000円</mark>・<mark class="q-liability">負債1,200,000円</mark>）を、Ｓ社へ事業譲渡し、対価として<mark class="q-asset">現金900,000円を受け取った</mark>。<mark class="q-revenue">事業譲渡益（または損）</mark>を含めた仕訳を示しなさい。',
    en_q:'Company P sold one of its businesses (book value: assets ¥2,000,000, liabilities ¥1,200,000) to Company S for ¥900,000 cash. Record the entry, including the gain (or loss) on the business sale.',
    e:[{d:[['諸負債',1200000],['現金',900000]], c:[['諸資産',2000000],['事業譲渡益',100000]]}],
    exp:'事業譲渡は、株式のやり取りではなく「現金など」を対価とする点が会社分割と違います（会社分割は原則株式が対価、事業譲渡は現金などの財産が対価）。まるで会社の一部門を丸ごと現金で売却するイメージです。譲渡する事業の帳簿価額（純資産）：2,000,000－1,200,000＝800,000円。受け取った現金900,000円との差額100,000円は「事業譲渡益」（収益）として計上します。'
  },
  { id:747, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｓ社はＰ社から一事業（時価：<mark class="q-asset">資産2,200,000円</mark>・<mark class="q-liability">負債1,200,000円</mark>）を事業譲受し、対価として<mark class="q-asset">現金900,000円を支払った</mark>。<mark class="q-revenue">負ののれん</mark>を含めた仕訳を示しなさい。',
    en_q:'Company S acquired a business from Company P (fair value: assets ¥2,200,000, liabilities ¥1,200,000), paying ¥900,000 cash as consideration. Record the entry, including any negative goodwill.',
    e:[{d:[['諸資産',2200000]], c:[['諸負債',1200000],['現金',900000],['負ののれん発生益',100000]]}],
    exp:'事業を譲り受ける側（Ｓ社）の仕訳です。受け入れる純資産（時価）：2,200,000－1,200,000＝1,000,000円。支払った対価は900,000円で、受け入れた純資産の方が100,000円多いので「お買い得」＝負ののれん発生益（収益）を計上します。事業譲渡・会社分割・合併のどれでも、「対価＜受け入れた純資産」なら負ののれん発生益、「対価＞受け入れた純資産」ならのれん、という判定方法は共通です。'
  },
  { id:748, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社は完全子会社であるＳ社（帳簿価額：<mark class="q-asset">諸資産1,000,000円</mark>・<mark class="q-liability">諸負債600,000円</mark>）を吸収合併した。共通支配下の取引に該当するため、Ｓ社の資産・負債は帳簿価額で引き継ぐ。合併の仕訳を示しなさい（増加する資本金はゼロとし、<mark class="q-equity">差額はその他資本剰余金とする</mark>）。',
    en_q:'Company P absorbed its wholly-owned subsidiary S (book values: assets ¥1,000,000, liabilities ¥600,000) in a merger. As this is a transaction under common control, S\'s assets and liabilities are carried over at book value. Record the merger entry (no increase to Capital; the difference is credited to Other Capital Surplus).',
    e:[{d:[['諸資産',1000000]], c:[['諸負債',600000],['その他資本剰余金',400000]]}],
    exp:'すでに100％子会社になっている会社を合併する場合は「グループ内部の組織再編」に過ぎず、グループ外の視点では何も変わっていません（これを「共通支配下の取引」と言います）。まるで同じ家族の中で引っ越し作業をするようなもので、そのため、通常の合併のように時価評価をしたり、のれんを計算したりはせず、Ｓ社の資産・負債を帳簿価額のまま、そっくりそのままＰ社に移すだけです。差額（1,000,000－600,000＝400,000円）は「のれん」ではなく「その他資本剰余金」として処理します。「グループ内の引っ越しなので、儲け・損は発生しない」というイメージです。'
  },
  { id:749, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併するにあたり、<mark class="q-asset">新株の交付事務費用（印刷費・証券会社手数料等）80,000円を現金で支払った</mark>。株式交付費として計上する仕訳を示しなさい。',
    en_q:'In connection with absorbing Company S, Company P paid ¥80,000 cash for share-issuance administrative costs (printing, brokerage fees, etc.). Record the entry recognizing this as share issuance costs.',
    e:[{d:[['株式交付費',80000]], c:[['現金',80000]]}],
    exp:'合併や増資で新しく株式を発行するときにかかる事務費用（印刷代・証券会社への手数料など）は「株式交付費」という勘定で処理します。まるで結婚式の招待状印刷代のような事務コストです。似た名前の「取得関連費用」（弁護士・会計士への相談料）は必ずその場で費用にしますが、株式交付費は一定の要件のもとで資産計上して数年かけて償却することも認められています。「M&Aの相談料」と「株式発行の事務費用」は名前は似ていますが別物、と覚えておきましょう。'
  },
  { id:800, level:2, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併するにあたり、<mark class="q-expense">デューデリジェンス費用（弁護士・公認会計士への報酬）50,000円を</mark>、<mark class="q-asset">現金で支払った</mark>。取得関連費用の会計処理として、発生時に費用処理する仕訳を示しなさい。',
    en_q:'In connection with absorbing Company S, Company P paid ¥50,000 cash for due diligence fees (legal and accounting advisory fees). Record the entry expensing these acquisition-related costs as incurred.',
    e:[{d:[['支払手数料',50000]], c:[['現金',50000]]}],
    exp:'企業結合にかかる取得関連費用（デューデリジェンス費用、アドバイザリー報酬など）は、取得原価（のれんの計算に含める金額）には含めず、発生した期の費用として処理します。まるで家を買うときの不動産鑑定料や司法書士報酬のような手続きコストです。「のれんは買収対象そのものの価値に対して払った超過額であり、手続きにかかった事務コストとは性質が違う」という考え方です。前問（株式交付費）とは異なる勘定科目（支払手数料）を使う点に注意しましょう。'
  },
  { id:801, level:3, cat:'企業結合', chap:'1級：企業結合・事業分離',
    q:'Ｐ社はＳ社を吸収合併し、対価として<mark class="q-asset">現金600,000円</mark>に加え、Ｓ社の将来の業績目標達成を条件とする<mark class="q-liability">条件付取得対価（アーンアウト、公正価値50,000円）を計上した</mark>。引き継いだＳ社の資産・負債の時価は、<mark class="q-asset">諸資産900,000円</mark>・<mark class="q-liability">諸負債300,000円</mark>であった。合併時の仕訳を示しなさい。',
    en_q:"Company P absorbed Company S, paying ¥600,000 cash plus recognizing a contingent consideration (earnout, fair value ¥50,000) payable if S meets future performance targets. Fair values taken over: assets ¥900,000, liabilities ¥300,000. Record the merger entry.",
