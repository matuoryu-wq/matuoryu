    { term:'貢献利益', en:'Contribution Margin', def:'<strong>売上高から変動費だけを引いた利益</strong>です。「変動費を回収した後、固定費の回収と利益の獲得にあてられる金額」です。貢献利益 ÷ 売上高 ＝ 貢献利益率（限界利益率）。', def_en:'<strong>Sales Revenue minus Variable Costs</strong>. Represents "the amount available to cover fixed costs and generate profit after variable costs are recovered." Contribution Margin Ratio = Contribution Margin ÷ Sales.' },
    { term:'直接原価計算', en:'Variable Costing', def:'<strong>変動製造原価だけを製品原価に含め、固定製造原価は発生した期の費用として即時計上</strong>する方法です。利益が在庫量に左右されにくく、意思決定（追加受注など）に役立ちます。財務報告では使えません。', def_en:'<strong>Includes only variable manufacturing costs in product cost</strong>; fixed manufacturing overhead is expensed immediately in the period incurred. Profit is less affected by inventory changes, making it useful for internal decision-making. Not permitted for external financial reporting.' },
    { term:'全部原価計算', en:'Absorption Costing', def:'<strong>固定費・変動費を問わず、すべての製造原価を製品原価に含める</strong>方法です。財務会計（外部報告）では全部原価計算が義務づけられています。直接原価計算と営業利益が異なる理由は在庫に固定費が含まれるかどうかの違いです。', def_en:'<strong>Includes ALL manufacturing costs — both variable and fixed — in product cost</strong>. Required for external financial reporting. Operating profit differs from variable costing because fixed overhead is embedded in inventory under this method.' },
    { term:'固定費調整', en:'Fixed Cost Adjustment', def:'直接原価計算の営業利益を全部原価計算の営業利益に合わせる計算です。<strong>直接原価計算利益 ＋（期末在庫×固定費率）－（期首在庫×固定費率）＝ 全部原価計算利益</strong>となります。', def_en:'Reconciles variable costing profit to absorption costing profit: <strong>Variable Costing Profit + (Ending Inventory × Fixed Cost Rate) − (Beginning Inventory × Fixed Cost Rate) = Absorption Costing Profit</strong>.' },
    { term:'製造原価報告書', en:'Cost of Production Report', def:'当期の<strong>材料費・労務費・製造間接費の内訳と当期製品製造原価を示す報告書</strong>です。損益計算書の「売上原価」に使う「当期製品製造原価」の計算過程を示す内訳書です。', def_en:'A report showing the <strong>breakdown of manufacturing costs (materials, labor, overhead) and the total cost of goods manufactured for the period</strong>. It is the supporting schedule for the "Cost of Goods Sold" line on the income statement.' },
    { term:'当期製品製造原価', en:'Cost of Goods Manufactured', def:'当期に<strong>完成した製品にかかった原価の合計</strong>です。計算式：期首仕掛品原価 ＋ 当期総製造費用 − 期末仕掛品原価。損益計算書の売上原価の計算に使います。', def_en:'The <strong>total manufacturing cost of products completed during the period</strong>. Formula: Beginning WIP + Total Manufacturing Costs − Ending WIP. Used to calculate Cost of Goods Sold on the income statement.' },
    { term:'完成品換算量', en:'Equivalent Units', def:'総合原価計算で<strong>仕掛品（半製品）を完成品に換算した仮想の数量</strong>です。例：進捗度50%の仕掛品100個は完成品換算量50個。加工費は進捗度で換算し、材料費は投入タイミングで扱いが異なります。', def_en:'In process costing, the <strong>hypothetical number of "complete" units that WIP is equivalent to</strong>. Example: 100 units at 50% completion = 50 equivalent units. Conversion costs use the percentage-complete rate; direct materials depend on when they are added to the process.' },
    { term:'月末仕掛品の評価', en:'Valuation of WIP (End)', def:'総合原価計算で期末に残る仕掛品に原価を割り当てる計算です。<strong>平均法</strong>（全体の平均単価で均等配分）と<strong>先入先出法</strong>（先に着手した分が先に完成とみなす）の2方法があります。', def_en:'Assigns costs to ending WIP inventory in process costing. Two methods: <strong>Weighted-Average</strong> (distributes all costs evenly at a single average cost per equivalent unit) and <strong>FIFO</strong> (treats the earliest work-in-process as the first to be completed).' },
    { term:'等級別総合原価計算', en:'Grade-based Process Costing', def:'同じ工程で<strong>サイズ・品質が異なる等級品（Sサイズ・Mサイズ等）</strong>を生産するときの原価計算です。等価係数（品質・サイズに応じた重み）を掛けた積数で各等級に原価を配分します。', def_en:'Used when a single process produces <strong>products of different grades (e.g., S, M, L sizes)</strong>. Total costs are distributed among grades using "equivalence coefficients" that reflect the relative weight or quality of each grade.' },
    { term:'組別総合原価計算', en:'Batch Process Costing', def:'同じ工場で<strong>種類の異なる複数の製品（組）を同時生産</strong>するときの原価計算です。直接費は各組へ直接計上し、間接費は配賦基準で各組に割り振ります。', def_en:'Used when a single factory simultaneously produces <strong>multiple distinct product types (batches)</strong>. Direct costs are charged directly to each batch; overhead is allocated to each batch using a predetermined allocation base.' },
    { term:'度外視法', en:'Ignore Method (Normal Spoilage)', def:'総合原価計算で、製造工程で避けられない失敗品（<strong>正常仕損</strong>）を計算上「無視（度外視）」して処理する方法です。仕損品のコストを個別計算せず、<strong>完成品や月末仕掛品の原価に自動的に上乗せ（吸収）</strong>させます。「正常な失敗はコストの一部」という考え方で、計算がシンプルです。覚え方：「度外視＝存在しなかったことにして計算する」。', def_en:'In process costing, treats normal spoilage as invisible by spreading its cost across good output (completed units and ending WIP) without separately computing it. The idea: "normal failure is just part of the production cost." Simpler to apply than the explicit method.' },
    { term:'非度外視法', en:'Explicit Method (Normal Spoilage)', def:'総合原価計算で、正常仕損の原価を<strong>明示的に計算して完成品・月末仕掛品に正確に配分する方法</strong>です。仕損が発生した工程の進捗度（仕損点）によって、「完成品だけが負担」するか「仕掛品も一緒に負担」するかが決まります。度外視法より計算は複雑ですが、コストの所在がより明確になります。', def_en:'Explicitly calculates the cost of normal spoilage and allocates it to completed units and/or ending WIP. Whether ending WIP shares in the spoilage cost depends on the "spoilage point" (where in the process spoilage occurs). More complex than the ignore method but provides more precise cost assignment.' },
    { term:'前工程費', en:'Prior Process Cost', def:'複数の工程を順番に経て製品を作る「<strong>工程別総合原価計算</strong>」で使う概念です。前の工程で製造した半製品を次の工程の「材料」として受け入れるとき、<strong>前工程でかかった全コストをまとめて「前工程費」として次工程の仕掛品原価に加えます</strong>。前工程費は「工程開始時点で100%投入済み」として扱うため、進捗度に関係なく全量を対象に計算します。', def_en:'In multi-stage (process-by-process) costing, the cumulative manufacturing cost transferred from the prior process becomes "Prior Process Cost" in the current process. When semi-finished goods from Process 1 enter Process 2 as its input material, all Process 1 costs are lumped into this category. Prior process cost is treated as 100% complete at the start of the new process, regardless of the overall completion percentage.' },
  ]},
  { category:'⑯ 特殊商品売買・収益認識', items:[
    { term:'収益認識基準', en:'Revenue Recognition Standard', def:'<mark>「履行義務を充足したとき（約束した財・サービスを顧客に移転したとき）に収益を計上する」</mark>という新しいルール（ASC606/IFRS15準拠）です。契約→履行義務の識別→取引価格の配分→収益計上の5ステップで処理します。', def_en:'A standard requiring revenue to be recognized when a performance obligation is satisfied (i.e., when the promised good or service is transferred to the customer). Follows a 5-step model: (1) identify the contract, (2) identify performance obligations, (3) determine the transaction price, (4) allocate the price, (5) recognize revenue.' },
    { term:'履行義務', en:'Performance Obligation', def:'顧客との契約で<strong>財またはサービスを移転する約束</strong>です。収益認識では「履行義務が充足された時点」で収益を計上します。一時点での充足（商品引渡し）と一定期間での充足（サービス提供）があります。', def_en:'A promise in a contract to transfer a distinct good or service to a customer. Revenue is recognized when (or as) each obligation is satisfied — either at a single point in time (e.g., product delivery) or over a period of time (e.g., ongoing service provision).' },
    { term:'委託販売', en:'Consignment Sales', def:'商品を第三者（受託者）に預けて<strong>代わりに販売してもらう取引</strong>です。委託者は売上計上を「受託者が実際に売った時点」まで遅らせます。売れ残りは委託者（預けた側）の資産として残ります。', def_en:'An arrangement where the owner (consignor) entrusts goods to a third party (consignee) to sell on their behalf. The consignor recognizes revenue only when the consignee sells the goods; unsold items remain as the consignor\'s inventory.' },
    { term:'受託販売', en:'Sales on Consignment', def:'<strong>他者（委託者）から預かった商品を代わりに販売する</strong>取引です。受託者は販売代金を自社の収益にせず委託者に渡し、<strong>受取手数料だけを収益</strong>として計上します。', def_en:'The act of selling goods on behalf of another party (the consignor). The consignee does not record the sales proceeds as its own revenue — it remits them to the consignor and recognizes only the commission fee as income.' },
    { term:'試用販売', en:'Trial Sales (Sale on Approval)', def:'顧客に商品を試しに使ってもらい、<strong>「買う」という意思表示があったときに売上を計上</strong>する方法です。試用期間中は「試送品（資産）」として記録し、承諾時に売上・売掛金に振り替えます。', def_en:'A sales method where goods are given to a customer on a trial basis; revenue is recognized only when the customer formally agrees to purchase. During the trial period, goods are recorded as "trial shipment inventory" and reclassified to sales upon acceptance.' },
    { term:'割賦販売', en:'Installment Sales', def:'代金を<strong>分割払い（月々払い）で受け取る販売方法</strong>です。現行基準では商品引渡し時点で売上全額を計上します（回収ごとの計上は原則不可）。未回収の分割代金は「割賦売掛金（資産）」で管理します。', def_en:'A sales arrangement where the buyer pays in periodic installments. Under current accounting standards, the full revenue is recognized at the time of delivery (not as each payment is collected). Outstanding installments are tracked as "installment accounts receivable."' },
    { term:'工事契約', en:'Construction Contract', def:'建設・大型設備などの長期工事を会計処理する方法です。<strong>工事進行基準</strong>（進捗率に応じて毎期収益を計上）が原則で、進捗を合理的に見積もれない場合のみ<strong>工事完成基準</strong>（完成時に一括計上）を使います。', def_en:'Accounting for long-term construction or large-scale engineering projects. The percentage-of-completion method (revenue recognized proportionally as work progresses) is the standard approach; the completed-contract method (all revenue at completion) is used only when progress cannot be reliably estimated.' },
    { term:'返品権付き販売', en:'Sales with Right of Return', def:'顧客に返品を認めている場合、<strong>返品が見込まれる金額を「返金負債（負債）」として計上</strong>し、その原価相当額を「返品資産（資産）」として計上します。返品が見込まれない分だけを売上収益として認識します。', def_en:'When customers have the right to return goods, the estimated return amount is deferred as a "refund liability" and the corresponding cost is recognized as a "return asset." Only the portion expected to be kept by customers is recorded as revenue.' },
    { term:'収益認識の5ステップ', en:'5-Step Revenue Recognition Model', def:'新収益認識基準（2021年4月施行）の処理手順です。<strong>①契約の識別</strong>（顧客との有効な契約を確認）→<strong>②履行義務の識別</strong>（契約の中で何を約束したか、個別の財・サービスを特定）→<strong>③取引価格の算定</strong>（値引き・リベート・返品・変動対価を考慮した最終的な受取額を見積もる）→<strong>④取引価格の各履行義務への配分</strong>（複数の義務がある場合、独立販売価格の比率で割り振る）→<strong>⑤収益の認識</strong>（各履行義務が充足されたとき、すなわち顧客が財・サービスの支配を得たときに計上）。この5つの順番はそのまま出題されます。', def_en:'The five-step process required by the new revenue recognition standard (effective April 2021): ①Identify the contract → ②Identify performance obligations (what distinct goods/services are promised) → ③Determine the transaction price (net of discounts, rebates, variable consideration) → ④Allocate the price to each obligation based on standalone selling prices → ⑤Recognize revenue as each obligation is satisfied (when the customer obtains control). The order of these steps may be directly tested.' },
    { term:'変動対価', en:'Variable Consideration', def:'契約の最終的な受取金額が<strong>不確かな要素によって変動する対価</strong>のことです。具体例：「目標販売量を達成したら追加ボーナス」「成果に応じたリベート（割戻し）」「返品が来たら代金を減額」など。収益認識では、将来の結果を見越して<strong>最も可能性が高い金額（最頻値法）または期待値</strong>を見積もり、不確実性が解消されるまで収益に含めない部分は「返金負債」などで除外します。', def_en:'Consideration whose amount depends on uncertain future outcomes: performance bonuses, volume rebates, expected returns, discounts, etc. Under revenue recognition standards, estimate the amount using the most likely value (mode method) or expected value (probability-weighted average), and exclude any portion that is highly probable of reversal by recording it as a "refund liability" or similar constraint.' },
  ]},
  { category:'⑰ 外貨換算・為替', items:[
    { term:'外貨建取引', en:'Foreign Currency Transaction', def:'ドル・ユーロなど<strong>外国通貨で行う取引</strong>です。日本の帳簿は円建てで記録するため、取引発生時の為替レートで円換算します。決算時には金銭債権・債務など一部の項目を時価（決算時レート）で評価し直す必要があります。', def_en:'A transaction denominated in a foreign currency (e.g., USD or EUR). Since Japanese books are kept in yen, the foreign amount is converted to yen using the exchange rate at the transaction date. Certain items (monetary assets/liabilities) must be remeasured at the closing rate at year-end.' },
    { term:'直物為替レート', en:'Spot Rate', def:'<strong>その時点でただちに外貨を交換するレート</strong>です。取引発生時・決算時の換算に使います。種類として「TTM（仲値）」「TTS（銀行が外貨を売るレート）」「TTB（銀行が外貨を買うレート）」があります。', def_en:'The exchange rate for immediate currency conversion. Used to record transactions on the transaction date and to remeasure items at year-end. Common variants: TTM (mid-rate), TTS (selling rate, when the bank sells foreign currency to you), TTB (buying rate, when the bank buys foreign currency from you).' },
    { term:'取引発生時レート', en:'Historical Rate', def:'外貨建て取引が発生した時点の為替レートです。<strong>外貨建て資産・負債を帳簿に最初に記録するときのレート</strong>で、非貨幣性項目（棚卸資産・固定資産等）はこのレートを期末以降も使い続けます。', def_en:'The exchange rate at the date a foreign currency transaction occurs. Used to initially record the yen amount in the books. For non-monetary items (inventory, fixed assets, etc.), this historical rate is retained at year-end with no remeasurement.' },
    { term:'決算時レート（CR）', en:'Closing Rate', def:'決算日時点の為替レートです。<strong>外貨建ての金銭債権（売掛金・貸付金等）・金銭債務（買掛金等）・有価証券は決算時レートで評価し直し</strong>、帳簿残高との差額を「為替差損益」として計上します。', def_en:'The exchange rate at the balance sheet (closing) date. Monetary assets and liabilities denominated in foreign currencies (e.g., receivables, payables, loans) are remeasured at this rate, and the difference from the recorded amount is recognized as a foreign exchange gain or loss.' },
    { term:'為替差損益', en:'Foreign Exchange Gain/Loss', def:'外貨建て取引の<strong>発生時レートと決済時（または決算時）レートの差</strong>から生じる損益です。<mark>円高（外貨安）の場合：外貨建て債権は為替差損、外貨建て債務は為替差益になります。</mark>', def_en:'Gains or losses resulting from the difference between the exchange rate when a foreign currency transaction is recorded and the rate when it is settled (or remeasured at year-end). When the yen strengthens: foreign-currency receivables produce a loss; foreign-currency payables produce a gain.' },
    { term:'貨幣性項目・非貨幣性項目', en:'Monetary / Non-monetary Items', def:'外貨換算の区分です。<strong>貨幣性項目（現金・売掛金・買掛金・借入金等）は決算時レートで換算し直し</strong>ます。<strong>非貨幣性項目（棚卸資産・固定資産・前払費用等）は取得時レートを維持</strong>し、換算替えしません。', def_en:'A classification used in foreign currency translation. Monetary items (cash, receivables, payables, loans, etc.) are remeasured at the closing rate each year-end. Non-monetary items (inventory, fixed assets, prepaid expenses, etc.) keep the historical rate and are never remeasured.' },
  ]},
  { category:'⑱ 社債・資金調達', items:[
    { term:'社債の発行', en:'Bond Issuance', def:'会社が資金調達のために<strong>不特定多数の投資家に発行する有価証券（借用証書）</strong>です。定期的に利息（クーポン）を支払い、満期に元本を一括返済します。銀行借入と違い、広く一般投資家から資金を調達できます。帳簿では「社債（負債）」として計上します。', def_en:'Securities issued by a company to raise funds from investors. The issuer pays periodic interest (coupons) and repays the face value at maturity. Unlike bank loans, bonds allow a company to raise money from the general public. Recorded as "Bonds Payable" (a liability) on the balance sheet.' },
    { term:'額面金額', en:'Face Value (Par Value)', def:'社債の<strong>満期に投資家に返済する金額</strong>です。クーポン（利息）はこの額面金額×クーポン利率で計算します。発行時の払込金額（発行価格）と異なることがあり、その差額が「社債割引発行差金」になります。', def_en:'The amount printed on the bond certificate that the issuer must repay at maturity. Coupon interest is calculated as face value × coupon rate. The issue price may differ from the face value; any discount (face value minus issue price) is amortized as additional interest expense over the bond\'s life.' },
    { term:'クーポン', en:'Coupon (Interest)', def:'社債の<strong>定期的な利息支払い</strong>のことです。額面金額×クーポン利率で計算し、半年ごとなど定期的に社債権者へ支払います。支払い時は「社債利息（費用）」として計上します。', def_en:'The periodic interest payment made to bondholders. Calculated as face value × coupon rate, typically paid semi-annually. Recorded as "Bond Interest Expense" when paid. The coupon rate is fixed at issuance and does not change over the bond\'s life.' },
    { term:'割引発行', en:'Discount Issuance', def:'社債を<strong>額面より低い価格で発行</strong>することです。例：額面100円の社債を95円で発行。クーポン利率が市場金利より低い場合などに採用し、投資家に追加の利回りを提供します。差額5円は満期まで毎期「社債利息」として費用計上（償却）します。', def_en:'Issuing bonds at a price below their face value to offer investors a higher effective yield than the coupon rate alone provides. Example: a bond with ¥100 face value issued at ¥95. The ¥5 discount is amortized as additional bond interest expense over the life of the bond.' },
    { term:'社債の償却原価法', en:'Amortized Cost (Bonds Payable)', def:'割引発行した社債の<strong>帳簿価額（簿価）を毎期少しずつ額面に近づけていく方法</strong>です。毎期、未償却差額の一部を「社債利息（費用）」に追加計上し、同額だけ社債（負債）の帳簿価額を増加させます。満期時には帳簿価額＝額面金額になります。', def_en:'A method of gradually increasing the carrying amount of a discounted bond toward its face value over the bond\'s life. Each period, a portion of the discount is recognized as additional bond interest expense, and the bond\'s book value increases by the same amount, reaching face value at maturity.' },
    { term:'端数利息', en:'Accrued Interest', def:'社債・国債等を<strong>利払日と利払日の間に売買した場合に計算する経過利息</strong>です。「前回利払日から売買日までの日数分」の利息で、買い手が売り手に支払います。買い手の帳簿では「有価証券利息（収益）」で処理します。', def_en:'Interest accrued on a bond between the last interest payment date and the date of purchase. The buyer compensates the seller for the portion of the coupon period already elapsed. The buyer records this amount as "Securities Interest Income" (which offsets the next full coupon received).' },
  ]},
  { category:'⑲ 簿記の補足', items:[
    { term:'取引の8要素', en:'8 Elements of Transactions', def:'仕訳の借方・貸方にはそれぞれ4種類、合計8種の要素があります。<strong>借方：①資産↑ ②負債↓ ③純資産↓ ④費用↑ ／ 貸方：⑤資産↓ ⑥負債↑ ⑦純資産↑ ⑧収益↑</strong>。すべての仕訳はこの8要素の組み合わせで成り立ちます。', def_en:'Every journal entry is built from 8 elements (4 per side). Debit side: ①asset increase ②liability decrease ③equity decrease ④expense increase. Credit side: ⑤asset decrease ⑥liability increase ⑦equity increase ⑧revenue increase. Every transaction in double-entry bookkeeping is a combination of these elements.' },
    { term:'決算振替仕訳', en:'Closing Entries', def:'期末に<strong>すべての収益・費用勘定を「損益」勘定へ振り替え、当期純利益を「繰越利益剰余金」へ振り替える仕訳</strong>です。これにより収益・費用勘定はゼロにリセットされ、次期の帳簿が新たにスタートします。', def_en:'Journal entries made at the end of each accounting period to close all revenue and expense accounts into the "Income Summary" account, and then transfer the resulting net income (or loss) to "Retained Earnings." After this process, income statement accounts are reset to zero for the next period.' },
    { term:'損益勘定', en:'Income Summary', def:'決算振替仕訳の際にのみ使う<strong>一時的な中間集計用の勘定科目</strong>です。全収益を借方に集めて消去し、全費用を貸方に集めて消去します。残った差額が当期純利益（または純損失）で、最終的に繰越利益剰余金に振り替えてゼロになります。', def_en:'A temporary account used only during the closing process to aggregate all revenues and expenses. Revenues are transferred in (debited to zero them out) and expenses are transferred in (credited to zero them out); the balance equals net income, which is then closed to Retained Earnings.' },
    { term:'帳簿の締め切り', en:'Closing the Books', def:'期末に<strong>収益・費用勘定をゼロにリセット</strong>し、資産・負債・純資産の残高を翌期に繰り越す作業です。日本では主に<strong>英米式</strong>（損益勘定を経由して繰越利益剰余金に振り替える方法）が使われます。', def_en:'The year-end process of zeroing out all revenue and expense accounts and carrying forward balances of asset, liability, and equity accounts to the next period. In Japan, the Anglo-American method (routing through the Income Summary before closing to Retained Earnings) is the standard approach.' },
    { term:'資本等式', en:'Capital Equation', def:'<strong>「純資産（資本）＝資産－負債」</strong>という等式です。貸借対照表等式「資産＝負債＋純資産」を変形したもので、株主の持ち分（正味財産）を表します。', def_en:'The equation "Equity (Net Assets) = Assets − Liabilities." This is a rearrangement of the balance sheet equation "Assets = Liabilities + Equity" and represents the owners\' net stake in the business.' },
    { term:'損益計算書等式', en:'P/L Equation', def:'<strong>「費用＋当期純利益＝収益」</strong>または「収益－費用＝当期純利益」という等式です。損益計算書の構造の基本で、収益と費用の差が利益を表すことを示しています。', def_en:'The equation "Expenses + Net Income = Revenue," or equivalently "Revenue − Expenses = Net Income." This is the structural foundation of the income statement, showing that profit is the excess of revenue over expenses.' },
    { term:'継続企業の前提', en:'Going Concern', def:'会計では<strong>企業が将来にわたって事業を継続すると仮定</strong>して財務諸表を作成します。この前提が崩れる場合（清算・倒産・事業撤退等）は、資産を時価で評価し直すなど特別な会計処理が必要になります。', def_en:'The fundamental accounting assumption that a business will continue to operate for the foreseeable future. Financial statements are prepared on this basis. If the assumption no longer holds (liquidation, bankruptcy, etc.), assets must be remeasured at current values and different accounting rules apply.' },
  ]},
  { category:'⑳ 連結会計', items:[
    { term:'連結会計', en:'Consolidated Accounting', def:'<strong>親会社と子会社を一つの企業グループとみなして作る財務諸表</strong>の会計手法です。親会社単体の財務諸表とは別に、グループ全体の財務状態・経営成績を表す「連結財務諸表」を作成します。2級では連結会計の基本的な仕組みが問われます。', def_en:'The accounting method for preparing financial statements that treat a <strong>parent company and its subsidiaries as a single economic entity</strong>. In addition to standalone (parent-only) statements, a consolidated set of statements is prepared to show the group\'s overall financial position and results. Level 2 covers the basic mechanics of consolidation.' },
    { term:'連結財務諸表', en:'Consolidated Financial Statements', def:'親会社を頂点とする<strong>企業グループ全体の財務状態・経営成績を一体として示す財務諸表</strong>です。連結貸借対照表・連結損益計算書・連結株主資本等変動計算書・連結キャッシュ・フロー計算書などから構成されます。単体財務諸表と違い、グループ内取引は消去されます。', def_en:'Financial statements that present the <strong>financial position and results of an entire corporate group</strong> (parent + subsidiaries) as if it were a single entity. Comprises a consolidated balance sheet, income statement, statement of changes in equity, and cash flow statement. Intragroup transactions are eliminated.' },
    { term:'支配獲得日', en:'Acquisition Date', def:'親会社が子会社の<strong>支配を獲得した日（議決権の過半数を取得した日等）</strong>のことです。この日の子会社の資産・負債を時価評価し直し、投資額との差額（のれん）を計算します。連結の起点となる重要な日付です。', def_en:'The date on which the parent company acquires <strong>control of the subsidiary</strong> (typically the date >50% of voting rights are obtained). On this date, the subsidiary\'s assets and liabilities are remeasured at fair value, and any excess of the purchase price over fair-value net assets is recognized as goodwill.' },
    { term:'投資と資本の相殺消去', en:'Elimination of Investment vs. Equity', def:'連結修正の基本仕訳で、<strong>親会社の「子会社株式（投資）」と子会社の「資本（純資産）」を相殺消去</strong>します。この消去を行わないと、同じ財産が親会社の投資にも子会社の純資産にも二重計上されてしまいます。差額が「のれん」または「負のれん発生益」になります。', def_en:'The core consolidation entry that <strong>offsets and eliminates the parent\'s "Investment in Subsidiary" against the subsidiary\'s equity (net assets)</strong>. Without this, the same net assets would be double-counted. Any excess of investment cost over fair-value net assets becomes goodwill (or, if below, a bargain purchase gain).' },
    { term:'非支配株主持分', en:'Non-controlling Interests (NCI)', def:'子会社の純資産のうち、<strong>親会社が保有していない外部株主（少数株主）の持ち分</strong>です。例えば親会社が子会社の70%を保有していれば、残り30%が非支配株主持分として連結貸借対照表の純資産の部に表示されます。旧称「少数株主持分」。', def_en:'The portion of a subsidiary\'s net assets attributable to <strong>shareholders outside the corporate group (minority shareholders)</strong>. Example: if the parent owns 70%, the remaining 30% is NCI, shown in the equity section of the consolidated balance sheet. Previously called "minority interest."' },
    { term:'内部取引の相殺消去', en:'Elimination of Intercompany Transactions', def:'グループ内の企業間取引（親会社から子会社への売上・貸付金・受取手形など）を<strong>連結上は取り消す処理</strong>です。グループを一つの企業とみると、内部の売買はただの在庫の移動にすぎないため、収益・費用・債権・債務が重複して計上されないよう消去します。', def_en:'The consolidation adjustment that <strong>eliminates transactions between group companies</strong> (e.g., parent selling to subsidiary, intercompany loans, intercompany receivables/payables). From the group\'s perspective, internal transfers are not real sales — eliminating them prevents double-counting of revenues, expenses, assets, and liabilities.' },
    { term:'未実現利益の消去', en:'Elimination of Unrealized Profits', def:'グループ内企業が互いに商品・固定資産を売買したとき、<strong>まだ外部に販売されていない利益（未実現利益）を消去</strong>する処理です。例えば親会社が子会社に原価100円の商品を150円で売り、子会社がまだ販売していなければ50円の未実現利益を消去します。', def_en:'The elimination of profits on goods or assets sold within the group that have <strong>not yet been sold to external parties (unrealized profit)</strong>. Example: parent sells goods costing ¥100 to subsidiary for ¥150; if the subsidiary has not yet resold them, the ¥50 internal profit is eliminated from consolidated inventory and retained earnings.' },
    { term:'持分法', en:'Equity Method', def:'子会社（支配）ではなく<strong>関連会社（重要な影響を持つ会社）に対して適用する会計処理</strong>です。投資先の純利益のうち自社持ち分を「持分法による投資利益（収益）」として計上し、「関係会社株式（資産）」も増やします。純損失の場合は「持分法による投資損失（費用）」を計上します。', def_en:'The accounting method applied to <strong>investments in associates (companies over which the investor has significant influence but not control)</strong>. The investor recognizes its proportionate share of the associate\'s net income as "Income from Equity Method Investments," increasing the carrying value of the investment. Losses are recognized as an expense and reduce the investment.' },
    { term:'のれん（連結）', en:'Consolidated Goodwill', def:'連結時に<strong>子会社取得額が子会社純資産の時価より多い差額</strong>をのれんとして連結貸借対照表に計上します。日本基準では20年以内に均等償却（のれん償却費）します。IFRSでは償却せず「減損テスト」を毎年行います。', def_en:'The excess of the <strong>acquisition cost over the fair value of the subsidiary\'s net assets at the acquisition date</strong>, recognized on the consolidated balance sheet. Under Japanese GAAP, amortized evenly within 20 years (Goodwill Amortization). Under IFRS, not amortized but subject to annual impairment testing.' },
    { term:'段階取得', en:'Step Acquisition', def:'子会社株式を<strong>複数回に分けて取得して支配を獲得するケース</strong>です。支配獲得日に、それまで保有していた株式（関連会社株式など）を支配獲得時の時価で評価し直し、差額を「段階取得に係る差益（利益）」として計上します。', def_en:'Acquiring a subsidiary\'s shares in <strong>multiple transactions over time until control is obtained</strong>. On the acquisition date, previously held interests (e.g., equity-method investments) are remeasured at fair value, and any resulting gain is recognized as "Step Acquisition Gain" in profit or loss.' },
  ]},
  { category:'㉑ 銀行勘定調整表', items:[
    { term:'銀行勘定調整表', en:'Bank Reconciliation Statement', def:'<strong>当座預金の帳簿残高と銀行から受け取った残高証明書（銀行側の残高）の差異を調整・説明する表</strong>です。両者の残高が一致しないのは、時間外預金・未取付小切手・未渡小切手・連絡未達事項などのタイムラグが原因です。2級の頻出問題です。', def_en:'A schedule that <strong>reconciles the company\'s book balance of the checking account with the balance shown on the bank statement</strong>. Differences arise from timing lags: deposits in transit, outstanding checks, undelivered checks, and items not yet notified. A frequently tested topic on the Level 2 exam.' },
    { term:'時間外預金', en:'Deposits in Transit', def:'会社が帳簿に記録したが、<strong>銀行の営業時間外に入金したため銀行側の残高にまだ反映されていない預金</strong>です。会社残高＞銀行残高の原因になります。銀行側の残高に「＋時間外預金」の調整をします。', def_en:'Deposits recorded by the company but <strong>not yet reflected in the bank\'s records</strong> because they were made after banking hours (or at period-end). The company\'s book balance exceeds the bank balance. Adjustment: add to the bank statement balance.' },
    { term:'未取付小切手', en:'Outstanding Checks', def:'会社が小切手を振り出して相手に渡したが、<strong>相手がまだ銀行に持ち込んでいない（取り付けていない）ため銀行側から引き落とされていない小切手</strong>です。会社残高＜銀行残高の原因。銀行側の残高から「－未取付小切手」を調整します。', def_en:'Checks issued by the company and given to payees but <strong>not yet presented to the bank for payment</strong>. The bank balance is higher than the company\'s book balance by this amount. Adjustment: subtract from the bank statement balance.' },
    { term:'未渡小切手', en:'Undelivered Checks', def:'会社が小切手を振り出して帳簿から引き落としたが、<strong>まだ相手に渡していない小切手</strong>です。本来まだ支払いが完了していないので、会社側の帳簿残高を修正（当座預金残高を増やし、未払金などを計上）します。', def_en:'Checks written and deducted from the company\'s books but <strong>not yet delivered to the payee</strong>. Since payment has not actually been made, a correction is needed on the company\'s side: restore the checking account balance and record the obligation as Accounts Payable (or a similar liability).' },
    { term:'連絡未達事項', en:'Items Not Yet Notified', def:'銀行が処理（引き落とし・入金）を行ったが、<strong>会社にまだ通知が届いておらず帳簿に記録されていない項目</strong>です。例えば銀行が自動的に引き落とした手数料・利息など。会社側の帳簿を修正（記帳）する必要があります。', def_en:'Transactions processed by the bank but <strong>not yet recorded in the company\'s books</strong> because notification has not been received. Examples: bank service charges, interest automatically deducted, or incoming wire transfers. The company must update its books once it learns of these items.' },
    { term:'当座預金残高証明書', en:'Bank Statement', def:'銀行が発行する<strong>当座預金の取引履歴と残高を記録した証明書</strong>です。銀行勘定調整表を作成する際に会社の帳簿残高と照合します。両者の差異の原因を一つひとつ確認して、修正後の「真の残高」を求めます。', def_en:'A document issued by the bank listing all transactions and the <strong>official bank-side balance of the checking account</strong>. Used in bank reconciliation to compare against the company\'s book balance. Each difference is identified and corrected to arrive at the "true balance."' },
    { term:'両者区分調整法', en:'Reconciliation from Both Sides', def:'銀行勘定調整表の作成方法で、<strong>「銀行残高」と「帳簿残高」の両方を修正して一致させる方式</strong>です。銀行残高には時間外預金を加え未取付小切手を引き、帳簿残高には連絡未達の入金を加え未達の引き落としを引くことで、両者が「修正後残高」で一致します。最もよく使われる方法です。', def_en:'The most common bank reconciliation format: <strong>adjust both the bank balance and the book balance</strong> until they agree on a "adjusted true balance." Add deposits in transit to bank balance; subtract outstanding checks from bank balance. Add unreported credits to book balance; subtract unreported debits from book balance.' },
  ]},
];

const APX_TYPE_INFO = {
  asset:      { name:'資産 (Assets)',              sub:'会社が持っているもの・もらえる権利' },
  liability:  { name:'負債 (Liabilities)',          sub:'将来払わなければならない義務・借金' },
  expense:    { name:'費用 (Expenses)',             sub:'お金を使ったとき・価値が減ったとき' },
  revenue:    { name:'収益 (Revenue)',              sub:'お金が増えたとき・稼いだとき' },
  equity:     { name:'純資産 (Equity)',             sub:'本当に自分のものの総額（資産－負債）' },
  other:      { name:'評価勘定・その他 (Other)',    sub:'固定資産・売掛金のマイナス調整など' },
  industrial: { name:'工業簿記 (Industrial)',       sub:'製造業の原価計算で使う勘定科目' },
};

function buildApxContent(){
  const freq = {};
  ALL.forEach(q => {
    if(!q.e) return;
    const seen = new Set();
    q.e.forEach(entry => {
      [...(entry.d||[]), ...(entry.c||[])].forEach(([name]) => seen.add(name));
    });
    seen.forEach(name => { freq[name] = (freq[name]||0) + 1; });
  });

  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  // Also build chapter-order map
  const byChap = {};
  ACCT_Q_CHAP_ORDER.forEach(c => byChap[c] = []);
  byChap['その他（PDF未収録）'] = [];

  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name] || 'other';
    const cardNote = ACCT_Q_JP[name] || note;
    const cardNoteEn = ACCT_Q_EN[name] || note_en;
    const item = { name, en, note: cardNote, lv, note_en: cardNoteEn, type };
    byType[type].push(item);
    const chap = ACCT_Q_CHAP[name];
    if(chap && byChap[chap]) byChap[chap].push(item);
    else byChap['その他（PDF未収録）'].push(item);
  });
  order.forEach(type => byType[type].sort((a, b) => (freq[b.name]||0) - (freq[a.name]||0)));

  function makeRow({ name, en, note, lv, note_en, type }){
    const t = type || T[name] || 'other';
    return `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}" data-type="${t}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${tagType(name)}">(${name})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
          <span class="apx-tts-btns">
            <button class="apx-tts-btn" onclick="apxSpeakRow(this,'ja')" title="日本語で読む">🔊 JP</button>
            <button class="apx-tts-btn en" onclick="apxSpeakRow(this,'en')" title="英語で読む">🔊 EN</button>
            <button class="apx-tts-btn both" onclick="apxSpeakRow(this,'both')" title="日→英">🔊 両</button>
          </span>
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`;
  }

  // Chapter-based HTML (used for "all" tab)
  const chapHtml = [...ACCT_Q_CHAP_ORDER, 'その他（PDF未収録）'].map(chap => {
    const items = byChap[chap] || [];
    if(!items.length) return '';
    const isInd = chap.startsWith('工業簿記');
    const category = isInd ? 'industrial' : 'chap';
    const rows = items.map(makeRow).join('');
    return `<div class="apx-section" data-type="chap" data-chap="${chap}" data-category="${category}">
      <div class="apx-section-hd other"><span class="dot other"></span>${chap}</div>
      ${rows}
    </div>`;
  }).join('');

  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(makeRow).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note, , note_en]) => {
      const type = T[name] || 'other';
      const cardNote = IND_Q_JP[name] || note;
      const cardNoteEn = IND_Q_EN[name] || note_en;
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${tagType(name)}">(${name})</span>
          <span class="apx-lv ind">工業</span>
          <span class="apx-tts-btns">
            <button class="apx-tts-btn" onclick="apxSpeakRow(this,'ja')" title="日本語で読む">🔊 JP</button>
            <button class="apx-tts-btn en" onclick="apxSpeakRow(this,'en')" title="英語で読む">🔊 EN</button>
            <button class="apx-tts-btn both" onclick="apxSpeakRow(this,'both')" title="日→英">🔊 両</button>
          </span>
        </div>
        <div class="apx-note">${cardNoteEn?`<div class="gloss-def-en">${cardNoteEn}</div>`:''}<div class="apx-note-ja">${cardNote}</div></div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def, def_en }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-en">${en}</span> <span class="gloss-term-text">(${term})</span>
            <span class="apx-tts-btns">
              <button class="apx-tts-btn" onclick="apxSpeakRow(this,'ja')" title="日本語で読む">🔊 JP</button>
              <button class="apx-tts-btn en" onclick="apxSpeakRow(this,'en')" title="英語で読む">🔊 EN</button>
              <button class="apx-tts-btn both" onclick="apxSpeakRow(this,'both')" title="日→英">🔊 両</button>
            </span>
          </div>
          <div class="gloss-def">${def_en?`<div class="gloss-def-en">${def_en}</div>`:''}<div class="gloss-def-ja">${def}</div></div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  return chapHtml + commercialHtml + indHtml + glossHtml;
}

function apxStripHtml(h){
  return h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}

/* 各行の4パーツを返すヘルパー */
function _apxParts(row, name, en){
  const jaEl = row && row.querySelector('.apx-note-ja, .gloss-def-ja');
  const enEl = row && row.querySelector('.gloss-def-en, .apx-note .gloss-def-en');
  return {
    jaNote: jaEl ? apxStripHtml(jaEl.innerHTML) : '',
    enNote: enEl ? apxStripHtml(enEl.innerHTML) : '',
    jaYomi: APX_YOMI[name] || name,
    enName: en,
  };
}

/* ② 説明（問題）→ 用語（答え）の順 */
function _apxBuildText(row, name, en, lang){
  const {jaNote, enNote, jaYomi, enName} = _apxParts(row, name, en);
  if(lang === 'ja') return jaNote ? jaNote + '。' + jaYomi : jaYomi;
  return enNote ? enNote + '. ' + enName : enName;
}

/* ③ both → JP問題→EN問題→JP答え→EN答え の4発話 */
function apxSpeakRow(btn, lang){
  if(!('speechSynthesis' in window)) return;
  const row = btn.closest('.apx-row, .gloss-row');
  const name = (row && row.dataset.name) || '';
  const en   = (row && row.dataset.en)   || '';
  window.speechSynthesis.cancel();
  apxPlayAllActive = false;
  if(lang === 'both'){
    const {jaNote, enNote, jaYomi, enName} = _apxParts(row, name, en);
    const jr = apxTTSRate * 1.5, er = 1.0;
    const s4 = () => _apxUtter(enName,  'en', null,  er);
    const s3 = () => _apxUtter(jaYomi,  'ja', s4,    jr);
    const s2 = enNote ? () => _apxUtter(enNote, 'en', s3, er) : s3;
    const s1 = jaNote ? () => _apxUtter(jaNote, 'ja', s2, jr) : s2;
    s1();
  } else {
    _apxUtter(_apxBuildText(row, name, en, lang), lang);
  }
}

let apxVoiceJa = null;
let apxVoiceEn = null;

function apxSetVoice(lang, name){
  const v = speechSynthesis.getVoices().find(x => x.name === name) || null;
  if(lang === 'ja') apxVoiceJa = v; else apxVoiceEn = v;
}

function apxInitVoices(){
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return;

  const jaEl = document.getElementById('apx-voice-ja');
  const enEl = document.getElementById('apx-voice-en');
  if(!jaEl || !enEl) return;

  const jaVoices = voices.filter(v => v.lang.startsWith('ja'));
  const enVoices = voices.filter(v => v.lang.startsWith('en'));

  function populate(el, list, prefLang){
    el.innerHTML = '';
    if(!list.length){ el.innerHTML='<option value="">（なし）</option>'; return; }
    list.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.name;
      const quality = v.name.includes('Enhanced') || v.name.includes('Premium')
                      ? ' ★' : v.localService ? '' : ' (net)';
      opt.textContent = v.name + quality;
      el.appendChild(opt);
    });
    // prefer Enhanced/Premium, then local
    const best = list.find(v => v.name.includes('Enhanced') || v.name.includes('Premium'))
              || list.find(v => v.localService)
              || list[0];
    el.value = best.name;
    if(prefLang === 'ja') apxVoiceJa = best; else apxVoiceEn = best;
  }

  populate(jaEl, jaVoices, 'ja');
  populate(enEl, enVoices, 'en');
}

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = apxInitVoices;
  apxInitVoices(); // fires immediately in some browsers
}

function _apxUtter(text, lang, onend, rate){
  const utt = new SpeechSynthesisUtterance(text);
  const voice = lang === 'ja' ? apxVoiceJa : apxVoiceEn;
  if(voice){
    utt.voice = voice;
    utt.lang  = voice.lang;
  } else {
    utt.lang  = lang === 'ja' ? 'ja-JP' : 'en-US';
  }
  utt.rate  = rate != null ? rate : apxTTSRate;
  if(onend) utt.onend = onend;
  window.speechSynthesis.speak(utt);
}

/* ② 全て一気に再生（both対応）*/
function apxPlayAll(lang){
  if(apxPlayAllActive){ apxStopAll(); return; }
  // タブ切替はsec.style.displayで行うため、offsetParentで表示中の行だけ絞る
  const rows = [...document.querySelectorAll(
    '#apx-content .apx-row:not(.hidden), #apx-content .gloss-row:not(.hidden)'
  )].filter(r => r.offsetParent !== null);
  if(lang === 'both'){
    apxPlayAllQueue = [];
    rows.forEach(row => {
      const name = row.dataset.name || '';
      const en   = row.dataset.en   || '';
      const {jaNote, enNote, jaYomi, enName} = _apxParts(row, name, en);
      const jr = apxTTSRate * 1.5, er = 1.0;
      if(jaNote)  apxPlayAllQueue.push({text: jaNote, lang: 'ja', rate: jr});
      if(enNote)  apxPlayAllQueue.push({text: enNote, lang: 'en', rate: er});
      if(jaYomi)  apxPlayAllQueue.push({text: jaYomi, lang: 'ja', rate: jr});
      if(enName)  apxPlayAllQueue.push({text: enName, lang: 'en', rate: er});
    });
  } else {
    apxPlayAllQueue = rows.map(row => {
      const name = row.dataset.name || '';
      const en   = row.dataset.en   || '';
      return { text: _apxBuildText(row, name, en, lang), lang };
    }).filter(x => x.text.trim());
  }
  if(!apxPlayAllQueue.length) return;
  apxPlayAllActive = true;
  document.getElementById('apx-play-all-jp').textContent   = lang==='ja'   ? '⏹ 停止' : '▶ 日';
  document.getElementById('apx-play-all-en').textContent   = lang==='en'   ? '⏹ 停止' : '▶ 英';
  document.getElementById('apx-play-all-both').textContent = lang==='both' ? '⏹ 停止' : '▶ 双方';
  window.speechSynthesis.cancel();
  let idx = 0;
  function next(){
    if(!apxPlayAllActive || idx >= apxPlayAllQueue.length){ apxStopAll(); return; }
    const {text, lang: l, rate} = apxPlayAllQueue[idx++];
    _apxUtter(text, l, next, rate);
  }
  next();
}

function apxStopAll(){
  apxPlayAllActive = false;
  window.speechSynthesis.cancel();
  const bj = document.getElementById('apx-play-all-jp');
  const be = document.getElementById('apx-play-all-en');
  const bb = document.getElementById('apx-play-all-both');
  if(bj) bj.textContent = '▶ 日';
  if(be) be.textContent = '▶ 英';
  if(bb) bb.textContent = '▶ 双方';
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category === 'chap';
    else if(tab.startsWith('chap:')) typeMatch = sec.dataset.chap === tab.slice(5);
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else typeMatch = false;

    if(!typeMatch){ sec.style.display = 'none'; return; }

    sec.style.display = '';
    sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
  });
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');

    note:'固定資産：\n取得時 → 借方に「建物/備品等」\n売却時 → 貸方に帳簿価額、差額が売却損益'

  { id:143, level:2, cat:'固定資産', chap:'第6章：有形固定資産',

    e:[{d:[['減価償却費',500]], c:[['建物減価償却累計額',500]]}],

  { id:153, level:2, cat:'固定資産', chap:'第6章：有形固定資産',

    en_q:'Record the following: ①Received another company\'s check for ¥200 as collection of accounts receivable. ②Received a dividend receipt slip for ¥300 on held stock. ③Deposited ¥500 in cash into the checking account.',

  { id:161, level:3, cat:'経過勘定', chap:'決算整理',
    q:'決算にあたり、次の経過勘定の仕訳をそれぞれ示しなさい。①3月分の家賃10,000円をまだ支払っていないため、未払計上する。②半年分の保険料30,000円を先払いしており、翌期分12,000円を前払費用として繰り延べる。③3月分の受取利息5,000円がまだ入金されていないため、未収計上する。④6ヶ月分の受取家賃60,000円のうち翌期分20,000円を前受収益として繰り延べる。',
    en_q:'At year-end, record the following accrual adjustments: ①Accrue ¥10,000 of unpaid March rent expense. ②Defer ¥12,000 of prepaid insurance (next period\'s portion) out of a ¥30,000 half-year payment. ③Accrue ¥5,000 of uncollected March interest income. ④Defer ¥20,000 of unearned rent income (next period\'s portion) out of a ¥60,000 six-month receipt.',
    e:[{d:[['支払家賃',10000]], c:[['未払費用',10000]]}, {d:[['前払費用',12000]], c:[['保険料',12000]]}, {d:[['未収収益',5000]], c:[['受取利息',5000]]}, {d:[['受取家賃',20000]], c:[['前受収益',20000]]}],
    exp:'経過勘定は「時期のズレ」を調整するための4勘定です。①まだ払っていない費用→「未払費用」（負債）を計上し、当期の費用を増やす。②すでに払った費用のうち来期分→「前払費用」（資産）として当期の費用から除く。③まだもらっていない収益→「未収収益」（資産）を計上し、当期の収益を増やす。④すでにもらった収益のうち来期分→「前受収益」（負債）として当期の収益から除く。「未」はまだ、「前」は先に、が基本の意味です。'
  },
  { id:162, level:3, cat:'減価償却', chap:'第6章：有形固定資産',
    q:'A社は機械装置300,000円を購入した。耐用年数5年・残存価値0円の定額法で、決算にあたり1年目の減価償却費を計上する（間接法）。仕訳を示しなさい。',
    en_q:'Company A purchased machinery for ¥300,000 (5-year life, zero residual, straight-line). Record year-1 depreciation at year-end (indirect method).',

    exp:'定額法では「（取得原価－残存価値）÷耐用年数」で毎年の減価償却費を計算します。(300,000－0)÷5年＝60,000円です。間接法では、機械装置そのものの金額は変えずに、「これまで合計でいくら価値が減ったか」を「減価償却累計額」という別の勘定に記録し、本当の帳簿価額は取得原価から累計額を差し引いて求めます。'

  { id:163, level:3, cat:'貸倒引当金', chap:'無形資産・リース・引当金',
    q:'期末の売掛金残高200,000円に対して2％の貸倒引当金を設定した（期首引当金残高0円、差額補充法）。翌期に売掛金4,000円が実際に貸し倒れた。決算時の設定仕訳と、翌期の貸倒れ時の仕訳を示しなさい。',
    en_q:'Set up a 2% bad-debt allowance on a ¥200,000 A/R balance at year-end (opening allowance ¥0, incremental method). The following period, ¥4,000 of receivables actually became uncollectible. Record both the year-end provision and the following period\'s write-off.',
    e:[{d:[['貸倒引当金繰入',4000]], c:[['貸倒引当金',4000]]}, {d:[['貸倒引当金',4000]], c:[['売掛金',4000]]}],

  { id:165, level:3, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',

    en_q:'Record the following: ①Issued a promissory note for a ¥500,000 purchase on credit. ②Sold goods for ¥300,000, receiving a promissory note from the customer. ③Discounted the note from ② at the bank before maturity, receiving ¥295,000 after a ¥5,000 fee.',
    e:[{d:[['仕入',500000]], c:[['支払手形',500000]]}, {d:[['受取手形',300000]], c:[['売上',300000]]}, {d:[['当座預金',295000],['手形売却損',5000]], c:[['受取手形',300000]]}],
    exp:'①仕入代金を約束手形で払う約束をしたので「支払手形」（負債）が増えます。②売った代金として得意先の約束手形を受け取ったので「受取手形」（資産）が増えます。③その受取手形を期日前に銀行へ持ち込んで先に現金化するのが「手形割引」で、銀行に払う手数料の分だけ受け取れる金額が額面より少なくなり、その差額（5,000円）を手形売却損（費用）として計上します。一連の流れを通じて、手形が「約束の証書」から「現金」へと形を変えていく様子を確認できます。'

  {

    en_q:'Materials are tracked using FIFO. Opening: 100kg @¥200 (¥20,000). Purchased: 200kg @¥220 (¥44,000). Consumed this month: 240kg. Record the entry transferring the consumed cost to WIP.',
    e:[{d:[['仕掛品',50800]], c:[['材料',50800]]}],
    exp:'先入先出法は「古い在庫から先に使った」と仮定して原価を計算する方法です。まず月初にあった古い材料100kg（＠200円）を使い切り、それでも足りない残り140kgは新しく買った分（＠220円）から使ったとみなします。20,000円＋30,800円＝50,800円が今月使った材料の原価で、これを仕掛品へ振り替えます。値段の違う在庫が混ざっているとき、「先に仕入れた分から順番に払い出す」という考え方が先入先出法です。'
  },
  { id:277, level:2, cat:'材料費', chap:'工業簿記',
    q:'移動平均法（仕入れのたびに平均単価を計算し直す）で材料を管理している。月初材料在庫：100kg（1kgあたり200円、計20,000円）。当月購入：200kg（1kgあたり220円、計44,000円）。その後240kgを消費した。消費した材料を仕掛品へ振り替える仕訳を示しなさい（円未満四捨五入）。',
    en_q:'Materials are tracked using the moving-average method. Opening: 100kg @¥200 (¥20,000). Purchased: 200kg @¥220 (¥44,000). Then consumed 240kg. Record the entry transferring the consumed cost to WIP (round to the nearest yen).',
    e:[{d:[['仕掛品',51120]], c:[['材料',51120]]}],
    exp:'移動平均法は「新しく材料を仕入れるたびに、在庫全体の平均単価を計算し直す」方法です。月初在庫20,000円と当月購入44,000円を合計し、数量100kg＋200kgで割ると平均単価＠213円になります。先入先出法のように「どの分から使ったか」を区別せず、常に一つの平均単価で管理するのが特徴です。'
  },
  {
    id:278,
    level:2,
    cat:'材料費', chap:'工業簿記',
    q:'当社は材料300,000円を掛購入した。なお、引取運賃（材料副費）6,000円を現金で支払った。材料副費は材料の取得原価に算入する。仕訳を行いなさい。',
    e:[{d:[['材料',306000]],c:[['買掛金',300000],['現金',6000]]}],
    exp:'材料副費（引取運賃・保険料・荷役費など）は、材料を手元に届けるまでにかかった付随費用です。商品を仕入れるときの「仕入諸掛」と同じ考え方で、材料そのものの値段だけでなく、届けるためにかかった費用も含めて「材料の取得原価」とします。300,000円＋6,000円＝306,000円が、この材料の本当のコストです。',
  },
  { id:279, level:2, cat:'材料費', chap:'工業簿記',
    q:'鉄材を使う工場では月初に予定消費単価を設定して材料費を計上している。予定消費単価＠100円/kg、実際消費単価＠110円/kg、今月の実際消費量500kg。予定と実際のズレを「材料消費価格差異」として計上する仕訳を示しなさい。',
    en_q:'A factory uses a predetermined consumption price for materials. Predetermined: @¥100/kg. Actual: @¥110/kg. Actual consumption: 500kg this month. Record the material price variance entry.',
    e:[{d:[['材料消費価格差異',5000]], c:[['材料',5000]]}],
    exp:'工場では材料を使うたびに正確な実際単価を待っていると計算が遅れるため、あらかじめ決めておいた「予定消費単価」で先に処理を進めます。今回は予定単価100円より実際単価110円の方が高かった（10円×500kg＝5,000円多くかかった）ので、材料勘定をその分減らし、差額を「材料消費価格差異」という専用の勘定に振り替えて記録しておきます。あとでこの差異はまとめて分析・精算します。'
  },
  {
    id:280,
    level:2,
    cat:'労務費', chap:'工業簿記',
    q:'当月の賃金・給料の総支給額400,000円から所得税30,000円・社会保険料20,000円を控除し、差額を現金で支払った。仕訳を行いなさい。',

    note:'直接原価計算：\n変動費 → 製品原価\n固定費 → 期間費用（全額当期費用）\n→ 貢献利益 ＝ 売上 − 変動費'
  },
  {
    id:281,
    level:2,
    cat:'労務費', chap:'工業簿記',
    q:'当月の直接工賃金消費高を集計したところ、直接作業時間200時間×予定賃率2,000円/時間＝400,000円（直接労務費）となった。仕訳を行いなさい。',
    e:[{d:[['仕掛品',400000]],c:[['賃金・給料',400000]]}],

  {

    level:2,
    cat:'労務費', chap:'工業簿記',
    q:'当月、間接工の賃金消費高が100,000円、工場長給与が80,000円と確定した。それぞれ製造間接費に計上する仕訳を行いなさい。',

    note:'製造間接費 = 間接材料費 ＋ 間接労務費 ＋ 間接経費の合計'

  {

    level:2,
    cat:'労務費', chap:'工業簿記',
    q:'月末を迎え、当月の賃金消費高を集計したところ430,000円となった。このうち月末時点で30,000円がまだ未払いである（前月から引き継いだ支払済み賃金は420,000円）。当月消費賃金に関する仕訳を行いなさい（消費仕訳は別途行う）。',

  {

    cat:'経費', chap:'工業簿記',
    q:'特定製品の加工を外部業者に委託し、外注加工費200,000円を小切手で支払った。仕訳を行いなさい。',

  },
  {
    id:287,
    level:2,
    cat:'経費', chap:'工業簿記',
    q:'当期末の決算にあたり、工場の建物・機械の減価償却費300,000円（間接経費）を計上する仕訳を行いなさい。',

  },
  {

  },
  {
    id:290,
    level:2,
    cat:'製造間接費', chap:'工業簿記',
    q:'当月の製造間接費を予定配賦する。予定配賦率は1,500円/直接作業時間で、当月の実際直接作業時間は100時間だった。仕訳を行いなさい。',
    e:[{d:[['仕掛品',150000]],c:[['製造間接費',150000]]}],
    exp:'製造間接費は性質の異なる費用（間接材料費・間接労務費・間接経費）の寄せ集めなので、実際の合計額が確定するのは月末を待たねばなりません。そこで、あらかじめ決めた予定配賦率（1時間あたり1,500円）に、実際にかかった作業時間（100時間）を掛けた金額を、先に仕掛品へ配賦してしまいます。予定配賦率×実際操業度＝150,000円がこの製品の負担分です。実際の総額との差は月末にまとめて精算します。',
    note:'製造間接費の予定配賦額 = 予定配賦率 × 実際操業度'

  {

    level:2,

    exp:'予定配賦額（200,000）＞実際発生額（180,000）→20,000円の「配賦過大（有利差異）」。製造間接費勘定は借方（実際発生）180,000円・貸方（予定配賦）200,000円なので、貸方残20,000円が有利差異。月末に「製造間接費配賦差異（貸方）」に振り替えて製造間接費勘定をゼロにします。',

    q:'機械化が進んだ部品工場では、製造間接費を機械運転時間を基準に配賦している。月の基準機械時間1,000時間・製造間接費予算500,000円。A製品が今月使用した機械時間は200時間であった。A製品への製造間接費配賦の仕訳を示しなさい。',
    en_q:'A factory allocates overhead based on machine-hours. Budgeted monthly base: 1,000 hours; overhead budget ¥500,000. Product A used 200 machine-hours this month. Record the overhead allocation entry to Product A.',
    e:[{d:[['仕掛品',100000]], c:[['製造間接費',100000]]}],
    exp:'機械をたくさん使う工場では、人手（作業時間）よりも機械の稼働時間の方が、各製品にかかったコストの実態をよく表すことがあります。そこで配賦基準を機械運転時間に変えます。予算500,000円÷基準1,000時間＝1時間あたり500円という配賦率を計算し、実際にA製品が機械を使った200時間分（100,000円）を製造間接費からA製品（仕掛品）へ配分します。'
  },
  {

    level:2,

  },
  {

    note:'補助部門費の配賦 = 補助部門費合計 × 各製造部門の配賦基準割合'

  {

    q:'（一気通貫④）月初製品100,000円、当月完成品製造原価1,800,000円、月末製品250,000円。製品が売れたときの売上原価振替仕訳を行いなさい。',
    e:[{d:[['売上原価',1650000]],c:[['製品',1650000]]}],
    exp:'製品として完成しても、すべてがその月のうちに売れるわけではありません。月初にあった在庫に、今月新たに完成した分を足し、月末にまだ売れ残っている分を差し引くと、今月実際に売れた分の原価（売上原価）が求まります。100,000＋1,800,000－250,000＝1,650,000円です。「作っただけでは費用にならず、お客様に売れて初めて費用になる」という発生主義・費用収益対応の考え方が、ここで一番よく表れています。',
    note:'売上原価 = 期首製品 ＋ 当期製品製造原価 − 期末製品'
    
  },

    e:[{d:[['買掛金',80000]],c:[['売掛金',80000]]}]
  },

  { id:384, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',

  { id:385, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',

    exp:'受取人（C社）は、もともとA社に対して持っていた売掛金（受け取る権利）を、B社が引き受けた受取手形に置き換えます。今後お金を払ってくれるのはA社ではなくB社になるため、直接の取引関係がA社からB社へと移ります。B社は期日に必ず支払う義務を負っているので、C社にとっては確実な受け取りの権利です。',

  { id:386, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'為替手形80,000円（B社引受）が期日を迎えた。①引受人B社が当座預金から支払い、②受取人C社が当座預金に受け取った。各社の仕訳を行いなさい。',

  { id:387, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',

    exp:'為替手形であっても、受け取った手形（受取手形）を他の支払いに充てる「裏書譲渡」ができる点は、約束手形とまったく同じです。C社は自分が持っている受取手形（B社が払ってくれる権利）を、D社への買掛金の支払いに使います。手形の種類が違っても、裏書譲渡という仕組みそのものは共通です。',

  { id:388, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',

  { id:389, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'（総合）Ａ社はＣ社への買掛金100,000円の決済のため、得意先Ｂ社（Ａ社への売掛金100,000円がある）に「Ｃ社へ100,000円払え」という為替手形を振り出した。Ｂ社はこれを引き受け、Ｃ社は受け取った。①Ａ社（振出人）②Ｂ社（引受人）③Ｃ社（受取人）それぞれの仕訳を示しなさい。',
    en_q:'(Comprehensive) Company A issued a bill of exchange instructing "pay ¥100,000 to Company C" to Company B (which owed A ¥100,000), to settle A\'s own ¥100,000 payable to C. B accepted it; C received it. Record the entries for ①A (drawer), ②B (acceptor), and ③C (payee).',
    e:[{d:[['買掛金',100000]], c:[['売掛金',100000]]}, {d:[['買掛金',100000]], c:[['支払手形',100000]]}, {d:[['受取手形',100000]], c:[['売掛金',100000]]}],
    exp:'為替手形は「振出人が、自分の債務者（引受人）に、自分の債権者（受取人）へ支払わせる」という3者間の手形です。①Ａ社（振出人）：Ｃ社への買掛金とＢ社への売掛金が同時に消えるため「買掛金／売掛金」。②Ｂ社（引受人）：Ａ社への買掛金という債務の中身が「支払手形」という手形債務に変わります。③Ｃ社（受取人）：Ａ社への売掛金という債権の中身が「受取手形」という手形債権に変わります。期日にＢ社がＣ社へ支払うと、Ｂ社は支払手形を、Ｃ社は受取手形をそれぞれ消します。'
  },

  // ===== 圧縮記帳（追加）=====
  { id:390, level:2, cat:'圧縮記帳', chap:'第6章：有形固定資産',
    q:'国庫補助金2,000,000円を普通預金に受け取り、機械装置4,000,000円を現金で購入した（耐用年数4年・残存価額0円・定額法）。積立金方式で圧縮記帳を行う場合の①補助金受取②機械購入③圧縮積立金設定④1年目の減価償却と積立金取崩しの仕訳を示しなさい。',
    en_q:'Received a ¥2,000,000 government subsidy into the bank account and acquired machinery for ¥4,000,000 cash (4-year life, straight-line, zero residual). Using reserve-method compression accounting, record ①the subsidy receipt, ②the machine purchase, ③the compression reserve setup, and ④year-1 depreciation with the corresponding reserve reversal.',
    e:[{d:[['普通預金',2000000]], c:[['国庫補助金受贈益',2000000]]}, {d:[['機械装置',4000000]], c:[['現金',4000000]]}, {d:[['繰越利益剰余金',2000000]], c:[['圧縮積立金',2000000]]}, {d:[['減価償却費',1000000]], c:[['減価償却累計額',1000000]]}, {d:[['圧縮積立金',500000]], c:[['繰越利益剰余金',500000]]}],
    exp:'積立金方式は「固定資産の帳簿価額はそのまま、利益剰余金から圧縮積立金へ積み立てる」方法です。①②は受け取った事実・購入した事実をそのまま計上。③圧縮積立金の設定額は補助金と同額2,000,000円。④帳簿価額を減らさないため、減価償却費は取得原価全額ベースで計算：4,000,000÷4年＝1,000,000円。同時に、圧縮積立金も耐用年数にわたって均等に取り崩します：2,000,000÷4年＝500,000円。直接減額方式（帳簿価額そのものを圧縮）と比べ、積立金方式は固定資産の帳簿価額をそのまま表示できる点が特徴です。'
  },

  { id:391, level:2, cat:'圧縮記帳', chap:'第6章：有形固定資産',
    q:'直接控除方式で圧縮記帳済みの建物：取得原価10,000,000円・固定資産圧縮損3,000,000円（計上済み）・耐用年数20年・残存価額0円・定額法。決算にあたり、減価償却の仕訳を示しなさい。',
    en_q:'A building was compressed under the direct-reduction method: acquisition cost ¥10,000,000, compression loss already recorded ¥3,000,000, 20-year life, straight-line, zero residual. Record the year-end depreciation entry.',
    e:[{d:[['減価償却費',350000]], c:[['減価償却累計額',350000]]}],
    exp:'直接控除方式では固定資産の帳簿価額そのものを補助金分だけ減らすため、減価償却の基礎となる帳簿価額も小さくなります。圧縮後帳簿価額：10,000,000－3,000,000＝7,000,000円。年間減価償却費：7,000,000÷20年＝350,000円。積立金方式（取得原価全額を基礎に償却する）と比べ、直接控除方式は毎期の減価償却費が少なく計算される点が異なります。どちらの方式も「補助金を受け取った年に一括課税されるのを防ぎ、将来にわたって分割で課税する」という効果は同じです。'

  { id:393, level:2, cat:'繰延資産', chap:'無形資産・リース・引当金',

  { id:394, level:2, cat:'繰延資産', chap:'無形資産・リース・引当金',

  { id:395, level:2, cat:'繰延資産', chap:'無形資産・リース・引当金',
    q:'会社設立のため定款作成費用200,000円・設立登記費用100,000円・発起人報酬80,000円を現金で支払い、創立費（繰延資産）として計上した。仕訳を行いなさい。また、創立費と開業費の正しい区別を選べ。',
    exp:'創立費は、会社という法人格がまだ存在しない設立準備の段階（定款作成・登記・発起人への報酬など）でかかった費用です。同じ繰延資産でも、開業費は「会社ができた後、営業を始めるまで」の費用なので、創立費とは発生するタイミングがはっきり違います。「法人ができる前か、後か」で使い分けることが試験でもよく問われるポイントです。',
    e:[{d:[['創立費',380000]],c:[['現金',380000]]}]
  },

  { id:397, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'新製品の研究開発のため、材料費300,000円・人件費500,000円・外注費200,000円を現金で支払った。研究開発費として処理する仕訳を行いなさい。また、研究開発費を資産計上できない理由として正しいものを選べ。',
    exp:'研究開発費（新しい製品や技術を生み出すための費用）は、将来本当に利益を生むかどうかが取得した時点では分からない、不確実性の高い支出です。会計のルールでは「儲かるかどうか分からないものを資産として計上するのは危険」と考え、資産にせず、発生したその期にすべて費用として処理することが義務づけられています。',
    e:[{d:[['研究開発費',1000000]],c:[['現金',1000000]]}]

    exp:'市場に販売するソフトウェアの開発費用は、開発の進み具合によって扱いが変わります。「まだ商品として売れるかどうか分からない研究・企画段階」の費用（600,000円）は研究開発費として費用処理し、「製品としての設計図（製品マスター）が完成した後」の追加開発費（900,000円）は、すでに商品化のめどが立っているため無形固定資産（ソフトウェア）として計上し、複数年にわたって償却します。',
    e:[{d:[['研究開発費',600000]],c:[['現金',600000]]},{d:[['ソフトウェア',900000]],c:[['現金',900000]]},{d:[['ソフトウェア償却',300000]],c:[['ソフトウェア',300000]]}]
  },

  { id:399, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'自社の受発注管理システムを外部委託で開発し、完成時に代金1,800,000円を小切手で支払った（将来の業務コスト削減が確実）。無形固定資産（ソフトウェア）として計上し、耐用年数5年・定額法で償却する。①取得時の仕訳②年間償却費③償却時の仕訳を行いなさい。',
    exp:'自社の業務で使うために開発したシステムは、それによって「将来かかるはずだったコストが確実に減る」と見込めるなら、無形固定資産（ソフトウェア）として計上できます。将来の効果が確実に見込めるかどうかが、費用処理か資産計上かを分ける基準です。1,800,000円÷5年＝360,000円が1年分の償却額になります。',
    e:[{d:[['ソフトウェア',1800000]],c:[['当座預金',1800000]]},{d:[['ソフトウェア償却',360000]],c:[['ソフトウェア',360000]]}]
