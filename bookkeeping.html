    exp:'転換社債が株式に転換されると、それまで負債だった「社債」と純資産だった「新株予約権」が、どちらも新しく発行する株式の対価（＝資本金）に振り替わります。まるでクーポン券がついに商品と引き換えられる瞬間のようなイメージで、区分法で処理していた場合は、社債部分と新株予約権部分をそれぞれ帳簿価額のまま資本金に振り替えるだけで、転換時に損益は発生しません。「負債と純資産の一部が、そのまま資本金という別の純資産に組み替わる」というイメージです。'
  },
  { id:810, level:2, cat:'金融商品', chap:'1級：金融商品',
    q:'<mark class="q-asset">Ｘ社は保有する先物取引差金50,000円（借方残高）について</mark>、反対売買を行い決済した。<mark class="q-asset">決済による最終的な差益は60,000円であった</mark>（先物取引差金50,000円を解消し、<mark class="q-other">追加の差益10,000円を計上</mark>）。決済時の仕訳を示しなさい。',
    en_q:'Company X settled its futures position (previously recognized as a ¥50,000 debit-balance futures margin receivable) through an offsetting transaction. The final gain on settlement was ¥60,000 (eliminating the ¥50,000 receivable and recognizing an additional ¥10,000 gain). Record the settlement entry.',
    e:[{d:[['現金',60000]], c:[['先物取引差金',50000],['先物損益',10000]]}],
    exp:'先物取引を反対売買（買っていたものを売る、または売っていたものを買い戻す）することで決済すると、それまで「先物取引差金」（未収の評価益）として計上していた金額が現金として実際に受け取れます。まるでゲームの中の仮想通貨をようやく現実のお金に換金するようなイメージで、決済による最終的な差益が60,000円で、すでに先物取引差金として50,000円を計上済みだったため、差額の10,000円が追加の先物損益（収益）として計上されます。'
  },
  { id:811, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は借入金の金利変動リスクをヘッジするため金利スワップ契約を締結し、繰延ヘッジ会計を適用している。決算日において、<mark class="q-asset">この金利スワップの時価評価益が25,000円生じた</mark>（税効果は考慮しない）。仕訳を示しなさい。',
    en_q:'Company X entered an interest rate swap to hedge the interest rate risk on its borrowings and applies deferred hedge accounting. At fiscal year-end, the swap\'s fair value gain was ¥25,000, ignoring tax effects. Record the entry.',
    e:[{d:[['スワップ資産',25000]], c:[['繰延ヘッジ損益',25000]]}],
    exp:'金利スワップとは、「変動金利」と「固定金利」を交換する契約で、借入金の金利変動リスクをヘッジする目的でよく使われます。まるで変動金利の住宅ローンを固定金利に一時的に切り替えるような保険的な取引で、為替予約と同じように、繰延ヘッジ会計を適用すれば、評価益はその期の損益にはせず、いったん純資産の部「繰延ヘッジ損益」として繰延べます。ヘッジ対象（借入金の金利変動）の影響が実際に生じたときに、初めて損益として認識します。'
  },
  { id:812, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'<mark class="q-asset">Ｘ社は保有するコール・オプション（帳簿価額45,000円、原資産である株式を1株＠1,000円で1,000株購入できる権利）を権利行使し、株式1,000,000円を取得した</mark>。権利行使時の仕訳を示しなさい（<mark class="q-asset">現金で権利行使価額を支払う</mark>）。',
    en_q:'Company X exercised a call option (book value ¥45,000, the right to buy 1,000 shares at ¥1,000/share) and acquired shares worth ¥1,000,000. Record the entry at exercise, paying the exercise price in cash.',
    e:[{d:[['有価証券',1045000]], c:[['オプション資産',45000],['現金',1000000]]}],
    exp:'コール・オプションを権利行使すると、それまで資産として計上していた「オプション資産」（権利そのものの価値）は、新しく取得する株式（原資産）の取得原価の一部に振り替わります。株式の取得原価＝権利行使価額（1,000,000円）＋オプション資産の帳簿価額（45,000円）＝1,045,000円。まるで前売り券を実際の入場券に引き換えるようなイメージで、「オプションを買うために払ったお金も、結局は株式を安く買うための費用だった」と考えます。'
  },
  { id:813, level:2, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社が保有するコール・オプション（帳簿価額30,000円）について、<mark class="q-asset">原資産の株価が権利行使価額を下回ったまま満期を迎え、権利を行使せずに失効させた</mark>。仕訳を示しなさい。',
    en_q:"Company X's call option (book value ¥30,000) expired unexercised because the underlying share price stayed below the exercise price through maturity. Record the entry.",
    e:[{d:[['オプション差損益',30000]], c:[['オプション資産',30000]]}],
    exp:'オプションの原資産（株式など）の時価が、権利行使したら損をする水準にとどまったまま満期を迎えると、権利を行使せずに放棄（失効）します。まるで使わなかった割引券がそのまま期限切れになってしまうようなもので、この場合、それまで資産として計上していたオプション資産の帳簿価額の全額が、そのまま損失（オプション差損益）になります。「権利を買うために払ったお金が、まるまる無駄になった」というイメージです。'
  },
  { id:814, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社が保有する子会社株式（帳簿価額800,000円、市場価格なし）について、子会社の財政状態が著しく悪化し、<mark class="q-asset">1株当たり純資産額を基準に評価した実質価額が300,000円まで下落した</mark>。実価法による評価損の仕訳を示しなさい。',
    en_q:"Company X holds subsidiary shares (book value ¥800,000, no market price). The subsidiary's financial condition deteriorated significantly, and the substantial value (based on net assets per share) fell to ¥300,000. Record the write-down entry under the substantial value method.",
    e:[{d:[['子会社株式評価損',500000]], c:[['子会社株式',500000]]}],
    exp:'市場価格のない株式（子会社株式や非上場の関連会社株式など）は、時価評価ができないため、通常は取得原価のまま据え置きます。しかし、発行会社の財政状態が著しく悪化し、実質価額（1株当たり純資産額など）が取得原価に比べて著しく低下した場合は、まるで経営が傾いた会社の実力を健康診断するように、「実価法」により帳簿価額を実質価額まで切り下げます。800,000円－300,000円＝500,000円の評価損を計上します。これは減損に近い考え方で、原則として回復の見込みがない限り、切り下げた金額はそのまま据え置かれます。'
  },
  { id:815, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社が保有する先物取引について、決算日の時価評価により<mark class="q-other">合計30,000円の評価損が生じた</mark>。<mark class="q-asset">これまで計上していた先物取引差金（借方残高、帳簿価額10,000円）を取り崩した</mark>うえで、<mark class="q-liability">超過額20,000円をデリバティブ負債として計上する</mark>仕訳を示しなさい。',
    en_q:"Company X's futures position had a total fair value loss of ¥30,000 at fiscal year-end. Record the entry eliminating the previously recognized futures margin receivable (debit balance, book value ¥10,000) and recognizing the ¥20,000 excess as a derivative liability.",
    e:[{d:[['先物損益',30000]], c:[['先物取引差金',10000],['デリバティブ負債',20000]]}],
    exp:'デリバティブの時価評価によって評価損が生じ、その金額が従来の資産計上額（先物取引差金）を上回る場合は、資産をゼロまで取り崩したうえで、超過分を新たに負債（デリバティブ負債）として計上します。まるで貯金箱の中身がゼロになってもまだ借金が残っているような状態で、含み益の状態から含み損の状態に転じた、という状況です。10,000円（資産の取崩し）＋20,000円（新たな負債計上）＝合計30,000円が当期の評価損（先物損益）となります。'
  },
  { id:816, level:2, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社が保有する満期保有目的の債券（帳簿価額500,000円）について、発行会社の信用状態が著しく悪化したため、<mark class="q-asset">時価400,000円まで評価減し</mark>、回復の見込みがないため<mark class="q-expense">減損処理を行う</mark>。仕訳を示しなさい。',
    en_q:"Company X's held-to-maturity bonds (book value ¥500,000) are written down to their fair value of ¥400,000 due to a significant deterioration in the issuer's credit standing, with no prospect of recovery. Record the impairment entry.",
    e:[{d:[['投資有価証券評価損',100000]], c:[['満期保有目的債券',100000]]}],
    exp:'満期保有目的の債券は、通常は時価評価をせず取得原価（または償却原価）のまま計上しますが、発行会社の財政状態の悪化などにより時価が著しく下落し、かつ回復の見込みがないと判断される場合は、例外的に強制的な評価減（減損処理）を行います。500,000円－400,000円＝100,000円を「投資有価証券評価損」として計上し、満期保有目的債券の帳簿価額を直接切り下げます。'
  },
  { id:817, level:3, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は為替予約についてヘッジ会計を適用していたが、ヘッジ対象であった外貨建取引が中止になったため、ヘッジ会計の要件を満たさなくなった。<mark class="q-equity">繰延べていた繰延ヘッジ損益（貸方残高）40,000円を</mark>、ただちに<mark class="q-other">当期の損益（為替差損益）に振り替える</mark>仕訳を示しなさい。',
    en_q:'Company X applied hedge accounting to a forward contract, but the hedged foreign-currency transaction was cancelled, so the hedge accounting requirements are no longer met. Record the entry immediately reclassifying the deferred hedge gain (¥40,000 credit balance) into current-period profit or loss (foreign exchange gain/loss).',
    e:[{d:[['繰延ヘッジ損益',40000]], c:[['為替差損益',40000]]}],
    exp:'ヘッジ会計は、ヘッジ対象（今回は外貨建取引）とヘッジ手段（為替予約）がセットで存在することを前提に適用されます。ヘッジ対象そのものが消滅・中止になると、もはやヘッジとしての意味がなくなるため、ヘッジ会計を続けることができません（ヘッジ会計の中止）。まるで保険をかけていた対象そのものがなくなってしまい、保険契約だけが宙に浮くようなイメージで、それまで純資産の部に繰延べていた評価損益を、その時点でただちに当期の損益に振り替えます。「ヘッジの前提が崩れたので、繰延べていた分を一気に精算する」というイメージです。'
  },
  { id:818, level:2, cat:'金融商品', chap:'1級：金融商品',
    q:'Ｘ社は転換社債型新株予約権付社債（額面1,000,000円）を発行し、<mark class="q-asset">払込金額1,000,000円を現金で受け取った</mark>。一括法により、<mark class="q-liability">社債と新株予約権を区分せず、全額を社債として処理する</mark>場合の発行時の仕訳を示しなさい。',
    en_q:'Company X issued convertible bonds with warrants (face value ¥1,000,000) and received ¥1,000,000 cash. Under the single-instrument method, the bond and warrant are not separated and the entire amount is recorded as a bond. Record the issuance entry.',
    e:[{d:[['現金',1000000]], c:[['社債',1000000]]}],
    exp:'転換社債型新株予約権付社債の会計処理には、社債部分と新株予約権部分を分けて計上する「区分法」（すでに学んだ方法）のほかに、区分せず全額を社債として一括計上する「一括法」があります。まるで福袋の中身を分けずにまとめて「福袋」という1つの商品として扱うようなイメージで、一括法では、払込金額の全額をそのまま「社債」（負債）として計上するだけで、新株予約権（純資産）は計上しません。どちらの方法を採用するかは会社の任意ですが、区分法の方が「負債性の部分」と「資本性の部分」を明確に分けられるため、実務ではより多く使われています。'
  },

  // ===== 1級：外貨換算会計（在外子会社の換算） =====
  { id:761, level:3, cat:'外貨換算', chap:'1級：連結会計',
    q:'Ｐ社は在外子会社Ｓ社の株式80％を取得し支配を獲得した。<mark class="q-asset">取得対価は60,000ドルで、取得時のレートは1ドル＝100円であり、現金で支払った</mark>。個別財務諸表上の仕訳を示しなさい。',
    en_q:"Company P acquired an 80% stake in overseas subsidiary S, obtaining control, for $60,000 paid in cash at the transaction-date rate of ¥100/USD. Record the entry in P's separate financial statements.",
    e:[{d:[['S社株式',6000000]], c:[['現金',6000000]]}],
    exp:'在外子会社の株式を外貨で取得した場合も、通常の外貨建取引と同じく「取得時のレート（HR：Historical Rate）」で円換算します。海外通販で買い物をした日のレートで請求額が確定するのと同じ発想で、60,000ドル×100円＝6,000,000円。この金額は、その後為替レートが変動しても動かしません（株式のような非貨幣性項目は取得時のレートで固定されるのが原則です）。'
  },
  { id:762, level:3, cat:'外貨換算', chap:'1級：連結会計',
    q:'Ｐ社は在外子会社Ｓ社の支配獲得にあたり、外貨建てのれん40,000ドル（取得時レート1ドル＝100円、円換算額4,000,000円）を連結上計上した。決算時レートが1ドル＝110円になった場合、<mark class="q-asset">連結上ののれんを決算時レートで再換算し</mark>、差額を<mark class="q-equity">「為替換算調整勘定」として計上する</mark>仕訳を示しなさい。',
    en_q:"Company P recognized foreign-currency-denominated goodwill of $40,000 (¥4,000,000 at the ¥100/USD transaction-date rate) on consolidation. When the closing rate became ¥110/USD, record the entry retranslating the goodwill at the closing rate, with the difference recognized as a foreign currency translation adjustment.",
    e:[{d:[['のれん',400000]], c:[['為替換算調整勘定',400000]]}],
    exp:'連結上計上した外貨建てのれんは、外貨建ての「資産」として扱われるため、決算時レート（CR）で換算替えします。40,000ドル×取得時100円＝4,000,000円（計上時）→40,000ドル×決算時110円＝4,400,000円（換算後）。まるで外貨預金の残高が円換算でどう評価されるか毎回変わるようなイメージです。差額400,000円は、のれん自体の価値が変わったわけではなく為替相場の変動によるものなので、損益（のれん償却額など）にはせず、純資産の部の「為替換算調整勘定」に計上します。'
  },
  { id:763, level:3, cat:'外貨換算', chap:'1級：連結会計',
    q:'在外子会社Ｓ社（Ｐ社の持株比率80％）の財務諸表を換算した結果、<mark class="q-equity">連結上「為替換算調整勘定」（貸方）500,000円が生じた</mark>。このうち<mark class="q-equity">非支配株主持分相当額（20％）を按分する</mark>仕訳を示しなさい。',
    en_q:"Translating overseas subsidiary S's (80%-owned by P) financial statements produced a credit foreign currency translation adjustment of ¥500,000 on consolidation. Record the entry allocating the non-controlling interests' 20% share.",
    e:[{d:[['為替換算調整勘定',100000]], c:[['非支配株主持分',100000]]}],
    exp:'為替換算調整勘定は「在外子会社の純資産全体」に対して生じるものなので、親会社の持分だけでなく非支配株主の持分にも按分する必要があります。500,000円×非支配株主持分比率20％＝100,000円を、親会社持分の為替換算調整勘定から非支配株主持分に付け替えます（残り400,000円が親会社に帰属する為替換算調整勘定として連結貸借対照表に残ります）。為替の影響もまた、株主同士でケーキを切り分けるように配分されるのです。'
  },
  { id:764, level:3, cat:'外貨換算', chap:'1級：連結会計',
    q:'Ｐ社は連結上計上した外貨建てのれん（取得時40,000ドル、取得時レート1ドル＝100円）を10年間で均等償却している。<mark class="q-expense">当期の償却額（4,000ドル）を、期中平均レート（AR）1ドル＝105円で換算した</mark>仕訳を示しなさい。',
    en_q:"Company P amortizes foreign-currency goodwill (acquired for $40,000 at ¥100/USD) recognized on consolidation over 10 years straight-line. Record this period's amortization of $4,000, translated at the average rate (AR) of ¥105/USD.",
    e:[{d:[['のれん償却額',420000]], c:[['のれん',420000]]}],
    exp:'のれんの「償却額」は費用（フロー項目）にあたるため、決算時レート（CR）ではなく「期中平均レート（AR）」で換算するのが原則です。4,000ドル×105円＝420,000円。一方、のれんという「資産」の残高そのものは決算時レートで換算するため（前問参照）、償却額の換算レートと残高の換算レートが異なる点が実務上のポイントです。まるで「その日ごとの支出は平均レートで記録、財布の中身自体は今日のレートで評価する」ような使い分けです。'
  },
  { id:765, level:3, cat:'外貨換算', chap:'1級：連結会計',
    q:'在外子会社Ｓ社（Ｐ社の持株比率80％）の当期純利益は50,000ドルであった。連結上、期中平均レート（AR）1ドル＝103円で換算する。<mark class="q-equity">非支配株主に帰属する当期純利益（20％相当）を計上する</mark>仕訳を示しなさい。',
    en_q:"Overseas subsidiary S's (80%-owned by P) net income was $50,000. On consolidation this is translated at the average rate (AR) of ¥103/USD. Record the entry recognizing the 20% portion attributable to non-controlling interests.",
    e:[{d:[['非支配株主に帰属する当期純利益',1030000]], c:[['非支配株主持分',1030000]]}],
    exp:'損益計算書の項目（収益・費用・当期純利益）は、原則として「期中平均レート（AR）」で円換算します。50,000ドル×103円＝5,150,000円（円換算後の当期純利益）。このうち非支配株主の持分20％相当額1,030,000円を、非支配株主に帰属する当期純利益として振り替えます。決算時レートを使う貸借対照表項目とは、換算に使うレートの種類が異なる点に注意しましょう。'
  },
  { id:766, level:3, cat:'外貨換算', chap:'1級：連結会計',
    q:'Ｐ社は保有する在外子会社Ｓ社株式をすべて売却し、<mark class="q-equity">連結上計上されていた為替換算調整勘定300,000円（貸方残高、親会社帰属分）を</mark>、<mark class="q-revenue">子会社株式売却損益に振り替える</mark>こととした。仕訳を示しなさい。',
    en_q:"Company P sold its entire stake in overseas subsidiary S. Record the entry reclassifying the ¥300,000 credit-balance foreign currency translation adjustment (the parent's attributable portion) recognized on consolidation into gain/loss on sale of subsidiary shares.",
    e:[{d:[['為替換算調整勘定',300000]], c:[['子会社株式売却益',300000]]}],
    exp:'「その他有価証券評価差額金」は売却しても損益に振り替えられませんが、「為替換算調整勘定」は在外子会社株式を売却（連結範囲から外れる）した時点で、これとは異なり「実現」したものとしてその期の損益に振り替えられます（リサイクリング）。まるで「含み損益として眺めていただけの評価差額が、手放した瞬間にようやく確定した利益として計算に入る」ようなイメージで、これは1級試験でよく問われる重要な相違点です。'
  },
  { id:767, level:2, cat:'外貨換算', chap:'1級：連結会計',
    q:'<mark class="q-asset">在外子会社Ｓ社は、現地で機械装置を30,000ドルで購入し、現金で支払った</mark>。取得時のレートは1ドル＝105円であった。Ｓ社の現地帳簿（円換算後）における仕訳を示しなさい。',
    en_q:"Overseas subsidiary S purchased machinery locally for $30,000 cash. The transaction-date rate was ¥105/USD. Record the entry in S's local books, translated to yen.",
    e:[{d:[['機械装置',3150000]], c:[['現金',3150000]]}],
    exp:'固定資産のような非貨幣性項目は、取得時のレート（HR）で換算し、その後の決算時レートの変動があっても換算替えしません（取得原価のまま据え置きます）。海外で買った家具の値段が、日本に持ち帰った後も購入時のレートで記録され続けるようなイメージです。30,000ドル×105円＝3,150,000円。この金額は、減価償却を通じて費用化される際も、取得時に確定したこの円換算額を基準に計算します。'
  },
  { id:768, level:2, cat:'外貨換算', chap:'1級：連結会計',
    q:'在外子会社Ｓ社は、当期に<mark class="q-revenue">商品を80,000ドル分販売した</mark>（<mark class="q-asset">掛け</mark>）。連結上の損益計算書に反映させる際は、期中平均レート（AR）1ドル＝104円で換算する。この売上高を計上する仕訳を示しなさい。',
    en_q:"Overseas subsidiary S sold $80,000 of merchandise on credit during the period. For consolidation purposes this is translated at the average rate (AR) of ¥104/USD. Record the entry recognizing this sales revenue.",
    e:[{d:[['売掛金',8320000]], c:[['売上',8320000]]}],
    exp:'損益計算書項目（収益・費用）は、個々の取引が発生した都度のレートではなく、実務上は簡便的に「期中平均レート（AR）」でまとめて換算するのが一般的です。80,000ドル×104円＝8,320,000円。これに対し、対応する売掛金（貸借対照表項目）は、決算時には改めて決算時レート（CR）で換算し直される点に注意が必要です（のれんと同じ考え方です）。'
  },

  // ===== 1級：退職給付会計 =====
  { id:769, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'<mark class="q-liability">Ｘ社の年金資産の実際運用収益が期待運用収益を50,000円下回り、数理計算上の差異（不利差異）50,000円が発生した</mark>。連結財務諸表上、<mark class="q-equity">この差異を即時に「退職給付に係る調整累計額」として認識する</mark>仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X's actual return on plan assets fell short of the expected return by ¥50,000, generating an unfavorable actuarial difference of ¥50,000. On consolidation, record the entry immediately recognizing this difference in accumulated remeasurements of defined benefit plans, ignoring tax effects.",
    e:[{d:[['退職給付に係る調整累計額',50000]], c:[['退職給付引当金',50000]]}],
    exp:'個別財務諸表では、数理計算上の差異は発生時に全額を費用にはせず、「未認識数理計算上の差異」として翌期以降に少しずつ償却していきます。しかし連結財務諸表では、この未認識部分も含めて退職給付債務と年金資産の差額全額をそのままＢ／Ｓに計上するルールになっており、まるで個人的な借金の帳簿を、家族全体の連結家計簿では隠さず全部見せるようなイメージで、未認識だった差異はその期の包括利益（純資産の部「退職給付に係る調整累計額」）として即時に認識されます。これが「個別上は将来に繰延べ、連結上は即時認識」という、1級で頻出の重要な相違点です。'
  },
  { id:770, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は前期に発生した数理計算上の差異50,000円を、平均残存勤務期間10年にわたって定額法で費用処理している。<mark class="q-expense">当期の償却額（5,000円）を計上する</mark>仕訳を示しなさい（個別財務諸表上の処理）。',
    en_q:"Company X amortizes an actuarial difference of ¥50,000 that arose last period straight-line over an average remaining service period of 10 years. Record this period's amortization of ¥5,000 in the separate (unconsolidated) financial statements.",
    e:[{d:[['退職給付費用',5000]], c:[['退職給付引当金',5000]]}],
    exp:'個別財務諸表では、数理計算上の差異は発生時に全額を費用処理せず、平均残存勤務期間などの一定の年数にわたって規則的に償却していきます。まるで大きな出費をローンで分割払いするように、50,000円÷10年＝5,000円を毎期の「退職給付費用」に追加していきます。段階的に費用化する点が、即時認識する連結上の処理と異なります。'
  },
  { id:771, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は退職金規程を改定し、退職給付水準を引き下げた。この結果、<mark class="q-liability">退職給付債務が400,000円減少した（過去勤務費用の発生、有利差異）</mark>。連結財務諸表上、<mark class="q-equity">この全額を即時に認識する</mark>仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X amended its retirement benefit plan, reducing benefit levels. This decreased the retirement benefit obligation by ¥400,000 (a favorable past service cost). On consolidation, record the entry immediately recognizing this full amount, ignoring tax effects.",
    e:[{d:[['退職給付引当金',400000]], c:[['退職給付に係る調整累計額',400000]]}],
    exp:'退職給付水準の「引き下げ」による過去勤務費用は、退職給付債務を減らす方向（会社にとって有利）に働きます。まるで会社が将来の年金支給額を見直して、負担が軽くなったようなイメージで、連結財務諸表上は、この有利差異も即時にＢ／Ｓへ反映するため、「退職給付引当金」（負債）を減額し、相手科目として純資産の部の「退職給付に係る調整累計額」を増額します。'
  },
  { id:772, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は確定給付企業年金制度に基づき、<mark class="q-asset">年金資産に掛金150,000円を現金で拠出した</mark>。仕訳を示しなさい。',
    en_q:'Under its defined benefit pension plan, Company X contributed ¥150,000 cash to plan assets. Record the entry.',
    e:[{d:[['退職給付引当金',150000]], c:[['現金',150000]]}],
    exp:'会社が年金基金に掛金を拠出すると、その分だけ会社の負担（退職給付債務と年金資産の差額＝退職給付引当金）が減少します。まるで将来の分割払いを一部前払いして残債を減らすようなイメージで、「将来払うはずだったお金を、先に年金基金へ払い込んだ」ということから、退職給付引当金（負債）を直接減額します。'
  },
  { id:773, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'当期の退職給付費用を計算する。<mark class="q-expense">勤務費用120,000円・利息費用40,000円・期待運用収益15,000円・数理計算上の差異の費用処理額8,000円（費用側）・過去勤務費用の費用処理額△3,000円（利益側）</mark>。退職給付費用を計上する仕訳を示しなさい。',
    en_q:'Compute this period\'s retirement benefit expense: service cost ¥120,000, interest cost ¥40,000, expected return on plan assets ¥15,000, amortization of actuarial differences ¥8,000 (expense-increasing), amortization of past service cost -¥3,000 (expense-reducing). Record the entry recognizing the retirement benefit expense.',
    e:[{d:[['退職給付費用',150000]], c:[['退職給付引当金',150000]]}],
    exp:'個別財務諸表上の退職給付費用は、①勤務費用（当期労働により新たに発生した給付義務）＋②利息費用（割引計算により時の経過で増える現在価値相当額）－③期待運用収益（年金資産の運用で得られるはずの収益）＋④数理計算上の差異の費用処理額（過去に繰延べた差異のうち当期償却分）＋⑤過去勤務費用の費用処理額、の合計で計算します。まるで住宅ローンの毎月の支払額が「元本」「利息」「保険料」などいくつもの要素の合計で決まるのと似ています。120,000＋40,000－15,000＋8,000－3,000＝150,000円。過去勤務費用の償却額がマイナス（△3,000円）になっているのは、退職給付水準の引き下げ（会社に有利な改定）による過去勤務費用を償却しているためです。'
  },
  { id:774, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'連結財務諸表において、<mark class="q-expense">当期に数理計算上の差異の費用処理額（組替調整額）12,000円を、退職給付費用として計上する</mark>とともに、<mark class="q-equity">その他の包括利益（退職給付に係る調整累計額）から同額を減額する</mark>。仕訳を示しなさい。',
    en_q:"On consolidation, record the entry recognizing ¥12,000 of amortized actuarial differences (a reclassification adjustment) as retirement benefit expense, while reducing accumulated remeasurements of defined benefit plans by the same amount.",
    e:[{d:[['退職給付費用',12000]], c:[['退職給付に係る調整累計額',12000]]}],
    exp:'連結財務諸表では、数理計算上の差異は発生した期に全額を「退職給付に係る調整累計額」（純資産）として即時認識済みです（別問参照）。翌期以降、この差異の一部を個別財務諸表と同じように償却して「退職給付費用」として当期純利益に計上する際は、二重計上を防ぐため、まるで一度全部記録した内容を後から少しずつ本当の帳簿に移し替えるように、同額を「退職給付に係る調整累計額」から取り崩します（これを「組替調整額」と呼びます）。退職給付債務・年金資産の総額（＝退職給付引当金）自体は変動しません。'
  },
  { id:775, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'<mark class="q-liability">Ｘ社の年金資産の実際運用収益が期待運用収益を100,000円下回り、数理計算上の差異（不利差異）100,000円が発生した</mark>。連結財務諸表上、<mark class="q-asset">実効税率30％として税効果を考慮した</mark>うえで、<mark class="q-equity">この差異を「退職給付に係る調整累計額」として計上する</mark>仕訳を示しなさい。',
    en_q:"Company X's actual return on plan assets fell short of the expected return by ¥100,000, generating an unfavorable actuarial difference of ¥100,000. On consolidation, applying tax-effect accounting at an effective tax rate of 30%, record the entry recognizing this difference in accumulated remeasurements of defined benefit plans.",
    e:[{d:[['退職給付に係る調整累計額',70000],['繰延税金資産',30000]], c:[['退職給付引当金',100000]]}],
    exp:'連結財務諸表で即時認識する退職給付に係る差異にも、税効果会計を適用します。将来の費用計上（損金算入）につながる不利差異なので、税金負担を軽減する効果（繰延税金資産）30,000円（100,000×30％）を認識し、残り70,000円を税引後の金額として純資産の部「退職給付に係る調整累計額」に計上します。退職給付引当金（負債）は税効果を挟まず全額100,000円増加させます。'
  },
  { id:776, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は前期に発生した過去勤務費用（退職給付水準の引き上げによるもの）240,000円を、平均残存勤務期間8年にわたって定額法で費用処理している。<mark class="q-expense">当期の償却額を計上する</mark>仕訳を示しなさい（個別財務諸表上の処理）。',
    en_q:"Company X amortizes past service cost of ¥240,000 (from a benefit-level increase) that arose last period straight-line over an average remaining service period of 8 years. Record this period's amortization in the separate financial statements.",
    e:[{d:[['退職給付費用',30000]], c:[['退職給付引当金',30000]]}],
    exp:'過去勤務費用（退職金規程の改定などにより生じる退職給付債務の変動額）も、数理計算上の差異と同様に、個別財務諸表では発生時に全額を費用処理せず、平均残存勤務期間等の一定の年数で規則的に償却します。まるで大きな制度変更のコストを何年かに分けて少しずつ吸収していくようなイメージで、240,000円÷8年＝30,000円を当期の「退職給付費用」に追加します。'
  },
  { id:819, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'<mark class="q-liability">Ｘ社の年金資産の実際運用収益が期待運用収益を60,000円上回り、数理計算上の差異（有利差異）60,000円が発生した</mark>。連結財務諸表上、<mark class="q-equity">この差異を即時に「退職給付に係る調整累計額」として認識する</mark>仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X's actual return on plan assets exceeded the expected return by ¥60,000, generating a favorable actuarial difference of ¥60,000. On consolidation, record the entry immediately recognizing this difference in accumulated remeasurements of defined benefit plans, ignoring tax effects.",
    e:[{d:[['退職給付引当金',60000]], c:[['退職給付に係る調整累計額',60000]]}],
    exp:'運用が予想以上にうまくいった場合（実際運用収益＞期待運用収益）は、有利差異として、退職給付債務と年金資産の差額（＝会社の負担）を減らす方向に働きます。まるで積立投資が予想以上に値上がりして、将来の負担が軽くなったようなイメージで、連結財務諸表上は即時に認識するため、「退職給付引当金」（負債）を減額し、相手科目として純資産の部「退職給付に係る調整累計額」を増額します。不利差異のケース（別問参照）とは、借方・貸方が逆になる点を確認しましょう。'
  },
  { id:820, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は退職金規程を改定し、退職給付水準を引き上げた。この結果、<mark class="q-liability">退職給付債務が350,000円増加した（過去勤務費用の発生、不利差異）</mark>。連結財務諸表上、<mark class="q-equity">この全額を即時に認識する</mark>仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X amended its retirement benefit plan, raising benefit levels. This increased the retirement benefit obligation by ¥350,000 (an unfavorable past service cost). On consolidation, record the entry immediately recognizing this full amount, ignoring tax effects.',
    e:[{d:[['退職給付に係る調整累計額',350000]], c:[['退職給付引当金',350000]]}],
    exp:'退職給付水準の「引き上げ」による過去勤務費用は、退職給付債務を増やす方向（会社にとって不利）に働きます。まるで従業員への待遇改善によって将来の負担が重くなったようなイメージで、連結財務諸表上は即時にＢ／Ｓへ反映するため、「退職給付引当金」（負債）を増額し、相手科目として純資産の部の「退職給付に係る調整累計額」を減額します。水準を引き下げた場合（別問参照）とは正反対の方向に動きます。'
  },
  { id:821, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の期首退職給付債務は3,000,000円であった。<mark class="q-expense">当期の勤務費用150,000円・利息費用60,000円が発生した</mark>場合の、退職給付債務の増加を認識する仕訳を示しなさい（<mark class="q-liability">退職給付引当金の増加として処理する</mark>）。',
    en_q:"Company X's opening retirement benefit obligation was ¥3,000,000. This period, service cost of ¥150,000 and interest cost of ¥60,000 arose. Record the entry recognizing the increase in the retirement benefit obligation.",
    e:[{d:[['退職給付費用',210000]], c:[['退職給付引当金',210000]]}],
    exp:'退職給付債務は、期首残高に「勤務費用」（当期の労働により新たに発生した義務）と「利息費用」（割引計算により時の経過で増える現在価値相当額）を加えて増加していきます。まるで借金の残高に、新たに借りた分と利子が上乗せされていくようなイメージで、150,000円＋60,000円＝210,000円が当期の増加分です。これは個別財務諸表上、「退職給付費用」（費用）と「退職給付引当金」（負債）の両方を増やす仕訳として処理されます。'
  },
  { id:822, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社の年金資産について、期首残高2,000,000円に対し、<mark class="q-expense">期待運用収益40,000円が発生した</mark>。<mark class="q-liability">年金資産の増加（退職給付引当金の減少）を認識する</mark>仕訳を示しなさい。',
    en_q:"Company X's plan assets had an opening balance of ¥2,000,000, and expected return on plan assets of ¥40,000 arose. Record the entry recognizing the increase in plan assets (a decrease in the retirement benefit obligation).",
    e:[{d:[['退職給付引当金',40000]], c:[['退職給付費用',40000]]}],
    exp:'年金資産は、外部の年金基金で運用されている資産で、増えるほど会社の正味の負担（退職給付債務－年金資産＝退職給付引当金）が減ります。まるで積立投資が値上がりして、将来の必要資金が少なく済むようなイメージで、期待運用収益（予定利率などから見積もった運用による増加分）40,000円が生じた分だけ、退職給付引当金を減額し、退職給付費用も同額減額します（退職給付費用の計算式で期待運用収益がマイナス項目だったことを思い出しましょう）。'
  },
  { id:823, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は確定拠出年金制度を採用しており、当期の<mark class="q-expense">掛金80,000円を</mark>、<mark class="q-asset">現金で外部の年金基金に拠出した</mark>。仕訳を示しなさい。',
    en_q:'Company X uses a defined contribution pension plan and contributed ¥80,000 cash to an external pension fund this period. Record the entry.',
    e:[{d:[['退職給付費用',80000]], c:[['現金',80000]]}],
    exp:'確定拠出年金制度（DC）は、会社が一定額の掛金を外部に拠出すれば、それ以降の運用リスクを会社が負わない制度です（確定給付制度ＤＢとは異なり、将来の給付額を会社が保証しません）。まるで積立NISAの口座に毎月入金するだけで、その後の運用成績は加入者次第、というイメージで、複雑な退職給付債務の計算は不要で、単純に「掛金を拠出した時点」で費用（退職給付費用）として処理して完了します。ＤＢ制度のように「退職給付引当金」という負債は計上しません。'
  },
  { id:824, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は確定給付企業年金制度（ＤＢ）の一部を確定拠出年金制度（ＤＣ）に移行した。<mark class="q-liability">移行により消滅した退職給付債務は600,000円、移換した年金資産は550,000円であった</mark>。<mark class="q-revenue">この移行にともなう損益を計上する</mark>仕訳を示しなさい。',
    en_q:'Company X converted part of its defined benefit (DB) pension plan to a defined contribution (DC) plan. The obligation extinguished was ¥600,000, and the plan assets transferred were ¥550,000. Record the entry recognizing the gain from this conversion.',
    e:[{d:[['退職給付引当金',50000]], c:[['退職給付制度終了益',50000]]}],
    exp:'ＤＢ制度からＤＣ制度へ制度の一部を移行すると、その部分についてはもはや会社が将来の運用リスクを負わなくなるため、「退職給付制度の終了」として処理します。まるで会社が抱えていた将来の重い約束の一部を、外部に肩代わりしてもらうようなイメージで、消滅する退職給付債務600,000円と、移換する年金資産550,000円の差額（＝会社の正味負担の減少額）50,000円を、退職給付引当金の取崩しと「退職給付制度終了益」（特別利益）として計上します。ＤＢの一部がＤＣに置き換わることで、会社の将来負担が軽くなったことを表しています。'
  },
  { id:825, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は、前期に発生した数理計算上の差異80,000円（平均残存勤務期間8年で償却中、当期はその2年目にあたる）に加え、当期新たに数理計算上の差異90,000円（平均残存勤務期間9年）が発生した。<mark class="q-expense">当期の償却額の合計（前期発生分の2年目償却＋当期発生分の1年目償却）を計上する</mark>仕訳を示しなさい。',
    en_q:"Company X is amortizing an actuarial difference of ¥80,000 that arose last period (over an 8-year average remaining service period; this is year 2 of that amortization), and this period a new actuarial difference of ¥90,000 arose (9-year average remaining service period). Record the entry recognizing the combined amortization (year 2 of the prior difference plus year 1 of the new one).",
    e:[{d:[['退職給付費用',20000]], c:[['退職給付引当金',20000]]}],
    exp:'実務では、数理計算上の差異は毎期のように発生するため、複数の年度に発生した差異が同時に償却されていきます。まるで複数のローンを同時に返済しているようなイメージで、前期発生分（80,000円÷8年＝10,000円、2年目の償却）と、当期新たに発生した分（90,000円÷9年＝10,000円、1年目の償却）を合算して、当期の退職給付費用に加えます：10,000円＋10,000円＝20,000円。「発生年度の異なる複数の差異を、それぞれ独立して償却し、合算する」という実務上の処理方法を確認する問題です。'
  },
  { id:826, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'連結財務諸表において、<mark class="q-expense">当期に過去勤務費用の費用処理額（組替調整額）18,000円を、退職給付費用として計上する</mark>とともに、<mark class="q-equity">その他の包括利益（退職給付に係る調整累計額）から同額を減額する</mark>。仕訳を示しなさい。',
    en_q:"On consolidation, record the entry recognizing ¥18,000 of amortized past service cost (a reclassification adjustment) as retirement benefit expense, while reducing accumulated remeasurements of defined benefit plans by the same amount.",
    e:[{d:[['退職給付費用',18000]], c:[['退職給付に係る調整累計額',18000]]}],
    exp:'数理計算上の差異と同じように、過去勤務費用についても、連結財務諸表では発生時に即時認識した後、個別財務諸表と同じペースで償却した分を「組替調整額」として退職給付費用に計上し、同額を「退職給付に係る調整累計額」から取り崩します。二重計上を防ぐための処理で、退職給付債務・年金資産の総額（退職給付引当金）自体はこの仕訳では変動しません。'
  },
  { id:827, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は退職金規程を改定し、退職給付水準を引き上げた。この結果、<mark class="q-liability">退職給付債務が200,000円増加した（過去勤務費用の発生、不利差異）</mark>。連結財務諸表上、<mark class="q-asset">実効税率30％として税効果を考慮した</mark>うえで、<mark class="q-equity">この差異を認識する</mark>仕訳を示しなさい。',
    en_q:'Company X amended its retirement benefit plan, raising benefit levels. This increased the retirement benefit obligation by ¥200,000 (an unfavorable past service cost). On consolidation, applying tax-effect accounting at an effective tax rate of 30%, record the entry recognizing this difference.',
    e:[{d:[['退職給付に係る調整累計額',140000],['繰延税金資産',60000]], c:[['退職給付引当金',200000]]}],
    exp:'過去勤務費用の即時認識にも税効果会計を適用します。将来の費用計上（損金算入）につながる不利差異なので、税金負担を軽減する効果（繰延税金資産）60,000円（200,000×30％）を認識し、残り140,000円を税引後の金額として「退職給付に係る調整累計額」に計上します。退職給付引当金（負債）は税効果を挟まず全額200,000円増加させます。'
  },
  { id:828, level:3, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は早期退職優遇制度を実施し、対象者の退職により<mark class="q-liability">退職給付債務が270,000円減少した。対応する年金資産の減少額は230,000円であった</mark>。<mark class="q-revenue">制度の一部終了にともなう損益を計上する</mark>仕訳を示しなさい。',
    en_q:"Company X implemented an early retirement incentive program. The resulting retirements reduced the retirement benefit obligation by ¥270,000, with a corresponding ¥230,000 decrease in plan assets. Record the entry recognizing the gain from this partial plan settlement.",
    e:[{d:[['退職給付引当金',40000]], c:[['退職給付制度終了益',40000]]}],
    exp:'早期退職優遇制度などにより、対象となる従業員が一斉に退職すると、それに対応する退職給付債務と年金資産がまとめて消滅します（「退職給付制度の一部終了」と呼びます）。まるで一部の社員が退職金を受け取って一気に「卒業」していくイメージで、消滅する退職給付債務270,000円の方が、対応する年金資産の減少額230,000円よりも大きいため、差額40,000円は会社の負担が軽くなったことを意味し、「退職給付制度終了益」として利益計上します。'
  },
  { id:829, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'Ｘ社は業界団体が運営する複数事業主制度の企業年金に加入しており、自社の拠出に対応する年金資産・年金負債を合理的に区分計算することができない。当期の<mark class="q-expense">掛金拠出額120,000円を</mark>、<mark class="q-asset">現金で支払った</mark>場合の仕訳を示しなさい（確定拠出制度に準じて処理する）。',
    en_q:"Company X participates in a multiemployer pension plan operated by an industry association, and cannot reasonably determine its share of plan assets and obligations. Record the entry for this period's cash contribution of ¥120,000, accounted for as if it were a defined contribution plan.",
    e:[{d:[['退職給付費用',120000]], c:[['現金',120000]]}],
    exp:'複数の企業が共同で加入する年金制度（複数事業主制度）で、自社が負担すべき年金資産・年金負債の金額を合理的に計算できない場合は、通常のＤＢ制度のように複雑な数理計算を行わず、まるで大きな共同プールに参加費を払うだけで自分の取り分が分からないようなイメージで、確定拠出制度と同様に、拠出した掛金の額をそのまま「退職給付費用」として処理することが認められています。「計算できないものは、シンプルに掛金＝費用として扱う」という実務上の簡便的な取り扱いです。'
  },
  { id:830, level:2, cat:'退職給付', chap:'1級：退職給付会計',
    q:'従業員数が少ない中小企業であるＸ社は、退職給付会計に「簡便法」を採用している。<mark class="q-liability">期末自己都合要支給額（従業員が全員自己都合で退職した場合に支払うべき額）が期首より50,000円増加した</mark>。<mark class="q-expense">この増加額を退職給付費用として計上する</mark>仕訳を示しなさい。',
    en_q:'Company X, a small business with few employees, uses the simplified method for retirement benefit accounting. The year-end voluntary-resignation benefit obligation (the amount payable if all employees resigned voluntarily) increased by ¥50,000 from the beginning of the year. Record the entry recognizing this increase as retirement benefit expense.',
    e:[{d:[['退職給付費用',50000]], c:[['退職給付引当金',50000]]}],
    exp:'従業員数の少ない小規模な企業では、数理計算上の差異や利息費用・期待運用収益を細かく計算する原則法の代わりに、「簡便法」を採用することが認められています。簡便法では、期末時点で従業員全員が自己都合退職した場合に支払うべき金額（期末自己都合要支給額）を退職給付債務とみなし、まるで「今すぐ全員が辞めたらいくら払うか」を目安にする簡易な見積り方法で、その期中の増加額をそのまま退職給付費用として計上します。複雑な数理計算をせずに済む、実務的な近似計算です。'
  },

  // ===== 1級：減損会計（応用） =====
  { id:777, level:3, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は建物（帳簿価額800,000円）と機械装置（帳簿価額400,000円）を一体として使用しているため、これらをひとつの資産グループとして減損会計を適用している。<mark class="q-expense">資産グループ全体の回収可能価額は900,000円と算定され、減損損失の認識が必要と判定された</mark>。<mark class="q-asset">減損損失300,000円を帳簿価額の比率で建物・機械装置に配分する</mark>仕訳を示しなさい。',
    en_q:'Company X treats a building (book value ¥800,000) and machinery (book value ¥400,000) as a single asset group because they are used together. The group\'s recoverable amount was determined to be ¥900,000, requiring recognition of an impairment loss. Record the entry allocating the ¥300,000 impairment loss to the building and machinery in proportion to their book values.',
    e:[{d:[['減損損失',300000]], c:[['建物',200000],['機械装置',100000]]}],
    exp:'複数の資産が一体となってキャッシュ・フローを生み出している場合、個々の資産ごとではなく「資産グループ」全体で減損会計を適用します。まるでレストランの建物と厨房設備をセットで「1つの事業」として評価するようなイメージで、グループ全体の帳簿価額1,200,000円（800,000＋400,000）－回収可能価額900,000円＝減損損失300,000円。この総額を、個々の資産の帳簿価額の比率で配分します。建物：300,000×(800,000／1,200,000)＝200,000円、機械装置：300,000×(400,000／1,200,000)＝100,000円。「グループ全体でいくら損したか」を先に計算し、それを構成資産に振り分ける、という2段階の処理がポイントです。'
  },
  { id:778, level:3, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が買収した事業（資産グループ帳簿価額900,000円［内訳：建物600,000円・備品300,000円］、のれん帳簿価額300,000円、合計1,200,000円）について、<mark class="q-expense">のれんを含む、より大きな単位で減損損失600,000円を認識した</mark>。減損損失は原則としてのれんに優先的に配分するというルールに従い、<mark class="q-asset">まずのれんの帳簿価額300,000円全額を減損し、残額300,000円を資産グループの各資産の帳簿価額比で配分する</mark>場合の仕訳を示しなさい。',
    en_q:'On testing a larger unit that includes goodwill (goodwill book value ¥300,000; asset group book value ¥900,000, consisting of a building at ¥600,000 and equipment at ¥300,000; total ¥1,200,000), an impairment loss of ¥600,000 was recognized. Per the rule that impairment losses are first allocated to goodwill, the entire ¥300,000 goodwill balance is written off first, and the remaining ¥300,000 is allocated to the asset group\'s assets by book value. Record the entry.',
    e:[{d:[['減損損失',600000]], c:[['のれん',300000],['建物',200000],['備品',100000]]}],
    exp:'「のれんを含む、より大きな単位」で減損テストを行った結果、減損損失が生じた場合、原則としてまず「のれん」の帳簿価額を優先的に減損します（のれんは単独では収益を生まない資産なので、最初に切り捨てる扱いです）。まるで会社の看板価値から先に評価を下げていくイメージで、のれん300,000円を全額減損した後、なお残る損失300,000円を、資産グループを構成する各資産（建物・備品）の帳簿価額比率で配分します。建物：300,000×(600,000／900,000)＝200,000円、備品：300,000×(300,000／900,000)＝100,000円。'
  },
  { id:779, level:3, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社の本社建物（共用資産、帳簿価額500,000円）を含めて、より大きな単位で減損テストを行った。この単位には資産グループＡ（機械装置、帳簿価額800,000円）と資産グループＢ（備品、帳簿価額700,000円）も含まれ、合計帳簿価額は2,000,000円である。<mark class="q-expense">より大きな単位全体の回収可能価額が1,500,000円と算定され、減損損失500,000円を認識した</mark>。<mark class="q-asset">この損失を帳簿価額の比率で機械装置・備品・建物（共用資産）に配分する</mark>仕訳を示しなさい。',
    en_q:"Company X tested a larger unit that includes its headquarters building (a shared asset, book value ¥500,000), together with asset group A (machinery, ¥800,000) and asset group B (equipment, ¥700,000) — total book value ¥2,000,000. The unit's recoverable amount was ¥1,500,000, recognizing an impairment loss of ¥500,000. Record the entry allocating this loss to machinery, equipment, and the building (shared asset) by book value.",
    e:[{d:[['減損損失',500000]], c:[['機械装置',200000],['備品',175000],['建物',125000]]}],
    exp:'本社建物のように、複数の資産グループに共通して使われ、単独ではキャッシュ・フローを生み出さない資産を「共用資産」と呼びます。まるで工場全体を支える本社ビルのような存在で、共用資産の減損は、共用資産を含む「より大きな単位」全体で判定し、生じた減損損失を各構成資産（資産グループＡ・Ｂ・共用資産）の帳簿価額の比率で配分します。機械装置：500,000×(800,000／2,000,000)＝200,000円、備品：500,000×(700,000／2,000,000)＝175,000円、建物：500,000×(500,000／2,000,000)＝125,000円。「個別の資産グループでは減損の兆候がなくても、共用資産を含めた全体で見ると回収できない」というケースを扱う、1級特有の論点です。'
  },
  { id:780, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が保有する使用を休止している土地（遊休資産、帳簿価額1,000,000円）について、<mark class="q-asset">正味売却価額が700,000円であることが判明した</mark>。遊休資産は使用価値を見積れないため、正味売却価額を回収可能価額として<mark class="q-expense">減損損失を計上する</mark>。仕訳を示しなさい。',
    en_q:'Company X owns idle land (book value ¥1,000,000) that is not in use, and determined its net realizable value to be ¥700,000. Since value in use cannot be estimated for idle assets, the recoverable amount is based solely on net realizable value. Record the impairment loss entry.',
    e:[{d:[['減損損失',300000]], c:[['土地',300000]]}],
    exp:'稼働を停止している「遊休資産」は、将来キャッシュ・フローを生み出さない（使用価値を見積れない）ため、回収可能価額は正味売却価額（今売ったらいくらか）だけで判定します。まるで使っていない空き地を、今すぐ売るといくらになるかだけで評価するようなイメージで、帳簿価額1,000,000円－正味売却価額700,000円＝減損損失300,000円。通常の固定資産のように「使用価値と正味売却価額のいずれか高い方」を比較する必要がなく、シンプルに売却価値だけで判定する点が特徴です。'
  },
  { id:781, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は前期末に機械装置（取得原価1,000,000円、減損損失前の帳簿価額600,000円）について減損損失200,000円を計上した（減損後帳簿価額400,000円、残存耐用年数4年、残存価額ゼロ、定額法）。<mark class="q-expense">当期の減価償却費を計上する</mark>仕訳を示しなさい。',
    en_q:'At the end of last period, Company X recognized a ¥200,000 impairment loss on machinery (acquisition cost ¥1,000,000; pre-impairment book value ¥600,000), leaving a post-impairment book value of ¥400,000, with 4 years of remaining useful life and zero residual value, depreciated straight-line. Record this period\'s depreciation entry.',
    e:[{d:[['減価償却費',100000]], c:[['減価償却累計額',100000]]}],
    exp:'減損損失を計上した後の資産は、減損後の帳簿価額（取得原価ではなく）を新たな基礎として、残存耐用年数にわたって減価償却を続けます（切放し法）。まるで一度大きく値下げした中古品を、その値下げ後の値段を基準に価値を減らし続けるようなイメージで、減損後帳簿価額400,000円÷残存耐用年数4年＝100,000円。減損は「その時点での評価減」であり、その後は通常どおり規則的に費用配分（減価償却）を続けていく、という考え方です。なお日本基準では、減損後に業績が回復しても減損損失の戻し入れは行いません（IFRSとの大きな違いの一つです）。'
  },

  // ===== 1級：リース会計（応用） =====
  { id:782, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'<mark class="q-asset">Ｘ社は保有する機械装置（帳簿価額800,000円）をリース会社に1,000,000円で売却し、現金を受け取った</mark>。同時にこの機械装置をファイナンス・リースとしてリースバックする契約を締結した。セール・アンド・リースバック取引に該当するため、<mark class="q-liability">売却益は繰延べ処理する</mark>。売却時の仕訳を示しなさい。',
    en_q:'Company X sold machinery (book value ¥800,000) to a leasing company for ¥1,000,000 cash, and simultaneously leased it back under a finance lease. Because this qualifies as a sale-and-leaseback transaction, the sale gain is deferred. Record the entry at the time of sale.',
    e:[{d:[['現金',1000000]], c:[['機械装置',800000],['長期前受収益',200000]]}],
    exp:'セール・アンド・リースバックとは、自社が保有する資産をいったんリース会社に売却し、その資産を改めてリースで借り受ける（リースバックする）取引です。まるで自宅を一度売却してから同じ家を賃貸で借り直すようなイメージで、リースバックがファイナンス・リースに該当する場合、実質的には「その資産を担保にお金を借りた」のと変わらないとみなされ、売却益を通常の固定資産売却益のようにその場で計上せず、いったん「長期前受収益」（負債）として繰延べます。現金1,000,000円－機械装置の帳簿価額800,000円＝売却益相当額200,000円を長期前受収益として計上します。'
  },
  { id:783, level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'上記のリースバック契約について、<mark class="q-asset">リース資産</mark>・<mark class="q-liability">リース債務</mark>を売却価額1,000,000円で計上する仕訳を示しなさい（利子込み法）。',
    en_q:'For the leaseback above, record the entry recognizing the leased asset and lease liability at the ¥1,000,000 sale price (interest-included method).',
    e:[{d:[['リース資産',1000000]], c:[['リース債務',1000000]]}],
    exp:'リースバックの開始時は、通常のファイナンス・リースと同様に「リース資産／リース債務」を計上します。セール・アンド・リースバックでは、この金額は売却価額（＝リース物件の見積現金購入価額とみなす）を用いるのが一般的です。前の問題で計上した売却益の繰延べとは別に、リース自体は通常のリース取引と同じ流れで処理します。'
  },
  { id:784, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'上記のリース資産（計上額1,000,000円、リース期間5年、残存価額ゼロ、定額法）について、<mark class="q-expense">1年分の減価償却費を計上する</mark>とともに、<mark class="q-liability">繰延べた長期前受収益200,000円を同じ耐用年数にわたって取り崩し、減価償却費から控除する</mark>。1年分の仕訳を示しなさい。',
    en_q:'For the leased asset above (¥1,000,000, 5-year lease term, zero residual value, straight-line), record one year of depreciation, and also amortize the ¥200,000 deferred gain over the same term, offsetting it against depreciation expense.',
    e:[{d:[['減価償却費',200000]], c:[['リース資産減価償却累計額',200000]]}, {d:[['長期前受収益',40000]], c:[['減価償却費',40000]]}],
    exp:'繰延べた売却益（長期前受収益）は、リース資産の減価償却費の計上に対応させて、同じ期間・比率で取り崩し、減価償却費と相殺します。まるで「値引き分を毎月少しずつ家賃から差し引いていく」ようなイメージで、減価償却費：1,000,000÷5年＝200,000円。長期前受収益の取崩額：200,000÷5年＝40,000円。結果として、損益計算書に表示される正味の減価償却費は200,000－40,000＝160,000円となります。「売却益を一気に利益にせず、資産を使う期間にわたって少しずつ、費用を軽減する形で認識していく」というのがセール・アンド・リースバックの本質です。'
  },
  { id:785, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転ファイナンス・リース（リース資産計上額1,200,000円、リース物件の経済的耐用年数8年、リース期間5年）を契約した。所有権移転ファイナンス・リースの場合、自己所有の固定資産と同様に経済的耐用年数で減価償却する。<mark class="q-expense">1年分の減価償却費を計上する</mark>仕訳を示しなさい（定額法・残存価額ゼロ）。',
    en_q:'Company X entered an ownership-transfer finance lease (leased asset ¥1,200,000; economic useful life of the property 8 years; lease term 5 years). Under an ownership-transfer finance lease, depreciation follows the economic useful life, as for owned fixed assets. Record one year of straight-line depreciation with zero residual value.',
    e:[{d:[['減価償却費',150000]], c:[['リース資産減価償却累計額',150000]]}],
    exp:'リース取引には「所有権移転ファイナンス・リース」（リース期間終了後に所有権が借手に移る）と「所有権移転外ファイナンス・リース」（リース期間終了後に返却する）の2種類があります。所有権移転ファイナンス・リースは、実質的に資産を買ったのと同じなので、まるでローンで購入した車のように、自己所有の固定資産と同様に「経済的耐用年数」（8年）で減価償却します。1,200,000円÷8年＝150,000円。これに対し、所有権移転外ファイナンス・リースは返却が前提のため「リース期間」（5年など、通常は経済的耐用年数より短い）を耐用年数として償却します。この違いを区別できるかが1級で問われるポイントです。'
  },
  { id:786, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'ファイナンス・リース取引（利子抜き法、リース債務当初計上額1,000,000円、リース期間5年、年間リース料240,000円、利率年4%）について、1年目の利息は40,000円（1,000,000×4%）であった。<mark class="q-expense">2年目の利息費用を利息法で計算し</mark>、<mark class="q-asset">2年目のリース料支払いの仕訳を示しなさい</mark>。',
    en_q:'For a finance lease (interest-excluded method, initial lease liability ¥1,000,000, 5-year term, annual lease payment ¥240,000, interest rate 4% per year), first-year interest was ¥40,000 (¥1,000,000 × 4%). Using the effective interest method, compute the second year\'s interest expense and record the second year\'s lease payment entry.',
    e:[{d:[['リース債務',208000],['支払利息',32000]], c:[['現金',240000]]}],
    exp:'利子抜き法では、リース料の支払いを「元本返済」と「利息」に分けますが、利息法では毎期の期首リース債務残高に利率を掛けて利息を計算します（元本が減るにつれ、利息も減っていきます）。住宅ローンの返済内訳と同じ発想で、1年目：利息40,000円（1,000,000×4%）、元本返済200,000円→期末残高800,000円。2年目：利息32,000円（800,000×4%）、元本返済208,000円（240,000－32,000）。単純に毎年同額の利息を計上する「定額法」とは異なり、実際の借入金の返済と同じ考え方で利息が逓減していく点が特徴です。'
  },
  { id:831, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は建物（帳簿価額600,000円）と備品（帳簿価額300,000円）から成る資産グループについて、<mark class="q-expense">回収可能価額750,000円と算定され、減損損失150,000円を認識した</mark>。<mark class="q-asset">この損失を帳簿価額の比率で建物・備品に配分する</mark>仕訳を示しなさい。',
    en_q:'For an asset group consisting of a building (book value ¥600,000) and equipment (book value ¥300,000), Company X determined a recoverable amount of ¥750,000, recognizing an impairment loss of ¥150,000. Record the entry allocating this loss to the building and equipment in proportion to book value.',
    e:[{d:[['減損損失',150000]], c:[['建物',100000],['備品',50000]]}],
    exp:'のれんを含まない資産グループの場合は、生じた減損損失をそのまま構成資産の帳簿価額の比率で配分します（のれんへの優先配分という手順がない、シンプルなケースです）。建物：150,000×(600,000／900,000)＝100,000円、備品：150,000×(300,000／900,000)＝50,000円。'
  },
  { id:832, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は前期に減損損失を計上した<mark class="q-asset">備品（減損後帳簿価額300,000円）を、当期に350,000円で現金売却した</mark>。売却時の仕訳を示しなさい。',
    en_q:'Company X sold equipment for ¥350,000 cash this period, on which an impairment loss had been recognized last period (post-impairment book value ¥300,000). Record the sale entry.',
    e:[{d:[['現金',350000]], c:[['備品',300000],['固定資産売却益',50000]]}],
    exp:'減損損失を計上した資産であっても、その後の売却処理は通常の固定資産売却と同じです。減損「後」の帳簿価額（300,000円、取得原価ではない点に注意）を基準に、売却額との差額を売却損益として計上します。まるで一度大きく値下げされた中古車を、それでも思ったより高く売れたようなイメージで、日本基準では減損の戻し入れが禁止されているため、たとえ売却額が減損前の帳簿価額を上回っても、それは「売却益」として処理され、過去の減損損失が取り消されるわけではありません。'
  },
  { id:833, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が保有する機械装置（帳簿価額800,000円、資産除去債務の資産計上額を含む）について、<mark class="q-asset">回収可能価額が600,000円と算定され</mark>、<mark class="q-expense">減損損失を計上する</mark>。仕訳を示しなさい。',
    en_q:'Company X holds machinery (book value ¥800,000, including the asset-retirement-obligation capitalized amount) with a determined recoverable amount of ¥600,000. Record the impairment loss entry.',
    e:[{d:[['減損損失',200000]], c:[['機械装置',200000]]}],
    exp:'資産除去債務に対応する除去費用をあらかじめ資産計上している固定資産（帳簿価額に除去費用相当額が含まれている）も、通常の固定資産と同様に減損会計の対象になります。帳簿価額全体（除去費用の資産計上額を含む）と回収可能価額を比較し、差額を減損損失として計上します。「資産除去債務に対応する資産計上額も、他の取得原価部分とまとめて減損の判定対象になる」という点がポイントです。'
  },
  { id:834, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社が保有する機械装置（帳簿価額1,000,000円）について、<mark class="q-asset">正味売却価額は600,000円、使用価値（将来キャッシュ・フローの割引現在価値）は650,000円と算定された</mark>。回収可能価額はいずれか高い方を採用し、<mark class="q-expense">減損損失を計上する</mark>仕訳を示しなさい。',
    en_q:"Company X's machinery (book value ¥1,000,000) had a net realizable value of ¥600,000 and a value in use (discounted present value of future cash flows) of ¥650,000. The recoverable amount is the higher of the two. Record the impairment loss entry.",
    e:[{d:[['減損損失',350000]], c:[['機械装置',350000]]}],
    exp:'回収可能価額は「正味売却価額」（今売ったらいくらか）と「使用価値」（今後使い続けることで得られる将来キャッシュ・フローの割引現在価値）のいずれか高い方を採用します。まるで「今すぐ売るのと使い続けるのと、どちらが得か」を天秤にかけるようなイメージで、今回は使用価値650,000円の方が正味売却価額600,000円より高いため、回収可能価額は650,000円。帳簿価額1,000,000円－回収可能価額650,000円＝減損損失350,000円。「売った方が得か、使い続けた方が得か、高い方を選ぶ」というルールです。'
  },
  { id:835, level:2, cat:'減損会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は前期に減損処理した遊休資産である土地（減損後帳簿価額700,000円）を、当期から事業用に転用することとした。転用時点の時価は900,000円であったが、日本基準では減損の戻し入れを行わないため帳簿価額は変更しない。<mark class="q-asset">転用時に「遊休資産」から「土地」（事業用）へ勘定科目を振り替える</mark>仕訳を示しなさい（金額は変動しない）。',
    en_q:'Company X is converting idle land (previously impaired, post-impairment book value ¥700,000) to operational use this period. The current fair value is ¥900,000, but since Japanese GAAP prohibits impairment reversal, the book value is not restored. Record the entry reclassifying the account from "idle assets" to "land" (operational use), with no change in amount.',
    e:[{d:[['土地',700000]], c:[['遊休資産',700000]]}],
    exp:'遊休資産を事業用に転用しても、日本基準では減損損失の戻し入れを行わないため、時価が回復していても帳簿価額はそのまま据え置かれます（700,000円のまま）。まるで一度大きく評価を下げた土地が、その後値上がりしても帳簿上は評価を戻さないようなイメージで、この仕訳は金額を変えずに勘定科目の表示区分だけを付け替えるものです。「一度計上した減損損失は、その後の状況好転があっても取り消さない」という日本基準の原則を、転用というイベントを通じて確認する問題です。'
  },
  { id:836, level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社はファイナンス・リース契約の開始にあたり、<mark class="q-asset">頭金（リース料の一部前払い）100,000円を現金で支払った</mark>。この頭金はリース資産の取得価額に含める処理をする場合の仕訳を示しなさい。',
    en_q:'At the inception of a finance lease, Company X paid a ¥100,000 cash down payment (a partial prepayment of lease payments). Record the entry treating this down payment as part of the leased asset\'s acquisition cost.',
    e:[{d:[['リース資産',100000]], c:[['現金',100000]]}],
    exp:'リース契約開始時に支払う頭金（リース料の一部前払い）は、通常の前払費用のように扱うのではなく、リース資産の取得価額の一部として資産計上します。まるで住宅ローンの頭金が物件価格の一部に含まれるようなイメージで、「将来支払うはずだったリース料の一部を、先に前払いした」と考え、リース債務ではなく、リース資産そのものの取得原価に含めます。'
  },
  { id:837, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転ファイナンス・リース（リース資産計上額1,500,000円、経済的耐用年数6年、残存価額はリース資産計上額の10％）を契約した。<mark class="q-expense">1年分の減価償却費を計上する</mark>仕訳を示しなさい（定額法）。',
    en_q:'Company X entered an ownership-transfer finance lease (leased asset ¥1,500,000, economic useful life 6 years, residual value 10% of the leased asset amount). Record one year of straight-line depreciation.',
    e:[{d:[['減価償却費',225000]], c:[['リース資産減価償却累計額',225000]]}],
    exp:'所有権移転ファイナンス・リースは、契約終了後に所有権が借手に移るため、自己所有の固定資産と全く同じ方法で減価償却します。残存価額が設定されている場合は、取得価額から残存価額を差し引いた金額（要償却額）を耐用年数で割ります。残存価額：1,500,000×10％＝150,000円。要償却額：1,500,000－150,000＝1,350,000円。年間償却額：1,350,000÷6年＝225,000円。所有権移転外リース（原則残存価額ゼロ）とは異なり、残存価額の考慮が必要な点に注意しましょう。'
  },
  { id:838, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社は所有権移転外ファイナンス・リース（リース資産の取得原価1,000,000円、減価償却累計額800,000円）について、リース期間満了時に割安購入選択権を行使し、<mark class="q-asset">追加で50,000円を現金で支払って資産の所有権を取得した</mark>。<mark class="q-asset">リース資産を通常の固定資産である備品に振り替える</mark>仕訳を示しなさい。',
    en_q:'Company X exercised a bargain purchase option at the end of a non-ownership-transfer finance lease term (leased asset acquisition cost ¥1,000,000, accumulated depreciation ¥800,000), paying an additional ¥50,000 cash to acquire ownership. Record the entry reclassifying the leased asset into ordinary owned equipment.',
    e:[{d:[['備品',250000],['リース資産減価償却累計額',800000]], c:[['リース資産',1000000],['現金',50000]]}],
    exp:'所有権移転外ファイナンス・リースでも、契約に「割安購入選択権」（相場よりかなり安い価格でリース物件を買い取れる権利）が付いている場合、これを行使すると、その時点でリース資産としての性格が終わり、まるでレンタカーの契約終了時に格安で買い取るオプションを使うようなイメージで、通常の自己所有の固定資産（備品）に切り替わります。リース資産の帳簿価額200,000円（取得原価1,000,000円－減価償却累計額800,000円）に、追加で支払った買取り代金50,000円を加えた250,000円が、新たな備品としての取得原価になります。'
  },
  { id:839, level:2, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'Ｘ社はオペレーティング・リース契約（<mark class="q-expense">月額リース料50,000円のうち、10,000円は付随するメンテナンスサービス費用</mark>）を締結し、<mark class="q-asset">1ヶ月分を現金で支払った</mark>。リース料とメンテナンス費用を区分して処理する仕訳を示しなさい。',
    en_q:'Company X entered an operating lease (monthly payment ¥50,000, of which ¥10,000 is for bundled maintenance services) and paid one month\'s payment in cash. Record the entry separating the lease payment from the maintenance cost.',
    e:[{d:[['支払リース料',40000],['修繕費',10000]], c:[['現金',50000]]}],
    exp:'リース契約の中に、リース物件の借入とは別に、保守・メンテナンスサービスの提供が含まれている場合、契約書上の金額を「純粋なリース料」部分と「サービス費用」部分に区分して処理する必要があります。まるで複合機のリース料の中に月額の保守サービス料が組み込まれているようなイメージで、40,000円（リース料相当部分）は「支払リース料」、10,000円（メンテナンス部分）は「修繕費」として、それぞれ別の性質の費用として計上します。「リース料に何が含まれているか」を見極めることが実務上のポイントです。'
  },
  { id:840, level:3, cat:'リース会計', chap:'1級：固定資産の応用（減損・リース）',
    q:'<mark class="q-asset">Ｘ社は保有する備品（帳簿価額500,000円）をリース会社に600,000円で売却し、現金を受け取った</mark>。同時にこの備品をオペレーティング・リースとしてリースバックする契約を締結した。オペレーティング・リースに該当する場合、<mark class="q-revenue">売却損益は繰延べず、その場で認識する</mark>。売却時の仕訳を示しなさい。',
    en_q:'Company X sold equipment (book value ¥500,000) to a leasing company for ¥600,000 cash, and simultaneously leased it back under an operating lease. Because the leaseback is an operating lease, the sale gain is not deferred and is recognized immediately. Record the entry at the time of sale.',
    e:[{d:[['現金',600000]], c:[['備品',500000],['固定資産売却益',100000]]}],
    exp:'セール・アンド・リースバックでも、リースバック部分がファイナンス・リースではなく「オペレーティング・リース」（単なる賃貸借）に該当する場合は、ファイナンス・リースのケース（前の応用問題を参照）とは異なり、売却損益を繰延べる必要はなく、通常の固定資産売却と同じようにその場で損益を認識します。まるで単純に資産を売って、別の資産を新たにレンタルし始めるようなイメージで、現金600,000円－帳簿価額500,000円＝売却益100,000円をそのまま計上します。「リースバックがファイナンスか、オペレーティングか」によって処理が正反対になる点が、この論点のハイライトです。'
  },

  // ===== 1級：会計方針の変更・誤謬の訂正 =====
  { id:787, level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は棚卸資産の評価方法を先入先出法から総平均法に変更した。この変更を過去の財務諸表に遡って適用した結果、<mark class="q-asset">過去の期首商品棚卸高が総平均法によればより低い金額であったことが判明し</mark>、<mark class="q-equity">利益剰余金期首残高を150,000円減額修正する必要が生じた</mark>（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its inventory valuation method from FIFO to the weighted-average method. Applying this change retrospectively revealed that opening inventory under the new method would have been ¥150,000 lower, requiring a ¥150,000 reduction to opening retained earnings, ignoring tax effects. Record the retrospective-application adjustment entry.',
    e:[{d:[['利益剰余金期首残高',150000]], c:[['繰越商品',150000]]}],
    exp:'「会計方針の変更」（棚卸資産の評価方法など）は、原則として新たな会計方針を過去の期間にも遡って適用したかのように会計処理します（遡及適用）。まるでルールを変更した後、過去の記録もそのルールで書き直すようなイメージで、過去の損益はすでに確定しているため、当期の損益計算書を通さず、直接「利益剰余金期首残高」を修正します。変更後の方法（総平均法）で計算し直した結果、過去の商品棚卸高が150,000円少なかったことになるため、繰越商品（資産）を減額し、対応する分だけ利益剰余金期首残高を減額します。'
  },
  { id:788, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の決算において、<mark class="q-liability">経費80,000円の計上漏れ（未払費用の計上漏れ）があったことを当期に発見した</mark>。過去の誤謬の訂正として、修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had failed to accrue ¥80,000 of expenses (an omitted accrued liability) in last period\'s financial statements. Record the retrospective restatement entry correcting this prior-period error, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',80000]], c:[['未払費用',80000]]}],
    exp:'前期以前の財務諸表に誤り（誤謬）があったことが当期に判明した場合、その影響を当期の損益として計上するのではなく、「修正再表示」といって、あたかも誤りがなかったかのように過去の財務諸表を直接修正します。まるで過去のテストの採点ミスを見つけて、今年の成績ではなく過去の記録を修正するようなイメージで、当期の損益計算書を通さず、直接「利益剰余金期首残高」を修正することで、過去の誤りを訂正します。未払費用（負債）の計上漏れだったため、利益剰余金期首残高を減額し、未払費用を追加計上します。'
  },
  { id:789, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に<mark class="q-asset">売上高を120,000円過大に計上していたことが当期に判明した（実際には売上が発生していなかった）</mark>。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had overstated sales revenue by ¥120,000 last period (the sale had not actually occurred). Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',120000]], c:[['売掛金',120000]]}],
    exp:'前期に本来計上すべきでなかった売上高（売掛金）が誤って計上されていたケースです。誤りを発見した当期の売上高を減額するのではなく、過去の誤りとして「利益剰余金期首残高」を直接減額し、過大計上されていた売掛金を取り消します。まるで昨年の帳簿の記載ミスを見つけて、今年の帳簿ではなく昨年の記録として訂正するようなイメージで、誤謬の訂正は、発生した年度ではなく発見した年度の当期純利益に影響を与えない、という点がポイントです。'
  },
  { id:790, level:3, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社が保有する機械装置（取得原価1,000,000円、これまで耐用年数10年・定額法で償却、期首時点の帳簿価額600,000円）について、今後の使用見込みを再検討した結果、残存耐用年数を当初の残り6年から3年に変更した。過去の年度は修正せず、<mark class="q-expense">変更後の残存耐用年数で当期の減価償却費を計上する</mark>仕訳を示しなさい（残存価額ゼロ・定額法）。',
    en_q:'Company X reassessed the useful life of its machinery (acquisition cost ¥1,000,000, previously depreciated straight-line over 10 years, opening book value ¥600,000) and revised the remaining useful life from 6 years to 3 years. Without restating prior periods, record this period\'s depreciation entry using the revised remaining life (zero residual value, straight-line).',
    e:[{d:[['減価償却費',200000]], c:[['減価償却累計額',200000]]}],
    exp:'「会計上の見積りの変更」（耐用年数の変更、引当金の見積り変更など）は、「会計方針の変更」とは異なり、過去に遡って財務諸表を修正しません（遡及処理をしません）。変更があった期以後の将来に向かって、新しい見積りに基づいて会計処理を行います（プロスペクティブ処理）。まるで「これからの計画を見直しただけで、過去の記録は変えない」というイメージで、期首帳簿価額600,000円を、変更後の残存耐用年数3年で償却：600,000÷3年＝200,000円。「過去は正しかったが、これからの見積りを変えた」という整理なので、利益剰余金の修正は一切発生しない点が、会計方針の変更・誤謬の訂正との大きな違いです。'
  },
  { id:791, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に<mark class="q-liability">費用100,000円の計上漏れがあったことを当期に発見した</mark>。修正再表示にあたり、<mark class="q-asset">実効税率30％として税効果を考慮した</mark>仕訳を示しなさい。',
    en_q:'Company X discovered this period that it had failed to record ¥100,000 of expenses last period. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['利益剰余金期首残高',70000],['繰延税金資産',30000]], c:[['未払費用',100000]]}],
    exp:'修正再表示にも税効果会計を適用します。過去に計上漏れだった費用100,000円は、将来（税務上の扱いが確定した時点で）税金負担を軽減する効果を持つため、繰延税金資産30,000円（100,000×30％）を認識します。残り70,000円が税引後ベースでの利益剰余金期首残高の減額分です。誤謬の訂正であっても、通常の決算整理と同じように税効果会計のルールを適用する点を押さえておきましょう。'
  },
  { id:841, level:3, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は機械装置（取得原価1,000,000円、期首時点の帳簿価額600,000円、残存耐用年数5年）の減価償却方法を、定率法から定額法に変更した。この変更は「会計上の見積りの変更と区別することが困難な会計方針の変更」に該当するため、遡及適用せず、<mark class="q-expense">変更後の方法により当期の減価償却費を計上する</mark>仕訳を示しなさい（残存価額ゼロ・定額法）。',
    en_q:'Company X changed its depreciation method for machinery (acquisition cost ¥1,000,000, opening book value ¥600,000, 5 years remaining useful life) from the declining-balance method to straight-line. Because this qualifies as "a change in accounting policy that is difficult to distinguish from a change in accounting estimate," it is not applied retrospectively. Record this period\'s depreciation under the new method (zero residual value, straight-line).',
    e:[{d:[['減価償却費',120000]], c:[['減価償却累計額',120000]]}],
    exp:'減価償却方法の変更（定率法→定額法など）は、本来は「会計方針の変更」に見えますが、日本基準では「会計上の見積りの変更と区別することが困難な会計方針の変更」として特別に扱い、過去に遡って財務諸表を修正しません（遡及適用しません）。まるで「見た目は方針変更でも、実質は見積りの見直しに近い」とみなすようなイメージで、変更した期以後、新しい方法で将来に向かって計算するだけです。期首帳簿価額600,000円÷残存耐用年数5年＝120,000円。「会計方針の変更なのに、なぜか見積りの変更と同じ扱いになる」という、1級で頻出のひっかけポイントです。'
  },
  { id:842, level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は売買目的有価証券の評価方法を移動平均法から総平均法に変更した。過去の財務諸表に遡って適用した結果、<mark class="q-asset">過去の有価証券の帳簿価額が総平均法によればより高い金額であったことが判明し</mark>、<mark class="q-equity">利益剰余金期首残高を60,000円増額修正する必要が生じた</mark>（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its valuation method for trading securities from the moving-average method to the weighted-average method. Applying this retrospectively revealed that the securities\' book value under the new method would have been ¥60,000 higher, requiring a ¥60,000 increase to opening retained earnings, ignoring tax effects. Record the retrospective-application entry.',
    e:[{d:[['売買目的有価証券',60000]], c:[['利益剰余金期首残高',60000]]}],
    exp:'棚卸資産の評価方法と同様に、有価証券の評価方法（移動平均法・総平均法など）の変更も「会計方針の変更」に該当し、遡及適用が必要です。今回は変更後の方法（総平均法）によれば過去の有価証券の帳簿価額がより高かったことが判明したため、有価証券（資産）を増額し、対応する分だけ利益剰余金期首残高を増額します（前に学んだ棚卸資産のケースとは逆に、利益剰余金が増える方向の修正です）。'
  },
  { id:843, level:3, cat:'会計方針の変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は棚卸資産の評価方法を総平均法から先入先出法に変更した。この変更を過去の財務諸表に遡って適用した結果、<mark class="q-asset">過去の期首商品棚卸高が先入先出法によればより高い金額であったことが判明し</mark>、<mark class="q-equity">利益剰余金期首残高を90,000円増額修正する必要が生じた</mark>（税効果は考慮しない）。遡及適用による修正仕訳を示しなさい。',
    en_q:'Company X changed its inventory valuation method from the weighted-average method to FIFO. Applying this retrospectively revealed that opening inventory under FIFO would have been ¥90,000 higher, requiring a ¥90,000 increase to opening retained earnings, ignoring tax effects. Record the retrospective-application entry.',
    e:[{d:[['繰越商品',90000]], c:[['利益剰余金期首残高',90000]]}],
    exp:'会計方針の変更による遡及適用は、必ずしも利益剰余金を減らす方向とは限りません。今回のように、変更後の方法（先入先出法）によれば過去の棚卸資産の評価額がより高かった場合は、逆に繰越商品（資産）を増額し、利益剰余金期首残高も増額修正します。まるで計算方法を変えたら過去の在庫が「実は少し多く評価されるべきだった」と判明したようなイメージで、「遡及適用は増える場合も減る場合もある」という点を、最初に学んだ問題（総平均法への変更で減額したケース）と対比して押さえておきましょう。'
  },
  { id:844, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の決算において、<mark class="q-other">備品の減価償却費40,000円の計上を失念していたことを当期に発見した</mark>。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had forgotten to record ¥40,000 of depreciation on equipment last period. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',40000]], c:[['減価償却累計額',40000]]}],
    exp:'減価償却費の計上漏れも、過去の財務諸表の誤りです（誤謬）。当期の減価償却費として今さら計上するのではなく、過去の誤りとして「利益剰余金期首残高」を直接減額し、本来計上すべきだった減価償却累計額を追加します。「見つけた時点の費用にしない、過去に遡って直接純資産を修正する」という誤謬訂正の基本パターンをもう一度確認する問題です。'
  },
  { id:845, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に、本来は修繕費として費用処理すべきであった<mark class="q-asset">支出70,000円を、誤って建物の取得原価に含めて資産計上していたことを当期に発見した</mark>。修正再表示による仕訳を示しなさい（減価償却の影響は考慮しない、税効果は考慮しない）。',
    en_q:'Company X discovered this period that it had mistakenly capitalized ¥70,000 of expenditure into the cost of a building last period, when it should have been expensed as repairs. Record the retrospective restatement entry (ignore the depreciation impact and tax effects).',
    e:[{d:[['利益剰余金期首残高',70000]], c:[['建物',70000]]}],
    exp:'本来は費用にすべき支出（収益的支出）を、誤って資産（建物などの資本的支出）に計上してしまうケースも誤謬に該当します。まるで単なる補修費用を「リフォーム扱い」で資産に計上してしまったミスを直すようなイメージで、過大に計上されていた建物（資産）を減額し、対応する分だけ利益剰余金期首残高を減額して訂正します。「資産に計上しすぎていた」誤りも、収益・費用の計上誤りと同じように、利益剰余金期首残高を通じて修正する点は共通です。'
  },
  { id:846, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の貸倒引当金の設定にあたり、計算式の入力ミスにより、<mark class="q-other">本来120,000円計上すべきところを80,000円しか計上していなかったことを当期に発見した</mark>。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that a calculation input error had caused it to record only ¥80,000 of allowance for doubtful accounts last period, when ¥120,000 was required. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',40000]], c:[['貸倒引当金',40000]]}],
    exp:'単純な計算ミスによって引当金が過少に計上されていた場合も誤謬に該当します（後で判明した新しい情報に基づく「見積りの変更」とは違い、当時すでに入手できていた情報の使い方を間違えた場合は誤謬です）。まるでExcelの計算式の入力ミスを後から見つけたようなイメージで、不足していた40,000円（120,000円－80,000円）を追加計上し、利益剰余金期首残高を減額します。'
  },
  { id:847, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の実地棚卸において、<mark class="q-asset">倉庫の一角にあった商品60,000円分を数え忘れており、期末商品棚卸高が過小に計上されていたことを当期に発見した</mark>。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that, during last period\'s physical inventory count, ¥60,000 of goods in a corner of the warehouse were overlooked, understating ending inventory. Record the retrospective restatement entry, ignoring tax effects.',
    e:[{d:[['繰越商品',60000]], c:[['利益剰余金期首残高',60000]]}],
    exp:'実地棚卸の数え忘れのような、単純な事実誤認・集計ミスも誤謬に該当します。倉庫の隅にあった在庫を数え忘れていたケースで、過小だった繰越商品（資産）を追加計上し、対応する分だけ利益剰余金期首残高を増額修正します。誤謬の内容によって利益剰余金が増えるか減るかは変わりますが、「発見した期の損益にせず、利益剰余金期首残高を直接修正する」という処理方法自体は常に共通です。'
  },
  { id:848, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の法人税等の計算において、税率の適用誤りにより、<mark class="q-liability">本来より30,000円少なく法人税等を計上していたことを当期に発見した</mark>。修正再表示による仕訳を示しなさい。',
    en_q:'Company X discovered this period that, due to an incorrect tax rate applied last period, income taxes were understated by ¥30,000. Record the retrospective restatement entry.',
    e:[{d:[['利益剰余金期首残高',30000]], c:[['未払法人税等',30000]]}],
    exp:'損益項目だけでなく、税金費用（法人税等）の計算誤りも誤謬の訂正の対象になります。まるで確定申告の税率適用ミスを後から修正するようなイメージで、過少に計上されていた未払法人税等（負債）を追加計上し、利益剰余金期首残高を減額します。「税金の計算を間違えていた」というのも、会計上は他の費用の計上漏れと同じ枠組みで訂正します。'
  },
  { id:849, level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は過去の貸倒実績率の見直しにより、当期末の貸倒引当金の設定率を売掛金残高の2％から3％に変更した。<mark class="q-expense">当期末売掛金残高2,000,000円に対する引当金の追加計上額（見積りの変更に伴う当期の影響分）を計上する</mark>仕訳を示しなさい（差額補充法、前期末引当金残高40,000円）。',
    en_q:"Company X revised its allowance rate for doubtful accounts from 2% to 3% of receivables, based on updated historical loss experience. Given a year-end receivables balance of ¥2,000,000 and a prior allowance balance of ¥40,000, record the entry recognizing the additional allowance required (using the incremental method).",
    e:[{d:[['貸倒引当金繰入',20000]], c:[['貸倒引当金',20000]]}],
    exp:'過去の貸倒実績（実際にどれくらい貸し倒れたか）が変化したことに基づいて引当金の設定率を見直すのは、新しい情報に基づく合理的な判断であり、「会計上の見積りの変更」に該当します。まるで保険の掛け金を最新のリスクデータに基づいて見直すようなイメージで、過去に遡って修正はせず、変更した当期以降の引当金の計算に、新しい設定率（3％）をそのまま反映させます。60,000円（2,000,000×3％）－40,000円（前期末残高）＝20,000円を当期に追加計上します。'
  },
  { id:850, level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社が計上している資産除去債務（帳簿価額500,000円）について、<mark class="q-liability">将来の除去費用の見積りが変更され、資産除去債務の金額を550,000円に修正する必要が生じた</mark>。<mark class="q-asset">見積りの変更による増加額を計上する</mark>仕訳を示しなさい（対応する資産の帳簿価額を増加させる）。',
    en_q:"Company X's recognized asset retirement obligation (book value ¥500,000) required revision to ¥550,000 due to a change in the estimated future removal cost. Record the entry recognizing the increase from this estimate change (increasing the corresponding asset's book value).",
    e:[{d:[['機械装置',50000]], c:[['資産除去債務',50000]]}],
    exp:'資産除去債務は「将来、その資産を撤去・処分するのにいくらかかるか」という見積りに基づいて計上します。物価上昇や技術動向の変化などにより、この見積り自体が変わることがあります。まるで将来の解体費用の見積りを、資材価格の上昇に合わせて見直すようなイメージで、これも「会計上の見積りの変更」に該当し、過去に遡って修正せず、変更があった時点で差額（50,000円）を資産除去債務（負債）と対応する固定資産（資産）の両方に反映させます。増加した分の固定資産は、残存耐用年数にわたって今後の減価償却を通じて費用化されます。'
  },
  { id:851, level:2, cat:'会計上の見積りの変更', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は過去の保証実績データの見直しにより、製品保証引当金の設定率を売上高の1％から1.5％に変更した。<mark class="q-expense">当期売上高4,000,000円に対する引当金の追加計上額を計上する</mark>仕訳を示しなさい（差額補充法、前期末引当金残高40,000円）。',
    en_q:"Company X revised its product warranty provision rate from 1% to 1.5% of sales, based on updated warranty claim experience. Given sales of ¥4,000,000 and a prior provision balance of ¥40,000, record the entry recognizing the additional provision required.",
    e:[{d:[['商品保証引当金繰入',20000]], c:[['商品保証引当金',20000]]}],
    exp:'製品保証引当金の設定率の見直しも、貸倒引当金と同じ「会計上の見積りの変更」です。まるで過去の故障発生率のデータをもとに、保証コストの見積りを更新するようなイメージで、過去の実績データが更新されたことに基づく合理的な判断なので、遡及適用はせず、当期の引当金計算に新しい設定率（1.5％）をそのまま反映させます。60,000円（4,000,000×1.5％）－40,000円（前期末残高）＝20,000円を追加計上します。'
  },
  { id:852, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期の退職給付費用の計算において、勤務費用の集計ミスにより、<mark class="q-liability">本来より50,000円少なく退職給付費用を計上していたことを当期に発見した</mark>。修正再表示による仕訳を示しなさい（税効果は考慮しない）。',
    en_q:"Company X discovered this period that a clerical error in tallying service cost caused last period's retirement benefit expense to be understated by ¥50,000. Record the retrospective restatement entry, ignoring tax effects.",
    e:[{d:[['利益剰余金期首残高',50000]], c:[['退職給付引当金',50000]]}],
    exp:'退職給付会計のような複雑な見積りを伴う領域でも、「入手可能だった情報に基づく計算を単純に間違えた」場合は、見積りの変更ではなく誤謬に該当します。まるで複雑な計算式の中の1つの数字を打ち間違えていたようなイメージで、不足していた退職給付引当金50,000円を追加計上し、利益剰余金期首残高を減額して訂正します。「新しい情報で見積りが変わった」のか「当時の情報の使い方を間違えた」のかを区別することが、誤謬と見積りの変更を見分けるポイントです。'
  },
  { id:853, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期に<mark class="q-asset">売上高（売掛金）を90,000円過大に計上していたことを当期に発見した</mark>。修正再表示にあたり、<mark class="q-asset">実効税率30％として税効果を考慮した</mark>仕訳を示しなさい。',
    en_q:'Company X discovered this period that it had overstated sales revenue (accounts receivable) by ¥90,000 last period. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['利益剰余金期首残高',63000],['繰延税金資産',27000]], c:[['売掛金',90000]]}],
    exp:'誤謬の訂正にも税効果会計を適用します。過大計上されていた売上高（売掛金）90,000円を取り消すと、将来的に税務上の調整を通じて税金負担が軽減される効果を持つため、繰延税金資産27,000円（90,000×30％）を認識します。残り63,000円が税引後ベースでの利益剰余金期首残高の減額分です。'
  },
  { id:854, level:3, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前期末の実地棚卸において、<mark class="q-asset">商品50,000円分を数え忘れており、期末商品棚卸高が過小に計上されていたことを当期に発見した</mark>。修正再表示にあたり、<mark class="q-liability">実効税率30％として税効果を考慮した</mark>仕訳を示しなさい。',
    en_q:'Company X discovered this period that, during last period\'s physical inventory count, ¥50,000 of goods were overlooked, understating ending inventory. In restating the financials, applying tax-effect accounting at an effective tax rate of 30%, record the correcting entry.',
    e:[{d:[['繰越商品',50000]], c:[['繰延税金負債',15000],['利益剰余金期首残高',35000]]}],
    exp:'資産の過小計上（棚卸資産の数え忘れなど）を修正すると、過去の利益がその分増えていたはずだったことになるため、将来的な税金負担が増える効果（将来加算一時差異）を持ち、繰延税金負債15,000円（50,000×30％）を認識します。残り35,000円が税引後ベースでの利益剰余金期首残高の増額分です。修正再表示のたびに、その内容が「将来減算」なのか「将来加算」なのかを見極めて、繰延税金資産・負債のどちらを計上するか判断する必要があります。'
  },
  { id:855, level:2, cat:'誤謬の訂正', chap:'1級：会計方針の変更・誤謬の訂正',
    q:'Ｘ社は前々期および前期の2期にわたり、リース料の計上区分を誤っており、<mark class="q-liability">各期10,000円ずつ、合計20,000円の費用の計上漏れがあったことを当期に発見した</mark>。この累積影響額を修正再表示する仕訳を示しなさい（税効果は考慮しない）。',
    en_q:'Company X discovered this period that a misclassification of lease payments over two prior periods resulted in ¥10,000 of unrecorded expense each period, totaling ¥20,000. Record the entry restating this cumulative effect, ignoring tax effects.',
    e:[{d:[['利益剰余金期首残高',20000]], c:[['未払費用',20000]]}],
    exp:'誤謬が1期だけでなく複数の過去の期間にわたって生じていた場合は、それぞれの期の影響額を合計した「累積影響額」を、当期首の利益剰余金期首残高に対する一括修正として反映させます。まるで数年分の記帳ミスを一気にまとめて精算するようなイメージで、前々期分10,000円＋前期分10,000円＝合計20,000円。何年前の誤りであっても、発見した期の損益には一切影響させず、あくまで期首の純資産を直接修正する、という誤謬訂正の原則は変わりません。'
  },

  // ===== 1級：標準原価計算（差異分析・応用） =====
  { id:792, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は製品を製造するにあたり、材料Ａ（標準単価＠200円）と材料Ｂ（標準単価＠100円）を標準配合比率7：3で投入している。当月、実際には材料Ａ750kg・材料Ｂ300kgを投入し（合計1,050kg）、標準配合比率で計算した実際投入量ベースの配合量は材料Ａ735kg・材料Ｂ315kgであった。<mark class="q-other">配合差異を計算し、仕掛品から配合差異勘定へ振り替える仕訳を示しなさい（不利差異）</mark>。',
    en_q:'Company X combines material A (standard price ¥200/kg) and material B (standard price ¥100/kg) in a standard mix ratio of 7:3. This month it actually used 750kg of A and 300kg of B (total 1,050kg); at the standard mix ratio, the actual total input implies 735kg of A and 315kg of B. Compute the mix variance and record the entry transferring it from work-in-process to the mix variance account (unfavorable).',
    e:[{d:[['配合差異',1500]], c:[['仕掛品',1500]]}],
    exp:'配合差異とは、複数の材料を組み合わせて製品を作る場合に、実際の配合比率が標準の配合比率とズレたことによって生じる差異です。まるでカレーのレシピで「肉多め・野菜少なめ」にアレンジしたら食材費が変わったようなイメージで、標準よりも単価の高い材料Ａを多く（735kg→750kg、15kg超過）、単価の低い材料Ｂを少なく（315kg→300kg、15kg減少）投入した結果、材料Ａ：200円×(735－750)＝△3,000円、材料Ｂ：100円×(315－300)＝＋1,500円、合計△1,500円（不利差異）が生じました。投入量の合計（1,050kg）は変わらなくても、「高い材料の比率を増やした」ことでコストが増加しています。'
  },
  { id:793, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＸ社において、標準投入量は材料Ａ700kg・材料Ｂ300kg（標準配合比率での実際生産量に対する必要量）であった。<mark class="q-other">歩留差異を計算し、仕掛品から歩留差異勘定へ振り替える仕訳を示しなさい（不利差異）</mark>。',
    en_q:'For Company X above, the standard input required for actual output (at the standard mix ratio) was 700kg of A and 300kg of B. Compute the yield variance and record the entry transferring it from work-in-process to the yield variance account (unfavorable).',
    e:[{d:[['歩留差異',8500]], c:[['仕掛品',8500]]}],
    exp:'歩留差異とは、材料の配合比率は標準どおりだったとしても、投入量の合計そのものが標準より多かった（＝歩留り＝原材料が製品に変わる効率が悪かった）ことによって生じる差異です。まるで料理の下ごしらえで皮を厚く剥きすぎて材料を無駄にしてしまったようなイメージで、標準配合比率のまま計算した必要量合計1,000kg（700kg＋300kg）に対し、実際には1,050kg（配合比率どおりで735kg＋315kg）を投入したため、50kg分（歩留りの悪化分）が余分にコストとしてかかっています。材料Ａ：200円×(700－735)＝△7,000円、材料Ｂ：100円×(300－315)＝△1,500円、合計△8,500円（不利差異）。'
  },
  { id:794, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は標準原価計算を採用しており、当月の原価差異（不利差異）100,000円が比較的多額であったため、期末の<mark class="q-asset">仕掛品・製品</mark>・<mark class="q-expense">売上原価</mark>の標準原価の比率（仕掛品20％・製品30％・売上原価50％）で配分することとした。<mark class="q-other">原価差異を配分する</mark>仕訳を示しなさい。',
    en_q:'Company X uses standard costing. This month\'s cost variance (¥100,000 unfavorable) was relatively large, so it is allocated across ending work-in-process, finished goods, and cost of goods sold in proportion to their standard cost balances (WIP 20%, finished goods 30%, COGS 50%). Record the allocation entry.',
    e:[{d:[['仕掛品',20000],['製品',30000],['売上原価',50000]], c:[['原価差異',100000]]}],
    exp:'標準原価計算で生じた原価差異は、原則として当月の売上原価に賦課（すべて売上原価に加算）します。ただし、差異の金額が「比較的多額」である場合は、棚卸資産（期末仕掛品・期末製品）にもその発生原因が及んでいると考え、まるで大きな値上がりコストを在庫商品にも按分して反映させるようなイメージで、各在庫と売上原価の残高比率で配分します。100,000円×仕掛品20％＝20,000円、製品30％＝30,000円、売上原価50％＝50,000円。「差異が小さければ全部売上原価、大きければ在庫にも配分」という原価差異の会計処理の原則を扱う問題です。'
  },
  { id:795, level:2, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は標準原価計算を採用しており、<mark class="q-other">当月の原価差異（有利差異）15,000円は少額であった</mark>ため、<mark class="q-expense">全額を売上原価に賦課する</mark>こととした。仕訳を示しなさい（有利差異のため売上原価を減額する）。',
    en_q:"Company X uses standard costing. This month's cost variance (¥15,000 favorable) was small, so it is charged entirely to cost of goods sold. Record the entry (a favorable variance reduces cost of goods sold).",
    e:[{d:[['原価差異',15000]], c:[['売上原価',15000]]}],
    exp:'原価差異が少額の場合は、簡便的に全額をその月の売上原価に賦課します。有利差異（実際原価が標準原価より少なくて済んだ）の場合は、売上原価を減額する方向で処理します。まるで予算より安く仕入れられた分、その月の原価がまるまる浮いたようなイメージで、「儲けが出た分だけ、売上原価が少なくて済んだ」ことになります。反対に不利差異であれば、売上原価を増額する方向で調整します。'
  },

  // ===== 1級：活動基準原価計算（ABC）・本社工場会計 =====
  { id:796, level:3, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は活動基準原価計算（ABC）を採用しており、段取活動にかかる<mark class="q-expense">製造間接費240,000円を</mark>、段取回数（合計80回）を配賦基準として、活動基準配賦率＠3,000円で各製品に配賦する。製品Ａに40回・製品Ｂに40回の段取りが行われた場合、<mark class="q-asset">製造間接費を仕掛品へ配賦する</mark>仕訳を示しなさい。',
    en_q:'Company X uses activity-based costing (ABC). ¥240,000 of overhead from the setup activity is allocated using the number of setups (80 total) as the cost driver, at an activity rate of ¥3,000 per setup. Products A and B each required 40 setups. Record the entry allocating overhead to work-in-process.',
    e:[{d:[['仕掛品',240000]], c:[['製造間接費',240000]]}],
    exp:'活動基準原価計算（ABC）は、製造間接費を「生産量」ではなく「活動（段取り・検査・発注など）の発生回数」を基準に配賦する方法です。まるで工場の共通コストを「誰がどれだけ手間をかけさせたか」で公平に割り勘するようなイメージで、段取活動にかかる費用240,000円を、段取り回数合計80回で割ると、活動基準配賦率＠3,000円／回。製品Ａ・Ｂともに40回ずつ段取りが行われたため、それぞれ120,000円（40回×3,000円）が配賦されます。従来の「直接作業時間」などの単一基準による配賦よりも、実際に原価を発生させている活動の実態に即して配賦できる点がABCの利点です。'
  },
  { id:797, level:3, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は検査活動にかかる<mark class="q-expense">製造間接費150,000円を</mark>、検査時間（合計500時間）を配賦基準として活動基準配賦率＠300円で配賦している。製品Ｃに200時間の検査が行われた場合、<mark class="q-asset">製品Ｃへ配賦される製造間接費を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Company X allocates ¥150,000 of overhead from the inspection activity using inspection hours (500 total) as the cost driver, at an activity rate of ¥300 per hour. Product C required 200 inspection hours. Record the entry allocating the overhead assigned to Product C to work-in-process.',
    e:[{d:[['仕掛品',60000]], c:[['製造間接費',60000]]}],
    exp:'検査活動という別のコストプールについても同様に、活動の発生量（検査時間）を基準に配賦率を計算します。150,000円÷500時間＝＠300円／時間。製品Ｃに200時間の検査が行われたため、60,000円（200時間×300円）が製品Ｃに配賦されます。ABCでは、このように活動（コストドライバー）ごとに複数の配賦基準を使い分けるのが特徴です。'
  },
  { id:798, level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社会計と工場会計を独立させている（本社工場会計）。<mark class="q-asset">本社は工場のために材料500,000円を購入し、現金で支払い</mark>、そのまま工場へ送付した。①本社側②工場側の仕訳をそれぞれ示しなさい。',
    en_q:"Company X keeps separate head-office and factory ledgers. The head office purchased ¥500,000 of materials for the factory, paying cash, and shipped them directly to the factory. Record the entries on (1) the head office's books and (2) the factory's books.",
    e:[{d:[['工場',500000]], c:[['現金',500000]]}, {d:[['材料',500000]], c:[['本社',500000]]}],
    exp:'本社工場会計では、本社と工場がそれぞれ独立した帳簿を持ちます。まるで支店と本店がそれぞれ独自の家計簿をつけているようなイメージで、本社と工場の間の取引は、通常の外部取引と同じように仕訳しますが、相手科目には「工場」「本社」という内部取引専用の勘定（照合勘定）を使います。①本社側：材料代金を立替払いし、工場に送付したので「工場」勘定（本社から見た工場への債権のようなもの）を借方に、現金を貸方に計上。②工場側：材料を受け入れたので「材料」を借方に、本社からの送付分として「本社」勘定（工場から見た本社への債務）を貸方に計上します。この2つの帳簿を合算すると、内部取引（工場・本社勘定）は相殺されて消えます。'
  },
  { id:799, level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＸ社において、<mark class="q-asset">工場で製品600,000円が完成し、ただちに本社倉庫へ発送した</mark>（工場では製品勘定を持たず、完成した製品はすべて本社が管理する）。①工場側②本社側の仕訳をそれぞれ示しなさい。',
    en_q:"For Company X above, the factory completed ¥600,000 of finished goods and shipped them directly to the head office warehouse (the factory keeps no finished goods account; the head office manages all finished goods). Record the entries on (1) the factory's books and (2) the head office's books.",
    e:[{d:[['本社',600000]], c:[['仕掛品',600000]]}, {d:[['製品',600000]], c:[['工場',600000]]}],
    exp:'工場では、完成した製品を自ら保管せず、すぐに本社へ送付する場合があります。まるで工場直送のネット通販のように、①工場側：仕掛品（製造中の原価）が完成し、本社に送ったので「本社」勘定を借方（本社への送付＝本社に対する債権的な意味合い）に、仕掛品を貸方に計上。②本社側：工場から製品を受け入れたので「製品」を借方に、「工場」勘定を貸方に計上します。本社工場会計では、このように工場側の帳簿には「製品」勘定が登場しないケースも典型的な出題パターンです。'
  },
  { id:856, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は材料Ｃ（標準単価＠300円）と材料Ｄ（標準単価＠150円）を標準配合比率6：4で投入している。当月、実際には材料Ｃ500kg・材料Ｄ380kgを投入し（合計880kg）、標準配合比率で計算した実際投入量ベースの配合量は材料Ｃ528kg・材料Ｄ352kgであった。<mark class="q-other">配合差異を計算し、仕掛品から配合差異勘定へ振り替える仕訳を示しなさい（有利差異）</mark>。',
    en_q:'Company X combines material C (standard price ¥300/kg) and material D (standard price ¥150/kg) in a standard mix ratio of 6:4. This month it actually used 500kg of C and 380kg of D (total 880kg); at the standard mix ratio, the actual total input implies 528kg of C and 352kg of D. Compute the mix variance and record the entry transferring it from work-in-process to the mix variance account (favorable).',
    e:[{d:[['仕掛品',4200]], c:[['配合差異',4200]]}],
    exp:'標準よりも単価の高い材料Ｃを少なく（528kg→500kg、28kg減少）、単価の低い材料Ｄを多く（352kg→380kg、28kg増加）投入した結果、材料Ｃ：300円×(528－500)＝＋8,400円、材料Ｄ：150円×(352－380)＝△4,200円、合計＋4,200円（有利差異）となりました。まるで高級食材の使用量を控えめにして、コストを抑えることに成功したレシピ改良のようなイメージで、安い材料の比率を増やしたことでコストが節約されています。有利差異の場合は、不利差異のときとは逆に、仕掛品を借方、配合差異を貸方に計上します。'
  },
  { id:857, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'上記のＸ社において、標準投入量は材料Ｃ540kg・材料Ｄ360kg（標準配合比率での実際生産量に対する必要量）であった。<mark class="q-other">歩留差異を計算し、仕掛品から歩留差異勘定へ振り替える仕訳を示しなさい（有利差異）</mark>。',
    en_q:'For Company X above, the standard input required for actual output (at the standard mix ratio) was 540kg of C and 360kg of D. Compute the yield variance and record the entry transferring it from work-in-process to the yield variance account (favorable).',
    e:[{d:[['仕掛品',4800]], c:[['歩留差異',4800]]}],
    exp:'標準配合比率のまま計算した必要量合計900kg（540kg＋360kg）に対し、実際の投入量合計は880kg（配合比率どおりで528kg＋352kg）で済んだため、20kg分だけ材料の無駄が少なく、歩留りが良かったことになります。まるで丁寧な作業で食材ロスを減らせた料理人のようなイメージで、材料Ｃ：300円×(540－528)＝＋3,600円、材料Ｄ：150円×(360－352)＝＋1,200円、合計＋4,800円（有利差異）。歩留りが標準より良かった分、コストが節約されたことを表しています。'
  },
  { id:858, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は材料の購入時点で価格差異を把握する方式を採用している。<mark class="q-other">材料1,000kgを予定価格＠250円（合計250,000円）で購入する予定であったが、実際には＠260円（合計260,000円）で購入し</mark>、<mark class="q-asset">現金で支払った</mark>。購入時の仕訳を示しなさい（材料は予定価格で受け入れる）。',
    en_q:'Company X recognizes material price variances at the point of purchase. It purchased 1,000kg of material at an actual price of ¥260/kg (total ¥260,000) versus a standard price of ¥250/kg (total ¥250,000), paying cash. Record the purchase entry (materials are recorded at standard price).',
    e:[{d:[['材料',250000],['材料受入価格差異',10000]], c:[['現金',260000]]}],
    exp:'材料の価格差異を「消費時点」ではなく「購入（受入）時点」で把握する方法を「材料受入価格差異」と呼びます。まるで仕入れた瞬間にレシートを見て「予算オーバーした分」をすぐに帳簿につけるようなイメージで、材料そのものは予定価格（＠250円）で帳簿に受け入れ、実際の支払額（260,000円）との差額10,000円は、購入した時点ですぐに「材料受入価格差異」（不利差異）として区分します。この方法のメリットは、材料を消費するたびに複雑な価格差異の計算をしなくて済み、材料勘定が常に予定価格で統一される点です。'
  },
  { id:859, level:3, cat:'標準原価計算', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は材料の購入にあたり、材料副費（引取運賃等）を購入代価の5％で予定配賦している。<mark class="q-other">材料の購入代価は400,000円、実際にかかった材料副費は22,000円であった</mark>。予定配賦額との差異を計上する仕訳を示しなさい。',
    en_q:"Company X applies incidental material costs (freight-in, etc.) at a predetermined rate of 5% of purchase price. The purchase price was ¥400,000, while actual incidental costs were ¥22,000. Record the entry recognizing the variance from the applied amount.",
    e:[{d:[['材料副費差異',2000]], c:[['材料副費',2000]]}],
    exp:'材料副費（引取運賃、購入手数料など）も、実際発生額を都度集計するのは煩雑なため、購入代価に対する一定率で「予定配賦」することがあります。まるで送料をあらかじめ「商品代金の5％」とざっくり見積もっておき、後で実際の請求額と精算するようなイメージで、予定配賦額20,000円（400,000×5％）に対し、実際発生額は22,000円だったため、2,000円の不利差異（予定より多くかかった）が生じます。材料副費勘定を予定配賦額でいったん締め、実際発生額との差額を「材料副費差異」として区分します。'
  },
  { id:860, level:2, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は発注活動にかかる<mark class="q-expense">製造間接費90,000円を</mark>、発注回数（合計30回）を配賦基準として活動基準配賦率＠3,000円で配賦している。製品Ｄに12回の発注が行われた場合、<mark class="q-asset">製品Ｄへ配賦される製造間接費を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Company X allocates ¥90,000 of overhead from the ordering activity using the number of purchase orders (30 total) as the cost driver, at an activity rate of ¥3,000 per order. Product D required 12 purchase orders. Record the entry allocating the overhead assigned to Product D to work-in-process.',
    e:[{d:[['仕掛品',36000]], c:[['製造間接費',36000]]}],
    exp:'発注活動（購買部門が材料や部品を発注する業務）も、ABCでは独立したコストプールとして扱われます。90,000円÷30回＝＠3,000円／回。製品Ｄに12回分の発注が発生したため、36,000円（12回×3,000円）が製品Ｄに配賦されます。段取活動・検査活動と同じように、活動の発生量に応じて配賦する考え方は共通です。'
  },
  { id:861, level:2, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は従来、<mark class="q-expense">製造間接費300,000円を</mark>直接作業時間（合計1,000時間）を基準に一律配賦していたが、製品Ｅに要した直接作業時間は300時間であった。ABC導入前の伝統的な配賦方法による<mark class="q-asset">製品Ｅへの配賦額を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Before adopting ABC, Company X allocated ¥300,000 of overhead uniformly based on direct labor hours (1,000 total). Product E required 300 direct labor hours. Record the entry allocating overhead to Product E under the traditional (pre-ABC) method.',
    e:[{d:[['仕掛品',90000]], c:[['製造間接費',90000]]}],
    exp:'ABC導入前の伝統的な原価計算では、直接作業時間や機械稼働時間など「単一の配賦基準」で製造間接費をまとめて配賦します。まるで会社の共通経費を全社員数で単純に割り勘するような大雑把な方法で、300,000円÷1,000時間＝＠300円／時間。製品Ｅの作業時間300時間分：90,000円（300時間×300円）が配賦されます。ABC（活動ごとに複数の配賦基準を使う）と比べて計算はシンプルですが、活動の実態を反映しにくく、原価の歪みが生じやすいという欠点があります。両者を対比して理解しておきましょう。'
  },
  { id:862, level:2, cat:'ABC', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は品質検査活動にかかる<mark class="q-expense">製造間接費200,000円を</mark>、検査回数（合計100回）を配賦基準として活動基準配賦率＠2,000円で配賦している。製品Ｆに35回の検査が行われた場合、<mark class="q-asset">製品Ｆへ配賦される製造間接費を仕掛品へ計上する</mark>仕訳を示しなさい。',
    en_q:'Company X allocates ¥200,000 of overhead from the quality inspection activity using the number of inspections (100 total) as the cost driver, at an activity rate of ¥2,000 per inspection. Product F required 35 inspections. Record the entry allocating the overhead assigned to Product F to work-in-process.',
    e:[{d:[['仕掛品',70000]], c:[['製造間接費',70000]]}],
    exp:'検査活動のコストドライバーは「検査時間」（すでに学んだ例）だけでなく、「検査回数」を使うこともあります。どちらのドライバーがより実態を表すかは、活動の性質によって使い分けます。200,000円÷100回＝＠2,000円／回。製品Ｆに35回の検査が行われたため、70,000円（35回×2,000円）が配賦されます。同じ「検査」という活動でも、時間基準か回数基準かでコストドライバーの選び方が変わる、という実務上の判断ポイントを扱う問題です。'
  },
  { id:863, level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社工場会計を採用しており、本社が<mark class="q-expense">全従業員の給与500,000円（うち工場従業員分300,000円）を</mark>、<mark class="q-asset">現金で一括支払った</mark>。①本社側②工場側の仕訳をそれぞれ示しなさい。',
    en_q:"Company X keeps separate head-office and factory ledgers. The head office paid all employees' salaries of ¥500,000 in cash in one lump sum (of which ¥300,000 relates to factory employees). Record the entries on (1) the head office's books and (2) the factory's books.",
    e:[{d:[['給料',200000],['工場',300000]], c:[['現金',500000]]}, {d:[['賃金・給料',300000]], c:[['本社',300000]]}],
    exp:'本社が全社員分の給与をまとめて支払う場合、本社は自社負担分（本社従業員分200,000円）を「給料」として計上し、工場負担分（300,000円）は「工場」勘定（内部取引の照合勘定）として区分します。まるで家族の共通口座から全員分の支払いをまとめて済ませ、後で誰がいくら使ったか精算するようなイメージで、工場側は、本社が立て替えて支払ってくれた自分たちの給与を「賃金・給料」として計上し、相手科目に「本社」勘定（本社への債務）を計上します。「本社が全部払うが、工場の分は内部で精算する」という構造です。'
  },
  { id:864, level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社工場会計を採用しており、固定資産（機械装置）はすべて本社の帳簿で管理している。工場で使用する<mark class="q-expense">機械装置の当月減価償却費50,000円について</mark>、①本社側②工場側の仕訳をそれぞれ示しなさい。',
    en_q:"Company X keeps separate head-office and factory ledgers, with all fixed assets (machinery) recorded on the head office's books. Record the entries on (1) the head office's books and (2) the factory's books for this month's ¥50,000 depreciation on machinery used at the factory.",
    e:[{d:[['工場',50000]], c:[['減価償却累計額',50000]]}, {d:[['製造間接費',50000]], c:[['本社',50000]]}],
    exp:'固定資産を本社が一括管理している場合、工場で使う機械装置の減価償却費であっても、資産の減少（減価償却累計額の増加）自体は本社の帳簿で記録します。まるでグループ会社の設備を親会社が一括管理し、使用料だけを子会社に請求するようなイメージで、本社は工場のための費用を負担した形になるので「工場」勘定（内部債権）を借方に計上します。工場側は、この減価償却費を自らの製造原価（製造間接費）として受け入れ、相手科目に「本社」勘定（内部債務）を計上します。「資産の管理は本社、費用の発生は工場」という役割分担を仕訳で表現しています。'
  },
  { id:865, level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社は本社工場会計を採用しており、工場は完成した製品を本社を経由せず、得意先へ直接発送・販売することがある。<mark class="q-asset">工場が製品（原価400,000円）を得意先へ直接販売し</mark>、<mark class="q-asset">販売代金600,000円は本社の当座預金口座に振り込まれた</mark>。①工場側（売上原価の付け替え）②本社側（売上の計上）の仕訳をそれぞれ示しなさい。',
    en_q:"Company X's factory sometimes ships and sells finished goods directly to customers without routing through the head office. The factory sold goods (cost ¥400,000) directly to a customer, and the ¥600,000 proceeds were deposited into the head office's checking account. Record the entries on (1) the factory's books (transferring the cost) and (2) the head office's books (recognizing the sale).",
    e:[{d:[['本社',400000]], c:[['製品',400000]]}, {d:[['当座預金',600000],['売上原価',400000]], c:[['売上',600000],['工場',400000]]}],
    exp:'工場が得意先へ製品を直接発送・販売するケースでも、売上の計上自体は原則として本社側で行います（工場は製造・出荷の実行部隊、本社が販売・会計の窓口という役割分担）。まるで工場から直接発送される通販商品でも、売上計上や経理処理は本社が一元管理するようなイメージで、①工場側：出荷した製品（原価400,000円）を製品勘定から減らし、本社に対する内部債権として「本社」勘定を計上します。②本社側：得意先からの入金600,000円を「売上」として計上するとともに、工場から引き継いだ原価400,000円を「売上原価」として計上し、その相手科目として「工場」勘定（内部債務）を計上します。'
  },
  { id:866, level:3, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社の工場は、本社へ製品（原価400,000円）を振替価格500,000円（原価に25％の内部利益を加算）で発送している。決算時点で、本社の製品在庫のうち振替価格125,000円分（原価100,000円相当）が未販売のまま残っていた。<mark class="q-expense">この未実現の内部利益を消去する</mark>仕訳を示しなさい。',
    en_q:"Company X's factory ships products to the head office at a transfer price of ¥500,000 (cost ¥400,000 plus a 25% internal markup). At year-end, ¥125,000 (at transfer price; ¥100,000 at cost) of this inventory remained unsold at the head office. Record the entry eliminating the unrealized internal profit.",
    e:[{d:[['内部利益控除',25000]], c:[['繰延内部利益',25000]]}],
    exp:'工場が本社へ製品を振替価格（原価400,000円に25％の利益を上乗せした500,000円）で送っている場合、本社に残っている未販売の製品在庫にも、まだ実現していない「内部利益」が含まれてしまっています。まるでグループ会社間で商品を転売するたびに少しずつ利益を上乗せしていくと、在庫の評価額が実態より膨らんでしまうようなイメージで、決算にあたっては、この未実現の内部利益（125,000円×25／125＝25,000円）を、貸借対照表上の棚卸資産の評価額から除く必要があります。借方に「内部利益控除」（損益計算書上、売上原価の調整項目）、貸方に「繰延内部利益」（貸借対照表の評価性引当のような性質の科目）を計上し、翌期に振り戻します。'
  },
  { id:867, level:2, cat:'本社工場会計', chap:'1級：原価計算（差異分析・ABC・本社工場）',
    q:'Ｘ社の本社工場会計において、決算時に<mark class="q-other">本社元帳の「工場」勘定残高は800,000円（借方）、工場元帳の「本社」勘定残高は800,000円（貸方）であり</mark>、両者は一致していた。この場合、合算財務諸表を作成するにあたり、内部取引を相殺消去する仕訳を示しなさい。',
