<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記 仕訳練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      touch-action: manipulation;
    }

    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.liability { background: #C2185B; }
    .dot.expense   { background: #388E3C; }
    .dot.revenue   { background: #0288D1; }
    .dot.equity    { background: #FB8C00; }
    .dot.other     { background: #fff; border: 1.5px solid #9E9E9E; }

    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }

    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #00838F; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }

    .card-body { padding: 20px 18px; }

    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }

    .answer-area { display: none; }
    .answer-area.show { display: block; }

    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tag-en { display: block; font-size: 9.5px; font-weight: 600; opacity: 0.8; white-space: normal; line-height: 1.25; margin-top: 1px; }
    .tag-amt { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }
    /* 資産：黄色 */
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    /* 負債：ピンク/紫 */
    .tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    /* 費用：緑 */
    .tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    /* 収益：水色 */
    .tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    /* 純資産：オレンジ */
    .tag.equity    { background: #FFF3E0; color: #E65100; border: 1.5px solid #FB8C00; }
    /* その他（評価勘定・損益等）：白 */
    .tag.other     { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    /* 資産のマイナス（減価償却累計額・貸倒引当金等）：白地に資産の黄枠 */
    /* 勘定科目名の色分けタグ（表示区分クイズ等、"解答を隠す"の対象にしないため.tagとは別クラス） */
    .acct-tag { padding: 4px 11px; border-radius: 12px; font-size: 13px; font-weight: 700; text-align: center; display:inline-block; }
    .tag.rev, .acct-tag.rev { text-decoration:underline; text-decoration-color:#E53935; text-decoration-thickness:2px; text-underline-offset:3px; }
    .tag.rev .tag-en, .tag.rev .tag-amt { display:inline-block; width:100%; }  /* 下線は科目名だけに（英語・金額には引かない） */
    .acct-tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    .acct-tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    .acct-tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    .acct-tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    .acct-tag.equity    { background: #FFF3E0; color: #E65100; border: 1.5px solid #FB8C00; }
    .acct-tag.other     { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    .acct-tag.acct-tag-lg { font-size:16px; padding:7px 18px; border-radius:14px; }

    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }

    .exp-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #F0F7FF;
      border-left: 3px solid #42A5F5;
      border-radius: 4px;
      font-size: 13px;
      color: #1A2B3C;
      line-height: 1.7;
    }
    .exp-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* 表形式の解答 */
    .ans-table-wrap {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .ans-table-wrap table,
    .exp-readonly-ans table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      min-width: 260px;
    }
    .ans-table-wrap th,
    .exp-readonly-ans th {
      background: #1E4D7B;
      color: white;
      padding: 5px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
    }
    .ans-table-wrap td,
    .exp-readonly-ans td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      line-height: 1.5;
    }
    .ans-table-wrap tr:nth-child(even) td,
    .exp-readonly-ans tr:nth-child(even) td { background: #D6EAF8; }
    .ans-table-wrap .total-row td,
    .exp-readonly-ans .total-row td { background: #AED6F1; font-weight: 700; }
    .ans-table-wrap .hl,
    .exp-readonly-ans .hl { background: #FFF9C4 !important; font-weight: 700; }
    .ans-table-wrap .q-blank,
    .exp-readonly-ans .q-blank { background: #FFF3E0 !important; color: #E65100; font-weight: 700; text-align: center; border: 2px dashed #FB8C00 !important; }
    .tbl-sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .formula-box {
      margin: 8px 0;
      padding: 8px 12px;
      background: #E8F5E9;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1B5E20;
      text-align: center;
    }

    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    .apx-btn { background:var(--primary); color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .apx-btn.active { background:#E65100; }
    .sec-tabs-wrap { width:100%; }
    .sec-tabs-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .sec-tabs-toggle-arrow { font-size:10px; transition:transform 0.2s; }
    .sec-tabs-wrap.collapsed .sec-tabs-toggle-arrow { transform:rotate(-90deg); }
    .sec-tabs-wrap.collapsed .sec-tabs, .sec-tabs-wrap.collapsed .big-tabs { display:none; }
    .big-tabs { display:flex; gap:4px; margin-bottom:8px; }
    .big-btn { flex:1; border:1.5px solid var(--primary); background:#fff; color:var(--primary); border-radius:10px; padding:8px 2px; font-size:13px; font-weight:800; cursor:pointer; }
    .big-btn.active { background:var(--primary); color:#fff; }
    .sec-tabs { display:flex; flex-wrap:wrap; gap:6px; }

    .k1-ex-btn { margin-top:8px; border:1px dashed #90A4AE; background:#fff; color:#455A64; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; }
    .k1-ex { margin-top:8px; background:#FFFDE7; border-left:4px solid #FBC02D; border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.8; }
    .k1-shushi { margin-top:10px; background:#E8F0FA; border-left:4px solid #1E4D7B; border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.8; }
    .k1-term-box { margin-top:8px; background:#F3F6FA; border-left:4px solid #90A4AE; border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.8; }
    .sogo-cat { background:var(--card,#fff); border:1px solid var(--border,#E0E0E0); border-radius:12px; padding:10px 12px; margin:8px 0; }
    .sogo-cat-hd { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; font-weight:800; font-size:14px; }
    .sogo-all-btn { flex-shrink:0; border:1px solid var(--primary,#1F4E79); background:var(--primary,#1F4E79); color:#fff; border-radius:16px; padding:4px 10px; font-size:12px; font-weight:700; cursor:pointer; }
    .sogo-one-btn { display:block; width:100%; text-align:left; border:1px solid var(--border,#E0E0E0); background:transparent; color:inherit; border-radius:8px; padding:8px 10px; margin-top:6px; font-size:13px; cursor:pointer; }
    /* ===== 総合問題（財務諸表作成・本支店会計・株主資本等変動・標準原価計算・CVP分析） ===== */
    .comp-title { font-size:15px; font-weight:800; margin-bottom:8px; color:var(--primary); }
    .comp-sect-hd { font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 4px; }
    .comp-table { font-size:13px; line-height:1.6; }
    .comp-row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--border); padding:3px 0; }
    .comp-row .l { color:#333; }
    .comp-row .r { font-weight:700; color:#1A2B3C; white-space:nowrap; }
    .calc-table .comp-row .l { flex:0 0 auto; max-width:42%; }
    .calc-table .comp-row .r { flex:1 1 auto; white-space:normal; text-align:right; }
    .comp-note, .comp-list { font-size:12px; color:#444; line-height:1.75; margin:6px 0; }
    .comp-list div { margin-bottom:4px; }
    .comp-counter { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:6px; }
    .comp-row[data-key], .comp-list > div[data-key] { transition:background-color 0.25s, box-shadow 0.25s; border-radius:6px; }
    .comp-row.comp-hl, .comp-list > div.comp-hl { background:#FFF59D; box-shadow:0 0 0 4px #FFF59D; font-weight:700; }
    .comp-stmt-wrap { margin-top:12px; padding-top:10px; border-top:1.5px dashed var(--border); }
    .comp-stmt-title { font-size:12px; font-weight:800; color:var(--primary); margin:4px 0 6px; }
    .comp-stmt { width:100%; border-collapse:collapse; font-size:12.5px; }
    .comp-stmt td { padding:3px 4px; border-bottom:1px dashed var(--border); }
    .comp-stmt td:last-child { text-align:right; white-space:nowrap; font-weight:600; }
    .comp-stmt tr.i td:first-child { padding-left:18px; color:var(--muted); }
    .comp-stmt tr.sub td { font-weight:800; border-top:1.5px solid var(--text); border-bottom:1.5px solid var(--text); }
    .comp-stmt tr.hd td { font-weight:800; color:var(--primary); padding-top:8px; border-bottom:none; }
    .comp-stmt tr[data-line] td { transition:background-color 0.25s; }
    .comp-stmt tr[data-line].comp-hl td { background:#FFF59D; }
    .comp-hint { background:#EEF4FF; border:1px dashed #90B4F0; border-radius:8px; padding:8px 10px; font-size:12px; color:#1E3A6E; line-height:1.7; margin:8px 0 10px; }
    .comp-hint strong { color:#0D2B5C; }

    /* ===== スクロールモード ===== */
    .exp-panel { display:block; max-width:640px; margin:0 auto; padding:14px 14px; }
    .exp-q-card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px; border:1.5px solid var(--border); font-size:14px; line-height:2.0; font-weight:500; }
    .exp-q-card br+br { display:block; content:''; margin-top:4px; }
    .exp-q-card u.q-ul { text-decoration:underline; text-decoration-color:#E53935; text-decoration-thickness:1.5px; text-underline-offset:3px; }
    .exp-term { font-size:12.5px; line-height:1.7; margin:3px 0; }
    .q-speak { float:right; margin:-4px -6px 4px 8px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; border:1.5px solid var(--border); background:#fff; color:#455A64; line-height:1.4; cursor:pointer; }
    .exp-q-card mark { color:inherit; padding:0 2px; border-radius:2px; }
    .exp-q-card mark.q-asset { background:#FCF569; }
    .exp-q-card mark.q-liability { background:#FE8980; }
    .exp-q-card mark.q-revenue { background:#8FE0FB; }
    .exp-q-card mark.q-expense { background:#95D15F; }
    .exp-q-card mark.q-equity { background:#FDC475; }
    .exp-q-card mark.q-other { background:#C6CDD3; }
    .exp-q-card mark.q-as-li { background:#FCF569; }
    .exp-q-card mark.q-eq-rv { background:#FDC475; }
    .exp-q-card mark.q-eq-ex { background:#FDC475; }
    .exp-q-card mark.q-eq-rx { background:#FDC475; }
    .exp-q-card mark.q-eq-as { background:#FDC475; }
    .q-en-trans { margin-top:8px; font-size:12px; color:var(--text-sub,#666); font-weight:400; border-top:1px solid var(--border); padding-top:6px; font-style:italic; }
    .q-paren { color:#9AA0A6; font-weight:400; }
    .q-paren mark { color:#1a1a1a; }
    .q-paren strong { color:#1a1a1a; font-weight:700; }
    .disp-tabs { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; }
    .disp-tabs .ctrl-btn { flex:0 0 auto; white-space:nowrap; }
    .exp-swipe-wrap { position:relative; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .exp-swipe-card {
      width:160px; background:#fff; border-radius:14px; border:2.5px solid var(--border);
      padding:14px; text-align:center; font-size:15px; font-weight:800;
      box-shadow:0 4px 18px rgba(0,0,0,0.12); touch-action:none; user-select:none; cursor:grab;
      position:relative; z-index:2; will-change:transform;
    }
    .exp-swipe-card.tilt-l { border-color:#0288D1; background:#E3F2FD; }
    .exp-swipe-card.tilt-r { border-color:#388E3C; background:#E8F5E9; }
    .exp-swipe-card.anim { transition:transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s; }
    .exp-zones { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .exp-zone { border-radius:12px; padding:10px; min-height:62px; border:2px dashed; }
    .exp-zone-d { border-color:#90CAF9; background:#F0F8FF; }
    .exp-zone-c { border-color:#A5D6A7; background:#F0FBF0; }
    .exp-zone-label { font-size:11px; font-weight:800; margin-bottom:6px; }
    .exp-zone-d .exp-zone-label { color:#0277BD; }
    .exp-zone-c .exp-zone-label { color:#2E7D32; }
    .exp-placed { display:flex; flex-wrap:wrap; gap:4px; min-height:24px; }
    .exp-nav-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:6px; }
    .exp-nav-btn { padding:7px 12px; border:1.5px solid var(--border); border-radius:18px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--text); white-space:nowrap; }
    .exp-nav-btn:disabled { opacity:0.3; cursor:default; }

const REVERSE_ACCTS = new Set([...CONTRA_ASSET, ...CONTRA_EQUITY, '自己株式処分差損','減損損失累計額','投資損失引当金']);
function tagType(a){
  const rev = (REVERSE_ACCTS.has(a) || /減価償却累計額$/.test(a)) ? 'rev ' : '';
  if(CONTRA_ASSET.has(a) || /減価償却累計額$/.test(a)) return rev+'asset';
  if(CONTRA_EQUITY.has(a)) return rev+'equity';
  return rev + (T[a] || 'other');
}

  {"no":10,"en":"Credit Card Receivable","name":"クレジット売掛金","bucket":"商品売買","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>クレジット売掛金</strong>とは、お客さんがクレジットカードで支払った商品代金のうち、まだカード会社から入金されていない分を記録する債権科目。","cls":"通常の売掛金とは区別するが、やはり本業の販売から生じる権利なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":11,"en":"Advance Paid for Others","name":"立替金","bucket":"商品売買","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>立替金</strong>とは、取引先や従業員が本来負担すべき費用を、会社が一時的に代わりに支払ったときに生じる、あとで返してもらう権利のこと。","cls":"近いうちに精算される一時的な債権なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":12,"en":"Gift Vouchers Received","name":"受取商品券","bucket":"商品売買","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>受取商品券</strong>とは、自社の商品を売ったときに、他社や商店街が発行した商品券を代金として受け取った場合に生じる資産のこと。","cls":"あとでその発行元に代金を請求できる権利なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":13,"en":"Gift Certificates (issued)","name":"商品券","bucket":"商品売買","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>商品券</strong>とは、自社が発行した、将来商品と引き換えることを約束する券のこと。","cls":"お客さんから代金を先に受け取っているのに、まだ商品を渡す義務を果たしていない状態なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":14,"en":"Other Stores' Gift Certificates","name":"他店商品券","bucket":"商品売買","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>他店商品券</strong>とは、自社の販売代金として、他の店や商店街が発行した商品券を受け取ったときに生じる資産のこと。","cls":"発行元に換金や商品との交換を請求できる権利なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":15,"en":"Customer Advances","name":"前受金","bucket":"商品売買","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>前受金</strong>とは、商品を引き渡す前に、得意先からあらかじめ代金の一部または全部を受け取ったときに生じる、将来商品を引き渡す義務のこと。","cls":"本業の販売という営業サイクルの中にある負債なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":16,"en":"Commission Expense","name":"支払手数料","bucket":"商品売買","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>支払手数料</strong>とは、銀行の振込手数料やクレジットカードの決済手数料など、取引に伴って発生する各種の手数料のこと。","cls":"本業の営業活動を支える一般的な費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":17,"en":"Shipping Expense","name":"発送費","bucket":"商品売買","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>発送費</strong>とは、販売した商品をお客さんのもとへ届けるための配送料・運送料のこと。","cls":"商品を売るための直接的な費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":18,"en":"Cost of Goods Sold","name":"売上原価","bucket":"商品売買","cat":"expense","ans":[["P/L","売上原価"]],"disp":null,"def":"<strong>売上原価</strong>とは、売上原価対立法などで、売れた商品の原価を売上のつど直接計上するときに使う費用科目。","cls":"販売した商品そのものの仕入コストなので、<strong>P/L上は売上原価</strong>に表示する。"},
  {"no":19,"en":"Purchase Discount","name":"仕入割引","bucket":"商品売買","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>仕入割引</strong>とは、買掛金の支払期日より早く代金を支払ったことで、仕入先から代金の一部を免除してもらったときに生じる収益のこと。","cls":"商品そのものの値引きではなく、早期支払いという金融的な側面から生じる収益なので、<strong>P/L上は営業外収益</strong>に表示する（仕入値引・仕入戻しとは区別しましょう）。"},
  {"no":20,"en":"Merchandise","name":"商品","bucket":"商品売買","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>商品</strong>とは、分記法や売上原価対立法で商品売買を記録しているときに使う、販売目的で保有する商品の資産科目。三分法の「繰越商品」にあたる。","cls":"来期も販売目的で持ち続ける、本業の営業サイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":21,"en":"Service Revenue","name":"役務収益","bucket":"収益認識・現金預金","cat":"revenue","ans":[["P/L","売上高"]],"disp":null,"def":"<strong>役務収益</strong>とは、形のある商品ではなく、語学レッスンや清掃サービスなど、無形のサービスを提供したことによって得た収益のこと。","cls":"サービス業にとってはサービスの提供こそが本業の収益そのものなので、<strong>P/L上は売上高</strong>に表示する。"},
  {"no":22,"en":"Rent Expense","name":"支払家賃","bucket":"収益認識・現金預金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>支払家賃</strong>とは、本社・店舗などの土地・建物を借りるために支払う賃借料のこと。","cls":"本業を営むための場所を確保するための費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":23,"en":"Checking Account","name":"当座預金","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","流動資産"]],"disp":"現金預金（現金・普通預金などと合算）","def":"<strong>当座預金</strong>とは、小切手や手形の決済に使うために銀行に預けているお金のこと。","cls":"いつでも引き出して支払いに使える流動性の高い資産なので、B/S上は<strong>流動資産に表示し</strong>、現金や普通預金などとあわせて「現金預金」という1つの金額にまとめて記載するのが一般的。"},
  {"no":24,"en":"Non-trade Payable","name":"未払金","bucket":"収益認識・現金預金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>未払金</strong>とは、備品や有価証券など、商品以外のものを購入した代金のうち、まだ支払っていない分を記録する負債科目。","cls":"商品の仕入れから生じる「買掛金」とは区別され、1年以内に支払う見込みのものなので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":25,"en":"Contract Liability","name":"契約負債","bucket":"収益認識・現金預金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>契約負債</strong>とは、収益認識基準にもとづき、商品の引渡しなどの義務を果たす前に、先に代金を受け取った場合に生じる負債のこと。","cls":"「お金は受け取ったが、まだ約束を果たしていない」義務を表すので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":26,"en":"Cash Overage/Shortage","name":"現金過不足","bucket":"収益認識・現金預金","cat":"asset","ans":[["表示なし","雑損・雑益に振り替える"]],"disp":"雑損（営業外費用）／ 雑益（営業外収益）","def":"<strong>現金過不足</strong>とは、帳簿上の現金残高と実際の手元現金が一致しないときに、原因がわかるまで一時的に使う仮の勘定。","cls":"決算までに原因が判明しなかった分は、不足なら「<strong>雑損」</strong>、過剰なら「雑益」に振り替えるため、現金過不足という科目名自体はB/S・P/Lのどこにも残らない。"},
  {"no":27,"en":"Cost of Services","name":"役務原価","bucket":"収益認識・現金預金","cat":"expense","ans":[["P/L","売上原価"]],"disp":null,"def":"<strong>役務原価</strong>とは、サービス業において、提供したサービスに直接かかった人件費や諸経費などの原価のこと。","cls":"商品販売業における「仕入」に相当するもので、サービスという商品を提供するためのコストなので、<strong>P/L上は売上原価</strong>に表示する。"},
  {"no":28,"en":"Advertising Expense","name":"広告宣伝費","bucket":"収益認識・現金預金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>広告宣伝費</strong>とは、テレビCMやチラシなど、商品やサービスを宣伝して売るために使った費用のこと。","cls":"商品を売るための直接的な営業活動の費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":29,"en":"Advance Payment","name":"仮払金","bucket":"収益認識・現金預金","cat":"asset","ans":[["表示なし","決算で正しい科目に振り替える"]],"disp":null,"def":"<strong>仮払金</strong>とは、出張の前払い旅費など、使いみちや金額が確定していない支出を、とりあえず一時的に記録しておく仮の資産科目。","cls":"<strong>決算までには必ず内容を確認して</strong>、正しい費用科目や資産科目に振り替える必要があるため、仮払金という科目自体はB/S・P/Lに残らない。"},
  {"no":30,"en":"Savings Account","name":"普通預金","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","流動資産"]],"disp":"現金預金","def":"<strong>普通預金</strong>とは、銀行にいつでも自由に出し入れできる形で預けているお金のこと。","cls":"当座預金と同じくすぐに引き出して使える流動性の高い資産なので、B/S上は<strong>流動資産に表示し</strong>、「現金預金」としてほかの預金とまとめて記載する。"},
  {"no":31,"en":"Petty Cash","name":"小口現金","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","流動資産"]],"disp":"現金預金","def":"<strong>小口現金</strong>とは、文房具代や交通費など、日々のちょっとした支払いのために、経理担当者から各部署の小口現金係にあらかじめ渡しておく少額の現金のこと。","cls":"性質は現金そのものなので、B/S上は<strong>流動資産に表示し</strong>、「現金預金」としてまとめて記載する。"},
  {"no":32,"en":"Time Deposits","name":"定期預金","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","流動資産（満期が1年以内）"],["B/S","投資その他の資産（満期が1年より先）"]],"disp":"現金預金（1年以内）／ 長期性預金（1年より先）","def":"<strong>定期預金</strong>とは、一定期間は引き出さない約束で銀行に預けるお金のこと。","cls":"満期までの期間が1年以内のものは<strong>流動資産（現金預金）</strong>、1年を超えるものは投資その他の資産（長期性預金）に分けて表示する（1年基準）。"},
  {"no":33,"en":"Security Deposit","name":"差入保証金","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","投資その他の資産"]],"disp":null,"def":"<strong>差入保証金</strong>とは、建物を借りるときの敷金のように、契約の担保として相手に預けておくお金のこと。","cls":"契約が終わるまで長期間返ってこないことが多いため、<strong>B/S上は原則として投資その他の資産</strong>に表示する。"},
  {"no":34,"en":"Supplies (Unused)","name":"消耗品","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>消耗品</strong>とは、文房具やコピー用紙など、購入時に資産として計上した、まだ使っていない物品のこと。","cls":"期末に未使用分が残っている場合、貯蔵品と同じ考え方で、近いうちに使用される資産として<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":35,"en":"Temporary Receipt","name":"仮受金","bucket":"収益認識・現金預金","cat":"liability","ans":[["表示なし","決算で正しい科目に振り替える"]],"disp":null,"def":"<strong>仮受金</strong>とは、入金はあったものの、その内容や相手先がまだ確定していない金額を、一時的に記録しておく仮の負債科目。","cls":"<strong>決算までには必ず内容を確認して正しい科目に振り替えるため</strong>、仮受金という科目自体はB/S・P/Lに残らない。"},
  {"no":36,"en":"Bank Overdraft","name":"当座借越","bucket":"収益認識・現金預金","cat":"liability","ans":[["B/S","流動負債"]],"disp":"短期借入金","def":"<strong>当座借越</strong>とは、当座預金の残高を超えて小切手を振り出した場合に生じる、銀行からの一時的な借入れのこと。","cls":"実質的に銀行からお金を借りている状態なので、<strong>B/S上は流動負債に「短期借入金」</strong>として表示する。"},
  {"no":37,"en":"Refund Liability","name":"返金負債","bucket":"収益認識・現金預金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>返金負債</strong>とは、収益認識基準にもとづき、返品や値引きが見込まれる分について、将来お客さんに返金する義務をあらかじめ見積り計上しておく負債科目。","cls":"近いうちに返金する可能性が高い義務なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":38,"en":"Travel Expense","name":"旅費交通費","bucket":"収益認識・現金預金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>旅費交通費</strong>とは、出張費や電車・バス代など、業務のための移動にかかった費用のこと。","cls":"本業を営むための諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":39,"en":"Miscellaneous Loss","name":"雑損","bucket":"収益認識・現金預金","cat":"expense","ans":[["P/L","営業外費用"]],"disp":null,"def":"<strong>雑損</strong>とは、現金過不足の原因不明の不足分など、金額が小さく、独立した科目を立てるほどではない雑多な損失をまとめて記録する科目。","cls":"本業以外で生じる軽微な損失なので、<strong>P/L上は営業外費用</strong>に表示する。"},
  {"no":40,"en":"Supplies Expense","name":"消耗品費","bucket":"収益認識・現金預金","cat":"expense","ans":[["P/L","販売費及び一般管理費"]],"disp":null,"def":"<strong>消耗品費</strong>とは、文房具やコピー用紙など、短期間で使い切ってしまう物品を購入したときの費用のこと。","cls":"本業を営むための諸費用なので、<strong>P/L上は販売費及び一般管理費</strong>に表示する。"},
  {"no":41,"en":"Commission Revenue","name":"受取手数料","bucket":"収益認識・現金預金","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>受取手数料</strong>とは、商品の仲介や紹介などを行って得た手数料収入のこと。","cls":"本業の商品販売そのものではなく、毎期ふつうに生じる副次的な収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":42,"en":"Miscellaneous Revenue","name":"雑益","bucket":"収益認識・現金預金","cat":"revenue","ans":[["P/L","営業外収益"]],"disp":null,"def":"<strong>雑益</strong>とは、現金過不足の原因不明の過剰分など、金額が小さく、独立した科目を立てるほどではない雑多な収益をまとめて記録する科目。","cls":"本業以外で生じる軽微な収益なので、<strong>P/L上は営業外収益</strong>に表示する。"},
  {"no":43,"en":"Right to Recover Returned Goods Asset","name":"返品資産","bucket":"収益認識・現金預金","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>返品資産</strong>とは、収益認識基準のもとで、将来顧客から商品が返品されたときに回収できる商品そのものの原価を見積もって計上する資産科目。","cls":"将来、自社の手元に戻ってくる商品の価値を表す資産なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":44,"en":"Liability for Expected Returns","name":"返品負債","bucket":"収益認識・現金預金","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>返品負債</strong>とは、収益認識基準のもとで、将来の返品に備えて、返金する可能性がある金額をあらかじめ見積り計上しておく負債科目。","cls":"近いうちに返金する可能性が高い義務なので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":45,"en":"Electronic Receivable","name":"電子記録債権","bucket":"債権債務","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>電子記録債権</strong>とは、でんさいネットに登録して電子化した、売掛金と同じ性質の債権（代金を受け取る権利）。","cls":"紙の手形と違い電子データでやり取りするが、本業の商品販売から生じる点は売掛金・受取手形と同じなので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":46,"en":"Electronic Payable","name":"電子記録債務","bucket":"債権債務","cat":"liability","ans":[["B/S","流動負債"]],"disp":null,"def":"<strong>電子記録債務</strong>とは、でんさいネットに登録して電子化した、買掛金と同じ性質の債務（代金を支払う義務）。","cls":"紙の手形と違い電子データでやり取りするが、本業の仕入れから生じる点は買掛金・支払手形と同じなので、<strong>B/S上は流動負債</strong>に表示する。"},
  {"no":47,"en":"Contract Asset","name":"契約資産","bucket":"債権債務","cat":"asset","ans":[["B/S","流動資産"]],"disp":null,"def":"<strong>契約資産</strong>とは、収益認識基準にもとづき、商品の引渡しなど一部の義務はすでに果たしたものの、対価を請求するにはまだ別の条件（時間経過など）を満たす必要がある状態の権利のこと。","cls":"近いうちに条件を満たして売掛金に振り替わる、商売のサイクルの中にある資産なので、<strong>B/S上は流動資産</strong>に表示する。"},
  {"no":48,"en":"Loans Receivable","name":"貸付金","bucket":"債権債務","cat":"asset","ans":[["B/S","流動資産（1年以内に回収する分）"],["B/S","投資その他の資産（1年より先に回収する分）"]],"disp":"短期貸付金 ／ 長期貸付金","def":"<strong>貸付金</strong>とは、取引先や従業員などにお金を貸したときに生じる、将来返してもらう権利（債権）のこと。","cls":"決算日の翌日から1年以内に返済期日が来る分は<strong>流動資産（短期貸付金）</strong>、1年より先の分は投資その他の資産（長期貸付金）に分けて表示する（1年基準）。"},
  {"no":49,"en":"Interest Expense","name":"支払利息","bucket":"債権債務","cat":"expense","ans":[["P/L","営業外費用"]],"disp":null,"def":"<strong>支払利息</strong>とは、銀行などからお金を借りていることによって生じる利息の支払額のこと。","cls":"本業の商品販売ではなく、資金調達（金融活動）に伴う費用なので、<strong>P/L上は営業外費用</strong>に表示する。"},
