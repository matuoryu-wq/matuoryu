function buildApxContent(){
  const freq = {};
  ALL.forEach(q => {
    if(!q.e) return;
    const seen = new Set();
    q.e.forEach(entry => {
      [...(entry.d||[]), ...(entry.c||[])].forEach(([name]) => seen.add(name));
    });
    seen.forEach(name => { freq[name] = (freq[name]||0) + 1; });
  });

  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name] || 'other';
    byType[type].push({ name, en, note, lv, note_en });
  });
  order.forEach(type => byType[type].sort((a, b) => (freq[b.name]||0) - (freq[a.name]||0)));

  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(({ name, en, note, lv, note_en }) =>
      `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${type}">(${name})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`
    ).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note, , note_en]) => {
      const type = T[name] || 'other';
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${type}">(${name})</span>
          <span class="apx-lv ind">工業</span>
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def, def_en }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-en">${en}</span> <span class="gloss-term-text">(${term})</span></div>
          <div class="gloss-def">${def_en?`<div class="gloss-def-en">${def_en}</div>`:''}<div class="gloss-def-ja">${def}</div></div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  return commercialHtml + indHtml + glossHtml;
}

let apxCurrentTab = 'all';

function showApx(){
  const el = document.getElementById('apx-overlay');
  if(!document.getElementById('apx-content').innerHTML)
    document.getElementById('apx-content').innerHTML = buildApxContent();
  el.classList.add('show');
  apxCurrentTab = 'all';
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'all'));
  applyApxFilter('all');
}
function hideApx(){ document.getElementById('apx-overlay').classList.remove('show'); }

function setApxTab(type){
  apxCurrentTab = type;
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  applyApxFilter(type);
}

function toggleHideNames(){
  const btn = document.getElementById('apx-hide-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('names-hidden', nowActive);
  btn.textContent = nowActive ? '👁 科目名を表示' : '👁 科目名を隠す';
}

function toggleHideEnglish(){
  const btn = document.getElementById('apx-hide-en-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('en-hidden', nowActive);
  btn.textContent = nowActive ? '🔤 英語を表示' : '🔤 英語を隠す';
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category !== 'industrial';
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else if(tab === 'level3' || tab === 'level2') typeMatch = category !== 'industrial';
    else typeMatch = (type === tab && category !== 'industrial');

    if(!typeMatch){ sec.style.display = 'none'; return; }

    if(tab === 'level3' || tab === 'level2'){
      const targetLevel = tab === 'level3' ? '3' : '2';
      let anyVisible = false;
      sec.querySelectorAll('.apx-row').forEach(row => {
        const match = row.dataset.level === targetLevel;
        row.classList.toggle('hidden', !match);
        if(match) anyVisible = true;
      });
      sec.style.display = anyVisible ? '' : 'none';
    } else {
      sec.style.display = '';
      sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
    }
  });
}

// 答えの単語を問題文から伏せる
function qaMask(html, term){
  if(!term) return html;
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return html.replace(new RegExp(esc,'g'),'<span class="qa-mask">▓▓▓</span>');
}

// （...）を薄くする
function markQKey(text){
  // Highlight the distinctive feature clause (after で、/ が、/ を指し、)
  // while leaving the final question stem (は何か？ / を何というか？) unmarked
  const m = text.match(/^([\s\S]+?)(で、|が、|を指し、)([\s\S]+?)(は何か？|を何というか？|は何というか？)$/);
  if(m) return m[1] + m[2] + '<mark>' + m[3] + '</mark>' + m[4];
  return text;
}

function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

// HTMLタグを除いた表示用テキストを抽出（問題文のプレビュー用）
function qaStripTags(html){ return html.replace(/<[^>]+>/g,''); }

  'クレジット売掛金': 'クレジットカード販売時にカード会社への請求権として計上する売上債権を【　　　　　　】という。\n例）商品1万円をクレジットカードで販売（顧客はカードで支払う）：（借）【　　　】1万円（カード会社にお金をもらう権利） ／（貸）売上1万円（収益が発生）。後日カード会社から手数料3%引き9,700円入金：（借）普通預金9,700円・支払手数料300円（カード会社への手数料） ／（貸）【　　　】1万円（権利が消える）。\nポイント：相手方はカード会社（顧客からではなくカード会社から回収する）。手数料は支払手数料（費用：カード会社に払う費用）。',
  '繰越商品': '三分法で期末在庫商品を原価で記録する棚卸資産科目を【　　　　　　】という。\n例）期末商品棚卸し（倉庫の在庫を実際に数えること）：原価100円×10個＝1,000円が手元に残存。決算整理仕訳①期首分：（借）仕入（前期末の在庫を今期の仕入費用に含める）／（貸）【　　　】（期首残高を取り崩す）。②期末分：（借）【　　　】1,000円（今期末の在庫を次期へ繰り越す）／（貸）仕入1,000円（期末在庫分を費用から除く）。\nポイント：期中は一切動かない（三分法では期中に【　　　】の仕訳は発生しない）。期首・期末の決算整理のみで仕入勘定と振り替える。',
  '仮払金': '支出金額・目的が未確定のまま一時的に前渡しした金銭の仮勘定科目を【　　　　　　】という。\n例）出張社員に旅費5万円を前渡し（使途・金額が確定していない段階でとりあえず渡す）：（借）【　　　】5万円（一時的な仮の資産として計上）／（貸）現金5万円（現金が減る）。帰社後精算（実際4.2万円使用）：（借）旅費交通費4.2万円（実際にかかった費用）・現金8,000円（おつりが戻ってくる）／（貸）【　　　】5万円（仮勘定を取り消す）。\nポイント：「金額・目的が不確定」のまま渡した前払金（使い道が決まってから正式な費用科目へ振替）。前払金は「商品仕入の前払い」で目的が明確な点が違う。',
  '前払費用': '当期に費用を支払ったが翌期以降に対応する未経過分を資産計上する経過勘定を【　　　　　　】という。\n例）10月1日に保険料12万円を1年分前払い（3月決算）→翌4〜9月分6万円が未経過（まだサービスを受けていない分）：（借）【　　　】6万円（翌期分を資産として繰り延べる） ／（貸）支払保険料6万円（今期の費用から除く）（期末繰延べ）。翌期4月1日に再振替（資産を費用に戻す）：（借）支払保険料6万円 ／（貸）【　　　】6万円。\nポイント：【　　　】＝「お金は払ったがサービスはまだ受けていない（来期以降に受ける）」部分→資産（将来の費用として取っておく）。前受収益（収益側の裏：お金は受け取ったがサービスはまだ提供していない）とセットで覚える。',
  '前払利息': '当期に支払った利息のうち翌期分に相当する部分を繰り延べる資産の経過勘定科目を【　　　　　　】という。\n例）借入金の利息12万円を1年分前払い（3月決算・10月払い）。翌4〜9月分6万円が前払い（まだ対応する期間が到来していない部分）：（借）【　　　】6万円（翌期分の利息を資産として振替）／（貸）支払利息6万円（今期分から除く）。\nポイント：前払費用の利息版（前払費用のうち支払利息に関係するもの）。翌期首に再振替仕訳（【　　　】→支払利息に戻す）を行う。',
  '未収収益': '当期に発生した収益のうちまだ受け取っていない部分を見越し計上する資産科目を【　　　　　　】という。\n例）3月決算・2〜3月分の家賃収入2万円が未入金（サービスは提供したがまだ受け取っていない）→（借）【　　　】2万円（後でもらえる権利が生じる） ／（貸）受取家賃2万円（今期の収益として計上：サービスは提供している）（見越し計上）。4月に受取：（借）現金2万円 ／（貸）【　　　】2万円（権利を消す：再び受取家賃計上しない：今期収益はすでに認識済み）。\nポイント：【　　　】＝「サービスは提供したがまだ受け取っていない（もらえる権利がある）」→資産（後でもらえる）。未払費用（費用側：サービスを受けたがまだ払っていない）とセットで覚える。',
  '未収利息': '当期に発生した利息収入のうちまだ受け取っていない分を資産計上する科目を【　　　　　　】という。\n例）3月決算で1〜3月分の貸付金利息3万円が未入金（利息が発生しているのにまだ受け取っていない）：（借）【　　　】3万円（まだもらっていない利息を資産として計上）／（貸）受取利息3万円（発生した収益を認識）。4月に入金：（借）現金3万円（現金が入る）／（貸）【　　　】3万円（資産を取り崩す）。\nポイント：未収収益の利息版（未収収益のうち受取利息に関係するもの）。当期分の利息が経過しているが受け取っていない場合に計上。',
  '未収入金': '本業以外の取引から生じた未回収金に使う資産科目を【　　　　　　】という。\n例）帳簿価額80万円（購入時から減価償却した後の残りの価値）の機械を100万円で売却・代金は翌月回収：（借）【　　　】100万円（後でもらえる権利が増える）／（貸）機械80万円（資産がなくなる）・固定資産売却益20万円（売値が帳簿価額を上回った利益）。\nポイント：商品の後払い→売掛金（本業の後払い）。固定資産等（商品以外）の後払い→【　　　】（本業以外の後払い）。',
  '立替金': '他者が負担すべき費用を一時的に立替払いした際の資産科目を【　　　　　　】という。\n例）社員Aの交通費1万円を会社が一時的に立替払い（社員が払うべき費用を会社が代わりに払う）：（借）【　　　】1万円（後で回収できる権利が増える）／（貸）現金1万円（現金が減る）。後日給料から控除（給料から差し引いて回収）：（借）給料（費用が減る）／（貸）【　　　】1万円（【　　　】を回収）。\nポイント：「自分の代わりに払ってあげた」一時的な立替（将来必ず回収できる資産）。仮払金は「目的不明の前渡し」、【　　　】は「目的明確な一時的肩代わり」。',
  '仮払法人税等': '法人税等の中間申告時に前払いした税額を一時的に計上する資産科目を【　　　　　　】という。\n例）中間決算（年度の途中に行う仮の決算）で法人税等の見込み額60万円を前払い：（借）【　　　】60万円（前払いした税金を資産として計上）／（貸）現金60万円（現金が減る）。期末確定額が100万円なら：（借）法人税等100万円（確定した税額を費用計上）／（貸）【　　　】60万円（仮払いを取り崩す）・未払法人税等40万円（まだ払っていない残りを負債計上）。\nポイント：中間申告時の仮払い→【　　　】（資産）。期末に確定額と相殺（比較して差額を調整）して差額を未払計上。',
  '仮払消費税': '税抜処理で仕入・経費にかかる消費税を一時的に計上する資産科目を【　　　　　　】という。\n例）商品110万円（税込：消費税10%込みの価格）を仕入れた：（借）仕入100万円（税抜の商品代金）・【　　　】10万円（支払った消費税を一時的に資産計上）／（貸）買掛金110万円（後で払う義務）。\nポイント：税抜処理では仕入時の消費税を【　　　】（資産）、売上時の消費税を仮受消費税（負債）に計上し、期末に相殺（差し引き計算）して差額を納付（売上側が多いので差額を国に納める）または還付（仕入側が多いので差額が返ってくる）。',
  '差入保証金': '賃貸借契約等で家主・相手方に差し入れた保証金・敷金を計上する長期資産科目を【　　　　　　】という。\n例）事務所を借りる際に敷金（退去時に返ってくる保証金）として家賃3か月分60万円を差入：（借）【　　　】60万円（将来返ってくる資産として計上）／（貸）現金60万円（現金が減る）。退去時に返還される（全額または修繕費控除後の残額）。\nポイント：敷金・保証金は資産（将来返ってくるお金）。賃料の前払いではない点に注意（サービスの前払いではなく担保として預けるお金）。',
  '貯蔵品': '期末に未使用で残った切手・収入印紙・消耗品等を資産計上する棚卸資産科目を【　　　　　　】という。\n例）期末に未使用の収入印紙5,000円（税金の支払いや各種手続きに必要な国の証紙）・切手3,000円が残存。決算整理：（借）【　　　】8,000円（未使用分を資産に振替）／（貸）租税公課5,000円（収入印紙の費用を取り消す）・通信費3,000円（切手の費用を取り消す）。翌期首に再振替：（借）租税公課・通信費 ／（貸）【　　　】8,000円（資産を費用に戻す）。\nポイント：切手・収入印紙・消耗品等の未使用分を「費用でなく資産」に振替（まだ使っていないものは今期の費用にしない）。',
  '土地': '建物や機械と違い減価償却が不要な有形固定資産科目を【　　　　　　】という。\n例）工場建設用に【　　　】5,000万円（購入代金4,950万円＋仲介手数料50万円：付随費用も取得原価に含める）を購入：（借）【　　　】5,000万円（資産が増える）／（貸）現金5,000万円（現金が減る）。\nポイント：【　　　】は減価償却しない（価値が永続的に保たれるとみなすため：時間が経っても【　　　】そのものは消耗しない）。建物・機械は減価償却する（老朽化や陳腐化で価値が下がるため）。【　　　】の取得原価＝購入代金＋付随費用（仲介料・登録免許税等すべて含める）。',
  '建物': '事務所・工場・店舗など業務用不動産を計上する有形固定資産科目を【　　　　　　】という。\n例）1,000万円の【　　　】（耐用年数20年・残存ゼロ・定額法）。毎年減価償却費50万円（1,000万円÷20年＝毎年50万円ずつ価値が減っていく）：（借）減価償却費50万円（費用が増える）／（貸）【　　　】減価償却累計額50万円（間接法：【　　　】の価値減少を累計額で管理）。\nポイント：【　　　】は土地と違い減価償却が必要（老朽化するから）。直接法では【　　　】を直接減額（帳簿価額がそのまま下がる見え方）。間接法では【　　　】はそのまま・累計額で控除表示（取得原価と現在価値が両方わかる）。',
  '備品': '事務用机・パソコン・コピー機など事務所用備品を計上する有形固定資産科目を【　　　　　　】という。\n例）パソコン24万円を購入（耐用年数4年・定額法・残存ゼロ）。毎年減価償却費6万円（24万円÷4年＝毎年6万円ずつ価値が減る）：（借）減価償却費6万円（費用が増える）／（貸）【　　　】減価償却累計額6万円（間接法：累計額で価値の下落を管理）。\nポイント：耐用年数1年以上かつ取得価額10万円以上→固定資産として計上・減価償却（毎年少しずつ費用化）。10万円未満→消耗品費で即時費用化（買ったその期に全額費用にする）。',
  '貸付金': '金銭消費貸借契約に基づく貸出元本を計上する資産科目を【　　　　　　】という。\n例）取引先に1,000万円を年利2%で貸付（借用書を交わして貸すお金）：（借）【　　　】1,000万円（後で返してもらえる権利が増える）／（貸）普通預金1,000万円（預金が減る）。利息20万円（1,000万円×2%＝1年間の利息）を受取：（借）普通預金20万円（現金が入る）／（貸）受取利息20万円（収益が増える）。\nポイント：元本が【　　　】（資産）、利息が受取利息（収益）（元本と利息は別の科目）。返済を受けたら【　　　】を減らす（資産がなくなる）。証書貸付（借用書あり）のケースに使用。',
  '手形貸付金': '手形を担保に受け取って貸し付けた元本を計上する資産科目を【　　　　　　】という。\n例）取引先に約束手形を担保（万が一返せなかった時の保証として預かるもの）として500万円を貸付：（借）【　　　】500万円（後で返してもらえる権利が増える）／（貸）普通預金500万円（預金が減る）。満期日に回収：（借）普通預金500万円（現金が入る）／（貸）【　　　】500万円（権利がなくなる）。\nポイント：手形を担保として受け取る→【　　　】（手形で裏付けされた貸付）。証書（借用書）で貸す→貸付金（書類だけで貸す）。担保の形式の違いで科目が変わる。',
  '前払金': '商品の仕入前に支払う手付金・内金を一時計上する資産科目を【　　　　　　】という。\n例）商品100万円を注文し、手付金30万円を先払い（商品がまだ届いていないのに代金の一部を先に払う）：（借）【　　　】30万円（後で商品をもらえる権利が増える）／（貸）現金30万円（現金が減る）。商品受取時：（借）仕入100万円（費用が増える）／（貸）【　　　】30万円（前払いした分を充当）・買掛金70万円（残りは後払い）。\nポイント：【　　　】は「商品仕入の前払い」（目的が仕入に確定している）。仮払金は「目的不確定の前渡し」（何に使うかまだ分からない）。前払費用は「サービスの前払い」（保険料・家賃等の期間費用の前払い）。',
  '受取商品券': '他者発行の商品券を販売代金として受け取った際の資産科目を【　　　　　　】という。\n例）顧客が商品1万円の支払いとして商品券を利用（現金の代わりに商品券で支払い）：（借）【　　　】1万円（商品券という換金可能な資産が増える）／（貸）売上1万円（収益が増える）。後日商品券発行元に換金請求（発行元に持参して現金に換える）：（借）現金1万円（現金が戻ってくる）／（貸）【　　　】1万円（資産がなくなる）。\nポイント：商品券はお金ではないが換金性が高いため資産（発行元に持っていけばお金に換えられる）。自社発行の商品券ではなく「他者（百貨店等）が発行した商品券を受け取った場合」に使う。',
  '現金過不足': '帳簿残高と実際残高の差異を一時的に処理する仮勘定科目を【　　　　　　】という。\n例）帳簿現金残高10万円（帳簿上の記録）・実際手元現金9.7万円（実際に数えた金額）→差額3,000円が不足：（借）【　　　】3,000円（差額を仮の勘定に計上）／（貸）現金3,000円（帳簿を実際残高に合わせる）。原因判明（旅費交通費だった）：（借）旅費交通費3,000円（正式な費用科目に振替）／（貸）【　　　】3,000円（仮勘定を取り消す）。期末まで不明なら：（借）雑損3,000円（原因不明の損失）／（貸）【　　　】3,000円。\nポイント：不足→借方（費用的）、過剰→貸方（収益的）。原因判明→正式科目へ振替、不明→期末に雑損・雑益へ。',
  '消耗品': '期末に未使用で残る消耗品を一時的に資産計上する科目を【　　　　　　】という。\n例）事務用品（ボールペン・ノート等）1万円を購入し決算時点で3,000円分が未使用。①購入時（資産計上法）：（借）【　　　】1万円（全額を資産として計上）／（貸）現金1万円（現金が減る）。②期末使用分振替（使った分だけ費用にする）：（借）【　　　】費7,000円（使用分を費用化）／（貸）【　　　】7,000円（使った分の資産を取り崩す）。\nポイント：購入時に費用計上→期末未使用分を【　　　】（資産）へ振替（費用→資産に変換）。または購入時に資産計上→使用分を【　　　】費（費用）へ振替（資産→費用に変換）。どちらの処理方法も出題される。',
  '小口現金': '少額の日常経費用に用意する手元資金を管理する資産科目を【　　　　　　】という。\n例）定額資金前渡制度（インプレスト制：常に一定額を手元に置く仕組み）：月初に1万円を小口係へ前渡し。月末に交通費4,000円・切手代3,000円の報告を受け同額を補給（使った分だけ補充して定額に戻す）：（借）旅費交通費4,000円（費用が増える）・通信費3,000円（費用が増える）／（貸）現金7,000円（補給した現金が減る）。\nポイント：【　　　】は「常に一定額を維持」が特徴（定額資金前渡制度）。報告を受けた時点で費用を認識し同額を補給して残高を元の定額に戻す（補給して費用を認識するのが同時）。',
  '車両運搬具': '業務用自動車・トラック・フォークリフト等を計上する有形固定資産科目を【　　　　　　】という。\n例）営業車（取得原価200万円・耐用年数5年・定額法・残存ゼロ）。毎年減価償却費40万円（200万円÷5年＝毎年40万円ずつ価値が減る）：（借）減価償却費40万円（費用が増える）／（貸）【　　　】減価償却累計額40万円（累計額で価値の下落を管理）。\nポイント：車両も建物・備品と同様に減価償却が必要な有形固定資産（時間とともに老朽化・価値が減少）。廃棄・売却時は帳簿価額（取得原価－累計額）と処分価額の差で売却損益を計上（帳簿上の価値より高く売れれば利益、低ければ損失）。',
  '機械装置': '製造・加工用の大型機械・製造ラインを計上する有形固定資産科目を【　　　　　　】という。\n例）製造ライン機械（取得原価3,000万円・耐用年数10年・定額法）。毎年300万円の減価償却費（3,000万円÷10年）：（借）減価償却費300万円（費用が増える）／（貸）【　　　】減価償却累計額300万円（累計額で管理）。\nポイント：備品との違い→【　　　】は「製造・加工に使う大型設備」（工場の機械・製造ライン）。備品は「事務所等で使う汎用品」（パソコン・コピー機等）。製造業の主力設備として工業簿記でも登場する。',
  '構築物': '建物以外の土地上に造られた工作物・設備を計上する有形固定資産科目を【　　　　　　】という。\n例）駐車場のアスファルト舗装（土地に固定した建物以外の構造物）（取得原価500万円・耐用年数15年）。毎年減価償却費33万円（500万円÷15年）：（借）減価償却費33万円（費用が増える）／（貸）【　　　】減価償却累計額33万円（累計額で管理）。\nポイント：建物（屋根・壁があり内部に人が入れるもの）ではなく土地に据え付けた構造物が【　　　】。駐車場舗装・塀・フェンス・貯槽タンク等が該当（建物じゃないが土地に固定されている設備）。',
  '工具器具備品': '製造現場で使う工具・測定器・金型など比較的小型の設備を計上する有形固定資産科目を【　　　　　　】という。\n例）精密測定器（製造現場で寸法を測る道具）（取得原価30万円・耐用年数3年・定額法）。毎年減価償却費10万円（30万円÷3年）：（借）減価償却費10万円（費用が増える）／（貸）【　　　】減価償却累計額10万円（累計額で管理）。\nポイント：工業簿記では消耗【　　　】（10万円未満・即時費用化）と区別する。10万円以上・1年超使用→【　　　】として固定資産計上（毎年減価償却）。',
  'ソフトウェア': '自社利用のコンピュータソフトウェアを無形固定資産として計上した科目を【　　　　　　】という。\n例）基幹システムの【　　　】を1,000万円で購入または開発（業務で使い続けるシステム）。5年で均等償却（毎年少しずつ費用化）→毎年200万円を【　　　】償却費（費用）として計上。仕訳）取得時：（借）【　　　】1,000万円（無形固定資産として計上）／（貸）現金1,000万円（現金が出ていく）。毎年：（借）【　　　】償却200万円（費用：価値が減った分）／（貸）【　　　】200万円（資産を減らす）。\nポイント：研究開発費（まだ何になるかわからない段階のコスト）→費用処理（資産として計上不可）。【　　　】（将来効果が確実な段階：使い方が決まっている）→将来効果が確実なら資産計上→5年償却（毎年費用化）。「開発費と資産計上の境界（どの段階から資産にできるか）」「見込みが立たない段階は研究開発費（資産にできない）」の判断が重要。',
  'リース資産': 'ファイナンス・リース契約で取得し毎期減価償却する固定資産相当の権利を【　　　　　　】という。\n例）コピー機を5年間ファイナンス・リース契約（「実質買った」扱いのリース：解約不可・リース料が資産の価値を全部払うもの）（月リース料5万円×60か月＝300万円、利息相当額30万円）。【　　　】270万円（元本相当：実質的な取得価格）で計上。5年・残存ゼロで毎年54万円償却（毎年少しずつ価値を減らす処理）。仕訳）契約時：（借）【　　　】270万円（資産として計上）／（貸）リース債務270万円（返済義務として負債計上）。毎年：（借）減価償却費54万円（費用）／（貸）【　　　】54万円（資産を減らす）、（借）リース債務54万円＋支払利息6万円（元本と利息）／（貸）現金60万円（実際の支払い）。\nポイント：ファイナンスリース→「実質購入（買ったも同然）」として【　　　】・リース債務を計上し減価償却（B/Sに資産と負債が両方出てくる）。オペレーティングリース→「レンタル（借りているだけ）」として支払リース料（費用）のみ（B/Sに何も出てこない）。リース料を支払うだけなのに資産・負債が増えることに注意。',
  'のれん': '企業買収時に純資産時価を超えて支払った部分で20年以内の均等償却が必要な無形固定資産を【　　　　　　】という。\n例）A社がB社を1億円で買収（買いに行った）。B社の純資産の時価評価額8,000万円（帳簿上の正味財産）→【　　　】2,000万円（超過支払分：B社のブランド・顧客基盤・技術力への対価。「なぜ8,000万円の会社に1億円払ったの？」という差額）。5年均等償却なら年400万円（5年かけて費用化）。仕訳）毎年：（借）【　　　】償却400万円（費用）／（貸）【　　　】400万円（資産を少しずつ消す）。\nポイント：【　　　】＝「時価純資産を超えた超過収益力への対価（目に見えない価値への支払い）」。20年以内に必ず償却（毎年費用として計上）（連結でも同じ）。負の【　　　】（純資産＞取得原価：割安買収）は発生時に即座に利益計上（費用化なし）。正と負で処理が真逆。',
  '創立費': '会社設立のために要した法的手続き費用等を計上する繰延資産科目を【　　　　　　】という。\n例）会社設立時の登記費用（法務局に会社を登録する費用）・発起人への報酬合計50万円：（借）【　　　】50万円（繰延資産として計上）／（貸）現金50万円（現金が減る）。5年以内に均等償却：（借）【　　　】償却10万円（費用化）／（貸）【　　　】10万円（資産を減らす）。\nポイント：繰延資産の1つ（支出済みだが効果が将来にわたるため資産に計上する特殊な項目）。創立時のみ発生する科目で、営業開始後の費用（開業費）とは区別する。',
  '株式交付費': '株式・新株予約権の発行にかかった費用を計上する繰延資産科目を【　　　　　　】という。\n例）新株発行に際する目論見書印刷（株主への説明書の作成費）・証券会社への手数料合計200万円：（借）【　　　】200万円（繰延資産として計上）／（貸）現金200万円（現金が減る）。3年以内に均等償却：（借）【　　　】償却67万円（費用化）／（貸）【　　　】67万円（資産を減らす）。\nポイント：繰延資産の1つ（将来にわたる効果があるため資産に計上する特殊な項目）。株式発行のたびに計上できる（新株を発行するたびに発生する費用）。ただし少額なら費用処理（営業外費用として即時費用化）も可。',
  '売買目的有価証券': '短期的な売買差益を目的として保有する有価証券で期末に時価評価し評価差額を損益に計上するものを【　　　　　　】という。\n例）A株式を100万円で購入（売買目的：短期で売って差益を狙う）→期末時価120万円（値上がりした）。仕訳①購入：（借）【　　　】100万円（資産）／（貸）現金100万円。仕訳②期末評価替え（決算日に時価に更新）：（借）【　　　】20万円（資産増加）／（貸）有価証券評価益20万円（P/L計上：利益として認識）。翌期首の洗替仕訳（元に戻す仕訳）：（借）有価証券評価益20万円（前期の評価益を取り消す）／（貸）【　　　】20万円（取得原価に戻す）。\nポイント：【3区分比較】売買目的→時価評価・差額はP/L（損益に影響）。満期保有目的→時価評価なし・償却原価法（時価に関係なく）。その他有価証券→時価評価・差額はB/S純資産（損益に影響しない）。この区分の暗記が最重要。',
  '満期保有目的債券': '満期まで保有する意図と能力を持って取得した社債などの債券で償却原価法で評価するものを【　　　　　　】という。\n例）額面100万円（満期に返してもらえる金額）の社債を96万円（割引価格）で取得（4年満期保有予定）。差額4万円（96円→100円に近づく分）を4年で按分（毎年少しずつ利息として受取る）。仕訳）取得時：（借）【　　　】96万円（資産）／（貸）現金96万円（現金が出ていく）。毎年度末（償却原価法：帳簿価額を少しずつ額面に近づける方法）：（借）【　　　】1万円（帳簿価額を増やす）／（貸）有価証券利息1万円（4万円÷4年＝追加利息）。4年後：帳簿価額100万円で満期償還（額面通りに戻ってくる）。\nポイント：満期保有目的は「時価がいくらでも評価替えしない（値段が変わっても関係ない）」のが最大の特徴。取得価格と額面の差は「事実上の追加利息（安く買った分、後で返してもらえる分）」→毎期受取利息に加算。試験では「償却原価法の計算（毎年の利息額を求める問題）」が必出。',
  '子会社株式': '子会社を支配するために保有する株式を計上する投資有価証券分類の固定資産科目を【　　　　　　】という。\n例）A社株式の51%（過半数を取得すると意思決定を支配できる）を5,000万円で取得（A社を子会社化）→【　　　】5,000万円（固定資産）。期末に時価が下落しても原則として評価替えしない（売るつもりがないから時価変動を気にしない）。\nポイント：支配目的（子会社にする目的）→【　　　】（固定資産・時価評価なし）。売買目的（短期売買）→売買目的有価証券（流動資産・時価評価あり）。',
  '関係会社株式': '関連会社や子会社への影響力維持目的で保有する株式を計上する科目を【　　　　　　】という。\n例）B社株式の25%（過半数ではないが重要な影響力を持てる割合）を2,000万円で取得（持分法適用・関連会社）→【　　　】2,000万円（固定資産）。\nポイント：20%以上50%未満保有で「重要な影響力」がある→関連会社株式（【　　　】）（役員派遣や重要事項への発言権がある）。持分法で連結（保有比率に応じて関連会社の損益を自社に取り込む）。子会社株式（50%超）とは支配の有無で異なる。',
  '投資有価証券': '長期保有目的や子会社・関連会社株式など投資目的で保有する有価証券を固定資産として計上する科目を【　　　　　　】という。\n例）取引先との関係維持のために長期保有するC社株式30万円（その他有価証券：売る気のない長期保有株）。期末時価35万円（値上がりした）。仕訳）取得時：（借）【　　　】30万円（固定資産として計上）／（貸）現金30万円（現金が出ていく）。期末評価替え（決算日に時価に更新）：（借）【　　　】5万円（資産増加）／（貸）その他有価証券評価差額金5万円（純資産へ直入：P/L経由なし。損益計算書を通らずに直接純資産を増やす）。\nポイント：その他有価証券の評価差額は「P/Lをスルーして純資産へ直入（損益計算書を経由しない）」。売買目的の評価差額は「P/Lへ（損益計算書に計上）」。この違いを「どちらがP/L経由か（どちらが今期の利益・損失になるか）」で整理すること。',
  '長期前払費用': '前払費用のうち支払日から1年を超えた後に費用化される部分を固定資産に計上する科目を【　　　　　　】という。\n例）5年間の火災保険料60万円を一括前払い（5年分まとめて払った）（3月決算）。今後1年以内費用化分12万円→前払費用（流動資産：1年以内に費用になるもの）。1年超の費用化分48万円→【　　　】（固定資産：1年超先に費用になるもの）。毎年12万円ずつ保険料（費用）に振替（毎期少しずつ費用として計上）。仕訳）支払時：（借）前払費用12万円（来期分）＋【　　　】48万円（来期以降分）／（貸）現金60万円（一括払い）。毎年：（借）保険料12万円（費用）／（貸）前払費用12万円（資産が費用になる）。\nポイント：1年基準の区分→1年以内に費用化→前払費用（流動）。1年超→【　　　】（固定）。毎決算時に見直してB/S上の分類を変える（時間の経過で固定→流動に切り替える）。',
  '繰延税金資産': '将来の節税効果相当額を計上する資産科目を【　　　　　　】という。\n例）貸倒引当金20万円を会計上費用計上（損益計算書では損として処理）したが税務（税金の計算では）は今期認めない（税務上はまだ損として扱わない）→将来認定時に課税所得（税金の対象になる利益）が減る→節税効果（その時に税金を安く払える）。税率30%なら【　　　】6万円（20万円×30%：将来の節税額を先取り）。仕訳）（借）【　　　】6万円（将来の節税効果という資産）／（貸）法人税等調整額6万円（P/L：税金を6万円分減らす効果）。翌期に税務認定された（税務上も費用として認められた）時：（借）法人税等調整額6万円 ／（貸）【　　　】6万円（資産解消：節税効果を使い切った）。\nポイント：【　　　】は「将来の節税効果の前払い（先払いした税金がいつか戻ってくるイメージ）」。引当金・減損・未払費用などで会計＞税務の費用認識ズレが生じる時に発生。繰延税金負債（将来の税負担増：逆方向）との違いを押さえる。',
  '別段預金': '特定目的のために分離管理される特別な預金口座科目を【　　　　　　】という。\n例）新株申込証拠金1,000万円（新株に申し込んだ投資家が払い込む証拠金：株式が発行されるまで預けておくお金）を投資家から受取→特別管理の【　　　】に入金（他のお金と混ざらないよう分離管理）：（借）【　　　】1,000万円（資産として計上）／（貸）株式申込証拠金1,000万円（負債として計上）。株式発行完了時に正規口座へ振替：（借）普通預金1,000万円（通常の預金に移す）／（貸）【　　　】1,000万円（【　　　】を取り崩す）。\nポイント：【　　　】は「特定目的のために分離管理する預金」（通常の口座とは別に管理）。',
  '商品': '売上原価対立法または分記法における商品在庫を計上する棚卸資産科目を【　　　　　　】という。\n例）売上原価対立法（【　　　】を販売するたびに原価を認識する方法）で【　　　】50万円を仕入：（借）【　　　】50万円（棚卸資産が増える）／（貸）買掛金50万円（後で払う義務）。販売時：（借）売掛金80万円（後でもらえる権利）／（貸）売上80万円（収益が増える）＋（借）売上原価50万円（費用が増える）／（貸）【　　　】50万円（在庫が減る）。\nポイント：三分法→仕入勘定を使い期末に調整（期末に一括して売上原価を計算）。売上原価対立法→【　　　】勘定を使い販売時に原価を認識（販売のたびに利益が分かる）。',
  '不渡手形': '支払期日に決済されなかった手形を計上する資産科目を【　　　　　　】という。\n例）保有していた受取手形50万円が支払期日に決済されず（支払人の口座残高不足で銀行が支払いを拒絶）→【　　　】（手形が「不渡り」になった＝決済されなかった）：（借）【　　　】50万円（資産の科目を変更）／（貸）受取手形50万円（受取手形がなくなる）。後日回収不能が確定：（借）貸倒損失50万円（損失として計上）／（貸）【　　　】50万円（資産を取り崩す）。\nポイント：不渡り＝手形が決済されないこと（2回不渡りを出すと銀行取引停止：実質的な倒産と同義）。回収不能確定なら貸倒損失へ。',
  '建設仮勘定': '建物・機械等の固定資産の完成前に支払った手付金・中間払いを一時計上する資産科目を【　　　　　　】という。\n例）新工場建設（総額5億円）で着工金として2億円を支払い（建設中なのでまだ「建物」として計上できない）。完成まで1年かかる（工事中）。仕訳）着工金支払：（借）【　　　】2億円（仮の勘定：完成するまでの一時的な資産）／（貸）現金2億円（現金が出ていく）。工事中間払い：（借）【　　　】1億円（追加支払い分も仮勘定に積む）／（貸）現金1億円。完成・引渡し時：（借）建物5億円（完成した建物として本登録）／（貸）【　　　】3億円（仮勘定を解消）＋現金2億円（残金を支払い）。\nポイント：【　　　】は「完成していないので減価償却しない（まだ使っていないので価値を減らさない）」資産。完成して使い始めた時点で減価償却が始まる（使い始めてから費用化が始まる）。工事代金の支払ごとに加算し完成時に一括して正式固定資産に振り替える。',
  '未決算': '金額・結果が未確定の取引を一時的に処理する仮勘定科目を【　　　　　　】という。\n例）火災で帳簿価額500万円（取得原価から減価償却した後の残りの価値）の建物が焼失。保険金額が未確定（保険会社の査定が終わっていない）：（借）【　　　】500万円（結果が確定するまで一時的に仮計上）／（貸）建物500万円（建物がなくなる）。後日保険金600万円確定：（借）現金600万円（保険金が入る）／（貸）【　　　】500万円（仮勘定を取り崩す）・保険差益100万円（保険金が帳簿価額を上回った利益）。\nポイント：「結果がまだ確定していない取引」を一時的に処理する仮勘定（確定後に正式な科目へ振替）。',
  '破産更生債権等': '法的整理中の取引先への債権を流動資産から固定資産に振替計上する科目を【　　　　　　】という。\n例）取引先が破産申請（裁判所に破産手続き開始を申立て：返済が不可能になった）。保有する売掛金200万円を一般債権（通常回収できる債権）から切替：（借）【　　　】200万円（回収困難な債権として固定資産に分類）／（貸）売掛金200万円（売掛金がなくなる）。回収困難なため全額引当（全額を将来の損失として計上）：（借）貸倒引当金繰入200万円（費用が増える）／（貸）貸倒引当金200万円（引当金を積む）。\nポイント：破産・更生・和議など法的手続き中の債権は「【　　　】」として固定資産に分類（流動資産から除外）し全額引当。',
  '工事未収入金': '建設業などで工事収益が計上されているが代金がまだ受け取られていない場合に使う資産科目を【　　　　　　】という。\n例）工事進捗度50%（半分できた段階）で工事収益5,000万円を計上したが、請求・入金は工事完成後（まだお金は受け取っていない）。仕訳）収益認識時：（借）【　　　】5,000万円（工事代金の未回収分：まだもらっていないお金）／（貸）工事収益5,000万円（進捗度に応じて認識した収益）。入金時：（借）現金5,000万円（実際にお金が入ってきた）／（貸）【　　　】5,000万円（未収入金が消える）。\nポイント：一般の売掛金（売上計上後に代金が未回収）＝商品引渡し後の未収金。【　　　】＝建設・工事業での未収金（進捗度で収益認識したが入金が先の場合に使う科目）。どちらも「売上（収益）計上後の代金未回収分（まだもらっていない売上代金）」という意味は同じ。試験では建設業の問題に出てくる。',
  '長期貸付金': '返済期限が1年を超える長期の貸付元本を計上する固定資産科目を【　　　　　　】という。\n例）子会社に5,000万円を返済期限3年（1年を超える長期の貸付）で貸付：（借）【　　　】5,000万円（長期の債権を固定資産として計上）／（貸）普通預金5,000万円（預金が減る）。翌期以降1年以内に返済予定の部分→流動資産「貸付金」に振替（1年基準で流動・固定を分類）。\nポイント：返済期限1年超→【　　　】（固定資産）。1年以内→貸付金（流動資産）。決算ごとに流動・固定の振替確認が必要（来期に返済される部分は流動資産に移す）。',
  '営業外受取手形': '商品の売上以外の取引（固定資産売却等）で受け取った手形を計上する科目を【　　　　　　】という。\n例）工場（固定資産）を売却し、代金として手形100万円を受取（商品の売上ではなく固定資産を売った代金）：（借）【　　　】100万円（営業外の手形債権が増える）／（貸）土地100万円（固定資産がなくなる）（または固定資産売却益等）。\nポイント：商品売買の手形→受取手形（本業の売上に関係する手形）。固定資産等営業外取引の手形→【　　　】（本業以外の取引から生じた手形）。何を売ったかで科目が変わる。',
  '営業外電子記録債権': '商品売買以外の取引で電子記録により発生した債権を計上する科目を【　　　　　　】という。\n例）固定資産の売却代金を電子記録で請求（紙の手形の代わりに電子的に請求）：（借）【　　　】100万円（営業外の電子記録債権が増える）／（貸）固定資産（帳簿価額）・固定資産売却益。\nポイント：商品・製品の売上から生じた電子記録→電子記録債権（本業の売上に関係）。それ以外の取引（固定資産売却等）から生じた電子記録→【　　　】（本業以外の取引から生じた電子記録債権）。',
  '諸資産': '複数の資産科目をまとめて一括表示するために用いる便宜的な科目を【　　　　　　】という。\n例）連結精算表や合算表で複数の資産をまとめて表示する際に「【　　　】」と一括表示することがある（個々の科目を列挙せずにまとめて表記する便宜的な方法）。個別勘定科目が確定している場合は使わない。\nポイント：試験上は「複数の資産をまとめて仕訳に記載する便宜的な表記」として使用（現金・売掛金・在庫等をまとめて「【　　　】」と書く）。実務では使わない科目名。',
  '買掛金': '商品を掛けで仕入れた際の代金支払義務を計上する負債科目を【　　　　　　】という。\n例）仕入先から商品100万円を後払い（掛け：商品は受け取ったが代金は来月払う約束）で仕入：（借）仕入100万円（費用が増える）／（貸）【　　　】100万円（後で払う義務が増える）。翌月末に支払：（借）【　　　】100万円（義務がなくなる）／（貸）普通預金100万円（預金が減る）。\nポイント：商品の掛け仕入→【　　　】（本業の仕入に関係する後払い）。パソコン等固定資産の後払い→未払金（商品以外の後払い）。「何を買ったか」で科目が変わる。',
  '支払手形': '自社が振り出した約束手形・為替手形の引受額を計上する負債科目を【　　　　　　】という。\n例）仕入代金100万円を3か月後払いの約束手形（「3か月後に必ず払う」という証書）で支払：（借）仕入100万円（費用が増える）／（貸）【　　　】100万円（手形という支払義務が増える）。3か月後に当座預金から自動決済：（借）【　　　】100万円（義務がなくなる）／（貸）当座預金100万円（当座預金が減る）。\nポイント：手形を「振り出す」（自分が書いて相手に渡す）→【　　　】（自社の支払義務）。手形を「受け取る」（相手が書いた手形をもらう）→受取手形（自社の権利）。',
  '電子記録債務': '電子記録機関への登録で発生する金銭債務科目を【　　　　　　】という。\n例）仕入先への代金100万円を電子債権記録機関（でんさいネット等：紙の手形の代わりにインターネット上で債務を管理する機関）に登録（紙の手形の代わりに電子的に支払い義務を記録）：（借）仕入100万円（費用が増える）／（貸）【　　　】100万円（電子記録された支払義務が増える）。支払期日に口座から自動引落し：（借）【　　　】100万円（義務がなくなる）／（貸）当座預金100万円（当座預金が減る）。\nポイント：紙の支払手形と同機能だが書類郵送・保管が不要（電子データで管理）。',
  '未払金': '商品の仕入以外の取引で生じた代金の未払い義務を計上する負債科目を【　　　　　　】という。\n例）事務用パソコン20万円を後払い（商品ではなく固定資産を後払いで購入）で購入：（借）備品20万円（資産が増える）／（貸）【　　　】20万円（後で払う義務が増える）。翌月支払：（借）【　　　】20万円（義務がなくなる）／（貸）普通預金20万円（預金が減る）。\nポイント：商品の掛け仕入→買掛金（本業の仕入）。固定資産・水道光熱費など商品以外→【　　　】（商品以外の後払い）。「商品以外の物品・サービスの後払い」が【　　　】。',
  '借入金': '金銭消費貸借契約書に基づく借入元本の返済義務を計上する負債科目を【　　　　　　】という。\n例）銀行から1,000万円を年利2%・3年返済で借入（借用書を交わして借りるお金）：（借）普通預金1,000万円（預金が増える）／（貸）【　　　】1,000万円（返済義務が増える）。年間利息20万円（1,000万円×2%）：（借）支払利息20万円（費用が増える）／（貸）普通預金20万円（元本返済分は【　　　】を減額）。\nポイント：【　　　】は「元本残高（返さなければならない本体の金額）」。利息は「支払利息（費用）」として別計上（元本と利息は別の科目）。元本返済は費用にならない。',
  '手形借入金': '手形を振り出すことを条件に借り入れた元本の返済義務を計上する負債科目を【　　　　　　】という。\n例）金融機関に約束手形を担保（返せなかった時の保証として差し入れる証書）として500万円を借入：（借）普通預金500万円（預金が増える）／（貸）【　　　】500万円（返済義務が増える）。満期日に返済：（借）【　　　】500万円（義務がなくなる）／（貸）当座預金500万円（当座預金が減る）。\nポイント：証書（借用書）で借りる→借入金（書類だけで借りる）。手形を担保として差入れて借りる→【　　　】（手形という証拠が絡む）。',
  '未払利息': '当期に発生したがまだ支払っていない利息を見越し計上する負債科目を【　　　　　　】という。\n例）3月決算・2〜3月分の借入利息2万円がまだ未払い（利息は発生しているのにまだ払っていない）：決算整理（借）支払利息2万円（費用が発生）／（貸）【　　　】2万円（払っていない利息を負債として計上）。4月に実際に支払い：（借）【　　　】2万円（負債を取り崩す）／（貸）現金2万円（現金が減る：費用の二重計上を防ぐため再度費用計上しない）。\nポイント：翌期の支払時は「費用計上せず、【　　　】を消去する」だけ（前期に計上済みのため）。',
  '前受金': '商品引渡し前に受け取った手付金・内金を一時計上する負債科目を【　　　　　　】という。\n例）来月届ける商品50万円の注文で手付金10万円を受取（商品はまだ渡していないが先にお金をもらう）：（借）現金10万円（現金が増える）／（貸）【　　　】10万円（まだ商品を渡していないので「預かった」という義務を負債として計上）。商品引渡し時：（借）【　　　】10万円（負債を取り崩す）・現金40万円（残金受取）／（貸）売上50万円（商品を渡して初めて収益）。\nポイント：手付金受取時は「まだ商品を渡していない」→【　　　】（負債）。引渡し後に売上へ振替（商品を渡して初めて収益になる）。前払金（仕入側の手付け）と【　　　】（販売側の手付け）は対の科目。',
  '仮受金': '入金の原因・相手方が未確定の場合に一時的に計上する負債科目を【　　　　　　】という。\n例）口座に100万円の振込があったが目的不明（誰からなぜ振り込まれたか分からない）：（借）普通預金100万円（預金が増える）／（貸）【　　　】100万円（原因不明の入金を仮の負債として計上）。後日、得意先からの売掛金回収と判明：（借）【　　　】100万円（仮勘定を取り消す）／（貸）売掛金100万円（売掛金が回収されたと認識）。\nポイント：入金はあったが「誰から・何のための入金か不明」な場合に一時計上。原因判明後に正式な科目へ振替（仮払金の逆側）。',
  '当座借越': '当座預金残高を超えて引落しが生じた際に発生する銀行への短期借入れに相当する負債科目を【　　　　　　】という。\n例）当座預金残高50万円なのに小切手80万円を振り出し（【　　　】契約あり：残高を超えた引落しを銀行が立替える契約）：当座預金がマイナス→【　　　】30万円（銀行が立替えた金額）が負債。後日入金で解消：【　　　】30万円を返済。\nポイント：【　　　】契約なし→残高超過小切手は不渡り（銀行が支払いを拒絶する）。【　　　】は「銀行が立替えてくれた短期借入れ（いつでも返せる当座借入れ）」。',
  '預り金': '従業員から一時的に預かった源泉所得税・住民税等を計上する負債科目を【　　　　　　】という。\n例）社員給料30万円から源泉所得税3万円（国に代わって会社が先に税金を徴収）・住民税2万円を天引き：（借）給料30万円（費用として計上）／（貸）現金（手取り）25万円（実際に渡す金額）・【　　　】5万円（税金を一時的に預かる）。翌月納付：（借）【　　　】5万円（負債を取り崩す）／（貸）現金5万円（税金を納付）。\nポイント：【　　　】は「会社のお金ではなく第三者（税務署等）へ預かって納める義務」→負債（会社は橋渡し役）。',
  '社会保険預り金': '給与から控除した従業員負担分の社会保険料を一時計上する負債科目を【　　　　　　】という。\n例）社員の社会保険料（健康保険・厚生年金：病気やけが・老後に備える国の保険）の本人負担分を給料から天引き：（借）給料（費用として計上）／（貸）【　　　】（従業員負担分を一時的に預かる）。年金事務所へ会社負担分と合計して納付：（借）【　　　】（従業員分を取り崩す）・法定福利費（会社負担分の費用）／（貸）現金（実際に納付）。\nポイント：社会保険料は会社が立替えて従業員・会社両方の分を年金事務所へ一括納付。従業員負担分→預り金（負債）、会社負担分→法定福利費（費用）。',
  '所得税預り金': '給与から源泉徴収した所得税を翌月納付まで一時計上する負債科目を【　　　　　　】という。\n例）社員の源泉所得税3万円を給与から天引き（源泉徴収：給与を払う際に会社が税金を代わりに徴収）：（借）給料（費用として計上）／（貸）【　　　】3万円（税金を一時的に預かる）・現金等（手取り分を支払）。翌月10日に税務署へ納付：（借）【　　　】3万円（負債を取り崩す）／（貸）現金3万円（税金を納付）。\nポイント：「預り金」の一種（預り金のうち所得税に特化した科目）。給与支払の都度、源泉徴収して翌月10日（特例は7月・1月）に税務署へ納付。会社は源泉徴収義務者として代わりに預かって納める。',
  '未払法人税等': '期末決算で確定した法人税等の未納付額を計上する負債科目を【　　　　　　】という。\n例）期末に法人税等の確定額100万円（年間の利益に対する税額）・中間申告で仮払済み60万円→差額40万円が未払：（借）法人税等100万円（費用として計上）／（貸）仮払法人税等60万円（仮払いを取り崩す）・【　　　】40万円（残りを負債として計上）。翌期に納付：（借）【　　　】40万円（負債を取り崩す）／（貸）現金40万円（現金が減る）。\nポイント：中間申告済みの仮払法人税等と相殺し、差額（追加納付額）を【　　　】として計上。',
  '未払消費税': '期末に確定した消費税の未納付額を計上する負債科目を【　　　　　　】という。\n例）税抜処理（消費税を本体価格と分けて計上する方法）で仮受消費税80万円（お客様から預かった消費税）・仮払消費税50万円（仕入時に払った消費税）→差額30万円が国への納付義務：（借）仮受消費税80万円（預かり消費税を取り崩す）／（貸）仮払消費税50万円（仕入消費税を取り崩す）・【　　　】30万円（差額を負債として計上）。翌期に税務署へ納付：（借）【　　　】30万円（負債を取り崩す）／（貸）現金30万円（現金が減る）。\nポイント：税抜処理では仮受・仮払を期末に相殺し差額を【　　　】として確定。',
  '仮受消費税': '税抜処理で売上・収益にかかる消費税を一時的に計上する負債科目を【　　　　　　】という。\n例）商品110万円（税込：消費税10%込みの価格）を販売（税抜処理）：（借）売掛金110万円（後でもらえる権利）／（貸）売上100万円（本体価格の収益）・【　　　】10万円（お客様から預かった消費税を一時的に負債として計上）。期末に仮払消費税6万円と相殺→差額4万円を未払消費税へ（差額を国に納める）。\nポイント：税抜処理では売上時の消費税を【　　　】（負債として一時的に預かる）として計上。期末に仮払消費税と相殺して差額を納付（国への消費税の橋渡し役）。',
  '未払配当金': '株主総会での配当決議から実際の支払いまでの間に計上する負債科目を【　　　　　　】という。\n例）株主総会で配当金100万円を決議（株主への利益分配を正式に決定）：（借）繰越利益剰余金100万円（純資産が減る）／（貸）【　　　】100万円（株主に払う義務が増える）。株主に実際に支払い：（借）【　　　】100万円（義務がなくなる）／（貸）普通預金100万円（預金が減る）。\nポイント：配当は「決議日」に費用・負債を認識し（決議があれば必ず払わなければならないから）、「支払日」に現金が出る。',
  '前受収益': '当期に収益を受け取ったが翌期以降に対応する未経過分を負債計上する経過勘定を【　　　　　　】という。\n例）10月1日に家賃1年分12万円を受取（3月決算）→翌4〜9月分6万円が未経過（まだサービスを提供していない分）：（借）受取家賃6万円（今期の収益から除く） ／（貸）【　　　】6万円（翌期分を負債として繰り延べる）（期末繰延べ）。翌期4月1日に再振替（負債を収益に戻す）：（借）【　　　】6万円 ／（貸）受取家賃6万円。\nポイント：【　　　】＝「お金は受け取ったがサービスはまだ提供していない（来期以降に提供する）」部分→負債（まだ果たしていない義務）。前払費用（費用側：払ったがサービスはまだ受けていない）とセットで覚える。',
  '未払費用': '当期に発生した費用のうちまだ支払っていない部分を見越し計上する負債科目を【　　　　　　】という。\n例）3月決算・2〜3月分の給料20万円が未払（サービスは受けたがまだ払っていない）→（借）給料20万円（今期の費用として計上：サービスは受けている） ／（貸）【　　　】20万円（後で払う義務が生じる）（見越し計上）。4月に支払い：（借）【　　　】20万円（義務を消す） ／（貸）現金20万円（再び給料計上しない：今期費用はすでに認識済み）。\nポイント：【　　　】＝「サービスは受けたがまだ払っていない（払う義務がある）」→負債（後で払う必要がある）。未収収益（収益側の裏：サービスは提供したがまだ受け取っていない）とセットで覚える。',
  '社債': '株式会社が不特定多数の投資家から長期資金を集めるために発行する有価証券で定期的な利払いと元本返済義務を負う負債科目を【　　　　　　】という。\n例）額面1億円・クーポン1%（表面利率：毎年投資家に払う利息の率）・5年満期の【　　　】を9,700万円（97円発行：額面より安く売った）で発行。差額300万円（97円→100円に近づく分）は5年で均等償却（年60万円を【　　　】利息に加算）。仕訳）発行時：（借）当座預金9,700万円（実際に入ってきた資金）／（貸）【　　　】9,700万円（負債：返済義務）。毎年利息：（借）【　　　】利息100万円（名目利息：1%×1億円）＋60万円（償却原価法分：差額の按分）／（貸）当座預金100万円（実際支払）＋【　　　】60万円（帳簿価額を増やす）。満期：（借）【　　　】1億円（負債消滅）／（貸）当座預金1億円（額面分を返済）。\nポイント：割引発行（額面より安く発行）→発行価額＜額面→差額を毎期【　　　】利息に加算し帳簿価額を額面に近づける（償却原価法）。試験では「年間【　　　】利息の計算（名目利息＋償却原価法分）」が必出。',
  'リース債務': 'ファイナンスリース契約の借手が計上する、リース料支払義務の現在価値に相当する負債科目を【　　　　　　】という。\n例）ファイナンスリース元本270万円（5年契約）：（借）リース資産270万円（資産を計上）／（貸）【　　　】270万円（返済義務を負債として計上）。毎年の支払60万円（元本54万円＋利息6万円）：（借）【　　　】54万円（負債が減る）・支払利息6万円（費用が増える）／（貸）現金60万円（支払い）。\nポイント：【　　　】はリース資産の「裏側の負債（資産と負債が対になっている）」。毎年元本部分だけ【　　　】が減少（利息は費用として別計上）。',
  '製品保証引当金': '販売済み製品の無償修理・交換など将来の保証費用を決算時に見積もり計上する引当金を【　　　　　　】という。\n例）当期売上100万円の製品について過去実績から2%（2万円）の無償修理が予想される（過去のデータから「100万円の売上のうち2万円分は後で無償で直すことになる」と見込む）。仕訳）引当金設定：（借）【　　　】繰入2万円（費用：今期の売上に対応する将来の修理費用を先取り）／（貸）【　　　】2万円（負債：将来の修理義務）。翌期実際に修理費1.5万円発生：（借）【　　　】1.5万円（引当金を使う：積み立てておいたお金でカバー）／（貸）現金1.5万円（実際の出費）（引当金を取り崩す）。\nポイント：引当金設定の4要件→①将来の特定の費用・損失（何のための引当金かが明確）、②発生が確実または確率高い（起こりそう）、③原因が当期（今期の活動が原因）、④金額を合理的に見積れる（いくら必要か計算できる）。4つ全てを満たす時だけ引当金を積む。',
  '退職給付引当金': '従業員の将来の退職給付支払義務のうち当期までに発生した分を見積もって積み立てる引当金を【　　　　　　】という。\n例）全従業員の退職給付債務（将来退職金の現在価値：将来払う退職金を今の価値に換算した合計）10億円・年金資産（運用積立：積み立てて運用中のお金）7億円→【　　　】3億円（B/S負債：まだ準備できていない退職金の義務）。当年度の退職給付費用500万円（①勤務費用300万円：今年1年働いた分の積上げ＋②利息コスト200万円：残存債務の利息分）。仕訳①費用計上：（借）退職給付費用500万円（費用）／（貸）【　　　】500万円（負債が増える）。仕訳②実際の退職金支払：（借）【　　　】XXX万円（積み立てた分を使う）／（貸）現金XXX万円（実際支払い）（引当金を取り崩す）。\nポイント：【　　　】＝退職給付債務－年金資産（積立済みを差し引いた未積立分）。年金資産（積立済み）は控除する（すでに備えている分は引く）。費用の2要素：①勤務費用（今年1年働いた分の積上げ）＋②利息費用（債務残高×割引率：時間の経過による利息分）。',
  '繰延税金負債': '将来の税負担増加額を先取り計上する負債科目を【　　　　　　】という。\n例）その他有価証券の評価益100万円→会計上は純資産増加（B/Sが増える）・税務は未課税（売るまで税金を払わなくてよい）（売却時に課税）。税率30%なら将来税負担30万円増加（売ったときにまとめて課税される）。仕訳）（借）その他有価証券評価差額金30万円（純資産内の評価差額から税効果相当を控除：実際に手取りになるのは70万円）／（貸）【　　　】30万円（将来の税負担をあらかじめ負債として計上）。将来売却・課税時：（借）【　　　】30万円（負債解消）／（貸）法人税等30万円（税負担を実現・実際に納税）。\nポイント：【　　　】は「将来の税負担の先取り（まだ払っていないが払わなければならない税金を先に計上）」。その他有価証券の評価益や「会計＜税務の費用（会計より税務で費用が少ない）」の場合に発生。繰延税金資産（将来の節税）と逆の効果をもつ。',
  '株式申込証拠金': '新株申込みを受けたが会社設立・増資の登記未完了の間に払込金を計上する負債科目を【　　　　　　】という。\n例）新株1,000株の申込みを受け、払込金1,000万円を別段預金（通常の口座と分けた特別な口座）で受入：（借）別段預金1,000万円（資産として計上）／（貸）【　　　】1,000万円（株式がまだ発行されていないので負債として計上）。登記完了後（会社設立や増資の手続きが正式に終わった後）：（借）【　　　】1,000万円（負債を取り崩す）／（貸）資本金500万円（純資産が増える）・資本準備金500万円（純資産が増える）。\nポイント：払込みを受けたが会社設立・増資の登記完了前は【　　　】（負債）として計上。登記後に資本金・資本準備金へ振替。',
  '工事未払金': '建設業で工事にかかる外注費・材料費等の未払い義務を計上する負債科目を【　　　　　　】という。\n例）建設業で外注業者（工事の一部を委託した会社）への工事代金3,000万円が未払：（借）工事原価3,000万円（費用が増える）／（貸）【　　　】3,000万円（後で払う義務が増える）。翌月支払：（借）【　　　】3,000万円（義務がなくなる）／（貸）普通預金3,000万円（預金が減る）。\nポイント：建設業特有の科目（一般事業の「買掛金」に相当：工事にかかる費用の後払い）。工事に関係しない通常の仕入は買掛金または未払金を使う。',
  '営業外電子記録債務': '営業取引以外から生じた電子記録の支払義務を計上する負債科目を【　　　　　　】という。\n例）固定資産（機械等）の購入代金を電子記録で支払義務登録（商品の仕入ではなく固定資産購入の代金）：（借）固定資産（資産が増える）／（貸）【　　　】（電子記録された営業外の支払義務）。支払期日に自動引落し：（借）【　　　】（義務がなくなる）／（貸）当座預金（当座預金が減る）。\nポイント：商品の仕入→電子記録債務（本業の仕入に関係）。固定資産等の購入→【　　　】（本業以外の取引に関係）。',
  '営業外支払手形': '商品売買以外の取引で振り出した手形による支払義務を計上する負債科目を【　　　　　　】という。\n例）固定資産の購入代金を手形で支払（商品の仕入ではなく固定資産を購入した代金）：（借）固定資産100万円（資産が増える）／（貸）【　　　】100万円（手形という支払義務が増える）。満期日に決済：（借）【　　　】100万円（義務がなくなる）／（貸）当座預金100万円（当座預金が減る）。\nポイント：商品の仕入対価の手形→支払手形（本業の仕入に関係）。固定資産等の購入代金の手形→【　　　】（本業以外の取引に関係）。',
  '諸負債': '複数の負債科目をまとめて一括表示するために用いる便宜的な科目を【　　　　　　】という。\n例）連結精算表等で複数の負債をまとめて表示する際に「【　　　】」と一括表示する便宜的な表記（個々の科目を列挙せずにまとめて書く方法）。個別科目が確定している場合は使わない。\nポイント：試験では「複数の負債科目をまとめて仕訳に記載する便宜的な科目名」として出題（買掛金・借入金等をまとめて「【　　　】」と書く）。実務では使わない。',
  '仕入': '三分法で商品を仕入・販売する費用科目を【　　　　　　】という。\n例）【　　　】先から商品100万円を掛けで購入（後払いで買う）：（借）【　　　】100万円（費用が増える）／（貸）買掛金100万円（後で払う義務）。期末決算整理（しくりくりし）：①（借）【　　　】XX（期首商品を費用に含める）／（貸）繰越商品XX（前期の在庫を取り崩す）、②（借）繰越商品YY（期末在庫を次期へ繰り越す）／（貸）【　　　】YY（期末在庫分を費用から除く）。\nポイント：「しくりくりし」（【　　　】に繰越商品を加えて繰越商品を【　　　】から引く）で売上原価を計算。',
  '支払家賃': '事務所・店舗・倉庫等を賃借して支払う賃借料を計上する費用科目を【　　　　　　】という。\n例）事務所家賃を毎月10万円支払（毎月定額で借りている料金）：（借）【　　　】10万円（費用が増える）／（貸）現金10万円（現金が減る）。1年分120万円を前払い（10月決算）→翌11月〜9月分100万円は前払費用（まだサービスを受けていない期間の分）へ：（借）前払費用100万円（資産として振替）／（貸）【　　　】100万円（今期分から除く）。\nポイント：前払い部分は資産（前払費用：将来のサービス代金の前払い）。翌期の賃料は翌期の費用（発生主義）。',
  '支払手数料': '例）仕入商品の振込手数料550円（銀行に払う振込の手数料）：（借）支払手数料550円（費用が増える）／（貸）現金550円（現金が減る）。不動産仲介で事務所を借りた際の手数料30万円：（借）支払手数料30万円（費用が増える）／（貸）普通預金30万円（預金が減る）。ポイント：銀行手数料・弁護士報酬・仲介手数料など外部サービスへの支払いを広く計上する費用科目を【　　　　　　】という。',
  '支払利息': '借入金・社債等に対して支払う利息を計上する営業外費用科目を【　　　　　　】という。\n例）借入金1,000万円・年利2%→年間利息20万円（1,000万円×2%＝借りたお金に対して払う利用料）：（借）【　　　】20万円（費用が増える）／（貸）普通預金20万円（預金が減る）。期末に2か月分未払い3.3万円（まだ払っていない利息）：（借）【　　　】3.3万円（費用を見越し計上）／（貸）未払利息3.3万円（負債として計上）。\nポイント：元本の返済は費用ではない（借入金という負債が減るだけ）。利息の支払いのみが【　　　】（費用）。',
  '支払保険料': '火災保険・損害保険等の保険料を計上する費用科目を【　　　　　　】という。\n例）4月1日に1年分の火災保険料12万円を支払（3月決算：全額当期内）：（借）【　　　】12万円（費用が増える）／（貸）現金12万円（現金が減る）。10月払いなら翌4〜9月分6万円を繰延べ（まだサービスを受けていない将来の期間の分）：（借）前払費用6万円（資産として振替）／（貸）【　　　】6万円（今期分から除く）。\nポイント：翌期にまたがる分→前払費用（資産）へ繰延べ（将来のサービス代の前払い）。翌期首に再振替が必要（資産→費用に戻す）。',
  '租税公課': '固定資産税・印紙税等の税金と公的な賦課金を計上する販管費科目を【　　　　　　】という。\n例）固定資産税10万円を支払（土地・建物に毎年かかる税金）：（借）【　　　】10万円（費用が増える）／（貸）現金10万円（現金が減る）。収入印紙200円を購入（契約書等に貼る国の証紙）：（借）【　　　】200円（費用が増える）／（貸）現金200円（現金が減る）。\nポイント：固定資産税・印紙税・事業所税など（利益に関係なく支払う税金や公的な賦課金）。法人税等（所得課税：利益に対してかかる税）とは別科目。消費税（税込処理の場合）も【　　　】に計上する。',
  '広告宣伝費': 'テレビ・新聞・ウェブ広告等不特定多数向けの宣伝費を計上する販管費科目を【　　　　　　】という。\n例）SNS広告費50万円（不特定多数のユーザーに表示される広告）・折込チラシ印刷代20万円（新聞折り込みで配布する広告）：（借）【　　　】70万円（費用が増える）／（貸）普通預金70万円（預金が減る）。\nポイント：不特定多数への宣伝→【　　　】（誰でも見られる広告）。特定取引先の接待→交際費（特定の相手との関係維持費）。',
  '通信費': 'インターネット料金・郵便料金・電話代等を計上する費用科目を【　　　　　　】という。\n例）電話代3万円（事業で使う電話・スマホ代）・切手購入1万円（うち5,000円未使用）：（借）【　　　】3万5,000円（費用が増える）／（貸）普通預金3万5,000円（預金が減る）。期末に未使用切手5,000円（まだ使っていない切手はサービスを受けていない）：（借）貯蔵品5,000円（資産として振替）／（貸）【　　　】5,000円（費用から除く）。\nポイント：切手・収入印紙の期末未使用分は貯蔵品（資産）へ振替（まだ使っていないので費用にしない）。',
  '旅費交通費': '出張時の交通費（電車・タクシー等）・宿泊費・日当等を計上する費用科目を【　　　　　　】という。\n例）出張で仮払金2万円を前渡し（目的不明の段階で渡しておく）。実際支出は交通費1万円・宿泊費1.5万円＝2.5万円（仮払い2万円より5,000円多かった）：（借）【　　　】2.5万円（実際の費用）／（貸）仮払金2万円（仮勘定を取り消す）・現金5,000円（追加精算：不足分を精算）。\nポイント：仮払金があれば精算時に【　　　】へ振替（目的確定→正式な費用科目へ）。',
  '修繕費': '建物・設備等の原状回復・維持のための修理費を計上する費用科目を【　　　　　　】という。\n例）雨漏り修理（原状回復：元の状態に戻すだけ）に30万円：（借）【　　　】30万円（費用が増える）／（貸）現金30万円（現金が減る）。大規模な屋根全面改修で耐用年数延長（価値が上がる）→資本的支出100万円（費用でなく固定資産に計上）：（借）建物100万円（資産が増える）／（貸）現金100万円（費用化しない）。\nポイント：「元に戻す修理」→【　　　】（費用：修理しただけで価値は増えない）。「価値を高める改修」→資本的支出（固定資産：価値が増えた分は資産に計上）。この区別が頻出。',
  '貸倒損失': '売掛金等の債権が回収不能と確定した際の損失を計上する費用科目を【　　　　　　】という。\n例）売掛金100万円（まだ代金をもらっていない未回収の金額）の取引先が破産し回収不能確定（もう払ってもらえないことが確定した）。引当金60万円積立済み（事前に損失に備えて積んでいた準備金）：（借）貸倒引当金60万円（引当金を取り崩す）・【　　　】40万円（引当金で賄えなかった残りの損失）／（貸）売掛金100万円（売掛金がなくなる）。\nポイント：貸倒引当金があれば先に取崩し（準備していたクッションを使う）、超過分のみ【　　　】（費用）。',
  '貸倒引当金繰入': '決算時に債権の回収懸念に備えて引当金を設定する際の費用科目を【　　　　　　】という。\n例）期末売掛金1,000万円（まだ代金をもらっていない未回収の合計）×貸倒実績率2%（過去のデータから計算した「返ってこない」確率）→引当金20万円必要。現残高8万円（すでに積んである引当金）→差額12万円を追加設定：（借）【　　　】12万円（費用が増える）／（貸）貸倒引当金12万円（将来の損失に備えた準備金を積む）。\nポイント：【　　　】は費用（P/L）、貸倒引当金は評価勘定（B/Sで売掛金から控除）。期末に見積りで設定する費用であり実際の損失ではない（まだ貸し倒れていないが将来に備える）。',
  '減価償却費': '固定資産の取得原価を耐用年数にわたり費用配分する科目を【　　　　　　】という。\n例）パソコン（取得原価20万円・耐用年数4年・定額法）：毎年5万円の【　　　】（20万円÷4年＝毎年5万円ずつ価値が減る）。間接法：（借）【　　　】5万円（費用が増える）／（貸）備品減価償却累計額5万円（累計額に加算）。直接法：（借）【　　　】5万円（費用が増える）／（貸）備品5万円（資産を直接減らす）。\nポイント：現金は出ない「非現金費用（お金の移動はないのに費用になる特殊な費用）」だが費用として利益を減少させる。間接法→減価償却累計額を使う（固定資産の帳簿価額は取得原価のまま残る）。直接法→固定資産を直接減額（帳簿価額がそのまま下がる）。',
  '発送費': '商品を顧客に届ける際の当社負担の配送・運送費を計上する費用科目を【　　　　　　】という。\n例）商品を顧客に発送・送料1,500円（当社負担：当社が運送会社に払う料金）：（借）【　　　】1,500円（費用が増える）／（貸）現金1,500円（現金が減る）。顧客負担の着払い（顧客が受け取り時に払う方式）なら【　　　】は計上しない（当社の費用ではないから）。\nポイント：売り主（当社）が負担する配送料→【　　　】（費用）。顧客負担→顧客の費用なので計上しない。',
  '雑損': '偶発的な損失や金額が少額で他の科目に当てはまらない費用を計上する科目を【　　　　　　】という。\n例）現金が帳簿より3,000円少なく原因不明のまま期末を迎えた（なぜ減ったのか最後まで分からなかった）：（借）【　　　】3,000円（損失として費用計上）／（貸）現金過不足3,000円（仮勘定を取り消す）。\nポイント：現金過不足（不足）が期末まで原因不明→【　　　】（費用）へ振替。原因が判明すれば正式な費用科目（旅費交通費等）へ振替。現金過不足の超過（帳簿より実際が多い）→雑益（収益）。',
  '法定福利費': '法律で義務付けられた社会保険料の会社負担分等を計上する費用科目を【　　　　　　】という。\n例）社会保険料の会社負担分（健康保険・厚生年金・雇用保険等：法律で会社にも負担義務がある保険料）を支払：（借）【　　　】30万円（費用が増える）／（貸）現金30万円（現金が減る）（＋同時に社会保険預り金で従業員負担分を給料から天引き）。\nポイント：社会保険料の会社負担分→【　　　】（法律で定められた福利厚生の費用）。従業員負担分→給料から天引き→社会保険預り金（負債）。',
  '給料': '従業員への給与（基本給・手当等）を計上する費用科目を【　　　　　　】という。\n例）社員【　　　】30万円（源泉税3万円・社会保険料天引き2万円）→手取り25万円（実際に渡す金額）を支払：（借）【　　　】30万円（総支給額で費用計上）／（貸）現金25万円（手取り分を支払）・所得税預り金3万円（税金を預かる）・社会保険預り金2万円（社保を預かる）。\nポイント：【　　　】は「額面（総支給額：全部の【　　　】）」で費用計上（手取りではなく総額で記録）。各種控除額は預り金（負債）に計上（後で税務署・年金事務所へ納付するお金）。',
  '法人税等': '法人税・住民税（地方税）・事業税の3つを合計して計上する税金科目を【　　　　　　】という。\n例）期末の法人税・住民税・事業税の合計確定額300万円（1年間の利益に対して支払う税金の合計）。中間申告・仮払済み120万円（年度途中に先払いした分）：（借）【　　　】300万円（費用として確定額を計上）／（貸）仮払【　　　】120万円（仮払いを取り崩す）・未払【　　　】180万円（残りを負債として計上）。\nポイント：【　　　】は損益計算書の最後に計上（他の費用と異なる位置：当期純利益の直前）。消費税（間接税：物の売買にかかる税）とは別。',
  '固定資産売却損': '固定資産の売却で生じた損失（売却価格が帳簿価額を下回る部分）を計上する費用科目を【　　　　　　】という。\n例）帳簿価額80万円（取得200万円－累計120万円：今の帳簿上の価値）の機械を60万円で売却（売値が帳簿価額より低かった）：（借）現金60万円（売却代金が入る）・【　　　】20万円（80万円－60万円＝20万円の損失）・減価償却累計額120万円（累計額を取り崩す）／（貸）機械装置200万円（取得原価で資産を消す）。\nポイント：売却価格＜帳簿価額→【　　　】（費用：損をした）。売却価格＞帳簿価額→固定資産売却益（収益：得をした）。',
  '消耗品費': '10万円未満・耐用年数1年未満の小物備品等を購入時に費用計上する科目を【　　　　　　】という。\n例）ボールペン・ノート等の事務用品1万円を購入・すぐ使用（購入即使用なので全額費用化）：（借）【　　　】1万円（費用が増える）／（貸）現金1万円（現金が減る：即時費用化）。期末に未使用分3,000円が残る場合は貯蔵品（資産：まだ使っていないので費用にしない）へ振替：（借）貯蔵品3,000円（資産として振替）／（貸）【　　　】3,000円（費用から除く）。\nポイント：購入時に即費用化→【　　　】。期末残存分は貯蔵品（資産）に振替。',
  '手形売却損': '受取手形を満期前に銀行で割り引いた際の割引料・手数料を計上する費用科目を【　　　　　　】という。\n例）受取手形50万円を満期前に銀行で割り引き（手形を満期日より前に銀行に売って現金化すること）。手数料・割引料5,000円差引き49.5万円を受取：（借）当座預金49.5万円（実際に受け取る金額）・【　　　】5,000円（差し引かれた費用）／（貸）受取手形50万円（手形がなくなる）。\nポイント：手形の割引（手形を満期前に銀行に売ること）で生じる割引料・手数料が【　　　】（費用）。早く現金化できるが手数料分だけ損をする。',
  '売上原価': '販売した商品・製品の仕入原価の合計を【　　　　　　】という。\n例）三分法：【　　　】＝期首繰越商品50万円（昨年末の在庫）＋当期仕入250万円（今年仕入れた商品）－期末繰越商品30万円（今年末の在庫）＝270万円（実際に売れた商品のコスト）。売上300万円－【　　　】270万円＝売上総利益30万円（粗利）。\nポイント：「売れた商品の仕入原価の合計」（売った商品にかかったコストの合算）。三分法では決算整理で確定。【　　　】対立法では販売のたびに確定（仕入れた日から確定）。',
  '棚卸減耗損': '帳簿数量と実際数量の差（数量不足）に取得原価を乗じて計上する費用を【　　　　　　】という。\n例）帳簿在庫100個・実地棚卸95個→5個が不足（盗難・紛失・自然損耗等による）。原価1,000円/個→【　　　】5,000円（5個×1,000円）：（借）【　　　】5,000円 ／（貸）繰越商品5,000円（帳簿上の在庫を実数に合わせる）。\nポイント：【　　　】＝「数量の差（紛失・盗難・自然損耗による数量不足の損失）」。商品評価損＝「単価の差（時価が下落したことによる価格の損失）」。この区別が重要（原因が違う）。',
  '商品評価損': '期末棚卸で商品の正味売却価額が取得原価を下回った場合の評価差額を費用処理する科目を【　　　　　　】という。\n例）商品（原価1,000円/個×100個）の正味売却価額（今の市場価格から処分費用を引いた実際に売れる価格）が800円/個に下落→評価損2万円（1,000円－800円）×100個：（借）【　　　】2万円（価格下落分を費用計上）／（貸）繰越商品2万円（在庫の帳簿価額を下げる）。\nポイント：【　　　】は「価格の差（時価下落）」（低価法の適用：帳簿価額か時価かの低い方で評価する原則）。棚卸減耗損は「数量の差（数が減った）」。この区別が重要。',
  '有価証券評価損': '有価証券の期末評価替えで時価が帳簿価額を下回った差額を計上する費用科目を【　　　　　　】という。\n例）売買目的の株式（帳簿価額1,000円：購入時の価格）が期末時価800円（今の市場価格）に下落：（借）【　　　】200円（下落分を費用として計上）／（貸）売買目的有価証券200円（資産の帳簿価額を時価に下げる）。\nポイント：売買目的有価証券→時価評価・評価差額はP/L（評価損＝費用として利益が減る、評価益＝収益として利益が増える）。その他有価証券→評価差額はB/S純資産（損益に影響しない）。',
  '有価証券売却損': '有価証券を売却した際に帳簿価額を下回った損失を計上する費用科目を【　　　　　　】という。\n例）帳簿価額1,000円（購入時の価格）の株式を800円（売ったときの価格）で売却：（借）現金800円（受け取った代金）・【　　　】200円（1,000円－800円＝損失）／（貸）売買目的有価証券1,000円（資産がなくなる）。\nポイント：売却損（売却価格＜帳簿価額）→費用（損をした）。売却益（売却価格＞帳簿価額）→収益（得をした）。評価損は時価評価で認識（まだ売っていない段階）、売却損は実際売却時に確定（売った時点で確定）。',
  '電子記録債権売却損': '電子記録債権を満期前に売却した際の割引料・手数料を計上する費用科目を【　　　　　　】という。\n例）電子記録債権50万円を満期前に売却（ファクタリング等：債権を売って早期に現金化すること）。売却手数料1万円：（借）普通預金49万円（受け取った金額）・【　　　】1万円（手数料の費用）／（貸）電子記録債権50万円（債権がなくなる）。\nポイント：手形割引の電子記録版（手形割引と同じ仕組みで電子記録債権を売る）。早く現金化できるが手数料分だけ損をする。',
  '債権売却損': '売掛金等の債権を額面以下で売却した際の損失を計上する費用科目を【　　　　　　】という。\n例）売掛金100万円（まだ回収できていない代金）を90万円でファクタリング（債権を買い取ってもらって早期に現金化）：（借）現金90万円（受け取った金額）・【　　　】10万円（100万円－90万円＝損失）／（貸）売掛金100万円（債権がなくなる）。\nポイント：ファクタリング＝売掛金等の債権を売却して早期に資金化する手法（手数料分だけ損をするが今すぐ現金になる）。売却時の損失が【　　　】（費用）。',
  '社債利息': '社債の名目利息＋割引発行時の償却額を合計して計上する費用科目を【　　　　　　】という。\n例）額面1億円・クーポン1%（年間の約束した利息率）の社債→毎期名目利息100万円（1億円×1%）：（借）【　　　】100万円（費用が増える）／（貸）現金100万円（現金が減る）。割引発行（額面より安く発行した場合）の場合は償却原価法分も追加（額面との差を毎期利息に上乗せ）：（借）【　　　】160万円（費用が増える：名目100万円＋償却60万円）／（貸）現金100万円（利息支払い）・社債60万円（帳簿価額が額面に近づく）。\nポイント：【　　　】は「支払利息」とは別の科目（社債専用の利息科目）。',
  'のれん償却': '買収等で生じたのれんを定額法で毎期費用化する科目を【　　　　　　】という。\n例）のれん2,000万円（企業買収で純資産より多く払った差額：ブランドや顧客基盤への対価）（5年均等償却）：毎年（借）【　　　】400万円（費用が増える）／（貸）のれん400万円（資産を直接減らす）。20年以内に完全償却が必要。\nポイント：のれんは減価償却ではなく「償却」と呼ぶ（無形固定資産のため累計額勘定を使わず直接法：資産を直接減額する）。会計基準上のれんは毎期均等償却が必要（任意の期間・金額は不可）。',
  '退職給付費用': '将来の退職金支払に備えて毎期見積もり計上する費用科目を【　　　　　　】という。\n例）当期の【　　　】（勤務費用：当期の働きに対応する退職金の増加額＋利息費用：時間の経過による退職給付引当金の増加）100万円を計上：（借）【　　　】100万円（費用が増える）／（貸）退職給付引当金100万円（将来の退職金支払いに備えた負債を積む）。\nポイント：毎期の積立相当額を費用計上→退職給付引当金（負債）が積み上がる。実際退職時に引当金を取崩して退職金を支払う仕組み（事前準備として費用を分散計上）。',
  '製品保証引当金繰入': '製品の無償修理・交換保証のために引当金を設定する際の費用科目を【　　　　　　】という。\n例）当期売上1億円・保証修理費率2%（過去の実績から2%は無償修理が必要になると予想）→引当金200万円設定：（借）【　　　】200万円（費用が増える：今期の売上に対応する修理費を先取りして計上）／（貸）製品保証引当金200万円（将来の修理費に備えた負債を積む）。\nポイント：【　　　】（費用）→P/L（損益計算書で費用として表示）、製品保証引当金（負債）→B/S（貸借対照表で負債として表示）。将来の修理費用を当期に先取りして費用計上する。',
  '法人税・住民税及び事業税': '法人税・法人住民税・法人事業税の合計額を計上する税金科目を【　　　　　　】という。\n例）当期純利益1,000万円に対する税金：法人税200万円（国に払う法人税）・住民税50万円（都道府県・市区町村に払う法人税の地方版）・事業税50万円（事業の規模に応じた地方税）＝合計300万円：（借）【　　　】300万円（費用として計上）／（貸）仮払法人税等120万円（仮払いを取り崩す）・未払法人税等180万円（残りを負債として計上）。\nポイント：「法人税等」よりも正式な科目名（損益計算書の表示科目名）。3種類の税金を合算して1行で表示。',
  '火災損失': '火災等の偶発的事故で固定資産等が損失した場合に計上する費用科目を【　　　　　　】という。\n例）帳簿価額500万円（取得原価から減価償却した後の残りの価値）の建物が火災で焼失（保険未加入：保険金が入らない）：（借）【　　　】500万円（損失を費用として計上）／（貸）建物500万円（帳簿価額全額が損失：資産がなくなる）。保険金600万円確定の場合は未決算（仮勘定）を経由して処理。\nポイント：【　　　】は特別損失（P/Lの下の方に計上：突発的な損失なので通常の損益とは区別）。自然災害・事故による固定資産の損失に使用。',
  '固定資産除却損': '固定資産を廃棄・除却した際に生じる損失を計上する費用科目を【　　　　　　】という。\n例）帳簿価額30万円（取得100万円－累計70万円）の備品を廃棄し処分費1万円支払（廃棄業者への費用）：（借）【　　　】31万円（帳簿価額30万円＋処分費1万円＝合計の損失）・減価償却累計額70万円（累計額を取り崩す）／（貸）備品100万円（取得原価で資産を消す）・現金1万円（処分費を支払う）。\nポイント：除却（廃棄・廃棄処分すること）＝帳簿価額＋処分費が除却損。売却時は「固定資産売却損」（お金をもらえる）。',
  '固定資産廃棄損': '固定資産を廃棄処分した際の帳簿価額（未償却残高）相当の損失を計上する費用科目を【　　　　　　】という。\n例）耐用年数経過後の機械（帳簿価額10万円残存：まだ帳簿上に残っている価値）を廃棄：（借）【　　　】10万円（損失として費用計上）・減価償却累計額（累計額を取り崩す）／（貸）機械装置（資産がなくなる）。\nポイント：除却損・廃棄損はほぼ同義で使われる（廃棄したときの帳簿価額の損失）。廃棄時に残っている帳簿価額が損失（もう使えないのに帳簿に残っていた分）。',
  '工事原価': '建設業で完成・引渡した工事にかかった費用の合計を計上する原価科目を【　　　　　　】という。\n例）完成引渡しした工事の材料費1,500万円（工事で使った材料）＋労務費1,000万円（工事に携わった作業員の賃金）＋外注費1,200万円（一部を下請けに委託した費用）＝【　　　】3,700万円：（借）【　　　】3,700万円（費用が増える）／（貸）材料・賃金・外注費等3,700万円（各費用を集計）。工事収益5,000万円から差引→完成工事総利益1,300万円（工事で稼いだ粗利益）。\nポイント：建設業の「売上原価」相当科目（一般企業の売上原価＝建設業の【　　　】）。',
  '売上': '商品・製品の販売による主たる営業収益（本業の売り上げ）を計上する科目を【　　　　　　】という。\n例）商品400万円（原価280万円・販売価格400万円）を現金で販売：（借）現金400万円（現金という資産が増える）／（貸）【　　　】400万円（収益が増える）。5万円返品（売った商品が戻ってきた）：（借）【　　　】5万円（収益を取り消す）／（貸）現金5万円（現金を返す）。【　　　】400万円－【　　　】原価280万円（仕入れにかかったコスト）＝【　　　】総利益120万円（粗利：本業の稼ぎ）。\nポイント：返品・値引きは【　　　】の減少（マイナス）として処理。',
  '受取家賃': '不動産等を貸し付けて受け取る賃料収入を計上する収益科目を【　　　　　　】という。\n例）テナント物件（所有する建物の一室）を月10万円で賃貸：（借）現金10万円（現金が増える）／（貸）【　　　】10万円（収益が増える）。前受け分（まだサービスを提供していない先払い家賃）は前受収益（負債）へ繰延べ（次期の収益として先送り）。\nポイント：本業（不動産賃貸業）なら売上、副業的（本業以外の賃貸）なら営業外収益に計上。支払家賃（費用）の逆側。',
  '受取手数料': '仲介・代理等のサービス提供の対価として受け取る手数料収入を計上する科目を【　　　　　　】という。\n例）不動産仲介（売主・買主の間を取り持つ）で30万円の手数料受取：（借）現金30万円（現金が増える）／（貸）【　　　】30万円（収益が増える）。\nポイント：本業の手数料収入（不動産業・証券業など）→売上（または【　　　】）として計上。副業的なら営業外収益に計上。支払手数料（費用：手数料を支払う側）の逆側。',
  '受取利息': '貸付金・預金等で受け取る利息収入を計上する営業外収益科目を【　　　　　　】という。\n例）貸付金1,000万円（他社に貸したお金）・年利2%（年間の利率）→年間利息20万円（1,000万円×2%）：（借）普通預金20万円（預金に利息が振り込まれる）／（貸）【　　　】20万円（収益が増える）。期末未収2か月分3.3万円（まだ受け取っていない利息）：（借）未収利息3.3万円（もらえる権利を資産として計上）／（貸）【　　　】3.3万円（収益に計上）。\nポイント：普通預金に入る銀行利息もすべて【　　　】。支払利息（借りたお金の利息を払う費用）の逆側。',
  '固定資産売却益': '固定資産の売却で帳簿価額を超えた部分を計上する収益科目を【　　　　　　】という。\n例）帳簿価額80万円（取得原価200万円－累計償却額120万円＝まだ残っている価値）の機械を100万円で売却：（借）現金100万円（売却代金を受け取る）・減価償却累計額120万円（これまで積み上げた償却額を消す）／（貸）機械200万円（資産を帳簿から消す）・【　　　】20万円（100万円－80万円＝20万円の儲け）。\nポイント：売却価格＞帳簿価額→【　　　】（収益：想定より高く売れた）。売却価格＜帳簿価額→固定資産売却損（費用：帳簿価額より安くしか売れなかった）。',
  '受取配当金': '保有株式から受け取る配当金収入を計上する営業外収益科目を【　　　　　　】という。\n例）保有株式100株（A社の株を100株持っている）・配当1株50円（1株当たり50円の配当）：（借）普通預金5,000円（配当金が口座に振り込まれる）／（貸）【　　　】5,000円（収益が増える）。\nポイント：株式投資の配当収入→【　　　】。債券（社債・国債など）の利息→有価証券利息または受取利息。',
  '償却債権取立益': '過去に貸倒処理した債権を後日一部でも回収した際に計上する収益科目を【　　　　　　】という。\n例）2年前に「もう回収できない」と判断して貸倒損失処理（帳簿から消した）した売掛金10万円のうち3万円が予想外に回収できた：（借）現金3万円（現金が入ってきた）／（貸）【　　　】3万円（一度なくなったと思ったものが戻ってきた収益）。\nポイント：一度費用（損失）処理して帳簿から消した債権が回収された→その分を収益認識（棚ぼた的な収益）。通常の売掛金回収（帳簿にある売掛金を現金に変える）とは異なる科目。',
  '雑益': '偶発的・少額で他の科目に当てはまらない収益を計上する営業外収益科目を【　　　　　　】という。\n例）帳簿より現金が2,000円多く原因不明→期末（原因が分からないまま決算になった）：（借）現金過不足2,000円（現金過不足という一時的な仮の科目を消す）／（貸）【　　　】2,000円（収益として処理）。不用品売却200円（使わなくなった備品を捨て値で売った）→【　　　】。\nポイント：現金過不足（超過）が期末まで原因不明→【　　　】へ（よかった扱いで収益）。雑損（原因不明のお金の不足→費用）の逆側。',
  '有価証券売却益': '有価証券を帳簿価額より高く売却した際の差額を計上する収益科目を【　　　　　　】という。\n例）帳簿価額1,000円（買ったときの値段）の売買目的株式（短期売買目的で保有する株）を1,200円（実際に売った値段）で売却：（借）現金1,200円（売却代金が入る）／（貸）売買目的有価証券1,000円（帳簿から消す）・【　　　】200円（1,200円－1,000円＝200円の儲け）。\nポイント：実際に売った時点で確定する売却益（現金が入った確実な利益）。評価益（まだ売っていない段階の含み益：帳簿上の利益）とは異なる。',
  '有価証券評価益': '売買目的有価証券の期末時価が帳簿価額を上回った評価差額を計上する収益科目を【　　　　　　】という。\n例）売買目的株式（短期売買目的で保有する株・帳簿価額1,000円）が期末時価1,200円（決算日の市場価格）：（借）売買目的有価証券200円（含み益分だけ帳簿価額を上げる）／（貸）【　　　】200円（P/L：損益計算書に収益として計上）。\nポイント：売買目的有価証券のみ評価差額をP/Lへ計上（評価益→収益に載せる）。その他有価証券（持合いなど）の評価差額→純資産直入（P/L経由しない・損益に影響させない）。',
  '有価証券利息': '社債・国債等の利付債券を保有して受け取る利息収入を計上する収益科目を【　　　　　　】という。\n例）社債（企業が借金のために発行する債券・額面100万円・年利1.5%）保有→年間利息1.5万円（100万円×1.5%）：（借）普通預金1.5万円（利息が口座に入る）／（貸）【　　　】1.5万円（収益が増える）。\nポイント：株式配当（株主として受け取る配当）→受取配当金。債券利息（社債・国債など債券の利息）→【　　　】（または受取利息）。',
  '工事収益': '建設・工事請負業において工事の進捗度または完成引渡し時点に応じて認識する収益科目を【　　　　　　】という。\n例）総請負価格1億円・2年間の工事（大型建設プロジェクト）。1年目の進捗度40%（原価進捗法：実際にかかった原価÷見込み総原価で計算）→【　　　】4,000万円を計上（1億円×40%：できた分だけ収益）。2年目完成・引渡し→残り6,000万円を計上（全部終わったので残りを認識）。仕訳）1年目：（借）工事未収入金4,000万円（まだもらっていない代金）／（貸）【　　　】4,000万円（進捗分の収益）。同時に（借）工事原価XX万円（費用）／（貸）仕掛品XX万円（原価も進捗度按分で同時に計上）。\nポイント：収益認識基準では原則「進捗度基準（一定期間にわたる充足：少しずつ認識）」を採用。進捗度に応じて毎期収益を計上する（完成を待たずに少しずつ計上）。完成基準（工事完成引渡し時に一括計上：全部終わってから認識）との違いを押さえる。',
  '資本金': '株主からの出資額のうち登記上の資本として計上する純資産科目を【　　　　　　】という。\n例）創業時（会社を設立するとき）に株主から1,000万円払込み（出資してもらった）、500万円を【　　　】に登記（会社法上の正式な資本として登録）・500万円を資本準備金（【　　　】に入れない分）：（借）別段預金1,000万円（払込金を一時的に別の口座で受け取る）／（貸）【　　　】500万円・資本準備金500万円。\nポイント：払込額の2分の1以上を【　　　】に計上する義務（残りは資本準備金として積み立て可能）。【　　　】は容易に減少させられない（会社の信用の基盤・取引先への信頼の証）。',
  '繰越利益剰余金': '当期純利益の累計から配当・積立等を差引いた純資産の蓄積残高を計上する科目を【　　　　　　】という。\n例）期末純利益100万円（今期1年間で稼いだ最終的な利益）→（借）損益100万円（損益勘定という集計口座を閉じる）／（貸）【　　　】100万円（蓄積残高に加算）。配当80万円・利益準備金8万円決議（株主総会で配当することを決めた）：（借）【　　　】88万円（蓄積残高を取り崩す）／（貸）未払配当金80万円（後で払う義務）・利益準備金8万円（法律で強制積立）。\nポイント：「稼いだ利益の蓄積」から配当等を差引いた残高（会社の内部留保）。配当の原資（配当はここから払う）。',
  '利益準備金': '配当時に会社法の規定に基づき強制積立する法定準備金を計上する純資産科目を【　　　　　　】という。\n例）資本金1,000万円（会社の登記上の資本）・配当100万円決議→最低10万円（100万円×1/10：配当額の10%以上）の積立義務（資本準備金と合計が250万円＝資本金の1/4になるまで）：（借）繰越利益剰余金10万円（利益の蓄積から取り崩す）／（貸）【　　　】10万円（法定準備金として積み立てる）。\nポイント：資本金の1/4に達するまで配当のたびに配当額の1/10以上を強制積立（法定準備金：会社法で義務づけられた積立）。任意積立金（別途積立金等：自分たちの意思で積み立てる）とは区別する。',
  '資本準備金': '株式発行時の払込額のうち資本金に計上しなかった部分を積立する法定準備金科目を【　　　　　　】という。\n例）増資（株式を追加発行して資金を集める）で払込1,000万円・500万円を資本金・500万円を【　　　】（資本金にしなかった半分）：（借）当座預金1,000万円（払込金が口座に入る）／（貸）資本金500万円・【　　　】500万円。\nポイント：株式発行時の払込のうち資本金にしなかった部分が【　　　】（法定準備金：会社法で義務づけられた積立）。利益準備金（利益から積み立てる）とは異なる（資本取引＝株式発行・増資から生じる）。',
  '別途積立金': '株主総会の決議により任意に積み立てる利益剰余金の一部を計上する科目を【　　　　　　】という。\n例）株主総会決議（株主全員が集まって承認した）で当期利益の一部50万円を将来の設備投資（機械・工場などへの投資）に備えて積立：（借）繰越利益剰余金50万円（利益の蓄積から取り崩す）／（貸）【　　　】50万円（将来の目的のために取り分けておく）。後日取崩し（積み立てたお金を使うとき）：（借）【　　　】50万円（目的の積立金を戻す）／（貸）繰越利益剰余金50万円（利益剰余金に戻る）。\nポイント：【　　　】は任意積立金（株主総会の決議があれば自由に積立・取崩し可能）。利益準備金・資本準備金（法定準備金：会社法で強制）とは異なる。',
  'その他資本剰余金': '資本取引から生じた資本準備金以外の剰余金を計上する純資産科目を【　　　　　　】という。\n例）自己株式（一度買い戻した自社の株）を帳簿価額より高く売却した場合の差益→【　　　】（収益にしない：資本取引だから）：（借）現金130万円（売却代金が入る）／（貸）自己株式100万円（帳簿価額で消す）・【　　　】30万円（差益は純資産の増加）。\nポイント：資本取引（株式の発行・自己株式等：お金を出資してもらう取引）から生じた剰余金で資本準備金以外のもの。利益剰余金（繰越利益剰余金等：商売で稼いだ利益の蓄積）とは別の純資産区分。',
  '自己株式': '発行済株式のうち会社が買い戻して保有している自社株で純資産のマイナス項目として計上される科目を【　　　　　　】という。\n例）自社株100万円分を買い戻し（市場で自分の会社の株を買い戻す）。仕訳①取得：（借）【　　　】100万円（純資産がマイナスになる：株主への払い戻しと同じ効果）／（貸）現金100万円（現金が出ていく）。仕訳②消却（株式を正式に消す）：（借）その他資本剰余金100万円（資本を減らす）／（貸）【　　　】100万円（資産がゼロになる）。仕訳③再売却（120万円で売却）：（借）現金120万円（高く売れた）／（貸）【　　　】100万円（取得原価）＋その他資本剰余金20万円（差益は資本剰余金：利益ではなく資本の増加）。\nポイント：【　　　】は「純資産のマイナス（会社が自分の株を持つのは実質的に株主への払い戻し）」→資産ではない。再売却時の差益は「利益ではなく資本剰余金（損益計算書に出さない）」。消却時の差損は「その他資本剰余金から控除」。',
  '新株予約権': '一定の行使価格で会社の新株を取得できる権利で行使時に資本金が増加し失効時には利益として計上される純資産の項目を【　　　　　　】という。\n例）ストック・オプション（社員に自社株を安く買う権利を与える制度）：従業員に「1株1,000円で100株買える権利」を付与→【　　　】10万円を純資産計上（権利の価値を負債でなく純資産に計上）。仕訳①付与時（費用計上）：（借）株式報酬費用10万円（費用：権利を付与したコスト）／（貸）【　　　】10万円（純資産に積む）。仕訳②行使時（株価2,000円のときに権利を使った）：（借）現金10万円（行使価格分を払い込む）＋【　　　】10万円（権利を使い消す）／（貸）資本金10万円＋資本準備金10万円（払込金額の1/2ずつ：資本に取り込む）。仕訳③失効時（権利が消えた）：（借）【　　　】10万円（純資産から消す）／（貸）【　　　】戻入益10万円（P/L収益：使われなかった分が利益になる）。\nポイント：【　　　】は純資産（負債ではない）。行使→資本金・資本準備金増加（お金が入り資本が増える）。失効→収益（【　　　】戻入益：権利が使われなかった分）。',
  'その他有価証券評価差額金': 'その他有価証券の期末時価評価差額を損益計算書を経由せず純資産に直接計上する科目を【　　　　　　】という。\n例）その他有価証券（取得原価100万円）が期末時価130万円に上昇（30万円の含み益）。税率30%。仕訳）（借）投資有価証券30万円（株の値段が上がった分だけ資産増加）／（貸）繰延税金負債9万円（30万円×30%：将来この利益に課税されるので先に負債計上）＋【　　　】21万円（評価差額30万円から税効果9万円を除いた21万円が純資産へ・今の株主の手取り分）。\nポイント：評価差額30万円がそのまま純資産に行くのではなく「評価差額－税効果＝純資産計上額（税引き後の実質の取り分）」。試験では税率30%での計算問題が必出。評価損の場合は逆（純資産が減る・繰延税金資産が出てくる）。P/Lを経由せず純資産に直接計上する点が特徴（損益計算書に影響しない）。',
  '貸倒引当金': '債権の回収懸念に備えてB/S上の売掛金等から控除表示される評価勘定科目を【　　　　　　】という。\n例）売掛金1,000万円（まだ代金をもらっていない売上の合計）×貸倒実績率2%（過去の経験から「返ってこない」と見込む割合）＝20万円の引当金設定：（借）【　　　】繰入20万円（費用として計上）／（貸）【　　　】20万円（貸し倒れに備えるクッション）。B/S表示：売掛金1,000万円－【　　　】20万円＝980万円（純額表示：実際に回収できると見込む金額）。\nポイント：引当金は「負側（評価勘定）」として売掛金から控除表示。引当金≠損失確定（あくまで見積もり：実際にはまだ貸し倒れていない）。',
  '減価償却累計額': '間接法における固定資産の累計償却額を計上し帳簿価額を表示させる評価勘定科目を【　　　　　　】という。\n例）建物1,000万円（間接法：固定資産の帳簿価額を直接減らさずに別勘定で管理する方法・10年経過で500万円償却済み）→B/S：建物1,000万円－【　　　】500万円（今まで費用化した合計）＝帳簿価額500万円（まだ残っている価値）。\nポイント：間接法では固定資産を直接減額せず、この評価勘定（マイナスを記録する勘定）で累計を管理。帳簿価額＝取得原価－【　　　】（買ったときの値段から使った分を引いた残り）。',
  '損益': '決算振替仕訳で収益・費用を集計し当期純利益を繰越利益剰余金へ振り替える勘定科目を【　　　　　　】という。\n例）決算振替仕訳（決算時に収益・費用を集計して利益を確定させる作業）：全収益勘定（売上・受取利息など）→【　　　】（貸方：集計口座の右に積み上げる）へ振替、全費用勘定（仕入・給料など）→【　　　】（借方：集計口座の左に積み上げる）へ振替。【　　　】勘定の貸方超過＝当期純利益（収益＞費用の場合の差額）→（借）【　　　】（集計口座を閉じる）／（貸）繰越利益剰余金（利益を貯蓄残高に積み上げる）。\nポイント：【　　　】勘定は「一時的な集計口座」（計算のためだけに使う）。期末の決算振替で使用し、次期に繰り越さない（残高をゼロに戻す）。',
  '建物減価償却累計額': '間接法で建物の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）建物1,000万円（20年・定額法：毎年一定額ずつ費用化する方法）：毎年50万円（1,000万円÷20年）の累計額積上げ。B/Sで「建物1,000万円、減価償却累計額500万円（10年分の合計）、帳簿価額500万円（まだ残っている価値）」と表示。\nポイント：間接法では「【　　　】」「備品減価償却累計額」のように資産ごとに分けて管理する場合と「減価償却累計額」で一本化する場合がある（どちらも同じ考え方）。',
  '備品減価償却累計額': '間接法で備品の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）備品20万円（パソコン・コピー機など・4年・定額法）：毎年5万円（20万円÷4年）の累計額積上げ。B/Sで「備品20万円、【　　　】5万円（1年分）、帳簿価額15万円（まだ残っている価値）」と表示。\nポイント：備品専用の減価償却累計額勘定（建物の累計額とは分けて管理）。廃棄・売却時に残高を全額取崩す（帳簿から消す）。',
  '車両運搬具減価償却累計額': '間接法で車両運搬具の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）営業車200万円（5年・定額法）：毎年40万円（200万円÷5年）の累計額。3年後の帳簿価額＝200万円－120万円（3年分の累計：40万円×3年）＝80万円（今の帳簿上の価値）。\nポイント：車両売却時に「車両200万円・【　　　】120万円（積み上げた累計を消す）」を両方取崩し、売却価格との差で売却損益を計算（売れた値段と帳簿価額の差が儲けまたは損）。',
  '機械装置減価償却累計額': '間接法で機械装置の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）機械3,000万円（工場の製造機械・10年・定額法）：毎年300万円（3,000万円÷10年）の累計額。工業簿記（製造業の原価計算）でも登場する。\nポイント：機械装置は製造業・工業簿記で重要（工場で使う大型設備が対象）。間接法では【　　　】を使う（直接法なら機械装置を直接減額）。',
  '構築物減価償却累計額': '間接法で構築物の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）アスファルト舗装（駐車場の舗装工事・建物ではない土地上の構造物）500万円（15年・定額法）：毎年33万円（500万円÷15年）の累計額。\nポイント：構築物（建物以外の土地上の工作物：塀・舗装・橋など）専用の累計額勘定（建物とは別に管理する）。',
  '工具器具備品減価償却累計額': '間接法で工具器具備品の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）精密測定器（工場で使う計測道具）30万円（3年・定額法）：毎年10万円（30万円÷3年）の累計額。工業簿記（製造業）でも製造現場の工具等で登場する。\nポイント：工具器具備品専用の累計額勘定（工場で使う工具・測定器・器具など）。工場内で使う測定器・切削工具・試験器具などが主な対象。',
  '契約資産': '収益認識基準において履行義務を完了したが代金の受取権が条件付きである場合に計上する資産を【　　　　　　】という。\n例）スマホ本体（10万円）＋1年保守サービス（4万円）のセット14万円を現金で受取。本体を引渡した時点では保守サービスはまだ完了していない（2つの仕事のうち1つだけが終わった状態）。仕訳）本体引渡時：（借）現金14万円（全額受取）／（貸）【　　　】10万円（本体を渡した権利：まだ保守という条件が残っている）＋契約負債4万円（保守分の前受け：まだやっていないサービスの前払い）。保守完了時：（借）契約負債4万円（前受けを解消）／（貸）役務収益4万円（サービス完了で収益を認識）。\nポイント：【　　　】vs売掛金の違い→売掛金は「代金請求権が無条件に確立している（すぐ請求できる権利）」資産。【　　　】は「他の条件（別の履行義務の充足等）が残っている（まだ条件がある）」状態の資産。',
  '特許権': '無形固定資産として取得した特許権を計上し毎期直接法で償却する科目を【　　　　　　】という。\n例）【　　　】（新技術の独占使用権）を500万円で取得（権利期間10年・定額法）：（借）【　　　】500万円（無形資産として計上）／（貸）現金500万円（代金を払う）。毎年50万円（500万円÷10年）を償却：（借）【　　　】償却50万円（費用として計上）／（貸）【　　　】50万円（直接法：帳簿価額を直接減らす）。\nポイント：無形固定資産（形のない固定資産）→累計額勘定を使わず直接法で償却（形がないので間接法が使えない）。【　　　】は法的有効期間（20年）以内で償却（権利が存在する期間内に費用化）。',
  'ソフトウェア仮勘定': 'ソフトウェア完成前の開発支出を一時計上する資産科目を【　　　　　　】という。\n例）自社開発ソフトウェア（自分の会社で作っているシステム）の開発途中の支出500万円（まだ完成していない）：（借）【　　　】500万円（完成前は仮の勘定に入れておく）／（貸）現金500万円（開発費用を払う）。完成後：（借）ソフトウェア500万円（正式な無形固定資産に振り替える）／（貸）【　　　】500万円（仮勘定を消す）。\nポイント：建設仮勘定（有形固定資産の建設中：建物を建てている途中）と同じ発想（完成前は仮勘定）。完成前は减価償却しない（使えないうちは費用化しない）。',
  '開業費': '会社の営業開始前に要した広告・研修等の準備費用を計上する繰延資産科目を【　　　　　　】という。\n例）開業準備期間（会社を始める前の準備段階）の広告費・従業員研修費等の合計60万円：（借）【　　　】60万円（繰延資産として計上：将来の収益のための支出を資産扱い）／（貸）現金60万円（準備費用を払う）。5年以内に均等償却（毎年少しずつ費用化）：毎年（借）【　　　】償却12万円（費用として計上）／（貸）【　　　】12万円（繰延資産を直接減らす）。\nポイント：繰延資産（将来の収益獲得のための特殊な資産）の1つ。創立費（会社設立のための費用：定款作成・登記費用など）と区別する（【　　　】は設立後〜営業開始までの費用）。開業後も任意に一括費用処理（初年度に全額費用化）も可能。',
  '支店': '本支店会計で本店側が支店との取引を記録する内部勘定科目を【　　　　　　】という。\n例）本【　　　】会計（本店と【　　　】が別々の帳簿を持つ会計制度）で本店から【　　　】へ商品100万円を送付：本店側→（借）【　　　】100万円（【　　　】に送った分を本店帳簿に記録）／（貸）仕入（または商品）100万円（在庫が本店から出ていった）。合算時（決算で本店と【　　　】の帳簿をまとめるとき）に「【　　　】」勘定と【　　　】の「本店」勘定を相殺消去（内部取引を消す）。\nポイント：本【　　　】会計では本店と【　　　】が独立した帳簿を持つ（それぞれ別の会社のように管理）。「【　　　】」勘定（本店の帳簿に登場）と「本店」勘定（【　　　】の帳簿に登場）が鏡の関係（どちらか一方に記録する）。',
  '本店': '本支店会計で支店側が本店との取引を記録する内部勘定科目を【　　　　　　】という。\n例）支店の帳簿で（支店が帳簿をつける側から見ると）、【　　　】から商品100万円を受取：（借）仕入（または商品）100万円（在庫が支店に入ってきた）／（貸）【　　　】100万円（【　　　】に対して「もらった」という記録）。合算時（決算で【　　　】と支店の帳簿をまとめるとき）に「【　　　】」勘定と【　　　】の「支店」勘定を相殺消去（内部取引を消す）。\nポイント：「【　　　】」勘定は支店の帳簿にだけ登場（【　　　】の帳簿には「支店」勘定が登場する）。【　　　】の「支店」勘定と合算時に相殺（2つで1つのセット）。残高は常に一致しているはず（不一致なら未達取引等を確認：まだ届いていない取引がある）。',
  '返金負債': '返品権付き販売において返品が見込まれる金額を収益から控除して負債に計上する科目を【　　　　　　】という。\n例）書店へ100万円の本を納品（出版社が書店に本を置いてもらう）。過去実績から10%（10万円）が返品見込み（売れなければ出版社に戻してもらえる契約）。仕訳）納品時：（借）売掛金100万円（まだ代金をもらっていない）／（貸）売上90万円（返品分10万円は収益計上しない：まだ確定していない売上）＋【　　　】10万円（負債：返品時に返金が必要な義務。もし返品されたらこの分だけお金を返さなければならない）。実際に10万円分返品：（借）【　　　】10万円（負債解消）／（貸）売掛金10万円（回収できなくなった分）。\nポイント：返品が予想される場合は「予想返品分だけ収益を減らして【　　　】を計上（確実な分だけ収益にする）」する。これが収益認識基準の「変動対価の考え方（不確かな分は収益にしない）」の具体的な処理。',
  '契約負債': '収益認識基準で顧客から対価を受け取ったが履行義務が未充足の場合に計上する負債科目を【　　　　　　】という。\n例）前払いで受け取ったサービス料30万円（まだサービスを提供していない）：（借）現金30万円（先にお金をもらう）／（貸）【　　　】30万円（サービスを提供するという義務が生じる）。サービス提供後（実際にサービスを提供した）：（借）【　　　】30万円（義務を果たしたので負債を消す）／（貸）役務収益30万円（収益として計上）。\nポイント：収益認識基準（会計の新しいルール）での前受収益の取扱い。「収益認識基準に基づく前受け」→【　　　】。前受収益（以前からある科目）との使い分けに注意（基準を適用しているかどうかで異なる）。',
  '賞与引当金': '夏・冬の賞与の支給見込み額のうち当期に対応する部分を費用計上する引当金を【　　　　　　】という。\n例）3月決算・7月支給予定の夏季賞与600万円のうち10〜3月（当期：今年度分）分300万円を引当計上（7月に払うお金だが今年の仕事に対応する分は今期の費用として先取り）。仕訳）決算時：（借）【　　　】繰入300万円（費用：当期分の賞与費用を先取り）／（貸）【　　　】300万円（負債：7月に払う義務として計上）。7月支給時：（借）【　　　】300万円（引当金を使う：積み立てておいた分を消す）＋賞与300万円（翌期4〜6月分：来期の費用分）／（貸）現金600万円（実際の支払い）。\nポイント：「支払時に全額費用計上（7月に600万円をドーンと費用にする）」では費用収益対応の原則に反する（稼いだ期間と費用計上期間がずれる）。引当金で「働いた期間に費用を先取り（働かせた期間に費用を認識）」することで期間損益が適正化される。',
  '役務収益': 'サービス業・IT業等で役務（サービス）の提供が完了した時点または提供期間にわたって認識する収益科目を【　　　　　　】という。\n例）システム開発の請負契約（総額1,000万円・6か月プロジェクト）。進捗度50%（半分完成した時点）で【　　　】500万円を計上。仕訳）【　　　】の計上：（借）契約資産（または売掛金）500万円（代金請求の権利）／（貸）【　　　】500万円（半分できた分だけ収益認識）。完了時：（借）売掛金1,000万円（全額請求）／（貸）【　　　】500万円（残り分）＋契約資産500万円（解消：前半分の権利を請求権に変える）。\nポイント：【　　　】は「サービスの提供にともなう収益（モノではなくサービスから稼ぐ収益）」。一時点で完了する役務（修理・クリーニング等）→完了時点で収益認識（終わったら全額計上）。一定期間にわたる役務（保守・コンサル等）→期間按分で収益認識（少しずつ計上）。',
  '為替差益': '外貨建て取引においてレートの変動により円換算額が増加したことで生じる収益科目を【　　　　　　】という。\n例）1ドル100円で輸出し売掛金1万ドル（100万円）を計上（輸出した時点では100万円相当）。決算時1ドル108円（円安：円の価値が下がってドルが強くなった状態）。仕訳）決算時換算替え（時価に更新する作業）：（借）売掛金8万円（資産が増加：同じドルが今はより多くの円になる）／（貸）【　　　】8万円（円安→外貨建て資産の価値増加→収益）。決済時に1ドル110円なら：（借）現金110万円（実際に受取った円）／（貸）売掛金108万円＋【　　　】2万円（残りの差益）。\nポイント：外貨建て債権（売掛金・貸付金等：外貨でもらう予定のお金）は円安（円が弱くなる）になると【　　　】（もらえる円が増える）。外貨建て債務（買掛金・借入金等：外貨で払う予定のお金）は円高（円が強くなる）になると【　　　】（払う円が減る）。「自分にとって得になる方向の動き」で差益が発生。',
  '為替差損': '外貨建て取引においてレートの変動により円換算額が減少したことで生じる費用科目を【　　　　　　】という。\n例）1ドル100円で輸入し買掛金1万ドル（100万円）を計上（輸入した時点では100万円相当の支払い義務）。決算時1ドル110円（円安：円の価値が下がった）。仕訳）決算時換算替え：（借）【　　　】10万円（費用：円安→外貨建て負債の負担増・払うべき円が増えた）／（貸）買掛金10万円（負債が増加）。決済時に1ドル112円なら：（借）買掛金110万円（換算替え後の帳簿値）＋【　　　】2万円（追加損失：さらに円安が進んだ分）／（貸）現金112万円（実際の支払い）。\nポイント：輸出企業（外貨をもらう側）→円高（外貨の価値が下がる）で損失・円安で利益。輸入企業（外貨を払う側）→円安で損失（払うべき円が増える）・円高で利益。「取引時レートvs決算時（または決済時）レートの差×外貨金額」で計算。',
  '保険差益': '火災等の損害が生じた固定資産に対して受け取った保険金が帳簿価額を上回る場合に生じる差益を【　　　　　　】という。\n例）帳簿価額500万円（購入時より減価償却で減った後の価値）の建物が火災で全焼（資産が消滅）。保険金800万円受取（保険会社から実損の補償として受け取るお金）。仕訳）保険金受取時：（借）現金800万円（保険金収入）／（貸）建物500万円（資産消滅：帳簿から建物を消す）＋【　　　】300万円（収益：帳簿価額より多くもらえた差額）。圧縮記帳する場合（課税を避けるための処理）：取得した代替資産の帳簿価額から300万円を圧縮（【　　　】分だけ新しい資産の価値を下げる）→当期課税を回避（その年の税金を払わなくてよい）。\nポイント：「焼失資産の帳簿価額＞保険金（帳簿より少ない保険金）」→火災損失（費用：損になる）。「帳簿価額＜保険金（帳簿より多い保険金）」→【　　　】（収益：得になる）。【　　　】には圧縮記帳（課税を将来に繰り延べる方法）が使えることを覚えておく。',
  '負のれん発生益': '企業買収時に支払った対価が純資産時価を下回る場合（割安買収）に発生する利益を【　　　　　　】という。\n例）B社の純資産時価1億円の会社を8,000万円で買収（2,000万円割安で買えた：なんらかの理由で安く手に入れた）。仕訳）買収時：差額（借）諸資産（純資産時価按分：時価で引き継いだ資産）2,000万円（余分に引き継いだ分）／（貸）【　　　】2,000万円（一括収益認識：「得をした分」を全部その年の収益にする）。\nポイント：のれん（正：高く買った分）→20年以内に均等償却（毎期費用：将来に渡って少しずつ費用化）。負のれん（割安で買った分）→発生時に即座に全額収益計上（毎期の費用化なし：一気に収益にする）。正と負で会計処理が真逆になる点が試験頻出。',
  '国庫補助金受贈益': '国・地方公共団体から固定資産取得目的で交付される補助金を受け取った際に計上する収益科目を【　　　　　　】という。\n例）省エネ設備導入のために国から2,000万円の補助金を受け取り（国が設備投資を促進するために企業に渡すお金）。仕訳）補助金受取時：（借）現金2,000万円（資産増加）／（貸）【　　　】2,000万円（収益：もらった補助金は収益として計上）。同時に設備取得・圧縮記帳（収益を打ち消す処理）：（借）固定資産圧縮損2,000万円（費用：補助金収益と相殺）／（貸）機械2,000万円（帳簿価額を2,000万円下げる）→補助金収益2,000万円と圧縮損2,000万円が相殺されて当期は実質ゼロ課税（その年は税金がかからない）。\nポイント：受贈益だけ計上して圧縮記帳しなければその年に2,000万円が課税対象になる（税金をたくさん払う必要がある）。圧縮記帳することで課税を将来に繰り延べる（将来の減価償却が少なくなる形で税金を少しずつ払う）。',

  '補助材料': '製品の製造に補助的に消費されるが主要な構成部分とはならない材料を【　　　　　　】という。\n例）機械の潤滑油（機械がスムーズに動くための油）・塗料（製品の表面仕上げに使う）・研磨剤（製品の表面を磨く）・接着剤（パーツを貼り合わせる）など。製品の骨格（素材：製品の構成部分）でなく「製造プロセスを助けるもの（製品には入らない）」。仕訳）【　　　】10万円を消費：（借）製造間接費10万円（どの製品かわからないので間接費に集約）／（貸）材料10万円（【　　　】が工場で消費されて減る）。\nポイント：素材・買入部品は「直接材料費→仕掛品（特定製品に直接割り当て）」、【　　　】・工場消耗品は「間接材料費→製造間接費（配賦基準で各製品に按分）」。',
  '工場消耗品': '工場内で消費されるが製品の一部を構成しない消耗品として間接費処理される物品を【　　　　　　】という。\n例）機械の潤滑油（機械の維持に使う）・安全手袋（作業員の保護用品）・清掃用雑巾（工場の清掃用）・工場照明の電球（工場の照明設備）など。製品には入らないが工場を動かすために消費する（工場運営のコスト）。仕訳）【　　　】5万円を消費：（借）製造間接費5万円（特定製品への割り当て不可なので間接費へ）／（貸）材料5万円（消耗品が使われて在庫から出ていく）。\nポイント：「製品に入る（製品の一部になる）」→直接材料費（素材・買入部品）→仕掛品。「製品に入らない（工場を動かすために使う）」→間接材料費（補助材料・【　　　】）→製造間接費。',
  '消耗工具器具備品': '工場で使用する工具・器具・備品のうち耐用年数が短く費用として処理される物品を【　　　　　　】という。\n例）ドリルビット（頻繁に先端が摩耗して交換が必要）・低価格ノギス（製品の寸法を測る安い測定器）・検査用ゲージ（製品が規格内かチェックする道具）など。10万円未満なら固定資産に計上せず費用処理（重要性の原則：少額は細かく管理しなくてよい）。仕訳）【　　　】8万円を使用：（借）製造間接費8万円（工場全体の間接費に集約）／（貸）材料8万円（消耗した分を在庫から出す）。\nポイント：10万円以上で1年超使用できるなら固定資産（工具器具備品）→減価償却（毎年少しずつ費用化）。未満なら即時費用処理（使った期にすぐ費用にする）。',
  '仕掛品': '製造途中でまだ完成していない状態の製品を【　　　　　　】という。\n例）自動車工場でエンジン取付完了・塗装未完了の車体（まだ完成していない製造途中のもの）→【　　　】として資産計上。仕訳）当月製造費用300万円を【　　　】に集計：（借）【　　　】300万円（製品製造のコストを一時的にまとめる）／（貸）材料・賃金・製造間接費 各XXX万円（各費用が【　　　】原価として集まる）。完成時：（借）製品250万円（完成品として在庫に移る）／（貸）【　　　】250万円（【　　　】が減って製品が増える）。\nポイント：原価の流れ「材料・賃金・製造間接費（工場の費用）→【　　　】（製造途中）→製品（完成品）→売上原価（売れた分）」。【　　　】は加工が完了していないもの。半製品（外部に売れる状態の中間品）との違いを押さえる。',
  '半製品': '製造工程の中間段階で外部に販売することも次の工程に投入することもできる製品を【　　　　　　】という。\n例）自動車部品メーカーのエンジン（完成品として外販もできるし、自社組立にも使える：完成した中間製品）。外販するかどうかが不明な時点で完成した中間製品。仕訳）【　　　】が完成：（借）【　　　】100万円（外販可能な中間品として在庫に計上）／（貸）仕掛品100万円（製造途中の仕掛品が完成して【　　　】になる）。外部に販売：（借）売上原価（売れた分を費用に）／（貸）【　　　】100万円（【　　　】が売れて在庫から出ていく）。\nポイント：仕掛品との違い→「外部に売れる状態（自社で使うことも外販することも両方できる）」になったら【　　　】。製品との違い→最終完成品でなく中間品（さらに加工するか外販するかを選べる）。',
  '製品': '製造工程がすべて完了し販売可能な完成品を【　　　　　　】という。\n例）工場で全工程が終わり出荷待ちの完成品（すべての製造工程が終わった最終商品）。仕訳）【　　　】の完成：（借）【　　　】300万円（完成品として在庫に計上）／（貸）仕掛品300万円（製造途中の仕掛品が完成して【　　　】になる）。販売時：（借）売上原価300万円（売れた分のコストを費用に移す）／（貸）【　　　】300万円（【　　　】在庫が減る）、同時に（借）売掛金500万円（代金をもらう権利）／（貸）売上500万円（収益が確定）。\nポイント：【　　　】→販売されると「売上原価（費用）」に振り替わる（在庫→費用の流れ）。期末に残っている【　　　】は棚卸資産（資産）としてB/Sに計上（まだ売れていない在庫）。「【　　　】＝完成品在庫」のイメージ。',
  '副産物': '主製品の製造過程で付随的・必然的に生じる一定の売却価値を持つ産出物を【　　　　　　】という。\n例）製材業：角材（主製品：メインの商品）を切り出す際に発生するおがくず・端材（【　　　】：意図せず出てくる有価な産出物）→燃料・パーティクルボード原料として売却可。仕訳）【　　　】の評価額（見込み売価－処理費：売れると思われる値段から処理コストを引いた価値）を主製品の製造原価から控除：（借）【　　　】XX万円（【　　　】を在庫として計上）／（貸）仕掛品XX万円（【　　　】の価値分だけ主製品のコストを下げる）。\nポイント：【　　　】の収益は主製品の原価を下げる（原価控除法：【　　　】が売れる分だけ主製品のコストが安くなる）。',
  '作業くず': '材料を加工する過程で生じる端材・切りくずなどで回収・売却できる廃材を【　　　　　　】という。\n例）金属プレス加工で生じる鉄くず（プレスで打ち抜いた後に残る金属の端切れ）・木材加工の端切れ→スクラップ業者に売却可能。仕訳）【　　　】3万円分を回収・評価：（借）【　　　】3万円（スクラップとして在庫に計上）／（貸）仕掛品3万円（製品原価をスクラップ価値分だけ3万円減額）。売却時：（借）現金3万円（スクラップ代金を受け取る）／（貸）【　　　】3万円（在庫から出ていく）。\nポイント：副産物との違い→副産物は「製造の過程で意図せず生じる有価な産出物（おがくずなど量もある程度ある）」。【　　　】は「加工の端材・廃材（鉄くず・切り粉など）」。いずれも売れる価値があれば製造原価を下げる効果がある。',
  '賃金': '工場の直接・間接労働者に支払われる給与で製造原価の労務費として計上されるものを【　　　　　　】という。\n例）工場の製造ラインで働く作業員への月給150万円→【　　　】（製造原価：工場人件費）。同社の営業事務員への月給100万円→給料（販管費：本社人件費）。仕訳）【　　　】150万円を計上：（借）【　　　】150万円（工場の人件費を計上）／（貸）現金預金150万円（実際に給与を支払う）。製品への振替：（借）仕掛品100万円（どの製品かわかる直接労務費→製品原価に直接加える）・製造間接費50万円（工場長の給与など間接的なもの→配賦する）／（貸）【　　　】150万円（【　　　】を直接・間接に振り分けて費用化する）。\nポイント：「工場の人件費」→【　　　】（製造原価）。「本社・営業所の人件費」→給料（販管費）。同じ給与でも発生場所（工場か本社か）で科目が変わる。',
  '雑給': '工場のパートタイマーや臨時従業員に支払われる給与を【　　　　　　】という。\n例）工場繁忙期に雇ったアルバイト（短期的に増員した非正規社員）・パートへの賃金20万円→【　　　】（労務費の一部：臨時の人件費）として製造原価に含める。仕訳）【　　　】20万円：（借）【　　　】20万円（臨時の工場人件費）／（貸）現金20万円（賃金を支払う）。製品への振替：（借）製造間接費20万円（アルバイトは特定製品への割り当てが困難なので間接費に集約）／（貸）【　　　】20万円（間接労務費として製造間接費に集める）。\nポイント：賃金（正社員の工場給与）・【　　　】（パート等の工場給与）はいずれも労務費（工場の人件費全般）。【　　　】は一般的に間接労務費として製造間接費に集約する（どの製品向けかわかりにくいため）。',
  '従業員賞与手当': '工場従業員に支給されるボーナスや各種手当で労務費として製造原価に含まれるものを【　　　　　　】という。\n例）工場作業員への夏季賞与50万円（工場の正社員への期末ボーナス）・残業手当10万円（時間外労働の割増賃金）→【　　　】60万円（労務費：工場の人件費として製造原価へ）。本社社員のボーナスは「賞与（販管費）」として計上（工場と本社で科目が変わる）。仕訳）【　　　】60万円：（借）製造間接費60万円（工場全体の間接費に集約）／（貸）現金60万円（実際に支払う）。\nポイント：工場と本社で同じ賞与でも科目と費用分類が変わる（工場→製造原価・本社→販管費）。「工場 vs 本社」の区別を常に意識すること（どこで働いている人の費用か）。',
  '製造間接費': '複数製品に共通して発生するため配賦基準によって各製品に間接的に割り当てられる製造原価を【　　　　　　】という。\n例）工場の電気代30万円（どの製品に使ったかわからない）・工場長の給与50万円（工場全体を管理）・機械の減価償却費20万円（複数製品に使う機械のコスト）→すべて【　　　】100万円にまとめる。製品A（直接作業600時間）・B（400時間）、計1,000時間で配賦（按分）：A→60万円（100万円×60%）・B→40万円（100万円×40%）。仕訳）【　　　】を仕掛品へ配賦：（借）仕掛品100万円（配賦額を各製品原価に加える）／（貸）【　　　】100万円（【　　　】をゼロにリセット）。\nポイント：「どの製品のためかわからない費用（共通費用）」→【　　　】→配賦基準（直接作業時間・機械時間等）で按分（各製品に合理的に割り当て）。直接費は賦課（直接加算）、間接費は配賦（間接的に按分）、と用語を区別する。',
  '外注加工費': '製造工程の一部を外部業者に委託した際に支払う加工費用を【　　　　　　】という。\n例）金属部品の熱処理加工（高温で金属を処理する特殊工程）を専門業者に委託し50万円を支払い→【　　　】50万円（製造原価の経費として直接費扱い）。仕訳）【　　　】の発生：（借）仕掛品50万円（特定製品の加工コストとして直接加える）／（貸）買掛金50万円（外注業者に後で払う義務）。\nポイント：【　　　】は「製造原価の経費（材料費でも労務費でもない第3の分類）」に分類。外部への委託なので「自社の賃金ではない労働力コスト（他社の工場に頼んだ加工費）」。直接費として仕掛品に賦課する点が特徴（どの製品の加工かが明確）。',
  '材料消費価格差異': '材料の予定消費単価と実際消費単価の差に実際消費数量を乗じた差額を【　　　　　　】という。\n例）予定単価1,000円（最初に決めた1個あたりの仕入値）・実際単価1,200円（実際に仕入れた値段）、実際消費量500個→【　　　】：（1,200－1,000）×500＝10万円（不利差異：実際のほうが高かった→予定よりコストがかかった）。仕訳）（借）【　　　】10万円（不利差異：追加コスト）／（貸）材料10万円（予定より高く買ったので差額を分離）。期末：（借）売上原価10万円（差異を売上原価に加算して損益に反映）／（貸）【　　　】10万円（差異を消去）。\nポイント：価格差異の原因＝「いくらで買ったか（単価の問題）」→仕入先の値上げ・調達タイミングの失敗など。数量差異（どれだけ使ったかの問題）との違いを押さえる。',
  '材料消費数量差異': '材料の標準消費数量と実際消費数量の差に予定単価を乗じた差額を【　　　　　　】という。\n例）製品100個の標準消費量500個（あらかじめ決めた「製品100個を作るのに必要な材料量」）・実際消費量550個（実際に使った量：50個余分に使った）、標準単価1,000円→【　　　】：（550－500）×1,000＝5万円（不利差異：余分に使った分のコスト）。仕訳）（借）【　　　】5万円（不利差異：使いすぎた分のコスト）／（貸）仕掛品5万円（標準量で計算した仕掛品から余分使用分を取り出す）。\nポイント：数量差異の原因＝廃材多発（不良品が多くて材料を無駄にした）・加工ミス・材料品質不良など「使いすぎの問題」。管理責任は製造現場（数量差異は現場の問題）vs 購買部門（価格差異は購買担当の問題）。',
  '賃率差異': '予定賃率と実際賃率の差に実際作業時間を乗じた差額を【　　　　　　】という。\n例）予定賃率1,500円/時間（最初に決めた1時間あたりの賃金）・実際賃率1,600円/時間（実際に払った賃金）、実際作業時間200時間→【　　　】：（1,600－1,500）×200＝2万円（不利差異：予定より高い賃金を払った）。仕訳）（借）【　　　】2万円（不利差異：予定より高い賃金のコスト超過分）／（貸）賃金2万円（予定賃率で計算した額と実際賃金との差額を分離）。\nポイント：【　　　】は「賃金単価（時給）の高低の問題」。原因：賃上げ（全社的な賃上げで想定より高くなった）・残業割増増加（残業が増えると割増賃金で単価が上がる）・正社員vsアルバイトの比率変化など。作業時間差異（時間の長短の問題：効率が悪くて時間がかかった）との違いを押さえる。',
  '作業時間差異': '標準作業時間と実際作業時間の差に予定賃率を乗じた差額を【　　　　　　】という。\n例）製品100個の標準作業時間200時間（あらかじめ決めた「製品100個を作るのに必要な時間」）・実際作業時間230時間（実際にかかった時間：30時間余分にかかった）、予定賃率1,500円/時間→【　　　】：（230－200）×1,500＝4.5万円（不利差異：余分な時間がかかった分のコスト）。仕訳）（借）【　　　】4.5万円（不利差異：余分な作業時間のコスト）／（貸）賃金4.5万円（標準時間で計算した賃金と実際賃金との差額）。\nポイント：原因＝機械トラブルによる手待ち（機械が止まって作業員が待ちぼうけ）・不慣れな作業（新人や新しい工程）・工程の流れの悪さなど。改善の責任は製造現場の監督者にある（時間管理は現場の問題）。賃率差異（単価の問題）との違いを押さえる。',
  '製造間接費予算差異': '製造間接費の予算許容額と実際発生額の差額を【　　　　　　】という。\n例）基準操業度250時間（1か月に想定される標準的な稼働時間）・固定費予算10万円（稼働時間に関係なく必ず発生する固定のコスト）・変動費率600円/時間（1時間稼働するごとに増える変動コスト）。実際操業度200時間の予算許容額＝10万円＋600円×200時間＝22万円（200時間稼働した場合に許容されるコスト）。実際発生額24万円→予算差異：24万円－22万円＝2万円（不利差異：許容額を超えた）。仕訳）（借）【　　　】2万円（コスト超過分）／（貸）製造間接費2万円。\nポイント：製造間接費の差異は「予算差異（コスト管理の成否）」「能率差異（作業効率の成否）」「操業度差異（設備稼働率の成否）」の3つに分解。予算差異はコスト管理の成否を示す。',
  '製造間接費能率差異': '標準作業時間と実際作業時間の差に標準配賦率を乗じた差異を【　　　　　　】という。\n例）標準作業時間200時間（予定通り効率よく作業すれば必要な時間）・実際作業時間220時間（実際にかかった時間：20時間余分にかかった）、標準配賦率1,000円/時間（1時間当たりの標準的な間接費配賦額）→能率差異：（220－200）×1,000＝2万円（不利差異：余分な20時間分の間接費が余計にかかった）。仕訳）（借）【　　　】2万円（作業効率の悪化による余分なコスト）／（貸）製造間接費2万円。\nポイント：能率差異は作業効率が悪く余計に時間がかかったせいで間接費が多く配賦された分（非効率な作業によるコスト増）。予算差異（コスト自体の増減）・操業度差異（設備稼働率の問題）との3分解を押さえる。',

  '本社': '工場会計において工場が本社との取引を記録する際に使う相手勘定科目を【　　　　　　】という。\n例）【　　　】が工場のために材料100万円を現金で購入し工場に送付（【　　　】が代わりに買ってあげた）。工場側仕訳：（借）材料100万円（材料が工場に届いた）／（貸）【　　　】100万円（【　　　】に100万円の負債が生じた：「【　　　】から100万円もらった」という記録）。【　　　】側仕訳：（借）工場100万円（工場に100万円の資産が生じた：「工場に100万円の資産を送った」という記録）／（貸）現金100万円（現金が出ていった）。合算時：【　　　】勘定100万円と工場勘定100万円を相殺消去（内部のやり取りを外に見せない）→材料100万円・現金100万円だけが残る。\nポイント：【　　　】勘定と工場勘定は「鏡の関係（一方が増えればもう一方も同額増える）」。合算時に両者を相殺すればグループ内の内部取引が消える。',

const GLOSSARY_Q = {
  '借方': '仕訳および勘定口座の左側を指し資産増加・費用発生を記録する側を【　　　　　　】という。\n例）現金100万円を受け取った→【　　　】（左側の記録欄）：現金100万円（手元に入ってきた資産の増加）。商品仕入100万円→【　　　】：仕入100万円（仕入という費用が発生した）。\nポイント：【　　　】＝「左側」（T字型帳簿の左半分）。資産の増加（現金・売掛金等が増える）・負債の減少（借金が減る）・純資産の減少（元手が減る）・費用の発生（コストが生じる）が【　　　】に来る。左右どちらかは「借は左・貸は右」と機械的に暗記。',

  '勘定科目': '取引を分類するために使用する標準化された勘定の名称を【　　　　　　】という。\n例）「現金（手元の現金）」「売掛金（未回収の代金）」「借入金（銀行からの借金）」「売上（販売で得た収益）」「仕入（商品を買ったコスト）」「給料（従業員への人件費）」—これらすべてが【　　　】（取引を分類するための標準化されたラベル）。\nポイント：【　　　】は標準化されており、試験では指定の科目名を使う必要がある（例：「料金」ではなく「受取手数料」という正式な科目名を使う）。',
  '勘定': '同一科目の増減を借方・貸方に記録するT字型の記録単位を【　　　　　　】という。\n例）「現金」【　　　】のT字型口座：借方（入金合計）200万円 ／ 貸方（出金合計）150万円→残高50万円（借方残高：現金が50万円残っている）。\nポイント：総【　　　】元帳に【　　　】ごとにページがある。T字型の左（借方：入ってきた・増えた側）・右（貸方：出ていった・減った側）に増減を記録し、差額が残高。',
  '転記': '仕訳帳の内容を各勘定口座に書き写す手続きを【　　　　　　】という。\n例）仕訳帳「仕入100万円 ／ 現金100万円」→総勘定元帳の「仕入」勘定の借方に100万円（費用が増えた）、「現金」勘定の貸方に100万円（現金が出ていった）をそれぞれ書き写す（【　　　】）。\nポイント：仕訳帳（日付順の時系列記録）→【　　　】→総勘定元帳（科目別の集計記録）という流れ。【　　　】漏れや金額違いがあると試算表の借方・貸方が一致しない（ミスを検知できる）。',
  '会計期間': '財務諸表作成のために設定する一定の時間的区切り（通常1年間）を【　　　　　　】という。\n例）4月1日〜翌3月31日（3月決算：多くの日本企業）または1月1日〜12月31日（12月決算）など。期首（会計年度の始まりの日）に前期の資産・負債を引継ぎ、期末（締め切り日）に利益を確定して翌期へ繰り越す。\nポイント：「期中」＝【　　　】のある時点（年度途中）。「期末」＝決算日（帳簿を締める日）。財務諸表は【　　　】ごとに作成する（毎年比較できる）。',

  '小口現金出納帳': '少額の日常経費の出金明細を記録する補助帳簿を【　　　　　　】という。\n例）【　　　】：週ごとに交通費（移動費）・消耗品費（文房具等の少額物品）・通信費（切手・宅急便等）などの小口払い（少額の日常的な支払い）を記録し、週末に合計を担当者から報告してもらい補給（週ごとに一定額を補充する）と帳簿記帳を同時に行う。\nポイント：インプレスト制（定額前渡し制：あらかじめ決まった額を渡しておく仕組み）では週・月次で一定額を補給する。',
