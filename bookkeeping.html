  { id:384, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'B社（引受人）はA社（振出人）から「C社へ80,000円払え」という為替手形の引き受けを求められ、承諾した。B社はA社への買掛金80,000円を持っていた。B社（引受人）の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">買掛金</td><td class="hl">80,000</td><td class="hl">支払手形</td><td class="hl">80,000</td></tr></tbody></table><div class="formula-box">引受人：A社への買掛金（普通の債務）がC社への支払手形に変わる</div>`,
    exp:'引受人B社は「A社への買掛金」を「C社への支払手形（期日に手形代金を払う義務）」に振り替える。形式上の支払先がA社からC社に変わるが、金額は変わらない。支払手形は満期日に当座預金から決済される。',
    e:[{d:[['買掛金',80000]],c:[['支払手形',80000]]}]
  },

  { id:385, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'C社（受取人）はA社（振出人）からB社引受済みの為替手形80,000円を受け取った。C社はA社への売掛金80,000円を持っていた。C社（受取人）の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">受取手形</td><td class="hl">80,000</td><td class="hl">売掛金</td><td class="hl">80,000</td></tr></tbody></table><div class="formula-box">受取人：A社への売掛金（普通の債権）がB社引受の受取手形に変わる</div>`,
    exp:'受取人C社は「A社への売掛金」を「B社が引き受けた受取手形（B社が期日に払ってくれる権利）」に振り替える。A社との直接の取引関係がなくなり、B社との手形関係になる。B社は期日に必ず払う義務がある。',
    e:[{d:[['受取手形',80000]],c:[['売掛金',80000]]}]
  },

  { id:386, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'為替手形80,000円（B社引受）が期日を迎えた。①引受人B社が当座預金から支払い、②受取人C社が当座預金に受け取った。各社の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>会社</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①B社（引受人）</td><td class="hl">支払手形</td><td class="hl">80,000</td><td class="hl">当座預金</td><td class="hl">80,000</td></tr><tr><td>②C社（受取人）</td><td class="hl">当座預金</td><td class="hl">80,000</td><td class="hl">受取手形</td><td class="hl">80,000</td></tr></tbody></table>`,
    exp:'期日決済は約束手形と同じ処理。引受人B社は「支払手形→当座預金」で支払い義務を履行。受取人C社は「当座預金←受取手形」で権利を現金化。為替手形特有の3者構造は手形流通中のみで、期日決済は引受人と受取人の2者間。',
    e:[{d:[['支払手形',80000]],c:[['当座預金',80000]]},{d:[['当座預金',80000]],c:[['受取手形',80000]]}]
  },

  { id:387, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'C社は保有する受取手形（B社引受の為替手形60,000円）を、仕入代金60,000円の支払いとしてD社に裏書譲渡した。C社の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">買掛金</td><td class="hl">60,000</td><td class="hl">受取手形</td><td class="hl">60,000</td></tr></tbody></table><div class="formula-box">約束手形の裏書と同じ処理：受取手形（資産）が減り、買掛金（負債）が消える</div>`,
    exp:'為替手形も約束手形と同様に裏書譲渡できる。為替手形か約束手形かで仕訳は変わらない。C社は「受取手形（資産）をD社に渡す＝受取手形が減る」、同時にD社への買掛金（負債）が消える。',
    e:[{d:[['買掛金',60000]],c:[['受取手形',60000]]}]
  },

  { id:388, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'C社は保有する受取手形（為替手形、額面50,000円）を銀行で割り引き、割引料500円が差し引かれた手取金49,500円が当座預金に入金された。C社の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">当座預金</td><td class="hl">49,500</td><td class="hl">受取手形</td><td class="hl">50,000</td></tr><tr><td class="hl">手形売却損</td><td class="hl">500</td><td></td><td></td></tr></tbody></table><div class="formula-box">手形割引＝受取手形を銀行に売却。割引料は手形売却損（費用）。</div>`,
    exp:'為替手形の割引も約束手形と同じ処理。手取金（入金額）は当座預金の借方、額面は受取手形の貸方、差額の割引料は手形売却損（費用）の借方。為替手形か約束手形かで仕訳は変わらない。',
    e:[{d:[['当座預金',49500],['手形売却損',500]],c:[['受取手形',50000]]}]
  },

  { id:389, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'（総合）Ａ社はＣ社への買掛金100,000円の決済のため、得意先Ｂ社（Ａ社への売掛金100,000円がある）に「Ｃ社へ100,000円払え」という為替手形を振り出した。Ｂ社はこれを引き受け、Ｃ社は受け取った。①Ａ社（振出人）②Ｂ社（引受人）③Ｃ社（受取人）それぞれの仕訳を示しなさい。',
    en_q:'(Comprehensive) Company A issued a bill of exchange instructing "pay ¥100,000 to Company C" to Company B (which owed A ¥100,000), to settle A\'s own ¥100,000 payable to C. B accepted it; C received it. Record the entries for ①A (drawer), ②B (acceptor), and ③C (payee).',
    e:[{d:[['買掛金',100000]], c:[['売掛金',100000]]}, {d:[['買掛金',100000]], c:[['支払手形',100000]]}, {d:[['受取手形',100000]], c:[['売掛金',100000]]}],
    exp:'為替手形は「振出人が、自分の債務者（引受人）に、自分の債権者（受取人）へ支払わせる」という3者間の手形です。①Ａ社（振出人）：Ｃ社への買掛金とＢ社への売掛金が同時に消えるため「買掛金／売掛金」。②Ｂ社（引受人）：Ａ社への買掛金という債務の中身が「支払手形」という手形債務に変わります。③Ｃ社（受取人）：Ａ社への売掛金という債権の中身が「受取手形」という手形債権に変わります。期日にＢ社がＣ社へ支払うと、Ｂ社は支払手形を、Ｃ社は受取手形をそれぞれ消します。'
  },

  // ===== 圧縮記帳（追加）=====
  { id:390, level:2, cat:'圧縮記帳', chap:'第6章：有形固定資産',
    q:'国庫補助金2,000,000円を普通預金に受け取り、機械装置4,000,000円を現金で購入した（耐用年数4年・残存価額0円・定額法）。積立金方式で圧縮記帳を行う場合の①補助金受取②機械購入③圧縮積立金設定④1年目の減価償却と積立金取崩しの仕訳を示しなさい。',
    en_q:'Received a ¥2,000,000 government subsidy into the bank account and acquired machinery for ¥4,000,000 cash (4-year life, straight-line, zero residual). Using reserve-method compression accounting, record ①the subsidy receipt, ②the machine purchase, ③the compression reserve setup, and ④year-1 depreciation with the corresponding reserve reversal.',
    e:[{d:[['普通預金',2000000]], c:[['国庫補助金受贈益',2000000]]}, {d:[['機械装置',4000000]], c:[['現金',4000000]]}, {d:[['繰越利益剰余金',2000000]], c:[['圧縮積立金',2000000]]}, {d:[['減価償却費',1000000]], c:[['減価償却累計額',1000000]]}, {d:[['圧縮積立金',500000]], c:[['繰越利益剰余金',500000]]}],
    exp:'積立金方式は「固定資産の帳簿価額はそのまま、利益剰余金から圧縮積立金へ積み立てる」方法です。①②は受け取った事実・購入した事実をそのまま計上。③圧縮積立金の設定額は補助金と同額2,000,000円。④帳簿価額を減らさないため、減価償却費は取得原価全額ベースで計算：4,000,000÷4年＝1,000,000円。同時に、圧縮積立金も耐用年数にわたって均等に取り崩します：2,000,000÷4年＝500,000円。直接減額方式（帳簿価額そのものを圧縮）と比べ、積立金方式は固定資産の帳簿価額をそのまま表示できる点が特徴です。'
  },

  { id:391, level:2, cat:'圧縮記帳', chap:'第6章：有形固定資産',
    q:'直接控除方式で圧縮記帳済みの建物：取得原価10,000,000円・固定資産圧縮損3,000,000円（計上済み）・耐用年数20年・残存価額0円・定額法。決算にあたり、減価償却の仕訳を示しなさい。',
    en_q:'A building was compressed under the direct-reduction method: acquisition cost ¥10,000,000, compression loss already recorded ¥3,000,000, 20-year life, straight-line, zero residual. Record the year-end depreciation entry.',
    e:[{d:[['減価償却費',350000]], c:[['減価償却累計額',350000]]}],
    exp:'直接控除方式では固定資産の帳簿価額そのものを補助金分だけ減らすため、減価償却の基礎となる帳簿価額も小さくなります。圧縮後帳簿価額：10,000,000－3,000,000＝7,000,000円。年間減価償却費：7,000,000÷20年＝350,000円。積立金方式（取得原価全額を基礎に償却する）と比べ、直接控除方式は毎期の減価償却費が少なく計算される点が異なります。どちらの方式も「補助金を受け取った年に一括課税されるのを防ぎ、将来にわたって分割で課税する」という効果は同じです。'
  },

  { id:393, level:2, cat:'繰延資産', chap:'無形資産・リース・引当金',
    q:'会社設立後・営業開始前に広告宣伝費400,000円・従業員研修費100,000円を現金で支払い、開業費（繰延資産）として計上した。①計上時の仕訳と②決算時（5年定額法・当期12ヶ月）の年間償却仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①計上時</td><td class="hl">開業費</td><td class="hl">500,000</td><td>現金</td><td>500,000</td></tr><tr><td>②償却時</td><td class="hl">開業費償却</td><td class="hl">100,000</td><td class="hl">開業費</td><td class="hl">100,000</td></tr></tbody></table><div class="formula-box">償却額＝500,000÷5年＝100,000円／年</div>`,
    exp:'開業費は「会社が完成してから営業開始するまでに使った費用」（広告・研修・賃借料など）。繰延資産として5年以内に定額法で償却。償却の仕訳は「開業費償却（費用）／開業費（繰延資産）」。創立費（会社を作るための費用）とは別物で、発生時期が違う。',
    e:[{d:[['開業費',500000]],c:[['現金',500000]]},{d:[['開業費償却',100000]],c:[['開業費',100000]]}]
  },

  { id:394, level:2, cat:'繰延資産', chap:'無形資産・リース・引当金',
    q:'増資（新株発行）にあたり、株式の募集・引受手数料など株式交付費600,000円を現金で支払い、繰延資産として計上した。①計上時の仕訳と②3年定額法（当期12ヶ月）による1年分の償却仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①計上時</td><td class="hl">株式交付費</td><td class="hl">600,000</td><td>現金</td><td>600,000</td></tr><tr><td>②償却時</td><td class="hl">株式交付費償却</td><td class="hl">200,000</td><td class="hl">株式交付費</td><td class="hl">200,000</td></tr></tbody></table><div class="formula-box">償却額＝600,000÷3年＝200,000円／年（株式交付費の償却期間は3年以内）</div>`,
    exp:'株式交付費は「増資や株式発行のために使った費用」（引受手数料・募集費用など）。会社設立時の株式発行費用は「創立費」に含まれるため別扱い。株式交付費は3年以内に均等償却。他の繰延資産（創立費・開業費・開発費）は5年以内なので、3年という点が試験のポイント。',
    e:[{d:[['株式交付費',600000]],c:[['現金',600000]]},{d:[['株式交付費償却',200000]],c:[['株式交付費',200000]]}]
  },

  { id:395, level:2, cat:'繰延資産', chap:'無形資産・リース・引当金',
    q:'会社設立のため定款作成費用200,000円・設立登記費用100,000円・発起人報酬80,000円を現金で支払い、創立費（繰延資産）として計上した。仕訳を行いなさい。また、創立費と開業費の正しい区別を選べ。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">創立費</td><td class="hl">380,000</td><td>現金</td><td>380,000</td></tr></tbody></table><div class="formula-box">創立費：会社そのものを作るための費用（定款・登記・発起人費用）→ 5年以内に償却<br>開業費：会社ができた後、営業を開始するまでの費用（広告・研修など）→ 5年以内に償却</div>`,
    exp:'創立費と開業費はどちらも繰延資産で5年以内定額法償却だが発生時期が違う。創立費は「会社の設立手続き中（法人格がない段階）」の費用、開業費は「会社設立後・営業開始まで」の費用。試験では費用の種類を読んで正しい勘定科目を選ぶ問題が出る。',
    e:[{d:[['創立費',380000]],c:[['現金',380000]]}]
  },

  { id:397, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'新製品の研究開発のため、材料費300,000円・人件費500,000円・外注費200,000円を現金で支払った。研究開発費として処理する仕訳を行いなさい。また、研究開発費を資産計上できない理由として正しいものを選べ。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">研究開発費</td><td class="hl">1,000,000</td><td>現金</td><td>1,000,000</td></tr></tbody></table><div class="formula-box">資産計上できない理由：将来の収益への貢献が不確実なため（保守主義の原則）</div>`,
    exp:'研究開発費は、新製品・新技術の研究（Research）および開発（Development）に要した費用。将来の収益に貢献するかどうかが不確実なため費用処理が義務付けられており、資産計上は認められない（「研究開発費等に係る会計基準」）。販管費の内訳として損益計算書に表示。',
    e:[{d:[['研究開発費',1000000]],c:[['現金',1000000]]}]
  },

  { id:398, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'市場販売目的のソフトウェアを開発した。①研究・企画段階での費用600,000円（費用処理）と②製品マスター完成後の追加機能開発費900,000円（資産計上）を、それぞれ現金で支払った場合の仕訳を行いなさい。また③②のソフトウェアを耐用年数3年・定額法で償却する場合の年間償却仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①研究・企画段階</td><td class="hl">研究開発費</td><td>600,000</td><td>現金</td><td>600,000</td></tr><tr><td>②製品マスター以降</td><td class="hl">ソフトウェア</td><td>900,000</td><td>現金</td><td>900,000</td></tr><tr><td>③年間償却</td><td class="hl">ソフトウェア償却</td><td class="hl">300,000</td><td class="hl">ソフトウェア</td><td class="hl">300,000</td></tr></tbody></table><div class="formula-box">年間償却費＝900,000÷3年＝300,000円（無形固定資産は直接法で償却）</div>`,
    exp:'市場販売目的ソフトウェアは「製品マスター完成まで＝研究開発費（費用）、製品マスター完成後の機能追加・改良＝ソフトウェア（資産）」と区分する。無形固定資産に計上されたソフトウェアは直接法で償却：借）ソフトウェア償却 ／ 貸）ソフトウェア。',
    e:[{d:[['研究開発費',600000]],c:[['現金',600000]]},{d:[['ソフトウェア',900000]],c:[['現金',900000]]},{d:[['ソフトウェア償却',300000]],c:[['ソフトウェア',300000]]}]
  },

  { id:399, level:2, cat:'固定資産', chap:'第6章：有形固定資産',
    q:'自社の受発注管理システムを外部委託で開発し、完成時に代金1,800,000円を小切手で支払った（将来の業務コスト削減が確実）。無形固定資産（ソフトウェア）として計上し、耐用年数5年・定額法で償却する。①取得時の仕訳②年間償却費③償却時の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①取得時</td><td class="hl">ソフトウェア</td><td class="hl">1,800,000</td><td>当座預金</td><td>1,800,000</td></tr><tr><td>③償却時</td><td class="hl">ソフトウェア償却</td><td class="hl">360,000</td><td class="hl">ソフトウェア</td><td class="hl">360,000</td></tr></tbody></table><div class="formula-box">②年間償却費＝1,800,000÷5年＝360,000円<br>無形固定資産は直接法（資産残高を直接減額）で償却</div>`,
    exp:'自社利用目的ソフトウェアは「将来の費用削減や業務効率化が確実な場合」に無形固定資産として計上できる。不確実な場合は費用処理。市場販売目的ソフトウェアとは異なり、利用可能になった時点で資産計上開始。耐用年数は通常5年（最長）。',
    e:[{d:[['ソフトウェア',1800000]],c:[['当座預金',1800000]]},{d:[['ソフトウェア償却',360000]],c:[['ソフトウェア',360000]]}]
  },

  // ===== 株式発行・増資（追加）=====
  { id:400, level:2, cat:'株式発行', chap:'第10章：株式会社会計',
    q:'増資のため株式200株を1株2,000円で発行し、払込金400,000円が普通預金に振り込まれた。会社法の規定により払込額の1/2を資本金・残りを資本準備金に計上する場合の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">普通預金</td><td class="hl">400,000</td><td class="hl">資本金</td><td class="hl">200,000</td></tr><tr><td></td><td></td><td class="hl">資本準備金</td><td class="hl">200,000</td></tr></tbody></table><div class="formula-box">資本金＝400,000×1/2＝200,000円　資本準備金＝400,000×1/2＝200,000円</div>`,
    exp:'会社法の原則：払込金額の全額を資本金とする。例外：払込金額の1/2を超えない範囲で資本準備金に計上できる。試験では「払込額の1/2を資本金」と指示があれば資本金200,000・資本準備金200,000に分ける。会社設立時も増資時も同じ処理で、払込先は普通預金（or 当座預金）。',
    e:[{d:[['普通預金',400000]],c:[['資本金',200000],['資本準備金',200000]]}]
  },

  { id:401, level:2, cat:'株式発行', chap:'第10章：株式会社会計',
    q:'保有する自己株式（帳簿価額150,000円）を消却した。その他資本剰余金の残高は十分にあるとする。仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td class="hl">その他資本剰余金</td><td class="hl">150,000</td><td class="hl">自己株式</td><td class="hl">150,000</td></tr></tbody></table><div class="formula-box">自己株式の消却：その他資本剰余金（純資産のプラス）を取り崩して自己株式（純資産のマイナス）を消す</div>`,
    exp:'自己株式の消却は「帳簿上の株式を廃棄する」手続き。その他資本剰余金を借方に計上して自己株式（貸方）を消す。その他資本剰余金が不足する場合は繰越利益剰余金から補填。資本金や資本準備金からは直接消却しない。消却後は発行済株式数が減少する。',
    e:[{d:[['その他資本剰余金',150000]],c:[['自己株式',150000]]}]
  },

  { id:402, level:2, cat:'株式発行', chap:'第10章：株式会社会計',
    q:'株主総会の決議により①資本準備金600,000円を資本金に組み入れ、②繰越利益剰余金400,000円を利益準備金に積み立てた。各仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①</td><td class="hl">資本準備金</td><td class="hl">600,000</td><td class="hl">資本金</td><td class="hl">600,000</td></tr><tr><td>②</td><td class="hl">繰越利益剰余金</td><td class="hl">400,000</td><td class="hl">利益準備金</td><td class="hl">400,000</td></tr></tbody></table><div class="formula-box">株主資本の計数変動：純資産の各区分間の振替（純資産合計は変わらない）</div>`,
    exp:'株主資本の計数変動は「純資産の中で勘定科目が変わるだけで、純資産合計は変わらない」。①は資本準備金→資本金（借方に資本準備金、貸方に資本金）。②は利益を積立金へ（借方に繰越利益剰余金、貸方に利益準備金）。配当時に利益準備金の積立義務がある点も重要。',
    e:[{d:[['資本準備金',600000]],c:[['資本金',600000]]},{d:[['繰越利益剰余金',400000]],c:[['利益準備金',400000]]}]
  },

  // ===== 特殊商品売買・収益認識（追加）=====
  { id:403, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（委託販売・委託者の仕訳）A社（委託者）はB社（受託者）に商品（原価240,000円）を積送した。後日、B社から売上計算書（販売額400,000円・受託手数料20,000円・送金額380,000円）が届き現金が振り込まれた。A社の①積送時②計算書受取・入金時③売上原価振替の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①積送時</td><td class="hl">積送品</td><td>240,000</td><td class="hl">仕入</td><td>240,000</td></tr><tr><td>②入金時</td><td>現金</td><td>380,000</td><td class="hl">売上</td><td>400,000</td></tr><tr><td></td><td class="hl">支払手数料</td><td>20,000</td><td></td><td></td></tr><tr><td>③原価振替</td><td class="hl">売上原価</td><td>240,000</td><td class="hl">積送品</td><td>240,000</td></tr></tbody></table>`,
    exp:'委託販売の委託者：①積送時に「仕入（商品）→積送品」へ振り替え（まだ売上ではない）。②売上計算書が届いた時点で収益認識。受託者への手数料は費用（支払手数料）として売上から差し引かない（総額表示）。③同時に積送品の原価を売上原価へ振り替え。',
    e:[{d:[['積送品',240000]],c:[['仕入',240000]]},{d:[['現金',380000],['支払手数料',20000]],c:[['売上',400000]]},{d:[['売上原価',240000]],c:[['積送品',240000]]}]
  },

  { id:404, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（委託販売・受託者の仕訳）B社（受託者）はA社（委託者）から委託された商品を現金400,000円で全量販売した。手数料20,000円を差し引いた380,000円をA社に現金送金した。B社の①販売時②手数料計上③送金時の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①販売時</td><td>現金</td><td>400,000</td><td class="hl">受託販売</td><td>400,000</td></tr><tr><td>②手数料</td><td class="hl">受託販売</td><td>20,000</td><td class="hl">受取手数料</td><td>20,000</td></tr><tr><td>③送金時</td><td class="hl">受託販売</td><td>380,000</td><td>現金</td><td>380,000</td></tr></tbody></table><div class="formula-box">受託者の収益は手数料のみ（受取手数料）。販売代金は委託者への預り金（受託販売）。</div>`,
    exp:'受託者B社にとって委託商品はB社の資産ではなく、売上もB社の収益ではない。販売代金は「受託販売（委託者への預り負債）」で処理。手数料だけがB社の収益（受取手数料）。送金でこの負債（受託販売）が消える。委託者と受託者で収益認識がまったく異なる点が重要。',
    e:[{d:[['現金',400000]],c:[['受託販売',400000]]},{d:[['受託販売',20000]],c:[['受取手数料',20000]]},{d:[['受託販売',380000]],c:[['現金',380000]]}]
  },

  { id:405, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（試用販売・手許商品区分法）A社は商品（原価150,000円）を得意先に試用のため発送した。後日、得意先から購入の意思表示があり代金250,000円を現金で受け取った。A社の①試送時②意思表示受取・代金受取時③売上原価計上の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①試送時</td><td class="hl">試用品</td><td>150,000</td><td class="hl">仕入（商品）</td><td>150,000</td></tr><tr><td>②意思表示時</td><td>現金</td><td>250,000</td><td class="hl">売上</td><td>250,000</td></tr><tr><td>③原価計上</td><td class="hl">仕入（売上原価）</td><td>150,000</td><td class="hl">試用品</td><td>150,000</td></tr></tbody></table><div class="formula-box">売上認識時点：試用販売は「得意先が購入の意思表示をした時点」（出荷時ではない）</div>`,
    exp:'試用販売は「試しに使ってみて、気に入ったら買う」形式。手許商品区分法では①試送時に商品→試用品へ振り替え（まだ売上ではない）。②得意先が「買います」と意思表示した時点で売上を計上（履行義務の充足）。③と同時に試用品を売上原価へ。収益認識基準では「顧客が購入選択権を行使した時点」。',
    e:[{d:[['試用品',150000]],c:[['仕入',150000]]},{d:[['現金',250000]],c:[['売上',250000]]},{d:[['仕入',150000]],c:[['試用品',150000]]}]
  },

  { id:406, level:2, cat:'収益認識', chap:'収益認識・現金預金',
    q:'（割賦販売・収益認識基準）B社は商品（原価200,000円）を割賦で販売した（販売価額450,000円・毎月15,000円×30回払い）。収益認識基準では商品の引渡し時点に全額認識する。①販売（商品引渡）時②初回割賦金受取時の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①販売時（引渡）</td><td class="hl">割賦売掛金</td><td>450,000</td><td class="hl">売上</td><td>450,000</td></tr><tr><td></td><td class="hl">売上原価</td><td>200,000</td><td class="hl">商品</td><td>200,000</td></tr><tr><td>②初回受取</td><td>現金</td><td>15,000</td><td class="hl">割賦売掛金</td><td>15,000</td></tr></tbody></table><div class="formula-box">収益認識基準：商品の「支配の移転」＝引渡時点で売上全額を認識</div>`,
    exp:'旧基準の割賦販売では「代金受取時に売上計上（回収基準）」も選択できたが、収益認識基準（2021年強制適用）では「商品の支配が顧客に移転した時点（＝引渡時）」に全額認識する。割賦売掛金（資産）は毎回の回収で減少。未収分が残高として残る。',
    e:[{d:[['割賦売掛金',450000]],c:[['売上',450000]]},{d:[['売上原価',200000]],c:[['商品',200000]]},{d:[['現金',15000]],c:[['割賦売掛金',15000]]}]
  },

  // ===== リース会計（追加）=====
  { id:407, level:2, cat:'リース会計', chap:'無形資産・リース・引当金',
    q:'ファイナンス・リース取引（利子抜き法）：リース物件の現金購入価額1,000,000円・リース料総額1,200,000円・リース期間5年・年間リース料240,000円（1年目の利息：1,000,000円×4%=40,000円）。①リース開始時②1年目リース料支払時（元本と利息を分けて処理）の仕訳を行いなさい。',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①リース開始</td><td class="hl">リース資産</td><td>1,000,000</td><td class="hl">リース債務</td><td>1,000,000</td></tr><tr><td>②リース料支払</td><td class="hl">リース債務</td><td>200,000</td><td>現金</td><td>240,000</td></tr><tr><td></td><td class="hl">支払利息</td><td>40,000</td><td></td><td></td></tr></tbody></table><div class="formula-box">元本返済額＝240,000－40,000＝200,000円　利息＝1,000,000×4%＝40,000円</div>`,
    exp:'利子抜き法では①開始時にリース資産・リース債務を現金購入価額（現在価値）で計上（利子込み法はリース料総額）。②支払時は元本返済（リース債務減少）と利息（支払利息）を分けて処理。利子込み法はリース債務だけを借方にしてシンプル。日商2級では両方の理解が必要。',
    e:[{d:[['リース資産',1000000]],c:[['リース債務',1000000]]},{d:[['リース債務',200000],['支払利息',40000]],c:[['現金',240000]]}]
  },

  { id:456, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'売買目的で上場株式100株を1株@100円で現金購入した。', en_q:'Purchased 100 shares of trading securities at ¥100 per share in cash.', e:[{d:[['売買目的有価証券',10000]], c:[['現金',10000]]}] , exp:'売買目的有価証券とは「短期売買で利益を稼ぐ目的で持つ株・債券」です。購入時は取得原価で資産に記録します。期末には時価に評価替えし、差額を損益に計上するのが特徴（他の有価証券と異なる点）です。'},
  { id:457, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'帳簿価額10,000円の売買目的有価証券を11,500円で現金売却した。', en_q:'Sold trading securities (book value ¥10,000) for ¥11,500 in cash.', e:[{d:[['現金',11500]], c:[['売買目的有価証券',10000], ['有価証券売却益',1500]]}] , exp:'取得原価（帳簿価額）より高く売れた差額が「有価証券売却益（収益）」です。売却価格11,500円－帳簿価額10,000円＝1,500円の利益。現金が入り、資産（有価証券）が消えます。'},
  { id:458, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'帳簿価額10,000円の売買目的有価証券を8,500円で現金売却した。', en_q:'Sold trading securities (book value ¥10,000) for ¥8,500 in cash.', e:[{d:[['現金',8500], ['有価証券売却損',1500]], c:[['売買目的有価証券',10000]]}] , exp:'取得原価より安く売れた差額が「有価証券売却損（費用）」です。売却価格8,500円－帳簿価額10,000円＝△1,500円の損失。損失を計上しながら現金を受け取り、資産が消えます。'},
  { id:459, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、売買目的有価証券（帳簿価額10,000円）の時価が12,000円となった。', en_q:'At year-end, trading securities (book value ¥10,000) have a fair value of ¥12,000.', e:[{d:[['売買目的有価証券',2000]], c:[['有価証券評価益',2000]]}] , exp:'売買目的有価証券は決算時に時価評価します。帳簿価額10,000円→時価12,000円で2,000円値上がりしているので「有価証券評価益（収益）」を計上し、資産の帳簿価額を時価に引き上げます。'},
  { id:460, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、売買目的有価証券（帳簿価額10,000円）の時価が7,500円となった。', en_q:'At year-end, trading securities (book value ¥10,000) have a fair value of ¥7,500.', e:[{d:[['有価証券評価損',2500]], c:[['売買目的有価証券',2500]]}] , exp:'売買目的有価証券の時価が帳簿価額より下がった場合、「有価証券評価損（費用）」を計上し、資産の帳簿価額を時価まで引き下げます。時価7,500円－帳簿価額10,000円＝△2,500円の評価損です。'},
  { id:461, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'満期保有目的で社債（額面100,000円）を97,000円（残存3年）で現金購入した。', en_q:'Purchased held-to-maturity bonds (face value ¥100,000) for ¥97,000 in cash (3 years remaining).', e:[{d:[['満期保有目的債券',97000]], c:[['現金',97000]]}] , exp:'満期保有目的債券とは「満期まで持ち続けることを決めて購入した社債など」です。時価評価は行いません。額面100,000円を97,000円（割引）で購入した差額3,000円は、満期まで毎期少しずつ受取利息に加算します（償却原価法）。'},
  { id:462, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'上記の満期保有目的債券について、額面100,000円・表面利率2%の利払いを現金で受け取った。', en_q:'Received cash coupon interest on the above held-to-maturity bonds (face ¥100,000, coupon rate 2%).', e:[{d:[['現金',2000]], c:[['有価証券利息',2000]]}] , exp:'社債の利払いは「額面×表面利率」で計算します。100,000円×2%＝2,000円を現金で受け取り、受取利息（収益）に計上します。'},
  { id:463, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'上記の満期保有目的債券（取得97,000円・額面100,000円・残存3年）について、決算時に定額法で償却原価法の処理を行った。', en_q:'Applied the amortized cost method (straight-line) at year-end on held-to-maturity bonds (cost ¥97,000, face ¥100,000, 3 years remaining).', e:[{d:[['満期保有目的債券',1000]], c:[['有価証券利息',1000]]}] , exp:'償却原価法（定額法）：取得価額97,000円と額面100,000円の差額3,000円を残存年数3年で均等配分→毎年1,000円を受取利息に加算し、同額だけ満期保有目的債券の帳簿価額を増やします。満期時には帳簿価額が額面100,000円になります。'},
  { id:464, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'子会社株式200株を1株@500円で現金購入した。', en_q:'Purchased 200 shares of a subsidiary\'s stock at ¥500 per share in cash.', e:[{d:[['子会社株式',100000]], c:[['現金',100000]]}] , exp:'子会社株式とは「議決権の過半数（通常50%超）を保有して支配する会社の株式」です。売買目的ではなく長期保有が前提。時価評価は行わず、取得原価のまま保持します（原価法）。'},
  { id:465, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'関連会社株式150株を1株@400円で現金購入した。', en_q:'Purchased 150 shares of an affiliate\'s stock at ¥400 per share in cash.', e:[{d:[['関連会社株式',60000]], c:[['現金',60000]]}] , exp:'関連会社株式とは「議決権の20%以上50%以下を保有して重要な影響を与える会社の株式」です。子会社株式と同様に原価法で評価し、時価評価はしません。'},
  { id:466, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'その他有価証券（株式）を50,000円で現金購入した。', en_q:'Purchased other securities (equity) for ¥50,000 in cash.', e:[{d:[['その他有価証券',50000]], c:[['現金',50000]]}] , exp:'その他有価証券とは「売買目的でも満期保有目的でも子会社・関連会社でもない有価証券」です。期末に時価評価しますが、評価差額は損益ではなく純資産（その他有価証券評価差額金）に計上します（全部純資産直入法）。'},
  { id:467, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、その他有価証券（帳簿価額50,000円）の時価が55,000円となった（全部純資産直入法）。', en_q:'At year-end, other securities (book ¥50,000) have a fair value of ¥55,000 (full mark-to-market through equity).', e:[{d:[['その他有価証券',5000]], c:[['その他有価証券評価差額金',5000]]}] , exp:'その他有価証券の時価が上昇（5,000円の評価益）。全部純資産直入法では評価差額を損益に計上せず、純資産の部に直接計上します。「その他有価証券評価差額金（純資産）」が増えて資産も増えます。'},
  { id:468, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'決算時、その他有価証券（帳簿価額50,000円）の時価が44,000円となった（全部純資産直入法）。', en_q:'At year-end, other securities (book ¥50,000) have a fair value of ¥44,000 (full mark-to-market through equity, loss)', e:[{d:[['その他有価証券評価差額金',6000]], c:[['その他有価証券',6000]]}] , exp:'その他有価証券の時価が下落（6,000円の評価損）。全部純資産直入法では評価差額を純資産に直接計上します。純資産が減り、資産も減ります。'},
  { id:469, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'子会社から配当金10,000円を現金で受け取った。', en_q:'Received a cash dividend of ¥10,000 from a subsidiary.', e:[{d:[['現金',10000]], c:[['受取配当金',10000]]}] , exp:'配当金は「株主への利益の分配」です。受け取った側は「受取配当金（収益）」として計上します。'},
  { id:470, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'投資有価証券（帳簿価額80,000円）を95,000円で現金売却した。', en_q:'Sold investment securities (book value ¥80,000) for ¥95,000 in cash.', e:[{d:[['現金',95000]], c:[['投資有価証券',80000], ['投資有価証券売却益',15000]]}] , exp:'投資有価証券（その他有価証券・長期保有）を売却した場合、帳簿価額より高く売れた差額が「投資有価証券売却益（収益）」です。売却価格95,000円－帳簿価額80,000円＝15,000円の利益。'},
  { id:471, level:2, cat:'有価証券', chap:'第5章：有価証券', q:'投資有価証券（帳簿価額80,000円）を70,000円で現金売却した。', en_q:'Sold investment securities (book value ¥80,000) for ¥70,000 in cash.', e:[{d:[['現金',70000], ['投資有価証券売却損',10000]], c:[['投資有価証券',80000]]}] , exp:'投資有価証券を帳簿価額より低く売却した場合、差額が「投資有価証券売却損（費用）」です。売却価格70,000円－帳簿価額80,000円＝△10,000円の損失。'},
  { id:472, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、来期に予定している機械の修繕費用20,000円を見積もり、修繕引当金を設定した。', en_q:'At year-end, estimated ¥20,000 for planned machine repairs next period and recorded a provision for repairs.', e:[{d:[['修繕引当金繰入',20000]], c:[['修繕引当金',20000]]}] , exp:'引当金とは「将来発生することが高い費用や損失を、今期の費用として先に計上する仕組み」です。修繕引当金は「来期に予定している機械修繕の費用」を今期に先取りして計上します。費用（修繕引当金繰入）と負債（修繕引当金）が同時に増えます。'},
  { id:473, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'修繕引当金20,000円の計上後、実際に機械の修繕費18,000円を現金で支払った。', en_q:'After recording a provision for repairs of ¥20,000, actually paid ¥18,000 in cash for machine repairs.', e:[{d:[['修繕引当金',18000]], c:[['現金',18000]]}] , exp:'修繕引当金を取り崩して実際の修繕費を処理します。引当金20,000円に対して実際費用18,000円で2,000円が余ったため引当金残高2,000円が残ります。'},
  { id:474, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'修繕引当金15,000円の計上後、実際の修繕費が22,000円となり現金で支払った。', en_q:'After recording a provision for repairs of ¥15,000, the actual repair cost was ¥22,000, paid in cash.', e:[{d:[['修繕引当金',15000], ['修繕費',7000]], c:[['現金',22000]]}] , exp:'引当金15,000円に対して実際費用22,000円で7,000円が超過しました。引当金で賄えない超過分（7,000円）は当期の修繕費として費用計上します。'},
  { id:475, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、役員賞与の支払見込額30,000円について役員賞与引当金を設定した。', en_q:'At year-end, recorded a provision for director bonuses of ¥30,000 expected to be paid.', e:[{d:[['役員賞与引当金繰入',30000]], c:[['役員賞与引当金',30000]]}] , exp:'役員賞与引当金：役員への賞与は現在「発生した期の費用として先取り計上（引当計上）」が原則です。費用（役員賞与引当金繰入）と負債（役員賞与引当金）が増えます。'},
  { id:476, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'役員賞与引当金30,000円を取り崩し、役員賞与を現金で支払った。', en_q:'Reversed the provision for director bonuses of ¥30,000 and paid the bonuses in cash.', e:[{d:[['役員賞与引当金',30000]], c:[['現金',30000]]}] , exp:'引当てた役員賞与を実際に支払います。負債（役員賞与引当金）が消えて現金が減ります。費用の計上は前期（引当時）に済んでいるので、ここでは損益は動きません。'},
  { id:477, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、退職給付見込額の当期負担分50,000円を計上した。', en_q:'At year-end, recorded ¥50,000 as the current-period portion of estimated retirement benefits.', e:[{d:[['退職給付費用',50000]], c:[['退職給付引当金',50000]]}] , exp:'退職給付引当金は「将来の退職金支払いに備えて毎期少しずつ費用を積み立てる」仕組みです。今期の労働に対応する退職給付見込額（50,000円）を費用（退職給付費用）と負債（退職給付引当金）に計上します。'},
  { id:478, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'退職給付引当金200,000円を取り崩し、退職金を現金で支払った。', en_q:'Reversed the retirement benefit provision of ¥200,000 and paid retirement benefits in cash.', e:[{d:[['退職給付引当金',200000]], c:[['現金',200000]]}] , exp:'退職者に退職金を支払います。積み立ててきた引当金（負債）を取り崩して現金支払いに充てます。費用はすでに引当時に計上済みなので損益は動きません。'},
  { id:479, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'決算時、当期販売分の商品保証費用の見積額8,000円について商品保証引当金を設定した。', en_q:'At year-end, recorded a provision for product warranties of ¥8,000 estimated for goods sold this period.', e:[{d:[['商品保証引当金繰入',8000]], c:[['商品保証引当金',8000]]}] , exp:'商品保証引当金：販売した商品の無償修理・交換費用を見積もって当期に先取り計上します。費用（商品保証引当金繰入）と負債（商品保証引当金）が増えます。'},
  { id:480, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'商品保証引当金8,000円があるなか、実際の保証修理費用として11,000円を現金で支払った。', en_q:'With a product warranty provision of ¥8,000, paid ¥11,000 in cash for actual warranty repairs.', e:[{d:[['商品保証引当金',8000], ['商品保証費',3000]], c:[['現金',11000]]}] , exp:'引当金8,000円に対して実際保証費11,000円で3,000円超過。引当金で賄えない超過分（3,000円）は当期の商品保証費として計上します。'},
  { id:481, level:2, cat:'引当金', chap:'無形資産・リース・引当金', q:'前期設定の貸倒引当金5,000円を全額取り崩し（洗替法）、当期末の売掛金残高200,000円に対して3%で再設定した。', en_q:'Reversed last year\'s allowance for doubtful accounts (¥5,000) in full (allowance reset method), then set a new allowance at 3% of the ¥200,000 accounts receivable balance.', e:[{d:[['貸倒引当金',5000]], c:[['貸倒引当金戻入',5000]]}, {d:[['貸倒引当金繰入',6000]], c:[['貸倒引当金',6000]]}] , exp:'洗替法とは「前期の引当金を全額取り崩して（貸倒引当金戻入）から、当期末残高に基づいて新たに引当金を設定し直す方法」です。差額補充法（不足分だけ追加）と並ぶ2つの方法の一つです。'},
  { id:482, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'商品をUSドル建てで輸出し、売掛金1,000ドルが生じた。取引時のレートは1ドル＝150円。', en_q:'Exported goods and recorded an accounts receivable of $1,000 at the transaction date rate of ¥150/USD.', e:[{d:[['売掛金',150000]], c:[['売上',150000]]}] , exp:'外貨建取引では「取引時のレート（取引時レート）」で換算します。1,000ドル×150円＝150,000円。売掛金（資産）と売上（収益）を同額で計上します。'},
  { id:483, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'上記の売掛金1,000ドルが決済され、現金を受け取った。決済時のレートは1ドル＝155円。', en_q:'Collected the above accounts receivable of $1,000 in cash. Settlement rate: ¥155/USD.', e:[{d:[['現金',155000]], c:[['売掛金',150000], ['為替差損益',5000]]}] , exp:'為替差損益：取引時レート150円で記録した売掛金150,000円が、決済時レート155円では155,000円（1,000ドル×155円）に変わります。差額5,000円が「為替差損益（収益）」です。円安で輸出会社は得をします。'},
  { id:484, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'外貨建売掛金1,000ドルが決済され、現金を受け取った。取引時レート150円→決済時レート145円。', en_q:'Collected foreign-currency accounts receivable of $1,000 in cash. Rate fell from ¥150 to ¥145/USD.', e:[{d:[['現金',145000], ['為替差損益',5000]], c:[['売掛金',150000]]}] , exp:'取引時レート150円→決済時レート145円（円高）に変化。1,000ドルの売掛金が150,000円→145,000円に目減り。差額5,000円が「為替差損益（損失側）」です。円高で輸出会社は損をします。'},
  { id:485, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'商品をUSドル建てで輸入し、買掛金500ドルが生じた。取引時のレートは1ドル＝150円。', en_q:'Imported goods and recorded an accounts payable of $500 at the transaction date rate of ¥150/USD.', e:[{d:[['仕入',75000]], c:[['買掛金',75000]]}] , exp:'輸入（買掛金）の取引：1ドル150円で500ドルの商品を仕入れ。75,000円の買掛金（負債）が発生します。'},
  { id:486, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'外貨建買掛金500ドルを現金で決済した。取引時レート150円→決済時レート148円。', en_q:'Paid foreign-currency accounts payable of $500 in cash. Rate fell from ¥150 to ¥148/USD.', e:[{d:[['買掛金',75000]], c:[['現金',74000], ['為替差損益',1000]]}] , exp:'買掛金は取引時レート150円で記録（75,000円）。決済時レート148円（円高）では74,000円で済む→差額1,000円が「為替差損益（利益）」。円高で輸入会社は得をします。'},
  { id:487, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'外貨建買掛金500ドルを現金で決済した。取引時レート150円→決済時レート153円。', en_q:'Paid foreign-currency accounts payable of $500 in cash. Rate rose from ¥150 to ¥153/USD.', e:[{d:[['買掛金',75000], ['為替差損益',1500]], c:[['現金',76500]]}] , exp:'決済時レート153円（円安）では76,500円必要→取引時記録75,000円との差額1,500円が「為替差損益（損失）」。円安で輸入会社は損をします。'},
  { id:488, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'決算時、外貨建売掛金2,000ドルを決算時レート（1ドル＝152円）で換算した。取引時レートは1ドル＝148円。', en_q:'At year-end, translated foreign-currency receivables of $2,000 at the closing rate (¥152/USD). Transaction rate was ¥148/USD.', e:[{d:[['売掛金',8000]], c:[['為替差損益',8000]]}] , exp:'決算時換算：外貨建金銭債権（売掛金）は「決算時レート（CR）」で換算し直します。1,000ドル×取引時148円＝148,000円→決算時152円＝152,000円。4,000円上昇＝為替差損益（収益）。'},
  { id:489, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'決算時、外貨建買掛金1,000ドルを決算時レート（1ドル＝153円）で換算した。取引時レートは1ドル＝150円。', en_q:'At year-end, translated foreign-currency payables of $1,000 at the closing rate (¥153/USD). Transaction rate was ¥150/USD.', e:[{d:[['為替差損益',3000]], c:[['買掛金',3000]]}] , exp:'外貨建金銭債務（買掛金）を決算時レート153円で換算。3,000円増加（借金が増えた）＝為替差損益（損失）。'},
  { id:490, level:2, cat:'外貨建取引', chap:'外貨建・伝票・給与', q:'輸入商品の手付金として前払金200ドルを現金で支払った。支払時のレートは1ドル＝150円。決済時（商品受取時）のレートは155円。', en_q:'Paid a deposit of $200 in cash for imported goods at ¥150/USD. At settlement (goods receipt), rate was ¥155/USD.', e:[{d:[['前払金',30000]], c:[['現金',30000]]}, {d:[['仕入',30000]], c:[['前払金',30000]]}] , exp:'前払金は「契約時のレート（HR）」で換算し、決済時・決算時にレートが変わっても換算替えしません。非貨幣性項目（前払金・商品など）は取引時レート固定が原則です。'},
  { id:491, level:2, cat:'税効果会計', chap:'税効果', q:'決算時、貸倒引当金の損金算入限度超過額20,000円（将来減算一時差異）について、法定実効税率30%で繰延税金資産を計上した。', en_q:'At year-end, recorded a deferred tax asset for a ¥20,000 temporary difference (excess allowance for doubtful accounts over the tax deduction limit) at a 30% statutory effective tax rate.', e:[{d:[['繰延税金資産',6000]], c:[['法人税等調整額',6000]]}] , exp:'繰延税金資産とは「税務上は損金にならないが、将来は損金になる一時差異に対する税金の前払い」です。貸倒引当金の損金算入限度超過分は将来損金化されるので、その税額（20,000×30%＝6,000）を繰延税金資産（資産）として計上します。'},
  { id:492, level:2, cat:'税効果会計', chap:'税効果', q:'前期に計上した繰延税金資産6,000円（将来減算一時差異20,000円×30%）が当期に解消した。', en_q:'The deferred tax asset of ¥6,000 recorded last year (¥20,000 temporary difference × 30%) was reversed this period.', e:[{d:[['法人税等調整額',6000]], c:[['繰延税金資産',6000]]}] , exp:'前期に計上した繰延税金資産が解消すると、繰延税金資産（資産）を取り崩します。「法人税等調整額（費用増加）」として損益に影響します。'},
  { id:493, level:2, cat:'税効果会計', chap:'税効果', q:'固定資産の減価償却費について、会計上の償却額500,000円に対し税務上の損金算入額が300,000円だった。差額200,000円に対して実効税率30%で税効果を計上する。', en_q:'Depreciation for tax was ¥300,000 vs. accounting depreciation of ¥500,000. Record tax effect on the ¥200,000 difference (taxable temporary difference) at a 30% rate.', e:[{d:[['法人税等調整額',60000]], c:[['繰延税金負債',60000]]}] , exp:'税務上の減価償却費が会計上より少ない場合、差額は「将来課税される一時差異（将来加算一時差異）」→繰延税金負債（負債）を計上します。法人税等調整額（法人税の減少）が貸方になります。'},
  { id:494, level:2, cat:'税効果会計', chap:'税効果', q:'前期に計上した繰延税金負債60,000円が当期に解消した（固定資産の一時差異200,000円が解消）。', en_q:'The deferred tax liability of ¥60,000 recorded last year reversed this period.', e:[{d:[['繰延税金負債',60000]], c:[['法人税等調整額',60000]]}] , exp:'前期に計上した繰延税金負債が解消すると、繰延税金負債（負債）を取り崩して法人税等調整額（費用）を計上します。タイミング差異が解消し、税金を実際に払う段階です。'},
  { id:495, level:2, cat:'税効果会計', chap:'税効果', q:'その他有価証券（評価差額5,000円の評価益）について、実効税率30%で税効果を同時計上した（全部純資産直入法）。', en_q:'Recorded a tax effect (30% rate) alongside the ¥5,000 unrealized gain on other securities under the full mark-to-market equity method.', e:[{d:[['その他有価証券',5000]], c:[['繰延税金負債',1500], ['その他有価証券評価差額金',3500]]}] , exp:'その他有価証券の評価差額（5,000円）に対して税効果を計上する場合、税額分（5,000×30%＝1,500円）を繰延税金負債（負債）に、残額（3,500円）を純資産（その他有価証券評価差額金）に計上します。'},
  { id:496, level:2, cat:'税効果会計', chap:'税効果', q:'当期の税引前当期純利益は500,000円。法人税等（当期税額）は160,000円、税効果調整後の法人税等調整額は△6,000円（繰延税金資産6,000円の計上）。', en_q:'Pre-tax income is ¥500,000. Current tax expense is ¥160,000; deferred tax benefit is ¥6,000 (deferred tax asset). Record the net income tax expense.', e:[{d:[['法人税等',160000]], c:[['未払法人税等',160000]]}, {d:[['繰延税金資産',6000]], c:[['法人税等調整額',6000]]}] , exp:'法人税等（当期税額）を未払計上し損益に費用計上。繰延税金資産の計上で法人税等調整額（法人税の減少）6,000円を計上。純粋な税負担＝160,000－6,000＝154,000円。'},
  { id:497, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本店が支店へ現金50,000円を送付した（本店側の仕訳）。', en_q:'The head office sent ¥50,000 in cash to the branch (head office entry).', e:[{d:[['支店',50000]], c:[['現金',50000]]}] , exp:'本支店会計では「支店勘定（本店）」と「本店勘定（支店）」という内部取引勘定を使います。本店から支店へ現金を送ると：本店側は「支店（資産）が増え、現金が減る」。'},
  { id:498, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'支店が本店から現金50,000円を受け取った（支店側の仕訳）。', en_q:'The branch received ¥50,000 in cash from the head office (branch entry).', e:[{d:[['現金',50000]], c:[['本店',50000]]}] , exp:'支店から見た仕訳：現金50,000円を受け取り、「本店（負債の一種、本店に対する債務）」が増えます。本店側の「支店（資産）」と支店側の「本店（負債）」は常に対称的な金額になります。'},
  { id:499, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本店が支店へ原価80,000円の商品を送付した（本店側の仕訳）。', en_q:'The head office shipped goods costing ¥80,000 to the branch (head office entry).', e:[{d:[['支店',80000]], c:[['仕入',80000]]}] , exp:'本店が支店へ商品を送付：本店側では「仕入（費用）が減って支店（資産）が増える」取引です。仕入勘定から支店勘定へ原価が移転します。'},
  { id:500, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'支店が本店から商品80,000円を受け取った（支店側の仕訳）。', en_q:'The branch received goods worth ¥80,000 from the head office (branch entry).', e:[{d:[['仕入',80000]], c:[['本店',80000]]}] , exp:'支店が本店から商品を受け取る：支店側では「仕入（費用）が増えて本店（負債類似勘定）が増える」。本店側の支店勘定と支店側の本店勘定は常に一致するはずです。'},
  { id:501, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'支店の当期純利益30,000円を本店に報告した（支店側の仕訳）。', en_q:'The branch reported its net income of ¥30,000 to the head office (branch entry).', e:[{d:[['損益',30000]], c:[['本店',30000]]}] , exp:'支店の決算で純利益が確定すると、支店側は「損益（集計勘定）を本店（内部勘定）に振り替え」て支店帳簿を締めます。本店側は「支店（資産）が増え、損益（収益）が増える」受取仕訳を切ります。'},
  { id:502, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本支店合算財務諸表の作成にあたり、支店勘定（資産・本店側）80,000円と本店勘定（負債・支店側）80,000円を相殺消去した。', en_q:'When preparing combined head office-branch financial statements, eliminated the intercompany branch/head office balances of ¥80,000 against each other.', e:[{d:[['本店',80000]], c:[['支店',80000]]}] , exp:'本支店合算財務諸表作成時に、本店の「支店（資産）」と支店の「本店（負債相当）」を相殺消去します。グループ内の取引を外部報告から除外するためです。'},
  { id:503, level:2, cat:'本支店会計', chap:'本支店・連結・個人事業主', q:'本店は支店の当期純利益30,000円を受け取り、本店の損益勘定に振り替えた（本店側の仕訳）。', en_q:'The head office received the branch\'s net income of ¥30,000 and transferred it to its own income account (head office entry).', e:[{d:[['支店',30000]], c:[['損益',30000]]}] , exp:'本店は支店の純利益30,000円を「支店（資産）の増加」として受け取り、本店の損益（収益）に振り替えます。これにより本店の利益に支店の利益が加算されます。'},
  { id:504, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親会社がA社株式の60%（取得原価240,000円）を取得した。A社の純資産は350,000円（資本金200,000円、利益剰余金150,000円）。連結開始仕訳（投資と資本の相殺消去）を行いなさい。のれんも計上すること。', en_q:'Parent acquired 60% of A Co. (cost ¥240,000). A Co.\'s net assets: capital ¥200,000, retained earnings ¥150,000. Prepare the consolidation entry (elimination of investment vs. equity). Include goodwill.', e:[{d:[['資本金',200000], ['利益剰余金',150000], ['のれん',30000]], c:[['子会社株式',240000], ['非支配株主持分',140000]]}] , exp:'のれん計算：取得原価240,000円－子会社の持分（350,000円×60%＝210,000円）＝のれん30,000円。非支配株主持分（40%分）：350,000円×40%＝140,000円。投資消去仕訳は連結の最重要仕訳です。'},
  { id:505, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'のれん30,000円について、10年で均等償却した（当期分）。', en_q:'Amortized goodwill of ¥30,000 on a straight-line basis over 10 years (current year portion).', e:[{d:[['のれん償却',3000]], c:[['のれん',3000]]}] , exp:'のれんは「超過収益力に対して払った割増代金」です。定額法で20年以内に償却（日本基準）。毎年のれん償却（費用）を計上し、のれん（資産）の帳簿価額を減らします。'},
  { id:506, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'連結上、子会社の当期純利益60,000円のうち、非支配株主持分（40%）へ利益を配分する連結修正仕訳を行いなさい。', en_q:'In consolidation, allocate the non-controlling interests\' share (40%) of the subsidiary\'s net income of ¥60,000.', e:[{d:[['非支配株主に帰属する当期純利益',24000]], c:[['非支配株主持分',24000]]}] , exp:'非支配株主持分の利益配分：子会社の純利益60,000円のうち非支配株主（40%）の取り分24,000円を「非支配株主に帰属する当期純利益（費用）」として計上し、非支配株主持分（純資産）に加算します。'},
  { id:507, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'子会社が配当金20,000円を宣言し支払った。親会社（60%保有）は12,000円の配当を受け取っている。連結修正仕訳を行いなさい。', en_q:'Subsidiary declared and paid dividends of ¥20,000. Parent (60% ownership) received ¥12,000. Prepare the consolidation elimination entry.', e:[{d:[['受取配当金',12000], ['非支配株主持分',8000]], c:[['利益剰余金',20000]]}] , exp:'子会社の配当金は連結上、内部取引として消去します。親会社が受け取った受取配当金12,000円と非支配株主持分8,000円の合計20,000円を利益剰余金から差し引きます。'},
  { id:508, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親子会社間の売上・仕入取引500,000円を連結上で相殺消去した。', en_q:'Eliminated intercompany sales/purchases of ¥500,000 in consolidation.', e:[{d:[['売上高',500000]], c:[['売上原価',500000]]}] , exp:'親子間売買は連結上「自社内取引」なので消去します。親から子へ売った売上（収益）と子側の仕入（売上原価）を相殺消去します。'},
  { id:509, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親子会社間の売掛金・買掛金80,000円を連結上で相殺消去した。', en_q:'Eliminated intercompany accounts receivable/payable of ¥80,000 in consolidation.', e:[{d:[['買掛金',80000]], c:[['売掛金',80000]]}] , exp:'親子間の売掛金（親の資産）と買掛金（子の負債）は連結上の内部債権債務です。連結B/Sから相殺消去して外部に対する純粋な債権債務だけを表示します。'},
  { id:510, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'親会社が子会社へ原価40,000円の商品を60,000円で販売した。期末に子会社の在庫にこの商品が全量残っている。ダウンストリームの未実現利益を消去しなさい。', en_q:'Parent sold goods (cost ¥40,000) to subsidiary for ¥60,000. All goods remain in subsidiary\'s closing inventory. Eliminate the downstream unrealized profit.', e:[{d:[['売上原価',20000]], c:[['棚卸資産',20000]]}] , exp:'未実現利益とは「親子間取引で発生した利益のうち、まだグループ外に実現していないもの」です。期末在庫に含まれる内部利益20,000円を消去します。連結P/Lの売上原価が増加し、B/Sの棚卸資産が減少します。'},
  { id:511, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'子会社が親会社へ原価30,000円の商品を45,000円で販売した。期末に親会社の在庫に全量残っている。アップストリームの未実現利益を消去し、非支配株主持分への影響も処理しなさい（非支配株主40%）。', en_q:'Subsidiary sold goods (cost ¥30,000) to parent for ¥45,000. All goods remain in parent\'s closing inventory. Eliminate the upstream unrealized profit and adjust non-controlling interests (40%).', e:[{d:[['売上原価',15000]], c:[['棚卸資産',15000]]}, {d:[['非支配株主持分',6000]], c:[['非支配株主に帰属する当期純利益',6000]]}] , exp:'アップストリーム（子→親の販売）の未実現利益15,000円を消去します。かつ非支配株主も负担するため、非支配株主持分も6,000円（15,000×40%）減少させます。'},
  { id:512, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'連結上、親会社が子会社に対して貸付金100,000円を持ち、子会社は同額の借入金を持っている。内部取引として相殺消去しなさい。', en_q:'In consolidation, the parent has a loan receivable of ¥100,000 from the subsidiary, and the subsidiary has the corresponding borrowing. Eliminate the intercompany loan.', e:[{d:[['借入金',100000]], c:[['貸付金',100000]]}] , exp:'連結上、親子間の貸付金（親の資産）と借入金（子の負債）は内部取引です。相殺消去して連結B/Sから除きます。'},
  { id:513, level:2, cat:'連結会計', chap:'本支店・連結・個人事業主', q:'前期末に消去した子会社在庫の未実現利益20,000円（ダウンストリーム）を当期首に再振替（実現）させる開始仕訳を行いなさい。', en_q:'Reverse last year\'s elimination of ¥20,000 downstream unrealized profit in the opening consolidation entry (the profit is now realized).', e:[{d:[['棚卸資産',20000]], c:[['売上原価',20000]]}] , exp:'前期の未実現利益消去仕訳を当期首に「逆に」入れる開始仕訳です。前期末に消去した棚卸資産の内部利益が当期に実現（売却）されたとみなすために逆仕訳を計上します。'},
  { id:514, level:2, cat:'材料費', chap:'工業簿記', q:'素材300,000円を掛けで購入し、引取運賃5,000円を現金で支払った。', en_q:'Purchased raw materials for ¥300,000 on credit and paid ¥5,000 in cash for freight-in.', e:[{d:[['材料',305000]], c:[['買掛金',300000], ['現金',5000]]}] , exp:'材料を購入するとき、引取運賃（材料副費）は取得原価に含めます。材料の取得原価＝購入代価300,000円＋引取運賃5,000円＝305,000円。'},
  { id:515, level:2, cat:'材料費', chap:'工業簿記', q:'材料200,000円を直接材料として製造に投入した。', en_q:'Issued ¥200,000 of materials as direct materials into production.', e:[{d:[['仕掛品',200000]], c:[['材料',200000]]}] , exp:'直接材料費とは「製品に直接使われる材料のコスト」です。材料倉庫から製造現場へ投入した材料は「材料（資産）→仕掛品（資産）」に振り替えます。'},
  { id:516, level:2, cat:'材料費', chap:'工業簿記', q:'材料30,000円を間接材料として工場で消費した。', en_q:'Consumed ¥30,000 of materials as indirect materials in the factory.', e:[{d:[['製造間接費',30000]], c:[['材料',30000]]}] , exp:'間接材料費とは「補助的に使う材料のコスト」です。どの製品に使ったか特定できないため、「材料→製造間接費」に振り替えます。後で製品に配賦されます。'},
  { id:517, level:2, cat:'材料費', chap:'工業簿記', q:'期末材料の帳簿棚卸高50,000円に対し実地棚卸高は47,000円であった。棚卸減耗を計上しなさい。', en_q:'The book balance of materials at period-end is ¥50,000; the physical count shows ¥47,000. Record the inventory shortage.', e:[{d:[['棚卸減耗損',3000]], c:[['材料',3000]]}] , exp:'棚卸減耗損は「帳簿上の数量と実際の数量の差のコスト」です。帳簿50,000円－実際47,000円＝3,000円の減耗。材料（資産）を減らして棚卸減耗損（費用）を計上します。'},
  { id:518, level:2, cat:'労務費', chap:'工業簿記', q:'当月の賃金250,000円を現金で支払った（賃金の支払い）。', en_q:'Paid ¥250,000 in wages for the current month in cash.', e:[{d:[['賃金',250000]], c:[['現金',250000]]}] , exp:'賃金は「工員への支払い」です。支払い時は賃金（費用）と現金（資産）の減少として記録。後から直接工の賃金は「仕掛品」、間接工の賃金は「製造間接費」に振り替えます。'},
  { id:519, level:2, cat:'労務費', chap:'工業簿記', q:'当月消費した賃金180,000円（直接労務費）と70,000円（間接労務費）を製造勘定に振り替えた。', en_q:'Transferred ¥180,000 of direct labor and ¥70,000 of indirect labor to manufacturing accounts.', e:[{d:[['仕掛品',180000], ['製造間接費',70000]], c:[['賃金',250000]]}] , exp:'賃金の消費振替：支払った賃金250,000円を直接労務費180,000円（仕掛品へ）と間接労務費70,000円（製造間接費へ）に分けて振り替えます。'},
  { id:520, level:2, cat:'労務費', chap:'工業簿記', q:'月末に賃金の未払分30,000円を見越し計上した。', en_q:'Accrued unpaid wages of ¥30,000 at month-end.', e:[{d:[['賃金',30000]], c:[['未払賃金',30000]]}] , exp:'月末に未払の賃金（翌月以降に支払う今月分）を見越し計上します。賃金（費用）と未払賃金（負債）を計上し、翌期首に再振替します。'},
  { id:521, level:2, cat:'経費', chap:'工業簿記', q:'外注加工費60,000円が確定し、掛けで計上した（直接経費）。', en_q:'Recorded ¥60,000 of subcontracting costs (direct expenses) on credit.', e:[{d:[['仕掛品',60000]], c:[['買掛金',60000]]}] , exp:'外注加工費とは「外部業者に依頼した加工作業のコスト」で直接経費の代表例です。どの製品に使ったか特定できるので「仕掛品（資産）」に直接振り替えます。'},
  { id:522, level:2, cat:'経費', chap:'工業簿記', q:'工場設備の減価償却費40,000円を間接経費として計上した。', en_q:'Recorded ¥40,000 of factory equipment depreciation as indirect expenses.', e:[{d:[['製造間接費',40000]], c:[['減価償却累計額',40000]]}] , exp:'工場設備の減価償却費は間接経費です。製造間接費（費用集計勘定）に振り替えます。後で製品への配賦が行われます。'},
  { id:523, level:2, cat:'経費', chap:'工業簿記', q:'工場の水道光熱費20,000円（間接経費）と事務所の電気代8,000円（販売費及び一般管理費）を現金で支払った。', en_q:'Paid ¥20,000 for factory utilities (indirect manufacturing expense) and ¥8,000 for office electricity (SG&A) in cash.', e:[{d:[['製造間接費',20000], ['水道光熱費',8000]], c:[['現金',28000]]}] , exp:'工場費用（製造間接費）と販管費の区分が重要です。工場の水道光熱費は製造原価（製造間接費）、事務所の電気代は期間費用（販売費及び一般管理費）として分けて計上します。'},
  { id:524, level:2, cat:'製造間接費', chap:'工業簿記', q:'当月の製造間接費を予定配賦率（直接作業時間1時間あたり500円）で配賦した。当月の直接作業時間は200時間。', en_q:'Applied manufacturing overhead using a predetermined rate of ¥500 per direct labor hour × 200 hours this month.', e:[{d:[['仕掛品',100000]], c:[['製造間接費',100000]]}] , exp:'製造間接費の予定配賦：「標準配賦率×実際作業時間」で配賦額を計算し、仕掛品に加算します。500円/h×200h＝100,000円。実際発生額との差異は後で分析します。'},
  { id:525, level:2, cat:'製造間接費', chap:'工業簿記', q:'当月の製造間接費実際発生額は108,000円、予定配賦額は100,000円だった。製造間接費配賦差異を把握しなさい。', en_q:'Actual manufacturing overhead was ¥108,000; applied overhead was ¥100,000. Record the overhead variance.', e:[{d:[['製造間接費配賦差異',8000]], c:[['製造間接費',8000]]}] , exp:'配賦差異＝実際発生額108,000円－予定配賦額100,000円＝8,000円（不利差異）。実際のコストが予定より多かったので「製造間接費配賦差異（費用）」を計上します。'},
  { id:526, level:2, cat:'製造間接費', chap:'工業簿記', q:'当月の製造間接費実際発生額は95,000円、予定配賦額は100,000円だった。有利差異（配賦超過）を把握しなさい。', en_q:'Actual manufacturing overhead was ¥95,000; applied overhead was ¥100,000. Record the favorable overhead variance.', e:[{d:[['製造間接費',5000]], c:[['製造間接費配賦差異',5000]]}] , exp:'予定配賦額100,000円－実際発生額95,000円＝5,000円の有利差異。実際より多く配賦したので差異は貸方に残ります。'},
  { id:527, level:2, cat:'個別原価計算', chap:'工業簿記', q:'製造指図書No.1の製品が完成した。直接材料費100,000円・直接労務費80,000円・製造間接費50,000円。製品勘定へ振り替えなさい。', en_q:'Job No.1 was completed. Direct materials ¥100,000, direct labor ¥80,000, manufacturing overhead ¥50,000. Transfer to finished goods.', e:[{d:[['製品',230000]], c:[['仕掛品',230000]]}] , exp:'個別原価計算では製造指図書（ジョブ）ごとに原価を集計します。指図書No.1が完成したので、仕掛品を製品勘定に振り替えます。'},
  { id:528, level:2, cat:'個別原価計算', chap:'工業簿記', q:'完成した製品（原価230,000円）を280,000円で掛けで販売した。売上原価も計上しなさい。', en_q:'Sold finished goods (cost ¥230,000) for ¥280,000 on credit. Also record cost of goods sold.', e:[{d:[['売掛金',280000]], c:[['売上',280000]]}, {d:[['売上原価',230000]], c:[['製品',230000]]}] , exp:'完成品の販売：売上（収益）を認識すると同時に、売上原価（費用）として製品の帳簿価額を計上します。'},
  { id:529, level:2, cat:'部門別原価計算', chap:'工業簿記', q:'補助部門費（動力部門20,000円・修繕部門15,000円）を製造部門（第1製造部門・第2製造部門）へ配賦した。第1製造部門へ：動力12,000円・修繕10,000円。第2製造部門へ：動力8,000円・修繕5,000円。', en_q:'Allocated service department costs (power dept. ¥20,000, maintenance dept. ¥15,000) to manufacturing departments: Dept.1 gets power ¥12,000 + maintenance ¥10,000; Dept.2 gets power ¥8,000 + maintenance ¥5,000.', e:[{d:[['第1製造部門費',22000], ['第2製造部門費',13000]], c:[['動力部門費',20000], ['修繕部門費',15000]]}] , exp:'部門別原価計算では補助部門（サービス部門）のコストを製造部門に配賦します。配賦基準（電力使用量・修繕時間など）に基づいて按分します。'},
  { id:530, level:2, cat:'総合原価計算', chap:'工業簿記', q:'当月の製造費用：直接材料費180,000円・加工費120,000円。月初仕掛品なし。完成品400個・月末仕掛品100個（加工進捗度40%）。平均法で月末仕掛品原価を計算し、完成品原価を求めなさい。', en_q:'Manufacturing costs: direct materials ¥180,000, conversion costs ¥120,000. No opening WIP. Completed 400 units; closing WIP 100 units (40% complete). Using average method, calculate closing WIP cost and cost of completed units.', e:[{d:[['製品',255000]], c:[['仕掛品',255000]]}] , exp:'総合原価計算の平均法：「期首仕掛品＋当月投入」の合計コストを「完成品数量＋月末仕掛品換算量」で割って平均単価を求めます。材料費は工程の最初に全量投入される場合が多いです。'},
  { id:531, level:2, cat:'総合原価計算', chap:'工業簿記', q:'先入先出法：月初仕掛品200個（進捗度50%、材料費20,000円・加工費10,000円）、当月投入材料費100,000円・加工費90,000円、完成品600個、月末仕掛品100個（進捗度60%）。完成品原価を求めなさい。', en_q:'FIFO method: Opening WIP 200 units (50% complete, materials ¥20,000, conversion ¥10,000); current costs materials ¥100,000, conversion ¥90,000; completed 600 units; closing WIP 100 units (60% complete). Find cost of completed units.', e:[{d:[['製品',185500]], c:[['仕掛品',185500]]}] , exp:'総合原価計算の先入先出法：月初仕掛品（前期着手分）と当月投入分を分けて計算します。月初仕掛品は先に完成したとみなし、当月投入分で残りの完成品と月末仕掛品を賄うと考えます。'},
  { id:532, level:2, cat:'総合原価計算', chap:'工業簿記', q:'工程別総合原価計算：第1工程完了品は第2工程の前工程費となる。第1工程完成品原価160,000円（400個）を第2工程仕掛品（前工程費）に振り替えなさい。', en_q:'Process cost accounting: Transfer the cost of 400 completed units from Process 1 (¥160,000) as prior-process costs to Process 2 WIP.', e:[{d:[['第2工程仕掛品',160000]], c:[['第1工程仕掛品',160000]]}] , exp:'工程別総合原価計算：製品が複数工程を経て完成する場合、各工程で原価を集計します。第1工程の完成品原価（前工程費）は第2工程の仕掛品に引き継がれます。'},
  { id:533, level:2, cat:'標準原価計算', chap:'工業簿記', q:'完成品300個の標準原価を仕掛品から製品勘定に振り替えた。標準原価：直接材料費@200円・直接労務費@150円・製造間接費@100円。', en_q:'Transferred the standard cost of 300 completed units to finished goods. Standard: DM @¥200, DL @¥150, OH @¥100 per unit.', e:[{d:[['製品',135000]], c:[['仕掛品',135000]]}] , exp:'標準原価計算では「あるべきコスト（標準原価）」を事前に設定します。完成品300個の標準原価を仕掛品から製品に振り替えます。'},
  { id:534, level:2, cat:'標準原価計算', chap:'工業簿記', q:'直接材料費差異を分析した。実際購入単価@210円×実際消費量320kg、標準単価@200円×標準消費量300kg。価格差異と数量差異を計上しなさい。', en_q:'Analyze direct material variances. Actual: @¥210 × 320 kg; Standard: @¥200 × 300 kg. Record price variance and usage variance.', e:[{d:[['直接材料費差異',7200]], c:[['仕掛品',7200]]}] , exp:'直接材料費差異＝実際原価－標準原価＝7,200円（不利）。差異の原因は「単価が高かった（価格差異）」か「量を使いすぎた（数量差異）」かで分解して分析します。'},
  { id:535, level:2, cat:'標準原価計算', chap:'工業簿記', q:'上記の直接材料費差異7,200円（不利差異）を価格差異と数量差異に分解しなさい。価格差異＝（@210－@200）×320＝3,200円（不利）、数量差異＝@200×（320－300）＝4,000円（不利）。', en_q:'Break down the ¥7,200 unfavorable DM variance: price variance = (¥210−¥200)×320 = ¥3,200 unfav.; usage variance = ¥200×(320−300) = ¥4,000 unfav.', e:[{d:[['直接材料費価格差異',3200], ['直接材料費数量差異',4000]], c:[['直接材料費差異',7200]]}] , exp:'価格差異＝（実際単価@210－標準単価@200）×実際消費量320kg＝3,200円（不利）。数量差異＝標準単価@200×（実際320kg－標準300kg）＝4,000円（不利）。計7,200円。'},
  { id:536, level:2, cat:'標準原価計算', chap:'工業簿記', q:'直接労務費差異を分析した。実際賃率@550円×実際作業時間200h、標準賃率@500円×標準作業時間180h。賃率差異と時間差異を計上しなさい。', en_q:'Analyze direct labor variances. Actual: @¥550 × 200h; Standard: @¥500 × 180h. Record rate variance and efficiency variance.', e:[{d:[['直接労務費差異',20000]], c:[['仕掛品',20000]]}] , exp:'直接労務費差異＝実際原価－標準原価＝20,000円（不利）。賃率差異（単価のズレ）と作業時間差異（時間のズレ）に分解して原因分析します。'},
  { id:537, level:2, cat:'標準原価計算', chap:'工業簿記', q:'上記の直接労務費差異20,000円（不利）を賃率差異と作業時間差異に分解しなさい。賃率差異＝（@550－@500）×200＝10,000（不利）、時間差異＝@500×（200－180）＝10,000（不利）。', en_q:'Break down the ¥20,000 unfavorable DL variance: rate variance = (¥550−¥500)×200 = ¥10,000 unfav.; efficiency variance = ¥500×(200−180) = ¥10,000 unfav.', e:[{d:[['直接労務費賃率差異',10000], ['直接労務費時間差異',10000]], c:[['直接労務費差異',20000]]}] , exp:'賃率差異＝（実際賃率@550－標準賃率@500）×実際時間200h＝10,000円（不利）。時間差異＝標準賃率@500×（実際200h－標準180h）＝10,000円（不利）。計20,000円。'},
  { id:538, level:2, cat:'標準原価計算', chap:'工業簿記', q:'製造間接費差異を分析した。実際発生額32,000円、予定配賦額（標準配賦率@100×標準作業時間180h）＝18,000円。予算差異と操業度差異を求めなさい。固定費予算18,000円（変動費ゼロと仮定）、基準操業度200h。', en_q:'Analyze OH variances. Actual ¥32,000; applied (¥100×180h)=¥18,000. Fixed OH budget ¥18,000 (zero variable), normal capacity 200h. Find budget variance and volume variance.', e:[{d:[['製造間接費差異',14000]], c:[['仕掛品',14000]]}] , exp:'製造間接費差異＝実際発生額32,000円－予定配賦額18,000円＝14,000円（不利）。予算差異（固定費予算との比較）と操業度差異（基準操業度との差）に分解します。'},
  { id:539, level:2, cat:'標準原価計算', chap:'工業簿記', q:'期末に原価差異（直接材料費差異7,200円・直接労務費差異20,000円・製造間接費差異14,000円）を売上原価に振り替えた。', en_q:'At period-end, closed all cost variances (DM ¥7,200, DL ¥20,000, OH ¥14,000) to cost of goods sold.', e:[{d:[['売上原価',41200]], c:[['直接材料費差異',7200], ['直接労務費差異',20000], ['製造間接費差異',14000]]}] , exp:'期末に各原価差異を売上原価に振り替えます。差異が不利（コストオーバー）の場合は売上原価が増加し、有利差異の場合は減少します。'},
  { id:540, level:2, cat:'収益認識', chap:'収益認識・現金預金', q:'工事進行基準：工事請負額500,000円、工事原価総見積額400,000円、当期発生工事原価100,000円（進捗率25%）。当期の収益と費用を計上しなさい。', en_q:'Percentage-of-completion: Contract price ¥500,000, total estimated cost ¥400,000, actual cost incurred ¥100,000 (25% complete). Record current-period revenue and expense.', e:[{d:[['工事未収金',125000]], c:[['完成工事高',125000]]}, {d:[['完成工事原価',100000]], c:[['工事原価',100000]]}] , exp:'工事進行基準：進捗率（25%）に応じて当期分の収益500,000×25%＝125,000円を認識します。費用も対応する当期発生分100,000円を計上します（費用収益対応の原則）。'},
  { id:541, level:2, cat:'収益認識', chap:'収益認識・現金預金', q:'返品権付き販売：商品100,000円（原価70,000円）を掛けで販売した。過去実績から10%（10,000円）の返品が見込まれる。', en_q:'Sale with right of return: sold goods for ¥100,000 (cost ¥70,000) on credit. Historical return rate: 10% (¥10,000 expected).', e:[{d:[['売掛金',100000]], c:[['売上',90000], ['返品負債',10000]]}, {d:[['売上原価',63000], ['返品資産',7000]], c:[['棚卸資産',70000]]}] , exp:'返品権付き販売：予想返品分（10,000円）を返品負債（負債）として取り置き、確実に実現した分（90,000円）だけを売上として認識します。返品予想分に対応する売上原価も「返品資産」として資産計上します。'},
  { id:542, level:2, cat:'収益認識', chap:'収益認識・現金預金', q:'ポイント付与：商品50,000円を現金販売し、購入額の2%相当のポイント（1,000円分）を顧客に付与した。ポイントは独立販売価格として考慮する。', en_q:'Loyalty points: Sold goods for ¥50,000 in cash and granted points worth ¥1,000 (2% of purchase). Allocate revenue between goods and points based on stand-alone selling prices.', e:[{d:[['現金',50000]], c:[['売上',49020], ['契約負債',980]]}] , exp:'ポイント付与：売上50,000円のうちポイント（1,000円分）は「まだ果たしていない義務（契約負債）」なので収益から除きます。商品の独立販売価格49,000円だけを売上として認識します（収益認識基準の履行義務の配分）。'},
  { id:543, level:2, cat:'銀行勘定調整', chap:'収益認識・現金預金', q:'銀行勘定調整表：銀行残高証明書の残高は200,000円、当社帳簿残高は195,000円。差異の内訳：①時間外預入5,000円（銀行未処理）②未取立小切手8,000円（銀行未処理）③手数料2,000円（当社未記帳）。銀行側・当社側の修正仕訳（当社側のみ）を行いなさい。', en_q:'Bank reconciliation: Bank statement ¥200,000, book balance ¥195,000. Items: ①deposit in transit ¥5,000 (unprocessed by bank); ②outstanding check ¥8,000 (unprocessed by bank); ③bank service charge ¥2,000 (not yet booked). Record only the company-side adjusting entry.', e:[{d:[['支払手数料',2000]], c:[['当座預金',2000]]}] , exp:'銀行勘定調整：銀行未処理の項目（時間外預入・未取立小切手）は当社の修正不要。当社が記帳していない手数料→当社側で「支払手数料（費用）・当座預金（資産）」を計上して帳簿を修正します。'},
  { id:544, level:2, cat:'銀行勘定調整', chap:'収益認識・現金預金', q:'銀行から得意先振込の通知があったが、当社はまだ帳簿に記帳していなかった。振込額30,000円を当座預金に計上しなさい。', en_q:'The bank notified the company of a customer\'s wire transfer of ¥30,000, which has not yet been recorded in the books. Record the deposit.', e:[{d:[['当座預金',30000]], c:[['売掛金',30000]]}] , exp:'銀行が先に処理（振込通知）している得意先の入金を、当社が未記帳の場合は当社側で当座預金（資産）と売掛金（資産の減少）を計上します。銀行残高証明書と帳簿の差異調整です。'},
  { id:545, level:3, cat:'個人事業主', chap:'本支店・連結・個人事業主', q:'個人事業主が事業用の現金50,000円を生活費として引き出した（引出金を使用）。', en_q:'A sole proprietor withdrew ¥50,000 in business cash for personal living expenses (use owner\'s drawings account).', e:[{d:[['引出金（事業主貸）',50000]], c:[['現金',50000]]}] , exp:'個人事業主は「事業と個人（家計）が法的に同一」のため、事業のお金を生活費に使う場合は「引出金（事業主貸）」という科目を使います。決算時に元入金（資本）と相殺します。'},
  { id:546, level:3, cat:'個人事業主', chap:'本支店・連結・個人事業主', q:'個人事業主が私的な口座から事業用口座へ80,000円を振り込んだ（事業主借を使用）。', en_q:'A sole proprietor transferred ¥80,000 from a personal account to the business account (use owner\'s contribution account).', e:[{d:[['普通預金',80000]], c:[['事業主借',80000]]}] , exp:'個人事業主が私財を事業に投入する場合は「事業主借」を使います。会社で言えば「資本金の増加」に近い概念ですが、個人事業では事業主借（負債類似）で処理します。'},
  { id:547, level:3, cat:'個人事業主', chap:'本支店・連結・個人事業主', q:'決算時、引出金（事業主貸）の残高120,000円を元入金に振り替えた。', en_q:'At year-end, transferred the owner\'s drawings balance of ¥120,000 to the capital account.', e:[{d:[['元入金',120000]], c:[['引出金（事業主貸）',120000]]}] , exp:'決算時に引出金（事業主貸）と事業主借の残高を元入金（純資産）に振り替えます。引出金（生活費引出し）は元入金を減らし、事業主借（私財投入）は元入金を増やします。'},

  // ===== 工業簿記：費目別計算（材料費） =====
  { id:548, level:2, cat:'工業簿記', chap:'工業簿記',

  { id:669, level:2, cat:'商品', chap:'第1章：商品売買',
    q:'商品売買の記帳方法を売上原価対立法によった場合の仕訳を示しなさい。①仕入先から商品を＠2,000円で30個仕入れ、代金は掛けとした。②上記の商品のうち20個を＠3,500円で得意先へ販売し、代金は掛けとした。',
    en_q:'Record the following under the cost-of-sales (perpetual) method: ①Purchased 30 units of merchandise at ¥2,000 each on credit. ②Sold 20 of those units at ¥3,500 each on credit.',
    e:[{d:[['商品',60000]], c:[['買掛金',60000]]}, {d:[['売掛金',70000]], c:[['売上',70000]]}, {d:[['売上原価',40000]], c:[['商品',40000]]}],
    exp:'売上原価対立法では、仕入時に「商品」勘定（資産）を計上し、売上時に「商品」勘定を「売上原価」勘定（費用）に振り替えます。①仕入：30個×＠2,000＝60,000円。②売上：20個×＠3,500＝70,000円。売上原価：20個×＠2,000＝40,000円。三分法と異なり、決算整理（売上原価の算定仕訳）が不要な点が特徴です。'
  },
  { id:670, level:3, cat:'収益認識', chap:'収益認識・現金預金',
    q:'資格予備校を運営する当社は、講座開始にあたり講座代金180,000円が普通預金口座に振り込まれた。その後、講師料72,000円・教材制作費18,000円を現金で支払った。決算に際して、上記講座の進捗度は60％であった（進捗部分に係る費用は54,000円）。３つの仕訳を示しなさい。',
    en_q:'A test-prep school received course fees of ¥180,000 into its bank account at the start of a course. It then paid instructor fees of ¥72,000 and course-material costs of ¥18,000 in cash. At year-end, the course was 60% complete (costs incurred to date: ¥54,000). Record all three entries.',
    e:[{d:[['普通預金',180000]], c:[['契約負債',180000]]}, {d:[['仕掛品',90000]], c:[['現金',90000]]}, {d:[['契約負債',108000]], c:[['役務収益',108000]]}, {d:[['役務原価',54000]], c:[['仕掛品',54000]]}],
    exp:'サービス業の会計処理：①サービス提供前に受け取った代金は「契約負債」（負債）で処理。②サービスに関連する費用の支払額はいったん「仕掛品」（資産）で処理。③決算時、提供済み部分を収益・費用に振り替える。役務収益：180,000×60%＝108,000円。役務原価：進捗費用そのまま54,000円（＝仕掛品の取崩額）。'
  },
  { id:671, level:2, cat:'現金預金', chap:'収益認識・現金預金',
    q:'決算日に金庫を実査したところ、紙幣硬貨80,000円・他人振出の小切手25,000円・配当金領収証15,000円・収入印紙5,000円が保管されていた。現金の帳簿残高は115,000円であり、差異の原因は不明である。決算整理仕訳を示しなさい。',
    en_q:'A cash count at year-end found: currency ¥80,000, a check issued by another party ¥25,000, a dividend receipt slip ¥15,000, and revenue stamps ¥5,000. The book balance of cash is ¥115,000, and the cause of the discrepancy is unknown. Record the year-end adjusting entry.',
    e:[{d:[['現金',5000]], c:[['雑益',5000]]}],
    exp:'現金の実査額＝通貨代用証券の合計：紙幣硬貨80,000＋他人振出小切手25,000＋配当金領収証15,000＝120,000円（収入印紙は通貨代用証券ではないため含めない）。実査額120,000－帳簿残高115,000＝5,000円（現金が多い＝雑益）。原因不明の現金超過は「雑益」、不足は「雑損」で処理します。'
  },
  { id:672, level:2, cat:'現金預金', chap:'収益認識・現金預金',
    q:'銀行勘定調整表：得意先から売掛金23,000円を回収し当座預金に入金したが、当社では誤って32,000円と記帳していた。当社側の修正仕訳を示しなさい。',
    en_q:'Bank reconciliation: Collected ¥23,000 in accounts receivable via bank deposit, but the company mistakenly recorded ¥32,000. Record the company-side correcting entry.',
    e:[{d:[['売掛金',9000]], c:[['当座預金',9000]]}],
    exp:'当社は正しくは23,000円を記帳すべきところ、誤って32,000円（当座預金32,000／売掛金32,000）と記帳していました。過大に減らしすぎた売掛金9,000円（32,000－23,000）を元に戻し、同時に当座預金も9,000円減らして修正します。銀行勘定調整の「誤記入」は当社側で修正が必要な項目の代表例です。'
  },
  { id:673, level:2, cat:'現金預金', chap:'収益認識・現金預金',
    q:'銀行勘定調整表：仕入先への買掛金支払いのために振り出した小切手12,000円が未渡しであった。また、営業費の支払いのために振り出した小切手8,000円も未渡しであった。当社側の修正仕訳を示しなさい。',
    en_q:'Bank reconciliation: A ¥12,000 check drawn to pay an accounts payable had not yet been handed over. Also, an ¥8,000 check drawn to pay operating expenses had not yet been handed over. Record the company-side correcting entries.',
    e:[{d:[['当座預金',12000]], c:[['買掛金',12000]]}, {d:[['当座預金',8000]], c:[['未払金',8000]]}],
    exp:'小切手を振り出す仕訳（当座預金の減少）は済んでいるのに、実際には相手に渡していない「未渡小切手」は、当座預金の減少を取り消す修正をします。仕入代金（商品の仕入債務）に関するものは「買掛金」、それ以外（営業費など）は「未払金」で戻す点に注意してください。'
  },
  { id:674, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'得意先に商品90,000円を販売し、代金は得意先が保有していた他社振出の約束手形を裏書譲渡された。仕訳を示しなさい。',
    en_q:'Sold goods for ¥90,000 to a customer, receiving payment via a promissory note (issued by yet another company) that the customer endorsed and transferred to us. Record the entry.',
    e:[{d:[['受取手形',90000]], c:[['売上',90000]]}],
    exp:'自社が「他社振出の約束手形」を裏書譲渡されて受け取った場合、その手形は自社にとって回収する権利があるため「受取手形」勘定（資産）の増加として処理します。手形を裏書して渡した側（相手方）ではなく、受け取った側の処理である点に注意。'
  },
  { id:675, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'買掛金180,000円の支払いのため、譲渡記録を行い、保有する電子記録債権を仕入先に譲渡した。仕訳を示しなさい。',
    en_q:'To settle an accounts payable of ¥180,000, filed a transfer record and assigned electronically recorded receivables to the supplier. Record the entry.',
    e:[{d:[['買掛金',180000]], c:[['電子記録債権',180000]]}],
    exp:'電子記録債権は、買掛金の支払いに充てるために仕入先へ譲渡することができます（譲渡記録）。電子記録債権を受け取る権利がなくなるため「電子記録債権」勘定（資産）を減少させ、同時に支払義務である「買掛金」勘定（負債）を減少させます。銀行で割り引く場合と異なり、売却損は生じません。'
  },
  { id:676, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'A社から受け取った約束手形250,000円が不渡りとなった。その後、延滞利息5,000円を含めた255,000円が当座預金に振り込まれた。２つの仕訳を示しなさい。',
    en_q:'A promissory note of ¥250,000 received from Company A was dishonored. It was later collected, including ¥5,000 of overdue interest, for a total of ¥255,000 deposited into the bank account. Record both entries.',
    e:[{d:[['不渡手形',250000]], c:[['受取手形',250000]]}, {d:[['当座預金',255000]], c:[['不渡手形',250000],['受取利息',5000]]}],
    exp:'保有する手形が不渡りとなった場合、回収可能性が低い債権として「不渡手形」勘定（資産）に振り替えます。後日回収できた場合、「不渡手形」勘定を取り崩し、延滞利息は「受取利息」勘定（収益）として別途処理します。'
  },
  { id:677, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'B社に裏書譲渡していたC社振出の約束手形40,000円が不渡りとなったため、当座預金から支払いを行い買い戻した。仕訳を示しなさい。',
    en_q:'A promissory note of ¥40,000 (issued by Company C) that we had endorsed and transferred to Company B was dishonored, so we paid from our bank account to buy it back. Record the entry.',
    e:[{d:[['不渡手形',40000]], c:[['当座預金',40000]]}],
    exp:'裏書譲渡（または割引）した手形が不渡りになった場合、譲渡先に対して償還義務を負うため、当座預金などで支払い、その金額を「不渡手形」勘定（資産）として処理します。後日、手形の振出人（本問ではC社）に対して償還請求を行います。'
  },
  { id:678, level:2, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'当社は取得原価90,000円の土地を120,000円でA社に売却し、代金はA社振出の約束手形で受け取った。当社の仕訳を示しなさい。',
    en_q:'Sold land (acquisition cost ¥90,000) to Company A for ¥120,000, receiving a promissory note issued by Company A as payment. Record our entry.',
    e:[{d:[['営業外受取手形',120000]], c:[['土地',90000],['固定資産売却益',30000]]}],
    exp:'商品売買以外（固定資産や有価証券の売買など）の取引によって生じた手形債権は「営業外受取手形」勘定（資産）、手形債務は「営業外支払手形」勘定（負債）で処理し、通常の「受取手形」「支払手形」とは区別します。固定資産売却益：売却額120,000－帳簿価額90,000＝30,000円。'
  },
  { id:679, level:3, cat:'手形', chap:'第4章：債権債務（手形・電子記録債権）',
    q:'当社はD社の借入金400,000円の保証人となり、保証を行ったため対照勘定による備忘記録を行った。その後、D社が支払不能となったため、当社が代わりに当座預金から支払った。一連の仕訳を示しなさい。',
    en_q:'The company guaranteed a ¥400,000 loan for Company D and recorded a memorandum entry using contra accounts. Company D later became unable to pay, so the company paid on its behalf from its bank account. Record the sequence of entries.',
    e:[{d:[['保証債務見返',400000]], c:[['保証債務',400000]]}, {d:[['保証債務',400000]], c:[['保証債務見返',400000]]}, {d:[['未収入金',400000]], c:[['当座預金',400000]]}],
    exp:'債務の保証人となった場合、「保証債務見返」（借方）と「保証債務」（貸方）という対照勘定で備忘記録を行います（財務諸表には計上されず、５要素のいずれにも該当しません）。代わりに弁済した場合は、対照勘定を取り消すと同時に、D社への請求権を「未収入金」（資産）として計上します。'
  },
  { id:680, level:3, cat:'有価証券', chap:'第5章：有価証券',
    q:'A社株式を１株30,000円で５株購入し、手数料5,000円とともに現金で支払った。その後、A社株式を１株35,000円で５株購入し、手数料5,000円とともに現金で支払った。保有するA社株式のうち６株を１株33,000円で売却し、代金は現金で受け取った（売却原価は平均原価法による）。３つの仕訳を示しなさい。',
    en_q:'Purchased 5 shares of Company A stock at ¥30,000 each, paying a ¥5,000 fee, all in cash. Later purchased another 5 shares at ¥35,000 each, paying a ¥5,000 fee, in cash. Then sold 6 of the shares held at ¥33,000 each for cash (cost of shares sold determined by the average cost method). Record all three entries.',
    e:[{d:[['売買目的有価証券',155000]], c:[['現金',155000]]}, {d:[['売買目的有価証券',180000]], c:[['現金',180000]]}, {d:[['現金',198000],['有価証券売却損',3000]], c:[['売買目的有価証券',201000]]}],
    exp:'取得原価には手数料を含めます。①５株×＠30,000＋5,000＝155,000円。②５株×＠35,000＋5,000＝180,000円。平均単価：(155,000＋180,000)÷10株＝＠33,500円。③売却金額：6株×＠33,000＝198,000円。売却原価：6株×＠33,500＝201,000円。有価証券売却損：198,000－201,000＝△3,000円。有価証券を２回以上取得した場合、売却原価は平均原価法で算定します。'
  },
  { id:681, level:2, cat:'無形固定資産', chap:'無形資産・リース・引当金',
    q:'社内利用目的のソフトウェアの制作を1,200,000円で依頼し、手付金として現金500,000円を支払った。その後ソフトウェアが完成し引き渡しを受け、残額700,000円を現金で支払った。決算に際して、有効期間５年（当期12ヶ月分）で償却する。３つの仕訳を示しなさい。',
    en_q:'Commissioned in-house-use software development for ¥1,200,000, paying a ¥500,000 deposit in cash. The software was later completed and delivered, and the remaining ¥700,000 was paid in cash. At year-end, amortize over a 5-year useful life (full 12 months this period). Record all three entries.',
    e:[{d:[['ソフトウェア仮勘定',500000]], c:[['現金',500000]]}, {d:[['ソフトウェア',1200000]], c:[['ソフトウェア仮勘定',500000],['現金',700000]]}, {d:[['ソフトウェア償却',240000]], c:[['ソフトウェア',240000]]}],
    exp:'ソフトウェアの制作を依頼し、完成前に支払った金額は「ソフトウェア仮勘定」（資産）で処理します。完成し引き渡しを受けた時点で「ソフトウェア」勘定へ振り替えます。無形固定資産は定額法・残存価額ゼロ・直接法で償却：1,200,000÷5年＝240,000円。'
  },
  { id:682, level:3, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'決算にあたり、売掛金残高300,000円のうち30,000円はX社に対するものである。X社は経営状態に重大な問題が生じているため、担保の処分見込額10,000円を控除した残額の50％を貸倒見積高とする。その他の売掛金については債権金額の２％を貸倒見積高とする。貸倒引当金の期首残高はゼロ（差額補充法）。決算整理仕訳を示しなさい。',
    en_q:'At year-end, of a ¥300,000 accounts receivable balance, ¥30,000 relates to Company X, which is in serious financial distress. Estimate its bad debt allowance at 50% of the balance after deducting the ¥10,000 collateral recovery value. For the remaining receivables, estimate 2% of the balance. The opening allowance balance is zero (allowance method, incremental basis). Record the adjusting entry.',
    e:[{d:[['貸倒引当金繰入',15400]], c:[['貸倒引当金',15400]]}],
    exp:'個別評価と一括評価を使い分けます。X社（個別評価）：(売掛金30,000－担保の処分見込額10,000)×50％＝10,000円。その他の売掛金（一括評価）：(300,000－30,000)×2％＝5,400円。貸倒見積高合計：10,000＋5,400＝15,400円。期首残高がゼロなので、差額補充法によりそのまま15,400円を繰り入れます。'
  },
  { id:683, level:2, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'当期純損失の計上により、繰越利益剰余金が350,000円の借方残高となっている。株主総会の決議により、資本金と相殺して欠損を填補した。仕訳を示しなさい。',
    en_q:'Due to a net loss, retained earnings (繰越利益剰余金) shows a ¥350,000 debit balance. By shareholders\' meeting resolution, this deficit was offset against paid-in capital. Record the entry.',
    e:[{d:[['資本金',350000]], c:[['繰越利益剰余金',350000]]}],
    exp:'繰越利益剰余金が借方残高（マイナス）ということは「欠損」が生じている状態です。株主総会の決議により、この欠損を埋め合わせるために、同額の資本金を減少させて繰越利益剰余金の借方残高をゼロにします。これを「欠損填補」といいます。'
  },
  { id:684, level:2, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'株主総会において、以下の決議を行った。新築積立金の積立て：15,000円　別途積立金の取崩し：35,000円。必要な仕訳を示しなさい。',
    en_q:'At the shareholders\' meeting, the following were resolved: appropriation to a new-building reserve of ¥15,000; reversal of a general reserve of ¥35,000. Record the necessary entries.',
    e:[{d:[['繰越利益剰余金',15000]], c:[['新築積立金',15000]]}, {d:[['別途積立金',35000]], c:[['繰越利益剰余金',35000]]}],
    exp:'任意積立金を積み立てた場合、「繰越利益剰余金」勘定から積立金の勘定へ振り替えます。逆に取り崩した場合は、積立金の勘定から「繰越利益剰余金」勘定へ振り替えます。積立と取崩は逆方向の仕訳になる点を押さえましょう。'
  },
  { id:685, level:3, cat:'株式会社会計', chap:'第10章：株式会社会計',
    q:'株主総会において、配当金90,000円の支払いを決議し、準備金は配当金の1/10を積み立てることとした。配当財源：繰越利益剰余金60,000円、その他資本剰余金30,000円。仕訳を示しなさい。',
    en_q:'At the shareholders\' meeting, a dividend of ¥90,000 was resolved, with 1/10 of the dividend to be appropriated to statutory reserves. Dividend sources: retained earnings ¥60,000, other capital surplus ¥30,000. Record the entry.',
    e:[{d:[['繰越利益剰余金',66000],['その他資本剰余金',33000]], c:[['未払配当金',90000],['利益準備金',6000],['資本準備金',3000]]}],
    exp:'繰越利益剰余金を財源とした場合は「利益準備金」を、その他資本剰余金を財源とした場合は「資本準備金」を、それぞれの財源の1/10だけ積み立てます。利益準備金：60,000×1/10＝6,000円（繰越利益剰余金からは60,000＋6,000＝66,000円が減少）。資本準備金：30,000×1/10＝3,000円（その他資本剰余金からは30,000＋3,000＝33,000円が減少）。'
  },
  // ===== 総合問題（本支店合併財務諸表・連結精算表） =====
  { id:686, level:3, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'本店は支店へ商品を原価に25％の利益を加算して送付しており、当期の内部売上高（支店へ売上）は250,000円であった。また、支店の期末商品（送付価格ベース50,000円）に内部利益10,000円が含まれている。合併損益計算書を作成するための、①内部取引の相殺消去②内部利益の消去の仕訳を示しなさい。',
    en_q:'HQ ships goods to the branch marked up 25% over cost; this period\'s internal sales ("sales to branch") totaled ¥250,000. The branch\'s closing inventory (¥50,000 at transfer price) includes ¥10,000 of unrealized internal profit. Record ①the elimination of the internal transaction and ②the elimination of the unrealized profit needed to prepare the combined income statement.',
    e:[{d:[['支店へ売上',250000]], c:[['本店より仕入',250000]]}, {d:[['売上原価',10000]], c:[['繰越商品',10000]]}],
