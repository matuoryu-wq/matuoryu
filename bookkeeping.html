    q:'X社は、事務所のコピー機を、<mark class="q-expense">オペレーティング・リース契約</mark>で借りている。この契約は、ファイナンス・リースに当てはまらない、通常の賃貸借に近いリース契約である。X社は、当月分のリース料10円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['支払リース料',10]],c:[['現金',10]]}],
    exp:'「オペレーティング・リース」とは、ファイナンス・リース以外のリース契約のことです（実質的には、設備を購入したのではなく、借りているだけと考えます）。ファイナンス・リースのように資産・負債を計上する必要はなく、毎月のリース料を、そのまま「支払リース料」という費用として処理するだけの、普通の賃貸借と同じシンプルな処理です。'
  },
  { id:1128, cat:'リース取引', chap:'無形資産・リース・引当金',
    q:'X社は、<mark class="q-asset">ファイナンス・リースによって、冷凍設備Cを使っている</mark>。この冷凍設備Cの帳簿価額は、30円である。ところが、水産物の市況が急激に悪化し、この設備を使った事業の収益性が、大きく下がった。そこで、この設備の回収可能価額を見積もったところ、18円であった。X社は、<mark class="q-expense">帳簿価額を、回収可能価額まで切り下げる</mark>。必要な仕訳を行いなさい。',
    e:[{d:[['減損損失',12]],c:[['リース資産',12]]}],
    exp:'「帳簿価額」とは、帳簿に記録されている、その資産の金額のことです。「回収可能価額」とは、その資産を使ったり売ったりして、将来回収できると見込まれる金額のことです。ファイナンス・リースのリース資産も、自社所有の固定資産と同じように減損会計の対象になります。帳簿価額30円が回収可能価額18円まで下がったと判断されたので、差額12円を「減損損失」という費用として計上し、リース資産の帳簿価額を実態に合わせて切り下げます。'
  },
  { id:1129, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'紙を製造して販売しているX社は、工場の主要な機械について、2年に1度、大がかりな修繕を行っている。次の修繕は、来期に予定されている。この<mark class="q-liability">修繕にかかる費用は、8円と見積もられている</mark>。<mark class="q-expense">今期の決算にあたり</mark>、X社は、この修繕に備えて、必要な仕訳を行いなさい。',
    e:[{d:[['修繕引当金繰入',8]],c:[['修繕引当金',8]]}],
    exp:'引当金とは「将来発生しそうな費用・損失を、実際に発生する前から見積もって、今期の費用として先取りしておく」仕組みです。来期に予定している機械の修繕は、今期の事業活動によって生じた摩耗などが原因と考えられるため、その費用を先取りして「修繕引当金繰入」という費用で計上し、「修繕引当金」という負債として備えておきます。'
  },
  { id:1130, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社の従業員に対する賞与は、年2回、6月と12月に支払われる。6月に支払う賞与は、1月から6月までの6か月間の働きに対するもので、<mark class="q-liability">支給見込み額は45円である</mark>。X社の決算日は2月末で、今期には、このうち1月と2月の2か月分が含まれる。決算にあたり、この賞与のうち、<mark class="q-expense">今期に対応する分について、必要な仕訳</mark>を行いなさい。',
    e:[{d:[['賞与引当金繰入',15]],c:[['賞与引当金',15]]}],
    exp:'賞与は実際に支払うのが来期であっても、その対象となる働きはすでに今期に発生している分があります。6か月分（45円）の賞与のうち、今期に含まれる2か月分（1月・2月）を月割りで計算すると、45円×2か月／6か月＝15円です。この金額を今期のうちに「賞与引当金繰入」という費用と「賞与引当金」という負債として先取りで計上します。'
  },
  { id:1131, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、役員に対しても、賞与を支払う予定である。この役員賞与は、株主総会で決議されて支払われるもので、<mark class="q-liability">支給見込み額は10円である</mark>。この10円は、今期の働きに対するものである。<mark class="q-expense">決算にあたり</mark>、必要な仕訳を行いなさい。',
    e:[{d:[['役員賞与引当金繰入',10]],c:[['役員賞与引当金',10]]}],
    exp:'役員に支払う賞与も、一般従業員の賞与と同じように「発生した期間の費用として先取りする」のが原則です。株主総会での正式な決議はまだでも、対象となる働きはすでに今期に発生しているため、見積額10円を今期のうちに「役員賞与引当金繰入」という費用と「役員賞与引当金」という負債として計上します。'
  },
  { id:1132, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、従業員が退職するときに、退職金を支払うことになっている。退職金は、従業員が働いた期間に応じて、少しずつ発生していく。<mark class="q-liability">今期に発生した分は、25円と見積もられた</mark>。<mark class="q-expense">決算にあたり</mark>、この25円について、必要な仕訳を行いなさい。',
    e:[{d:[['退職給付費用',25]],c:[['退職給付引当金',25]]}],
    exp:'退職給付引当金は、将来支払う退職金を、従業員が実際に働いた期間に応じて少しずつ費用として積み立てていく仕組みです。今期の労働に対応する見込み額（25円）を、今期のうちに「退職給付費用」という費用と「退職給付引当金」という負債として計上します。実際に退職金を支払うのはずっと先でも、少しずつ準備しておく、という考え方です。'
  },
  { id:1133, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'家電を一般のお客さんに売っているX社は、販売した商品に、購入から1年間の無償修理の保証を付けている。過去の実績から、保証の期間中に、販売した商品の一部が故障して、修理が必要になることが、わかっている。今期に販売した商品について、<mark class="q-liability">将来かかると見込まれる保証の費用は、6円</mark>と見積もられた。<mark class="q-expense">決算にあたり</mark>、必要な仕訳を行いなさい。',
    e:[{d:[['商品保証引当金繰入',6]],c:[['商品保証引当金',6]]}],
    exp:'商品保証引当金は、販売した商品に将来発生するかもしれない無償修理・交換の費用を、販売した期のうちに見積もって先取りしておく仕組みです。「今期売った商品の保証費用は、今期の売上に対応するコストである」という考え方にもとづき、見積額6円を「商品保証引当金繰入」という費用と「商品保証引当金」という負債として計上します。'
  },
  { id:1134, cat:'引当金', chap:'無形資産・リース・引当金',
    q:'X社は、前の期に販売した商品について、お客さんから修理の依頼を受けて、修理を行った。<mark class="q-expense">修理にかかった実際の費用8円は</mark>、<mark class="q-asset">現金で支払った</mark>。前の期の決算で、この<mark class="q-liability">保証のために見積もって計上していた金額は、6円である</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['商品保証引当金',6],['商品保証費',2]],c:[['現金',8]]}],
    exp:'実際に保証修理の費用が発生したら、まず前期に積み立てておいた貯金箱（商品保証引当金6円）を取り崩して充て、それでも足りない超過分（8円－6円＝2円）は、新たに今期の費用（商品保証費）として追加計上します。見積もりが実際の費用より少なかった場合の、不足分の埋め合わせです。'
  },
  // --- 第10章：株式会社会計 ---
  { id:1135, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'パンを製造して販売する会社を新しく作ることになり、X社が設立された。設立にあたって、株式を発行し、<mark class="q-asset">払込金額200円が、当座預金口座に振り込まれた</mark>。X社は、<mark class="q-equity">払込金額の全額を、法定の資本として組み入れた</mark>。設立の日の仕訳を行いなさい。',
    e:[{d:[['当座預金',200]],c:[['資本金',200]]}],
    exp:'「払込金額」とは、株式を発行するときに、株主が会社に払い込むお金のことです。「法定の資本」とは、株主が払い込んだお金のうち、会社法で、会社の資本として扱われるもののことです。株式を発行して集めたお金は、銀行から借りるお金とは違い、返済する義務のない会社自身の元手になります。払込金額の全額を法定の資本とする場合は、そのまま「資本金」という純資産に計上します。'
  },
  { id:1136, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、設立に必要な、法律で決められた手続きを行った。会社の基本となるルール（定款）を作り、設立の登記を行った。これらにかかった、<mark class="q-asset">定款の作成費用や設立登記の税金</mark>など、合計15円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['創立費',15]],c:[['現金',15]]}],
    exp:'「定款」とは、会社の目的や組織などを定めた、会社の基本となるルールのことです。会社を設立するためにかかった費用（定款作成費・登記の税金など）は「創立費」という科目で処理します。創立費は、名前に「費」とつきますが費用科目ではなく、会社の設立準備のために支出したお金をいったん資産（繰延資産）として計上し、その後数年にわたって少しずつ償却していく科目です。会社そのものがまだ存在しない設立準備の段階でかかった費用なので、次の問題で出てくる「開業費」（会社ができた後の準備費用）とは区別します。'
  },
  { id:1137, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、設立が終わったあと、パン屋の営業を始めるための準備を進めた。お店を開く前に、開店を知らせるための広告を出し、事務所の準備も行った。<mark class="q-asset">営業を始めるまでの間に、これらにかかった広告費や事務所の準備の費用</mark>として、合計8円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['開業費',8]],c:[['現金',8]]}],
    exp:'「開業費」とは、会社を設立した後、実際に営業を始めるまでの準備期間にかかった費用（広告・事務所の準備など）のことです。創立費と同じく、開業費も名前に反して費用科目ではなく、支出した時点ではいったん資産（繰延資産）として計上し、その後少しずつ償却していく科目です。会社が生まれる前の費用（創立費）とは違い、会社が生まれた後、営業が始まるまでの準備費用である点が違いです。「法人ができる前か、後か」で創立費と開業費を使い分けるのがポイントです。'
  },
  { id:1138, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'衣料品の企画と販売をしているX社は、新しく株式を発行して、事業の資金を集めることにした。<mark class="q-liability">株式の申込みをした人から、申込みの際に払い込まれる300円を、申込証拠金として受け取り</mark>、通常の預金とは区別した<mark class="q-asset">専用の口座に預け入れた</mark>。株式は、まだ発行していない。この日の仕訳を行いなさい。',
    e:[{d:[['別段預金',300]],c:[['株式申込証拠金',300]]}],
    exp:'「申込証拠金」とは、株式の申込みをした人が、払込期日の前に、申込みの際に払い込むお金のことです。まだ正式に株式を発行していない段階なので、受け取ったお金は資本金にはせず、「株式申込証拠金」という一時的な負債（＝正式な株主になるまでの預かり金）で処理します。入金先も通常の預金とは区別した「別段預金」という専用口座（資産）を使います。'
  },
  { id:1139, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、<mark class="q-equity">増資にあたり、新株を発行した</mark>。払込金額200円が、<mark class="q-asset">当座預金口座に振り込まれた</mark>。X社は、払込金額のうち、<mark class="q-equity">会社法が認める最低額を、法定の資本として組み入れた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['当座預金',200]],c:[['資本金',100],['資本準備金',100]]}],
    exp:'会社法では、払込金額の全額を資本金にするのが原則ですが、最低でも半額を資本金にすれば、残りは「資本準備金」という純資産にすることも認められています。「会社法が認める最低額」という指示は、払込金額の半分（200円×1／2＝100円）を資本金とし、残りの100円を資本準備金とすることを意味します。'
  },
  { id:1140, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、上記の増資のために、新しく株式を発行して、資金を集めた。<mark class="q-asset">新しい株式を発行するため</mark>には、証券会社に手続きを頼んだり、書類を印刷したりする必要がある。これらにかかった費用として、証券会社への手数料など、合計5円を、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['株式交付費',5]],c:[['現金',5]]}],
    exp:'新しく株式を発行するときにかかる事務費用（証券会社への手数料・印刷代など）は「株式交付費」という科目で処理します。株式交付費も、創立費や開業費と同じように、支出した時点ではすぐに費用にはせず、いったん資産（繰延資産）として計上し、その後少しずつ償却していく科目です。会社設立時の創立費や開業費とは違い、増資（会社ができた後の株式発行）にかかった費用である点がポイントです。'
  },
  { id:1141, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'雑貨を販売しているX社は、株主総会で、<mark class="q-equity">過去に稼いだ利益の蓄積を財源</mark>とする<mark class="q-liability">配当200円を決議した</mark>。X社の資本金は400円、資本準備金は60円、利益準備金は30円である。この決議で積み立てる準備金の金額を計算して、必要な仕訳を行いなさい。配当金は、まだ支払っていない。',
    e:[{d:[['繰越利益剰余金',210]],c:[['未払配当金',200],['利益準備金',10]]}],
    exp:'会社法では、配当をするときに、配当額の10分の1を、準備金として積み立てるルールがあります（ただし資本準備金と利益準備金の合計が、資本金の4分の1に達するまでの金額が上限です）。上限＝400円×1／4＝100円、現在の準備金合計＝60円＋30円＝90円なので、あと10円まで積み立てられます。配当額200円の10分の1は20円ですが、上限の10円までしか積み立てられないため、利益準備金は10円になります。繰越利益剰余金という貯金箱から、配当（未払配当金）と準備金の積立（利益準備金）の2つに振り分けます。'
  },
  { id:1142, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、別の期の株主総会で、これまで稼いだ利益の一部を、株主に<mark class="q-liability">配当として支払う</mark>ことにした。<mark class="q-equity">過去に稼いだ利益の蓄積を財源</mark>とする配当30円が、決議された。配当金は、決議の日から、しばらくたってから支払うことになっており、まだ支払っていない。この日の仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',30]],c:[['未払配当金',30]]}],
    exp:'配当が決議された時点で、株主に対して「支払わなければならない」という義務がすでに発生しています。決議の日にはまだ実際にお金を払っていないので、繰越利益剰余金（純資産）を減らし、「未払配当金」という負債（＝これから株主に払う義務）を計上します。'
  },
  { id:1143, cat:'株式会社', chap:'第10章：株式会社会計',
    q:'X社は、将来、新しい店舗を出す計画を立てている。新店舗を建てるには、まとまった資金が必要になる。そこで、株主総会の決議により、<mark class="q-equity">過去に稼いだ利益の蓄積から20円を</mark>、<mark class="q-equity">新店舗の建設のための積立金</mark>として積み立てた。この日の仕訳を行いなさい。',
    e:[{d:[['繰越利益剰余金',20]],c:[['任意積立金',20]]}],
    exp:'「任意積立金」のような積立金は、会社が自主的な判断で、将来の特定の目的（この場合は新店舗の建設）のために利益の一部を取り分けておく、いわば「目的別の貯金」です。法律で義務付けられた利益準備金とは違い、会社が自由な判断で金額や使いみちを決められます。繰越利益剰余金から任意積立金へ、純資産の中で科目が変わるだけの処理です。'
  },
  { id:1144, cat:'企業合併', chap:'第10章：株式会社会計',
    q:'食品を製造して販売しているX社は、同業のY社を<strong>吸収合併</strong>した。<mark class="q-revenue">合併の対価として</mark>、<mark class="q-asset">現金80円を支払った</mark>。Y社から受け入れた資産は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40]],c:[['現金',80],['負ののれん発生益',20]]}],
    exp:'「吸収合併」とは、ある会社が、他の会社を取り込んで、1つの会社になることです。受け入れた資産の時価の合計（60円＋40円＝100円）より、支払った対価（80円）の方が少なかった、つまり「お買い得に買えた」状態です。この差額20円は「負ののれん発生益」として、その期の収益に一括計上します（のれんとは逆で、資産にはせず、すぐに利益にする点に注意）。'
  },
  { id:1145, cat:'企業合併', chap:'第10章：株式会社会計',
    q:'X社は、同業のY社を<strong>吸収合併</strong>した。合併の対価として、X社の新株を発行して、Y社の株主に交付した。<mark class="q-asset">対価の総額は120円で</mark>、この全額を、法定の資本にも準備金にも組み入れず、<mark class="q-equity">その他の払込資本</mark>とする。Y社から受け入れた資産は、<mark class="q-asset">商品60円</mark>と<mark class="q-asset">建物40円</mark>で、引き継ぐ負債はない。この日の仕訳を行いなさい。',
    e:[{d:[['商品',60],['建物',40],['のれん',20]],c:[['その他資本剰余金',120]]}],
    exp:'今度は対価120円の方が、受け入れた純資産100円（商品60円＋建物40円）より多いので、差額20円は「のれん」（相手会社のブランド力や将来性への対価）として資産計上します。合併の対価を新株発行でまかなう場合、会社法上は資本金にするのが原則ですが、全額を資本金にも準備金にも入れず「その他資本剰余金」という純資産にすることも認められています。'
  },
  { id:1146, cat:'企業合併', chap:'第10章：株式会社会計',
    q:'X社は、前に他の会社を合併したときに、<mark class="q-asset">のれん20円</mark>を計上している。のれんは、<mark class="q-expense">合併の日から10年間にわたって、毎年同じ金額ずつ償却する（定額法）</mark>。今期も、決算の時期になった。決算にあたり、この期の1年分について、必要な仕訳を行いなさい。',
    e:[{d:[['のれん償却',2]],c:[['のれん',2]]}],
    exp:'のれんは、他社を買収したときに「帳簿上の価値以上に払った、目に見えない価値」への対価です。この価値は永遠に続くわけではないと考えられるため、20年以内（この問題では10年）の期間にわたって少しずつ費用として償却していきます。20円÷10年＝2円が1年分の償却額です。'
  },
  { id:1147, cat:'自己株式', chap:'第10章：株式会社会計',
    q:'機械部品を製造しているX社は、自社の株価が、会社の実力に比べて安いと考えている。そこで、株主総会の決議にもとづき、市場に出回っている<mark class="q-equity">自社の株式</mark>を、株主から、40円分、買い戻すことにした。代金は、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['自己株式',40]],c:[['現金',40]]}],
    exp:'「自己株式」とは、会社が、自社で発行した株式を、株主から買い戻して、保有しているもののことです。自社の株式を買い戻すと、それは通常の資産の購入とは違い、株主に対する資本の一部払い戻しに近い意味を持ちます。そのため取得原価のまま、純資産の部から差し引くマイナス項目（自己株式）として計上します。'
  },
  { id:1148, cat:'自己株式', chap:'第10章：株式会社会計',
    q:'X社は、以前に買い戻した<mark class="q-equity">自社の株式（帳簿価額40円）</mark>を、資金が必要になったため、市場で売却することにした。自社の株価が上がっていたので、<mark class="q-equity">売却価額は45円になり</mark>、<mark class="q-asset">代金は現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',45]],c:[['自己株式',40],['自己株式処分差益',5]]}],
    exp:'買い戻していた自己株式を、取得したときより高く売却できました。この差額（5円）は商品売買のような利益ではなく、株主との資本取引から生じたものなので、損益計算書ではなく「自己株式処分差益」という純資産の項目に計上します。'
  },
  { id:1149, cat:'自己株式', chap:'第10章：株式会社会計',
    q:'X社は、以前に買い戻した<mark class="q-equity">自社の株式（帳簿価額40円）</mark>を、資金が必要になったため、市場で売却することにした。しかし、自社の株価が下がっていたので、<mark class="q-equity">売却価額は35円になり</mark>、<mark class="q-asset">代金は現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',35],['自己株式処分差損',5]],c:[['自己株式',40]]}],
    exp:'今回は逆に、自己株式を取得したときより安く売却してしまいました。この差額（5円）も、損益計算書の費用にはせず、「自己株式処分差損」という純資産の項目で処理します。自己株式の売買で生じた差額は、儲けや損ではなく、あくまで純資産内部の増減として扱われる点がポイントです。'
  },
  // --- 外貨建・伝票・給与 ---
  { id:1150, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'日本製の雑貨を輸出しているX社は、アメリカの取引先に、<mark class="q-asset">雑貨1ドル分を、掛けで売った</mark>。代金は、米ドルで支払ってもらう約束（<strong>外貨建て</strong>）である。売った日の為替相場は、1ドル＝100円で、X社は、この売掛金を100円として記録した。その後、<mark class="q-other">代金が支払われる日が来た。この日の為替相場は、1ドル＝105円であった</mark>。取引先から、代金1ドルが、円に換えられて、<mark class="q-asset">現金105円で支払われた</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',105]],c:[['売掛金',100],['為替差損益',5]]}],
    exp:'「外貨建て」とは、代金を、円ではなく、外国の通貨（ここでは米ドル）で決めた取引のことです。「為替相場」とは、円と外国の通貨を交換するときの、交換の比率のことです。売った時点では1ドル＝100円で売掛金を記録していましたが、実際に代金を受け取る日には1ドル＝105円に円安が進んでいたため、予定より多くの円を受け取れました。この差額5円は「為替差損益」という収益（得をした分）として処理します。'
  },
  { id:1151, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'X社は、アメリカの仕入先から、<mark class="q-liability">原材料1ドル分を、掛けで購入した</mark>。購入した日の為替相場は、1ドル＝100円で、X社は、この買掛金を100円として記録した。代金の支払いは、3か月後である。3か月の間に円安が進むと、支払う円の金額が増えてしまう。そこで、X社は、銀行と、3か月後の為替相場をあらかじめ1ドル＝105円に決める契約（<strong>為替予約</strong>）を結んだ。X社は、この買掛金を、<mark class="q-other">予約した為替相場で円に換算した金額（105円）で、計上しなおす（振当処理）</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['為替差損益',5]],c:[['買掛金',5]]}],
    exp:'「為替予約」とは、将来の一定の日に、外貨を円に換えるときの為替相場を、あらかじめ決めておく契約のことです。「振当処理」とは、為替予約で決めた為替相場で、外貨建ての債権や債務を、円に換算した金額に、計上しなおす方法のことです。もともと100円で記録していた買掛金を、予約レートで計算した105円に修正するため、差額5円を買掛金（負債）に上乗せし、相手科目は「為替差損益」という費用（将来の支払いが増えてしまう分の損失）で処理します。予約した時点で、将来の支払額が確定するのがポイントです。'
  },
  { id:1152, cat:'外貨建取引', chap:'外貨建・伝票・給与',
    q:'X社は、別の取引で、アメリカの仕入先から仕入れた原材料の代金（外貨建て）を支払うために、銀行と為替予約を結んでいる。X社は、この為替予約を、買掛金とは切り離して、為替予約そのものを時価で評価する方法（<strong>独立処理</strong>）によって処理している。決算の日に、<mark class="q-liability">為替予約の時価を計算</mark>したところ、契約したときよりも不利になっており、その<mark class="q-other">差額は3円で</mark>あった。決算に必要な仕訳を行いなさい。',
    e:[{d:[['為替差損益',3]],c:[['為替予約',3]]}],
    exp:'「独立処理」とは、外貨建ての債務と、為替予約とを、切り離して、それぞれ別に評価する方法のことです。前の問題の「振当処理」（買掛金に為替予約の効果をまとめて反映させる方法）とは違い、独立処理では為替予約そのものを「為替予約」という独立した資産・負債として時価評価します。契約時より不利な方向に3円動いたので、「為替予約」という負債を3円計上し、相手科目は「為替差損益」という費用で処理します。'
  },
  { id:1156, cat:'租税・貯蔵品', chap:'税効果',
    q:'惣菜を製造して販売しているX社は、新しい取引先と、売買契約を結ぶことになり、契約書を作った。契約書には、収入印紙を貼って、税金を納める決まりになっている。そこで、郵便局で、<mark class="q-expense">収入印紙3円を</mark>、<mark class="q-asset">現金で購入</mark>し、すぐに契約書に貼って使った。この日の仕訳を行いなさい。',
    e:[{d:[['租税公課',3]],c:[['現金',3]]}],
    exp:'「収入印紙」とは、契約書や領収書などにかかる税金を、納めるために貼る、国が発行する印紙のことです。収入印紙や固定資産税のような税金関係の支出は「租税公課」という費用で処理します。買ってすぐに使った（契約書に貼った）ので、資産にはせず、そのまま費用として計上します。'
  },
  { id:1157, cat:'租税・貯蔵品', chap:'税効果',
    q:'X社は、工場の土地と建物について、市役所から、<mark class="q-expense">固定資産税の納付書を受け取った</mark>。固定資産税は、土地や建物などの固定資産を持っていることに対してかかる税金である。X社は、納付書の金額8円を、期限までに、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['租税公課',8]],c:[['現金',8]]}],
    exp:'固定資産税も、収入印紙と同じ「租税公課」という費用で処理します。商品や仕事に直接関係する税金ではなく、固定資産を保有していることに対してかかる税金なので、会社の事業活動にともなう一般的な費用として扱われます。'
  },
  { id:1158, cat:'給与・社保', chap:'税効果',
    q:'X社は、今月の従業員の給料の支払日を迎えた。従業員に対する給料の総額は、50円である。給料を支払うときは、会社が、従業員に代わって、給料から、<mark class="q-liability">所得税の源泉徴収分5円と</mark>、<mark class="q-liability">社会保険料の従業員負担分3円</mark>を差し引く。X社は、これらを<mark class="q-asset">差し引いた残りを、従業員に、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['給料',50]],c:[['現金',42],['所得税預り金',5],['社会保険料預り金',3]]}],
    exp:'「源泉徴収」とは、給料などを支払うときに、会社が、あらかじめ税金を差し引いて、従業員に代わって、国に納めることです。「社会保険料」とは、健康保険や厚生年金などの保険料で、従業員と会社が分担して負担します。給料の総支給額（50円）はまるごと会社の費用になりますが、従業員が実際に受け取る金額はそれより少なくなります。天引きした所得税と社会保険料は、会社がいったん預かって、後で国や保険機関に代わりに納める「預り金」という負債で処理します。'
  },
  { id:1159, cat:'給与・社保', chap:'税効果',
    q:'X社は、上記の給料を支払ったときに、従業員に代わって、給料から所得税5円を差し引いて、預かっていた。会社は、この預かった所得税を、従業員に代わって、国に納める義務がある。納める期限が来たため、X社は、<mark class="q-liability">預かっていた所得税5円を</mark>、税務署に、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['所得税預り金',5]],c:[['現金',5]]}],
    exp:'給料から天引きしていた所得税（預り金・負債）を、約束通り税務署に納付します。会社自身の費用ではなく、従業員の代わりに国へ届ける「預かっていたお金」を払っただけなので、負債（所得税預り金）が消えて現金が減るだけの処理になります。'
  },
  { id:1160, cat:'給与・社保', chap:'税効果',
    q:'X社は、上記の給料を支払ったときに、従業員から、社会保険料の従業員負担分3円を、預かっていた。社会保険料は、従業員が負担する分と、会社が負担する分が、同じ金額になる決まりである。そのため、会社が負担する社会保険料も、3円である。納付の期限が来たため、X社は、<mark class="q-liability">預かっていた3円と</mark>、<mark class="q-expense">会社負担の3円を</mark>、あわせて、年金事務所に、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['社会保険料預り金',3],['法定福利費',3]],c:[['現金',6]]}],
    exp:'社会保険料の納付には、従業員の給料から天引きしていた分（社会保険料預り金・負債）と、会社自身が負担する分（法定福利費・費用）の2種類が混ざっています。納付するときは、預かっていた分を返す（負債の消滅）と同時に、会社自身の負担分を新たに費用として計上する、という2つの処理を1つの取引にまとめて行います。'
  },
  { id:1161, cat:'消費税', chap:'税効果',
    q:'X社は、食材を100円で仕入れた。仕入れのときには、食材の代金のほかに、消費税8円も、あわせて支払う。X社は、消費税を、仕入や売上の金額とは区別して記帳する方法（<strong>税抜方式</strong>）を採用している。<mark class="q-expense">食材の代金100円と</mark>、<mark class="q-asset">消費税8円は</mark>、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['仕入',100],['仮払消費税',8]],c:[['現金',108]]}],
    exp:'「消費税」とは、商品の販売やサービスの提供に対してかかる税金のことです（最終的には、商品を買う消費者が負担しますが、会社が、その代わりに国へ納めます）。「税抜方式」とは、消費税を、売上や仕入の金額とは区別して、記帳する方法です。本体価格100円は「仕入」という費用、支払った消費税8円は、いずれ国に納める分の立て替えとして「仮払消費税」という資産で処理します。'
  },
  { id:1162, cat:'消費税', chap:'税効果',
    q:'X社は、惣菜を100円で、お客さんに<mark class="q-revenue">販売した</mark>。販売のときには、惣菜の代金のほかに、お客さんから、<mark class="q-liability">消費税10円も、あわせて受け取る</mark>。X社は税抜方式を採用している。惣菜の代金100円と、消費税10円は、<mark class="q-asset">現金で受け取った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',110]],c:[['売上',100],['仮受消費税',10]]}],
    exp:'売上側でも同じように、本体価格100円は「売上」という収益、お客さんから預かった消費税10円は、いずれ国に納める「仮受消費税」という負債で処理します。会社は、お客様と税務署の間で消費税を仲介しているだけの立場です。'
  },
  { id:1163, cat:'消費税', chap:'税効果',
    q:'決算にあたり、X社は、当期の消費税について、<mark class="q-liability">国に納める</mark>金額を計算した。売上のときに、<mark class="q-liability">お客さんから受け取った消費税</mark>は10円、仕入のときに、<mark class="q-asset">支払った消費税</mark>は8円であった。この差額が、国に納める消費税になる。X社は税抜方式を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['仮受消費税',10]],c:[['仮払消費税',8],['未払消費税',2]]}],
    exp:'決算では、預かった消費税（仮受消費税）から立て替えた消費税（仮払消費税）を差し引いた本当の納税額を、「未払消費税」という負債として確定させます。10円－8円＝2円が実際に国へ納める金額です。'
  },
  { id:1164, cat:'法人税', chap:'税効果',
    q:'X社は、<mark class="q-asset">法人税・住民税・事業税について、中間申告</mark>を行った。これらの税金は、事業年度が終わったあとに、1年分の税額が確定して、納めるが、年度の途中でも、前もって、一部を納める決まりになっている。X社は、中間申告にもとづき、15円を、<mark class="q-asset">現金で納付</mark>した。この日の仕訳を行いなさい。',
    e:[{d:[['仮払法人税等',15]],c:[['現金',15]]}],
    exp:'「中間申告」とは、事業年度の途中で、税金の一部を、前もって納めるために行う、申告の手続きのことです。この時点ではまだ正式な税額が確定していないため、費用ではなく「仮払法人税等」という資産（前払いしている状態）として計上します。決算で正式な税額が確定した段階で、この前払い分を差し引く形で精算します。'
  },
  { id:1165, cat:'法人税', chap:'税効果',
    q:'決算にあたり、X社は、今期の利益にかかる、<mark class="q-expense">法人税・住民税・事業税</mark>の額を計算した。その結果、これら3つの税金の、1年分の合計額は、35円と確定した。このうち<mark class="q-asset">15円は、今期の途中で行った、中間申告のときに、すでに納付</mark>している。<mark class="q-liability">残りの20円は、決算のあとに、納付する</mark>。決算に必要な仕訳を行いなさい。',
    e:[{d:[['法人税、住民税及び事業税',35]],c:[['仮払法人税等',15],['未払法人税等',20]]}],
    exp:'決算で法人税等の正式な金額（35円）が確定したら、それを今期の費用（法人税、住民税及び事業税）として計上します。すでに中間申告で前払いしていた分（仮払法人税等15円）はこの費用から差し引き、まだ払っていない残額（20円）は「未払法人税等」という負債として計上し、翌期に実際に納付します。'
  },
  { id:1166, cat:'消費税', chap:'税効果',
    q:'食料品を売っているX社は、消費税を、仕入や売上の金額に含めて記帳する方法（<strong>税込方式</strong>）を採用している。X社は、店で売る食料品を、仕入先から、<mark class="q-expense">商品100円で仕入れた</mark>。仕入れのときには、消費税8円も、あわせて支払う必要がある。代金は、<mark class="q-asset">消費税とあわせた108円を、現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['仕入',108]],c:[['現金',108]]}],
    exp:'「税込方式」とは、消費税を、売上や仕入の金額に含めて、記帳する方法です。税抜方式（仮払消費税・仮受消費税を使う）とは違い、税込方式では消費税を本体価格と分けずに、そのまま仕入や売上の金額に含めて処理します。108円全額をそのまま「仕入」として計上する、シンプルな処理です。'
  },
  { id:1167, cat:'消費税', chap:'税効果',
    q:'<mark class="q-expense">決算にあたり、X社は、当期の消費税について、国に納める金額を計算</mark>した。当期の売上に含まれる消費税は10円、当期の仕入に含まれる消費税は8円であった。この<mark class="q-liability">差額が、国に納める消費税</mark>になる。X社は税込方式を採用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['租税公課',2]],c:[['未払消費税',2]]}],
    exp:'税込方式では、売上や仕入にすでに消費税が含まれてしまっているため、決算で改めて納める消費税額（10円－8円＝2円）を計算し、「租税公課」という費用として計上するとともに、「未払消費税」という負債を計上します。税抜方式（仮受・仮払消費税を相殺するだけ）とは違い、税込方式では納税額そのものが新たな費用として認識される点が異なります。'
  },
  { id:1206, cat:'伝票', chap:'外貨建・伝票・給与',
    q:'文房具を販売しているX社は、取引を、入金伝票・出金伝票・振替伝票の3種類の伝票に分けて記入している（<strong>3伝票制</strong>）。あるとき、X社は、お店に来たお客さんに、<mark class="q-revenue">文房具を100円で販売し</mark>、<mark class="q-asset">代金を、その場で、現金で受け取った</mark>。この取引を、入金伝票に記入する。この取引の仕訳を行いなさい。',
    e:[{d:[['現金',100]],c:[['売上',100]]}],
    exp:'「入金伝票」とは、現金が入ってくる取引を、記入する伝票のことです。入金伝票を使うと決めた時点で「借方が現金であること」は伝票の種類そのものから明らかなので、伝票には「何から現金を受け取ったのか（貸方の科目＝売上）」と金額だけを記入すれば十分です。仕訳に直すと「現金100／売上100」になります。'
  },
  { id:1207, cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、文房具の在庫が少なくなったため、仕入先から、文房具を仕入れることにした。<mark class="q-expense">文房具80円分が、お店に届き</mark>、<mark class="q-asset">代金を、その場で、現金で支払った</mark>。この取引を、出金伝票に記入する。この取引の仕訳を行いなさい。',
    e:[{d:[['仕入',80]],c:[['現金',80]]}],
    exp:'「出金伝票」とは、現金が出ていく取引を、記入する伝票のことです。出金伝票の貸方は必ず「現金」と決まっているので、伝票には「何に現金を使ったか（借方の科目＝仕入）」と金額だけを記入すれば十分です。仕訳に直すと「仕入80／現金80」になります。'
  },
  { id:1208, cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、新学期に向けて、<mark class="q-expense">仕入先から、文房具を100円で仕入れた</mark>。商品はお店に届いたが、<mark class="q-liability">代金は、月末にまとめて支払う約束（掛け）にした</mark>。この取引では、現金は動いていない。この取引を、振替伝票に記入する。この取引の仕訳を行いなさい。',
    e:[{d:[['仕入',100]],c:[['買掛金',100]]}],
    exp:'「振替伝票」とは、現金が動かない取引を、記入する伝票のことです。入金伝票・出金伝票は「現金の動きがある」ことが前提でしたが、振替伝票はそれ以外のすべての取引を扱うため、入金伝票や出金伝票と違って、借方・貸方の両方をきちんと記入する必要があります。「現金が入る→入金伝票、現金が出る→出金伝票、現金が動かない→振替伝票」という3つの使い分けを覚えておきましょう。'
  },
  { id:1209, cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、お店に来たお客さんに、<mark class="q-revenue">文房具を100円で販売した</mark>。代金のうち、<mark class="q-asset">40円は、その場で、現金で受け取り</mark>、<mark class="q-asset">残りの60円は、後日受け取る約束（掛け）にした</mark>。X社は、この取引を、現金の取引と、現金以外の取引に分けて（分解して）、それぞれ、入金伝票と振替伝票に記入する。この取引全体の仕訳を行いなさい。',
    e:[{d:[['現金',40],['売掛金',60]],c:[['売上',100]]}],
    exp:'現金と掛けが混ざった取引は「現金部分→入金伝票」「掛け部分→振替伝票」の2枚に分けて記入します。なぜ分けるかというと、入金・出金伝票のルールは「相手科目が必ず現金」だからです。掛け部分には現金が絡まないので、別の振替伝票にしなければなりません。2枚の伝票を合算すると、元の取引「現金40・売掛金60／売上100」という1つの仕訳に戻ります。'
  },
  { id:1210, cat:'伝票', chap:'外貨建・伝票・給与',
    q:'X社は、<mark class="q-expense">仕入先から、文房具を80円で仕入れた</mark>。代金のうち、<mark class="q-asset">30円は、その場で、現金で支払い</mark>、<mark class="q-liability">残りの50円は、後日支払う約束（掛け）にした</mark>。X社は、この取引を、現金の取引と、現金以外の取引に分けて（分解して）、それぞれ、出金伝票と振替伝票に記入する。この取引全体の仕訳を行いなさい。',
    e:[{d:[['仕入',80]],c:[['現金',30],['買掛金',50]]}],
    exp:'こちらも現金と掛けが混ざった取引を「現金部分→出金伝票」「掛け部分→振替伝票」の2枚に分けて記入するケースです。2枚の伝票を合算すると、元の取引「仕入80／現金30・買掛金50」という1つの仕訳に戻ります。1つの取引でも、支払い方法が混ざっていれば伝票を使い分ける、という3伝票制のルールを確認する問題です。'
  },
  // --- 税効果 ---
  { id:1153, cat:'税効果', chap:'税効果',
    q:'文房具を小売店に卸しているX社は、決算にあたり、<mark class="q-other">得意先に対する未回収の代金について、貸倒れに備えて、費用を計上した</mark>。会計上は、10円を費用としたが、税務上は、このうち、<mark class="q-asset">費用（損金）として認められる限度額を超える部分が、10円ある</mark>。この10円は、将来、実際に貸倒れが確定したときに、税金の計算でも、費用として認められる。実効税率は30％で、X社は税効果会計を適用している。決算に必要な仕訳を行いなさい。',
    e:[{d:[['繰延税金資産',3]],c:[['法人税等調整額',3]]}],
    exp:'「税務上」とは、税金の計算の上では、ということです。「損金」とは、税金の計算の上で、費用として認められる金額のことです。「将来減算一時差異」とは、会計上と税務上のズレのうち、将来、税金の計算で、費用として認められて、税金の支払いを減らすもののことです。会計上は費用として認めた金額でも、税務上はすぐに損金として認めてもらえないことがあります。将来、実際に貸し倒れが発生すれば、税務上もようやく損金として認められ、税金が安くなります。この「将来の税金が安くなる権利」を、あらかじめ「繰延税金資産」という資産として先取りで計上します（10円×30％＝3円）。'
  },
  { id:1154, cat:'税効果', chap:'税効果',
    q:'X社は、長期保有の目的で、Y社の株式を持っている。決算にあたり、この株式の時価が、取得原価より10円高くなっていた。<mark class="q-equity">この評価差額10円は、すでに、損益に入れず、全額を純資産に直接計上する方法で、処理してある</mark>。税務上、<mark class="q-liability">この10円は、この株式を売却したときに課税される</mark>。実効税率は30％で、X社は税効果会計を適用している。この評価差額に対する税効果について、決算に必要な仕訳を行いなさい。',
    e:[{d:[['その他有価証券評価差額金',3]],c:[['繰延税金負債',3]]}],
    exp:'「取得原価」とは、買ったときに支払った金額のことです。「評価差額」とは、時価と取得原価との差額のことです。「将来加算一時差異」とは、会計上と税務上のズレのうち、将来、税金の計算で、利益に加えられて、税金の支払いを増やすもののことです。その他有価証券の評価差益は、純資産に直接計上されますが、将来この株式を売却すれば、その利益に対して実際に税金がかかります。そこで、将来発生するであろう税金（10円×30％＝3円）をあらかじめ「繰延税金負債」として見込んでおき、純資産に計上する評価差額金は、税金分を差し引いた残りの金額にします。'
  },
  { id:1155, cat:'税効果', chap:'税効果',
    q:'決算にあたり、X社は、会計上と税務上のズレを、次のとおり確認した。1つ目は、<mark class="q-other">貸倒れに備えた費用のうち</mark>、<mark class="q-asset">損金として認められる限度額を超える部分が、10円ある</mark>。2つ目は、<mark class="q-other">減価償却費のうち</mark>、<mark class="q-asset">税務上の限度額を超える部分が、20円ある</mark>。この2つは、将来、税金の計算で、費用として認められる。3つ目は、<mark class="q-liability">その他有価証券の評価差益10円で、すでに、全額を純資産に直接計上してある。この10円は、将来、株式を売却したときに課税される</mark>。実効税率は30％で、X社は税効果会計を適用している。これらの税効果を、まとめて処理する、決算の仕訳を行いなさい。',
    e:[{d:[['繰延税金資産',9],['その他有価証券評価差額金',3]],c:[['法人税等調整額',9],['繰延税金負債',3]]}],
    exp:'3種類の一時差異を1問でまとめて処理する、税効果会計の総まとめ問題です。①貸倒れに備えた費用の超過額（将来減算一時差異）：10円×30％＝3円の繰延税金資産。②減価償却費の超過額（同じく将来減算一時差異）：20円×30％＝6円の繰延税金資産。①と②を合わせて繰延税金資産3円。①②は損益項目（法人税等調整額）として処理します。③その他有価証券の評価益（将来売却時に課税される＝将来加算一時差異）：10円×30％＝3円を繰延税金負債に計上し、純資産（その他有価証券評価差額金）を同額減らします。損益を通る項目（①②）と、純資産に直接計上する項目（③）を、しっかり区別して処理するのがポイントです。'
  },
  // --- 本支店・連結・個人事業主 ---
  { id:1168, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'雑貨を卸しているX社は、本店のほかに、支店を持っている。支店は、仕入先に対する未払いの代金を、支払う必要があったが、支店の手元の現金が、足りなかった。そこで、<mark class="q-other">本店</mark>が、<mark class="q-other">支店</mark>に、<mark class="q-asset">現金50円を送金</mark>した。本店と支店は、それぞれ、別々に帳簿をつけている。この送金について、本店と支店の、それぞれの仕訳を行いなさい。',
    e:[{d:[['支店',50]],c:[['現金',50]]},{d:[['現金',50]],c:[['本店',50]]}],
    exp:'「本店・支店」とは、本店は会社の中心となる営業所、支店は本店とは別の場所にある営業所のことです（会計では、本店と支店が、それぞれ別に帳簿をつけることがあります）。本店は、支店に送った現金を「支店」という内部取引専用の勘定（照合勘定）で管理し、支店は受け取った現金の相手科目として「本店」という勘定を使います。この「本店」勘定と「支店」勘定は、いわば会社内部でのお金の貸し借りを記録する鏡のような関係で、最終的に本店・支店をまとめた財務諸表を作るときには、お互いに相殺して消えます。'
  },
  { id:1169, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'X社の<mark class="q-other">支店</mark>は、決算日に、<mark class="q-expense">本店へ商品10円を発送</mark>した。支店は、そのことを、本店に連絡し、支店の帳簿には、すでに処理している。ところが、決算日の時点で、商品は、まだ本店に届いていない。そのため、本店の帳簿には、この商品の受入れが、記録されていない。本店が、決算日に行うべき仕訳を行いなさい。',
    e:[{d:[['支店より仕入',10]],c:[['支店',10]]}],
    exp:'「未達」とは、一方の帳簿では処理済みだが、もう一方には、まだ届いていない取引や商品のことです。支店はすでに発送した記録をつけていますが、本店にはまだ商品が届いておらず、記録が漏れている状態です。決算にあたっては、本店側でもこの未達分を認識し、「支店より仕入」という費用（本店から見た支店からの仕入）を計上し、相手科目として「支店」勘定を増やします。こうすることで、本店と支店の帳簿の金額が、最終的に一致するように調整されます。'
  },
  { id:1170, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'X社は、本店のほかに、九州支店と関西支店を持っている。X社は、支店どうしの取引も、すべて本店を通したものとして、<mark class="q-other">記帳する仕組み（本店集中計算制度）</mark>を採用している。九州支店が、<mark class="q-other">関西支店</mark>に、<mark class="q-asset">現金20円を送金</mark>した。この送金について、九州支店・本店・関西支店の、それぞれの帳簿の仕訳を行いなさい。',
    e:[{d:[['本店',20]],c:[['現金',20]]},{d:[['関西支店',20]],c:[['九州支店',20]]},{d:[['現金',20]],c:[['本店',20]]}],
    exp:'「本店集中計算制度」とは、支店どうしの取引を、直接のやりとりとはせず、すべて本店を通したものとして、記帳する制度のことです。実際には九州支店から関西支店へ直接送金していても、帳簿上は「まず九州支店から本店へ」「それから本店から関西支店へ」という2段階の取引があったかのように記録します。九州支店は「本店」勘定、本店は「関西支店」勘定と「九州支店」勘定、関西支店は「本店」勘定を使い、支店どうしが直接勘定を持ち合わない点がポイントです。すべての支店間取引の窓口を本店に一本化することで、本店が全社のお金の流れを把握しやすくなります。'
  },
  { id:1171, cat:'本支店会計', chap:'本支店・連結・個人事業主',
    q:'X社の本店は、原価80円の商品に、内部利益10円を加えた90円で、支店に商品を発送している。決算にあたり、支店の期末商品のうち、本店から発送された商品の金額は、発送価額（90円）で、<mark class="q-asset">45円分ある</mark>。この45円分の商品に含まれている<mark class="q-expense">内部利益を、控除する</mark>。本店の決算に必要な仕訳を行いなさい。',
    e:[{d:[['繰延内部利益控除',5]],c:[['繰延内部利益',5]]}],
    exp:'「内部利益」とは、本店が、支店に商品を発送するときに、原価に上乗せした利益のことです（会社全体で見ると、まだ実現していない利益なので、決算で控除します）。本店は商品を80円の原価に10円の利益を乗せた90円で支店に送っていますが、会社全体（本店＋支店）で見れば、まだ外部のお客さんに売れていない商品にすぎません。支店の期末在庫45円のうち、含まれている内部利益（45円×10／90＝5円）を、損益計算書上は「繰延内部利益控除」で取り除き、貸借対照表上は「繰延内部利益」という資産のマイナス項目として計上し、翌期に振り戻します。'
  },
  { id:1172, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'食品加工機械を製造しているX社は、部品を作っているY社の<mark class="q-asset">発行済株式の全てを、100円で取得</mark>して、Y社を子会社にした。取得した日（支配獲得日）の、Y社の純資産は、<mark class="q-equity">資本金50円</mark>と<mark class="q-equity">利益剰余金30円</mark>の、合計80円であった。連結の手続きでは、X社の投資と、Y社の純資産を<strong>相殺消去</strong>する。<mark class="q-asset">差額は、のれん</mark>として処理する。支配獲得日の連結仕訳を行いなさい。',
    e:[{d:[['資本金',50],['利益剰余金',30],['のれん',20]],c:[['子会社株式',100]]}],
    exp:'「連結」とは、親会社と子会社を、1つの会社のように、まとめて表す会計のことです。「子会社」とは、他の会社（親会社）に、過半数の議決権を持たれて、経営を支配されている会社のことです。「相殺消去」とは、グループ内の取引や貸し借りを、連結上、打ち消して、なかったことにすることです。親会社が投資した金額（子会社株式100円）と、子会社の純資産（資本金50円＋利益剰余金30円＝80円）を相殺すると、差額20円が残ります。「のれん」とは、買収した会社に、純資産より高い代金を払ったときの、その差額のことで、相手会社のブランド力など目に見えない価値への対価として資産計上します。'
  },
  { id:1173, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、Y社の<mark class="q-asset">発行済株式の80％を、90円で取得</mark>して、Y社を子会社にした。支配獲得日の、Y社の純資産は、<mark class="q-equity">資本金60円</mark>と<mark class="q-equity">利益剰余金40円</mark>の、合計100円であった。X社の持分（80％）にあたる80円は、X社の投資と相殺消去する。<mark class="q-equity">残りの20％にあたる20円は、他の株主（非支配株主）の持分</mark>として、残す。<mark class="q-asset">差額は、のれん</mark>として処理する。支配獲得日の連結仕訳を行いなさい。',
    e:[{d:[['資本金',60],['利益剰余金',40],['のれん',10]],c:[['子会社株式',90],['非支配株主持分',20]]}],
    exp:'「非支配株主」とは、子会社の株主のうち、親会社以外の株主のことです。100％子会社（前問）とは違い、80％だけ支配している場合は、子会社の純資産（100円）のうち、親会社の持分（80円）は投資（子会社株式90円）と相殺し、残り20％（20円）は「非支配株主持分」という純資産の項目として連結財務諸表に残します。相殺の差額10円（親会社の投資80円と取り分80円の差）は、のれんとして資産計上します。'
  },
  { id:1174, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'上記のY社は、<mark class="q-asset">土地（帳簿価額50円）</mark>を持っている。X社が<mark class="q-other">支配を獲得した日</mark>に、この土地の時価を調べたところ、55円であった。連結の手続きでは、支配獲得日の時価で、子会社の資産を、評価しなおす。税効果は、考えないものとする。支配獲得日の連結仕訳のうち、この土地について必要な仕訳を行いなさい。',
    e:[{d:[['土地',5]],c:[['評価差額',5]]}],
    exp:'連結会計では、子会社を「まるごと仲間に迎え入れる」ときに、子会社の資産・負債を「今の本当の価値（時価）」に評価し直すというルールがあります。帳簿には昔買ったときの値段（50円）が残っていますが、支配獲得日の時価が55円なら、差額5円を「評価差額」という純資産の勘定に計上します。この評価差額は、後で親会社の投資と子会社の純資産を相殺する処理のときに、子会社の純資産の一部として扱われます。'
  },
  { id:1175, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、連結の手続きで、上記のY社を子会社にしたときに、<mark class="q-asset">のれん10円を計上している</mark>。のれんは、<mark class="q-expense">支配獲得日から10年間にわたって、毎年同じ金額ずつ償却する</mark>。支配獲得日から、1年がたち、連結決算の時期になった。決算にあたり、この期の1年分について、必要な連結仕訳を行いなさい。',
    e:[{d:[['のれん償却',1]],c:[['のれん',1]]}],
    exp:'「償却」とは、のれんなどの価値の減少分を、毎期の費用にしていくことです。連結上計上したのれんも、個別財務諸表ののれんと同じように、一定期間にわたって少しずつ費用化していきます。10円÷10年＝1円が1年分の償却額です。'
  },
  { id:1176, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'Y社は、今期、<mark class="q-other">当期純利益30円を計上した</mark>。X社は、Y社の株式の80％を持ち、<mark class="q-equity">残りの20％は、非支配株主が持っている</mark>。連結上は、Y社の利益のうち、非支配株主の持分にあたる部分を、区別して表す。この連結仕訳を行いなさい。',
    e:[{d:[['非支配株主に帰属する当期純利益',6]],c:[['非支配株主持分',6]]}],
    exp:'子会社が稼いだ利益は、親会社の取り分だけでなく、非支配株主の取り分もあります。Y社の当期純利益30円のうち、非支配株主の持分割合20％にあたる6円（30円×20％）は、連結損益計算書上「非支配株主に帰属する当期純利益」として区分し、非支配株主持分（純資産）を増やします。子会社の儲けのうち、親会社の分は親会社の利益剰余金へ、他の株主の分は非支配株主持分へ、取り分に応じて分けるイメージです。'
  },
  { id:1177, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'Y社は、株主に、<mark class="q-revenue">配当金10円を支払う</mark>ことを決めた。このうち、<mark class="q-equity">X社（80％）に8円、非支配株主（20％）に2円が</mark>、支払われる。X社が受け取った配当金は、グループ内のやりとりなので、連結上、相殺消去する。この連結仕訳を行いなさい。',
    e:[{d:[['受取配当金',8],['非支配株主持分',2]],c:[['剰余金の配当',10]]}],
    exp:'子会社が親会社に払う配当金は、グループ全体で見れば「自分の左のポケットから右のポケットにお金を移しただけ」で、外部との本当の取引ではありません。親会社が受け取った配当金（受取配当金8円）は取り消し、非支配株主への配当分（2円）は非支配株主持分（純資産）の減少として処理します。もともと子会社側で計上されていた「剰余金の配当」（純資産の減少）10円を、相殺によって取り消します。'
  },
  { id:1178, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'当期中に、X社は、Y社に、<mark class="q-expense">商品40円を販売</mark>した。X社は、<mark class="q-revenue">この40円を売上として</mark>、Y社は、この40円を仕入として、それぞれ記録している。この取引は、グループ内の取引なので、連結上は、なかったことにする。この内部取引の相殺消去の、連結仕訳を行いなさい。',
    e:[{d:[['売上',40]],c:[['仕入',40]]}],
    exp:'連結財務諸表は「グループ全体を1つの会社」として見た財務諸表です。親会社が子会社に商品を売っても、グループの外から見れば商品が社内で移動しただけで、本当の売上・仕入ではありません。そこで、親会社の「売上」と子会社の「仕入」を、金額をぶつけ合って両方ともゼロにします。'
  },
  { id:1179, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'期末に、X社は、Y社に<mark class="q-asset">商品を販売した代金</mark>25円を、まだ受け取っていない。Y社から見ると、X社から<mark class="q-liability">仕入れた商品の代金</mark>25円を、まだ支払っていない。この2つは、どちらも、X社とY社のグループ内の貸し借りにあたる。グループ全体で見ると、外部との貸し借りではないため、連結上は<strong>相殺消去</strong>する。この連結仕訳を行いなさい。',
    e:[{d:[['買掛金',25]],c:[['売掛金',25]]}],
    exp:'親会社の売掛金（グループ内の子会社に対する債権）と、子会社の買掛金（グループ内の親会社に対する債務）は、グループ全体で見れば「自分が自分に貸しているだけ」で、実質的な貸し借りはありません。そこで、親会社の「売掛金」と子会社の「買掛金」を、金額をぶつけ合って両方ともゼロにします。'
  },
  { id:1180, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'Y社の、<mark class="q-asset">期末の商品10円分</mark>は、X社から購入したものである。X社が、Y社に販売したときに上乗せしていた利益のうち、まだグループの外に売れていない分<mark class="q-expense">（未実現利益）が、2円ある</mark>。この未実現利益を、連結上、消去する。この連結仕訳を行いなさい。',
    e:[{d:[['売上原価',2]],c:[['商品',2]]}],
    exp:'「未実現利益」とは、グループ内の取引で生じた利益のうち、グループの外に売れていないために、まだ実現していない利益のことです。親会社が子会社に商品を売るときに乗せた利益は、グループ外のお客さんにまだ売れていない限り、グループ全体としては「本当の儲け」とは言えません。期末の子会社在庫10円に含まれる未実現利益2円分を、「売上原価」という費用を増やし、「商品」という資産を減らすことで取り除きます。'
  },
  { id:1181, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、Y社の発行済株式の60％を持ち、Y社を支配している。X社は、さらに、Y社の株式の20％を、<mark class="q-asset">現金30円で追加取得</mark>して、持ち株比率を80％にした。<mark class="q-equity">追加取得した株式にあたる、Y社の純資産に対する持分は、25円である</mark>。子会社の支配を保ったまま、株式を追加取得したときは、支払った対価と、非支配株主の持分の減少額との差額を、<mark class="q-equity">資本剰余金として処理する</mark>。この連結仕訳を行いなさい。',
    e:[{d:[['非支配株主持分',25],['その他資本剰余金',5]],c:[['現金',30]]}],
    exp:'「追加取得」とは、すでに支配している子会社の株式を、さらに買い増すことです。すでに支配は獲得済みなので、のれんは新たに計算しません。非支配株主（他の株主）から株を買い取るイメージなので、非支配株主持分のうち買い取った分（25円）を減らします。実際に払った金額（30円）が、この非支配株主持分の減少額（25円）より多いので、その超過分5円は、損益ではなく「その他資本剰余金」という純資産の減少として処理します。「株主間の持分の移動に、余計に払った分は、純資産の中で調整する」というイメージです。'
  },
  { id:1182, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、すでにY社の発行済株式の70％を持ち、Y社を支配している。X社は、さらに、Y社の株式の10％を、<mark class="q-asset">現金40円で追加取得</mark>して、持ち株比率を80％にした。<mark class="q-equity">追加取得した株式にあたる、Y社の純資産に対する持分は、32円である</mark>。<mark class="q-equity">差額は、資本剰余金</mark>として処理する。この連結仕訳を行いなさい。',
    e:[{d:[['非支配株主持分',32],['その他資本剰余金',8]],c:[['現金',40]]}],
    exp:'前問と同じパターンの追加取得です。非支配株主持分の減少額32円と、実際に支払った対価40円との差額8円を「その他資本剰余金」として処理します。「グループ内の株主構成が変わっただけ」なので、損益としては扱わないのがポイントです。'
  },
  { id:1183, cat:'連結会計', chap:'本支店・連結・個人事業主',
    q:'X社は、以前に、Y社の<mark class="q-asset">株式</mark>の20％を、25円で取得して、Y社を関連会社として持っていた。今回、さらに、Y社の株式の60％を、60円で取得して、Y社の支配を獲得した。このように、何回かに分けて株式を取得して、支配を得ることを、<strong>段階取得</strong>という。<mark class="q-revenue">支配獲得日の時価で、支配を獲得する前から持っていた20％の株式は、28円である</mark>。連結上、この20％の株式を、支配獲得日の時価に、評価しなおす。この連結仕訳を行いなさい。',
    e:[{d:[['子会社株式',3]],c:[['段階取得に係る差益',3]]}],
    exp:'「段階取得」とは、何回かに分けて、株式を取得して、子会社の支配を得ることです。一気に支配株主になるのではなく、少しずつ株を買い増して最終的に子会社化するケースでは、「支配を獲得した瞬間」に、それまで持っていた分（20％）も含めて全部を「今の時価」で評価し直すというルールがあります。以前25円で買った20％分が、今では28円の価値になっていたので、差額3円を「段階取得に係る差益」（連結上の収益）として計上します。'
  },
  { id:1184, cat:'個人事業主', chap:'本支店・連結・個人事業主',
    q:'個人でパン屋（山田ベーカリー）を営む山田花子さんは、住宅街で、朝から焼きたてのパンを売っている。ある日、家族の誕生日のごちそうを買うために、お店のレジの<mark class="q-asset">現金から、10円を引き出して</mark>、自宅の生活費として使った。この10円は、<mark class="q-equity">お店の仕事とは関係のない、私用のための支出</mark>である。会社ではないので、お店のお金と、山田さん個人のお金は、別々に記帳する。この日の、山田ベーカリーの仕訳を行いなさい。',
    e:[{d:[['事業主貸',10]],c:[['現金',10]]}],
    exp:'「個人事業主」とは、会社を作らずに、個人が、自分の名前で事業を営む人のことです（事業のお金と、個人のお金は、別々に記帳します）。店主がお店のお金を私用に使うと、お店から見れば「店主への一時的な貸し」のような性質を持つため、「事業主貸」という資本のマイナス項目で処理します。株式会社の配当のような、純資産を減らす処理と似た働きをします。'
  },
  { id:1185, cat:'個人事業主', chap:'本支店・連結・個人事業主',
    q:'山田ベーカリーは、小麦粉やバターなどの材料の仕入れ代金の支払いが、月末に重なった。お店のレジの現金が足りなくなり、このままでは、仕入先への支払いに間に合わない。そこで、店主の山田花子さんは、<mark class="q-equity">自分の財布から、5円を</mark>、<mark class="q-asset">お店の資金として、お店のレジに入れた</mark>。この日の、山田ベーカリーの仕訳を行いなさい。',
    e:[{d:[['現金',5]],c:[['事業主借',5]]}],
    exp:'店主が個人のお金をお店に入れると、お店から見れば「店主からの一時的な借り」のような性質を持つため、「事業主借」という資本のプラス項目で処理します。株式会社の増資に近いイメージですが、個人事業では株式を発行する代わりに「事業主借」という科目で記録します。'
  },
  { id:1186, cat:'個人事業主', chap:'本支店・連結・個人事業主',
    q:'山田ベーカリーは、決算を迎えた。今期の途中で、店主の山田花子さんは、私用のために、<mark class="q-equity">お店の現金10円を、引き出している</mark>。また、<mark class="q-equity">自分のお金5円を、お店の資金として、お店に入れている</mark>。決算にあたり、これらの、店主とお店とのあいだのお金のやりとりを、店主が事業に出している元手の金額に、まとめて反映させる仕訳を行いなさい。',
    e:[{d:[['資本金',5],['事業主借',5]],c:[['事業主貸',10]]}],
    exp:'個人事業主の「事業主貸」「事業主借」は、期中はそれぞれ別々に記録しておきますが、決算のときには、最終的に「資本金」という1つの純資産の科目にまとめて反映させます。事業主貸10円（店主への貸し＝資本金を減らす方向）と事業主借5円（店主からの借り＝資本金を増やす方向）を相殺すると、差し引き5円だけ資本金を減らす必要があります。借方に資本金5円（減少）と事業主借5円（精算）、貸方に事業主貸10円（精算）を計上することで、両方の科目をゼロに戻しつつ、資本金を正味5円減らします。'
  },
  // --- 決算整理 ---
  { id:1187, cat:'経過勘定', chap:'決算整理',
    q:'名刺やチラシを印刷しているX社は、12月1日に、<mark class="q-expense">工場の火災保険の保険料として</mark>、向こう1年分（12月から翌年11月まで）の12円を、<mark class="q-asset">現金で支払った</mark>。支払ったときは、全額を、その期の費用として記録した。決算日は3月31日である。決算にあたり、<mark class="q-asset">まだ保険の期間が来ていない分</mark>を、月割で、次の期に繰り延べる。支払った日と、決算日の、それぞれの仕訳を行いなさい。',
    e:[{d:[['支払保険料',12]],c:[['現金',12]]},{d:[['前払費用',8]],c:[['支払保険料',8]]}],
    exp:'「月割」とは、1年分の金額を、月ごとに等分して計算することです。支払った12月1日の時点では、1年分12円を全額その期の費用（支払保険料）として記録します。しかし決算日（3月31日）の時点で、保険期間のうち、まだ到来していない翌期分（4月から11月までの8か月、12円×8／12＝8円）が残っています。この分は今期の費用にすべきではないため、「前払費用」という資産に振り替えて、来期に繰り延べます。'
  },
  { id:1188, cat:'経過勘定', chap:'決算整理',
    q:'X社は、設備を購入するために、銀行から、お金を借りている。この借入金の利息は、半年ごとに、まとめて支払う約束になっている。決算日の時点で、前回の利息の支払いから、3か月がたっている。この<mark class="q-expense">3か月分の利息3円は、時間がたっているので、すでに発生している</mark>が、<mark class="q-liability">まだ支払っていない</mark>。決算にあたり、この3円について、必要な仕訳を行いなさい。',
    e:[{d:[['支払利息',3]],c:[['未払費用',3]]}],
    exp:'お金を借りている期間の利息は、実際に払う前でも「今期分は今期の費用」として記録します。これが発生主義の考え方です。まだ払っていない利息は「未払費用」という負債として計上し、翌期首に逆仕訳（再振替仕訳）で取り消し、実際の支払い時に費用計上が完結します。'
  },
  { id:1189, cat:'経過勘定', chap:'決算整理',
    q:'X社は、取引先に、お金を貸している。この貸付金の利息は、返済のときに、まとめて受け取る約束になっている。決算日の時点で、貸付けから一定の期間がたっており、そのうち、この期に対応する<mark class="q-revenue">利息2円は、すでに発生している</mark>が、<mark class="q-asset">まだ受け取っていない</mark>。決算にあたり、この2円について、必要な仕訳を行いなさい。',
    e:[{d:[['未収収益',2]],c:[['受取利息',2]]}],
    exp:'利息は本来、実際に受け取るタイミングではなく、時間の経過とともに発生していくものです。まだ実際には受け取っていなくても、すでに今期の権利として発生しているため「未収収益」という資産に計上し、今期の収益として認識します。'
  },
  { id:1190, cat:'経過勘定', chap:'決算整理',
    q:'X社は、使っていない事務所を、他社に貸している。12月1日に、借り手から、向こう1年分（12月から翌年11月まで）の<mark class="q-revenue">家賃12円を</mark>、<mark class="q-asset">現金で受け取った</mark>。受け取ったときは、全額を、その期の収益として記録した。決算日は3月31日である。決算にあたり、<mark class="q-liability">まだ貸していない期間の家賃</mark>を、月割で、次の期に繰り延べる。受け取った日と、決算日の、それぞれの仕訳を行いなさい。',
    e:[{d:[['現金',12]],c:[['受取家賃',12]]},{d:[['受取家賃',8]],c:[['前受収益',8]]}],
    exp:'受け取った12月1日の時点では、1年分12円を全額その期の収益（受取家賃）として記録します。しかし決算日の時点で、まだ貸していない翌期分（4月から11月までの8か月、12円×8／12＝8円）が含まれています。「お金は受け取ったが、その対価となるサービス（部屋を貸すこと）をまだ提供し終えていない」ため、今期の収益から取り除いて「前受収益」という負債に振り替え、翌期になってから改めて収益として認識し直します。'
  },
  { id:1191, cat:'貸倒', chap:'決算整理',
    q:'X社は、前の期に、得意先が倒産して、その得意先に対する未回収の代金を、貸倒れとして処理した。ところが、当期になって、その得意先の財産が整理され、<mark class="q-revenue">前の期に貸倒れとして処理した代金のうち、8円が、回収できることになった</mark>。X社は、この8円を、<mark class="q-asset">現金で回収した</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['現金',8]],c:[['償却債権取立益',8]]}],
    exp:'「貸倒れ」とは、得意先の倒産などで、代金が、回収できなくなることです。前期にすでに「もう回収できない」と判断して損失処理していた債権が、思いがけず回収できた場合、あらためて「売掛金」として復活させるのではなく、「償却債権取立益」という特別な収益として処理します。「あきらめていたお金が、臨時収入として戻ってきた」というイメージです。'
  },
  { id:1192, cat:'貸倒引当金', chap:'決算整理',
    q:'X社は、前の期の決算で、回収できなくなる可能性に備えて、貸倒引当金を設定していた。今期の決算にあたり、得意先の状況が改善したため、<mark class="q-revenue">この見積りが、3円、大きすぎたことがわかった</mark>。X社は、<mark class="q-other">この3円分を、取り消す</mark>。決算に必要な仕訳を行いなさい。',
    e:[{d:[['貸倒引当金',3]],c:[['貸倒引当金戻入',3]]}],
    exp:'前期に見積もった貸倒引当金が、実際には多すぎたと分かった場合は、その超過分を取り崩して「貸倒引当金戻入」という収益として計上します。「将来の損失に備えて多めに積み立てすぎていた分を、状況の改善にあわせて払い戻す」というイメージです。'
  },
  { id:1193, cat:'租税・貯蔵品', chap:'決算整理',
    q:'X社は、新商品の案内状を、お客さん200人に送ることにした。案内状に貼る<mark class="q-expense">郵便切手10円分</mark>と、契約書に貼る<mark class="q-expense">収入印紙5円分</mark>が、必要になった。そこで、郵便局で、郵便切手10円分と、収入印紙5円分を、<mark class="q-asset">現金で購入した</mark>。購入したときは、すぐに、費用として記録した。この日の仕訳を行いなさい。',
    e:[{d:[['通信費',10],['租税公課',5]],c:[['現金',15]]}],
    exp:'郵便切手は通信のための費用なので「通信費」、収入印紙は税金関係の費用なので「租税公課」と、それぞれ性質の異なる科目に分けて計上します。購入した時点でいったん全額を費用として処理するのが一般的なやり方です。'
  },
  { id:1194, cat:'租税・貯蔵品', chap:'決算整理',
    q:'決算にあたり、X社は、上記の郵便切手と収入印紙のうち、まだ使っていない分を確認した。<mark class="q-asset">未使用の郵便切手は4円分、未使用の収入印紙は2円分</mark>であった。これらは、まだ使っていないので、価値が残っている。決算に必要な仕訳を行いなさい。',
    e:[{d:[['貯蔵品',6]],c:[['通信費',4],['租税公課',2]]}],
    exp:'切手や収入印紙は、購入した時点でいったん全額を費用として計上するのが一般的ですが、決算時にまだ使っていない分が残っていたら、それは「来期以降に使う分」なので、今期の費用から取り除いて「貯蔵品」という資産に振り替えます。未使用の切手4円と収入印紙2円、合わせて6円を貯蔵品に計上します。'
  },
  { id:1195, cat:'租税・貯蔵品', chap:'決算整理',
    q:'翌期の期首（期の初め）を迎えた。X社は、前の期の決算で、未使用の郵便切手4円分と収入印紙2円分を、<mark class="q-asset">貯蔵品として処理していた</mark>。これらは、翌期も使うため、そのまま持ち越している。翌期の期首にあたり、X社は、これらについて、<strong>再振替仕訳</strong>を行いなさい。',
    e:[{d:[['通信費',4],['租税公課',2]],c:[['貯蔵品',6]]}],
    exp:'「期首」とは、会計期間の最初の日のことです。「再振替仕訳」とは、前の期の決算で行った、経過勘定などの処理を、次の期の初めに、いったん元に戻す仕訳のことです。前期末に貯蔵品（資産）としていったん計上していた切手・印紙を、新しい期が始まったタイミングで、もとの費用科目（通信費・租税公課）に戻します。こうすることで、翌期に実際に使ったときは、あらためて複雑な調整をせずに済みます。'
  },
  { id:1196, cat:'決算振替', chap:'決算整理',
    q:'書籍や文房具を販売しているX社は、決算を迎えた。会社は、決算のときに、その期の収益と費用を、それぞれの勘定から、損益勘定という1つの勘定に集めて、その期の利益を計算する。収益の勘定のうち、<mark class="q-revenue">売上の残高は800円、受取利息の残高は2円</mark>であった。これらの収益の勘定の残高を、損益勘定に振り替える、決算の仕訳を行いなさい。',
    e:[{d:[['売上',800],['受取利息',2]],c:[['損益',802]]}],
    exp:'「損益勘定」とは、その期の収益と費用を、1か所に集めて、利益を計算するための、決算専用の勘定のことです。決算になると、まず収益の勘定（売上・受取利息など）をすべてこの損益勘定に集め、それぞれの収益の勘定を空っぽ（ゼロ）に戻します。売上800円と受取利息2円を合わせた802円が、損益勘定の貸方に集まります。'
  },
  { id:1197, cat:'決算振替', chap:'決算整理',
    q:'X社は、上記の続きの決算の手続きとして、今度は、費用の勘定の残高を、損益勘定に振り替える。上記で、収益の勘定を損益勘定に集めたのと、同じ手続きである。費用の勘定のうち、<mark class="q-expense">仕入の残高は600円、給料の残高は50円</mark>であった。これらの費用の勘定の残高を、損益勘定に振り替える、決算の仕訳を行いなさい。',
    e:[{d:[['損益',650]],c:[['仕入',600],['給料',50]]}],
    exp:'決算振替の2つ目のステップとして、費用の勘定（仕入・給料など）もすべて損益勘定に集めます。これで、損益勘定の借方には費用の合計（650円）、貸方には収益の合計（802円、前問）が並ぶことになり、この差額がそのまま「今期の儲け（当期純利益）」を表します。'
  },
  { id:1198, cat:'決算振替', chap:'決算整理',
    q:'X社は、収益と費用の勘定の残高を、損益勘定に集めた。収益の合計802円から、費用の合計650円を引いた、<mark class="q-equity">152円の残高（当期純利益）</mark>が、損益勘定の貸方に残った。X社は、当期純利益を、これまでに稼いだ利益の蓄積を表す勘定に加えていく。損益勘定の貸方残高152円を、その勘定に振り替える、決算の仕訳を行いなさい。',
    e:[{d:[['損益',152]],c:[['繰越利益剰余金',152]]}],
    exp:'損益勘定に集計した結果、収益（802円）が費用（650円）を上回り、152円の利益が出たことが分かりました。この利益は最終的に会社の財産（純資産）の一部として蓄積されるので、「繰越利益剰余金」という純資産の勘定に振り替えます。これで損益勘定はきれいにゼロに戻り、翌期の集計に備えられます。'
  },
  { id:1199, cat:'決算振替', chap:'決算整理',
    q:'個人でパン屋（山田ベーカリー）を営む山田花子さんは、決算にあたり、収益と費用の勘定の残高を、損益勘定に集めた。その結果、損益勘定の貸方に、<mark class="q-equity">152円の残高（当期純利益）</mark>が残った。個人事業では、当期純利益は、店主の元手を表す勘定に加える。損益勘定の貸方残高152円を、その勘定に振り替える、決算の仕訳を行いなさい。',
    e:[{d:[['損益',152]],c:[['資本金',152]]}],
    exp:'株式会社では利益を「繰越利益剰余金」に振り替えますが、個人事業主の場合は、利益を店主の元手を表す「資本金」という勘定に直接加えます。会社の形態によって、利益の行き先の科目が異なる点に注意しましょう。'
  },
  { id:1200, cat:'経過勘定', chap:'決算整理',
    q:'荷物の運送をしているX社は、前の期の決算で、翌期に対応する<mark class="q-expense">保険料8円を</mark>、<mark class="q-asset">前払費用として処理していた</mark>。この保険料は、前の期に、支払ったときに、費用として記録したものを、決算で、費用から差し引いた分である。当期の期首（期の初め）を迎えた。X社は、この前払費用を、もとの保険料の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['支払保険料',8]],c:[['前払費用',8]]}],
    exp:'前期末の決算で「まだ使っていない保険期間の分」を前払費用（資産）として計上していました。新しい期が始まったら、この分をいったん逆向きの仕訳で取り消しておきます。こうすることで、翌期分の保険期間が実際に経過したときに、余計な調整をせず、シンプルに費用計上できるようになります。'
  },
  { id:1201, cat:'経過勘定', chap:'決算整理',
    q:'X社は、前の期の決算で、<mark class="q-expense">まだ支払っていなかった利息3円を</mark>、<mark class="q-liability">未払費用として処理していた</mark>。この利息は、前の期に、すでに発生していたものを、決算で、見越して費用に計上した分である。当期の期首を迎えたので、この未払費用を、もとの利息の費用の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['未払費用',3]],c:[['支払利息',3]]}],
    exp:'前期末の決算で「まだ支払っていないが今期分として発生している費用」を未払費用（負債）として先取りして計上していました。新しい期が始まったら、この先取り分をいったん逆向きの仕訳で取り消しておきます。こうすることで、実際に支払ったときに余計な調整をせず、シンプルに記録できるようになります。'
  },
  { id:1202, cat:'経過勘定', chap:'決算整理',
    q:'X社は、前の期の決算で、<mark class="q-revenue">まだ提供していない期間の家賃8円を</mark>、<mark class="q-liability">前受収益として処理していた</mark>。この家賃は、前の期に、受け取ったときに、収益として記録したものを、決算で、収益から差し引いた分である。当期の期首を迎えたので、この前受収益を、もとの家賃の収益の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['前受収益',8]],c:[['受取家賃',8]]}],
    exp:'前期末の決算で「まだサービスを提供していない翌期分」を前受収益（負債）として計上していました。新しい期が始まったら、この分をいったん逆向きの仕訳で取り消しておきます。これにより、翌期に実際にサービス提供期間が経過したときに、素直に収益として認識できるようになります。'
  },
  { id:1203, cat:'経過勘定', chap:'決算整理',
    q:'X社は、前の期の決算で、<mark class="q-revenue">まだ受け取っていなかった利息2円を</mark>、<mark class="q-asset">未収収益として処理していた</mark>。この利息は、前の期に、すでに発生していたものを、決算で、見越して収益に計上した分である。当期の期首を迎えたので、この未収収益を、もとの利息の収益の勘定に戻すために、再振替仕訳を行いなさい。',
    e:[{d:[['受取利息',2]],c:[['未収収益',2]]}],
    exp:'前期末の決算で「まだ受け取っていないが今期分として発生している収益」を未収収益（資産）として先取りして計上していました。新しい期が始まったら、この先取り分をいったん逆向きの仕訳で取り消しておきます。実際に利息を受け取ったときに、あらためて収益として記録し直す準備です。'
  },
  { id:1204, cat:'修正仕訳', chap:'決算整理',
    q:'X社は、仕入先に対する<mark class="q-liability">未払いの代金40円を、現金で支払った</mark>。経理担当者は、この取引を、誤って、<mark class="q-expense">借方を「仕入」として記帳していた</mark>（貸方の現金は、正しく記帳している）。決算のときに、この誤りが見つかった。誤りを訂正して、正しい仕訳にするための、訂正の仕訳を行いなさい。',
    e:[{d:[['買掛金',40]],c:[['仕入',40]]}],
    exp:'間違えた仕訳を直す方法は「①間違いを逆向きに消す→②正しく書き直す」の2ステップですが、まとめて1本の訂正仕訳で表すこともできます。誤って記帳していた「仕入40／現金40」を正しい「買掛金40／現金40」に直すには、貸方の現金はすでに正しいのでそのままにし、借方だけを「仕入」から「買掛金」に付け替えます。差額として「買掛金40／仕入40」という訂正仕訳を行うことで、帳簿が正しい状態になります。'
  },
  { id:1205, cat:'修正仕訳', chap:'決算整理',
    q:'X社は、得意先に対する未回収の代金を、現金で回収した。<mark class="q-asset">回収した金額は、150円であったが、経理担当者は、誤って、120円と記帳していた</mark>。決算のときに、この誤りが見つかった。差額の30円を訂正する仕訳を行いなさい。',
    e:[{d:[['現金',30]],c:[['売掛金',30]]}],
    exp:'本当は150円回収していたのに、120円としか記帳していなかったケースです。記帳が足りなかった差額30円分だけ、現金（資産）を追加で増やし、売掛金（資産）を追加で減らします。「記帳し忘れていた分を、あとから付け足す」シンプルな訂正仕訳です。'
  },
  // --- 工業簿記 ---
  { id:1211, cat:'材料費', chap:'工業簿記',
    q:'自動車向けの金属部品を製造しているX社は、<mark class="q-asset">部品の材料となる鋼材50円分</mark>を、鉄鋼商社のY社から<mark class="q-liability">掛けで購入した</mark>。鋼材を工場まで運んでもらうための<mark class="q-asset">引取運賃5円は</mark>、X社が負担し、<mark class="q-asset">現金で支払った</mark>。引取運賃は、材料の取得原価に含める決まりになっている。この日の仕訳を行いなさい。',
    e:[{d:[['材料',55]],c:[['買掛金',50],['現金',5]]}],
    exp:'「引取運賃」とは、買ったものを、相手先から自社まで運んでもらうための運賃のことです。「取得原価」とは、買ったときに支払った金額のことです。工業簿記でも商業簿記と同じように、材料を使えるようになるまでにかかった付随費用（引取運賃）は、材料本体の値段に含めます。鋼材代金50円に運賃5円を加えた55円を「材料」という資産として計上します。'
  },
  { id:1212, cat:'材料費', chap:'工業簿記',
    q:'X社は、材料を製造に使ったとき、あらかじめ決めておいた価格（<strong>予定消費価格</strong>）で消費額を計算し、記帳している。当月は、予定消費価格で計算した消費額が50円であった。月末に、実際に仕入れた価格で計算しなおすと、<mark class="q-asset">消費額は52円であった</mark>。<mark class="q-other">実際の消費額のほうが2円多い</mark>ため、月末に、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['材料消費価格差異',2]],c:[['材料',2]]}],
    exp:'「予定消費価格」とは、材料の消費額を計算するために、あらかじめ決めておく1単位あたりの価格のことです。実際の価格を待たずに、あらかじめ決めた価格で計算しておくことで、すばやく原価を把握できます。月末に実際の価格で計算しなおした結果とのズレ（52円－50円＝2円）は、「材料消費価格差異」という差異の科目で処理し、材料という資産の帳簿価額も実際の金額に合わせて修正します。'
  },
  { id:1213, cat:'労務費', chap:'工業簿記',
    q:'X社は、毎月25日に、従業員に労働の対価を支払っている。今月の支給日を迎え、工場の製造ラインで、部品の切断や研磨などの加工を行っている作業員に、今月の<mark class="q-expense">労働の対価40円を</mark>、<mark class="q-asset">現金で支払った</mark>。作業員は、<mark class="q-expense">製品の加工に直接たずさわっている</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['賃金',40]],c:[['現金',40]]}],
    exp:'製品の加工に直接たずさわる作業員の労働の対価は「賃金」という労務費（製造原価の一部）で処理します。工場で働く人の人件費でも、製品を直接作る作業員（直接工）には「賃金」、事務作業を行う職員（間接工）には「給料」というように、役割によって使う科目が分かれる点がポイントです。'
  },
  { id:1214, cat:'労務費', chap:'工業簿記',
    q:'X社は、同じ支給日に、工場の事務所で働く職員にも、労働の対価を支払った。この職員は、材料の発注や帳簿付けなどの管理の仕事を行っており、<mark class="q-expense">製品の加工にはたずさわっていない</mark>。支払った今月の<mark class="q-expense">労働の対価は20円</mark>で、<mark class="q-asset">現金で支払った</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['給料',20]],c:[['現金',20]]}],
    exp:'製品の加工に直接たずさわらない、管理的な仕事をする職員の労働の対価は「給料」で処理します。前問の「賃金」（製品を直接作る作業員）とは区別し、製造間接費（どの製品にかかったか直接特定できない費用）として扱われることになります。'
  },
  { id:1215, cat:'労務費', chap:'工業簿記',
    q:'X社は、作業員の労働の消費額を、あらかじめ決めた1時間あたりの金額（<strong>予定賃率</strong>）で計算し、記帳している。当月は、残業が多かったため、実際の1時間あたりの金額（実際賃率）が予定賃率より高くなった。その結果、<mark class="q-other">実際の消費額が、予定賃率で計算した額より3円多くなった</mark>。月末に、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['賃率差異',3]],c:[['賃金',3]]}],
    exp:'「予定賃率」とは、労働の消費額を計算するために、あらかじめ決めておく1時間あたりの金額のことです。「実際賃率」とは、実際に支払った労働の対価から計算した、1時間あたりの金額のことです。材料費の予定消費価格と同じ考え方で、労務費も予定賃率であらかじめ計算しておき、月末に実際の金額とのズレを「賃率差異」として処理します。残業が多いと実際の時給が上がり、不利な差異（費用が増える方向）が生じやすくなります。'
  },
  { id:1216, cat:'経費', chap:'工業簿記',
    q:'月末に、X社は、工場の建物について、当月分の<mark class="q-expense">減価償却費15円を計上</mark>する。工場の建物は、すべての製品の製造に使われているため、その減価償却費は、<mark class="q-expense">どの製品にかかったかを直接特定できない製造のための費用</mark>として扱う。<mark class="q-other">記帳は間接法による</mark>。この日の仕訳を行いなさい。',
    e:[{d:[['製造間接費',15]],c:[['減価償却累計額',15]]}],
    exp:'工場の建物のように、特定の製品にではなく、工場全体の製造活動のために使われる資産の減価償却費は「製造間接費」として処理します。どの製品にいくらかかったかを直接特定できない費用は、いったんこの「製造間接費」という科目にまとめて集め、あとで一定の基準で各製品に振り分けます（配賦）。'
  },
  { id:1217, cat:'製造間接費', chap:'工業簿記',
    q:'X社は、材料・労働・その他の費用のうち、どの製品にかかったかを直接特定できないものを、月末に、まとめて1つの勘定に集めている。当月の、そうした間接的な費用は、<mark class="q-asset">材料10円</mark>、<mark class="q-expense">労働8円</mark>、<mark class="q-expense">その他の費用5円</mark>であった。その他の費用（電力料など）は、発生したときに、材料や労働とは別の勘定に記録してある。月末に、これらを1つの勘定に集める仕訳を行いなさい。',
    e:[{d:[['製造間接費',23]],c:[['材料',10],['賃金',8],['経費',5]]}],
    exp:'間接的な材料費（補助材料など）、間接的な労務費（間接工の給料など）、そして電力料のような「経費」を、月末にまとめて「製造間接費」という1つの勘定に集計します。材料10円＋賃金8円＋経費5円＝23円が、今月の製造間接費の総額です。これを次の問題で、各製品に配賦していきます。'
  },
  { id:1218, cat:'製造間接費', chap:'工業簿記',
    q:'X社は、上記のように集めた間接的な費用を、製品ごとの原価に含めるため、製造中の製品に割り振っている。月末まで待たずに製品の原価を計算できるよう、割り振りには、あらかじめ決めた配賦率（<strong>予定配賦率</strong>）を使う。当月、予定配賦率にもとづいて<mark class="q-asset">製造中の製品に配賦した額は、23円であった</mark>。この仕訳を行いなさい。',
    e:[{d:[['仕掛品',23]],c:[['製造間接費',23]]}],
    exp:'「配賦」とは、共通してかかった費用を、一定の基準で、製品などに割り振ることです。「予定配賦率」とは、間接的な費用を配賦するために、あらかじめ決めておく割合のことです。製造間接費という「まとめ箱」に集めた費用を、あらかじめ決めた配賦率で、実際に製造している製品（仕掛品）の原価に振り分けます。'
  },
  { id:1219, cat:'個別原価計算', chap:'工業簿記',
    q:'X社は、当月、得意先から注文を受けていたブレーキ部品の製造を完了した。<mark class="q-asset">完成した部品の製造原価は、100円である</mark>。完成した部品は、工場から倉庫に移され、出荷を待っている。完成した日の仕訳を行いなさい。',
    e:[{d:[['製品',100]],c:[['仕掛品',100]]}],
    exp:'製造が完了すると、それまで製造中の原価を集計していた「仕掛品」（未完成の在庫）から、完成品を表す「製品」という資産に振り替えます。材料費・労務費・製造間接費がすべて集まって、ようやく1つの完成品の原価が確定する瞬間です。'
  },
  { id:1220, cat:'製造間接費', chap:'工業簿記',
    q:'月末に、X社が、当月の間接的な費用の実際の発生額を集計したところ、<mark class="q-expense">25円であった</mark>。一方、予定配賦率にもとづいて製造中の製品に配賦した額は、<mark class="q-expense">23円であった</mark>。実際の発生額のほうが2円多く、<mark class="q-other">配賦しきれずに残っている</mark>。この差額について、月末に必要な仕訳を行いなさい。',
    e:[{d:[['製造間接費配賦差異',2]],c:[['製造間接費',2]]}],
    exp:'予定配賦率で各製品に配り終えた後、製造間接費という勘定には「実際にかかった金額」と「予定で配った金額」の差額が残ります。実際発生額（25円）の方が予定配賦額（23円）より多かったので、この差額2円を「製造間接費配賦差異」という差異の科目で処理し、製造間接費の勘定をゼロに締め切ります。'
  },
  { id:1221, cat:'個別原価計算', chap:'工業簿記',
    q:'X社は、ある得意先から注文を受けた部品の製造中に、通常起こりうる程度の不良品（<strong>仕損</strong>）を出した。この不良品は、補修すれば使えるため、補修の作業を行った。<mark class="q-expense">補修にかかった費用は、補修のための指図書に集計した6円である</mark>。この補修の費用を、仕損による費用として計上する仕訳を行いなさい。',
    e:[{d:[['仕損費',6]],c:[['仕掛品',6]]}],
    exp:'「仕損」とは、製造の途中で、不良品が出ることです。「指図書」とは、製造や補修の作業の内容を指示し、その費用を集計する書類のことです。通常の製造活動の中で起こりうる程度の不良（正常仕損）は、その補修費用を「仕損費」として製品の原価の一部に含めます。'
  },
  { id:1222, cat:'個別原価計算', chap:'工業簿記',
    q:'X社では、別の月に、工場の機械が大きく故障し、通常では考えられない量の不良品が出た（<strong>異常な仕損</strong>）。この不良品は、直すことができず、廃棄した。<mark class="q-expense">この不良品にかかっていた製造原価は、6円である</mark>。異常な仕損による損失は、製品の原価に含めず、製造とは関係のない損失（営業外費用）として処理する。この日の仕訳を行いなさい。',
    e:[{d:[['異常仕損費',6]],c:[['仕掛品',6]]}],
    exp:'「営業外費用」とは、会社の本来の営業活動とは関係なく生じた費用や損失のことです。機械の大故障のような、通常では考えられない異常な原因で生じた仕損は、正常な製造活動のコストとはみなさず、「異常仕損費」として製品原価から切り離し、特別な損失として処理します。「正常な仕損は原価に、異常な仕損は損失に」という区別がポイントです。'
  },
  { id:1223, cat:'本社工場会計', chap:'工業簿記',
    q:'X社は、本社と工場で、それぞれ別々に帳簿をつけている（<strong>本社工場会計</strong>）。工場の帳簿には、現金の勘定がなく、お金の支払いは、すべて本社が行う。当月、本社は、工場の<mark class="q-expense">作業員の労働の対価30円を</mark>、<mark class="q-asset">現金で支払った</mark>。本社と工場の、それぞれの仕訳を行いなさい。',
    e:[{d:[['工場',30]],c:[['現金',30]]},{d:[['賃金',30]],c:[['本社',30]]}],
    exp:'「本社工場会計」とは、本社と工場が、それぞれ別々に帳簿をつける仕組みのことです（本社と工場の間のやりとりは、相手を表す勘定で記録します）。本社は、工場のために立て替えて払った現金を「工場」という内部取引専用の勘定（照合勘定）で記録し、工場は、受け取った労働対価を「賃金」という費用として計上し、相手科目に「本社」勘定を使います。この2つの帳簿を合算すると、内部取引（本社・工場勘定）は相殺されて消えます。'
  },
  { id:1224, cat:'部門別原価計算', chap:'工業簿記',
    q:'注文を受けて、1点ずつ家具を製造しているX社の工場には、木材を切って削る<strong>切削部門</strong>と、部品を組み立てる<strong>組立部門</strong>の、2つの製造部門がある。当月、どの製品にかかったかを直接特定できない間接的な費用が、30円発生した。X社は、この30円を、各部門の機械の稼働時間を基準にして、<mark class="q-other">切削部門に18円、組立部門に12円、割り振った（第1次集計）</mark>。この仕訳を行いなさい。',
    e:[{d:[['切削部門費',18],['組立部門費',12]],c:[['製造間接費',30]]}],
    exp:'「製造部門」とは、製品の加工を直接行う部門のことです。「第1次集計」とは、間接的な費用を、まず各部門に割り振ることです。工場全体でまとめて集計していた製造間接費（30円）を、どの部門でどれだけ使われたかに応じて、各部門専用の勘定（切削部門費・組立部門費）に振り分けます。「会社全体のどんぶり勘定から、部門ごとの家計簿に分ける」最初のステップです。'
  },
  { id:1225, cat:'部門別原価計算', chap:'工業簿記',
    q:'X社の工場には、製造部門のほかに、工場の機械に電力を供給する<strong>動力部門</strong>がある。動力部門は、製品の加工を直接は行わない、補助部門である。当月の動力部門の費用10円を、各製造部門の電力の使用量を基準にして、<mark class="q-other">切削部門に6円、組立部門に4円、配賦した</mark>。配賦にあたっては、補助部門どうしのやりとりを無視して、製造部門だけに配賦する方法（<strong>直接配賦法</strong>）を採用している。この仕訳を行いなさい。',
    e:[{d:[['切削部門費',6],['組立部門費',4]],c:[['動力部門費',10]]}],
    exp:'「補助部門」とは、製造部門の仕事を支えるための部門のことです（製品の加工は直接行いません）。「直接配賦法」とは、補助部門の費用を、補助部門どうしのやりとりを無視して、製造部門だけに配賦する方法のことです。動力部門のような補助部門の費用（10円）は、最終的には製品を直接加工する製造部門（切削・組立）に振り分けて、製品原価に反映させる必要があります。電力の使用量という実態に合った基準で配分するのがポイントです。'
  },
  { id:1226, cat:'部門別原価計算', chap:'工業簿記',
    q:'第1次集計と、動力部門からの配賦を終えた結果、当月、X社の切削部門に集まった費用は、<mark class="q-other">合計24円になった</mark>。X社は、注文ごとに家具の原価を計算するため、この24円を、予定配賦率にもとづいて、<mark class="q-asset">注文ごとに製造中の家具に配賦した</mark>。この仕訳を行いなさい。',
    e:[{d:[['仕掛品',24]],c:[['切削部門費',24]]}],
    exp:'「予定配賦率」とは、間接的な費用を配賦するために、あらかじめ決めておく割合のことです。部門ごとに集計した費用（切削部門費24円）を、最後に注文ごとの製品原価（仕掛品）に配賦することで、「工場全体の共通費用→部門ごとの費用→製品ごとの原価」という3段階の流れが完成します。部門別に集計することで、工場全体でまとめて配賦するよりも、より実態に合った正確な製品原価を計算できます。'
  },
  { id:1227, cat:'標準原価計算', chap:'工業簿記',
    q:'袋入りの焼き菓子を製造しているX社は、標準原価計算を採用し、<strong>シングルプラン</strong>で記帳している。当月、製造に投入した分の標準原価は、<mark class="q-asset">材料40円</mark>、<mark class="q-expense">労働35円</mark>、<mark class="q-expense">間接的な費用25円</mark>の、合計100円であった。この当月投入分を、製造途中の製品の勘定に記帳する仕訳を行いなさい。',
    e:[{d:[['仕掛品',100]],c:[['材料',40],['賃金',35],['製造間接費',25]]}],
    exp:'「標準原価」とは、製品1個あたりに、本来かかるべき原価として、あらかじめ決めておく原価のことです。「シングルプラン」とは、製造途中の製品の勘定に、投入した分を標準原価で記帳する方法です（差異は、材料・労働・間接費の各勘定で把握します）。実際にかかった金額ではなく、あらかじめ決めた「本来あるべき金額」で仕掛品を記帳するのが特徴で、無駄がどこで生じたかを素早く把握できます。'
  },
  { id:1228, cat:'標準原価計算', chap:'工業簿記',
    q:'ゼリーを製造しているX社は、標準原価計算を採用し、<strong>パーシャルプラン</strong>で記帳している。当月、製造に投入した分の実際原価は、<mark class="q-asset">材料42円</mark>、<mark class="q-expense">労働36円</mark>、<mark class="q-expense">間接的な費用25円</mark>の、合計103円であった。この当月投入分を、製造途中の製品の勘定に記帳する仕訳を行いなさい。',
    e:[{d:[['仕掛品',103]],c:[['材料',42],['賃金',36],['製造間接費',25]]}],
    exp:'「パーシャルプラン」とは、製造途中の製品の勘定に、投入した分を実際原価で記帳する方法です（差異は、製造途中の製品の勘定で把握します）。「実際原価」とは、実際にかかった原価のことです。シングルプラン（前問、標準原価で記帳）とは違い、パーシャルプランでは、まず実際にかかった金額をそのまま仕掛品に記帳し、差異は後で仕掛品勘定の中でまとめて計算します。'
  },
  { id:1229, cat:'標準原価計算', chap:'工業簿記',
    q:'X社では、当月、材料の実際の消費数量が、実際の生産量から計算した標準の消費数量を上回った。生地の仕込みで失敗が続いたためである。その結果、<mark class="q-other">材料の消費額に、標準より4円多い不利な差が生じた</mark>。シングルプランのもとで、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['数量差異',4]],c:[['材料',4]]}],
    exp:'材料を無駄遣いしてしまい、本来必要な量（標準消費数量）より多く使ってしまった場合、その差額は「数量差異」という費用（不利差異）で処理します。「仕込みの失敗が続いた」という原因からも分かるように、現場での作業効率の悪さが、材料のロスとして数値に表れたケースです。'
  },
  { id:1230, cat:'標準原価計算', chap:'工業簿記',
    q:'X社では、当月、新しく入った作業員が作業に慣れていなかったため、実際の作業時間が、実際の生産量から計算した標準の作業時間を上回った。その結果、<mark class="q-other">労働の消費額に、標準より3円多い不利な差が生じた</mark>。シングルプランのもとで、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['時間差異',3]],c:[['賃金',3]]}],
    exp:'作業に慣れていない新人が多いと、本来かかるはずの時間（標準作業時間）より多くの時間がかかってしまいます。この差額は「時間差異」という費用（不利差異）で処理します。材料の数量差異と似た考え方で、こちらは「時間の無駄」が差異として数値化されたものです。'
  },
  { id:1231, cat:'標準原価計算', chap:'工業簿記',
    q:'X社では、当月、電力料金の値上がりにより、間接的な費用の実際の発生額が、実際の操業度にもとづいて計算した予算額（予算許容額）を、<mark class="q-other">2円上回った</mark>。シングルプランのもとで、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['予算差異',2]],c:[['製造間接費',2]]}],
    exp:'「操業度」とは、工場の設備の稼働の度合いのことで、作業時間などで測ります。「予算許容額」とは、実際の操業度のもとで、本来かかってよいとされる間接的な費用の予算額のことです。電力料金の値上がりのような、外部要因による単価の上昇は「予算差異」として処理します。作業の効率とは関係なく、単純に「値段が上がった」ことによる差異です。'
  },
  { id:1232, cat:'標準原価計算', chap:'工業簿記',
    q:'X社では、当月、作業の段取りが悪く、実際の作業時間が、標準の作業時間を上回った。そのため、作業時間を基準に配賦する間接的な費用にも、<mark class="q-other">標準より2円多い不利な差が生じた</mark>。シングルプランのもとで、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['能率差異',2]],c:[['製造間接費',2]]}],
    exp:'作業の段取りの悪さなど、作業の効率（能率）の問題によって、製造間接費にも余分なコストがかかってしまうことがあります。この差額は「能率差異」として処理します。前問の予算差異（単価の問題）とは違い、こちらは「作業のやり方の問題」によって生じた差異です。'
  },
  { id:1233, cat:'標準原価計算', chap:'工業簿記',
    q:'X社では、当月、大口の注文が取り消されたため、工場の実際の稼働時間が、あらかじめ想定していた通常の稼働の水準（基準操業度）を下回った。そのため、稼働の水準にかかわらず一定額かかる固定費を配賦しきれず、<mark class="q-other">3円の不利な差が生じた</mark>。シングルプランのもとで、この差額について必要な仕訳を行いなさい。',
    e:[{d:[['操業度差異',3]],c:[['製造間接費',3]]}],
    exp:'「基準操業度」とは、予算を立てるときに、あらかじめ想定しておく通常の稼働の水準のことです。工場の設備費や家賃のような固定費は、稼働が多くても少なくても一定額かかりますが、実際の稼働が予定より少ないと、その固定費を十分に製品に配り切れなくなります。この「稼働が足りなかったことによる差異」を「操業度差異」として処理します。'
  },
  { id:1234, cat:'標準原価計算', chap:'工業簿記',
    q:'決算にあたり、X社は、材料について生じた差異を、材料費全体の差異として、1つの勘定にまとめて表示することにした。当期の<mark class="q-other">材料の価格による差異は2円、数量による差異は4円</mark>で、いずれも不利な差異である。これらを1つにまとめる仕訳を行いなさい。',
    e:[{d:[['直接材料費差異',6]],c:[['材料消費価格差異',2],['数量差異',4]]}],
    exp:'材料に関する2種類の差異（価格差異と数量差異）を、決算にあたって「直接材料費差異」という1つの科目にまとめます。バラバラに管理していた価格の問題と数量の問題を、最終的に「材料費全体で、標準からいくらズレたか」という1つの数字に集約する処理です。'
  },
  { id:1235, cat:'標準原価計算', chap:'工業簿記',
    q:'決算にあたり、X社は、労働について生じた差異を、労務費全体の差異として、1つの勘定にまとめて表示することにした。当期の<mark class="q-other">賃率による差異は3円、作業時間による差異は3円</mark>で、いずれも不利な差異である。これらを1つにまとめる仕訳を行いなさい。',
    e:[{d:[['直接労務費差異',6]],c:[['賃率差異',3],['時間差異',3]]}],
    exp:'労働に関する2種類の差異（賃率差異と時間差異）を、決算にあたって「直接労務費差異」という1つの科目にまとめます。材料費の場合と同じように、「人件費の単価の問題」と「作業時間の問題」を、最終的に1つの数字に集約します。'
  },
  { id:1236, cat:'標準原価計算', chap:'工業簿記',
    q:'決算にあたり、X社は、間接的な費用について生じた3つの差異を、1つの勘定にまとめて表示することにした。当期の<mark class="q-other">予算による差異は2円、能率による差異は2円、稼働の水準による差異は3円</mark>で、いずれも不利な差異である。これらを1つにまとめる仕訳を行いなさい。',
    e:[{d:[['製造間接費差異',7]],c:[['予算差異',2],['能率差異',2],['操業度差異',3]]}],
    exp:'製造間接費に関する3種類の差異（予算差異・能率差異・操業度差異）を、決算にあたって「製造間接費差異」という1つの科目にまとめます。「単価の問題（予算）」「作業効率の問題（能率）」「稼働不足の問題（操業度）」という、それぞれ原因の異なる3つの差異を、最終的に1つの金額に集約する、標準原価計算の総仕上げの処理です。'
  },
  { id:1237, cat:'標準原価計算', chap:'工業簿記',
    q:'食品用のプラスチック容器を製造しているX社は、社内の管理のために、<strong>直接原価計算</strong>を採用している。当月、工場で発生した間接的な費用のうち、<mark class="q-expense">生産量に応じて増減するものは60円</mark>、<mark class="q-expense">生産量にかかわらず一定額かかるものは20円</mark>であった。<mark class="q-asset">生産量に応じて増減する60円は、製造途中の製品の原価に配賦する</mark>。<mark class="q-other">一定額かかる20円は、製品の原価に含めず、当月の期間費用として、そのまま当月の利益の計算に振り替える</mark>。この仕訳を行いなさい。',
    e:[{d:[['仕掛品',60],['損益',20]],c:[['変動製造間接費',60],['固定製造間接費',20]]}],
    exp:'「直接原価計算」とは、生産量に応じて増減する原価（変動費）だけを製品の原価とし、一定額かかる原価（固定費）は、発生した期間の費用とする計算方法です。生産量に応じて増える変動費（60円）は、これまでどおり仕掛品（製品原価）に配賦しますが、生産量に関係なく一定額かかる固定費（20円）は、製品の原価に含めず、その期の費用としてすぐに損益計算に反映させます。「作れば作るほど増える費用」と「作っても作らなくてもかかる費用」を、はっきり分けて扱うのが直接原価計算の最大の特徴です。'
  },
  { id:1238, cat:'標準原価計算', chap:'工業簿記',
    q:'X社の、直接原価計算による当期の営業利益は、45円であった。外部に報告する決算書には、全部原価計算による営業利益が必要になるため、直接原価計算の利益を、全部原価計算の利益に直す調整を行う。<mark class="q-other">期首の製品に含まれる固定費は5円、期末の製品に含まれる固定費は8円</mark>である。期末の分と、期首の分の、それぞれの仕訳を行いなさい。',
    e:[{d:[['繰延固定製造間接費',8]],c:[['固定費調整',8]]},{d:[['固定費調整',5]],c:[['繰延固定製造間接費',5]]}],
    exp:'「全部原価計算」とは、変動費と固定費の、すべての製造原価を、製品の原価とする計算方法です。直接原価計算では固定費をすぐに費用にしますが、外部に報告する決算書は全部原価計算にもとづく必要があるため、決算で調整が必要です。①期末の在庫に含まれる固定費（8円）は、本来は全部原価計算なら資産（在庫）に残るはずの金額なので、「繰延固定製造間接費」という資産として加え、利益を8円増やす調整をします。②期首の在庫に含まれていた固定費（5円）は、逆に今期の費用として実現したとみなし、利益を5円減らす調整をします。この2つの調整によって、直接原価計算の利益（45円）が、全部原価計算の利益に変換されます。'
  },
  { id:1239, cat:'総合原価計算', chap:'工業簿記',
    q:'お菓子を大量生産しているX社は、単純総合原価計算を採用している。当月、月初仕掛品原価250円と当月製造費用2,750円の合計3,000円について、<strong>平均法</strong>により月末仕掛品原価を計算したところ、<mark class="q-asset">完成品原価は2,400円、月末仕掛品原価は600円</mark>となった。完成品原価を製品に振り替える仕訳を行いなさい。',
    e:[{d:[['製品',2400]],c:[['仕掛品',2400]]}],
    exp:'「平均法」とは、月初仕掛品と当月製造費用を区別せず、ひとまとめにして平均単価を計算し、その平均単価で完成品と月末仕掛品に原価を割り振る方法です。月初仕掛品原価250円と当月製造費用2,750円を合計した3,000円を、完成品の数量と月末仕掛品の完成品換算量の比で分けた結果、完成品原価2,400円・月末仕掛品原価600円となりました。完成品分は「仕掛品」から「製品」に振り替え、月末仕掛品分は、そのまま仕掛品として翌月に残ります。'
  },
  { id:1240, cat:'総合原価計算', chap:'工業簿記',
    q:'キャンディを大量生産しているX社は、単純総合原価計算を採用している。当月、月初仕掛品原価200円と当月製造費用2,860円の合計3,060円について、<strong>先入先出法</strong>により月末仕掛品原価を計算したところ、<mark class="q-asset">完成品原価は2,500円、月末仕掛品原価は560円</mark>となった。完成品原価を製品に振り替える仕訳を行いなさい。',
    e:[{d:[['製品',2500]],c:[['仕掛品',2500]]}],
    exp:'「先入先出法」とは、先に着手した月初仕掛品が先に完成するとみなして、月初仕掛品原価をそのまま完成品原価に含め、当月製造費用の中から月末仕掛品原価を計算する方法です。平均法とは異なり、月初仕掛品原価と当月製造費用を区別して計算するため、単価の変動がある場合に、より当月の実際原価に近い結果が得られます。完成品原価2,500円を「仕掛品」から「製品」に振り替えます。'
  },
  { id:1241, cat:'総合原価計算', chap:'工業簿記',
    q:'パンを製造しているX社の工程では、通常起こりうる程度の正常仕損が発生した。仕損が発生したのは工程の終点に近い地点であったため、<strong>度外視法</strong>のもとでは、仕損の原価は完成品のみが負担する。<mark class="q-asset">完成品原価2,600円を製品に振り替える</mark>仕訳を行いなさい。',
    e:[{d:[['製品',2600]],c:[['仕掛品',2600]]}],
    exp:'「度外視法」は、正常仕損の原価を個別に計算せず、完成品や月末仕掛品の原価に自動的に上乗せ（吸収）させる方法です。仕損が発生した地点（仕損点）が、月末仕掛品の進捗度よりも後ろ（工程の終点側）にある場合、月末仕掛品はまだその地点を通過していないため仕損の原価を負担せず、「完成品のみが負担する」ことになります。そのため、仕損費はそのまま完成品原価に含まれたまま、製品に振り替えられます。'
  },
  { id:1242, cat:'総合原価計算', chap:'工業簿記',
    q:'上記と同じ工場で、別の月に正常仕損が発生した。今回は仕損が発生したのが工程の始点に近い地点であったため、度外視法のもとでは、仕損の原価は完成品と月末仕掛品の両方で負担する。<mark class="q-asset">完成品原価2,520円を製品に振り替える</mark>仕訳を行いなさい。',
    e:[{d:[['製品',2520]],c:[['仕掛品',2520]]}],
    exp:'仕損点が、月末仕掛品の進捗度よりも前（工程の始点側）にある場合は、月末仕掛品もすでにその地点を通過しているため、完成品だけでなく月末仕掛品も仕損の原価を一部負担します（両者負担）。この場合、仕損費は完成品と月末仕掛品の両方に、完成品換算量の比で自動的に配分されます。完成品が負担した分を含む完成品原価2,520円を、製品に振り替えます。'
  },
  { id:1243, cat:'総合原価計算', chap:'工業簿記',
    q:'メッキ加工をしているX社の工程で生じた仕損品について、<mark class="q-asset">スクラップとしての処分価値が80円あることが判明した</mark>。この仕損品を資産として受け入れ、仕損の総原価から処分価額を差し引く仕訳を行いなさい。',
    e:[{d:[['仕損品',80]],c:[['仕掛品',80]]}],
    exp:'仕損品であっても、スクラップなどとして売却できる価値（処分価額）が見込める場合は、その分を仕損の原価から差し引き、「仕損品」という資産として計上します。「失敗した分でも、売れる部分は資産として別に取っておく」というイメージです。これにより、完成品や月末仕掛品が負担する仕損の原価は、処分価額を差し引いた残りの金額に抑えられます。'
  },
  { id:1244, cat:'総合原価計算', chap:'工業簿記',

function getSectionQuestions(sec){
  if(!sec) return ALL;
  if(sec.startsWith('chap:')){
    const chap = sec.slice(5);
    if(chap === '1級') return ALL.filter(q => q.chap && q.chap.startsWith('1級'));
    return ALL.filter(q => q.chap === chap);
  }
  return ALL;
}

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter || checkOnly){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  if(checkOnly){
    deck = ALL.filter(q=>checked[q.id]);
    return;
  }
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base;
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
  updateStats();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}

function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  let html=styleParens(txt);
  const enq = q.en_q || JRNL_EN_Q[q.id];
  if(enq) html+=`<div class="q-en-trans">${enq}</div>`;
  return html;
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  if(!q){
    document.getElementById('exp-main').innerHTML = `
      <div class="exp-fin" style="padding:30px 16px;">
        <div style="font-size:40px;">☐</div>
        <div style="font-size:15px;font-weight:700;margin:10px 0 6px;">まだチェックした問題がありません</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.8;">問題に正解・不正解した後に表示される「☐ チェックをつける」を押すと、その問題がここに集まります。</div>
        <button class="exp-fin-btn exp-fin-btn-back" style="width:100%;margin-top:16px;" onclick="toggleCheckOnly()">通常モードに戻る</button>
      </div>`;
    return;
  }
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}</div>
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}</div>
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${tagType(acc.name)}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${tagType(a.name)}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

let dispQuizDeck = [];

let dispQuizScore = 0;
let dispQuizWrong = [];
let dispQuizLastGroup = -1;
let dispQuizKind = 'account'; // 'account' | 'concept'

function buildDispQuizGroups(total, targetSize){
  const numGroups = Math.max(1, Math.round(total / targetSize));
  const base = Math.floor(total / numGroups);
  const remainder = total - base * numGroups;
  const groups = [];
  let start = 1;
  for(let i=0;i<numGroups;i++){
    const size = base + (i < remainder ? 1 : 0);
    const end = start + size - 1;
    groups.push({ label:`グループ${i+1}`, range:[start,end] });
    start = end + 1;
  }
  return groups;
}
// クイズはDISPLAY_DATA全192科目を網羅的に出題する（勘定科目一覧の閲覧タブと同じ母集団）。
const DISP_QUIZ_POOL = DISPLAY_DATA;
const DISP_QUIZ_GROUPS = buildDispQuizGroups(DISP_QUIZ_POOL.length, 20);

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function dispAnsText(item){
  return item.ans.map(([s,c])=>`${s}　${c}`).join('　／　');
}

function dispBaseName(name){
  return name.replace(/（.*/,'');
}

function dispChoiceText(kind, raw){
  return kind === 'concept' ? raw.ans : dispAnsText(raw);
}

function launchDispQuiz(g){
  dispQuizLastGroup = g;
  if(g === 'concept'){
    dispQuizKind = 'concept';
    dispQuizDeck = shuffleArr(CONCEPT_DATA.slice());
  } else {
    dispQuizKind = 'account';
    let pool = DISP_QUIZ_POOL;
    if(g>=0){
      const [lo,hi]=DISP_QUIZ_GROUPS[g].range;
      pool = DISP_QUIZ_POOL.slice(lo-1, hi);
    }
    dispQuizDeck = shuffleArr(pool.slice());
  }
  dispQuizIdx = 0;
  dispQuizScore = 0;
  dispQuizWrong = [];
  renderDispQuiz();
}

function renderDispQuiz(){
  if(dispQuizIdx >= dispQuizDeck.length){ renderDispQuizFinish(); return; }
  const item = dispQuizDeck[dispQuizIdx];
  const kind = dispQuizKind;
  const correctText = dispChoiceText(kind, item);
  const sourcePool = kind === 'concept' ? CONCEPT_DATA : DISPLAY_DATA;
  const poolMap = new Map();
  sourcePool.forEach(d => {
    if(d.no===item.no) return;
    const t = dispChoiceText(kind, d);
    if(t!==correctText && !poolMap.has(t)) poolMap.set(t, d);
  });
  const distractors = shuffleArr([...poolMap.values()]).slice(0,3).map(d=>dispChoiceText(kind,d));
  const choices = shuffleArr([correctText, ...distractors]);
  window._dispChoices = choices;
  window._dispCorrect = correctText;
  const main=document.getElementById('exp-main');
  const promptHtml = kind === 'concept'
    ? `<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px;">この説明にあてはまる区分は？</div>
       <div style="font-size:16px;font-weight:700;line-height:1.7;">${item.q}</div>`
    : `<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px;">この勘定科目は、財務諸表のどこに表示される？</div>

       ${item.disp ? `<div style="font-size:11px;color:var(--muted);margin-top:8px;">※表示科目名が異なります（詳細は解答で確認）</div>` : ''}`;
  main.innerHTML = `
    ${dispQuizNavBar()}
    <div class="exp-q-card" style="text-align:center;">${promptHtml}</div>
    <div class="exp-step-choices wide" id="disp-choices">
      ${choices.map((c,i)=>`<button class="exp-step-choice-btn" onclick="selectDispChoice(this,${i})">${c}</button>`).join('')}
    </div>
    <div class="exp-result" id="disp-res"></div>`;
}

function selectDispChoice(btn, i){
  const chosen = window._dispChoices[i];

    <button class="exp-nav-btn exp-nav-next" style="width:100%;margin:10px 0;" onclick="dispQuizNext()">${isLast?'結果を見る →':'次の問題 →'}</button>
    ${dispLine}
    <div class="exp-res-exp">${item.reason}</div>`;
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderDispQuizFinish(){

// ===== 総合問題（財務諸表作成・本支店会計・株主資本等変動・標準原価計算・CVP分析）=====
// 数字は起動のたびにランダム生成。各設問にrelKeysを持たせ、解説表示中は
// 問題文中の該当データ(data-key)をハイライトする。設問は細分化して出題。
// ===== shared helpers =====
function compRandMult(base, loMult, hiMult){
  const n = loMult + Math.floor(Math.random()*(hiMult-loMult+1));
  return base*n;
}
function compPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmtVar(n){
  return `${Math.abs(n).toLocaleString()}円（${n<0?'不利':'有利'}差異）`;
}
function yen(n){ return n.toLocaleString(); }

// dedupe numeric choices: correct + candidate wrong numbers, pad/jitter if needed.
// Jitter is scaled to the magnitude of the correct answer and always stays positive,
// so a distractor is never an obviously-impossible negative quantity/amount.
function numChoices(correct, candidates){
  const out = [correct];
  const seen = new Set([correct]);
  for(const c of candidates){
    if(Number.isInteger(c) && c >= 0 && !seen.has(c) && out.length<4){ seen.add(c); out.push(c); }
  }
  let guard=0;
  const step = Math.max(1, Math.round(Math.abs(correct)*0.05)) || 1;
  while(out.length<4 && guard++<80){
    const mag = step * compRandMult(1, 1, 6);
    let jitter = correct + compPick([-1,1])*mag;
    if(jitter < 0 || !Number.isInteger(jitter)) jitter = correct + mag;
    if(!seen.has(jitter)){ seen.add(jitter); out.push(jitter); }
  }
  return out;
}
// dedupe string choices (for signed variance display)
function varChoices(correctN, candidateNs){
  const out = [correctN];
  const seen = new Set([fmtVar(correctN)]);
  for(const c of candidateNs){
    const f = fmtVar(c);
    if(!seen.has(f) && out.length<4){ seen.add(f); out.push(c); }
  }
  let guard=0;
  while(out.length<4 && guard++<50){
    const jitter = correctN + compPick([-1,1])*compRandMult(1000,1,20);
    const f = fmtVar(jitter);
    if(!seen.has(f)){ seen.add(f); out.push(jitter); }
  }
  return out.map(fmtVar);
}

// ===== FS-1 generator =====
function genFS1(){
  const uketori = compRandMult(10000, 10, 20);
  const urikake = compRandMult(10000, 15, 30);
  const taoreireRate = compPick([2,3,4,5]);
  const taoreireNeed = Math.round((uketori+urikake)*taoreireRate/100);
  const taoreireExisting = compRandMult(1000, 1, Math.max(1, Math.floor(taoreireNeed/1000)-1));
  const kishuShouhin = compRandMult(10000, 5, 12);
  const tatemonoNensuu = compPick([20,25,40,50]);
  const tatemono = compRandMult(tatemonoNensuu*1000, 10, 24);
  const tatemonoGenkaYr = tatemono/tatemonoNensuu;
  const tatemonoRuikei0 = tatemonoGenkaYr * compRandMult(1,2,6);
  const bihinNensuu = compPick([5,8,10]);
  const bihin = compRandMult(bihinNensuu*1000, 8, 20);
  const bihinGenkaYr = bihin/bihinNensuu;
  const bihinRuikei0 = bihinGenkaYr * compRandMult(1,1,Math.max(1,bihinNensuu-3));
  const kakekin = compRandMult(10000, 8, 20);
  const kariirekin = compRandMult(100000, 1, 5);
  const kariirekinRate = compPick([2,3,4,6]);
  const kariirekinMonths = compPick([3,6,9]);
  const risokuMikarai = Math.round(kariirekin * kariirekinRate/100 * kariirekinMonths/12);
  const shihonkin = compRandMult(100000, 3, 8);
  const kurikoshiKishu = compRandMult(10000, 5, 20);
  const shiire = compRandMult(10000, 40, 90);
  const kyuryo = compRandMult(10000, 8, 20);
  const hoken = compRandMult(1000, 15, 30);
  const hokenMaebarai = compRandMult(1000, 2, Math.max(2, Math.floor(hoken/1000)-3));
  const genmatsuShouhin = compRandMult(10000, 6, 15);
  const shiharaiRisokuMoto = compRandMult(1000, 4, 12);

  const urigenka = kishuShouhin + shiire - genmatsuShouhin;
  const uriage = urigenka + compRandMult(50000, 8, 20);

  const taoreireKurinyure = taoreireNeed - taoreireExisting;
  const genkahi = tatemonoGenkaYr + bihinGenkaYr;
  const hokenHiyou = hoken - hokenMaebarai;
  const hanri = kyuryo + hokenHiyou + taoreireKurinyure + genkahi;
  const uriageSorieki = uriage - urigenka;
  const eigyouRieki = uriageSorieki - hanri;
  const shiharaiRisoku = shiharaiRisokuMoto + risokuMikarai;
  const keijou = eigyouRieki - shiharaiRisoku;
  const hojinzei = Math.round(keijou * 0.3);
  const junRieki = keijou - hojinzei;

  const tatemonoRuikeiMatsu = tatemonoRuikei0 + tatemonoGenkaYr;
  const tatemonoBs = tatemono - tatemonoRuikeiMatsu;
  const bihinRuikeiMatsu = bihinRuikei0 + bihinGenkaYr;
  const bihinBs = bihin - bihinRuikeiMatsu;

  const totalDebitNoGenkin = uketori+urikake+kishuShouhin+tatemono+bihin+shiire+kyuryo+hoken+shiharaiRisokuMoto;
  const totalCredit = taoreireExisting+tatemonoRuikei0+bihinRuikei0+kakekin+kariirekin+shihonkin+kurikoshiKishu+uriage;
  const genkin = totalCredit - totalDebitNoGenkin;

  // sanity: must be valid for a believable problem
  if(genkin < 50000 || keijou <= 0 || junRieki <= 0 || hokenHiyou < 0 || taoreireKurinyure <= 0) return genFS1();

  const shisanGoukei = genkin + uketori + urikake - taoreireNeed + genmatsuShouhin + hokenMaebarai + tatemonoBs + bihinBs;
  const fusai = kakekin + risokuMikarai + hojinzei + kariirekin;
  const jyunshisan = shihonkin + (kurikoshiKishu + junRieki);

// ===== FS-2 generator =====
function genFS2(){
  const urikake = compRandMult(10000, 15, 35);
  const taoreireRate = compPick([1,2,3,4]);
  const taoreireNeed = Math.round(urikake*taoreireRate/100);
  const taoreireExisting = compRandMult(500, 1, Math.max(1, Math.floor(taoreireNeed/500)-1));
  const kishuShouhin = compRandMult(10000, 4, 10);
  const bihinNensuu = compPick([4,5,6,8]);
  const bihin = compRandMult(bihinNensuu*1000, 8, 20);
  const bihinGenkaYr = bihin/bihinNensuu;
  const bihinRuikei0 = bihinGenkaYr * compRandMult(1,1,Math.max(1,bihinNensuu-2));
  const kakekin = compRandMult(10000, 6, 15);
  const shihonkin = compRandMult(100000, 2, 6);
  const kurikoshiKishu = compRandMult(10000, 3, 10);
  const shiire = compRandMult(10000, 30, 70);
  const kyuryo = compRandMult(10000, 6, 15);
  const koukoku = compRandMult(1000, 15, 40);
  const koukokuMaebarai = compRandMult(1000, 2, Math.max(2, Math.floor(koukoku/1000)-3));
  const zappi = compRandMult(1000, 5, 15);
  const genmatsuShouhin = compRandMult(10000, 4, 12);
  const hojinzei = compRandMult(1000, 10, 30);

  const urigenka = kishuShouhin + shiire - genmatsuShouhin;
  const uriage = urigenka + compRandMult(50000, 5, 15);

  const taoreireKurinyure = taoreireNeed - taoreireExisting;
  const koukokuHiyou = koukoku - koukokuMaebarai;
  const hanri = kyuryo + koukokuHiyou + zappi + taoreireKurinyure + bihinGenkaYr;
  const uriageSorieki = uriage - urigenka;
  const eigyouRieki = uriageSorieki - hanri;
  const junRieki = eigyouRieki - hojinzei;

  const bihinRuikeiMatsu = bihinRuikei0 + bihinGenkaYr;
  const bihinBs = bihin - bihinRuikeiMatsu;

  const totalDebitNoGenkin = urikake+kishuShouhin+bihin+shiire+kyuryo+koukoku+zappi;
  const totalCredit = taoreireExisting+bihinRuikei0+kakekin+shihonkin+kurikoshiKishu+uriage;
  const genkin = totalCredit - totalDebitNoGenkin;

  if(genkin < 30000 || eigyouRieki<=0 || junRieki<=0 || koukokuHiyou<0 || taoreireKurinyure<=0) return genFS2();

  const shisanGoukei = genkin + urikake - taoreireNeed + genmatsuShouhin + koukokuMaebarai + bihinBs;
  const fusai = kakekin + hojinzei;
  const jyunshisan = shihonkin + (kurikoshiKishu + junRieki);
  if(Math.abs((fusai+jyunshisan)-shisanGoukei) > 0) return genFS2();

        <div class="comp-row" data-key="uriage"><span class="l">売上</span><span class="r">${yen(uriage)}（貸方）</span></div>
