<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>簿記 仕訳練習アプリ</title>
  <style>
    :root {
      --primary: #1E4D7B;
      --primary-light: #E8F0FA;
      --bg: #F2F5F9;
      --card: #FFFFFF;
      --text: #1A2B3C;
      --muted: #6B7B8D;
      --border: #DDE3EC;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    .header {
      background: linear-gradient(135deg, #0D2B45, #1E4D7B);
      color: #fff;
      padding: 18px 20px 14px;
      text-align: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .header p { font-size: 12px; opacity: 0.75; margin-top: 3px; }

    .legend {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.asset     { background: #F9C400; }
    .dot.liability { background: #C2185B; }
    .dot.expense   { background: #388E3C; }
    .dot.revenue   { background: #0288D1; }
    .dot.equity    { background: #fff; border: 1.5px solid #9E9E9E; }


    .controls {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.active { background: #FFF3E0; border-color: #FB8C00; color: #E65100; }

    .stats-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      display: flex;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-num { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .stat-num.total    { color: var(--primary); }
    .stat-num.correct  { color: #2E7D32; }
    .stat-num.wrong    { color: #C62828; }
    .stat-num.mem      { color: #6A1B9A; }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .card-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .progress-bar {
      height: 4px;
      background: #DDE3EC;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .flashcard {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-top {
      background: var(--primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .category-tag { font-size: 12px; color: rgba(255,255,255,0.85); }

    .card-body { padding: 20px 18px; }

    .scenario-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .scenario {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      min-height: 60px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    .reveal-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-light);
      border: 2px dashed #90B8E8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      transition: all 0.2s;
    }
    .reveal-btn:hover { background: #D0E3FA; }

    .answer-area { display: none; }
    .answer-area.show { display: block; }

    .answer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .journal-entry {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .entry-header {
      background: #F7F9FC;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .entry-row { display: flex; }
    .entry-side { flex: 1; padding: 10px 12px; }
    .entry-sep { width: 1px; background: var(--border); }
    .side-lbl { font-size: 10px; color: #999; margin-bottom: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .tag-amt { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 1px; }
    /* 資産：黄色 */
    .tag.asset     { background: #FFF9C4; color: #5D4037; border: 1.5px solid #F9C400; }
    /* 負債：ピンク/紫 */
    .tag.liability { background: #FCE4EC; color: #880E4F; border: 1.5px solid #C2185B; }
    /* 費用：緑 */
    .tag.expense   { background: #E8F5E9; color: #1B5E20; border: 1.5px solid #388E3C; }
    /* 収益：水色 */
    .tag.revenue   { background: #E1F5FE; color: #01579B; border: 1.5px solid #0288D1; }
    /* 純資産：白 */
    .tag.equity    { background: #fff; color: #333; border: 1.5px solid #9E9E9E; }
    /* その他（評価勘定・損益等）*/
    .tag.other     { background: #F3E5F5; color: #4A148C; border: 1.5px solid #CE93D8; }

    .note-box {
      margin-top: 6px;
      padding: 6px 10px;
      background: #FFF8E1;
      border-left: 3px solid #FFC107;
      border-radius: 4px;
      font-size: 12px;
      color: #5D4037;
      line-height: 1.5;
    }

    .exp-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #F0F7FF;
      border-left: 3px solid #42A5F5;
      border-radius: 4px;
      font-size: 13px;
      color: #1A2B3C;
      line-height: 1.7;
    }
    .exp-label {
      font-size: 10px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* 表形式の解答 */
    .ans-table-wrap {
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .ans-table-wrap table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      min-width: 260px;
    }
    .ans-table-wrap th {
      background: #1E4D7B;
      color: white;
      padding: 5px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
    }
    .ans-table-wrap td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      line-height: 1.5;
    }
    .ans-table-wrap tr:nth-child(even) td { background: #F7F9FC; }
    .ans-table-wrap .total-row td { background: #E8F0FA; font-weight: 700; }
    .ans-table-wrap .hl { background: #FFF9C4 !important; font-weight: 700; }
    .ans-table-wrap .q-blank { background: #FFF3E0 !important; color: #E65100; font-weight: 700; text-align: center; border: 2px dashed #FB8C00 !important; }
    .tbl-sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .formula-box {
      margin: 8px 0;
      padding: 8px 12px;
      background: #E8F5E9;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1B5E20;
      text-align: center;
    }

    .judge-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .judge-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .judge-btn.ok  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .judge-btn.ng  { background: #FFEBEE; border-color: #EF5350; color: #B71C1C; }
    .judge-btn.ok:hover { background: #C8E6C9; }
    .judge-btn.ng:hover { background: #FFCDD2; }

    .nav-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .nav-btn {
      padding: 11px 28px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .complete-card {
      text-align: center;
      padding: 50px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,77,123,0.10);
    }
    .complete-emoji { font-size: 48px; }
    .complete-title { font-size: 20px; font-weight: 700; margin: 12px 0 6px; }
    .complete-score { font-size: 42px; font-weight: 800; color: #2E7D32; }
    .complete-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .restart-btn {
      padding: 13px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    /* ===== Appendix modal ===== */
    .apx-btn { background:var(--primary); color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .apx-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; padding:0; }
    .apx-overlay.show { display:flex; }
    .apx-modal { background:#fff; width:100%; max-width:none; border-radius:0; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow:hidden; margin:0; }
    .apx-sticky-header { flex-shrink:0; padding:16px 18px 10px; background:#fff; border-bottom:1px solid var(--border); }
    .apx-modal-body { overflow-y:auto; flex:1; padding:10px 18px 20px; -webkit-overflow-scrolling:touch; }
    .apx-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
    .apx-title { font-size:17px; font-weight:800; color:var(--primary); }
    .apx-subtitle { font-size:11px; color:var(--muted); margin-top:2px; }
    .apx-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
    .apx-section { margin-bottom:22px; }
    .apx-section-hd { font-size:13px; font-weight:800; padding:7px 12px; border-radius:8px; margin-bottom:5px; display:flex; align-items:center; gap:8px; }
    .apx-section-hd.asset      { background:#FFF9C4; color:#5D4037; border:1.5px solid #F9C400; }
    .apx-section-hd.liability  { background:#FCE4EC; color:#880E4F; border:1.5px solid #C2185B; }
    .apx-section-hd.expense    { background:#E8F5E9; color:#1B5E20; border:1.5px solid #388E3C; }
    .apx-section-hd.revenue    { background:#E1F5FE; color:#01579B; border:1.5px solid #0288D1; }
    .apx-section-hd.equity     { background:#F5F5F5; color:#333; border:1.5px solid #9E9E9E; }
    .apx-section-hd.other      { background:#F3E5F5; color:#4A148C; border:1.5px solid #CE93D8; }
    .apx-section-hd.industrial { background:#FFF3E0; color:#BF360C; border:1.5px solid #FF8F00; }
    .apx-section-sub { font-size:11px; color:var(--muted); margin-bottom:6px; padding-left:4px; }
    .apx-row { padding:8px 4px; border-bottom:1px solid var(--border); }
    .apx-row.hidden { display:none; }
    .apx-row-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px; }
    .apx-en { font-size:11px; color:var(--muted); }
    .apx-note { font-size:12px; color:#444; line-height:1.6; }
    .apx-note strong, .gloss-def-en strong { color:#1A2B3C; font-weight:700; }
    .apx-note mark, .gloss-def-en mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    .apx-lv { display:inline-block; font-size:9px; font-weight:700; background:var(--primary); color:#fff; border-radius:4px; padding:1px 5px; }
    .apx-lv.ind { background:#FF8F00; }
    .apx-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
    .apx-tab { padding:5px 11px; border:1.5px solid var(--border); border-radius:20px; background:#fff; font-size:12px; cursor:pointer; color:var(--muted); font-weight:600; transition:background 0.15s,color 0.15s,border-color 0.15s; }
    .apx-tab:hover { background:#f5f5f5; }
    .apx-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .apx-hide-btns { display:flex; gap:8px; margin-bottom:0; }
    .apx-hide-btn { flex:1; padding:7px 10px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:12px; cursor:pointer; color:var(--text); font-weight:600; text-align:center; transition:background 0.15s; }
    .apx-hide-btn.active { background:#eee; border-color:#999; }
    #apx-content.names-hidden .tag { color:transparent !important; background:#e0e0e0 !important; border-color:#bbb !important; user-select:none; min-width:50px; display:inline-block; }
    #apx-content.names-hidden .gloss-term-text { color:transparent !important; background:#e0e0e0 !important; border-radius:3px; user-select:none; }
    #apx-content.en-hidden .apx-en, #apx-content.en-hidden .gloss-en { display:none; }
    /* ===== Glossary ===== */
    .gloss-section { margin-bottom:10px; }
    .gloss-hd { font-size:14px; font-weight:800; color:var(--primary); padding:8px 12px; background:var(--primary-light); border-radius:8px; margin:14px 0 6px; }
    .gloss-row { padding:9px 4px; border-bottom:1px solid var(--border); }
    .gloss-term { font-size:13px; font-weight:800; margin-bottom:3px; }
    .gloss-en { font-size:11px; color:var(--muted); }
    .gloss-def { font-size:12px; color:#444; line-height:1.6; }
    .gloss-def strong { color:#1A2B3C; }
    .gloss-def mark { background:#FFF9C4; padding:0 2px; border-radius:2px; }
    /* English shown first — primary color, no top border */
    .gloss-def-en { font-size:12px; color:var(--text); line-height:1.6; }
    /* Japanese shown second — muted with separator */
    .apx-note .apx-note-ja { font-size:11px; color:var(--muted); line-height:1.55; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border); }
    .gloss-def .gloss-def-ja { font-size:11px; color:var(--muted); line-height:1.55; margin-top:5px; padding-top:5px; border-top:1px dashed var(--border); }
    /* When English hidden: restore Japanese to primary style */
    #apx-content.en-hidden .apx-note .apx-note-ja,
    #apx-content.en-hidden .gloss-def .gloss-def-ja { color:#444; font-size:12px; margin-top:0; padding-top:0; border-top:none; }
    #apx-content.en-hidden .gloss-def-en { display:none; }

    /* ===== スクロールモード ===== */
    .exp-panel { display:none; max-width:640px; margin:0 auto; padding:14px 14px; }
    .exp-q-card { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px; border:1.5px solid var(--border); font-size:14px; line-height:1.7; font-weight:500; }
    .exp-swipe-wrap { position:relative; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .exp-hint { position:absolute; font-size:11px; font-weight:700; top:50%; transform:translateY(-50%); pointer-events:none; }
    .exp-swipe-card {
      width:160px; background:#fff; border-radius:14px; border:2.5px solid var(--border);
      padding:14px; text-align:center; font-size:15px; font-weight:800;
      box-shadow:0 4px 18px rgba(0,0,0,0.12); touch-action:none; user-select:none; cursor:grab;
      position:relative; z-index:2; will-change:transform;
    }
    .exp-swipe-card.tilt-l { border-color:#0288D1; background:#E3F2FD; }
    .exp-swipe-card.tilt-r { border-color:#388E3C; background:#E8F5E9; }
    .exp-swipe-card.anim { transition:transform 0.28s cubic-bezier(.4,0,.2,1), opacity 0.28s; }
    .exp-zones { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .exp-zone { border-radius:12px; padding:10px; min-height:62px; border:2px dashed; }
    .exp-zone-d { border-color:#90CAF9; background:#F0F8FF; }
    .exp-zone-c { border-color:#A5D6A7; background:#F0FBF0; }
    .exp-zone-label { font-size:11px; font-weight:800; margin-bottom:6px; }
    .exp-zone-d .exp-zone-label { color:#0277BD; }
    .exp-zone-c .exp-zone-label { color:#2E7D32; }
    .exp-placed { display:flex; flex-wrap:wrap; gap:4px; min-height:24px; }
    .exp-nav-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:6px; }
    .exp-nav-btn { padding:7px 12px; border:1.5px solid var(--border); border-radius:18px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--text); white-space:nowrap; }
    .exp-nav-btn:disabled { opacity:0.3; cursor:default; }
    .exp-nav-next { background:var(--primary); color:#fff; border-color:var(--primary); }
    .exp-nav-info { font-size:13px; font-weight:700; color:var(--muted); flex:1; text-align:center; }
    .exp-undo-btn { width:100%; padding:9px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:var(--text); margin-bottom:8px; }
    .exp-result { background:#fff; border-radius:12px; padding:14px 16px; margin-top:12px; border:2px solid var(--border); display:none; }
    .exp-result.ok { border-color:#2E7D32; background:#F1FBF4; }
    .exp-result.ng { border-color:#C62828; background:#FFF5F5; }
    .exp-res-hd { font-size:20px; font-weight:800; margin-bottom:8px; }
    .exp-res-ans { margin-bottom:8px; }
    .exp-res-exp { font-size:12px; color:#555; line-height:1.6; padding:8px 10px; background:rgba(0,0,0,0.04); border-radius:8px; }
    .exp-fin { text-align:center; padding:30px 16px; background:#fff; border-radius:14px; }
    .exp-fin-score { font-size:52px; font-weight:900; color:var(--primary); line-height:1; }
    .exp-fin-label { font-size:14px; color:var(--muted); margin:6px 0 16px; }
    .exp-fin-btns { display:flex; gap:10px; }
    .exp-fin-btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
    .exp-fin-btn-retry { background:var(--primary); color:#fff; }
    .exp-fin-btn-back { background:var(--bg); color:var(--text); border:1.5px solid var(--border); }
    .exp-btn { background:#FF8F00; color:#fff; border:none; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .exp-btn.active { background:#E65100; }
    .exp-scroll-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .exp-scroll-tab { padding:5px 13px; border:1.5px solid var(--border); border-radius:16px; background:#fff; font-size:12px; font-weight:700; cursor:pointer; color:var(--text); }
    .exp-scroll-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .exp-readonly-ans { margin:10px 0; padding:10px; background:#f5f5f5; border-radius:8px; display:none; overflow-x:auto; }
    .exp-reveal-btn { width:100%; padding:10px; border:none; border-radius:8px; background:#546E7A; color:#fff; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:8px; }
  </style>
</head>
<body>

<div class="header">
  <h1>簿記 仕訳練習アプリ</h1>
  <p>問題を読んで仕訳を考え、答えと解説を確認しよう</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="dot asset"></div>資産</div>

    'Unused revenue stamps, postage stamps, and postcards remaining at period-end. Originally expensed when purchased; the unused portion is reversed to this asset account at year-end.'],
  ['土地','Land',
   '会社が所有している土地（工場用地・店舗の敷地・駐車場など）です。土地は使っても価値が減らないと考えるため、減価償却をしません（帳簿価額がずっと変わらない）。これが建物・車両と大きく異なる点です。',3,
    'Land owned by the company (factory sites, store lots, parking lots, etc.). Land is never depreciated because it does not wear out with use — unlike buildings and vehicles.'],
  ['建物','Building',
   '会社が所有している建物（本社・工場・倉庫・店舗など）です。使い続けると老朽化して価値が下がるため、毎期「減価償却費」として少しずつ費用計上します。耐用年数は一般的に20〜50年です。',3,
    'Buildings owned by the company (headquarters, factories, warehouses, stores). Depreciated annually over a useful life of typically 20–50 years.'],
  ['備品','Equipment',
   '机・椅子・パソコン・コピー機・棚など、業務に使う比較的小型の道具・機器です。使い続けると老朽化するため毎期減価償却します。耐用年数は4〜15年程度のものが多いです。',3,
    'Office and business equipment such as desks, chairs, computers, and copiers. Depreciated annually with useful lives typically ranging from 4 to 15 years.'],
  ['貸付金','Loans Receivable',
   '取引先・従業員・子会社などに貸したお金の元本を記録する科目です。利息は別に「受取利息（収益）」や「未収利息（資産）」で管理します。返済期限が1年以内か1年超かで、流動資産か固定資産かに分けます。',3,
    'The principal of loans made to trading partners, employees, or subsidiaries. Interest is tracked separately. Classified as current (due within one year) or non-current (due in over one year).'],
  ['手形貸付金','Notes Receivable (Loans)',
   '借りる人に約束手形を差し入れてもらうことを条件にして貸したお金です。手形が担保になるため証拠が残り、回収の確実性が高まります。',3,
    'Loans made on the condition that the borrower provides a promissory note as collateral. The note serves as documentary evidence and improves collection certainty.'],
  ['前払金','Advance Payment (Purchase)',
   '商品を注文したときに先払いする手付金・内金を記録する科目です。商品がまだ届いていないので費用（仕入）にはなりませんが、将来商品を受け取れる権利として資産に計上します。商品受取時に仕入へ振り替えます。',3,
    'Down payments or deposits paid when ordering goods. Not yet an expense; recorded as an asset (right to receive goods). Transferred to Purchases when goods are delivered.'],
  ['受取商品券','Gift Vouchers Received',
   '百貨店券・ギフト券などをお客さんから受け取ったときに使う科目です。後日、発行元の百貨店やギフト会社に換金（精算）してもらえるので資産として計上します。',3,
    'Department-store gift cards or shopping vouchers received from customers as payment. Recorded as an asset because the issuing store will redeem them for cash.'],
  ['現金過不足','Cash Overage/Shortage',
   '帳簿の現金残高と実際の手元の現金を数えた額にズレが生じたとき、原因が判明するまで一時的に使う科目です。実際が多ければ貸方に、少なければ借方に記録します。決算で原因不明のまま残れば「雑益・雑損」に振り替えます。',3,
    'A temporary account used when the book cash balance and actual cash on hand differ. If actual exceeds book, credit this account; if short, debit it. Transferred to Miscellaneous Revenue or Miscellaneous Loss at year-end if unexplained.'],
  ['消耗品','Supplies (Unused)',
   '購入したがまだ使っていない消耗品（ペン・ノート・コピー用紙など）を期末に資産として計上するときに使う科目です。購入時に全額「消耗品費（費用）」とした場合、期末の未使用分を消耗品（資産）に振り戻します。',3,
    'Unused consumable supplies (pens, notebooks, copy paper, etc.) recorded as an asset at period-end. If supplies were expensed when purchased, the unused portion is reversed to this account.'],
  ['小口現金','Petty Cash',
   '各部署の担当者（小口現金係）にあらかじめ渡す少額の現金です。交通費・文具代など細かい支払いに使い、「定額資金前渡制度」では一定額を常に担当者に保持させ、使った分は領収書と引き換えに補充します。',3,
    'A small cash fund entrusted to a petty cash custodian for minor day-to-day expenses (transit fares, stationery, etc.). Under the imprest system, a fixed amount is always kept on hand and replenished when spent.'],
  // 2級 資産
  ['車両運搬具','Vehicles',
   '会社が所有している乗用車・トラック・フォークリフトなど業務に使う車です。毎期減価償却します。一般的な乗用車の耐用年数は4〜6年です。',2,
    'Company-owned cars, trucks, and forklifts used for business. Depreciated annually; typical useful life for passenger cars is 4–6 years.'],
  ['機械装置','Machinery',
   '製品を製造するために使う工場の機械・大型設備・生産ラインなどです。製造業で多く使われる有形固定資産で、毎期減価償却します。種類によって耐用年数は3〜17年程度と幅があります。',2,
    'Factory machines, large equipment, and production lines used in manufacturing. A major tangible fixed asset for manufacturers, depreciated over 3–17 years depending on type.'],
  ['構築物','Structures',
   '建物以外の土木・建設設備（駐車場の舗装・フェンス・ガードレール・橋・貯水池など）です。有形固定資産として毎期減価償却します。耐用年数は種類によって15〜50年程度です。',2,
    'Civil-engineering structures other than buildings: parking lot paving, fences, guardrails, bridges, water tanks, etc. Depreciated over 15–50 years depending on type.'],
  ['工具器具備品','Tools, Furniture and Fixtures',
   '工具・器具・備品をまとめて記録する科目です（3級の「備品」をより広くした概念）。机・棚・工具・測定器・看板なども含まれます。有形固定資産として毎期減価償却します。',2,
    'A broad category covering tools, instruments, and fixtures in addition to basic equipment: desks, shelving, measuring instruments, signage, etc. Depreciated annually.'],
  ['ソフトウェア','Software',
   '業務用の自社開発プログラムや購入した基幹システムを資産計上した無形固定資産です。物体がないため「無形固定資産」に分類され、毎期均等償却します（耐用年数は5年が多い）。',2,
    'Internally developed or purchased business software recorded as an intangible fixed asset (no physical form). Amortized straight-line, typically over 5 years.'],
  ['リース資産','Leased Assets',
   'ファイナンス・リース契約で借りている設備・機械・車両などを資産として計上した科目です。実質的に自分のものとして使っているので、資産計上して毎期減価償却します。相手科目はリース債務（負債）です。',2,
    'Equipment, machinery, or vehicles held under a finance lease, capitalized because the lessee bears substantially all risks and rewards. Depreciated annually; the offsetting liability is Lease Obligations.'],
  ['のれん','Goodwill',
   '会社合併や事業買収のとき、引き継いだ会社の純資産（資産－負債）の時価より多く払った差額です。相手のブランド力・顧客基盤・技術・人材などの「見えない価値」に払ったお金で、無形固定資産として計上し20年以内で均等償却します。',2,
    'The excess paid over the fair value of net assets (assets minus liabilities) when acquiring a company or business. Represents brand value, customer base, and know-how. Recorded as an intangible asset; amortized evenly within 20 years.'],
  ['創立費','Organization Costs',
   '会社設立のためにかかった費用（定款認証費・登記費用・設立時宣伝費など）を資産計上した繰延資産です。設立直後に全額費用にせず、5年以内に均等償却して少しずつ費用化します。',2,
    'Expenses incurred to incorporate a company (charter notarization, registration fees, promotional costs at founding) recorded as a deferred asset. Amortized evenly within 5 years.'],
  ['株式交付費','Stock Issuance Costs',
   '新株（増資）を発行するためにかかった費用（印刷費・証券会社手数料・宣伝費など）を資産計上した繰延資産です。3年以内に均等償却します。当期一括計上すると損失が大きくなりすぎるため分割処理します。',2,
    'Costs incurred to issue new shares (printing, underwriting commissions, advertising) recorded as a deferred asset. Amortized evenly within 3 years to avoid a large one-time charge.'],
  ['売買目的有価証券','Trading Securities',
   '株価・債券価格の値上がり益を狙って短期的に売買するための株式・債券です。期末に時価で評価し直し、帳簿価額との差額を「有価証券評価益（収益）」または「有価証券評価損（費用）」として計上します（洗替法が原則）。',2,
    'Securities (stocks, bonds) held for short-term trading profits. Marked to market at period-end; the difference is recognized as an unrealized gain or loss in profit/loss (mark-to-market / \'washing\' method).'],
  ['満期保有目的債券','Held-to-maturity Securities',
   '満期まで保有し続けることを目的として取得した国債・社債などの債券です。時価評価は行わず「償却原価法」で評価します（取得価額と額面金額の差額を満期まで少しずつ調整する方法）。',2,
    'Bonds acquired with the intent and ability to hold until maturity. Not marked to market; evaluated using the amortized cost method, gradually adjusting book value toward face value over the holding period.'],
  ['子会社株式','Subsidiary Stocks',
   '議決権の過半数（50%超）を持つなど、実質的に支配している会社（子会社）の株式です。短期売買目的ではなく長期支配目的なので原則として取得原価で評価し、時価評価しません。',2,
    'Shares in subsidiaries (generally >50% voting control). Held for strategic control, not trading; measured at cost and not marked to market.'],
  ['関係会社株式','Affiliated Company Stocks',
   '議決権の20〜50%を持つなど、財務・経営方針に重要な影響を与えられる会社（関連会社）の株式です。子会社株式と同様に原則として取得原価で評価します。',2,
    'Shares in affiliated companies (typically 20–50% voting influence). Like subsidiary stocks, measured at cost and not marked to market.'],
  ['投資有価証券','Investment Securities',
   '売買目的でも子会社・関連会社の支配目的でもない、長期保有目的の株式・債券（「その他有価証券」）を記録する科目です。期末に時価評価し、差額は損益ではなく純資産の「その他有価証券評価差額金」に計上します。',2,
    'Long-term securities held neither for trading nor for controlling subsidiaries (\'other securities\'). Marked to market at year-end; the difference goes directly to equity as Unrealized Gains/Losses on Other Securities, not to profit/loss.'],
  ['長期前払費用','Long-term Prepaid Expenses',
   '前払いした費用のうち、決算日の翌日から1年を超えて費用になる部分です。例えば5年分の保険料を一括払いした場合、1年以内分は「前払費用（流動資産）」、1年超の部分は「長期前払費用（固定資産）」に分類します。',2,
    'The portion of prepaid expenses that will be expensed more than one year after the balance sheet date. Example: a 5-year insurance prepayment — year 1 is Prepaid Expenses (current); years 2–5 are here (non-current).'],
  ['繰延税金資産','Deferred Tax Assets',
   '税効果会計で認識する「将来の税金の節約分（前払税金）」です。会計上は費用として認めても税法上はまだ認められていない場合に生じます。将来的に税金が少なくなることが確実なときに計上する資産です。',2,
    'Under deferred tax accounting, the future tax savings arising from temporary differences where accounting expense is recognized before the tax deduction is allowed. Recorded when the future tax reduction is probable.'],
  ['別段預金','Separate Deposit',
   '増資のとき、株式申込者から受け取った申込証拠金を入れておく専用の銀行口座のお金です。株式発行が確定したら普通預金に移し、資本金（と資本準備金）に振り替えます。',2,
    'A dedicated bank account holding application deposits received from stock subscribers during a capital increase. Transferred to the ordinary account and credited to Capital Stock (and Capital Reserve) once the issuance is confirmed.'],
  ['商品','Merchandise',
   '販売用の商品を記録する科目で、分記法や売上原価対立法で使います。三分法では「繰越商品」を使いますが、それ以外の記帳方法では「商品」科目で常に在庫金額をリアルタイムで管理します。',2,
    'Goods held for sale recorded under the separate method or cost-of-sales method. Unlike the three-account method (Merchandise Inventory appears only at year-end), this account always reflects the current inventory balance in real time.'],
  ['不渡手形','Dishonored Notes',
   '期日に銀行に持ち込んだが、振出人の口座残高不足などで支払いを断られた（不渡りになった）手形を記録する科目です。受け取った側は受取手形から不渡手形に振り替え、違約金・拒絶証書費用を加算して相手に請求できます。',2,
    'Promissory notes presented to a bank on their due date but dishonored (bounced) due to insufficient funds. Reclassified from Notes Receivable; penalty fees and protest costs are added to the claim amount.'],
  ['建設仮勘定','Construction in Progress',
   '建設・製作中でまだ完成していない固定資産（建設中のビル・製作中の機械など）への支出を一時的に記録する科目です。完成・引き渡し後に正しい科目（建物・機械装置など）に振り替えます。完成するまでは減価償却しません。',2,
    'Payments for fixed assets under construction or being custom-manufactured that are not yet complete. Transferred to the proper account (Building, Machinery, etc.) upon completion and handover. Not depreciated until complete.'],
  ['未決算','Suspense Account',
   '火災・事故などで損失額や保険金額がまだ確定していない間、一時的に記録しておく科目です。例えば火災で建物が焼けた直後は未決算に計上し、保険金額が確定したときに損益や保険金収入（未収入金など）に振り替えます。',2,
    'A temporary holding account used when a loss amount or insurance claim has not yet been determined (e.g., immediately after a fire). Cleared to the appropriate income/loss account once the final amounts are confirmed.'],
  ['破産更生債権等','Bankruptcy Claims',
   '取引先が倒産や経営再建中で回収が非常に困難になった売掛金・貸付金などを通常の売掛金から分離して管理するための科目です。回収不能額に対して貸倒引当金を多額（100%近く）設定します。',2,
    'Receivables (accounts receivable, loans) from counterparties in bankruptcy or debt restructuring that are very difficult to collect. Separated from normal receivables; a near-full bad debt allowance (often 100%) is established.'],
  ['工事未収入金','Construction Receivables',
   '工事進行基準を採用している会社で、当期に計上した工事収益のうちまだ受け取っていない金額を記録する科目です。建設業特有の売掛金に相当します（完成工事未収入金とも呼ばれます）。',2,
    'Under the percentage-of-completion method, revenue recognized for the current period that has not yet been collected in cash. The construction-industry equivalent of Accounts Receivable.'],
  ['長期貸付金','Long-term Loans Receivable',
   '貸付金のうち、返済期限が決算日の翌日から1年を超えるものです。1年以内に返済される貸付金は流動資産の「貸付金」に、1年超のものはこの「長期貸付金（固定資産）」に分類します。',2,
    'Loans receivable due more than one year from the balance sheet date. Loans due within one year are classified as current assets (Loans Receivable); those due in over one year are non-current (here).'],
  ['営業外受取手形','Non-trade Notes Receivable',
   '固定資産の売却代金として受け取った手形など、通常の商品取引（営業取引）以外から生じた受取手形です。通常の受取手形と区別して管理します。',2,
    'Notes received as payment for fixed asset sales or other non-trade transactions. Segregated from ordinary trade Notes Receivable to distinguish their origin.'],
  ['営業外電子記録債権','Non-trade Electronic Receivable',
   '固定資産の売却など、通常の営業取引以外から生じた電子記録債権です。通常の電子記録債権と区別して計上します。',2,
    'Electronic receivables arising from non-trade transactions such as fixed asset sales. Distinguished from ordinary trade electronic receivables.'],
  ['諸資産','Various Assets',
   '会社合併・事業譲受の仕訳をするとき、引き継いだ全ての資産をいったんまとめて記録するための仮の科目です。後で個別の科目（現金・建物・土地など）に振り分けます。',2,
    'A composite temporary account for all assets assumed in a business combination or transfer. Later separated into individual accounts (Cash, Building, Land, etc.).'],
  // ===== 負債 =====
  ['買掛金','Accounts Payable',
   '商品を後払い（掛け）で仕入れたときの「まだ払っていない代金」を記録する科目です。取引先への返済義務（債務）で、支払期日が来たら代金を払います。売掛金（権利）と反対の関係です。',3,
    'The unpaid purchase price when goods are bought on credit — the mirror image of Accounts Receivable. Represents a payment obligation to the supplier; paid on the agreed due date.'],
  ['支払手形','Notes Payable',
   '代金の支払いとして振り出した「約束手形」を記録する科目です。手形の期日が来ると当座預金から自動的に引き落とされます。手形を振り出したとき負債として計上し、期日に支払いが完了したら消去します。',3,
    'Promissory notes issued as payment for goods or services. Automatically settled from the checking account on the due date. Recorded as a liability when issued; extinguished when paid.'],
  ['電子記録債務','Electronic Payable',
   '買掛金や支払手形の代わりに、でんさいネット（電子債権記録機関）に登録したデジタルの支払い義務です。紙の手形と違って紛失・盗難の心配がなく、手続きが楽なため近年利用が増えています。',3,
    'A digital payment obligation registered with an electronic credit recording agency, replacing paper notes or accounts payable. No risk of loss or theft; rapidly replacing paper-based instruments.'],
  ['未払金','Non-trade Payable',
   '固定資産・有価証券などを買ったがまだ払っていない代金を記録する科目です。商品仕入れ代金の未払いは「買掛金」を使いますが、それ以外（備品・車・株式など）の購入代金の未払いはこちらです。',3,
    'Unpaid amounts for purchases of fixed assets or securities — as opposed to Accounts Payable (for merchandise). Used for equipment, vehicles, stocks, and other non-inventory items.'],
  ['借入金','Borrowings',
   '銀行などから借りたお金の元本を記録する科目です。利息は別途「支払利息（費用）」で管理します。返済期限が1年以内か1年超かで、流動負債か固定負債かに分類されます。',3,
    'The principal of loans received from banks or other lenders. Interest is tracked separately as Interest Expense. Classified as current (due within one year) or non-current (due in over one year).'],
  ['手形借入金','Notes Payable (Loans)',
   '銀行からお金を借りるとき、約束手形を差し入れる条件で借りたものです。普通の借入金と同様に元本を記録しますが、手形を担保として差し出している点が異なります。',3,
    'Borrowings where the borrower provides a promissory note to the lender as collateral. Recorded the same as ordinary borrowings but backed by a pledge of a note.'],
  ['未払利息','Accrued Interest Payable',
   '今期分の利息が確定して発生しているのに、まだ払っていない利息を記録する科目です。決算整理で「支払利息（費用）／未払利息（負債）」と計上し、来期に実際に払ったとき消去します。',3,
    'Interest that has accrued and become due in the current period but has not yet been paid. Recorded at year-end: Dr. Interest Expense / Cr. Accrued Interest Payable.'],
  ['前受金','Customer Advances',
   '商品を渡す前にお客さんからもらった手付金・内金を記録する科目です。まだ商品を渡していないので収益（売上）にはならず、「将来商品を渡す義務」として負債に計上します。商品を渡したときに売上に振り替えます。',3,
    'Deposits or advance payments received from customers before goods are delivered. A liability because goods have not yet been transferred — the company owes delivery. Transferred to Sales Revenue upon delivery.'],
  ['仮受金','Temporary Receipt',
   '入金があったが理由が不明（または内容が未確定）のお金を一時的に記録する科目です。原因が判明したら正しい科目に振り替えます。「とりあえず受け取ったお金の一時置き場」です。',3,
    'A temporary account for cash received whose purpose or final classification is unknown. Reclassified to the appropriate account once the reason is identified.'],
  ['当座借越','Bank Overdraft',
   '当座預金の残高がマイナスになった状態（銀行への短期借金）です。銀行と当座借越契約を結んでいると残高を超えて自動融資されます。マイナス分は資産（当座預金）ではなく負債（当座借越）として別に表示します。',3,
    'The negative balance in a checking account arising from an automatic bank overdraft facility. The overdraft amount is a liability (money owed to the bank), not a negative asset.'],
  ['預り金','Deposits Received',
   '従業員から天引きした所得税・社会保険料などを、税務署や社会保険事務所に納めるまで一時的に預かっているお金の総称です。自分のお金ではなく人から預かっているので負債として計上します。',3,
    'Money withheld from employee salaries (income tax, social insurance, etc.) held until remitted to the authorities. Not the company\'s own money, so classified as a liability.'],
  ['社会保険預り金','Social Insurance Withheld',
   '給料から天引きした、従業員負担の健康保険料・厚生年金保険料です。会社は毎月、自社負担分（法定福利費）と合わせて社会保険事務所に翌月納付します。',3,
    'Employee-share health insurance and pension premiums withheld from salaries. Remitted together with the employer share (Welfare Expense) to the social insurance authority each month.'],
  ['所得税預り金','Income Tax Withheld',
   '給料から源泉徴収（天引き）した所得税です。会社は毎月翌月10日までに税務署に納付する義務があります。年末調整で最終税額を計算し、過払い分は従業員に返還します。',3,
    'Income tax withheld at source from salaries. Remitted to the tax office by the 10th of the following month. Year-end tax adjustments reconcile the final amounts.'],
  ['未払法人税等','Corporate Tax Payable',
   '法人税の確定申告で計算した税額のうち、まだ税務署に納めていない分を記録する科目です。中間納付済みの「仮払法人税等（資産）」と差し引いて、不足分が未払法人税等（負債）になります。',3,
    'The unpaid portion of corporate tax determined by the annual tax return. The interim prepayment (Prepaid Corporate Tax asset) is subtracted; the remaining shortfall becomes this liability.'],
  ['未払消費税','Consumption Tax Payable',
   '課税期間中にお客さんから預かった消費税（仮受消費税）から、仕入等で払った消費税（仮払消費税）を差し引いた残りで、まだ税務署に納めていない分です。',3,
    'Net consumption tax still owed to the tax office: Consumption Tax Collected (from customers) minus Consumption Tax Paid (on purchases). The balance not yet remitted at year-end.'],
  ['仮受消費税','Consumption Tax Collected',
   '商品を売ったときにお客さんから預かった消費税を記録する科目です（税抜処理の場合）。自分の利益ではなく国（税務署）に代わって預かっているだけなので負債として計上します。',3,
    'Consumption tax collected from customers when selling goods under the tax-exclusive method. Treated as a liability because it belongs to the government — the company is merely the collection agent.'],
  ['未払配当金','Dividends Payable',
   '株主総会で「1株あたり○円の配当を払う」と決議されたが、まだ株主に払っていない配当金です。決議した時点で負債として計上し、実際に支払ったとき消去します。',3,
    'Dividends declared by the shareholders\' meeting but not yet paid to shareholders. Recorded as a liability when declared; extinguished when actually paid.'],
  ['前受収益','Deferred Revenue',
   '来期以降の収益（家賃・利息など）を先にもらった場合、来期分を負債として記録する科目です。例えば来期3か月分の家賃を先にもらった場合、「まだサービスを提供していない義務」として負債に計上します。',3,
    'Income received in advance relating to future periods (e.g., rent, interest). A liability representing the obligation to provide services or the right to a refund. Reclassified to revenue in the period earned.'],
  ['未払費用','Accrued Expenses',
   '今期分のサービスを受けた（費用が発生した）のに、まだ払っていない費用を記録する科目です。例えば月末締め翌月払いの給料は、当月末に費用が発生しているが支払いは翌月なので未払費用として計上します。',3,
    'Expenses incurred in the current period but not yet paid (e.g., salaries on a month-end cutoff with next-month payment). Recognized via an adjusting entry at year-end.'],
  // 2級 負債
  ['社債','Corporate Bonds',
   '会社が発行する借用証書（債券）で、広く投資家からお金を集める方法です。社債権者には定期的に利息（クーポン）を払い、満期になったら元本を一括返済します。銀行借入と異なり不特定多数に販売できます。',2,
    'Debt securities issued to investors to raise capital. Interest (coupons) is paid periodically; the principal is repaid at maturity. Unlike bank loans, bonds can be sold to the general public.'],
  ['リース債務','Lease Obligations',
   'ファイナンス・リース契約で設備・機械などを借りたときの残りの支払い義務を記録する科目です。毎月のリース料を払うたびに残高が減っていきます。相手科目はリース資産（資産）です。',2,
    'The remaining payment obligation under a finance lease for equipment, machinery, or vehicles. Reduced with each lease payment. The offsetting asset is Leased Assets.'],
  ['製品保証引当金','Product Warranty Reserve',
   '売った製品・商品に不具合が生じたとき無償修理・交換するための費用を、あらかじめ見積もって積み立てる負債です。積み立てる際は「製品保証引当金繰入（費用）」を計上し、実際に修理が発生したとき取り崩します。',2,
    'A liability estimated in advance for expected future warranty costs (free repairs/replacements) on products sold. Built up via Product Warranty Expense; drawn down when actual warranty work occurs.'],
  ['退職給付引当金','Retirement Benefit Obligation',
   '将来従業員に払う退職金の見積もり額を毎期少しずつ積み立てる負債です。毎期「退職給付費用（費用）／退職給付引当金（負債）」と仕訳し、実際に退職金を払ったとき取り崩します。',2,
    'The accumulated estimated retirement benefit obligation, accrued gradually each period. Recorded as Dr. Retirement Benefit Expense / Cr. Retirement Benefit Obligation; drawn down when retirement payments are made.'],
  ['繰延税金負債','Deferred Tax Liabilities',
   '税効果会計で認識する「将来払う税金の増加分（先送りされた税金）」です。会計上は収益として認めていないのに税法上は課税されている場合や、投資有価証券の評価益が生じている場合などに計上します。',2,
    'Under deferred tax accounting, future tax increases that arise because accounting income is recognized before it becomes taxable. Also arises from unrealized gains on investment securities.'],
  ['株式申込証拠金','Stock Subscription Deposits',
   '増資（新株発行）のとき、申込者から受け取る申込金（証拠金）を一時的に記録する科目です。株式発行が確定したとき「資本金（と資本準備金）」に振り替えます。それまでは負債として計上します。',2,
    'Application deposits received from stock subscribers during a capital increase, held as a liability until the issuance is confirmed. Then transferred to Capital Stock and Capital Reserve.'],
  ['工事未払金','Construction Payables',
   '工事進行基準を採用している会社で、計上した工事原価のうちまだ外注先や材料業者に払っていない金額です。建設業特有の買掛金に相当します。',2,
    'Under the percentage-of-completion method, construction costs accrued but not yet paid to subcontractors or material suppliers. The construction-industry equivalent of Accounts Payable.'],
  ['営業外電子記録債務','Non-trade Electronic Payable',
   '固定資産などの購入代金を電子記録（でんさいネット）にした支払い義務です。通常の商品仕入れ以外の取引から生じた電子記録債務で、通常の電子記録債務と区別して計上します。',2,
    'Electronic payment obligations arising from non-trade purchases (e.g., fixed asset acquisitions). Distinguished from ordinary trade electronic payables.'],
  ['営業外支払手形','Non-trade Notes Payable',
   '固定資産などの購入代金として振り出した手形です。通常の商品仕入れ代金の支払手形と区別して計上します。',2,
    'Promissory notes issued as payment for fixed assets or other non-trade transactions. Distinguished from ordinary trade notes payable.'],
  ['諸負債','Various Liabilities',
   '会社合併・事業譲受の仕訳をするとき、引き継いだ全ての負債をいったんまとめて記録するための仮の科目です。後で個別の科目（買掛金・借入金など）に振り分けます。',2,
    'A composite temporary account for all liabilities assumed in a business combination or transfer. Later separated into individual accounts (Accounts Payable, Borrowings, etc.).'],
  // ===== 費用 =====
  ['仕入','Purchases',
   '商品を仕入れたときに計上する費用です（三分法）。期末決算では「しくりくりし（期首商品の繰越商品を仕入へ加算、期末商品の繰越商品を仕入から控除）」を行って売上原価を計算します。',3,
    'The cost of merchandise bought for resale under the three-account method. At year-end, beginning inventory is added (\'in from carry-over\') and ending inventory is deducted (\'out to carry-over\') to compute cost of goods sold.'],
  ['支払家賃','Rent Expense',
   '事務所・店舗・倉庫・駐車場などを借りて払う家賃や地代を記録する科目です。翌期以降の分を前払いした場合は「前払費用（資産）」として振り替えます。',3,
    'Rent paid for offices, stores, warehouses, or parking lots. Advance payments covering future periods are reclassified to Prepaid Expenses (asset).'],
  ['支払手数料','Commission Expense',
   '不動産の仲介手数料・銀行の振込手数料・証券会社への売買委託手数料など、サービスに対して支払う手数料を記録する科目です。',3,
    'Fees paid for services: real estate agency fees, bank wire transfer fees, brokerage commissions, etc.'],
  ['支払利息','Interest Expense',
   '借入金・手形借入金・社債などに対して払う利息を記録する科目です。来期分の利息を前払いした場合は「前払利息（資産）」に、今期分だが未払いのものは「未払利息（負債）」に計上します。',3,
    'Interest paid on borrowings, notes payable, and corporate bonds. Prepaid amounts are Prepaid Interest (asset); accrued but unpaid amounts are Accrued Interest Payable (liability).'],
  ['支払保険料','Insurance Expense',
   '建物・車両に掛ける火災保険・損害保険などの保険料を記録する科目です。来期以降の分を前払いした場合は「前払費用（資産）」として振り替えます。',3,
    'Premiums paid for fire insurance and property/casualty insurance on buildings and vehicles. Advance payments covering future periods are reclassified to Prepaid Expenses.'],
  ['租税公課','Taxes and Dues',
   '固定資産税・収入印紙・印紙税・自動車税・登録免許税など、国や地方公共団体に払う税金や公的な負担金を記録します（所得税・法人税・住民税は除く）。収入印紙を領収書に貼った場合もここに計上します。',3,
    'Government taxes and public levies other than corporate income tax: property tax, revenue stamps, stamp duty, vehicle tax, registration tax. Affixing revenue stamps to receipts is also recorded here.'],
  ['広告宣伝費','Advertising Expense',
   '新聞・テレビ・インターネット・チラシ・看板・展示会など、自社の商品やサービスを広く宣伝するための費用です。不特定多数に向けた宣伝はすべてここに計上します。',3,
    'Costs for newspaper, TV, internet, flyer, signage, and trade-show advertising to promote products or services to the general public.'],
  ['通信費','Communication Expense',
   '電話料金・郵便料金・切手・宅配便・インターネット接続料など、通信に関わる費用を記録する科目です。未使用の切手や収入印紙が期末に残っていれば「貯蔵品（資産）」に振り戻します。',3,
    'Phone bills, postage, courier services, and internet fees. Unused stamps or revenue stamps remaining at year-end are reclassified to Supplies Inventory (asset).'],
  ['旅費交通費','Travel Expense',
   '電車・バス・タクシーの交通費、出張の宿泊費や日当など、業務上の移動にかかる費用です。通勤手当もここに含めることが多いです。',3,
    'Train, bus, and taxi fares, plus accommodation and per diem for overnight business trips. Commuting allowances are often included here.'],
  ['修繕費','Repair Expense',
   '建物・機械・車両などを現状に戻すための修理・補修費用です。ただし現状を超えて機能を向上させる工事（増築・大型改修など）は「資本的支出」として固定資産に計上します（「収益的支出か資本的支出か」の判断が重要）。',3,
    'Costs to restore buildings, machinery, and vehicles to their original working condition. Note: improvements that enhance performance beyond the original state are capital expenditures added to the asset cost, not expensed here.'],
  ['貸倒損失','Bad Debt Expense',
   '売掛金・貸付金・受取手形などが回収できなくなったと確定したときの損失です。すでに引当金（貸倒引当金）を設定していればそこから取り崩し、不足分だけ貸倒損失として計上します。',3,
    'The confirmed loss when receivables become uncollectible. If an allowance has been set, draw it down first; any excess beyond the allowance is charged directly to this account.'],
  ['貸倒引当金繰入','Bad Debt Allowance Expense',
   '決算時に、将来の貸し倒れに備えて引当金を積み立てるために計上する費用です。「売掛金残高×貸倒率」などで見積もり、「貸倒引当金繰入（費用）／貸倒引当金（評価勘定）」と仕訳します。',3,
    'The periodic expense of building up the allowance for bad debts based on an estimate (receivables balance × default rate). Journal entry: Dr. Bad Debt Allowance Expense / Cr. Allowance for Bad Debts.'],
  ['減価償却費','Depreciation Expense',
   '固定資産（建物・備品・車など）が毎年少しずつ価値を失っていく分を費用として計上する科目です。定額法（毎年同額）と定率法（残高に一定率をかける）があります。費用計上と同時に「減価償却累計額（評価勘定）」も積み立てます。',3,
    'The periodic allocation of a fixed asset\'s cost over its useful life. Main methods: straight-line (equal amount each year) or declining-balance (fixed % of remaining book value). The credit side is Accumulated Depreciation (contra asset).'],
  ['発送費','Shipping Expense',
   '商品をお客さんに届けるときの運送料・梱包費などを記録する科目です。当社が負担する場合に計上します（着払いでお客さんが負担する場合は計上しません）。',3,
    'Delivery and packaging costs when shipping goods to customers, if borne by the seller. Not recorded when the buyer pays shipping (cash on delivery).'],
  ['雑損','Miscellaneous Loss',
   '少額の損失や原因不明の現金不足など、他の費用科目に当てはまらない雑多な費用です。現金過不足の原因が期末まで判明しなかった場合の不足額もここに振り替えます。',3,
    'Small losses and miscellaneous expenses that do not fit other accounts. Unresolved cash shortages at year-end are transferred here from Cash Overage/Shortage.'],
  ['法定福利費','Welfare Expense',
   '法律で義務付けられた社会保険（健康保険・厚生年金）の会社負担分を記録する科目です。従業員と会社がおおむね折半で負担し、会社が負担する分だけ費用として計上します。',3,
    'The employer\'s share of statutory social insurance contributions (health insurance, employee pension). Employer and employee each pay roughly half; only the employer\'s share is expensed here.'],
  ['給料','Salaries',
   '従業員に支払う基本給・残業代・各種手当などの給与を記録する科目です。実際の支払い時に所得税・社会保険料を天引き（源泉徴収）して、手取り額だけを現金等で払います。',3,
    'Wages, overtime pay, and allowances paid to employees. At payment, income tax and social insurance premiums are withheld; only the net take-home pay is disbursed.'],
  ['法人税等','Corporate Tax Expense',
   '会社が1年間に稼いだ利益に対してかかる法人税・地方法人税・住民税・事業税の合計です（3級での表記）。決算で確定した税額を計上し、翌期に税務署に納付します。',3,
    'The combined total of corporate income tax, local corporate tax, inhabitant\'s tax, and enterprise tax for the year (simplified Level 3 label). Recognized at year-end; paid to the tax office in the following period.'],
  ['固定資産売却損','Loss on Sale of Fixed Assets',
   '固定資産（建物・土地・備品など）を売ったとき、売却価格が帳簿価額（取得原価－減価償却累計額）より低かった場合の差額損失を記録する科目です。',3,
    'The loss when a fixed asset (building, land, equipment, etc.) is sold for less than its book value (cost minus accumulated depreciation).'],
  ['消耗品費','Supplies Expense',
   'ペン・コピー用紙・電球など短期間で使い切る消耗品の費用です。期末に使い切れなかった分が残っていれば「消耗品（資産）」に振り戻します。',3,
    'The cost of short-life consumables (pens, copy paper, light bulbs, etc.). Any unused amount at year-end is reversed to Supplies (asset).'],
  ['手形売却損','Loss on Sale of Notes',
   '受け取った手形を期日前に銀行で割り引いて（現金化して）もらったとき、差し引かれる手数料分の損失を記録する科目です。手形の残存期間が長いほど手数料が高くなります。',3,
    'The discount fee charged when a received promissory note is cashed early (discounted) at a bank before its due date. The longer the remaining term, the higher the fee.'],
  // 2級 費用
  ['売上原価','Cost of Goods Sold',
   '売れた商品の仕入れコストを記録する科目で、「期首商品＋当期仕入－期末商品」で計算します。分記法や売上原価対立法では商品を売るたびにリアルタイムで売上原価を計上します。',2,
    'Total cost of goods actually sold: Beginning Inventory + Purchases − Ending Inventory. Under the separate and cost-of-sales methods, recognized in real time at each sale rather than at period-end.'],
  ['棚卸減耗損','Inventory Shrinkage Loss',
   '実際に倉庫で数えた在庫数量（実地棚卸）が帳簿の数量より少ないときの差額損失です。盗難・紛失・腐敗・破損などが原因です。正常な範囲の減耗は売上原価に算入し、異常な減耗は特別損失に計上します。',2,
    'The loss from actual inventory being less than the book quantity, due to theft, loss, spoilage, or damage. Normal shrinkage is included in cost of goods sold; abnormal amounts are extraordinary losses.'],
  ['商品評価損','Merchandise Write-down',
   '在庫商品の正味売却価額（今売ったらいくらになるか）が帳簿価額（取得原価）より低くなったときの差額損失です。在庫を実勢価格より高い金額で帳簿に載せることを禁じる「低価法」から生じます。',2,
    'The loss when inventory\'s net realizable value (estimated selling price minus selling costs) falls below its book cost. Required under the lower-of-cost-or-market rule to prevent overstating assets.'],
  ['有価証券評価損','Loss on Valuation of Securities',
   '売買目的有価証券を期末に時価評価したとき、時価が帳簿価額より低かった場合の差額損失です。翌期首には帳簿価額を時価に修正して（洗替法）再スタートします。',2,
    'When trading securities are marked to market at year-end and market value is below book value, the difference is recognized as a loss. Under the \'washing\' method, book value is reset to market at the start of the next period.'],
  ['有価証券売却損','Loss on Sale of Securities',
   '株式・債券などの有価証券を売ったとき、売却価格が帳簿価額より低かった場合の差額損失を記録する科目です。',2,
    'The loss when securities (stocks, bonds) are sold for less than their book value.'],
  ['電子記録債権売却損','Loss on Electronic Receivable Sale',
   '電子記録債権を期日前に金融機関に売却（割り引き）したときの手数料分の損失です。手形売却損の電子記録版です。',2,
    'The discount fee when an electronic receivable is sold (discounted) to a financial institution before maturity — the electronic equivalent of Loss on Sale of Notes.'],
  ['債権売却損','Loss on Sale of Receivables',
   '売掛金などの債権を第三者（ファクタリング会社など）に売却したとき、売却額が帳簿価額を下回った差額を記録する科目です。',2,
    'The loss when accounts receivable or other claims are sold to a third party (e.g., a factoring company) for less than their book value.'],
  ['社債利息','Bond Interest Expense',
   '社債の保有者（社債権者）に支払う利息を記録する科目です。額面金額×クーポン利率で計算します。社債を割引発行した場合は、割引額も毎期「社債利息」として追加計上（社債の帳簿価額を増加させる）します。',2,
    'Interest paid to bondholders: face value × coupon rate. If bonds were issued at a discount, the discount is also amortized into this account each period (increasing the bond\'s book value toward face value).'],
  ['のれん償却','Goodwill Amortization',
   '資産として計上したのれんを毎期少しずつ費用化していく科目です。計上した全額を最長20年以内に均等償却します（例：5年均等なら毎期のれん残高の20%を費用計上）。',2,
    'The periodic amortization of capitalized goodwill, expensed evenly within 20 years. Example: over 5 years, 20% of the goodwill balance is expensed each period.'],
  ['退職給付費用','Retirement Benefit Expense',
   '当期に発生した従業員への退職給付義務の増加分を費用として計上する科目です。毎期「退職給付費用（費用）／退職給付引当金（負債）」と仕訳し、実際に退職金を払ったとき引当金を取り崩します。',2,
    'The current-period increase in the retirement benefit obligation recognized as an expense. Journal entry: Dr. Retirement Benefit Expense / Cr. Retirement Benefit Obligation.'],
  ['製品保証引当金繰入','Product Warranty Expense',
   '売った製品への保証費用を見積もって製品保証引当金を積み立てるための費用科目です。「製品保証引当金繰入（費用）／製品保証引当金（負債）」と計上します。',2,
    'The periodic expense of building up the product warranty reserve based on estimated future warranty costs. Journal entry: Dr. Product Warranty Expense / Cr. Product Warranty Reserve.'],
  ['法人税・住民税及び事業税','Corporate Tax (Full Name)',
   '法人税・地方法人税・住民税・事業税の合計額で、2級での正式な表記です。3級では「法人税等」と略して記載することもあります。実務ではこの正式名称を使います。',2,
    'The full legal name for the combined corporate tax, local corporate tax, inhabitant\'s tax, and enterprise tax — used on the Level 2 exam and in actual practice.'],
  ['火災損失','Fire Loss',
   '火災によって建物・商品・備品などが焼失したときの損失を記録する科目です。焼失した固定資産の帳簿価額が損失となります。火災保険に入っていれば保険金で補填でき、差し引いた残りが実質的な損失です。',2,
    'The loss from buildings, merchandise, or equipment destroyed by fire. The book value of the destroyed assets is the loss. Fire insurance proceeds offset it; any excess over the loss is Insurance Proceeds Gain.'],
  ['固定資産除却損','Loss on Retirement of Assets',
   '固定資産を帳簿から取り除くとき（廃棄・取り壊し・使用不能時）の未償却残高（帳簿価額）を損失として計上します。例えば帳簿価額50万円の機械を廃棄すれば50万円の除却損が発生します。',2,
    'The un-depreciated book value recognized as a loss when a fixed asset is removed from service (discarded, demolished, or rendered unusable). Example: retiring machinery with a ¥500,000 book value → ¥500,000 loss.'],
  ['固定資産廃棄損','Loss on Disposal of Assets',
   '固定資産を実際に廃棄処分したときの帳簿価額を損失計上する科目で、除却損とほぼ同義です。廃棄費用（解体費など）がかかる場合はそれも加算します。',2,
    'Similar to Loss on Retirement; recognized when a fixed asset is physically disposed of. Any disposal costs (e.g., demolition fees) are added to the loss.'],
  ['工事原価','Construction Cost',
   '工事進行基準を採用している場合に、その期に計上した工事収益に対応する実際の工事費用（材料費・労務費・外注費など）を記録する科目です。',2,
    'Under the percentage-of-completion method, the actual construction costs (materials, labor, subcontracting, etc.) matched against Construction Revenue recognized in the period.'],
  // ===== 収益 =====
  ['売上','Sales Revenue',
   '会社の本業（商品・サービスの販売）から得た収益です。返品があれば「売上返品」として差し引き、値引きをすれば「売上値引き」として差し引きます。これらを差し引いた後の純売上高が実質的な売上です。',3,
    'Revenue from the company\'s core business (selling goods or services). Returns reduce gross sales (\'Sales Returns\'); price reductions reduce it (\'Sales Discounts\'). Net sales = gross sales minus these deductions.'],
  ['受取家賃','Rent Revenue',
   '所有している建物・土地を他社や個人に貸して受け取る家賃・地代収入です。本業（商品販売）以外の副収入（営業外収益）に分類されます。',3,
    'Rent or ground rent received for buildings or land owned and leased to others. A non-operating (other) income item, not part of the core business.'],
  ['受取手数料','Commission Revenue',
   '仲介・代理・紹介などのサービスに対してもらう手数料収入です。不動産仲介手数料・金融商品の販売手数料・代理店手数料などが該当します。',3,
    'Fees received for brokerage, agency, or referral services: real estate agent commissions, financial product sales fees, dealer fees, etc.'],
  ['受取利息','Interest Revenue',
   '銀行預金（普通預金・当座預金）や貸付金に対してもらう利息収入です。今期分だがまだ受け取っていないものは決算整理で「未収利息（資産）」として計上します。',3,
    'Interest earned on bank deposits (savings or checking accounts) and on loans made to others. Current-period interest not yet received is accrued at year-end as Accrued Interest Receivable.'],
  ['固定資産売却益','Gain on Sale of Fixed Assets',
   '固定資産（建物・土地・備品など）を売ったとき、売却価格が帳簿価額より高かった場合の差額利益を記録する科目です。',3,
    'The gain when a fixed asset (building, land, equipment, etc.) is sold for more than its book value (cost minus accumulated depreciation).'],
  ['受取配当金','Dividend Revenue',
   '保有している株式に対して、その会社（投資先）から受け取る配当金収入です。投資先企業が利益の一部を株主に分配するものです。',3,
    'Dividends received from companies in which shares are held. Represents a distribution of the investee company\'s profits to its shareholders.'],
  ['償却債権取立益','Recovery of Written-off Claims',
   '以前に「貸倒損失（費用）」として処理してしまった売掛金・貸付金が後から一部または全額回収できたときに計上する収益です。一度諦めたお金が戻ってきたときの「棚ぼた収益」です。',3,
    'Revenue recognized when receivables previously written off as Bad Debt Expense are unexpectedly recovered, in full or in part — a \'windfall\' recovery.'],
  ['雑益','Miscellaneous Revenue',
   '少額の収益や原因不明の現金超過など、他の収益科目に当てはまらない雑多な収益を記録する科目です。現金過不足の原因が期末まで判明しなかった超過額もここに振り替えます。',3,
    'Small incidental revenues and other income that does not fit other accounts. Unresolved cash overages at year-end are transferred here from Cash Overage/Shortage.'],
  // 2級 収益
  ['有価証券売却益','Gain on Sale of Securities',
   '株式・債券などの有価証券を売ったとき、売却価格が帳簿価額より高かった場合の差額利益を記録する科目です。',2,
    'The gain when securities (stocks, bonds) are sold for more than their book value.'],
  ['有価証券評価益','Gain on Valuation of Securities',
   '売買目的有価証券を期末に時価評価したとき、時価が帳簿価額より高かった場合の差額利益です。翌期首には帳簿価額を時価に修正して（洗替法）再スタートします。',2,
    'When trading securities are marked to market at year-end and market value is above book value, the difference is recognized as a gain. Book value is reset at the start of next period (washing method).'],
  ['有価証券利息','Interest on Securities',
   '保有している社債・国債などの債券から受け取る利息（クーポン収入）を記録する科目です。受取利息が預金等の利息なのに対し、有価証券利息は債券の利息に使います。',2,
    'Coupon income received from bonds (corporate bonds, government bonds) held. Distinct from Interest Revenue, which covers deposit and loan interest.'],
  ['工事収益','Construction Revenue',
   '工事進行基準を採用している会社で認識する、工事の進捗に応じた収益です。「完成した工事の割合（進捗率）×工事合計請負代金」で計算し、工事完了前でも進んだ分だけ毎期収益計上します。',2,
    'Under the percentage-of-completion method, revenue recognized proportional to the stage of completion: completion % × total contract price. Recognized each period as work progresses.'],
  // ===== 純資産 =====
  ['資本金','Capital Stock',
   '株主が会社に出資したお金の元手部分です。会社が倒産しても株主は出資した以上の損失を受けない（有限責任）代わりに、経営が上手くいっても必ず返済されるものではありません（返済不要）。',3,
    'Capital contributed by shareholders. Shareholders bear no more than their investment (limited liability); in turn, the company is not obliged to repay it. Increased by new share issuances.'],
  ['繰越利益剰余金','Retained Earnings',
   '過去から積み上げてきた利益の貯金です。毎期の決算で当期純利益が加算され、配当を払ったり準備金に積み立てたりすることで減少します。会社の長期的な業績を示す重要な指標です。',3,
    'Accumulated profits carried forward from prior periods. Increased each period by Net Income; decreased by dividends and transfers to legal reserves. A key indicator of long-term profitability.'],
  ['利益準備金','Legal Earned Reserve',
   '会社法で義務付けられた法定準備金の一つです。配当金を払うたびに配当額の10分の1を積み立てる必要があります（資本金の4分の1に達するまで）。将来の損失補填のための安全弁です。',3,
    'A statutory reserve required by the Companies Act. Each time a dividend is paid, 10% of the dividend must be set aside until the reserve reaches one-quarter of capital stock. Serves as a safety buffer against future losses.'],
  // 2級 純資産
  ['資本準備金','Capital Reserve',
   '会社法で義務付けられた法定準備金のもう一つです。株式を発行するとき、払込金額の2分の1以上を資本準備金として積み立てます（残りは資本金）。利益準備金と合わせて「法定準備金」と呼ばれます。',2,
    'The other statutory reserve required by the Companies Act. At least half of the stock issuance price must be credited here (the remainder to Capital Stock). Together with the Legal Earned Reserve, called the \'Legal Reserve.\''],
  ['別途積立金','Special Reserve',
   '会社が自由に決める任意積立金です。将来の設備投資・損失補填・配当の安定化などの目的で積み立てます。法律で義務付けられているわけではなく、取締役会や株主総会の決議で積み立て・取り崩しができます。',2,
    'A voluntary reserve set aside at the company\'s discretion (not required by law) for future purposes such as facility investment, loss coverage, or dividend stability. Can be accumulated or released by board or shareholder resolution.'],
  ['その他資本剰余金','Other Capital Surplus',
   '資本取引（出資や自己株式の処分など）から生じる資本準備金以外の剰余金です。自己株式を売却したときの売却差益（自己株式処分差益）などがここに計上されます。',2,
    'Capital surplus other than the Capital Reserve, arising from capital transactions such as gains from disposing of treasury stock (excess of selling price over cost).'],
  ['自己株式','Treasury Stock',
   '会社が自社の発行済み株式を市場から買い戻したもの（金庫株）です。純資産のマイナスとして貸借対照表に計上します。買い戻した株式は再発行（処分）したり消却したりできます。',2,
    'The company\'s own shares repurchased from the market (\'treasury shares\'). Recorded as a deduction (negative amount) in shareholders\' equity on the balance sheet. Can be reissued or cancelled.'],
  ['新株予約権','Stock Warrants',
   '将来一定の価格で株式を買える権利です。ストックオプション（役員・従業員への付与）や新株予約権付社債（転換社債型）などが代表例です。発行時に純資産に計上し、行使されたとき資本金等に振り替えます。',2,
    'The right to purchase company shares at a fixed price in the future. Common forms: stock options granted to executives/employees, and warrants attached to convertible bonds. Recorded in equity when issued; transferred to Capital Stock when exercised.'],
  ['その他有価証券評価差額金','Unrealized Gains/Losses on Securities',
   '投資有価証券（その他有価証券）を期末に時価評価したときの差額を、損益にではなく直接純資産に計上した金額です。税効果会計で税額を差し引いた後の純額が純資産に計上されます。',2,
    'The after-tax net change in fair value of \'other securities\' (investment securities) at period-end, recorded directly in equity rather than in profit or loss. Positive = unrealized gain; negative = unrealized loss.'],
  // ===== 評価勘定・その他 =====
  ['貸倒引当金','Allowance for Bad Debts',
   '売掛金・受取手形などの回収できない見込み額を差し引くための評価勘定です。資産のマイナスとして貸借対照表に表示します。「貸倒引当金繰入（費用）」を計上するときの相手勘定です。',3,
    'A contra asset that reduces the carrying amount of receivables by the estimated uncollectible portion. Shown as a deduction from the related receivable on the balance sheet. The counterpart of Bad Debt Allowance Expense.'],
  ['減価償却累計額','Accumulated Depreciation',
   '固定資産のこれまでの減価償却費の合計額を記録する評価勘定です。固定資産のマイナスとして貸借対照表に表示し、「帳簿価額（簿価）＝取得原価－減価償却累計額」の式で現在の価値を示します。',3,
    'A contra asset recording total depreciation recognized on a fixed asset since acquisition. Book value = cost − accumulated depreciation. Shown as a deduction from the related fixed asset on the balance sheet.'],
  ['損益','Income Summary',
   '決算整理の最終段階で、全収益・全費用を集めて当期純利益（または純損失）を計算するための一時的な勘定です。最終的には繰越利益剰余金に振り替えられ、損益勘定自体はゼロになります。',3,
    'A temporary account used at year-end to aggregate all revenues and expenses and compute net income (or net loss). Closed to Retained Earnings at the end of the closing process; the account itself ends at zero.'],
  // 2級 評価勘定
  ['建物減価償却累計額','Accum. Depr. (Building)',
   '建物のこれまでの減価償却費の合計額です。貸借対照表で「建物（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Building account. Shown as a deduction from Buildings on the balance sheet.'],
  ['備品減価償却累計額','Accum. Depr. (Equipment)',
   '備品のこれまでの減価償却費の合計額です。貸借対照表で「備品（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Equipment account. Shown as a deduction from Equipment on the balance sheet.'],
  ['車両運搬具減価償却累計額','Accum. Depr. (Vehicles)',
   '車両運搬具のこれまでの減価償却費の合計額です。貸借対照表で「車両運搬具（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Vehicles account. Shown as a deduction from Vehicles on the balance sheet.'],
  ['機械装置減価償却累計額','Accum. Depr. (Machinery)',
   '機械装置のこれまでの減価償却費の合計額です。貸借対照表で「機械装置（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Machinery account. Shown as a deduction from Machinery on the balance sheet.'],
  ['構築物減価償却累計額','Accum. Depr. (Structures)',
   '構築物のこれまでの減価償却費の合計額です。貸借対照表で「構築物（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Structures account. Shown as a deduction from Structures on the balance sheet.'],
  ['工具器具備品減価償却累計額','Accum. Depr. (Tools/Fixtures)',
   '工具器具備品のこれまでの減価償却費の合計額です。貸借対照表で「工具器具備品（資産）」のマイナスとして表示します。',2,
    'Total accumulated depreciation for the Tools, Furniture and Fixtures account. Shown as a deduction from that account on the balance sheet.'],
  // ===== 2級追加（商業簿記・テキスト追加分）=====
  ['契約資産','Contract Asset',
   'サービスや工事を提供する前に、将来お金をもらえる権利のうち、まだ条件を満たしていない部分を記録します。例えば工事の途中で「完成したらもらえるお金の権利」がこれにあたります。<strong>売掛金との違いは、代金請求権がまだ確定していない点</strong>です。',2,
    'A right to consideration earned by performing under a contract, but not yet unconditional (i.e., invoicing is not yet possible). Under the new revenue recognition standard: unlike Accounts Receivable (an unconditional right), this right is still contingent on further performance.'],
  ['特許権','Patent Rights',
   '発明した技術を独占的に使える権利を資産計上したものです。<mark>無形固定資産</mark>に分類され、登録から20年間有効ですが、帳簿上は有効期間で均等償却します。毎期「特許権償却（費用）」として費用化します。',2,
    'An intangible fixed asset representing the exclusive right to exploit an invention. Amortized straight-line over the useful life (≤ 20 years). Charged to Patent Amortization expense each period.'],
  ['ソフトウェア仮勘定','Software in Progress',
   'ソフトウェアを<strong>開発中・未完成の段階</strong>で支払った費用を一時的に記録する科目です。建設仮勘定のソフトウェア版です。完成・稼働開始後に「ソフトウェア（資産）」に振り替えます。',2,
    'Costs incurred on software under development, pending completion — the software equivalent of Construction in Progress. Transferred to the Software account when the software is complete and put into service.'],
  ['開業費','Organization & Pre-opening Costs',
   '会社設立後、営業開始前にかかった費用（宣伝費・従業員研修費・試験運転費など）を資産計上した<mark>繰延資産</mark>です。5年以内に均等償却します。創立費（設立時）と混同しないよう注意してください。',2,
    'Pre-opening costs incurred after incorporation but before commencing business (advertising, staff training, trial runs), recorded as a deferred asset. Amortized evenly within 5 years. Distinct from Organization Costs (incurred before incorporation).'],
  ['支店','Branch Office',
   '本社の帳簿上で「支店に対する投資額・立替額」を記録する科目です。<strong>本社と支店の帳簿を別々に管理する「本支店会計」</strong>で使われます。支店の帳簿では「本店」勘定が対応します。決算時に合算して合計財務諸表を作ります。',2,
    'In head-office/branch accounting, the account on the head office\'s books representing its investment in and advances to the branch. The branch records the mirror account \'Head Office.\' Both accounts are eliminated when preparing combined financial statements.'],
  ['本店','Head Office (from Branch)',
   '支店の帳簿上で「本社から受け取った資金・立替金」を記録する科目です。<strong>本支店会計</strong>で使われ、本社の「支店」勘定と対応関係にあります。純資産的な性格（本社の投資額）を持つため純資産に近い扱いをすることもあります。',2,
    'In head-office/branch accounting, the account on the branch\'s books representing resources received from and obligations to the head office. The mirror of the \'Branch Office\' account on the head office\'s books.'],
  ['返金負債','Refund Liability',
   'お客さんに返金する可能性がある金額を負債として積み立てる科目です。<mark>新収益認識基準（IFRS15号準拠）</mark>で登場します。例えば売上から返品見込み額を差し引く際に使います。返品が確定したときに取り崩します。',2,
    'A liability for the estimated amount expected to be refunded to customers for anticipated returns. Under the new revenue recognition standard, expected returns reduce the transaction price and are recorded here. Reversed when returns are confirmed.'],
  ['契約負債','Contract Liability',
   'お客さんからお金を先にもらったが、まだサービスや商品を提供していない場合の義務を記録します。<strong>前受金と似ていますが、履行義務（契約で決まったサービス提供義務）を重視した表現</strong>です。新収益認識基準で多く使われます。',2,
    'An obligation to transfer goods or services to a customer who has already paid. Similar to Customer Advances but emphasizes the contractual performance obligation. Used under the new revenue recognition standard.'],
  ['賞与引当金','Bonus Reserve',
   '従業員に支給する賞与（ボーナス）を、支給日に一括費用化するのではなく、<mark>発生した期間に少しずつ見積もって積み立てる</mark>負債です。例えば12月支給のボーナスの発生分を毎月「賞与引当金繰入（費用）」として計上します。',2,
    'A liability accrued for employee bonuses (summer/winter bonus) earned in the current period but payable in a future period. Accrued monthly to avoid a large one-time hit to earnings on the payment date.'],
  ['役員賞与引当金','Directors\' Bonus Reserve',
   '取締役・監査役などの役員に支給する賞与を事前に見積もって積み立てる負債です。<strong>役員賞与は株主総会の承認が必要</strong>なため、従業員賞与と区別して管理します。積立時に「役員賞与引当金繰入（費用）」を計上します。',2,
    'A liability accrued for executive bonuses. Executive bonuses require shareholder meeting approval and are tracked separately from employee bonuses. Built up via Directors\' Bonus Reserve Expense.'],
  ['役務収益','Service Revenue',
   'サービス（役務）を提供することで得た収益です。<mark>工事業・運送業・コンサルティング業</mark>など、物ではなくサービスを売る会社で使います。売上と性格は同じですが、物品販売と区別するためにこの科目名を使います。',2,
    'Revenue from delivering services (as opposed to selling physical goods). Used by construction contractors, logistics firms, consultants, etc. Conceptually the same as Sales Revenue but for service businesses.'],
  ['為替差益','Foreign Exchange Gain',
   '外貨建ての取引（ドルやユーロで行った売買・借入等）を円換算するとき、<strong>円安（外貨が高くなる）方向に動いた場合</strong>に生じる利益です。例えばドル建て売掛金を決済したとき、決済時の為替レートの方が有利だった場合に計上します。',2,
    'A gain when foreign-currency transactions are converted to yen and the exchange rate moved favorably (yen weakened / foreign currency appreciated). Example: a USD receivable settled after the dollar strengthened.'],
  ['為替差損','Foreign Exchange Loss',

   '本社工場会計で、工場が当月に計上した<mark>損益（製品原価に含まれる損益）</mark>を本社に報告するために使う科目です。月末に工場の損益を本社に振り替える仕訳で使用します。','本社・工場',
    'In head-office/factory accounting, the account the factory uses to report its monthly profit or loss (product cost result) to the head office. Used at month-end when the factory transfers its cost results to the head office.'],
];

// ===== 用語解説集データ =====
const GLOSSARY_DATA = [
  { category:'① 簿記の基本', items:[
    { term:'借方', en:'Debit (Dr.)', def:'<strong>仕訳の左側</strong>を「借方」といいます。<mark>資産の増加・費用の発生・負債の減少・純資産の減少</mark>を記録します。例：現金100円を受け取った→借方に「現金100」と書く。「左＝借方」と体で覚えましょう。', def_en:'The <strong>left side</strong> of a journal entry. Record here when assets increase, expenses occur, liabilities decrease, or equity decreases. Example: receiving ¥100 cash → write "Cash 100" on the debit (left) side.' },
    { term:'貸方', en:'Credit (Cr.)', def:'<strong>仕訳の右側</strong>を「貸方」といいます。<mark>負債の増加・収益の発生・資産の減少・純資産の増加</mark>を記録します。例：商品100円を売った→貸方に「売上100」と書く。「右＝貸方」と覚えましょう。', def_en:'The <strong>right side</strong> of a journal entry. Record here when liabilities increase, revenues occur, assets decrease, or equity increases. Example: selling goods for ¥100 → write "Sales 100" on the credit (right) side.' },
    { term:'仕訳', en:'Journal Entry', def:'取引が起きたときに<strong>借方（左）と貸方（右）に分けて記録する基本作業</strong>です。必ず「借方合計＝貸方合計」になります。例：商品を現金100円で仕入れた→（借）仕入100 ／（貸）現金100。', def_en:'The fundamental recording step: split every transaction into a <strong>debit (left)</strong> and a <strong>credit (right)</strong>. Totals must always balance. Example: buying goods for ¥100 cash → Dr. Purchases 100 / Cr. Cash 100.' },
    { term:'複式簿記', en:'Double-entry Bookkeeping', def:'すべての取引を<strong>必ず2科目以上の借方・貸方で記録</strong>する仕組みです。「借方合計＝貸方合計」が常に成立するため、記録ミスを自動検出できます。現金の出入りだけ記録する「単式簿記」と対比して覚えましょう。', def_en:'A system where <strong>every transaction is recorded in at least two accounts</strong> (debit and credit). Because every debit must equal every credit, errors are automatically detectable — unlike single-entry bookkeeping which only tracks cash flows.' },
    { term:'勘定科目', en:'Account Title', def:'取引の内容を表す<mark>標準的な分類名称</mark>です。現金・売掛金・借入金・売上など、決まった名前を使います。例：「お金を払った」→「現金」「普通預金」など具体的な科目名で記録します。試験では正確な科目名が必須です。', def_en:'<mark>Standardized labels</mark> used to classify transactions — Cash, Accounts Receivable, Loans Payable, Sales Revenue, etc. Example: "paid money" must be recorded as a specific account title like "Cash" or "Bank Deposits." Exact names are required on exams.' },
    { term:'勘定', en:'Account', def:'勘定科目ごとの「残高管理ページ」です。T字型（Tフォーム）で、左が借方・右が貸方。差額が現在の残高です。例：現金勘定の借方合計500・貸方合計200なら現金残高は300円。', def_en:'A T-shaped ledger page for each account. Left = debits, Right = credits; the difference is the current balance. Example: if Cash has ¥500 in debits and ¥200 in credits, the Cash balance is ¥300.' },
    { term:'転記', en:'Posting', def:'仕訳帳に書いた仕訳を<strong>勘定科目ごとの元帳（総勘定元帳）に書き写す作業</strong>です。仕訳帳→元帳の順が記帳の基本の流れです。転記ミスは試算表の不一致として発見できます。', def_en:'<strong>Copying journal entries into the individual account pages</strong> of the general ledger. The flow is: journal → ledger. Posting errors show up as imbalances in the trial balance.' },
    { term:'会計期間', en:'Accounting Period', def:'財務諸表を作る区切りの期間で、<mark>通常1年間（例：4月1日〜翌3月31日）</mark>です。期間の始まりを「期首」、終わりを「期末（決算日）」といいます。日本の多くの会社は3月31日が期末です。', def_en:'The time span covered by financial statements — <mark>usually one fiscal year</mark> (e.g., April 1 – March 31). The start is the "beginning of period" and the end is the "fiscal year-end." Most Japanese companies end their fiscal year on March 31.' },
    { term:'貸借平均の原則', en:'Principle of Debit-Credit Balance', def:'<strong>すべての仕訳で借方合計＝貸方合計が必ず成立する</strong>というルールです。試算表の借方・貸方合計が一致するのもこの原則があるためです。合計がずれたら転記ミスを疑いましょう。', def_en:'The rule that <strong>total debits always equal total credits</strong> in every journal entry. This is why the debit and credit columns of a trial balance must match — if they don\'t, there\'s a recording error.' },
  ]},
  { category:'② 帳簿の種類', items:[
    { term:'仕訳帳', en:'Journal', def:'取引が発生した順番に<strong>時系列で仕訳を記録する主要帳簿</strong>です。「日記帳」のイメージで、すべての取引はまずここに記録されてから元帳へ転記されます。', def_en:'The primary book that records journal entries in <strong>chronological order</strong> — think of it as a diary of all transactions. Every transaction is first entered here, then posted to the general ledger.' },
    { term:'総勘定元帳', en:'General Ledger', def:'<strong>勘定科目ごとに取引を集計した主要帳簿</strong>です。現金の元帳には現金の増減だけが集まり、残高を見れば今の現金残高がすぐわかります。仕訳帳と並ぶ2大主要帳簿です。', def_en:'The primary book that <strong>summarizes transactions by account title</strong>. The Cash account page shows only cash movements; the balance tells you exactly how much cash you have. It\'s one of the two core accounting books (with the journal).' },
    { term:'補助元帳', en:'Subsidiary Ledger', def:'売掛金・買掛金などを<strong>取引先ごとに細かく管理する補助帳簿</strong>です。例：「A社への売掛金はいくら？」を把握するために使います。得意先元帳・仕入先元帳が代表例です。', def_en:'A <strong>detailed subsidiary book</strong> that breaks down accounts like Accounts Receivable or Payable by individual customer or supplier. Example: "How much does Company A owe us?" — you look it up in the accounts receivable subsidiary ledger.' },
    { term:'現金出納帳', en:'Cash Book', def:'現金の入出金を日付順に記録する補助帳簿です。帳簿の残高と<strong>実際の手元現金が毎日一致しているか確認</strong>するために使います。差があればレジ違いや紛失を疑います。', def_en:'A subsidiary book recording cash receipts and payments in date order. Used to verify that the book balance <strong>matches the actual cash on hand every day</strong>. Any discrepancy signals a register error or missing cash.' },
    { term:'小口現金出納帳', en:'Petty Cash Book', def:'小口現金係が日々の小払い（切手代・交通費など）を記録する帳簿です。<strong>費目別（交通費・消耗品費など）に集計</strong>し、定期的に経理へ報告して補充を受けます。', def_en:'Records day-to-day small payments (postage, transit fares, etc.) handled by a petty cash custodian. Expenses are <strong>tracked by category</strong> (travel, supplies, etc.) and periodically reported to accounting for reimbursement.' },
    { term:'商品有高帳', en:'Inventory Record', def:'商品の入庫・出庫・残高を<strong>数量と単価で管理する補助帳簿</strong>です。先入先出法や移動平均法で単価を計算し、いつでも在庫の数量と金額がわかります。', def_en:'Tracks inventory movements (in/out/balance) by <strong>quantity and unit cost</strong>. Using FIFO or moving-average methods, it tells you the exact quantity and value of stock at any time.' },
    { term:'受取手形記入帳', en:'Notes Receivable Book', def:'受け取った手形を<strong>振出人・金額・満期日ごとに管理</strong>する補助帳簿です。満期になったら取り立て、割引・裏書した場合もここで追跡します。', def_en:'Manages received promissory notes by <strong>issuer, amount, and maturity date</strong>. Used to track when to collect, and to record endorsements or discounting of notes.' },
    { term:'支払手形記入帳', en:'Notes Payable Book', def:'自社が振り出した手形を<strong>受取人・金額・満期日ごとに管理</strong>する補助帳簿です。満期日を過ぎると不渡りになるため、期日管理が最重要です。', def_en:'Manages notes payable (promissory notes issued by your company) by <strong>payee, amount, and due date</strong>. Due-date management is critical — missing a payment date causes a dishonored note.' },
    { term:'仕訳日計表', en:'Daily Summary Journal', def:'1日分の伝票（入金・出金・振替）を<strong>科目ごとに集計して1枚にまとめた表</strong>です。これを使うことで毎日の転記作業を効率化できます。多拠点・大量取引の会社向けです。', def_en:'A <strong>daily summary</strong> that totals all vouchers (receipts, payments, transfers) by account for one day. It streamlines posting to the ledger and is used by companies with high transaction volumes or multiple locations.' },
  ]},
  { category:'③ 財務諸表', items:[
    { term:'貸借対照表', en:'Balance Sheet (B/S)', def:'<mark>決算日時点</mark>での財産状態を写真のように切り取った表です。左に資産、右に負債＋純資産が並び、<strong>「資産＝負債＋純資産」</strong>が常に成立します。「今この会社にいくら財産があり、いくら借金があるか」がわかります。', def_en:'A <strong>snapshot of financial position</strong> on the balance sheet date. Assets on the left; liabilities + equity on the right. The equation <strong>Assets = Liabilities + Equity</strong> always holds. It answers: "What does the company own, and how much does it owe?"' },
    { term:'損益計算書', en:'Income Statement (P/L)', def:'<mark>1年間（会計期間）</mark>の収益・費用・利益を動画のように記録した表です。「売上－コスト＝いくら儲けたか」を段階的に計算します。会社の稼ぎ力を判断する最重要書類の一つです。', def_en:'A <strong>record of revenues, expenses, and profit</strong> over an accounting period (usually one year). It progressively calculates profit: "Sales minus costs = how much the company earned." One of the most important financial statements for judging profitability.' },
    { term:'株主資本等変動計算書', en:'Statement of Changes in Equity', def:'純資産の各項目（資本金・繰越利益剰余金など）が<strong>1年間でどう増減したかを記録した表</strong>です。配当で純資産が減った・利益で増えた、などの変動をすべて追跡できます。2級必須書類です。', def_en:'Shows <strong>how each component of equity changed during the year</strong> (capital stock, retained earnings, etc.). It tracks every change — profits added, dividends paid, new shares issued. Required knowledge for the Level 2 exam.' },
    { term:'売上総利益', en:'Gross Profit', def:'<strong>売上高から売上原価（商品の仕入コスト）を引いた最初の利益</strong>です。「粗利」とも呼ばれます。例：商品を1,000円で売り、仕入コストが600円なら粗利は400円。この400円でさらに人件費などを賄います。', def_en:'The <strong>first-level profit: Sales minus Cost of Goods Sold</strong>. Also called "gross margin." Example: sell goods for ¥1,000, bought for ¥600 → gross profit is ¥400. This ¥400 then covers operating expenses like salaries.' },
    { term:'営業利益', en:'Operating Profit', def:'売上総利益から<strong>販売費・一般管理費（人件費・広告費・家賃など）を引いた本業の利益</strong>です。「本業でどれだけ稼げているか」を示す最も重要な利益指標です。', def_en:'<strong>Gross profit minus operating expenses</strong> (salaries, advertising, rent, etc.). This shows "how much the core business earns" — the most important profitability metric.' },
    { term:'経常利益', en:'Ordinary Profit', def:'営業利益に<strong>受取利息・受取配当などの営業外収益を加え、支払利息などの営業外費用を差し引いた利益</strong>です。本業＋財務活動を合わせた「通常の企業活動全体」の利益です。', def_en:'<strong>Operating profit plus non-operating income (interest received, dividends) minus non-operating expenses (interest paid)</strong>. Represents the profit from all <em>ordinary</em> business activities, including financial management.' },
    { term:'税引前当期純利益', en:'Income Before Tax', def:'経常利益に<strong>特別利益（固定資産売却益など）を加え、特別損失（災害損失など）を引いた利益</strong>です。臨時・異常な損益も含めた最終計算で、ここから法人税を引きます。', def_en:'<strong>Ordinary profit adjusted for extraordinary items</strong> (e.g., gains from asset sales, losses from disasters). Includes all one-time or unusual items. Corporate taxes are then subtracted to arrive at net income.' },
    { term:'当期純利益', en:'Net Income', def:'税引前当期純利益から<strong>法人税等を差し引いた「最終的な手残り利益」</strong>です。この金額が貸借対照表の繰越利益剰余金に加算されます。マイナスの場合を「当期純損失」といいます。', def_en:'The <strong>final "bottom line" profit after subtracting corporate taxes</strong> from income before tax. This amount is added to retained earnings on the balance sheet. If negative, it is called a "net loss."' },
  ]},
  { category:'④ 試算表・精算表', items:[
    { term:'試算表', en:'Trial Balance', def:'すべての勘定科目の残高を一覧にして<strong>借方合計＝貸方合計かを確認する表</strong>です。一致していれば転記ミスはないと判断できます（ただし2科目を逆に転記した「逆仕訳ミス」などは発見できません）。', def_en:'A list of all account balances used to <strong>verify that total debits equal total credits</strong>. If balanced, no posting errors exist — though some mistakes (like reversed entries across two accounts) won\'t be caught.' },
    { term:'合計試算表', en:'Sum Trial Balance', def:'各勘定の<strong>借方合計と貸方合計をそのまま並べた試算表</strong>です。仕訳量の確認には使えますが、残高はひと目ではわかりません。', def_en:'Lists the <strong>total debits and total credits</strong> for each account side by side. Useful for checking transaction volumes, but you can\'t easily see the current balance of each account.' },
    { term:'残高試算表', en:'Balance Trial Balance', def:'各勘定の<strong>差引残高（借方超か貸方超かの差額）だけを並べた試算表</strong>です。各科目の今の残高がひと目でわかるため、決算作業に最もよく使われます。', def_en:'Lists only the <strong>net balance (debit minus credit) of each account</strong>. The current balance of every account is immediately visible, making it the most practical format for preparing financial statements.' },
    { term:'合計残高試算表', en:'Sum-Balance Trial Balance', def:'合計試算表と残高試算表を合体した表で、<strong>合計額と残高の両方を一覧できる</strong>最も情報量の多い試算表です。作成に手間がかかりますが試験で最もよく出題されます。', def_en:'Combines both formats: shows <strong>total debits/credits AND the net balance</strong> for every account. The most information-rich format, and the most frequently tested on the bookkeeping exam.' },
    { term:'精算表', en:'Worksheet', def:'試算表・決算整理仕訳・損益計算書・貸借対照表を<strong>一枚の大きな表にまとめた作業用シート</strong>です。6桁（試算表＋整理記入＋BS/PL）が基本です。決算書作成の途中過程を整理するための表です。', def_en:'A large <strong>working spreadsheet</strong> that combines the trial balance, adjusting entries, income statement, and balance sheet in one place (typically 6 or 8 columns). It organizes the steps from trial balance to finished financial statements.' },
  ]},
  { category:'⑤ 商品売買・在庫', items:[
    { term:'三分法', en:'Three-Account Method', def:'商品売買を<strong>仕入（費用）・売上（収益）・繰越商品（資産）の3科目</strong>で記録する最もポピュラーな方法です。仕入時→（借）仕入、売上時→（貸）売上と記録し、期末に「しくりくりし」で売上原価を計算します。', def_en:'The most common inventory method, using <strong>three accounts: Purchases (expense), Sales (revenue), and Merchandise Inventory (asset)</strong>. Record "Purchases" when buying, "Sales" when selling, then do the period-end inventory adjustment.' },
