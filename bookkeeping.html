    q_en:'(Fill in) Month-end treatment of cost variances. Immaterial variances → [①___]. Material variances → [②___]. Unfavorable variances [③___] COGS; favorable variances [④___] COGS.',
    a:'① 売上原価（全額加減算）\n② 売上原価・期末仕掛品・期末製品の残高比率で按分配分\n③ 増加（加算）\n④ 減少（減算）\n\n【計算過程】\n差異が小さい場合：全額売上原価へ加減算（簡便法）\n差異が大きい場合：期末残高比率で売上原価・仕掛品・製品に按分（正確法）\n\n▶ ポイント：不利差異（コスト超過）→売上原価増加、有利差異（コスト節約）→売上原価減少',
    exp:'差異の処理は商業簿記の棚卸減耗損と同様の考え方。重要性の低い差異は「売上原価一括調整（簡便法）」、重要性の高い差異は「各在庫・売上原価に按分（より正確）」で処理します。不利差異（コスト超過）は売上原価を増やし、有利差異（コスト節約）は売上原価を減らします。',
    exp_en:'Variance disposition: immaterial → adjust COGS directly (all at once, simple). Material → prorate across COGS, closing WIP, and closing finished goods (more precise). Unfavorable = COGS increases (we spent more than standard). Favorable = COGS decreases (we spent less than standard).',
    steps:[
      {label:'①差異が小さい場合の処理', hint:'重要性が低い差異を加減算する勘定', ans:'売上原価', choices:['売上原価','製造間接費','仕掛品','製品']},
      {label:'②差異が大きい場合の処理', hint:'重要性が高い差異を3科目に按分', ans:'売上原価・仕掛品・製品に按分', choices:['売上原価・仕掛品・製品に按分','全額売上原価','全額費用化','製造間接費']},
      {label:'③不利差異（実際>標準）の処理', hint:'不利差異は売上原価を増加・減少？', ans:'増加（加算）', choices:['増加（加算）','減少（減算）','振替','消去']},
      {label:'④有利差異（実際<標準）の処理', hint:'有利差異は売上原価を増加・減少？', ans:'減少（減算）', choices:['減少（減算）','増加（加算）','振替','消去']}
    ]
  },
  {
    id:331,
    level:2,
    cat:'直接原価計算',
    q:'（穴埋め）\n━━ 直接原価計算（変動原価計算）vs 全部原価計算とは ━━\n固定費を「製品原価に含めるか（全部）」「期間費用にするか（直接）」の違い。\n直接原価計算はCVP分析・意思決定に役立つが、外部報告（決算）には使えない。\n━━━━━━━━━━\n\n全部原価計算 → 固定費も製品原価に含める（在庫に固定費が「蓄積」される）\n\n直接原価計算\n→ 製品原価に【①】のみを含める\n→ 【②】は製品原価とせず発生期間の費用として即計上\n\n最大の違いは【③】の扱い\n\n長所：CVP分析・損益分岐点計算・意思決定に役立つ\n短所：外部報告（決算）には使えない（全部原価計算が日本基準で必要）',
    q_en:'(Fill in) Direct (variable) costing includes only [①___] in product cost; [②___] is treated as a period cost, not a product cost. The key difference from absorption costing is the treatment of [③___].',
    a:'① 変動製造原価（変動費）　② 固定製造原価（固定費）　③ 固定製造間接費\n\n【計算過程】\n全部原価計算：製品原価 ＝ 変動費 ＋ 固定費\n直接原価計算：製品原価 ＝ 変動費のみ、固定費は期間費用\n\n▶ ポイント：固定費を「製品原価か期間費用か」という扱いの違いが、両計算法の利益差の原因',
    exp:'直接原価計算は「固定費は製品を作っても作らなくても発生する→製品原価に含めない」という考え方。工場の機械の減価償却費（固定費）は0個作っても1,000個作っても同額かかる→期間費用として発生時に損益計算書へ。変動費（材料・直接労務費）のみを製品原価に含めます。',
    exp_en:'Direct costing: "Fixed costs occur whether you produce or not → don\'t include in product cost." Factory depreciation (fixed) is the same whether you make 0 or 1,000 units → period expense. Only variable costs flow to product cost. This separates "costs that change with volume" from "costs that don\'t."',
    steps:[
      {label:'①直接原価計算の製品原価', hint:'変動製造原価（材料費・変動加工費など生産量に比例するコスト）のみを製品原価とする。工場家賃・固定減価償却費などの固定製造原価は期間費用として売上原価に含めない。CVP分析との整合性が高い', ans:'変動製造原価', choices:['変動製造原価','固定製造原価','製造原価全額','売上原価']},
      {label:'②直接原価計算で期間費用にする', hint:'直接原価計算で製品原価に含めないコスト', ans:'固定製造原価', choices:['固定製造原価','変動製造原価','直接材料費','直接労務費']},
      {label:'③全部原価計算との違い', hint:'両方の計算方式で扱いが異なる費用', ans:'固定製造間接費', choices:['固定製造間接費','変動費全額','直接材料費','直接労務費']}
    ]
  },
  {
    id:332,
    level:2,
    cat:'直接原価計算',
    q:'（穴埋め・計算）直接原価計算による損益計算書：売上高1,000,000円・変動売上原価400,000円・変動販管費100,000円・固定製造原価300,000円・固定販管費100,000円。①変動費合計②限界利益③固定費合計④営業利益を求めよ。',
    q_en:'(Fill in & calculate) Direct costing income statement: sales ¥1,000,000, variable COGS ¥400,000, variable SGA ¥100,000, fixed manufacturing cost ¥300,000, fixed SGA ¥100,000. ①Total variable costs? ②Contribution margin? ③Total fixed costs? ④Operating income?',
    ans_html:`<div class="tbl-sec">答え（直接原価計算P/L）</div><div class="formula-box">売上高　　　　　　　　　　1,000,000<br>変動費（変動売上原価＋変動販管費）△500,000<br>限界利益　　　　　　　　　　500,000<br>固定費（固定製造原価＋固定販管費）△400,000<br>営業利益　　　　　　　　　　100,000</div><table><tbody><tr><td class="hl">①変動費</td><td>400,000＋100,000＝500,000円</td></tr><tr><td class="hl">②限界利益</td><td>1,000,000－500,000＝500,000円</td></tr><tr><td class="hl">③固定費</td><td>300,000＋100,000＝400,000円</td></tr><tr><td class="hl">④営業利益</td><td>500,000－400,000＝100,000円</td></tr></tbody></table>`,
    exp:'直接原価計算のP/Lは「売上高－変動費＝限界利益、限界利益－固定費＝営業利益」という構造。通常のP/Lと違い、費用を変動費と固定費で分けて表示します。「限界利益」（貢献利益）は固定費を回収するための利益で、限界利益率が高いほど固定費を効率的に回収できます。',
    exp_en:'Direct costing P&L: Sales − Variable costs = Contribution margin (CM); CM − Fixed costs = Operating income. Costs are split by behavior (variable vs. fixed), not by function. The contribution margin is "what\'s left to cover fixed costs and profit." Higher CM ratio = more efficient fixed cost coverage.',
    note:'限界利益 = 売上高 − 変動費 / 営業利益 = 限界利益 − 固定費',
    steps:[
      {label:'変動費合計', hint:'変動費合計 = 変動売上原価 ＋ 変動販管費', ans:500000, unit:'円', choices:[500000,400000,600000,450000]},
      {label:'限界利益', hint:'限界利益 = 売上高 − 変動費合計', ans:500000, unit:'円', choices:[500000,600000,400000,100000]},
      {label:'固定費合計', hint:'固定費合計 = 固定製造原価 ＋ 固定販管費', ans:400000, unit:'円', choices:[400000,300000,500000,350000]},
      {label:'営業利益', hint:'営業利益 = 限界利益 − 固定費合計', ans:100000, unit:'円', choices:[100000,500000,200000,50000]},
    ]
  },

    q_en:'(Fill in & calculate, using prior problem data) Sales ¥1,000,000, variable costs ¥500,000, fixed costs ¥400,000. ①Contribution margin ratio? ②Break-even sales? ③Margin of safety ratio?',
    ans_html:`<div class="tbl-sec">答え</div><table><tbody><tr><td class="hl">①限界利益率</td><td>500,000÷1,000,000＝50%</td></tr><tr><td class="hl">②損益分岐点</td><td>固定費400,000÷限界利益率50%＝800,000円</td></tr><tr><td class="hl">③安全余裕率</td><td>(1,000,000－800,000)÷1,000,000×100＝20%</td></tr></tbody></table><div class="formula-box">損益分岐点：売上高×50%＝固定費400,000 → 売上高＝800,000<br>安全余裕率が高い→売上が落ちても赤字になりにくい</div>`,
    exp:'①限界利益率＝限界利益500,000÷売上高1,000,000＝50%（売上が1円増えると限界利益が0.5円増える）②損益分岐点＝固定費400,000÷50%＝800,000円（この売上高なら利益ゼロ）③安全余裕率＝20%（実際売上が20%減っても黒字が維持できる余裕がある）。',
    exp_en:'①CM ratio = ¥500,000 ÷ ¥1,000,000 = 50% (each additional ¥1 of sales contributes ¥0.50 to CM) ②Break-even = ¥400,000 ÷ 50% = ¥800,000 (zero profit) ③Safety margin = 20% (sales can fall 20% before a loss occurs). Higher safety margin = more cushion against revenue decline.',
    note:'限界利益率(CM率) = 限界利益 ÷ 売上高 / BEP = 固定費 ÷ CM率 / 安全余裕率 = (売上高 − BEP) ÷ 売上高',
    steps:[

      {label:'安全余裕率', hint:'安全余裕率 = (売上高 − 損益分岐点) ÷ 売上高 × 100', ans:20, unit:'%', choices:[20,10,30,50]},

    q_en:'(Fill in & calculate) Target profit analysis: fixed costs ¥400,000, CM ratio 50%, target operating income ¥200,000. What sales level achieves the target profit?',

  {
    id:335,
    level:2,
    cat:'直接原価計算',
    q:'（穴埋め）\n━━ 全部原価計算 vs 直接原価計算の利益差異とは ━━\n在庫が増える（生産 ＞ 販売）と、全部原価計算の利益が高くなる。\n固定費が在庫に「蓄積」されるか「全額費用化」されるかの違いによる。\n━━━━━━━━━━\n\n例）製品100個生産・80個販売（在庫20個）・固定製造費100万円\n全部原価計算：固定費100万 → 製品1個10万 → 売上原価80万（80個分）、在庫に20万が残留\n直接原価計算：固定費100万 → 全額その期の費用（在庫に載らない）\n\n利益差異の原因は【①】から生じる\n\n生産量 ＞ 販売量（在庫増加）の場合\n全部原価計算の方が固定費一部が在庫へ → 費用少 → 利益【②】くなる',
    q_en:'(Fill in) Why do absorption costing and direct costing produce different operating income? The difference arises from [①___]. When production > sales (inventory builds up), absorption costing income is [②___] than direct costing income.',
    a:'① 固定製造間接費が期末在庫（製品・仕掛品）に含まれるか否かの違い\n② 高（大き）\n\n【計算過程】\n全部原価計算利益 ＝ 直接原価計算利益 ＋ 期末在庫固定費 − 期首在庫固定費\n\n生産量 ＞ 販売量（在庫増加）：全部原価計算利益 ＞ 直接原価計算利益\n生産量 ＜ 販売量（在庫減少）：全部原価計算利益 ＜ 直接原価計算利益\n\n▶ ポイント：在庫に固定費が「隠れるか否か」が利益差の原因。在庫が増えると全部原価計算の利益が高くなる',
    exp:'利益の差の原因：全部原価計算では固定製造間接費が製品原価に含まれるため、生産したが売れなかった分の固定費が「製品（在庫）」として資産に留まります。一方、直接原価計算では固定費を全額当期費用にするため、在庫増加期は全部原価計算の利益が高くなります（固定費の一部が在庫に繰り越されるため）。',
    exp_en:'Income difference cause: absorption costing includes fixed overhead in product cost — unsold units carry fixed costs as inventory assets. Direct costing expenses all fixed costs in the period. When inventory builds (production > sales): absorption income > direct costing income. The ¥ difference = fixed overhead per unit × change in inventory quantity.',
    steps:[
      {label:'①全部原価計算と直接原価計算の利益差', hint:'期末在庫の固定費が原因の利益の違い', ans:'期末在庫の固定費の差', choices:['期末在庫の固定費の差','変動費の配賦','売上高の違い','期首在庫の変動費']},
      {label:'②在庫が増えたとき利益が大きいのはどちら', hint:'期末在庫>期首在庫のとき固定費を期末在庫に含める方', ans:'全部原価計算', choices:['全部原価計算','直接原価計算','どちらも同じ','判断不可']}
    ]

    exp:'1個の限界利益＝売価1,000－変動費600＝@400円。「1個売るたびに400円ずつ固定費を回収できる」。損益分岐点数量＝固定費480,000÷限界利益@400＝1,200個。「1,200個売れば固定費がちょうど回収できる（利益ゼロ）」。1,200個超えると1個@400円ずつ利益が積み上がります。',

      {label:'損益分岐点売上高', hint:'損益分岐点売上高 = 損益分岐点数量 × 販売単価', ans:1200000, unit:'円', choices:[1200000,1000000,1500000,600000]}

  {
    id:337,
    level:2,
    cat:'直接原価計算',
    q:'（穴埋め）\n━━ 直接原価計算の意思決定への活用とは ━━\n固定費は変わらないため、追加的な意思決定では変動費だけで判断できるというロジック。\n━━━━━━━━━━\n\n① 追加受注の可否判断（余剰能力あり）\n   例）1個の変動費600円・固定費は変わらない\n   → 追加受注単価が【ア】を上回れば受注すべき\n   （固定費は変わらないから考慮不要 →「追加的コスト ＝ 変動費だけ」）\n\n② Make or Buy（製造するか外注するか）\n   → 固定費のうち「外注すれば削減できる部分（回避可能固定費）」か\n     「外注しても変わらない部分（回避不能）」かで判断\n   → 固定費の【イ】を考慮することが重要',
    q_en:'(Fill in) Name two decisions where direct costing is useful. ①Special order acceptance: when spare capacity exists, accept the order if the price exceeds [ア___]. ②Make-or-buy decisions also require careful consideration of [イ___].',
    a:'ア 単位変動費（変動製造原価）\nイ 固定費の可否変動性（回避可能固定費か否か）\n\n【計算過程】\n特別注文の意思決定：単価 ＞ 変動費 → 受注OK（限界利益がプラスなら受注）\n固定費は既に発生済みで変わらない（埋没原価）→ 意思決定では無視してよい\n\n▶ ポイント：追加受注や自製vs外注の判断では「変わるコスト（変動費）だけ」で比較するのが基本',
    exp:'直接原価計算の意思決定への応用：①特別注文（余裕生産能力がある場合）→通常の利益がなくても変動費をカバーできれば受注OK（固定費は変わらないため）。②自製か外注かの判断→外注した場合に本当に固定費が下がるか確認が必要（下がらない固定費は「埋没原価」として意思決定に無関係）。',
    exp_en:'Direct costing for decisions: ①Special order with spare capacity → accept if price > variable cost (fixed costs won\'t change anyway — they\'re sunk). ②Make-or-buy → consider whether outsourcing actually reduces fixed costs. Fixed costs that don\'t change regardless = "sunk costs" → irrelevant to the decision.',
    steps:[
      {label:'ア　特別注文受否の判断基準', hint:'追加変動費だけ見ればよい。固定費は追加注文があってもなくても変わらない（埋没コスト）。追加売価>追加変動費なら限界利益がプラス→受注すべき。この考え方を「差額原価収益分析」という', ans:'単位変動費（変動製造原価）', choices:['単位変動費（変動製造原価）','単位固定費','売上原価全額','販管費']},

  {
    id:338,
    level:2,
    cat:'直接原価計算',
    q:'（穴埋め）\n━━ 直接原価計算の損益計算書の構造とは ━━\n費用を「変動費」と「固定費」に分けて表示するのが直接原価計算P/Lの特徴。\n「売上高 − 変動費 ＝ 限界利益」「限界利益 − 固定費 ＝ 営業利益」の2段構造。\n━━━━━━━━━━\n\n売上高：8,000,000円\n変動売上原価：4,000,000円・変動販管費：800,000円・固定製造費用：2,000,000円・固定販管費：600,000円\n\n① 変動費合計\n   変動売上原価 ＋ 変動販管費 ＝ 【①】円\n\n② 【②】\n   売上高 − 変動費合計\n\n③ 固定費合計\n   固定製造費用 ＋ 固定販管費 ＝ 【③】円\n\n④ 【④】\n   ②限界利益 − ③固定費合計',
    q_en:'(Fill in) Complete the direct costing P&L: Sales ¥8,000,000; variable COGS ¥4,000,000; variable SGA ¥800,000; fixed manufacturing ¥2,000,000; fixed SGA ¥600,000. ①Total variable costs ②Contribution margin ③Total fixed costs ④Operating income',
    a:'① 変動費合計 4,800,000円（4,000,000 ＋ 800,000）\n② 限界利益（貢献利益）\n③ 固定費合計 2,600,000円（2,000,000 ＋ 600,000）\n④ 営業利益\n\n【計算過程】\n売上高 8,000,000 − 変動費 4,800,000 ＝ 限界利益 3,200,000円（CM率40%）\n限界利益 3,200,000 − 固定費 2,600,000 ＝ 営業利益 600,000円\n\n▶ ポイント：直接原価計算P/Lは変動費・固定費を明確に分けることで、CVP分析・損益分岐点計算が容易になる',
    exp:'直接原価計算P/Lの見方：限界利益（3,200,000円）は「売上から変動費を引いた、固定費を回収するための金額」。限界利益率＝3,200,000÷8,000,000＝40%。固定費2,600,000÷CM率40%＝6,500,000円が損益分岐点売上高。実際売上8,000,000との差（1,500,000円）×40%＝600,000円が営業利益。',
    exp_en:'Direct costing P&L: CM (¥3,200,000) = "amount available to cover fixed costs after variable costs." CM ratio = 40%. BEP = ¥2,600,000 ÷ 40% = ¥6,500,000. Gap from BEP = ¥1,500,000 × 40% = ¥600,000 operating income. Every ¥1 of sales above BEP contributes ¥0.40 to profit.',
    note:'変動損益計算書：売上高 − 変動費 = 限界利益 / 限界利益 − 固定費 = 営業利益',
    steps:[
      {label:'変動費合計', hint:'変動費合計 = 変動売上原価 ＋ 変動販管費', ans:4800000, unit:'円', choices:[4800000,3200000,2600000,6000000]},

    exp:'工業簿記のエッセンス：①「作る」プロセスのコストを追跡する→材料費・労務費・経費→製品原価②在庫が3段階（材料→仕掛品→製品）③原価管理のための差異分析（標準原価計算）。商業簿記が「仕入→販売」の2ステップなのに対し、工業簿記は「購入→製造（複数工程）→完成→販売」の多段階プロセスを記録します。',

    q:'（穴埋め）\n━━ 製造原価報告書の構造とは ━━\n「モノを作るのにいくらかかったか」をまとめた表。\n公式：当期製品製造原価 ＝ 当月製造費用 ＋ 月初仕掛品 − 月末仕掛品\n━━━━━━━━━━\n\n当月製造費用：材料費 [①]、労務費 600,000円、経費 200,000円\n月初仕掛品：300,000円、月末仕掛品：[②]円\n当期製品製造原価：1,900,000円\n\n① 材料費を逆算する\n   ＝ 1,900,000 ＋ [②] − 300,000 − 600,000 − 200,000\n\n② 月末仕掛品を逆算する\n   ＝ 当月製造費用合計 ＋ 300,000 − 1,900,000',
    q_en:'(Fill-in) Complete the Cost of Goods Manufactured statement.\nCurrent month costs: Materials [①], Labor 600,000, Overhead 200,000.\nBeginning WIP 300,000, Ending WIP [②].\nCost of Goods Manufactured 1,900,000.',

    q:'（穴埋め）\n━━ 高低点法とは ━━\n費用を「固定費」と「変動費」に分解する方法。\n最も操業度が高い月と低い月の2点だけで計算するシンプルな方法。\n━━━━━━━━━━\n\n電力費（混合費）を固定費と変動費に分解する\n最高操業度：4,000時間 / 費用 320,000円\n最低操業度：1,000時間 / 費用 140,000円\n\n① 変動費率の計算\n   変動費率 ＝ （費用の差） ÷ （操業度の差）\n   ＝ （320,000 − 140,000） ÷ （4,000 − 1,000）\n   ＝ 【①】円/時間\n\n② 固定費の計算\n   固定費 ＝ 最高月の費用 − 変動費率 × 最高月の操業度\n   ＝ 320,000 − 【①】 × 4,000\n   ＝ 【②】円',
    q_en:'(Fill-in) Use the high-low method to separate mixed electricity cost.\nHigh: 4,000 hrs / ¥320,000. Low: 1,000 hrs / ¥140,000.\nVariable rate [①] yen/hr, Fixed cost [②] yen.',
    a:'① 60円/時間　② 80,000円\n\n【計算過程】\n変動費率 ＝ (320,000 − 140,000) ÷ (4,000 − 1,000) ＝ 180,000 ÷ 3,000 ＝ 60円/時間\n固定費 ＝ 320,000 − 60 × 4,000 ＝ 320,000 − 240,000 ＝ 80,000円\n\n▶ ポイント：高低点法は「2点を結んだ直線の傾きが変動費率、y切片が固定費」と考える',
    exp:'高低点法は「一番多い月」と「一番少ない月」の2点だけで費用を分解する方法です。\n変動費率 ＝ 費用の差 ÷ 操業度の差（傾き）\n固定費 ＝ どちらかの月の費用 − 変動費率 × その月の操業度（切片）\nグラフでいうと2点を結んだ直線の「傾き」が変動費率、「y切片」が固定費です。',

    q:'（穴埋め）\n━━ 直接原価計算の目標利益達成とは ━━\n「目標利益を達成するために何個売ればよいか」をCVP分析で計算する方法。\n公式：必要販売量 ＝ （固定費 ＋ 目標利益）÷ 1個あたり限界利益\n━━━━━━━━━━\n\n販売価格1個2,000円、変動費1,200円、固定費480,000円\n\n① 目標営業利益240,000円を達成するための必要販売量\n   1個あたり限界利益 ＝ 2,000 − 1,200 ＝ 800円\n   必要販売量 ＝ （480,000 ＋ 240,000）÷ 800 ＝ 【①】個\n\n② 現在の販売量が900個のときの安全余裕率\n   損益分岐点販売量 ＝ 480,000 ÷ 800 ＝ 600個\n   安全余裕率 ＝ （900 − 600）÷ 900 × 100 ＝ 【②】％',

    a:'① 900個　② 33.3%\n\n【計算過程】\n1個あたり限界利益 ＝ 2,000 − 1,200 ＝ 800円\n必要販売量 ＝ (480,000 ＋ 240,000) ÷ 800 ＝ 720,000 ÷ 800 ＝ 900個\n損益分岐点販売量 ＝ 480,000 ÷ 800 ＝ 600個\n安全余裕率 ＝ (900 − 600) ÷ 900 × 100 ＝ 33.3%\n\n▶ ポイント：目標利益達成には「（固定費＋目標利益）÷限界利益」で必要販売量を求める',
    exp:'目標利益達成の公式：必要販売量 ＝ (固定費 ＋ 目標利益) ÷ 1個あたり貢献利益\n安全余裕率：実際販売量が損益分岐点からどれだけ余裕があるかを示すパーセント。\n　安全余裕率 ＝ (実際販売量 − BEP販売量) ÷ 実際販売量 × 100\n安全余裕率が高いほど「ちょっと売上が落ちても赤字にならない」ということです。',
    exp_en:'Target profit formula: Required units = (Fixed costs + Target profit) ÷ Unit contribution margin.\nSafety margin ratio shows how far actual sales are above break-even.\nSafety margin = (Actual − BEP) ÷ Actual × 100.\nHigher safety margin = more cushion before losses occur.',
    steps:[

    ans_html:`<div class="tbl-sec">

    exp:'製造間接費差異の2分法は「使いすぎ」と「稼働不足」の2種類に分けます。\n\n【予算差異】実際にかかった費用と「その操業度なら予算でいくら？」の差。\n　予算差異＝予算許容額 − 実際発生額。プラスなら有利（節約できた！）。\n\n【操業度差異】固定費を「どれだけ活用できたか」を示す差異。\n　操業度差異＝標準配賦額 − 予算許容額。\n　機械が動かなければ固定費は無駄になる → 不利差異になりやすい。\n\n【イメージ】工場の電気代が固定で月6万円かかる。フル稼働なら6万円÷500時間＝120円/時間で吸収できる。でも480時間しか使わなかったら→ (500-480)×120＝2,400円分吸収できなかった！',

  {
    id:348,
    level:2,
    cat:'標準原価計算',
    q:'（穴埋め）\n━━ 製造間接費の3分法とは ━━\n差異を「予算差異」「能率差異」「操業度差異」の3つに分解する方法。\n3分法では「実際操業度」と「実際直接作業時間」の2つの基準点を使う。\n━━━━━━━━━━\n\n標準配賦率：200円/時間（固定費率120円/時間、変動費率80円/時間）\n標準操業度：500時間、実際操業度：480時間、実際直接作業時間：490時間\n固定費予算：60,000円、実際発生額：108,000円\n\n① 予算差異\n   予算許容額（実際操業度）＝ 60,000 ＋ 80 × 480 ＝ 98,400円\n   予算差異 ＝ 98,400 − 108,000 ＝ 【①】円（有利/不利）\n\n② 能率差異\n   予算許容額（標準DLH）＝ 60,000 ＋ 80 × 490 ＝ 99,200円\n   能率差異 ＝ 99,200 − 98,400 ＝ 【②】円（有利/不利）\n\n③ 操業度差異\n   標準配賦額 ＝ 200 × 500 ＝ 100,000円\n   操業度差異 ＝ 100,000 − 99,200 ＝ 【③】円（有利/不利）',
    q_en:'(Fill-in) 3-way overhead variance.\nStandard rate: ¥200/hr (fixed ¥120, variable ¥80). Standard hrs: 500, Actual capacity: 480, Actual direct labor: 490. Fixed budget: ¥60,000, Actual overhead: ¥108,000.',
    a:'① △9,600円（不利）　② 800円（有利）　③ 800円（有利）\n\n【計算過程】\n予算許容額（実際操業度）＝ 60,000 ＋ 80 × 480 ＝ 98,400円\n予算許容額（標準DLH）＝ 60,000 ＋ 80 × 490 ＝ 99,200円\n標準配賦額 ＝ 200 × 500 ＝ 100,000円\n\n予算差異 ＝ 98,400 − 108,000 ＝ △9,600円（不利）\n能率差異 ＝ 99,200 − 98,400 ＝ 800円（有利）\n操業度差異 ＝ 100,000 − 99,200 ＝ 800円（有利）\n合計差異 ＝ △9,600 ＋ 800 ＋ 800 ＝ △8,000円（不利）\n\n▶ ポイント：3分法は「使いすぎ（予算差異）」「作業効率（能率差異）」「稼働率（操業度差異）」の3つの原因に分けて改善策を明確にする',
    exp:'3分法は「なぜ差異が生まれたか」を3段階で分析します。\n\n【予算差異】実際操業度での予算と実際費用の差。「使いすぎ？節約？」\n【能率差異】標準時間と実際時間の差 × 変動費率。「作業が速かった？遅かった？」\n【操業度差異】固定費の吸収不足。「工場の設備をフル活用できたか？」\n\n3分法では「実際操業度」と「実際直接作業時間（標準操業度）」の2つの基準点を使うのがポイント。\n能率差異は「直接作業の効率」を純粋に測るために分離されます。',
    exp_en:'3-way analysis separates efficiency from capacity utilization.\nBudget variance: actual cost vs. flexible budget at actual capacity.\nEfficiency variance: standard vs. actual direct labor hours × variable rate.\nVolume variance: fixed overhead over/underabsorption from capacity.\nKey: uses two reference points — actual capacity and actual direct labor hours.',
    note:'3分法の3点：\n① 予算差異 ＝ 予算許容額(実際操業度) − 実際発生額\n② 能率差異 ＝ 予算許容額(標準DLH) − 予算許容額(実際操業度)\n③ 操業度差異 ＝ 標準配賦額 − 予算許容額(標準DLH)',
    steps:[
      {label:'①予算差異', hint:'予算差異 = 予算許容額(実際操業度) − 実際発生額', ans:-9600, unit:'円', choices:[-9600,9600,-17600,800]},
      {label:'②能率差異', hint:'変動費能率差異 = 予算許容額(標準操業度) − 予算許容額(実際操業度)', ans:800, unit:'円', choices:[800,-800,-9600,1600]},
      {label:'③操業度差異', hint:'固定費能率差異 = 標準配賦額(標準操業度) − 予算許容額(標準操業度)', ans:800, unit:'円', choices:[800,-800,9600,-17600]}

    q:'（穴埋め）\n━━ 製造間接費の4分法とは ━━\n3分法の「能率差異」をさらに「変動費部分」と「固定費部分」に分解する方法。\n4つの差異：予算差異 ＋ 変動費能率差異 ＋ 固定費能率差異 ＋ 操業度差異\n━━━━━━━━━━\n\n変動費率80円/時間、固定費率120円/時間\n実際操業度：480時間、実際直接作業時間（標準操業度）：490時間\n\n① 変動費能率差異\n   （標準DLH − 実際操業度）× 変動費率\n   ＝ （490 − 480）× 80 ＝ 【①】円（有利/不利）\n\n② 固定費能率差異\n   （標準DLH − 実際操業度）× 固定費率\n   ＝ （490 − 480）× 120 ＝ 【②】円（有利/不利）',
    q_en:'(Fill-in) 4-way overhead variance: split the efficiency variance into variable and fixed parts.\nVariable rate ¥80/hr, Fixed rate ¥120/hr. Actual capacity: 480hrs, Standard DLH: 490hrs.',
    a:'① 800円（有利）　② 1,200円（有利）\n\n【計算過程】\n変動費能率差異 ＝ (490 − 480) × 80 ＝ 800円（有利）\n固定費能率差異 ＝ (490 − 480) × 120 ＝ 1,200円（有利）\n能率差異合計 ＝ 800 ＋ 1,200 ＝ 2,000円（有利）\n\n▶ ポイント：4分法は3分法の能率差異を変動費・固定費に分けたもの。作業時間の節約が変動費・固定費の両方の節約につながる',
    exp:'4分法は3分法をさらに一歩細かく分析する方法です。\n\n3分法の「能率差異」は「作業が速かったおかげで、変動費も固定費も節約できた」という2つの効果が混ざっています。\nこれを変動費部分と固定費部分に分けたのが4分法です。\n\n【変動費能率差異】作業時間が短縮した分の変動費節約額\n　（標準DLH − 実際操業度）× 変動費率\n\n【固定費能率差異】作業時間が短縮した分の固定費の追加吸収\n　（標準DLH − 実際操業度）× 固定費率\n\n2級試験では2分法・3分法が主流ですが、4分法も出題されます。まず2分法→3分法→4分法の順に理解すると迷わない。',
    exp_en:'4-way analysis further splits the efficiency variance by cost type.\nVariable efficiency: time saved × variable rate.\nFixed efficiency: time saved × fixed rate.\nThe 4 variances: budget + variable efficiency + fixed efficiency + volume.',
    note:'4分法：予算差異・変動費能率差異・固定費能率差異・操業度差異の4つに分析\n変動費能率差異 ＝ (標準DLH − 実際操業度) × 変動費率\n固定費能率差異 ＝ (標準DLH − 実際操業度) × 固定費率',

    q:'（穴埋め）\n━━ 直接材料費差異の分析とは ━━\n材料費のズレを「単価のズレ（価格差異）」と「使用量のズレ（数量差異）」に分解して原因を特定する。\n━━━━━━━━━━\n\n標準：500円/kg × 3kg ＝ 1,500円/個　当月生産量：400個\n実際：520円/kg × 1,280kg（実際消費量）\n\n① 価格差異（購入単価のズレ）\n   ＝ （標準単価 − 実際単価）× 実際消費量\n   ＝ （500 − 520）× 1,280 ＝ 【①】円（有利/不利）\n\n② 数量差異（使用量のズレ）\n   標準消費量 ＝ 3kg × 400個 ＝ 1,200kg\n   ＝ （標準消費量 − 実際消費量）× 標準単価\n   ＝ （1,200 − 1,280）× 500 ＝ 【②】円（有利/不利）',

    a:'① △25,600円（不利）　② △40,000円（不利）\n\n【計算過程】\n標準消費量 ＝ 3kg × 400個 ＝ 1,200kg\n価格差異 ＝ (500 − 520) × 1,280 ＝ △25,600円（不利）\n数量差異 ＝ (1,200 − 1,280) × 500 ＝ △40,000円（不利）\n合計差異 ＝ △65,600円（不利）\n検算：標準原価 600,000 − 実際原価 665,600 ＝ △65,600（不利）✓\n\n▶ ポイント：価格差異は「購買部門の責任（仕入単価）」、数量差異は「製造現場の責任（使いすぎ）」で管理責任が異なる',

    q:'（穴埋め）\n━━ 直接労務費差異の分析とは ━━\n労務費のズレを「時給のズレ（賃率差異）」と「作業時間のズレ（時間差異）」に分解して原因を特定する。\n━━━━━━━━━━\n\n標準：1,000円/時間 × 2時間 ＝ 2,000円/個　当月生産量：400個\n実際賃率：1,050円/時間、実際作業時間：780時間\n\n① 賃率差異（時給のズレ）\n   ＝ （標準賃率 − 実際賃率）× 実際作業時間\n   ＝ （1,000 − 1,050）× 780 ＝ 【①】円（有利/不利）\n\n② 時間差異（作業時間のズレ）\n   標準作業時間 ＝ 2時間 × 400個 ＝ 800時間\n   ＝ （標準作業時間 − 実際作業時間）× 標準賃率\n   ＝ （800 − 780）× 1,000 ＝ 【②】円（有利/不利）',

    q:'（穴埋め）\n━━ 工程別総合原価計算とは ━━\n複数の製造工程を経て製品を作る場合、各工程ごとに原価を集計する方法。\n前工程から受け取ったコスト（前工程費）は「始点で100%投入」として計算する。\n━━━━━━━━━━\n\n第1工程完成品原価：500,000円（600個）\n第2工程：前工程費 500,000円、加工費 300,000円\n完成品 500個、月末仕掛品 100個（加工進捗度50%）\n\n① 前工程費換算量\n   ＝ 完成品500 ＋ 月末仕掛品100（始点100%）＝ 600個\n   前工程費単価 ＝ 500,000 ÷ 600 ＝ 833.3円\n\n② 加工費換算量\n   ＝ 完成品500 ＋ 月末仕掛品100 × 50% ＝ 550個\n   加工費単価 ＝ 300,000 ÷ 550 ＝ 545.5円\n\n第2工程完成品原価\n   ＝ 833.3 × 500 ＋ 545.5 × 500 ＝ 【①】円',

    q:'（穴埋め）\n━━ 等級別総合原価計算とは ━━\n同じ製造工程で大きさ・品質が異なる製品を作る場合、「等価係数」で原価を按分する方法。\n個数 × 等価係数 ＝ 積数（重み付き個数）で比率を決める。\n━━━━━━━━━━\n\nA製品（等価係数1.0）500個、B製品（等価係数1.5）300個\n総合原価 320,000円\n\n① A製品の積数 ＝ 500 × 1.0 ＝ 500\n② B製品の積数 ＝ 300 × 1.5 ＝ 450\n③ 積数合計 ＝ 500 ＋ 450 ＝ 950\n\n④ A製品完成品原価\n   ＝ 320,000 × 500 ÷ 950 ＝ 【①】円\n\n⑤ B製品完成品原価\n   ＝ 320,000 × 450 ÷ 950 ＝ 【②】円',

    exp:'等級別総合原価計算は「同じ工程で大きさや品質が違う製品を作る」場合の方法です。\n\n【イメージ】同じ生地からLサイズとMサイズのTシャツを作る工場。Lサイズは布を多く使うので、原価も多くなる。\n\n等価係数は「どれだけコストが多くかかるか」の重みです。\n例：B製品はA製品の1.5倍のコストがかかる → 等価係数1.5\n\n【計算手順】\n① 個数 × 等価係数 ＝ 積数（重み付き個数）\n② 積数の比率で総合原価を按分\n\n【組別】は製品種類が全く異なる場合（個別に費用を集計）、【等級別】は規格が違うだけの場合（積数で按分）。',

    level:2,
    cat:'キャッシュフロー計算書',
    q:'（穴埋め）\n━━ 間接法による営業活動CFとは ━━\n「利益（損益計算書）」から出発して、現金のズレを調整することで実際の現金収支を求める方法。\n資産が増えると現金が減り（マイナス）、負債が増えると現金が増える（プラス）。\n━━━━━━━━━━\n\n税引前当期純利益：500,000円\n減価償却費：80,000円（→ 加算：現金が出ていない費用）\n\n① 売上債権の増加：30,000円\n   → 【①】算（売上は計上したが現金未回収）\n\n② 棚卸資産の減少：20,000円\n   → 【②】算（在庫が減った ＝ 現金が入った）\n\n③ 仕入債務の増加：40,000円\n   → 【③】算（仕入れたが未払い ＝ 現金未出）\n\n④ 営業活動CF ＝ 500,000 ＋ 80,000 − 30,000 ＋ 20,000 ＋ 40,000 ＝ 【④】円',
    q_en:'(Fill-in) Indirect method operating CF.\nNet income before tax: ¥500,000. Depreciation: ¥80,000. Receivables increase: ¥30,000 ([①]). Inventory decrease: ¥20,000 ([②]). Payables increase: ¥40,000 ([③]). Operating CF = [④].',
    a:'① 減　② 加　③ 加　④ 610,000円\n\n【計算過程】\n税引前当期純利益　　500,000円\n＋ 減価償却費　　　 ＋80,000円（非現金費用）\n− 売上債権の増加　 △30,000円（現金未回収）\n＋ 棚卸資産の減少　 ＋20,000円（在庫売れて現金入）\n＋ 仕入債務の増加　 ＋40,000円（未払いで現金未出）\n＝ 営業活動CF　　　610,000円\n\n▶ ポイント：「資産増 → マイナス」「資産減 → プラス」「負債増 → プラス」「負債減 → マイナス」のルールで符号を決める',
    exp:'間接法は「利益（損益計算書）から始めて、現金の動きに直す」方法です。\n\n【なぜ修正が必要か？】\n利益＝売上−費用ですが、売掛金（まだ現金になっていない売上）が含まれます。\n現金ベースに修正するために調整項目を加減します。\n\n【加減のルール】\n・減価償却費→加算（費用として引いたけど現金は出ていない）\n・売上債権増加→減算（売上計上したが現金未回収）\n・棚卸資産減少→加算（在庫を売って現金が入ったのに費用で控除済み）\n・仕入債務増加→加算（仕入れたが代金未払い＝現金が出ていない）\n\n【覚え方】「資産増加→マイナス、資産減少→プラス、負債増加→プラス、負債減少→マイナス」',
    exp_en:'Indirect method: start with net income, adjust to cash basis.\nAdd back: non-cash expenses (depreciation), decreases in assets, increases in liabilities.\nSubtract: increases in assets (cash not yet received), decreases in liabilities (cash paid).\nMemory trick: asset↑ = subtract, liability↑ = add.',
    note:'間接法の調整ルール：\n減価償却費 → ＋（非現金費用）\n売上債権増加 → −（現金未回収）\n棚卸資産増加 → −、減少 → ＋\n仕入債務増加 → ＋（現金未払い）',
    steps:[
      {label:'①売上債権増加の調整', hint:'売上1,000万円だが現金回収800万円→未回収200万円は売上債権増加→営業CFを「−200万円」調整。現金が入っていない分を利益から引く。逆に売上債権が減れば回収が進んでいるのでプラス調整', ans:'減算（−）', choices:['減算（−）','加算（＋）','そのまま','対象外']},
      {label:'②棚卸資産減少の調整', hint:'在庫減少→現金を受取→加算か減算か', ans:'加算（＋）', choices:['加算（＋）','減算（−）','そのまま','対象外']},
      {label:'③仕入債務増加の調整', hint:'仕入未払い→現金不出→加算か減算か', ans:'加算（＋）', choices:['加算（＋）','減算（−）','そのまま','対象外']},
      {label:'営業活動CF', hint:'営業CF(間接法) = 税引前利益 ＋ 非現金費用加減 ＋/− 資産・負債の増減', ans:610000, unit:'円', choices:[610000,590000,630000,580000]}
    ]
  },
  {
    id:363,
    level:2,
    cat:'キャッシュフロー計算書',
    q:'（穴埋め）\n━━ CF計算書の投資・財務活動区分とは ━━\n投資活動 ＝ 設備・有価証券の売買（購入はマイナス、売却はプラス）\n財務活動 ＝ 銀行・株主との資金授受（借入・株式発行はプラス、返済・配当はマイナス）\n━━━━━━━━━━\n\n① 建物を 3,000,000円で購入した\n   → 【①】活動CF（【②】算）\n\n② 借入金 1,000,000円を調達した\n   → 【③】活動CF（【④】算）\n\n③ 配当金 200,000円を支払った\n   → 【⑤】活動CF（【⑥】算）',
    q_en:'(Fill-in) Classify cash flows.\nBuilding purchased ¥3,000,000 → [①] CF ([②]). Borrowed ¥1,000,000 → [③] CF ([④]). Dividend paid ¥200,000 → [⑤] CF ([⑥]).',
    a:'① 投資　② 減　③ 財務　④ 加　⑤ 財務　⑥ 減\n\n【計算過程】\n建物購入 → 投資活動CF　△3,000,000円（現金流出）\n借入金調達 → 財務活動CF　＋1,000,000円（現金流入）\n配当支払 → 財務活動CF　△200,000円（現金流出）\n\n▶ ポイント：設備（固定資産）の売買は「投資活動」、銀行・株主との資金授受は「財務活動」。配当の支払いは財務活動の一択',
    exp:'投資活動と財務活動の分類をしっかり覚えましょう。\n\n【投資活動CF】設備や有価証券への投資・回収\n　購入→現金が出る→マイナス\n　売却・回収→現金が入る→プラス\n\n【財務活動CF】お金の調達と返還（株主・債権者との取引）\n　借入・株式発行→現金が入る→プラス\n　返済・配当支払→現金が出る→マイナス\n\n【覚え方】\n投資＝「設備を買う・売る」「株や債券を買う・売る」\n財務＝「銀行から借りる」「株主に配当を払う」「借金を返す」\n\n配当の支払いは財務活動ですが、利息の支払い・受取は営業活動になることも（企業の方針による）。',
    exp_en:'Investing CF: purchase/sale of long-term assets and investments.\n  Purchase = cash outflow (−). Sale = cash inflow (+).\nFinancing CF: transactions with capital providers.\n  Borrowing, stock issuance = inflow (+).\n  Repayment, dividends paid = outflow (−).',
    note:'投資CF：設備/有価証券の売買（購入−、売却+）\n財務CF：借入+、返済−、配当支払−、株式発行+\n利息・配当の受取・支払は企業方針によって営業/投資/財務が変わる',
    steps:[
      {label:'①建物購入のCF区分', hint:'設備（固定資産）の購入は「投資活動」のCFでマイナス計上。成長中の企業は設備投資が多く投資CFが大きくマイナスになる傾向。「フリーCF＝営業CF＋投資CF」でプラスなら余剰資金あり', ans:'投資活動（−）', choices:['投資活動（−）','営業活動（−）','財務活動（−）','投資活動（＋）']},
      {label:'③借入のCF区分', hint:'借入は営業・投資・財務のどれ', ans:'財務活動（＋）', choices:['財務活動（＋）','営業活動（＋）','投資活動（＋）','財務活動（−）']},
      {label:'⑤配当支払のCF区分', hint:'配当支払は営業・投資・財務のどれ', ans:'財務活動（−）', choices:['財務活動（−）','営業活動（−）','投資活動（−）','財務活動（＋）']}
    ]
  },
  {
    id:364,
    level:2,
    cat:'キャッシュフロー計算書',
    q:'間接法（利益から出発して現金の動きに直す方法）のキャッシュフロー計算書において、減価償却費を「加算」する理由を説明し、以下を計算せよ。\n税引前利益：200,000円、減価償却費：50,000円、他の調整なし。\n営業活動CF：[①] 円。',
    q_en:'Why is depreciation added back in indirect method CF? Calculate:\nNet income before tax ¥200,000, Depreciation ¥50,000, no other adjustments.\nOperating CF = [①].',
    ans_html:`<div class="tbl-sec">
<p><b>理由</b>：減価償却費は損益計算書で費用として計上されるが、現金の支出は伴わない（非現金費用）。
利益を計算するとき減価償却費で減らされているので、現金ベースに戻すために加算する。</p>
<table><tr><th>項目</th><th>金額</th></tr>
<tr><td>税引前利益</td><td>200,000</td></tr>
<tr><td>減価償却費（加算）</td><td>＋50,000</td></tr>
<tr><td>① 営業活動CF</td><td><b>250,000円</b></td></tr>
</table>
</div>`,
    exp:'「減価償却費は現金が出ない」のに費用として引かれています。だから加算して元に戻す！\n\n【イメージ】\n機械を1,000万円で買った（現金は買った時点で出る）\n毎年200万円ずつ減価償却費として費用計上\n→ この毎年200万円の費用は現金の支出ではない（現金はもう出ている）\n\n間接法では利益から出発するので、非現金費用である減価償却費は「引きすぎた費用を戻す」ために加算します。\n\n【加算する非現金項目の例】\n・減価償却費\n・のれん償却費\n・引当金の繰入額（引当金増加額）',
    exp_en:'Depreciation is a non-cash expense — it reduces profit but not cash.\nIn indirect method, we start from net income (which was reduced by depreciation).\nAdding depreciation back restores it to a cash basis.',
    note:'非現金費用（減価償却費・のれん償却等）→ すべて加算\n引当金増加 → 加算（現金不出）\n引当金減少 → 減算（現金流出）',
    steps:[
      {label:'営業活動CF', hint:'小計（間接法）= 税引前利益 ＋ 減価償却費（加算）＋ その他調整', ans:250000, unit:'円', choices:[250000,200000,300000,150000]}
    ]
  },
  {
    id:365,
    level:2,
    cat:'キャッシュフロー計算書',
    q:'（穴埋め）\n━━ 固定資産売却のCF処理とは ━━\n固定資産の売却益は「損益計算書の利益」に含まれるが、現金は「投資活動CF」に計上する。\n二重計上を防ぐため、営業CFで売却益を除いて、投資CFで売却全額を計上する。\n━━━━━━━━━━\n\n帳簿価額 800,000円の設備を 1,000,000円で売却（売却益 200,000円）\n\n① 間接法の営業CFでは「固定資産売却益」を\n   → 【①】算する（理由：売却益は投資CFで処理するため）\n\n② 投資活動CFに「設備の売却」として\n   → 【②】円を計上する（実際の現金受取額）',
    q_en:'(Fill-in) CF treatment when a fixed asset is sold.\nBook value ¥800,000, sold for ¥1,000,000 (gain on sale ¥200,000).\n① In operating CF: the gain is [①]-adjusted. ② In investing CF: record [②].',
    a:'① 減　② 1,000,000円\n\n【計算過程】\n間接法では利益200,000（売却益含む）から出発\n→ 営業CFで売却益△200,000（減算）：営業CFから除去\n→ 投資CFで売却収入＋1,000,000（加算）：実際の現金受取額を計上\n二重計上チェック：営業CFで200,000引いて、投資CFで1,000,000加える ＝ 純増800,000（帳簿価額分）\n\n▶ ポイント：売却益は「営業CFから除いて投資CFへ移す」。計上するのは売却益ではなく実際の受取額全額',
    exp:'固定資産の売却は「投資活動CF」に分類されます。しかし売却益は損益計算書で利益に含まれています。\n\n【問題の構造】\n間接法では「税引前利益（売却益200,000が含まれる）」から出発している。\nでも売却による現金1,000,000は投資活動CFに計上する。\n\n【解決策】\n① 営業CFで売却益200,000を「減算」（重複を除く）\n② 投資CFで売却額全額1,000,000を「加算」\n\n→ これで現金1,000,000は正しく投資CFに計上され、利益ベースの200,000は営業CFから除かれる。\n\n【覚え方】利益に含まれている「他の区分の収益」は営業CFで引いて、その区分のCFで全額計上。',
    exp_en:'Gain on sale is in income (operating profit) but the cash belongs in investing CF.\nStep 1: Deduct gain from operating CF (remove it from income-based calculation).\nStep 2: Add full sale proceeds to investing CF.\nThis prevents double-counting.',
    note:'固定資産売却：\n営業CF → 売却益を減算、売却損を加算\n投資CF → 売却収入の全額を加算\n（二重計上防止のため）',
    steps:[
      {label:'①間接法での固定資産売却益の調整', hint:'売却益（収益）は投資CFに計上するため、営業CFから除外（マイナス）', ans:'減算（−200,000）', choices:['減算（−200,000）','加算（＋200,000）','そのまま','対象外']},
      {label:'②投資活動CFの計上額', hint:'実際の現金受取額を投資活動CFに計上', ans:1000000, unit:'円（加算）', choices:[1000000,200000,800000,1200000]}
    ]

  {
    id:366,

    cat:'キャッシュフロー計算書',
    q:'（穴埋め）\n━━ フリーキャッシュフロー（FCF）とは ━━\n「本業で稼いだお金から設備投資を差し引いた、自由に使えるお金」のこと。\nFCF ＝ 営業活動CF ＋ 投資活動CF\n━━━━━━━━━━\n\n営業活動CF：800,000円\n投資活動CF：△500,000円\n\n① FCF ＝ 800,000 ＋ （△500,000）＝ 【①】円\n\n② FCFが正（プラス）の場合、企業はどのような状態か？\n   → 【②】',
    q_en:'(Fill-in) Free Cash Flow. Operating CF: ¥800,000. Investing CF: △¥500,000.\nFCF = [①]. What does positive FCF indicate? [②].',
    a:'① 300,000円　② 本業の稼ぎが設備投資を上回り、借入返済・配当・成長投資に自由に使える現金がある状態\n\n【計算過程】\nFCF ＝ 営業活動CF ＋ 投資活動CF\n    ＝ 800,000 ＋ (△500,000)\n    ＝ 300,000円\n\n▶ ポイント：FCFがプラス ＝「稼いで余る」健全な状態。FCFがマイナス ＝ 設備投資のために外部資金が必要な状態',
    exp:'フリーキャッシュフロー（FCF）は「企業が自由に使えるお金」です。\n\nFCF ＝ 営業CF（本業で稼いだ現金）＋ 投資CF（設備に使った現金）\n\n【イメージ】\n月収50万円（営業CF）、家賃・光熱費20万円（投資CF）→ 自由に使えるお金30万円（FCF）\n\nFCFがプラス → 「本業の稼ぎで設備投資をまかなって、まだお金が余る！」\nFCFがマイナス → 「設備投資のために借金が必要な状態」\n\n企業価値評価（DCF法）でも使われる重要な指標です。\n高い FCF ＝ 配当増額・自社株買い・新規投資の原資になる。',
    exp_en:'Free Cash Flow = Operating CF + Investing CF.\nPositive FCF: the business generates more cash than it spends on investments.\nThis cash is "free" to return to shareholders, pay debt, or fund new growth.\nFCF is a key metric in company valuation.',
    note:'FCF ＝ 営業CF ＋ 投資CF\nプラス → 自由資金あり（借金返済・配当・成長投資に使える）\nマイナス → 本業の稼ぎだけでは投資をまかなえない',
    steps:[

    ]

  {
    id:367,
    level:2,
    cat:'キャッシュフロー計算書',
    q:'（穴埋め）\n━━ 損益計算書とCF計算書の比較とは ━━\n「利益」と「現金の動き」は別物。売掛金・未払金・減価償却費があるとズレが生じる。\n利益が出ていても現金がなければ倒産する（黒字倒産）。\n━━━━━━━━━━\n\n売上 1,000,000円（うち未回収 200,000円）\n費用 700,000円（うち未払い 100,000円）\n減価償却費 50,000円（非現金費用）\n\n① 損益計算書上の利益\n   ＝ 1,000,000 − 700,000 ＝ 【①】円\n\n② 営業活動CF（間接法）\n   ＝ 利益① − 売上債権増200,000 ＋ 仕入債務増100,000 ＋ 減価償却費50,000\n   ＝ 【②】円',
    q_en:'(Fill-in) P&L vs. CF comparison.\nSales ¥1,000,000 (¥200,000 uncollected). Expenses ¥700,000 (¥100,000 unpaid). Depreciation ¥50,000.\nIncome statement profit: [①]. Operating CF: [②].',
    a:'① 300,000円　② 250,000円\n\n【計算過程】\n損益計算書の利益 ＝ 1,000,000 − 700,000 ＝ 300,000円\n\n営業活動CF（間接法）\n＝ 利益300,000\n− 売上債権増200,000（現金未回収）\n＋ 仕入債務増100,000（現金未払い）\n＋ 減価償却費50,000（非現金費用）\n＝ 250,000円\n\n▶ ポイント：利益300,000 ≠ 現金250,000。この差50,000は「売掛金が増えた（現金未回収）が、減価償却費が戻った」ことで生じる',
    exp:'同じ会社の同じ期間の数字なのに、利益とCFが違う！これが会計の面白いところです。\n\n【利益とCFの差が生まれる原因】\n① 現金化されていない売上（売掛金）→ 利益には入るがCFには入らない\n② 現金が出ていない費用（減価償却費）→ 利益では引かれるがCFは引かない\n③ 現金が出ていない費用（買掛金）→ 利益では引かれるがCFは引かない\n\n【黒字倒産とは？】\n利益は出ているのに現金がない → 売掛金が多すぎて手元現金が枯渇 → 支払いできずに倒産\nCF計算書があれば早期にこのリスクを察知できます！',
    exp_en:'Same company, same period, but profit ≠ cash flow.\nDifferences arise from: uncollected receivables, unpaid payables, non-cash expenses.\nCF statement reveals cash reality behind accounting profit.\n"Cash is king" — a profitable company can still go bankrupt if cash runs out.',
    note:'利益とCFの差の主な原因：\n① 売上債権（未回収）→ CF減\n② 仕入債務（未払い）→ CF増\n③ 減価償却費（非現金）→ CF増\n黒字倒産はCF計算書で早期発見できる',

    a:'① 主要な営業取引（売上入金・仕入支払など）　② 税引前当期純利益　③ 間接　④ 直接（列挙）\n\n【計算過程】\n直接法：商品販売収入・仕入支払・人件費支払など個別に列挙（わかりやすいが手間）\n間接法：利益から出発して調整（既存財務諸表から作成しやすい → 実務主流）\n投資CF・財務CF：どちらの方法でも個別取引を直接列挙して表示\n\n▶ ポイント：試験は間接法の計算問題が圧倒的多数。投資・財務CFは方法に関わらず直接列挙という点も頻出',

    q_en:'(Fill-in) CF pattern analysis.\nPattern A: Operating(+), Investing(−), Financing(−). Pattern B: Operating(−), Investing(−), Financing(+).\nA = [①] type company. B = [②] type company.',
    a:'① 優良・成熟型　② 成長型\n\n【計算過程】\nパターンA：営業+（本業で稼ぐ）、投資−（設備投資）、財務−（借金返済・配当）→ 最も理想的な健全企業\nパターンB：営業−（本業まだ赤字）、投資−（ガンガン投資中）、財務+（銀行・投資家から調達）→ スタートアップ・成長企業\nパターンC：営業−（本業苦戦）、投資+（資産を売ってお金に換える）、財務+（さらに借りる）→ 要注意\n\n▶ ポイント：CF3区分の「＋−の組み合わせ」で企業の成長ステージや健全性が読み取れる',

  {
    id:381,
    level:2,
    cat:'工業簿記総まとめ',
    q:'（穴埋め）\n━━ 工業簿記の勘定連絡図とは ━━\n工場でのお金の流れを「材料→仕掛品→製品→売上原価」の順で追う仕組み。\n直接費は仕掛品へ直行、間接費は一旦「製造間接費」に集めてから仕掛品に配賦する。\n━━━━━━━━━━\n\n材料勘定 → 【①】勘定（直接材料費）\n材料勘定 → 【②】勘定（間接材料費）\n仕掛品勘定 → 【③】勘定（完成時の振替）\n製品勘定 → 【④】勘定（販売時の振替）',
    q_en:'(Fill in) Complete the manufacturing account flow diagram.\nMaterials → [①] (direct) and [②] (indirect)\nWIP → [③] (on completion)\nFinished Goods → [④] (on sale)',
    a:'① 仕掛品　② 製造間接費　③ 製品　④ 売上原価\n\n【計算過程】\n材料（直接材料費）→ 仕掛品（直接、製品に追跡可能）\n材料（間接材料費）→ 製造間接費（間接、複数製品に共通）\n仕掛品（完成時）→ 製品（在庫として保管）\n製品（販売時）→ 売上原価（費用として損益計算書へ）\n\n▶ ポイント：この勘定連絡図を頭に入れれば工業簿記の仕訳問題の大半が解ける。「直接→仕掛品直行」「間接→製造間接費経由」が最重要',
    exp:'工業簿記の勘定連絡図は試験で必ず問われる核心知識。「直接費→仕掛品直行」「間接費→製造間接費→配賦→仕掛品」「完成→製品」「販売→売上原価」この4つの矢印の流れを図で頭に入れましょう。この図を理解していれば仕訳問題の8割は解けます。',
    exp_en:'The manufacturing account flow diagram is the backbone of industrial bookkeeping. Direct costs → WIP directly. Indirect costs → Manufacturing Overhead → allocated to WIP. Completion → Finished Goods. Sale → COGS. Master this diagram and you can solve 80% of journal entry problems.',
    steps:[
      {label:'①直接材料費の振替先', hint:'製品に直接使われた直接材料費は「仕掛品」勘定へ振替。間接材料費（工具・油など共通資材）は「製造間接費」勘定へ。仕掛品に集積された費用が製造工程を経て最終的に「製品」勘定へ移る', ans:'仕掛品', choices:['仕掛品','製造間接費','材料','製品']},
      {label:'②間接材料費の振替先', hint:'製品に直接追跡できない材料費はどこへ？', ans:'製造間接費', choices:['製造間接費','仕掛品','製品','売上原価']},
      {label:'③仕掛品が完成したときの振替先', hint:'仕掛品の製造完了後、振替先の在庫勘定は？', ans:'製品', choices:['製品','仕掛品','売上原価','材料']},
      {label:'④製品が売れたときの振替先', hint:'販売時に費用（P/L）に計上される勘定は？', ans:'売上原価', choices:['売上原価','製品','仕掛品','製造間接費']}
    ]
  },

  // ===== 為替手形（追加）=====
  { id:382, level:2, cat:'手形',
    q:'（穴埋め）\n━━ 為替手形の3者とは ━━\n為替手形は「振出人が引受人に命令して、受取人に払わせる」3者間の証書。\n約束手形（2者）とは違い、第三者（引受人）を通じて決済する。\n━━━━━━━━━━\n\n① 手形を作成・発行する者\n   → 【①】という\n\n② 「○○円払え」と命令を受け、支払いを引き受けた者\n   → 【②】という\n\n③ 手形を受け取り、満期日に代金を受け取る者\n   → 【③】という',
    q_en:'(Fill in) A bill of exchange involves three parties. ①The party who creates and issues the bill is called [　]. ②The party ordered to pay and who accepts the bill is called [　]. ③The party who receives the bill and collects on the due date is called [　].',
    a:'① 振出人（Drawer）　② 引受人（Acceptor）　③ 受取人（Payee）\n\n【計算過程】\n振出人：「私の代わりに払ってくれ」と手形を作成して発行する者\n引受人：「わかった、払います」と承諾して手形を引き受ける者（支払義務を負う）\n受取人：手形を受け取り、満期日に引受人から代金を受け取る者\n\n▶ ポイント：約束手形は2者（振出人が払う）、為替手形は3者（引受人が払う）。振出人は買掛金と売掛金を同時に決済できる',
    exp:'為替手形は振出人・引受人・受取人の3者間の手形。振出人はBへの買掛金とCへの売掛金を同時に決済できる。引受人は振出人への買掛金を支払手形に振り替え、受取人は振出人への売掛金を受取手形に振り替える。',
    steps:[
      {label:'①手形を発行する者', hint:'手形を作って流通させる人は？', ans:'振出人', choices:['振出人','引受人','受取人','名宛人']},
      {label:'②支払いを引き受けた者', hint:'「○○円払え」と命令を受けて承諾した人は？', ans:'引受人', choices:['引受人','振出人','受取人','保証人']},
      {label:'③手形を受け取る者', hint:'満期日に現金を受け取る権利者は？', ans:'受取人', choices:['受取人','振出人','引受人','裏書人']}
    ]
  },

  { id:390, level:2, cat:'圧縮記帳',
    q:'国庫補助金2,000,000円を普通預金に受け取り、機械装置4,000,000円を現金で購入した（耐用年数4年・残存価額0円・定額法）。積立金方式で圧縮記帳を行う場合の①補助金受取②機械購入③圧縮積立金設定の仕訳と、④1年目の減価償却費と積立金取崩額を答えよ。',

    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①補助金受取</td><td>普通預金</td><td>2,000,000</td><td class="hl">国庫補助金受贈益</td><td>2,000,000</td></tr><tr><td>②機械購入</td><td>機械装置</td><td>4,000,000</td><td>現金</td><td>4,000,000</td></tr><tr><td>③圧縮積立金</td><td class="hl">繰越利益剰余金</td><td>2,000,000</td><td class="hl">圧縮積立金</td><td>2,000,000</td></tr></tbody></table><div class="formula-box">④減価償却費＝4,000,000÷4年＝1,000,000円（帳簿価額は変わらないので全額ベース）<br>積立金取崩額＝2,000,000÷4年＝500,000円（圧縮積立金→繰越利益剰余金）</div>`,
    exp:'積立金方式は「帳簿価額はそのまま、利益剰余金から圧縮積立金へ積み立てる」方法。固定資産の価額は変わらないので減価償却費は取得原価全額ベースで計算。毎期、補助金相当額÷耐用年数を圧縮積立金から繰越利益剰余金へ取り崩す（課税の繰り延べ効果を均等に享受）。',

      {label:'③借方（圧縮積立金の設定時借方）', hint:'剰余金の一部を積立金へ振り替えるとき借方は？', ans:'繰越利益剰余金', choices:['繰越利益剰余金','固定資産圧縮損','機械装置','利益準備金']},
      {label:'④1年目の減価償却費', hint:'積立金方式では帳簿価額は変わらない。4,000,000÷4年＝？', ans:1000000, unit:'円', choices:[1000000,800000,500000,750000]},
      {label:'④1年目の積立金取崩額', hint:'圧縮積立金2,000,000円を4年で均等取崩し。', ans:500000, unit:'円', choices:[500000,400000,1000000,250000]}

  { id:391, level:2, cat:'圧縮記帳',
    q:'直接控除方式で圧縮記帳済みの建物：取得原価10,000,000円・固定資産圧縮損3,000,000円（計上済み）・耐用年数20年・残存価額0円・定額法。\n①圧縮後の帳簿価額②毎年の減価償却費③減価償却の仕訳を示せ。',

    ans_html:`<div class="formula-box">①圧縮後帳簿価額＝10,000,000－3,000,000＝7,000,000円<br>②年間減価償却費＝7,000,000÷20年＝350,000円<br>③借：減価償却費 350,000　／　貸：減価償却累計額 350,000</div>`,

    steps:[
      {label:'①圧縮後帳簿価額', hint:'取得原価10,000,000円から圧縮損3,000,000円を差し引く', ans:7000000, unit:'円', choices:[7000000,10000000,3000000,8000000]},

      {label:'③減価償却の借方勘定', hint:'費用として計上する勘定は？', ans:'減価償却費', choices:['減価償却費','固定資産圧縮損','建物','圧縮積立金']}
    ]
  },

  { id:392, level:2, cat:'圧縮記帳',
    q:'（穴埋め）\n━━ 圧縮記帳の2方式とは ━━\n国から補助金をもらったとき、すぐに全額課税されると困るため、課税を将来に繰り延べる会計処理。\n「直接控除方式」と「積立金方式」の2つのやり方がある。\n━━━━━━━━━━\n\n圧縮記帳の目的：補助金受取による【①】の課税を将来に繰り延べること\n\n直接控除方式：\n　固定資産の帳簿価額を【②】する\n　→ 毎期の減価償却費が【③】なる（税金の繰延効果）\n\n積立金方式：\n　固定資産の帳簿価額は【④】\n　→ 毎期【⑤】を取り崩して課税調整する',
    q_en:'(Fill in) Comparison of two compression methods. The purpose is to defer tax on [①]. Direct reduction: book value is [②] → depreciation becomes [③]. Reserve method: book value is [④] → each period [⑤] is released.',
    a:'① 収益（国庫補助金受贈益）　② 減額（圧縮）　③ 小さく　④ 変わらない　⑤ 圧縮積立金\n\n【計算過程】\n直接控除方式：帳簿価額を補助金額だけ下げる → 減価償却の基礎が小さくなる → 毎期の償却費が減る → 少しずつ課税\n積立金方式：帳簿価額はそのまま → 圧縮積立金（純資産）を積立 → 毎期取崩して課税調整\n\n▶ ポイント：両方式とも「補助金受取時の一括課税を避けて、将来に分割課税する」効果は同じ。直接控除方式が簡単で実務主流',
    exp:'圧縮記帳は税務上の特例で、補助金収益をすぐに課税せず分割課税するイメージ。直接控除方式は帳簿価額を下げることで減価償却費（損金）を減らし、毎期少しずつ課税される。積立金方式は帳簿価額を変えず、積立金の取崩しで課税調整する。',
    steps:[
      {label:'①繰り延べる課税の対象', hint:'補助金受取時に生じる収益科目は？', ans:'収益（国庫補助金受贈益）', choices:['収益（国庫補助金受贈益）','費用（支出）','損失','資産増加']},
      {label:'②直接控除方式の帳簿価額', hint:'直接控除＝帳簿価額を補助金額だけどうする？', ans:'減額する', choices:['減額する','増額する','変えない','時価評価する']},
      {label:'③直接控除方式の減価償却費', hint:'帳簿価額が小さくなれば減価償却費は？', ans:'小さく', choices:['小さく','大きく','変わらない','ゼロに']},
      {label:'④積立金方式の帳簿価額の変化', hint:'積立金方式では固定資産の帳簿価額はどうなる？', ans:'変わらない', choices:['変わらない','減額される','増額される','ゼロになる']}
    ]
  },

  },

  { id:395, level:2, cat:'繰延資産',
    q:'会社設立のため定款作成費用200,000円・設立登記費用100,000円・発起人報酬80,000円を現金で支払い、創立費（繰延資産）として計上した。仕訳を示せ。また、創立費と開業費の正しい区別を選べ。',

  { id:396, level:2, cat:'繰延資産',
    q:'（穴埋め）\n━━ 繰延資産の種類と最長償却期間とは ━━\n繰延資産とは「支出したがすぐに費用にせず、数年かけて費用化する資産」のこと。\n株式交付費だけ3年、他は5年が基本（社債発行費のみ特殊ルール）。\n━━━━━━━━━━\n\n① 創立費（会社を作る費用）：【①】年以内\n② 開業費（営業開始前の準備費用）：【②】年以内\n③ 株式交付費（増資時の株式発行費用）：【③】年以内\n④ 社債発行費（社債を発行する費用）：社債の【④】以内\n⑤ 開発費（新製品・技術の開発費用）：【⑤】年以内',
    q_en:'(Fill in) Deferred assets and their maximum amortization periods: ①Organization costs ②Pre-opening costs ③Share issuance costs ④Bond issuance costs ⑤Development costs.',
    a:'① 5　② 5　③ 3　④ 償還期限　⑤ 5\n\n【計算過程】\n創立費：5年以内（会社設立の費用）\n開業費：5年以内（営業開始前の準備費用）\n株式交付費：3年以内（他と違う！3年）\n社債発行費：社債の償還期限以内（社債の存続期間に合わせる特殊ルール）\n開発費：5年以内（研究開発費のうち繰延資産にできるもの）\n\n▶ ポイント：「株式交付費だけ3年、他は5年（社債発行費は例外）」が試験の頻出ポイント',
    exp:'繰延資産の償却期間：①創立費5年②開業費5年③株式交付費3年④社債発行費は社債の償還期限以内⑤開発費5年。株式交付費だけが3年で他は5年。社債発行費だけ「社債の期間に合わせる」という特殊ルール。試験で必ず問われる知識。',
    steps:[
      {label:'①創立費の最長償却期間', hint:'会社設立費用の繰延資産は何年以内？', ans:'5年', choices:['5年','3年','10年','1年']},
      {label:'②開業費の最長償却期間', hint:'開業準備費用の繰延資産は何年以内？', ans:'5年', choices:['5年','3年','10年','1年']},
      {label:'③株式交付費の最長償却期間', hint:'他の繰延資産と異なる年数。何年以内？', ans:'3年', choices:['3年','5年','10年','1年']},
      {label:'④社債発行費の償却期間', hint:'社債発行費は社債の存続期間に合わせる', ans:'社債の償還期限以内', choices:['社債の償還期限以内','5年以内','3年以内','10年以内']}
    ]
  },

    q_en:'A market software product was developed. ①Research/planning phase ¥600,000 (expense) and ②post-master additional dev ¥900,000 (capitalize) were paid in cash. Show entries for ①②. Show ③annual amortization (3yr straight-line).',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①研究・企画段階</td><td class="hl">研究開発費</td><td>600,000</td><td>現金</td><td>600,000</td></tr><tr><td>②製品マスター以降</td><td class="hl">ソフトウェア</td><td>900,000</td><td>現金</td><td>900,000</td></tr><tr><td>③年間償却</td><td class="hl">ソフトウェア償却</td><td class="hl">300,000</td><td class="hl">ソフトウェア</td><td class="hl">300,000</td></tr></tbody></table><div class="formula-box">年間償却費＝900,000÷3年＝300,000円（無形固定資産は直接法で償却）</div>`,

    e:[{d:[['研究開発費',600000]],c:[['現金',600000]]},{d:[['ソフトウェア',900000]],c:[['現金',900000]]},{d:[['ソフトウェア償却',300000]],c:[['ソフトウェア',300000]]}]
  },

  { id:399, level:2, cat:'固定資産',
    q:'自社の受発注管理システムを外部委託で開発し、完成時に代金1,800,000円を小切手で支払った（将来の業務コスト削減が確実）。無形固定資産（ソフトウェア）として計上し、耐用年数5年・定額法で償却する。①取得時の仕訳②年間償却費③償却時の仕訳を示せ。',
    q_en:'An in-house order system was developed externally for ¥1,800,000 (paid by check; future cost savings confirmed). Record as intangible asset (software), 5yr straight-line. Show ①acquisition entry ②annual amortization amount ③amortization entry.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①取得時</td><td class="hl">ソフトウェア</td><td class="hl">1,800,000</td><td>当座預金</td><td>1,800,000</td></tr><tr><td>③償却時</td><td class="hl">ソフトウェア償却</td><td class="hl">360,000</td><td class="hl">ソフトウェア</td><td class="hl">360,000</td></tr></tbody></table><div class="formula-box">②年間償却費＝1,800,000÷5年＝360,000円<br>無形固定資産は直接法（資産残高を直接減額）で償却</div>`,
    exp:'自社利用目的ソフトウェアは「将来の費用削減や業務効率化が確実な場合」に無形固定資産として計上できる。不確実な場合は費用処理。市場販売目的ソフトウェアとは異なり、利用可能になった時点で資産計上開始。耐用年数は通常5年（最長）。',
    e:[{d:[['ソフトウェア',1800000]],c:[['当座預金',1800000]]},{d:[['ソフトウェア償却',360000]],c:[['ソフトウェア',360000]]}]

  // ===== 株式発行・増資（追加）=====
  { id:400, level:2, cat:'株式発行',
    q:'増資のため株式200株を1株2,000円で発行し、払込金400,000円が普通預金に振り込まれた。会社法の規定により払込額の1/2を資本金・残りを資本準備金に計上する場合の仕訳を示せ。',

  { id:401, level:2, cat:'株式発行',
    q:'保有する自己株式（帳簿価額150,000円）を消却した。その他資本剰余金の残高は十分にあるとする。仕訳を示せ。',

    exp:'自己株式の消却は「帳簿上の株式を廃棄する」手続き。その他資本剰余金を借方に計上して自己株式（貸方）を消す。その他資本剰余金が不足する場合は繰越利益剰余金から補填。資本金や資本準備金からは直接消却しない。消却後は発行済株式数が減少する。',

  },

  { id:402, level:2, cat:'株式発行',
    q:'株主総会の決議により①資本準備金600,000円を資本金に組み入れ、②繰越利益剰余金400,000円を利益準備金に積み立てた。各仕訳を示せ。',

  // ===== 特殊商品売買・収益認識（追加）=====
  { id:403, level:2, cat:'収益認識',
    q:'（委託販売・委託者の仕訳）A社（委託者）はB社（受託者）に商品（原価240,000円）を積送した。後日、B社から売上計算書（販売額400,000円・受託手数料20,000円・送金額380,000円）が届き現金が振り込まれた。A社の①積送時②計算書受取・入金時③売上原価振替の仕訳を示せ。',
    q_en:'(Consignment – consignor) A shipped goods (cost ¥240,000) to B. B reported: sales ¥400,000, commission ¥20,000, remitted ¥380,000. Show A\'s entries: ①shipment ②account sales receipt & cash ③cost transfer.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①積送時</td><td class="hl">積送品</td><td>240,000</td><td class="hl">仕入</td><td>240,000</td></tr><tr><td>②入金時</td><td>現金</td><td>380,000</td><td class="hl">売上</td><td>400,000</td></tr><tr><td></td><td class="hl">支払手数料</td><td>20,000</td><td></td><td></td></tr><tr><td>③原価振替</td><td class="hl">売上原価</td><td>240,000</td><td class="hl">積送品</td><td>240,000</td></tr></tbody></table>`,
    exp:'委託販売の委託者：①積送時に「仕入（商品）→積送品」へ振り替え（まだ売上ではない）。②売上計算書が届いた時点で収益認識。受託者への手数料は費用（支払手数料）として売上から差し引かない（総額表示）。③同時に積送品の原価を売上原価へ振り替え。',
    e:[{d:[['積送品',240000]],c:[['仕入',240000]]},{d:[['現金',380000],['支払手数料',20000]],c:[['売上',400000]]},{d:[['売上原価',240000]],c:[['積送品',240000]]}]
  },

  { id:404, level:2, cat:'収益認識',
    q:'（委託販売・受託者の仕訳）B社（受託者）はA社（委託者）から委託された商品を現金400,000円で全量販売した。手数料20,000円を差し引いた380,000円をA社に現金送金した。B社の①販売時②手数料計上③送金時の仕訳を示せ。',
    q_en:'(Consignment – agent) B sold all consigned goods for ¥400,000 cash, deducted ¥20,000 commission, and remitted ¥380,000 in cash to A. Show B\'s entries: ①sale ②commission recognition ③remittance.',
    ans_html:`<table><thead><tr><th>取引</th><th>借方</th><th>金額</th><th>貸方</th><th>金額</th></tr></thead><tbody><tr><td>①販売時</td><td>現金</td><td>400,000</td><td class="hl">受託販売</td><td>400,000</td></tr><tr><td>②手数料</td><td class="hl">受託販売</td><td>20,000</td><td class="hl">受取手数料</td><td>20,000</td></tr><tr><td>③送金時</td><td class="hl">受託販売</td><td>380,000</td><td>現金</td><td>380,000</td></tr></tbody></table><div class="formula-box">受託者の収益は手数料のみ（受取手数料）。販売代金は委託者への預り金（受託販売）。</div>`,

    e:[{d:[['現金',400000]],c:[['受託販売',400000]]},{d:[['受託販売',20000]],c:[['受取手数料',20000]]},{d:[['受託販売',380000]],c:[['現金',380000]]}]
  },

  { id:405, level:2, cat:'収益認識',

const IKOU_CATS = new Set(['工業簿記基礎','材料費','労務費','経費','個別原価計算','部門別原価計算','製造間接費','総合原価計算','標準原価計算','直接原価計算','工業簿記総まとめ']);
const SECS = {
  s3:  q => (q.level||3)===3,
  s2c: q => q.level===2 && !IKOU_CATS.has(q.cat),
  s2i: q => q.level===2 && IKOU_CATS.has(q.cat),
};

function getSectionQuestions(sec){ return sec ? ALL.filter(SECS[sec]) : ALL; }

function updateGroupButtons(){
  const row = document.getElementById('group-row');
  if(!sectionFilter){ row.style.display='none'; groupFilter=0; return; }
  const secQs = getSectionQuestions(sectionFilter);
  const numGroups = Math.ceil(secQs.length/20);
  row.style.display='';
  let html='<span style="font-size:11px;font-weight:700;color:var(--muted);align-self:center;">範囲：</span>';
  html+=`<button class="ctrl-btn grp-btn${groupFilter===0?' active':''}" onclick="setGroup(0)">全問</button>`;
  for(let i=0;i<numGroups;i++){
    const s=i*20+1, e=Math.min((i+1)*20,secQs.length);
    html+=`<button class="ctrl-btn grp-btn${groupFilter===i+1?' active':''}" onclick="setGroup(${i+1})">Q${s}-${e}</button>`;
  }
  row.innerHTML=html;
}

let deck = [];
let idx  = 0;
let checked   = JSON.parse(localStorage.getItem('bk_checked')   || '{}');
let checkOnly = false;
let groupFilter = 0;
let sectionFilter = null;

function saveProgress(){
  localStorage.setItem('bk_checked', JSON.stringify(checked));
}

function buildDeck(){
  let base = getSectionQuestions(sectionFilter);
  if(groupFilter > 0){
    const s=(groupFilter-1)*20, e=groupFilter*20;
    base=base.slice(s,e);
  }
  deck=base.filter(q=>!checkOnly||checked[q.id]);
}

function setGroup(n){
  groupFilter = n;
  updateGroupButtons();
  buildDeck();
  idx = 0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

// ===== スクロールモード =====
let expQuestions=[], expQIdx=0, expCardIdx=0, expEntryIdx=0;
let expPlaced={d:[],c:[]}, expHistory=[], expQOk=true;

function getExpEntryAccounts(q, ei){
  if(!q.e || !q.e[ei]) return null;
  const entry=q.e[ei];
  const parse=(item,s)=>Array.isArray(item)?{name:item[0],amt:item[1],side:s}:{name:item,amt:null,side:s};
  return [...entry.d.map(item=>parse(item,'d')),...entry.c.map(item=>parse(item,'c'))];
}

function syncExpFromDeck(startIdx){
  expQuestions=[...deck];
  expQIdx=Math.min(Math.max(0,startIdx),Math.max(0,deck.length-1));
  expEntryIdx=0; expQOk=true;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
}



function expNavBar(){
  const total=expQuestions.length, i=expQIdx;
  const isLast=i>=total-1;
  return `<div class="exp-nav-row">
    <button class="exp-nav-btn" onclick="expGoTo(${i-1})"${i===0?' disabled':''}>← 前へ</button>
    <span class="exp-nav-info">問${i+1} / ${total}</span>
    <button class="exp-nav-btn exp-nav-next" onclick="expGoTo(${i+1})"${isLast?' disabled':''}>次の問題 →</button>
  </div>`;
}

function expGoTo(i){
  if(i<0||i>=expQuestions.length) return;
  expQIdx=i; loadExpQ();
}

function fmtQ(q){
  let txt=q.q_html||q.q||'';
  txt=txt.replace(/^（穴埋め[^）]*）[\s　]*/u,'');
  txt=addQBreaks(txt);
  return styleParens(txt);
}
function fmtQen(q){
  let txt=q.q_en||'';
  txt=txt.replace(/^\([Ff]ill[^)]*\)[\s]*/,'');
  return addQBreaks(txt);
}

function loadExpQ(){
  const q=expQuestions[expQIdx];
  expEntryIdx=0; expQOk=true;
  if(q.steps){ loadExpSteps(); return; }
  const main=document.getElementById('exp-main');

  const qEnHtml=q.q_en?`<div class="exp-q-en">${fmtQen(q)}</div>`:'';
  const noteHtml=q.note?`<div class="note-box">💡 ${q.note.replace(/\n/g,'<br>')}</div>`:'';
  if(!q.e){
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}${qEnHtml}</div>
      ${noteHtml}
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
  } else {
    main.innerHTML=`
      ${expNavBar()}
      <div class="exp-q-card">${fmtQ(q)}${qEnHtml}</div>
      ${noteHtml}
      <div class="exp-result" id="exp-res"></div>
      <div id="exp-entry-area"></div>`;
    loadExpEntry();
  }
}

function loadExpEntry(){
  const q=expQuestions[expQIdx];
  const multi=q.e.length>1;
  const label=multi?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;">【仕訳 ${expEntryIdx+1}／${q.e.length}】</div>`:'';
  const accounts=getExpEntryAccounts(q, expEntryIdx);
  const _sh=[...accounts];for(let _i=_sh.length-1;_i>0;_i--){const _j=Math.floor(Math.random()*(_i+1));[_sh[_i],_sh[_j]]=[_sh[_j],_sh[_i]];}
  window._expCards=_sh;
  expPlaced={d:[],c:[]}; expHistory=[]; expCardIdx=0;
  document.getElementById('exp-entry-area').innerHTML=`
    ${label}
    <div class="exp-swipe-wrap" id="exp-sw">
    </div>
    <div class="exp-zones">
      <div class="exp-zone exp-zone-d"><div class="exp-zone-label">借　方</div><div id="exp-pd" class="exp-placed"></div></div>
      <div class="exp-zone exp-zone-c"><div class="exp-zone-label">貸　方</div><div id="exp-pc" class="exp-placed"></div></div>
    </div>
    <button class="exp-undo-btn" id="exp-undo" onclick="expUndo()" style="display:none;">↩ 取り消す</button>`;
  renderExpCard();
}

let expStepIdx=0;

function loadExpSteps(){
  const q=expQuestions[expQIdx];
  expStepIdx=0;
  const main=document.getElementById('exp-main');
  const qEnHtml=q.q_en?`<div class="exp-q-en">${fmtQen(q)}</div>`:'';
  const noteHtml=q.note?`<div class="note-box">💡 ${q.note.replace(/\n/g,'<br>')}</div>`:'';
  main.innerHTML=`
    ${expNavBar()}
    <div class="exp-q-card">${fmtQ(q)}${qEnHtml}</div>
    ${noteHtml}
    <div id="exp-step-area" class="exp-step-area"></div>`;
  renderExpStep();
}

function renderExpStep(){
  const q=expQuestions[expQIdx];
  const steps=q.steps;
  const area=document.getElementById('exp-step-area');
  if(!area) return;
  if(expStepIdx>=steps.length){
    area.innerHTML=`<div class="exp-steps-done">✅ 全ステップ完了！</div>
      <button class="exp-reveal-btn" onclick="expRevealAns(this)">答えを見る ▼</button>
      <div class="exp-readonly-ans" id="exp-ro-ans">${q.ans_html||''}</div>`;
    return;
  }
  const step=steps[expStepIdx];
  const dots=steps.map((_,i)=>{
    const cls=i<expStepIdx?'done':(i===expStepIdx?'active':'');
    return `<span class="exp-step-dot ${cls}"></span>`;
  }).join('');
  const shuffled=[...step.choices].sort(()=>Math.random()-0.5);
  window._stepChoices=shuffled;
  const fmt=(v)=>typeof v==='number'?v.toLocaleString()+(step.unit?' '+step.unit:''):String(v);
  const isLong=shuffled.some(v=>String(v).length>12);
  const choiceHtml=shuffled.map((c,i)=>
    `<button class="exp-step-choice-btn" onclick="selectExpStepChoice(this,${i})">${fmt(c)}</button>`
  ).join('');
  area.innerHTML=`
    <div class="exp-step-header">
      <span class="exp-step-label">ステップ ${expStepIdx+1}/${steps.length}：${step.label}</span>
      <div class="exp-step-progress">${dots}</div>
    </div>
    <div class="exp-step-hint">${step.hint}</div>
    <div class="exp-step-choices${isLong?' wide':''}">${choiceHtml}</div>`;
}

function selectExpStepChoice(btn,idx){
  const step=expQuestions[expQIdx].steps[expStepIdx];
  const chosen=window._stepChoices[idx];
  const ok=chosen===step.ans||(typeof step.ans==='number'&&step.ans<0&&chosen===-step.ans);
  if(ok){
    const area=document.getElementById('exp-step-area');
    area.querySelectorAll('.exp-step-choice-btn').forEach(b=>{
      b.disabled=true;
      if(b===btn) b.classList.add('correct');
      else b.style.opacity='0.4';
    });
    setTimeout(()=>{expStepIdx++;renderExpStep();},800);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function expRevealAns(btn){
  const q=expQuestions[expQIdx];
  btn.style.display='none';
  const ro=document.getElementById('exp-ro-ans');
  ro.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa=q.exp?`<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>`:'';
  const expEn=q.exp_en?`<div class="exp-res-exp-en">${q.exp_en.replace(/\n/g,'<br>')}</div>`:'';
  const area=document.createElement('div');
  area.className='exp-fill-exp-area';
  area.innerHTML=expJa+expEn+checkBtn;
  ro.insertAdjacentElement('afterend',area);
}

function renderExpCard(){
  const wrap=document.getElementById('exp-sw');
  if(!wrap) return;
  const old=wrap.querySelector('.exp-swipe-card');
  if(old) old.remove();
  const cards=window._expCards||[];
  if(expCardIdx>=cards.length){ expCheckResult(); return; }
  const acc=cards[expCardIdx];
  const card=document.createElement('div');
  card.className='exp-swipe-card';
  const len=acc.name.length;
  const fs=len<=5?15:len<=7?13:len<=9?11:10;
  card.innerHTML=`<span class="tag ${T[acc.name]||'other'}" style="font-size:${fs}px;white-space:nowrap;">${acc.name}</span>${acc.amt!=null?`<div style="font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;">${acc.amt.toLocaleString()}円</div>`:''}`;
  wrap.appendChild(card);
  initExpSwipe(card);
}

function initExpSwipe(card){
  let sx=0,dragging=false,md=false;
  const move=(dx)=>{
    card.style.transform=`translateX(${dx}px) rotate(${dx*0.07}deg)`;
    card.className='exp-swipe-card'+(dx<-30?' tilt-l':dx>30?' tilt-r':'');
  };
  const finish=(dx)=>{
    if(Math.abs(dx)>55) expPlace(dx<0?'d':'c');
    else{ card.classList.add('anim'); card.style.transform=''; card.className='exp-swipe-card anim'; setTimeout(()=>card.classList.remove('anim'),280); }
  };
  card.addEventListener('touchstart',e=>{e.preventDefault();sx=e.touches[0].clientX;dragging=true;card.style.transition='';},{passive:false});
  card.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)move(e.touches[0].clientX-sx);},{passive:false});
  card.addEventListener('touchend',e=>{if(dragging){dragging=false;finish(e.changedTouches[0].clientX-sx);}},{passive:false});
  card.addEventListener('mousedown',e=>{md=true;sx=e.clientX;card.style.transition='';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(md)move(e.clientX-sx);});
  document.addEventListener('mouseup',e=>{if(md){md=false;finish(e.clientX-sx);}});
}

function updateExpZones(){
  ['d','c'].forEach(s=>{
    const el=document.getElementById('exp-p'+s);
    if(el) el.innerHTML=expPlaced[s].map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  });
}

function expPlace(side){
  const cards=window._expCards||[];
  const acc=cards[expCardIdx];
  expHistory.push({side,acc});
  expPlaced[side].push(acc);
  expCardIdx++;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='block';
  const card=document.querySelector('#exp-sw .exp-swipe-card');
  if(card){
    card.classList.add('anim');
    card.style.transform=`translateX(${side==='d'?-320:320}px)`;
    card.style.opacity='0';
    setTimeout(renderExpCard,260);
  } else renderExpCard();
}

function expUndo(){
  if(expHistory.length===0) return;
  const last=expHistory.pop();
  const arr=expPlaced[last.side];
  arr.splice(arr.indexOf(last.acc),1);
  expCardIdx--;
  updateExpZones();
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display=expHistory.length>0?'block':'none';
  const res=document.getElementById('exp-res');
  if(res) res.style.display='none';
  renderExpCard();
}

function expCheckResult(){
  const q=expQuestions[expQIdx];
  const cards=window._expCards||[];
  let ok=true;
  cards.forEach(acc=>{ if(expPlaced.d.includes(acc)!==(acc.side==='d')) ok=false; });
  if(!ok) expQOk=false;
  const isLastEntry=expEntryIdx>=q.e.length-1;
  const res=document.getElementById('exp-res');
  const undoBtn=document.getElementById('exp-undo');
  if(undoBtn) undoBtn.style.display='none';
  const entryAccounts=getExpEntryAccounts(q, expEntryIdx);
  const debit=entryAccounts.filter(a=>a.side==='d');
  const credit=entryAccounts.filter(a=>a.side==='c');
  const tagHtml=arr=>arr.map(a=>`<span class="tag ${T[a.name]||'other'}">${a.name}${a.amt!=null?`<span class="tag-amt"> ${a.amt.toLocaleString()}円</span>`:''}</span>`).join('');
  const multiLabel=q.e.length>1?` (${expEntryIdx+1}／${q.e.length})`:'';
  const nextEntryBtn=isLastEntry?'':`<button class="exp-nav-btn exp-nav-next" style="width:100%;margin-top:10px;" onclick="expNextEntry()">次の仕訳へ →</button>`;
  res.className=`exp-result ${ok?'ok':'ng'}`;
  res.style.display='block';
  const isChecked=!!checked[q.id];
  const checkBtn=`<button id="exp-check-btn" class="exp-check-btn${isChecked?' active':''}" onclick="toggleChecked(${q.id})">${isChecked?'☑ チェック済み':'☐ チェックをつける'}</button>`;
  const expJa = isLastEntry && q.exp ? `<div class="exp-res-exp">${q.exp.replace(/\n/g,'<br>')}</div>` : '';
  const expEn = isLastEntry && q.exp_en ? `<div class="exp-res-exp-en">${q.exp_en.replace(/\n/g,'<br>')}</div>` : '';
  if(ok){
    res.innerHTML=`<div class="exp-res-hd">⭕ 正解！</div>${expJa}${expEn}${checkBtn}${nextEntryBtn}`;
  } else {
    res.innerHTML=`
      <div class="exp-res-hd">❌ 不正解</div>
      <div class="exp-res-ans">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">正解の仕訳${multiLabel}</div>
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;">
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(debit)}</div>
          <div style="color:var(--muted);font-weight:700;padding:3px 4px;align-self:center;">｜</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${tagHtml(credit)}</div>
        </div>
      </div>
      ${expJa}${expEn}${checkBtn}${nextEntryBtn}`;
  }
}

function expNextEntry(){
  expEntryIdx++;
  const res=document.getElementById('exp-res');
  if(res){ res.style.display='none'; res.innerHTML=''; }
  document.getElementById('exp-entry-area').scrollIntoView({behavior:'smooth',block:'start'});
  loadExpEntry();
}

// ===== スクロールモードここまで =====

function setSection(sec){
  sectionFilter=sec;
  groupFilter=0;
  ['sec-s3','sec-s2c','sec-s2i'].forEach(id=>{
    const btn=document.getElementById(id);
    if(btn) btn.classList.toggle('active',
      (sec==='s3'&&id==='sec-s3')||
      (sec==='s2c'&&id==='sec-s2c')||
      (sec==='s2i'&&id==='sec-s2i')
    );
  });
  updateGroupButtons();
  buildDeck();
  idx=0;
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}




function toggleCheckOnly(){
  checkOnly = !checkOnly;
  document.getElementById('btn-check-only').classList.toggle('active', checkOnly);
  document.getElementById('btn-check-only').textContent = checkOnly ? 'チェックのみ解除' : 'チェックのみ';
  buildDeck();
  syncExpFromDeck(0);
  document.getElementById('exp-main').innerHTML='';
  loadExpQ();
}

function toggleChecked(qId){
  if(checked[qId]){ delete checked[qId]; } else { checked[qId]=true; }
  saveProgress();
  updateStats();
  const btn=document.getElementById('exp-check-btn');
  if(btn){ btn.textContent=checked[qId]?'☑ チェック済み':'☐ チェックをつける'; btn.classList.toggle('active',!!checked[qId]); }
}

function resetAll(){
  checked={};
  checkOnly=false;
  saveProgress();
  const co=document.getElementById('btn-check-only');
  if(co){ co.classList.remove('active'); co.textContent='チェックのみ'; }
  setSection('s3');
}



function updateStats(){
  document.getElementById('s-total').textContent = deck.length;
  document.getElementById('s-check').textContent = Object.keys(checked).length;
}

function makeTags(arr){
  return arr.map(a => {
    if(Array.isArray(a)){
      const [name, amt] = a;
      const amtStr = typeof amt === 'number' ? amt.toLocaleString() : String(amt);
      return `<span class="tag ${tagType(name)}">${name}<span class="tag-amt">${amtStr}円</span></span>`;
    }
    return `<span class="tag ${tagType(a)}">${a}</span>`;
  }).join('');
}

function _unusedColorize(el){
  const sorted = Object.entries(T).sort((a,b) => b[0].length - a[0].length);
  el.querySelectorAll('table').forEach(tbl => {
    const ths = tbl.querySelectorAll('th');
    const isJournal = Array.from(ths).some(th => /借|貸/.test(th.textContent));
    if(!isJournal) return;
    tbl.querySelectorAll('td').forEach(td => {
      if(td.querySelector('.tag')) return;
      let h = td.innerHTML;
      const reps = [];
      sorted.forEach(([name, type]) => {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        h = h.replace(new RegExp(esc, 'g'), () => {
          const i = reps.length;
          reps.push(`<span class="tag ${type}">${name}</span>`);
          return `\x00${i}\x00`;
        });
      });
      h = h.replace(/\x00(\d+)\x00/g, (_, i) => reps[+i]);
      td.innerHTML = h;
    });
  });
}

setSection('s3');
