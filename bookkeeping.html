    { term:'分記法', en:'Separate Method', def:'商品を売るたびに<strong>商品原価の減少と利益の両方を同時に記録</strong>する方法です。「商品（資産）を減らして、その差額を商品売買益（収益）に計上」します。リアルタイムで利益がわかりますが仕訳が複雑です。', def_en:'Records <strong>both the reduction in inventory cost and the profit margin simultaneously at each sale</strong>. "Reduce the Merchandise asset, and record the gain as Merchandise Sales Profit." Profit is visible in real time, but entries are more complex.' },
    { term:'売上原価対立法', en:'Cost of Sales Method', def:'売り上げた時点で売上と同時に<strong>売上原価（費用）と商品（資産）の減少も一緒に仕訳</strong>する方法です。三分法の期末調整が不要で、売上原価がリアルタイムでわかります。', def_en:'At the point of sale, records <strong>both the revenue AND the cost of goods sold simultaneously</strong>. No period-end adjustment needed. Cost of goods sold is always up to date — unlike the three-account method.' },
    { term:'しくりくりし', en:'Inventory Adjustment (Period-end)', def:'三分法の期末に行う2つの決算整理仕訳の語呂合わせです。①<strong>（借）仕入／（貸）繰越商品</strong>：期首在庫を仕入に加算。②<strong>（借）繰越商品／（貸）仕入</strong>：期末在庫を仕入から控除。この2仕訳で売上原価が確定します。', def_en:'A mnemonic for the two period-end adjusting entries in the three-account method: ① Dr. Purchases / Cr. Merchandise Inventory — add beginning inventory to purchases; ② Dr. Merchandise Inventory / Cr. Purchases — subtract ending inventory. These two entries calculate the exact cost of goods sold.' },
    { term:'棚卸', en:'Inventory Count', def:'期末に倉庫の商品を実際に数えて帳簿と照合する作業です。帳簿残高より実際が少なければ差額を<strong>棚卸減耗損（費用）</strong>として計上します。年に1回（決算時）行うのが一般的です。', def_en:'Physically counting warehouse stock at period-end to verify it matches the book balance. If actual count is less than the book balance, the difference is recorded as <strong>Inventory Shrinkage Loss (expense)</strong>. Typically done once a year at fiscal year-end.' },
    { term:'先入先出法', en:'FIFO (First-In, First-Out)', def:'先に仕入れた商品から先に売れたと<strong>仮定して払出単価を計算</strong>する方法です。例：100円で買った在庫があるとき、追加で110円で仕入れた場合、次に売れたのは100円の分とみなします。', def_en:'Assumes that the <strong>oldest inventory is sold first</strong>. Example: if you have stock at ¥100 and then buy more at ¥110, the next item sold is costed at ¥100. During inflation, this results in higher reported profits.' },
    { term:'移動平均法', en:'Moving Average Method', def:'仕入のたびに<strong>「（既存在庫金額＋今回仕入金額）÷（既存数量＋今回数量）」で新しい平均単価を計算</strong>し直す方法です。売るたびにその時点の平均単価で原価を計算します。', def_en:'Recalculates the <strong>weighted average unit cost after every purchase</strong>: (existing inventory cost + new purchase cost) ÷ (existing units + new units). Each sale is costed at the current average.' },
    { term:'低価法', en:'Lower of Cost or Market', def:'在庫を<strong>「原価と正味売却価額（時価）のうち低い方」で評価する保守的な方法</strong>です。例：原価1,000円の商品が時価800円に下落→800円で評価し、差額200円を商品評価損（費用）として計上します。', def_en:'Values inventory at the <strong>lower of original cost or net realizable value (market price)</strong>. Example: goods cost ¥1,000 but market price drops to ¥800 → record at ¥800, and recognize ¥200 as Inventory Write-down Loss. Prevents overstating assets.' },
    { term:'棚卸減耗損', en:'Inventory Shrinkage Loss', def:'実際在庫数量が帳簿より少ない場合の差額損失です。原因は<strong>盗難・紛失・腐敗・破損</strong>など。正常範囲の減耗は売上原価に算入し、異常に大きい場合は特別損失として処理します。', def_en:'The loss from actual inventory being less than the book quantity. Causes include <strong>theft, loss, spoilage, or damage</strong>. Normal shrinkage is included in cost of goods sold; abnormal amounts are treated as an extraordinary loss.' },
    { term:'売上原価', en:'Cost of Goods Sold', def:'「<strong>期首繰越商品＋当期仕入高－期末繰越商品</strong>」で計算する、販売した商品の仕入コスト合計です。売上高からこれを差し引くと売上総利益（粗利）になります。', def_en:'The total cost of goods actually sold: <strong>Beginning Inventory + Purchases − Ending Inventory</strong>. Subtracting this from Sales Revenue gives Gross Profit.' },
  ]},
  { category:'⑥ 手形・電子記録', items:[
    { term:'約束手形', en:'Promissory Note', def:'「○月○日に○円払います」という<strong>支払い約束を記した証書</strong>です。振り出した会社→支払手形（負債）、受け取った会社→受取手形（資産）で記録します。約束した期日に銀行を通じて決済されます。', def_en:'A written promise to pay a specific amount on a specified date. The <strong>issuer records Notes Payable (liability); the recipient records Notes Receivable (asset)</strong>. Payment is settled through the bank on the due date.' },
    { term:'為替手形', en:'Bill of Exchange', def:'振出人が第三者（引受人）に「受取人へ○円払え」と命令する<strong>3者間の手形</strong>です。①振出人②引受人③受取人の3者が登場し、約束手形より複雑です。引受人が支払いを承諾することで成立します。', def_en:'A three-party instrument where the <strong>drawer orders a third party (the drawee/acceptor) to pay the payee</strong>. Three parties: ① drawer ② acceptor ③ payee. More complex than a promissory note; becomes binding when the drawee accepts it.' },
    { term:'手形の裏書譲渡', en:'Endorsement Transfer', def:'受け取った手形を<strong>別の支払いに使うために第三者へ渡すこと</strong>です。手形の裏面に署名（裏書）して渡します。裏書した側には「万が一決済されなければ代わりに払う」という遡及債務が残ります。', def_en:'<strong>Transferring a received note to a third party as payment</strong> by signing the back of the note. The endorser retains a contingent liability — if the original issuer defaults, the endorser must pay.' },
    { term:'手形の割引', en:'Discounting Notes', def:'受取手形を<strong>満期前に銀行へ持ち込んで現金化すること</strong>です。残存日数分の利息（手形売却損）が差し引かれます。資金繰りが急に必要なときに利用します。', def_en:'<strong>Cashing a note receivable at a bank before its due date</strong>. The bank deducts interest for the remaining days (recorded as Notes Discounting Loss). Used when immediate cash is needed before the note matures.' },
    { term:'不渡り', en:'Dishonor', def:'手形の期日に銀行へ呈示したが<strong>振出人の口座残高不足等で決済されなかった</strong>状態です。受取側は「受取手形→不渡手形」に振り替えます。同一企業が6か月以内に2回不渡りを出すと銀行取引停止（事実上倒産）になります。', def_en:'When a note is presented to the bank on its due date but <strong>payment fails due to insufficient funds</strong>. The holder reclassifies the note from "Notes Receivable" to "Dishonored Notes." Two dishonors within six months results in bank account suspension — effectively bankruptcy.' },
    { term:'電子記録債権・債務', en:'Electronic Receivables/Payables', def:'「でんさいネット」（電子債権記録機関）に登録する<strong>デジタル版の手形</strong>です。手形と同じ機能で紙がなく、紛失・盗難ゼロ、分割譲渡も可能です。近年急速に普及しています。', def_en:'A <strong>digital equivalent of promissory notes</strong>, registered with Japan\'s electronic credit platform (Densai Net). Same function as paper notes but no physical document — eliminating loss/theft risk and enabling partial transfers. Growing rapidly in usage.' },
    { term:'クレジット売掛金', en:'Credit Card Receivable', def:'クレジットカード決済で売り上げた際に、<strong>カード会社からまだ振り込まれていない代金</strong>を管理する科目です。通常の売掛金と区別して記録し、入金時にカード手数料（支払手数料）が差し引かれます。', def_en:'Tracks the <strong>amount owed by the credit card company</strong> after a card sale. Recorded separately from regular accounts receivable. When payment arrives, the card processing fee (Payment Fees expense) is deducted.' },
  ]},
  { category:'⑦ 固定資産・減価償却', items:[
    { term:'有形固定資産', en:'Tangible Fixed Assets', def:'<strong>形があり長期間使用する資産</strong>で、建物・機械・車両・備品・土地などが該当します。土地を除き使用するにつれて価値が減るため、毎期「減価償却」として費用化します。', def_en:'<strong>Physical assets held for long-term use</strong>: buildings, machinery, vehicles, equipment, land, etc. Except land, these lose value over time, so their cost is gradually expensed through annual depreciation.' },
    { term:'無形固定資産', en:'Intangible Fixed Assets', def:'<strong>形はないが法的な権利や価値を持つ長期資産</strong>です。特許権・商標権・ソフトウェア・のれんなどが該当します。有形固定資産と同様に耐用年数にわたって償却します。', def_en:'<strong>Long-term assets with no physical form but legal rights or value</strong>: patents, trademarks, software, goodwill (のれん), etc. Like tangible assets, they are amortized over their useful life.' },
    { term:'取得原価', en:'Acquisition Cost', def:'固定資産を取得するためにかかった<strong>購入代金＋すべての附随費用（運送費・据付費・試運転費など）</strong>の合計です。この金額が減価償却の計算の出発点になります。', def_en:'The <strong>total cost to acquire a fixed asset: purchase price plus all incidental costs</strong> (shipping, installation, test runs, etc.). This total is the starting point for depreciation calculations.' },
    { term:'帳簿価額', en:'Book Value', def:'固定資産の現在の帳簿上の価値で「<strong>取得原価－減価償却累計額</strong>」で計算します。「簿価」とも呼ばれます。売却・除却時にこれと売却額の差額が売却益・売却損になります。', def_en:'The current value of a fixed asset on the books: <strong>Acquisition Cost minus Accumulated Depreciation</strong>. Also called "carrying amount" or "book value." The difference between this and the sale price is the gain or loss on disposal.' },
    { term:'耐用年数', en:'Useful Life', def:'固定資産が使用に耐えると見込まれる<strong>年数</strong>です。税法で資産の種類ごとに「法定耐用年数」が定められており、例えば木造建物30年・乗用車6年などです。', def_en:'The estimated number of years a fixed asset can be usefully employed. <strong>Legally prescribed useful lives</strong> (e.g., wooden buildings: 30 years, passenger cars: 6 years) are set by tax law and used as the basis for depreciation.' },
    { term:'定額法', en:'Straight-line Method', def:'「<strong>（取得原価－残存価額）÷ 耐用年数</strong>」で毎年同額を償却する方法です。例：取得原価1,000円、残存価額0円、耐用年数5年なら毎年200円。計算がシンプルで建物・ソフトウェアに多く使われます。', def_en:'Depreciates equal amounts every year: <strong>(Cost − Residual Value) ÷ Useful Life</strong>. Example: cost ¥1,000, residual ¥0, 5 years → ¥200/year. Simple to calculate; commonly used for buildings and software.' },
    { term:'定率法', en:'Declining Balance Method', def:'毎年の<strong>期首帳簿価額（未償却残高）×一定率</strong>で償却額を計算する方法です。最初の年が最も償却額が多く年々減少します。機械・車両など初期に価値が大きく下がる資産に使われます。', def_en:'Applies a <strong>fixed percentage to the remaining book value</strong> each year. Depreciation is highest in early years and decreases over time. Suited for machinery and vehicles that lose value faster when new.' },
    { term:'間接法', en:'Indirect Method (Depreciation)', def:'減価償却の仕訳を「<strong>（借）減価償却費 ／（貸）減価償却累計額</strong>」と記録する方法です。固定資産の取得原価は帳簿に残し、累計額を別科目で管理します。B/S上で「建物1,000 △累計額600 ＝簿価400」と表示されます。', def_en:'Records depreciation as: <strong>Dr. Depreciation Expense / Cr. Accumulated Depreciation</strong>. The original acquisition cost stays on the books; the running total of depreciation is in a separate account. The balance sheet shows: "Building ¥1,000 − Acc. Dep. ¥600 = Book Value ¥400."' },
    { term:'資本的支出', en:'Capital Expenditure', def:'固定資産の<strong>性能を向上させたり耐用年数を延ばす改良工事</strong>への支出です。資産の取得原価に加算して資産計上します。例：エアコン増設→資本的支出。単なる修理→収益的支出（修繕費）。', def_en:'Spending that <strong>improves performance or extends the useful life</strong> of a fixed asset. Added to the asset\'s acquisition cost (capitalized). Example: installing additional air conditioning = capital expenditure; routine repairs = revenue expenditure (expense).' },
    { term:'収益的支出', en:'Revenue Expenditure', def:'固定資産を<strong>現状維持・原状回復するための修繕費用</strong>で、当期の費用（修繕費）として計上します。資産の価値を上げるものではなく、壊れた部分を元に戻す支出です。', def_en:'Spending to <strong>maintain or restore a fixed asset to its original condition</strong>. Expensed immediately as Repairs Expense. It doesn\'t add value or extend life — it just keeps the asset working as before.' },
    { term:'ファイナンス・リース', en:'Finance Lease', def:'実質的に<strong>分割払いで資産を購入するのと同じリース契約</strong>です。「リース資産（資産）／リース債務（負債）」として帳簿に計上し、毎期減価償却します。リース料の支払いは元本返済＋利息の扱いです。', def_en:'A lease that is <strong>economically equivalent to buying an asset on installments</strong>. Record "Lease Asset (asset) / Lease Liability (liability)" on the books and depreciate annually. Each lease payment is split into principal repayment and interest.' },
    { term:'オペレーティング・リース', en:'Operating Lease', def:'通常の<strong>賃貸借（レンタル）と同様に扱うリース</strong>です。資産・負債に計上せず、支払いのたびに「支払リース料（費用）」を計上するだけです。カーリースや機器レンタルが典型例です。', def_en:'Treated like a regular <strong>rental agreement</strong>. No asset or liability is recorded; each payment is simply expensed as "Lease Payments." Car leases and equipment rentals are typical examples.' },
    { term:'圧縮記帳', en:'Compression Entry', def:'国庫補助金や保険差益を受け取って固定資産を取得したとき、<strong>帳簿価額を圧縮（下げる）ことで課税を将来に繰り延べる処理</strong>です。「固定資産圧縮損（費用）」を計上して取得価額を引き下げます。', def_en:'When an asset is acquired using a government grant or insurance proceeds, the <strong>book value is reduced to defer tax liability into future years</strong>. Record "Asset Compression Loss (expense)" to reduce the acquisition cost.' },
  ]},
  { category:'⑧ 有価証券', items:[
    { term:'売買目的有価証券', en:'Trading Securities', def:'<strong>短期の値上がり益狙いで保有する株式・債券</strong>です。期末に時価評価し、取得原価との差額を「有価証券評価益（収益）」または「有価証券評価損（費用）」として損益計上します。翌期首に取得原価へ戻す洗替法を使います。', def_en:'Stocks or bonds held for <strong>short-term capital gains</strong>. At year-end, mark to fair value; record the difference as "Securities Valuation Gain (revenue)" or "Loss (expense)." The "reset method" reverses the entry at the start of next year.' },
    { term:'満期保有目的債券', en:'Held-to-maturity Securities', def:'<strong>満期まで保有し続ける前提で購入した債券</strong>です。時価評価は行いません。取得価額と額面の差額を満期まで毎期少しずつ帳簿価額に加算（または減算）する「償却原価法」を適用します。', def_en:'Bonds purchased with the <strong>intent to hold until maturity</strong>. Not revalued at fair value. Instead, the difference between acquisition cost and face value is gradually adjusted each year using the amortized cost method.' },
    { term:'その他有価証券', en:'Available-for-sale Securities', def:'売買目的でも満期保有目的でもない<strong>長期保有目的の株式・債券</strong>です。期末に時価評価しますが、差額は損益ではなく純資産の「その他有価証券評価差額金」に計上します（損益に影響しない点が特徴）。', def_en:'Securities held for the <strong>long term</strong>, but not classified as trading or held-to-maturity. Revalued at fair value at year-end, but the difference goes to equity ("Other Securities Valuation Difference") — not to the income statement.' },
    { term:'洗替法', en:'Mark-to-Market (Reset Method)', def:'期末に有価証券の評価差額を計上した後、<strong>翌期首に前期末の仕訳を逆仕訳して帳簿価額を取得原価に戻す方法</strong>です。毎期同じ取得原価からスタートするため差額管理がシンプルです。', def_en:'After recording the year-end valuation entry, <strong>reverses it at the start of next year</strong>, resetting the book value back to acquisition cost. Each year starts fresh from the original cost, making it easy to track changes.' },
    { term:'切放法', en:'Cost Retention Method', def:'期末の評価差額を翌期首に戻さず<strong>そのまま引き継ぐ方法</strong>です。洗替法と対比して覚えましょう。なお、売買目的有価証券には切放法の適用が認められていません。', def_en:'Keeps the year-end valuation adjustment as-is into the next year — <strong>no reversal</strong>. Contrast with the reset method. Note: the cost retention method is not permitted for trading securities.' },
    { term:'償却原価法', en:'Amortized Cost Method', def:'取得価額と額面の差額を<strong>満期まで毎期均等に帳簿価額へ加算（または減算）していく方法</strong>です。例：額面1,000円の債券を970円で購入した場合、差額30円を満期まで毎期少しずつ加算して最終的に1,000円になります。', def_en:'Gradually adjusts the bond\'s book value toward face value over its life. Example: buy a ¥1,000 face-value bond for ¥970 — the ¥30 discount is <strong>added to book value in equal annual installments</strong> until it reaches ¥1,000 at maturity.' },
  ]},
  { category:'⑨ 引当金・評価勘定', items:[
    { term:'引当金', en:'Allowance / Reserve', def:'将来発生が見込まれる費用や損失を<strong>あらかじめ当期に計上しておく負債（または資産の控除）</strong>です。4要件：①将来費用等の原因、②当期以前に原因がある、③発生可能性が高い、④金額を合理的に見積もれる。例：来年回収できなくなりそうな売掛金に備えて当期に貸倒引当金を計上。', def_en:'An estimated liability (or asset contra account) that <strong>recognizes a future expense or loss in the current period</strong>. Four requirements: ① future expense expected; ② cause exists in current or prior period; ③ likely to occur; ④ amount can be reasonably estimated. Example: setting aside an allowance for doubtful accounts this year because a receivable may go bad next year.' },
    { term:'評価勘定', en:'Valuation Account', def:'資産（または負債）の帳簿価額を<strong>間接的にマイナス調整するための対照科目</strong>です。代表例：貸倒引当金（売掛金の控除）、減価償却累計額（固定資産の控除）。B/S上で「売掛金500 △引当金20 ＝実質480」のように表示します。', def_en:'A <strong>contra account that indirectly reduces the book value</strong> of an asset (or liability). Examples: Allowance for Doubtful Accounts (contra to Accounts Receivable), Accumulated Depreciation (contra to Fixed Assets). Shown on the balance sheet as "A/R ¥500 − Allowance ¥20 = Net ¥480."' },
    { term:'差額補充法', en:'Allowance Adjustment Method', def:'引当金の<strong>期末残高と当期必要額の差額だけを追加計上（または取り崩し）する方法</strong>です。例：貸倒引当金残高100円、必要額130円なら差額30円だけ繰入れます。仕訳が少なく効率的です。', def_en:'Only records the <strong>difference between the current allowance balance and the required amount</strong>. Example: current Allowance for Doubtful Accounts = ¥100, required = ¥130 → record only ¥30 additional. Fewer journal entries than the full reversal method.' },
    { term:'洗替法（引当金）', en:'Full Reversal Method', def:'毎期初めに前期の引当金残高を全額取り崩してゼロにし、<strong>改めて当期必要額を全額新規計上する方法</strong>です。仕訳は2本必要になりますが、当期の繰入額がはっきりわかります。', def_en:'At the start of each period, <strong>fully reverses the prior balance to zero, then records the full new amount needed</strong>. Requires two entries per period but makes the current year\'s expense amount explicit.' },
    { term:'退職給付引当金', en:'Retirement Benefit Obligation', def:'将来支払う退職金の見積額を<strong>毎期少しずつ負債として積み立てる勘定</strong>です。「（借）退職給付費用 ／（貸）退職給付引当金」と仕訳し、実際に退職金を支払ったときに引当金を取り崩します。', def_en:'A liability built up gradually each year to cover <strong>estimated future retirement benefit payments</strong>. Entry: Dr. Retirement Benefit Expense / Cr. Retirement Benefit Obligation. When actual retirement payments are made, the liability is reduced.' },
  ]},
  { category:'⑩ 資本・株式', items:[
    { term:'純資産', en:'Net Assets / Equity', def:'「<strong>資産－負債＝純資産</strong>」で計算される、会社が実質的に所有する財産です。株主が出資したお金＋これまでに稼いだ利益の積み上げです。資本金・利益剰余金・自己株式などで構成されます。', def_en:'The residual interest after subtracting liabilities from assets: <strong>Assets − Liabilities = Net Assets (Equity)</strong>. Represents the shareholders\' stake — paid-in capital plus accumulated profits. Consists of capital stock, retained earnings, treasury stock, etc.' },
    { term:'法定準備金', en:'Legal Reserve', def:'会社法で積み立てが義務付けられた準備金です。<strong>資本準備金</strong>（株式発行時の払込余剰分）と<strong>利益準備金</strong>（配当時に利益から積み立てる分）の2種類があります。損失補填・資本組入れ以外には使えません。', def_en:'Reserves <strong>required by the Companies Act</strong>. Two types: <strong>Capital Reserve</strong> (from share issuance proceeds above par) and <strong>Legal Earnings Reserve</strong> (set aside from dividends). Can only be used to cover losses or incorporated into capital stock.' },
    { term:'任意積立金', en:'Voluntary Reserve', def:'法律上の義務ではなく<strong>会社が目的を決めて自由に積み立てる剰余金</strong>です。「別途積立金」「新築積立金」などがあります。株主総会の決議で設定でき、目的が達成されたら取り崩します。', def_en:'Reserves <strong>voluntarily set aside by the company for self-determined purposes</strong> — e.g., "General Reserve," "Building Fund." Created and dissolved by shareholder resolution once the purpose is achieved.' },
    { term:'自己株式', en:'Treasury Stock', def:'自社が発行した株式を市場から<strong>買い戻した株式（金庫株）</strong>です。純資産のマイナス項目として貸借対照表に計上されます。再発行（処分）や消却ができます。', def_en:'Shares of the company\'s own stock that it has <strong>repurchased from the market</strong>. Shown as a deduction from equity on the balance sheet. Can be reissued (disposed of) or cancelled.' },
    { term:'新株予約権', en:'Stock Warrants', def:'将来<strong>一定価格で自社株を購入できる権利</strong>です。ストックオプション（役員・社員向けのインセンティブ）や転換社債に組み込まれます。発行時は純資産の一部（新株予約権）に計上します。', def_en:'The right to <strong>purchase company shares at a fixed price in the future</strong>. Used in stock option plans (employee/executive incentives) and convertible bonds. Recorded as part of equity (Stock Warrants) when issued.' },
    { term:'株主資本', en:'Shareholders\' Equity', def:'純資産のうち<strong>資本金・資本剰余金・利益剰余金・自己株式からなる部分</strong>です。新株予約権やその他有価証券評価差額金は株主資本には含まれない点に注意です。', def_en:'The component of equity comprising <strong>capital stock, capital surplus, retained earnings, and treasury stock</strong>. Note: stock warrants and other securities valuation differences are part of net assets but NOT part of shareholders\' equity.' },
    { term:'配当', en:'Dividend', def:'会社の利益を<strong>株主に分配すること</strong>です。株主総会で金額が決議されると「未払配当金（負債）」を計上し、実際に支払ったときに取り崩します。配当時は同時に配当額の10分の1（利益準備金の積立上限まで）を利益準備金に積み立てます。', def_en:'Distributing company profits to shareholders. When declared at the annual meeting, record <strong>Dividends Payable (liability)</strong>; remove it when paid. Simultaneously, set aside 1/10 of the dividend amount as Legal Earnings Reserve (until the statutory limit is reached).' },
    { term:'増資', en:'Capital Increase', def:'新株を発行して投資家から<strong>新たに出資を募り、資本金を増やすこと</strong>です。払込金額の<strong>最大2分の1まで資本準備金</strong>に積み立て、残りを資本金とします。', def_en:'Issuing new shares to <strong>raise additional capital</strong>. Up to <strong>half of the proceeds can be allocated to Capital Reserve</strong>; the rest goes to Capital Stock.' },
  ]},
  { category:'⑪ 決算整理', items:[
    { term:'発生主義', en:'Accrual Basis', def:'<strong>現金の動きに関係なく、取引が発生した時点で収益・費用を認識する</strong>原則です。例：12月に仕事を完了して翌1月に入金でも、収益は12月に計上します。日本の企業会計の基本原則です。', def_en:'Recognizes revenues and expenses <strong>when they are earned or incurred — regardless of when cash changes hands</strong>. Example: work completed in December but paid in January → record revenue in December. The foundation of corporate accounting.' },
    { term:'現金主義', en:'Cash Basis', def:'<strong>実際に現金を受け取ったときに収益、支払ったときに費用を認識</strong>する方法です。家計簿や小規模事業では使いやすいですが、企業会計では発生主義が原則です。', def_en:'Recognizes revenue when <strong>cash is received</strong> and expenses when <strong>cash is paid</strong>. Simple for personal finances or small businesses, but corporate accounting requires the accrual basis.' },
    { term:'費用収益対応の原則', en:'Matching Principle', def:'<strong>収益に対応する費用は同じ期間に計上する</strong>原則です。例：3月に売れた商品の仕入コストは3月の費用（売上原価）として計上し、4月に計上しない。期ずれを防ぐためのルールです。', def_en:'<strong>Expenses must be recognized in the same period as the revenues they helped generate</strong>. Example: the cost of goods sold in March must be expensed in March — not April. Prevents income from being shifted between periods.' },
    { term:'前払費用', en:'Prepaid Expenses', def:'当期に支払ったが<strong>来期以降の期間に対応する費用の分を資産に振り替えた金額</strong>です。例：4月から1年分の火災保険料12,000円を当期3月に支払った場合、4月以降の11か月分11,000円を前払費用（資産）として翌期に繰り延べます。', def_en:'The portion of a payment made this period that <strong>covers future periods — reclassified as an asset</strong>. Example: pay ¥12,000 for a 12-month insurance policy in March; the ¥11,000 covering April onward is recorded as Prepaid Expense (asset) and expensed next year.' },
    { term:'前受収益', en:'Deferred Revenue', def:'当期に受け取ったが<strong>来期以降の期間に対応する収益の分を負債に振り替えた金額</strong>です。例：4月から1年分の家賃を当期3月に受け取った場合、4月以降の分を前受収益（負債）として翌期に繰り延べます。', def_en:'Money received this period that <strong>covers future periods — reclassified as a liability</strong> (obligation to provide future service). Example: receive a full year\'s rent in March; the portion covering April onward is Deferred Revenue (liability).' },
    { term:'未払費用', en:'Accrued Expenses', def:'当期中にすでに発生しているのに<strong>まだ支払っていない費用を負債として計上</strong>します。例：12月31日が決算で1〜12月分の給料のうち12月分がまだ未払いなら「未払給料（負債）」を計上します。', def_en:'Expenses already incurred this period but <strong>not yet paid — recorded as a liability</strong>. Example: fiscal year ends December 31; December\'s salary not yet paid → record "Accrued Salaries Payable (liability)".' },
    { term:'未収収益', en:'Accrued Revenue', def:'当期中にすでに稼いでいるのに<strong>まだ受け取っていない収益を資産として計上</strong>します。例：12月分の受取利息がまだ入金されていない場合、「未収利息（資産）」を計上します。', def_en:'Revenue already earned this period but <strong>not yet received — recorded as an asset</strong>. Example: interest earned in December not yet received → record "Accrued Interest Receivable (asset)".' },
    { term:'継続性の原則', en:'Consistency Principle', def:'一度採用した会計方針（在庫評価方法・減価償却方法など）を<strong>正当な理由なく変更してはならない</strong>原則です。変更すると過年度比較が不可能になり、恣意的な利益調整ができてしまいます。', def_en:'Once adopted, accounting methods (inventory valuation, depreciation method, etc.) must <strong>not be changed without good reason</strong>. Arbitrary changes would make year-over-year comparisons meaningless and enable earnings manipulation.' },
    { term:'保守主義の原則', en:'Conservatism Principle', def:'<strong>利益は控えめに（過大計上しない）、損失は早めに（先取りして）認識する</strong>原則です。在庫の低価法評価・引当金の積み立て・減価償却などがこの原則に基づいています。', def_en:'<strong>Recognize revenues conservatively (don\'t overstate); recognize losses promptly (don\'t delay)</strong>. This principle underlies lower-of-cost-or-market inventory valuation, allowance accruals, and depreciation policies.' },
    { term:'重要性の原則', en:'Materiality Principle', def:'<strong>金額的に重要でない項目は簡便な処理が認められる</strong>原則です。例：10円の消耗品を購入時に全額費用計上する（資産計上して減価償却しない）のはこの原則が根拠です。', def_en:'Items that are <strong>not material (insignificant in amount) may be treated in a simplified way</strong>. Example: expensing a ¥10 supply item immediately rather than capitalizing and depreciating it is justified by this principle.' },
    { term:'繰延資産', en:'Deferred Assets', def:'すでに現金を支払ったが<strong>将来の期間に分けて費用計上する特殊な資産</strong>です。創立費・開業費・株式交付費・社債発行費の4種類があり、支出後5年以内（社債発行費は3年以内）に均等償却します。', def_en:'Costs already paid but <strong>spread (amortized) as expenses over future periods</strong>. Four types: incorporation costs, startup costs, stock issuance costs, and bond issuance costs. Amortized within 5 years (3 years for bond issuance costs).' },
  ]},
  { category:'⑫ 税金', items:[
    { term:'消費税（税込処理）', en:'Tax Inclusive Method', def:'本体価格＋消費税を<strong>区別せずにまとめて記録する方法</strong>です。仕訳がシンプルですが、決算時に消費税相当額を仮払消費税・仮受消費税へ振り替える調整が必要です。', def_en:'Records prices <strong>inclusive of consumption tax without separating them</strong>. Simpler entries day-to-day, but requires a period-end adjustment to separate the tax portion from the base amount.' },
    { term:'消費税（税抜処理）', en:'Tax Exclusive Method', def:'<strong>本体価格と消費税を分けて記録する方法</strong>です。仕入時→仮払消費税（資産）、売上時→仮受消費税（負債）を計上し、決算時に差額を未払消費税（負債）として確定します。3級の標準的な処理です。', def_en:'<strong>Separates the tax amount from the base price</strong> in every entry. Purchases: record Deferred Input Tax (asset); Sales: record Deferred Output Tax (liability). At year-end, net the two to get Taxes Payable. Standard method for Level 3.' },
    { term:'税効果会計', en:'Tax Effect Accounting', def:'会計上の利益と税務上の課税所得の<mark>一時的なズレ（一時差異）を繰延税金資産・繰延税金負債で調整する処理</mark>です。例：会計では当期費用だが税務では翌期損金→繰延税金資産を計上して当期の税負担を正しく反映します。', def_en:'Adjusts for <mark>temporary differences between accounting income and taxable income</mark> using Deferred Tax Assets/Liabilities. Example: an expense recognized for accounting purposes this year but deductible for tax next year → record a Deferred Tax Asset to reflect the correct tax expense this period.' },
    { term:'一時差異', en:'Temporary Difference', def:'会計と税法の処理時期のズレで<strong>将来に解消する差異</strong>です。将来の節税につながる差異→繰延税金資産を計上。将来に税負担が増える差異→繰延税金負債を計上します。', def_en:'A timing difference between accounting and tax treatment that <strong>reverses in future periods</strong>. Differences that reduce future taxes → Deferred Tax Asset. Differences that increase future taxes → Deferred Tax Liability.' },
    { term:'法人税の中間申告', en:'Interim Tax Filing', def:'法人税は年1回確定申告ですが、<strong>期の途中（6か月経過後）に前年法人税額の50%を先払いする制度</strong>があります。先払い分は「仮払法人税等（資産）」に計上し、決算後の確定申告で精算します。', def_en:'Corporate tax is filed annually, but companies must <strong>prepay 50% of the prior year\'s tax amount at the midpoint of the fiscal year</strong>. Record this as "Prepaid Corporate Tax (asset)" and settle it against the final tax liability at year-end.' },
  ]},
  { category:'⑬ 伝票会計', items:[
    { term:'入金伝票', en:'Receipt Voucher', def:'<strong>現金を受け取った取引を記録する伝票</strong>です。借方は必ず「現金」になります。記入するのは貸方科目（何を対価に現金を受け取ったか）だけです。例：売掛金を現金で回収→入金伝票の貸方「売掛金○○円」と記入。', def_en:'A voucher recording <strong>cash receipts</strong>. The debit side is always Cash. Only the credit account (what you received cash in exchange for) needs to be written. Example: collecting a receivable in cash → credit side "Accounts Receivable ¥XX".' },
    { term:'出金伝票', en:'Payment Voucher', def:'<strong>現金を支払った取引を記録する伝票</strong>です。貸方は必ず「現金」になります。記入するのは借方科目（何のために現金を払ったか）だけです。例：消耗品を現金で購入→出金伝票の借方「消耗品費○○円」と記入。', def_en:'A voucher recording <strong>cash payments</strong>. The credit side is always Cash. Only the debit account (what you paid cash for) needs to be written. Example: buying supplies with cash → debit side "Supplies Expense ¥XX".' },
    { term:'振替伝票', en:'Transfer Voucher', def:'<strong>現金が動かない取引を記録する伝票</strong>です。掛け売買・手形取引・決算整理仕訳などに使います。借方・貸方の両方を記入します。', def_en:'Records <strong>transactions that do not involve cash</strong> — credit sales, note transactions, adjusting entries, etc. Both debit and credit sides must be fully written out.' },
    { term:'仕訳日計表', en:'Daily Summary Journal', def:'入金・出金・振替の3種の伝票を<strong>勘定科目ごとに集計して1日分にまとめた一覧表</strong>です。これを使って元帳へ転記します。大量取引のある会社では毎日の伝票を個別転記せずに日計表経由でまとめて転記できます。', def_en:'A <strong>daily summary of all three voucher types</strong> (receipts, payments, transfers), totaled by account. Used to post to the ledger. In high-volume companies, instead of posting each voucher individually, totals from this sheet are posted once a day.' },
  ]},
  { category:'⑭ 本支店会計', items:[
    { term:'本支店会計', en:'Head Office / Branch Accounting', def:'本社と支店が<strong>それぞれ独立した帳簿で仕訳・記録を行う会計方式</strong>です。本社の帳簿には「支店（資産科目）」、支店の帳簿には「本店（純資産的科目）」が計上されます。決算時に両方を合算して合計財務諸表を作ります。', def_en:'An accounting structure where <strong>the head office and each branch maintain independent sets of books</strong>. The head office records a "Branch" asset; the branch records a "Head Office" equity-like account. At year-end, both sets are combined into consolidated financial statements.' },
    { term:'内部取引の消去', en:'Elimination of Internal Transactions', def:'本支店を合算する決算で、<strong>本社の「支店」勘定と支店の「本店」勘定を相殺消去する処理</strong>です。消去しないと同じ取引が本社と支店の両方に計上されて資産・利益が二重になります。', def_en:'In the combined year-end closing, <strong>the head office\'s "Branch" account and the branch\'s "Head Office" account cancel each other out</strong>. Without this elimination, the same transaction would appear on both sets of books, overstating assets and profits.' },
    { term:'未達取引', en:'In-transit Transactions', def:'本社が処理済みだが<strong>支店にまだ連絡・物が届いていない取引</strong>（または逆）のことです。合算前に未達側（支店または本社）で対応する仕訳を追加して残高を一致させます。', def_en:'Transactions that <strong>one side has recorded but the other side has not yet received or been notified of</strong>. Before combining the books, the uninformed side must record the missing entries so that both sets of books agree.' },
  ]},
  { category:'⑮ 工業簿記・原価計算', items:[
    { term:'原価計算', en:'Cost Accounting', def:'製品1単位あたりの<strong>製造コストを計算する仕組み</strong>です。材料費・労務費・製造間接費の3要素に分けて集計します。原価を正確に把握することで、適切な販売価格の設定や利益管理が可能になります。', def_en:'A system for <strong>calculating the cost to manufacture each unit of product</strong>. Costs are classified into three elements: materials, labor, and manufacturing overhead. Accurate cost data enables proper pricing and profit management.' },
    { term:'原価の3要素', en:'Three Cost Elements', def:'製造原価を構成する<strong>①材料費（木材・鉄など物にかかるコスト）②労務費（工場で働く人の給料）③製造間接費（工場の電気代・設備の減価償却など）</strong>の3種類です。これらが仕掛品（製造中の品）に集まり、完成したら製品へ移ります。', def_en:'The three components of manufacturing cost: <strong>① Materials (wood, steel, etc.); ② Labor (factory worker wages); ③ Manufacturing Overhead (electricity, equipment depreciation, etc.)</strong>. All three accumulate in WIP (Work in Process) and transfer to Finished Goods when complete.' },
    { term:'直接費', en:'Direct Costs', def:'<strong>特定の製品に直接結びつけられる費用</strong>です。主要材料（その製品に使った木材など）や直接工の賃金（その製品を作った工員の給料）が代表例です。仕掛品勘定に直接集計します。', def_en:'Costs that can be <strong>directly traced to a specific product</strong>: direct materials (the main materials in that product) and direct labor (wages of workers who made that product). Charged directly to the WIP account.' },
    { term:'間接費', en:'Indirect Costs', def:'複数の製品に共通してかかり<strong>特定の製品に直接割り当てられない費用</strong>です。工場の電気代・補助材料（油・接着剤）・間接工の賃金・設備の減価償却費などが該当します。製造間接費として集計し、一定の基準（配賦）で各製品に配分します。', def_en:'Costs <strong>shared across multiple products that cannot be directly traced to any single one</strong>: factory electricity, lubricants, indirect labor wages, equipment depreciation, etc. Pooled as "Manufacturing Overhead" and then allocated to products using a predetermined rate.' },
    { term:'配賦', en:'Cost Allocation', def:'製造間接費を<strong>一定の基準（配賦基準）で各製品に割り振る計算</strong>です。計算式：製造間接費合計 ÷ 配賦基準合計 × 各製品の基準値。配賦基準には直接作業時間・機械稼働時間・直接材料費などが使われます。', def_en:'The process of <strong>distributing manufacturing overhead to each product</strong> using a predetermined basis. Formula: Total Overhead ÷ Total Allocation Basis × Each Product\'s Share. Common bases: direct labor hours, machine hours, or direct material cost.' },
    { term:'予定配賦', en:'Predetermined Allocation', def:'実際の間接費が集計される前に<strong>あらかじめ決めた予定配賦率で間接費を配賦する方法</strong>です。予定配賦率＝年間予算間接費÷年間予算配賦基準。月次で迅速に原価計算できますが、実際との差（配賦差異）が生じます。', def_en:'Allocates overhead using a <strong>rate fixed in advance</strong>, before actual costs are known. Rate = Annual budgeted overhead ÷ Annual budgeted allocation base. Enables timely monthly costing but creates a variance between actual and applied overhead.' },
    { term:'配賦差異', en:'Allocation Variance', def:'予定配賦額と実際間接費の差額です。<strong>実際 ＞ 予定 → 不利差異（借方差異：コストオーバー）、実際 ＜ 予定 → 有利差異（貸方差異：コスト節約）</strong>となります。期末に売上原価などに一括処理します。', def_en:'The difference between applied overhead and actual overhead. <strong>Actual > Applied → Unfavorable (debit) variance (cost overrun); Actual < Applied → Favorable (credit) variance (cost savings)</strong>. Closed to Cost of Goods Sold at period-end.' },
    { term:'個別原価計算', en:'Job Order Costing', def:'<strong>オーダー（製造指図書）ごとに原価を個別集計する方法</strong>です。建設・印刷・造船など受注生産に向いています。指図書に材料費・労務費・間接費を記入し、完成したら製品原価が確定します。', def_en:'<strong>Accumulates costs separately for each job order</strong>. Suited for custom/job-shop production: construction, printing, shipbuilding, etc. Material, labor, and overhead costs are recorded on a job cost sheet; total cost is finalized when the job is complete.' },
    { term:'総合原価計算', en:'Process Costing', def:'大量生産で<strong>一定期間（月単位）の総製造コストを総生産量で割って単位原価を求める方法</strong>です。食品・化学・自動車部品など規格品の連続生産に向いています。月末仕掛品の完成品換算が計算の要です。', def_en:'For mass production: <strong>divides the total manufacturing cost of a period by total units produced</strong> to get the cost per unit. Suited for continuous production of standard goods (food, chemicals, auto parts). Calculating equivalent units for WIP is the key step.' },
    { term:'標準原価計算', en:'Standard Costing', def:'あらかじめ設定した<strong>目標原価（標準原価）と実際原価を比較して差異を分析する方法</strong>です。コスト管理・業績評価に役立ちます。差異分析（価格差異・数量差異・能率差異・操業度差異）が核心です。', def_en:'Sets a <strong>target cost (standard cost) in advance and analyzes variances from actual costs</strong>. Essential for cost control and performance evaluation. Key variances include price, quantity, efficiency, and volume variances.' },
    { term:'不利差異', en:'Unfavorable Variance', def:'標準原価計算で<strong>実際原価 ＞ 標準原価の差額</strong>です。「借方差異」ともいいます。予定より余計にコストがかかった状態で、原因を調査してコスト削減につなげます。', def_en:'In standard costing, occurs when <strong>actual cost exceeds standard cost</strong>. Also called "debit variance." Indicates a cost overrun — management should investigate the cause and take corrective action.' },
    { term:'有利差異', en:'Favorable Variance', def:'標準原価計算で<strong>実際原価 ＜ 標準原価の差額</strong>です。「貸方差異」ともいいます。予定より少ないコストで済んだ状態ですが、品質低下や無理な節約が原因のこともあるため注意が必要です。', def_en:'In standard costing, occurs when <strong>actual cost is less than standard cost</strong>. Also called "credit variance." Indicates cost savings, but may reflect reduced quality or unsustainable shortcuts — don\'t automatically assume it\'s positive.' },
    { term:'CVP分析', en:'Cost-Volume-Profit Analysis', def:'<strong>売上高・費用（固定費＋変動費）・利益の関係を分析する手法</strong>です。損益分岐点（利益がゼロになる売上高）を計算し、「いくら売れば黒字になるか」「あといくら売れば目標利益を達成できるか」を把握します。', def_en:'Analyzes the <strong>relationships between sales volume, costs (fixed + variable), and profit</strong>. Calculates the break-even point (where profit = zero) and answers questions like "How much do we need to sell to break even?" or "How much more to hit our target profit?"' },
    { term:'損益分岐点', en:'Break-even Point', def:'<strong>売上高 ＝ 総費用（固定費＋変動費）となり利益がゼロになる売上高</strong>です。計算式：固定費 ÷（1 − 変動費率）。これを超えた売上は利益、下回ると損失になります。', def_en:'The sales level at which <strong>total revenue equals total costs (profit = zero)</strong>. Formula: Fixed Costs ÷ (1 − Variable Cost Ratio). Sales above this point generate profit; below it, a loss.' },
    { term:'貢献利益', en:'Contribution Margin', def:'<strong>売上高から変動費だけを引いた利益</strong>です。「変動費を回収した後、固定費の回収と利益の獲得にあてられる金額」です。貢献利益 ÷ 売上高 ＝ 貢献利益率（限界利益率）。', def_en:'<strong>Sales Revenue minus Variable Costs</strong>. Represents "the amount available to cover fixed costs and generate profit after variable costs are recovered." Contribution Margin Ratio = Contribution Margin ÷ Sales.' },
    { term:'直接原価計算', en:'Variable Costing', def:'<strong>変動製造原価だけを製品原価に含め、固定製造原価は発生した期の費用として即時計上</strong>する方法です。利益が在庫量に左右されにくく、意思決定（追加受注など）に役立ちます。財務報告では使えません。', def_en:'<strong>Includes only variable manufacturing costs in product cost</strong>; fixed manufacturing overhead is expensed immediately in the period incurred. Profit is less affected by inventory changes, making it useful for internal decision-making. Not permitted for external financial reporting.' },
    { term:'全部原価計算', en:'Absorption Costing', def:'<strong>固定費・変動費を問わず、すべての製造原価を製品原価に含める</strong>方法です。財務会計（外部報告）では全部原価計算が義務づけられています。直接原価計算と営業利益が異なる理由は在庫に固定費が含まれるかどうかの違いです。', def_en:'<strong>Includes ALL manufacturing costs — both variable and fixed — in product cost</strong>. Required for external financial reporting. Operating profit differs from variable costing because fixed overhead is embedded in inventory under this method.' },
    { term:'固定費調整', en:'Fixed Cost Adjustment', def:'直接原価計算の営業利益を全部原価計算の営業利益に合わせる計算です。<strong>直接原価計算利益 ＋（期末在庫×固定費率）－（期首在庫×固定費率）＝ 全部原価計算利益</strong>となります。', def_en:'Reconciles variable costing profit to absorption costing profit: <strong>Variable Costing Profit + (Ending Inventory × Fixed Cost Rate) − (Beginning Inventory × Fixed Cost Rate) = Absorption Costing Profit</strong>.' },
    { term:'製造原価報告書', en:'Cost of Production Report', def:'当期の<strong>材料費・労務費・製造間接費の内訳と当期製品製造原価を示す報告書</strong>です。損益計算書の「売上原価」に使う「当期製品製造原価」の計算過程を示す内訳書です。', def_en:'A report showing the <strong>breakdown of manufacturing costs (materials, labor, overhead) and the total cost of goods manufactured for the period</strong>. It is the supporting schedule for the "Cost of Goods Sold" line on the income statement.' },
    { term:'当期製品製造原価', en:'Cost of Goods Manufactured', def:'当期に<strong>完成した製品にかかった原価の合計</strong>です。計算式：期首仕掛品原価 ＋ 当期総製造費用 − 期末仕掛品原価。損益計算書の売上原価の計算に使います。', def_en:'The <strong>total manufacturing cost of products completed during the period</strong>. Formula: Beginning WIP + Total Manufacturing Costs − Ending WIP. Used to calculate Cost of Goods Sold on the income statement.' },
    { term:'完成品換算量', en:'Equivalent Units', def:'総合原価計算で<strong>仕掛品（半製品）を完成品に換算した仮想の数量</strong>です。例：進捗度50%の仕掛品100個は完成品換算量50個。加工費は進捗度で換算し、材料費は投入タイミングで扱いが異なります。', def_en:'In process costing, the <strong>hypothetical number of "complete" units that WIP is equivalent to</strong>. Example: 100 units at 50% completion = 50 equivalent units. Conversion costs use the percentage-complete rate; direct materials depend on when they are added to the process.' },
    { term:'月末仕掛品の評価', en:'Valuation of WIP (End)', def:'総合原価計算で期末に残る仕掛品に原価を割り当てる計算です。<strong>平均法</strong>（全体の平均単価で均等配分）と<strong>先入先出法</strong>（先に着手した分が先に完成とみなす）の2方法があります。', def_en:'Assigns costs to ending WIP inventory in process costing. Two methods: <strong>Weighted-Average</strong> (distributes all costs evenly at a single average cost per equivalent unit) and <strong>FIFO</strong> (treats the earliest work-in-process as the first to be completed).' },
    { term:'等級別総合原価計算', en:'Grade-based Process Costing', def:'同じ工程で<strong>サイズ・品質が異なる等級品（Sサイズ・Mサイズ等）</strong>を生産するときの原価計算です。等価係数（品質・サイズに応じた重み）を掛けた積数で各等級に原価を配分します。', def_en:'Used when a single process produces <strong>products of different grades (e.g., S, M, L sizes)</strong>. Total costs are distributed among grades using "equivalence coefficients" that reflect the relative weight or quality of each grade.' },
    { term:'組別総合原価計算', en:'Batch Process Costing', def:'同じ工場で<strong>種類の異なる複数の製品（組）を同時生産</strong>するときの原価計算です。直接費は各組へ直接計上し、間接費は配賦基準で各組に割り振ります。', def_en:'Used when a single factory simultaneously produces <strong>multiple distinct product types (batches)</strong>. Direct costs are charged directly to each batch; overhead is allocated to each batch using a predetermined allocation base.' },
  ]},
  { category:'⑯ 特殊商品売買・収益認識', items:[
    { term:'収益認識基準', en:'Revenue Recognition Standard', def:'<mark>「履行義務を充足したとき（約束した財・サービスを顧客に移転したとき）に収益を計上する」</mark>という新しいルール（ASC606/IFRS15準拠）です。契約→履行義務の識別→取引価格の配分→収益計上の5ステップで処理します。', def_en:'A standard requiring revenue to be recognized when a performance obligation is satisfied (i.e., when the promised good or service is transferred to the customer). Follows a 5-step model: (1) identify the contract, (2) identify performance obligations, (3) determine the transaction price, (4) allocate the price, (5) recognize revenue.' },
    { term:'履行義務', en:'Performance Obligation', def:'顧客との契約で<strong>財またはサービスを移転する約束</strong>です。収益認識では「履行義務が充足された時点」で収益を計上します。一時点での充足（商品引渡し）と一定期間での充足（サービス提供）があります。', def_en:'A promise in a contract to transfer a distinct good or service to a customer. Revenue is recognized when (or as) each obligation is satisfied — either at a single point in time (e.g., product delivery) or over a period of time (e.g., ongoing service provision).' },
    { term:'委託販売', en:'Consignment Sales', def:'商品を第三者（受託者）に預けて<strong>代わりに販売してもらう取引</strong>です。委託者は売上計上を「受託者が実際に売った時点」まで遅らせます。売れ残りは委託者（預けた側）の資産として残ります。', def_en:'An arrangement where the owner (consignor) entrusts goods to a third party (consignee) to sell on their behalf. The consignor recognizes revenue only when the consignee sells the goods; unsold items remain as the consignor\'s inventory.' },
    { term:'受託販売', en:'Sales on Consignment', def:'<strong>他者（委託者）から預かった商品を代わりに販売する</strong>取引です。受託者は販売代金を自社の収益にせず委託者に渡し、<strong>受取手数料だけを収益</strong>として計上します。', def_en:'The act of selling goods on behalf of another party (the consignor). The consignee does not record the sales proceeds as its own revenue — it remits them to the consignor and recognizes only the commission fee as income.' },
    { term:'試用販売', en:'Trial Sales (Sale on Approval)', def:'顧客に商品を試しに使ってもらい、<strong>「買う」という意思表示があったときに売上を計上</strong>する方法です。試用期間中は「試送品（資産）」として記録し、承諾時に売上・売掛金に振り替えます。', def_en:'A sales method where goods are given to a customer on a trial basis; revenue is recognized only when the customer formally agrees to purchase. During the trial period, goods are recorded as "trial shipment inventory" and reclassified to sales upon acceptance.' },
    { term:'割賦販売', en:'Installment Sales', def:'代金を<strong>分割払い（月々払い）で受け取る販売方法</strong>です。現行基準では商品引渡し時点で売上全額を計上します（回収ごとの計上は原則不可）。未回収の分割代金は「割賦売掛金（資産）」で管理します。', def_en:'A sales arrangement where the buyer pays in periodic installments. Under current accounting standards, the full revenue is recognized at the time of delivery (not as each payment is collected). Outstanding installments are tracked as "installment accounts receivable."' },
    { term:'工事契約', en:'Construction Contract', def:'建設・大型設備などの長期工事を会計処理する方法です。<strong>工事進行基準</strong>（進捗率に応じて毎期収益を計上）が原則で、進捗を合理的に見積もれない場合のみ<strong>工事完成基準</strong>（完成時に一括計上）を使います。', def_en:'Accounting for long-term construction or large-scale engineering projects. The percentage-of-completion method (revenue recognized proportionally as work progresses) is the standard approach; the completed-contract method (all revenue at completion) is used only when progress cannot be reliably estimated.' },
    { term:'返品権付き販売', en:'Sales with Right of Return', def:'顧客に返品を認めている場合、<strong>返品が見込まれる金額を「返金負債（負債）」として計上</strong>し、その原価相当額を「返品資産（資産）」として計上します。返品が見込まれない分だけを売上収益として認識します。', def_en:'When customers have the right to return goods, the estimated return amount is deferred as a "refund liability" and the corresponding cost is recognized as a "return asset." Only the portion expected to be kept by customers is recorded as revenue.' },
  ]},
  { category:'⑰ 外貨換算・為替', items:[
    { term:'外貨建取引', en:'Foreign Currency Transaction', def:'ドル・ユーロなど<strong>外国通貨で行う取引</strong>です。日本の帳簿は円建てで記録するため、取引発生時の為替レートで円換算します。決算時には金銭債権・債務など一部の項目を時価（決算時レート）で評価し直す必要があります。', def_en:'A transaction denominated in a foreign currency (e.g., USD or EUR). Since Japanese books are kept in yen, the foreign amount is converted to yen using the exchange rate at the transaction date. Certain items (monetary assets/liabilities) must be remeasured at the closing rate at year-end.' },
    { term:'直物為替レート', en:'Spot Rate', def:'<strong>その時点でただちに外貨を交換するレート</strong>です。取引発生時・決算時の換算に使います。種類として「TTM（仲値）」「TTS（銀行が外貨を売るレート）」「TTB（銀行が外貨を買うレート）」があります。', def_en:'The exchange rate for immediate currency conversion. Used to record transactions on the transaction date and to remeasure items at year-end. Common variants: TTM (mid-rate), TTS (selling rate, when the bank sells foreign currency to you), TTB (buying rate, when the bank buys foreign currency from you).' },
    { term:'取引発生時レート', en:'Historical Rate', def:'外貨建て取引が発生した時点の為替レートです。<strong>外貨建て資産・負債を帳簿に最初に記録するときのレート</strong>で、非貨幣性項目（棚卸資産・固定資産等）はこのレートを期末以降も使い続けます。', def_en:'The exchange rate at the date a foreign currency transaction occurs. Used to initially record the yen amount in the books. For non-monetary items (inventory, fixed assets, etc.), this historical rate is retained at year-end with no remeasurement.' },
    { term:'決算時レート（CR）', en:'Closing Rate', def:'決算日時点の為替レートです。<strong>外貨建ての金銭債権（売掛金・貸付金等）・金銭債務（買掛金等）・有価証券は決算時レートで評価し直し</strong>、帳簿残高との差額を「為替差損益」として計上します。', def_en:'The exchange rate at the balance sheet (closing) date. Monetary assets and liabilities denominated in foreign currencies (e.g., receivables, payables, loans) are remeasured at this rate, and the difference from the recorded amount is recognized as a foreign exchange gain or loss.' },
    { term:'為替差損益', en:'Foreign Exchange Gain/Loss', def:'外貨建て取引の<strong>発生時レートと決済時（または決算時）レートの差</strong>から生じる損益です。<mark>円高（外貨安）の場合：外貨建て債権は為替差損、外貨建て債務は為替差益になります。</mark>', def_en:'Gains or losses resulting from the difference between the exchange rate when a foreign currency transaction is recorded and the rate when it is settled (or remeasured at year-end). When the yen strengthens: foreign-currency receivables produce a loss; foreign-currency payables produce a gain.' },
    { term:'貨幣性項目・非貨幣性項目', en:'Monetary / Non-monetary Items', def:'外貨換算の区分です。<strong>貨幣性項目（現金・売掛金・買掛金・借入金等）は決算時レートで換算し直し</strong>ます。<strong>非貨幣性項目（棚卸資産・固定資産・前払費用等）は取得時レートを維持</strong>し、換算替えしません。', def_en:'A classification used in foreign currency translation. Monetary items (cash, receivables, payables, loans, etc.) are remeasured at the closing rate each year-end. Non-monetary items (inventory, fixed assets, prepaid expenses, etc.) keep the historical rate and are never remeasured.' },
  ]},
  { category:'⑱ 社債・資金調達', items:[
    { term:'社債の発行', en:'Bond Issuance', def:'会社が資金調達のために<strong>不特定多数の投資家に発行する有価証券（借用証書）</strong>です。定期的に利息（クーポン）を支払い、満期に元本を一括返済します。銀行借入と違い、広く一般投資家から資金を調達できます。帳簿では「社債（負債）」として計上します。', def_en:'Securities issued by a company to raise funds from investors. The issuer pays periodic interest (coupons) and repays the face value at maturity. Unlike bank loans, bonds allow a company to raise money from the general public. Recorded as "Bonds Payable" (a liability) on the balance sheet.' },
    { term:'額面金額', en:'Face Value (Par Value)', def:'社債の<strong>満期に投資家に返済する金額</strong>です。クーポン（利息）はこの額面金額×クーポン利率で計算します。発行時の払込金額（発行価格）と異なることがあり、その差額が「社債割引発行差金」になります。', def_en:'The amount printed on the bond certificate that the issuer must repay at maturity. Coupon interest is calculated as face value × coupon rate. The issue price may differ from the face value; any discount (face value minus issue price) is amortized as additional interest expense over the bond\'s life.' },
    { term:'クーポン', en:'Coupon (Interest)', def:'社債の<strong>定期的な利息支払い</strong>のことです。額面金額×クーポン利率で計算し、半年ごとなど定期的に社債権者へ支払います。支払い時は「社債利息（費用）」として計上します。', def_en:'The periodic interest payment made to bondholders. Calculated as face value × coupon rate, typically paid semi-annually. Recorded as "Bond Interest Expense" when paid. The coupon rate is fixed at issuance and does not change over the bond\'s life.' },
    { term:'割引発行', en:'Discount Issuance', def:'社債を<strong>額面より低い価格で発行</strong>することです。例：額面100円の社債を95円で発行。クーポン利率が市場金利より低い場合などに採用し、投資家に追加の利回りを提供します。差額5円は満期まで毎期「社債利息」として費用計上（償却）します。', def_en:'Issuing bonds at a price below their face value to offer investors a higher effective yield than the coupon rate alone provides. Example: a bond with ¥100 face value issued at ¥95. The ¥5 discount is amortized as additional bond interest expense over the life of the bond.' },
    { term:'社債の償却原価法', en:'Amortized Cost (Bonds Payable)', def:'割引発行した社債の<strong>帳簿価額（簿価）を毎期少しずつ額面に近づけていく方法</strong>です。毎期、未償却差額の一部を「社債利息（費用）」に追加計上し、同額だけ社債（負債）の帳簿価額を増加させます。満期時には帳簿価額＝額面金額になります。', def_en:'A method of gradually increasing the carrying amount of a discounted bond toward its face value over the bond\'s life. Each period, a portion of the discount is recognized as additional bond interest expense, and the bond\'s book value increases by the same amount, reaching face value at maturity.' },
    { term:'端数利息', en:'Accrued Interest', def:'社債・国債等を<strong>利払日と利払日の間に売買した場合に計算する経過利息</strong>です。「前回利払日から売買日までの日数分」の利息で、買い手が売り手に支払います。買い手の帳簿では「有価証券利息（収益）」で処理します。', def_en:'Interest accrued on a bond between the last interest payment date and the date of purchase. The buyer compensates the seller for the portion of the coupon period already elapsed. The buyer records this amount as "Securities Interest Income" (which offsets the next full coupon received).' },
  ]},
  { category:'⑲ 簿記の補足', items:[
    { term:'取引の8要素', en:'8 Elements of Transactions', def:'仕訳の借方・貸方にはそれぞれ4種類、合計8種の要素があります。<strong>借方：①資産↑ ②負債↓ ③純資産↓ ④費用↑ ／ 貸方：⑤資産↓ ⑥負債↑ ⑦純資産↑ ⑧収益↑</strong>。すべての仕訳はこの8要素の組み合わせで成り立ちます。', def_en:'Every journal entry is built from 8 elements (4 per side). Debit side: ①asset increase ②liability decrease ③equity decrease ④expense increase. Credit side: ⑤asset decrease ⑥liability increase ⑦equity increase ⑧revenue increase. Every transaction in double-entry bookkeeping is a combination of these elements.' },
    { term:'決算振替仕訳', en:'Closing Entries', def:'期末に<strong>すべての収益・費用勘定を「損益」勘定へ振り替え、当期純利益を「繰越利益剰余金」へ振り替える仕訳</strong>です。これにより収益・費用勘定はゼロにリセットされ、次期の帳簿が新たにスタートします。', def_en:'Journal entries made at the end of each accounting period to close all revenue and expense accounts into the "Income Summary" account, and then transfer the resulting net income (or loss) to "Retained Earnings." After this process, income statement accounts are reset to zero for the next period.' },
    { term:'損益勘定', en:'Income Summary', def:'決算振替仕訳の際にのみ使う<strong>一時的な中間集計用の勘定科目</strong>です。全収益を借方に集めて消去し、全費用を貸方に集めて消去します。残った差額が当期純利益（または純損失）で、最終的に繰越利益剰余金に振り替えてゼロになります。', def_en:'A temporary account used only during the closing process to aggregate all revenues and expenses. Revenues are transferred in (debited to zero them out) and expenses are transferred in (credited to zero them out); the balance equals net income, which is then closed to Retained Earnings.' },
    { term:'帳簿の締め切り', en:'Closing the Books', def:'期末に<strong>収益・費用勘定をゼロにリセット</strong>し、資産・負債・純資産の残高を翌期に繰り越す作業です。日本では主に<strong>英米式</strong>（損益勘定を経由して繰越利益剰余金に振り替える方法）が使われます。', def_en:'The year-end process of zeroing out all revenue and expense accounts and carrying forward balances of asset, liability, and equity accounts to the next period. In Japan, the Anglo-American method (routing through the Income Summary before closing to Retained Earnings) is the standard approach.' },
    { term:'資本等式', en:'Capital Equation', def:'<strong>「純資産（資本）＝資産－負債」</strong>という等式です。貸借対照表等式「資産＝負債＋純資産」を変形したもので、株主の持ち分（正味財産）を表します。', def_en:'The equation "Equity (Net Assets) = Assets − Liabilities." This is a rearrangement of the balance sheet equation "Assets = Liabilities + Equity" and represents the owners\' net stake in the business.' },
    { term:'損益計算書等式', en:'P/L Equation', def:'<strong>「費用＋当期純利益＝収益」</strong>または「収益－費用＝当期純利益」という等式です。損益計算書の構造の基本で、収益と費用の差が利益を表すことを示しています。', def_en:'The equation "Expenses + Net Income = Revenue," or equivalently "Revenue − Expenses = Net Income." This is the structural foundation of the income statement, showing that profit is the excess of revenue over expenses.' },
    { term:'継続企業の前提', en:'Going Concern', def:'会計では<strong>企業が将来にわたって事業を継続すると仮定</strong>して財務諸表を作成します。この前提が崩れる場合（清算・倒産・事業撤退等）は、資産を時価で評価し直すなど特別な会計処理が必要になります。', def_en:'The fundamental accounting assumption that a business will continue to operate for the foreseeable future. Financial statements are prepared on this basis. If the assumption no longer holds (liquidation, bankruptcy, etc.), assets must be remeasured at current values and different accounting rules apply.' },
  ]},
  { category:'⑳ 連結会計', items:[
    { term:'連結会計', en:'Consolidated Accounting', def:'<strong>親会社と子会社を一つの企業グループとみなして作る財務諸表</strong>の会計手法です。親会社単体の財務諸表とは別に、グループ全体の財務状態・経営成績を表す「連結財務諸表」を作成します。2級では連結会計の基本的な仕組みが問われます。', def_en:'The accounting method for preparing financial statements that treat a <strong>parent company and its subsidiaries as a single economic entity</strong>. In addition to standalone (parent-only) statements, a consolidated set of statements is prepared to show the group\'s overall financial position and results. Level 2 covers the basic mechanics of consolidation.' },
    { term:'連結財務諸表', en:'Consolidated Financial Statements', def:'親会社を頂点とする<strong>企業グループ全体の財務状態・経営成績を一体として示す財務諸表</strong>です。連結貸借対照表・連結損益計算書・連結株主資本等変動計算書・連結キャッシュ・フロー計算書などから構成されます。単体財務諸表と違い、グループ内取引は消去されます。', def_en:'Financial statements that present the <strong>financial position and results of an entire corporate group</strong> (parent + subsidiaries) as if it were a single entity. Comprises a consolidated balance sheet, income statement, statement of changes in equity, and cash flow statement. Intragroup transactions are eliminated.' },
    { term:'支配獲得日', en:'Acquisition Date', def:'親会社が子会社の<strong>支配を獲得した日（議決権の過半数を取得した日等）</strong>のことです。この日の子会社の資産・負債を時価評価し直し、投資額との差額（のれん）を計算します。連結の起点となる重要な日付です。', def_en:'The date on which the parent company acquires <strong>control of the subsidiary</strong> (typically the date >50% of voting rights are obtained). On this date, the subsidiary\'s assets and liabilities are remeasured at fair value, and any excess of the purchase price over fair-value net assets is recognized as goodwill.' },
    { term:'投資と資本の相殺消去', en:'Elimination of Investment vs. Equity', def:'連結修正の基本仕訳で、<strong>親会社の「子会社株式（投資）」と子会社の「資本（純資産）」を相殺消去</strong>します。この消去を行わないと、同じ財産が親会社の投資にも子会社の純資産にも二重計上されてしまいます。差額が「のれん」または「負のれん発生益」になります。', def_en:'The core consolidation entry that <strong>offsets and eliminates the parent\'s "Investment in Subsidiary" against the subsidiary\'s equity (net assets)</strong>. Without this, the same net assets would be double-counted. Any excess of investment cost over fair-value net assets becomes goodwill (or, if below, a bargain purchase gain).' },
    { term:'非支配株主持分', en:'Non-controlling Interests (NCI)', def:'子会社の純資産のうち、<strong>親会社が保有していない外部株主（少数株主）の持ち分</strong>です。例えば親会社が子会社の70%を保有していれば、残り30%が非支配株主持分として連結貸借対照表の純資産の部に表示されます。旧称「少数株主持分」。', def_en:'The portion of a subsidiary\'s net assets attributable to <strong>shareholders outside the corporate group (minority shareholders)</strong>. Example: if the parent owns 70%, the remaining 30% is NCI, shown in the equity section of the consolidated balance sheet. Previously called "minority interest."' },
    { term:'内部取引の相殺消去', en:'Elimination of Intercompany Transactions', def:'グループ内の企業間取引（親会社から子会社への売上・貸付金・受取手形など）を<strong>連結上は取り消す処理</strong>です。グループを一つの企業とみると、内部の売買はただの在庫の移動にすぎないため、収益・費用・債権・債務が重複して計上されないよう消去します。', def_en:'The consolidation adjustment that <strong>eliminates transactions between group companies</strong> (e.g., parent selling to subsidiary, intercompany loans, intercompany receivables/payables). From the group\'s perspective, internal transfers are not real sales — eliminating them prevents double-counting of revenues, expenses, assets, and liabilities.' },
    { term:'未実現利益の消去', en:'Elimination of Unrealized Profits', def:'グループ内企業が互いに商品・固定資産を売買したとき、<strong>まだ外部に販売されていない利益（未実現利益）を消去</strong>する処理です。例えば親会社が子会社に原価100円の商品を150円で売り、子会社がまだ販売していなければ50円の未実現利益を消去します。', def_en:'The elimination of profits on goods or assets sold within the group that have <strong>not yet been sold to external parties (unrealized profit)</strong>. Example: parent sells goods costing ¥100 to subsidiary for ¥150; if the subsidiary has not yet resold them, the ¥50 internal profit is eliminated from consolidated inventory and retained earnings.' },
    { term:'持分法', en:'Equity Method', def:'子会社（支配）ではなく<strong>関連会社（重要な影響を持つ会社）に対して適用する会計処理</strong>です。投資先の純利益のうち自社持ち分を「持分法による投資利益（収益）」として計上し、「関係会社株式（資産）」も増やします。純損失の場合は「持分法による投資損失（費用）」を計上します。', def_en:'The accounting method applied to <strong>investments in associates (companies over which the investor has significant influence but not control)</strong>. The investor recognizes its proportionate share of the associate\'s net income as "Income from Equity Method Investments," increasing the carrying value of the investment. Losses are recognized as an expense and reduce the investment.' },
    { term:'のれん（連結）', en:'Consolidated Goodwill', def:'連結時に<strong>子会社取得額が子会社純資産の時価より多い差額</strong>をのれんとして連結貸借対照表に計上します。日本基準では20年以内に均等償却（のれん償却費）します。IFRSでは償却せず「減損テスト」を毎年行います。', def_en:'The excess of the <strong>acquisition cost over the fair value of the subsidiary\'s net assets at the acquisition date</strong>, recognized on the consolidated balance sheet. Under Japanese GAAP, amortized evenly within 20 years (Goodwill Amortization). Under IFRS, not amortized but subject to annual impairment testing.' },
    { term:'段階取得', en:'Step Acquisition', def:'子会社株式を<strong>複数回に分けて取得して支配を獲得するケース</strong>です。支配獲得日に、それまで保有していた株式（関連会社株式など）を支配獲得時の時価で評価し直し、差額を「段階取得に係る差益（利益）」として計上します。', def_en:'Acquiring a subsidiary\'s shares in <strong>multiple transactions over time until control is obtained</strong>. On the acquisition date, previously held interests (e.g., equity-method investments) are remeasured at fair value, and any resulting gain is recognized as "Step Acquisition Gain" in profit or loss.' },
  ]},
  { category:'㉑ 銀行勘定調整表', items:[
    { term:'銀行勘定調整表', en:'Bank Reconciliation Statement', def:'<strong>当座預金の帳簿残高と銀行から受け取った残高証明書（銀行側の残高）の差異を調整・説明する表</strong>です。両者の残高が一致しないのは、時間外預金・未取付小切手・未渡小切手・連絡未達事項などのタイムラグが原因です。2級の頻出問題です。', def_en:'A schedule that <strong>reconciles the company\'s book balance of the checking account with the balance shown on the bank statement</strong>. Differences arise from timing lags: deposits in transit, outstanding checks, undelivered checks, and items not yet notified. A frequently tested topic on the Level 2 exam.' },
    { term:'時間外預金', en:'Deposits in Transit', def:'会社が帳簿に記録したが、<strong>銀行の営業時間外に入金したため銀行側の残高にまだ反映されていない預金</strong>です。会社残高＞銀行残高の原因になります。銀行側の残高に「＋時間外預金」の調整をします。', def_en:'Deposits recorded by the company but <strong>not yet reflected in the bank\'s records</strong> because they were made after banking hours (or at period-end). The company\'s book balance exceeds the bank balance. Adjustment: add to the bank statement balance.' },
    { term:'未取付小切手', en:'Outstanding Checks', def:'会社が小切手を振り出して相手に渡したが、<strong>相手がまだ銀行に持ち込んでいない（取り付けていない）ため銀行側から引き落とされていない小切手</strong>です。会社残高＜銀行残高の原因。銀行側の残高から「－未取付小切手」を調整します。', def_en:'Checks issued by the company and given to payees but <strong>not yet presented to the bank for payment</strong>. The bank balance is higher than the company\'s book balance by this amount. Adjustment: subtract from the bank statement balance.' },
    { term:'未渡小切手', en:'Undelivered Checks', def:'会社が小切手を振り出して帳簿から引き落としたが、<strong>まだ相手に渡していない小切手</strong>です。本来まだ支払いが完了していないので、会社側の帳簿残高を修正（当座預金残高を増やし、未払金などを計上）します。', def_en:'Checks written and deducted from the company\'s books but <strong>not yet delivered to the payee</strong>. Since payment has not actually been made, a correction is needed on the company\'s side: restore the checking account balance and record the obligation as Accounts Payable (or a similar liability).' },
    { term:'連絡未達事項', en:'Items Not Yet Notified', def:'銀行が処理（引き落とし・入金）を行ったが、<strong>会社にまだ通知が届いておらず帳簿に記録されていない項目</strong>です。例えば銀行が自動的に引き落とした手数料・利息など。会社側の帳簿を修正（記帳）する必要があります。', def_en:'Transactions processed by the bank but <strong>not yet recorded in the company\'s books</strong> because notification has not been received. Examples: bank service charges, interest automatically deducted, or incoming wire transfers. The company must update its books once it learns of these items.' },
    { term:'当座預金残高証明書', en:'Bank Statement', def:'銀行が発行する<strong>当座預金の取引履歴と残高を記録した証明書</strong>です。銀行勘定調整表を作成する際に会社の帳簿残高と照合します。両者の差異の原因を一つひとつ確認して、修正後の「真の残高」を求めます。', def_en:'A document issued by the bank listing all transactions and the <strong>official bank-side balance of the checking account</strong>. Used in bank reconciliation to compare against the company\'s book balance. Each difference is identified and corrected to arrive at the "true balance."' },
    { term:'両者区分調整法', en:'Reconciliation from Both Sides', def:'銀行勘定調整表の作成方法で、<strong>「銀行残高」と「帳簿残高」の両方を修正して一致させる方式</strong>です。銀行残高には時間外預金を加え未取付小切手を引き、帳簿残高には連絡未達の入金を加え未達の引き落としを引くことで、両者が「修正後残高」で一致します。最もよく使われる方法です。', def_en:'The most common bank reconciliation format: <strong>adjust both the bank balance and the book balance</strong> until they agree on a "adjusted true balance." Add deposits in transit to bank balance; subtract outstanding checks from bank balance. Add unreported credits to book balance; subtract unreported debits from book balance.' },
  ]},
];

const APX_TYPE_INFO = {
  asset:      { name:'資産 (Assets)',              sub:'会社が持っているもの・もらえる権利' },
  liability:  { name:'負債 (Liabilities)',          sub:'将来払わなければならない義務・借金' },
  expense:    { name:'費用 (Expenses)',             sub:'お金を使ったとき・価値が減ったとき' },
  revenue:    { name:'収益 (Revenue)',              sub:'お金が増えたとき・稼いだとき' },
  equity:     { name:'純資産 (Equity)',             sub:'本当に自分のものの総額（資産－負債）' },
  other:      { name:'評価勘定・その他 (Other)',    sub:'固定資産・売掛金のマイナス調整など' },
  industrial: { name:'工業簿記 (Industrial)',       sub:'製造業の原価計算で使う勘定科目' },
};

function buildApxContent(){
  // Count how many questions each account appears in across all questions
  const freq = {};
  ALL.forEach(q => {
    if(!q.e) return;
    const seen = new Set();
    q.e.forEach(entry => {
      [...(entry.d||[]), ...(entry.c||[])].forEach(([name]) => seen.add(name));
    });
    seen.forEach(name => { freq[name] = (freq[name]||0) + 1; });
  });

  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name] || 'other';
    byType[type].push({ name, en, note, lv, note_en });
  });
  // Sort each type by question frequency (descending) so most-tested accounts appear first
  order.forEach(type => byType[type].sort((a, b) => (freq[b.name]||0) - (freq[a.name]||0)));

  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(({ name, en, note, lv, note_en }) =>
      `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}">
        <div class="apx-row-top">
          <span class="tag ${type}">${name}</span>
          <span class="apx-en">(${en})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`
    ).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  // 工業簿記
  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note, , note_en]) => {
      const type = T[name] || 'other';
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="tag ${type}">${name}</span>
          <span class="apx-en">(${en})</span>
          <span class="apx-lv ind">工業</span>
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  // 用語解説集
  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def, def_en }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-term-text">${term}</span> <span class="gloss-en">(${en})</span></div>
          <div class="gloss-def">${def_en?`<div class="gloss-def-en">${def_en}</div>`:''}<div class="gloss-def-ja">${def}</div></div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  return commercialHtml + indHtml + glossHtml;
}

let apxCurrentTab = 'all';

function showApx(){
  const el = document.getElementById('apx-overlay');
  if(!document.getElementById('apx-content').innerHTML)
    document.getElementById('apx-content').innerHTML = buildApxContent();
  el.classList.add('show');
  apxCurrentTab = 'all';
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'all'));
  applyApxFilter('all');
}
function hideApx(){ document.getElementById('apx-overlay').classList.remove('show'); }

function setApxTab(type){
  apxCurrentTab = type;
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  applyApxFilter(type);
}

function toggleHideNames(){
  const btn = document.getElementById('apx-hide-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('names-hidden', nowActive);
  btn.textContent = nowActive ? '👁 科目名を表示' : '👁 科目名を隠す';
}

function toggleHideEnglish(){
  const btn = document.getElementById('apx-hide-en-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('en-hidden', nowActive);
  btn.textContent = nowActive ? '🔤 英語を表示' : '🔤 英語を隠す';
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category !== 'industrial';
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else if(tab === 'level3' || tab === 'level2') typeMatch = category !== 'industrial';
    else typeMatch = (type === tab && category !== 'industrial');

    if(!typeMatch){ sec.style.display = 'none'; return; }

    if(tab === 'level3' || tab === 'level2'){
      const targetLevel = tab === 'level3' ? '3' : '2';
      let anyVisible = false;
      sec.querySelectorAll('.apx-row').forEach(row => {
        const match = row.dataset.level === targetLevel;
        row.classList.toggle('hidden', !match);
        if(match) anyVisible = true;
      });
      sec.style.display = anyVisible ? '' : 'none';
    } else {
      sec.style.display = '';
      sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
    }
  });
}

  { id:68, cat:'伝票',

    ans_html:`<div class="tbl-sec">起票する伝票（2枚）</div><table><thead><tr><th>伝票の種類</th><th>借方</th><th>貸方</th></tr></thead><tbody><tr><td class="hl">①出金伝票</td><td>仕入　500</td><td>（現金　500）省略</td></tr><tr><td class="hl">②振替伝票</td><td>仕入　1,500</td><td>買掛金　1,500</td></tr></tbody></table><div class="tbl-sec">2枚を合算した仕訳</div><table><tbody><tr><td>（借方）仕入　2,000</td><td>（貸方）現金　500</td></tr><tr><td></td><td>（貸方）買掛金　1,500</td></tr></tbody></table><div class="formula-box">現金払い部分 → 出金伝票　／　掛け部分 → 振替伝票　／　2枚を合算すると元の仕訳に戻る</div>`,

  // ===== 決算振替 =====
  { id:77, cat:'決算振替',
    q:'期末決算で費用勘定（仕入・給料・支払家賃）を損益勘定に振り替えた。仕訳を示せ（勘定科目のみ）。',
    e:[{d:['損益'], c:['仕入']}],

  { id:78, cat:'決算振替',
    q:'期末決算で収益勘定（売上・受取利息）を損益勘定に振り替えた。仕訳を示せ（勘定科目のみ）。',

  { id:79, cat:'決算振替',

    exp:'1年間で稼いだ利益（損益勘定の集計結果）を「繰越利益剰余金（純資産）」に振り替えます。「今期の利益が会社の財産（純資産）に積み上がる」瞬間です。損益勘定はゼロになって翌期に備えます。' },
  { id:80, cat:'決算振替',
    q:'損益勘定の集計結果が当期純損失（借方残高）だった。繰越利益剰余金への振替仕訳を示せ（勘定科目のみ）。',
    e:[{d:['繰越利益剰余金'], c:['損益']}],
    exp:'赤字（純損失）の場合、貯めてきた利益（繰越利益剰余金・純資産）を削ります。会社の自己資本（体力）が減ったことを意味します。' },

  // ===== 帳簿・精算表 =====

  { id:82, cat:'帳簿・精算表',

  { id:83, cat:'帳簿・精算表',

  { id:84, cat:'帳簿・精算表',

  { id:85, cat:'帳簿・精算表',

  { id:86, cat:'帳簿・精算表',

  { id:87, cat:'帳簿・精算表',

  // ===== 帳簿・精算表（大幅追加） =====

    ans_html: `<div class="tbl-sec">損益計算書（P/L）　単位：円</div><table><tbody><tr><td>売上高</td><td></td><td class="hl">800</td></tr><tr><td>　期首商品棚卸高</td><td>120</td><td></td></tr><tr><td>　当期商品仕入高</td><td>500</td><td></td></tr><tr><td>　合計</td><td>620</td><td></td></tr><tr><td>　期末商品棚卸高</td><td>(130)</td><td></td></tr><tr><td>　売上原価</td><td></td><td>(490)</td></tr><tr class="total-row"><td class="hl">売上総利益（粗利益）</td><td></td><td class="hl">310</td></tr><tr><td>　給料</td><td></td><td>(280)</td></tr><tr class="total-row"><td class="hl">当期純利益</td><td></td><td class="hl">30</td></tr></tbody></table><div class="formula-box">売上総利益＝売上高－売上原価　　当期純利益＝売上総利益－販管費合計</div>`,
