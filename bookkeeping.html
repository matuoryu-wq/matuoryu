function buildApxContent(){
  const freq = {};
  ALL.forEach(q => {
    if(!q.e) return;
    const seen = new Set();
    q.e.forEach(entry => {
      [...(entry.d||[]), ...(entry.c||[])].forEach(([name]) => seen.add(name));
    });
    seen.forEach(name => { freq[name] = (freq[name]||0) + 1; });
  });

  const order = ['asset','liability','expense','revenue','equity','other'];
  const byType = {};
  order.forEach(t => byType[t] = []);
  ACCT_DATA.forEach(([name, en, note, lv, note_en]) => {
    const type = T[name] || 'other';
    byType[type].push({ name, en, note, lv, note_en });
  });
  order.forEach(type => byType[type].sort((a, b) => (freq[b.name]||0) - (freq[a.name]||0)));

  const commercialHtml = order.map(type => {
    const { name, sub } = APX_TYPE_INFO[type];
    const rows = byType[type].map(({ name, en, note, lv, note_en }) =>
      `<div class="apx-row" data-name="${name}" data-en="${en}" data-level="${lv}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${type}">(${name})</span>
          ${lv === 2 ? '<span class="apx-lv">2級</span>' : ''}
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`
    ).join('');
    return `<div class="apx-section" data-type="${type}" data-category="commercial">
      <div class="apx-section-hd ${type}"><span class="dot ${type}"></span>${name}</div>
      <div class="apx-section-sub">${sub}</div>
      ${rows}
    </div>`;
  }).join('');

  const subCats = [...new Set(INDUSTRIAL_DATA.map(([,,, sc]) => sc))];
  const indHtml = subCats.map(sc => {
    const items = INDUSTRIAL_DATA.filter(([,,, s]) => s === sc);
    const rows = items.map(([name, en, note, , note_en]) => {
      const type = T[name] || 'other';
      return `<div class="apx-row" data-name="${name}" data-en="${en}">
        <div class="apx-row-top">
          <span class="apx-en">${en}</span>
          <span class="tag ${type}">(${name})</span>
          <span class="apx-lv ind">工業</span>
        </div>
        <div class="apx-note">${note_en?`<div class="gloss-def-en">${note_en}</div>`:''}<div class="apx-note-ja">${note}</div></div>
      </div>`;
    }).join('');
    return `<div class="apx-section" data-type="industrial" data-category="industrial">
      <div class="apx-section-hd industrial">🏭 ${sc}</div>
      ${rows}
    </div>`;
  }).join('');

  const glossHtml = '<div class="gloss-section" data-type="glossary">' +
    GLOSSARY_DATA.map(({ category, items }) =>
      `<div class="gloss-hd">📌 ${category}</div>` +
      items.map(({ term, en, def, def_en }) =>
        `<div class="gloss-row" data-name="${term}" data-en="${en}">
          <div class="gloss-term"><span class="gloss-en">${en}</span> <span class="gloss-term-text">(${term})</span></div>
          <div class="gloss-def">${def_en?`<div class="gloss-def-en">${def_en}</div>`:''}<div class="gloss-def-ja">${def}</div></div>
        </div>`
      ).join('')
    ).join('') +
  '</div>';

  return commercialHtml + indHtml + glossHtml;
}

let apxCurrentTab = 'all';

function showApx(){
  const el = document.getElementById('apx-overlay');
  if(!document.getElementById('apx-content').innerHTML)
    document.getElementById('apx-content').innerHTML = buildApxContent();
  el.classList.add('show');
  apxCurrentTab = 'all';
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'all'));
  applyApxFilter('all');
}
function hideApx(){ document.getElementById('apx-overlay').classList.remove('show'); }

function setApxTab(type){
  apxCurrentTab = type;
  document.querySelectorAll('#apx-tabs .apx-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  applyApxFilter(type);
}

function toggleHideNames(){
  const btn = document.getElementById('apx-hide-btn');

  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('names-hidden', nowActive);
  btn.textContent = nowActive ? '👁 科目名を表示' : '👁 科目名を隠す';
}

function toggleHideEnglish(){
  const btn = document.getElementById('apx-hide-en-btn');
  const content = document.getElementById('apx-content');
  const nowActive = btn.classList.toggle('active');
  content.classList.toggle('en-hidden', nowActive);
  btn.textContent = nowActive ? '🔤 英語を表示' : '🔤 英語を隠す';
}

function applyApxFilter(tab){
  const content = document.getElementById('apx-content');

  const glossEl = content.querySelector('.gloss-section');
  if(glossEl){
    glossEl.style.display = (tab === 'glossary') ? '' : 'none';
    if(tab === 'glossary')
      glossEl.querySelectorAll('.gloss-row,.gloss-hd').forEach(el => el.style.display = '');
  }

  content.querySelectorAll('.apx-section').forEach(sec => {
    const type = sec.dataset.type;
    const category = sec.dataset.category;
    let typeMatch;
    if(tab === 'all') typeMatch = category !== 'industrial';
    else if(tab === 'industrial') typeMatch = category === 'industrial';
    else if(tab === 'glossary') typeMatch = false;
    else if(tab === 'level3' || tab === 'level2') typeMatch = category !== 'industrial';
    else typeMatch = (type === tab && category !== 'industrial');

    if(!typeMatch){ sec.style.display = 'none'; return; }

    if(tab === 'level3' || tab === 'level2'){
      const targetLevel = tab === 'level3' ? '3' : '2';
      let anyVisible = false;
      sec.querySelectorAll('.apx-row').forEach(row => {
        const match = row.dataset.level === targetLevel;
        row.classList.toggle('hidden', !match);
        if(match) anyVisible = true;
      });
      sec.style.display = anyVisible ? '' : 'none';
    } else {
      sec.style.display = '';
      sec.querySelectorAll('.apx-row').forEach(r => r.classList.remove('hidden'));
    }
  });
}

// 答えの単語を問題文から伏せる
function qaMask(html, term){
  if(!term) return html;
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return html.replace(new RegExp(esc,'g'),'<span class="qa-mask">▓▓▓</span>');
}

// （...）を薄くする
function markQKey(text){
  // Highlight the distinctive feature clause (after で、/ が、/ を指し、)
  // while leaving the final question stem (は何か？ / を何というか？) unmarked
  const m = text.match(/^([\s\S]+?)(で、|が、|を指し、)([\s\S]+?)(は何か？|を何というか？|は何というか？)$/);
  if(m) return m[1] + m[2] + '<mark>' + m[3] + '</mark>' + m[4];
  return text;
}

function styleParens(html){
  return html.replace(/（([^（）]*)）/g,'<span class="q-paren">（$1）</span>');
}

function addQBreaks(txt){
  return txt
    .replace(/\n/g,'<br>')
    .replace(/。([①②③④⑤⑥⑦⑧⑨⑩])/g,'。<br>$1')
    .replace(/([。！？])(\s*)([ア-ン][　\s]|[A-Z]社|次[のに]|なお|ただし|また、|また。|さらに)/g,'$1$2<br>$3');
}

// HTMLタグを除いた表示用テキストを抽出（問題文のプレビュー用）
function qaStripTags(html){ return html.replace(/<[^>]+>/g,''); }

  '前払利息': '当期に支払った利息のうち翌期分に相当する部分を繰り延べる資産の経過勘定科目を【　　　　　　】という。\n例）借入金の利息12万円を1年分前払い（3月決算・10月払い）。翌4〜9月分6万円が前払い：（借）【　　　】6万円 ／（貸）支払利息6万円。\nポイント：前払費用の利息版。翌期首に再振替仕訳（【　　　】→支払利息）を行う。',
  '未収収益': '当期に発生した収益のうちまだ受け取っていない部分を見越し計上する資産科目を【　　　　　　】という。\n例）3月決算・2〜3月分の家賃収入2万円が未入金→（借）【　　　】2万円 ／（貸）受取家賃2万円（見越し計上）。4月に受取：（借）現金2万円 ／（貸）【　　　】2万円（再び受取家賃計上しない）。\nポイント：【　　　】＝「サービスは提供したがまだ受け取っていない」→資産。未払費用（費用側の裏）とセットで覚える。',
  '未収利息': '当期に発生した利息収入のうちまだ受け取っていない分を資産計上する科目を【　　　　　　】という。\n例）3月決算で1〜3月分の貸付金利息3万円が未入金：（借）【　　　】3万円 ／（貸）受取利息3万円。4月に入金：（借）現金3万円 ／（貸）【　　　】3万円。\nポイント：未収収益の利息版。当期分の利息が経過しているが受け取っていない場合に計上。',
  '未収入金': '本業以外の取引から生じた未回収金に使う資産科目を【　　　　　　】という。\n例）帳簿価額80万円の機械を100万円で売却・代金は翌月回収：（借）【　　　】100万円 ／（貸）機械80万円・固定資産売却益20万円。\nポイント：商品の後払い→売掛金。固定資産等（商品以外）の後払い→【　　　】。',
  '立替金': '他者が負担すべき費用を一時的に立替払いした際の資産科目を【　　　　　　】という。\n例）社員Aの交通費1万円を会社が一時的に立替払い：（借）【　　　】1万円 ／（貸）現金1万円。後日給料から控除：（借）給料 ／（貸）【　　　】1万円。\nポイント：「自分の代わりに払ってあげた」一時的な立替。将来必ず回収できる（資産）。仮払金は「目的不明の前渡し」、【　　　】は「目的明確な一時的負担」。',
  '仮払法人税等': '法人税等の中間申告時に前払いした税額を一時的に計上する資産科目を【　　　　　　】という。\n例）中間決算で法人税等の見込み額60万円を前払い：（借）【　　　】60万円 ／（貸）現金60万円。期末確定額が100万円なら：（借）法人税等100万円 ／（貸）【　　　】60万円・未払法人税等40万円。\nポイント：中間申告時の仮払い→【　　　】（資産）。期末に確定額と相殺して差額を未払計上。',
  '仮払消費税': '税抜処理で仕入・経費にかかる消費税を一時的に計上する資産科目を【　　　　　　】という。\n例）商品110万円（税込）を仕入れた：（借）仕入100万円・【　　　】10万円 ／（貸）買掛金110万円。\nポイント：税抜処理では仕入時の消費税を【　　　】（資産）、売上時の消費税を仮受消費税（負債）に計上し、期末に相殺して差額を納付（または還付）。',
  '差入保証金': '賃貸借契約等で家主・相手方に差し入れた保証金・敷金を計上する長期資産科目を【　　　　　　】という。\n例）事務所を借りる際に敷金（保証金）として家賃3か月分60万円を差入：（借）【　　　】60万円 ／（貸）現金60万円。退去時に返還される（全額または修繕費控除後）。\nポイント：敷金・保証金は資産（将来返ってくる）。賃料の前払いではない点に注意。',
  '貯蔵品': '期末に未使用で残った切手・収入印紙・消耗品等を資産計上する棚卸資産科目を【　　　　　　】という。\n例）期末に未使用の収入印紙5,000円・切手3,000円が残存。決算整理：（借）【　　　】8,000円 ／（貸）租税公課5,000円・通信費3,000円。翌期首に再振替：（借）租税公課・通信費 ／（貸）【　　　】8,000円。\nポイント：切手・収入印紙・消耗品等の未使用分を「費用でなく資産」に振替。期末の在庫だけ資産計上し翌期に再び費用に戻す。',
  '土地': '建物や機械と違い減価償却が不要な有形固定資産科目を【　　　　　　】という。\n例）工場建設用に【　　　】5,000万円（購入代金4,950万円＋仲介手数料50万円）を購入：（借）【　　　】5,000万円 ／（貸）現金5,000万円。\nポイント：【　　　】は減価償却しない（価値が減らないとみなす）。建物・機械は減価償却する。【　　　】の取得原価＝購入代金＋付随費用（仲介料・登録免許税等）。',
  '建物': '事務所・工場・店舗など業務用不動産を計上する有形固定資産科目を【　　　　　　】という。\n例）1,000万円の【　　　】（耐用年数20年・残存ゼロ・定額法）。毎年減価償却費50万円（1,000万円÷20年）：（借）減価償却費50万円 ／（貸）【　　　】減価償却累計額50万円（間接法）。\nポイント：【　　　】は土地と違い減価償却が必要。直接法では【　　　】を直接減額。間接法では【　　　】はそのまま・累計額で控除表示。',
  '備品': '事務用机・パソコン・コピー機など事務所用備品を計上する有形固定資産科目を【　　　　　　】という。\n例）パソコン24万円を購入（耐用年数4年・定額法・残存ゼロ）。毎年減価償却費6万円：（借）減価償却費6万円 ／（貸）【　　　】減価償却累計額6万円（間接法）。\nポイント：耐用年数1年以上かつ取得価額10万円以上→固定資産として計上・減価償却。10万円未満→消耗品費で即時費用化。',
  '貸付金': '金銭消費貸借契約に基づく貸出元本を計上する資産科目を【　　　　　　】という。\n例）取引先に1,000万円を年利2%で貸付：（借）【　　　】1,000万円 ／（貸）普通預金1,000万円。利息20万円を受取：（借）普通預金20万円 ／（貸）受取利息20万円。\nポイント：元本が【　　　】（資産）、利息が受取利息（収益）。返済を受けたら【　　　】を減らす。証書貸付（借用書あり）のケースに使用。',
  '手形貸付金': '手形を担保に受け取って貸し付けた元本を計上する資産科目を【　　　　　　】という。\n例）取引先に約束手形を担保として500万円を貸付：（借）【　　　】500万円 ／（貸）普通預金500万円。満期日に回収：（借）普通預金500万円 ／（貸）【　　　】500万円。\nポイント：手形を担保として受け取る→【　　　】。証書（借用書）で貸す→貸付金。担保の形式の違いで科目が変わる。',
  '前払金': '商品の仕入前に支払う手付金・内金を一時計上する資産科目を【　　　　　　】という。\n例）商品100万円を注文し、手付金30万円を先払い：（借）【　　　】30万円 ／（貸）現金30万円。商品受取時：（借）仕入100万円 ／（貸）【　　　】30万円・買掛金70万円。\nポイント：【　　　】は「商品仕入の前払い」。仮払金は「目的不確定の前渡し」。前払費用は「サービスの前払い」。',
  '受取商品券': '他者発行の商品券を販売代金として受け取った際の資産科目を【　　　　　　】という。\n例）顧客が商品1万円の支払いとして商品券を利用：（借）【　　　】1万円 ／（貸）売上1万円。後日商品券発行元に換金請求：（借）現金1万円 ／（貸）【　　　】1万円。\nポイント：商品券はお金ではないが換金性が高いため資産（受取手形に近い性格）。自社発行の商品券ではなく「他者（百貨店等）が発行した商品券を受け取った場合」に使う。',
  '現金過不足': '帳簿残高と実際残高の差異を一時的に処理する仮勘定科目を【　　　　　　】という。\n例）帳簿現金残高10万円・実際手元現金9.7万円→差額3,000円が不足：（借）【　　　】3,000円 ／（貸）現金3,000円。原因判明（旅費交通費だった）：（借）旅費交通費3,000円 ／（貸）【　　　】3,000円。期末まで不明なら：（借）雑損3,000円 ／（貸）【　　　】3,000円。\nポイント：不足→借方（費用的）、過剰→貸方（収益的）。原因判明→正式科目へ振替、不明→期末に雑損・雑益へ。',
  '消耗品': '期末に未使用で残る消耗品を一時的に資産計上する科目を【　　　　　　】という。\n例）事務用品（ボールペン・ノート等）1万円を購入し決算時点で3,000円分が未使用。①購入時（資産計上法）：（借）【　　　】1万円 ／（貸）現金1万円。②期末使用分振替：（借）【　　　】費7,000円 ／（貸）【　　　】7,000円。\nポイント：購入時に費用計上（【　　　】費）→期末未使用分を【　　　】（資産）へ振替。または購入時に資産計上（【　　　】）→使用分を【　　　】費（費用）へ振替。どちらの処理方法も出題される。',
  '小口現金': '少額の日常経費用に用意する手元資金を管理する資産科目を【　　　　　　】という。\n例）定額資金前渡制度（インプレスト制）：月初に1万円を小口係へ前渡し。月末に交通費4,000円・切手代3,000円の報告を受け同額を補給：（借）旅費交通費4,000円・通信費3,000円 ／（貸）現金（補給）7,000円。\nポイント：【　　　】は「常に一定額を維持」が特徴（定額資金前渡制度）。報告を受けた時点で費用を認識し、同額を補給して残高を元の定額に戻す。',
  '車両運搬具': '業務用自動車・トラック・フォークリフト等を計上する有形固定資産科目を【　　　　　　】という。\n例）営業車（取得原価200万円・耐用年数5年・定額法・残存ゼロ）。毎年減価償却費40万円：（借）減価償却費40万円 ／（貸）【　　　】減価償却累計額40万円。\nポイント：車両も建物・備品と同様に減価償却が必要な有形固定資産。廃棄・売却時は帳簿価額（取得原価－累計額）と処分価額の差で売却損益を計上。',
  '機械装置': '製造・加工用の大型機械・製造ラインを計上する有形固定資産科目を【　　　　　　】という。\n例）製造ライン機械（取得原価3,000万円・耐用年数10年・定額法）。毎年300万円の減価償却費：（借）減価償却費300万円 ／（貸）【　　　】減価償却累計額300万円。\nポイント：備品との違い→【　　　】は「製造・加工に使う大型設備」。備品は「事務所等で使う汎用品」。製造業の主力設備として工業簿記でも登場する。',
  '構築物': '建物以外の土地上に造られた工作物・設備を計上する有形固定資産科目を【　　　　　　】という。\n例）駐車場のアスファルト舗装（取得原価500万円・耐用年数15年）。毎年減価償却費33.3万円：（借）減価償却費33万円 ／（貸）【　　　】減価償却累計額33万円。\nポイント：建物（屋根・壁あり）ではなく土地に据え付けた構造物が【　　　】。駐車場舗装・塀・フェンス・貯槽タンク等が該当。',
  '工具器具備品': '製造現場で使う工具・測定器・金型など比較的小型の設備を計上する有形固定資産科目を【　　　　　　】という。\n例）精密測定器（取得原価30万円・耐用年数3年・定額法）。毎年減価償却費10万円：（借）減価償却費10万円 ／（貸）【　　　】減価償却累計額10万円。\nポイント：工業簿記では消耗【　　　】（費用処理）と区別する。10万円以上・1年超使用→【　　　】として固定資産計上。',
  'ソフトウェア': '自社利用のコンピュータソフトウェアを無形固定資産として計上した科目を【　　　　　　】という。\n例）基幹システムの【　　　】を1,000万円で購入または開発。5年で均等償却→毎年200万円を【　　　】償却費（費用）として計上。仕訳）取得時：（借）【　　　】1,000万円 ／（貸）現金1,000万円。毎年：（借）【　　　】償却200万円 ／（貸）【　　　】200万円。\nポイント：研究開発費→費用処理（資産不可）。【　　　】→将来効果が確実なら資産計上→5年償却。「開発費と資産計上の境界」「見込みが立たない段階は研究開発費」の判断が重要。',
  'リース資産': 'ファイナンス・リース契約で取得し毎期減価償却する固定資産相当の権利を【　　　　　　】という。\n例）コピー機を5年間ファイナンス・リース契約（月リース料5万円×60か月＝300万円、利息相当額30万円）。【　　　】270万円（元本相当）で計上。5年・残存ゼロで毎年54万円償却。仕訳）契約時：（借）【　　　】270万円 ／（貸）リース債務270万円。毎年：（借）減価償却費54万円 ／（貸）【　　　】54万円、（借）リース債務54万円＋支払利息6万円 ／（貸）現金60万円。\nポイント：ファイナンスリース→「実質購入」として【　　　】・リース債務を計上し減価償却。オペレーティングリース→「レンタル」として支払リース料（費用）のみ。リース料を支払うだけなのに資産・負債が増えることに注意。',
  'のれん': '企業買収時に純資産時価を超えて支払った部分で20年以内の均等償却が必要な無形固定資産を【　　　　　　】という。\n例）A社がB社を1億円で買収。B社の純資産の時価評価額8,000万円→【　　　】2,000万円（超過支払分：B社のブランド・顧客基盤・技術力への対価）。5年均等償却なら年400万円。仕訳）毎年：（借）【　　　】償却400万円 ／（貸）【　　　】400万円。\nポイント：【　　　】＝「時価純資産を超えた超過収益力への対価」。20年以内に必ず償却（連結でも同じ）。負の【　　　】（純資産＞取得原価）は発生時に即座に利益計上。正と負で処理が真逆。',
  '創立費': '会社設立のために要した法的手続き費用等を計上する繰延資産科目を【　　　　　　】という。\n例）会社設立時の登記費用・発起人への報酬合計50万円：（借）【　　　】50万円 ／（貸）現金50万円。5年以内に均等償却：（借）【　　　】償却10万円 ／（貸）【　　　】10万円。\nポイント：繰延資産の1つ（支出済みだが効果が将来にわたる）。創立時のみ発生する科目で、営業開始後の費用（開業費）とは区別する。',
  '株式交付費': '株式・新株予約権の発行にかかった費用を計上する繰延資産科目を【　　　　　　】という。\n例）新株発行に際する目論見書印刷・証券会社への手数料合計200万円：（借）【　　　】200万円 ／（貸）現金200万円。3年以内に均等償却：（借）【　　　】償却67万円 ／（貸）【　　　】67万円。\nポイント：繰延資産の1つ。株式発行のたびに計上できる。ただし少額なら費用処理（営業外費用）も可。',
  '売買目的有価証券': '短期的な売買差益を目的として保有する有価証券で期末に時価評価し評価差額を損益に計上するものを【　　　　　　】という。\n例）A株式を100万円で購入（売買目的）→期末時価120万円。仕訳①購入：（借）【　　　】100万円 ／（貸）現金100万円。仕訳②期末評価替え：（借）【　　　】20万円 ／（貸）有価証券評価益20万円（P/L計上）。翌期首の洗替仕訳：（借）有価証券評価益20万円 ／（貸）【　　　】20万円（取得原価に戻す）。\nポイント：【3区分比較】売買目的→時価評価・差額はP/L。満期保有目的→時価評価なし・償却原価法。その他有価証券→時価評価・差額はB/S純資産。この区分の暗記が最重要。',
  '満期保有目的債券': '満期まで保有する意図と能力を持って取得した社債などの債券で償却原価法で評価するものを【　　　　　　】という。\n例）額面100万円の社債を96万円で取得（4年満期保有予定）。差額4万円を4年で按分。仕訳）取得時：（借）【　　　】96万円 ／（貸）現金96万円。毎年度末（償却原価法）：（借）【　　　】1万円 ／（貸）有価証券利息1万円（4万円÷4年）。4年後：帳簿価額100万円で満期償還。\nポイント：満期保有目的は「時価がいくらでも評価替えしない」のが最大の特徴。取得価格と額面の差は「事実上の追加利息」→毎期受取利息に加算。試験では「償却原価法の計算」が必出。',
  '子会社株式': '子会社を支配するために保有する株式を計上する投資有価証券分類の固定資産科目を【　　　　　　】という。\n例）A社株式の51%を5,000万円で取得（A社を支配）→【　　　】5,000万円（固定資産）。期末に時価が下落しても原則として評価替えしない（時価評価なし）。\nポイント：支配目的→【　　　】（固定資産・時価評価なし）。売買目的→売買目的有価証券（流動資産・時価評価あり）。',
  '関係会社株式': '関連会社や子会社への影響力維持目的で保有する株式を計上する科目を【　　　　　　】という。\n例）B社株式の25%（持分法適用・関連会社）を2,000万円で取得→【　　　】2,000万円（固定資産）。\nポイント：20%以上50%未満保有で「重要な影響力」がある→関連会社株式（【　　　】）。持分法で連結。子会社株式（50%超）とは支配の有無で異なる。',
  '投資有価証券': '長期保有目的や子会社・関連会社株式など投資目的で保有する有価証券を固定資産として計上する科目を【　　　　　　】という。\n例）取引先との関係維持のために長期保有するC社株式30万円（その他有価証券）。期末時価35万円。仕訳）取得時：（借）【　　　】30万円 ／（貸）現金30万円。期末評価替え：（借）【　　　】5万円 ／（貸）その他有価証券評価差額金5万円（純資産へ、P/L経由なし）。\nポイント：その他有価証券の評価差額は「P/Lをスルーして純資産へ直入」。売買目的の評価差額は「P/Lへ」。この違いを「どちらがP/L経由か」で整理すること。',
  '長期前払費用': '前払費用のうち支払日から1年を超えた後に費用化される部分を固定資産に計上する科目を【　　　　　　】という。\n例）5年間の火災保険料60万円を一括前払い（3月決算）。今後1年以内費用化分12万円→前払費用（流動資産）。1年超の費用化分48万円→【　　　】（固定資産）。毎年12万円ずつ保険料（費用）に振替。仕訳）支払時：（借）前払費用12万円＋【　　　】48万円 ／（貸）現金60万円。毎年：（借）保険料12万円 ／（貸）前払費用12万円。\nポイント：1年基準の区分→1年以内に費用化→前払費用（流動）。1年超→【　　　】（固定）。毎決算時に見直してB/S上の分類を変える。',
  '繰延税金資産': '将来の節税効果相当額を計上する資産科目を【　　　　　　】という。\n例）貸倒引当金20万円を会計上費用計上したが税務は今期認めない→将来認定時に課税所得が減る→節税効果。税率30%なら【　　　】6万円（20万円×30%）。仕訳）（借）【　　　】6万円 ／（貸）法人税等調整額6万円（P/L：税金を6万円分減らす効果）。翌期に税務認定された時：（借）法人税等調整額6万円 ／（貸）【　　　】6万円（資産解消）。\nポイント：【　　　】は「将来の節税効果の前払い」。引当金・減損・未払費用などで会計＞税務の費用認識ズレが生じる時に発生。繰延税金負債（将来の税負担増）との違いを押さえる。',
  '別段預金': '特定目的のために分離管理される特別な預金口座科目を【　　　　　　】という。\n例）新株申込証拠金1,000万円を投資家から受取→特別管理の【　　　】に入金：（借）【　　　】1,000万円 ／（貸）株式申込証拠金1,000万円。株式発行完了時に正規口座へ振替：（借）普通預金1,000万円 ／（貸）【　　　】1,000万円。\nポイント：【　　　】は「特定目的のために分離管理する預金」。新株申込証拠金の管理に使うケースが典型。',
  '商品': '売上原価対立法または分記法における商品在庫を計上する棚卸資産科目を【　　　　　　】という。\n例）売上原価対立法で【　　　】50万円を仕入：（借）【　　　】50万円 ／（貸）買掛金50万円。販売時：（借）売掛金80万円 ／（貸）売上80万円 ＋ （借）売上原価50万円 ／（貸）【　　　】50万円（販売のたびに原価を認識）。\nポイント：三分法→仕入勘定を使い期末に調整。売上原価対立法→【　　　】勘定を使い販売時に原価を認識。',
  '不渡手形': '支払期日に決済されなかった手形を計上する資産科目を【　　　　　　】という。\n例）保有していた受取手形50万円が支払期日に決済されず（支払人の口座残高不足）→【　　　】：（借）【　　　】50万円 ／（貸）受取手形50万円。後日回収不能が確定：（借）貸倒損失50万円 ／（貸）【　　　】50万円。\nポイント：不渡り＝手形が決済されないこと。【　　　】はまだ回収可能性がある資産として管理。回収不能確定なら貸倒損失へ。',
  '建設仮勘定': '建物・機械等の固定資産の完成前に支払った手付金・中間払いを一時計上する資産科目を【　　　　　　】という。\n例）新工場建設（総額5億円）で着工金として2億円を支払い。完成まで1年かかる。仕訳）着工金支払：（借）【　　　】2億円 ／（貸）現金2億円。工事中間払い：（借）【　　　】1億円 ／（貸）現金1億円。完成・引渡し時：（借）建物5億円 ／（貸）【　　　】3億円＋現金2億円（残金）。\nポイント：【　　　】は「完成していないので減価償却しない」資産。完成して使い始めた時点で減価償却が始まる。工事代金の支払ごとに加算し完成時に一括して正式固定資産に振り替える。',
  '未決算': '金額・結果が未確定の取引を一時的に処理する仮勘定科目を【　　　　　　】という。\n例）火災で帳簿価額500万円の建物が焼失。保険金額が未確定：（借）【　　　】500万円 ／（貸）建物500万円。後日保険金600万円確定：（借）現金600万円 ／（貸）【　　　】500万円・保険差益100万円。\nポイント：「結果がまだ確定していない取引」を一時的に処理する仮勘定。保険金確定後に正式な科目へ振替。',
  '破産更生債権等': '法的整理中の取引先への債権を流動資産から固定資産に振替計上する科目を【　　　　　　】という。\n例）取引先が破産申請。保有する売掛金200万円を一般債権から切替：（借）【　　　】200万円 ／（貸）売掛金200万円。回収困難なため全額引当：（借）貸倒引当金繰入200万円 ／（貸）貸倒引当金200万円。\nポイント：破産・更生・和議など法的手続き中の債権は「【　　　】」として固定資産に分類（流動資産から除外）し全額引当。',
  '工事未収入金': '建設業などで工事収益が計上されているが代金がまだ受け取られていない場合に使う資産科目を【　　　　　　】という。\n例）工事進捗度50%で工事収益5,000万円を計上したが、請求・入金は工事完成後。仕訳）収益認識時：（借）【　　　】5,000万円 ／（貸）工事収益5,000万円。入金時：（借）現金5,000万円 ／（貸）【　　　】5,000万円。\nポイント：一般の売掛金＝商品引渡し後の未収金。【　　　】＝建設・工事業での未収金。どちらも「売上（収益）計上後の代金未回収分」という意味は同じ。試験では建設業の問題に出てくる。',
  '長期貸付金': '返済期限が1年を超える長期の貸付元本を計上する固定資産科目を【　　　　　　】という。\n例）子会社に5,000万円を返済期限3年で貸付：（借）【　　　】5,000万円 ／（貸）普通預金5,000万円。翌期以降1年以内に返済予定の部分→流動資産「貸付金」に振替。\nポイント：返済期限1年超→【　　　】（固定資産）。1年以内→貸付金（流動資産）。決算ごとに流動・固定の振替確認が必要。',
  '営業外受取手形': '商品の売上以外の取引（固定資産売却等）で受け取った手形を計上する科目を【　　　　　　】という。\n例）工場（固定資産）を売却し、代金として手形100万円を受取：（借）【　　　】100万円 ／（貸）土地100万円（または固定資産売却益等）。\nポイント：商品売買の手形→受取手形（流動資産・売上債権）。固定資産等営業外取引の手形→【　　　】（流動資産だが営業外）。使い分けに注意。',
  '営業外電子記録債権': '商品売買以外の取引で電子記録により発生した債権を計上する科目を【　　　　　　】という。\n例）固定資産の売却代金を電子記録で請求：（借）【　　　】100万円 ／（貸）固定資産（帳簿価額）・固定資産売却益。\nポイント：商品・製品の売上から生じた電子記録→電子記録債権（売上債権・流動資産）。それ以外の取引（固定資産売却等）から生じた電子記録→【　　　】。',
  '諸資産': '複数の資産科目をまとめて一括表示するために用いる便宜的な科目を【　　　　　　】という。\n例）連結精算表や合算表で複数の資産をまとめて表示する際に「【　　　】」と一括表示することがある。個別勘定科目が確定している場合は使わない。\nポイント：試験上は「複数の資産をまとめて仕訳に記載する便宜的な表記」として使用。実務では使わない科目名。',
  '買掛金': '商品を掛けで仕入れた際の代金支払義務を計上する負債科目を【　　　　　　】という。\n例）仕入先から商品100万円を後払い（掛け）で仕入：（借）仕入100万円 ／（貸）【　　　】100万円。翌月末に支払：（借）【　　　】100万円 ／（貸）普通預金100万円。\nポイント：商品の掛け仕入→【　　　】。パソコン等固定資産の後払い→未払金。「何を買ったか」で科目が変わる。',
  '支払手形': '自社が振り出した約束手形・為替手形の引受額を計上する負債科目を【　　　　　　】という。\n例）仕入代金100万円を3か月後払いの約束手形で支払：（借）仕入100万円 ／（貸）【　　　】100万円。3か月後に当座預金から自動決済：（借）【　　　】100万円 ／（貸）当座預金100万円。\nポイント：手形を「振り出す」→【　　　】（自社の支払義務）。手形を「受け取る」→受取手形（自社の権利）。',
  '電子記録債務': '電子記録機関（でんさいネット等）への登録で発生する金銭債務科目を【　　　　　　】という。\n例）仕入先への代金100万円を電子記録で登録（紙の手形の代わり）：（借）仕入100万円 ／（貸）【　　　】100万円。支払期日に口座から自動引落し：（借）【　　　】100万円 ／（貸）当座預金100万円。\nポイント：紙の支払手形と同機能だが書類郵送・保管が不要。',
  '未払金': '商品の仕入以外の取引で生じた代金の未払い義務を計上する負債科目を【　　　　　　】という。\n例）事務用パソコン20万円を後払いで購入：（借）備品20万円 ／（貸）【　　　】20万円。翌月支払：（借）【　　　】20万円 ／（貸）普通預金20万円。\nポイント：商品の掛け仕入→買掛金。固定資産・水道光熱費など商品以外→【　　　】。「商品以外の物品・サービスの後払い」が【　　　】。',
  '借入金': '金銭消費貸借契約書に基づく借入元本の返済義務を計上する負債科目を【　　　　　　】という。\n例）銀行から1,000万円を年利2%・3年返済で借入：（借）普通預金1,000万円 ／（貸）【　　　】1,000万円。年間利息：（借）支払利息20万円 ／（貸）普通預金20万円（元本返済分は【　　　】を減額）。\nポイント：【　　　】は「元本残高」。利息は「支払利息（費用）」として別計上。元本返済は費用にならない。',
  '手形借入金': '手形を振り出すことを条件に借り入れた元本の返済義務を計上する負債科目を【　　　　　　】という。\n例）金融機関に約束手形を担保として500万円を借入：（借）普通預金500万円 ／（貸）【　　　】500万円。満期日に返済：（借）【　　　】500万円 ／（貸）当座預金500万円。\nポイント：証書（借用書）で借りる→借入金。手形を担保として差入れて借りる→【　　　】。手形という有価証券が絡む点が借入金との違い。',
  '未払利息': '当期に発生したがまだ支払っていない利息を見越し計上する負債科目を【　　　　　　】という。\n例）3月決算・2〜3月分の借入利息2万円がまだ未払い：決算整理（借）支払利息2万円 ／（貸）【　　　】2万円。4月に実際に支払い：（借）【　　　】2万円 ／（貸）現金2万円（費用の二重計上を防ぐ）。\nポイント：翌期の支払時は「費用計上せず、【　　　】を消去する」だけ。翌期首に再振替仕訳が必要な場合も。',
  '前受金': '商品引渡し前に受け取った手付金・内金を一時計上する負債科目を【　　　　　　】という。\n例）来月届ける商品50万円の注文で手付金10万円を受取：（借）現金10万円 ／（貸）【　　　】10万円。商品引渡し時：（借）【　　　】10万円・現金40万円 ／（貸）売上50万円。\nポイント：手付金受取時は「まだ商品を渡していない」→【　　　】（負債）。引渡し後に売上へ振替。',
  '仮受金': '入金の原因・相手方が未確定の場合に一時的に計上する負債科目を【　　　　　　】という。\n例）口座に100万円の振込があったが目的不明：（借）普通預金100万円 ／（貸）【　　　】100万円。後日、得意先からの売掛金回収と判明：（借）【　　　】100万円 ／（貸）売掛金100万円。\nポイント：入金はあったが「誰から・何のための入金か不明」な場合に一時計上。原因判明後に正式な科目へ振替。',
  '当座借越': '当座預金残高を超えて引落しが生じた際に発生する銀行への短期借入れに相当する負債科目を【　　　　　　】という。\n例）当座預金残高50万円なのに小切手80万円を振り出し（【　　　】契約あり）：（借）当座預金50万円・【　　　】30万円 ／（貸）当座預金80万円（または当座預金がマイナスになり【　　　】30万円が負債）。後日入金で解消：（借）普通預金→当座預金へ振替で解消。\nポイント：【　　　】契約なし→残高超過小切手は不渡り。【　　　】は「銀行が立替えてくれた短期借入れ」。',
  '預り金': '従業員から一時的に預かった源泉所得税・住民税等を計上する負債科目を【　　　　　　】という。\n例）社員給料30万円から源泉所得税3万円・住民税2万円を天引き：（借）給料30万円 ／（貸）現金（手取り）25万円・【　　　】5万円。翌月納付：（借）【　　　】5万円 ／（貸）現金5万円。\nポイント：【　　　】は「会社のお金ではなく第三者（税務署等）へ預かって納める義務」→負債。社会保険料・所得税・住民税の天引き時に使う。',
  '社会保険預り金': '給与から控除した従業員負担分の社会保険料を一時計上する負債科目を【　　　　　　】という。\n例）社員の社会保険料（健康保険・厚生年金）の本人負担分を給料から天引き：（借）給料 ／（貸）【　　　】。年金事務所へ会社負担分と合計して納付：（借）【　　　】（従業員分）・法定福利費（会社負担分） ／（貸）現金。\nポイント：社会保険料は会社が立替えて従業員・会社両方の分を年金事務所へ納付。従業員負担分→預り金（負債）、会社負担分→法定福利費（費用）。',
  '所得税預り金': '給与から源泉徴収した所得税を翌月納付まで一時計上する負債科目を【　　　　　　】という。\n例）社員の源泉所得税3万円を給与から天引き：（借）給料 ／（貸）【　　　】3万円（・現金等）。翌月10日に税務署へ納付：（借）【　　　】3万円 ／（貸）現金3万円。\nポイント：「預り金」の一種。給与支払の都度、源泉徴収して翌月10日（特例は7月・1月）に税務署へ納付。会社は源泉徴収義務者として代わりに預かって納める。',
  '未払法人税等': '期末決算で確定した法人税等の未納付額を計上する負債科目を【　　　　　　】という。\n例）期末に法人税等の確定額100万円・中間申告で仮払済み60万円→差額40万円が未払：（借）法人税等100万円 ／（貸）仮払法人税等60万円・【　　　】40万円。翌期に納付：（借）【　　　】40万円 ／（貸）現金40万円。\nポイント：中間申告済みの仮払法人税等と相殺し、差額（追加納付額）を【　　　】として計上。',
  '未払消費税': '期末に確定した消費税の未納付額を計上する負債科目を【　　　　　　】という。\n例）税抜処理で仮受消費税80万円・仮払消費税50万円→差額30万円が納付義務：（借）仮受消費税80万円 ／（貸）仮払消費税50万円・【　　　】30万円。翌期に税務署へ納付：（借）【　　　】30万円 ／（貸）現金30万円。\nポイント：税抜処理では仮受・仮払を期末に相殺し差額を【　　　】（または未収消費税）として確定。',
  '仮受消費税': '税抜処理で売上・収益にかかる消費税を一時的に計上する負債科目を【　　　　　　】という。\n例）商品110万円（税込）を販売（税抜処理）：（借）売掛金110万円 ／（貸）売上100万円・【　　　】10万円。期末に仮払消費税6万円と相殺→差額4万円を未払消費税へ。\nポイント：税抜処理では売上時の消費税を【　　　】（負債）として預かり、仕入時の消費税を仮払消費税（資産）として計上。期末に両者を相殺して差額を納付。',
  '未払配当金': '株主総会での配当決議から実際の支払いまでの間に計上する負債科目を【　　　　　　】という。\n例）株主総会で配当金100万円を決議：（借）繰越利益剰余金100万円 ／（貸）【　　　】100万円。株主に実際に支払い：（借）【　　　】100万円 ／（貸）普通預金100万円。\nポイント：配当は「決議日」に費用・負債を認識し、「支払日」に現金が出る。',
  '前受収益': '当期に収益を受け取ったが翌期以降に対応する未経過分を負債計上する経過勘定を【　　　　　　】という。\n例）10月1日に家賃1年分12万円を受取（3月決算）→翌4〜9月分6万円が未経過：（借）受取家賃6万円 ／（貸）【　　　】6万円（期末繰延べ）。翌期4月1日に再振替：（借）【　　　】6万円 ／（貸）受取家賃6万円。\nポイント：【　　　】＝「お金は受け取ったがサービスはまだ提供していない」部分→負債。前払費用（費用側）とセットで覚える。',
  '未払費用': '当期に発生した費用のうちまだ支払っていない部分を見越し計上する負債科目を【　　　　　　】という。\n例）3月決算・2〜3月分の給料20万円が未払→（借）給料20万円 ／（貸）【　　　】20万円（見越し計上）。4月に支払い：（借）【　　　】20万円 ／（貸）現金20万円（再び給料計上しない）。\nポイント：【　　　】＝「サービスは受けたがまだ払っていない」→負債。未収収益（収益側の裏）とセットで覚える。再振替不要（翌期支払時に【　　　】を消去するだけ）。',
  '社債': '株式会社が不特定多数の投資家から長期資金を集めるために発行する有価証券で定期的な利払いと元本返済義務を負う負債科目を【　　　　　　】という。\n例）額面1億円・クーポン1%・5年満期の【　　　】を9,700万円（97円発行）で発行。差額300万円は5年で均等償却（年60万円を【　　　】利息に加算）。仕訳）発行時：（借）当座預金9,700万円 ／（貸）【　　　】9,700万円。毎年利息：（借）【　　　】利息100万円（名目利息）＋60万円（償却原価法分）／（貸）当座預金100万円・【　　　】60万円。満期：（借）【　　　】1億円 ／（貸）当座預金1億円。\nポイント：割引発行→発行価額＜額面→差額を毎期【　　　】利息に加算し帳簿価額を額面に近づける（償却原価法）。試験では「年間【　　　】利息の計算（名目利息＋償却原価法分）」が必出。',
  'リース債務': 'ファイナンスリース契約の借手が計上する、リース料支払義務の現在価値に相当する負債科目を【　　　　　　】という。\n例）ファイナンスリース元本270万円（5年契約）：（借）リース資産270万円 ／（貸）【　　　】270万円。毎年の支払60万円（元本54万円＋利息6万円）：（借）【　　　】54万円・支払利息6万円 ／（貸）現金60万円。\nポイント：【　　　】はリース資産の「裏側の負債」。毎年元本部分だけ【　　　】が減少。',
  '製品保証引当金': '販売済み製品の無償修理・交換など将来の保証費用を決算時に見積もり計上する引当金を【　　　　　　】という。\n例）当期売上100万円の製品について過去実績から2%（2万円）の無償修理が予想される。仕訳）引当金設定：（借）【　　　】繰入2万円（費用）／（貸）【　　　】2万円（負債）。翌期実際に修理費1.5万円発生：（借）【　　　】1.5万円 ／（貸）現金1.5万円（引当金を取り崩す）。\nポイント：引当金設定の4要件→①将来の特定の費用・損失、②発生が確実または確率高い、③原因が当期、④金額を合理的に見積れる。4つ全てを満たす時だけ引当金を積む。',
  '退職給付引当金': '従業員の将来の退職給付支払義務のうち当期までに発生した分を見積もって積み立てる引当金を【　　　　　　】という。\n例）全従業員の退職給付債務（将来退職金の現在価値）10億円・年金資産（運用積立）7億円→【　　　】3億円（B/S負債）。当年度の退職給付費用500万円（①勤務費用300万円＋②利息コスト200万円）。仕訳①費用計上：（借）退職給付費用500万円 ／（貸）【　　　】500万円。仕訳②実際の退職金支払：（借）【　　　】XXX万円 ／（貸）現金XXX万円（引当金を取り崩す）。\nポイント：【　　　】＝退職給付債務－年金資産。年金資産（積立済み）は控除する。費用の2要素：①勤務費用（今年1年働いた分の積上げ）＋②利息費用（債務残高×割引率）。',
  '繰延税金負債': '将来の税負担増加額を先取り計上する負債科目を【　　　　　　】という。\n例）その他有価証券の評価益100万円→会計上は純資産増加・税務は未課税（売却時に課税）。税率30%なら将来税負担30万円増加。仕訳）（借）その他有価証券評価差額金30万円 ／（貸）【　　　】30万円（純資産内の評価差額から税効果相当を控除）。将来売却・課税時：（借）【　　　】30万円 ／（貸）法人税等30万円（税負担を実現）。\nポイント：【　　　】は「将来の税負担の先取り」。その他有価証券の評価益や「会計＜税務の費用」の場合に発生。繰延税金資産（将来の節税）と逆の効果をもつ。',
  '株式申込証拠金': '新株申込みを受けたが会社設立・増資の登記未完了の間に払込金を計上する負債科目を【　　　　　　】という。\n例）新株1,000株の申込みを受け、払込金1,000万円を別段預金で受入：（借）別段預金1,000万円 ／（貸）【　　　】1,000万円。登記完了後：（借）【　　　】1,000万円 ／（貸）資本金500万円・資本準備金500万円。\nポイント：払込みを受けたが会社設立・増資の登記完了前は【　　　】（負債）として計上。登記後に資本金・資本準備金へ振替。',
  '工事未払金': '建設業で工事にかかる外注費・材料費等の未払い義務を計上する負債科目を【　　　　　　】という。\n例）建設業で外注業者への工事代金3,000万円が未払：（借）工事原価3,000万円 ／（貸）【　　　】3,000万円。翌月支払：（借）【　　　】3,000万円 ／（貸）普通預金3,000万円。\nポイント：建設業特有の科目。一般事業の「買掛金」に相当。工事に関係しない通常の仕入は買掛金または未払金を使う。',
  '営業外電子記録債務': '営業取引以外から生じた電子記録の支払義務を計上する負債科目を【　　　　　　】という。\n例）固定資産の購入代金を電子記録で支払義務登録：（借）固定資産 ／（貸）【　　　】。支払期日に自動引落し：（借）【　　　】 ／（貸）当座預金。\nポイント：商品の仕入→電子記録債務（営業取引）。固定資産等の購入→【　　　】。',
  '営業外支払手形': '商品売買以外の取引で振り出した手形による支払義務を計上する負債科目を【　　　　　　】という。\n例）固定資産の購入代金を手形で支払：（借）固定資産100万円 ／（貸）【　　　】100万円。満期日に決済：（借）【　　　】100万円 ／（貸）当座預金100万円。\nポイント：商品の仕入対価の手形→支払手形（流動負債・営業取引）。固定資産等の購入代金の手形→【　　　】。',
  '諸負債': '複数の負債科目をまとめて一括表示するために用いる便宜的な科目を【　　　　　　】という。\n例）連結精算表等で複数の負債をまとめて表示する際に「【　　　】」と一括表示する便宜的な表記。個別科目が確定している場合は使わない。\nポイント：試験では「複数の負債科目をまとめて仕訳に記載する便宜的な科目名」として出題。実務では使わない。',
  '仕入': '三分法で商品を仕入・販売する費用科目を【　　　　　　】という。\n例）【　　　】先から商品100万円を掛けで購入：（借）【　　　】100万円 ／（貸）買掛金100万円。期末決算整理（しくりくりし）：①（借）【　　　】XX ／（貸）繰越商品XX（期首商品を【　　　】へ）、②（借）繰越商品YY ／（貸）【　　　】YY（期末商品を繰越商品へ）。\nポイント：「しくりくりし」＝【　　　】に繰越商品を加えて繰越商品を【　　　】から引く。',
  '支払家賃': '事務所・店舗・倉庫等を賃借して支払う賃借料を計上する費用科目を【　　　　　　】という。\n例）事務所家賃を毎月10万円支払：（借）【　　　】10万円 ／（貸）現金10万円。1年分120万円を前払い（10月決算）→翌11月〜9月分100万円は前払費用へ：（借）前払費用100万円 ／（貸）【　　　】100万円。\nポイント：前払い部分は資産（前払費用）。翌期の賃料は翌期の費用。',
  '支払手数料': '例）仕入商品の振込手数料550円：（借）支払手数料550円 ／（貸）現金550円。不動産仲介で事務所を借りた際の手数料30万円：（借）支払手数料30万円 ／（貸）普通預金30万円。ポイント：銀行手数料・弁護士報酬・仲介手数料など外部サービスへの支払いを広く計上する費用科目を【　　　　　　】という。',
  '支払利息': '借入金・社債等に対して支払う利息を計上する営業外費用科目を【　　　　　　】という。\n例）借入金1,000万円・年利2%→年間利息20万円：（借）【　　　】20万円 ／（貸）普通預金20万円。期末に2か月分未払い3.3万円：（借）【　　　】3.3万円 ／（貸）未払利息3.3万円（見越し計上）。\nポイント：元本の返済は費用ではない（借入金の減少）。利息の支払いのみが【　　　】（費用）。',
  '支払保険料': '火災保険・損害保険等の保険料を計上する費用科目を【　　　　　　】という。\n例）4月1日に1年分の火災保険料12万円を支払（3月決算）：（借）【　　　】12万円 ／（貸）現金12万円（全額当期分）。10月払いなら翌4〜9月分6万円を繰延べ：（借）前払費用6万円 ／（貸）【　　　】6万円。\nポイント：翌期にまたがる分→前払費用（資産）へ繰延べ。翌期首に再振替が必要。',
  '租税公課': '固定資産税・印紙税等の税金と公的な賦課金を計上する販管費科目を【　　　　　　】という。\n例）固定資産税10万円を支払：（借）【　　　】10万円 ／（貸）現金10万円。収入印紙200円を購入：（借）【　　　】200円 ／（貸）現金200円。\nポイント：固定資産税・印紙税・事業所税など。法人税等（所得課税）とは別科目。消費税（税込処理）も【　　　】に計上する。',
  '広告宣伝費': 'テレビ・新聞・ウェブ広告等不特定多数向けの宣伝費を計上する販管費科目を【　　　　　　】という。\n例）SNS広告費50万円・折込チラシ印刷代20万円：（借）【　　　】70万円 ／（貸）普通預金70万円。\nポイント：不特定多数への宣伝→【　　　】。特定取引先の接待→交際費。特定客への見本品提供→見本品費（または【　　　】）。',
  '通信費': 'インターネット料金・郵便料金・電話代等を計上する費用科目を【　　　　　　】という。\n例）電話代3万円・切手購入1万円（うち5,000円未使用）：（借）【　　　】3万5,000円 ／（貸）普通預金3万5,000円。期末に未使用切手5,000円：（借）貯蔵品5,000円 ／（貸）【　　　】5,000円。\nポイント：切手・収入印紙の期末未使用分は貯蔵品（資産）へ振替。',
  '旅費交通費': '出張時の交通費・宿泊費・日当等を計上する費用科目を【　　　　　　】という。\n例）出張で仮払金2万円を前渡し。実際支出は交通費1万円・宿泊費1.5万円＝2.5万円：（借）【　　　】2.5万円 ／（貸）仮払金2万円・現金5,000円（追加精算）。\nポイント：仮払金があれば精算時に【　　　】へ振替。',
  '修繕費': '建物・設備等の原状回復・維持のための修理費を計上する費用科目を【　　　　　　】という。\n例）雨漏り修理（原状回復）に30万円：（借）【　　　】30万円 ／（貸）現金30万円。大規模な屋根全面改修で耐用年数延長→資本的支出100万円：（借）建物100万円 ／（貸）現金100万円（費用化しない）。\nポイント：「元に戻す修理」→【　　　】（費用）。「価値を高める改修」→資本的支出（固定資産）。この区別が頻出。',
  '貸倒損失': '売掛金等の債権が回収不能と確定した際の損失を計上する費用科目を【　　　　　　】という。\n例）売掛金100万円の取引先が破産し回収不能確定。引当金60万円積立済み：（借）貸倒引当金60万円・【　　　】40万円 ／（貸）売掛金100万円。\nポイント：貸倒引当金があれば先に取崩し、超過分のみ【　　　】（費用）。貸倒引当金がなければ全額【　　　】。',
  '貸倒引当金繰入': '決算時に債権の回収懸念に備えて引当金を設定する際の費用科目を【　　　　　　】という。\n例）期末売掛金1,000万円に貸倒実績率2%→引当金20万円必要。現残高8万円→差額12万円を追加設定：（借）【　　　】12万円 ／（貸）貸倒引当金12万円（差額補充法）。\nポイント：【　　　】は費用（P/L）、貸倒引当金は評価勘定（B/Sで売掛金から控除）。期末に見積りで設定する費用であり実際の損失ではない。',
  '減価償却費': '固定資産の取得原価を耐用年数にわたり費用配分する科目を【　　　　　　】という。\n例）パソコン（取得原価20万円・耐用年数4年・定額法）：毎年5万円の【　　　】。間接法：（借）【　　　】5万円 ／（貸）備品減価償却累計額5万円。直接法：（借）【　　　】5万円 ／（貸）備品5万円。\nポイント：現金は出ない「非現金費用」だが費用として利益を減少させる。間接法→減価償却累計額を使う・固定資産の帳簿価額は取得原価のまま。直接法→固定資産を直接減額。',
  '発送費': '商品を顧客に届ける際の当社負担の配送・運送費を計上する費用科目を【　　　　　　】という。\n例）商品を顧客に発送・送料1,500円（当社負担）：（借）【　　　】1,500円 ／（貸）現金1,500円。顧客負担の着払いなら【　　　】は計上しない。\nポイント：売り主（当社）が負担する配送料→【　　　】（費用）。顧客負担→顧客の費用なので計上しない。',
  '雑損': '偶発的な損失や金額が少額で他の科目に当てはまらない費用を計上する科目を【　　　　　　】という。\n例）現金が帳簿より3,000円少なく原因不明のまま期末を迎えた：（借）【　　　】3,000円 ／（貸）現金過不足3,000円（または現金3,000円）。\nポイント：現金過不足（不足）が期末まで原因不明→【　　　】（費用）へ振替。原因が判明すれば正式な費用科目（旅費交通費等）へ振替。現金過不足の超過（帳簿>実際）は→雑益。',
  '法定福利費': '法律で義務付けられた社会保険料の会社負担分等を計上する費用科目を【　　　　　　】という。\n例）社会保険料の会社負担分（健康保険・厚生年金・雇用保険等）を支払：（借）【　　　】30万円 ／（貸）現金30万円（＋同時に社会保険預り金で従業員負担分を控除）。\nポイント：社会保険料の会社負担分→【　　　】（費用）。従業員負担分→給料から天引き→社会保険預り金（負債）。',
  '給料': '従業員への給与（基本給・手当等）を計上する費用科目を【　　　　　　】という。\n例）社員【　　　】30万円（源泉税3万円・社会保険料天引き2万円）→手取り25万円を支払：（借）【　　　】30万円 ／（貸）現金25万円・所得税預り金3万円・社会保険預り金2万円。\nポイント：【　　　】は「額面（総支給額）」で費用計上。手取りは関係ない。各種控除額は預り金（負債）に計上。役員報酬は「役員給与」として区別する場合もある。',
  '法人税等': '法人税・住民税（地方税）・事業税の3つを合計して計上する税金科目を【　　　　　　】という。\n例）期末の法人税・住民税・事業税の合計確定額300万円。中間申告・仮払済み120万円：（借）【　　　】300万円 ／（貸）仮払【　　　】120万円・未払【　　　】180万円。\nポイント：【　　　】は損益計算書の最後に計上（他の費用と異なる位置）。消費税（間接税）とは別。',
  '固定資産売却損': '固定資産の売却で生じた損失（売却価格が帳簿価額を下回る部分）を計上する費用科目を【　　　　　　】という。\n例）帳簿価額80万円（取得200万円－累計120万円）の機械を60万円で売却：（借）現金60万円・【　　　】20万円・減価償却累計額120万円 ／（貸）機械装置200万円。\nポイント：売却価格＜帳簿価額→【　　　】（費用）。売却価格＞帳簿価額→固定資産売却益（収益）。帳簿価額（取得原価－累計）と売却価格の差で判定。',
  '消耗品費': '10万円未満・耐用年数1年未満の小物備品等を購入時に費用計上する科目を【　　　　　　】という。\n例）ボールペン・ノート等の事務用品1万円を購入・すぐ使用：（借）【　　　】1万円 ／（貸）現金1万円（即時費用化）。期末に未使用分3,000円が残る場合は貯蔵品へ振替：（借）貯蔵品3,000円 ／（貸）【　　　】3,000円。\nポイント：購入時に即費用化→【　　　】。期末残存分は貯蔵品（資産）。',
  '手形売却損': '受取手形を満期前に銀行で割り引いた際の割引料・手数料を計上する費用科目を【　　　　　　】という。\n例）受取手形50万円を満期前に銀行で割り引き（売却）。手数料・割引料5,000円差引き49.5万円を受取：（借）当座預金49.5万円・【　　　】5,000円 ／（貸）受取手形50万円。\nポイント：手形の割引＝手形を満期前に銀行に売ること（手形売却）。割引料・手数料が【　　　】（費用）。',
  '売上原価': '販売した商品・製品の仕入原価の合計を【　　　　　　】という。\n例）三分法：【　　　】＝期首繰越商品50万円＋当期仕入250万円－期末繰越商品30万円＝270万円。売上300万円－【　　　】270万円＝売上総利益30万円。\nポイント：「売れた商品の仕入原価の合計」。三分法では決算整理で確定。【　　　】対立法では販売のたびに確定。',
  '棚卸減耗損': '帳簿数量と実際数量の差（数量不足）に取得原価を乗じて計上する費用を【　　　　　　】という。\n例）帳簿在庫100個・実地棚卸95個→5個が不足。原価1,000円/個→【　　　】5,000円：（借）【　　　】5,000円 ／（貸）繰越商品5,000円。\nポイント：【　　　】＝「数量の差（紛失・盗難・自然損耗）」。商品評価損＝「単価の差（時価下落）」。この区別が重要。',
  '商品評価損': '期末棚卸で商品の正味売却価額が取得原価を下回った場合の評価差額を費用処理する科目を【　　　　　　】という。\n例）商品（原価1,000円/個×100個）の正味売却価額が800円/個に下落→評価損：（借）【　　　】2万円（（1,000円－800円）×100個）／（貸）繰越商品2万円。\nポイント：【　　　】は「価格の差（時価下落）」。低価法の適用で発生。棚卸減耗損は「数量の差」。この区別が重要。',
  '有価証券評価損': '有価証券の期末評価替えで時価が帳簿価額を下回った差額を計上する費用科目を【　　　　　　】という。\n例）売買目的の株式（帳簿価額1,000円）が期末時価800円に下落：（借）【　　　】200円 ／（貸）売買目的有価証券200円。\nポイント：売買目的有価証券→時価評価・評価差額はP/L（評価損=費用、評価益=収益）。その他有価証券→評価差額はB/S純資産（P/L経由なし）。',
  '有価証券売却損': '有価証券を売却した際に帳簿価額を下回った損失を計上する費用科目を【　　　　　　】という。\n例）帳簿価額1,000円の株式を800円で売却：（借）現金800円・【　　　】200円 ／（貸）売買目的有価証券1,000円。\nポイント：売却損（売却価格＜帳簿価額）→費用。売却益（売却価格＞帳簿価額）→収益。評価損は時価評価で認識、売却損は実際売却時に確定。',
  '電子記録債権売却損': '電子記録債権を満期前に売却した際の割引料・手数料を計上する費用科目を【　　　　　　】という。\n例）電子記録債権50万円を満期前に売却（ファクタリング等）。売却手数料1万円：（借）普通預金49万円・【　　　】1万円 ／（貸）電子記録債権50万円。\nポイント：手形割引の電子記録版。',
  '債権売却損': '売掛金等の債権を額面以下で売却した際の損失を計上する費用科目を【　　　　　　】という。\n例）売掛金100万円を90万円でファクタリング（売却）：（借）現金90万円・【　　　】10万円 ／（貸）売掛金100万円。\nポイント：ファクタリング＝売掛金等の債権を売却して早期に資金化する手法。売却時の損失が【　　　】（費用）。',
  '社債利息': '社債の名目利息＋割引発行時の償却額を合計して計上する費用科目を【　　　　　　】という。\n例）額面1億円・クーポン1%の社債→毎期名目利息100万円：（借）【　　　】100万円 ／（貸）現金100万円。割引発行の場合は償却原価法分も追加：（借）【　　　】160万円（名目100万円＋償却60万円）／（貸）現金100万円・社債60万円。\nポイント：【　　　】は「支払利息」とは別の科目。',
  'のれん償却': '買収等で生じたのれんを定額法で毎期費用化する科目を【　　　　　　】という。\n例）のれん2,000万円（5年均等償却）：毎年（借）【　　　】400万円 ／（貸）のれん400万円。20年以内に完全償却必要。\nポイント：のれんは減価償却ではなく「償却」と呼ぶ（無形固定資産のため累計額勘定を使わず直接法）。会計基準上のれんは毎期均等償却が必要（任意の期間は不可）。',
  '退職給付費用': '将来の退職金支払に備えて毎期見積もり計上する費用科目を【　　　　　　】という。\n例）当期の【　　　】（勤務費用＋利息費用等）100万円を計上：（借）【　　　】100万円 ／（貸）退職給付引当金100万円。\nポイント：毎期の積立相当額を費用計上→退職給付引当金（負債）が積み上がる。実際退職時に引当金を取崩して退職金を支払う仕組み。',
  '製品保証引当金繰入': '製品の無償修理・交換保証のために引当金を設定する際の費用科目を【　　　　　　】という。\n例）当期売上1億円・保証修理費率2%→引当金200万円設定：（借）【　　　】200万円 ／（貸）製品保証引当金200万円。\nポイント：【　　　】（費用）→P/L、製品保証引当金（負債）→B/S。将来の修理費用を当期に先取りして費用計上する。',
  '法人税・住民税及び事業税': '法人税・法人住民税・法人事業税の合計額を計上する税金科目を【　　　　　　】という。\n例）当期純利益1,000万円に対する税金：法人税200万円・住民税50万円・事業税50万円＝合計300万円：（借）【　　　】300万円 ／（貸）仮払法人税等120万円・未払法人税等180万円。\nポイント：「法人税等」よりも正式な科目名（損益計算書の表示科目名）。3種類の税金を合算して1行で表示。',
  '火災損失': '火災等の偶発的事故で固定資産等が損失した場合に計上する費用科目を【　　　　　　】という。\n例）帳簿価額500万円の建物が火災で焼失（保険未加入）：（借）【　　　】500万円 ／（貸）建物500万円（帳簿価額全額が損失）。保険金600万円確定の場合は未決算を経由。\nポイント：【　　　】は特別損失（P/Lの下の方）として計上。自然災害・事故による固定資産の損失に使用。',
  '固定資産除却損': '固定資産を廃棄・除却した際に生じる損失を計上する費用科目を【　　　　　　】という。\n例）帳簿価額30万円（取得100万円－累計70万円）の備品を廃棄し処分費1万円支払：（借）【　　　】31万円・減価償却累計額70万円 ／（貸）備品100万円・現金1万円（処分費）。\nポイント：除却＝廃棄・廃棄処分すること。帳簿価額＋処分費が除却損。売却時は「固定資産売却損」。',
  '固定資産廃棄損': '固定資産を廃棄処分した際の帳簿価額（未償却残高）相当の損失を計上する費用科目を【　　　　　　】という。\n例）耐用年数経過後の機械（帳簿価額10万円残存）を廃棄：（借）【　　　】10万円・減価償却累計額 ／（貸）機械装置。\nポイント：除却損・廃棄損はほぼ同義で使われる。廃棄時に残っている帳簿価額が損失。',
  '工事原価': '建設業で完成・引渡した工事にかかった費用の合計を計上する原価科目を【　　　　　　】という。\n例）完成引渡しした工事の材料費1,500万円＋労務費1,000万円＋外注費1,200万円＝【　　　】3,700万円：（借）【　　　】3,700万円 ／（貸）材料・賃金・外注費等3,700万円。工事収益5,000万円から差引→完成工事総利益1,300万円。\nポイント：建設業の「売上原価」相当科目。工事収益と対応させて完成工事総利益を計算。',
  '売上': '商品・製品の販売による主たる営業収益を計上する科目を【　　　　　　】という。\n例）商品400万円を現金で販売：（借）現金400万円 ／（貸）【　　　】400万円。5万円返品：（借）【　　　】5万円 ／（貸）現金5万円。【　　　】400万円－【　　　】原価280万円＝【　　　】総利益120万円。\nポイント：返品・値引きは【　　　】の減少として処理。',
  '受取家賃': '不動産等を貸し付けて受け取る賃料収入を計上する収益科目を【　　　　　　】という。\n例）テナント物件を月10万円で賃貸：（借）現金10万円 ／（貸）【　　　】10万円。前受け分は前受収益（負債）へ繰延べ。\nポイント：本業なら売上、副業的賃貸なら営業外収益。支払家賃（費用）の逆側。',
  '受取手数料': '仲介・代理等のサービス提供の対価として受け取る手数料収入を計上する科目を【　　　　　　】という。\n例）不動産仲介で30万円の手数料受取：（借）現金30万円 ／（貸）【　　　】30万円。\nポイント：本業の手数料収入→売上（または【　　　】）。副業的なら営業外収益。支払手数料（費用）の逆側。',
  '受取利息': '貸付金・預金等で受け取る利息収入を計上する営業外収益科目を【　　　　　　】という。\n例）貸付金1,000万円・年利2%→年間利息20万円：（借）普通預金20万円 ／（貸）【　　　】20万円。期末未収2か月分3.3万円：（借）未収利息3.3万円 ／（貸）【　　　】3.3万円。\nポイント：普通預金利息もすべて【　　　】。支払利息（費用）の逆側。',
  '固定資産売却益': '固定資産の売却で帳簿価額を超えた部分を計上する収益科目を【　　　　　　】という。\n例）帳簿価額80万円（取得200万円－累計120万円）の機械を100万円で売却：（借）現金100万円・減価償却累計額120万円 ／（貸）機械200万円・【　　　】20万円。\nポイント：売却価格＞帳簿価額→【　　　】（収益）。売却価格＜帳簿価額→固定資産売却損（費用）。',
  '受取配当金': '保有株式から受け取る配当金収入を計上する営業外収益科目を【　　　　　　】という。\n例）保有株式100株・配当1株50円：（借）普通預金5,000円 ／（貸）【　　　】5,000円。\nポイント：株式投資の配当収入→【　　　】。債券の利息→有価証券利息または受取利息。',
  '償却債権取立益': '過去に貸倒処理した債権を後日一部でも回収した際に計上する収益科目を【　　　　　　】という。\n例）2年前に貸倒損失処理した売掛金10万円のうち3万円が回収：（借）現金3万円 ／（貸）【　　　】3万円。\nポイント：一度費用（損失）処理して帳簿から消した債権が回収された→収益認識。通常の売掛金回収とは異なる科目。',
  '雑益': '偶発的・少額で他の科目に当てはまらない収益を計上する営業外収益科目を【　　　　　　】という。\n例）帳簿より現金が2,000円多く原因不明→期末：（借）現金過不足2,000円 ／（貸）【　　　】2,000円。不用品売却200円→【　　　】。\nポイント：現金過不足（超過）が期末まで不明→【　　　】へ。雑損（費用）の逆側。',
  '有価証券売却益': '有価証券を帳簿価額より高く売却した際の差額を計上する収益科目を【　　　　　　】という。\n例）帳簿価額1,000円の売買目的株式を1,200円で売却：（借）現金1,200円 ／（貸）売買目的有価証券1,000円・【　　　】200円。\nポイント：実際に売った時点で確定する売却益。評価益（まだ売っていない段階の評価）とは異なる。',
  '有価証券評価益': '売買目的有価証券の期末時価が帳簿価額を上回った評価差額を計上する収益科目を【　　　　　　】という。\n例）売買目的株式（帳簿価額1,000円）が期末時価1,200円：（借）売買目的有価証券200円 ／（貸）【　　　】200円（P/L）。\nポイント：売買目的有価証券のみ評価差額をP/Lへ計上（評価益→収益）。その他有価証券の評価差額→純資産（P/L経由しない）。',
  '有価証券利息': '社債・国債等の利付債券を保有して受け取る利息収入を計上する収益科目を【　　　　　　】という。\n例）社債（額面100万円・年利1.5%）保有→年間利息1.5万円：（借）普通預金1.5万円 ／（貸）【　　　】1.5万円。\nポイント：株式配当→受取配当金、債券利息→【　　　】（または受取利息）。',
  '工事収益': '建設・工事請負業において工事の進捗度または完成引渡し時点に応じて認識する収益科目を【　　　　　　】という。\n例）総請負価格1億円・2年間の工事。1年目の進捗度40% → 【　　　】4,000万円を計上。2年目完成・引渡し → 残り6,000万円を計上。仕訳）1年目：（借）工事未収入金4,000万円 ／（貸）【　　　】4,000万円。同時に（借）工事原価XX万円 ／（貸）仕掛品XX万円（原価も進捗度按分）。\nポイント：収益認識基準では原則「進捗度基準（一定期間にわたる充足）」を採用。進捗度に応じて毎期収益を計上する。完成基準（工事完成引渡し時に一括計上）との違いを押さえる。',
  '資本金': '株主からの出資額のうち登記上の資本として計上する純資産科目を【　　　　　　】という。\n例）創業時に株主から1,000万円払込み、500万円を【　　　】に登記・500万円を資本準備金：（借）別段預金1,000万円 ／（貸）【　　　】500万円・資本準備金500万円。\nポイント：払込額の2分の1以上を【　　　】に計上する義務（残りは資本準備金可）。【　　　】は容易に減少させられない（会社の信用基盤）。',
  '繰越利益剰余金': '当期純利益の累計から配当・積立等を差引いた純資産の蓄積残高を計上する科目を【　　　　　　】という。\n例）期末純利益100万円→（借）損益100万円 ／（貸）【　　　】100万円。配当80万円・利益準備金8万円決議：（借）【　　　】88万円 ／（貸）未払配当金80万円・利益準備金8万円。\nポイント：「稼いだ利益の蓄積」から配当等を差引いた残高。配当の原資。',
  '利益準備金': '配当時に会社法の規定に基づき強制積立する法定準備金を計上する純資産科目を【　　　　　　】という。\n例）資本金1,000万円・配当100万円決議→最低10万円（100万円×1/10）の積立義務（資本準備金と合計が250万円になるまで）：（借）繰越利益剰余金10万円 ／（貸）【　　　】10万円。\nポイント：資本金の1/4に達するまで配当のたびに配当額の1/10以上を強制積立（法定準備金）。任意積立金（別途積立金等）とは区別する。',
  '資本準備金': '株式発行時の払込額のうち資本金に計上しなかった部分を積立する法定準備金科目を【　　　　　　】という。\n例）増資で払込1,000万円・500万円を資本金・500万円を【　　　】：（借）当座預金1,000万円 ／（貸）資本金500万円・【　　　】500万円。\nポイント：株式発行時の払込のうち資本金にしなかった部分が【　　　】（法定準備金）。利益準備金（利益から積立）とは異なる（資本取引から生じる）。',
  '別途積立金': '株主総会の決議により任意に積み立てる利益剰余金の一部を計上する科目を【　　　　　　】という。\n例）株主総会決議で当期利益の一部50万円を将来の設備投資に備えて積立：（借）繰越利益剰余金50万円 ／（貸）【　　　】50万円。後日取崩し：（借）【　　　】50万円 ／（貸）繰越利益剰余金50万円。\nポイント：【　　　】は任意積立金（株主総会の決議で自由に積立・取崩し可能）。利益準備金・資本準備金（法定準備金）とは異なる。',
  'その他資本剰余金': '資本取引から生じた資本準備金以外の剰余金を計上する純資産科目を【　　　　　　】という。\n例）自己株式を帳簿価額より高く売却した場合の差益→【　　　】（収益にしない）：（借）現金130万円 ／（貸）自己株式100万円・【　　　】30万円。\nポイント：資本取引（株式の発行・自己株式等）から生じた剰余金で資本準備金以外のもの。利益剰余金（繰越利益剰余金等）とは別の純資産区分。',
  '自己株式': '発行済株式のうち会社が買い戻して保有している自社株で純資産のマイナス項目として計上される科目を【　　　　　　】という。\n例）自社株100万円分を買い戻し。仕訳①取得：（借）【　　　】100万円 ／（貸）現金100万円（純資産がマイナスになる）。仕訳②消却（株式を消す）：（借）その他資本剰余金100万円 ／（貸）【　　　】100万円（資本が正式に減少）。仕訳③再売却（120万円で売却）：（借）現金120万円 ／（貸）【　　　】100万円＋その他資本剰余金20万円（差益は資本剰余金）。\nポイント：【　　　】は「純資産のマイナス」→資産ではない。再売却時の差益は「利益ではなく資本剰余金」。消却時の差損は「その他資本剰余金から控除」。',
  '新株予約権': '一定の行使価格で会社の新株を取得できる権利で行使時に資本金が増加し失効時には利益として計上される純資産の項目を【　　　　　　】という。\n例）ストック・オプション：従業員に「1株1,000円で100株買える権利」を付与→【　　　】10万円を純資産計上。仕訳①付与時（費用計上）：（借）株式報酬費用10万円 ／（貸）【　　　】10万円。仕訳②行使時（株価2,000円）：（借）現金10万円（行使価格）＋【　　　】10万円 ／（貸）資本金10万円＋資本準備金10万円（払込金額の1/2ずつ）。仕訳③失効時（権利消滅）：（借）【　　　】10万円 ／（貸）【　　　】戻入益10万円（P/L収益）。\nポイント：【　　　】は純資産。行使→資本金・資本準備金増加。失効→収益（【　　　】戻入益）。',
  'その他有価証券評価差額金': 'その他有価証券の期末時価評価差額を損益計算書を経由せず純資産に直接計上する科目を【　　　　　　】という。\n例）その他有価証券（取得原価100万円）が期末時価130万円に上昇。税率30%。仕訳）（借）投資有価証券30万円 ／（貸）繰延税金負債9万円・【　　　】21万円（評価差額30万円から税効果9万円を除いた21万円が純資産へ）。\nポイント：評価差額30万円がそのまま純資産に行くのではなく「評価差額－税効果＝純資産計上額」。試験では税率30%での計算問題が必出。評価損の場合は逆（純資産が減る）。P/Lを経由せず純資産に直接計上する点が特徴。',
  '貸倒引当金': '債権の回収懸念に備えてB/S上の売掛金等から控除表示される評価勘定科目を【　　　　　　】という。\n例）売掛金1,000万円×貸倒実績率2%＝20万円の引当金設定：（借）【　　　】繰入20万円 ／（貸）【　　　】20万円。B/S表示：売掛金1,000万円－【　　　】20万円＝980万円（純額表示）。\nポイント：引当金は「負側（評価勘定）」として売掛金から控除表示。引当金≠損失確定（見積もり）。',
  '減価償却累計額': '間接法における固定資産の累計償却額を計上し帳簿価額を表示させる評価勘定科目を【　　　　　　】という。\n例）建物1,000万円（間接法・10年経過で500万円償却済み）→B/S：建物1,000万円－【　　　】500万円＝帳簿価額500万円。\nポイント：間接法では固定資産を直接減額せず、この評価勘定で累計を管理。帳簿価額＝取得原価－【　　　】。',
  '損益': '決算振替仕訳で収益・費用を集計し当期純利益を繰越利益剰余金へ振り替える勘定科目を【　　　　　　】という。\n例）決算振替仕訳：全収益勘定→【　　　】（貸方）へ振替、全費用勘定→【　　　】（借方）へ振替。【　　　】勘定の貸方超過＝当期純利益→（借）【　　　】 ／（貸）繰越利益剰余金。\nポイント：【　　　】勘定は「一時的な集計口座」。期末の決算振替で使用し、次期に繰り越さない（残高ゼロに戻す）。',
  '建物減価償却累計額': '間接法で建物の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）建物1,000万円（20年・定額法）：毎年50万円の累計額積上げ。B/Sで「建物1,000万円、減価償却累計額500万円、帳簿価額500万円」と表示。\nポイント：間接法では「【　　　】」「備品減価償却累計額」のように資産ごとに分けて管理する場合と「減価償却累計額」で一本化する場合がある。',
  '備品減価償却累計額': '間接法で備品の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）備品20万円（4年・定額法）：毎年5万円の累計額積上げ。B/Sで「備品20万円、【　　　】5万円、帳簿価額15万円」と表示。\nポイント：備品専用の減価償却累計額勘定。廃棄・売却時に残高を全額取崩す。',
  '車両運搬具減価償却累計額': '間接法で車両運搬具の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）営業車200万円（5年・定額法）：毎年40万円の累計額。3年後の帳簿価額＝200万円－120万円（累計）＝80万円。\nポイント：車両売却時に「車両200万円・【　　　】120万円」を両方取崩し、売却価格との差で売却損益を計算。',
  '機械装置減価償却累計額': '間接法で機械装置の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）機械3,000万円（10年・定額法）：毎年300万円の累計額。工業簿記でも登場する。\nポイント：機械装置は製造業・工業簿記で重要。間接法では【　　　】を使う。',
  '構築物減価償却累計額': '間接法で構築物の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）アスファルト舗装500万円（15年・定額法）：毎年33万円の累計額。\nポイント：構築物（建物以外の土地上の工作物）専用の累計額勘定。',
  '工具器具備品減価償却累計額': '間接法で工具器具備品の累計償却額を管理する評価勘定科目を【　　　　　　】という。\n例）精密測定器30万円（3年・定額法）：毎年10万円の累計額。工業簿記でも製造現場の工具等で登場。\nポイント：工具器具備品専用の累計額勘定。工場で使う工具・測定器等が主な対象。',
  '契約資産': '収益認識基準において履行義務を完了したが代金の受取権が条件付きである場合に計上する資産を【　　　　　　】という。\n例）スマホ本体（10万円）＋1年保守サービス（4万円）のセット14万円を現金で受取。本体を引渡した時点では保守サービスはまだ完了していない。仕訳）本体引渡時：（借）現金14万円 ／（貸）【　　　】10万円（本体分）＋契約負債4万円（保守分の前受け）。保守完了時：（借）契約負債4万円 ／（貸）役務収益4万円。\nポイント：【　　　】vs売掛金の違い→売掛金は「代金請求権が無条件に確立している」資産。【　　　】は「他の条件（別の履行義務の充足等）が残っている」状態の資産。',
  '特許権': '無形固定資産として取得した特許権を計上し毎期直接法で償却する科目を【　　　　　　】という。\n例）【　　　】を500万円で取得（権利期間10年・定額法）：（借）【　　　】500万円 ／（貸）現金500万円。毎年50万円を償却：（借）【　　　】償却50万円 ／（貸）【　　　】50万円（直接法）。\nポイント：無形固定資産→累計額勘定を使わず直接法で償却。【　　　】は法的有効期間（20年）以内で償却。',
  'ソフトウェア仮勘定': 'ソフトウェア完成前の開発支出を一時計上する資産科目を【　　　　　　】という。\n例）自社開発ソフトウェアの開発途中の支出500万円：（借）【　　　】500万円 ／（貸）現金500万円（開発中は仮勘定）。完成後：（借）ソフトウェア500万円 ／（貸）【　　　】500万円（本勘定へ振替）。\nポイント：建設仮勘定（有形固定資産の建設中）と同じ発想。完成前は减価償却しない。',
  '開業費': '会社の営業開始前に要した広告・研修等の準備費用を計上する繰延資産科目を【　　　　　　】という。\n例）開業準備期間の広告費・従業員研修費等の合計60万円：（借）【　　　】60万円 ／（貸）現金60万円。5年以内に均等償却：毎年（借）【　　　】償却12万円 ／（貸）【　　　】12万円。\nポイント：繰延資産の1つ。創立費（設立時のみ）と区別する。開業後も任意に一括費用処理も可。',
  '支店': '本支店会計で本店側が支店との取引を記録する内部勘定科目を【　　　　　　】という。\n例）本【　　　】会計で本店から【　　　】へ商品100万円を送付：本店側→（借）【　　　】100万円 ／（貸）仕入（または商品）100万円。合算時に「【　　　】」勘定と【　　　】の「本店」勘定を相殺消去。\nポイント：本【　　　】会計では本店と【　　　】が独立した帳簿を持つ。「【　　　】」勘定（本店の帳簿）と「本店」勘定（【　　　】の帳簿）が鏡の関係。',
  '本店': '本支店会計で支店側が本店との取引を記録する内部勘定科目を【　　　　　　】という。\n例）支店の帳簿で、【　　　】から商品100万円を受取：（借）仕入（または商品）100万円 ／（貸）【　　　】100万円。合算時に「【　　　】」勘定と【　　　】の「支店」勘定を相殺消去。\nポイント：「【　　　】」勘定は支店の帳簿にだけ登場。【　　　】の「支店」勘定と合算時に相殺。残高は常に一致しているはず（不一致なら未達取引等を確認）。',
  '返金負債': '返品権付き販売において返品が見込まれる金額を収益から控除して負債に計上する科目を【　　　　　　】という。\n例）書店へ100万円の本を納品。過去実績から10%（10万円）が返品見込み。仕訳）納品時：（借）売掛金100万円 ／（貸）売上90万円（返品分10万円は収益計上しない）＋【　　　】10万円（負債：返品時に返金が必要な義務）。実際に10万円分返品：（借）【　　　】10万円 ／（貸）売掛金10万円。\nポイント：返品が予想される場合は「予想返品分だけ収益を減らして【　　　】を計上」する。これが収益認識基準の「変動対価の考え方」の具体的な処理。',
  '契約負債': '収益認識基準で顧客から対価を受け取ったが履行義務が未充足の場合に計上する負債科目を【　　　　　　】という。\n例）前払いで受け取ったサービス料30万円（まだサービス未提供）：（借）現金30万円 ／（貸）【　　　】30万円。サービス提供後：（借）【　　　】30万円 ／（貸）役務収益30万円。\nポイント：収益認識基準での前受収益の取扱い。「収益認識基準に基づく前受け」→【　　　】。前受収益との使い分けに注意（基準適用有無で異なる）。',
  '賞与引当金': '夏・冬の賞与の支給見込み額のうち当期に対応する部分を費用計上する引当金を【　　　　　　】という。\n例）3月決算・7月支給予定の夏季賞与600万円のうち10〜3月（当期）分300万円を引当計上。仕訳）決算時：（借）【　　　】繰入300万円（費用）／（貸）【　　　】300万円（負債）。7月支給時：（借）【　　　】300万円（引当金取崩し）＋賞与300万円（翌期4〜6月分：翌期費用）／（貸）現金600万円。\nポイント：「支払時に全額費用計上」では費用収益対応の原則に反する。引当金で「働いた期間に費用を先取り」することで期間損益が適正化される。',
  '役務収益': 'サービス業・IT業等で役務（サービス）の提供が完了した時点または提供期間にわたって認識する収益科目を【　　　　　　】という。\n例）システム開発の請負契約（総額1,000万円・6か月プロジェクト）。進捗度50%の時点で【　　　】500万円を計上。仕訳）【　　　】の計上：（借）契約資産（または売掛金）500万円 ／（貸）【　　　】500万円。完了時：（借）売掛金1,000万円 ／（貸）【　　　】500万円（残り）＋契約資産500万円（解消）。\nポイント：【　　　】は「サービスの提供にともなう収益」。一時点で完了する役務（修理等）→完了時点で収益認識。一定期間にわたる役務（保守・コンサル等）→期間按分で収益認識。',
  '為替差益': '外貨建て取引においてレートの変動により円換算額が増加したことで生じる収益科目を【　　　　　　】という。\n例）1ドル100円で輸出し売掛金1万ドル（100万円）を計上。決算時1ドル108円。仕訳）決算時換算替え：（借）売掛金8万円 ／（貸）【　　　】8万円（円安→外貨建て資産の価値増加）。決済時に1ドル110円なら：（借）現金110万円 ／（貸）売掛金108万円・【　　　】2万円。\nポイント：外貨建て債権（売掛金・貸付金等）は円安になると【　　　】。外貨建て債務（買掛金・借入金等）は円高になると【　　　】。「自分にとって得になる方向の動き」で差益が発生。',
  '為替差損': '外貨建て取引においてレートの変動により円換算額が減少したことで生じる費用科目を【　　　　　　】という。\n例）1ドル100円で輸入し買掛金1万ドル（100万円）を計上。決算時1ドル110円（円安）。仕訳）決算時換算替え：（借）【　　　】10万円 ／（貸）買掛金10万円（円安→外貨建て負債の負担増）。決済時に1ドル112円なら：（借）買掛金110万円・【　　　】2万円 ／（貸）現金112万円（追加損失）。\nポイント：輸出企業→円高で損失・円安で利益。輸入企業→円安で損失・円高で利益。「取引時レートvs決算時（または決済時）レートの差×外貨金額」で計算。',
  '保険差益': '火災等の損害が生じた固定資産に対して受け取った保険金が帳簿価額を上回る場合に生じる差益を【　　　　　　】という。\n例）帳簿価額500万円の建物が火災で全焼。保険金800万円受取。仕訳）保険金受取時：（借）現金800万円 ／（貸）建物500万円（資産消滅）＋【　　　】300万円（収益）。圧縮記帳する場合：取得した代替資産の帳簿価額から300万円を圧縮→当期課税を回避。\nポイント：「焼失資産の帳簿価額＞保険金」→火災損失（費用）。「帳簿価額＜保険金」→【　　　】（収益）。【　　　】には圧縮記帳が使えることを覚えておく。',
  '負のれん発生益': '企業買収時に支払った対価が純資産時価を下回る場合（割安買収）に発生する利益を【　　　　　　】という。\n例）B社の純資産時価1億円の会社を8,000万円で買収（2,000万円割安）。仕訳）買収時：差額（借）諸資産（純資産時価按分）2,000万円 ／（貸）【　　　】2,000万円（一括収益認識）。\nポイント：のれん（正）→20年以内に均等償却（毎期費用）。負のれん→発生時に即座に全額収益計上（毎期の費用化なし）。正と負で会計処理が真逆になる点が試験頻出。',
  '国庫補助金受贈益': '国・地方公共団体から固定資産取得目的で交付される補助金を受け取った際に計上する収益科目を【　　　　　　】という。\n例）省エネ設備導入のために国から2,000万円の補助金を受け取り。仕訳）補助金受取時：（借）現金2,000万円 ／（貸）【　　　】2,000万円（収益）。同時に設備取得・圧縮記帳：（借）固定資産圧縮損2,000万円 ／（貸）機械2,000万円（圧縮処理）→補助金収益2,000万円と圧縮損2,000万円が相殺されて当期は実質ゼロ課税。\nポイント：受贈益だけ計上して圧縮記帳しなければその年に2,000万円が課税対象になる。圧縮記帳することで課税を将来に繰り延べる。',
  '工事負担金受贈益': '工事施工に際して相手方から受け取る工事費負担金を収益計上する科目を【　　　　　　】という。\n例）電気・ガス会社が工事費負担として顧客から受取：（借）現金100万円 ／（貸）【　　　】100万円。圧縮記帳で課税繰延べ可能。\nポイント：国庫補助金受贈益と同様の処理。インフラ整備費用の一部を受益者（顧客）が負担する形で受取る収益。',
  '固定資産圧縮損': '受贈益に対する課税を繰り延べるために取得した固定資産の帳簿価額を直接減額する際に計上する損失科目を【　　　　　　】という。\n例）国から補助金3,000万円を受け取り→国庫補助金受贈益3,000万円（収益）計上。同時に5,000万円の機械を取得。圧縮記帳：機械を5,000万円→2,000万円に圧縮。仕訳）圧縮時：（借）【　　　】3,000万円 ／（貸）機械3,000万円（帳簿価額を直接減額）。効果：受贈益3,000万円と圧縮損3,000万円が相殺→当期の課税所得に含まれない。\nポイント：圧縮記帳は「課税の免除」ではなく「課税の繰延べ」。将来の減価償却が少なくなり将来の課税所得が増える仕組み。',
  '法人税等調整額': '税効果会計の適用により法人税等を会計上の利益に対応する適正額に調整する科目を【　　　　　　】という。\n例）会計上の税引前利益1,000万円・一時差異（貸倒引当金超過）200万円、税率30%。課税所得1,200万円→実際納税額360万円。繰延税金資産60万円（200万円×30%）を計上。損益計算書：法人税等360万円 ／ 【　　　】△60万円（控除）＝実効税負担300万円（1,000万円×30%）。\nポイント：【　　　】は「税金費用の修正項目」。繰延税金資産増加時→調整額がマイナス（税金減）。繰延税金負債増加時→調整額がプラス（税金増）。「調整後の法人税等＝税引前利益×実効税率」になることを確認すること。',
  '役務原価': '製造業の「売上原価」に相当するサービス提供にかかったコストを【　　　　　　】という。\n例）システム開発プロジェクトで投入した人件費200万円・外注費100万円・ソフトウェアライセンス費50万円 → 【　　　】350万円。損益計算書：役務収益1,000万円－【　　　】350万円＝サービスグロスマージン650万円。\nポイント：役務収益と【　　　】は対応させて計上（費用収益対応の原則）。役務収益を進捗度で按分した場合、【　　　】も同じ進捗度で按分するのが原則。',
  '賞与引当金繰入': '賞与の当期負担分を期末に見積もり計上する際の費用科目を【　　　　　　】という。\n例）6月支給予定賞与200万円の当期対応分（4〜12月：9か月分）150万円を計上：（借）【　　　】150万円 ／（貸）賞与引当金150万円。\nポイント：【　　　】（費用）→P/L。賞与引当金（負債）→B/S。「賞与支給見込みを当期費用に配分」するための科目。',
  '賞与': '従業員への賞与・ボーナスを費用として計上する科目を【　　　　　　】という。\n例）6月に従業員に夏季【　　　】200万円を支払い（引当金150万円計上済み）：（借）【　　　】引当金150万円・【　　　】50万円 ／（貸）現金200万円（手取り前、源泉税・社保控除後）。\nポイント：【　　　】引当金で先取りした分→引当金を取崩し。超過分→【　　　】（費用）で追加計上。',
  '支払リース料': 'オペレーティングリース取引で支払うリース料を費用計上する科目を【　　　　　　】という。\n例）オペレーティングリース契約のコピー機（月3万円）：（借）【　　　】3万円 ／（貸）現金3万円（毎月）。資産・負債は計上しない（オフバランス）。\nポイント：オペレーティングリース→費用計上のみ（【　　　】）。ファイナンスリース→資産・負債計上＋減価償却（リース資産・リース債務）。この違いが頻出。',
  '特許権償却': '特許権の帳簿価額を毎期直接法で費用化する際に計上する償却費用科目を【　　　　　　】という。\n例）特許権500万円（10年・直接法）：毎年（借）【　　　】50万円 ／（貸）特許権50万円（直接帳簿価額を減額）。\nポイント：無形固定資産の償却→直接法（累計額勘定なし）。有形固定資産の減価償却→直接法または間接法（累計額勘定を使える）。',
  '創立費償却': '創立費（繰延資産）を毎期均等に費用化する際に計上する償却費用科目を【　　　　　　】という。\n例）創立費50万円（5年均等）：毎年（借）【　　　】10万円 ／（貸）創立費10万円（直接法）。\nポイント：繰延資産は直接法のみ（累計額勘定なし）。任意償却可能（毎期の金額を任意に設定できる）だが最大5年内に完了。',

  '開業費償却': '開業費（繰延資産）を毎期費用化する際に計上する償却費用科目を【　　　　　　】という。\n例）開業費60万円（5年均等）：毎年（借）【　　　】12万円 ／（貸）開業費12万円。\nポイント：繰延資産は直接法のみ。任意償却可能（一括償却も可）。',
  'ソフトウェア償却': 'ソフトウェア（無形固定資産）を毎期直接法で費用化する際に計上する償却費用科目を【　　　　　　】という。\n例）業務管理ソフトウェア600万円（5年・定額法）：毎年（借）【　　　】120万円 ／（貸）ソフトウェア120万円（直接法）。\nポイント：ソフトウェアは無形固定資産→直接法で償却（累計額勘定なし）。「【　　　】」「ソフトウェア仮勘定」の2つのソフト系科目を区別する。',
