<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>要件事実ポーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-column card table — お題, 言い分, all fact cards, action bar, 添削, and the player's own block diagram. Single deliberate look: 紺の卓 + 象牙のカード. */
:root{
  --table:#16233b; --table-2:#1e2f4d; --line:#34496d;
  --ivory:#f5efe0; --ink:#1f1b16; --gold:#d4ad5c;
  --text:#e9e4d6; --muted:#a3adc0;
  --ok-bg:#e3f1e8; --ng-bg:#f8e4e0; --warn-bg:#f7ecd6;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--table);color:var(--text)}
body{font-family:var(--sans);font-size:15px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-family:var(--serif);font-size:1.6rem;margin:0;letter-spacing:.06em;text-wrap:balance}
h1 small{display:block;font-family:var(--sans);font-size:.72rem;color:var(--muted);letter-spacing:.08em;font-weight:400}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:1.35rem;color:var(--gold);line-height:1.1}
.stat span{font-size:.7rem;color:var(--muted);letter-spacing:.1em}

.odai{background:var(--table-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.7rem;letter-spacing:.14em;color:var(--gold)}
.odai h2{font-family:var(--serif);font-size:1.2rem;margin:0}
.claim{font-size:.85rem;color:var(--muted)}
.claim b{color:var(--text);font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:.8rem;color:var(--muted);margin-top:2px}
.flow span.on{color:var(--gold);font-weight:700}
.flow span.done{color:var(--text)}
.map{margin-top:10px}
.map svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto;font-family:var(--sans)}
.map .pty rect{fill:var(--ivory)}
.map .pty .id{fill:var(--ink);font-size:20px;font-weight:700;font-family:var(--serif)}
.map .pty .rl{fill:#6b604c;font-size:10px}
.map .rel line{stroke:var(--text);stroke-width:1.4}
.map .rel .t{fill:var(--text);font-size:11.5px}
.map .rel .sb{fill:var(--muted);font-size:10px}
.map .suit line{stroke:var(--gold);stroke-width:3}
.map .suit .t{fill:var(--gold);font-size:12px;font-weight:700}
.map .ah{fill:var(--text)} .map .ah.g{fill:var(--gold)}
.say{margin:6px 0 0;font-size:.92rem;border-top:1px solid var(--line);padding-top:8px}
.say b{color:var(--gold);font-weight:700}
.say .line{margin:2px 0 0;font-size:1.02rem;line-height:1.75}
.say .note{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
.say .prev{color:var(--muted);font-size:.84rem;margin-top:6px}

.howto{font-size:1rem;font-weight:700;margin:0}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.card{position:relative;text-align:left;font:inherit;cursor:pointer;background:var(--ivory);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:14px 12px 12px;min-height:150px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s ease,border-color .15s ease}
.card .no{font-size:.66rem;letter-spacing:.12em;color:#7b6f58}
.card .tx{font-family:var(--serif);font-size:.92rem;line-height:1.6}
.card:hover:not(:disabled){transform:translateY(-2px)}
.card[aria-pressed="true"]{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.card[aria-pressed="true"]::after{content:"選択";position:absolute;top:8px;right:10px;font-size:.66rem;background:var(--gold);color:var(--ink);border-radius:999px;padding:1px 8px;font-weight:700}
.card:disabled{cursor:default}
.card:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--table-2);color:var(--text)}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.meta{font-size:.8rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

.result{background:var(--ivory);color:var(--ink);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.verdict h3{font-family:var(--serif);font-size:1.3rem;margin:0}
.delta{font-weight:700;font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 10px;font-size:.9rem}
.delta.plus{background:var(--ok-bg);color:#24603f}
.delta.minus{background:var(--ng-bg);color:#8f2e22}
.delta.zero{background:var(--warn-bg);color:#7a5414}
.result p{margin:0}
.yaku{border-left:3px solid var(--gold);padding-left:12px;font-size:.9rem}
.yaku b{font-family:var(--serif)}
.result .src{font-size:.78rem;color:#6b604c}
.review{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.review li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-radius:8px;background:#fffaf0;border:1px solid #e3d9c2}
.review .tag{grid-row:span 2;align-self:start;font-size:.7rem;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap}
.tag.req{background:var(--ok-bg);color:#24603f}
.tag.dum{background:#ece6d6;color:#5d5442}
.review .ft{font-family:var(--serif);font-size:.9rem;min-width:0}
.review .ex{font-size:.82rem;color:#4b4436;min-width:0}
.mark{font-size:.72rem;font-weight:700;margin-left:6px}
.mark.good{color:#24603f}.mark.bad{color:#a0362a}.mark.miss{color:#8a6414}

.bd{background:var(--table-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bd h3{margin:0;font-size:.85rem;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--gold);letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bd h3 span{color:var(--muted);letter-spacing:0;font-weight:400}
.blk{display:grid;grid-template-columns:4.2em minmax(0,1fr);border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk .ab{font-family:var(--serif);font-weight:700;color:var(--gold);text-align:center;padding:10px 0;border-right:1px solid var(--line);font-size:1.05rem}
.blk .ab small{display:block;font-family:var(--sans);font-weight:400;font-size:.66rem;color:var(--muted)}
.blk ol{margin:0;padding:10px 12px 10px 2.2em;font-size:.86rem;display:flex;flex-direction:column;gap:4px}
.blk ol li b{color:var(--text)}
.blk ol li span{display:block;font-family:var(--serif);color:var(--muted);font-size:.8rem;line-height:1.5}
.blk .nm{padding:10px 12px 0;font-weight:700;font-size:.88rem;color:var(--text)}
.now{font-size:.88rem}
.now b{color:var(--gold)}
.blk .empty{padding:12px;color:var(--muted);font-size:.82rem}
.blk .st{padding:0 12px 8px 2.2em;font-size:.75rem;color:var(--gold)}

.final{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px 16px;background:var(--table-2);border:1px solid var(--line);border-radius:12px}
.final b{font-size:2.4rem;color:var(--gold);font-variant-numeric:tabular-nums}
footer{font-size:.74rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
@media (max-width:480px){.hand{grid-template-columns:1fr 1fr}.card{min-height:130px}.meta{margin-left:0;width:100%}}
</style>
</head>
<body>


<style>
/* 目次 */
.toc{display:flex;flex-direction:column;gap:18px}
.toc .lead{margin:0;font-size:.88rem;color:var(--muted)}
.theme{background:var(--table-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.theme h2{margin:0;padding:10px 14px;font-family:var(--serif);font-size:1.05rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.theme h2 span{font-family:var(--sans);font-size:.75rem;color:var(--muted);font-weight:400}
.qlist{list-style:none;margin:0;padding:0}
.qlist li+li{border-top:1px solid var(--line)}
.qbtn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:10px 14px}
.qbtn:hover{background:rgba(212,173,92,.08)}
.qbtn:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.qbtn .no{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.qbtn .tt{font-weight:700;min-width:0}
.qbtn .fl{grid-column:2;font-size:.76rem;color:var(--muted)}
.qbtn .ck{grid-row:1;grid-column:3;font-size:.72rem;color:var(--gold);font-weight:700}
.back{all:unset;cursor:pointer;color:var(--gold);font-size:.85rem;font-weight:700;align-self:flex-start}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.say .aside{margin:4px 0 0;font-size:.82rem;color:var(--muted)}
.result .note{font-size:.8rem;color:#6b604c}
.map .bot line{stroke:var(--text);stroke-width:1.3}
.map .bot .t{fill:var(--text);font-size:11px;paint-order:stroke;stroke:var(--table-2);stroke-width:4px;stroke-linejoin:round}
footer p{margin:0 0 4px}
.rk{display:inline-block;min-width:1.6em;text-align:center;font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.rk.A{background:var(--gold);color:var(--ink)}
.rk.B{background:#8fa3c4;color:var(--ink)}
.rk.C{background:transparent;color:var(--muted);border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters span{font-size:.8rem;color:var(--muted)}
.fbtn{font:inherit;font-size:.82rem;font-weight:700;border-radius:999px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--table-2);color:var(--text)}
.fbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.fbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.legend{font-size:.78rem;color:var(--muted);margin:0}
</style>

<div class="wrap">
  <header>
    <h1>要件事実ポーカー</h1>
    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="score">0</b><span>点数</span></div>
      <div class="stat"><b id="stage">Kg</b><span>段階</span></div>
    </div>
  </header>

  <section class="toc" id="toc"></section>

  <div id="game" hidden style="display:flex;flex-direction:column;gap:18px">
    <button class="back" id="btnBack" type="button">← 目次</button>
    <section class="odai" id="odai" aria-live="polite"></section>
    <section id="table">
      <p class="howto" id="howto"></p>
      <div class="hand" id="hand"></div>
    </section>
    <div class="actions" id="actions">
      <button class="btn primary" id="btnPlay" type="button">選んだカードで主張する</button>
      <button class="btn" id="btnReveal" type="button" hidden>解答を表示</button>
      <span class="meta" id="meta"></span>
    </div>
    <section id="result" hidden></section>
    <section class="bd" id="bd" aria-label="ブロック・ダイアグラム"></section>
  </div>

  <footer>
    <p>参考文献：司法研修所編『新問題研究 要件事実』、司法研修所編『4訂 紛争類型別の要件事実』</p>
    <p>事案はすべて学習用に作成したものです。認否は扱っていません。</p>
  </footer>
</div>

<script>
/* ---- 問題データ ----
   theme: {theme, qs:[question]}
   question: {id, title, claim, map, end, stages}
   map: {X, Y, others:[{id, rl, pos:"L"|"C"|"R", s}], suit, rels:[{s, a, b, t, sb}]}
   stage: {abbr, kind, side, emo, say, aside, name, chain, yaku, note, cards}
   card: {t, k, ok, ex} */
const THEMES = [];
const addQs = (theme, qs) => { let t = THEMES.find(x=>x.theme===theme); if (!t){ t = {theme, qs:[]}; THEMES.push(t); } t.qs.push(...qs); };
THEMES.push({theme:"売買代金請求", qs:[
{
  id:"b1", rk:"A", title:"履行期限の抗弁", claim:"売買契約に基づく代金支払請求権",
  map:{X:"原告・売主", Y:"被告・買主", suit:"代金30万円の支払請求",
    rels:[{s:0,a:"X",b:"Y",t:"売買（R6.9.1）",sb:"甲時計・代金30万円"},
          {s:1,a:"Y",b:"X",t:"支払期日の合意？",sb:"R7.3.31"}]},
  end:"期限の到来に対して、被告がさらに主張できる事実はない。",
  stages:[
  { abbr:"Kg", kind:"請求原因", side:"原告X", emo:"😡",
    say:"令和6年9月1日に、Yに甲時計を30万円で売ったんです！なのに、いつまでたっても払ってくれない！",
    name:"売買代金請求", chain:"売買契約の締結",
    yaku:"売買契約の締結だけで代金支払請求権が発生する。", note:"冒頭規定説による",
    cards:[
      {t:"原告は、被告に対し、令和6年9月1日、甲時計を代金30万円で売った。",k:"売買契約の締結",ok:true,ex:"目的物と代金額の合意。これで足りる。"},
      {t:"原告と被告は、上記売買契約の際、代金支払期日を令和6年9月30日と定めた。",k:"履行期限の合意",ex:"期限は契約の付款で、請求原因に不要。"},
      {t:"原告は、被告に対し、同日、甲時計を引き渡した。",k:"目的物の引渡し",ex:"代金請求の要件ではない。"},
      {t:"被告は、原告に対し、代金を支払っていない。",k:"代金の不払",ex:"支払ったことは被告が弁済の抗弁で主張する。"},
      {t:"原告は、令和6年9月1日当時、甲時計を所有していた。",k:"売主の所有",ex:"他人の物の売買も有効（民法561条）。"}
    ]},
  { abbr:"E", kind:"抗弁", side:"被告Y", emo:"😤",
    say:"はぁぁぁ！？？もう払えって！？買ったのは間違いないけど、代金は令和7年3月31日に払う約束でしたよね！",
    name:"履行期限の抗弁", chain:"履行期限の合意",
    yaku:"期限の合意を主張すれば足り、まだ到来していないことまで言う必要はない。",
    cards:[
      {t:"原告と被告は、上記売買契約の際、代金支払期日を令和7年3月31日とするとの合意をした。",k:"履行期限の合意",ok:true,ex:"期限によって利益を受ける被告が主張する。"},
      {t:"令和7年3月31日は、まだ到来していない。",k:"期限の未到来",ex:"不要。到来したことを原告が再抗弁で主張する。"},
      {t:"被告は、原告に対し、代金30万円を支払った。",k:"弁済",ex:"別の抗弁で、Yの言い分にない。"},
      {t:"被告は、甲時計の代金の工面に困っている。",k:"被告の事情",ex:"不要。"}
    ]},
  { abbr:"R", kind:"再抗弁", side:"原告X", emo:"🙄",
    say:"3月31日って…その日なら、もうとっくに過ぎてるじゃないですか！",
    name:"期限の到来", chain:"期限の到来",
    yaku:"確定期限の到来は顕著な事実。",
    cards:[
      {t:"令和7年3月31日は到来した。",k:"期限の到来",ok:true,ex:"これで期限の抗弁は効力を失う。"},
      {t:"原告は、被告に対し、令和7年4月1日、代金の支払を催告した。",k:"催告",ex:"確定期限なら到来だけで足りる。"},
      {t:"原告と被告は、代金支払期日を令和6年9月30日と定めた。",k:"別の期日の合意",ex:"被告の主張する期日を争う主張（否認）で、再抗弁ではない。"},
      {t:"被告は、令和7年3月31日を過ぎても支払わなかった。",k:"不払",ex:"不要。"}
    ]}
  ]
},
{
  id:"b2", rk:"A", title:"同時履行の抗弁", claim:"売買契約に基づく代金支払請求権",
  map:{X:"原告・売主", Y:"被告・買主", suit:"代金500万円の支払請求",
    rels:[{s:0,a:"X",b:"Y",t:"売買（R6.4.1）",sb:"甲機械・代金500万円"},
          {s:1,a:"Y",b:"X",t:"支払拒絶",sb:"引渡しを受けるまで"},
          {s:2,a:"X",b:"Y",t:"引渡し（R6.4.10）",sb:"甲機械"}]},
  end:"反対給付の履行に対して、被告がさらに主張できる事実はない。",
  stages:[
  { abbr:"Kg", kind:"請求原因", side:"原告X", emo:"😡",
    say:"令和6年4月1日に、Yに甲機械を500万円で売ったんです！なのに代金を全然払ってくれない！もう我慢の限界ですよ！！",
    name:"売買代金請求", chain:"売買契約の締結",
    yaku:"売買契約の締結だけで代金支払請求権が発生する。", note:"冒頭規定説による",
    cards:[
      {t:"原告は、被告に対し、令和6年4月1日、甲機械を代金500万円で売った。",k:"売買契約の締結",ok:true,ex:"これで足りる。"},
      {t:"原告は、被告に対し、令和6年4月10日、甲機械を引き渡した。",k:"目的物の引渡し",ex:"請求原因には不要。同時履行の抗弁が出たときの再抗弁になる。"},
      {t:"原告と被告は、甲機械の売買契約書を作成した。",k:"契約書の作成",ex:"売買は諾成契約。書面は要らない。"},
      {t:"被告は、原告に対し、代金を支払っていない。",k:"代金の不払",ex:"支払ったことは被告が弁済の抗弁で主張する。"},
      {t:"原告は、被告に対し、令和6年6月10日、代金の支払を催告した。",k:"催告",ex:"履行請求に事前の催告は要らない。"}
    ]},
  { abbr:"E", kind:"抗弁", side:"被告Y", emo:"😤",
    say:"はぁぁぁ！？？払えって、機械も来てないのに！？買ったのは確かです。でも、機械を引き渡してもらうまで、代金は払いませんよ！",
    name:"同時履行の抗弁", chain:"同時履行の抗弁権の権利主張",
    yaku:"権利抗弁なので、権利を行使する旨の主張が必要。双務契約であることは請求原因に現れている。",
    cards:[
      {t:"被告は、原告が甲機械を引き渡すまで、代金の支払を拒絶する。",k:"権利主張",ok:true,ex:"同時履行の抗弁権（民法533条）の行使。"},
      {t:"原告は、被告に対し、甲機械を引き渡していない。",k:"反対給付の不履行",ex:"不要。履行したことを原告が再抗弁で主張する。"},
      {t:"原告と被告は、引渡しと代金支払を同時に行うと合意した。",k:"同時履行の合意",ex:"不要。双務契約なら当然に同時履行の関係に立つ。"},
      {t:"被告は、原告に対し、甲機械の引渡しを催告した。",k:"引渡しの催告",ex:"不要。"}

}
function startStage(){
  S.deck = shuffle(ST().cards.map((c,i)=>({...c,id:i})));
  S.sel = new Set(); S.tries = 0; S.done = false;
  $("result").hidden = true; $("result").innerHTML = "";
  $("actions").hidden = false; $("btnReveal").hidden = true;
  render();
}
function render(){
  const q = Q(), st = ST();
  $("score").textContent = S.score;
  $("stage").textContent = st.abbr;
  const prev = q.stages.slice(0,S.s).map(x=>`<div>${x.side} ${x.emo}「${esc(x.say)}」</div>`).join("");
  $("odai").innerHTML = `<span class="eyebrow">${esc(q.theme)}　第${q.no}問</span><h2><span class="rk ${q.rk}">${q.rk}</span>${esc(q.title)}</h2>
    <div class="claim">訴訟物：<b>${esc(q.claim)}</b></div>
    <div class="map">${mapSVG(q.map, S.s)}</div>
    <div class="say"><b>${st.side} ${st.emo}</b><p class="line">「${esc(st.say)}」</p>${st.aside?`<p class="aside">※${esc(st.aside)}</p>`:""}${prev?`<div class="prev">${prev}</div>`:""}</div>`;
  $("howto").textContent = `「${st.name}」に必要なカードは？`;
  const h = $("hand"); h.innerHTML = "";
  S.deck.forEach((c,i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "card"; b.disabled = S.done;
    b.setAttribute("aria-pressed", S.sel.has(c.id));
    b.innerHTML = `<span class="no">FACT ${i+1}</span><span class="tx">${esc(c.t)}</span>`;
    b.onclick = ()=>{ S.sel.has(c.id) ? S.sel.delete(c.id) : S.sel.add(c.id); render(); };
    h.appendChild(b);
  });
  const n = S.sel.size;
  $("btnPlay").disabled = S.done || !n;
  $("btnPlay").textContent = n ? `選んだ${n}枚で主張する` : "選んだカードで主張する";
  $("meta").textContent = S.tries ? `誤答 ${S.tries}回` : "";
  renderBD();
}
function renderBD(){
  const q = Q();
  const rows = q.stages.map((st,i)=>{
    const L = S.log[i];
    const body = L
      ? `<ol>${L.ids.map(id=>st.cards[id]).map(c=>`<li><b>${esc(c.k)}</b><span>${esc(c.t)}</span></li>`).join("")}</ol><div class="st">${L.how}</div>`
      : `<div class="empty">—</div>`;
    return `<div class="blk"><div class="ab">${st.abbr}<small>${st.kind}</small></div><div><div class="nm">${esc(st.name)}</div>${body}</div></div>`;
  }).join("");
  $("bd").innerHTML = `<h3>ブロック・ダイアグラム<span>${esc(q.title)}</span></h3>${rows}`;
}

$("btnBack").onclick = showToc;
$("btnPlay").onclick = ()=>{
  const st = ST();
  const req = st.cards.map((c,i)=>i).filter(i=>st.cards[i].ok);
  const picked = [...S.sel];
  const missing = req.filter(i=>!S.sel.has(i)).length;
  const extra = picked.filter(i=>!st.cards[i].ok);
  if (!missing && !extra.length){ closeStage("ok", base(st)); return; }
  // 誤答：選んだカードだけを添削し、足りないカードは明かさない
  S.tries++; S.score -= MISS;
  const items = picked.map(i=>st.cards[i]).sort((a,b)=>(b.ok?1:0)-(a.ok?1:0)).map(c=>`<li>
      <span class="tag ${c.ok?"req":"dum"}">${c.ok?"要件事実":"不要"}</span>
      <span class="ft">【${esc(c.k)}】${c.ok?'<span class="mark good">○</span>':'<span class="mark bad">× 不要</span>'}</span>
      <span class="ex">${c.ok?"要件事実です。":esc(c.ex)}</span></li>`).join("");
  const msg = [missing?`要件事実があと${missing}つ不足しています。`:"", extra.length?`要件事実でない事実を${extra.length}つ選んでいます。`:""].join("");
  $("result").innerHTML = `<div class="result">
      <div class="verdict"><h3>${missing ? (st.abbr==="Kg" ? "主張自体失当" : "要件事実の不足") : "不要な事実の主張"}</h3><span class="delta minus">−${MISS}点</span></div>
      <p>${msg}選び直してください。</p>
      <ul class="review">${items}</ul></div>`;
  $("result").hidden = false; $("btnReveal").hidden = false;
  render();
};
$("btnReveal").onclick = ()=>{
  S.sel = new Set(ST().cards.map((c,i)=>i).filter(i=>ST().cards[i].ok));
  closeStage("reveal", 0);
};
function nextQ(){ for (let i=S.qi+1;i<QS.length;i++) if (shown(QS[i])) return i; return -1; }
function closeStage(how, delta){
  const q = Q(), st = ST();
  S.score += delta; S.done = true;
  S.log[S.s] = {ids:[...S.sel], how: how==="ok" ? (S.tries ? `正解（誤答${S.tries}回）` : "正解") : "解答を表示"};
  $("actions").hidden = true;
  render();
  const items = st.cards.slice().sort((a,b)=>(b.ok?1:0)-(a.ok?1:0)).map(c=>`<li>
      <span class="tag ${c.ok?"req":"dum"}">${c.ok?"要件事実":"不要"}</span>
      <span class="ft">【${esc(c.k)}】${esc(c.t)}</span>
      <span class="ex">${esc(c.ex)}</span></li>`).join("");
  const lastStage = S.s === q.stages.length-1;
  if (lastStage) store.set(q.id);
  const next = q.stages[S.s+1];
  const btns = !lastStage
    ? `<button class="btn primary" id="btnNext" type="button">次へ：${next.abbr} ${next.kind}「${esc(next.name)}」（${next.side.slice(0,2)}）</button>`
    : (nextQ() >= 0 ? `<button class="btn primary" id="btnNextQ" type="button">次の問題へ</button>` : "") + `<button class="btn" id="btnToc" type="button">目次へ</button>`;
  $("result").innerHTML = `<div class="result">
      <div class="verdict"><h3>${how==="ok"?"正解":"解答"}：${esc(st.name)}</h3><span class="delta ${delta>0?"plus":"zero"}">+${delta}点</span></div>
      <p class="yaku"><b>要件事実：${esc(st.chain)}</b>${st.yaku?`<br>${esc(st.yaku)}`:""}</p>
      ${st.note?`<p class="note">※${esc(st.note)}</p>`:""}
      ${lastStage && q.end?`<p class="yaku"><b>以後の主張</b><br>${esc(q.end)}</p>`:""}
      <ul class="review">${items}</ul>
      <div class="actions">${btns}</div></div>`;
  $("result").hidden = false;
  if ($("btnNext")) $("btnNext").onclick = ()=>{ S.s++; startStage(); window.scrollTo({top:0}); };
  if ($("btnNextQ")) $("btnNextQ").onclick = ()=>startQuestion(nextQ());
  if ($("btnToc")) $("btnToc").onclick = ()=>{ showToc(); window.scrollTo({top:0}); };
  const f = $("btnNext") || $("btnNextQ") || $("btnToc"); f.focus({preventScroll:true});
}

/* ---- 関係図 ----
   上段：左に原告X、右に被告Y。X・Y間は訴え（金色の太矢印）と法律関係を上から並べる。
   下段：第三者（A・Bなど）。言い分に出てきた段階で表示する。 */
function mapSVG(m, stage){
  const W = 340, BW = 84, XL = 6, YL = W-6-BW, A1 = XL+BW+4, A2 = YL-4, RH = 46, mid = (A1+A2)/2;
  const top = new Set(["X","Y"]);
  const rels = m.rels.filter(r=>r.s <= stage);
  const xy = rels.filter(r=>top.has(r.a) && top.has(r.b));
  const lows = (m.others||[]).filter(o=>(o.s||0) <= stage);
  const boxH = Math.max((xy.length+1)*RH, 64);
  const lowY = boxH + 58, LH = 44;
  const H = lows.length ? lowY + LH + 6 : boxH + 8;
  const PX = {L:XL+BW/2, C:W/2, R:YL+BW/2};
  const P = {X:{x0:XL,x1:XL+BW,y0:0,y1:boxH}, Y:{x0:YL,x1:YL+BW,y0:0,y1:boxH}};
  lows.forEach(o=>{ const cx = PX[o.pos||"C"]; P[o.id] = {x0:cx-BW/2+4, x1:cx+BW/2-4, y0:lowY, y1:lowY+LH}; });
  const cx = id => (P[id].x0+P[id].x1)/2;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  let g = `<defs>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="ah g" d="M0,0L10,5L0,10z"/></marker></defs>`;
  const box = (p, id, rl, big) => `<g class="pty"><rect x="${p.x0}" y="${p.y0}" width="${p.x1-p.x0}" height="${p.y1-p.y0}" rx="6"/>
    <text class="id" x="${(p.x0+p.x1)/2}" y="${(p.y0+p.y1)/2+(big?2:-1)}" text-anchor="middle"${big?"":' style="font-size:16px"'}>${id}</text>
    <text class="rl" x="${(p.x0+p.x1)/2}" y="${(p.y0+p.y1)/2+(big?17:13)}" text-anchor="middle">${esc(rl)}</text></g>`;
  g += box(P.X,"X",m.X,true) + box(P.Y,"Y",m.Y,true);
  const hline = (y, dir, cls) => { const [a,b] = dir==="YX" ? [A2,A1] : [A1,A2];
    return `<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" marker-end="url(#${cls==="suit"?"mg":"mt"})"/>`; };
  g += `<g class="suit"><text class="t" x="${mid}" y="${RH/2-6}" text-anchor="middle">${esc(m.suit)}</text>${hline(RH/2+4,"XY","suit")}</g>`;
  xy.forEach((r,i)=>{ const y = (i+1)*RH + RH/2;
    g += `<g class="rel"><text class="t" x="${mid}" y="${y-6}" text-anchor="middle">${esc(r.t)}</text>${hline(y, r.a==="Y"?"YX":"XY")}
      ${r.sb?`<text class="sb" x="${mid}" y="${y+14}" text-anchor="middle">${esc(r.sb)}</text>`:""}</g>`; });
  rels.filter(r=>!(top.has(r.a) && top.has(r.b))).forEach(r=>{
    if (!P[r.a] || !P[r.b]) return;
    const a = P[r.a], b = P[r.b];
    let x1,y1,x2,y2,lx,ly,anc="middle";
    if (a.y0 === b.y0){ // 下段どうし
      const l = a.x0 < b.x0; x1 = l?a.x1:a.x0; x2 = l?b.x0:b.x1; y1 = y2 = a.y0+LH/2; lx=(x1+x2)/2; ly=y1-6;
    } else {
      const up = a.y0 > b.y0, T = up?b:a, Bt = up?a:b;
      const tx = clamp(cx(up?r.a:r.b) , T.x0+12, T.x1-12), bx = clamp(cx(up?r.b:r.a), Bt.x0+12, Bt.x1-12);
      const ty = T.y1+2, by = Bt.y0-2;
      [x1,y1,x2,y2] = up ? [bx,by,tx,ty] : [tx,ty,bx,by];
      lx = (x1+x2)/2; ly = (y1+y2)/2+4;
      if (Math.abs(x1-x2) < 4){ const left = lx > W/2; lx += left?-6:6; anc = left?"end":"start"; }
    }
    g += `<g class="bot"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#mt)"/>
      <text class="t" x="${lx}" y="${ly}" text-anchor="${anc}">${esc(r.t)}</text></g>`;
  });
  lows.forEach(o=>{ g += box(P[o.id], o.id, o.rl, false); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="事案の関係図">${g}</svg>`;
}

showToc();
</script>

</body>
</html>
